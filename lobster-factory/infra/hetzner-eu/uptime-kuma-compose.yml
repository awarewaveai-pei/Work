# Uptime Kuma — migrated from EU 2026-08-28. EU ran host-network :3001; on ks that
# port belongs to lobster-node-api, so kuma is bridge-networked on 127.0.0.1:3005
# (nginx vhost uptime.aware-wave.com proxies to it). mem = EU parity 512m.
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    mem_limit: 512m
    ports: ["127.0.0.1:3005:3001"]
    volumes: ["uptime-kuma:/app/data"]
    memswap_limit: 512m
    pids_limit: 256
    init: true
    healthcheck:
      test: ["CMD-SHELL", "timeout 25 extra/healthcheck"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 180s
volumes:
  uptime-kuma:
    external: true

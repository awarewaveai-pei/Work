# Deploy: sudo cp soulful-cache.conf /etc/nginx/conf.d/soulful-cache.conf
#   (http-context half. Without it the vhost fails `nginx -t` with
#    "soulful_cache" zone not found, and on a fresh boot nginx REFUSES TO START.)
# Micro-cache for soulfulexpression.org — http-context half.
#
# WHY THIS EXISTS
# The live Hostinger host runs LiteSpeed, whose page cache answers in ~0.3ms WITHOUT
# invoking PHP. On nginx+Apache that cache is completely inert: the site's .htaccess
# LSCACHE rules sit inside <IfModule LiteSpeed> blocks that never match here. Measured
# on-box 2026-08-27 — live 0.0003s vs this host 0.36s — and Cloudflare answers
# `cf-cache-status: DYNAMIC` for HTML, so it does NOT absorb the difference. A Redis
# object cache was added first and moved TTFB only 0.36s -> 0.31s, because the cost is
# PHP execution, not database queries. This is the layer that actually closes the gap.
#
# 60 SECONDS, DELIBERATELY
# This is a STORE. A long TTL would serve stale prices and stale stock. 60s absorbs the
# repeat-traffic burst that matters while keeping every change visible within a minute.
# The correctness rules live in the vhost ($skip_cache); this file only allocates space.
#
# Set-Cookie IS NOT IGNORED, ON PURPOSE
# nginx refuses to cache an upstream response carrying Set-Cookie unless told otherwise.
# `proxy_ignore_headers Set-Cookie` appears in most blog tutorials and would, on a
# WooCommerce site, let one visitor's session cookie be stored in a shared cache entry
# and handed to the next visitor. It is deliberately absent, and must stay absent.
proxy_cache_path /var/cache/nginx/soulful
    levels=1:2
    keys_zone=soulful_cache:32m
    max_size=1g
    inactive=10m
    use_temp_path=off;

# Access-log format for the vhost: "combined" first (promtail's nginx job and any awk reader keep
# working), then rt= total seconds, urt= upstream (PHP) seconds, cs= cache status. Without these a
# 30-second page could not be told apart from a 30-millisecond one (2026-09-24).
log_format soulful_timed '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time '
                         'cs=$upstream_cache_status';

# proxy_cache_key is deliberately NOT set here. It belongs in the one location that
# actually caches (see soulfulexpression.org.conf), because an http-context key becomes
# the default for every vhost this host ever gains -- and this box is the consolidation
# target for Chatwoot and the 11/20 EU/SG migration. A cookie-less key inherited by a
# session-based app is exactly the kind of thing nobody would think to look for.

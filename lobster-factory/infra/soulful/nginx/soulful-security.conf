# soulfulexpression.org — nginx security layer for ks-aw-01
#
# Adapted from lobster-factory/infra/hetzner-phase1-core/nginx/aware-wave-security.conf,
# which carries the SG incident history (2026-05-22 scanner flood, 502/OOM playbook).
# The rate-limit design there is deliberate and is reproduced unchanged: wp-admin gets
# its own generous bucket because admin pages legitimately burst dozens of asset/REST
# requests, while wp-login stays strict at 5r/m.
#
# Cloudflare ranges below were fetched LIVE from https://api.cloudflare.com/client/v4/ips
# on 2026-08-27 (etag 38f79d050aa027e3be3865e495dcc9bc), not copied from the SG file — that copy is dated
# 2026-05-13 and Cloudflare adds ranges. A stale list here does not fail loudly: it
# silently logs Cloudflare's edge IP instead of the visitor's, which then poisons
# fail2ban (banning Cloudflare) and every access-log-based alarm.
# Refresh with scripts/refresh-cf-origin-ips.ps1 (monthly check already exists).

limit_req_zone  $binary_remote_addr zone=sf_public:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=sf_login:10m  rate=5r/m;
limit_req_zone  $binary_remote_addr zone=sf_admin:10m  rate=120r/s;
limit_conn_zone $binary_remote_addr zone=sf_conn:10m;

limit_conn sf_conn 50;

# Throttling is not a server failure. 429 keeps scanner bursts out of 5xx alarms;
# only genuine upstream failures (502/504) stay 5xx. Same rationale as the SG file.
limit_conn_status 429;
limit_req_status  429;

# Restore the real visitor IP from Cloudflare before logging or fail2ban sees it.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header    CF-Connecting-IP;
real_ip_recursive on;

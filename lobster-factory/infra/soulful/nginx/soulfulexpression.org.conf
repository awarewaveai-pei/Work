# soulfulexpression.org — vhost on ks-aw-01
#
# Traffic path after cutover:
#   visitor -> Cloudflare (proxied 🟠) -> this nginx :443 -> soulful-wp container :8081
#
# The container is bound to 127.0.0.1:8081 and is not reachable from outside the box;
# this file is the only public entrance.

server {
    listen 80;
    listen [::]:80;
    server_name soulfulexpression.org www.soulfulexpression.org;
    # CF-edge-only guard (2026-08-28 consolidation review F1): geo map lives in
    # /etc/nginx/conf.d/cf-edge-geo.conf, snippet in /etc/nginx/snippets/cf-only.conf.
    include /etc/nginx/snippets/cf-only.conf;

    # ACME http-01 is not used (certbot runs dns-01), but leaving this open costs
    # nothing and avoids a surprise if anyone ever falls back to webroot renewal.
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.24 (Ubuntu 24.04) still takes http2 as a `listen` parameter. The separate
    # `http2 on;` directive only exists from 1.25.1, and on 1.24 it is not merely
    # ignored — it is a hard config error. Verified with `nginx -t` before any reload.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name soulfulexpression.org www.soulfulexpression.org;
    # CF-edge-only guard (2026-08-28 consolidation review F1): geo map lives in
    # /etc/nginx/conf.d/cf-edge-geo.conf, snippet in /etc/nginx/snippets/cf-only.conf.
    include /etc/nginx/snippets/cf-only.conf;

    ssl_certificate     /etc/letsencrypt/live/soulfulexpression.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soulfulexpression.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # OCSP stapling is deliberately NOT enabled: Let's Encrypt stopped including an
    # OCSP responder URL in its certificates in 2025, so the directives are a no-op
    # that only emits a warning on every `nginx -t` and reload. A warning that always
    # fires is a warning nobody reads.

    # This certificate is a publicly-trusted Let's Encrypt cert (dns-01), not a
    # Cloudflare Origin CA cert, specifically so the zone can run SSL mode
    # "Full (strict)" — under plain "full" Cloudflare accepts any certificate at all,
    # including a self-signed one on a wrong origin, and a misdirected cutover would
    # succeed silently.

    include /etc/nginx/snippets/scanner-block.inc;

    # ---------------------------------------------------------------------------------
    # CACHE BYPASS RULES. These are the correctness half of the micro-cache; the cache
    # key deliberately contains no cookie, so entries are SHARED between visitors and any
    # request that could render something visitor-specific must set $skip_cache=1 here.
    #
    # This is a WooCommerce store. Getting this wrong does not make the site slow, it
    # hands one customer another customer's cart or account page.
    #
    # TWO THINGS HERE ARE DELIBERATE AND WERE BOTH WRONG IN THE FIRST VERSION:
    #
    # 1. MATCH ON $uri, NOT $request_uri. $request_uri is the RAW client string;
    #    `location` matching and the request sent upstream both use $uri, which nginx has
    #    already normalized (%XX decoded, `.`/`..` resolved, duplicate slashes merged).
    #    So `//cart/` did not match a ^/cart regex on $request_uri, yet reached the real
    #    cart page and was CACHED. Measured on this host 2026-08-27:
    #        /cart/  -> HTTP 200 BYPASS      //cart/ -> HTTP 200 MISS   (i.e. stored)
    #
    # 2. COOKIES ARE AN ALLOW-LIST, NOT A DENY-LIST. A deny-list of names can only ever
    #    cover the cookies someone thought of, on a site with ~50 plugins. Worse, the
    #    Set-Cookie store-guard does NOT cover the common case: it fires only on the
    #    request that ISSUES a cookie. A visitor who ALREADY holds a personalising cookie
    #    sends no Set-Cookie, so their rendering is fully cacheable and gets served to
    #    strangers. Only requests whose cookies are ALL known-inert are cacheable now;
    #    anything unrecognised bypasses. Hit rate drops for returning visitors, and
    #    correctness stops depending on anyone maintaining a list.
    # ---------------------------------------------------------------------------------
    set $skip_cache 0;

    # Not a plain read.
    if ($request_method !~ ^(GET|HEAD)$) { set $skip_cache 1; }

    # Any query string at all. Over-broad on purpose: add-to-cart, wc-ajax, search,
    # nonces, preview and tracking parameters all arrive this way, and enumerating them
    # means being wrong the first time a plugin invents a new one.
    if ($query_string != "") { set $skip_cache 1; }

    # Per-visitor by definition, or never safe to share. Matched on the NORMALIZED path.
    if ($uri ~* "^/(cart|checkout|my-account|wc-api|wp-json|wp-admin|wp-login|wp-cron)") { set $skip_cache 1; }
    if ($uri ~* "(/feed/|sitemap.*\.xml)") { set $skip_cache 1; }

    # Cookie ALLOW-LIST: no cookies at all, or only analytics/CDN cookies that cannot
    # personalise a server-rendered page. Everything else -> bypass.
    set $sf_cookie_ok 0;
    if ($http_cookie = "") { set $sf_cookie_ok 1; }
    if ($http_cookie ~* "^(?:\s*(?:_ga[^=]*|_gid|_gat[^=]*|_fbp|_fbc|_gcl_au|cf_clearance|__cf_bm|_clck|_clsk|wordpress_test_cookie)=[^;]*;?\s*)+$") { set $sf_cookie_ok 1; }
    if ($sf_cookie_ok = 0) { set $skip_cache 1; }

    # Uploads: the live site runs PHP upload_max_filesize/post_max_size at 1536M.
    # nginx defaults to 1M and would reject large media with 413 before PHP ever
    # sees it, which looks like a WordPress bug rather than a proxy limit.
    client_max_body_size 1536M;

    # WooCommerce checkout and Ultimate Member profile saves can be slow; the live
    # PHP has max_execution_time=0 (unlimited), so a short proxy timeout here would
    # reintroduce a limit that does not exist on the current host.
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 30s;

    access_log /var/log/nginx/soulful-access.log soulful_timed;   # format: soulful-cache.conf
    error_log  /var/log/nginx/soulful-error.log;

    set $upstream http://127.0.0.1:8081;

    location = /wp-login.php {
        limit_req zone=sf_login burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/soulful-proxy.inc;
    }

    # xmlrpc.php is a standing brute-force and pingback-amplification surface and the
    # PHP build deliberately omits the xmlrpc extension. Refuse it here too so the
    # request never reaches PHP.
    # 444 and LOGGED, matching scanner-block.inc's model: xmlrpc probes are scanner
    # traffic, and a silent 403 with access_log off removed them from the probe-trend
    # visibility that snippet exists to provide. `=` still beats the snippet's regexes,
    # so this stays the effective rule; it now behaves consistently with them.
    location = /xmlrpc.php { return 444; }

    # DISABLE_WP_CRON is set, so the only scheduler is the host's wp-cron-runner.sh (WP-CLI inside the
    # container). A web hit here would start a second, concurrent cron run -- the retired Hostinger copy
    # of this site kept doing exactly that from 2a02:4780::/32 after cutover (2026-09-24).
    location = /wp-cron.php { return 403; }

    location ^~ /wp-admin/ {
        limit_req zone=sf_admin burst=200 nodelay;
        include /etc/nginx/snippets/soulful-proxy.inc;
    }

    location / {
        limit_req zone=sf_public burst=60 nodelay;

        # Only this location caches. The wp-login and wp-admin blocks above carry no
        # cache directives at all, so they cannot be cached even if a bypass rule were
        # somehow wrong -- defence in depth rather than one regex standing alone.
        proxy_cache soulful_cache;
        # Declared HERE, not in the http context: this box is the consolidation target for
        # Chatwoot and the EU/SG migration, and an http-level key would silently become the
        # default for every future vhost -- a cookie-less key on a session-based app.
        # $uri (normalized), not $request_uri: see the bypass rules above. No
        # $request_method: proxy_cache_convert_head is on by default, so including it only
        # splits HEAD and GET into separate namespaces and makes `curl -I` verification
        # prove nothing about the entries real browsers use.
        proxy_cache_key "$scheme$host$uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 301 302 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_bypass $skip_cache;   # do not SERVE from cache
        proxy_no_cache     $skip_cache;   # do not STORE into cache
        # One request refreshes an expired entry while the rest keep the stale copy,
        # instead of a thundering herd all executing PHP at once.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        # An EXPIRED entry is answered from the stale copy at once while one background subrequest
        # re-renders it; without this the first visitor after each 60s expiry waited for full PHP
        # (1-2s normally, the whole stall when PHP is stuck). Needs `use_stale updating` below.
        proxy_cache_background_update on;
        # C4: `updating` ONLY. The first version also listed error/timeout/http_5xx, which
        # means a DEAD backend (OOM, PHP fatal after a plugin update, DB down) keeps being
        # answered from cache with HTTP 200 indefinitely -- while /cart/ and /checkout/ are
        # BYPASS and so return 502 to real customers at the moment of payment. Every public
        # monitor would report the store healthy through a total inability to take money.
        # That is the "detector went quiet wearing a healthy costume" pattern AGENTS.md
        # forbids, and it would have been newly introduced here.
        proxy_cache_use_stale updating;
        # HIT / MISS / BYPASS / EXPIRED, visible to curl. This is what makes the bypass
        # rules testable instead of merely asserted.
        #
        # M9 LANDMINE, written down so the hardening pass does not trip on it: nginx
        # add_header directives are inherited from server/http level ONLY IF the current
        # level declares none. This location declares one (below), so any future
        # server-level `add_header Strict-Transport-Security ...` will be SILENTLY
        # dropped from the entire public site while still appearing on /wp-admin/.
        # When adding security headers, put them in a snippet included at EVERY location,
        # or re-declare them here alongside this one. (Today the site's X-Frame-Options
        # etc. come from WordPress via proxy passthrough, which this rule does not touch;
        # HSTS is deliberately NOT set while rollback still points at Hostinger, whose
        # certificate expires 2026-10-25 -- a long max-age would turn rollback into a
        # browser-enforced hard failure.)
        add_header X-Soulful-Cache $upstream_cache_status always;

        include /etc/nginx/snippets/soulful-proxy.inc;
    }
}

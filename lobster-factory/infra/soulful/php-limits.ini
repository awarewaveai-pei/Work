; soulfulexpression.org PHP limits — reproduced from the LIVE Hostinger runtime.
;
; These values exist in NO backup artifact. They are set in Hostinger's control panel;
; the site has neither .user.ini nor php.ini (verified 2026-08-27: both "No such file").
; When the Hostinger plan lapses on 2026-11-12 the panel goes with it, so this file and
; tenants/company-soulful-expression/core/LIVE_RUNTIME_BASELINE_20260827.md are the only
; copies that will still exist.
;
; Do NOT substitute apps/wordpress/php-upload-limits.ini (64M/64M/256M, no max_input_vars).
; max_input_vars in particular is load-bearing: with 39 active plugins including Ultimate
; Member's eight add-ons, settings forms post far more than the PHP default of 1000 fields,
; and exceeding it truncates the POST SILENTLY — the page saves, the extra settings are
; simply gone, with no error anywhere.

memory_limit        = 1536M
upload_max_filesize = 1536M
post_max_size       = 1536M
max_input_vars      = 5000
max_execution_time  = 0
max_file_uploads    = 20
date.timezone       = UTC
; PHP advisory 2026-10-23: apply before request parsing (CVE-2026-115560).
session.upload_progress.enabled = 0

# mpm_prefork sized to the container memory limit (docker-compose.yml soulful-wp); scripts/check-compose-invariants.py I5
# checks MaxRequestWorkers x worker_rss_mb + base_mb <= that limit. Image default 150 workers: 156 OOM kills by 2026-10-24.
# worker_rss_mb measured 2026-10-24 (205-237 MB); base_mb = Apache parent + one request at PHP memory_limit 1536M.
# worker_rss_mb: 250
# base_mb: 2000
<IfModule mpm_prefork_module>
	StartServers			3
	MinSpareServers			2
	MaxSpareServers			6
	MaxRequestWorkers		16
	MaxConnectionsPerChild	1000
</IfModule>

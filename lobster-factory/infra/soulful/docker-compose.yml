# soulfulexpression.org on ks-aw-01 (OVH KS-6, 145.239.195.47)
#
# Migration target for the 2026-11-12 Hostinger deadline. Built from the verified
# backup at /root/soulful-source/<stamp>/ — see BACKUP_RESTORE_PROOF.md.
#
# NAMES ARE A CONTRACT, NOT A PREFERENCE:
#   container `soulful-db`             ← backup-ks-aw-01.sh:93  require_container
#   volume    `soulful_wordpress_data` ← backup-ks-aw-01.sh:109 require_volume
# Those two are already deployed and critic-reviewed on this host. Renaming either here
# makes the nightly backup ERROR and abort BEFORE its R2 upload — taking Chatwoot's
# backup down with it, since one script covers both. If a rename is ever genuinely
# needed, change /etc/default/ks-aw-01-backup's SOULFUL_* overrides in the same commit.
#
# A bind mount would break the same contract (`docker volume inspect` finds nothing),
# which is why the WordPress root is a named volume rather than /srv/sites/<slug>/.

x-soulful-logging: &soulful-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  soulful-db:
    init: true
    # Pinned to the exact version running live (MariaDB 11.8.8-log, verified 2026-08-27).
    # Not `11` or `11.8` — a silent minor bump under a site with WooCommerce HPOS tables
    # is not a risk worth taking during a migration.
    image: mariadb:11.8.8
    container_name: soulful-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${SOULFUL_DB_NAME:-soulful}
      MARIADB_USER: ${SOULFUL_DB_USER:-soulful}
      MARIADB_PASSWORD: ${SOULFUL_DB_PASSWORD:?SOULFUL_DB_PASSWORD not set}
      MARIADB_ROOT_PASSWORD: ${SOULFUL_DB_ROOT_PASSWORD:?SOULFUL_DB_ROOT_PASSWORD not set}
      # The live site runs DB_CHARSET='utf8' (NOT utf8mb4) with an empty DB_COLLATE.
      # Copied verbatim on purpose: "fixing" it to utf8mb4 re-maps existing byte
      # sequences and corrupts stored content.
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=256M
      - --innodb-buffer-pool-size=2G
    volumes:
      - soulful_db_data:/var/lib/mysql
    # No ports: stanza at all — the database is reachable only over the internal
    # network. Publishing it even on 127.0.0.1 is unnecessary here and every published
    # DB port is one config slip away from the 2026-04-20 crypto-miner incident.
    healthcheck:
      test: ["CMD", "timeout", "4", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [soulful-net]
    memswap_limit: 6G
    deploy:
      resources:
        limits:
          memory: 6G
          pids: 512
    logging: *soulful-logging

  soulful-redis:
    init: true
    # Object cache backend. Pinned to the exact patch running at pin time (7.4.11,
    # verified on the host 2026-08-27) for the same reason soulful-db is: a silent minor
    # bump under a live store is not a risk worth taking during a migration.
    #
    # WHY THIS EXISTS: the live Hostinger site is served by LiteSpeed, whose built-in
    # page cache answers in ~0.3ms WITHOUT invoking PHP. On nginx+Apache that cache is
    # completely inert (its .htaccess directives sit in <IfModule LiteSpeed> blocks that
    # never match), so every request here executes PHP end to end. Measured on-box
    # 2026-08-27: live 0.0003s vs this host 0.36s, and Cloudflare returns
    # `cf-cache-status: DYNAMIC` for HTML -- i.e. it does NOT absorb the difference.
    image: redis:7.4.11-alpine
    container_name: soulful-redis
    restart: unless-stopped
    # An object cache is a CACHE: losing it must degrade performance, never correctness.
    # No persistence is configured on purpose, and allkeys-lru lets it evict rather than
    # start refusing writes (noeviction would surface as random WordPress failures once
    # full, which is a far worse failure mode than a cache miss).
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - ${REDIS_PASSWORD}
    # No ports: stanza -- reachable only on the internal network, same rule as soulful-db.
    healthcheck:
      test: ["CMD", "timeout", "2", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [soulful-net]
    memswap_limit: 768M
    deploy:
      resources:
        limits:
          memory: 768M
          pids: 64
    logging: *soulful-logging

  soulful-wp:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    image: soulful-wordpress:php8.2.35-r1
    container_name: soulful-wp
    restart: unless-stopped
    depends_on:
      soulful-db:
        condition: service_healthy
      soulful-redis:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: soulful-db:3306
      WORDPRESS_DB_NAME: ${SOULFUL_DB_NAME:-soulful}
      WORDPRESS_DB_USER: ${SOULFUL_DB_USER:-soulful}
      WORDPRESS_DB_PASSWORD: ${SOULFUL_DB_PASSWORD:?SOULFUL_DB_PASSWORD not set}
      WORDPRESS_DB_CHARSET: utf8
      WORDPRESS_DB_COLLATE: ""
      WORDPRESS_TABLE_PREFIX: wp_
    volumes:
      - soulful_wordpress_data:/var/www/html
    # Bound to loopback only. nginx (added at the TLS/cutover step) terminates TLS on
    # the host and proxies here; nothing reaches this port from outside the box.
    ports:
      - "127.0.0.1:8081:80"
    networks: [soulful-net]
    memswap_limit: 6G
    deploy:
      resources:
        limits:
          # PHP memory_limit is 1536M per process (matching live). Apache prefork can
          # hold several of those concurrently, so the container ceiling is deliberately
          # well above a single process rather than equal to it.
          memory: 6G
          pids: 256
    logging: *soulful-logging

volumes:
  soulful_wordpress_data:
    name: soulful_wordpress_data
  soulful_db_data:
    name: soulful_db_data

networks:
  soulful-net:
    name: soulful-net

name: postiz

services:
  postiz-redis:
    image: redis:7.2-alpine
    container_name: postiz-redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 128m
    cpus: "0.25"
    command: redis-server --save "" --appendonly no
    networks:
      - postiz_internal

  postiz:
    image: ghcr.io/gitroomhq/postiz-app:v2.11.3
    container_name: postiz
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"
    mem_limit: 1200m
    cpus: "1.0"
    ports:
      - '127.0.0.1:4007:5000'
    environment:
      - DATABASE_URL=postgresql://postiz:${POSTIZ_DB_PASSWORD}@supabase-db:5432/postiz
      - REDIS_URL=redis://postiz-redis:6379
      - JWT_SECRET=${POSTIZ_JWT_SECRET}
      - FRONTEND_URL=https://postiz.aware-wave.com
      - NEXT_PUBLIC_BACKEND_URL=https://postiz.aware-wave.com
      - BACKEND_INTERNAL_URL=http://postiz:5000
      - MAIN_URL=https://postiz.aware-wave.com
      - IS_GENERAL=true
      - RUN_CRON=true
      - DISABLE_REGISTRATION=false
      - STORAGE_PROVIDER=local
      - UPLOAD_DIRECTORY=/uploads
      - NEXT_PUBLIC_UPLOAD_DIRECTORY=/uploads
    volumes:
      - postiz_uploads:/uploads
    networks:
      - supabase_default
      - postiz_internal
    depends_on:
      - postiz-redis

volumes:
  postiz_uploads:

networks:
  supabase_default:
    external: true
  postiz_internal:
    driver: bridge

# Postiz (self-hosted social publishing) — EU VPS (204.168.175.41).
# DEPLOYED COPY lives at /root/postiz/docker-compose.yml on the EU box (with a sibling .env
# holding POSTIZ_DB_PASSWORD / POSTIZ_JWT_SECRET — never committed). This repo copy is the SSOT;
# keep the two in sync. Lightweight v2.11.3 (pre-Temporal/Elasticsearch) to fit the shared box;
# hard mem_limit caps blast radius so Postiz can never OOM the host's Supabase/n8n/Trigger.
# Reuses the existing supabase-db Postgres (dedicated `postiz` DB+role). Public via nginx vhost
# postiz.aware-wave.com → 127.0.0.1:4007. Internal layout: nginx:5000 → backend:3000 (/api) +
# frontend:4200 (/) — hence NEXT_PUBLIC_BACKEND_URL ends in /api and BACKEND_INTERNAL_URL=:3000.
name: postiz

services:
  postiz-redis:
    image: redis:7.2-alpine
    container_name: postiz-redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 128m
    cpus: "0.25"
    command: redis-server --save "" --appendonly no --requirepass ${REDIS_PASSWORD}
    networks:
      - postiz_internal

  postiz:
    image: ghcr.io/gitroomhq/postiz-app:v2.11.3
    container_name: postiz
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"
    mem_limit: 1400m
    cpus: "1.0"
    ports:
      - '127.0.0.1:4007:5000'
    environment:
      - DATABASE_URL=postgresql://postiz:${POSTIZ_DB_PASSWORD}@supabase-db:5432/postiz
      - REDIS_URL=redis://:${REDIS_PASSWORD}@postiz-redis:6379
      - JWT_SECRET=${POSTIZ_JWT_SECRET}
      - FRONTEND_URL=https://postiz.aware-wave.com
      - NEXT_PUBLIC_BACKEND_URL=https://postiz.aware-wave.com/api
      - BACKEND_INTERNAL_URL=http://localhost:3000
      - MAIN_URL=https://postiz.aware-wave.com
      - IS_GENERAL=true
      - RUN_CRON=true
      # NOT_SECURED skips email-activation (no SMTP/Resend wired yet) so local email+password
      # registration completes without a confirmation mail.
      - NOT_SECURED=true
      # Locked after the first (admin) account was created. Flip to false only to add another user.
      - DISABLE_REGISTRATION=true
      - STORAGE_PROVIDER=local
      - UPLOAD_DIRECTORY=/uploads
      - NEXT_PUBLIC_UPLOAD_DIRECTORY=/uploads
    volumes:
      - postiz_uploads:/uploads
    networks:
      - supabase_default
      - postiz_internal
    depends_on:
      - postiz-redis

volumes:
  postiz_uploads:

networks:
  supabase_default:
    external: true
  postiz_internal:
    driver: bridge

# Phase 1 — production-oriented: multi-stage builds for Node apps, healthchecks, Nginx gates on app readiness.
# Supabase is external; set SUPABASE_* in .env.
#
# Build & run: docker compose --env-file .env build --no-cache && docker compose --env-file .env up -d
# After changing NEXT_PUBLIC_*: rebuild next-admin (baked at build time).
#
# Long-run: image pin policy, backups, DR drills — see LONG_TERM_OPS.md (Owner).
# Log rotation via json-file limits avoids filling disk over years of uptime.

x-logging: &lobster-logging
  driver: json-file
  options:
    max-size: "25m"
    max-file: "5"

services:
  nginx:
    image: nginx:stable
    container_name: lobster-nginx
    restart: unless-stopped
    depends_on:
      node-api:
        condition: service_healthy
      next-admin:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/nginx/.htpasswd_studio:/etc/nginx/.htpasswd_studio:ro
      # Host log dir for fail2ban — nginx writes here, fail2ban reads from host path
      - /var/log/lobster-nginx:/var/log/nginx:rw
    networks:
      - lobster-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'
    logging: *lobster-logging

  redis:
    image: redis:7-alpine
    container_name: lobster-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-127.0.0.1:6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lobster-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    logging: *lobster-logging

  # Canonical self-hosted n8n for AwareWave is on EU (see SERVICE_CREDENTIALS_MAP.md).
  # SG phase1 does not run local n8n by default — avoids duplicate workflows/RAM vs DNS (n8n.aware-wave.com → EU).
  # To start it on a host: COMPOSE_PROFILES=local-n8n docker compose --env-file .env up -d
  n8n:
    profiles:
      - local-n8n
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG:-2.18.5}
    container_name: lobster-n8n
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
      # Defaults allow `docker compose config` when profile `local-n8n` is off; with profile on, set real values in `.env` (see `.env.example`).
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      # Pattern A: /n8n/. Pattern B: / (dedicated subdomain).
      N8N_PATH: ${N8N_PATH:-/}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://127.0.0.1:5678/}
      GENERIC_TIMEZONE: Asia/Taipei
      N8N_SECURE_COOKIE: "false"
      N8N_PROXY_HOPS: "1"
      # Sentry (self-hosted n8n) — see https://github.com/n8n-io/n8n/blob/master/packages/@n8n/config/src/configs/sentry.config.ts
      N8N_SENTRY_DSN: ${N8N_SENTRY_DSN:-${SENTRY_DSN_N8N:-}}
      N8N_FRONTEND_SENTRY_DSN: ${SENTRY_DSN_N8N_FRONTEND:-}
      ENVIRONMENT: ${N8N_SENTRY_ENVIRONMENT:-staging}
      DEPLOYMENT_NAME: ${N8N_DEPLOYMENT_NAME:-lobster-phase1-n8n}
      N8N_SENTRY_TRACES_SAMPLE_RATE: ${N8N_SENTRY_TRACES_SAMPLE_RATE:-0}
      N8N_SENTRY_PROFILES_SAMPLE_RATE: ${N8N_SENTRY_PROFILES_SAMPLE_RATE:-0}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "${N8N_HOST_PORT:-127.0.0.1:5678}:5678"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - lobster-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    logging: *lobster-logging

  wordpress-db:
    image: mariadb:11
    container_name: lobster-wordpress-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME}
      MYSQL_USER: ${WORDPRESS_DB_USER}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD}
    volumes:
      - wordpress_db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - lobster-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.00'
    logging: *lobster-logging

  wordpress:
    build:
      context: ./apps/wordpress
      dockerfile: Dockerfile
    image: lobster-phase1-wordpress:local
    container_name: lobster-wordpress
    restart: unless-stopped
    depends_on:
      wordpress-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      SENTRY_DSN: ${SENTRY_DSN_WORDPRESS:-${SENTRY_DSN_WP:-}}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WORDPRESS_PUBLIC_URL}');
        define('WP_SITEURL', '${WORDPRESS_PUBLIC_URL}');
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wordpress_data:/var/www/html
    ports:
      - "${WORDPRESS_HOST_PORT:-127.0.0.1:8080}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1/ > /dev/null || exit 1"
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - lobster-net
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.50'
    logging: *lobster-logging

  node-api:
    build:
      context: ./apps/node-api
      dockerfile: Dockerfile
    image: lobster-phase1-node-api:local
    container_name: lobster-node-api
    restart: unless-stopped
    environment:
      PORT: "3001"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SENTRY_DSN: ${SENTRY_DSN_NODE_API:-${SENTRY_DSN:-}}
    ports:
      - "${NODE_API_HOST_PORT:-127.0.0.1:3001}:3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3001/health > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - lobster-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    logging: *lobster-logging

  next-admin:
    build:
      context: ./apps/next-admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_BASE_PATH: /api
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_NEXT_ADMIN:-${SENTRY_DSN_NEXT:-}}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: lobster-phase1-next-admin:local
    container_name: lobster-next-admin
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Host status files for /ops pages, read-only (backup-coverage.json: BACKUP_COVERAGE_PLAN.md B6).
      - /var/lib/awarewave:/host-status:ro
    environment:
      PORT: "3000"
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      CALENDARIFIC_API_KEY: ${CALENDARIFIC_API_KEY:-}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL}
      NEXT_PUBLIC_API_BASE_PATH: /api
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_NEXT_ADMIN:-${SENTRY_DSN_NEXT:-}}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      # Ops Inbox (Path B) — values from .env; see .env.example (never commit secrets)
      OPS_INBOX_INGEST_TOKEN: ${OPS_INBOX_INGEST_TOKEN:-}
      # M2 per-source webhook tokens (auto-repair audit §M2). Empty = fall back to the
      # shared OPS_INBOX_INGEST_TOKEN (deploy-safe default; behaviour unchanged until set).
      OPS_INBOX_SENTRY_TOKEN: ${OPS_INBOX_SENTRY_TOKEN:-}
      OPS_INBOX_GRAFANA_TOKEN: ${OPS_INBOX_GRAFANA_TOKEN:-}
      OPS_INBOX_NETDATA_TOKEN: ${OPS_INBOX_NETDATA_TOKEN:-}
      OPS_INBOX_UPTIME_KUMA_TOKEN: ${OPS_INBOX_UPTIME_KUMA_TOKEN:-}
      OPS_INBOX_POSTHOG_TOKEN: ${OPS_INBOX_POSTHOG_TOKEN:-}
      # Client schedules heartbeat -> /api/internal/schedules/run-due (migration 0097). Own dedicated
      # token, never OPS_INBOX_INGEST_TOKEN — see verifyIngestToken.ts's M2 history for why a shared
      # token across unrelated callers is a blast-radius mistake already paid for once.
      # Empty = the endpoint fails closed (401 to every caller) until set.
      SCHEDULE_INGEST_TOKEN: ${SCHEDULE_INGEST_TOKEN:-}
      # ADR 017 permits (lib/entitlements/runtime.ts): Ed25519 PKCS8/SPKI base64 bodies; PUBLIC_KEYS = "kid:spki;kid2:spki".
      # Empty in shadow mode = every paid call is logged as infra_error and allowed; enforce mode refuses.
      ENTITLEMENT_SIGNING_KEY: ${ENTITLEMENT_SIGNING_KEY:-}
      ENTITLEMENT_SIGNING_KID: ${ENTITLEMENT_SIGNING_KID:-}
      ENTITLEMENT_PUBLIC_KEYS: ${ENTITLEMENT_PUBLIC_KEYS:-}
      # Cross-product id reconciliation -> GET /api/internal/reconcile (BACKUP_COVERAGE_PLAN.md B8). The same value
      # sits in /etc/default/awarewave-reconcile for backup-coverage-check.py on the host. Empty = 401 (fail closed).
      RECONCILE_TOKEN: ${RECONCILE_TOKEN:-}
      # Postiz public API (lib/content/postiz.ts). In .env but never passed through, so every next-admin Postiz
      # call threw "POSTIZ_API_BASE_URL env var not set" (found by the B8 reconcile check, 2026-10-15).
      POSTIZ_API_BASE_URL: ${POSTIZ_API_BASE_URL:-}
      POSTIZ_API_KEY: ${POSTIZ_API_KEY:-}
      # Client account links (lib/mail/resend.ts, ops client hub → 帳號). Same Resend account as Chatwoot's SMTP.
      # Empty = accounts are still created but the panel says mail is not set up; MAIL_FROM defaults to noreply@<base domain>.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Cognitive OS research runs (RESEARCH_LINES_MASTER_PLAN §12.7): RUNS = COS -> /api/internal/collect/runs and
      # this app -> COS grant exchange (same value in COS deploy/.env); EXECUTE = Trigger worker -> runs/execute.
      # Empty = both endpoints 401 (fail closed).
      COLLECT_RESEARCH_RUNS_TOKEN: ${COLLECT_RESEARCH_RUNS_TOKEN:-}
      COLLECT_RESEARCH_EXECUTE_TOKEN: ${COLLECT_RESEARCH_EXECUTE_TOKEN:-}
      # Migration window: accept the legacy shared token too while platforms are
      # re-pointed one at a time. Set "false" once every platform sends its own token.
      OPS_INBOX_DUAL_ACCEPT_LEGACY: ${OPS_INBOX_DUAL_ACCEPT_LEGACY:-}
      # M4 fingerprint salt. Empty = fingerprint_v2 mirrors the legacy fingerprint
      # (no-op). Set a high-entropy server-only secret to make fingerprints unforgeable.
      OPS_INBOX_FINGERPRINT_SALT: ${OPS_INBOX_FINGERPRINT_SALT:-}
      OPS_INBOX_NOTIFY_ENABLED: ${OPS_INBOX_NOTIFY_ENABLED:-}
      OPS_INBOX_SLACK_INCIDENTS_WEBHOOK: ${OPS_INBOX_SLACK_INCIDENTS_WEBHOOK:-}
      OPS_INBOX_PUBLIC_URL: ${OPS_INBOX_PUBLIC_URL:-}
      OPS_INBOX_TELEGRAM_NOTIFY_ENABLED: ${OPS_INBOX_TELEGRAM_NOTIFY_ENABLED:-}
      OPS_INBOX_TELEGRAM_NOTIFY_MIN_SEVERITY: ${OPS_INBOX_TELEGRAM_NOTIFY_MIN_SEVERITY:-medium}
      OPS_INBOX_TELEGRAM_CHAT_IDS: ${OPS_INBOX_TELEGRAM_CHAT_IDS:-}
      OPS_INBOX_POSTHOG_ENABLED: ${OPS_INBOX_POSTHOG_ENABLED:-}
      OPS_INBOX_GEMINI_ENABLED: ${OPS_INBOX_GEMINI_ENABLED:-}
      OPS_INBOX_GEMINI_DAILY_LIMIT: ${OPS_INBOX_GEMINI_DAILY_LIMIT:-1400}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Outreach: Gmail OAuth connector (app/api/outreach/{messages/gmail-draft,connectors/gmail/*}).
      # Was live on the server since before this file tracked it (2026-09-20 compose-drift audit) --
      # added here so a fresh deploy of this file no longer silently omits it.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      OPS_PROXY_SHARED_SECRET: ${OPS_PROXY_SHARED_SECRET:-}
      OPS_ALLOW_SIMULATED_ROLE_FALLBACK: ${OPS_ALLOW_SIMULATED_ROLE_FALLBACK:-}
      OPS_ROLE_RESOLUTION_MODE: ${OPS_ROLE_RESOLUTION_MODE:-}
      OPS_SIMULATED_FALLBACK_ROLE: ${OPS_SIMULATED_FALLBACK_ROLE:-}
      INTERNAL_ADMIN_BASE_URL: ${INTERNAL_ADMIN_BASE_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      # Command Plane: org/workspace scope (Phase 1: single-owner deployment)
      COMMAND_PLANE_DEFAULT_ORG_ID: ${COMMAND_PLANE_DEFAULT_ORG_ID:-}
      COMMAND_PLANE_DEFAULT_WORKSPACE_ID: ${COMMAND_PLANE_DEFAULT_WORKSPACE_ID:-}
      # AI handlers (/daily_review, /weekly_review) — falls back to raw JSON if unset
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # /ops/collect "搜尋全網" (lib/collect/collectors/web-search.ts): operator directive 2026-09-20 —
      # Perplexity's chat/agent endpoints drained the account twice (2026-06-21, 2026-09-12), so
      # PERPLEXITY_API_KEY is deliberately NOT passed through here. Its driver still exists in code
      # for an explicit COLLECT_SEARCH_PROVIDER=perplexity override, but that override is now
      # structurally unreachable in this container regardless — there is no key for it to read, so
      # a stray override value alone cannot revive it. Serper is the default; Brave is the fallback.
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      # Content Studio multi-provider: GPT article generation path reads this (lib/content/article/
      # generate-core.ts streamOpenAiGeneration). Empty = GPT models unavailable; Claude path unaffected.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Repair Center: backup gate + GitHub handoff + Slack interactive approval
      AUTO_REPAIR_BACKUP_WEBHOOK_URL: ${AUTO_REPAIR_BACKUP_WEBHOOK_URL:-}
      AUTO_REPAIR_BACKUP_WEBHOOK_TOKEN: ${AUTO_REPAIR_BACKUP_WEBHOOK_TOKEN:-}
      AUTO_REPAIR_SG_SSH_HOST: ${AUTO_REPAIR_SG_SSH_HOST:-}
      AUTO_REPAIR_SG_SSH_PORT: ${AUTO_REPAIR_SG_SSH_PORT:-}
      AUTO_REPAIR_SG_SSH_USER: ${AUTO_REPAIR_SG_SSH_USER:-}
      AUTO_REPAIR_SG_SSH_KEY_ENV: ${AUTO_REPAIR_SG_SSH_KEY_ENV:-}
      AUTO_REPAIR_SG_SSH_KEY_B64: ${AUTO_REPAIR_SG_SSH_KEY_B64:-}
      AUTO_REPAIR_SG_SSH_HOST_KEY_SHA256: ${AUTO_REPAIR_SG_SSH_HOST_KEY_SHA256:-}
      AUTO_REPAIR_EU_SSH_HOST: ${AUTO_REPAIR_EU_SSH_HOST:-}
      AUTO_REPAIR_EU_SSH_PORT: ${AUTO_REPAIR_EU_SSH_PORT:-}
      AUTO_REPAIR_EU_SSH_USER: ${AUTO_REPAIR_EU_SSH_USER:-}
      AUTO_REPAIR_EU_SSH_KEY_ENV: ${AUTO_REPAIR_EU_SSH_KEY_ENV:-}
      AUTO_REPAIR_EU_SSH_KEY_B64: ${AUTO_REPAIR_EU_SSH_KEY_B64:-}
      AUTO_REPAIR_EU_SSH_HOST_KEY_SHA256: ${AUTO_REPAIR_EU_SSH_HOST_KEY_SHA256:-}
      AUTO_REPAIR_REQUIRE_EU_BACKUP: ${AUTO_REPAIR_REQUIRE_EU_BACKUP:-}
      AUTO_REPAIR_SG_PHASE1_ROOT: ${AUTO_REPAIR_SG_PHASE1_ROOT:-}
      AUTO_REPAIR_SG_BACKUP_SCRIPT: ${AUTO_REPAIR_SG_BACKUP_SCRIPT:-}
      AUTO_REPAIR_SG_VERIFY_SCRIPT: ${AUTO_REPAIR_SG_VERIFY_SCRIPT:-}
      AUTO_REPAIR_EU_BACKUP_SCRIPT: ${AUTO_REPAIR_EU_BACKUP_SCRIPT:-}
      AUTO_REPAIR_EU_VERIFY_SCRIPT: ${AUTO_REPAIR_EU_VERIFY_SCRIPT:-}
      AUTO_REPAIR_GITHUB_TOKEN: ${AUTO_REPAIR_GITHUB_TOKEN:-}
      AUTO_REPAIR_GITHUB_OWNER: ${AUTO_REPAIR_GITHUB_OWNER:-}
      AUTO_REPAIR_GITHUB_REPO: ${AUTO_REPAIR_GITHUB_REPO:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_OPS_INCIDENTS_CHANNEL_ID: ${SLACK_OPS_INCIDENTS_CHANNEL_ID:-}
      SLACK_INFRA_ALERTS_CHANNEL_ID: ${SLACK_INFRA_ALERTS_CHANNEL_ID:-}
      SLACK_GITHUB_PRS_CHANNEL_ID: ${SLACK_GITHUB_PRS_CHANNEL_ID:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # Build Console: optional immediate Trigger.dev dispatcher kick (see apps/next-admin/lib/kick-dispatcher.ts)
      TRIGGER_SECRET_KEY: ${TRIGGER_SECRET_KEY:-}
      TRIGGER_ACCESS_TOKEN: ${TRIGGER_ACCESS_TOKEN:-}
      TRIGGER_API_URL: ${TRIGGER_API_URL:-https://api.trigger.dev}
      BATCH_INTERNAL_SECRET: ${BATCH_INTERNAL_SECRET:-}
      TAROT_DAILY_LIMIT: ${TAROT_DAILY_LIMIT:-300}
      PRINTFUL_API_KEY: ${PRINTFUL_API_KEY:-}
      PRINTFUL_STORE_ID: ${PRINTFUL_STORE_ID:-}
      PRINTFUL_NATIVE_STORE_ID: ${PRINTFUL_NATIVE_STORE_ID:-}
      # POD auto-fulfillment (Woo paid order -> Printful DRAFT). Kill switch, DEFAULT OFF: the
      # /api/webhooks/woo-order route is dormant until set true. DRAFT-only (no charge/print) even
      # when on. WC_WEBHOOK_SECRET = the WooCommerce webhook secret used to HMAC-verify the payload.
      POD_AUTO_FULFILL_ENABLED: ${POD_AUTO_FULFILL_ENABLED:-false}
      WC_WEBHOOK_SECRET: ${WC_WEBHOOK_SECRET:-}
      # Own bearer for /api/internal/pod-orders/sweep (the 10-minute pod_order_inbox replay); empty = 401.
      POD_INBOX_SWEEP_TOKEN: ${POD_INBOX_SWEEP_TOKEN:-}
      # Own bearer for /api/internal/cs/sweep (the 5-minute unfinished-Chatwoot-claim handoff); empty = 401.
      CS_SWEEP_TOKEN: ${CS_SWEEP_TOKEN:-}
      # Social sender (SOCIAL_MANAGER_PLAN.md C5): own bearer for /api/internal/social/dispatch (empty = 401); off unless
      # SOCIAL_DISPATCH_ENABLED=true; SOCIAL_DISPATCH_MODE=apply sends, =draft makes Postiz drafts only (rehearsal),
      # anything else is a dry run.
      SOCIAL_DISPATCH_TOKEN: ${SOCIAL_DISPATCH_TOKEN:-}
      SOCIAL_DISPATCH_ENABLED: ${SOCIAL_DISPATCH_ENABLED:-}
      SOCIAL_DISPATCH_MODE: ${SOCIAL_DISPATCH_MODE:-}
      # wp-bridge signing client (one-click publish; lib/studio/wp-bridge-client.ts). Was live on the
      # server since before this file tracked it (2026-09-20 compose-drift audit) -- added here so a
      # fresh deploy of this file no longer silently omits it.
      WPBRIDGE_BASE_URL: ${WPBRIDGE_BASE_URL:-}
      WPBRIDGE_KEY_ID: ${WPBRIDGE_KEY_ID:-}
      WPBRIDGE_PRIVATE_KEY: ${WPBRIDGE_PRIVATE_KEY:-}
      # Repair OS Integrations: provider health adapters use reference-only secrets from env.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_AUTH_BEARER_TOKEN: ${CLOUDFLARE_AUTH_BEARER_TOKEN:-}
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
      POSTHOG_PERSONAL_API_KEY: ${POSTHOG_PERSONAL_API_KEY:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      N8N_AUTH_BEARER_TOKEN: ${N8N_AUTH_BEARER_TOKEN:-}
      UPTIME_KUMA_API_KEY: ${UPTIME_KUMA_API_KEY:-}
      UPTIME_KUMA_URL: ${UPTIME_KUMA_URL:-}
      GRAFANA_BASE_URL: ${GRAFANA_BASE_URL:-}
      GRAFANA_INTERNAL_BASE_URL: ${GRAFANA_INTERNAL_BASE_URL:-}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}
      NETDATA_BASE_URL: ${NETDATA_BASE_URL:-}
      # Video pipeline production gates (lib/content/video/{caption-qa-persistence,delivery-receipts,
      # qa-persistence,provider-policy}.ts, app/api/video/{release,qa/editorial-rights}/route.ts,
      # app/api/webhooks/video-outcome/route.ts). Was live on the server since before this file
      # tracked it (2026-09-20 compose-drift audit) -- added here so a fresh deploy of this file no
      # longer silently omits it.
      MEDIA_PRODUCTION_PERSISTENCE_ENABLED: ${MEDIA_PRODUCTION_PERSISTENCE_ENABLED:-false}
      MEDIA_OUTCOME_WEBHOOK_ENABLED: ${MEDIA_OUTCOME_WEBHOOK_ENABLED:-false}
      MEDIA_OUTCOME_WEBHOOK_TOKEN: ${MEDIA_OUTCOME_WEBHOOK_TOKEN:-}
      MEDIA_PROVIDER_ALLOWLIST: ${MEDIA_PROVIDER_ALLOWLIST:-}
      NETDATA_API_TOKEN: ${NETDATA_API_TOKEN:-}
      SUPABASE_AWAREWAVE_SERVICE_ROLE_KEY: ${SUPABASE_AWAREWAVE_SERVICE_ROLE_KEY:-}
      SUPABASE_SOULFULEXPRESSION_SERVICE_ROLE_KEY: ${SUPABASE_SOULFULEXPRESSION_SERVICE_ROLE_KEY:-}
      # SSH keys for web-UI one-click WP plugin updates (base64-encoded private key per client)
      # Naming: SSH_KEY_<ssh_key_name uppercase> — must match client_config.ssh_key_name in Supabase
      SSH_KEY_HOSTINGER_SOULFUL: ${SSH_KEY_HOSTINGER_SOULFUL:-}
      # Hosting bridge — provision WordPress staging sites. The key's only power is the forced command
      # scripts/aw-hosting-gate.sh (root authorized_keys); all five SSH vars required, no DB password here.
      LOBSTER_HOSTING_API_TOKEN: ${LOBSTER_HOSTING_API_TOKEN:-}
      HOSTING_BRIDGE_SSH_HOST: ${HOSTING_BRIDGE_SSH_HOST:-}
      HOSTING_BRIDGE_SSH_PORT: ${HOSTING_BRIDGE_SSH_PORT:-}
      HOSTING_BRIDGE_SSH_USER: ${HOSTING_BRIDGE_SSH_USER:-}
      HOSTING_BRIDGE_SSH_KEY_B64: ${HOSTING_BRIDGE_SSH_KEY_B64:-}
      HOSTING_BRIDGE_SSH_HOST_KEY_SHA256: ${HOSTING_BRIDGE_SSH_HOST_KEY_SHA256:-}
      # My Designs gallery (R2 object storage)
      POD_DESIGNS_ENABLED: ${POD_DESIGNS_ENABLED:-false}
      POD_DESIGNS_DEFAULT_ORG_ID: ${POD_DESIGNS_DEFAULT_ORG_ID:-}
      R2_API_TOKEN: ${R2_API_TOKEN:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_DESIGNS_BUCKET: ${R2_DESIGNS_BUCKET:-lobster-designs}
      R2_DESIGNS_PUBLIC_BASE: ${R2_DESIGNS_PUBLIC_BASE:-}
      # 影片生成積木（video/pipeline）：Flux 生圖(Replicate) + Pexels B-roll + 跨機 render 服務(EU)。
      # 預設空值 fail-closed：缺 key → 積木回 {ok:false}，網頁顯示「未設定」，不崩。
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      VIDEO_SERVICE_URL: ${VIDEO_SERVICE_URL:-}
      VIDEO_SERVICE_SECRET: ${VIDEO_SERVICE_SECRET:-}
      # Remotion 模板渲染（/api/video/remotion-render）：上線時漏接，code fallback 用
      # 127.0.0.1:8733（next-admin container 自己的 loopback，連不到宿主機），2026-09-11 修。
      # .env 已有正確值 https://remotion-svc.aware-wave.com（跟 VIDEO_SERVICE_URL 同一 nginx/CF
      # 外部路由慣例，非本次新開）；此行只是把它接進 next-admin，空值一樣 fail-closed。
      REMOTION_SERVICE_URL: ${REMOTION_SERVICE_URL:-}
      # 真正根因（上面兩行是必要但不夠）：lib/content/video/renderer-auth.ts 的 resolveRendererAuth
      # 對 renderer="remotion" 只認 MEDIA_RENDER_AUTH_TOKEN（canonical，未設）或 REMOTION_AUTH_TOKEN
      # （legacy，同樣沒接進來）——VIDEO_SERVICE_SECRET 只給 "quick" renderer 用，remotion 從沒讀過它。
      # .env 已有正確值（跟 remotion-service／video-service 兩邊容器的 RENDER_AUTH_TOKEN 同一把密鑰，
      # SSH 直測驗證過），此行只是把它接進 next-admin。這行沒接 = resolveRendererAuth fail-closed
      # 回 {ok:false}，route 正確回 502 JSON，CF edge 再把 502 body 換成品牌錯誤頁——即使
      # REMOTION_SERVICE_URL 已修對，沒有這行還是同樣的「Unexpected token '<'」。
      REMOTION_AUTH_TOKEN: ${REMOTION_AUTH_TOKEN:-}
      # 影片孤兒對帳（/api/video/reconcile）需列 R2 video bucket（與 EU 同 bucket/public base）
      R2_VIDEO_BUCKET: ${R2_VIDEO_BUCKET:-lobster-videos}
      R2_VIDEO_PUBLIC_BASE: ${R2_VIDEO_PUBLIC_BASE:-}
      # PRINTFUL_API_KEY / STORE_ID / NATIVE_STORE_ID / POD_AUTO_FULFILL_ENABLED / WC_WEBHOOK_SECRET
      # 已在上方（line ~337）定義；此處原有重複定義已移除（YAML 重複鍵 → docker compose config 失敗）。
      # POD print track ([0-a-gs]): enable the Ghostscript PDF/X-1a OutputIntent pass.
      # Default OFF — CMYK print destinations return a clear "not deployed" error until
      # gs is in the image (it now is, via Dockerfile) AND this flag is set true.
      POD_OUTPUT_INTENT_DEPLOYED: ${POD_OUTPUT_INTENT_DEPLOYED:-false}
      # Optional per-profile ICC override paths (drop a licensed/CC .icc into the image,
      # point here — no code change). Empty → bundled SWOP default_cmyk.icc.
      POD_ICC_JapanColor2001Coated: ${POD_ICC_JapanColor2001Coated:-}
      POD_ICC_USWebCoatedSWOP: ${POD_ICC_USWebCoatedSWOP:-}
      POD_ICC_CoatedFOGRA39: ${POD_ICC_CoatedFOGRA39:-}
      # Public customer intake door — narrow-scoped token (FluentForm webhook only)
      ONBOARDING_PUBLIC_INTAKE_TOKEN: ${ONBOARDING_PUBLIC_INTAKE_TOKEN:-}
      # Cloudflare Turnstile: sitekey baked at build time (NEXT_PUBLIC_*); secret verified server-side
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # portal.aware-wave.com signup kill switch — independent of TURNSTILE_SECRET_KEY (critic
      # finding C3, 2026-08-29): must be "true" in every environment including production, or
      # /portal/api/signup stays 503. Do NOT reuse TURNSTILE_SECRET_KEY as this route's gate —
      # that secret is shared with /intake and turning that form on must not silently open portal
      # signup too.
      PORTAL_SIGNUP_ENABLED: ${PORTAL_SIGNUP_ENABLED:-}
      # Salts the per-caller rate-limit hash (app/portal/api/signup/route.ts rateLimitKey()) so
      # it isn't reversible via an IPv4 rainbow table. Critic finding (2026-08-29, minor): this
      # var was never wired here, so the route silently fell back to the source-code default
      # constant in every deploy -- generate a real random value and set it once via the vault,
      # never reuse the fallback in production.
      PORTAL_SIGNUP_RATE_LIMIT_SALT: ${PORTAL_SIGNUP_RATE_LIMIT_SALT:-}
      # Cognitive OS bridge (lib/cognitive-os/) -- next-admin's cs_knowledge_sources -> Cognitive OS
      # Project Source Import, over the shared lobster-net docker network (never a public domain).
      # Service-account tenant/identity created by ai_lego/apps/cli/bootstrap_service_identity.py
      # against the cognitive-os-api container, NOT the human operator's own Phase 1 tenant.
      # Empty = /api/internal/cognitive-os/import-project-sources answers 503 (fail closed).
      COGNITIVE_OS_API_BASE_URL: ${COGNITIVE_OS_API_BASE_URL:-http://cognitive-os-api:8420}
      COGNITIVE_OS_TENANT_ID: ${COGNITIVE_OS_TENANT_ID:-}
      COGNITIVE_OS_SERVICE_EMAIL: ${COGNITIVE_OS_SERVICE_EMAIL:-}
      COGNITIVE_OS_SERVICE_PASSWORD: ${COGNITIVE_OS_SERVICE_PASSWORD:-}
      # Own dedicated token, never a token shared with an unrelated caller (see
      # lib/ops-inbox/verifyIngestToken.ts's own M2 history for why that sharing is a blast-radius
      # mistake this project already paid for once).
      COGNITIVE_OS_IMPORT_INGEST_TOKEN: ${COGNITIVE_OS_IMPORT_INGEST_TOKEN:-}
      # HCI-30 bridge (lib/hci/) -- next-admin's cs_knowledge_sources -> HCI-30's DISCOVERED-source
      # admission pipeline (POST /api/hci/v1/seeds). No usable default for the base URL, unlike
      # Cognitive OS above: HCI-30 has never been deployed onto this stack's own docker network, and
      # this container's own "localhost" is not the operator's laptop -- critic review 2026-09-18
      # caught that omitting this var here would leave lib/hci/client.ts permanently unable to read
      # it after any deploy (process.env.HCI_API_BASE_URL undefined with no env_file passthrough in
      # this file), silently stranding the whole feature in its fail-closed (503) state forever.
      # Empty = POST /api/ops/clients/[slug]/hci-import answers 503 (fail closed).
      HCI_API_BASE_URL: ${HCI_API_BASE_URL:-}
      # 'a' is one of HCI-30's two hardcoded synthetic dev tenants (app/server.mjs TENANT_ROLES) --
      # there is no real per-organization HCI-30 tenant mapping yet (a separate, much larger,
      # explicitly deferred project), so every organization that uses this bridge lands in the SAME
      # shared HCI-30 review queue. CollectionSourcesPanel.tsx's button surfaces this to the operator
      # directly rather than leaving it as a comment only she'd have to already know to go read.
      HCI_IMPORT_TENANT: ${HCI_IMPORT_TENANT:-a}
      # Rendered collection tier (lib/collect/collectors/extract-provider.ts, apps/renderer).
      # Empty = the tier falls back to FIRECRAWL_API_KEY if set, otherwise stays inert.
      RENDERER_SHARED_SECRET: ${RENDERER_SHARED_SECRET:-}
      # site-watch (agency-os/docs/operations/SITE_WATCH_MASTER_PLAN.md §3.4). SITE_WATCH_ENABLED is the
      # AGENTS.md §0 kill switch: unset/false = no renderer call, no Telegram (daily cleanup still runs).
      # SITE_WATCH_INGEST_TOKEN = own bearer for /api/internal/site-watch/*; empty = 401 to everyone.
      # R2_SITE_WATCH_BUCKET = a PRIVATE bucket, deliberately no default (the designs bucket is public);
      # empty = availability checks only, no screenshot stored.
      SITE_WATCH_ENABLED: ${SITE_WATCH_ENABLED:-}
      SITE_WATCH_INGEST_TOKEN: ${SITE_WATCH_INGEST_TOKEN:-}
      R2_SITE_WATCH_BUCKET: ${R2_SITE_WATCH_BUCKET:-}
    ports:
      - "${NEXT_ADMIN_HOST_PORT:-127.0.0.1:3002}:3000"
    depends_on:
      node-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 50s
    networks:
      - lobster-net
      - observability
      - renderer-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.00'
    logging: *lobster-logging

  # Headless-browser render service for next-admin's rendered collection tier (apps/renderer,
  # operator decision 2026-09-21). Every page it opens is attacker-controlled, so:
  #   * its own network, renderer-net, shared ONLY with next-admin (the one caller);
  #   * apps/renderer/entrypoint.sh installs an OUTPUT policy in this netns that reaches the public
  #     internet and nothing else (no RFC1918, loopback, link-local/metadata, CGNAT) on EVERY start,
  #     then drops to pwuser with an empty capability bounding set before node runs;
  #   * cap_drop ALL; the caps added back exist only for that entrypoint and are gone from the
  #     process tree before any page is opened;
  #   * published on 127.0.0.1 only (host-side smoke/debug) - never 0.0.0.0: the 2026-04-20
  #     intrusion came in through a 0.0.0.0 publish (runbooks/HETZNER-SERVER-SECURITY-INCIDENT-CRYPTO-MINER.md).
  renderer:
    build:
      context: ./apps/renderer
    image: lobster-phase1-renderer:local
    container_name: lobster-renderer
    restart: unless-stopped
    environment:
      RENDERER_SHARED_SECRET: ${RENDERER_SHARED_SECRET:?renderer requires a generated shared secret}
      RENDERER_PORT: "3000"
      RENDERER_MAX_CONCURRENCY: "2"
    ports:
      - "127.0.0.1:${RENDERER_HOST_PORT:-3190}:3000"
    networks:
      - renderer-net
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SETUID
      - SETGID
      - SETPCAP
    security_opt:
      - no-new-privileges:true
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.00'
          # Chromium forks a process per renderer/GPU/utility; bounded so a hostile page cannot fork-bomb
          # the host. Lives here, not as top-level pids_limit: compose refuses both on one service.
          pids: 1024
    logging: *lobster-logging

  # HCI-30 (ADR-0021: dedicated Postgres, physically isolated from the shared Supabase instance
  # so an RLS bypass on this schema cannot reach n8n's workflow secrets on that same cluster;
  # ADR-0007 gate 1 requires this service definition to live HERE, in the single existing
  # deployment orchestration surface, not a second docker-compose*.yml under Projects/internal/hci30/).
  hci-postgres:
    image: postgres:15.8
    container_name: hci-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hci_wave1_synthetic
      POSTGRES_USER: hci_owner
      # ADR-0021 gate 3: own dedicated secret, never the shared ${POSTGRES_PASSWORD} that every
      # Supabase-instance service already reuses (lobster-factory/infra/supabase/docker-compose.yml).
      POSTGRES_PASSWORD: ${HCI_DB_PASSWORD:?hci-postgres requires its own dedicated password, distinct from the shared Supabase POSTGRES_PASSWORD}
    volumes:
      # ADR-0021 gate 1: own hci_-prefixed named volume, never a path under infra/supabase/volumes/
      # (tests/architecture/hci-db-isolation.test.mjs enforces this).
      - hci_pgdata:/var/lib/postgresql/data
    networks:
      # Private link to hci-app only -- no lobster-net membership, no published host port. Nothing
      # else in this file may reach this service (tests/architecture/hci-db-isolation.test.mjs's
      # "no unexpected consumer" check enforces this at review time).
      - hci-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hci_owner -d hci_wave1_synthetic"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          # ADR-0021 gate 5: pattern copied from supabase-db's own 768m/1.0
          # (lobster-factory/infra/supabase/docker-compose.yml) -- same-scale workload, same limit.
          memory: 768M
          cpus: '1.00'
    logging: *lobster-logging

  # HCI-30's app/server.mjs (Express REST API). Joins BOTH networks: hci-net to reach its own
  # database, lobster-net (external) so nginx can reach it by name -- same dual-membership pattern
  # cognitive-os-api already uses for the identical reason.
  hci-app:
    build:
      # `./apps/hci-app`, matching every other service's convention (relative to THIS compose
      # file's own directory on the deploy host, $STAGING_DIR -- sg-deploy.sh rsyncs source there,
      # it does not run from inside a live git checkout at a fixed relative depth). A
      # git-repo-relative `../../../../Projects/internal/hci30` path (this block's own first draft)
      # validates fine with `docker compose config` run from inside the git repo, but silently
      # resolves to nothing useful on the real host, where this compose file lives at
      # /root/lobster-phase1/docker-compose.yml with no such git ancestry above it -- caught before
      # any deploy attempt, not after. The staged copy here holds the WHOLE hci30 product tree
      # (app/, packages/, public-intelligence/, infra/local/fetch-runner),
      # not just app/ -- see this Dockerfile's own header for why the build context must be the
      # whole tree. hci-fetch-runner below builds from a sub-path of this SAME
      # staged copy, for the identical reason.
      context: ./apps/hci-app
      dockerfile: Dockerfile
    image: hci30-app:local
    container_name: hci-app
    restart: unless-stopped
    ports:
      # sg-deploy.sh's own smoke-check needs a host-reachable port to curl directly (same
      # `${..._HOST_PORT:-...}` + runtime `docker port` resolution pattern node-api already uses,
      # not a hardcoded assumption) -- independent of whether nginx/DNS for hci.aware-wave.com are
      # wired up yet, so a code deploy's own health can be verified before that separate step exists.
      - "${HCI_APP_HOST_PORT:-127.0.0.1:4030}:4030"
    environment:
      PORT: "4030"
      HCI_DB_HOST: hci-postgres
      HCI_DB_PORT: "5432"
      HCI_DB_USER: hci_owner
      HCI_DB_PASSWORD: ${HCI_DB_PASSWORD:?hci-app needs the same value as hci-postgres's own POSTGRES_PASSWORD above}
      HCI_DB_NAME: hci_wave1_synthetic
      # Internal service DNS on hci-fetch-runner-net (this service's own networks: list below), not
      # host.docker.internal + the published host port -- 2026-09-18 prod incident: a 127.0.0.1-only
      # host-port publish does not accept a connection arriving via the docker bridge gateway on this
      # (Linux) host, so hci-app got "fetch failed" for every real request. The published host port
      # (hci-fetch-runner's own ports: block) stays for host-side/SSH debugging only, never the
      # runtime call path. Joining hci-fetch-runner-net does not weaken ADR-0029 gate 2 ("no route
      # to the docker-internal bridge network" for the RUNNER's own egress): network membership does
      # not grant the runner any new outbound route to hci-net/lobster-net just because hci-app is
      # dual-homed, and the runner's iptables rules (its entrypoint.sh) only ever touch the OUTPUT
      # chain -- inbound reachability to the runner was never the thing gate 2 restricts.
      HCI_FETCH_RUNNER_BASE_URL: http://hci-fetch-runner:8090
      HCI_FETCH_RUNNER_SHARED_SECRET: ${HCI_FETCH_RUNNER_SHARED_SECRET:?hci-app needs the same value as hci-fetch-runner's own shared secret below}
    depends_on:
      hci-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4030/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - hci-net
      - lobster-net
      - hci-fetch-runner-net
    deploy:
      resources:
        limits:
          # Same scale as node-api (Express + pg, no build/SSR overhead) -- not next-admin's Next.js
          # footprint, which this service has nothing in common with.
          memory: 512M
          cpus: '0.50'
    logging: *lobster-logging

  # ADR-0029 gate 1: "its own container/service definition inside the existing docker-compose
  # stack" -- moved here from Projects/internal/hci30/infra/local/compose.fetch-runner.yml's local
  # dev-only file for prod (that file stays local/test-only; ks-aw-01 runs from this block instead,
  # so there is exactly one deployment orchestration surface per ADR-0007 gate 1, not two).
  # Egress policy: applied by this container's OWN entrypoint on every start
  # (apps/hci-app/infra/local/fetch-runner/entrypoint.sh), which then drops to uid `node` with an empty
  # capability bounding set + no_new_privs before node runs (ADR-0029 "Where the egress policy is
  # applied", 2026-09-21). Replaced the one-shot hci-network-guard sidecar, whose rules vanished with
  # the netns on any runner restart and never came back. The cap_add entries exist only for that
  # entrypoint; restart: unless-stopped is safe precisely because every start re-applies the policy.
  hci-fetch-runner:
    build:
      # Sub-path of hci-app's own staged copy (./apps/hci-app/...) -- see that service's build
      # context comment for why a git-repo-relative path here would not resolve on the real host.
      context: ./apps/hci-app/infra/local/fetch-runner
    container_name: hci-fetch-runner
    environment:
      HCI_FETCH_RUNNER_SHARED_SECRET: ${HCI_FETCH_RUNNER_SHARED_SECRET:?fetch runner requires a generated shared secret}
      HCI_FETCH_RUNNER_PORT: "8090"
      HCI_FETCH_RUNNER_MINIO_IP: ${HCI_FETCH_RUNNER_MINIO_IP:?fetch runner requires the object-storage container's static IP to allowlist}
      HCI_FETCH_RUNNER_MINIO_ENDPOINT: http://${HCI_FETCH_RUNNER_MINIO_IP:?fetch runner requires the object-storage container's static IP}:9000
      HCI_FETCH_RUNNER_MINIO_BUCKET: hci-fetch-runner-raw
      HCI_FETCH_RUNNER_MINIO_ACCESS_KEY: ${HCI_FETCH_RUNNER_MINIO_ROOT_USER:?fetch runner requires the object-storage root user}
      HCI_FETCH_RUNNER_MINIO_SECRET_KEY: ${HCI_FETCH_RUNNER_MINIO_ROOT_PASSWORD:?fetch runner requires the object-storage root password}
    ports:
      # 127.0.0.1-only, never 0.0.0.0 -- host-side/SSH debugging only (curl from the host shell).
      # hci-app (the one real caller) reaches this service over hci-fetch-runner-net's internal DNS
      # (http://hci-fetch-runner:8090, that service's own environment block) instead, since a
      # 127.0.0.1-bound publish never accepts a connection arriving via the docker bridge gateway --
      # see hci-app's own HCI_FETCH_RUNNER_BASE_URL comment for the 2026-09-18 incident this replaced.
      - "127.0.0.1:${HCI_FETCH_RUNNER_HOST_PORT:-8190}:8090"
    networks:
      - hci-fetch-runner-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETUID
      - SETGID
      - SETPCAP
    security_opt:
      - no-new-privileges:true
    logging: *lobster-logging

  # Dedicated object storage for hci-fetch-runner's raw fetched content -- NOT the same instance as
  # Trigger.dev's own internal MinIO (lobster-factory/infra/trigger/docker-compose.yml's `minio`
  # service): separate image pull, separate network, separate volume, separate credentials.
  hci-object-storage:
    # Pinned by digest, not `:latest` -- this instance holds raw, attacker-influenced fetched
    # content, the same risk class this repo already pins ClickHouse against (agency-os/AGENTS.md).
    # Same digest already validated locally (infra/local/compose.fetch-runner.yml) -- not re-chosen
    # here, re-used, so the prod image is byte-identical to what the local isolation tests exercised.
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    container_name: hci-object-storage
    environment:
      MINIO_ROOT_USER: ${HCI_FETCH_RUNNER_MINIO_ROOT_USER:?object storage requires a generated root user}
      MINIO_ROOT_PASSWORD: ${HCI_FETCH_RUNNER_MINIO_ROOT_PASSWORD:?object storage requires a generated root password}
      MINIO_DEFAULT_BUCKETS: hci-fetch-runner-raw
    networks:
      hci-fetch-runner-net:
        ipv4_address: ${HCI_FETCH_RUNNER_MINIO_IP:?object storage requires a generated static IP}
    volumes:
      - hci_fetch_runner_objectstore:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *lobster-logging

networks:
  lobster-net:
    name: lobster-net
    external: true
  observability:
    name: lobster-phase1_observability
    external: true
  # Private hci-postgres <-> hci-app link only. Explicit subnet outside 172.16.0.0/12 (ks-aw-01's
  # entire default Docker address pool -- all 15 /16s -- is already occupied by other networks;
  # verified via `ip route show`, no 10.x route exists on that host today). Local dev is
  # unaffected: this network only exists in this file, never in infra/local/compose.dev.yml.
  hci-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${HCI_NET_SUBNET:-10.240.0.0/24}
  # ADR-0029's isolated network -- deliberately NOT external, shares nothing by name with
  # lobster-net/observability/trigger/n8n. Do not add hci-app (or anything else) to this network's
  # membership list; that would defeat the isolation this network exists to provide. Same
  # enable_ipv6:false + explicit-subnet reasoning as the local dev version
  # (Projects/internal/hci30/infra/local/compose.fetch-runner.yml), subnet moved to a free /24
  # outside 172.16.0.0/12 for the same reason as hci-net above.
  hci-fetch-runner-net:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${HCI_FETCH_RUNNER_SUBNET:-10.240.1.0/24}
  # renderer's network: members are renderer + next-admin (its only caller), nothing else. Same shape
  # as hci-fetch-runner-net above: explicit /24 outside 172.16.0.0/12, no IPv6.
  renderer-net:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${RENDERER_NET_SUBNET:-10.240.2.0/24}

volumes:
  redis_data:
  n8n_data:
  wordpress_db_data:
  hci_pgdata:
  hci_fetch_runner_objectstore:
  wordpress_data:

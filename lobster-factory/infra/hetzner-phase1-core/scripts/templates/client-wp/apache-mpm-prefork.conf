# Apache prefork for client WordPress sites. 12 workers x memory_limit 512M can exceed the 2G container limit only
# if every worker peaks at once; typical WordPress requests use 40-120M. Raise together with the compose limit.
<IfModule mpm_prefork_module>
	StartServers             2
	MinSpareServers          2
	MaxSpareServers          4
	MaxRequestWorkers       12
	MaxConnectionsPerChild 500
</IfModule>

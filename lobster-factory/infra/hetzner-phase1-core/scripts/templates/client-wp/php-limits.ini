; PHP limits for client WordPress sites (Dockerfile in this directory). Upload sizes must stay <= the vhost's
; client_max_body_size (vhost.conf.tmpl), or nginx answers 413 before PHP sees the upload.
memory_limit        = 512M
upload_max_filesize = 256M
post_max_size       = 256M
; Settings forms of plugin suites post more than PHP's default 1000 fields; the excess is dropped silently.
max_input_vars      = 5000
max_execution_time  = 300
date.timezone       = UTC
; PHP advisory 2026-10-23: apply before request parsing (CVE-2026-115560); asserted by the Dockerfile.
session.upload_progress.enabled = 0

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>會議錄音處理（本機）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --accent: #6366f1; --accent-hover: #4f52e0;
    --ink: #0d1526; --muted: #475569;
    --bg: #f2f5fb; --card: #ffffff; --border: #e6eaf4;
    --green: #10b981; --red: #ef4444; --yellow: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--ink); padding: 32px 20px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; margin-bottom: 16px;
  }
  #drop {
    border: 2px dashed var(--border); border-radius: 10px; padding: 40px 20px;
    text-align: center; cursor: pointer; transition: border-color .15s;
  }
  #drop.drag { border-color: var(--accent); background: #eef1ff; }
  #drop p { margin: 6px 0; color: var(--muted); font-size: 14px; }
  #drop .big { font-size: 15px; color: var(--ink); font-weight: 600; }
  input[type=file] { display: none; }
  .opts { display: flex; gap: 20px; margin-top: 16px; font-size: 13px; align-items: center; }
  .opts label { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
  select {
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 13px;
  }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 16px;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: #cbd5e1; cursor: not-allowed; }
  .stage-list { list-style: none; padding: 0; margin: 0; }
  .stage-list li {
    display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; color: var(--muted);
  }
  .stage-list li.active { color: var(--ink); font-weight: 600; }
  .stage-list li.done { color: var(--green); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex: none; }
  .stage-list li.active .dot { background: var(--accent); }
  .stage-list li.done .dot { background: var(--green); }
  pre#log {
    background: #07101f; color: #9fe3b0; font-size: 11px; line-height: 1.5;
    padding: 12px; border-radius: 8px; max-height: 220px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all; margin-top: 12px;
  }
  .downloads { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .downloads a {
    display: inline-block; padding: 8px 14px; border-radius: 8px; font-size: 13px;
    text-decoration: none; background: var(--bg); border: 1px solid var(--border); color: var(--ink);
  }
  .downloads a:hover { border-color: var(--accent); color: var(--accent); }
  .err { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 12px; border-radius: 8px; font-size: 13px; white-space: pre-wrap; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #e0f2fe; color: #0369a1; }
  .step-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff;
    font-size: 12px; font-weight: 700; margin-right: 8px;
  }
  textarea {
    width: 100%; box-sizing: border-box; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; font-size: 12px; font-family: Consolas, monospace; resize: vertical;
  }
  #promptBox { height: 160px; background: #f8fafc; color: var(--muted); }
  #pasteBack { height: 140px; }
  .copyBtn {
    background: var(--bg); color: var(--ink); border: 1px solid var(--border);
    padding: 6px 14px; font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 8px;
  }
  .copyBtn:hover { border-color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>會議錄音處理 <span class="badge">僅限本機</span></h1>
  <p class="sub">上傳 → 轉錄 → 講者分離 → 會議記錄 → PPT → 報告教練。全程在這台機器執行，音檔不外流。</p>

  <div class="card" id="uploadCard">
    <div id="drop">
      <p class="big">拖拉檔案到這裡，或點擊選擇</p>
      <p>支援 mp4 / m4a / mp3 / wav / mov / mkv / webm，上限 500MB</p>
      <input type="file" id="fileInput" accept=".mp4,.m4a,.mp3,.wav,.mov,.mkv,.webm,.aac,.flac">
    </div>
    <div class="opts">
      <label><input type="checkbox" id="diarizeOpt" checked> 講者分離（需 HF_TOKEN，較慢）</label>
      <label>模型
        <select id="modelOpt">
          <option value="large-v3" selected>large-v3（準）</option>
          <option value="medium">medium（快）</option>
        </select>
      </label>
    </div>
    <button id="startBtn" disabled>開始處理</button>
  </div>

  <div class="card" id="progressCard" style="display:none">
    <ul class="stage-list" id="stageList"></ul>
    <pre id="log"></pre>
  </div>

  <div class="card" id="summaryCard" style="display:none">
    <p><span class="step-num">1</span><b>複製下面這段 prompt</b>，貼進任一 Claude 對話視窗（用你的訂閱額度，不額外收費）</p>
    <textarea id="promptBox" readonly></textarea>
    <button class="copyBtn" id="copyPromptBtn">複製 prompt</button>

    <p style="margin-top:20px"><span class="step-num">2</span><b>把 Claude 回傳的 JSON 貼在這裡</b>，按送出</p>
    <textarea id="pasteBack" placeholder="貼上 Claude 回傳的完整 JSON..."></textarea>
    <button class="copyBtn" id="submitSummaryBtn" style="background:var(--accent);color:#fff;border:none">送出，繼續產生 PPT</button>
    <div id="summaryErr"></div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div id="resultBody"></div>
  </div>
</div>

<script>
const STAGES = [
  ["preflight","檢查檔案"], ["transcribe","轉錄"], ["merge","段落合併"],
  ["hallucination_check","幻覺偵測"], ["diarize","講者分離"], ["preparing_prompt","準備摘要 prompt"],
  ["awaiting_summary","等待貼上摘要"], ["build_deck","生成 PPT"], ["build_notes","寫入講稿"],
  ["build_minutes_md","會議記錄"], ["done","完成"],
];
const DOWNLOAD_LABELS = {
  minutes_md: "會議記錄 (.md)", slides: "PPT (.pptx)", coach: "報告教練 (.md)",
  transcript_srt: "字幕檔 (.srt)", diarized_txt: "逐字稿-含講者 (.txt)", merged_txt: "逐字稿 (.txt)",
};

let file = null;
const drop = document.getElementById("drop");
const fileInput = document.getElementById("fileInput");
const startBtn = document.getElementById("startBtn");

drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("drag"); });
drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
drop.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("drag");
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", () => { if (fileInput.files.length) setFile(fileInput.files[0]); });

function setFile(f) {
  file = f;
  drop.querySelector(".big").textContent = `已選擇：${f.name}（${(f.size/1048576).toFixed(1)} MB）`;
  startBtn.disabled = false;
}

startBtn.addEventListener("click", async () => {
  if (!file) return;
  startBtn.disabled = true;
  const diarize = document.getElementById("diarizeOpt").checked;
  const model = document.getElementById("modelOpt").value;

  const fd = new FormData();
  fd.append("file", file);

  document.getElementById("uploadCard").style.display = "none";
  document.getElementById("progressCard").style.display = "block";
  renderStages("preflight");

  let resp;
  try {
    resp = await fetch(`/api/upload?diarize=${diarize}&model=${model}`, { method: "POST", body: fd });
  } catch (e) {
    showError("上傳失敗：" + e);
    return;
  }
  if (!resp.ok) {
    const body = await resp.json().catch(() => ({}));
    showError(body.detail || `上傳失敗（HTTP ${resp.status}）`);
    return;
  }
  const { job_id } = await resp.json();
  poll(job_id);
});

function renderStages(activeStage, doneSet) {
  doneSet = doneSet || new Set();
  const idx = STAGES.findIndex(([k]) => k === activeStage);
  document.getElementById("stageList").innerHTML = STAGES.map(([k, label], i) => {
    let cls = "";
    if (doneSet.has(k) || i < idx) cls = "done";
    else if (k === activeStage) cls = "active";
    return `<li class="${cls}"><span class="dot"></span>${label}</li>`;
  }).join("");
}

let currentJobId = null;

async function poll(jobId) {
  currentJobId = jobId;
  const seen = new Set();
  const timer = setInterval(async () => {
    const [statusResp, logResp] = await Promise.all([
      fetch(`/api/status/${jobId}`), fetch(`/api/log/${jobId}?lines=40`),
    ]);
    const status = await statusResp.json();
    const log = await logResp.json();

    for (const [k] of STAGES) {
      const i = STAGES.findIndex(([kk]) => kk === status.stage);
      const j = STAGES.findIndex(([kk]) => kk === k);
      if (j < i) seen.add(k);
    }
    renderStages(status.stage, seen);
    document.getElementById("log").textContent = log.lines.join("\n");
    document.getElementById("log").scrollTop = 999999;

    if (status.error) {
      clearInterval(timer);
      showError(status.error);
      return;
    }
    if (status.stage === "awaiting_summary" && !status.done) {
      clearInterval(timer);
      await showSummaryStep(jobId);
      return;
    }
    if (status.done) {
      clearInterval(timer);
      showResult(jobId, status);
    }
  }, 1500);
}

async function showSummaryStep(jobId) {
  document.getElementById("progressCard").style.display = "none";
  document.getElementById("summaryCard").style.display = "block";
  const resp = await fetch(`/api/prompt/${jobId}`);
  const text = await resp.text();
  document.getElementById("promptBox").value = text;
}

document.getElementById("copyPromptBtn").addEventListener("click", () => {
  const box = document.getElementById("promptBox");
  box.select();
  navigator.clipboard.writeText(box.value).then(() => {
    document.getElementById("copyPromptBtn").textContent = "已複製 ✓";
    setTimeout(() => { document.getElementById("copyPromptBtn").textContent = "複製 prompt"; }, 1500);
  });
});

document.getElementById("submitSummaryBtn").addEventListener("click", async () => {
  const text = document.getElementById("pasteBack").value.trim();
  const errBox = document.getElementById("summaryErr");
  errBox.innerHTML = "";
  if (!text) { errBox.innerHTML = '<div class="err">還沒貼東西</div>'; return; }

  const btn = document.getElementById("submitSummaryBtn");
  btn.disabled = true; btn.textContent = "處理中...";
  try {
    const resp = await fetch(`/api/submit-summary/${currentJobId}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      errBox.innerHTML = `<div class="err">${body.detail || ("HTTP " + resp.status)}</div>`;
      btn.disabled = false; btn.textContent = "送出，繼續產生 PPT";
      return;
    }
    document.getElementById("summaryCard").style.display = "none";
    document.getElementById("progressCard").style.display = "block";
    renderStages("build_deck", new Set(["preflight","transcribe","merge","hallucination_check","diarize","preparing_prompt","awaiting_summary"]));
    // build_deck/notes/minutes_md 是同步跑完才回應的，回應到達就代表 done
    const s = await (await fetch(`/api/status/${currentJobId}`)).json();
    showResult(currentJobId, s);
  } catch (e) {
    errBox.innerHTML = `<div class="err">送出失敗：${e}</div>`;
    btn.disabled = false; btn.textContent = "送出，繼續產生 PPT";
  }
});

function showError(msg) {
  document.getElementById("resultCard").style.display = "block";
  document.getElementById("resultBody").innerHTML = `<div class="err">${msg}</div>`;
}

function showResult(jobId, status) {
  document.getElementById("resultCard").style.display = "block";
  let html = "";
  if (status.transcribe_stats) {
    const s = status.transcribe_stats;
    html += `<p class="hint">轉錄 ${s.realtime_factor}x realtime（${s.backend}）`;
    if (status.diarize_stats) {
      html += ` · 講者 ${status.diarize_stats.speakers.join("/")} · 重疊語音 ${status.diarize_stats.overlap_sec.toFixed(0)}s`;
    }
    if (status.diarize_error) {
      html += ` · <span style="color:var(--red)">講者分離失敗，已略過（${status.diarize_error}）</span>`;
    }
    html += "</p>";
  }
  html += `<div class="downloads">${Object.entries(DOWNLOAD_LABELS).map(([kind, label]) =>
    `<a href="/api/download/${jobId}/${kind}" target="_blank">${label}</a>`).join("")}</div>`;
  document.getElementById("resultBody").innerHTML = html;
}
</script>
</body>
</html>

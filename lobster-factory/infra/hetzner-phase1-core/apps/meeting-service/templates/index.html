<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>會議工具（本機）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --accent: #6366f1; --accent-hover: #4f52e0;
    --ink: #0d1526; --muted: #475569;
    --bg: #f2f5fb; --card: #ffffff; --border: #e6eaf4;
  }
  body {
    margin: 0; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--ink); padding: 48px 20px;
  }
  .wrap { max-width: 560px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
  a.go { display: inline-block; background: var(--accent); color: var(--card); text-decoration: none; border-radius: 8px; padding: 10px 20px; font-size: 15px; font-weight: 600; }
  a.go:hover { background: var(--accent-hover); }
</style>
</head>
<body>
<div class="wrap">
  <h1>會議工具（僅限本機）</h1>
  <p>聆聽、會後整理（上傳音檔、舊場次、聆聽場次）、工作清單與設定，都在會議工作區的面板裡。</p>
  <a class="go" href="/workspace">會議工作區 →</a>
</div>
</body>
</html>

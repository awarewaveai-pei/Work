<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>會議工作區（本機）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --accent: #6366f1; --accent-hover: #4f52e0;
    --ink: #0d1526; --muted: #475569;
    --bg: #f2f5fb; --card: #ffffff; --border: #e6eaf4;
    --green: #10b981; --red: #ef4444; --yellow: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #topbar {
    flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--border);
  }
  #topbar h1 { font-size: 16px; margin: 0 8px 0 0; }
  #topbar .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
  #topbar .spacer { flex: 1; }
  #topbar a.home { color: var(--muted); font-size: 13px; text-decoration: none; }
  #topbar a.home:hover { color: var(--accent); }
  .tbtn {
    background: var(--bg); color: var(--muted); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .tbtn:hover { border-color: var(--accent); color: var(--accent); }
  .tbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tbtn[aria-pressed="true"]:hover { background: var(--accent-hover); color: #fff; }
  #dock { flex: 1; min-height: 0; }

  /* dockview 主題色對到本站的 CSS 變數；沿用內建 light 主題，只覆寫顏色與間距 */
  .dockview-theme-light.aw-dock {
    --dv-group-view-background-color: var(--card);
    --dv-tabs-and-actions-container-background-color: var(--bg);
    --dv-activegroup-visiblepanel-tab-background-color: var(--card);
    --dv-activegroup-hiddenpanel-tab-background-color: var(--bg);
    --dv-inactivegroup-visiblepanel-tab-background-color: var(--card);
    --dv-inactivegroup-hiddenpanel-tab-background-color: var(--bg);
    --dv-tab-divider-color: var(--border);
    --dv-activegroup-visiblepanel-tab-color: var(--ink);
    --dv-activegroup-hiddenpanel-tab-color: var(--muted);
    --dv-inactivegroup-visiblepanel-tab-color: var(--muted);
    --dv-inactivegroup-hiddenpanel-tab-color: var(--muted);
    --dv-separator-border: var(--border);
    --dv-sash-color: var(--border);
    --dv-active-sash-color: var(--accent);
    --dv-active-sash-transition-duration: 0.1s;
    --dv-active-sash-transition-delay: 0s;
    --dv-drag-over-background-color: rgba(99, 102, 241, 0.18);
    --dv-drag-over-border-color: var(--accent);
    --dv-tabs-and-actions-container-font-size: 13px;
    --dv-tabs-and-actions-container-height: 34px;
    background: var(--bg);
  }
  .panel-body { height: 100%; overflow: auto; padding: 16px; font-size: 14px; color: var(--ink); }
  .panel-body .placeholder { color: var(--muted); font-size: 13px; }
  a.tbtn { text-decoration: none; display: inline-block; }
  .tbtn:disabled { opacity: 0.55; cursor: default; }
  .spacer { flex: 1; }

  .cap { height: 100%; display: flex; flex-direction: column; }
  .cap-bar { flex: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .cap-bar .tbtn { padding: 5px 10px; font-size: 12px; }
  .cap-group { display: inline-flex; gap: 2px; padding-left: 6px; border-left: 1px solid var(--border); }
  .cap-langs .cap-group { flex-wrap: wrap; align-items: center; }
  .cap-langs .cap-group:first-child { padding-left: 0; border-left: none; }
  .cap-langs .cap-lbl { font-size: 12px; color: var(--muted); margin-right: 4px; }
  .cap-listen[aria-pressed="true"] { background: var(--red); border-color: var(--red); }
  .cap-listen[aria-pressed="true"]:hover { background: var(--red); }
  .cap-level { font-size: 12px; color: var(--green); letter-spacing: 1px; min-width: 52px; }
  .cap-seg { display: inline-flex; gap: 4px; align-items: center; padding-left: 6px; border-left: 1px solid var(--border); }
  .cap-seg[hidden], .cap-seg [hidden] { display: none; }
  .cap-segname.rec { color: var(--red); }
  .cap-segedit { width: 160px; font: inherit; font-size: 12px; padding: 4px 8px; border: 1px solid var(--accent); border-radius: 8px; color: var(--ink); background: var(--card); }
  .cap-list .divider { margin: 14px 0 10px; color: var(--muted); font-size: 0.8em; text-align: center; overflow-wrap: anywhere; }
  .cap-list { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px; line-height: 1.5; }
  .cap-list .seg { margin-bottom: 12px; }
  .cap-list .text { color: var(--ink); }
  .cap-list .interim .text { color: var(--muted); }
  .cap-list .tr { color: var(--accent-hover); min-height: 1em; }
  .cap-list.tr-only .text { display: none; }
  .cap-foot { flex: none; display: flex; gap: 12px; padding: 6px 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .cap-usage { white-space: nowrap; }
  .cap-sum { white-space: nowrap; color: var(--yellow); font-weight: 600; }
  .cap-foot { align-items: center; flex-wrap: wrap; }
  .cap-idle { white-space: nowrap; }
  .cap-idle input { width: 44px; font: inherit; padding: 1px 4px; border: 1px solid var(--border); border-radius: 6px; color: var(--ink); background: var(--card); }

  .rp { height: 100%; display: flex; flex-direction: column; }
  .rp-bar { flex: none; display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .rp-bar .tbtn { padding: 5px 10px; font-size: 12px; }
  .rp-view { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; }
  .rp-zh { color: var(--muted); font-size: 13px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 6px; }
  .rp-en { font-weight: 600; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
  .rp-in {
    flex: none; height: 84px; margin: 0 10px 10px; resize: vertical; font: inherit; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px; color: var(--ink); background: var(--card);
  }
  .rp-in:focus, .sc-src:focus, .sc-gl:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .sc { height: 100%; display: flex; flex-direction: column; }
  .sc [hidden] { display: none !important; }
  .sc-bar { flex: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .sc-bar .tbtn { padding: 5px 10px; font-size: 12px; }
  .sc-tabs { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .sc-note { flex: none; padding: 4px 12px; font-size: 12px; color: var(--muted); }
  .sc-note:empty { display: none; }
  .sc-src, .sc-gl {
    flex: none; margin: 6px 10px 0; resize: vertical; font: 13px/1.5 Consolas, "Microsoft JhengHei", monospace; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px; color: var(--ink); background: var(--card);
  }
  .sc-src { flex: 1 1 50%; min-height: 90px; resize: none; }
  .sc-gl { height: 110px; }
  .sc-body { flex: 1 1 50%; min-height: 0; overflow-y: auto; padding: 8px 16px 16px; }
  .sc-body .empty { color: var(--muted); font-size: 13px; padding: 16px 0; }
  .sc-body h2 { font-size: 1.25em; margin: 18px 0 6px; }
  .sc-body .sub { color: var(--accent); font-weight: 600; margin: 14px 0 4px; }
  .sc-body .cue { color: var(--muted); font-size: 0.87em; margin: 2px 0 4px; }
  .sc-body .line { font-size: 1.33em; line-height: 1.4; margin: 6px 0 2px; }
  .sc-body .question { font-size: 1.2em; font-weight: 600; line-height: 1.4; color: var(--accent); margin: 16px 0 2px; }
  .sc-body .gloss { color: var(--accent-hover); margin: 0 0 12px; }
  .sc-body .copy { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin: 4px 0 10px; }
  .sc-body .copy pre { margin: 0 0 6px; white-space: pre-wrap; overflow-wrap: anywhere; font: 0.9em/1.4 Consolas, monospace; }
  .sc-body .copy .tbtn { padding: 3px 10px; font-size: 12px; }

  .sm { height: 100%; display: flex; flex-direction: column; }
  .sm-bar { flex: none; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .sm-bar .tbtn { padding: 5px 10px; font-size: 12px; }
  .sm-every { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .sm-every input { width: 48px; font: inherit; padding: 1px 4px; border: 1px solid var(--border); border-radius: 6px; color: var(--ink); background: var(--card); }
  .sm-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px; line-height: 1.6; }
  .sm-body ul { margin: 0; padding-left: 20px; }
  .sm-body li { margin-bottom: 6px; overflow-wrap: anywhere; }
  .sm-foot { flex: none; padding: 6px 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); min-height: 30px; }

  .lookup { display: flex; flex-direction: column; gap: 10px; }
  .lk-q {
    flex: none; min-height: 56px; width: 100%; resize: vertical; font: inherit; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px; color: var(--ink); background: var(--card);
  }
  .lk-q:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .lk-btns { flex: none; display: flex; gap: 8px; flex-wrap: wrap; }
  .lk-answer { white-space: pre-wrap; line-height: 1.6; background: var(--bg); border-radius: 8px; padding: 10px 12px; }
  .lk-item { padding: 8px 0; border-top: 1px solid var(--border); }
  .lk-item a { color: var(--accent); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
  .lk-item a:hover { text-decoration: underline; }
  .lk-item p { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>
<div id="topbar">
  <h1>會議工作區 <span style="font-size:11px;font-weight:400;color:var(--muted)">僅限本機</span></h1>
  <span class="sep"></span>
  <button class="tbtn" type="button" data-panel="captions" aria-pressed="true">字幕</button>
  <button class="tbtn" type="button" data-panel="reply" aria-pressed="true">回覆</button>
  <button class="tbtn" type="button" data-panel="script" aria-pressed="true">講稿</button>
  <button class="tbtn" type="button" data-panel="lookup" aria-pressed="true">查詢</button>
  <button class="tbtn" type="button" data-panel="summary" aria-pressed="true">摘要</button>
  <button class="tbtn" type="button" data-panel="settings" aria-pressed="true">設定</button>
  <button class="tbtn" type="button" data-panel="post" aria-pressed="true">會後整理</button>
  <span class="sep"></span>
  <button class="tbtn" type="button" id="resetLayout">恢復預設版面</button>
  <span class="spacer"></span>
  <a class="home" href="/">← 回首頁</a>
</div>
<div id="dock" class="aw-dock"></div>

<!-- 面板擴充點：後面的卡只填自己的 <template> 與自己的 <script> 區塊，互不干擾。
     面板每次被打開（含重新整理、關掉再開）都會複製 template 內容，再呼叫
     Workspace.onPanel(id, fn)，fn(root) 的 root 是該面板的根元素；
     事件與狀態請綁在 root 底下，不要用全域 id 選取（面板可能被關閉後重建）。 -->
<script>
window.Workspace = (function () {
  const handlers = {};
  // 與伺服器的唯一一條 WebSocket，字幕／回覆／講稿面板共用。
  // live.on(type, fn)：伺服器事件（snapshot、caption、reply、script…）；另有 "close" = 連線斷了（約 2 秒後自動重連）。
  const listeners = {};
  let ws = null;
  function emit(type, ev) { (listeners[type] || []).forEach(fn => fn(ev)); }
  const live = {
    on(type, fn) { (listeners[type] = listeners[type] || []).push(fn); },
    ready() { return !!ws && ws.readyState === 1; },
    send(obj) { if (live.ready()) ws.send(JSON.stringify(obj)); },
    sendBinary(buf) { if (live.ready()) ws.send(buf); },
    connect() {
      ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/live/ws");
      ws.binaryType = "arraybuffer";
      ws.onmessage = e => { const ev = JSON.parse(e.data); emit(ev.type, ev); };
      ws.onclose = () => { emit("close", {}); setTimeout(live.connect, 2000); };
    },
  };
  return {
    live,
    // 按「聆聽」時，每個函式回傳的欄位會併進 start 指令（例如摘要面板的開關）。
    startExtras: [],
    onPanel(id, fn) { (handlers[id] = handlers[id] || []).push(fn); },
    mount(id, root) { (handlers[id] || []).forEach(fn => fn(root)); },
  };
})();
</script>
<!-- settings-panel -->
<script>window.Workspace.onPanel("settings", root => window.Settings.mount(root));</script>

<template id="tpl-captions">
  <div class="cap">
    <div class="cap-bar">
      <button type="button" class="tbtn cap-listen" data-act="listen" aria-pressed="false">▶ 聆聽</button>
      <span class="cap-group" title="聲音從哪裡來，可以兩個都開">
        <button type="button" class="tbtn" data-src="mic" aria-pressed="true">麥克風</button>
        <button type="button" class="tbtn" data-src="tab" aria-pressed="false">電腦聲音</button>
      </span>
      <span class="cap-group" title="誰來聽寫">
        <button type="button" class="tbtn" data-stt="gemini" aria-pressed="true">Gemini（計費）</button>
        <button type="button" class="tbtn" data-stt="local" aria-pressed="false">本機（免費）</button>
      </span>
      <button type="button" class="tbtn" data-act="save" aria-pressed="true" title="把錄音和逐字稿存到「文件 › OwnVoice Meet」，停止後在「會後整理」面板直接整理（不用重新辨識）。聆聽中不能改">存檔</button>
      <span class="cap-seg" hidden>
        <button type="button" class="tbtn cap-segname" data-act="segname"></button>
        <input type="text" class="cap-segedit" maxlength="80" aria-label="段落名稱，Enter 確認，Esc 取消" hidden>
        <button type="button" class="tbtn" data-act="segnext" title="結束這一段：錄音和逐字稿從新的一段開始">新段落</button>
      </span>
      <span class="cap-level" aria-hidden="true"></span>
      <span class="spacer"></span>
      <button type="button" class="tbtn" data-act="tr-only" aria-pressed="false">只看翻譯</button>
      <button type="button" class="tbtn" data-act="smaller" title="字小一點">A−</button>
      <button type="button" class="tbtn" data-act="bigger" title="字大一點">A＋</button>
      <button type="button" class="tbtn" data-act="clear">清除</button>
    </div>
    <div class="cap-bar cap-langs">
      <span class="cap-group" data-langs="listen" title="對方說的語言。「自動」讓辨識自己判斷。聆聽中不能改"><span class="cap-lbl">聽的語言</span></span>
      <span class="cap-group" data-langs="target" title="字幕翻譯成什麼語言；已經是這個語言的句子不翻譯、不計費。聆聽中不能改"><span class="cap-lbl">翻譯成</span></span>
    </div>
    <div class="cap-list" aria-live="polite"></div>
    <div class="cap-foot">
      <span class="cap-status"></span><span class="spacer"></span>
      <span class="cap-sum" hidden title="這場聆聽有開「會議中摘要」，每隔幾分鐘會呼叫一次 AI，每次都計費">摘要計費中</span>
      <label class="cap-idle" title="Gemini 連線中，安靜也照秒計費。這麼久沒有新字幕就先斷開不計費，有人說話會自動接回。0 = 不暫停">安靜 <input type="number" data-idle="pauseMin" min="0" max="120" step="1"> 分鐘暫停</label>
      <label class="cap-idle" title="這麼久沒有新字幕就自動停止聆聽。0 = 不自動結束">、<input type="number" data-idle="endMin" min="0" max="600" step="1"> 分鐘結束</label>
      <span class="cap-usage"></span>
    </div>
  </div>
</template>
<script>
// 字幕面板。連線、收音與字幕資料留在頁面層（面板關掉再開不會斷），面板只負責畫。
// 貼底捲動移植自 OwnVoice Meet src/shared/follow.ts（Apache-2.0）。
(function () {
  const RATE = 16000, CHUNK = RATE / 10, MAX_ROWS = 500, NEAR_BOTTOM_PX = 30;
  const EMPTY = "按「聆聽」開始。對方說的話會出現在這裡，翻譯跟在下面。";
  // mic／tab／trOnly 只存在這個瀏覽器；其餘是伺服器設定（兩頁共用，見 templates/_settings.html）。
  const store = window.Settings.prefs("ws-captions",
    { stt: "stt", pauseMin: "pause_min", endMin: "end_min", size: "caption_size", save: "save", listen: "listen", target: "target" },
    { mic: true, tab: false, stt: "gemini", trOnly: false, size: 18, pauseMin: 3, endMin: 30, save: true, listen: "en-US", target: "zh-TW" }, () => paintBar());
  store.rename("zhOnly", "trOnly");      // 「只看中文」改成「只看翻譯」之前存的鍵
  const prefs = store.values;
  // segment：伺服器正在存的段落（index 0 = 沒在存）；dividers：新段落的分隔線，after = 開新段時最後一句字幕的代號
  const state = { langs: null, segs: new Map(), status: "", listening: false, usage: null, level: 0, segment: { index: 0, name: "", recording: false, dir: "" }, dividers: [], renaming: false, summaryOn: false };
  let root = null, audio = null, following = true, ours = false;
  const live = window.Workspace.live;

  function setPref(name, value) {
    store.set(name, value).catch(e => { state.status = e.message; paintBar(); });
  }

  // ---------- 與伺服器的連線（連線本體在 Workspace.live，三個面板共用） ----------
  function send(obj) { live.send(obj); }
  ["snapshot", "caption", "caption-remove", "clear", "status", "listening", "usage", "segment", "summary"].forEach(t => live.on(t, handle));
  live.on("close", () => {
    stopAudio();
    state.listening = false;
    state.status = "和會議工具的連線斷了，正在重連…";
    paintBar();
  });

  function handle(ev) {
    if (ev.type === "snapshot") {
      state.segs = new Map(ev.segments.map(s => [s.id, s]));
      state.status = ev.status; state.listening = ev.listening; state.usage = ev.usage;
      state.segment = ev.segment; state.renaming = false; state.summaryOn = ev.summary.enabled; state.langs = ev.langs;
      if (!ev.listening) stopAudio();
      paintAll();
    } else if (ev.type === "caption") {
      state.segs.set(ev.id, ev);
      if (state.segs.size > MAX_ROWS) state.segs.delete(state.segs.keys().next().value);
      paintRow(ev);
    } else if (ev.type === "caption-remove") {
      state.segs.delete(ev.id);
      const row = root && root.querySelector('[data-seg="' + ev.id + '"]');
      if (row) row.remove();
      paintEmpty();
    } else if (ev.type === "summary") {
      state.summaryOn = ev.enabled; paintBar();
    } else if (ev.type === "segment") {
      const next = ev.index > state.segment.index && state.segment.index > 0;
      state.segment = ev; state.renaming = false;
      if (next) {
        const d = { after: state.segs.size ? Math.max(...state.segs.keys()) : 0, text: "── " + pad2(ev.index) + " · " + ev.name + " ──" };
        state.dividers.push(d);
        paintDivider(d);
      }
      paintSegment();
    } else if (ev.type === "clear") {
      state.segs.clear(); state.dividers = []; paintAll();
    } else if (ev.type === "status") {
      state.status = ev.text; paintBar();
    } else if (ev.type === "listening") {
      state.listening = ev.on;
      if (!ev.on) stopAudio();
      paintBar();
    } else if (ev.type === "usage") {
      state.usage = ev; paintBar();
    }
  }

  // ---------- 收音：麥克風／電腦聲音 → 16 kHz 單聲道 PCM16，每 100 ms 一包 ----------
  const WORKLET = "registerProcessor('pcm',class extends AudioWorkletProcessor{process(i){const c=i[0];if(c.length){const n=c[0].length,m=new Float32Array(n);for(const ch of c)for(let k=0;k<n;k++)m[k]+=ch[k]/c.length;this.port.postMessage(m,[m.buffer]);}return true;}});";

  async function startAudio() {
    stopAudio();
    const streams = [];
    try {
      if (prefs.tab) {
        const s = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        streams.push(s);
        if (!s.getAudioTracks().length) throw new Error("沒有取得電腦聲音。請重新按聆聽，在分享視窗勾選「同時分享音訊」");
        s.getVideoTracks().forEach(t => { t.enabled = false; });
      }
      if (prefs.mic) {
        streams.push(await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
        }));
      }
      const ctx = new AudioContext({ sampleRate: RATE });
      await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" })));
      const node = new AudioWorkletNode(ctx, "pcm");
      streams.forEach(s => ctx.createMediaStreamSource(new MediaStream(s.getAudioTracks())).connect(node));
      const buf = new Int16Array(CHUNK);
      let n = 0, sum = 0;
      node.port.onmessage = e => {
        for (const v of e.data) {
          const x = Math.max(-1, Math.min(1, v));
          buf[n++] = x * 32767;
          sum += x * x;
          if (n === CHUNK) {
            live.sendBinary(buf.slice().buffer);
            state.level = sum / CHUNK;
            paintLevel();
            n = 0; sum = 0;
          }
        }
      };
      audio = { ctx, streams };
      // 使用者在瀏覽器的分享列按了「停止分享」：整個停止。
      streams.forEach(s => s.getTracks().forEach(t => t.addEventListener("ended", () => { if (audio) listen(false); })));
      return true;
    } catch (e) {
      streams.forEach(s => s.getTracks().forEach(t => t.stop()));
      state.status = e.name === "NotAllowedError" ? "沒有拿到收音的許可（瀏覽器網址列左邊可以重新允許）" : String(e.message || e);
      paintBar();
      return false;
    }
  }

  function stopAudio() {
    if (!audio) return;
    const a = audio;
    audio = null;
    a.streams.forEach(s => s.getTracks().forEach(t => t.stop()));
    a.ctx.close();
    state.level = 0;
    paintLevel();
  }

  async function listen(on) {
    if (!on) { stopAudio(); send({ type: "stop" }); return; }
    if (!prefs.mic && !prefs.tab) { state.status = "「麥克風」和「電腦聲音」至少要開一個"; return paintBar(); }
    if (!live.ready()) { state.status = "還沒連上會議工具，等一下再按"; return paintBar(); }
    if (await startAudio()) {
      send(Object.assign({ type: "start", stt: prefs.stt, listen: prefs.listen, target: prefs.target, pause_min: prefs.pauseMin, end_min: prefs.endMin, save: prefs.save },
        ...window.Workspace.startExtras.map(f => f())));
    }
  }

  // ---------- 畫面 ----------
  function pad2(n) { return String(n).padStart(2, "0"); }
  function list() { return root && root.querySelector(".cap-list"); }
  function paintDivider(d) {
    const el = list();
    if (!el) return;
    const empty = el.querySelector(".empty");
    if (empty) empty.remove();
    const div = document.createElement("div");
    div.className = "divider";
    div.textContent = d.text;
    el.append(div);
    settle();
  }
  function paintSegment() {
    if (!root) return;
    const seg = state.segment, on = seg.index > 0;
    const wrap = root.querySelector(".cap-seg");
    wrap.hidden = !on;
    if (!on) return;
    const name = wrap.querySelector(".cap-segname"), edit = wrap.querySelector(".cap-segedit");
    name.hidden = state.renaming;
    edit.hidden = !state.renaming;
    name.textContent = (seg.recording ? "● " : "") + pad2(seg.index) + " · " + seg.name;
    name.classList.toggle("rec", seg.recording);
    name.title = (seg.recording ? "錄音中。" : "只存逐字稿。") + "點一下改名。存在 " + seg.dir;
  }
  function settle() {
    const el = list();
    if (!el || !following) return;
    ours = true;
    el.scrollTop = el.scrollHeight;
    requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; ours = false; });
  }
  function paintEmpty() {
    const el = list();
    if (!el) return;
    const empty = el.querySelector(".empty");
    if (state.segs.size || state.dividers.length) { if (empty) empty.remove(); return; }
    if (!empty) {
      const p = document.createElement("p");
      p.className = "placeholder empty";
      p.textContent = EMPTY;
      el.replaceChildren(p);
    }
  }
  function paintRow(seg) {
    const el = list();
    if (!el) return;
    paintEmpty();
    let row = el.querySelector('[data-seg="' + seg.id + '"]');
    if (!row) {
      row = document.createElement("div");
      row.dataset.seg = seg.id;
      const text = document.createElement("div"); text.className = "text";
      const tr = document.createElement("div"); tr.className = "tr";
      row.append(text, tr);
      el.append(row);
      while (el.querySelectorAll("[data-seg]").length > MAX_ROWS) el.querySelector("[data-seg]").remove();
    }
    row.className = "seg" + (seg.final ? "" : " interim");
    row.querySelector(".text").textContent = seg.text;
    row.querySelector(".tr").textContent = seg.tr || (seg.final ? "…" : "");
    settle();
  }
  function paintLevel() {
    const el = root && root.querySelector(".cap-level");
    if (!el) return;
    const bars = audio ? Math.min(5, Math.round(Math.sqrt(state.level) * 12)) : 0;
    el.textContent = audio ? "▮".repeat(bars) + "▯".repeat(5 - bars) : "";
  }
  // 兩排語言按鈕：聽的語言（含自動）、翻譯成（不含自動，多一顆不翻譯）。按鈕照伺服器的語言表產生。
  function paintLangs() {
    const L = state.langs;
    if (!L) return;
    const rows = { listen: L.rows, target: L.rows.filter(r => r.code !== "auto").concat([{ code: L.none, label: "不翻譯" }]) };
    root.querySelectorAll("[data-langs]").forEach(g => {
      const name = g.dataset.langs;
      if (g.querySelectorAll("button").length !== rows[name].length) {
        g.querySelectorAll("button").forEach(x => x.remove());
        rows[name].forEach(r => {
          const x = document.createElement("button");
          x.type = "button"; x.className = "tbtn"; x.dataset.lang = r.code; x.textContent = r.label;
          g.append(x);
        });
      }
      g.querySelectorAll("button").forEach(x => { x.setAttribute("aria-pressed", String(prefs[name] === x.dataset.lang)); x.disabled = state.listening; });
    });
  }
  function paintBar() {
    if (!root) return;
    const b = root.querySelector('[data-act="listen"]');
    b.setAttribute("aria-pressed", String(state.listening));
    b.textContent = state.listening ? "■ 停止" : "▶ 聆聽";
    root.querySelectorAll("[data-src]").forEach(x => { x.setAttribute("aria-pressed", String(prefs[x.dataset.src])); x.disabled = state.listening; });
    root.querySelectorAll("[data-stt]").forEach(x => { x.setAttribute("aria-pressed", String(prefs.stt === x.dataset.stt)); x.disabled = state.listening; });
    root.querySelector('[data-act="tr-only"]').setAttribute("aria-pressed", String(prefs.trOnly));
    paintLangs();
    root.querySelectorAll("[data-idle]").forEach(x => { if (document.activeElement !== x) x.value = prefs[x.dataset.idle]; x.disabled = state.listening; });
    const save = root.querySelector('[data-act="save"]');
    save.setAttribute("aria-pressed", String(prefs.save));
    save.disabled = state.listening;
    paintSegment();
    root.querySelector(".cap-sum").hidden = !(state.listening && state.summaryOn);
    const l = list();
    l.classList.toggle("tr-only", prefs.trOnly);
    l.style.fontSize = prefs.size + "px";
    root.querySelector(".cap-status").textContent = state.status;
    const u = state.usage;
    root.querySelector(".cap-usage").textContent = u ? "今天約 NT$" + u.total_twd.toFixed(1) : "";
    root.querySelector(".cap-usage").title = u ? u.models.map(m => m.label + "：NT$" + m.twd.toFixed(1)).join("\n") + "\n（依牌價估算，實際以各家帳單為準）" : "";
    paintLevel();
  }
  function paintAll() {
    if (!root) return;
    list().replaceChildren();
    paintEmpty();
    const pending = state.dividers.slice();
    const placeDividers = id => { while (pending.length && pending[0].after < id) paintDivider(pending.shift()); };
    state.segs.forEach(s => { placeDividers(s.id); paintRow(s); });
    placeDividers(Infinity);
    paintBar();
  }

  window.Workspace.onPanel("captions", el => {
    root = el;
    following = true;
    const l = list();
    l.addEventListener("scroll", () => { if (!ours) following = l.scrollTop + l.clientHeight >= l.scrollHeight - NEAR_BOTTOM_PX; });
    new ResizeObserver(settle).observe(l);
    el.querySelector(".cap-langs").addEventListener("click", e => {
      const b = e.target.closest("button[data-lang]");
      if (!b || b.disabled) return;
      setPref(b.closest("[data-langs]").dataset.langs, b.dataset.lang);
      paintBar();
    });
    el.querySelector(".cap-bar").addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b || b.disabled) return;
      if (b.dataset.src) setPref(b.dataset.src, !prefs[b.dataset.src]);
      else if (b.dataset.stt) setPref("stt", b.dataset.stt);
      else if (b.dataset.act === "listen") return void listen(!state.listening);
      else if (b.dataset.act === "tr-only") setPref("trOnly", !prefs.trOnly);
      else if (b.dataset.act === "smaller") setPref("size", Math.max(12, prefs.size - 2));
      else if (b.dataset.act === "bigger") setPref("size", Math.min(40, prefs.size + 2));
      else if (b.dataset.act === "clear") return send({ type: "clear" });
      else if (b.dataset.act === "save") setPref("save", !prefs.save);
      else if (b.dataset.act === "segnext") return send({ type: "segment-next", name: null });
      else if (b.dataset.act === "segname") {
        state.renaming = true;
        paintSegment();
        const edit = el.querySelector(".cap-segedit");
        edit.value = state.segment.name;
        edit.focus();
        edit.select();
        return;
      }
      paintBar();
      settle();
    });
    const edit = el.querySelector(".cap-segedit");
    edit.addEventListener("keydown", e => {
      if (e.isComposing) return;      // 輸入法組字中的 Enter／Esc 只是確認字或取消組字
      if (e.key === "Escape") { state.renaming = false; paintSegment(); }
      else if (e.key === "Enter") {
        const name = edit.value.trim();
        state.renaming = false;
        if (name) send({ type: "segment-rename", name });
        paintSegment();
      }
    });
    edit.addEventListener("blur", () => { if (state.renaming) { state.renaming = false; paintSegment(); } });
    el.querySelectorAll("[data-idle]").forEach(x => x.addEventListener("change", () => {
      const v = Number(x.value);
      setPref(x.dataset.idle, Number.isFinite(v) && v >= 0 ? Math.min(v, Number(x.max)) : 0);
      paintBar();
    }));
    paintAll();
  });
})();
</script>

<template id="tpl-reply">
  <div class="rp">
    <div class="rp-bar">
      <span class="placeholder">打中文，下面出現可以照唸的英文</span><span class="spacer"></span>
      <button type="button" class="tbtn" data-act="smaller" title="字小一點">A−</button>
      <button type="button" class="tbtn" data-act="bigger" title="字大一點">A＋</button>
    </div>
    <div class="rp-view" aria-live="polite"><div class="rp-zh"></div><div class="rp-en"></div></div>
    <textarea class="rp-in" placeholder="打下你想說的中文，按 Enter 送出（Shift+Enter 換行）"></textarea>
  </div>
</template>
<script>
// 回覆面板：打中文 → 大字英文（照 OwnVoice Meet src/reply/main.ts，Apache-2.0）。回覆內容在頁面層，
// 面板關掉再開還在；聆聽中與否都能用。
(function () {
  const store = window.Settings.prefs("ws-reply", { size: "reply_size" }, { size: 28 }, () => paint());
  const prefs = store.values;
  const live = window.Workspace.live;
  let langs = null;       // 語言表（snapshot 的 langs）；面板說明寫「我的語言」→「對方的語言」
  let reply = null;       // 最近一則 { id, zh, en, done }
  let seen = 0;           // 看過的最大回覆代號（伺服器每則回覆給一個遞增的新代號）
  let awaiting = null;    // 剛送出、伺服器還沒回第一個事件的中文；這段時間舊回覆（代號 ≤ seen）的事件不能蓋掉它
  let root = null;

  function label(code) {
    const r = langs.rows.find(x => x.code === code);
    return r ? r.label : code;
  }
  // 我的語言＝翻譯成（不翻譯時用預設）；對方的語言＝聽的語言（自動時用預設）。規則同 lib/live/langs.py mine／theirs。
  function paintLangs() {
    const d = window.Settings.data;
    if (!root || !langs || !d) return;
    const mine = label(d.target === langs.none ? langs.mine : d.target), theirs = label(d.listen === "auto" ? langs.theirs : d.listen);
    root.querySelector(".rp-bar .placeholder").textContent = "打" + mine + "，下面出現可以照唸的" + theirs;
    root.querySelector(".rp-in").placeholder = "打下你想說的" + mine + "，按 Enter 送出（Shift+Enter 換行）";
  }
  window.Settings.on(paintLangs);

  function paint() {
    if (!root) return;
    paintLangs();
    const en = root.querySelector(".rp-en");
    en.style.fontSize = prefs.size + "px";
    root.querySelector(".rp-zh").textContent = reply ? reply.zh : "";
    en.textContent = reply ? (reply.en || "…") : "";
  }

  live.on("snapshot", ev => { langs = ev.langs; reply = ev.reply; seen = reply ? reply.id : 0; awaiting = null; paint(); });
  live.on("reply", ev => {
    if (awaiting !== null && ev.id <= seen) return;
    awaiting = null;
    seen = ev.id;
    reply = ev;
    paint();
  });
  live.on("close", () => {
    if (awaiting === null) return;
    reply = { id: 0, zh: awaiting, en: "[和會議工具的連線斷了，這句沒有送出去]", done: true };
    awaiting = null;
    paint();
  });

  function submit(box) {
    const zh = Array.from(box.value.trim()).slice(0, 2000).join("").trim();      // 按字元（不是 UTF-16 單位）數，不會切開一個表情符號
    if (!zh) return;
    box.value = "";
    if (!live.ready()) {
      reply = { id: 0, zh, en: "[還沒連上會議工具，等一下再送]", done: true };
      return paint();
    }
    awaiting = zh;
    reply = { id: 0, zh, en: "", done: false };
    live.send({ type: "reply", zh });
    paint();
  }

  window.Workspace.onPanel("reply", el => {
    root = el;
    const box = el.querySelector(".rp-in");
    box.addEventListener("keydown", e => {
      if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;   // 輸入法組字中的 Enter 只是確認字
      e.preventDefault();
      submit(box);
    });
    el.querySelector(".rp-bar").addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      store.set("size", Math.max(14, Math.min(72, prefs.size + (b.dataset.act === "bigger" ? 2 : -2))))
        .catch(err => { el.querySelector(".rp-bar .placeholder").textContent = err.message; });
      paint();
    });
    paint();
  });
})();
</script>

<template id="tpl-script">
  <div class="sc">
    <div class="sc-bar">
      <span class="sc-tabs"></span><span class="spacer"></span>
      <button type="button" class="tbtn" data-act="template" hidden title="在游標處插入一份範例">範本</button>
      <button type="button" class="tbtn" data-act="edit" aria-pressed="false">編輯</button>
      <button type="button" class="tbtn" data-act="open">開啟講稿…</button>
      <button type="button" class="tbtn" data-act="gloss" title="把缺的另一半（英文的中文意思、中文的英文）交給 AI 補上（計費）">補對照</button>
      <button type="button" class="tbtn" data-act="glossary" aria-pressed="false" title="固定譯法：每行「中文 = English」">詞彙表</button>
      <input type="file" accept=".md,.txt" hidden>
    </div>
    <div class="sc-note" aria-live="polite"></div>
    <textarea class="sc-gl" hidden spellcheck="false" placeholder="每行一個固定譯法：中文 = English（# 開頭是註解）"></textarea>
    <textarea class="sc-src" hidden spellcheck="false"></textarea>
    <div class="sc-body"></div>
  </div>
</template>
<script>
// 講稿面板與詞彙表。格式解析、範本、編輯／預覽／自動存、補對照移植自 OwnVoice Meet
// src/script/format.ts、template.ts、main.ts（Apache-2.0）；補對照的伺服器端見 lib/live/gloss.py。
// 講稿與詞彙表存在伺服器（.live-script.json），翻譯與回覆都會用；這裡的頁面層狀態讓面板關掉再開不會掉。
(function () {
  const live = window.Workspace.live;
  const EMPTY = "還沒有講稿。按「編輯」直接寫，或「開啟講稿…」讀 .md 檔。只寫英文或只寫中文都可以，按「補對照」補上另一半。";
  const TEMPLATE = `# 開場
! 灰色提示：這行不用唸，例如「切到第 2 張投影片」
Hi everyone, thanks for having me.
> 大家好，謝謝邀請。
寫中文也可以，按「補對照」會幫你產生要唸的英文。

# Q&A
Q: How is this different from other tools?
> 問：這跟其他工具有什麼不同？
它不會替你作答，你說的是自己的話。

## 救急句
Sorry, could you repeat the question?
> 抱歉，可以請你再說一次問題嗎？
`;
  const state = { script: "", glossary: "" };   // 伺服器上存的版本
  const echoes = { script: new Set(), glossary: new Set() };   // 我們自己剛存出去的內容：它回來的事件不要覆蓋正在打的字
  let ui = null, saveTimer = 0, glTimer = 0, previewTimer = 0;

  // ---------- 格式（format.ts） ----------
  function parse(source) {
    const sections = [], items = [];
    let block = null;
    for (const raw of source.replace(/^﻿/, "").split(/\r?\n/)) {
      const line = raw.trimEnd();
      if (block) {
        if (line.trim() === "```") { items.push({ kind: "copy", name: block.name, text: block.lines.join("\n") }); block = null; }
        else block.lines.push(line);
        continue;
      }
      if (!line.trim()) continue;
      if (line.startsWith("```copy:")) block = { name: line.slice(8).trim(), lines: [] };
      else if (line.startsWith("# ")) { items.push({ kind: "section", text: line.slice(2).trim(), index: sections.length }); sections.push(line.slice(2).trim()); }
      else if (line.startsWith("## ")) items.push({ kind: "sub", text: line.slice(3).trim() });
      else if (line.startsWith("! ")) items.push({ kind: "cue", text: line.slice(2) });
      else if (line.startsWith("> ")) items.push({ kind: "gloss", text: line.slice(2) });
      else if (line.startsWith("Q: ")) items.push({ kind: "question", text: line.slice(3) });
      else items.push({ kind: "line", text: line });
    }
    if (block) items.push({ kind: "copy", name: block.name, text: block.lines.join("\n") });   // 沒收尾的區塊照樣顯示，打錯字不會讓內容消失
    return { sections, items };
  }
  function missingGloss(items) {
    return items.filter((it, i) => (it.kind === "line" || it.kind === "question") && (!items[i + 1] || items[i + 1].kind !== "gloss"));
  }

  // ---------- 畫面 ----------
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    e.className = cls;
    e.textContent = text;
    return e;
  }
  function setNote(text) { if (ui) ui.note.textContent = text; }

  function render(source) {
    if (!ui) return;
    const top = ui.body.scrollTop;
    const { sections, items } = parse(source);
    ui.body.replaceChildren();
    ui.tabs.replaceChildren();
    if (!source.trim()) {
      ui.body.append(el("div", "empty", EMPTY));
      if (!ui.busy) setNote("");
      return;
    }
    for (const it of items) {
      if (it.kind === "section") {
        const h = el("h2", "", it.text);
        h.dataset.s = it.index;
        ui.body.append(h);
      } else if (it.kind === "copy") {
        const box = el("div", "copy", "");
        const btn = el("button", "tbtn", "複製");
        btn.type = "button";
        btn.addEventListener("click", async () => {
          try { await navigator.clipboard.writeText(it.text); btn.textContent = "已複製"; }
          catch (e) { btn.textContent = "複製失敗"; }
          setTimeout(() => { btn.textContent = "複製"; }, 1200);
        });
        box.append(el("pre", "", it.text), btn);
        ui.body.append(box);
      } else {
        ui.body.append(el("div", it.kind, it.kind === "question" ? "Q: " + it.text : it.text));
      }
    }
    sections.forEach((title, i) => {
      const b = el("button", "tbtn", title);
      b.type = "button";
      b.addEventListener("click", () => {
        const h = ui && ui.body.querySelector('[data-s="' + i + '"]');
        if (h) h.scrollIntoView({ block: "start" });
      });
      ui.tabs.append(b);
    });
    if (!ui.busy) {
      const missing = missingGloss(items).length;
      setNote(missing ? missing + " 句還沒有對照，按「補對照」自動補上。" : "");
    }
    ui.body.scrollTop = top;
  }

  function setValue(box, value) {
    const a = box.selectionStart, b = box.selectionEnd;
    box.value = value;
    box.setSelectionRange(Math.min(a, value.length), Math.min(b, value.length));
  }

  // ---------- 存檔 ----------
  async function put(field, text) {
    echoes[field].add(text);
    if (echoes[field].size > 5) echoes[field].delete(echoes[field].values().next().value);
    try {
      const resp = await fetch("/api/live/script", {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ [field]: text }),
      });
      if (!resp.ok) {
        const body = await resp.json().catch(() => ({}));
        throw new Error(body.detail || "伺服器回了 " + resp.status);
      }
      return true;
    } catch (e) {
      echoes[field].delete(text);
      setNote("存檔失敗：" + (e.message && e.message !== "Failed to fetch" ? e.message : "連不到會議工具"));
      return false;
    }
  }

  // 伺服器上的講稿／詞彙表變了（snapshot 或 script 事件）。只有「別處改的」才寫進輸入框，
  // 自己剛存出去的內容回來時不動輸入框，游標才不會被打斷（照 OwnVoice main.ts:160-166）。
  function applyRemote(script, glossary) {
    const scriptChanged = script !== state.script, glChanged = glossary !== state.glossary;
    const scriptEcho = echoes.script.delete(script), glEcho = echoes.glossary.delete(glossary);
    state.script = script;
    state.glossary = glossary;
    if (!ui) return;
    if (scriptChanged && !scriptEcho && ui.editing && script !== ui.src.value) setValue(ui.src, script);
    if (glChanged && !glEcho && glossary !== ui.gl.value) setValue(ui.gl, glossary);
    render(ui.editing ? ui.src.value : script);
  }
  live.on("snapshot", ev => applyRemote(ev.script, ev.glossary));
  live.on("script", ev => applyRemote(ev.script, ev.glossary));

  // ---------- 動作 ----------
  async function setEditing(on) {
    const p = ui;
    if (!on) {
      clearTimeout(saveTimer);
      const text = p.src.value;
      if (text !== state.script) await put("script", text);
      render(text);
    }
    p.editing = on;
    p.src.hidden = !on;
    p.templateBtn.hidden = !on;
    p.editBtn.setAttribute("aria-pressed", String(on));
    if (on) {
      p.src.value = state.script;
      p.src.focus();
    }
  }

  async function gloss() {
    const p = ui;
    const text = p.editing ? p.src.value : state.script;
    if (!text.trim()) return setNote("先寫一點講稿，再按「補對照」。");
    clearTimeout(saveTimer);
    p.busy = true;
    p.glossBtn.disabled = p.openBtn.disabled = p.templateBtn.disabled = true;      // 範本、開啟講稿會直接改輸入框／講稿，readOnly 擋不住
    p.src.readOnly = true;
    setNote("補對照中…（會計費）");
    let msg, shown = null;
    try {
      if (p.editing && text !== state.script && !(await put("script", text))) return;      // put 已經把原因寫在提示列
      const resp = await fetch("/api/live/script/gloss", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      const body = await resp.json().catch(() => ({}));
      if (resp.status === 409) throw Object.assign(new Error(body.detail), { plain: true });       // 講稿在等待期間被改過，結果沒有套用：原句直接顯示
      if (!resp.ok) throw new Error(body.detail || "伺服器回了 " + resp.status);
      if (body.filled && p.editing && p.src.value !== body.text) setValue(p.src, body.text);
      shown = body.text;
      msg = body.filled ? "補好了 " + body.filled + " 行。" : "每一行都已經有對照了。";
    } catch (e) {
      msg = e.plain ? e.message : "補對照失敗：" + (e.message && e.message !== "Failed to fetch" ? e.message : "連不到會議工具");
    } finally {
      p.busy = false;
      p.glossBtn.disabled = p.openBtn.disabled = p.templateBtn.disabled = false;
      p.src.readOnly = false;
    }
    if (ui === p) {
      render(p.editing ? p.src.value : (shown === null ? state.script : shown));
      p.note.textContent = msg;
    }
  }

  window.Workspace.onPanel("script", el => {
    const q = s => el.querySelector(s);
    const p = ui = {
      body: q(".sc-body"), tabs: q(".sc-tabs"), note: q(".sc-note"), src: q(".sc-src"), gl: q(".sc-gl"), file: q('input[type="file"]'),
      editBtn: q('[data-act="edit"]'), openBtn: q('[data-act="open"]'), templateBtn: q('[data-act="template"]'), glossBtn: q('[data-act="gloss"]'), glBtn: q('[data-act="glossary"]'),
      editing: false, busy: false,
    };
    p.gl.value = state.glossary;

    q(".sc-bar").addEventListener("click", e => {
      const b = e.target.closest("button[data-act]");
      if (!b || b.disabled) return;
      const act = b.dataset.act;
      if (act === "edit") setEditing(!p.editing);
      else if (act === "open") p.file.click();
      else if (act === "gloss") gloss();
      else if (act === "glossary") {
        p.gl.hidden = !p.gl.hidden;
        b.setAttribute("aria-pressed", String(!p.gl.hidden));
        if (!p.gl.hidden) p.gl.focus();
      } else if (act === "template") {
        if (!p.src.value.trim()) p.src.value = TEMPLATE;
        else {
          const at = p.src.selectionStart;
          p.src.value = p.src.value.slice(0, at) + "\n" + TEMPLATE + "\n" + p.src.value.slice(at);
        }
        p.src.dispatchEvent(new Event("input"));
      }
    });

    p.src.addEventListener("input", () => {
      const text = p.src.value;
      clearTimeout(previewTimer);
      previewTimer = setTimeout(() => { if (ui === p) render(text); }, 250);
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => put("script", text), 1000);     // 存的是打字當下的內容，面板關掉也不會存成空白
    });

    p.gl.addEventListener("input", () => {
      const text = p.gl.value;
      clearTimeout(glTimer);
      glTimer = setTimeout(() => put("glossary", text), 1000);
    });
    p.gl.addEventListener("blur", () => {
      clearTimeout(glTimer);
      if (p.gl.value !== state.glossary) put("glossary", p.gl.value);
    });

    p.file.addEventListener("change", async () => {
      const f = p.file.files[0];
      p.file.value = "";
      if (!f) return;
      const text = await f.text();
      clearTimeout(saveTimer);
      if (await put("script", text) && p.editing) setValue(p.src, text);
    });

    render(state.script);
  });
})();
</script>

<template id="tpl-lookup">
  <div class="panel-body lookup">
    <textarea class="lk-q" rows="2" placeholder="在任何面板反白文字，或直接在這裡打字"></textarea>
    <div class="lk-btns">
      <button type="button" class="tbtn" data-act="search">搜尋網路</button>
      <button type="button" class="tbtn" data-act="ask">問 AI（計費）</button>
      <a class="tbtn" href="/mindmap?session=latest" target="_blank" rel="noopener">心智圖</a>
    </div>
    <div class="lk-out" data-kind="ask" aria-live="polite"></div>
    <div class="lk-out" data-kind="search" aria-live="polite"></div>
  </div>
</template>
<script>
// 查詢面板：反白（≥2 字）自動搜尋網路；問 AI 與心智圖按了才呼叫。
(function () {
  let root = null, query = "";
  const latest = { search: 0, ask: 0 };       // 每種查詢各自的代號：舊回應晚到就丟掉

  function out(kind) { return root && root.querySelector('.lk-out[data-kind="' + kind + '"]'); }
  function note(kind, text) {
    const p = document.createElement("p");
    p.className = "placeholder";
    p.textContent = text;
    out(kind).replaceChildren(p);
  }

  async function run(kind) {
    const text = query.trim();
    if (!root || !text) return;
    const mine = ++latest[kind];
    note(kind, kind === "search" ? "搜尋中…" : "先查網路，再請 AI 整理…");
    let body, ok;
    try {
      const resp = await fetch("/api/lookup/" + kind, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(kind === "search" ? { q: text } : { text }),
      });
      ok = resp.ok;
      body = await resp.json();
    } catch (e) { ok = false; body = { detail: "連不到會議工具" }; }
    if (mine !== latest[kind] || !root) return;
    if (!ok) return note(kind, String(body.detail || "失敗"));
    if (kind === "ask") {
      const d = document.createElement("div");
      d.className = "lk-answer";
      d.textContent = body.answer;
      const parts = [d];
      if (body.note) {
        const n = document.createElement("p");
        n.className = "placeholder";
        n.textContent = body.note;
        parts.push(n);
      }
      // 只列答案裡真的引用到的來源（[1]、[2, 3] 這種標記）。
      // 模型偶爾會寫成 [2，3]、［1］、【1】或全形數字：一併認得。
      const half = String(body.answer).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
      const marks = half.match(/[\[［【]\s*\d+(?:\s*[,，、]\s*\d+)*\s*[\]］】]/g) || [];
      const cited = new Set(marks.join(" ").match(/\d+/g) || []);
      (body.sources || []).filter(s => cited.has(String(s.n))).forEach(s => {
        const item = document.createElement("div");
        item.className = "lk-item";
        const a = document.createElement("a");
        a.textContent = "[" + s.n + "] " + s.title;
        if (/^https?:\/\//.test(s.link)) a.href = s.link;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        item.append(a);
        parts.push(item);
      });
      return out(kind).replaceChildren(...parts);
    }
    if (!body.results.length) return note(kind, "沒有找到結果");
    out(kind).replaceChildren(...body.results.map(r => {
      const item = document.createElement("div");
      item.className = "lk-item";
      const a = document.createElement("a");
      a.textContent = r.title;
      if (/^https?:\/\//.test(r.link)) a.href = r.link;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      const s = document.createElement("p");
      s.textContent = r.snippet;
      item.append(a, s);
      return item;
    }));
  }

  function setQuery(text) {
    query = text;
    const box = root && root.querySelector(".lk-q");
    if (box && box.value !== text) box.value = text;
  }

  window.Workspace.onPanel("lookup", el => {
    root = el;
    const box = el.querySelector(".lk-q");
    box.value = query;
    box.addEventListener("input", () => { query = box.value; });
    box.addEventListener("keydown", e => {
      if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
      e.preventDefault();
      run("search");
    });
    el.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => run(b.dataset.act)));
  });

  // 頁面內任何面板的反白；輸入框裡的選取不算（那是在編輯）。
  document.addEventListener("mouseup", e => {
    if (e.target.closest && e.target.closest("textarea, input, .lk-out a")) return;
    const text = String(window.getSelection()).trim();
    if (text.length < 2 || text === query || !root || !root.isConnected) return;
    setQuery(text);
    run("search");
  });
})();
</script>

<template id="tpl-summary">
  <div class="sm">
    <div class="sm-bar">
      <button type="button" class="tbtn" data-act="on" aria-pressed="false" title="聆聽時每隔幾分鐘，把新的字幕交給 AI 整理成要點，每次都會計費。聆聽中不能改">會議中摘要（計費）</button>
      <label class="sm-every" title="至少要有 3 句新字幕才會整理">每 <input type="number" data-every min="1" max="60" step="1"> 分鐘更新</label>
    </div>
    <div class="sm-body" aria-live="polite"></div>
    <div class="sm-foot"></div>
  </div>
</template>
<script>
// 摘要面板：條列顯示與狀態列照 OwnVoice Meet src/summary/main.ts（Apache-2.0）；整理的排程在伺服器（lib/live/summary.py）。
// 開關與間隔是伺服器設定（templates/_settings.html），按「聆聽」時由字幕面板併進 start 指令；預設關。
(function () {
  const live = window.Workspace.live;
  const EMPTY_OFF = "還沒有開啟。打開上面的「會議中摘要」再按「聆聽」，每隔幾分鐘就會把新的字幕整理成要點（每次都計費）。";
  // 條件同 lib/live/summary.py：每 N 分鐘一次，且至少 3 句新字幕（MIN_LINES）。
  const emptyOn = () => "還沒有摘要。每 " + prefs.every + " 分鐘整理一次，而且要累積至少 3 句新字幕；停止聆聽時會把剩下的再整理一次。";
  const store = window.Settings.prefs("ws-summary", { on: "summary", every: "summary_min" }, { on: false, every: 5 }, () => paint());
  const prefs = store.values;
  const view = { text: "", updated: "", lines: 0, working: false, error: "", enabled: false };
  let listening = false, root = null, note = "";

  function setPref(name, value) {
    note = "";
    store.set(name, value).catch(e => { note = e.message; paint(); });
  }

  window.Workspace.startExtras.push(() => ({ summary: prefs.on, summary_min: prefs.every }));
  live.on("snapshot", ev => { Object.assign(view, ev.summary); listening = ev.listening; paint(); });
  live.on("summary", ev => { Object.assign(view, ev); paint(); });
  live.on("listening", ev => { listening = ev.on; paint(); });

  function paint() {
    if (!root) return;
    const on = root.querySelector('[data-act="on"]');
    on.setAttribute("aria-pressed", String(listening ? view.enabled : prefs.on));      // 聆聽中以伺服器實際開著的為準
    on.disabled = listening;
    const every = root.querySelector("[data-every]");
    if (document.activeElement !== every) every.value = prefs.every;
    every.disabled = listening;
    const body = root.querySelector(".sm-body");
    const items = String(view.text).split("\n").map(raw => raw.replace(/^\s*[-•*]\s*/, "").trim()).filter(Boolean);
    if (items.length) {
      const ul = document.createElement("ul");
      items.forEach(t => { const li = document.createElement("li"); li.textContent = t; ul.append(li); });
      body.replaceChildren(ul);
    } else {
      const p = document.createElement("p");
      p.className = "placeholder";
      p.textContent = prefs.on ? emptyOn() : EMPTY_OFF;
      body.replaceChildren(p);
    }
    const parts = [];
    if (view.working) parts.push("整理中…");
    else if (view.updated) parts.push(view.updated + " 更新，共 " + view.lines + " 句");
    if (view.error) parts.push(view.error);
    if (note) parts.push(note);
    root.querySelector(".sm-foot").textContent = parts.join("　");
  }

  window.Workspace.onPanel("summary", el => {
    root = el;
    el.querySelector('[data-act="on"]').addEventListener("click", e => {
      if (e.currentTarget.disabled) return;
      setPref("on", !prefs.on);
      paint();
    });
    el.querySelector("[data-every]").addEventListener("change", e => {
      const v = Math.round(Number(e.target.value));
      if (Number.isFinite(v)) setPref("every", Math.min(60, Math.max(1, v)));
      paint();
    });
    paint();
  });
})();
</script>

<template id="tpl-post">
  <div class="po">
    <div class="po-msg" aria-live="polite"></div>
    <h3>選項（三種來源共用）</h3>
    <div class="po-opts"></div>
    <h3>聆聽與 OwnVoice 的場次</h3>
    <div class="po-sessions"><p class="placeholder">讀取中…</p></div>
    <h3>上傳音檔或影片</h3>
    <div class="po-row">
      <input type="file" class="po-file" accept=".mp4,.m4a,.mp3,.wav,.mov,.mkv,.webm,.aac,.flac">
      <button type="button" class="tbtn" data-act="upload">開始處理</button>
    </div>
    <h3>目前這個工作</h3>
    <div class="po-job"><p class="placeholder">從上面開始一個，或在下面的工作清單按「打開」。</p></div>
    <h3>工作清單</h3>
    <div class="po-jobs"></div>

<script>
// 會後整理面板：場次、上傳、工作清單、進度與貼上會議記錄。流程只有 pipeline.run_pipeline_phase1 一條，
// 這裡只選來源與選項（/api/upload、/api/ownvoice/import），看 /api/status 的 stage 與 steps。
(function () {
  const STAGES = [["preflight", "準備"], ["transcribe", "逐字稿"], ["merge", "合併"], ["hallucination_check", "幻覺偵測"],
    ["diarize", "分講者"], ["preparing_prompt", "會議記錄提示"], ["summarize_via_api", "AI 寫會議記錄"],
    ["awaiting_summary", "等你貼上會議記錄"], ["build_deck", "PPT"], ["build_notes", "講稿"], ["build_excel", "Excel"],
    ["build_word", "Word"], ["sync_drive", "同步"], ["done", "完成"]];
  const STEP_OF = { transcribe: "transcribe", diarize: "diarize" };
  const DOWNLOAD_LABELS = { word: "會議記錄", slides: "PPT", excel: "Excel", coach: "報告教練", diarized_txt: "分角色逐字稿",
    merged_txt: "逐字稿", transcript_srt: "字幕 srt", transcript_vtt: "字幕 vtt", transcript_json: "逐字稿 json" };
  const opts = { diarize: true, model: "large-v3", language: null, sync_drive: false, use_api: false };
  let options = null, sessions = [], jobs = [], current = null, focus = null, timer = null, root = null;

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (k === "on") Object.entries(v).forEach(([ev, fn]) => el.addEventListener(ev, fn));
      else if (k === "class") el.className = v;
      else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
    });
    return fill(el, ...kids);
  }
  // replaceChildren 會把 null 寫成文字「null」：選擇性的子元素一律經過這裡。
  function fill(el, ...kids) {
    el.replaceChildren(...kids.flat().filter(c => c != null));
    return el;
  }
  function btn(text, on, pressed, disabled) {
    return h("button", { type: "button", class: "tbtn", "aria-pressed": pressed == null ? false : String(pressed), disabled: !!disabled, on: { click: on } }, text);
  }
  function say(text) { if (root) root.querySelector(".po-msg").textContent = text || ""; }
  async function call(url, init) {
    const resp = await fetch(url, init);
    const body = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(body.detail || ("HTTP " + resp.status));
    return body;
  }
  function when(t) { const d = new Date(t * 1000); return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  function stageLabel(stage) { const s = STAGES.find(([k]) => k === stage); return s ? s[1] : stage; }
  function links(job) {
    return h("div", { class: "po-links" }, job.downloads.map(k => h("a", { href: "/api/download/" + job.id + "/" + k, target: "_blank" }, DOWNLOAD_LABELS[k] || k)),
      job.downloads.includes("merged_txt") ? h("a", { href: "/mindmap?job=" + job.id, target: "_blank" }, "心智圖") : null);
  }

  // ---------- 選項 ----------
  function paintOptions() {
    const box = root && root.querySelector(".po-opts");
    if (!box || !options) return;
    const toggle = (name, text) => btn(text, () => { opts[name] = !opts[name]; paintOptions(); paintSessions(); }, opts[name]);
    fill(box,
      h("div", { class: "po-row" }, h("span", { class: "po-label" }, "講者"), toggle("diarize", "分講者（要 Hugging Face 金鑰）")),
      h("div", { class: "po-row" }, h("span", { class: "po-label" }, "模型"),
        options.models.map(m => btn(m === "large-v3" ? "large-v3（準）" : m === "medium" ? "medium（快）" : m,
          () => { opts.model = m; paintOptions(); paintSessions(); }, opts.model === m))),
      h("div", { class: "po-row" }, h("span", { class: "po-label" }, "會議語言"),
        options.languages.map(l => btn(l.label, () => { opts.language = l.code; paintOptions(); }, opts.language === l.code))),
      h("div", { class: "po-row" }, h("span", { class: "po-label" }, "同步"), toggle("sync_drive", "完成後同步到雲端硬碟")),
      opts.sync_drive ? h("p", { class: "po-warn" }, "會把 PPT／會議記錄／逐字稿複製到雲端，敏感會議不要開。") : null,
      options.has_api_key ? h("div", { class: "po-row" }, h("span", { class: "po-label" }, "會議記錄"), toggle("use_api", "自動處理（用 API，會計費）")) : null);
  }
  function body(extra) {
    return JSON.stringify(Object.assign({ diarize: opts.diarize, model: opts.model, language: opts.language, sync_drive: opts.sync_drive, use_api: opts.use_api }, extra));
  }

  // ---------- 場次 ----------
  function paintSessions() {
    const box = root && root.querySelector(".po-sessions");
    if (!box) return;
    if (!sessions.length) { box.replaceChildren(h("p", { class: "placeholder" }, "還沒有存下來的場次（聆聽時開「存檔」就會出現在這裡）。")); return; }
    box.replaceChildren(...sessions.map(s => {
      const rec = s.recommend, last = s.jobs[0];
      const actions = [];
      if (s.live) {
        actions.push(btn("用聆聽的逐字稿（快）" + (rec.reuse ? "　建議" : ""), () => start(s.id, true), rec.reuse));
        actions.push(btn("重新辨識（慢，" + opts.model + "）" + (rec.reuse ? "" : "　建議"), () => start(s.id, false), !rec.reuse, !s.wavs));
      } else {
        actions.push(btn("會後整理（從錄音辨識）", () => start(s.id, false), false, !s.wavs));
      }
      return h("div", { class: "po-item" + (focus === s.id ? " focus" : ""), "data-session": s.id },
        h("div", { class: "po-row" }, h("span", { class: "po-name" }, s.id),
          h("span", { class: "po-note" }, (s.live ? "有聆聽逐字稿" : "只有錄音") + (s.wavs ? "" : "、沒有錄音") + (s.jobs.length ? "・已整理 " + s.jobs.length + " 次" : ""))),
        rec.reason ? h("p", { class: rec.reuse ? "po-note" : "po-warn" }, rec.reason) : null,
        !s.live && !s.wavs ? h("p", { class: "po-note" }, "沒有錄音也沒有聆聽逐字稿，不能整理。") : null,
        h("div", { class: "po-row" }, actions, last ? btn("看最近一次", () => open(last.id)) : null),
        last && last.downloads.length ? links(last) : null);
    }));
    const f = focus && box.querySelector('[data-session="' + CSS.escape(focus) + '"]');
    if (f) f.scrollIntoView({ block: "nearest" });
  }
  async function start(session, reuse) {
    say("");
    try {
      const r = await call("/api/ownvoice/import", { method: "POST", headers: { "Content-Type": "application/json" }, body: body({ session, reuse }) });
      open(r.job_id);
      refresh();
    } catch (e) { say("沒有開始：" + e.message); }
  }
  async function upload() {
    const input = root.querySelector(".po-file");
    if (!input.files.length) { say("先選一個音檔或影片"); return; }
    const fd = new FormData();
    fd.append("file", input.files[0]);
    const q = new URLSearchParams({ diarize: opts.diarize, model: opts.model, language: opts.language, sync_drive: opts.sync_drive, use_api: opts.use_api });
    say("上傳中…");
    try {
      const r = await call("/api/upload?" + q, { method: "POST", body: fd });
      say(""); input.value = "";
      open(r.job_id);
      refresh();
    } catch (e) { say("上傳失敗：" + e.message); }
  }

  // ---------- 工作 ----------
  function sourceLabel(job) {
    const s = job.source || {};
    if (s.kind === "upload") return "上傳：" + s.name;
    if (s.kind === "session") return "場次 " + s.session + (s.reuse ? "（聆聽逐字稿）" : "（重新辨識）");
    return job.kind === "video_transcription" ? "影片字幕" : "工作 " + job.id;
  }
  function paintJobs() {
    const box = root && root.querySelector(".po-jobs");
    if (!box) return;
    if (!jobs.length) { box.replaceChildren(h("p", { class: "placeholder" }, "還沒有工作。")); return; }
    box.replaceChildren(...jobs.map(j => h("div", { class: "po-item" + (current === j.id ? " focus" : "") },
      h("div", { class: "po-row" }, h("span", { class: "po-name" }, sourceLabel(j)),
        h("span", { class: "po-note" }, when(j.started_at) + "・" + (j.error ? "失敗" : stageLabel(j.stage))),
        btn("打開", () => open(j.id))),
      j.downloads.length ? links(j) : null)));
  }
  function open(id) { current = id; clearTimeout(timer); paintJobs(); poll(); }
  async function poll() {
    const id = current;
    if (!id) return;
    let status, log;
    try {
      [status, log] = await Promise.all([call("/api/status/" + id), call("/api/log/" + id + "?lines=30")]);
    } catch (e) { say("讀不到工作狀態：" + e.message); return; }
    const finished = status.done || status.error || status.stage === "awaiting_summary";
    if (finished) await refresh();
    if (id !== current) return;
    paintJob(id, status, log.lines);
    if (!finished) timer = setTimeout(poll, 1500);
  }
  async function paintJob(id, status, lines) {
    const box = root && root.querySelector(".po-job");
    if (!box) return;
    const at = STAGES.findIndex(([k]) => k === status.stage), steps = status.steps || {};
    const chips = STAGES.filter(([k]) => k !== "summarize_via_api" || status.stage === k).map(([k, label], i) => {
      const step = steps[STEP_OF[k]];
      const done = status.done || STAGES.findIndex(([kk]) => kk === k) < at;
      return h("span", { class: "po-stage" + (k === status.stage && !status.done ? " active" : done ? " done" : "") }, label + (step && step !== "done" ? "（" + step + "）" : ""));
    });
    const parts = [h("div", { class: "po-stages" }, chips)];
    if (status.error) parts.push(h("p", { class: "po-warn" }, status.error));
    if (status.diarize_error) parts.push(h("p", { class: "po-warn" }, "分講者失敗，已改用沒分講者的逐字稿：" + status.diarize_error));
    if (status.api_error) parts.push(h("p", { class: "po-warn" }, "API 自動處理失敗，改成手動貼上（逐字稿與講者的結果都還在）：" + status.api_error));
    if (status.stage === "awaiting_summary" && !status.done) parts.push(await pasteLoop(id));
    const job = jobs.find(j => j.id === id);
    if (status.done && job) parts.push(links(job));
    parts.push(h("div", { class: "po-log" }, lines.join("\n")));
    if (id === current) box.replaceChildren(...parts);
  }
  async function pasteLoop(id) {
    let prompt = "";
    try { prompt = await (await fetch("/api/prompt/" + id)).text(); } catch (e) { prompt = ""; }
    const promptBox = h("textarea", { readonly: true }, prompt);
    const paste = h("textarea", { placeholder: "把 AI 回傳的 JSON 貼在這裡" });
    const err = h("p", { class: "po-warn" });
    const send = btn("送出，產生 PPT 與會議記錄", async () => {
      if (!paste.value.trim()) { err.textContent = "還沒貼東西"; return; }
      send.disabled = true; err.textContent = "處理中…";
      try {
        await call("/api/submit-summary/" + id, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: paste.value }) });
        await refresh(); open(id);
      } catch (e) { err.textContent = e.message; send.disabled = false; }
    });
    return h("div", null,
      h("p", { class: "po-note" }, "1. 複製下面的提示，貼進任一 AI 對話（用你自己的訂閱，不計 API 費）。"),
      promptBox, h("div", { class: "po-row" }, btn("複製提示", () => navigator.clipboard.writeText(promptBox.value).then(() => say("已複製")))),
      h("p", { class: "po-note" }, "2. 把 AI 回傳的 JSON 貼回來。"), paste, h("div", { class: "po-row" }, send), err);
  }

  async function refresh() {
    try {
      const [s, j] = await Promise.all([call("/api/ownvoice/sessions"), call("/api/jobs")]);
      sessions = s.sessions; jobs = j.jobs.filter(x => x.kind !== "video_transcription");
    } catch (e) { say("讀不到場次或工作：" + e.message); }
    paintSessions(); paintJobs();
  }

  window.Workspace.onPanel("post", async el => {
    root = el;
    root.querySelector('[data-act="upload"]').addEventListener("click", upload);
    if (!options) {
      try {
        options = await call("/api/postmeeting/options");
        if (opts.language === null) opts.language = options.language;
      } catch (e) { say("讀不到選項：" + e.message); }
    }
    paintOptions();
    await refresh();
    if (current) open(current);
  });
  // 字幕面板帶過來的場次（聆聽停止後的「整理這一場」）。
  window.Workspace.openPost = function (session) {
    focus = session;
    window.Workspace.show("post");
    if (root) refresh();
  };

  // ---------- 字幕面板：聆聽停止後的一行說明（只在這頁看過一次聆聽從開到停才出現） ----------
  // 存檔的 segment 事件比 listening 早到（lib/live/hub.py start）：先記在 pending，聆聽開始時才算這一場的。
  const run = { seen: false, listening: false, saved: "", closed: false };
  let pending = "";
  function paintOne(n) {
    n.hidden = !run.seen || run.listening;
    if (n.hidden) return;
    fill(n, run.saved
      ? h("span", null, "這場存在「" + run.saved + "」。")
      : h("span", null, "這場沒有存檔，沒有東西可以整理（要整理，聆聽前在「設定」開「存檔」）。"),
      run.saved ? btn(run.closed ? "整理這一場" : "存檔收尾中…", () => window.Workspace.openPost(run.saved), null, !run.closed) : null);
  }
  // 面板關掉再開會換一個新的說明列：每次都找頁面上現有的。
  function paintNotice() { document.querySelectorAll(".po-notice").forEach(paintOne); }
  window.Workspace.live.on("listening", ev => {
    if (ev.on && !run.listening) { Object.assign(run, { seen: true, saved: pending, closed: false }); pending = ""; }
    run.listening = ev.on;
    paintNotice();
  });
  window.Workspace.live.on("segment", ev => {
    const name = ev.dir.split(/[\\/]/).pop();
    if (ev.index > 0) { if (run.listening) run.saved = name; else pending = name; }
    else if (!run.listening) { run.closed = true; pending = ""; }
    paintNotice();
  });
  window.Workspace.onPanel("captions", el => {
    const n = h("div", { class: "po-notice", hidden: true });
    (el.querySelector(".cap-bar") || el.firstElementChild).after(n);
    paintOne(n);     // dockview 在面板放進頁面之前就呼叫這裡
  });
})();
</script>

<script src="/static/vendor/dockview-core-8.9.1.min.js"></script>
<script>
(function () {
  const dv = window["dockview-core"];
  const PANELS = { captions: "字幕", reply: "回覆", script: "講稿", lookup: "查詢", summary: "摘要", settings: "設定", post: "會後整理" };
  // 重新打開被關掉的面板時，優先併在這些面板旁邊；都不在就加進目前的群組。
  const REOPEN_NEXT_TO = {
    captions: [["reply", "above"], ["lookup", "left"]],
    reply: [["captions", "below"], ["script", "left"]],
    script: [["lookup", "below"], ["reply", "right"]],
    lookup: [["script", "above"], ["captions", "right"]],
    summary: [["lookup", "within"], ["captions", "right"]],
    settings: [["lookup", "within"], ["captions", "right"]],
    post: [["lookup", "within"], ["captions", "right"]],
  };
  const el = document.getElementById("dock");

  const api = dv.createDockview(el, {
    theme: dv.themeLight,
    disableFloatingGroups: true,        // 不要漂浮視窗；tab 右鍵選單未設定 = 沒有「浮動／彈出視窗」選項
    createComponent(opts) {
      if (!(opts.name in PANELS)) throw new Error("未知的面板：" + opts.name);
      const element = document.createElement("div");
      element.style.height = "100%";
      return {
        element,
        init() {
          element.replaceChildren(document.getElementById("tpl-" + opts.name).content.cloneNode(true));
          window.Workspace.mount(opts.name, element);
        },
      };
    },
  });

  function addPanel(id, position, size) {
    api.addPanel(Object.assign({ id, component: id, title: PANELS[id], position }, size));
  }

  function buildDefault() {
    api.clear();
    const w = el.clientWidth, h = el.clientHeight;
    addPanel("captions");
    addPanel("lookup", { referencePanel: "captions", direction: "right" }, { initialWidth: Math.round(w * 0.4) });
    addPanel("reply", { referencePanel: "captions", direction: "below" }, { initialHeight: Math.round(h * 0.35) });
    addPanel("script", { referencePanel: "lookup", direction: "below" }, { initialHeight: Math.round(h * 0.5) });
    addPanel("summary", { referencePanel: "lookup", direction: "within" });
    addPanel("settings", { referencePanel: "lookup", direction: "within" });
    addPanel("post", { referencePanel: "lookup", direction: "within" });
    api.getPanel("lookup").api.setActive();
  }

  function syncButtons() {
    document.querySelectorAll("#topbar [data-panel]").forEach(b => {
      b.setAttribute("aria-pressed", api.getPanel(b.dataset.panel) ? "true" : "false");
    });
  }

  let saveTimer = null;
  function putLayout() {
    return fetch("/api/workspace/layout", {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(api.toJSON()),
    }).catch(() => {});
  }
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(putLayout, 500);
  }

  document.querySelectorAll("#topbar [data-panel]").forEach(b => {
    b.addEventListener("click", () => {
      const id = b.dataset.panel, existing = api.getPanel(id);
      if (existing) { api.removePanel(existing); return; }
      const next = REOPEN_NEXT_TO[id].find(([ref]) => api.getPanel(ref));
      addPanel(id, next ? { referencePanel: next[0], direction: next[1] } : undefined);
    });
  });
  document.getElementById("resetLayout").addEventListener("click", () => { buildDefault(); scheduleSave(); });
  // 別的面板叫出一個面板（例如字幕面板的「整理這一場」）：開著就切過去，關著就照 REOPEN_NEXT_TO 打開。
  window.Workspace.show = function (id) {
    const existing = api.getPanel(id);
    if (existing) { existing.api.setActive(); return; }
    const next = REOPEN_NEXT_TO[id].find(([ref]) => api.getPanel(ref));
    addPanel(id, next ? { referencePanel: next[0], direction: next[1] } : undefined);
  };

  async function init() {
    let saved = null;
    try {
      const resp = await fetch("/api/workspace/layout");
      if (resp.ok) saved = await resp.json();
    } catch (e) { saved = null; }
    let restored = false;
    if (saved && typeof saved === "object") {
      delete saved.floatingGroups;      // 舊檔裡若有漂浮／彈出群組一律丟掉
      delete saved.popoutGroups;
      try { api.fromJSON(saved); restored = true; } catch (e) { restored = false; }
    }
    if (!restored) { buildDefault(); await putLayout(); }
    syncButtons();
    api.onDidAddPanel(syncButtons);
    api.onDidRemovePanel(syncButtons);
    api.onDidLayoutChange(scheduleSave);
  }
  init();
  window.Workspace.live.connect();      // 所有面板的 live.on 都登記完了才連線
})();
</script>
</body>

# mpm_prefork sized to the container memory limit (docker-compose.yml wordpress); scripts/check-compose-invariants.py I5
# checks MaxRequestWorkers x worker_rss_mb + base_mb <= that limit. Image default 150 workers OOM-thrashed the host
# 2026-10-23. worker_rss_mb measured 2026-10-24 (70-80 MB).
# worker_rss_mb: 80
# base_mb: 250
<IfModule mpm_prefork_module>
	StartServers			3
	MinSpareServers			2
	MaxSpareServers			6
	MaxRequestWorkers		16
	MaxConnectionsPerChild	1000
</IfModule>

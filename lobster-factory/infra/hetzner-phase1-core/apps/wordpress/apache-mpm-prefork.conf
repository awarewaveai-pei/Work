# mpm_prefork sized to the container's memory limit (docker-compose.yml: wordpress 1536M). The image default
# (MaxRequestWorkers 150) lets Apache ask for ~10 GB when requests stall; 2026-10-23 that OOM-thrashed the host.
# Measured 2026-10-24: php/apache worker RSS ~70-80 MB. 16 x 80 MB + ~250 MB base < 1536M. MaxConnectionsPerChild
# recycles workers so a slow PHP leak cannot grow one for days.
<IfModule mpm_prefork_module>
	StartServers			3
	MinSpareServers			2
	MaxSpareServers			6
	MaxRequestWorkers		16
	MaxConnectionsPerChild	1000
</IfModule>

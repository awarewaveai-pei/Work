# video-service — EU 部署單元（4c/8GB，餘裕大；不放 SG 4GB box 以免 OOM）。
# 容器僅在 docker 網路內 expose 8732；對外由 EU nginx 終止 TLS 的子網域反代過來，
# 並要求 X-Render-Token（= RENDER_AUTH_TOKEN）。render 產出上傳 R2 → 回 public URL。
#
# 部署（EU）：
#   docker compose -f docker-compose.video.yml --env-file .env.video up -d --build
# .env.video 需含：RENDER_AUTH_TOKEN / R2_API_TOKEN / R2_ACCOUNT_ID /
#   R2_VIDEO_BUCKET / R2_VIDEO_PUBLIC_BASE（皆非提交；見 runbook）。

x-logging: &video-logging
  driver: json-file
  options:
    max-size: "25m"
    max-file: "5"

services:
  video-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: lobster-video-service:local
    container_name: lobster-video-service
    restart: unless-stopped
    environment:
      VIDEO_SERVICE_HOST: "0.0.0.0"
      VIDEO_SERVICE_PORT: "8732"
      # 認證：必設；缺則服務 fail-closed（拒所有 /render）
      RENDER_AUTH_TOKEN: ${RENDER_AUTH_TOKEN}
      # 產出上傳 R2（CF R2 API；影片用獨立 bucket，與圖片 bucket 隔離）
      R2_API_TOKEN: ${R2_API_TOKEN}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_VIDEO_BUCKET: ${R2_VIDEO_BUCKET:-lobster-videos}
      R2_VIDEO_PUBLIC_BASE: ${R2_VIDEO_PUBLIC_BASE}
      # 腳本生成（Claude Haiku）+ Pexels b-roll
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      # OpenAI TTS（tts-1 / tts-1-hd）；缺則 pipeline 會自動 fallback Edge TTS。
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # 渲染上限（防資源失控）
      RENDER_MAX_SCENES: ${RENDER_MAX_SCENES:-30}
      RENDER_MAX_ASSET_MB: ${RENDER_MAX_ASSET_MB:-200}
    # publish 到 127.0.0.1（host nginx 在主機上，非容器）→ 由 video-svc.aware-wave.com vhost 反代 + TLS。
    # 綁 127.0.0.1 → 不對 0.0.0.0 公開，外部只能經 nginx（含 TLS）+ X-Render-Token。
    ports:
      - "127.0.0.1:8732:8732"
    healthcheck:
      test: ["CMD", "timeout", "4", "python", "-c", "__import__('sys').exit(0 if __import__('urllib.request').request.urlopen('http://127.0.0.1:8732/health',timeout=3).getcode()==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - video-net
      - lobster-net    # n8n (lobster-net) → video-service:8732 直連，不過 host loopback
    deploy:
      resources:
        limits:
          memory: 1536M   # EU 有 ~2.5G available；render 為 ffmpeg 模式記憶體溫和，1.5G 留足餘裕
          pids: 256
          cpus: "2.00"
    logging: *video-logging
    memswap_limit: 1536M
    init: true

networks:
  video-net:
    name: lobster-video-net
  lobster-net:
    external: true
    name: lobster-net

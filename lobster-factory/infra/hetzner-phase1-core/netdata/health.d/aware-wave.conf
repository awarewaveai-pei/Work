alarm: awarewave_nginx_5xx_recent
    on: web_log_nginx.requests_by_type
 class: Errors
  type: Web Server
component: Nginx
lookup: sum -5m unaligned of error
 units: requests
 every: 30s
  warn: $this > 2
  crit: $this > 10
 delay: down 10m multiplier 1.5 max 1h
summary: Nginx recent 5xx responses
   info: Nginx returned 5xx responses during the last 5 minutes
     to: sysadmin

alarm: awarewave_apache_5xx_recent
    on: web_log_apache.requests_by_type
 class: Errors
  type: Web Server
component: Apache
lookup: sum -5m unaligned of error
 units: requests
 every: 30s
  warn: $this > 2
  crit: $this > 10
 delay: down 10m multiplier 1.5 max 1h
summary: Apache recent 5xx responses
   info: Apache returned 5xx responses during the last 5 minutes
     to: sysadmin

# --- web_log threshold overrides (added 2026-05-13) ---
# Root cause: direct-IP scanner bursts cause 95%+ 4xx for 2-3 min before fail2ban bans them.
# With fail2ban nginx-bad-request now active (maxretry=5/60s), attackers are blocked
# within ~5 seconds — so these alarms should rarely fire now.
# Thresholds adjusted: warn window extended to 4m, bad_requests warn raised to 30%
# so brief pre-ban spikes don't generate CRITICAL pages.

template: web_log_1m_bad_requests
       on: web_log_nginx.requests_by_type
    class: Errors
     type: Web Server
component: Web log
   lookup: sum -1m unaligned of bad
     calc: $this * 100 / $web_log_1m_requests
    units: %
    every: 10s
     warn: ($web_log_1m_requests > 120) ? ($this > (($status >= $WARNING)  ? ( 20 ) : ( 40 )) ) : ( 0 )
    delay: up 4m down 15m multiplier 1.5 max 1h
  summary: Web log bad requests
     info: Ratio of client error HTTP requests over the last minute (4xx except 401 and 429)
       to: sysadmin

template: web_log_1m_successful
       on: web_log_nginx.requests_by_type
    class: Workload
     type: Web Server
component: Web log
   lookup: sum -1m unaligned of success
     calc: $this * 100 / $web_log_1m_requests
    units: %
    every: 10s
     warn: ($web_log_1m_requests > 120) ? ($this < (($status >= $WARNING ) ? ( 80 ) : ( 65 )) ) : ( 0 )
     crit: ($web_log_1m_requests > 120) ? ($this < (($status == $CRITICAL) ? ( 65 ) : ( 40 )) ) : ( 0 )
    delay: up 4m down 15m multiplier 1.5 max 1h
  summary: Web log successful
     info: Ratio of successful HTTP requests over the last minute (1xx, 2xx, 304, 401, 429)
       to: sysadmin

# Aware Wave custom Netdata alerts
# Keep this file small and high-signal. Built-in host/container alarms remain enabled.

alarm: awarewave_redis_lobster_evictions
    on: redis_docker_lobster-redis.key_eviction_events
 class: Errors
  type: KV Storage
component: Redis
lookup: sum -5m unaligned of evicted
 units: evictions
 every: 30s
  warn: $this > 0
  crit: $this > 10
 delay: down 10m multiplier 1.5 max 1h
summary: lobster-redis key evictions
   info: lobster-redis evicted keys during the last 5 minutes
     to: sysadmin

alarm: awarewave_redis_trigger_evictions
    on: redis_docker_trigger-redis.key_eviction_events
 class: Errors
  type: KV Storage
component: Redis
lookup: sum -5m unaligned of evicted
 units: evictions
 every: 30s
  warn: $this > 0
  crit: $this > 10
 delay: down 10m multiplier 1.5 max 1h
summary: trigger-redis key evictions

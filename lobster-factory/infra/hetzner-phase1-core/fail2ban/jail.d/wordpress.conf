# EU VPS (204.168.175.41) — /etc/fail2ban/jail.d/wordpress.conf
# WordPress-specific nginx fail2ban jail
# Permissions: 644 (root:root)
#
# Requires filter: /etc/fail2ban/filter.d/wordpress-nginx.conf
# Filter triggers on: POST /wp-login.php (200|429), GET/POST wp-login/wp-admin (429)
#
# Install (EU VPS):
#   sudo cp wordpress.conf /etc/fail2ban/jail.d/
#   sudo chmod 644 /etc/fail2ban/jail.d/wordpress.conf
#   sudo fail2ban-client reload

[wordpress-nginx]
enabled  = true
filter   = wordpress-nginx
logpath  = /var/log/nginx/access.log
maxretry = 8
findtime = 300
bantime  = 3600

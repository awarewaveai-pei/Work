# EU VPS (204.168.175.41) — /etc/fail2ban/jail.d/99-awarewave.conf
# AwareWave fail2ban jail overrides
# Permissions: 644 (root:root)
#
# Install (EU VPS):
#   sudo cp 99-awarewave.conf /etc/fail2ban/jail.d/
#   sudo chmod 644 /etc/fail2ban/jail.d/99-awarewave.conf
#   sudo fail2ban-client reload

[DEFAULT]
bantime  = 3600
findtime = 600
maxretry = 5
banaction = iptables-multiport

[sshd]
enabled  = true
port     = ssh
logpath  = %(sshd_log)s
backend  = %(sshd_backend)s
maxretry = 3
bantime  = 86400

[recidive]
enabled  = true
logpath  = /var/log/fail2ban.log
banaction = iptables-allports
bantime  = 604800
findtime = 86400
maxretry = 3

[nginx-botsearch]
enabled  = true
filter   = nginx-botsearch
logpath  = /var/log/nginx/access.log
maxretry = 2
findtime = 60
bantime  = 86400

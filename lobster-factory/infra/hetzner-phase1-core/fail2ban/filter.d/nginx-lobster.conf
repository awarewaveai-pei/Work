[Definition]
# Matches nginx combined log format:
# IP - user [date] "METHOD /path HTTP/x.x" STATUS bytes "ref" "UA"
# Catches: any 4xx (except 429=rate-limit, 401=auth challenge) + 5xx
failregex = ^<HOST> - \S+ \[.*?\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH|TRACE) \S+ HTTP/\d\.\d" (?!429|401)(?:4|5)\d\d \d+
ignoreregex =
datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S %%z

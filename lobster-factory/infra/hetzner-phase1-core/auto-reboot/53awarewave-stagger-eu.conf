// SSOT in repo: lobster-factory/infra/hetzner-phase1-core/auto-reboot/53awarewave-stagger-eu.conf
// Deploy target: /etc/apt/apt.conf.d/53awarewave-stagger-eu.conf (EU VPS ONLY — do NOT deploy to SG)
// Owner runbook: runbooks/VPS-AUTO-REBOOT-RUNBOOK.md
//
// Purpose
// -------
// Stagger EU reboot 30 minutes after SG to eliminate the ~5-10% same-morning
// reboot risk (Ubuntu CVE batches that hit both servers same day).
//
// File numbering: 53 > 52 (base 52awarewave-auto-reboot.conf), so apt loads
// this AFTER the base policy, overriding ONLY the Automatic-Reboot-Time.
// Other policy keys (Automatic-Reboot, Automatic-Reboot-WithUsers) inherit
// from 52 — single source of truth for the policy, this file is staging only.
//
// Effect
// ------
// SG: 20:00 UTC = 04:00 TPE (base policy, all configs from 52)
// EU: 20:30 UTC = 04:30 TPE (this file overrides Automatic-Reboot-Time)
//
// 30-minute gap rationale: enough time for SG to finish reboot (30-90s) + nginx
// front + warm container healthchecks before EU goes down. If SG depends on EU
// services (Supabase / Trigger / n8n), SG containers are running normally
// during EU's reboot window — restart=unless-stopped + reconnect logic in
// containers handles transient EU unavailability.
//
// Rollback
// --------
// rm /etc/apt/apt.conf.d/53awarewave-stagger-eu.conf
// → EU reverts to 20:00 UTC (base policy inherited from 52).
// Both VPSes then reboot at same time — original B-Minimal as of 2026-05-23 11:25 UTC.

Unattended-Upgrade::Automatic-Reboot-Time "20:30";

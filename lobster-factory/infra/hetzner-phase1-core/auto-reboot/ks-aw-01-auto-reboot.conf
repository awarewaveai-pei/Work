// SSOT in repo: lobster-factory/infra/hetzner-phase1-core/auto-reboot/ks-aw-01-auto-reboot.conf
// Deploy target: /etc/apt/apt.conf.d/52awarewave-auto-reboot on ks-aw-01 (149.202.64.114)
// Owner runbook: runbooks/VPS-AUTO-REBOOT-RUNBOOK.md
//
// Purpose
// -------
// Enable native unattended-upgrades auto-reboot for ks-aw-01 (Ubuntu 24.04, single
// consolidated host running everything that used to be split across SG + EU).
// TZ=Etc/UTC; "20:00" means 04:00 Asia/Taipei — same low-traffic window the old
// SG/EU machines used, kept for continuity, not re-derived.
//
// Why this is conditional, not "reboot every day regardless"
// -------------------------------------------------------------
// Automatic-Reboot "true" only fires a reboot when unattended-upgrades actually
// installed something that leaves /var/run/reboot-required behind (kernel, glibc,
// etc.). A day with no such package needs no reboot and none happens — this was
// already true of the OLD SG/EU config below; it was never "reboot unconditionally
// every day", that framing in TASKS.md/check-vps-auto-reboot-health.ps1 overstated
// the downside. The REAL, new-to-single-host risk is silence: on SG/EU a reboot of
// one box left the other serving, so a broken reboot was low-stakes and often went
// unnoticed by design. On ks-aw-01 alone, a reboot that doesn't come back healthy
// takes everything down with nobody watching. ks-aw-01-boot-health-notify.sh (this
// same directory) exists specifically to close that gap: it runs on every boot,
// automatic or manual, and always reports outcome via Telegram — silence is no
// longer possible.
//
// 2026-08-30 revival of the 2026-05-23 "B-Minimal" design (see git history of
// 52awarewave-auto-reboot.conf / 53awarewave-stagger-eu.conf) for the consolidated
// single-host topology. No EU stagger file needed any more — one host, one time.
//
// File numbering convention
// -------------------------
// 52 > 50 (stock /etc/apt/apt.conf.d/50unattended-upgrades).
// apt loads conf files in lexical order, so this file overrides stock
// defaults without editing the upstream-managed file.
//
// Rollback
// --------
// rm /etc/apt/apt.conf.d/52awarewave-auto-reboot
// → reverts to "auto install patches, no auto reboot".
// Manual reboot still possible via /ks-aw-01-reboot runbook (see TASKS.md for the
// /sg-reboot + /eu-reboot consolidation this replaces).

Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "20:00";
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";

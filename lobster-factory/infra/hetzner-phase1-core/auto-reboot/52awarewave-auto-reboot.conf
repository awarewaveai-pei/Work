// SSOT in repo: lobster-factory/infra/hetzner-phase1-core/auto-reboot/52awarewave-auto-reboot.conf
// Deploy target: /etc/apt/apt.conf.d/52awarewave-auto-reboot (drop the .conf extension is fine; apt loads any file matching the pattern)
// Owner runbook: runbooks/VPS-AUTO-REBOOT-RUNBOOK.md
//
// Purpose
// -------
// Enable native unattended-upgrades auto-reboot at 20:00 UTC (= 04:00 Asia/Taipei)
// for SG (wordpress-ubuntu-4gb-sin-1, Ubuntu 24.04) and EU (awarewave-eu-hel1-cpx32, Ubuntu 22.04).
// Both servers run TZ=Etc/UTC; "20:00" means 04:00 TPE.
//
// 30-year design rationale
// ------------------------
// Trusts Ubuntu stock unattended-upgrades (in production since 2008).
// Zero custom scripts, zero external dependencies.
// Existing monitoring (netdata reboot-required marker, uptime-kuma endpoint
// checks, backup-health LATEST report) handles every other aspect of
// pre/post-reboot verification — no need to duplicate logic.
//
// File numbering convention
// -------------------------
// 52 > 50 (stock /etc/apt/apt.conf.d/50unattended-upgrades).
// apt loads conf files in lexical order, so this file overrides stock
// defaults without editing the upstream-managed file.
//
// Rollback
// --------
// rm /etc/apt/apt.conf.d/52awarewave-auto-reboot
// → reverts to "auto install patches, no auto reboot" (= prior behaviour as of 2026-05-23).
// Manual reboot still possible via /sg-reboot or /eu-reboot runbooks.

Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "20:00";
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";

# AwareWave nginx security hardening
# Owner: runbooks/HETZNER-SERVER-502-OOM-EMERGENCY-PLAYBOOK.md
# SSOT: this file. Deploy to SG host nginx at /etc/nginx/conf.d/aware-wave-security.conf
#   sudo cp aware-wave-security.conf /etc/nginx/conf.d/aware-wave-security.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Do NOT edit the VPS copy inline — update this repo source and redeploy.

# Per-IP rate-limit zones (applied at location level).
# Keep login strict, but do not make wp-admin page loads share the public scanner bucket:
# WordPress admin/editor pages legitimately burst dozens of JS/CSS/REST requests.
limit_req_zone  $binary_remote_addr zone=req_perip:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=wp_login:10m rate=5r/m;
limit_req_zone  $binary_remote_addr zone=wp_admin:10m rate=120r/s;
limit_req_zone  $binary_remote_addr zone=wp_assets:10m rate=120r/s;
limit_conn_zone $binary_remote_addr zone=conn_perip:10m;

# Global connection cap per IP — prevents SYN/connection flooding
limit_conn conn_perip 50;

# Throttled/over-limit connections return 429 (Too Many Requests), NOT the default 503.
# Defensive throttling is not a server failure: keeping it 4xx stops scanner bursts and
# connection floods from tripping Netdata's 5xx CRITICAL alarm (only true upstream
# failures 502/504 stay 5xx). Location-level limits in aware-wave-phase1.conf and
# app-api-subdomains pair with default.conf:75.
limit_conn_status 429;
limit_req_status  429;

# Cloudflare IP ranges — restore real visitor IP before logging & fail2ban
# Source: https://www.cloudflare.com/ips/  (last updated 2026-05-13)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;

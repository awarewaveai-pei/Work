# Phase 1 domain-split routing
# aware-wave.com / www  -> WordPress (public site)
# app.aware-wave.com    -> Next.js admin tools
#
# Defense-in-depth — 4 layers (each catches what the previous misses):
#   Layer 1: Rate limiting zones — throttle bursts at nginx edge
#   Layer 2: Security location blocks — block known-bad paths & protect wp-login
#   Layer 3: fail2ban on host — auto-ban IPs that keep hitting blocked paths
#   Layer 4: Cloudflare (planned) — hide real IP, global bot DB, WAF
#
# Rate limiting zones:
#   zone=public   — WordPress public site: 30 req/s per IP; burst 60
#   zone=admin    — Admin app: 20 req/s per IP; burst 40
#   zone=webhook  — Monitoring webhooks: 10 req/s per IP; burst 20
#   zone=wplogin  — wp-login.php brute-force: 5 req/min per IP; burst 2

limit_req_zone $binary_remote_addr zone=public:10m   rate=30r/s;
limit_req_zone $binary_remote_addr zone=admin:10m    rate=20r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=wplogin:10m  rate=5r/m;
limit_req_status 429;

# ── Main public site (WordPress) ─────────────────────────────────────────────
server {
    listen 80;
    server_name aware-wave.com www.aware-wave.com;

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-XSS-Protection        "1; mode=block"                   always;

    # ── Layer 2: Security blocks (evaluated before general proxy) ──────────

    # xmlrpc.php — not used by this site; silent drop (444 = no response sent)
    location = /xmlrpc.php { return 444; }

    # wp-config.php variants — database credentials; block all access
    location ~* wp-config\.php { return 444; }

    # PHP execution inside uploads — RCE prevention (even if a file gets uploaded)
    location ~* /wp-content/uploads/.*\.php$ { return 444; }

    # Sensitive file extensions — no log/sql/env/backup should be web-accessible
    location ~* \.(env|sql|bak|old|log|swp|tmp|ini|htpasswd|DS_Store)$ { return 444; }

    # WordPress readme / sample config — information disclosure
    location ~* ^/(readme|license|wp-config-sample)\.(html|txt|php|md)$ { return 444; }

    # User enumeration via REST API — hides author names/IDs from bots
    location ~* ^/wp-json/wp/v2/users { return 403; }

    # wp-login.php — brute-force protection: 5 attempts/min per IP, burst 2
    location = /wp-login.php {
        limit_req zone=wplogin burst=2 nodelay;
        set $backend http://wordpress:80;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # wp-admin — same tight zone (admin-ajax.php included via prefix match)
    location /wp-admin/ {
        limit_req zone=wplogin burst=10 nodelay;
        set $backend http://wordpress:80;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ── Standard routing ──────────────────────────────────────────────────

    location /health {
        set $backend http://node-api:3001;
        proxy_pass $backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=public burst=60 nodelay;
        set $backend http://node-api:3001;
        proxy_pass $backend/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    location / {
        limit_req zone=public burst=60 nodelay;
        set $backend http://wordpress:80;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# ── Admin console (Next.js) ───────────────────────────────────────────────────
server {
    listen 80;
    server_name app.aware-wave.com;

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-XSS-Protection        "1; mode=block"                   always;

    # Sensitive file access — same protection as WordPress block
    location ~* \.(env|sql|bak|old|log|swp|tmp|ini|htpasswd)$ { return 444; }

    # Webhook endpoints: Bearer-protected by app, rate-limited (monitoring tools only)
    location /api/webhooks/ {
        limit_req zone=webhook burst=20 nodelay;
        set $backend http://next-admin:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # Health check: public (used by Uptime Kuma)
    location /api/ops/inbox/health {
        set $backend http://next-admin:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: rate-limited admin app
    location / {
        limit_req zone=admin burst=40 nodelay;
        set $backend http://next-admin:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

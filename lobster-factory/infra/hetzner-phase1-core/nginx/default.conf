# Phase 1 domain-split routing
# aware-wave.com / www  -> WordPress (public site)
# app.aware-wave.com    -> Next.js admin tools
#
# Rate limiting zones (defined once, reused in both server blocks):
#   zone=public  — WordPress public site: 30 req/s per IP; burst 60 (nodelay)
#   zone=admin   — Admin app general: 20 req/s per IP; burst 40
#   zone=webhook — Monitoring webhooks: 10 req/s per IP; burst 20
# Bots generating high 4xx will be throttled at 429 before hitting the backend.

limit_req_zone $binary_remote_addr zone=public:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=admin:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=10r/s;
limit_req_status 429;

# ???? Main public site ??
server {
    listen 80;
    server_name aware-wave.com www.aware-wave.com;

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /health {
        set $backend http://node-api:3001;
        proxy_pass $backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=public burst=60 nodelay;
        set $backend http://node-api:3001;
        proxy_pass $backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        limit_req zone=public burst=60 nodelay;
        set $backend http://wordpress:80;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# ???? App tools (admin console + small apps) ????????????????????????????????????????????????????????????????????????
server {
    listen 80;
    server_name app.aware-wave.com;

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Webhook endpoints: Bearer-protected by app, rate-limited (monitoring tools only)
    location /api/webhooks/ {
        limit_req zone=webhook burst=20 nodelay;
        set $backend http://next-admin:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check: public (used by Uptime Kuma)
    location /api/ops/inbox/health {
        set $backend http://next-admin:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: rate-limited admin app
    location / {
        limit_req zone=admin burst=40 nodelay;
        set $backend http://next-admin:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
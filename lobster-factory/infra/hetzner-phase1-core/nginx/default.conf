# Phase 1 domain-split routing
# aware-wave.com / www  -> WordPress (public site)
# app.aware-wave.com    -> Next.js admin tools
#
# X-Forwarded-Proto note (2026-08-29 fix, root cause of wp-admin infinite redirect):
# This nginx is a SECOND hop — the outer host-nginx (sg-stack.aware-wave.com vhost)
# terminates TLS and always hardcodes X-Forwarded-Proto: https before forwarding here
# over plain HTTP (127.0.0.1:8083). Because THIS nginx only ever listens on port 80,
# `$scheme` here is always "http" — using it for X-Forwarded-Proto overwrites the
# correct value from hop 1 with "http", so WordPress's is_ssl() reverse-proxy check
# (wp-config.php HTTP_X_FORWARDED_PROTO snippet) always fails and wp-admin loops
# forever trying to force HTTPS on a request it thinks is already on it. Every
# location block below must forward `$http_x_forwarded_proto` (pass-through), never
# `$scheme` (this nginx's own listener scheme) — that applies to any future location
# block added here, not just the ones fixed today.
#
# Defense-in-depth — 4 layers:
#   Layer 1: Rate limiting zones
#   Layer 2: WordPress security location blocks
#   Layer 3: fail2ban on host (auto-ban repeat offenders)
#   Layer 4: Cloudflare proxy + CF-only origin guard on the HOST nginx
#            (/etc/nginx/snippets/cf-only.conf, ranges generated by lobster-factory/infra/ks-aw-01/refresh-cf-edge-geo.sh)
#
# This container publishes on 127.0.0.1:8083 only, so its TCP peer is always the host nginx
# (lobster-net gateway) or localhost -- never a Cloudflare edge. It therefore trusts only those
# peers for CF-Connecting-IP and drops (444) anything else. Never copy Cloudflare ranges here:
# they would be inert and silently go stale.

# 204.168.175.41/32 (EU VPS monitoring) removed 2026-09-23: host released 2026-08-30, now
# reassigned to a third party (OpenSSH_10.2p1 banner, unrelated org) — trusting it would let
# that third party spoof CF-Connecting-IP for this nginx's rate-limit keys. Monitoring runs
# on this host now (ks-aw-01), reached via 127.0.0.1 below. See scripts/verify-no-released-addresses.mjs.
set_real_ip_from 127.0.0.1/32;
# The host nginx (TLS) reaches this container through the lobster-net gateway (docker-compose.yml network
# lobster-net 172.18.0.0/16), not 127.0.0.1. Without this line every visitor had the gateway's address, so each
# per-IP zone below was ONE bucket shared by every visitor of every site (found 2026-10-12, capacity work).
# Only the host can connect from the gateway: this nginx publishes on 127.0.0.1:8083 only.
set_real_ip_from 172.18.0.1/32;
# Cloudflare sets this header to the real visitor IP
real_ip_header CF-Connecting-IP;

# geo checks the ORIGINAL connecting IP ($realip_remote_addr = pre-replacement)
# so it identifies the host-nginx / localhost peer regardless of real-IP swap.
geo $realip_remote_addr $is_trusted_source {
    default 0;
    # 204.168.175.41/32 (EU VPS) removed 2026-09-23 — see set_real_ip_from note above; same host,
    # same reason (third-party reassignment). Would let a direct-origin request from that IP mark
    # itself $is_trusted_source and skip the Layer-4 Cloudflare-only guard entirely.
    # Localhost / Docker internal
    127.0.0.1/32     1;
    172.16.0.0/12    1;
}

# ── Rate limiting zones ───────────────────────────────────────────────────────
# After real_ip restoration, $binary_remote_addr is the real visitor IP.
limit_req_zone $binary_remote_addr zone=public:10m   rate=30r/s;
limit_req_zone $binary_remote_addr zone=admin:10m    rate=20r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=wplogin:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=wpadmin:10m  rate=120r/s;
limit_req_zone $binary_remote_addr zone=wpasset:10m  rate=120r/s;
limit_req_status 429;
# Cognitive (cognitive.aware-wave.com): a class shares one Wi-Fi address, so the limit follows the signed-in person
# (session cookie), else the address. A forged cookie only buys its own bucket; cognitive_ip still caps one address.
map $cookie_cognitive_os_session $cognitive_key { "" $binary_remote_addr; default $cookie_cognitive_os_session; }
limit_req_zone $cognitive_key      zone=cognitive:20m       rate=20r/s;
limit_req_zone $binary_remote_addr zone=cognitive_ip:10m    rate=300r/s;
limit_req_zone $binary_remote_addr zone=cognitive_login:10m rate=5r/s;

# Cognitive upstreams with keepalive. Without it nginx opened a NEW TCP connection to the API/web for every proxied request: at ~650
# requests/s the container ran out of source ports (TIME_WAIT: "connect() ... failed (99: Cannot assign requested address)", 502s) and
# nginx spent ~5 ms of CPU per request (capacity rig, ops/load-test, 2026-10-12). `resolve` keeps the per-request DNS of the old
# `set $backend` form: nginx starts with the container stopped (the site 502s, not `nginx -t` for every site on the host) and follows a
# container that comes back with a new address. keepalive_timeout is below uvicorn's and Node's own 5 s idle close, so nginx never
# writes a request onto a connection the other side is just closing.
# `resolve` in an upstream needs nginx >= 1.27.3 (OSS); lobster-nginx runs nginx:stable = 1.30.4 (checked 2026-10-12). `nginx -t` refuses it on an older image.
upstream cognitive_api {
    zone cognitive_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server cognitive-os-api:8420 resolve;
    keepalive 128;
    keepalive_timeout 4s;
}
# Every web replica carries the network alias cognitive-os-web-pool (Projects/internal/cognitive-engineering-os/docker-compose.yml):
# Docker DNS answers with all of them and nginx takes them round-robin. One Next.js process renders ~66 pages/s (capacity rig
# 2026-10-12); 1000 people navigating every ~7 s are ~140 pages/s. Bring the replicas up (compose) BEFORE applying this file, or the
# site 502s.
upstream cognitive_web {
    zone cognitive_web 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server cognitive-os-web-pool:3000 resolve;
    keepalive 64;
    keepalive_timeout 4s;
}

# ── Main public site (WordPress) ─────────────────────────────────────────────
server {
    listen 80;
    server_name aware-wave.com www.aware-wave.com;

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-XSS-Protection        "1; mode=block"                   always;

    # Layer 4: Drop any direct connection that bypasses Cloudflare
    if ($is_trusted_source = 0) { return 444; }

    # ── Layer 2: WordPress security blocks ────────────────────────────────

    location = /xmlrpc.php                               { return 444; }
    location ~* wp-config\.php                           { return 444; }
    location ~* /wp-content/uploads/.*\.php$             { return 444; }
    location ~* \.(env|sql|bak|old|log|swp|tmp|ini|htpasswd|DS_Store)$ { return 444; }
    location ~* ^/(readme|license|wp-config-sample)\.(html|txt|php|md)$ { return 444; }
    location ~* ^/wp-json/wp/v2/users                    { return 403; }

    # wp-login.php: 5 attempts/min per IP (brute-force protection)
    location = /wp-login.php {
        limit_req zone=wplogin burst=2 nodelay;
        set $backend http://wordpress:80;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location /wp-admin/ {
        limit_req zone=wpadmin burst=240 nodelay;
        set $backend http://wordpress:80;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location /wp-json/ {
        limit_req zone=wpadmin burst=240 nodelay;
        set $backend http://wordpress:80;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location /wp-content/ {
        limit_req zone=wpasset burst=240 nodelay;
        set $backend http://wordpress:80;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location /wp-includes/ {
        limit_req zone=wpasset burst=240 nodelay;
        set $backend http://wordpress:80;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    # ── Standard routing ──────────────────────────────────────────────────

    location /health {
        set $backend http://node-api:3001;
        proxy_pass $backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        limit_req zone=public burst=60 nodelay;
        set $backend http://node-api:3001;
        proxy_pass $backend/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    location / {
        limit_req zone=public burst=60 nodelay;
        set $backend http://wordpress:80;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }
}

# ── Admin console (Next.js) ───────────────────────────────────────────────────
server {
    listen 80;
    server_name app.aware-wave.com;

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-XSS-Protection        "1; mode=block"                   always;

    # Layer 4: Drop direct connections that bypass Cloudflare
    if ($is_trusted_source = 0) { return 444; }

    location ~* \.(env|sql|bak|old|log|swp|tmp|ini|htpasswd)$ { return 444; }

    # More specific than /api/webhooks/ below (nginx picks the longest matching prefix
    # regardless of declaration order) — this ONE route carries an auth secret in its query
    # string (?token=..., lib/cs/chatwoot-client.ts's verifyWebhookToken; Chatwoot's own
    # AgentBot/inbox-webhook delivery sends no signature header, confirmed from its source,
    # so a URL-embedded shared token is the actual auth mechanism here, not decoration).
    # access_log off keeps that secret out of nginx's combined log ($request logs the full
    # query string) and therefore out of promtail -> Loki (30-day retention, any Grafana
    # login can read it) — found live-leaking in production 2026-09-11, critic review.
    # Every OTHER /api/webhooks/* route has no secret in its URL and keeps normal logging.
    location /api/webhooks/chatwoot {
        access_log off;
        limit_req zone=webhook burst=20 nodelay;
        set $backend http://next-admin:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    location /api/webhooks/ {
        limit_req zone=webhook burst=20 nodelay;
        set $backend http://next-admin:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    location /api/ops/inbox/health {
        set $backend http://next-admin:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        limit_req zone=admin burst=40 nodelay;
        set $backend http://next-admin:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}


# ── Portal (Next.js, customer-facing signup/login/launcher) ──────────────────
# Added 2026-08-29, see agency-os/docs/operations/PORTAL_AWARE_WAVE_DESIGN_PROPOSAL.md §7.2.
server {
    listen 80;
    server_name portal.aware-wave.com;

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-XSS-Protection        "1; mode=block"                   always;

    if ($is_trusted_source = 0) { return 444; }
    location ~* \.(env|sql|bak|old|log|swp|tmp|ini|htpasswd)$ { return 444; }

    # Idempotent: only add the /portal/ prefix if it isn't already there. ALSO excludes
    # _next/ and favicon.ico -- Next.js emits static asset URLs unprefixed (no
    # basePath/assetPrefix configured, and can't be, since this one Next.js instance also
    # serves app.aware-wave.com at root paths). See design doc §7 M2 note.
    rewrite ^/(?!portal(?:/|$)|_next/|favicon\.ico)(.*)$ /portal/$1 break;

    location / {
        limit_req zone=admin burst=40 nodelay;
        set $backend http://next-admin:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# ── Product doors served by next-admin (Next.js; ADR 018) ────────────────────────────────────
# One block for every next-admin door: a new door = its hostname added here (and on the host nginx + certificate).
# Proxy only, no path rewrite: next-admin's middleware.ts serves each host's paths under its door page and 404s every
# other API (lib/portal/doors.ts).
server {
    listen 80;
    server_name social.aware-wave.com tarot.aware-wave.com studio.aware-wave.com video.aware-wave.com design.aware-wave.com;

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-XSS-Protection        "1; mode=block"                   always;

    if ($is_trusted_source = 0) { return 444; }
    # middleware.ts decides this door's paths from the WHATWG-normalized path while Next routes the raw one; refuse
    # encoded dots/slashes and dot segments so both see the same path (critic 2026-10-15 L1). Path only: the query may
    # carry encoded slashes (/login?next=%2F, /_next/image?url=%2F...).
    if ($request_uri ~* "^[^?]*(%2e|%2f|%5c|/\.\.?(/|\?|$))") { return 400; }
    # Paths the middleware matcher skips (next-admin middleware.ts config.matcher) never reach the door check, so this
    # door refuses them here; only _next, favicon.ico, login and the public static image folders (tarot-frames,
    # edge-masks: no data, served without login on the app host too; studio draws its edge previews from edge-masks)
    # stay. lib/__tests__/middleware-portal-guards.test.ts fails when the matcher gains an exclusion this list does not
    # cover (Codex 2026-10-15 F1).
    location ~ ^/(intake|api/auth|api/webhooks|api/internal|vector-editor\.html) { return 404; }
    location ~* \.(env|sql|bak|old|log|swp|tmp|ini|htpasswd)$ { return 444; }

    location / {
        limit_req zone=admin burst=40 nodelay;
        set $backend http://next-admin:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# ── Cognitive OS Phase 1 API (Python/FastAPI, standalone -- separate deploy from lobster-phase1
#    itself, own docker-compose project, joins lobster-net externally, same pattern oracle-web
#    already establishes) ──────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name cognitive.aware-wave.com;

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 10M;
    # above the API's AI timeout (ai_gateway/provider.py DEFAULT_TIMEOUT_SECONDS 85), under Cloudflare's 100 s
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    # TLS ends before this nginx, so an absolute redirect would say http:// -- the /auth/handoff 302 would
    # send its one-time code over plain http first. Relative Location keeps the browser's own https.
    absolute_redirect off;

    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-XSS-Protection        "1; mode=block"                   always;

    if ($is_trusted_source = 0) { return 444; }

    location ~* \.(env|sql|bak|old|log|swp|tmp|ini|htpasswd)$ { return 444; }

    # PI-b split (RESEARCH_LINES_MASTER_PLAN WC-PIb-01): /api/ -> the API, /expert/ -> the old dashboard
    # (served by the API at its root), everything else -> the web app. Upstreams are the
    # `resolve` blocks cognitive_api / cognitive_web at the top (kept connections; names re-resolved while running): a
    # stopped container 502s this site instead of failing nginx -t for every site on the host. `rewrite ... break`
    # strips the prefix; the API also accepts /api/<path> (ApiPrefixMiddleware).
    # Login: per address, generous enough for a class signing in at once (5/s, burst 300), tight enough that
    # guessing passwords from one address is slow (each try also costs a PBKDF2 hash on the API).
    location = /api/auth/login {
        limit_req zone=cognitive_login burst=300 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://cognitive_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        limit_req zone=cognitive burst=100 nodelay;
        limit_req zone=cognitive_ip burst=3000 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://cognitive_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /api { return 301 /api/; }
    location = /expert { return 301 /expert/; }

    # next-admin's open-in-Cognitive-OS links (lib/cognitive-os/client.ts) land on /auth/handoff; the
    # dashboard lives under /expert/ now, and the API's relative redirect (../?project=) follows it there
    location = /auth/handoff { return 302 /expert/auth/handoff$is_args$args; }

    location /expert/ {
        limit_req zone=cognitive burst=100 nodelay;
        limit_req zone=cognitive_ip burst=3000 nodelay;
        rewrite ^/expert/(.*)$ /$1 break;
        proxy_pass http://cognitive_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        limit_req zone=cognitive burst=100 nodelay;
        limit_req zone=cognitive_ip burst=3000 nodelay;
        proxy_pass http://cognitive_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
server {
    listen 80;
    server_name hci.aware-wave.com;

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 10M;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-XSS-Protection        "1; mode=block"                   always;

    if ($is_trusted_source = 0) { return 444; }

    location ~* \.(env|sql|bak|old|log|swp|tmp|ini|htpasswd)$ { return 444; }

    location / {
        limit_req zone=public burst=60 nodelay;
        set $backend http://hci-app:4030;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

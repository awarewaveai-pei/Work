# Phase 1 domain-split routing
# aware-wave.com / www  -> WordPress (public site)
# app.aware-wave.com    -> Next.js admin tools
#
# X-Forwarded-Proto note (2026-08-29 fix, root cause of wp-admin infinite redirect):
# This nginx is a SECOND hop — the outer host-nginx (sg-stack.aware-wave.com vhost)
# terminates TLS and always hardcodes X-Forwarded-Proto: https before forwarding here
# over plain HTTP (127.0.0.1:8083). Because THIS nginx only ever listens on port 80,
# `$scheme` here is always "http" — using it for X-Forwarded-Proto overwrites the
# correct value from hop 1 with "http", so WordPress's is_ssl() reverse-proxy check
# (wp-config.php HTTP_X_FORWARDED_PROTO snippet) always fails and wp-admin loops
# forever trying to force HTTPS on a request it thinks is already on it. Every
# location block below must forward `$http_x_forwarded_proto` (pass-through), never
# `$scheme` (this nginx's own listener scheme) — that applies to any future location
# block added here, not just the ones fixed today.
#
# Defense-in-depth — 4 layers:
#   Layer 1: Rate limiting zones
#   Layer 2: WordPress security location blocks
#   Layer 3: fail2ban on host (auto-ban repeat offenders)
#   Layer 4: Cloudflare proxy (active) + IP lock (this file)
#
# Cloudflare IP lock: all traffic not from Cloudflare or trusted IPs
# is silently dropped (444) — bots cannot bypass Cloudflare by hitting
# the real IP 5.223.93.113 directly.
#
# Real IP restoration: CF-Connecting-IP header is trusted so that
# rate limiting and fail2ban act on the actual visitor IP, not
# Cloudflare's proxy IP.

# ── Cloudflare IPv4 ranges (source: cloudflare.com/ips-v4) ──────────────────
# Update these if Cloudflare publishes new ranges (rare).
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
# EU VPS (Uptime Kuma + Netdata monitoring — direct access to SG)
set_real_ip_from 204.168.175.41/32;
set_real_ip_from 127.0.0.1/32;
# Cloudflare sets this header to the real visitor IP
real_ip_header CF-Connecting-IP;

# geo checks the ORIGINAL connecting IP ($realip_remote_addr = pre-replacement)
# so it correctly identifies Cloudflare proxies regardless of real-IP swap.
geo $realip_remote_addr $is_trusted_source {
    default 0;
    # Cloudflare IPv4
    103.21.244.0/22  1;
    103.22.200.0/22  1;
    103.31.4.0/22    1;
    104.16.0.0/13    1;
    104.24.0.0/14    1;
    108.162.192.0/18 1;
    131.0.72.0/22    1;
    141.101.64.0/18  1;
    162.158.0.0/15   1;
    172.64.0.0/13    1;
    173.245.48.0/20  1;
    188.114.96.0/20  1;
    190.93.240.0/20  1;
    197.234.240.0/22 1;
    198.41.128.0/17  1;
    # EU VPS (Uptime Kuma, Netdata — bypass Cloudflare for monitoring)
    204.168.175.41/32 1;
    # Localhost / Docker internal
    127.0.0.1/32     1;
    172.16.0.0/12    1;
}

# ── Rate limiting zones ───────────────────────────────────────────────────────
# After real_ip restoration, $binary_remote_addr is the real visitor IP.
limit_req_zone $binary_remote_addr zone=public:10m   rate=30r/s;
limit_req_zone $binary_remote_addr zone=admin:10m    rate=20r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=wplogin:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=wpadmin:10m  rate=120r/s;
limit_req_zone $binary_remote_addr zone=wpasset:10m  rate=120r/s;
limit_req_status 429;

# ── Main public site (WordPress) ─────────────────────────────────────────────
server {
    listen 80;
    server_name aware-wave.com www.aware-wave.com;

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-XSS-Protection        "1; mode=block"                   always;

    # Layer 4: Drop any direct connection that bypasses Cloudflare
    if ($is_trusted_source = 0) { return 444; }

    # ── Layer 2: WordPress security blocks ────────────────────────────────

    location = /xmlrpc.php                               { return 444; }
    location ~* wp-config\.php                           { return 444; }
    location ~* /wp-content/uploads/.*\.php$             { return 444; }
    location ~* \.(env|sql|bak|old|log|swp|tmp|ini|htpasswd|DS_Store)$ { return 444; }
    location ~* ^/(readme|license|wp-config-sample)\.(html|txt|php|md)$ { return 444; }
    location ~* ^/wp-json/wp/v2/users                    { return 403; }

    # wp-login.php: 5 attempts/min per IP (brute-force protection)
    location = /wp-login.php {
        limit_req zone=wplogin burst=2 nodelay;
        set $backend http://wordpress:80;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location /wp-admin/ {
        limit_req zone=wpadmin burst=240 nodelay;
        set $backend http://wordpress:80;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location /wp-json/ {
        limit_req zone=wpadmin burst=240 nodelay;
        set $backend http://wordpress:80;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location /wp-content/ {
        limit_req zone=wpasset burst=240 nodelay;
        set $backend http://wordpress:80;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    location /wp-includes/ {
        limit_req zone=wpasset burst=240 nodelay;
        set $backend http://wordpress:80;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    # ── Standard routing ──────────────────────────────────────────────────

    location /health {
        set $backend http://node-api:3001;
        proxy_pass $backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        limit_req zone=public burst=60 nodelay;
        set $backend http://node-api:3001;
        proxy_pass $backend/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    location / {
        limit_req zone=public burst=60 nodelay;
        set $backend http://wordpress:80;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }
}

# ── Admin console (Next.js) ───────────────────────────────────────────────────
server {
    listen 80;
    server_name app.aware-wave.com;

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-XSS-Protection        "1; mode=block"                   always;

    # Layer 4: Drop direct connections that bypass Cloudflare
    if ($is_trusted_source = 0) { return 444; }

    location ~* \.(env|sql|bak|old|log|swp|tmp|ini|htpasswd)$ { return 444; }

    # More specific than /api/webhooks/ below (nginx picks the longest matching prefix
    # regardless of declaration order) — this ONE route carries an auth secret in its query
    # string (?token=..., lib/cs/chatwoot-client.ts's verifyWebhookToken; Chatwoot's own
    # AgentBot/inbox-webhook delivery sends no signature header, confirmed from its source,
    # so a URL-embedded shared token is the actual auth mechanism here, not decoration).
    # access_log off keeps that secret out of nginx's combined log ($request logs the full
    # query string) and therefore out of promtail -> Loki (30-day retention, any Grafana
    # login can read it) — found live-leaking in production 2026-09-11, critic review.
    # Every OTHER /api/webhooks/* route has no secret in its URL and keeps normal logging.
    location /api/webhooks/chatwoot {
        access_log off;
        limit_req zone=webhook burst=20 nodelay;
        set $backend http://next-admin:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    location /api/webhooks/ {
        limit_req zone=webhook burst=20 nodelay;
        set $backend http://next-admin:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    location /api/ops/inbox/health {
        set $backend http://next-admin:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        limit_req zone=admin burst=40 nodelay;
        set $backend http://next-admin:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# ── Node API（dedicated subdomain — 2026-08-29 補：DNS/文件早有此網域，nginx 從未接線，
#    請求一律無 server_name 匹配掉進上面 WordPress 預設區塊，靜默錯發） ─────────────
server {
    listen 80;
    server_name api.aware-wave.com;

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-XSS-Protection        "1; mode=block"                   always;

    if ($is_trusted_source = 0) { return 444; }

    location ~* \.(env|sql|bak|old|log|swp|tmp|ini|htpasswd)$ { return 444; }

    location / {
        limit_req zone=public burst=60 nodelay;
        set $backend http://node-api:3001;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}


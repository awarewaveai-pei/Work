# Trigger.dev — https://trigger.aware-wave.com
# THIS FILE: Docker-nginx config for local/staging setups only.
#
# EU VPS SSOT: lobster-factory/infra/hetzner-phase1-core/nginx/system-sites/trigger-eu-vps.conf
#   → /etc/nginx/sites-available/trigger.aware-wave.com on 204.168.175.41
#   → proxies to 127.0.0.1:8030 (trigger-webapp), 127.0.0.1:9000 (MinIO)
#
# Docker nginx (lobster-nginx) does NOT serve trigger on EU VPS — system nginx handles it.

server {
    listen 80;
    server_name trigger.aware-wave.com;

    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # MinIO packets bucket (deployment artifacts)
    location ^~ /packets/ {
        proxy_pass http://trigger-minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        # Trigger.dev v4 webapp listens on container port 3000 (v3 used 3030).
        proxy_pass http://trigger-webapp:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (Electric SQL real-time + dashboard)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}

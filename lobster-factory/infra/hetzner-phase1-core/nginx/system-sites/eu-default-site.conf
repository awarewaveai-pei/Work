# EU VPS — default (catch-all) server block for port 80
# SSOT: lobster-factory/infra/hetzner-phase1-core/nginx/system-sites/eu-default-site.conf
#
# Purpose: rate-limit + scanner-sink for unmatched direct-IP and unknown-hostname requests.
# Replaces the stock Ubuntu nginx default that has no rate limiting.
# EU scanners hit direct-IP on port 80 (not via Cloudflare), so this is the first defense layer.
#
# Install (EU VPS only):
#   sudo cp scanner-block.inc /etc/nginx/snippets/scanner-block.inc
#   sudo cp eu-default-site.conf /etc/nginx/sites-available/eu-default-site
#   sudo ln -sf /etc/nginx/sites-available/eu-default-site /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Rate-limit zone general (30r/s) defined in /etc/nginx/conf.d/rate-limit-zones.conf.
# Rollback: sudo ln -sf /etc/nginx/sites-available/default.bak /etc/nginx/sites-enabled/default

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Aggressive rate limit for catch-all port 80: direct-hit scanners generate burst probes.
    # burst=10 allows brief legitimate bursts; nodelay = immediate rejection of excess.
    limit_req zone=general burst=10 nodelay;

    # Sink confirmed scanner probe paths to scanner.log (invisible to Netdata web_log).
    # Zone general (30r/s) is already defined in conf.d/rate-limit-zones.conf.
    include /etc/nginx/snippets/scanner-block.inc;

    # All other unrecognised requests on port 80: close connection with no response.
    # Legitimate traffic uses HTTPS (port 443) with a known hostname.
    location / {
        access_log /var/log/nginx/scanner.log combined;
        return 444;
    }
}

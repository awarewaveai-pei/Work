# System nginx (VPS) — apex aware-wave.com (SG VPS host nginx, port 443 only)
#
# Port 80 is NOT handled here: Docker lobster-nginx serves HTTP on port 80.
# This host-nginx block handles only HTTPS (443) for Cloudflare-proxied traffic.
#
# Install (paths match Ubuntu nginx layout):
#   sudo cp lobster-aware-wave-locations.inc /etc/nginx/snippets/lobster-aware-wave-locations.inc
#   sudo cp scanner-block.inc /etc/nginx/snippets/scanner-block.inc
#   sudo cp aware-wave-phase1.conf /etc/nginx/sites-available/aware-wave-phase1
#   sudo ln -sf /etc/nginx/sites-available/aware-wave-phase1 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Rate-limit zones are defined in /etc/nginx/conf.d/aware-wave-security.conf.
# Limits are applied in location snippets so WordPress admin/editor asset bursts are not
# treated like public scanner floods.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aware-wave.com www.aware-wave.com;

    ssl_certificate     /etc/letsencrypt/live/aware-wave.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aware-wave.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Sink confirmed scanner probe paths to scanner.log (invisible to Netdata web_log).
    include /etc/nginx/snippets/scanner-block.inc;

    include snippets/lobster-aware-wave-locations.inc;
}

# trust.aware-wave.com — brand subdomain reserved 2026-08-29, no backend yet (placeholder only).
# See agency-os/docs/edge-and-domains/PRODUCT_DOMAIN_IA_PLAN.md §2.
# Live at: ks-aw-01 /etc/nginx/sites-available/trust.aware-wave.com
server {
    listen 80;
    server_name trust.aware-wave.com;
    include /etc/nginx/snippets/cf-only.conf;
    include /etc/nginx/snippets/coming-soon.conf;
}
server {
    listen 443 ssl http2;
    server_name trust.aware-wave.com;
    include /etc/nginx/snippets/cf-only.conf;
    ssl_certificate     /etc/letsencrypt/live/aware-wave.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aware-wave.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    include /etc/nginx/snippets/coming-soon.conf;
}

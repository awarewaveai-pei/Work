# EU VPS (204.168.175.41) — system nginx — n8n.aware-wave.com
# n8n automation platform
# Upstream: n8n container on 127.0.0.1:5678
# SSL cert: shared SAN on supabase.aware-wave.com (managed by Certbot)
#
# Install (EU VPS):
#   sudo cp n8n-aware-wave.conf /etc/nginx/sites-available/n8n.aware-wave.com
#   sudo ln -sf /etc/nginx/sites-available/n8n.aware-wave.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name n8n.aware-wave.com;
    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/supabase.aware-wave.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/supabase.aware-wave.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = n8n.aware-wave.com) { return 301 https://$host$request_uri; }
    listen 80;
    server_name n8n.aware-wave.com;
    return 404;
}

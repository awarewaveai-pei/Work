# ks-aw-01 host nginx SSOT for the consolidated AwareWave stack.
# TLS terminates here; lobster-nginx on 127.0.0.1:8083 owns application routing/rate limits.
# Deploy to /etc/nginx/sites-available/sg-stack.aware-wave.com only through
# scripts/safe-infra-patch.sh host-nginx, then verify the public hosts.

# HSTS is deliberately scoped to the operator app only. Empty add_header values are omitted by
# nginx, so the other shared-vhost hosts do not inherit this policy. Do not add includeSubDomains
# or preload: both expand the rollback blast radius beyond this origin.
map $host $awarewave_app_hsts {
    default "";
    app.aware-wave.com "max-age=31536000";
}

server {
    listen 80;
    server_name aware-wave.com www.aware-wave.com api.aware-wave.com app.aware-wave.com
                oracle.aware-wave.com portal.aware-wave.com cognitive.aware-wave.com hci.aware-wave.com
                social.aware-wave.com tarot.aware-wave.com studio.aware-wave.com;
    include /etc/nginx/snippets/cf-only.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aware-wave.com www.aware-wave.com api.aware-wave.com app.aware-wave.com
                oracle.aware-wave.com portal.aware-wave.com cognitive.aware-wave.com hci.aware-wave.com
                social.aware-wave.com tarot.aware-wave.com studio.aware-wave.com;

    include /etc/nginx/snippets/cf-only.conf;
    ssl_certificate /etc/letsencrypt/live/aware-wave.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aware-wave.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security $awarewave_app_hsts always;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 100m;
        proxy_read_timeout 300s;
    }
}

# Safety net: ANY hostname reaching this host without a matching server_name
# lands here (default_server) instead of silently falling through to whichever
# vhost happens to sort first alphabetically in sites-enabled/ — that exact
# failure mode routed docs/trust.aware-wave.com into mainwp's login page on
# 2026-08-29 (root cause: no default_server was ever declared for :443).
# Closes the bug class for any future orphaned/forgotten subdomain, not just
# today's two names. See agency-os/WORKLOG.md 2026-08-29（續17）.
# Live at: ks-aw-01 /etc/nginx/sites-available/00-default-placeholder
server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/snippets/cf-only.conf;
    include /etc/nginx/snippets/coming-soon.conf;
}
server {
    listen 443 ssl http2 default_server;
    server_name _;
    include /etc/nginx/snippets/cf-only.conf;
    ssl_certificate     /etc/letsencrypt/live/aware-wave.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aware-wave.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    include /etc/nginx/snippets/coming-soon.conf;
}

# EU VPS (204.168.175.41) — system nginx — mainwp.aware-wave.com
# MainWP Dashboard WordPress installation
# Upstream: mainwp-web container on 127.0.0.1:8090
# SSL cert: shared SAN on supabase.aware-wave.com (managed by Certbot)
#
# Rate-limit zones defined in: /etc/nginx/conf.d/rate-limit-zones.conf
# (SSOT: eu-rate-limit-zones.conf in this directory)
#
# Install (EU VPS):
#   sudo cp mainwp-aware-wave.conf /etc/nginx/sites-available/mainwp.aware-wave.com
#   sudo ln -sf /etc/nginx/sites-available/mainwp.aware-wave.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name mainwp.aware-wave.com;

    # ACME challenge passthrough (certbot needs this)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block xmlrpc.php entirely
    location = /xmlrpc.php {
        deny all;
        return 403;
    }
    location ~* wp-config\.php                              { return 444; }
    location ~* \.(env|sql|bak|old|log|swp|tmp|ini)$       { return 444; }

    # Rate-limit wp-login.php (5r/m, burst 2, nodelay)
    location = /wp-login.php {
        limit_req zone=wp_login burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate-limit wp-admin area (30r/m, burst 10)
    location /wp-admin/ {
        limit_req zone=wp_admin burst=10;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # All other traffic
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/supabase.aware-wave.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/supabase.aware-wave.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = mainwp.aware-wave.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name mainwp.aware-wave.com;
    return 404; # managed by Certbot
}

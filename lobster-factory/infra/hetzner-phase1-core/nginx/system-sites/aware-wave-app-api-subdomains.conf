# System nginx — Cloudflare-facing subdomains (same VPS as apex aware-wave.com)
#
# api.aware-wave.com  → node-api (127.0.0.1:3001)
# app.aware-wave.com  → next-admin (127.0.0.1:3002) — serves at / (no basePath)
#
# Install:
#   sudo cp scanner-block.inc /etc/nginx/snippets/scanner-block.inc
#   sudo cp aware-wave-app-api-subdomains.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/aware-wave-app-api-subdomains.conf /etc/nginx/sites-enabled/app
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: one SAN cert for api + app
#   sudo certbot certonly --nginx -d api.aware-wave.com -d app.aware-wave.com
#
# Rate-limit zone req_perip (30r/s) defined in /etc/nginx/conf.d/aware-wave-security.conf.

server {
    server_name app.aware-wave.com;

    # Rate limit: 30r/s with burst of 50; rejects excess immediately (nodelay).
    limit_req zone=req_perip burst=50 nodelay;

    # Sink confirmed scanner probe paths to scanner.log (invisible to Netdata web_log).
    include /etc/nginx/snippets/scanner-block.inc;

    # /admin was old basePath — redirect to root for backwards compat
    location ~ ^/admin/?$ { return 301 /; }

    # Public health check for smoke tests and external uptime probes.
    location = /api/ops/repairs/health {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/ops-proxy-headers.inc;
        client_max_body_size 50M;
        proxy_read_timeout 300s;
    }

    # Repair Center write APIs are operator-facing controls. They are protected
    # by the same Basic Auth boundary as /ops/* pages, then mapped to admin.
    location ^~ /api/ops/repairs {
        auth_basic "Aware Wave Admin";
        auth_basic_user_file /etc/nginx/.htpasswd_studio;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/ops-proxy-headers.inc;
        proxy_set_header x-ops-claims-role admin;
        client_max_body_size 50M;
        proxy_read_timeout 300s;
    }

    # Integration mutation APIs change customer/provider bindings and secret references.
    # Keep them behind the admin boundary until customer-scoped auth claims are available.
    location ^~ /api/ops/integrations {
        auth_basic "Aware Wave Admin";
        auth_basic_user_file /etc/nginx/.htpasswd_studio;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/ops-proxy-headers.inc;
        proxy_set_header x-ops-claims-role admin;
        client_max_body_size 50M;
        proxy_read_timeout 300s;
    }

    # Ops API path: apply trusted proxy headers for role resolution.
    # Install snippet to /etc/nginx/snippets/ops-proxy-headers.inc
    location ^~ /api/ops/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/ops-proxy-headers.inc;
        client_max_body_size 50M;
        proxy_read_timeout 300s;
    }

    # Build Console API: same trusted-proxy boundary as ops APIs.
    # v1 maps authenticated internal tools traffic to operator; production changes still queue approval-gated runs only.
    location ^~ /api/build/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/ops-proxy-headers.inc;
        proxy_set_header x-ops-claims-role operator;
        client_max_body_size 50M;
        proxy_read_timeout 300s;
    }


    # All /api/ paths: no Basic Auth (Telegram webhook, ops APIs, build APIs, internal).
    # More-specific ^~ /api/ops/ and ^~ /api/build/ blocks above take priority for their paths.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 50M;
        proxy_read_timeout 300s;
    }

    location / {
        auth_basic "Aware Wave Admin";
        auth_basic_user_file /etc/nginx/.htpasswd_studio;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/snippets/ops-proxy-headers.inc;
        proxy_set_header x-ops-claims-role admin;
        client_max_body_size 50M;
        proxy_read_timeout 300s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.aware-wave.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aware-wave.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    include /etc/nginx/snippets/security-headers.inc;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name api.aware-wave.com;

    # Rate limit: 30r/s with burst of 50; rejects excess immediately (nodelay).
    limit_req zone=req_perip burst=50 nodelay;

    # Sink confirmed scanner probe paths to scanner.log (invisible to Netdata web_log).
    include /etc/nginx/snippets/scanner-block.inc;

    location / {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 50M;
        proxy_read_timeout 300s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.aware-wave.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aware-wave.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    include /etc/nginx/snippets/security-headers.inc;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

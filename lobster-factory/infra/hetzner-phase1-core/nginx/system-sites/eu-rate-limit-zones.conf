# EU VPS (204.168.175.41) — /etc/nginx/conf.d/rate-limit-zones.conf
# Shared rate-limit zones — loaded once in http context, used by all vhosts
# Permissions: 644 (root:root)
#
# Install (EU VPS):
#   sudo cp eu-rate-limit-zones.conf /etc/nginx/conf.d/rate-limit-zones.conf
#   sudo chmod 644 /etc/nginx/conf.d/rate-limit-zones.conf
#   sudo nginx -t && sudo systemctl reload nginx

# WordPress zones
limit_req_zone $binary_remote_addr zone=wp_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=wp_admin:10m rate=30r/m;

# General rate limit for non-WP services (n8n, trigger, uptime)
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

# Throttled excess returns 429 (Too Many Requests), NOT the default 503. Set once at http
# context so every vhost inherits it: defensive rate-limiting is not a server failure and must
# stay out of Netdata's 5xx CRITICAL alarm (only true upstream failures 502/504 stay 5xx).
# Mirrors the SG convention (default.conf:75, aware-wave-phase1.conf, app-api-subdomains).
limit_req_status 429;

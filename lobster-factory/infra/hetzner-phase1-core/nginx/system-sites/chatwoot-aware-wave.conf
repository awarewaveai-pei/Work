# KS-AW-01 — system nginx — chatwoot.aware-wave.com
# Chatwoot Community Edition (U6 carrier). Upstream: chatwoot-rails container on 127.0.0.1:4008.
# SSL cert: shared SAN on supabase.aware-wave.com (managed by Certbot) — same pattern as
# n8n-aware-wave.conf / other system-sites vhosts on this host.
#
# WebSocket upgrade headers are required at `/` (not just a separate /cable location) — Chatwoot's
# ActionCable serves over the SAME Rails process/port at the /cable path off this one upstream, so
# a single location block with Upgrade/Connection covers both the dashboard and the widget's
# real-time channel (lib/cs-widget/chatwoot-transport.ts connects to `${baseUrl}/cable`).
#
# Install (ks-aw-01):
#   sudo cp scanner-block.inc /etc/nginx/snippets/scanner-block.inc   # if not already present
#   sudo cp chatwoot-aware-wave.conf /etc/nginx/sites-available/chatwoot.aware-wave.com
#   sudo ln -sf /etc/nginx/sites-available/chatwoot.aware-wave.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name chatwoot.aware-wave.com;

    # nginx drops any request header containing an underscore by default (`underscores_in_headers`
    # defaults to off) — Chatwoot's API auth is the header `api_access_token`, which has one. Without
    # this, every API call 401s as "not signed in" with no indication the header was ever stripped
    # (confirmed 2026-09-11: real Chatwoot tokens all "failed" until this line was added).
    underscores_in_headers on;

    # Direct-origin-IP bypass guard — matches 00-default-placeholder's newer, more complete pattern
    # (n8n-aware-wave.conf predates this hardening and lacks it; not copying that gap into a new file).
    include /etc/nginx/snippets/cf-only.conf;
    include /etc/nginx/snippets/scanner-block.inc;

    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://127.0.0.1:4008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/supabase.aware-wave.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/supabase.aware-wave.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = chatwoot.aware-wave.com) { return 301 https://$host$request_uri; }
    listen 80;
    server_name chatwoot.aware-wave.com;
    return 404;
}

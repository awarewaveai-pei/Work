# mpm_prefork sized to the container memory limit (docker-compose.yml mainwp-web); scripts/check-compose-invariants.py I5
# checks MaxRequestWorkers x worker_rss_mb + base_mb <= that limit. Image default 150 workers: 12 OOM kills by 2026-10-24.
# worker_rss_mb measured 2026-10-24 (40-48 MB). Mounted read-only; the host copy is /root/mainwp/apache-mpm-prefork.conf.
# worker_rss_mb: 60
# base_mb: 128
<IfModule mpm_prefork_module>
	StartServers			2
	MinSpareServers			1
	MaxSpareServers			3
	MaxRequestWorkers		6
	MaxConnectionsPerChild	1000
</IfModule>

version: "3.9"

services:
  mainwp-db:
    image: mysql:8.0
    container_name: mainwp-db
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mainwp
      MYSQL_USER: mainwp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mainwp_db:/var/lib/mysql
      - ./mysql-config/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - mainwp_internal
    memswap_limit: 512M
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.25"
          pids: 512
    healthcheck:
      test: ["CMD", "timeout", "4", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mainwp-web:
    image: wordpress:6.7-apache
    container_name: mainwp-web
    restart: unless-stopped
    depends_on:
      mainwp-db:
        condition: service_healthy
    env_file: .env
    environment:
      WORDPRESS_DB_HOST: mainwp-db:3306
      WORDPRESS_DB_NAME: mainwp
      WORDPRESS_DB_USER: mainwp
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX}
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        define('WP_DEBUG', false);
        define('DISABLE_WP_CRON', true);
        define('WP_POST_REVISIONS', 3);
        define('EMPTY_TRASH_DAYS', 7);
        define('WP_AUTO_UPDATE_CORE', 'minor');
        define('FORCE_SSL_ADMIN', true);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - mainwp_files:/var/www/html
      - ./apache-mpm-prefork.conf:/etc/apache2/mods-available/mpm_prefork.conf:ro
    networks:
      - mainwp_internal
    memswap_limit: 512M
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.25"
          pids: 256
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 4 -o /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mainwp_db:
    driver: local
  mainwp_files:
    driver: local

networks:
  mainwp_internal:
    driver: bridge
    internal: false

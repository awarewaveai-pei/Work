body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--body-bg);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 0;
  border-radius: 8px;
  padding: 9px 20px;
  font-size: 14px; /* text you read is never under 14px (operator 2026-10-14) */
  font-weight: 700;
  color: var(--btn-primary-text);
  background: var(--accent);
  cursor: pointer;
  letter-spacing: -0.01em;
  transition: background .15s, box-shadow .15s;
  box-shadow: 0 1px 4px rgb(99 102 241/.25);
}
.btn-primary:hover {
  background: var(--accent-hover);
  box-shadow: 0 2px 8px rgb(99 102 241/.35);
}
.btn-primary:disabled {
  opacity: .45;
  cursor: not-allowed;
  box-shadow: none;
}
.btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  background: var(--btn-secondary-bg);
  border: 1px solid var(--btn-secondary-border);
  border-radius: 8px;
  font-size: 14px; /* text you read is never under 14px (operator 2026-10-14) */
  font-weight: 600;
  color: var(--btn-secondary-text);
  cursor: pointer;
  text-decoration: none;
  transition: background .15s, border-color .15s;
}
.btn-secondary:hover {
  background: var(--body-bg);
  border-color: var(--btn-secondary-hover-border);
}
/* app-theme:end */
/* mock-local: layout + type scale (the app has no type tokens yet; text you read is never under 14px, labels >= 12px) */
:root{ --fs-h1:18px; --fs-h2:15px; --fs-body:14px; --fs-tag:12px; --ed-w:580px; --av:34px; --thumb-h:46px; }
/* platform brand colours (--p-*): app tokens in globals.css, copied above with the rest */

html,body{height:100%}
body{margin:0;font-size:var(--fs-body);font-variant-numeric:tabular-nums} /* font family, colours: the app's body rule above */
*{box-sizing:border-box}
button{font:inherit;color:var(--btn-secondary-text);background:var(--btn-secondary-bg);border:1px solid var(--btn-secondary-border);border-radius:var(--radius-sm);padding:5px 10px;cursor:pointer;line-height:1.4}
button:hover{background:var(--bg-hover)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.danger{color:var(--red);border-color:var(--red)}
.btn-primary,.btn-secondary{line-height:1.4;white-space:nowrap;flex:none}
input,textarea{font:inherit;color:inherit;background:var(--form-input-bg);border:1px solid var(--btn-secondary-border);border-radius:var(--radius-sm);padding:5px 8px;min-width:0}
textarea{width:100%;resize:none;line-height:1.6}
.muted{color:var(--text-muted)}
.tag{font-size:var(--fs-tag)}
.err{color:var(--red)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* the three kinds of control (U1) + values */
.seg{display:inline-flex;align-items:center;background:var(--bg-subtle);border:1px solid var(--card-border);border-radius:var(--radius-sm);padding:2px;gap:2px;flex:none}
.seg button{border:0;background:transparent;padding:3px 10px;border-radius:6px;color:var(--text-muted);font-weight:600;white-space:nowrap}
.seg button:hover{color:var(--text-primary);background:var(--bg-hover)}
.seg button.on{background:var(--card-bg);color:var(--text-primary);box-shadow:var(--shadow)}
.ibtn{display:inline-grid;place-items:center;width:30px;height:30px;padding:0;border-color:transparent;background:transparent;color:var(--text-muted);flex:none}
.ibtn:hover{color:var(--text-primary)}
.ibtn.on{color:var(--accent);background:var(--accent-light)}
.lnk{border:0;background:transparent;color:var(--accent);padding:0 4px;font-weight:600}
.lnk:hover{background:transparent;text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:999px;font-size:var(--fs-tag);background:var(--accent-light);color:var(--accent);border:1px solid transparent;white-space:nowrap}
.pill{display:inline-block;padding:0 8px;border-radius:999px;font-size:var(--fs-tag);color:var(--btn-primary-text);background:var(--status-ignored);white-space:nowrap}
.pill[data-state="scheduled"],.pill[data-st="review"]{background:var(--yellow)} .pill[data-state="published"],.pill[data-st="connected"]{background:var(--green)} .pill[data-state="error"],.pill[data-st="expired"]{background:var(--red)} .pill[data-state="review"]{background:var(--severity-low)} .pill[data-state="rotation"]{background:var(--accent)}
.ck{display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 0}
.ck input{margin:0;accent-color:var(--accent)}
.sbar{width:4px;height:16px;border-radius:2px;background:var(--status-ignored);flex:none}
.pf{display:inline-flex;width:18px;height:18px;border-radius:50%;color:var(--p-ink);font-size:var(--fs-tag);line-height:18px;justify-content:center;font-weight:700;flex:none}
.pf-facebook{background:var(--p-fb)} .pf-instagram{background:var(--p-ig)} .pf-threads{background:var(--p-th)} .pf-linkedin{background:var(--p-li)} .pf-bluesky{background:var(--p-bs)} .pf-wordpress{background:var(--p-wp)}
/* brand avatars (the account picture from Postiz in the product, F17) */
.av{width:var(--av);height:var(--av);border-radius:50%;display:inline-grid;place-items:center;color:var(--p-ink);font-weight:700;flex:none}
.av.soulful{background:radial-gradient(circle at 30% 30%,var(--p-ig) 0 18%,transparent 48%),radial-gradient(circle at 72% 70%,var(--yellow) 0 16%,transparent 52%),var(--p-bs)}
.av.awarewave{background:linear-gradient(135deg,var(--sidebar-logo-gradient-start),var(--sidebar-logo-gradient-end))}
.av.fresh{background:var(--status-ignored)}
.av.s32{width:32px;height:32px}
.av.sq{border-radius:6px}
/* sample photos: the post images in the mock, drawn with app tokens */
.ph{background-color:var(--badge-yellow-bg)}
.ph-1{background:radial-gradient(circle at 28% 38%,var(--p-ig) 0 14%,transparent 34%),radial-gradient(circle at 70% 58%,var(--yellow) 0 18%,transparent 40%),radial-gradient(circle at 46% 92%,var(--p-bs) 0 12%,transparent 34%),var(--badge-yellow-bg)}
.ph-2{background:radial-gradient(circle at 70% 30%,var(--green) 0 12%,transparent 36%),radial-gradient(circle at 25% 70%,var(--accent) 0 16%,transparent 42%),var(--icon-ops-bg)}
.ph-3{background:radial-gradient(circle at 50% 45%,var(--red) 0 10%,transparent 30%),radial-gradient(circle at 20% 25%,var(--yellow) 0 14%,transparent 38%),radial-gradient(circle at 82% 80%,var(--p-li) 0 14%,transparent 38%),var(--badge-gray-bg)}
.ph-4{background:linear-gradient(160deg,var(--accent-light),transparent 60%),radial-gradient(circle at 60% 60%,var(--p-ig) 0 20%,transparent 46%),var(--intake-success-bg)}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);padding-inline:16px;gap:10px} /* minmax(0,...): a wide table scrolls inside its panel, never widens the page */
header{display:flex;align-items:center;gap:14px;padding-top:10px;min-width:0}
header h1{font-size:var(--fs-h1);margin:0;white-space:nowrap}
header>*{flex:none}
.hright{flex:1 1 auto;justify-content:flex-end}
header{position:relative}
.hpop{top:52px;right:0;width:300px;z-index:8}
.tzbtn{padding:5px 10px;color:var(--text-muted)}
#bulkBtn b{color:var(--accent)}
.bulkmenu{top:52px;bottom:auto;right:12px}
.seg .mk{display:none}
.brands button{max-width:170px;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:2px}
.nav button{border:0;background:transparent;padding:5px 10px;color:var(--text-muted);font-weight:600;border-radius:6px;white-space:nowrap}
.nav button.on{color:var(--accent);background:var(--accent-light)}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.note{color:var(--text-muted);white-space:nowrap}
.role{display:flex;align-items:center;gap:6px}
.bell{position:relative}
.bell b{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:var(--btn-primary-text);font-size:var(--fs-tag);line-height:18px;text-align:center}
.bell b.zero{display:none}
.fab{display:none}

main{display:grid;grid-template-columns:minmax(0,1fr) var(--ed-w);gap:12px;min-height:0;padding-bottom:14px}
main.full{grid-template-columns:minmax(0,1fr)}
.panel{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);box-shadow:var(--shadow);min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.ptop{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--card-border);min-height:48px;flex:none}
.ptop h2{font-size:var(--fs-h2);margin:0;white-space:nowrap}
.ptop .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.search{display:flex;align-items:center;gap:4px;border:1px solid var(--btn-secondary-border);border-radius:var(--radius-sm);padding:0 6px;color:var(--text-muted)}
.search input{border:0;padding:4px 0;width:110px;background:transparent}
.search:focus-within{border-color:var(--accent)}
#filterBtn{padding:5px 12px}
#filterBtn b{color:var(--accent)}
.pop{position:absolute;z-index:5;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);box-shadow:var(--shadow-hover);padding:12px;display:flex;flex-direction:column;gap:8px}
.pop h3{font-size:var(--fs-tag);color:var(--text-muted);margin:0;font-weight:600}
.filters{top:52px;right:12px;width:320px}
.filters .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.filters .ft{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--card-border);padding-top:8px}

/* week: one column a day, cards stacked in time order (U3) */
.week{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{border-left:1px solid var(--card-border);display:flex;flex-direction:column;min-height:0;min-width:0}
.day:first-child{border-left:0}
.day.past{background:repeating-linear-gradient(135deg,transparent 0 9px,var(--bg-subtle) 9px 18px)}

function addLog(act, p, res){ B().log.unshift({t:"10/14 "+new Date().toTimeString().slice(0,5), who:ME(), act, txt:(p&&(p.text||p.title))||"", res:res||""}); renderHeader(); }
function side(html){ $("sideView").innerHTML=html; }
function renderLists(){
  const ls=B().lists;
  if(!ls.length){ side(`<div class="ptop"><h2>輪播清單</h2></div>`+emptyHtml("repost","還沒有輪播清單","清單裡的貼文會照順序，一則一則輪流發。","＋ 建第一個清單","newList")); $("newList").onclick=newList; return; }
  if(!ls.some(l=>l.id===selectedList)) selectedList=ls[0].id; const l=ls.find(x=>x.id===selectedList);
  side(`<div class="ptop"><h2>輪播清單</h2><span class="muted">照順序輪流發，發完最後一則再從第一則開始。</span><span class="r"><button type="button" class="btn-secondary" id="newList">＋ 新清單</button></span></div>
  <div class="cols2"><div class="lcol">${ls.map(x=>`<button type="button" class="lst ${x.on?"":"off"} ${x.id===selectedList?"sel":""}" data-id="${x.id}"><b>${esc(x.name)}（${x.queue.length} 則）</b><span class="nx muted">${x.on?"進行中":"已暫停"} · 每週 ${x.slots.length} 個時段</span><span class="nx muted">下一則：${esc(nextRun(x))}</span></button>`).join("")}</div>
  <div class="ldet">
    <div class="frow"><span class="lab">名稱</span><input type="text" id="ldName" value="${esc(l.name)}" aria-label="清單名稱"></div>
    <div class="frow top"><span class="lab">時段</span><div class="slots"><div class="sgrid7"><span></span>${DOW.map(n=>`<span class="muted">${n}</span>`).join("")}<span></span>${l.times.map(t=>`<span class="muted tag">${t}</span>${DOW.map((_,i)=>{ const k=(i+1)+"@"+t, on=l.slots.includes(k); return `<button type="button" class="slot ${on?"on":""}" data-slot="${k}" aria-pressed="${on}" aria-label="週${DOW[i]} ${t}"></button>`; }).join("")}<button type="button" class="ibtn" data-rmtime="${t}" aria-label="拿掉 ${t} 這一列" title="拿掉這一列">${I("x")}</button>`).join("")}</div><span class="acts"><button type="button" class="lnk" id="ldAddTime">＋ 加一個時間</button><span class="muted tag">點格子＝那天那個時間發一則</span></span></div></div>
    <div class="frow"><span class="lab">發到</span><span class="acts" id="ldAccts">${B().accounts.map(a=>`<button type="button" class="cav ${l.pfs.includes(a.pf)?"on":""}" data-pf="${a.pf}" ${a.st!=="connected"?"disabled":""} title="${PF[a.pf].n} ${esc(a.handle)}" aria-label="${PF[a.pf].n}">${bav()}${pfb(a.pf)}</button>`).join("")}</span></div>
    <div class="frow"><span class="lab">下一則</span><span>${esc(nextRun(l))}</span></div>
    <div class="queue">${l.queue.length ? l.queue.map((t,i)=>`<div class="qrow ${i===l.cursor?"next":""}"><span class="n">第 ${i+1} 則${i===l.cursor?"・下一則":""}</span><span class="tx" title="${esc(t)}">${esc(t)}</span><span class="acts"><button type="button" class="ibtn" data-up="${i}" aria-label="往上">${I("up")}</button><button type="button" class="ibtn" data-down="${i}" aria-label="往下">${I("down")}</button><button type="button" class="ibtn" data-rm="${i}" aria-label="移除">${I("x")}</button></span></div>`).join("") : `<div class="muted">清單還是空的。按「從草稿加入」，或寫貼文時選「輪播清單」。</div>`}</div>
    <div class="hint" id="ldHint"></div>
    <div class="acts"><button type="button" id="ldAdd">從草稿加入</button><button type="button" id="ldToggle">${l.on?"暫停":"開始輪播"}</button><button type="button" class="danger" id="ldDel">刪除清單</button><button type="button" class="btn-primary" id="ldSave">儲存</button></div>
  </div></div>`);
  wireIcons($("sideView"));
  $("newList").onclick=newList;
  $("sideView").querySelectorAll(".lst").forEach(x=>x.onclick=()=>{ selectedList=x.dataset.id; renderLists(); });
  $("sideView").querySelectorAll("[data-slot]").forEach(x=>x.onclick=()=>{ const k=x.dataset.slot, i=l.slots.indexOf(k); i<0?l.slots.push(k):l.slots.splice(i,1); renderLists(); });
  $("sideView").querySelectorAll("[data-rmtime]").forEach(x=>x.onclick=()=>{ const t=x.dataset.rmtime; l.times=l.times.filter(y=>y!==t); l.slots=l.slots.filter(y=>!y.endsWith("@"+t)); renderLists(); });
  $("ldAddTime").onclick=()=>openDtp($("ldAddTime"), null, "14:00", t=>{ if(!l.times.includes(t)){ l.times.push(t); l.times.sort(); } renderLists(); });
  $("ldAccts").querySelectorAll("button:not([disabled])").forEach(x=>x.onclick=()=>{ const k=x.dataset.pf; l.pfs.includes(k)?l.pfs.splice(l.pfs.indexOf(k),1):l.pfs.push(k); renderLists(); });
  $("sideView").querySelectorAll("[data-up]").forEach(x=>x.onclick=()=>{ const i=+x.dataset.up; if(i>0){ [l.queue[i-1],l.queue[i]]=[l.queue[i],l.queue[i-1]]; renderLists(); } });
  $("sideView").querySelectorAll("[data-down]").forEach(x=>x.onclick=()=>{ const i=+x.dataset.down; if(i<l.queue.length-1){ [l.queue[i+1],l.queue[i]]=[l.queue[i],l.queue[i+1]]; renderLists(); } });
  $("sideView").querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{ l.queue.splice(+x.dataset.rm,1); if(l.cursor>=l.queue.length) l.cursor=0; renderLists(); });
  $("ldSave").onclick=()=>{ l.name=$("ldName").value.trim()||l.name; renderLists(); $("ldHint").textContent="已儲存。下一則："+nextRun(l); };
  $("ldToggle").onclick=()=>{ if(!l.on&&(!l.slots.length||!l.queue.length||!l.pfs.length)){ $("ldHint").innerHTML='<span class="err">要先勾至少一個時段、至少一則貼文、至少一個帳號，才能開始輪播。</span>'; return; } l.on=!l.on; renderLists(); };
  $("ldDel").onclick=()=>{ B().lists=B().lists.filter(x=>x.id!==l.id); selectedList=null; renderLists(); };
  $("ldAdd").onclick=()=>{ const drafts=B().posts.filter(p=>p.state==="draft"&&!p.kind); if(!drafts.length){ $("ldHint").textContent="這個品牌目前沒有草稿。"; return; }
    $("ldHint").innerHTML="挑一則草稿："+drafts.map(p=>`<button type="button" class="lnk" data-add="${p.id}">${esc(p.text.slice(0,14))}…</button>`).join(" ");
    $("ldHint").querySelectorAll("[data-add]").forEach(x=>x.onclick=()=>{ const p=B().posts.find(y=>y.id===+x.dataset.add); l.queue.push(p.text); Object.assign(p,{state:"rotation",listId:l.id,date:"",time:""}); renderLists(); }); };
}
// deleted posts (S5): own view, with when and who deleted it; restore puts it back as it was
function renderTrash(){ const ps=B().posts.filter(p=>p.state==="deleted");
  side(`<div class="ptop"><h2>已刪除</h2><span class="muted">刪掉的貼文留在這裡，可以還原。</span></div>` + (ps.length
    ? `<div class="list"><table><thead><tr><th>排定時間</th><th>內容</th><th>發到</th><th>刪除前</th><th>刪除時間</th><th>誰刪的</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr><td>${p.date?fmt(p.date)+" "+p.time:"輪播"}</td><td class="ttl">${esc(p.text||p.title)}</td><td><span class="avs">${(p.pfs||[]).map(pfb).join("")}</span></td><td><span class="pill" data-state="${p.prevState||"draft"}">${STATES[p.prevState||"draft"]}</span></td><td>${p.delAt||""}</td><td>${esc(p.delBy||"")}</td><td><button type="button" data-restore="${p.id}">還原</button></td></tr>`).join("")}</tbody></table></div>`
    : emptyHtml("trash","沒有刪掉的貼文","從行事曆或清單刪掉的貼文，會留在這裡。","回行事曆","trashBack")));
  $("sideView").querySelectorAll("[data-restore]").forEach(x=>x.onclick=()=>{ const p=B().posts.find(y=>y.id===+x.dataset.restore); p.state=p.prevState||"draft"; addLog("還原",p,""); renderTrash(); say("已還原。"); });
  const bk=$("trashBack"); if(bk) bk.onclick=()=>setView(calView); }
function newList(){ const l={id:"l"+Date.now(),name:"新清單",times:["10:00"],slots:[],pfs:connected().map(a=>a.pf),on:false,cursor:0,queue:[]}; B().lists.push(l); selectedList=l.id; renderLists(); }
function openList(id){ selectedList=id; setView("lists"); }
function renderMedia(){ const m=B().media;
  if(!m.length){ side(`<div class="ptop"><h2>媒體庫</h2></div>`+emptyHtml("image","媒體庫是空的","上傳過的圖片和影片會留在這裡，下次直接用。","上傳圖片或影片","upload")); $("upload").onclick=upload; return; }
  side(`<div class="ptop"><h2>媒體庫</h2><span class="muted">點圖片選取，可以一次選好幾張。</span><span class="r"><button type="button" class="btn-secondary" id="upload">＋ 上傳</button></span></div>
  <div class="media-grid">${m.map(x=>`<button type="button" class="mtile ${mediaSel.has(x.id)?"on":""}" data-m="${x.id}"><span class="mimg ph ph-${x.ph}">${x.kind==="video"?I("play"):""}</span><span class="tick">${mediaSel.has(x.id)?I("check"):""}</span><span class="mn" title="${esc(x.name)}">${esc(x.name)}</span><span class="muted tag">${x.kind==="video"?"影片 · ":""}用過 ${x.used} 次</span></button>`).join("")}</div>
  <div class="bulk" ${mediaSel.size?"":"hidden"}><span>已選 ${mediaSel.size} 個</span><button type="button" class="btn-primary" id="useMedia">用這些寫新貼文</button><button type="button" id="clearMedia">取消選取</button></div>`);
  $("upload").onclick=upload;
  $("sideView").querySelectorAll(".mtile").forEach(x=>x.onclick=()=>{ const k=x.dataset.m; mediaSel.has(k)?mediaSel.delete(k):mediaSel.add(k); renderMedia(); });
  const u=$("useMedia"); if(u) u.onclick=()=>{ const imgs=m.filter(x=>mediaSel.has(x.id)).map(x=>{ x.used++; return x.ph; }); mediaSel.clear(); setView("week"); newPost(null,null,imgs); };
  const c=$("clearMedia"); if(c) c.onclick=()=>{ mediaSel.clear(); renderMedia(); };
}
function upload(){ const b=B(); b.media.unshift({id:"m"+Date.now(),name:"新上傳-"+(b.media.length+1)+".jpg",kind:"image",ph:1+b.media.length%4,used:0}); renderMedia(); }
function renderLog(){ const nd=needs();
  const rows = logFilter==="needs" ? [...nd.posts.map(p=>({t:p.date?fmt(p.date)+" "+p.time:"",who:"系統",act:p.state==="error"?"發佈失敗":"等你審核",txt:p.text,res:p.err||"按「打開」處理",id:p.id})),...nd.accts.map(a=>({t:"",who:"系統",act:"連線失效",txt:PF[a.pf].n+" "+a.name,res:"到設定重新連接",pf:a.pf}))] : B().log;
  const top = `<div class="ptop"><h2>紀錄與通知</h2><span class="seg" id="lfSeg"><button type="button" class="${logFilter==="all"?"on":""}" data-lf="all">全部紀錄</button><button type="button" class="${logFilter==="needs"?"on":""}" data-lf="needs">需處理（${nd.n}）</button></span><span class="muted">發佈失敗和連線失效也會發 Telegram 通知。</span></div>`;
  const body = rows.length ? `<div class="list"><table><thead><tr><th>時間</th><th>誰</th><th>動作</th><th>貼文</th><th>結果</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.t}</td><td>${esc(r.who)}</td><td>${r.act}</td><td class="ttl">${esc((r.txt||"").slice(0,40))}</td><td class="ttl">${esc(r.res)}</td><td>${r.id?`<button type="button" data-open="${r.id}">打開</button>`:r.pf?`<button type="button" data-connect="${r.pf}">重新連接</button>`:""}</td></tr>`).join("")}</tbody></table></div>`
    : logFilter==="needs" ? emptyHtml("check","沒有要處理的事","發佈失敗或帳號斷線時，會出現在這裡。","回行事曆","logBack") : emptyHtml("lines","還沒有任何紀錄","發文、排程、審核都會記在這裡。","寫第一則貼文","logNew");
  side(top+body);
  $("lfSeg").querySelectorAll("button").forEach(x=>x.onclick=()=>{ logFilter=x.dataset.lf; renderLog(); });
  $("sideView").querySelectorAll("[data-open]").forEach(x=>x.onclick=()=>{ setView(calView); openPost(+x.dataset.open); });
  $("sideView").querySelectorAll("[data-connect]").forEach(x=>x.onclick=()=>{ connectPf=x.dataset.connect; setView("settings"); });
  const a=$("logBack"), b=$("logNew"); if(a) a.onclick=()=>setView(calView); if(b) b.onclick=()=>{ setView(calView); newPost(); };
}
function renderSettings(){ const b=B();
  const why = a => a.st==="expired" ? "授權過期，排在這個帳號的貼文發不出去。按「重新連接」。" : a.st==="review" ? "平台還在審核我們的 app，通過前不能連接。" : "";
  const conn = connectPf ? `<div class="connect"><b>連接 ${PF[connectPf].n}</b><span>按下面的按鈕，會跳到 ${PF[connectPf].n} 的授權頁。選好要管理的帳號，授權完會自動回到這裡。我們不會拿到你的密碼。</span><span class="acts"><button type="button" class="btn-primary" id="cdGo">前往 ${PF[connectPf].n} 授權</button><button type="button" id="cdBack">取消</button></span></div>` : "";
  const accts = b.accounts.length ? b.accounts.map(a=>`<div class="arow"><span class="aav">${bav()}${pfb(a.pf)}</span><span class="who"><b>${esc(a.name)}</b><span class="muted tag">${PF[a.pf].n} · ${esc(a.handle)}</span></span><span class="pill" data-st="${a.st}">${a.st==="connected"?"已連接":a.st==="expired"?"連線失效":"平台審核中"}</span><span class="acts">${a.st==="review"?"":`<button type="button" ${a.st==="expired"?'class="btn-primary"':""} data-connect="${a.pf}">重新連接</button>`}<button type="button" class="ibtn" data-remove="${a.pf}" title="移除" aria-label="移除 ${PF[a.pf].n}">${I("trash")}</button></span>${why(a)?`<span class="why">${why(a)}</span>`:""}</div>`).join("")
    : emptyHtml("link","還沒連接社群帳號","從下面挑一個平台開始。","連接第一個帳號","firstConn");
  const add = SOCIAL.filter(k=>!b.accounts.some(a=>a.pf===k));
  side(`<div class="ptop"><h2>${esc(b.name)} 的設定</h2></div><div class="sgrid">
    <div class="sec"><h3>社群帳號</h3>${conn}${accts}${add.length?`<h3>加帳號</h3><div class="tiles">${add.map(k=>`<button type="button" class="tile" data-connect="${k}">${pfb(k)}<span>${PF[k].n}</span></button>`).join("")}</div>`:""}</div>
    <div class="sec"><h3>發文前要先審核</h3><span class="seg" id="revSeg"><button type="button" class="${b.review?"":"on"}" data-rv="0">不用</button><button type="button" class="${b.review?"on":""}" data-rv="1">要</button></span><span class="muted">要審核時，編輯只能送審；審核人核准後才照時間發。</span>
      <h3>團隊</h3>${b.team.map((m,i)=>`<div class="mrole"><span>${esc(m.name)}${m.me?"（我）":""}</span><span class="seg">${Object.keys(ROLES).map(r=>`<button type="button" class="${m.role===r?"on":""}" data-role="${r}" data-idx="${i}">${ROLES[r]}</button>`).join("")}</span><button type="button" class="ibtn" data-kick="${i}" ${m.role==="owner"?"disabled":""} aria-label="移除成員" title="移除">${I("x")}</button></div>`).join("")}
      <div class="frow"><input type="email" id="invite" placeholder="email" aria-label="邀請 email"><button type="button" id="inviteBtn">邀請成員</button></div></div></div>`);
  $("sideView").querySelectorAll("[data-connect]").forEach(x=>x.onclick=()=>{ connectPf=x.dataset.connect; renderSettings(); });
  const fc=$("firstConn"); if(fc) fc.onclick=()=>{ connectPf=add[0]; renderSettings(); };
  const go=$("cdGo"); if(go) go.onclick=()=>{ let a=b.accounts.find(x=>x.pf===connectPf); if(!a){ a={pf:connectPf,name:b.name,handle:connectPf==="facebook"?"粉絲專頁":"@"+brand,st:"connected"}; b.accounts.push(a); } else a.st="connected"; addLog("連接帳號",null,PF[connectPf].n+" 已連接"); connectPf=null; renderSettings(); };
  const bk=$("cdBack"); if(bk) bk.onclick=()=>{ connectPf=null; renderSettings(); };
  $("sideView").querySelectorAll("[data-remove]").forEach(x=>x.onclick=()=>{ b.accounts=b.accounts.filter(a=>a.pf!==x.dataset.remove); addLog("移除帳號",null,PF[x.dataset.remove].n); renderSettings(); });
  $("revSeg").querySelectorAll("button").forEach(x=>x.onclick=()=>{ b.review=x.dataset.rv==="1"; renderSettings(); });
  $("sideView").querySelectorAll("[data-role]").forEach(x=>x.onclick=()=>{ b.team[+x.dataset.idx].role=x.dataset.role; renderSettings(); });
  $("sideView").querySelectorAll("[data-kick]").forEach(x=>x.onclick=()=>{ b.team.splice(+x.dataset.kick,1); renderSettings(); });
  $("inviteBtn").onclick=()=>{ const v=$("invite").value.trim(); if(!v) return; b.team.push({name:v,role:"editor"}); addLog("邀請成員",null,v); renderSettings(); };
}

// ---- editor (U5): the working copy of one post ----
const XTRA = {link:"連結與 UTM",alt:"替代文字",texts:"常用文字",ai:"AI 幫我寫",emoji:"表情符號",notes:"備註"};
const XICON = {link:"link",alt:"eye",texts:"lines",ai:"spark",emoji:"smile",notes:"note"};
const effText = k => ed.custom[k] ?? ed.text;
const effLen = k => [...effText(k)].length;
function blank(){ return {id:null,kind:null,state:"draft",text:"",pfs:new Set(connected().map(a=>a.pf)),custom:{},tab:"all",imgs:[],parts:[],link:"",utm:false,alt:"",fmt:{},notes:"",date:"2026-10-16",time:"09:00",wm:"fixed",listId:null,open:new Set()}; }
function openPost(id, o={}){
  const p=B().posts.find(x=>x.id===id); if(!p) return newPost();
  ed=blank(); Object.assign(ed,{id:p.id,kind:p.kind||null,state:p.state,date:p.date||TODAY,time:p.time||"10:00",listId:p.listId||null,wm:p.state==="rotation"?"rot":"fixed"});
  if(p.kind==="article"){ ed.state="draft"; ed.time="12:00"; }
  else Object.assign(ed,{text:p.text,pfs:new Set(p.pfs),custom:{...(p.custom||{})},imgs:[...(p.imgs||[])],parts:(p.parts||[]).map(x=>({...x})),link:p.link||"",utm:!!p.utm,alt:p.alt||"",fmt:{...(p.fmt||{})},notes:p.notes||""});
  for(const k of ["link","alt","notes"]) if(ed[k]) ed.open.add(k);
  showEditor(o); if(o.preview) setPv("pv");
}
function newPost(date, time, imgs, o={}){ ed=blank(); if(date) ed.date=date; if(time) ed.time=time; if(imgs) ed.imgs=imgs; showEditor(o); if(date) say(`在 ${fmtLong(date)} ${ed.time} 寫一則新貼文。`); $("text").focus({preventScroll:true}); }
function openDefault(){ const p=B().posts.find(x=>x.id===2) || B().posts.find(x=>!x.kind&&x.state!=="deleted"); p ? openPost(p.id,{noSheet:true}) : newPost(null,null,null,{noSheet:true}); }
function showEditor(o){
  if(!["week","month","list"].includes(view)) setView(calView);
  if(isPhone() && !o.noSheet) document.body.classList.add("sheet"); if(!o.keepSheet) setPv("ed");
  $("menu").hidden=true; $("confirmNow").hidden=true; $("dtp").hidden=true;
  const none=!B().accounts.length; $("ed").hidden=none; $("edEmpty").hidden=!none;
  if(none){ $("edTitle").textContent="寫貼文"; setState("draft",""); $("edEmpty").innerHTML=emptyHtml("link","還沒連接社群帳號","連好之後，就能在這裡寫貼文。","到設定連接帳號","edConn"); $("edConn").onclick=()=>setView("settings"); return; }
  $("edTitle").textContent = ed.kind==="article" ? "文章 → 社群貼文" : ed.id==null ? "新貼文" : "編輯貼文";
  setState(ed.state, ed.id==null||ed.kind==="article" ? "（還沒存）" : "");
  $("srcBox").hidden = ed.kind!=="article"; if(ed.kind==="article") $("srcTitle").textContent=B().posts.find(x=>x.id===ed.id).title;
  $("revBar").hidden = !(me==="reviewer" && ed.state==="review"); $("reason").value="";
  renderChan(); renderTabs(); fillText(); renderMrow(); renderParts(); renderXtras(); renderPset(); renderCnt(); renderPreview(); renderFoot(); renderHint();
  if(["week","month","list"].includes(view)) renderView();
}
function setState(s, extra){ $("edState").dataset.state=s; $("edStateTxt").textContent=STATES[s]+(extra?" "+extra:""); }
const ro = () => ed.state==="published";
// ① who it goes to: one avatar per account; grey = not chosen, ! = authorisation expired, … = platform still reviewing our app
function renderChan(){

function validate(state){ if(!ed.text.trim() && !Object.values(ed.custom).some(x=>x&&x.trim())) return "貼文還是空的。";
  if(state==="draft") return null; if(!ed.pfs.size) return "還沒選要發到哪裡：點上面的頭像。";
  const pover=[...ed.pfs].filter(k=>THREAD.includes(k)&&ed.parts.some(x=>[...x.text].length>PF[k].max)); if(pover.length) return `接的那幾則有一則超過 ${pover.map(k=>PF[k].n).join("、")} 的字數上限。`;
  const over=[...ed.pfs].filter(k=>effLen(k)>PF[k].max); if(over.length) return `${over.map(k=>PF[k].n).join("、")} 超過字數上限，發不出去。`;
  if(ed.pfs.has("instagram")&&!ed.imgs.length) return "Instagram 一定要有圖片或影片。"; return null; }
function save(state){
  const e=validate(state); if(e) return say(e, true);
  let p = ed.id!=null ? B().posts.find(x=>x.id===ed.id) : null;
  if(!p || p.kind==="article"){ p={id:Date.now()}; B().posts.push(p); ed.id=p.id; ed.kind=null; }
  const data={text:ed.text,pfs:[...ed.pfs],custom:{...ed.custom},imgs:[...ed.imgs],parts:ed.parts.map(x=>({...x})),link:ed.link,utm:ed.utm,alt:ed.alt,fmt:{...ed.fmt},notes:ed.notes,err:null};
  if(state==="scheduled" && ed.wm==="rot"){ const l=B().lists.find(x=>x.id===ed.listId); if(!l) return say("還沒有輪播清單，先到「輪播」建一個。", true);
    if(p.listId!==l.id) l.queue.push(ed.text); Object.assign(p,data,{date:"",time:"",state:"rotation",listId:l.id}); addLog("加入輪播",p,l.name); openPost(p.id,{keepSheet:true}); return say(`已加到「${esc(l.name)}」最後。下一則：${esc(nextRun(l))}`); }
  const label={draft:"存草稿",review:"送審",scheduled:"排程",published:"立即發佈"}[state];
  Object.assign(p,data,{date:ed.date,time:ed.time,state,listId:null});
  if(state==="published") p.url="https://bsky.app/profile/"+brand+"/post/"+Date.now().toString(36);
  addLog(label,p,state==="scheduled"?`${fmt(ed.date)} ${ed.time}`:"");
  openPost(p.id,{keepSheet:true});
  say(state==="draft"?"已存成草稿。":state==="review"?"已送審，審核人會收到通知。":state==="scheduled"?`已排在 ${fmtLong(ed.date)} ${ed.time}。`:"已發出。");
}
function duplicate(){ const p=B().posts.find(x=>x.id===ed.id); const c={...p,id:Date.now(),state:"draft",date:addDays(p.date||TODAY,7),err:null,url:null}; B().posts.push(c); openPost(c.id,{keepSheet:true}); say("已複製成下週同一天的草稿。"); }
$("approveBtn").onclick=()=>{ const p=B().posts.find(x=>x.id===ed.id); p.state="scheduled"; addLog("核准",p,`排在 ${fmt(p.date)} ${p.time}`); openPost(p.id,{keepSheet:true}); say("已核准，照原定時間發。"); };
$("rejectBtn").onclick=()=>{ const r=$("reason").value.trim(); if(!r) return say("退回要寫理由，編輯才知道要改什麼。", true); const p=B().posts.find(x=>x.id===ed.id); p.state="draft"; p.notes=(p.notes?p.notes+"\n":"")+"退回："+r; addLog("退回",p,r); openPost(p.id,{keepSheet:true}); say("已退回成草稿，理由寫在備註。"); };
$("useExcerpt").onclick=()=>{ const p=B().posts.find(x=>x.id===ed.id); ed.text=p.excerpt+"\n\n全文："+p.url; ed.imgs=[4]; refresh(); say("用的是文章本身的摘要和主圖，沒有花錢。"); };
$("useAi").onclick=()=>{ const p=B().posts.find(x=>x.id===ed.id); ed.text="（AI 改寫範例）"+p.excerpt.split("。")[0]+"。想知道為什麼嗎？全文在這裡："+p.url; ed.imgs=[4]; refresh(); say("AI 替每個選的平台各寫一版，這次大約 NT$2。"); };

// date + time picker (U6): a month grid and a time grid, in the app's tokens
let dtState=null;
function openDtp(anchor, day, time, pick){ dtState={day, time, month:(day||TODAY).slice(0,7), pick, anchor}; renderDtp(); }
function renderDtp(){ const s=dtState, el=$("dtp"); const [y,m]=s.month.split("-").map(Number); const first=`${s.month}-01`; const dim=new Date(y,m,0).getDate();
  const days = s.day ? `<div class="dcal"><div class="dhd"><button type="button" class="ibtn" data-mn="-1" aria-label="上個月">${I("chevL")}</button><b>${y} 年 ${m} 月</b><button type="button" class="ibtn" data-mn="1" aria-label="下個月">${I("chevR")}</button></div><div class="cal7">${DOW.map(x=>`<span class="muted">${x}</span>`).join("")}${"<span></span>".repeat(dowOf(first))}${[...Array(dim)].map((_,i)=>{ const v=`${s.month}-${String(i+1).padStart(2,"0")}`; return `<button type="button" class="${v===s.day?"on":""} ${v===TODAY?"today":""}" data-day="${v}" ${v<TODAY?"disabled":""}>${i+1}</button>`; }).join("")}</div></div>` : "";
  const [hh,mm]=s.time.split(":");
  el.innerHTML = days + `<div class="dtime"><span class="muted tag">幾點</span><div class="tgrid">${[...Array(17)].map((_,i)=>{ const h=String(i+7).padStart(2,"0"); return `<button type="button" class="${h===hh?"on":""}" data-h="${h}">${h}</button>`; }).join("")}</div><span class="muted tag">幾分</span><div class="tgrid">${["00","15","30","45"].map(x=>`<button type="button" class="${x===mm?"on":""}" data-m="${x}">${x}</button>`).join("")}</div><button type="button" class="btn-primary" id="dtOk">好</button></div>`;
  el.hidden=false; const r=s.anchor.getBoundingClientRect(); const h=el.offsetHeight;
  el.style.left = Math.max(8, Math.min(r.left, innerWidth-el.offsetWidth-8))+"px"; el.style.top = (r.top-h-8 > 8 ? r.top-h-8 : r.bottom+8)+"px";
  el.querySelectorAll("[data-mn]").forEach(x=>x.onclick=()=>{ const t=new Date(y,m-1+(+x.dataset.mn),1); s.month=iso(t).slice(0,7); renderDtp(); });
  el.querySelectorAll("[data-day]").forEach(x=>x.onclick=()=>{ s.day=x.dataset.day; renderDtp(); });
  el.querySelectorAll("[data-h]").forEach(x=>x.onclick=()=>{ s.time=x.dataset.h+":"+mm; renderDtp(); });
  el.querySelectorAll("[data-m]").forEach(x=>x.onclick=()=>{ s.time=hh+":"+x.dataset.m; renderDtp(); });
  $("dtOk").onclick=()=>{ el.hidden=true; s.pick(s.time, s.day); };
}

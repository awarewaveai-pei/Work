body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--body-bg);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 0;
  border-radius: 8px;
  padding: 9px 20px;
  font-size: 14px; /* text you read is never under 14px (operator 2026-10-14) */
  font-weight: 700;
  color: var(--btn-primary-text);
  background: var(--accent);
  cursor: pointer;
  letter-spacing: -0.01em;
  transition: background .15s, box-shadow .15s;
  box-shadow: 0 1px 4px rgb(99 102 241/.25);
}
.btn-primary:hover {
  background: var(--accent-hover);
  box-shadow: 0 2px 8px rgb(99 102 241/.35);
}
.btn-primary:disabled {
  opacity: .45;
  cursor: not-allowed;
  box-shadow: none;
}
.btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  background: var(--btn-secondary-bg);
  border: 1px solid var(--btn-secondary-border);
  border-radius: 8px;
  font-size: 14px; /* text you read is never under 14px (operator 2026-10-14) */
  font-weight: 600;
  color: var(--btn-secondary-text);
  cursor: pointer;
  text-decoration: none;
  transition: background .15s, border-color .15s;
}
.btn-secondary:hover {
  background: var(--body-bg);
  border-color: var(--btn-secondary-hover-border);
}

/* mock-local: layout + type scale (the app has no type tokens yet; text you read is never under 14px, labels >= 12px) */
:root{ --fs-h1:18px; --fs-h2:15px; --fs-body:14px; --fs-tag:12px; --chan-w:236px; --pv-w:330px; --av:32px; --thumb-h:58px; }
/* platform brand colours (--p-*): app tokens in globals.css, copied above with the rest */

html,body{height:100%}
body{margin:0;font-size:var(--fs-body);font-variant-numeric:tabular-nums} /* font family, colours: the app's body rule above */
*{box-sizing:border-box}
button{font:inherit;color:var(--btn-secondary-text);background:var(--btn-secondary-bg);border:1px solid var(--btn-secondary-border);border-radius:var(--radius-sm);padding:5px 10px;cursor:pointer;line-height:1.4}
button:hover{background:var(--bg-hover)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.danger{color:var(--red);border-color:var(--red)}
.btn-primary,.btn-secondary{line-height:1.4;white-space:nowrap;flex:none}
input,textarea{font:inherit;color:inherit;background:var(--form-input-bg);border:1px solid var(--btn-secondary-border);border-radius:var(--radius-sm);padding:5px 8px;min-width:0}
textarea{width:100%;resize:none;line-height:1.6}
.muted{color:var(--text-muted)}
.tag{font-size:var(--fs-tag)}
.err{color:var(--red)}
.up{color:var(--green)} .down{color:var(--red)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* the three kinds of control + values */
.seg{display:inline-flex;align-items:center;background:var(--bg-subtle);border:1px solid var(--card-border);border-radius:var(--radius-sm);padding:2px;gap:2px;flex:none}
.seg button{border:0;background:transparent;padding:3px 10px;border-radius:6px;color:var(--text-muted);font-weight:600;white-space:nowrap}
.seg button:hover{color:var(--text-primary);background:var(--bg-hover)}
.seg button.on{background:var(--card-bg);color:var(--text-primary);box-shadow:var(--shadow)}
.ibtn{display:inline-grid;place-items:center;width:30px;height:30px;padding:0;border-color:transparent;background:transparent;color:var(--text-muted);flex:none}
.ibtn:hover{color:var(--text-primary)}
.ibtn.on{color:var(--accent);background:var(--accent-light)}
.lnk{border:0;background:transparent;color:var(--accent);padding:0 4px;font-weight:600}
.lnk:hover{background:transparent;text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:999px;font-size:var(--fs-tag);background:var(--accent-light);color:var(--accent);border:1px solid transparent;white-space:nowrap}
.pill{display:inline-block;padding:0 8px;border-radius:999px;font-size:var(--fs-tag);color:var(--btn-primary-text);background:var(--status-ignored);white-space:nowrap}
.pill[data-state="scheduled"],.pill[data-st="review"]{background:var(--yellow)} .pill[data-state="published"],.pill[data-st="connected"]{background:var(--green)} .pill[data-state="error"],.pill[data-st="expired"]{background:var(--red)} .pill[data-state="review"]{background:var(--severity-low)} .pill[data-state="rotation"]{background:var(--accent)}
.ck{display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 0}
.ck input{margin:0;accent-color:var(--accent)}
.sbar{width:4px;height:16px;border-radius:2px;background:var(--status-ignored);flex:none}
.sbar[data-state="scheduled"]{background:var(--yellow)} .sbar[data-state="published"]{background:var(--green)} .sbar[data-state="error"]{background:var(--red)} .sbar[data-state="review"]{background:var(--severity-low)} .sbar[data-state="rotation"]{background:var(--accent)}
.pf{display:inline-flex;width:18px;height:18px;border-radius:50%;color:var(--p-ink);font-size:var(--fs-tag);line-height:18px;justify-content:center;font-weight:700;flex:none}
.pf-facebook{background:var(--p-fb)} .pf-instagram{background:var(--p-ig)} .pf-threads{background:var(--p-th)} .pf-linkedin{background:var(--p-li)} .pf-bluesky{background:var(--p-bs)} .pf-wordpress{background:var(--p-wp)}
/* account pictures (the channel's own picture from Postiz in the product, F17) */
.av{width:var(--av);height:var(--av);border-radius:50%;display:inline-grid;place-items:center;color:var(--p-ink);font-weight:700;flex:none;font-size:var(--fs-tag)}
.av.c0{background:radial-gradient(circle at 30% 30%,var(--p-ig) 0 18%,transparent 48%),radial-gradient(circle at 72% 70%,var(--yellow) 0 16%,transparent 52%),var(--p-bs)}
.av.c1{background:linear-gradient(135deg,var(--sidebar-logo-gradient-start),var(--sidebar-logo-gradient-end))}
.av.c2{background:linear-gradient(135deg,var(--green),var(--p-li))}
.av.c3{background:linear-gradient(135deg,var(--yellow),var(--red))}
.av.c4{background:linear-gradient(135deg,var(--p-th),var(--status-ignored))}
.av.sq{border-radius:6px}
.aav{position:relative;display:inline-grid;flex:none}
.aav>.pf{position:absolute;right:-4px;bottom:-4px;box-shadow:0 0 0 2px var(--card-bg);width:16px;height:16px;line-height:16px}
.aav .bang{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--red);color:var(--btn-primary-text);font-size:var(--fs-tag);line-height:16px;font-style:normal;font-weight:700;text-align:center}
.aav .bang.wait{background:var(--status-ignored)}
/* sample photos, drawn with app tokens */
.ph{background-color:var(--badge-yellow-bg)}
.ph-1{background:radial-gradient(circle at 28% 38%,var(--p-ig) 0 14%,transparent 34%),radial-gradient(circle at 70% 58%,var(--yellow) 0 18%,transparent 40%),radial-gradient(circle at 46% 92%,var(--p-bs) 0 12%,transparent 34%),var(--badge-yellow-bg)}
.ph-2{background:radial-gradient(circle at 70% 30%,var(--green) 0 12%,transparent 36%),radial-gradient(circle at 25% 70%,var(--accent) 0 16%,transparent 42%),var(--icon-ops-bg)}

/* frame: top bar (six sections), section bar (tabs or the composer's title), page */
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)} /* minmax(0,...): a wide table scrolls inside its panel, never widens the page */
header{display:flex;align-items:center;gap:6px;padding:0 16px;height:52px;background:var(--text-primary);color:var(--btn-primary-text);position:relative;min-width:0}

.hright{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}

.tzbtn{padding:4px 10px;color:var(--text-muted)}
.fab{display:none}

main{display:grid;grid-template-columns:var(--chan-w) minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-row:3;gap:12px;min-height:0;padding:12px 16px 14px} /* row 3 even when the section bar is hidden */
main.full{grid-template-columns:minmax(0,1fr)}
.panel{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);box-shadow:var(--shadow);min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.ptop{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--card-border);min-height:50px;flex:none}
.ptop h2{font-size:var(--fs-h2);margin:0;white-space:nowrap}
.ptop .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.pop{position:absolute;z-index:5;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);box-shadow:var(--shadow-hover);padding:12px;display:flex;flex-direction:column;gap:8px}
.pop h3{font-size:var(--fs-tag);color:var(--text-muted);margin:0;font-weight:600}
.menu{padding:6px;gap:2px}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px}
.menu button:hover{background:var(--bg-hover)}

/* channel list (decision 1): scrolls, one row per account, ⋮ for that account's menu */
.chan{min-height:0}
.chan .ptop{flex-wrap:wrap}
.chan .find{margin:8px 10px 4px;display:flex;align-items:center;gap:4px;border:1px solid var(--btn-secondary-border);border-radius:var(--radius-sm);padding:0 6px;color:var(--text-muted)}
.chan .find input{border:0;padding:4px 0;width:100%;background:transparent}
.clist{flex:1;min-height:0;overflow-y:auto;padding:4px 6px 8px;display:flex;flex-direction:column;gap:1px}
.crow{text-align:left;width:100%;background:transparent;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 4px 6px 8px;border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer}
.crow:hover{background:var(--bg-hover)}
.crow.on{background:var(--accent-light);border-color:var(--accent)}
.crow .nm{min-width:0;line-height:1.3}
.crow .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .nm span{display:block;font-size:var(--fs-tag);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .nm span.err{color:var(--red)}
.crow .ibtn{width:26px;height:26px}
.cmenu{width:200px}
.cfoot{border-top:1px solid var(--card-border);padding:8px 10px;font-size:var(--fs-tag);color:var(--text-muted);flex:none}

/* calendar toolbar (decision 4): one row */
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--card-border);flex:none;position:relative}
.search{display:flex;align-items:center;gap:4px;border:1px solid var(--btn-secondary-border);border-radius:var(--radius-sm);padding:0 8px;color:var(--text-muted);flex:0 1 220px;min-width:120px}
.search input{border:0;padding:5px 0;width:100%;background:transparent}
.search:focus-within{border-color:var(--accent)}
.range{font-weight:600;white-space:nowrap}
#filterBtn b,#bulkBtn b{color:var(--accent)}
#bestBtn.on{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
.toolbar .end{margin-left:auto;display:flex;gap:8px;align-items:center}
.filters{top:52px;right:180px;width:330px}
.filters .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.filters .ft{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--card-border);padding-top:8px}
.bulkmenu{top:52px;right:12px}
.bestbar{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--card-border);background:var(--accent-light);flex:none}

/* week: one column a day, cards stacked in time order */
.week{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{border-left:1px solid var(--card-border);display:flex;flex-direction:column;min-height:0;min-width:0}
.day:first-child{border-left:0}
.day.past{background:repeating-linear-gradient(135deg,transparent 0 9px,var(--bg-subtle) 9px 18px)}
.day.today{background:var(--accent-light)}
.dh{padding:6px 8px;display:flex;align-items:baseline;gap:6px;border-bottom:1px solid var(--card-border);flex:none}
.dh b{font-size:var(--fs-h2)}
.dh .n{margin-left:auto;font-size:var(--fs-tag);color:var(--text-muted)}
.day.today .dh{background:var(--text-primary);color:var(--btn-primary-text)}
.day.today .dh .muted,.day.today .dh .n{color:var(--btn-primary-text)}
.stack{flex:1;min-height:0;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:6px;cursor:copy}
.stack.over{outline:2px dashed var(--accent);outline-offset:-3px}
.best{flex:none;display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:var(--fs-tag);color:var(--accent)}
.best button{border:1px dashed var(--accent);background:var(--card-bg);color:var(--accent);padding:0 6px;font-size:var(--fs-tag);border-radius:4px}
.now{flex:none;display:flex;align-items:center;gap:4px;color:var(--red);font-size:var(--fs-tag);font-weight:700}
.now::after{content:"";flex:1;height:2px;background:var(--red)}
.add{flex:none;border:0;background:var(--accent);color:var(--btn-primary-text);display:flex;align-items:center;justify-content:center;gap:2px;padding:3px;visibility:hidden}
.day:hover .add{visibility:visible}
.card{position:relative;flex:none;background:var(--card-bg);border:1px solid var(--card-border);border-left:4px solid var(--status-ignored);border-radius:8px;padding:5px;display:flex;flex-direction:column;gap:4px;cursor:pointer;box-shadow:var(--shadow);text-align:left}
.card:hover{box-shadow:var(--shadow-hover)}
.card[data-state="scheduled"]{border-left-color:var(--yellow)} .card[data-state="published"]{border-left-color:var(--green)} .card[data-state="error"]{border-left-color:var(--red)} .card[data-state="review"]{border-left-color:var(--severity-low)} .card[data-state="rotation"]{border-left-color:var(--accent)}
.card[data-kind="article"]{background:var(--bg-subtle);border-style:dashed}
.cthumb{height:var(--thumb-h);border-radius:5px;position:relative;display:grid;place-items:center end;padding-right:6px;color:var(--text-muted);font-size:var(--fs-tag);flex:none}
.cthumb.txt{height:22px;background:var(--bg-subtle)}
.cthumb .avs{position:absolute;left:3px;top:3px}
.cthumb .more{position:absolute;right:3px;bottom:3px;background:var(--card-bg);border-radius:4px;padding:0 4px;color:var(--text-primary)}
.cmeta{display:flex;align-items:center;gap:4px;font-size:var(--fs-tag);color:var(--text-muted);min-width:0;white-space:nowrap;overflow:hidden}
.avs{display:flex;flex:none}
.avs .pf{box-shadow:0 0 0 2px var(--card-bg)}
.avs .pf+.pf{margin-left:-5px}
.ctext{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45;word-break:break-all}
.cacts{position:absolute;top:8px;right:8px;display:none;gap:1px;background:var(--card-bg);border-radius:6px;box-shadow:var(--shadow);padding:1px}
.cacts button{width:24px;height:24px;padding:0;border:0;display:grid;place-items:center;background:transparent;color:var(--text-muted)}
.cacts button:hover{color:var(--text-primary);background:var(--bg-hover)}
.cacts svg.i{width:15px;height:15px}
.card:hover .cacts,.card:focus-within .cacts{display:flex}
.strip{display:none}
.month{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr)}
.mhead{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--card-border)}
.mhead div{text-align:center;padding:4px;color:var(--text-muted)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);min-height:0}
.mday{border:1px solid var(--card-border);border-width:0 0 1px 1px;padding:3px 5px;min-width:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.mday.today{background:var(--accent-light)}
.mday.out{opacity:.45}
.mday .n{color:var(--text-muted);font-size:var(--fs-tag)}
.mday .mi{display:flex;gap:4px;align-items:center;white-space:nowrap;overflow:hidden;font-size:var(--fs-tag)}
.mday .mi .sbar{height:12px}
.list{flex:1;min-height:0;overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--card-border);white-space:nowrap;vertical-align:middle}
th{color:var(--text-muted);font-weight:600;font-size:var(--fs-tag);position:sticky;top:0;background:var(--card-bg)}
td.ttl{white-space:normal;min-width:0}
td.num{text-align:right}
.tthumb{width:40px;height:40px;border-radius:6px;display:block}
.tthumb.txt{background:var(--bg-subtle)}
.bulk{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--card-border)}

/* empty / not-yet pages: round tinted icon, bold line, grey hint, at most one button */
.empty{margin:auto;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:24px;max-width:420px}
.empty .eic{width:64px;height:64px;border-radius:50%;background:var(--accent-light);color:var(--accent);display:grid;place-items:center;margin-bottom:6px}
.empty .eic svg.i{width:30px;height:30px}
.empty b{font-size:var(--fs-h2)}
.empty p{margin:0}
.empty .btn-primary{margin-top:8px}
.over-empty{position:absolute;inset:100px 0 0 0;display:flex;pointer-events:none}
.over-empty .empty{pointer-events:auto;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow)}

/* rotation lists, library, deleted, settings */
.cols2{flex:1;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr)}
.lcol{border-right:1px solid var(--card-border);overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.lst{border:1px solid var(--card-border);border-left:4px solid var(--accent);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--card-bg);min-width:0}
.lst.off{border-left-color:var(--status-ignored)}
.lst.sel{outline:2px solid var(--accent);outline-offset:-1px}
.lst .nx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldet{min-height:0;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.frow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.frow.top{align-items:flex-start}
.frow>.lab{color:var(--text-muted);width:56px;flex:none}
.slots{display:flex;flex-direction:column;gap:6px;flex:1 1 300px;min-width:0}
.sgrid7{display:grid;grid-template-columns:44px repeat(7,minmax(0,44px)) 30px;gap:4px;align-items:center;text-align:center}
.slot{height:28px;padding:0;border:1px solid var(--card-border);background:var(--bg-subtle);border-radius:6px}
.slot:hover{border-color:var(--accent)}
.slot.on{background:var(--yellow);border-color:var(--yellow)}
.queue{display:flex;flex-direction:column;gap:4px}
.qrow{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--card-border);border-radius:6px;padding:4px 4px 4px 10px}
.qrow.next{border-color:var(--accent);background:var(--bg-subtle)}
.qrow .n{color:var(--text-muted);font-size:var(--fs-tag)}
.qrow .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lib{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:12px;align-content:start}
.ltile{border:1px solid var(--card-border);border-radius:var(--radius-sm);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;text-align:left;background:var(--card-bg)}
.ltile.on{outline:2px solid var(--accent);outline-offset:-1px}
.ltile .limg{height:110px;border-radius:6px;display:grid;place-items:center;color:var(--card-bg)}
.ltile .limg svg.i{width:32px;height:32px;stroke-width:2.4}
.ltile .limg.txt{background:var(--bg-subtle);color:var(--text-muted);height:60px}
.ltile .lt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sgrid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;padding:12px;align-content:start}
.sec{border:1px solid var(--card-border);border-radius:var(--radius-sm);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.sec h3{margin:0;font-size:var(--fs-h2)}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center}
.arow .who{min-width:0}
.arow .who b,.arow .who span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .why{grid-column:2/-1;color:var(--red);font-size:var(--fs-tag)}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px}
.tile .pf{width:32px;height:32px;line-height:32px}
.mrole{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.connect{background:var(--bg-subtle);border-radius:var(--radius-sm);padding:10px 12px;display:flex;flex-direction:column;gap:8px}

/* analytics + reporting (decision 2: real pages) */
.akpi{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:12px 12px 0;flex:none}
.kpi{border:1px solid var(--card-border);border-radius:var(--radius-sm);padding:8px 10px;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--card-bg)}
.kpi.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.kpi b{font-size:var(--fs-h1)}
.kpi span{font-size:var(--fs-tag)}
.abody{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;padding:10px 12px 12px}
.chartbox{border:1px solid var(--card-border);border-radius:var(--radius-sm);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.chartbox svg{width:100%;height:150px;display:block}
.chartbox .ax{stroke:var(--card-border);stroke-width:1}
.chartbox .bar{fill:var(--accent-light)}
.chartbox .line{fill:none;stroke:var(--accent);stroke-width:2.5}
.chartbox .prev{fill:none;stroke:var(--status-ignored);stroke-width:1.5;stroke-dasharray:4 4}
.chartbox .xl{display:flex;justify-content:space-between;font-size:var(--fs-tag);color:var(--text-muted);padding:0 12px}
.chartbox .lg{display:flex;gap:14px;font-size:var(--fs-tag);color:var(--text-muted)}
.chartbox .lg i{display:inline-block;width:14px;height:3px;background:var(--accent);vertical-align:middle;margin-right:4px}
.chartbox .lg i.p{background:var(--status-ignored)}
.atable{min-height:0;overflow:auto;border:1px solid var(--card-border);border-radius:var(--radius-sm)}
.rgrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:12px;padding:12px;overflow:hidden}
.rform{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.rform .row{display:flex;gap:16px;flex-wrap:wrap}
.rform .row>div{display:flex;flex-direction:column;gap:6px}
.swatch{width:28px;height:28px;border-radius:50%;padding:0;border:2px solid var(--card-bg);box-shadow:0 0 0 1px var(--card-border)}
.swatch.on{box-shadow:0 0 0 2px var(--text-primary)}
.sw-a{background:var(--accent)} .sw-b{background:var(--p-ig)} .sw-c{background:var(--green)} .sw-d{background:var(--p-li)} .sw-e{background:var(--yellow)}
.rprev{display:flex;flex-direction:column;gap:10px;min-height:0}
.page{border:1px solid var(--card-border);border-radius:6px;box-shadow:var(--shadow);background:var(--card-bg);aspect-ratio:1.414/1;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.page .band{position:absolute;left:0;top:0;bottom:0;width:6px}
.page .ph1{display:flex;align-items:center;gap:8px}
.page .ph1 b{font-size:var(--fs-h2)}
.page .mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.page .mini div{border:1px solid var(--card-border);border-radius:4px;padding:4px 6px;font-size:var(--fs-tag);display:flex;flex-direction:column}
.page .mini b{font-size:var(--fs-body)}
.page svg{width:100%;height:70px}
.page .line{fill:none;stroke-width:2.5}
.past{display:flex;flex-direction:column;gap:4px;min-height:0;overflow:auto}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;border-bottom:1px solid var(--card-border);padding:6px 0}
.irow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--card-border)}
.unread{font-weight:700;color:var(--accent)}

/* composer (decision 5): its own page; channel picker | writing | previews; only the writing column scrolls */
.cgrid{flex:1;min-height:0;display:grid;grid-template-columns:var(--chan-w) minmax(0,1fr) var(--pv-w);grid-template-rows:minmax(0,1fr) auto}
.cgrid>.chan{border-right:1px solid var(--card-border);display:flex;flex-direction:column;min-height:0}
.cgrid>.chan .ptop{min-height:44px}
.pick{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;align-items:center;padding:5px 6px;border-radius:var(--radius-sm);cursor:pointer}
.pick:hover{background:var(--bg-hover)}
.pick.on{background:var(--accent-light)}
.pick.off{opacity:.6;cursor:not-allowed}
.pick input{margin:0;accent-color:var(--accent)}
.pick .nm{min-width:0;line-height:1.3}
.pick .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .nm span{display:block;font-size:var(--fs-tag);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .nm span.err{color:var(--red)}
.ewrite{display:flex;flex-direction:column;min-height:0;min-width:0}
.etabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--card-border);overflow-x:auto;scrollbar-width:none;flex:none}
.etabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:10px 8px 8px;display:flex;gap:6px;align-items:center;color:var(--text-muted);font-weight:600;white-space:nowrap}
.etabs button:hover{background:transparent;color:var(--text-primary)}
.etabs button.on{color:var(--text-primary);border-bottom-color:var(--accent)}
.etabs .cdot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.etabs .cwarn{width:16px;height:16px;border-radius:50%;background:var(--red);color:var(--btn-primary-text);font-size:var(--fs-tag);line-height:16px;text-align:center;font-style:normal}
.write{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;padding:10px 12px}
.box{border:1px solid var(--btn-secondary-border);border-radius:var(--radius);display:flex;flex-direction:column;flex:1 0 auto;min-height:190px}
.box:focus-within{border-color:var(--accent)}
.box textarea{border:0;flex:1;padding:10px 12px;background:transparent;min-height:110px;border-radius:var(--radius)}
.box textarea:focus-visible{outline:0}
.box textarea[readonly]{color:var(--text-muted)}
.mrow{display:flex;gap:8px;padding:2px 12px 8px;flex-wrap:wrap}
.mt{width:56px;height:56px;border-radius:6px;position:relative;flex:none}
.mt .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--card-bg);border:1px solid var(--btn-secondary-border)}
.mt .x svg.i{width:12px;height:12px}
.madd{width:56px;height:56px;padding:0;border-style:dashed;display:grid;place-items:center;color:var(--text-muted)}
.tools{display:flex;align-items:center;gap:2px;border-top:1px solid var(--card-border);padding:3px 6px}
.tools .cnt{margin-left:auto;font-size:var(--fs-tag);color:var(--text-muted);white-space:nowrap;padding-left:6px;display:flex;gap:4px;align-items:center}
.cnt.over{color:var(--red);font-weight:700}
.lockbar,.revbar,.src{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg-subtle);border-radius:var(--radius-sm);padding:6px 10px}
.revbar{border-left:4px solid var(--severity-low)}
.src .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.part{display:grid;grid-template-columns:minmax(0,1fr) 30px;gap:4px;padding-left:14px;border-left:2px solid var(--card-border);margin-left:8px}
.pbox{border:1px solid var(--btn-secondary-border);border-radius:var(--radius-sm);display:flex;flex-direction:column}
.pbox:focus-within{border-color:var(--accent)}
.pbox textarea{border:0;background:transparent;padding:6px 10px;min-height:52px}
.pbox textarea:focus-visible{outline:0}
.pbox .mrow{padding:0 10px 6px}
.pbox .mt{width:40px;height:40px}
.pbox .tools .muted{margin-left:4px}
.pside{display:flex;flex-direction:column}

      {id:5,date:"2026-10-17",time:"10:00",accts:["s-bs","s-th"],state:"draft",imgs:[1],text:"藝術治療不是教你畫得好看，而是讓你透過畫畫，說出平常說不出口的事。很多大人第一次來的時候會說：「我從國小之後就沒畫過畫了。」沒關係，這裡沒有人在打分數。你可以只用一種顏色，也可以把紙塗滿；可以畫一整個小時，也可以畫到一半停下來，看著它發呆。我們在旁邊陪著，偶爾問一句：「這個顏色讓你想到什麼？」有時候答案很簡單，有時候會讓人愣一下。這些時刻，就是藝術治療在做的事。它不急，也不要求你變成一個會畫畫的人。它只是給你一個安全的地方，讓心裡的東西有地方放。如果你最近覺得累、覺得說不清楚自己怎麼了，歡迎來試一次。不用準備任何東西，穿可以弄髒的衣服就好。成人課在週四晚上七點半，一次九十分鐘，報名方式在留言，或直接私訊我們。"},

  const top=`<div class="ptop"><h2>貼文素材庫</h2><span class="seg" id="libSeg"><button type="button" class="${libKind==="post"?"on":""}" data-lk="post">存起來的貼文</button><button type="button" class="${libKind==="media"?"on":""}" data-lk="media">圖片和影片</button></span><span class="muted">${libKind==="post"?"常用的貼文存在這裡，下次直接拿來改。":"上傳過的圖片和影片都在這裡。"}</span><span class="r"><button type="button" class="btn-secondary" id="libAdd" data-i="plus">${libKind==="post"?"存一則貼文":"上傳"}</button></span></div>`;
  const body = items.length ? `<div class="lib">${items.map(x=>`<button type="button" class="ltile ${libSel.has(x.id)?"on":""}" data-l="${x.id}">${x.kind==="post"?`<span class="limg ${x.ph?"ph ph-"+x.ph:"txt"}">${x.ph?"":"文字貼文"}</span><span class="lt">${esc(x.text)}</span><span class="avs">${[...new Set((x.accts||[]).map(pfOf))].map(pfb).join("")}</span>`:`<span class="limg ph ph-${x.ph}">${x.kind==="video"?I("play"):""}</span><span class="lt">${esc(x.name)}</span><span class="muted tag">${x.kind==="video"?"影片 · ":""}用過 ${x.used} 次</span>`}</button>`).join("")}</div>${libSel.size?`<div class="bulk"><span>已選 ${libSel.size} 個</span><button type="button" class="btn-primary" id="libUse">用這些寫新貼文</button><button type="button" id="libClear">取消選取</button></div>`:""}`
    : libKind==="post" ? emptyHtml("bookmark","還沒有存起來的貼文","在撰寫頁按 ▾「存到素材庫」，就會出現在這裡。","寫一則貼文","libNew") : emptyHtml("image","還沒有圖片和影片","上傳過的會留在這裡，下次直接用。","上傳圖片或影片","libUp");
  side(top+body);
  $("libSeg").querySelectorAll("button").forEach(x=>x.onclick=()=>{ libKind=x.dataset.lk; libSel.clear(); renderLibrary(); });
  const up=()=>{ all.unshift(libKind==="post"?{id:"L"+Date.now(),kind:"post",text:"（新存的貼文）週末工作坊報名開始。",accts:connected().slice(0,1).map(a=>a.id)}:{id:"m"+Date.now(),kind:"image",ph:1+all.length%4,name:"新上傳-"+(all.length+1)+".jpg",used:0}); renderLibrary(); };
  for(const id of ["libAdd","libUp"]) if($(id)) $(id).onclick=up;
  if($("libNew")) $("libNew").onclick=()=>newPost();
  $("sideView").querySelectorAll("[data-l]").forEach(x=>x.onclick=()=>{ const k=x.dataset.l; libSel.has(k)?libSel.delete(k):libSel.add(k); renderLibrary(); });
  if($("libClear")) $("libClear").onclick=()=>{ libSel.clear(); renderLibrary(); };
  if($("libUse")) $("libUse").onclick=()=>{ const sel=all.filter(x=>libSel.has(x.id)); const post=sel.find(x=>x.kind==="post"); const imgs=sel.filter(x=>x.ph).map(x=>x.ph); libSel.clear(); newPost(null,null,imgs,post?post.accts:null,post?post.text:""); };
}
// 自動發布清單 (= rotation lists): weekday x time cells
function renderLists(){
  const ls=B().lists;
  if(!ls.length){ side(`<div class="ptop"><h2>自動發布清單</h2></div>`+emptyHtml("repost","還沒有自動發布清單","清單裡的貼文會照順序，在勾好的時段一則一則發。","＋ 建第一個清單","newList")); $("newList").onclick=newList; return; }
  if(!ls.some(l=>l.id===selectedList)) selectedList=ls[0].id; const l=ls.find(x=>x.id===selectedList);
  side(`<div class="ptop"><h2>自動發布清單</h2><span class="muted">例子：清單放 4 則常見問題，勾「週一、週三 10:00」。時間到就發下一則，4 則發完再從第 1 則開始。</span><span class="r"><button type="button" class="btn-secondary" id="newList">＋ 新清單</button></span></div>

  <div class="ldet">
    <div class="frow"><span class="lab">名稱</span><input type="text" id="ldName" value="${esc(l.name)}" aria-label="清單名稱"></div>
    <div class="frow top"><span class="lab">時段</span><div class="slots"><div class="sgrid7"><span></span>${DOW.map(n=>`<span class="muted">${n}</span>`).join("")}<span></span>${l.times.map(t=>`<span class="muted tag">${t}</span>${DOW.map((_,i)=>{ const k=(i+1)+"@"+t, on=l.slots.includes(k); return `<button type="button" class="slot ${on?"on":""}" data-slot="${k}" aria-pressed="${on}" aria-label="週${DOW[i]} ${t}"></button>`; }).join("")}<button type="button" class="ibtn" data-rmtime="${t}" aria-label="拿掉 ${t} 這一列" title="拿掉這一列">${I("x")}</button>`).join("")}</div><span class="acts"><button type="button" class="lnk" id="ldAddTime">＋ 加一個時間</button><span class="muted tag">點格子＝那天那個時間發一則</span></span></div></div>
    <div class="frow"><span class="lab">發到</span><span class="acts" id="ldAccts">${B().accounts.map(a=>`<button type="button" class="btn-secondary ${l.accts.includes(a.id)?"":"muted"}" data-acc="${a.id}" ${a.st!=="connected"?"disabled":""} aria-pressed="${l.accts.includes(a.id)}">${l.accts.includes(a.id)?"✓ ":""}${pfb(a.pf)} ${esc(a.name)}</button>`).join("")}</span></div>
    <div class="frow"><span class="lab">下一則</span><span>${esc(nextRun(l))}</span></div>
    <div class="queue">${l.queue.length ? l.queue.map((t,i)=>`<div class="qrow ${i===l.cursor?"next":""}"><span class="n">第 ${i+1} 則${i===l.cursor?"・下一則":""}</span><span class="tx" title="${esc(t)}">${esc(t)}</span><span class="acts"><button type="button" class="ibtn" data-up="${i}" aria-label="往上">${I("up")}</button><button type="button" class="ibtn" data-down="${i}" aria-label="往下">${I("down")}</button><button type="button" class="ibtn" data-rm="${i}" aria-label="移除">${I("x")}</button></span></div>`).join("") : `<div class="muted">清單還是空的。按「從草稿加入」，或寫貼文時選「自動發布清單」。</div>`}</div>
    <div class="hint" id="ldHint"></div>
    <div class="acts"><button type="button" id="ldAdd">從草稿加入</button><button type="button" id="ldToggle">${l.on?"暫停":"開始發布"}</button><button type="button" class="danger" id="ldDel">刪除清單</button><button type="button" class="btn-primary" id="ldSave">儲存</button></div>
  </div></div>`);
  $("newList").onclick=newList;
  $("sideView").querySelectorAll(".lst").forEach(x=>x.onclick=()=>{ selectedList=x.dataset.id; renderLists(); });
  $("sideView").querySelectorAll("[data-slot]").forEach(x=>x.onclick=()=>{ const k=x.dataset.slot, i=l.slots.indexOf(k); i<0?l.slots.push(k):l.slots.splice(i,1); renderLists(); });
  $("sideView").querySelectorAll("[data-rmtime]").forEach(x=>x.onclick=()=>{ const t=x.dataset.rmtime; l.times=l.times.filter(y=>y!==t); l.slots=l.slots.filter(y=>!y.endsWith("@"+t)); renderLists(); });
  $("ldAddTime").onclick=()=>openDtp($("ldAddTime"), null, "14:00", t=>{ if(!l.times.includes(t)){ l.times.push(t); l.times.sort(); } renderLists(); });
  $("ldAccts").querySelectorAll("button:not([disabled])").forEach(x=>x.onclick=()=>{ const k=x.dataset.acc; l.accts.includes(k)?l.accts.splice(l.accts.indexOf(k),1):l.accts.push(k); renderLists(); });
  $("sideView").querySelectorAll("[data-up]").forEach(x=>x.onclick=()=>{ const i=+x.dataset.up; if(i>0){ [l.queue[i-1],l.queue[i]]=[l.queue[i],l.queue[i-1]]; renderLists(); } });
  $("sideView").querySelectorAll("[data-down]").forEach(x=>x.onclick=()=>{ const i=+x.dataset.down; if(i<l.queue.length-1){ [l.queue[i+1],l.queue[i]]=[l.queue[i],l.queue[i+1]]; renderLists(); } });
  $("sideView").querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{ l.queue.splice(+x.dataset.rm,1); if(l.cursor>=l.queue.length) l.cursor=0; renderLists(); });
  $("ldSave").onclick=()=>{ l.name=$("ldName").value.trim()||l.name; renderLists(); $("ldHint").textContent="已儲存。下一則："+nextRun(l); };
  $("ldToggle").onclick=()=>{ if(!l.on&&(!l.slots.length||!l.queue.length||!l.accts.length)){ $("ldHint").innerHTML='<span class="err">要先勾至少一個時段、至少一則貼文、至少一個頻道，才能開始發布。</span>'; return; } l.on=!l.on; renderLists(); };
  $("ldDel").onclick=()=>{ B().lists=B().lists.filter(x=>x.id!==l.id); selectedList=null; renderLists(); };
  $("ldAdd").onclick=()=>{ const drafts=B().posts.filter(p=>p.state==="draft"&&!p.kind); if(!drafts.length){ $("ldHint").textContent="這個品牌目前沒有草稿。"; return; }
    $("ldHint").innerHTML="挑一則草稿："+drafts.map(p=>`<button type="button" class="lnk" data-add="${p.id}">${esc(p.text.slice(0,14))}…</button>`).join(" ");
    $("ldHint").querySelectorAll("[data-add]").forEach(x=>x.onclick=()=>{ const p=B().posts.find(y=>y.id===+x.dataset.add); l.queue.push(p.text); Object.assign(p,{state:"rotation",listId:l.id,date:"",time:""}); renderLists(); }); };
}
function newList(){ const l={id:"l"+Date.now(),name:"新清單",times:["10:00"],slots:[],accts:connected().slice(0,1).map(a=>a.id),on:false,cursor:0,queue:[]}; B().lists.push(l); selectedList=l.id; renderLists(); }

// 已刪除貼文: when and who; restore puts it back as it was
function renderTrash(){ const ps=B().posts.filter(p=>p.state==="deleted");
  side(`<div class="ptop"><h2>已刪除貼文</h2><span class="muted">刪掉的貼文留在這裡，可以還原。</span></div>` + (ps.length
    ? `<div class="list"><table><thead><tr><th>排定時間</th><th>內容</th><th>發到</th><th>刪除前</th><th>刪除時間</th><th>誰刪的</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr><td>${p.date?fmt(p.date)+" "+p.time:"輪播"}</td><td class="ttl">${esc(p.text||p.title)}</td><td><span class="avs">${postPfs(p).map(pfb).join("")}</span></td><td><span class="pill" data-state="${p.prevState||"draft"}">${STATES[p.prevState||"draft"]}</span></td><td>${p.delAt||""}</td><td>${esc(p.delBy||"")}</td><td><button type="button" data-restore="${p.id}">還原</button></td></tr>`).join("")}</tbody></table></div>`
    : emptyHtml("trash","沒有刪掉的貼文","從日曆或清單刪掉的貼文，會留在這裡。","回排程日曆","trashBack")));
  $("sideView").querySelectorAll("[data-restore]").forEach(x=>x.onclick=()=>{ const p=B().posts.find(y=>y.id===+x.dataset.restore); p.state=p.prevState||"draft"; addLog("還原",p,""); renderTrash(); });
  if($("trashBack")) $("trashBack").onclick=()=>setView(calView); }

// ---- 數據分析 (decision 2): pick a channel on the left, a period top right; cards, trend, posts ----
const seed = s => { let h=7; for(const ch of s) h=(h*31+ch.charCodeAt(0))%100003; return h; };
const METRICS = [["followers","追蹤者",""],["reach","觸及",""],["impr","曝光",""],["eng","互動",""],["rate","互動率","%"],["posts","發文數",""]];
function stats(id, days){ const h=seed(id+days), k=days/28;
  const v={followers:1200+h%3800, reach:Math.round((3000+h%9000)*k), impr:Math.round((5200+h%15000)*k), eng:Math.round((180+h%900)*k), posts:Math.max(1,Math.round((6+h%10)*k))};
  v.rate=+(v.eng/v.reach*100).toFixed(1); const dl={}; for(const [m] of METRICS) dl[m]=((h>>(m.length))%37-12); return {v,dl}; }
function series(id, days, m){ const h=seed(id+m), n=Math.min(days,28), out=[], prev=[]; for(let i=0;i<n;i++){ out.push(40+((h*(i+3))%55)+Math.round(20*Math.sin((i+h%7)/3))); prev.push(35+((h*(i+5))%45)); } return {out,prev}; }
function renderAnalytics(){ const accs=B().accounts.filter(a=>a.st!=="review");
  if(!accs.length){ side(`<div class="ptop"><h2>數據分析</h2></div>`+emptyHtml("chart","還沒有可以分析的頻道","連接社群帳號後，這裡會出現追蹤者、觸及和互動。","到設定連接帳號","anConn")); $("anConn").onclick=()=>setView("settings"); return; }
  const ids = aAcct==="all" ? accs.map(a=>a.id) : [aAcct];
  const sum={v:{},dl:{}}; for(const [m] of METRICS){ sum.v[m]=0; sum.dl[m]=0; }
  ids.forEach(id=>{ const s=stats(id,aPeriod); for(const [m] of METRICS){ sum.v[m]+=s.v[m]; sum.dl[m]+=s.dl[m]/ids.length; } }); sum.v.rate=+(sum.v.eng/Math.max(1,sum.v.reach)*100).toFixed(1);
  const ser=series(ids.join(","),aPeriod,aMetric), W=640, H=150, n=ser.out.length, X=i=>20+i*(W-40)/(n-1), Y=v=>H-18-(v/100)*(H-34);
  const path=a=>a.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  const posts=B().posts.filter(p=>p.state==="published"&&p.kind!=="article"&&(aAcct==="all"||(p.accts||[]).includes(aAcct))).map(p=>({p,...stats("post"+p.id,28).v})).sort((a,b)=>b.eng-a.eng);
  side(`<div class="cols2" style="grid-template-columns:var(--chan-w) minmax(0,1fr)"><div class="lcol"><h3 class="muted tag">選頻道</h3><button type="button" class="crow ${aAcct==="all"?"on":""}" data-an="all"><span class="aav"><span class="av c1">全</span></span><span class="nm"><b>全部頻道</b><span>${accs.length} 個加總</span></span><span></span></button>${accs.map(a=>`<button type="button" class="crow ${aAcct===a.id?"on":""}" data-an="${a.id}">${aav(a)}<span class="nm"><b>${esc(a.name)}</b><span>${esc(acctLine(a))}</span></span><span></span></button>`).join("")}</div>
  <div style="display:flex;flex-direction:column;min-height:0;min-width:0">
    <div class="ptop"><h2>${aAcct==="all"?"全部頻道":esc(A(aAcct).name)}</h2><span class="muted tag">範例數字（樣稿）；正式版從各平台 API 拉，要等平台審核通過</span><span class="r"><span class="seg" id="anPer">${[[7,"7 天"],[28,"28 天"],[90,"90 天"]].map(([v,t])=>`<button type="button" class="${aPeriod===v?"on":""}" data-per="${v}">${t}</button>`).join("")}</span><span class="muted">${fmt(addDays(TODAY,-aPeriod))} – ${fmt(TODAY)}</span></span></div>
    <div class="akpi">${METRICS.map(([m,t,u])=>`<button type="button" class="kpi ${aMetric===m?"on":""}" data-met="${m}"><span class="muted">${t}</span><b>${sum.v[m].toLocaleString()}${u}</b>${(()=>{ const r=Math.round(sum.dl[m]); return `<span class="${r>=0?"up":"down"}">${r>=0?"▲":"▼"} ${Math.abs(r)}% 比上一期</span>`; })()}</button>`).join("")}</div>
    <div class="abody"><div class="chartbox"><div class="lg"><b>${METRICS.find(x=>x[0]===aMetric)[1]}：每天</b><span><i></i>這一期</span><span><i class="p"></i>上一期</span></div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="趨勢圖">${[0,1,2,3].map(k=>`<line class="ax" x1="20" x2="${W-20}" y1="${Y(k*33)}" y2="${Y(k*33)}"></line>`).join("")}${ser.out.map((v,i)=>`<rect class="bar" x="${X(i)-4}" y="${Y(v*0.6)}" width="8" height="${H-18-Y(v*0.6)}"></rect>`).join("")}<path class="prev" d="${path(ser.prev)}"></path><path class="line" d="${path(ser.out)}"></path></svg><div class="xl">${[0,Math.floor(n/2),n-1].map(i=>`<span>${fmt(addDays(TODAY,-(n-1-i)*Math.max(1,Math.round(aPeriod/n))))}</span>`).join("")}</div></div>
    <div class="atable"><table><thead><tr><th></th><th>發佈</th><th>頻道</th><th>內容</th><th class="num">觸及</th><th class="num">互動</th><th class="num">互動率</th></tr></thead><tbody>${posts.map(x=>`<tr><td>${(x.p.imgs||[]).length?`<span class="tthumb ph ph-${x.p.imgs[0]}"></span>`:`<span class="tthumb txt"></span>`}</td><td>${fmt(x.p.date)} ${x.p.time}</td><td><span class="avs">${postPfs(x.p).map(pfb).join("")}</span></td><td class="ttl">${esc(x.p.text)}</td><td class="num">${x.reach.toLocaleString()}</td><td class="num">${x.eng.toLocaleString()}</td><td class="num">${x.rate}%</td></tr>`).join("") || `<tr><td colspan="7" class="muted">這段期間沒有已發佈的貼文。</td></tr>`}</tbody></table></div></div>
  </div></div>`);
  $("sideView").querySelectorAll("[data-an]").forEach(x=>x.onclick=()=>{ aAcct=x.dataset.an; renderAnalytics(); });
  $("sideView").querySelectorAll("[data-per]").forEach(x=>x.onclick=()=>{ aPeriod=+x.dataset.per; renderAnalytics(); });
  $("sideView").querySelectorAll("[data-met]").forEach(x=>x.onclick=()=>{ aMetric=x.dataset.met; renderAnalytics(); });
}

  side(`<div class="ptop"><h2>${esc(b.name)} 的設定</h2></div><div class="sgrid">

      <h3>團隊</h3>${b.team.map((m,i)=>`<div class="mrole"><span>${esc(m.name)}${m.me?"（我）":""}</span><span class="seg">${Object.keys(ROLES).map(r=>`<button type="button" class="${m.role===r?"on":""}" data-role="${r}" data-idx="${i}">${ROLES[r]}</button>`).join("")}</span><button type="button" class="ibtn" data-kick="${i}" ${m.role==="owner"?"disabled":""} aria-label="移除成員" title="移除">${I("x")}</button></div>`).join("")}

  if($("cdBack")) $("cdBack").onclick=()=>{ connectPf=null; renderSettings(); };

  $("revSeg").querySelectorAll("button").forEach(x=>x.onclick=()=>{ b.review=x.dataset.rv==="1"; renderSettings(); });
  $("sideView").querySelectorAll("[data-role]").forEach(x=>x.onclick=()=>{ b.team[+x.dataset.idx].role=x.dataset.role; renderSettings(); });

// ---- composer (decision 5): its own page. Left: which channels (a list that scales); middle: writing; right: previews ----
const XTRA = {link:"連結與 UTM",alt:"替代文字",texts:"常用文字",ai:"AI 幫我寫",emoji:"表情符號",notes:"備註"};
const XICON = {link:"link",alt:"eye",texts:"lines",ai:"spark",emoji:"smile",notes:"note"};
const THREAD = ["bluesky","threads"], DELAYS = [0,1,5,60];
const delayTxt = m => m ? (m<60 ? `${m} 分鐘後` : `${m/60} 小時後`) : "緊接著";
const effText = k => ed.custom[k] ?? ed.text;
const effLen = k => [...effText(k)].length;
const maxOf = id => PF[pfOf(id)].max;
function blank(){ return {id:null,kind:null,state:"draft",text:"",accts:new Set(connected().slice(0,3).map(a=>a.id)),custom:{},tab:"all",imgs:[],parts:[],link:"",utm:false,alt:"",fmt:{},notes:"",date:"2026-10-16",time:"09:00",act:null,listId:null,open:new Set()}; }
function openPost(id, o={}){
  const p=B().posts.find(x=>x.id===id); if(!p) return newPost();
  ed=blank(); Object.assign(ed,{id:p.id,kind:p.kind||null,state:p.state,date:p.date||TODAY,time:p.time||"10:00",listId:p.listId||null});
  if(p.kind==="article"){ ed.state="draft"; ed.time="12:00"; }
  else Object.assign(ed,{text:p.text,accts:new Set(p.accts),custom:{...(p.custom||{})},imgs:[...(p.imgs||[])],parts:(p.parts||[]).map(x=>({...x})),link:p.link||"",utm:!!p.utm,alt:p.alt||"",fmt:{...(p.fmt||{})},notes:p.notes||""});
  for(const k of ["link","alt","notes"]) if(ed[k]) ed.open.add(k);
  showComposer(o);
}
function newPost(date, time, imgs, accts, text){ ed=blank(); if(date) ed.date=date; if(time) ed.time=time; if(imgs) ed.imgs=imgs; if(accts&&accts.length) ed.accts=new Set(accts.filter(id=>A(id).st==="connected")); if(text) ed.text=text; showComposer({}); if(date) say(`在 ${fmtLong(date)} ${ed.time} 寫一則新貼文。`); }
function showComposer(o){
  if(view!=="compose"){ view="compose"; }

  $("confirmNow").hidden=true; document.body.classList.remove("chans");

  X.querySelectorAll("[data-close]").forEach(x=>x.onclick=()=>{ ed.open.delete(x.dataset.close); renderXtras(); });
  const bind=(id,key)=>{ const el=$(id); if(el){ el.readOnly=ro(); el.oninput=()=>{ ed[key]=el.value; renderPreview(); if(key==="link") shortLink(); }; } };
  bind("xlink","link"); bind("xalt","alt"); bind("xnotes","notes");
  const u=$("xutm"); if(u) u.onchange=()=>{ ed.utm=u.checked; shortLink(); }; shortLink();
  X.querySelectorAll("[data-t]").forEach(x=>x.onclick=()=>insertText(B().texts[+x.dataset.t]));
  const sv=$("xsave"); if(sv) sv.onclick=()=>{ const t=$("text").value.trim(); if(t){ B().texts.push(t); renderXtras(); say("已存到常用文字。"); } };
  X.querySelectorAll("[data-em]").forEach(x=>x.onclick=()=>insertText(x.dataset.em, true));
  X.querySelectorAll("[data-ai]").forEach(x=>x.onclick=()=>say(x.dataset.ai==="short"?"（樣稿）AI 會把這一份改短，改好先給你看，按「用這版」才換掉。這次約 NT$1。":"（樣稿）AI 會換個溫暖的口氣重寫，改好先給你看。這次約 NT$1。"));
}
function shortLink(){ const s=$("xshort"); if(!s) return; const v=ed.link.trim(); s.textContent = v ? `會縮成 aw.link/${(v.length*7919%46655+1296).toString(36)}${ed.utm?"，帶 utm_source=各平台名":""}` : ""; }
function insertText(t, inline){ const el=$("text"); if(el.readOnly) return say("這個分頁用共用文字。要改，先按「另外寫一份」。"); const v=el.value; el.value = inline ? v.slice(0,el.selectionStart)+t+v.slice(el.selectionEnd) : (v+"\n"+t).trim(); el.dispatchEvent(new Event("input")); }
// the parts after the post: Bluesky / Threads join them into a thread; Facebook / Instagram / LinkedIn post them as comments
function addPart(){ ed.parts.push({text:"",delay:0}); renderParts(); renderPreview(); const t=$("parts").querySelectorAll("textarea"); if(t.length) t[t.length-1].focus(); }
function partCnt(t){ const ks=[...ed.accts].map(pfOf).filter(k=>THREAD.includes(k)); if(!ks.length) return ""; const k=ks.reduce((a,b)=>PF[b].max<PF[a].max?b:a), n=[...t].length;
  return `<span class="cnt ${n>PF[k].max?"over":""}">${pfb(k)} ${n}／${PF[k].max}</span>`; }
function renderParts(){ const el=$("parts"), P=ed.parts;
  el.innerHTML = P.map((x,i)=>`<div class="part"><div class="pbox"><textarea data-pi="${i}" rows="2" aria-label="第 ${i+2} 則" placeholder="第 ${i+2} 則" ${ro()?"readonly":""}>${esc(x.text)}</textarea>${x.img?`<div class="mrow"><span class="mt ph ph-${x.img}"></span></div>`:""}<div class="tools"><button type="button" class="ibtn" data-pimg="${i}" title="加一張圖" aria-label="加一張圖">${I("image")}</button><button type="button" class="ibtn" data-pem="${i}" title="加表情" aria-label="加表情">${I("smile")}</button><span class="muted tag">${delayTxt(x.delay)}發</span>${partCnt(x.text)}</div></div>`
    + `<div class="pside"><button type="button" class="ibtn" data-pup="${i}" aria-label="往上" ${i?"":"disabled"}>${I("up")}</button><button type="button" class="ibtn" data-pdown="${i}" aria-label="往下" ${i<P.length-1?"":"disabled"}>${I("down")}</button><button type="button" class="ibtn" data-pdel="${i}" aria-label="刪掉這一則">${I("trash")}</button><button type="button" class="ibtn ${x.delay?"on":""}" data-pdelay="${i}" title="前一則發出後多久發：${delayTxt(x.delay)}（點一下換）" aria-label="延遲">${I("clock")}</button></div></div>`).join("")
    + (ro() ? "" : `<div class="addpart"><button type="button" class="btn-secondary" id="addPart">＋ 接一則</button><span class="muted tag">Bluesky、Threads 接成串文；Facebook、Instagram、LinkedIn 變成留言。</span></div>`);
  const a=$("addPart"); if(a) a.onclick=addPart;
  el.querySelectorAll("[data-pi]").forEach(t=>t.oninput=()=>{ P[+t.dataset.pi].text=t.value; renderPreview(); renderHint(); });
  const mv=(i,j)=>{ [P[i],P[j]]=[P[j],P[i]]; renderParts(); renderPreview(); };
  el.querySelectorAll("[data-pup]").forEach(b=>b.onclick=()=>mv(+b.dataset.pup, +b.dataset.pup-1));
  el.querySelectorAll("[data-pdown]").forEach(b=>b.onclick=()=>mv(+b.dataset.pdown, +b.dataset.pdown+1));
  el.querySelectorAll("[data-pdel]").forEach(b=>b.onclick=()=>{ P.splice(+b.dataset.pdel,1); renderParts(); renderPreview(); });
  el.querySelectorAll("[data-pdelay]").forEach(b=>b.onclick=()=>{ const x=P[+b.dataset.pdelay]; x.delay=DELAYS[(DELAYS.indexOf(x.delay)+1)%DELAYS.length]; renderParts(); renderPreview(); });
  el.querySelectorAll("[data-pimg]").forEach(b=>b.onclick=()=>{ const x=P[+b.dataset.pimg]; x.img = x.img ? null : 1+(+b.dataset.pimg+2)%4; renderParts(); renderPreview(); });
  el.querySelectorAll("[data-pem]").forEach(b=>b.onclick=()=>{ const x=P[+b.dataset.pem]; x.text+="🙂"; renderParts(); renderPreview(); });
}
// platform settings: 共用 lists each channel's format; a channel tab shows its own
function renderPset(){ const el=$("pset"), k=ed.tab;
  const sum = id => FORMATS[pfOf(id)] ? (ed.fmt[id]||"貼文") : "";
  if(k==="all"){ const ids=[...ed.accts].filter(sum); el.hidden=!ids.length; el.innerHTML = `<h3>各頻道格式</h3>`+ids.map(id=>`<div class="psrow">${pfb(pfOf(id))}<span>${esc(A(id).name)}</span><span class="chip">${sum(id)}</span><button type="button" class="lnk" data-tab="${id}">改</button></div>`).join(""); }
  else { const pf=pfOf(k); el.hidden=false; el.innerHTML = `<h3>${esc(A(k).name)}（${PF[pf].n}）設定</h3>` + (FORMATS[pf] ? `<span class="seg">${FORMATS[pf].map(f=>`<button type="button" class="${(ed.fmt[k]||"貼文")===f?"on":""}" data-f="${f}">${f}</button>`).join("")}</span>`+({instagram:`<span class="muted tag">放 2 張以上的圖，會變成多圖輪播。限時動態不顯示文字。</span>`,facebook:`<span class="muted tag">Reel 和限時動態要直式影片或圖片。</span>`,linkedin:`<span class="muted tag">文件輪播要上傳 PDF，一頁一張。</span>`}[pf])
      : `<span class="muted">${PF[pf].n} 沒有另外的設定。要接成串文，按文字框下面的「接一則」。</span>`); }
  el.querySelectorAll("[data-tab]").forEach(x=>x.onclick=()=>{ ed.tab=x.dataset.tab; renderTabs(); fillText(); renderPset(); renderCnt(); renderPreview(); });
  el.querySelectorAll("[data-f]").forEach(x=>x.onclick=()=>{ if(ro()) return; ed.fmt[k]=x.dataset.f; renderPset(); renderPreview(); });
}
// previews: each platform's own shell, the channel's picture, name and handle; no made-up like counts; text past the limit in red
function grid(imgs){ if(!imgs.length) return ""; const n=Math.min(imgs.length,4); return `<div class="imgs n${n}">${imgs.slice(0,4).map(m=>`<span class="im ph ph-${m}"></span>`).join("")}</div>`; }
function shell(id){
  const a=A(id), k=a.pf, t=effText(id), max=PF[k].max, f=ed.fmt[id]||"貼文";
  const mark = x => x ? esc([...x].slice(0,max).join("")) + ([...x].length>max ? `<mark class="over" title="超過 ${max} 字，這段發不出去">${esc([...x].slice(max).join(""))}</mark>` : "") : `<span class="muted">（文字會出現在這裡）</span>`;
  const body = mark(t), when = ed.act==="now" ? "剛剛" : `${fmt(ed.date)} ${ed.time}`, imgs=ed.imgs;
  const lab = `<div class="shl">${pfb(k)}${esc(a.name)}${f!=="貼文"?" · "+f:""}</div>`, ic = ns => ns.map(n=>I(n)).join(""), av=avOf(a);
  const parts = ed.parts.filter(x=>x.text.trim()||x.img), cms = name => parts.map(x=>`<div class="cm"><b>${esc(name)}</b> ${esc(x.text)}</div>`).join("");
  const thread = (name, sub, icons) => { const all=[{html:body,imgs}, ...parts.map(x=>({html:mark(x.text),imgs:x.img?[x.img]:[],delay:x.delay}))];
    return `<div class="sh th">${all.map((e,i)=>`<div class="tl">${av}${i<all.length-1?"<i></i>":""}</div><div><div class="who"><b>${esc(name)}</b><span>${i?delayTxt(e.delay):sub}</span></div><div class="tx">${e.html}</div>${grid(e.imgs)}<div class="ic">${ic(icons)}</div></div>`).join("")}</div>`; };
  if(k==="bluesky") return lab+thread(a.name, `${a.handle} · ${when}`, ["comment","repost","heart"]);
  if(k==="threads") return lab+thread(a.handle.replace(/^@/,"").split(" ")[0], when, ["heart","comment","repost","send"]);
  if(k==="facebook") return lab+`<div class="sh fb"><div class="hd">${av}<div class="who"><b>${esc(a.name)}</b><span>${when} · 公開</span></div></div><div class="tx clamp5">${body}</div>${grid(imgs)}<div class="ic bar"><span>${I("like")}讚</span><span>${I("comment")}留言</span><span>${I("share")}分享</span></div>${cms(a.name)}</div>`;
  if(k==="instagram"){ const h=a.handle.replace(/^@/,"").split(" ")[0], tall=f!=="貼文";
    const pic = imgs.length ? `<div class="sq ph ph-${imgs[0]} ${tall?"tall":""}"></div>${imgs.length>1&&!tall?`<div class="dots">${imgs.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>`:""}` : `<div class="need">Instagram 一定要有圖片或影片。</div>`;
    return lab+`<div class="sh ig"><div class="hd">${av}<div class="who"><b>${esc(h)}</b></div><span class="end muted">${I("more")}</span></div>${pic}<div class="ic">${ic(["heart","comment","send"])}<span class="end">${I("bookmark")}</span></div>${f==="限時動態"?"":`<div class="tx clamp2"><b>${esc(h)}</b> ${body}</div>${cms(h)}`}</div>`; }
  if(k==="linkedin") return lab+`<div class="sh li"><div class="hd">${avOf(a,"sq")}<div class="who"><b>${esc(a.name)}</b><span>${esc(a.handle)} · ${when}</span></div></div><div class="tx clamp3">${body}</div>${f==="文件輪播"?`<div class="need">文件輪播：上傳 PDF 後，這裡一頁一頁翻。</div>`:grid(imgs)}<div class="ic bar"><span>${I("like")}讚</span><span>${I("comment")}留言</span><span>${I("repost")}轉發</span><span>${I("send")}傳送</span></div>${cms(a.name)}</div>`;
  return "";
}
function renderPreview(){ const ids = ed.tab==="all" ? [...ed.accts] : [ed.tab];
  $("pvNote").textContent = ids.length>1 ? `${ids.length} 個頻道，往下看` : "";
  $("screen").innerHTML = ids.length ? ids.map(shell).join("") : `<span class="muted">先在左邊勾選要發到哪些頻道。</span>`; }
function refresh(){ renderPick(); renderTabs(); fillText(); renderMrow(); renderParts(); renderXtras(); renderPset(); renderCnt(); renderPreview(); renderFoot(); }
// the main button does the action picked in ▾ (default 排程; 送審 when the brand needs review and you are an editor)
const ACTS = {draft:"存草稿",library:"存到素材庫",review:"送審",schedule:"排程",now:"立即發佈"};
const defaultAct = () => B().review && me==="editor" && ed.state!=="scheduled" ? "review" : "schedule";
const fmtWhen = () => { const x=d(ed.date); return `${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日（${DOW[dowOf(ed.date)]}）${ed.time}`; };
function renderFoot(){
  if(!ed.act) ed.act=defaultAct();
  const now=ed.act==="now", noTime=ed.act==="library";
  $("dtTxt").textContent = now ? "現在就發" : fmtWhen(); $("dtBtn").disabled = ro()||now||noTime; $("dtBtn").title = `設定發佈時間（${B().tz}）`;
  $("btnMain").textContent = ro() ? "複製成新貼文" : ACTS[ed.act]; $("btnMore").disabled = ro();
  $("menu").querySelectorAll(".mi").forEach(x=>x.classList.toggle("on", x.dataset.act===ed.act));
}
$("menu").querySelectorAll(".mi").forEach(x=>x.onclick=()=>{ ed.act=x.dataset.act; $("menu").hidden=true; $("btnMore").setAttribute("aria-expanded","false"); renderFoot(); });
$("dtBtn").onclick=()=>openDtp($("dtBtn"), ed.date, ed.time, (t,day)=>{ ed.time=t; if(day) ed.date=day; renderFoot(); renderPreview(); }, true);
$("btnMore").onclick=()=>{ const open=$("menu").hidden; $("menu").hidden=!open; $("btnMore").setAttribute("aria-expanded",String(open)); };
$("btnMain").onclick=()=>{ if(ro()) return duplicate(); const a=ed.act;
  if(a==="now") return $("confirmNow").hidden=false;
  if(a==="library") return saveToLibrary();
  save({draft:"draft",review:"review",schedule:"scheduled"}[a]); };
$("nowNo").onclick=()=>{ $("confirmNow").hidden=true; };
function saveToLibrary(){ if(!ed.text.trim()) return say("貼文還是空的。", true); B().library.unshift({id:"L"+Date.now(),kind:"post",ph:ed.imgs[0],text:ed.text,accts:[...ed.accts]}); say("已存到貼文素材庫。"); }
$("nowYes").onclick=()=>{ $("confirmNow").hidden=true; ed.date=TODAY; ed.time="10:40"; save("published"); };
function renderHint(){ if(!ed||view!=="compose") return; const p=ed.id!=null?B().posts.find(x=>x.id===ed.id):null; const h=[];
  if(p&&p.err) h.push(`<span class="err">${esc(p.err)}</span>`);
  if(p&&p.kind!=="article"){ const miss=unconnected(p); if(miss.length) h.push(`<span class="err">${miss.map(id=>A(id).name).join("、")} 沒連接或授權過期，這則發不出去。</span>`); }
  if(ro()) h.push(`已發佈，不能改。${p&&p.url?`<a href="${p.url}" target="_blank" rel="noopener">到平台上看這則</a>`:""}`);
  if(ed.state==="review"&&me!=="reviewer") h.push("等審核人核准，核准後照排定時間發。");
  if(ed.kind==="article") h.push("先按「用文章摘要」或「AI 改寫」，再排時間。");
  const over=[...ed.accts].filter(k=>effLen(k)>maxOf(k)); if(over.length&&!ro()) h.push(`<span class="err">${over.map(k=>A(k).name+"（"+PF[pfOf(k)].n+"）").join("、")} 超過字數上限。點上面它的名字另外寫一份短的。</span>`);
  $("hint").innerHTML = h.join("　"); }
function validate(state){ if(!ed.text.trim() && !Object.values(ed.custom).some(x=>x&&x.trim())) return "貼文還是空的。";
  if(state==="draft") return null; if(!ed.accts.size) return "還沒選要發到哪裡：在左邊勾頻道。";
  const pover=[...ed.accts].filter(k=>THREAD.includes(pfOf(k))&&ed.parts.some(x=>[...x.text].length>maxOf(k))); if(pover.length) return "接的那幾則有一則超過字數上限。";
  const over=[...ed.accts].filter(k=>effLen(k)>maxOf(k)); if(over.length) return `${over.map(k=>A(k).name).join("、")} 超過字數上限，發不出去。`;
  if([...ed.accts].some(k=>pfOf(k)==="instagram")&&!ed.imgs.length) return "Instagram 一定要有圖片或影片。"; return null; }
function save(state){
  const e=validate(state); if(e) return say(e, true);
  let p = ed.id!=null ? B().posts.find(x=>x.id===ed.id) : null;
  if(!p || p.kind==="article"){ p={id:Date.now()}; B().posts.push(p); ed.id=p.id; ed.kind=null; }
  const data={text:ed.text,accts:[...ed.accts],custom:{...ed.custom},imgs:[...ed.imgs],parts:ed.parts.map(x=>({...x})),link:ed.link,utm:ed.utm,alt:ed.alt,fmt:{...ed.fmt},notes:ed.notes,err:null};
  Object.assign(p,data,{date:ed.date,time:ed.time,state,listId:null});
  if(state==="published") p.url="https://bsky.app/profile/"+brand+"/post/"+Date.now().toString(36);
  addLog({draft:"存草稿",review:"送審",scheduled:"排程",published:"立即發佈"}[state],p,state==="scheduled"?`${fmt(ed.date)} ${ed.time}`:"");
  openPost(p.id);
  say(state==="draft"?"已存成草稿。":state==="review"?"已送審，審核人會收到通知。":state==="scheduled"?`已排在 ${fmtLong(ed.date)} ${ed.time}。按「回排程日曆」看它在哪。`:"已發出。");
}
function duplicate(){ const p=B().posts.find(x=>x.id===ed.id); const c={...p,id:Date.now(),state:"draft",date:addDays(p.date||TODAY,7),err:null,url:null}; B().posts.push(c); openPost(c.id); say("已複製成下週同一天的草稿。"); }
$("approveBtn").onclick=()=>{ const p=B().posts.find(x=>x.id===ed.id); p.state="scheduled"; addLog("核准",p,`排在 ${fmt(p.date)} ${p.time}`); openPost(p.id); say("已核准，照原定時間發。"); };
$("rejectBtn").onclick=()=>{ const r=$("reason").value.trim(); if(!r) return say("退回要寫理由，編輯才知道要改什麼。", true); const p=B().posts.find(x=>x.id===ed.id); p.state="draft"; p.notes=(p.notes?p.notes+"\n":"")+"退回："+r; addLog("退回",p,r); openPost(p.id); say("已退回成草稿，理由寫在備註。"); };
$("useExcerpt").onclick=()=>{ const p=B().posts.find(x=>x.id===ed.id); ed.text=p.excerpt+"\n\n全文："+p.url; ed.imgs=[4]; refresh(); say("用的是文章本身的摘要和主圖，沒有花錢。"); };
$("useAi").onclick=()=>{ const p=B().posts.find(x=>x.id===ed.id); ed.text="（AI 改寫範例）"+p.excerpt.split("。")[0]+"。想知道為什麼嗎？全文在這裡："+p.url; ed.imgs=[4]; refresh(); say("AI 替每個選的頻道各寫一版，這次大約 NT$2。"); };
function setPv(m){ document.body.classList.toggle("pv", m==="pv"); $("pvSeg").querySelectorAll("button").forEach(x=>x.classList.toggle("on", x.dataset.pv===m)); }
$("pvSeg").querySelectorAll("button").forEach(x=>x.onclick=()=>setPv(x.dataset.pv));

// date + time picker: a month grid and a time grid, in the app's tokens
let dtState=null;
function openDtp(anchor, day, time, pick, withDate){ dtState={day:withDate?(day||TODAY):null, time, month:(day||TODAY).slice(0,7), pick, anchor}; renderDtp(); }
function renderDtp(){ const s=dtState, el=$("dtp"); const [y,m]=s.month.split("-").map(Number); const first=`${s.month}-01`; const dim=new Date(y,m,0).getDate();
  const days = s.day ? `<div class="dcal"><div class="dhd"><button type="button" class="ibtn" data-mn="-1" aria-label="上個月">${I("chevL")}</button><b>${y} 年 ${m} 月</b><button type="button" class="ibtn" data-mn="1" aria-label="下個月">${I("chevR")}</button></div><div class="cal7">${DOW.map(x=>`<span class="muted">${x}</span>`).join("")}${"<span></span>".repeat(dowOf(first))}${[...Array(dim)].map((_,i)=>{ const v=`${s.month}-${String(i+1).padStart(2,"0")}`; return `<button type="button" class="${v===s.day?"on":""} ${v===TODAY?"today":""}" data-day="${v}" ${v<TODAY?"disabled":""}>${i+1}</button>`; }).join("")}</div></div>` : "";
  const [hh,mm]=s.time.split(":");
  const step = (k,n) => `<span class="tstep"><button type="button" class="ibtn" data-${k}="-1" aria-label="${k==="h"?"早一小時":"早五分鐘"}">${I("chevL")}</button><b>${n}</b><button type="button" class="ibtn" data-${k}="1" aria-label="${k==="h"?"晚一小時":"晚五分鐘"}">${I("chevR")}</button></span>`;
  el.innerHTML = `<div class="ttop">${step("h",hh)}<b>:</b>${step("m",mm)}</div><div class="muted tag tzl">${I("clock")}${esc(B().tz)}</div>` + days + `<button type="button" class="btn-primary" id="dtOk">好</button>`;
  el.hidden=false; const r=s.anchor.getBoundingClientRect(); const h=el.offsetHeight;
  el.style.left = Math.max(8, Math.min(r.left, innerWidth-el.offsetWidth-8))+"px"; el.style.top = (r.top-h-8 > 8 ? r.top-h-8 : r.bottom+8)+"px";
  el.querySelectorAll("[data-mn]").forEach(x=>x.onclick=()=>{ const t=new Date(y,m-1+(+x.dataset.mn),1); s.month=iso(t).slice(0,7); renderDtp(); });
  el.querySelectorAll("[data-day]").forEach(x=>x.onclick=()=>{ s.day=x.dataset.day; renderDtp(); });
  el.querySelectorAll("[data-h]").forEach(x=>x.onclick=()=>{ s.time=String((+hh+24+(+x.dataset.h))%24).padStart(2,"0")+":"+mm; renderDtp(); });
  el.querySelectorAll("[data-m]").forEach(x=>x.onclick=()=>{ s.time=hh+":"+String((+mm+60+5*(+x.dataset.m))%60).padStart(2,"0"); renderDtp(); });
  $("dtOk").onclick=()=>{ el.hidden=true; s.pick(s.time, s.day); };
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ for(const id of ["dtp","menu","filterPop","tzPop","samplePop","brandPop","bulkMenu","chanMenu"]) $(id).hidden=true; } });
document.addEventListener("click", e=>{ if(!e.target.closest("#chanMenu,[data-chm]")) $("chanMenu").hidden=true; });

wireIcons(document);
renderTz(); renderBest(); renderFrame(); renderView();
</script>

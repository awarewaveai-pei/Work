# Cognitive OS Phase 1 API -- deployment config, matching this monorepo's own established
# pattern for a standalone auxiliary service on ks-aw-01 (Projects/internal/ziwei-doushu's
# "oracle-web" is the precedent this file follows: own compose project, joins lobster-net
# externally so lobster-nginx can reverse-proxy to it by container name, host port bound to
# 127.0.0.1 only for local health-check use, TLS/public exposure lives entirely in nginx).
#
# Build context is the MONOREPO ROOT (three levels up from this file), not this directory --
# the Dockerfile COPYs both Projects/internal/cognitive-engineering-os/ (the runtime) and
# agency-os/docs/AI_LEGO_Cognitive_Engineering_OS/ (the read-only spec root), which live as
# siblings at the repo root, not nested under this product's own directory.

services:
  cognitive-os-api:
    build:
      context: ../../..
      dockerfile: Projects/internal/cognitive-engineering-os/Dockerfile
      target: runtime   # the Dockerfile's last stage is `test` (Docker's default); never ship that one
    image: cognitive-os-api:latest
    container_name: cognitive-os-api
    restart: unless-stopped
    # Storage is PostgreSQL (docs/platform/STORAGE_SWITCH.md): COGNITIVE_OS_DATABASE_URLS=<region>=postgresql://user:password@cognitive-db:5432/cognitive_os
    # carries a password, so it lives in deploy/.env on the host only (below; install-cognitive-db.sh writes the line, deploy.sh
    # reads the region name from it and exports COGNITIVE_OS_REGION for the files volume at the bottom). Never in this file.
    environment:
      # EC §99 runtime egress allowlist (deny-by-default). Hosts here must also be listed in
      # agency-os/docs/AI_LEGO_Cognitive_Engineering_OS/policies/ai-execution/network-egress.yaml EGRESS-EC99-2
      # (tests/unit/test_egress_allowlist_parity.py). app.aware-wave.com = the Collection Service: egress is
      # https-only and host-only, so the internal http://lobster-next-admin:3000 cannot be allowlisted.
      - COGNITIVE_OS_NETWORK_EGRESS_ALLOWLIST=api.anthropic.com,app.aware-wave.com
      # Where POST /projects/{id}/collections hands a run to next-admin (not secret; its bearer token is in deploy/.env).
      - COGNITIVE_OS_COLLECTION_SERVICE_URL=https://app.aware-wave.com
    # AI gateway credentials: COGNITIVE_OS_ANTHROPIC_API_KEY (and optional COGNITIVE_OS_AI_MODEL) live in
    # deploy/.env on the host only (gitignored; see deploy/.env.example). Absent key => /ai/* answers 503
    # AI_PROVIDER_UNCONFIGURED; every other route is unaffected.
    env_file:
      - path: ./deploy/.env
        required: false
    # The region's file root (D7): Source/artifact/journal CAS and run journals. Rows are in PostgreSQL, files are here; the SQLite
    # volume of before the move (cognitive-os-identity-data) is no longer mounted and is kept untouched as the rollback source.
    volumes:
      - cognitive-os-files:/app/Projects/internal/cognitive-engineering-os/.runtime
    ports:
      - "127.0.0.1:8420:8420" # reserved for local health-check use, matching oracle-web's own :3010 convention
    # 8 API worker processes (Dockerfile COGNITIVE_OS_API_WORKERS) at ~150 MB each, 1.2 GB measured at 1000 people; 512m held one.
    mem_limit: 3g
    mem_reservation: 1g
    networks:
      - lobster-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8420/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Three web replicas behind one name: the Next.js server renders ~66 pages/s per process (capacity rig, ops/load-test, 2026-10-12);
  # 1000 people navigating every ~7 s are ~140 pages/s -- 1 replica: p50 7.9 s, 2: p95 2.6 s, 3: p50 40 ms / p95 230 ms, 0 errors.
  # All three carry the network alias cognitive-os-web-pool, which lobster-nginx's cognitive server block sends page requests to
  # (nginx/default.conf `set $web`): Docker DNS answers with every replica, nginx takes them round-robin. More replicas = copy
  # the cognitive-os-web-3 block with a new name and add it to deploy/deploy.sh SERVICES. cognitive-os-web builds the image,
  # the others run it.
  cognitive-os-web:
    build:
      context: ./apps/cognitive-web
      dockerfile: Dockerfile
    image: cognitive-os-web:latest
    container_name: cognitive-os-web
    ports:
      - "127.0.0.1:8421:3000"
    <<: &cognitive-web
      restart: unless-stopped
      environment:
        - COS_API_ORIGIN=http://cognitive-os-api:8420
      mem_limit: 256m
      mem_reservation: 64m
      networks:
        lobster-net:
          aliases:
            - cognitive-os-web-pool
      depends_on:
        cognitive-os-api:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/login"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 10s

  cognitive-os-web-2:
    image: cognitive-os-web:latest
    container_name: cognitive-os-web-2
    <<: *cognitive-web

  cognitive-os-web-3:
    image: cognitive-os-web:latest
    container_name: cognitive-os-web-3
    <<: *cognitive-web

volumes:
  cognitive-os-files:
    name: cognitive-os-files-${COGNITIVE_OS_REGION:?COGNITIVE_OS_REGION is set by deploy.sh from deploy/.env; export it before any manual docker compose call}

networks:
  lobster-net:
    external: true
    name: lobster-net

id: framing.problem_statement
subject: framing.problem_statement
version: 3
state: draft
minutes: 5
title: 問題陳述：開始前 5 分鐘
text: 問題陳述是用來整理問題的工具。描述現況→預期→落差→影響→限制，建立跨人共同的問題定義。團隊需要先對齊「問題到底是什麼」再吵解法時用。
example: 示範案例：團體反思 session 的主動分享從 6 人掉到 2 人：先把落差寫清楚，不急著找原因。這一期第 6 次 session，8 位參與者只有 2 位主動說自己的作品；第 1 次有 6 位。三期都是從第 4 次開始往下掉。每次 session 至少 5 位主動說自己的作品，第 4 次以後也守得住。第 6 次比期望少 3 位；而且每一期從第 4 次起都在往下掉。
teaches:
- 問題陳述

title: 冰山模型：開始前 5 分鐘
text: 冰山模型是用來整理問題的工具。把一個表面事件逐層往下挖——重複發生的型態、系統性結構、支撐這一切的心智模式，一次一層。想避免只針對單一事件反應，而是找出產生一整類類似事件的深層結構時用。
example: 示範案例：團體反思 session 的主動分享從 6 人掉到 2 人，換了帶領者也一樣：從這件事一路挖到帶領者團隊沒說出口的假設。這一期第 6 次 session，8 位參與者只有 2 位主動說自己的作品；第 1 次是 6 位。帶領者團隊默認「參與者需要專家幫他們看見意義」；訓練教的是「怎麼解讀作品」，不是「怎麼讓人自己看見」。三期以來，每期都從第
  4 次 session 開始主動分享人數下降；帶領者先解讀作品的那幾次掉得最多；線上場更低。
teaches:
- 冰山模型

[project]
name = "cognitive-engineering-os"
version = "0.5.0"
description = "AI-LEGO Cognitive Engineering OS runtime -- Phase 5 Research Mode vertical slice (synthetic data only)"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
  "referencing>=0.30",
  "cryptography>=42.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  # artifact.generate_chart (ai_lego/modules/representation/chart_render.py) -- Agg backend,
  # headless rendering only. Operator consent for this new dependency: 2026-09-18.
  "matplotlib>=3.9",
]

[project.optional-dependencies]
# Real local speech-to-text path (Windows SAPI speech + cached faster-whisper Medium).
# Never downloads a model; see ai_lego/modules/knowledge/ingest/transcription.py.
offline-stt = ["faster-whisper>=1.0"]
# Test-only: FastAPI TestClient needs httpx; pytest itself must be listed too -- deploy.sh's
# .deploy-venv bootstrap installs exactly this extra and nothing else, so omitting pytest here
# left every fresh bootstrap unable to run its own test-gate step (critic finding, 2026-09-18).
test = ["httpx>=0.27", "pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["ai_lego*"]

[tool.setuptools.package-data]
# The dashboard page ships inside the package (ai_lego/apps/api/main.py reads it next to itself).
"ai_lego.apps.api" = ["dashboard.html"]

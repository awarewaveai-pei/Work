[project]
name = "cognitive-engineering-os"
version = "0.5.0"
description = "AI-LEGO Cognitive Engineering OS runtime -- Phase 5 Research Mode vertical slice (synthetic data only)"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
  "referencing>=0.30",
  "cryptography>=42.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  # artifact.generate_chart (ai_lego/modules/representation/chart_render.py) -- Agg backend,
  # headless rendering only. Operator consent for this new dependency: 2026-09-18.
  "matplotlib>=3.9",
]

[project.optional-dependencies]
# Real local speech-to-text path (Windows SAPI speech + cached faster-whisper Medium).
# Never downloads a model; see ai_lego/modules/knowledge/ingest/transcription.py.
offline-stt = ["faster-whisper>=1.0"]
# Test-only: FastAPI TestClient needs httpx; pytest for local targeted runs. Pinned into
# requirements-test.lock (scripts/lock-deps.sh), which the Dockerfile `test` target installs.
test = ["httpx>=0.27", "pytest>=8.0"]

# The ranges above are inputs; what actually installs is requirements.lock / requirements-test.lock
# (scripts/lock-deps.sh resolves them inside the Dockerfile's pinned base). Bump a range here, rerun
# the script, commit both. The build backend is pinned too so an image build downloads nothing unpinned.
[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_lego*"]

[tool.setuptools.package-data]
# The dashboard page ships inside the package (ai_lego/apps/api/main.py reads it next to itself).
"ai_lego.apps.api" = ["dashboard.html"]

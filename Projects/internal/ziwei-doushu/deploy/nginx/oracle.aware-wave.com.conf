# oracle.aware-wave.com — nginx 反向代理 vhost
#
# 放置:SG /etc/nginx/sites-available/oracle.aware-wave.com.conf
#       並 ln -s 到 sites-enabled/,然後 nginx -t && systemctl reload nginx
# TLS:首次用 certbot --nginx -d oracle.aware-wave.com 自動補 443 + 轉址。
#
# 反代到 docker-compose 綁的 127.0.0.1:3010(容器內 3000)。

server {
    listen 80;
    listen [::]:80;
    server_name oracle.aware-wave.com;

    # certbot 簽發後會自動補 443 server 區塊與 80→443 轉址。

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# Oracle(東西方命理站)— SG 部署設定
#
# 用途:在 SG 伺服器(5.223.93.113)以容器跑 Next.js standalone,nginx 反代到
#   oracle.aware-wave.com。容器只綁 127.0.0.1,不對外開埠;對外一律走 nginx + TLS。
# ⚠️ SG 是共用 4GB 機(跑 WordPress 等),故設 mem_limit 防 OOM(見 OOM runbook)。
# 之後遷 EU 機:同一份 compose 換主機即可(host-agnostic)。
#
# 網路說明:加入 lobster-net(external)讓 lobster-nginx 可用 oracle-web:3000 反代。
#   host port 3010 保留供本機 health-check 使用。

services:
  oracle-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: oracle-web:latest
    container_name: oracle-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=https://oracle.aware-wave.com
    # 憑證到位後在此用 env_file 注入(禁硬編):
    #   OPENAI_API_KEY / STRIPE_SECRET_KEY / ECPAY_* / PAYPAL_* / SUPABASE_* / ASTROLOGY_API_KEY
    # env_file:
    #   - .env.production
    ports:
      - "127.0.0.1:3010:3000" # 保留供本機 health-check
    mem_limit: 768m
    mem_reservation: 256m
    networks:
      - lobster-net
    healthcheck:
      test: ["CMD", "timeout", "4", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    memswap_limit: 768m
    pids_limit: 512
    init: true

networks:
  lobster-net:
    external: true
    name: lobster-net

<script id="d" type="application/json">[{"key": "script-forge", "label": "劇本工坊", "input": "主題「職場倦怠的 5 個警訊」，Instagram Reels，產一份完整腳本", "runs": [{"model": "Claude Opus 5.5", "cur": true, "sec": 33, "ntd": 1.93, "sub": true, "fmt": "1/1；6 scenes", "ok": true, "text": "{\"title\":\"職場倦怠的5個警訊：你不是懶，是燒乾了\",\"hook\":\"如果你每天上班前都要在車上坐五分鐘才肯進公司，你可能不是懶，是倦怠了。\",\"core_idea\":\"倦怠不是意志力不足，而是長期壓力造成的身心耗竭。用5個具體、日常、一聽就有共鳴的警訊，讓觀眾自我檢測，建立專業可信的形象，再用追蹤承接後續的修復內容。\",\"scenes\":[{\"time\":\"0-8s\",\"visual\":\"清晨地下停車場，一名穿襯衫的上班族坐在駕駛座，雙手握方向盤、盯著前方發呆，儀表板時鐘顯示 08:57，車窗外是公司電梯入口的冷白燈光，畫面偏冷色調。\",\"dialogue\":\"如果你每天上班前，都要在車上坐五分鐘才肯進公司，你可能不是懶，是倦怠了。\",\"subtitle\":\"你不是懶，是倦怠了\",\"shoot_tip\":\"從副駕駛側拍半身側臉，保留時鐘入鏡，演員眼神放空、不眨眼約兩秒。\",\"edit_tip\":\"第一秒直接上字幕，配低頻心跳音效，最後半秒快速推近臉部。\",\"visual_type\":\"custom\",\"broll_keyword\":\"\"},{\"time\":\"8-20s\",\"visual\":\"週日夜晚，客廳只開一盞落地燈，有人躺在沙發上滑手機，畫面切到手機行事曆顯示「週一 09:00 例會」，接著特寫腳在沙發上不安地晃動。\",\"dialogue\":\"第一個警訊，週日晚上就開始焦慮，連休假都放鬆不了。第二個，一點小事就讓你很煩躁，同事多問一句，你都想翻白眼。\",\"subtitle\":\"週日晚上就開始焦慮\",\"shoot_tip\":\"使用暖黃單一光源營造壓迫感，手機畫面另外補拍特寫。\",\"edit_tip\":\"講到第二個警訊時切入同事敲桌、訊息提示音的快剪，畫面左上角加上「01」「02」編號。\",\"visual_type\":\"broll\",\"broll_keyword\":\"sunday night anxiety\"},{\"time\":\"20-32s\",\"visual\":\"辦公桌上的螢幕顯示「專案完成 ✓」，桌邊同事們正在鼓掌，主角坐在座位上面無表情地合上筆電，周圍的歡呼聲像被隔了一層玻璃般模糊。\",\"dialogue\":\"第三個，事情明明做完了，卻一點成就感都沒有。以前會開心的事，現在只剩下總算結束了的感覺。\",\"subtitle\":\"做完了卻沒有成就感\",\"shoot_tip\":\"淺景深拍攝，焦點鎖在主角，背景鼓掌的同事保持虛化。\",\"edit_tip\":\"環境音做低通濾波，營造悶住的聽感，並在角落加上編號「03」。\",\"visual_type\":\"custom\",\"broll_keyword\":\"\"},{\"time\":\"32-42s\",\"visual\":\"早晨鬧鐘響起，一隻手按掉鬧鐘後整個人又縮回被子裡。下一個鏡頭是午後辦公室，有人揉著眼睛、撐著頭盯著螢幕。\",\"dialogue\":\"第四個，睡再久還是很累。這種累不是身體的累，是休息也補不回來的那種。\",\"subtitle\":\"睡再久還是很累\",\"shoot_tip\":\"鬧鐘畫面用俯拍，辦公室畫面用側拍，兩段的光線色溫要有明顯對比。\",\"edit_tip\":\"兩個畫面用溶接轉場，暗示這種疲倦會延續一整天，並加上編號「04」。\",\"visual_type\":\"broll\",\"broll_keyword\":\"tired office worker\"},{\"time\":\"42-52s\",\"visual\":\"主角面對螢幕，聊天視窗不斷跳出主管與同事的訊息，他只是淡淡地按下已讀，表情毫無波動。畫面色彩逐漸褪成灰階。\",\"dialogue\":\"第五個，也是最危險的，你開始對工作變得冷漠，覺得做好做壞都無所謂。這代表你的能量已經快見底了。\",\"subtitle\":\"開始對工作冷漠\",\"shoot_tip\":\"正面中景搭配固定鏡位，演員保持零表情，讓訊息在畫面中持續堆疊。\",\"edit_tip\":\"使用色彩飽和度漸降的特效，講到「快見底」時加入電量條歸零的動畫，並標上編號「05」。\",\"visual_type\":\"custom\",\"broll_keyword\":\"\"},{\"time\":\"52-60s\",\"visual\":\"傍晚的城市街道，人們下班走在路上，夕陽灑落，一個人停下腳步深呼吸後抬頭看向天空，畫面恢復暖色調。\",\"dialogue\":\"中了三個以上，請好好正視它。追蹤我，下一集教你怎麼一步步把自己找回來。\",\"subtitle\":\"追蹤，下次教你修復\",\"shoot_tip\":\"在黃金時段以逆光拍攝，人物抬頭的動作要放慢。\",\"edit_tip\":\"色彩回暖，象徵希望，最後兩秒疊上追蹤按鈕動畫與五個警訊的清單總覽。\",\"visual_type\":\"broll\",\"broll_keyword\":\"sunset city walk\"}],\"cta\":\"中了三個以上別硬撐，追蹤我，下一集教你從倦怠中一步步恢復。\",\"alt_hooks\":[\"你是不是已經很久沒有真心期待過星期一了？\",\"比過勞更可怕的是，你根本沒發現自己已經倦怠了。\",\"這五個訊號中了三個，你的身心就在求救了。\"],\"titles\":[\"職場倦怠的5個警訊，你中了幾個？\",\"你不是懶，是倦怠了\",\"週日晚上就焦慮？小心是倦怠\",\"上班族必看：倦怠自我檢測\",\"別等燒乾才發現：5個倦怠信號\"],\"hashtags\":[\"#職場倦怠\",\"#上班族日常\",\"#心理健康\",\"#職場心理\",\"#自我覺察\"],\"shoot_checklist\":[\"準備停車場、客廳、辦公室、臥室、街景五種場景，並統一主角的服裝\",\"備妥手機行事曆與聊天視窗的螢幕畫面素材\",\"前四段採冷色調，結尾採暖色調，可預先在相機設定白平衡\"],\"edit_notes\":\"整體節奏前快後穩。每個警訊都以左上角的數字編號強化記憶點，字幕放在畫面中下方的安全區，避開 IG Reels 右側按鈕與底部文字區。配樂以低沉的鋼琴開場，在52秒處轉為溫暖的旋律。結尾的總覽清單可停留約1.5秒，方便觀眾截圖收藏，藉此提升存檔率。\"}"}, {"model": "GPT-6.2 sol", "cur": false, "sec": 30, "ntd": 0.7, "sub": false, "fmt": "1/1；6 scenes", "ok": true, "text": "{\n  \"title\": \"職場倦怠的5個警訊：不是休一天就沒事\",\n  \"hook\": \"明明放了兩天假，一想到上班，還是覺得累？先別怪自己不夠努力。\",\n  \"core_idea\": \"用五個熟悉的上班情境，幫觀眾辨認值得留意的變化。重點不是某天特別累，而是這些狀況反覆出現，開始影響工作或生活。\",\n  \"scenes\": [\n    {\n      \"time\": \"00:00–00:07\",\n      \"visual\": \"週一清晨，手機鬧鐘震動。上班族坐在床沿，伸手按掉鬧鐘後停了兩秒，才慢慢站起身。\",\n      \"dialogue\": \"明明放了兩天假，一想到上班，還是覺得累？先別怪自己不夠努力。\",\n      \"subtitle\": \"放假也充不回電？\",\n      \"shoot_tip\": \"找直式近景，手機和手放在畫面中央偏上，避開可辨識的品牌標誌。\",\n      \"edit_tip\": \"第一格就讓手機震動，鬧鐘聲在旁白開口時淡出。\",\n      \"visual_type\": \"broll\",\n      \"broll_keyword\": \"morning alarm\"\n    },\n    {\n      \"time\": \"00:07–00:16\",\n      \"visual\": \"同一名上班族回家後坐在沙發上，外套還沒脫；用同角度切到隔天早上，他換了衣服，卻依然坐在原位發呆。\",\n      \"dialogue\": \"第一，休息了還是累。不是昨晚剛好沒睡好，而是連著好幾天，睡醒也沒覺得有恢復。\",\n      \"subtitle\": \"一、休息也不解累\",\n      \"shoot_tip\": \"生成兩張構圖一致的直式圖，固定人物臉型、沙發和坐姿，只改衣著與窗光。\",\n      \"edit_tip\": \"說到「睡醒」時，從暖色夜景切到冷色晨光。\",\n      \"visual_type\": \"custom\",\n      \"broll_keyword\": \"\"\n    },\n    {\n      \"time\": \"00:16–00:25\",\n      \"visual\": \"週日晚上，上班族在沙發上滑到手機行事曆，看到隔天的會議排程後，手指停在半空。\",\n      \"dialogue\": \"第二，還沒上班就開始緊繃。週日晚上本來很放鬆，一想到明天要開會，心情就沉下來。\",\n      \"subtitle\": \"二、想到上班就緊繃\",\n      \"shoot_tip\": \"找手部和手機同框的素材；用後製疊加簡化行事曆，不露出真實行程。\",\n      \"edit_tip\": \"念到「明天要開會」時短切行事曆，再回到停住的手指。\",\n      \"visual_type\": \"broll\",\n      \"broll_keyword\": \"phone calendar\"\n    },\n    {\n      \"time\": \"00:25–00:34\",\n      \"visual\": \"辦公桌前，同事伸手指向筆電，主角仍看著螢幕，手停在滑鼠上，沒有轉頭參與討論。\",\n      \"dialogue\": \"第三，你開始對工作沒感覺。以前還會主動出點子，現在只想把事情交出去，別再來找我。\",\n      \"subtitle\": \"三、對工作越來越冷淡\",\n      \"shoot_tip\": \"用與沙發場景相同的人物參考圖；同事只露出手和肩膀，主角表情保持自然。\",\n      \"edit_tip\": \"從同事指向螢幕的手，慢慢推近主角的側臉，不加誇張音效。\",\n      \"visual_type\": \"custom\",\n      \"broll_keyword\": \"\"\n    },\n    {\n      \"time\": \"00:34–00:44\",\n      \"visual\": \"下班後的餐桌上，家人把水杯推過來，主角原本要開口，卻停住，先移開視線。\",\n      \"dialogue\": \"第四，耐心變短了。下班後，家人只是問你晚餐想吃什麼，你就差點回一句：不要再問我了。\",\n      \"subtitle\": \"四、小事也容易煩\",\n      \"shoot_tip\": \"找餐桌側拍或手部近景，選動作自然的片段，不用爭吵或摔物畫面。\",\n      \"edit_tip\": \"在「晚餐想吃什麼」之後留一小拍，再切到主角移開視線。\",\n      \"visual_type\": \"broll\",\n      \"broll_keyword\": \"tense dinner\"\n    },\n    {\n      \"time\": \"00:44–01:00\",\n      \"visual\": \"主角盯著一封沒寫完的郵件，手停在鍵盤上。畫面切到主角把椅子往後挪、拿起水杯，最後在右側留白放上追蹤提示。\",\n      \"dialogue\": \"第五，熟悉的工作也做得很吃力。以前幾分鐘就能回的信，現在坐了半天還沒寫完。這些不等於診斷。如果反覆出現，影響生活，可以找專業人員聊聊。想知道怎麼開口求助？追蹤我。\",\n      \"subtitle\": \"五、熟悉的工作也吃力\",\n      \"shoot_tip\": \"生成鍵盤近景與桌邊中景各一張，沿用同一人物和座位；郵件介面用後製補上，不顯示個資。\",\n      \"edit_tip\": \"前半段用鍵盤和游標帶出卡住的感覺，最後兩秒將重點字幕換成「追蹤我，練習開口」；不疊兩層文字。\",\n      \"visual_type\": \"custom\",\n      \"broll_keyword\": \"\"\n    }\n  ],\n  \"cta\": \"想知道怎麼開口求助？追蹤我。\",\n  \"alt_hooks\": [\n    \"以前五分鐘就能回的信，現在半天寫不出一句？這個變化值得留意。\",\n    \"如果週日晚上比週一早上還難熬，先看看這五個警訊。\",\n    \"工作沒變多，你卻愈來愈提不起勁？先別急著說自己懶。\"\n  ],\n  \"titles\": [\n    \"職場倦怠的5個警訊：不是休一天就沒事\",\n    \"一想到上班就累？留意這5個變化\",\n    \"下班還是很煩？你可能忽略了這些警訊\",\n    \"以前很順手，現在好吃力：讀懂職場倦怠\",\n    \"從週日焦慮到上班提不起勁：5個倦怠警訊\"\n  ],\n  \"hashtags\": [\n    \"#職場倦怠\",\n    \"#職場心理\",\n    \"#工作壓力\",\n    \"#心理健康\",\n    \"#上班族日常\"\n  ],\n  \"shoot_checklist\": [\n    \"準備三組直式素材：清晨鬧鐘、手機行事曆、下班餐桌，確認授權可用於社群發布。\",\n    \"先建立主角參考圖，再生成沙發、辦公桌與郵件場景；鎖定臉型、髮型及辦公桌陳設。\",\n    \"輸出前試聽整支旁白，確認五個序號清楚、最後一句完整落在60秒內；檢查文字避開介面按鈕。\"\n  ],\n  \"edit_notes\": \"以9:16直式輸出。每個警訊用一致的編號樣式，讓靜音觀看也能跟上；配樂維持低音量，別用警報音製造焦慮。腳本自評：9/10。生活情境好辨認，追蹤理由具體；末段同時要交代第五點、非診斷提醒和行動呼籲，成片前須先試聽，避免語速過快。\"\n}"}]}, {"key": "video-script", "label": "影片腳本", "input": "把盲測選出的那篇文章改成 6 個場景的影片腳本", "runs": [{"model": "Claude Opus 5.5", "cur": true, "sec": 11, "ntd": 1.44, "sub": true, "fmt": "3/3；6 scenes", "ok": true, "text": "{\"title\":\"職場倦怠5大警訊：別等撐不住才發現\",\"description\":\"總覺得上班沒力、下班還掛心工作群組？這支影片帶你認識職場倦怠的5個關鍵警訊，教你用一週簡短紀錄做自我檢測，學會和主管談工作界線與急件規則。看變化、不看分數，先挑一件事開始調整，必要時也別忘了尋求專業協助。\",\"scenes\":[{\"id\":1,\"narration\":\"你是不是一打開熟悉的檔案，就覺得好難開始？其實，倦怠不只是某天特別累。是同樣的工作一再耗光你，休息完也回不來。\",\"image_prompt\":\"Tired office worker staring at laptop screen, cluttered desk in dim open office, cold blue monitor glow\",\"broll_keyword\":\"tired office worker\",\"visual\":\"broll\"},{\"id\":2,\"narration\":\"先看前三個警訊。精力耗盡、對工作越來越疏離，還有明明做很多，卻總覺得自己做不好。這三項，就是倦怠的核心特徵。\",\"image_prompt\":\"Woman sitting silently in meeting room, colleagues blurred around table, muted gray daylight through windows\",\"broll_keyword\":\"office meeting\",\"visual\":\"custom\"},{\"id\":3,\"narration\":\"再來兩個線索。下班了，心還掛在工作群組。壓力開始擠掉睡眠，連想做的事都一再取消。這些，都值得記下來。\",\"image_prompt\":\"Man in bed checking glowing phone at night, dark bedroom, cold phone light on face\",\"broll_keyword\":\"phone night bed\",\"visual\":\"broll\"},{\"id\":4,\"narration\":\"怎麼自我檢測？做一週紀錄就好。每天一行，寫下哪件事最耗力，休息後有沒有恢復。這不是考試，也沒有及格線。\",\"image_prompt\":\"Hand writing in notebook beside coffee cup, wooden table near window, warm morning sunlight\",\"broll_keyword\":\"writing journal\",\"visual\":\"custom\"},{\"id\":5,\"narration\":\"跟主管談，別只說我好累。試試這樣問：如果簡報今天要交，報表可以改到明早嗎？把取捨交給對方決定。\",\"image_prompt\":\"Employee talking with manager across desk, bright modern office, soft natural afternoon light\",\"broll_keyword\":\"business conversation\",\"visual\":\"broll\"},{\"id\":6,\"narration\":\"如果不適一直持續，影響到生活，別等紀錄做完，直接找專業協助。需要的話，打安心專線1925。你不用一個人撐著。\",\"image_prompt\":\"Friend comforting person on park bench, green trees in city park, warm golden hour light\",\"broll_keyword\":\"comforting friend\",\"visual\":\"custom\"}]}"}, {"model": "GPT-6.2 sol", "cur": false, "sec": 12, "ntd": 0.56, "sub": false, "fmt": "3/3；6 scenes", "ok": true, "text": "{\n  \"title\": \"職場倦怠的5個警訊：用一週觀察找出該調整的事\",\n  \"description\": \"上班提不起勁，下班又一直看工作訊息？帶你認識職場倦怠的五個警訊，用一週紀錄觀察工作壓力和休息後的變化，找出能和主管談的工作界線，也了解什麼時候該尋求專業協助。\",\n  \"scenes\": [\n    {\n      \"id\": 1,\n      \"narration\": \"偶爾加班累，不一定是職場倦怠。長期工作壓力沒處理好，才可能出現這種職業現象。第一個警訊：還沒開工，就覺得沒力。\",\n      \"image_prompt\": \"Cinematic 16:9, worker rubs their eyes before opening a laptop, office desk beside tall windows, pale morning light.\",\n      \"broll_keyword\": \"tired office worker\",\n      \"visual\": \"broll\"\n    },\n    {\n      \"id\": 2,\n      \"narration\": \"第二個，原本想參與的會議，現在只想快點散會。第三個，明明有交出成果，卻一直覺得自己做不好。感覺和成果，分開看。\",\n      \"image_prompt\": \"Cinematic 16:9, worker looks down at a marked-up report while coworkers talk, glass meeting room, cool overhead light.\",\n      \"broll_keyword\": \"office meeting\",\n      \"visual\": \"custom\"\n    },\n    {\n      \"id\": 3,\n      \"narration\": \"第四個，都下班了，吃飯還一直刷工作群組。第五個，晚上常睡不著，原本想做的事也一再取消。這兩項是線索，不是診斷標準。\",\n      \"image_prompt\": \"Cinematic 16:9, diner scrolls on a phone beside an untouched bowl, apartment kitchen at night, warm pendant light.\",\n      \"broll_keyword\": \"phone at dinner\",\n      \"visual\": \"broll\"\n    },\n    {\n      \"id\": 4,\n      \"narration\": \"別算自己中了幾項。先記一週，每天一行：哪件事最耗力？休息後有沒有好一點？再找一天比較輕鬆的，看看工作安排有什麼不同。\",\n      \"image_prompt\": \"Cinematic 16:9, hand writes a short note in a weekly planner, wooden desk beside a coffee mug, soft window light.\",\n      \"broll_keyword\": \"writing in planner\",\n      \"visual\": \"broll\"\n    },\n    {\n      \"id\": 5,\n      \"narration\": \"挑一件最常打斷休息的事，跟主管談。你可以問：簡報今天先交，那報表能改明早嗎？也可以約好，晚上的非急件隔天再回。\",\n      \"image_prompt\": \"Cinematic 16:9, employee points to two deadlines on a desk calendar while a manager leans in, small meeting room, afternoon sunlight.\",\n      \"broll_keyword\": \"manager discussion\",\n      \"visual\": \"custom\"\n    },\n    {\n      \"id\": 6,\n      \"narration\": \"如果不舒服一直沒好，或已經影響睡眠、吃飯和日常，就找醫療或心理專業人員聊聊。不用等記滿一週，也不用先確定是不是倦怠。\",\n      \"image_prompt\": \"Cinematic 16:9, visitor opens a notebook while a clinician listens, consultation room with two chairs, soft daylight through blinds.\",\n      \"broll_keyword\": \"therapy session\",\n      \"visual\": \"broll\"\n    }\n  ]\n}"}]}, {"key": "product-copy", "label": "POD 商品文案", "input": "一件 T 恤，設計是「水彩風格的山與月亮，寫著 breathe」", "runs": [{"model": "Claude Opus 5.5", "cur": true, "sec": 35, "ntd": 2.64, "sub": true, "fmt": "1/1；RankMath 80", "ok": true, "text": "{\"productTitle\":\"水彩山月亮T恤｜Breathe 呼吸字樣 中性短袖上衣 Soulful Expression\",\"focusKeyword\":\"水彩山月亮T恤\",\"metaTitle\":\"水彩山月亮T恤｜Breathe 呼吸字樣短袖｜Soulful Expression\",\"metaDescription\":\"這款水彩山月亮T恤以細膩柔和的水彩描繪層疊山巒與一輪明月，搭配手寫感 breathe 字樣，提醒自己放慢步調、好好感受當下。中性剪裁、柔軟舒適，適合週末出遊、旅行或送禮，讓這片安靜的山月風景陪你走過每一個日常。立即選購，挑選最適合你的尺寸與顏色吧！\",\"shortDescriptionHtml\":\"<p>Soulful Expression 水彩山月亮T恤，以柔和的水彩暈染描繪層疊山巒與一輪明月，並搭配手寫風格的英文字樣「breathe」，提醒自己深呼吸、放慢腳步。採用數位直噴（DTG）印刷、中性版型設計，是一件適合日常與旅行穿搭、也很適合送給喜愛山林與月夜朋友的短袖T恤。<\/p><ul><li><strong>設計：<\/strong>水彩山月亮T恤的圖案包含層疊山巒、一輪明月與手寫 breathe 字樣，以柔和水彩暈染呈現寧靜氛圍。<\/li><li><strong>印刷方式：<\/strong>本款採用數位直噴（DTG）印刷，墨水直接印入布料纖維，圖案手感柔軟、不厚重。<\/li><li><strong>版型：<\/strong>中性（unisex）剪裁，男女皆可穿著，下單前建議參考尺寸表選擇合適尺寸。<\/li><li><strong>面料：<\/strong>柔軟親膚的棉質短袖，適合日常通勤、旅行與輕鬆的戶外活動。<\/li><li><strong>保養：<\/strong>建議翻面以冷水洗滌，低溫烘乾或自然晾乾，請勿直接熨燙圖案。<\/li><li><strong>按需印製：<\ 本留給自己的時間也被工作佔走。觀察自己的目的，是分清楚：哪些事情該減量、哪些回覆規則需要講清楚，還有哪些不舒服不該再自己硬撐。就算只發現一項，也可以先動手調整。\n\n- **看變化，不看分數：**拿現在的自己和平常的自己比，會比和同事比更有用。\n- **記下工作狀況：**「下班後又改了兩版簡報」比「今天抗壓性很差」更能說明問題出在哪。\n- **新任務進來，就要有取捨：**有新的急件時，請主管確認哪一項原本的工作可以往後延。\n- **把「緊急例外」講清楚：**事先說好誰可以聯絡你、用什麼方式聯絡，還有什麼情況才需要當晚處理。\n- **別把所有不舒服都怪到工作頭上：**如果連放假、在家或跟朋友相處時，都很難維持正常生活，可以直接找專業人員評估。\n\n## 職場倦怠有哪些常見警訊？\n\n工作倦怠可以從三個方向來看：做事時是不是比以前更容易累垮、對工作是不是越來越冷淡，還有是不是越來越覺得自己做不好。另外，如果下班後腦中還一直轉著公事，或睡眠、日常生活開始受影響，也值得記下來。重點是看這些變化從什麼時候開始、在什麼樣的工作狀況下反覆出現，而不是把這五項當成考試題目來打勾。\n\n### 警訊一：還沒開始工作，就覺得沒力\n\n精力被掏空，不一定只發生在加班那天。它也可能是：每次打開早就做熟的工作檔案，都比以前更難開始。你可以比比看兩種日子：一種是任務一直被插隊打斷，另一種是有完整的時間把事情做完。如果兩種日子差很多，先把工作安排記下來就好，不用急著說自己「變懶了」。\n\n### 警訊二：對工作越來越冷淡\n\n對工作變冷淡，可能是以前願意參與的討論，現在只希望趕快結束。不過，話變少不一定就是倦怠，也可能是會議老是做不出決定，或意見一直被推翻。觀察的時候可以問問自己：是所有工作都讓我想逃，還是只有某些互動讓我特別想躲開？\n\n### 警訊三：做了很多，卻覺得自己什麼都做不好\n\n「工作效能感」下降，是指你越來越不相信自己能把工作做好，但這不代表你的表現真的變差了。建議把「實際完成了什麼」和「自己的感覺」分開記。如果成果一直都有達標，卻因為需求一改再改，讓你覺得怎麼做都不對，那麼先把驗收標準談清楚，可能比再多檢查一遍更有用。\n\n如果想更了解「被掏空」、「變冷淡」和「工作效能感」三者的差別，可以看看[Hami書城：什麼是職業倦怠？](https://blog.hamibook.com.tw/%E6%9B%B8%E6%91%98%E7%B2%BE%E9%81%B8/%E4%BB%80%E9%BA%BC%E6%98%AF%E8%81%B7%E6%A5%AD%E5%80%A6%E6%80%A0%EF%BC%9F/?p=316140)（年份未核）。\n\n### 警訊四：下班後人離開了，心還留在工作群組\n\n下班後偶爾想到公事很正常。真正要注意的是，你是不是因為怕漏掉訊息，一直反覆打斷"}, {"model": "GPT-6.2 sol", "cur": false, "sec": 16, "ntd": 0.52, "sub": false, "fmt": null, "ok": null, "text": "# 職場倦怠的 5 個警訊與實用自我檢測\n## 快速解答\n\n長期的工作壓力沒有得到妥善處理，就可能出現職場倦怠。常見警訊包括精力耗盡、對工作越來越疏離、覺得自己做不好、下班後還在掛心公事，以及壓力開始影響睡眠或日常生活。與其數自己中了幾項，不如花一週記下哪些工作特別耗力、下班後能不能恢復精神，再挑一條能和主管或同事商量的界線，例如晚上的非急件留到隔天再處理。\n\n世界衛生組織（2019）將職場倦怠列為職業現象，而不是疾病。前三項是核心特徵，後兩項只是觀察線索，不能用來判定是否有職場倦怠。想了解不同用語，可以參考[維基百科：職業倦怠](https://zh.wikipedia.org/zh-tw/%E8%81%B7%E6%A5%AD%E5%80%A6%E6%80%A0)（無固定出版年）。\n\n本文供學習和自我觀察，不能取代醫療、心理治療或其他專業照護。如果不舒服的狀況一直沒改善，或已經影響生活，不用等記完一週才求助。\n\n## 重點整理\n\n真正值得留意的，不是偶爾有一天特別累，而是同一類工作一再讓你累到沒力，休息了也很難恢復，連原本留給自己的時間都被公事占用。記下這些變化，可以幫你看出哪些工作該減量、哪些回覆規則該談清楚，以及哪些不適不必再自己硬撐。就算只發現一項，也可以先做調整。\n\n- **看變化，不看分數：**跟自己平常的狀態比，比跟同事比更有用。\n- **記下當時的工作情況：**「下班後改了兩版簡報」比「我今天抗壓性很差」更能說清楚發生了什麼。\n- **有新急件，就重新排順序：**請主管確認哪些原本排好的工作可以延後。\n- **說清楚哪些急件是例外：**先約好誰可以在下班後聯絡你、用哪個管道，以及什麼情況需要當晚處理。\n- **別把所有不適都歸咎於工作：**如果休假時、在家裡或和朋友相處時，也很難維持平常的生活，可以直接找專業人員評估。\n\n## 職場倦怠有哪些常見警訊？\n\n觀察職場倦怠時，可以先問自己三個問題：做事是不是比以前容易累？是不是越來越不想投入工作？是不是越來越覺得自己做不好？如果下班後還反覆想著公事，或睡眠和日常生活也受到影響，也可以一起記下來。重點不是把五項當成測驗題，而是看看這些變化從什麼時候開始，又在哪些工作情況下反覆出現。\n\n### 警訊一：還沒開始工作，就覺得沒力\n\n精力耗盡不一定只發生在加班那天。有時，你只是打開一個熟悉的工作檔案，就發現自己比平常更難開始。試著比較兩種日子：一種是臨時任務一件接一件，另一種是有一段不被打擾的時間把事情做完。如果兩種日子的感受差很多，先記下工作是怎麼安排的，別急著認定自己「變懶了」。\n\n### 警訊二：對工作越來越疏離\n\n以前願意參與的討論，現在只想趕快開完，這可能是你對工作越來越疏離的表現。不過，在會議上話變少，不一定就是倦怠。也可能是開了會卻沒人做決定，或是意見提了又被推翻。你可以問自己：是每件工作都讓我想抽離，還是只有某一類互動讓我特別想避開？\n\n### 警訊三：做了很多，卻覺得自己什麼都做不好\n\n工作效能感下降，意思是你越來越不相信自己能把工作做好，但不代表表現真的變差。可以把「我完成了什麼」和「我對成果有什麼感覺」分開記。如果成果一直達標，只是要求改了好幾次，讓你覺得怎麼做都不對，那麼先問清楚「做到什麼程度才算完成」，可能比再檢查一遍更有用。\n\n想多了解精力耗盡、對工作疏離，以及工作效能感下降有什麼不同，可以參考[Hami書城：什麼是職業倦怠？](https://blog.hamibook.com.tw/%E6%9B%B8%E6%91%98%E7%B2%BE%E9%81%B8/%E4%BB%80%E9%BA%BC%E6%98%AF%E8%81%B7%E6%A5%AD%E5%80%A6%E6%80%A0%EF%BC%9F/?p=316140)（年份未確認）。\n\n### 警訊四：人下班了，心還留在工作群組裡\n\n下班後偶爾想起公事很正常。值得留意的是，你會不會因為怕漏掉訊息，一再停下手邊的事去看工作群組。"}]}, {"key": "market-analysis", "label": "競業與痛點分析", "input": "關鍵字「職場倦怠」", "runs": [{"model": "Claude Opus 5.5", "cur": true, "sec": 16, "ntd": 0.78, "sub": true, "fmt": "1/1；competitors:7 painPoints:7 searchIntent:7 objections:6 differentiators:7", "ok": true, "text": "{\"competitors\":[\"天下雜誌、商業周刊、經理人月刊（Cheers快樂工作人）等商業媒體專題\",\"104人力銀行、1111人力銀行、Yourator職場文章與倦怠測驗\",\"康健雜誌、Heho健康、華人健康網等醫療健康媒體\",\"衛福部心理健康司、勞動部職安署職業倦怠量表（CBI）\",\"Hello Meeting、松德院區、身心科診所與心理諮商所衛教文章\",\"Vocus方格子、Medium個人職涯部落客與心理師專欄\",\"Podcast與YouTube職涯頻道（如股癌外的職涯類節目、志祺七七）\"],\"painPoints\":[\"每天上班前焦慮、提不起勁，卻分不清是倦怠、憂鬱還是只是累\",\"休假也無法恢復精力，擔心自己身心出問題\",\"想離職又怕經濟壓力、年資歸零與找不到下一份工作\",\"被主管與同事期待持續高效，不敢說出疲憊、怕被貼標籤\",\"工作量過大、責任不清，努力卻得不到認可與成就感\",\"網路建議多是空泛的「好好休息、培養興趣」，缺乏可執行步驟\",\"不確定何時該看身心科或心理諮商，也擔心費用與隱私\"],\"searchIntent\":[\"資訊型：了解職場倦怠的定義、症狀與成因（WHO定義）\",\"自我檢測：搜尋職業倦怠量表、線上測驗判斷嚴重程度\",\"How-to：尋找具體的自我調適、恢復與預防方法\",\"決策型：評估該留任、請假、轉職或離職的判斷依據\",\"求助型：比較心理諮商、身心科、EAP員工協助方案等資源\",\"管理者角度：主管/HR如何辨識並降低團隊倦怠\",\"商業型：尋找相關書 <script>

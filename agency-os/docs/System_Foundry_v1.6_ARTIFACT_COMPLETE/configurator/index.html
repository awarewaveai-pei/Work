<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Foundry Configurator</title><link rel="stylesheet" href="/styles.css"></head><body><header><h1>System Foundry Configurator</h1><p>只選你要的產品能力；工程基本盤由 Foundry 自動保障。</p></header><main><section class="industry-select" id="industrySection"><h2>選擇產業套件</h2><p>選定後才會載入對應題庫；之後仍可切換（切換會重置目前已選項目）。</p><div id="industryPicker" class="card-grid"></div></section><div id="questionnaireArea" hidden><section class="project"><div class="industry-bar">🏭 目前產業：<strong id="activeIndustryName"></strong> <button id="switchIndustry" class="link-btn" type="button">切換產業</button></div><div class="project-row"><label>專案名稱 <input id="projectName" placeholder="my-system"></label><div id="progress"></div></div></section><section class="baseline"><h2>🔒 System Foundry 基本保障</h2><p>以下項目自動啟用，不能因省工而關閉。</p><div id="baseline"></div></section><section><div class="toolbar"><button id="showAll">顯示全部項目</button><button id="onlySelected">只看已選擇</button></div><div id="questions"></div></section><section class="custom"><h2>其他需求</h2><div id="customList"></div><button id="addCustom">＋ 新增其他需求</button></section><section class="actions"><div id="status"></div><button id="validateBtn">驗證並預覽</button><button class="primary" id="generateBtn">送出並生成</button></section><section id="result" class="result"></section></div></main><script src="/app.js"></script></body></html>

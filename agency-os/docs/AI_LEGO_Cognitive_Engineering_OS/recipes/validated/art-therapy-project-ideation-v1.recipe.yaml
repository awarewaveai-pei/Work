$id: "ai-lego://recipes/validated/art-therapy-project-ideation-v1.recipe.yaml"
title: "Art Therapy Project Ideation (Frame -> Random Stimulus -> Mind Map)"
status: ACTIVE
description: >
  A non-diagnostic project-ideation workflow for an art therapy facilitator or
  participant. It makes the project gap explicit, records a creative stimulus
  exercise, and organizes participant-authored ideas into a mind map. It does
  not infer diagnosis, treatment effect, psychological state, or meaning that
  the participant or qualified facilitator has not supplied.
id: art-therapy-project-ideation-v1
version: "1.0.0"
name: "Art Therapy Project Ideation (Frame -> Random Stimulus -> Mind Map)"

references:
  cognitive_method_atlas:
    file: "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md"
    required: true

suited_for:
  - "Early-stage art therapy project design with a clearly stated project gap"
  - "Facilitated creative exploration where participant-authored ideas need traceable structure"
not_for:
  - "Diagnosis, crisis assessment, treatment planning, safeguarding decisions, or automated artwork interpretation"

mandatory_elements:
  - "A human-authored problem statement with current state, expected state, and gap"
  - "A participant/facilitator-authored creative stimulus record with provenance"
  - "A participant/facilitator-authored mind map with provenance"
  - "Qualified human facilitator review before sharing or acting on project material"

forbidden_actions:
  - "Inferring a diagnosis, trauma, risk state, or treatment outcome from any workflow output"
  - "Replacing participant or qualified facilitator meaning-making with an AI interpretation"
  - "Treating the creative feasibility marker as a feasibility assessment; it remains NOT_YET_SCREENED"

steps:
  - label: "project_problem_statement"
    type: method
    method_id: framing.problem_statement
    input: source.project_problem
    bindings:
      problem_id: source.project_problem.problem_id
      current_state: source.project_problem.current_state
      expected_state: source.project_problem.expected_state
      gap: source.project_problem.gap
      provenance: source.project_problem.provenance
    necessity: REQUIRED_BY_RISK
  - label: "creative_stimulus"
    type: method
    method_id: divergent.random_stimulus
    input: [source.stimulus, outputs.project_problem_statement]
    bindings:
      session_id: source.stimulus.session_id
      entries: source.stimulus.entries
      provenance: source.stimulus.provenance
    necessity: REQUIRED_BY_RISK
  - label: "project_mind_map"
    type: method
    method_id: association.mind_map
    input: [source.mind_map, outputs.creative_stimulus]
    bindings:
      record_id: source.mind_map.record_id
      central_topic: source.mind_map.central_topic
      main_branches: source.mind_map.main_branches
      provenance: source.mind_map.provenance
    necessity: REQUIRED_BY_RISK

outputs:
  - "ProblemStatement"
  - "RandomStimulusSession"
  - "MindMapRecord"
  - "HumanFacilitatorProjectReview"

open_questions:
  - id: "OQ-ART-PROJECT-IDEATION-1"
    question: "Should a future version add explicit consent, artwork-file storage, and retention controls when binary creative artefacts enter the workflow?"
    owner: "operator and qualified facilitator"
    blocks: "nothing in v1; v1 accepts structured records only"

verification:
  required: true
  checks:
    - "All three methods resolve to ACTIVE contracts"
    - "Each creative record passes its method-specific gate"
    - "No clinical inference field is generated by this Recipe"
    - "The random-stimulus output remains NOT_YET_SCREENED until a separate human-reviewed feasibility step exists"

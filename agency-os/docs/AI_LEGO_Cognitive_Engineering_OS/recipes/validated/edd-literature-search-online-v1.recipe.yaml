$id: "ai-lego://recipes/validated/edd-literature-search-online-v1.recipe.yaml"
title: "EdD Literature Search (registered online provider)"
status: ACTIVE
description: >
  Real scholarly search for an EdD research question through a registered
  `literature_search` provider named in the Source (`openalex` or, since
  2026-09-17, `crossref`). Egress is deny-by-default at runtime
  (COGNITIVE_OS_NETWORK_EGRESS_ALLOWLIST must list the provider's host,
  mirrored in policies/ai-execution/network-egress.yaml EGRESS-EC99-2).
  Since 2026-09-17 a second step, `research.citation_verification`, checks
  each returned item's citation metadata for STRUCTURAL completeness (DOI
  format, non-empty authors, plausible year) -- see that method's own
  contract for the exact (narrow, MP §42 first-sub-capability-only) scope.
  This is NOT retraction checking or a publication-ready evidence claim:
  every item still stays NEEDS_HUMAN_REVIEW regardless of the structural
  verdict. Sibling edd-literature-search-v1 keeps the offline fixture
  behaviour (no citation-verification step, since a fixture has no real
  citation metadata to verify).
id: edd-literature-search-online-v1
version: "1.0.0"
name: "EdD Literature Search (online)"
references:
  cognitive_method_atlas:
    file: "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md"
    required: true
suited_for:
  - "First-pass literature scan for an EdD research question (title/abstract/citation/DOI/open-access flag)"
  - "Feeding a human-curated literature matrix"
not_for:
  - "Retraction checking, contradiction detection, or a publication-ready evidence claim (MP §42's other sub-capabilities remain unbuilt)"
  - "Any provider not registered in ai_lego/modules/research/literature_providers.py"
mandatory_elements:
  - "Research question and provider are supplied explicitly by the source"
  - "Provider host is on the runtime egress allowlist or the step fails closed (NETWORK_EGRESS_DENIED)"
  - "retrieval.citation_verification == NOT_PERFORMED remains visible on the literature_search capability's own output (that capability does not perform it; the separate citation_verification step below does, and only structurally)"
forbidden_actions:
  - "Silently falling back to the synthetic fixture when the provider is unavailable"
  - "Presenting provider results, or a passing structural citation_verification, as verified or as a completed literature review"
steps:
  - label: "online_literature_search"
    type: capability
    ref: literature_search
    input: [source.research_question, source.provider]
    bindings:
      research.question: source.research_question
      research.provider: source.provider
    # per_page is deliberately NOT bound: a bound source path is mandatory at runtime, and the adapter's
    # DEFAULT_PER_PAGE (10) is the intended default for a first-pass scan.
    necessity: REQUIRED_BY_RISK
  - label: "citation_verification"
    type: method
    method_id: research.citation_verification
    input: [source.citation_verification, outputs.online_literature_search]
    bindings:
      record_id: source.citation_verification.record_id
      literature: outputs.online_literature_search.literature
      provenance: source.citation_verification.provenance
    necessity: REQUIRED_BY_RISK
outputs:
  - "LiteratureSet"
  - "CitationVerificationRecord"
open_questions:
  - id: "OQ-EDD-LITERATURE-ONLINE-1"
    question: "Which second provider (Crossref, Semantic Scholar) and what freshness/dedup policy should join OpenAlex?"
    owner: "operator and research supervisor"
    blocks: "nothing in this Recipe's own validity"
    status: "ANSWERED 2026-09-17 -- Crossref (api.crossref.org, no key, DOI-registrant-direct metadata) is
      registered alongside OpenAlex in ai_lego/modules/research/literature_providers.py; selected the same
      way, via source.provider = \"crossref\". Cross-provider dedup/freshness policy is NOT built (a caller
      running both providers for the same question gets two literature sets, not one merged/deduplicated
      set) -- left open, not blocking, since nothing today runs two providers for one question."
verification:
  required: true
  checks:
    - "Capability contract and research.citation_verification method contract both resolve to ACTIVE"
    - "provider outside REGISTERED_PROVIDERS is refused (LITERATURE_PROVIDER_UNREGISTERED)"
    - "host missing from COGNITIVE_OS_NETWORK_EGRESS_ALLOWLIST is refused before any I/O (NETWORK_EGRESS_DENIED)"
    - "retrieval.mode == ONLINE_PROVIDER and side_state == NEEDS_HUMAN_REVIEW on success"
    - "citation_verification step's literature binds FROM outputs.online_literature_search.literature (compile-time dataflow check), never a caller-supplied literature set"

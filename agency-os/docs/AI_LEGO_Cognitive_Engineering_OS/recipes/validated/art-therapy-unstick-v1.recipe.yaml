$id: "ai-lego://recipes/validated/art-therapy-unstick-v1.recipe.yaml"
title: "Art Therapy Unstick (client stuck on a question)"
status: ACTIVE
description: >
  Operator use case: a workshop participant is stuck on a question. Four
  non-diagnostic methods in the order a facilitator would offer them: give the
  stuck feeling a concrete image (visual_metaphor), talk to it
  (metaphor_dialogue), re-read the painful frame from other perspectives
  (reframing), then name the core value that survives (value_clarification).
  Every record is the participant's own words; no clinical inference field
  exists anywhere in the chain.
id: art-therapy-unstick-v1
version: "1.0.0"
name: "Art Therapy Unstick"
references:
  cognitive_method_atlas:
    file: "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md"
    required: true
suited_for:
  - "A participant who cannot answer a reflective prompt and needs a non-verbal way in"
  - "Facilitator-led sequencing of image -> dialogue -> reframe -> value"
not_for:
  - "Diagnosis, treatment planning, or any clinical claim"
  - "Participants in acute distress (facilitator judgement, outside this Recipe)"
mandatory_elements:
  - "All four records are supplied by the participant/facilitator with provenance"
  - "The reframing original_frame is the participant's own statement"
forbidden_actions:
  - "Generating a diagnosis, trauma inference, or psychological-state label"
  - "Treating the value_clarification output as a prescription"
steps:
  - label: "visual_metaphor"
    type: method
    method_id: art_therapy.visual_metaphor
    input: source.visual_metaphor
    bindings:
      record_id: source.visual_metaphor.record_id
      felt_experience: source.visual_metaphor.felt_experience
      image: source.visual_metaphor.image
      metaphor_statement: source.visual_metaphor.metaphor_statement
      elements: source.visual_metaphor.elements
      provenance: source.visual_metaphor.provenance
    necessity: REQUIRED_BY_RISK
  - label: "metaphor_dialogue"
    type: method
    method_id: art_therapy.metaphor_dialogue
    input: [source.metaphor_dialogue, outputs.visual_metaphor]
    bindings:
      record_id: source.metaphor_dialogue.record_id
      figure: source.metaphor_dialogue.figure
      exchanges: source.metaphor_dialogue.exchanges
      integration_note: source.metaphor_dialogue.integration_note
      provenance: source.metaphor_dialogue.provenance
    necessity: REQUIRED_BY_RISK
  - label: "reframing"
    type: method
    method_id: framing.reframing
    input: [source.reframing, outputs.metaphor_dialogue]
    bindings:
      record_id: source.reframing.record_id
      original_frame: source.reframing.original_frame
      reframes: source.reframing.reframes
      provenance: source.reframing.provenance
    necessity: REQUIRED_BY_RISK
  - label: "value_clarification"
    type: method
    method_id: art_therapy.value_clarification
    input: [source.value_clarification, outputs.reframing]
    bindings:
      record_id: source.value_clarification.record_id
      transformation_context: source.value_clarification.transformation_context
      core_values: source.value_clarification.core_values
      provenance: source.value_clarification.provenance
    necessity: REQUIRED_BY_RISK
outputs:
  - "VisualMetaphorRecord"
  - "MetaphorDialogueRecord"
  - "ReframingRecord"
  - "ValueClarificationRecord"
open_questions:
  - id: "OQ-ART-UNSTICK-1"
    question: "Should the dialogue figure be bound from outputs.visual_metaphor.elements instead of re-supplied by the source?"
    owner: "operator and qualified facilitator"
    blocks: "nothing in v1"
verification:
  required: true
  checks:
    - "All four method ids resolve to ACTIVE contracts and dispatchable builders/gates"
    - "Each record passes its provenance_required and integrity gates"
    - "No clinical inference field is generated by this Recipe"

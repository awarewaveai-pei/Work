$id: "ai-lego://recipes/validated/art-therapy-creative-reflection-v1.recipe.yaml"
title: "Art Therapy Creative Reflection (Random Stimulus -> Mind Map)"
status: ACTIVE
description: >
  A non-diagnostic creative-project workflow. A participant or facilitator
  supplies a random-stimulus exercise and then records a visual mind map.
  The system preserves provenance and validation; it does not infer a
  diagnosis, treatment outcome, or psychological fact from the artwork.
id: art-therapy-creative-reflection-v1
version: "1.0.0"
name: "Art Therapy Creative Reflection (Random Stimulus -> Mind Map)"
references:
  cognitive_method_atlas:
    file: "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md"
    required: true
suited_for:
  - "Facilitated art-making projects that need a traceable creative prompt and participant-authored reflection map"
not_for:
  - "Diagnosis, crisis assessment, treatment planning, or automated interpretation of artwork"
mandatory_elements:
  - "Participant/facilitator authorship and provenance on creative records"
  - "Human facilitator review before sharing or acting on project material"
  - "Explicit separation of creative expression from clinical inference"
forbidden_actions:
  - "Inferring a diagnosis, trauma, risk state, or treatment effect from a creative record"
  - "Replacing participant or qualified facilitator meaning-making with an AI interpretation"
steps:
  - label: "random_stimulus"
    type: method
    method_id: divergent.random_stimulus
    input: source.stimulus
    bindings:
      session_id: source.stimulus.session_id
      entries: source.stimulus.entries
      provenance: source.stimulus.provenance
    necessity: REQUIRED_BY_RISK
  - label: "mind_map"
    type: method
    method_id: association.mind_map
    input: [source.mind_map, outputs.random_stimulus]
    bindings:
      record_id: source.mind_map.record_id
      central_topic: source.mind_map.central_topic
      main_branches: source.mind_map.main_branches
      provenance: source.mind_map.provenance
    necessity: REQUIRED_BY_RISK
outputs:
  - "RandomStimulusSession"
  - "MindMapRecord"
  - "HumanFacilitatorReflection"
open_questions:
  - id: "OQ-ART-REFLECTION-1"
    question: "Should a future version add participant consent and media-storage controls when artwork files, rather than structured reflections, enter the workflow?"
    owner: "operator and qualified facilitator"
    blocks: "nothing in v1; v1 accepts structured records only"
verification:
  required: true
  checks:
    - "Both methods resolve to ACTIVE contracts"
    - "Each creative record passes its method-specific gate"
    - "No clinical inference field is generated by this Recipe"

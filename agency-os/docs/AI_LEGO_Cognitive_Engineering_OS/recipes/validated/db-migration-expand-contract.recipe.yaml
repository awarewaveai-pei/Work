    owner: "closed"
    blocks: "nothing — resolved"

verification:
  method: >
    Read docs/adr/ADR-005-db-migration-recipe-and-method-id-grammar.md in
    full, including its Evidence section citing five source locations.
    Re-read EC §28 (originally L1129-1157, unedited 11-step form as it stood
    when this recipe was authored 2026-08-29 -- superseded 2026-08-30 by
    proposal 023's 11->15 step edit, commit 9d587c082, now at L1077-1116;
    see OQ-DBMIG-1 below, resolved 2026-09-06),
    §29 (L1117-1153, line numbers corrected 2026-09-06, content unchanged),
    §30 (L1154-1180, line numbers corrected 2026-09-06, content unchanged)
    directly at the cited lines to confirm the CURRENT (unedited) mother-doc content
    and extract the mandatory_elements/forbidden_actions/outputs detail.
    Read specs/execution/risk-tier.schema.yaml tiers.R3.examples to confirm
    "DB migration" is a verbatim listed example before assigning risk_tier:
    R3. Read specs/execution/gate.schema.yaml in full to confirm gate_id's
    current blocked status before choosing the TBD_PENDING_ROUND2_ADR
    placeholder form. Read specs/cognitive/recipe.schema.yaml's schema body
    and its own compilation_decisions referencing this exact filename
    (L150-164) to confirm this file's steps[]/gate_ref shape matches what
    that schema expects.
  note: >
    No mother document or ADR was modified to produce this file. The
    15-step sequence is transcribed verbatim from ADR-005a's own
    "最終建議序列" block; EC §29/§30's checklists are transcribed verbatim
    into mandatory_elements/forbidden_actions/outputs. The three gate_ref
    placeholders, the REQUIRED_BY_RISK necessity pick, and the not_for
    inference are Phase 3 additive compilation decisions, each individually
    justified above — not new ADR-level tradeoffs.

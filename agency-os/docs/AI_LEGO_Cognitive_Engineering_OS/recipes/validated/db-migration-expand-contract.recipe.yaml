$id: "ai-lego://recipes/validated/db-migration-expand-contract.recipe.yaml"
title: "Database Migration — Expand/Contract (ADR-005a 15-step SSOT)"
status: ACTIVE

description: >
  Machine-readable instance of the DB Migration Expand/Contract sequence,
  conforming to specs/cognitive/recipe.schema.yaml. Resolves P1-DUP-1 /
  OQ-12: three mother documents drew FIVE conflicting sequence diagrams for
  this procedure (Execution Contract §28, Atlas F21 mermaid, Atlas F21 table
  row, Atlas §11.50, Atlas §13.10), disagreeing on whether Dual Write happens
  before or after Backfill — a disagreement with a real data-loss
  consequence, not a wording preference (see docs/adr/ADR-005-db-migration-
  recipe-and-method-id-grammar.md Sub-decision (a) for the full five-way
  comparison and WebSearch-verified industry-standard cross-check).

  ADR-005a (ACCEPTED 2026-08-29) resolved this to a single 15-step sequence,
  with Execution Contract §28 as the designated SSOT location in prose. Per
  that ADR's own status line, an ADR decision does NOT itself edit the
  mother documents — applying it requires the separate ADR-006
  `.ai/proposals/` flow, which only the operator can advance. At this file's
  original authoring time (2026-08-29) EC §28 still showed its original
  11-step mermaid (verbatim re-read that day to confirm: Baseline ->
  Backup/Restore Validation -> Compatibility Analysis -> Expand -> Deploy
  Compatible Code -> Backfill -> Reconciliation -> Traffic Migration ->
  Observe -> Contract Old Schema -> Close Rollback Window, then at
  EC:1129-1157) -- the ADR-006 proposal had NOT yet landed. **Superseded
  2026-08-30**: proposal 023 (commit `9d587c082`) applied ADR-005a's edit,
  and EC §28 (now at L1077-1116) shows the same 15-step sequence this file's
  `steps[]` already used as its machine-readable SSOT from the start (this
  was exactly the Wave-7 task per MACHINE_READABLE_SPEC_PLAN.md §2.8 row 175:
  "機器可讀版本，人類權威版留在 EC §28 prose"). This file's own `steps[]`
  content required no change once §28 caught up -- only its own citations of
  §28's location/step-count needed a line-number and status refresh, done
  2026-09-06 (see OQ-DBMIG-1 below, now resolved).

source_of_truth_for:
  - "docs/adr/ADR-005-db-migration-recipe-and-method-id-grammar.md Sub-decision (a), 最終建議序列 (L81-115) -- the 15-step sequence this file's steps[] transcribes"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §28 Database Change Contract (L1077-1116, 15-step form per ADR-005a, applied 2026-08-30 by proposal 023 / commit 9d587c082 -- this file's steps[] already matched before that edit landed, see description)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §29 DB Migration Requirements (L1117-1153) -- Backfill's 5 required properties and the assessment checklist, folded into mandatory_elements below"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §30 Data Integrity Contract (L1154-1180) -- the 6 required data-change definitions and the 'exit code != proof' rule, folded into mandatory_elements/outputs below"
  - "specs/execution/risk-tier.schema.yaml tiers.R3.examples (lists 'DB migration' verbatim) -- grounds this file's risk_tier: R3"
  - "specs/execution/gate.schema.yaml -- gate_id value space WAS BLOCKED_PENDING_ROUND2_ADR at this file's original write time; this file's gate_ref placeholders inherited that block, not a new one; RESOLVED 2026-08-30 by docs/adr/ADR-011-platform-gate-ownership-and-unification.md -- see gate.schema.yaml#/gate_catalog and this file's own updated compilation_decisions/steps[].gate_ref below, which already carry real catalog ids"
  - "specs/cognitive/recipe.schema.yaml -- the schema this file's body (id/version/name/steps/etc.) is validated against"
  - "docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §2.8 row for this file (L175)"

decided_by: >
  docs/adr/ADR-005-db-migration-recipe-and-method-id-grammar.md (ACCEPTED
  2026-08-29) for the step sequence itself. This file's own compilation
  choices (which steps carry a gate_ref placeholder, how EC §29/§30's
  checklists map onto mandatory_elements/outputs) are Phase 3 Low-risk
  structural picks, individually justified below -- ADR-005a does not
  itself specify gate hookups or field-mapping detail at this granularity.

compilation_decisions:
  - question: >
      ADR-005a's 15-step sequence splits the old single "Dual Read/Write"
      node into two: "Enable Dual Write" (before Backfill) and "Dual Read
      Verification" (after Reconciliation). Should this file collapse them
      back into one step for brevity?
    decision: "No. Kept as two separate steps, exactly as ADR-005a specifies."
    reasoning: >
      The ADR's entire Sub-decision (a) argument is that Dual Write and Dual
      Read are semantically different control points that three mother
      documents wrongly compressed into one, causing the data-loss-risk
      ordering error this ADR exists to fix. Re-merging them here would
      silently reintroduce the exact ambiguity the ADR corrected.
  - question: >
      Which steps should carry a `gate_ref` placeholder, given
      `execution/gate.schema.yaml`'s gate_id value space is itself
      BLOCKED_PENDING_ROUND2_ADR and MACHINE_READABLE_SPEC_PLAN.md §2.8's
      row for this file says only "Backup/Restore Validation 等步驟掛
      gate" (steps LIKE Backup/Restore Validation hook to a gate) --
      naming one example, not an exhaustive list?
    decision: >
      Three placeholders: `Backup / Restore Validation` (named explicitly
      by the plan row), `Reconciliation` (EC §30's own emphatic rule that
      command exit code alone is not proof -- a natural gate point), and
      `Traffic Migration / Switch` (the point where risk-tier R3's
      "Human Approval" required_action would bind, per
      specs/execution/risk-tier.schema.yaml tiers.R3.required_actions).
      All three originally used `gate_ref: "TBD_PENDING_ROUND2_ADR"` -- a
      literal string value, not a real gate id, matching gate.schema.yaml's
      own `x-status: TBD_PENDING_ROUND2_ADR` marker convention (as it stood
      before 2026-08-30).
    reasoning: >
      Naming exactly these three (not all 15, not just the one the plan row
      mentions by name) keeps the choice traceable to specific EC/risk-tier
      text rather than either under- or over-claiming gate coverage while
      the underlying gate_id list remains genuinely undecided.

      **RESOLVED 2026-08-30** by `docs/adr/ADR-011-platform-gate-ownership-
      and-unification.md`: all three placeholders now hold real
      `gate.schema.yaml#/gate_catalog` ids, chosen from each step's own
      already-documented rationale above (not re-derived): `Backup /
      Restore Validation` -> `recovery_rollback_rehearsal` (High-risk;
      validating a backup/restore IS rehearsing recovery/rollback, the
      exact concept that catalog item names); `Reconciliation` -> `data`
      (Global; EC §30's "exit code alone is not proof" rule is precisely a
      Data-correctness verification); `Traffic Migration / Switch` ->
      `human_specialist_review` (High-risk; this is literally the point
      named above as where R3's "Human Approval" required_action binds).
      No new gate concept was invented — each mapping traces to the SAME
      textual justification this decision already gave per step, only now
      pointing at a real catalog id instead of a marker string.
  - question: >
      Should this recipe's steps carry `necessity: REQUIRED_BY_RISK`
      (Atlas §14.3's enum, per recipe.schema.yaml) rather than the schema's
      default `RECOMMENDED`?
    decision: "Yes, all 15 steps."
    reasoning: >
      EC §28 frames this procedure as the standard ("標準") for a
      risk_tier: R3 operation (DB migration is a named R3 example in
      risk-tier.schema.yaml), and ADR-005a's entire argument is that
      skipping or reordering steps causes real data loss -- these are not
      optional best-practice suggestions, matching Atlas §14.3's
      REQUIRED_BY_RISK semantics ("Mandatory risk gates" per Atlas §13's
      own Recipe definition) rather than the default RECOMMENDED.
  - question: >
      EC §28 gives no suited_for/not_for lists the way Atlas §13's Recipe
      Library entries do (e.g. §13.1's explicit "適合"/"不可用於" blocks).
      Should this file invent one to match the house style, or leave the
      fields empty?
    decision: >
      Populate `not_for` with a single directly-grounded inference: ad-hoc
      SQL patches applied without this lifecycle. Leave `suited_for` as a
      direct restatement of EC §28's own scope statement rather than an
      invented use-case list.
    reasoning: >
      EC §28's opening line -- "DB Migration 是高風險工程，不是 SQL patch"
      ("DB Migration is high-risk engineering, not a SQL patch") -- is
      itself an explicit suited-for/not-for contrast in the mother
      document's own words, not a Phase 3 invention; restating it directly
      is more honest than fabricating a longer list with no textual basis
      (the same discipline recipe.schema.yaml's own `compilation_decisions`
      applied when it declined to invent a richer `steps[].type` taxonomy).

id: db-migration-expand-contract
version: "1.0.0"
name: "Database Migration — Expand/Contract (ADR-005a)"
risk_tier: R3

suited_for:
  - "任何會改變 production 資料庫 schema 的變更 — EC §28: 'DB Migration 是高風險工程，不是 SQL patch'"

not_for:
  - "未經過此 15 步序列、當作一次性 SQL patch 直接對 production 執行的 schema 變更（EC §28 L1079 verbatim 對比句，行號 2026-09-06 訂正，原 L1131）"

mandatory_elements:
  - "Backfill 必須 resumable / idempotent / checkpointed / throttled / observable（EC §29 L1140-1144 verbatim）"
  - "Data Integrity Contract 六項至少定義：Preconditions / Business Invariants / Postconditions / Checksums or Counts / Reconciliation Query / Quarantine Policy（EC §30 L1159-1164 verbatim）"
  - "Migration 完成判準是 data invariant = PASS，不是 command exit code = 0（EC §30 L1167-1177 verbatim）"
  - "評估清單：Lock Duration / Table Size / Index Build / Replication Lag / Write Amplification / Disk / Backup / PITR / Foreign Keys / Triggers / ORM Compatibility / Long-running Transactions / Rollback / Data Reconciliation（EC §29 L1122-1135 verbatim）"

forbidden_actions:
  - "未評估直接 destructive ALTER（EC §29 L1149 verbatim: '未評估直接 destructive ALTER'）"

steps:
  - label: "Schema Baseline"
    type: capability
    ref: schema_baseline
    necessity: REQUIRED_BY_RISK
  - label: "Data Contract"
    type: capability
    ref: data_contract
    necessity: REQUIRED_BY_RISK
    # ADR-005a-only addition vs. EC's current unedited 11-step mermaid — see
    # description above. Not present in EC §28's current text.
  - label: "Compatibility Analysis"
    type: capability
    ref: compatibility_analysis
    necessity: REQUIRED_BY_RISK
  - label: "Backup / Restore Validation"
    type: capability
    ref: backup_restore_validation
    necessity: REQUIRED_BY_RISK
    gate_ref: "recovery_rollback_rehearsal"
  - label: "Expand"
    type: capability
    ref: expand
    necessity: REQUIRED_BY_RISK
  - label: "Deploy Compatible Code"
    type: capability
    ref: deploy_compatible_code
    necessity: REQUIRED_BY_RISK
  - label: "Enable Dual Write"
    type: capability
    ref: enable_dual_write
    necessity: REQUIRED_BY_RISK
    input: schema_baseline
    # ADR-005a's core correction: MUST start here (before Backfill), not
    # after — see description and compilation_decisions above. Continues
    # through Backfill and Reconciliation, until Contract Old Schema.
  - label: "Backfill"
    type: capability
    ref: backfill
    necessity: REQUIRED_BY_RISK
  - label: "Reconciliation"
    type: capability
    ref: reconciliation
    necessity: REQUIRED_BY_RISK
    gate_ref: "data"
  - label: "Dual Read Verification"
    type: capability
    ref: dual_read_verification
    necessity: REQUIRED_BY_RISK
    # ADR-005a-only addition, split out from the old merged "Dual Read/Write"
    # node — shadow-reads the new schema and compares against the old
    # schema's results, not yet serving real traffic.
  - label: "Canary"
    type: capability
    ref: canary
    necessity: REQUIRED_BY_RISK
  - label: "Traffic Migration / Switch"
    type: capability
    ref: traffic_migration_switch
    necessity: REQUIRED_BY_RISK
    gate_ref: "human_specialist_review"
  - label: "Observe"
    type: capability
    ref: observe
    necessity: REQUIRED_BY_RISK
  - label: "Contract Old Schema"
    type: capability
    ref: contract_old_schema
    necessity: REQUIRED_BY_RISK
  - label: "Close Rollback Window"
    type: capability
    ref: close_rollback_window
    necessity: REQUIRED_BY_RISK

outputs:
  - "data_invariant_pass_proof (EC §30 L1167-1177 — a positive proof artifact, NOT a command exit code)"


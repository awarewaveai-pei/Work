$id: "ai-lego://recipes/validated/business-planning-feasibility-v1.recipe.yaml"
title: "Business Planning Feasibility (Foundation -> Scenario/Risk -> Economics)"
status: ACTIVE
description: >
  A bounded business-planning workflow that turns explicitly supplied
  strategic records into a replayable feasibility review. It composes SWOT,
  TOWS, Porter, Business Model Canvas, scenario planning, risk register, TCO,
  unit economics, break-even, and NPV. It stops before market research,
  customer insight, STP, KPI design, execution planning, and proposal
  publication; no missing evidence or financial assumptions are invented.
id: business-planning-feasibility-v1
version: "1.0.0"
name: "Business Planning Feasibility (Foundation -> Scenario/Risk -> Economics)"

references:
  cognitive_method_atlas:
    file: "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md"
    required: true

suited_for:
  - "Early business planning with caller-supplied evidence-labeled strategic and financial inputs"
  - "Replayable feasibility review before a human-owned investment or execution decision"
not_for:
  - "A complete business proposal, market/customer research substitute, investment advice, or automatic approval"
  - "Scenarios or financial outputs based on assumptions that were not explicitly supplied and reviewed"

mandatory_elements:
  - "Explicit SWOT factors and a TOWS matrix checked against the preceding SWOT output"
  - "Explicit strategic, scenario, risk, and financial inputs with provenance"
  - "Human review of assumptions, risks, and computed outputs before any decision"

forbidden_actions:
  - "Presenting computed NPV, break-even, or unit economics as an investment recommendation"
  - "Inventing market evidence, customer insight, financial assumptions, KPIs, or execution commitments"
  - "Treating scenario planning as a prediction or risk register as a substitute for human ownership"

steps:
  - label: "SWOT_analysis"
    type: method
    method_id: strategy.swot
    input: source.swot
    bindings:
      analysis_id: source.swot.analysis_id
      knowledge_set_ref: source.swot.knowledge_set_ref
      knowledge_set: source.swot.knowledge_set
      factors: source.swot.factors
    necessity: REQUIRED_BY_RISK
  - label: "TOWS_strategy_options"
    type: method
    method_id: strategy.tows
    input: [source.tows, outputs.SWOT_analysis]
    bindings:
      record_id: source.tows.record_id
      swot_analysis: outputs.SWOT_analysis
      pairings: source.tows.pairings
      provenance: source.tows.provenance
    necessity: REQUIRED_BY_RISK
  - label: "Porter_five_forces"
    type: method
    method_id: strategy.porter_five_forces
    input: source.porter
    bindings:
      analysis_id: source.porter.analysis_id
      forces: source.porter.forces
      overall_attractiveness: source.porter.overall_attractiveness
      provenance: source.porter.provenance
    necessity: REQUIRED_BY_RISK
  - label: "business_model_canvas"
    type: method
    method_id: strategy.business_model_canvas
    input: source.business_model
    bindings:
      canvas_id: source.business_model.canvas_id
      blocks: source.business_model.blocks
      provenance: source.business_model.provenance
    necessity: REQUIRED_BY_RISK
  - label: "scenario_set"
    type: method
    method_id: foresight.scenario_planning
    input: source.scenarios
    bindings:
      record_id: source.scenarios.record_id
      critical_uncertainties: source.scenarios.critical_uncertainties
      scenarios: source.scenarios.scenarios
      provenance: source.scenarios.provenance
    necessity: REQUIRED_BY_RISK
  - label: "risk_register"
    type: method
    method_id: delivery.risk_register
    input: source.risks
    bindings:
      record_id: source.risks.record_id
      risks: source.risks.risks
      provenance: source.risks.provenance
    necessity: REQUIRED_BY_RISK
  - label: "total_cost_of_ownership"
    type: method
    method_id: feasibility.tco
    input: source.tco
    bindings:
      record_id: source.tco.record_id
      subject_ref: source.tco.subject_ref
      cost_categories: source.tco.cost_categories
      provenance: source.tco.provenance
    necessity: REQUIRED_BY_RISK
  - label: "unit_economics"
    type: method
    method_id: feasibility.unit_economics
    input: source.unit_economics
    bindings:
      record_id: source.unit_economics.record_id
      subject_ref: source.unit_economics.subject_ref
      cac: source.unit_economics.cac
      ltv: source.unit_economics.ltv
      gross_margin: source.unit_economics.gross_margin
      payback_period: source.unit_economics.payback_period
      churn_rate: source.unit_economics.churn_rate
      arpu: source.unit_economics.arpu
      contribution_margin: source.unit_economics.contribution_margin
      provenance: source.unit_economics.provenance
    necessity: REQUIRED_BY_RISK
  - label: "break_even_analysis"
    type: method
    method_id: feasibility.break_even
    input: source.break_even
    bindings:
      record_id: source.break_even.record_id
      subject_ref: source.break_even.subject_ref
      fixed_cost: source.break_even.fixed_cost
      contribution_margin_per_unit: source.break_even.contribution_margin_per_unit
      provenance: source.break_even.provenance
    necessity: REQUIRED_BY_RISK
  - label: "net_present_value_analysis"
    type: method
    method_id: feasibility.npv
    input: [source.npv, outputs.break_even_analysis]
    bindings:
      record_id: source.npv.record_id
      subject_ref: source.npv.subject_ref
      cash_flows: source.npv.cash_flows
      discount_rate: source.npv.discount_rate
      provenance: source.npv.provenance
    necessity: REQUIRED_BY_RISK

outputs:
  - "SWOTAnalysis"
  - "TOWSMatrix"
  - "PorterFiveForcesAnalysis"
  - "BusinessModelCanvas"
  - "ScenarioSet"
  - "RiskRegister"
  - "TotalCostOfOwnership"
  - "UnitEconomicsAnalysis"
  - "BreakEvenAnalysis"
  - "NPVAnalysis"

open_questions:
  - id: "OQ-BUSINESS-PLANNING-FEASIBILITY-1"
    question: "Should a future version add explicit market/customer/STP methods and a human-reviewed finance-assumptions contract before producing a proposal artifact?"
    owner: "operator and qualified business reviewer"
    blocks: "nothing in v1; this Recipe deliberately stops at bounded feasibility review"

verification:
  required: true
  checks:
    - "All ten method ids resolve to ACTIVE contracts and dispatchable builders/gates"
    - "TOWS re-checks the actual preceding SWOT output"
    - "All numeric outputs are genuine computations re-derived by method gates"
    - "No investment recommendation or proposal publication is generated"

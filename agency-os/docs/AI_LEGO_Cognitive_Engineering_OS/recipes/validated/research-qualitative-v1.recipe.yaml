  - "AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md §9 Workflow IR worked example (L810-840) -- List A, reconciled above, NOT silently replaced"
  - "docs/architecture/MVP_VERTICAL_SLICE_PLAN.md §3 walkthrough steps 5-22 (L62-88) -- List B, and every step's own MP/EC citation reused here"

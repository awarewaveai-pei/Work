title: "Qualitative Research Recipe (Coding + Triangulation + Inter-rater Reliability), v1"
status: ACTIVE

description: >
  Real Recipe instance for the Phase 5 Research Mode MVP vertical slice
  (`docs/architecture/MVP_VERTICAL_SLICE_PLAN.md`, slice choice ratified by
  `docs/adr/ADR-014-phase-5-mode-selection-research.md`, ACCEPTED
  2026-08-30). This file's job required reconciling TWO DIFFERENT node lists
  the source documents give for "a qualitative research workflow" -- they are
  NOT the same list, and this file does not silently pick one over the
  other. Both are read in full below before stating the reconciliation.

  **List A -- Master Plan §9's Workflow IR teaching example**
  (`id: research.qualitative.v4`, L810-840, also transcribed verbatim in
  `specs/workflow/workflow-ir.schema.yaml#/worked_example`):
  `transcribe` (capability) -> `research.thematic_analysis` (method) ->
  `literature_search` (capability) -> `evidence.triangulation` (method) ->
  `artifact.generate_research_paper` (capability). 5 nodes.

  **List B -- MVP_VERTICAL_SLICE_PLAN.md's own real walkthrough**
  (§3 step 16, L79): `transcribe` (capability) -> `research.qualitative_coding`
  (method) -> `evidence.triangulation` (method) -> `run_statistics`
  (capability, computing inter-rater reliability). 4 nodes (named in prose;
  MVP itself never writes this as a formal `nodes:` YAML block the way MP §9
  does).

  **Reconciliation (this file's own compilation decision, not a silent
  pick)**: this Recipe's `steps[]` is the UNION of the two lists, not a
  replacement of one by the other, for two independent, individually-
  necessary reasons:

  1. **`research.thematic_analysis` -> `research.qualitative_coding`
     substitution is deliberate, not an omission.** MVP §3 step 12 (L72)
     explicitly names `research.qualitative_coding` as the method this
     Research Mode slice resolves (closing P1-GAP-AI-9) -- it does NOT use
     `research.thematic_analysis` (a different, still-`contract_status:
     pending` method that remains List A's own teaching-example content,
     untouched, still cataloged in `method-inventory.yaml`). This file
     follows MVP's real, ADR-014-ratified choice, not List A's teaching
     example, for the coding step.

  2. **`literature_search` is KEPT from List A, not dropped, even though
     MVP's own one-line walkthrough prose (§3 step 16) does not name it.**
     `evidence.triangulation.contract.yaml` (already built, `status:
     ACTIVE`) declares `inputs.required: [themes, literature]` -- BOTH
     required, not optional, transcribed verbatim from List A's own
     `input: [themes, literature]` (MP L834-836). If this Recipe's
     `evidence.triangulation` step only supplied `themes` (from
     `research.qualitative_coding`'s output) with no `literature_search`
     step feeding the `literature` half, the resulting step would violate
     that already-built method contract's own required inputs. Dropping
     `literature_search` to match List B's shorter prose would silently
     break List A's already-real contract; this file instead keeps it,
     satisfying BOTH sources rather than forcing a choice between them. A
     literature-comparison step is also substantively reasonable for the
     MVP scenario's own remote-worker-burnout study (real qualitative
     research routinely triangulates interview findings against published
     literature).

  3. **`run_statistics` is ADDED from List B (MVP §3 steps 16-17, L79-80)**,
     to close P1-GAP-AI-2 (Trusted Compute) for the inter-rater reliability
     computation. List A has no equivalent step (its final node is
     `artifact.generate_research_paper` directly after triangulation) --
     this is a genuine List-B-only addition, not present in List A at all.
     **Position (prose corrected 2026-09-04, OQ-P5-6)**: the normative
     `steps:` block places it directly after Coder 2 and `literature_search`
     and BEFORE `evidence.triangulation` -- the standard methodological
     order (check coder agreement on raw coding output before synthesising
     against literature), NOT MVP §3 step 16's literal prose order
     (triangulation, then statistics). Earlier revisions of this prose said
     the file "follows MVP's order literally" while the block did not; the
     block is what the compiler and the runtime read
     (`Projects/internal/cognitive-engineering-os/ai_lego/platform/workflow/ir.py`),
     so the prose is corrected to match the block, not the other way round.
     Whether the block should instead be flipped back to MVP's literal order
     is OQ-RQV1-2.

  4. **`research.qualitative_coding` is modeled as TWO separate steps (Coder
     1, Coder 2), not one**, because MVP's own scenario (§3 step 17, L80:
     "兩位編碼者的編碼結果交給 `run_statistics`") requires TWO INDEPENDENT
     coders' outputs to exist before `run_statistics` can compute Kappa
     between them -- a single shared method invocation cannot itself produce
     two independently-authored CodeSets. `recipe.schema.yaml`'s `steps[]`
     has no fan-out/parallel-execution construct (confirmed by reading that
     file's own `open_questions.OQ-recipe-3`/`OQ-WFIR-3`, and
     `workflow-ir.schema.yaml`'s own `compilation_decisions` on why `nodes[]`
     stays a flat array with no graph-edge syntax) -- two explicit,
     distinctly-labeled sequential steps is the correct expression within
     this schema's existing, deliberately-flat-array design, not a schema
     gap this file needs to invent new syntax to work around.

  Net result: **7 steps**, not 4 or 5 (count corrected 2026-09-04, OQ-P5-6:
  the normative `steps:` block has always had 7 -- transcribe, Coder 1,
  Coder 2, literature_search, run_statistics, evidence.triangulation,
  artifact -- an earlier revision of this prose miscounted 8) -- an honest
  superset that satisfies
  every constraint both source lists actually impose (List A's
  `evidence.triangulation` required-inputs contract; List B's real method/
  capability choices and statistical step), rather than silently discarding
  either.

  **`specs/workflow/workflow-ir.schema.yaml` cross-check (built by a
  separate concurrent session during this same task, confirmed to exist
  before this file was finalized)**: that file's own central resolution
  states Recipe (this schema) and Workflow IR are "two related but distinct
  objects... a Recipe compiles down into a Workflow IR instance." This
  Recipe instance is consistent with that resolution: it is the
  AUTHOR-FACING, `suited_for`/`mandatory_elements`-bearing declarative
  artifact; a real execution engine would compile THIS file's `steps[]`
  (via `workflow-ir.schema.yaml`'s own `compiled_from: {source_kind: recipe,
  recipe_id: research-qualitative-v1, recipe_version: "1.0.0"}` mechanism)
  into a concrete Workflow IR instance carrying the same node sequence under
  that file's stricter `node_kind`/hard-`$ref` discriminated-union shape.
  This file does not itself produce that compiled instance (out of this
  task's scope) but is structurally ready to be `compiled_from`'s
  `recipe_id`/`recipe_version` source.


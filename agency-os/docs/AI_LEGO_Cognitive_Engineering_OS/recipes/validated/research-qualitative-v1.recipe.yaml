decided_by: >
  No ADR governs this file's content -- same class of gap as this corpus's
  other 3 `recipes/validated/*.recipe.yaml` files (none is ADR-governed
  either). Authorized directly by `docs/architecture/MVP_VERTICAL_SLICE_PLAN.md`
  §4 (L105), itself ratified for the Research Mode slice by
  `docs/adr/ADR-014-phase-5-mode-selection-research.md` (ACCEPTED
  2026-08-30). The List-A-vs-List-B reconciliation above is this file's own
  Phase 3 compilation decision, individually justified, not an ADR-level
  ruling.

compilation_decisions:

  - question: >
      `specs/cognitive/recipe.schema.yaml`'s own `id` field is a kebab-case
      slug (`^[a-z][a-z0-9-]*$`, no dots) -- an ALREADY-DECIDED sibling-schema
      constraint (that file's own `compilation_decisions`, resolving the
      identical MP-L812-dotted-form-vs-kebab-case tension this file's own
      naming cue echoes). This task's own deliverable name is
      "research.qualitative.v1" (dotted, deliberately echoing MP L812's
      teaching-example id `research.qualitative.v4`). Which form does this
      file actually use?
    decision: >
      `id: research-qualitative-v1` (kebab-case) -- filename
      `research-qualitative-v1.recipe.yaml`. The dotted form
      "research.qualitative.v1" is NOT used as the literal `id` value; it is
      preserved only in this file's own `title` and prose description as the
      human-readable lineage cue linking it to MP's teaching example.
    reasoning: >
      Honoring `recipe.schema.yaml`'s own ALREADY-DECIDED `id` pattern (a
      real, cited compilation decision with 3 existing precedent filenames:
      `db-migration-expand-contract`, `method-deprecation-retirement`,
      `champion-challenger` -- none dotted, none version-embedded) over an
      informal task-description naming cue is the more disciplined choice: a
      literal dotted `id` would fail `recipe.schema.yaml`'s own `pattern`
      validation outright, and `recipe.schema.yaml`'s own
      `open_questions.OQ-recipe-2` already flags this exact
      MP-dotted-form-vs-kebab-case tension as UNRESOLVED-BY-ADR, not
      silently decidable per-instance by whichever file happens to be
      written next. Picking kebab-case here is the SAME low-risk pick that
      file's own `compilation_decisions` already made project-wide, applied
      consistently rather than re-litigated per file.

  - question: >
      Should `research.thematic_analysis` (List A's coding-adjacent method)
      still appear anywhere in this Recipe, given List B replaces it with
      `research.qualitative_coding`?
    decision: "No. This Recipe uses `research.qualitative_coding` only for its coding step; `research.thematic_analysis` does not appear."
    reasoning: >
      See `description` above, reconciliation point 1. MVP §3 step 12
      (L72) is explicit that `research.qualitative_coding` is the method
      this slice resolves -- Master Plan's own teaching example remains
      valid and unmodified as ITS OWN separate illustration (still
      transcribed verbatim in `workflow-ir.schema.yaml#/worked_example`),
      but this REAL Recipe instance follows the real, ADR-014-ratified
      method choice, not the teaching example's method choice.

  - question: >
      Should `research.qualitative_coding` appear as ONE step (shared
      between both coders) or TWO (one per coder)?
    decision: "Two separate, distinctly-labeled sequential steps."
    reasoning: >
      See `description` above, reconciliation point 4. Cohen's Kappa (the
      downstream `run_statistics` step) is UNDEFINED without two independent
      coders' outputs to compare -- MVP's own scenario names exactly 2
      ("兩位編碼者", MP §3 step 17, L80). `recipe.schema.yaml`'s `steps[]`
      has no parallel/fan-out construct (confirmed before deciding this,
      not assumed), so two sequential, clearly-labeled invocations of the
      same `method_id` is the correct, schema-legal expression of
      "independently repeat this method twice", not a workaround for a
      missing feature.

  - question: >
      Should `gate_ref` values reference `execution/gate.schema.yaml`'s
      Global/High-risk catalog (ADR-011-resolved, 20 items) or
      `research.qualitative_coding.contract.yaml`'s own
      `method_specific_gates` (5 research-paper gates, built same task)?
    decision: >
      `method_specific_gates` ids (`statistical`, `research_integrity`) for
      the 2 steps where a method-specific gate concretely applies; no
      `gate_ref` on steps where neither catalog has a matching concept.
    reasoning: >
      Per `recipe.schema.yaml`'s own field description, `gate_ref` is a
      soft reference to "a gate id in `execution/gate.schema.yaml#/
      gate_catalog`" OR, per that same file's own `gate_catalog.
      method_specific` note, a per-method contract's own namespace -- both
      are legal untyped strings, this file simply picks whichever concept
      actually applies per step rather than forcing every step to carry one.
      `run_statistics` (Statistical Gate) and the final artifact-generation
      step (Research Integrity Gate, the composite of all 4 others) are the
      two steps where `research.qualitative_coding.contract.yaml`'s own
      newly-built method_specific_gates genuinely apply; none of the 20
      Global/High-risk catalog ids fit any step here either (confirmed by
      the same grep sweep `policies/ai-execution/trusted-compute-gate.
      policy.yaml` already ran against that catalog, reused rather than
      re-run).

id: research-qualitative-v1
version: "1.0.0"
name: "Qualitative Research Recipe (Coding + Triangulation + Inter-rater Reliability)"

references:
  cognitive_method_atlas:
    file: "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md"
    required: true
  # Real, on-disk filename (confirmed via `find`, this session) -- NOT MP
  # L804/L816's own literal `..._v1_2_zhTW.md` citation, which is already an
  # independently-flagged dangling reference (P1-GAP-PROD-5's own evidence:
  # "Item 21 自我引用一個已確認磁碟上不存在的檔名(v1_2_zhTW)"). This Recipe
  # is a REAL, functioning instance meant to actually resolve against a real
  # Atlas file, not a re-transcription of an already-known-broken citation --
  # fixing forward to the real filename here, same "don't perpetuate a
  # known-broken reference into new real content" choice this corpus's other
  # Wave 2+ files already applied when a literal MP citation was independently
  # flagged elsewhere as broken.

suited_for:
  - "Qualitative research studies requiring coded interview/transcript data, cross-validated against literature and confirmed via a real inter-rater reliability statistic (MVP_VERTICAL_SLICE_PLAN.md §3, the Nordbrook Research Lab remote-worker-burnout scenario)"
  - "Any Research Mode task where 2+ independent human coders must demonstrate coding-scheme reliability before a research memo/paper artifact is generated"

not_for:
  - "Single-coder studies with no inter-rater comparison need (run_statistics/Cohen's Kappa step is meaningless with only 1 coder -- see this method's own precondition rater_coding_set.rater_count >= 2)"
  - "High-stakes formal decisions, medical/legal/safety advice, or major investment decisions made directly from this Recipe's output without independent Human Review (same class of caution Atlas §13.1's own 'not_for' list states for a different Recipe, applied here by the same general-purpose restraint)"

mandatory_elements:
  - "Provenance (governance/epistemic-label.schema.yaml#/provenance_record) on every CodeSet/CategorySet/ThemeSet/Claim output -- research.qualitative_coding.contract.yaml's own quality.provenance_required/evidence_labeling_required"
  - "Citation verification -- this Recipe's citation gate is research.qualitative_coding.contract.yaml#/method_specific_gates.citation"
  - "Trusted Compute execution (not LLM mental calculation) for the run_statistics step -- EC §39, policies/ai-execution/trusted-compute-gate.policy.yaml"
  - "Statistical guardrails -- research.qualitative_coding.contract.yaml#/method_specific_gates.statistical"
  - "Research integrity -- research.qualitative_coding.contract.yaml#/method_specific_gates.research_integrity (composite of the other 4 method_specific_gates)"

forbidden_actions:
  - "Asserting the inter-rater reliability Kappa value without routing it through the Trusted Compute pipeline (EC §39's own literal forbidden pattern: 'LLM mentally calculates -> CALCULATED_RESULT')"
  - "Silently overwriting a human-authored LOCKED_FACT code with a later AI re-analysis (MP §11.2-11.3; MVP Acceptance Criterion 3, L133) -- a later prompt/model upgrade's re-analysis MUST surface as an independent AI_SUGGESTION, never overwrite the locked record"

steps:
  - label: "Transcription"
    type: capability
    ref: transcribe
    input: source.transcript
    bindings:
      transcript: source.transcript
    necessity: RECOMMENDED
  - label: "Qualitative Coding -- Coder 1 (Open / Axial / Selective)"
    type: method
    method_id: research.qualitative_coding
    input: outputs.Transcription.transcript
    bindings:
      transcript: outputs.Transcription.transcript
      locked_code: source.coder_one.locked_code
      ai_review: source.coder_one.ai_review
      at: source.coder_one.at
    necessity: RECOMMENDED
  - label: "Qualitative Coding -- Coder 2 (Open / Axial / Selective, independent)"
    type: method
    method_id: research.qualitative_coding
    input: outputs.Transcription.transcript
    bindings:
      transcript: outputs.Transcription.transcript
      locked_code: source.coder_two.locked_code
      ai_review: source.coder_two.ai_review
      at: source.coder_two.at
    necessity: RECOMMENDED
  - label: "Literature Search"
    type: capability
    ref: literature_search
    input: source.question
    bindings:
      research.question: source.question
    necessity: RECOMMENDED
  - label: "Inter-rater Reliability (Cohen's Kappa)"
    type: capability
    ref: run_statistics
    input: ["outputs.Qualitative Coding -- Coder 1 (Open / Axial / Selective).coder_1.code_set", "outputs.Qualitative Coding -- Coder 2 (Open / Axial / Selective, independent).coder_2.code_set"]
    bindings:
      coder_one: "outputs.Qualitative Coding -- Coder 1 (Open / Axial / Selective).coder_1.code_set"
      coder_two: "outputs.Qualitative Coding -- Coder 2 (Open / Axial / Selective, independent).coder_2.code_set"
    necessity: REQUIRED_BY_RISK
    gate_ref: statistical
  - label: "Evidence Triangulation"
    type: method
    method_id: evidence.triangulation
    input: ["outputs.Qualitative Coding -- Coder 1 (Open / Axial / Selective).theme_set", "outputs.Literature Search.literature"]
    bindings:
      themes: "outputs.Qualitative Coding -- Coder 1 (Open / Axial / Selective).theme_set"
      literature: "outputs.Literature Search.literature"
    necessity: RECOMMENDED
  - label: "Research Memo Artifact Generation"
    type: capability
    ref: artifact.generate_research_paper
    input: ["outputs.Evidence Triangulation.triangulation", "outputs.Inter-rater Reliability (Cohen's Kappa).interrater_reliability_result"]
    bindings:
      triangulated_findings: "outputs.Evidence Triangulation.triangulation"
      interrater_reliability_result: "outputs.Inter-rater Reliability (Cohen's Kappa).interrater_reliability_result"
    necessity: REQUIRED_BY_RISK
    gate_ref: research_integrity

outputs:
  - "CodeSet (x2, one per coder -- research.qualitative_coding.contract.yaml#/outputs)"
  - "CategorySet (x2, one per coder)"
  - "ThemeSet (x2, one per coder, pre-triangulation)"
  - "InterRaterReliabilityResult (capabilities/contracts/run_statistics.capability.yaml#/output)"
  - "TriangulatedFindingSet (evidence.triangulation.contract.yaml#/outputs)"
  - "ResearchMemoArtifact -- NEW_DESIGN, no existing typed-object schema; MVP §3 step 20 (L86) names its expected content ('Theme Summary + Evidence Quotes + Triangulation 結果 + Kappa 統計') but no formal record shape exists anywhere in the corpus -- same class of honestly-flagged gap as champion-challenger.recipe.yaml's own promotion_decision output"

open_questions:
  - id: "OQ-RQV1-1"
    question: >
      This Recipe's 7-step union of List A and List B is this file's own
      reconciliation choice, not a mother-document-stated design. Should a
      future review confirm this is the CORRECT reconciliation (as opposed
      to, e.g., dropping `literature_search` entirely and instead relaxing
      `evidence.triangulation.contract.yaml`'s own `literature` input to
      OPTIONAL for research contexts that only need coder-to-coder
      triangulation, not literature triangulation)?
    owner: "operator, or a future review pass specifically on this Recipe's List-A/List-B union design"
    blocks: "nothing in this file's own validity -- both source constraints (List A's evidence.triangulation contract, List B's real method/capability choices) are satisfied as written"
  - id: "OQ-RQV1-2"
    question: >
      MVP's own literal walkthrough order (§3 step 16, L79) places
      `run_statistics` AFTER `evidence.triangulation`; this file's normative
      `steps:` block places it BEFORE (the standard qualitative-research
      practice: check inter-rater reliability on RAW open-coding output
      before further synthesis and before triangulating with literature, so
      a low-reliability coding scheme is caught early). The prose above was
      corrected 2026-09-04 to describe the block truthfully (OQ-P5-6; until
      then it claimed the file followed MVP's order literally while the
      block did not). Still open: should the block be flipped back to MVP's
      literal order for fidelity, or should MVP_VERTICAL_SLICE_PLAN.md §3
      step 16 be corrected to the methodologically standard order the block
      already uses? MVP's own text never states a rationale for its ordering.
    owner: "operator, or a future review pass once a real coding session exposes whether either order causes wasted downstream work"
    blocks: "nothing in this file's own validity -- the block is what compiles; the runtime's unit tests pin the 7-node order (Projects/internal/cognitive-engineering-os/tests/unit/test_workflow_ir_and_resolver.py)"
  - id: "OQ-RQV1-3"
    question: >
      `ResearchMemoArtifact` (final step's conceptual output) has no
      corresponding `cognitive/typed-objects/*.schema.yaml` file. Should a
      future Wave add one, mirroring `board-decision-pack.schema.yaml`'s own
      already-named-as-candidate status for a different rich Recipe output
      (recipe.schema.yaml's own `outputs` field description, §13.4)?
    owner: "operator, via a future Phase 3/4 typed-objects compilation pass"
    blocks: "nothing in this file's own validity -- outputs stays a flat, soft-referenced string list either way"


$id: "ai-lego://capabilities/contracts/artifact.generate_report.capability.yaml"
title: "artifact.generate_report -- Project-bound versioned research report rendered from a synthesis artifact and its recipe run results"
status: DRAFT
description: >
  Context-bound capability, not a Recipe node and never registered in the
  pure Recipe capability adapters (P-K1, RESEARCH_LINES_MASTER_PLAN.md
  §12.8). Pure function: one synthesis artifact plus its recipe run results
  render a versioned ResearchReport with a markdown body. Every citation
  must resolve to a manifest source entry (id, sha256, url, fetched_at) via
  the `report_refs_resolvable` gate, or the report records the unresolved id
  in `problems.invalid_refs` instead of softening it away -- stricter than
  NA/lib/dossier/report.ts's `[?]` rewrite (§2-I3). DRAFT: no HTTP endpoint,
  no PDF export, and no `report_state` promotion to HUMAN_APPROVED in this
  version -- that endpoint and its `ReportApproved` event are later P4 work
  (WC-P4-01, early).
source_of_truth_for:
  - "RESEARCH_LINES_MASTER_PLAN.md §3.4-C6, §2-I5 and WC-P4-01"
decided_by: "P4 WC-P4-01 (early): report renderer context-bound capability"
id: artifact.generate_report
version: "1.0.0"
input:
  type: [SynthesisArtifact, RecipeRunResult]
output:
  type: [ResearchReport]
quality:
  provenance_required: true
rollback:
  side_effect_free_preferred: true
  artifact_is_immutable: true

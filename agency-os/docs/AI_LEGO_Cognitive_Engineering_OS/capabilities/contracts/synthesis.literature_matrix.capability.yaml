$id: "ai-lego://capabilities/contracts/synthesis.literature_matrix.capability.yaml"
title: "synthesis.literature_matrix -- Project-bound AI literature-matrix synthesis from the Source prompt manifest"
status: ACTIVE
description: >
  Context-bound capability for the dedicated literature-matrix-synthesis
  endpoint. It is not a Recipe node and is never registered in the pure
  Recipe capability adapters (same precedent as interpret.method_record --
  RESEARCH_LINES_MASTER_PLAN.md §12.8 P-K1). The server builds a Source
  prompt manifest (source_manifest.py, P-a), runs the champion
  synthesis-prompts/literature_matrix prompt through the provider,
  resolves `[n]` citations against the manifest, validates the result
  against literature-matrix.schema.yaml, and gates it with
  citation_integrity before storing a LiteratureMatrix artifact. Runtime:
  POST /projects/{id}/synthesis with body {kind, subject} (202, background
  run; GET /projects/{id}/synthesis/{synthesis_id} reads PENDING / DONE /
  FAILED) calls ai_lego.modules.research.synthesis.run_synthesis (WC-P2-05)
  and refuses the request while this contract is not ACTIVE (WC-P2-06).
source_of_truth_for:
  - "RESEARCH_LINES_MASTER_PLAN.md §12.8 P2 WC-P2-02 (this contract) and WC-P2-06 (the endpoint; promoted it to ACTIVE)"
decided_by: "P2 WC-P2-02: three synthesis typed objects + DRAFT capability contracts"
id: synthesis.literature_matrix
version: "1.0.0"
input:
  type: [SynthesisRequest]
output:
  type: [LiteratureMatrix]
preconditions:
  - "project has at least one active Source"
  - "provider configured, otherwise 503"
  - "daily AI token budget has not been exceeded"
quality:
  provenance_required: true
  method_specific_gate_required: true
security:
  external_ai: policy_controlled
rollback:
  side_effect_free_preferred: false
  artifact_is_immutable: true

decided_by: >
  No ADR governs this file's content -- there is no ADR to arbitrate, since
  no mother document ever gave `run_statistics` a populated Contract for an
  ADR to rule between competing versions of. Authorized directly by
  `docs/architecture/MVP_VERTICAL_SLICE_PLAN.md` §4 (L121, "Inter-rater
  reliability 統計方法契約") and §6 risk 4 (L145, which explicitly assigns
  the job of pinning the formula/threshold to "Phase 3 Method Contract"),
  itself ratified for the Research Mode slice by
  `docs/adr/ADR-014-phase-5-mode-selection-research.md` (ACCEPTED
  2026-08-30). The STATISTIC and its published interpretation scale are real
  external academic standards, cited by name; the PROJECT-SPECIFIC
  accept/reject cutoff is an operator policy choice, explicitly left unset
  per the same restraint this corpus's `policies/security/*.policy.yaml`

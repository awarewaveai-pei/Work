title: "run_statistics -- Inter-rater Reliability (Cohen's Kappa) Capability Contract"
status: ACTIVE

description: >
  Concrete instance of the `run_statistics` Capability -- one of the 13
  bare-named capabilities Master Plan §8.1/§8.2 (L651-689) list but never
  populate with a real Contract (the corpus's ONLY populated Capability
  Contract example is `cognitive.execute_method`, MP §8.3 L701-729,
  transcribed in `specs/domain/capability-contract.schema.yaml#/worked_example`).
  This file is the second real, concrete Capability Contract instance in the
  corpus, and the first for `run_statistics` specifically -- built per this
  task's explicit instruction: "MVP's own text says this [inter-rater
  reliability] is invoked via `run_statistics` (a Trusted-Compute-gated
  capability...) -- NOT a new Atlas cognitive Method." `run_statistics` as a
  bare name is presumably general-purpose (any statistical procedure), but
  MP gives it zero field content anywhere -- this file instantiates it
  SPECIFICALLY for the one statistical procedure the Phase 5 Research Mode
  MVP slice actually needs: computing inter-rater agreement between two
  independent qualitative coders' `research.qualitative_coding` outputs
  (`methods/contracts/research.qualitative_coding.contract.yaml`'s own
  `inter_rater_reliability_requirement` field cross-references this exact
  file). A fuller, multi-procedure `run_statistics` contract (t-test,
  regression, ANOVA, ...) is explicitly out of scope here -- see
  `open_questions.OQ-RSTAT-1`.

  **New top-level directory**: `capabilities/contracts/` did not exist before
  this file. It mirrors the established `methods/contracts/`/
  `recipes/validated/` convention (a top-level, plural, instances-only
  directory sitting alongside the `specs/` directory that holds only
  SCHEMAS) -- `specs/domain/capability-contract.schema.yaml` is the schema;
  this is the first real, standalone Capability Contract INSTANCE file, the
  same schema/instance split every other LEGO dimension in this repo already
  uses. See `open_questions.OQ-RSTAT-2` for why this was not instead placed
  inside `methods/contracts/` (that directory's own golden-test conformance
  check dispatches purely on `cognitive_primitives` vs `labels` -- a
  Capability Contract instance has neither key and would fail that
  dispatch).

  **Grounding sources, cited by name, real and externally verifiable** (per
  this task's explicit instruction, the same discipline this corpus's
  `policies/security/*.policy.yaml` files already apply for NIST/OpenSSF/
  CISA-class citations):
  - Cohen, J. (1960). "A coefficient of agreement for nominal scales."
    *Educational and Psychological Measurement*, 20(1), 37-46. -- the
    original definition of the Kappa statistic this capability computes.
  - Landis, J.R. & Koch, G.G. (1977). "The measurement of observer agreement
    for categorical data." *Biometrics*, 33(1), 159-174. -- the standard
    published interpretation scale for Kappa values (poor / slight / fair /
    moderate / substantial / almost perfect), transcribed verbatim below,

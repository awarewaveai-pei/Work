$id: "ai-lego://methods/contracts/strategy.three_c.contract.yaml"
title: "3C Analysis Method Contract"
status: ACTIVE

description: >
  Tier 1, F08 `strategy` family (2nd member after `strategy.swot`). Atlas F08
  table row (L517) + §12.12 (L2679-2686) are this method's ONLY citations --
  thinner than SWOT's own §11.7 (no per-item geography/time/source given).
  Core invariants: `findings` covers all 3 fixed dimensions (Customer/
  Competitor/Company -- a record missing one whole C has not done a 3C
  analysis) and `fit_summary` is a required, disclosed conclusion (Atlas's
  own defining purpose IS "找 fit").

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F08 tool table, 3C row (L517: '3C｜Customer/Competitor/Company｜三面向分析→找 fit｜快速商業定位｜SWOT/TOWS')"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §12.12 3C 分析 (L2679-2686) -- same content restated, second location, both read and cross-checked word-for-word"
  - "methods/contracts/strategy.swot.contract.yaml -- same family, 1st member, category-enum/quality/id-pattern conventions reused here"
  - "methods/contracts/causal.rct.contract.yaml -- disclosure-only field precedent (fit_summary modeled on analysis_summary) reused here"
  - "specs/cognitive/method.schema.yaml -- the schema this file's body is validated against"

decided_by: >
  No ADR governs the content. Direct transcription of Atlas's own two
  citations (both read in full, cross-checked word-for-word, no
  discrepancy found) into 3 fixed dimensions + a required fit disclosure;
  `id: strategy.three_c` mints a new machine_id (digits are illegal in the
  `<family>.<name>` grammar per method.schema.yaml's own pattern, so "3C"
  becomes "three_c"). Registered in `methods/registry/contract-backlog.yaml`
  `tier_1`.

id: strategy.three_c
version: "1.0.0"
family: strategy

cognitive_primitives: [CLASSIFY, COMPARE]
# INFERRED, not cited (Atlas §4 gives no composition formula for 3C, unlike
# SWOT's own L190 "SWOT = CLASSIFY + COMPARE + CONTEXTUALIZE"). Grounded
# word-for-word in 3C's own citation: "三面向分析" (classify the situation
# into 3 fixed dimensions) = CLASSIFY; "→找 fit" (compare across the 3 to
# find alignment) = COMPARE. CONTEXTUALIZE deliberately NOT reused from
# SWOT's formula -- neither Atlas citation for 3C mentions the
# geography/time context SWOT's own L1332 usage step names.

purpose:
  - establish_a_basic_business_strategy_framework_via_customer_competitor_company_fit
# Atlas §12.12 verbatim sense: "快速建立商業策略基本框架" (quickly establish
# a basic business strategy framework); L517 benefit column: "快速商業定位"
# (quick business positioning) -- both folded into one purpose label.

inputs:
  required: []
  optional: []
  # Neither Atlas citation names an upstream typed-object dependency for 3C
  # (contrast SWOT's own explicit §14.1 KnowledgeSet->SWOT chain) -- same
  # self-contained-method precedent causal.rct/causal.logic_model already
  # establish for an analogous thin, standalone citation.

outputs:
  - ThreeCAnalysis
# NEW output type (see typed-objects/three-c-analysis.schema.yaml). Neither
# Atlas citation gives this method's output a PascalCase name.

preconditions:
  - "findings includes at least one entry for each of CUSTOMER, COMPETITOR, and COMPANY -- Atlas's own '三面向' (three dimensions, §12.12) is the method's defining split; a record missing a whole dimension has not actually done a 3C analysis"
  - "fit_summary is a non-empty string -- Atlas's own '→找 fit' (L517) is 3C's whole stated purpose; a record that never states the fit conclusion has not delivered on the method's own citation"

quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class causal.rct.contract.yaml's own quality block establishes:
  # the real risk this method's citations name is missing dimension
  # coverage / missing fit disclosure (both are the 2 preconditions above),
  # not a missing per-claim evidence citation -- neither Atlas citation for
  # 3C carries a misuse warning about unevidenced claims (contrast SWOT's
  # own explicit L1356 "沒有 Evidence 就寫...").

forbidden_transition: []
# Neither Atlas citation for 3C gives a §14.1-style illegal-transition
# example (that example, `SWOT -> AutomaticProductionDeployment`, is
# SWOT's own field). Left empty and disclosed rather than applied to 3C by
# unverified analogy.

recommended_next:
  - strategy.swot
# Atlas's own explicit pairing, both citations: L517 last column "SWOT/TOWS";
# §12.12 搭配 "3C → SWOT/TOWS → Strategy". Only strategy.swot listed -- it is
# the one method of the pair with a real ACTIVE contract today; TOWS has no
# machine-readable id or contract yet (strategy.swot.contract.yaml's own
# OQ-SWOT-1 already discloses this same gap).

rollback:
  side_effect_free: true
  # Pure analysis/knowledge-object production, no external side effect named
  # by either citation -- same low-risk inference class
  # strategy.swot.contract.yaml's own rollback field already applies.

compilation_decisions:
  - question: "Free-form dimension or closed 3-value enum?"
    decision: "Closed enum {CUSTOMER, COMPETITOR, COMPANY} -- both Atlas citations name these three, by name, as the method's own defining split (same class SWOT's own 4-value category enum)."
  - question: "Should findings carry evidence_labeling (supporting_evidence_refs) like SWOT's factors?"
    decision: "No -- neither Atlas citation for 3C carries SWOT's own explicit unevidenced-claim misuse warning (L1356); evidence_labeling_required: false, matching causal.rct's precedent for a thin citation with no cited evidence-misuse risk."
  - question: "Should fit_summary be computed/algorithmic or disclosed reported content?"
    decision: "Disclosed only -- no algorithm can honestly compute 'business fit' from qualitative findings, same restraint causal.rct's analysis_summary and causal.dag's own disclosure-only fields already establish."
  - question: "Should dimension coverage (>=1 finding per C) be schema-enforced too, or runtime-only?"
    decision: "Both -- schema-level contains/minContains (x3, one per dimension) as belt-and-suspenders alongside the Python builder + independent gate, same layered technique decision-journal-entry.schema.yaml's own options contains/minContains/maxContains constraint already establishes."
  - question: "inputs.required -- empty, or KnowledgeSet like SWOT?"
    decision: "Empty -- neither Atlas citation for 3C names an upstream typed-object dependency (unlike SWOT's own explicit §14.1 chain); same self-contained-method precedent causal.rct/causal.logic_model already establish."

open_questions:
  - id: "OQ-THREEC-1"
    question: "cognitive_primitives [CLASSIFY, COMPARE] is inferred word-for-word from the citation, not a cited Atlas §4 composition formula (no §4 entry exists for 3C)."
    owner: "operator, or whoever adds a dedicated Atlas §4 formula for this method, if one is ever written"
    blocks: "nothing in this file's own validity"
  - id: "OQ-THREEC-2"
    question: "recommended_next names only strategy.swot (real, ACTIVE); Atlas's own citation also names TOWS ('3C → SWOT/TOWS'), but strategy.tows has no contract yet (strategy.swot.contract.yaml's own OQ-SWOT-1 already discloses the same gap)."
    owner: "whoever backfills strategy.tows"
    blocks: "nothing in this file's own validity"
  - id: "OQ-THREEC-3"
    question: "forbidden_transition is left empty -- should a future pass generalize SWOT's own SWOTAnalysis->AutomaticProductionDeployment guard to ThreeCAnalysis by analogy, given 3C feeds directly into SWOT?"
    owner: "operator"
    blocks: "nothing in this file's own validity"

verification:
  method: >
    Read Atlas F08 table (L511-528, 3C row L517) and §12.12 (L2679-2688)
    directly at the cited lines. Grepped the whole Atlas file for "3C" --
    7 total hits: L517 (the table row), L1107/L3362/L4476 (cross-references
    inside OTHER methods' own pipelines/tables, naming 3C as a component,
    giving no new structural content), and L2679/L2681/L2685 (§12.12 itself).
    Grepped the whole `ai_lego` tree and this docs tree case-insensitively
    for "three_c"/"3C analysis" before writing any of this method's own
    files -- zero pre-existing implementation (4 unrelated "three_c*"
    substring false-positive hits in test_pdca.py/test_fault_tree.py/
    test_attack_tree.py/test_causal_dag.py -- all "test_three_cycle*" or
    similar -- and 2 in mcda-analysis.fixtures.yaml/ahp-analysis.fixtures
    .yaml -- "three_criteria" -- all confirmed non-matching). Read
    strategy.swot.contract.yaml and causal.rct.contract.yaml in full before
    writing this contract, reusing their conventions rather than inventing
    new ones. Validated against specs/cognitive/method.schema.yaml with
    jsonschema.Draft202012Validator via a standalone script.
  note: >
    No mother document was modified. Atlas's own two citations are
    transcribed verbatim into `purpose`/`preconditions`/`recommended_next`.
    The 3-dimension flat-findings shape, the required (not optional)
    `fit_summary` field, and the contains/minContains schema-level coverage
    check are Phase 3 compilation choices, explicitly flagged above in
    `compilation_decisions`, not presented as Atlas-cited.

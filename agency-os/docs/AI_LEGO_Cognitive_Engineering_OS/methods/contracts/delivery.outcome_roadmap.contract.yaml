  themes→outcomes→bets→evidence→review | 保持策略彈性"). Real invariant:
  referential integrity made structural, BY CONSTRUCTION enforcing "outcomes
  not features" -- every `outcome` must trace to a declared `theme`, and
  every `bet` must trace to a declared `outcome` (same dangling-reference
  check class `foresight.cross_impact_analysis`'s own referential-integrity
  gate already establishes). A `bet` with no `outcome` parent, or an
  `outcome` with no `theme` parent, IS exactly a feature-driven roadmap entry
  sneaking in under a different label -- precisely what L925's own "保持策略
  彈性" benefit column exists to prevent.


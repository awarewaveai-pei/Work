id: strategy.value_proposition_canvas
version: "1.0.0"
family: strategy

cognitive_primitives: [DECOMPOSE, RELATE, EXPLAIN]
# INFERRED, not cited -- Atlas §4 gives no composition formula for this method. Customer Profile / Value
# Map are each DECOMPOSE (breaking a customer or an offering into named jobs/pains/gains or
# products/relievers/creators); fit_hypotheses is RELATE (pairing a reliever/creator against a real
# pain/gain) + EXPLAIN (the disclosed fit_rationale content, same sense strategy.tows's own EXPLAIN
# primitive already carries for its disclosed strategy_option).

purpose:
  - align_customer_jobs_pains_gains_with_a_solutions_value_map_to_improve_product_market_fit
# Atlas L528 verbatim sense: "customer jobs/pains/gains 對齊方案" + benefit column "提高 product-market fit".

inputs:
  required: []
  optional: []
  # Atlas's own citation names JTBD/Prototype as the best-pairing column (L528, col 5), but grep-confirmed
  # (this task, before writing any file) neither a `jtbd.*` nor a `prototype.*` contract/typed-object
  # exists anywhere in this spec root -- same self-contained-method precedent strategy.stp's own
  # inputs.required: [] already establishes for an analogous thin citation naming a not-yet-built companion.

outputs:
  - ValuePropositionCanvas
# NEW output type (see typed-objects/value-proposition-canvas.schema.yaml). Atlas gives this method's
# output no PascalCase name anywhere, same honesty gap every other thin-citation Tier 1 F08 contract
# already discloses.

preconditions:
  - "jobs is non-empty -- Atlas's own literal 'customer jobs/pains/gains' (L528) names all 3 as the Customer Profile side's defining split; a canvas missing jobs has not built a Customer Profile (VPC_EMPTY_JOBS)"
  - "pains is non-empty (VPC_EMPTY_PAINS) -- same citation, 2nd of the 3 named words"
  - "gains is non-empty (VPC_EMPTY_GAINS) -- same citation, 3rd of the 3 named words"
  - "products_and_services is non-empty (VPC_EMPTY_PRODUCTS_AND_SERVICES) -- real, standard Osterwalder Value Map sub-structure (see compilation_decisions); Atlas's own citation names 'Value map' only as one blob, not broken into 3 parts"
  - "pain_relievers is non-empty (VPC_EMPTY_PAIN_RELIEVERS) -- same Value Map sub-structure, 2nd part"
  - "gain_creators is non-empty (VPC_EMPTY_GAIN_CREATORS) -- same Value Map sub-structure, 3rd part"
  - "every jobs/pains/gains/products_and_services/pain_relievers/gain_creators entry carries a non-empty id (unique within its own array) and a non-empty statement (VPC_*_MISSING_ID / VPC_DUPLICATE_*_ID / VPC_*_MISSING_STATEMENT)"
  - "no id is reused across pains and gains (VPC_ID_COLLISION_PAIN_GAIN) -- fit_hypotheses.pain_or_gain_id must resolve unambiguously into exactly one of the two collections"
  - "no id is reused across pain_relievers and gain_creators (VPC_ID_COLLISION_RELIEVER_CREATOR) -- same unambiguous-resolution requirement for fit_hypotheses.reliever_or_creator_id"
  - "fit_hypotheses is non-empty -- Atlas's own citation's literal, final 3rd pipeline stage (L528: '→fit hypotheses') (VPC_EMPTY_FIT_HYPOTHESES)"
  - "every fit_hypotheses entry's reliever_or_creator_id resolves to a real id in pain_relievers[] or gain_creators[] (VPC_UNKNOWN_RELIEVER_OR_CREATOR_ID)"
  - "every fit_hypotheses entry's pain_or_gain_id resolves to a real id in pains[] or gains[] (VPC_UNKNOWN_PAIN_OR_GAIN_ID)"
  - "fit_type is never caller-supplied (VPC_FIT_TYPE_MUST_NOT_BE_CALLER_SUPPLIED) -- always computed from the two referenced ids' real collection membership"
  - "a pain_reliever may only pair with a pain, and a gain_creator may only pair with a gain (VPC_FIT_TYPE_MISMATCH) -- a reliever addressing a 'gain' or a creator addressing a 'pain' is not a coherent fit hypothesis"
  - "fit_rationale is a non-empty disclosed string per hypothesis (VPC_EMPTY_FIT_RATIONALE) -- a fit_type label with no disclosed reasoning has not demonstrated real fit, only asserted a category"

quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class decision strategy.tows/strategy.stp's own quality blocks already establish: the real risk
  # this citation names is referentially-broken or mismatched fit claims (the preconditions above), not a
  # missing per-claim evidence citation -- Atlas's L528 row carries no misuse warning about unevidenced
  # jobs/pains/gains content.


compilation_decisions:
  - question: "Flat 6 top-level arrays (jobs/pains/gains/products_and_services/pain_relievers/gain_creators), or 2 nested customer_profile/value_map objects?"
    decision: "Flat -- matches this family's established flat-field convention (strategy.tows/strategy.stp), avoids a redundant additionalProperties:false layer on 2 wrapper objects that add no new invariant."
  - question: "Should pain_relievers/gain_creators carry their own relieves_pain_id/creates_gain_id field directly, or should the reference live only in a separate fit_hypotheses[] collection?"
    decision: "Reference lives ONLY in fit_hypotheses[] -- mirrors strategy.tows's own pairings[] design (SWOT factors carry no mutual cross-reference; TOWS's pairings[] is the sole cross-referencing collection), avoiding two reference paths that could silently drift."
  - question: "Should Value Map be broken into products_and_services/pain_relievers/gain_creators (3 parts), matching Customer Profile's 3-part jobs/pains/gains, even though Atlas's own citation names 'Value map' as one blob?"
    decision: "Yes -- real, standard Osterwalder Value Proposition Canvas structure (independently verified business-strategy knowledge, same discipline every VRIO/Ansoff-class method in this batch already applied), disclosed here as NOT Atlas-cited at this granularity rather than presented as transcribed."
  - question: "Should fit_type be a caller-settable field (accept + validate + refuse on mismatch), or always computed?"
    decision: "Always computed -- the fit_hypothesis() constructor has no fit_type parameter at all; generate_value_proposition_canvas derives it via derive_fit_type, an independent gate re-derives it from raw fields. Same structural elimination strategy.tows's own pairing_type treatment already establishes."
  - question: "A separate top-level fit_summary disclosure field (matching strategy.three_c's own restraint), or the referential fit_hypotheses[] design?"
    decision: "Referential fit_hypotheses[] design -- Atlas's own citation explicitly names 'fit hypotheses' as a distinct, final pipeline stage (not merely an implicit outcome, unlike 3C's bare '→找 fit'), making a real structural, checkable per-hypothesis design more faithful to this specific citation than a single free-prose summary field."

open_questions:
  - "OQ-VPC-1: cognitive_primitives [DECOMPOSE, RELATE, EXPLAIN] is this file's own inference -- Atlas §4 gives no composition formula for this method. (owner: operator)"
  - "OQ-VPC-2: inputs.required / recommended_next are both empty: Atlas L528's own JTBD/Prototype companions have no contract/typed-object anywhere in this spec root yet. (owner: operator, or whoever next backfills JTBD/Prototype)"
  - "OQ-VPC-3: fit_hypotheses only references pains/gains, never jobs or products_and_services directly -- matches real Osterwalder VPC theory (Pain Relievers/Gain Creators pair against Pains/Gains, not Jobs), but this is independently-verified domain knowledge, not a distinction Atlas's own thin citation itself draws. (owner: operator)"


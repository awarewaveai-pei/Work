description: >
  learning.prediction_tracking, F17, 9th and LAST member -- CLOSES F17 9/9.
  Atlas L809: prediction→horizon→actual→error, "改善 calibration". Distinct
  from learning.decision_journal (bare single prediction, no options/choice
  structure). Cross-record calibration-curve aggregation is Atlas's own
  SEPARATE F10 row (L578 "Confidence Calibration", not yet built) -- out of

  method: >
    Read Atlas §11.26 (L1775-1801) and the F12 index row (L650) directly
    at the cited lines. Grepped the full spec root
    (`agency-os/docs/AI_LEGO_Cognitive_Engineering_OS` and
    `Projects/internal/cognitive-engineering-os`) case-insensitively for
    "fmea" before writing this contract -- zero pre-existing
    implementation or contract-backlog entry (only Atlas's own text,
    method-inventory.yaml's pending placeholder, and ADR-002/ADR-007's own
    unrelated borrowed-FMEA prose in policy docs). Validated against
    `specs/cognitive/method.schema.yaml` with
    `jsonschema.Draft202012Validator` (`tests/unit/test_fmea.py`).
  note: >
    No mother document was modified. The 9-stage pipeline and the

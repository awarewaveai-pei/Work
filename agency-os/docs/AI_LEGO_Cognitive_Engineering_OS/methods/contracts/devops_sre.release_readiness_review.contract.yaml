$id: "ai-lego://methods/contracts/devops_sre.release_readiness_review.contract.yaml"
title: "Release Readiness Review Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry. Thirty-second Method Atlas slice, SEVENTH from
  the `devops_sre` family (F19), after `devops_sre.sli_slo` (twentieth),
  `devops_sre.canary_deployment` (twenty-first),
  `devops_sre.chaos_engineering` (twenty-second),
  `devops_sre.blue_green_deployment` (twenty-third),
  `devops_sre.error_budget` (twenty-fourth), and
  `devops_sre.capacity_model` (thirty-first).

  Atlas gives this method exactly ONE citation: the F19 tool table's
  own Release Readiness Review row (L862: "change/data/security/
  observability/rollback/capacity", benefit "防漏掉跨域風險" -- prevent
  missing cross-domain risk). No dedicated §11.x section exists
  (confirmed by direct read of the surrounding table, L845-863, and a
  full-document heading grep for "Release Readiness"/"上線前"/"發布前"
  returning only this table row). Atlas §22.3's own Method-specific
  Gate table (L4144-4155) has no Release Readiness Review row.

  CORRECTED post-critic-review: this contract's first draft grepped
  only "release.readiness"/"go.live"/"readiness.review" case-
  insensitive and concluded "no duplicate found" from that narrow
  literal-term search (whose only hit, `error-budget-record.schema
  .yaml`'s own `release_policy` field, is indeed a distinct, narrower
  concept -- release VELOCITY restricted by SLO error-budget burn, not
  a cross-domain checklist). That search was too narrow: it never
  searched for "release checklist"/"pre-release" terms, and a critic
  review found `policies/ai-execution/release-policy.yaml` (status:
  ACTIVE) already carries a `pre_release_checklist` transcribing EC
  §143's own 11-item Pre-release Checklist verbatim -- FIVE of Atlas's
  own six domains map closely onto items there ("Change matches plan"/
  "No scope creep" -> change; "Data PASS"/"Migration PASS" -> data;
  "Security PASS" -> security; "Observability ready" -> observability;
  "Rollback ready" -> rollback; only `capacity` has no EC §143
  counterpart). This is NOT a duplicate of this method's own
  deliverable -- `release-policy.yaml` is POLICY-AS-CODE binding which
  PLATFORM GATES are mandatory for a release (a different layer,
  governed by EC §143/§144 and ADR-011's gate-catalog wiring), not a
  Method Atlas typed-object producing a cognitive REVIEW RECORD
  instance the way this method does -- but it is the same real-world
  CONCEPT (what must be true before a release) modeled at a different
  layer, and this contract's first draft should have found and
  disclosed it rather than silently missing it. See
  compilation_decisions below for the full disclosed relationship.

  The formula's own six named domains (change/data/security/
  observability/rollback/capacity) are a CLOSED, exhaustive set --
  Atlas lists exactly six, not "at least these" or "for example" --
  and the benefit column's own text ("防漏掉跨域風險", prevent MISSING
  cross-domain risk) directly implies the real invariant this contract
  enforces: a review record must assess ALL SIX domains, no fewer, no
  duplicates, and no domain outside this closed set -- a review that
  silently skips one domain is exactly the "漏掉" (missed) failure this
  method exists to prevent. The row's own 主要用途 (used-for) column
  text, "上線前統一檢查" (a UNIFIED pre-release check), implies the
  aggregation rule: `overall_status: ready` requires
  every one of the six domain assessments to itself be `ready` -- one
  failing domain blocks the unified verdict, the same "one domain's own
  failure state propagates to the whole" pattern
  `devops_sre.canary_deployment`'s own unhealthy-forbids-completed
  invariant already established for a structurally analogous
  aggregation.


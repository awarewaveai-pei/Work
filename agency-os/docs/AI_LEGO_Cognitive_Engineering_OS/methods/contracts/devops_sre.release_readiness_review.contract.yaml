    owner: "operator, or whoever next wires cross-method soft links for this family"
    blocks: "nothing in this file's own validity"
  - id: "OQ-RELEASEREADINESS-3"
    question: >
      `policies/ai-execution/release-policy.yaml`'s own
      `pre_release_checklist` (EC §143, 11 items) and this method's
      own six-domain formula (Atlas F19 L862) independently ground the

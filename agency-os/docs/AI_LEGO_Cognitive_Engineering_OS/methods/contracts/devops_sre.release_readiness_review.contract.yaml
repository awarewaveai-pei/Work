id: devops_sre.release_readiness_review
version: "1.0.0"
family: devops_sre

cognitive_primitives: [DECOMPOSE, VALIDATE, MAP]
# INFERRED, not cited (Atlas gives no §4-style composition formula for
# this method). The six named domains handled as distinct assessments
# is DECOMPOSE; each domain's own ready/not_ready verdict plus the
# aggregate unified verdict is VALIDATE; the fixed, closed six-domain
# set is MAP -- the same inferred triple every prior structured-
# checklist method this session built already uses.

purpose:
  - prove_every_one_of_the_six_canonical_release_domains_was_assessed_and_the_unified_verdict_reflects_the_worst_one
inputs:
  required: [ReleaseReadinessDomainAssessment]
  optional: []
outputs: [ReleaseReadinessReviewRecord]
preconditions:
  - "domain_assessments contains EXACTLY the six canonical domains (change, data, security, observability, rollback, capacity) -- no fewer, no duplicates, no domain outside this closed set"
  - "every domain assessment whose verdict is not_ready carries a non-empty note (a failing domain must say why, not silently fail)"
  - "overall_status:ready requires EVERY domain assessment's own verdict to be ready"
  # The last precondition is directly implied by "統一檢查" (a unified
  # check) -- a review cannot claim the release is ready while one of
  # its own six assessed domains says otherwise. DELIBERATELY
  # ONE-DIRECTIONAL, same class of restraint `database_data.backup_
  # restore_drill`/`database_data.reconciliation`'s own status fields
  # already established: a caller MAY conservatively declare
  # overall_status:not_ready even when all six domains are individually
  # ready -- e.g. pending a separate human sign-off, or a business
  # reason outside the six technical domains -- Atlas's own text never
  # forbids that conservative choice.
quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class of departure every structured-checklist contract in
  # this package already reasons through: the real risk is
  # completeness/aggregation integrity (was every domain actually
  # assessed, does the unified verdict actually reflect the worst
  # domain), not an evidence-citation risk over a narrative claim.
forbidden_transition: []
# Atlas §22.3's own gate table has no Release Readiness Review row.
recommended_next: []
# Atlas gives no explicit 推薦搭配 chain for this method. A real,
# disclosed (not built) relationship: the `capacity` domain assessed
# here could in principle be backed by a real
# `devops_sre.capacity_model` record's own `status` field -- see
# OQ-RELEASEREADINESS-2, the same soft-link pattern `devops_sre
# .error_budget`'s own `related_slo_id` already established.
rollback:
  side_effect_free: true
  # The RECORD itself is side-effect-free -- it reports on assessments
  # performed elsewhere (the actual security review, observability
  # check, etc. happen outside this method's own scope), the same
  # "record reports on an external observation" class every prior
  # devops_sre contract's own rollback field already draws.

compilation_decisions:
  - question: >
      Atlas's own formula lists six domains in a specific order
      (change/data/security/observability/rollback/capacity) -- should
      `domain_assessments` be a fixed-order array (positional, index 0
      = change, etc.) or an unordered set of six distinct domain-tagged
      entries?
    decision: "Unordered set of six distinct domain-tagged entries -- each entry carries its own `domain` enum field, not a positional slot."
    reasoning: >
      Atlas's own formula uses "/" to separate the six domains, the
      same punctuation every prior thin-table-row method's own
      multi-item formula already uses for an UNORDERED list (e.g.
      `database_data.reconciliation`'s own "counts/checksums/business
      invariants"), not "→" (which this same table's OTHER rows use for
      genuinely sequential steps). A positional array would invent an
      ordering requirement Atlas's own punctuation does not support,
      and would make the completeness check (all six present) harder
      to verify robustly than a simple set-of-six-distinct-tags check.
  - question: >
      Should a domain assessment's own `verdict` support a third value
      (e.g. `not_applicable`, for a release that genuinely has no data
      migration or no security-relevant change) rather than a strict
      binary ready/not_ready?
    decision: "No -- binary ready/not_ready only, no not_applicable escape hatch."
    reasoning: >
      Atlas's own benefit text is "防漏掉跨域風險" (prevent MISSING
      cross-domain risk) -- an unconditional not_applicable option
      would reopen exactly the gap this method exists to close (a
      reviewer could mark every domain not_applicable and still claim
      overall_status:ready with zero real assessment). A domain
      genuinely irrelevant to a given release is still an assessment
      decision a human makes and records as `ready` with a note
      explaining why (e.g. "no data migration in this release"), not a
      silent skip -- consistent with this contract's own note
      requirement design (see preconditions) even though that
      requirement is currently only enforced for not_ready.
  - question: >
      `policies/ai-execution/release-policy.yaml` (status: ACTIVE)
      already carries a `pre_release_checklist` transcribing EC §143's
      own 11-item Pre-release Checklist verbatim, five of whose items
      map closely onto five of Atlas's own six domains here (a critic
      review found this contract's first draft's due-diligence grep
      too narrow to surface it). Should this method's own six-domain
      typed object be REPLACED by, or built as a thin wrapper around,
      that policy file's own checklist instead of an independent
      cognitive-layer schema?
    decision: "No -- kept as a separate, independent Method Atlas typed object, not merged with or wrapping the policy file."
    reasoning: >
      The two serve genuinely different layers, not the same concern
      twice: `release-policy.yaml` is POLICY-AS-CODE binding WHICH
      PLATFORM GATES are mandatory before a release (its own
      `mandatory_gate_rules`/`grounded_rules` reference
      `gate.schema.yaml#/gate_catalog` ids directly, per ADR-011) --
      an execution-layer compliance artifact. This method produces a
      COGNITIVE REVIEW RECORD (`ReleaseReadinessReviewRecord`) -- a
      structured human/AI judgment call per domain, the same class of
      artifact every other Method Atlas slice this session produces,
      consumed by a different part of the system than a gate-
      resolution engine. Atlas's own six-domain formula and EC §143's
      own 11-item checklist are two independently-grounded citations
      for the SAME real-world concern (what must be true before a
      release), at two different SSOT layers Atlas/EC's own document
      split already establishes elsewhere (e.g. Atlas §11.x concept
      sections routinely redirect to an EC section for "the precise
      step sequence", the same split `database_data
      .expand_contract_migration`'s own citation work already
      encountered) -- not a reason to collapse either into the other.
      The one domain with no EC §143 counterpart (`capacity`) is Atlas's
      own addition, further evidence the two lists are related but not
      identical.


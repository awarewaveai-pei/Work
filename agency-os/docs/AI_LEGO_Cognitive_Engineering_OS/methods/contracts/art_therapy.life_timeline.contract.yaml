$id: "ai-lego://methods/contracts/art_therapy.life_timeline.contract.yaml"
title: "Life Timeline Method Contract"
status: ACTIVE

description: >
  art_therapy.life_timeline (生命時間線／反向時間軸). GROUNDED ORIGINAL DESIGN: not in the Method Atlas mother document; source is the
  operator's 54-item art-therapy tool list (ART_THERAPY_METHOD_ATLAS_GAP_LIST.md), Timeline / Reverse Timeline row,
  therapeutic use "建立過去－現在－未來的因果脈絡". Not an EC §32 method. Core invariant: one dated "now" anchor splits the
  events into past/present/future (phase is COMPUTED from the dates, never asserted); >= 1 past and >= 1 future event;
  the listed order matches the chosen direction (forward = oldest first, backward = from the wished-for future back to
  today); every future event names a first step that can start now. Non-diagnostic: the client's own words only.

source_of_truth_for:
  - "ART_THERAPY_METHOD_ATLAS_GAP_LIST.md -- Timeline / Reverse Timeline row (operator-supplied therapeutic use)"
  - "specs/cognitive/typed-objects/life-timeline-record.schema.yaml"

decided_by: "Operator directive 2026-10-02 (build the treatment version of the timeline); no ADR governs the content."


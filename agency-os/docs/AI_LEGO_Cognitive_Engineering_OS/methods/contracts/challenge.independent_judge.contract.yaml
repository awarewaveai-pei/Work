id: challenge.independent_judge
version: "1.0.0"
family: challenge

cognitive_primitives: [COMPARE, WEIGHT, DECIDE]
# INFERRED, not cited (Atlas §4 gives no composition formula for this
# method). The table row's own 5-step formula compresses onto 3
# primitives: "positions"/"evidence" is COMPARE (weighing viewpoints
# against each other); "criteria" is WEIGHT (same extended-kernel token
# decision.ahp.contract.yaml's own cited "AHP = COMPARE + WEIGHT +
# PRIORITIZE + DECIDE" already uses for the identical "judge against
# stated criteria" action); "judgment" is DECIDE. "dissent" is folded
# into the DECIDE primitive's own output shape (minority_opinion) rather
# than given a fourth primitive -- disclosed as compression, not a
# missed step.

purpose:
  - render_a_criteria_based_ruling_over_competing_positions_without_defaulting_to_a_majority_vote
inputs:
  required:
    - ProposalRef
  optional:
    - RedTeamChallenge
    - BlueTeamReview
  # ProposalRef: same free-text reference class challenge.red_team/
  # challenge.blue_team's own ProposalRef input already uses. The two
  # OPTIONAL typed-object inputs are new: Atlas's own pairing (L1751)
  # and flow diagram (L656-659) both place Independent Judge downstream
  # of Red Team and Blue Team specifically (not any arbitrary proposal),
  # so a real ruling in practice will usually weigh their own outputs --
  # but Atlas gives no rule that BOTH must always exist before a ruling
  # can be rendered (a judge may also rule on a proposal neither method
  # ever touched), so both stay optional rather than required.

outputs:
  - IndependentJudgeRuling
# NEW output type (see typed-objects/independent-judge-ruling.schema.yaml).
# Same honesty gap every Tier 1 contract this session disclosed: Atlas
# names no PascalCase output type for this method.

preconditions:
  - "at least one position considered"
  - "at least one criterion cited"
  - "judgment is non-empty"
  # The second precondition is directly implied by the benefit column's
  # own text (L646: "避免多數決真理") -- a ruling with zero stated
  # criteria is exactly the majority-vote-as-truth failure mode this
  # method exists to avoid, not "the same class" as a sibling method's
  # unrelated precondition (a critic review of challenge.blue_team's own
  # first draft caught that exact mischaracterization pattern; this
  # contract states its own reasoning directly rather than by analogy).

quality:
  provenance_required: true
  evidence_labeling_required: true
  # TRUE, unlike challenge.blue_team's own false: "evidence" is
  # explicitly step 2 of this method's own cited 5-step formula (L646),
  # and an unevidenced ruling is exactly the same class of risk
  # challenge.red_team.contract.yaml's own evidence_labeling_required:
  # true already covers for an unevidenced finding -- a judgment that
  # claims EVIDENCE-grade backing without citing it is still an
  # ungrounded claim regardless of which method produced it.

forbidden_transition: []
# Atlas §22.3's own gate table has no Independent Judge row of its own
# (it is NAMED as the escalation target in Red Team's own row, L4152,
# not given a row governing its own output).

recommended_next:
  - decision.mcda
  - learning.reversal_criteria
  # Atlas §13.4's own Board-grade Strategy Recipe (L3291-3312) places
  # "Independent Judge" (L3306) directly before "MCDA" (L3307), and
  # names "Reversal Criteria" later in the same recipe (L3310) -- a real,
  # citable forward chain, not invented. Both are already-built Tier 1
  # methods this session (decision.mcda: tenth slice; learning
  # .reversal_criteria: eighth slice). "Minority Opinion" and "Human
  # Decision" also appear in that recipe (L3308-3309) but neither has a
  # machine_id or contract anywhere in this spec root -- not cited here,
  # same "don't invent an id for an unbuilt method" discipline this
  # session's every Tier 1 contract already applies (see
  # OQ-INDEPENDENTJUDGE-2).

rollback:
  side_effect_free: true
  # Same low-risk-by-analogy inference every sibling challenge-family
  # contract's own rollback field already uses -- producing a ruling
  # record has no described external side effect.

compilation_decisions:
  - question: >
      The flow diagram (L660-663) shows FOUR distinct output branches
      (Consensus, Minority Opinion, Unknowns, Reversal Conditions) from
      a single Independent Judge node -- should all four be modeled as
      required fields, mirroring the diagram's own apparent symmetry?
    decision: "Only `judgment` (Consensus) is required. `minority_opinion`, `unknowns`, and `reversal_conditions` are all OPTIONAL, independently."
    reasoning: >
      A diagram showing four possible branches from one decision point
      is not the same claim as "every ruling produces all four" -- the
      SAME distinction `challenge.red_team.contract.yaml`'s own
      dimensions_examined/findings split already draws (a dimension may
      be examined and found clean; here, a ruling may be unanimous with
      no minority opinion, may resolve every open question with no
      remaining unknowns, and may be judged final with no stated
      reversal conditions). Forcing all four to be populated on every
      ruling would fabricate content Atlas's own diagram never claims is
      mandatory -- the diagram documents the SHAPE of possible outputs,
      not a per-ruling completeness requirement.

      A critic review of this contract's first draft found two
      ADDITIONAL Atlas citations this reasoning had not engaged before
      concluding: §1's own 五項工程準則 table (L85, 多角度優先 row,
      強制設計 column) lists "Minority Opinion" as part of the
      SYSTEM-LEVEL mandate for "重大結論" (major conclusions) -- not
      every ruling, but major ones. §13.7's own 高風險時強制 list
      (L3398-3403) separately mandates "Minority Opinion" (L3401) and
      "Reversal criteria" (L3403) specifically for HIGH-RISK cases. Both
      are read now, in full, and neither overturns the decision above:
      both are conditional mandates (major conclusions / high-risk
      cases), not unconditional per-ruling requirements -- exactly the
      "diagram documents shape, not per-ruling completeness" reading
      already applied, now with two more Atlas locations agreeing on
      the same conditional structure rather than contradicting it. What
      this contract does NOT do is model that risk-tier/materiality
      conditionality itself (e.g. "minority_opinion required when
      risk_tier IN [R3,R4]") -- disclosed as a real residual, not
      silently dropped, in `open_questions.OQ-INDEPENDENTJUDGE-4`.
  - question: >
      Should `positions_considered[]` items carry a hard `$ref` back to
      a specific `RedTeamChallenge.findings[].id` or
      `BlueTeamReview.improvements[].id`, enforcing that every position
      genuinely traces to one of the two optional typed-object inputs?
    decision: "A soft, optional `source_ref` free-text field per position -- not a hard $ref, and not required."
    reasoning: >
      Same soft-link class `devops_sre.error_budget.contract.yaml`'s own
      `related_slo_id` field already established for an analogous
      cross-method traceability question: a judge may legitimately weigh
      a position that originated from neither Red Team nor Blue Team
      (e.g. a stakeholder objection raised directly), so hard-requiring
      the link would over-constrain what "a position" can be. See
      `open_questions.OQ-INDEPENDENTJUDGE-1` for the same disclosed
      residual (no runtime cross-check that a supplied source_ref
      actually resolves) that error_budget's own analogous field
      already discloses.
  - question: >
      `reversal_conditions` names a concept `learning.reversal_criteria`
      (eighth slice, this session) already governs with a real,
      structured typed object (`specs/cognitive/typed-objects/reversal
      -criteria-set.schema.yaml`, which itself embeds
      `specs/decision/reversal.schema.yaml#/definitions
      /single_indicator_form`: indicator/condition/action/owner) --
      `reversal-criteria-set.schema.yaml`'s own v1.1.0 revision was
      built specifically because an earlier duplicate-definition
      incident this session (learning.reversal_criteria's own
      `condition_description` field) taught the discipline "grep the
      FULL spec root for the CONCEPT, not just this session's own
      chosen name, before minting any new typed object". Does modeling
      `reversal_conditions` here as a bare `array[string]` (free text)
      repeat that exact mistake?
    decision: "No -- a deliberately WEAKER, bare string array, not a duplicate of ReversalCriteriaSet's structured shape. This decision was reached by actually reading both files, not merely by choosing a different field name."
    reasoning: >
      Atlas §11.16 (L2081-2087, the section `learning.reversal_criteria`
      itself cites) gives reversal criteria their own structured
      protocol (indicator/condition/action/owner) -- the SAME heading
      list this contract's own read confirms includes "## Revisit /
      Reversal Conditions" (L2086) as one line among several (Rollback,
      Validation, Revisit / Reversal Conditions), not a section
      dedicated to Independent Judge's own output. `IndependentJudge
      Ruling.reversal_conditions[]` is a RULING's own free-text
      disclosure of what might prompt revisiting THIS SPECIFIC
      decision (Atlas's own flow-diagram branch, L663) -- not a
      standalone, reusable monitoring-rule record the way
      `ReversalCriteriaSet` is (Atlas §11.16's own indicator/condition/
      action/owner tuple, meant to be tracked over time independently
      of any one ruling). A future caller who wants a real, structured,
      independently-monitored reversal criterion should build a
      `learning.reversal_criteria` record and reference it (this
      contract's own `recommended_next` already names
      `learning.reversal_criteria` as the real forward chain for
      exactly this reason) rather than expect this field to substitute
      for one. Verified no schema/field-name collision either: neither
      `reversal.schema.yaml` nor `reversal-criteria-set.schema.yaml`
      defines anything named `reversal_conditions`.
  - question: >
      `challenge.blue_team.contract.yaml`'s own `OQ-BLUETEAM-2` asked,
      as its second half, whether Independent Judge "needs its own
      fresh analysis" of an authority-lockdown rule (the
      `additionalProperties: false` + no-authority-key-guard pattern
      `challenge.red_team` applies to its own output, and
      `challenge.blue_team` deliberately does NOT apply to its own).
      Does `IndependentJudgeRuling` need that same lockdown?
    decision: "No -- and for the OPPOSITE reason challenge.blue_team gave. IndependentJudgeRuling is deliberately NOT locked down at the top level, because Independent Judge legitimately IS the authority, not because Atlas is silent about it."
    reasoning: >
      §22.3's own gate table (L4152) is the direct textual evidence:
      "Red Team | Final Decision | Independent Judge / Human" --
      Independent Judge is NAMED, by Atlas itself, as the entity a Red
      Team finding must escalate TO for a real final decision. Red
      Team's own no-final-authority rule (L1735) and Independent
      Judge's own role are two sides of the identical mechanism, not
      independent design choices: something in this pairing MUST be
      allowed to conclude, or the whole "avoid majority-vote-as-truth"
      structure (L646) has no terminus. Locking `IndependentJudgeRuling`
      down the same way as `RedTeamChallenge` would contradict the very
      citation (L4152) that makes Red Team's own lockdown correct in
      the first place. `challenge.blue_team`'s own restraint (not
      inventing an authority rule Atlas never states FOR Blue Team) and
      this contract's own restraint (not inventing a NO-authority rule
      Atlas never states for Independent Judge, when the opposite is
      what Atlas actually implies) are the same discipline applied to
      opposite textual evidence, not inconsistent decisions.

open_questions:
  - id: "OQ-INDEPENDENTJUDGE-1"
    question: >
      `positions_considered[].source_ref` is a soft, unenforced text
      link to a RedTeamChallenge finding or BlueTeamReview improvement
      id -- no runtime cross-check that the referenced record actually
      exists or that the id even belongs to the right typed object.
      Same disclosed limit class devops_sre.error_budget.contract.yaml's
      own OQ-ERRORBUDGET-2 already carries for related_slo_id.
    owner: "operator, or whoever next wires IndependentJudgeRuling into a real cross-method chain consuming live RedTeamChallenge/BlueTeamReview records"
    blocks: "nothing in this file's own validity"
  - id: "OQ-INDEPENDENTJUDGE-2"
    question: >
      §13.4's own recipe (L3308-3309) names "Minority Opinion" and
      "Human Decision" as distinct downstream steps after MCDA -- neither
      has a machine_id or contract anywhere in this spec root. Should a
      future session build either? "Minority Opinion" in particular
      already exists as free-text CONTENT on this contract's own output
      (`minority_opinion`), which raises the same question
      `challenge.blue_team.contract.yaml`'s own OQ-BLUETEAM-2 already
      asked about Independent Judge before this contract closed it:
      does a recipe NAMING a concept as its own step mean it deserves
      its own method, or is it sometimes just a labeled output of the
      PRECEDING step (here, of this very method)?
    owner: "operator, or whoever next reads §13.4 for a Minority Opinion / Human Decision definition this session did not find"
    blocks: "nothing in this file's own validity"
  - id: "OQ-INDEPENDENTJUDGE-3"
    question: "id mints a machine_id method-inventory.yaml never carried -- should that registry be updated?"
    owner: "operator, or a future session with explicit write scope over method-inventory.yaml"
    blocks: "nothing in this file's own validity"
  - id: "OQ-INDEPENDENTJUDGE-4"
    question: >
      Atlas gives TWO conditional mandates for `minority_opinion`/
      `reversal_conditions`-class content that this contract does not
      model: §1's own 五項工程準則 (L85) requires it for "重大結論"
      (major conclusions), and §13.7's own 高風險時強制 list
      (L3398-3403) requires it specifically for high-risk cases. This
      contract leaves both branches unconditionally optional rather
      than modeling a risk-tier- or materiality-conditional requirement
      (e.g. "required when risk_tier IN [R3, R4]", the same conditional
      shape `specs/execution/mandatory-gates.yaml`'s own `risk_tier_in`
      pattern already uses elsewhere in this spec root). Should a
      future revision add that conditionality?
    owner: "operator, or whoever next wires IndependentJudgeRuling into a real risk-tier-aware execution path"
    blocks: "nothing in this file's own validity -- the residual is disclosed, not silently dropped, in compilation_decisions"


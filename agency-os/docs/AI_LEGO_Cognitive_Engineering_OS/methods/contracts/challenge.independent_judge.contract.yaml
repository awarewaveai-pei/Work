decided_by: >
  No ADR governs the content. Registered in
  `methods/registry/contract-backlog.yaml` `tier_1` as a twenty-fifth
  concrete entry. `id: challenge.independent_judge` mints a new
  machine_id. `family: challenge` reused as-is from `challenge.red_team`/

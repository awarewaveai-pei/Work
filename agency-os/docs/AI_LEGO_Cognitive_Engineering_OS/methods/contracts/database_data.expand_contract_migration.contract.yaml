description: >
  Tier 1 concrete entry. Thirtieth Method Atlas slice, FOURTH from the
  `database_data` family (F21), after `database_data.backup_restore_drill`
  (twenty-fifth), `database_data.data_lineage` (twenty-eighth), and
  `database_data.reconciliation` (twenty-ninth).

  Atlas gives this method the THINNEST possible direct citation --
  §11.50 (L2354-2364) and §13.10 (L3466-3469) are each a one-line
  redirect: "精確步驟序列見 Execution Contract §28（唯一正本）" (the
  precise step sequence is at Execution Contract §28, the sole
  canonical source; this section only explains the concept and
  applicability). Despite the thin Atlas citation, this is the
  RICHEST-grounded method built this session: Execution Contract §28
  (Database Change Contract) gives a full 15-step sequential diagram,
  §29 (DB Migration Requirements) and §30 (Data Integrity Contract) give
  detailed per-step requirements, and an ACTIVE, ADR-005a-grounded
  machine-readable recipe already exists
  (`recipes/validated/db-migration-expand-contract.recipe.yaml`) with
  the SAME 15 steps, real `gate_ref` bindings, and its own
  `mandatory_elements`/`forbidden_actions`.

  This method's own typed object is deliberately NOT a duplicate of that
  recipe (a static, canonical STEP DEFINITION list) -- it is a PROGRESS
  RECORD instance tracking a REAL migration's own completion through
  those same 15 canonical stages, the same "recipe defines the static
  sequence, method typed-object tracks a live instance's progress
  through it" split `devops_sre.canary_deployment`'s own
  `CanaryDeploymentPlan` (5-stage rollout progress) already established
  for a structurally analogous case. The 15 stage identifiers
  transcribed into this contract's own `stage_id` enum are the SAME
  `ref:` values already minted by that recipe file (`schema_baseline`,
  `data_contract`, ... `close_rollback_window`) -- not independently
  invented, confirmed by direct read of the recipe file in full before
  writing this contract.

  A genuine documentation-drift finding surfaced while verifying this
  citation, DISCLOSED here rather than silently corrected (correcting it
  is out of this contract's own scope -- see verification.note): the
  recipe file's own description (written 2026-08-29) claims "EC §28
  currently STILL shows its original 11-step mermaid... it has NOT yet
  been edited to match ADR-005a" -- but a direct re-read of EC §28
  (L1077-1116, done for THIS contract) shows the CURRENT text already
  matches ADR-005a's 15-step corrected form (Data Contract present,
  Enable Dual Write as its own step immediately before Backfill, Dual
  Read Verification present, Canary as its own step) -- meaning EC §28
  has been edited to match ADR-005a SINCE the recipe file's own
  description was written, without that recipe file's own
  source_of_truth_for/description being updated to match. This
  contract cites EC §28's CURRENT (already-ADR-005a-matching) content
  directly, not the recipe's own now-stale "still 11-step" claim.

  The real invariant this contract enforces is directly implied by EC
  §28's own diagram structure -- a single linear "→" sequence, not a
  DAG with alternate paths -- and by §30's own emphatic rule ("Migration
  完成不能只看 command exit code = 0... 必須證明 data invariant = PASS"):
  a stage may only be recorded completed if every EARLIER stage in the
  canonical 15-step sequence has ALSO been recorded completed. This is
  a single, general ordering rule (no stage skipped ahead of an earlier
  one) that subsumes the specific, highest-consequence case EC §30's
  own rule implies -- `contract_old_schema` (stage 14, which destroys
  the rollback path) cannot be recorded completed while
  `reconciliation` (stage 9) has not been -- as one instance of the same
  general rule, not a special-cased pairwise check.


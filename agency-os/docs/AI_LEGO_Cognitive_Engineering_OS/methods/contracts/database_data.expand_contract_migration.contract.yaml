id: database_data.expand_contract_migration
version: "1.0.0"
family: database_data

cognitive_primitives: [DECOMPOSE, VALIDATE, MAP]
# INFERRED, not cited (Atlas gives no §4-style composition formula for
# this method). The 15 discrete stages are DECOMPOSE; checking a stage
# completion against the canonical order is VALIDATE; the stage
# sequence itself, a fixed linear order, is MAP -- the same inferred
# triple `database_data.backup_restore_drill`'s own 6-step protocol
# already used.

purpose:
  - prove_a_schema_migration_completed_every_canonical_ec28_stage_in_order_with_no_stage_skipped_ahead
inputs:
  required: [MigrationStageCompletionEvent]
  optional: []
outputs: [ExpandContractMigrationRecord]
preconditions:
  - "stages is a non-empty list"
  - "every stage's stage_id is one of the 15 canonical EC §28 / recipe stage identifiers"
  - "every stage_id is unique within the record (a stage cannot be recorded completed twice)"
  - "the set of recorded (completed) stage_ids forms a CONTIGUOUS PREFIX of the canonical 15-step sequence -- no stage may be recorded while any EARLIER stage in the sequence has not also been recorded"
  - "every stage's completed_at is a real, parseable ISO-8601 timestamp -- REQUIRED (not free-form text), because the next precondition depends on being able to compare timestamps at all"
  - "completed_at values are non-decreasing when stages are sorted by canonical index -- an EARLIER-in-sequence stage's own completed_at must not be AFTER a LATER-in-sequence stage's"
  # Directly implied by EC §28's own diagram being a single linear
  # sequence (not a DAG with alternate orderings) and by §30's own
  # "exit code != proof" rule. Same "structurally necessary, forbidden-
  # state" class every prior ordered-sequence method this session built
  # already establishes (devops_sre.canary_deployment's own escalation
  # order, devops_sre.blue_green_deployment's own verify-before-switch).
  #
  # The last two preconditions were ADDED post-critic-review: this
  # contract's own first draft enforced ONLY stage_id presence (the
  # contiguous-prefix rule above), which a critic review found proved
  # nothing about REAL temporal order -- a record with every stage_id
  # present but `contract_old_schema`'s own completed_at genuinely
  # BEFORE `reconciliation`'s (the schema physically destroyed before
  # reconciliation ever ran) still satisfied the presence-only check.
  # "In order" in this method's own purpose line means order in real
  # time, not merely which labels appear in the same snapshot.
  #
  # This record is APPEND-ONLY in spirit (a caller adds one stage
  # completion at a time as the real migration progresses) -- but this
  # contract does not itself model an incremental-update API, only the
  # invariant a record's own full `stages[]` snapshot must satisfy at
  # any point it is validated. See OQ-EXPANDCONTRACT-2.
quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class of departure the three prior database_data contracts
  # already reasoned through: the real risk here is a sequencing-
  # integrity risk (was every earlier stage actually completed first),
  # not an evidence-citation risk over a narrative claim.
forbidden_transition: []
# Atlas §22.3's own gate table has no Expand-Contract Migration row.
recommended_next:
  - database_data.reconciliation
  - database_data.backup_restore_drill
# Both are REAL, cited forward links, not invented: the recipe's own
# `Reconciliation` step (ref: reconciliation, gate_ref: data) is stage
# 9 of THIS method's own canonical sequence, and its own
# `Backup / Restore Validation` step (gate_ref: recovery_rollback_
# rehearsal) is stage 4 -- both already-built Tier 1 methods this
# session constructed (twenty-ninth and twenty-fifth slices
# respectively). This is the SAME "close a real chain a mother
# document's own text already names" discipline root_cause.pareto/
# challenge.independent_judge already applied -- and directly answers
# `database_data.reconciliation`'s own OQ-RECONCILIATION-2 (should a
# soft link exist between the two methods): yes, via each stage's own
# optional `evidence_ref` field -- see compilation_decisions below.
rollback:
  side_effect_free: true
  # The RECORD itself is side-effect-free -- it reports on migration
  # work performed elsewhere (schema changes, dual-write, backfill,
  # traffic cutover all happen outside this method's own scope). Same
  # "record reports on an external observation" class every prior
  # database_data contract's own rollback field already draws.

compilation_decisions:
  - question: >
      Should this contract model all 15 stages as a rigid CHECKLIST
      (every stage always present, most marked `pending`), the way a
      literal state-machine implementation might, or as a GROWING LIST
      of only the stages actually completed so far?
    decision: "Growing list of completed stages only -- stages[] contains one entry per stage ALREADY completed, not a full 15-slot checklist with placeholder pending entries."
    reasoning: >
      A migration record queried mid-flight (e.g. after Backfill but
      before Reconciliation) has no real information to report for the
      6 stages still ahead -- forcing a `pending` placeholder for each
      would be inventing structure Atlas/EC's own diagram (a sequence
      of arrows, not a checklist template) does not itself specify.
      The contiguous-prefix invariant is exactly as enforceable against
      a growing list as against a full checklist (the same
      "count from index 0, no gap" check either way) -- so the simpler
      shape loses nothing.
  - question: >
      `database_data.reconciliation`'s own OQ-RECONCILIATION-2 asked
      whether this method's output should feed that method's own
      `source_ref`/`target_ref` as a soft link. Should this contract
      instead consume A `ReconciliationRecord`'s own `id` as a REQUIRED,
      validated cross-reference on the `reconciliation` stage entry?
    decision: "No -- each stage entry carries an OPTIONAL, caller-supplied, uninterpreted evidence_ref string. Not fetched, not schema-cross-validated against the referenced record's own content."
    reasoning: >
      This method has no access to another method's own runtime state
      at the schema/builder layer (the same boundary every prior soft-
      link field in this package already respects -- e.g.
      `devops_sre.error_budget`'s own `related_slo_id`). Requiring and
      cross-validating a real `ReconciliationRecord` would mean this
      method's own construction depends on a live lookup mechanism this
      package's Method Atlas slices do not otherwise have -- a real,
      larger architectural question (the same capability-resolution
      wiring `database_data.reconciliation`'s own OQ-RECONCILIATION-4
      already deferred), not something to invent ad hoc here. The
      optional string is enough to let a caller RECORD which
      Reconciliation/Backup-Restore-Drill record backs a given stage's
      own completion claim, disclosed as unenforced.
  - question: >
      EC §28's linear diagram gives no explicit rule for a FAILED or
      ABANDONED migration (only a forward sequence of successful
      steps) -- should this contract invent a `status: failed`/
      `abandoned` state?
    decision: "No -- out of scope. A record's own stages[] simply stops growing if a migration is abandoned; no explicit terminal-failure state is modeled."
    reasoning: >
      EC §28's own text is silent on this; inventing a failure taxonomy
      would be exactly the kind of unstated-assumption invention this
      package's every prior contract already disciplines itself
      against. Disclosed as a real limit, not a silent gap -- see
      OQ-EXPANDCONTRACT-3.


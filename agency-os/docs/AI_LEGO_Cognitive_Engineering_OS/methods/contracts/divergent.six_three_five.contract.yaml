rollback:
  side_effect_free: true

compilation_decisions:
  - question: "Fixed headcount of 6, or open-ended participant_ids?"
    decision: "Open-ended, minItems: 2 -- Atlas's own F03 row caution ('人數可調整') explicitly names 6 as the classic default, not a hard requirement. Task-mandated: do NOT hardcode 6."
  - question: "Fixed 3-idea count, or open-ended ideas per round?"
    decision: "Fixed: exactly 3 non-empty strings per round -- Atlas's own literal '3 idea' is a structural fact of THIS method's name and citation, unlike headcount, which the SAME row explicitly names as the one adjustable parameter."
  - question: "Should the two real invariants (ideas count, full-rotation completeness) produce a stored derived VALUE field (like decomposition.mece's overlaps/gaps/is_mece or strategy.bcg_matrix's quadrant), or remain pure construction-time/gate-re-derived VALIDITY checks with no stored field?"
    decision: "Pure validity checks, no stored derived field -- same 'shared predicate, no stored field' class framing.five_w_one_h's own dimension KNOWN/UNKNOWN coherence invariant already establishes (contrast that SAME method's OTHER invariant, information_gaps, which IS a stored derived value). Neither invariant here produces a new fact worth reporting back to a consumer beyond pass/refuse -- inventing a boolean like `is_fully_rotated` with nothing citing a need for it would overstate the citation. Consequently no `engine`/`computation_provenance_ref` top-level fields either (those exist only where an actual derived VALUE is stored) -- record-level `provenance` IS still carried per the 123/128 corpus convention (contract-backlog.yaml onehundredtwentyseventh_concrete_entry integration note)."
  - question: "Does a real overlap/gap-style 'legal but imperfect' outcome exist here, the way decomposition.mece's is_mece: false is legal?"
    decision: "No -- unlike MECE's own explicit Atlas §12.7 caution that real-world classifications are rarely perfect, 6-3-5's own citation gives no such caution about incomplete rotations; a sheet that skipped or double-visited a participant is a REAL execution defect (the rotation did not happen as the method defines it), refused at construction, not recorded as a legal partial result."
  - question: "Require len(sheets) == len(participant_ids) (classic 1-sheet-per-participant symmetry)?"
    decision: "No -- Atlas's own citation names no such ratio; inventing one would overstate the citation, same restraint strategy.bcg_matrix's own open-ended portfolio_items already establishes for a different family. sheets is open-ended (minItems: 1); each sheet's own rotation completeness is checked independently of how many sheets exist."
  - question: "sheet_id uniqueness across the session, and contributor_id-per-sheet full-rotation completeness -- schema-level (uniqueItems) or runtime-layer?"
    decision: "Runtime layer (ai_lego/modules/divergent/six_three_five.py), same schema-vs-runtime split decomposition.mece's own category_name uniqueness and overlaps/gaps/is_mece set-arithmetic already establish -- JSON Schema's uniqueItems only compares whole-object equality; it cannot express 'unique by one field' or 'this list is a permutation of that other list'."

open_questions:
  - "OQ-SIXTHREEFIVE-1: cognitive_primitives is this file's own inference (Atlas §4 gives no formula for this method) (owner: operator, or whoever adds a dedicated Atlas §4 formula for this method)."
  - "OQ-SIXTHREEFIVE-2: quality.evidence_labeling_required: false reflects this citation's own thinness (a single bare table row, creative-content method) rather than a positive Atlas statement that evidence labeling does not apply (owner: operator)."
  - "OQ-SIXTHREEFIVE-3: whether a future pass should add a GENUINE_COMPUTE summary field (e.g. total_idea_count, a trivial rollup) is left open -- not built here because nothing in Atlas's own citation names a need for one and the task's own literal shape omits it (owner: operator)."


title: "6-3-5 Brainwriting Method Contract"
status: ACTIVE

description: >
  Tier 1, F03 divergent-ideation family, opening member (F03 entirely unbuilt before this batch -- 10-agent
  batch opening F03's 10 rows: Classic Brainstorming/Brainwriting/6-3-5/Crazy 8s/SCAMPER/Lotus Blossom/
  Starbursting/Random Stimulus/Forced Connections/Synectics, disjoint files). Atlas cites this method ONCE:
  the F03 table row (L381: "6-3-5｜結構化大量 ideation｜6 人×3 idea×5 分鐘，輪傳延伸｜快速得到大量變體｜人數可
  調整") -- grep-confirmed the only hit, no dedicated section, no F03 "最佳搭配" column (unlike F02/F08).
  Two real invariants, BOTH GENUINE_COMPUTE shared predicates (no stored derived VALUE field -- see
  compilation_decisions and typed-object schema): every round's `ideas` is EXACTLY 3 non-empty strings
  (Atlas's own literal "3 idea"), and every sheet's own rounds' `contributor_id` multiset equals EXACTLY the
  full `participant_ids` set (Atlas's own literal "輪傳" full-rotation completeness). Headcount ("6") is the
  row's own named DEFAULT, not hardcoded -- Atlas's own caution "人數可調整" (headcount adjustable).

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F03 tool table, 6-3-5 row (L381)"
  - "specs/cognitive/method.schema.yaml -- the schema this file's body is validated against"
  - "specs/cognitive/typed-objects/six-three-five-session.schema.yaml"

decided_by: >
  No ADR governs the content. `id: divergent.six_three_five` mints a NEW machine_id and opens the
  `divergent` family's first vertical slice. Naming: `method.schema.yaml`'s own `id` field requires pattern
  `^[a-z_]+\.[a-z_]+$` (letters/underscore only, no digits) -- "divergent.6-3-5" would FAIL this pattern, so
  `id` spells the method out digit-free as `six_three_five`, same digit-avoidance precedent
  `root_cause.five_whys`/`framing.five_w_one_h` already set for this exact class of naming collision. The
  human-facing "6-3-5" name is preserved verbatim in `RECORD_ID_PREFIX` (`SIXTHREEFIVE-`, a free string not
  constrained by this pattern) and throughout prose.

id: divergent.six_three_five
version: "1.0.0"
family: divergent

cognitive_primitives: [EXPAND, ASSOCIATE]
# INFERRED, not cited -- Atlas §4 gives no composition formula for this method. Reuses the exact combo
# association.morphological_analysis's own [EXPAND, ASSOCIATE] already establishes for a structurally similar
# "generate variants by extending an existing structure" method: EXPAND = each round's own 3 new ideas;
# ASSOCIATE = a round after the first is written by extending the SHEET's own already-recorded prior ideas
# (the literal "輪傳延伸" -- rotate-and-extend -- this method's own citation names).

purpose:
  - generate_a_large_volume_of_idea_variants_via_structured_round_robin_sheet_rotation
# Atlas L381 verbatim sense: "結構化大量 ideation" (structured high-volume ideation) / benefit "快速得到大量
#變體" (quickly get a large number of variants).

inputs:
  required: []
  optional: []

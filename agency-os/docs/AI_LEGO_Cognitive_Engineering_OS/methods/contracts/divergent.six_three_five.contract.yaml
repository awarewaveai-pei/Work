  # already take.

outputs:
  - SixThreeFiveSession
# NEW output type (see typed-objects/six-three-five-session.schema.yaml). Atlas names no PascalCase output
# type for this method, same honesty gap every other thin-citation Tier 1 contract in this directory discloses.

preconditions:
  - "participant_ids has >=2 distinct, non-empty entries -- a solo session has no rotation to perform (Atlas's own '人數可調整' caution says headcount is ADJUSTABLE, not that it can be 1; un-cited-but-necessary floor, same class framing.five_w_one_h's own un-cited topic anchor already establishes)"
  - "sheets has >=1 entry -- a session with zero sheets performed no rotation at all"
  - "every sheets[].rounds[].ideas entry has EXACTLY 3 non-empty strings -- Atlas's own literal '3 idea' per round-per-person; NOT adjustable like headcount (the row's own caution names ONLY headcount as adjustable) -- GENUINE_COMPUTE shared predicate, re-derived identically by the builder and an independent gate from each round's own raw ideas list, never caller-asserted"
  - "for EVERY sheet, the multiset of that sheet's own rounds[].contributor_id equals EXACTLY the full participant_ids set (no participant missing, none appearing twice) -- Atlas's own literal '輪傳延伸' (rotate-and-extend) full-rotation completeness this method's own name encodes; a sheet missing a participant, or a participant appearing twice on one sheet, is a real structural defect, refused at construction, NOT a legal-but-imperfect outcome (contrast decomposition.mece's own is_mece: false) -- GENUINE_COMPUTE shared predicate, re-derived identically by the builder and an independent gate from each sheet's own raw rounds/participant_ids, never caller-asserted"

quality:
  provenance_required: true
  evidence_labeling_required: false
  # false -- brainwriting ideas are creative suggestions, not EvidenceSet-derived claims, same reasoning class
  # decomposition.mece's/strategy.bcg_matrix's own identical flag already establishes for a thin bare-table-row
  # citation with no explicit unevidenced-claim misuse warning cited.


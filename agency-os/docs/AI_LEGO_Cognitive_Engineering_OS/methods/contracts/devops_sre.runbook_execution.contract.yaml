description: >
  Tier 1 concrete entry. Thirty-third Method Atlas slice, EIGHTH from
  the `devops_sre` family (F19), after `devops_sre.sli_slo`
  (twentieth), `devops_sre.canary_deployment` (twenty-first),
  `devops_sre.chaos_engineering` (twenty-second),
  `devops_sre.blue_green_deployment` (twenty-third),
  `devops_sre.error_budget` (twenty-fourth),
  `devops_sre.capacity_model` (thirty-first), and
  `devops_sre.release_readiness_review` (thirty-second).

  Atlas gives this method exactly ONE citation: the F19 tool table's
  own Runbook / Playbook row (L861: "preconditions→steps→expected
  output→stop/go→rollback", benefit "降操作錯誤" -- reduce operational
  error). No dedicated §11.x section exists (confirmed by direct read
  of the surrounding table, L855-863, and a full-document heading grep
  for "Runbook"/"Playbook"/"高壓操作" returning only this table row).

  CORRECTED post-critic-review: this contract's first draft claimed a
  spec-root grep for "runbook"/"playbook" found only one unrelated hit.
  That materially understated the real scope (~26 files, ~20 distinct
  hits outside this method's own new files) -- the same class of
  narrow-grep gap `devops_sre.release_readiness_review`'s own critic
  round already caught one slice earlier. Two hits genuinely matter:
  (1) `docs/architecture/DEVOPS_SRE_PLAN.md:45,96,116` describes an
  automated "pre-approved playbook" execution tier and "drill
  runbook" language, within this SAME `devops_sre` family's own scoped-
  authority plan -- read in full: it is operational-procedure PROSE
  describing a policy tier, not a typed object or method contract, so
  not a duplicate, but a real, disclosed relationship (see
  OQ-RUNBOOKEXECUTION-4); (2) `Architecture-Constitution-v1.md:26`,
  `docs/adr/ADR-001-scoped-authority-precedence-unification.md:27,42`,
  `AI_LEGO_OS_Program_Plan_v1.md:38`, and `.ai/research/phase-0
  /document-authority-map.yaml:30` all use "Recipe / Runbook" as a
  TIER NAME in this repo's own document-authority precedence ladder
  (Law -> ... -> Recipe/Runbook -> Example -> Ad-hoc) -- a genuine
  shared-vocabulary collision with a governance-authority sense of the
  word "runbook", distinct from this method's own operational-
  execution sense, confirmed distinct by direct read (the same class
  of collision `devops_sre.chaos_engineering`'s own contract already
  verified for `blast_radius`). Neither class of hit names a competing
  typed object or method contract for THIS concept. No duplicate
  found, but the search that reached that conclusion is now the real
  one, not the understated first-draft claim.

  `id: devops_sre.runbook_execution`, not `devops_sre.runbook` --
  Atlas's own formula describes ONE EXECUTION of a runbook through its
  own steps (preconditions checked, each step's real output compared
  against what was expected, a stop/go decision, rollback if stopped),
  not a static runbook TEMPLATE/document. The typed object this method
  produces is a `RunbookExecutionRecord` -- an execution instance, the
  same "the recipe/template is a separate, static artifact; this
  method's own typed object tracks a live instance's progress through
  it" split `devops_sre.canary_deployment`/`database_data
  .expand_contract_migration` already established, but here the
  runbook's own steps are CALLER-DEFINED per execution (a runbook's
  own step count and content vary by runbook), not a single Atlas-wide
  fixed canonical list the way expand_contract_migration's 15 stages
  are -- a genuinely different shape, not a duplicate pattern wearing
  a new name.

  Atlas's own 5-part formula directly implies FOUR separate, real
  invariants this contract enforces, one per formula transition: (1)
  step numbering is well-formed (1..N, no gaps, no duplicates); (2) a
  step's own `decision: go` requires BOTH its own preconditions met AND
  its own outcome matching what was expected -- "stop/go" is not a
  free caller choice independent of the preceding two formula steps;
  (3) once any step's own decision is `stop`, no LATER step may be
  recorded -- an operator does not continue past a stop gate; (4) if
  any step stopped, `rollback_performed: true` is REQUIRED at the
  record level -- Atlas's own formula ends the sequence at "rollback"
  specifically for the stopped case, not as an optional afterthought.


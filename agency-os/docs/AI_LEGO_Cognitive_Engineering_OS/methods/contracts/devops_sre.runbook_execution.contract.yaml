id: devops_sre.runbook_execution
version: "1.0.0"
family: devops_sre

cognitive_primitives: [DECOMPOSE, VALIDATE, MAP]
# INFERRED, not cited (Atlas gives no §4-style composition formula for
# this method). The runbook broken into discrete steps is DECOMPOSE;
# each step's own preconditions/outcome/decision check plus the
# stop-forbids-later-steps and stop-requires-rollback rules are
# VALIDATE; the fixed step ORDER (1..N) is MAP -- the same inferred
# triple every prior structured-protocol method this session built
# already uses.

purpose:
  - prove_a_high_pressure_operational_procedure_was_executed_step_by_step_with_no_step_skipped_past_a_stop_gate_and_rollback_performed_if_stopped
inputs:
  required: [RunbookStepExecution]
  optional: []
outputs: [RunbookExecutionRecord]
preconditions:
  - "steps is a non-empty list, numbered exactly 1..N with no gaps and no duplicates"
  - "every step's own decision is go or stop"
  - "decision:go requires BOTH preconditions_met:true AND outcome:matched_expected -- a step cannot proceed on a partial match"
  - "once any step's own decision is stop, no step with a HIGHER step_number may be recorded"
  - "if any step's own decision is stop, rollback_performed:true is required at the record level"
  # Each of the last four preconditions maps onto one transition of
  # Atlas's own 5-part formula (preconditions->steps->expected
  # output->stop/go->rollback), disclosed individually above in this
  # contract's own description. Same "structurally necessary,
  # forbidden-state" class every prior ordered-protocol method this
  # session built already establishes (devops_sre.canary_deployment's
  # own escalation order, database_data.expand_contract_migration's
  # own contiguous-prefix rule).
  #
  # DELIBERATELY NOT bidirectional on rollback: rollback_performed:true
  # is legal even when EVERY step went (a caller performing a
  # precautionary rollback for a reason outside this record's own
  # scope) -- Atlas's own text never forbids that conservative choice,
  # the same one-directional restraint every prior status-like field
  # this session built already establishes.
quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class of departure every structured-protocol contract in this
  # package already reasons through: the real risk is sequencing/
  # aggregation integrity (was each step actually gated correctly, was
  # rollback actually performed when required), not an evidence-
  # citation risk over a narrative claim.
forbidden_transition: []
# Atlas §22.3's own gate table has no Runbook / Playbook row.
recommended_next: []
# Atlas gives no explicit 推薦搭配 chain for this method. A real,
# disclosed (not built) relationship: F19's own Game Day row (L858,
# "scenario→roles→inject→recover→AAR") could in principle EXERCISE a
# real runbook as part of its own "recover" step -- see
# OQ-RUNBOOKEXECUTION-2.
rollback:
  side_effect_free: true
  # The RECORD itself is side-effect-free -- it reports on a real
  # operational procedure executed elsewhere (the actual commands,
  # scripts, or manual steps run outside this method's own scope), the
  # same "record reports on an external observation" class every prior
  # devops_sre contract's own rollback field already draws. Note this
  # is a DIFFERENT sense of "rollback" than `rollback_performed` above
  # (a Runbook-domain field this record tracks) -- the method-contract
  # convention's own `rollback:` field is about undoing a MISTAKE in
  # this record's own construction, not the runbook's own operational
  # rollback step.

compilation_decisions:
  - question: >
      Atlas's own formula names "expected output" and implies a
      comparison against real output -- should this contract require
      both an `expected_output` and `actual_output` free-text field and
      enforce STRING EQUALITY between them as the outcome, the way an
      automated test assertion would?
    decision: "No -- outcome is a caller-supplied enum (matched_expected/deviated), not a computed string comparison."
    reasoning: >
      A runbook step's own "expected output" is frequently a human
      judgment call over unstructured real-world evidence (e.g. "did
      the dashboard look healthy", "did the customer confirm the fix"),
      not always a literal, comparable string -- forcing exact string
      equality would invent a rigor Atlas's own text does not specify
      and would wrongly fail legitimate steps whose real output varies
      in incidental ways (timestamps, ids) while still substantively
      matching. This mirrors `database_data.backup_restore_drill`'s own
      `integrity_checks_passed` design (a caller-supplied boolean
      judgment, not a computed check) rather than this session's
      genuine-compute methods' own design.
  - question: >
      Should `rollback_performed` support a third state (e.g.
      `partial`, for a rollback that only partially succeeded) rather
      than a strict boolean?
    decision: "No -- boolean only."
    reasoning: >
      Atlas's own formula names "rollback" as the final step with no
      further branching; inventing a partial-rollback taxonomy would be
      exactly the kind of unstated-assumption invention this package's
      every prior contract already disciplines itself against. A
      caller with a genuinely partial rollback records
      `rollback_performed:true` with a note (if evidence labeling is
      later added, see OQ-RUNBOOKEXECUTION-3) explaining the partial
      nature -- disclosed as a real, current limit, not a silent gap.


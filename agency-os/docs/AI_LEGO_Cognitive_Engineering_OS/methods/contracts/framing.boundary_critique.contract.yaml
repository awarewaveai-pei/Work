id: framing.boundary_critique
version: "1.0.0"
family: framing

cognitive_primitives: [FRAME, DECOMPOSE, VALIDATE]
# INFERRED, not cited. FRAME = Atlas's own benefit line "揭露權力與價值假設" (reveal power/value assumptions)
# is itself a framing act -- naming what is in/out of scope of the analysis -- same primitive
# framing.problem_statement's own "建立共同問題定義" already maps to. DECOMPOSE = splitting the analysis into
# 5 fixed categories. VALIDATE = the two-layer invariant re-derivation every sibling module in this family
# already establishes.

purpose:
  - critique_a_decision_or_policys_boundary_across_decision_maker_affected_excluded_resources_and_values_to_reveal_power_and_value_assumptions
inputs:
  required: []
  optional: [ProblemStatement]
  # Atlas's own row cites no typed-object input (bare 5-term formula only), same reasoning
  # framing.success_criteria's own empty inputs.required already applies despite also sitting
  # flowchart-adjacent to a real built sibling. ProblemStatement is OPTIONAL: framing.problem_statement is a
  # real, already-built sibling (the flowchart's own immediate upstream node) but Atlas gives no hard
  # dependency citation -- see problem_statement_ref below for the real soft-link.
outputs: [BoundaryCritiqueRecord]
preconditions:
  - "decision_context is a non-empty string -- the policy/decision/system this boundary analysis examines"
  - "categories is EXACTLY the five entries {DECISION_MAKER, AFFECTED, EXCLUDED, RESOURCES, VALUES}, one each, IN THAT ORDER -- Atlas's own literal 'decision maker/affected/excluded/resources/values' citation order"
  - "every category's status is either POPULATED or DECLARED_EMPTY"
  - "a POPULATED category carries at least 1 well-formed item {name, provenance, description?, supporting_evidence_refs?} and MUST NOT carry empty_justification"
  - "a DECLARED_EMPTY category carries zero items and MUST carry a non-empty empty_justification explaining why -- a silently empty category would defeat Atlas's own benefit column (see description)"
  - "empty_categories is always present (an empty list is meaningful: every category populated) and MUST equal the set of category names whose status is DECLARED_EMPTY, in CATEGORY_ORDER -- re-derived, never caller-trusted"
  - "when problem_statement_ref is present, it is a non-empty string prefixed PROB- -- format-only soft link against the real, confirmed prefix; this method cannot see the referenced record"
quality:
  provenance_required: true
  evidence_labeling_required: true
forbidden_transition: []
# Atlas gives this row no worked example or misuse rule beyond the table itself -- left genuinely empty.
recommended_next: []
# Atlas's own best-paired column (L344) names "Stakeholder Map" -- unbuilt at this write time (no sibling
# agent in this batch builds it), out of scope per this task's own instruction. Left empty rather than
# inventing an uncontracted machine_id, same restraint every F01 sibling this session already establishes.
rollback:
  side_effect_free: true

compilation_decisions:
  - question: "Fixed prefixItems positional array (five_w_one_h's convention) or 4 fixed named top-level fields (success_criteria's convention) for the 5 categories?"
    decision: "prefixItems, matching five_w_one_h -- this method's per-category POPULATED/DECLARED_EMPTY+justification shape is a direct structural isomorph of five_w_one_h's own per-dimension KNOWN/UNKNOWN+gap_note shape, the closer analogy of the two established sibling conventions."
  - question: "Should a category with zero items be schema-illegal, or legal with an explicit justification?"
    decision: "Legal but gated: DECLARED_EMPTY status requires a non-empty empty_justification. Forcing an explicit justification makes the omission itself an auditable claim, not a silent gap -- the real invariant this method exists to enforce (see description)."
  - question: "Real external methodology name (Werner Ulrich's Critical Systems Heuristics) in prose, or Atlas-terms-only?"
    decision: "Disclosed by name for grounding, but the ENFORCED field set is Atlas's own literal 5-term citation verbatim -- NOT CSH's real 4-category/12-question framework, which genuinely differs. Same honesty pattern security.pasta already established for its own external-methodology citation."
  - question: "Hard inputs.required:[ProblemStatement], matching the flowchart's C->D arrow?"
    decision: "No -- optional only. Atlas's own row cites no typed-object input, same reasoning framing.success_criteria's own empty inputs.required already applies to its own flowchart-adjacent position."
  - question: "Optional soft-link to the real, already-built framing.problem_statement?"
    decision: "problem_statement_ref, format-checked against the real, confirmed PROB- prefix (problem_statement genuinely exists at this write time) -- same 'format-check against a real confirmed prefix' precedent framing.success_criteria's own reversal_criteria_ref already establishes, stronger grounding than five_w_one_h's own informs_problem_statement_ref (unenforced prefix, built before problem_statement existed)."
  - question: "Per-item shape uniform across all 5 categories, though decision_maker/resources/values are conceptually different from affected/excluded?"
    decision: "Yes -- one uniform {name, description?, provenance, supporting_evidence_refs?} shape for every category. Ulrich's own CSH methodology asks a uniform 'who/what is...' question pattern across all boundary categories; inventing category-specific shapes would be fabricated, un-cited scope."
  - question: "GENUINE_COMPUTE empty_categories: separate ai_lego/compute/ submodule (five_w_one_h's own precedent) or inline in the method module?"
    decision: "Inline (derive_empty_categories lives in ai_lego/modules/framing/boundary_critique.py itself) -- this task's own explicit 5-file deliverable scope does not include a 6th compute-module file; the derivation is simple enough (one list comprehension) that a separate module would be ceremony, not a real testability gain."


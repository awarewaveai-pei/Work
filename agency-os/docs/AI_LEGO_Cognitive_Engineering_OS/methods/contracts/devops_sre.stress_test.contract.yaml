description: >
  Tier 1 concrete entry. Thirty-sixth Method Atlas slice, ELEVENTH from
  the `devops_sre` family (F19), after `devops_sre.sli_slo` (twentieth),
  `devops_sre.canary_deployment` (twenty-first),
  `devops_sre.chaos_engineering` (twenty-second),
  `devops_sre.blue_green_deployment` (twenty-third),
  `devops_sre.error_budget` (twenty-fourth), `devops_sre.capacity_model`
  (thirty-first), `devops_sre.release_readiness_review` (thirty-second),
  `devops_sre.runbook_execution` (thirty-third), `devops_sre.game_day`
  (thirty-fourth), and `devops_sre.load_test` (thirty-fifth).

  Atlas gives this method exactly ONE citation of its own: the F19 tool
  table's Stress Test row (L854: purpose "找系統破壞點" -- find the
  system's breaking point; usage "超過預期負載→觀察 cliff/recovery" --
  exceed the expected load, observe the cliff/recovery; benefit "了解安
  全餘量" -- understand the safety margin). No dedicated §11.x section
  exists (confirmed by direct read of the surrounding table, L848-863).

  **Near-name collision, checked and confirmed distinct (the exact class
  Phase-0's own `verified-findings.yaml:1052` flagged)**: F12's own
  "Stress Testing" row (L652: "極端但合理情境 | extreme scenarios→run
  →breaking points | 測 robustness") is a COGNITIVE red-team method --
  running a PLAN or DECISION through extreme-but-plausible qualitative
  scenarios to test its own robustness, sibling to Red Team/Pre-mortem
  in F12's own challenge family (three of which -- `challenge.red_team`,
  `challenge.blue_team`, `challenge.independent_judge` -- are already
  built this session). F19's own Stress Test is an ENGINEERING load
  test -- escalating REAL, MEASURED request load against a running
  system until it observably breaks. Both use the word "breaking
  point(s)" and neither carries a machine ID in `method-inventory.yaml`
  to disambiguate by id alone (confirmed: L1142's own Stress Test entry
  and the F12 table's own Stress Testing entry are both `has_contract:
  false` with no machine_id field before this contract) -- `id:
  devops_sre.stress_test` (this contract) and a future `challenge
  .stress_testing` (unbuilt) would be the disambiguating machine IDs.
  Neither is a duplicate of the other; both are real, distinct methods
  Atlas names separately in separate packs.

  This method's own typed object REUSES `devops_sre.load_test`'s own
  `#/$defs/load_measurement` shape UNCHANGED across files, resolving
  that contract's own OQ-LOADTEST-5 (whether Stress Test/Soak Test
  should reuse it) -- YES, confirmed here by direct construction: the
  same four fields (`load_rps`/`latency_p95_ms`/`error_rate`/
  `resource_utilization`) describe one measurement at one load level in
  both methods; only the SHAPE of the surrounding record differs (Load
  Test: exactly two measurements, baseline vs target, judged against an
  absolute acceptance bar; Stress Test: an ESCALATING LADDER of two or
  more measurements, searched for the first one that breaches a
  breaking-point definition).

  A second echo, checked and disclosed: `devops_sre.capacity_model`'s
  own PURPOSE column also names "安全餘量" (safety margin, L852:
  "預估容量與安全餘量"). Distinct: capacity_model PROJECTS a future
  headroom ratio from a growth-rate assumption, with no real load ever
  applied; this method EMPIRICALLY DISCOVERS the breaking point by
  actually escalating real, measured load against a running system.
  Neither typed object references the other; a future revision could
  cross-reference stress_test's own `breaking_point.load_rps` as an
  empirical input to a capacity_model projection's own `current_capacity`
  -- disclosed as OQ-STRESSTEST-4, not built.

  Broad due-diligence search (case-insensitive spec-root greps for
  "stress test"/"壓力測試"/"stress_test", "breaking point"/"cliff"/"破壞
  點", "safety margin"/"安全餘量", "recovery"/"恢復"): the two echoes
  above plus THREE further neighbours a critic review found this
  contract's first draft had missed, all now disclosed: (1)
  `AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md:1776`
  reserves a `/modules/simulation/{scenario, monte_carlo, sensitivity,
  stress_test}/` directory placeholder (no contents) under a
  SIMULATION module family outputting "Success Probability" -- this is
  the SAME placeholder `devops_sre.load_test`'s own OQ-LOADTEST-5
  already flagged (now resolved for this method: `devops_sre
  .stress_test` is the built implementation of the F19 sense of that
  name; the Master Plan's own directory sits under a DIFFERENT module
  family and is not this method's own home). (2)
  `docs/architecture/REPOSITORY_ARCHITECTURE.md:308` and its mirror
  `.ai/research/phase-0/architecture-inventory.yaml:1695` both list a
  "Simulation Worker" handling "Monte Carlo/Scenario/Sensitivity/Stress
  Test" under `/modules/data-science/simulation` -- the same
  simulation-family placement as (1), not this method. (3) Atlas's own
  quick-select table has a THIRD occurrence of the exact string
  "Stress Test" at L4477 ("策略要撐未來 | Scenario Planning | Futures
  Wheel / Stress Test | Single Forecast") -- read in context: this row
  is itself the exact ambiguous reference Phase-0's own
  `verified-findings.yaml:1059` already named as undisambiguatable
  between F12's Stress Testing and F19's Stress Test; it belongs to
  the SCENARIO-PLANNING (F12-family) sense by co-location with Futures
  Wheel, not to this method, but the row's own text cannot formally
  prove that -- disclosed, not silently resolved. None of the three is
  a duplicate typed object or a competing method contract for THIS
  concept (an engineering load method); no duplicate found.

  Atlas's own formula and benefit ground FIVE real invariants: (1) the
  load ladder has at least two steps, STRICTLY increasing `load_rps`
  (an escalation, not a single measurement or a flat repeat); (2) at
  least one step's own `load_rps` STRICTLY exceeds `expected_load_rps`
  (Atlas's own "超過預期負載" -- a ladder that never exceeds the
  expected load is not a stress test); (3) every step reports the SAME
  set of resource names (the same like-for-like discipline
  `devops_sre.load_test`'s own resource-set invariant already
  establishes); (4) `breaking_point` is COMPUTED -- the first step, by
  order, whose own latency or error rate breaches `breaking_thresholds`
  -- `null` is a legitimate, honestly-disclosed outcome (no cliff found
  within the tested range), never silently coerced to a false positive
  or negative; (5) `recovery` is REQUIRED iff `breaking_point` is not
  null and FORBIDDEN otherwise, its own `reduced_load_rps` is STRICTLY
  below the breaking step's own `load_rps` (a genuine reduction, not a
  re-measurement at the same or higher load), and its own `recovered`
  flag is FULLY DERIVED against `breaking_thresholds` -- no caller
  override, the same discipline `devops_sre.load_test`'s own `status`
  already establishes.


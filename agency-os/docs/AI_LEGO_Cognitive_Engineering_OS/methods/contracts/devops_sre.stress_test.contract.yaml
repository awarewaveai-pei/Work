id: devops_sre.stress_test
version: "1.0.0"
family: devops_sre

cognitive_primitives: [DECOMPOSE, VALIDATE, INFER]
# INFERRED, not cited (Atlas gives no §4-style composition formula for
# this method). Separating the ladder into discrete steps is DECOMPOSE;
# judging each step against breaking_thresholds and the recovery
# measurement against the same is VALIDATE; naming WHICH step is the
# breaking point (and whether the system recovered) is INFER -- the
# same inferred triple `devops_sre.load_test`'s own contract already
# uses.

purpose:
  - find_the_load_level_at_which_a_system_breaks_by_escalating_real_measured_load_beyond_the_expected_load_and_observing_whether_it_recovers_when_load_is_reduced
inputs:
  required: [EscalatingLoadLadder, BreakingThresholds]
  optional: [RecoveryObservation]
outputs: [StressTestRecord]
preconditions:
  - "system_under_test is a non-empty string; expected_load_rps is finite and > 0"
  - "load_steps has at least 2 entries, each a valid load_measurement (same shape/ranges as devops_sre.load_test's own), STRICTLY increasing load_rps, and the SAME set of resource names across every step"
  - "at least one load_steps entry's own load_rps is STRICTLY greater than expected_load_rps"
  - "breaking_thresholds carries exactly latency_p95_ms_max (finite, > 0) and error_rate_max (finite, in [0, 1]) -- re-verified independently by the gate, not builder-only, applying the lesson devops_sre.capacity_model's and devops_sre.load_test's own critic rounds taught"
  - "breaking_point is computed by ai_lego.compute.stress_test.analysis.find_breaking_point: the FIRST load_steps entry (by order) whose own latency_p95_ms > breaking_thresholds.latency_p95_ms_max OR error_rate > breaking_thresholds.error_rate_max, or null if none breaches either -- never caller-supplied independently of that computation"
  - "recovery is REQUIRED when breaking_point is not null, and FORBIDDEN when breaking_point is null"
  - "when present, recovery.reduced_load_rps is STRICTLY less than breaking_point.load_rps, and recovery.recovered is computed (true iff recovery.latency_p95_ms <= breaking_thresholds.latency_p95_ms_max AND recovery.error_rate <= breaking_thresholds.error_rate_max) -- never caller-asserted"
  # Preconditions 2-3 map onto Atlas's own '超過預期負載' formula step;
  # 5-7 onto '觀察 cliff/recovery'. Same "structurally necessary,
  # forbidden-state" class every prior genuine-compute contract this
  # session built already establishes.
quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class of departure every genuine-compute contract in this
  # package already reasons through: the real risk is computational
  # integrity (was the cliff actually the first breach, was recovery
  # actually a reduction), not evidence-citation over a narrative claim.
forbidden_transition: []
# Atlas §22.3's own gate table has no Stress Test row.
recommended_next: []
# Atlas gives no explicit 推薦搭配 chain for this method. Two real,
# disclosed (not built as chains) relationships: (1) breaking_point's
# own load_rps could feed devops_sre.capacity_model's own
# current_capacity as an empirically-discovered ceiling rather than a
# caller-estimated one (OQ-STRESSTEST-4); (2) F19's own Soak Test row
# (L855) shares this method's escalating-measurement shape but asks a
# different question (sustained load over TIME, not escalating load
# levels) -- OQ-STRESSTEST-5.
rollback:
  side_effect_free: true
  # The RECORD itself is side-effect-free -- the real load generation
  # and any remediation of the discovered breaking point happen outside
  # this method's own scope, the same "record reports on an external
  # observation" class every prior devops_sre contract's own rollback
  # field already draws.

compilation_decisions:
  - question: >
      Should this method redefine its own load-measurement shape, or
      reuse `devops_sre.load_test`'s own `#/$defs/load_measurement`
      across files?
    decision: "Reuse unchanged via a cross-file $ref, resolving devops_sre.load_test's own OQ-LOADTEST-5."
    reasoning: >
      The four fields (load_rps/latency_p95_ms/error_rate/
      resource_utilization) describe the exact same real-world
      observation -- one measurement at one load level -- in both
      methods; redefining an identical shape under a new name would be
      duplication wearing a different label, the same discipline this
      session's every prior reuse decision (e.g. the shared
      `genuine_compute` gate) already applies. `SchemaContracts`'
      `referencing`-library registry resolves a Draft 2020-12 `$defs`
      fragment across files identically to a same-file fragment --
      confirmed before writing this schema, not assumed.
  - question: >
      Should `breaking_thresholds` be the SAME field/value as
      `devops_sre.load_test`'s own `acceptance`, since both are
      latency/error threshold pairs of the identical shape?
    decision: "Same SHAPE, deliberately separate field and separate caller-supplied value -- not shared or defaulted from one another."
    reasoning: >
      A load test's `acceptance` defines the bar a system must clear to
      PASS at its target load; a stress test's `breaking_thresholds`
      defines the bar whose breach marks FAILURE onset while
      escalating past that load. A caller may legitimately set these to
      different values for the same system (e.g. a stricter PASS bar at
      expected load than the definition of "broken" under intentional
      overload) -- collapsing them into one shared field would silently
      forbid that legitimate difference. The shape is shared (both
      reuse the same two-field latency/error pattern) precisely because
      both are real, disclosed instances of the same "caller-supplied
      operational judgment, no default" restraint this package already
      established for acceptance-style fields.
  - question: >
      Should `breaking_point` search load_steps by INDEX ORDER or by
      the numeric VALUE of load_rps (equivalent once strict increase is
      enforced, but which is the primitive)?
    decision: "By index order (the caller-supplied sequence), with load_rps strict-increase enforced as a separate precondition that makes the two equivalent."
    reasoning: >
      Atlas's own formula is a PROCEDURE ("超過預期負載→觀察") --
      escalate, then observe -- not a numeric search over an unordered
      set; searching by order is the literal reading and remains correct
      even if a future revision relaxes the strict-increase requirement
      for some as-yet-undisclosed reason. Enforcing strict increase
      separately (rather than deriving order from it) keeps the two
      concerns testable independently, the same discipline
      `devops_sre.runbook_execution`'s own step-numbering-vs-decision
      -justification split already established.
  - question: >
      Should a `recovery.recovered: false` (attempted recovery, did not
      recover) be a legal, distinct outcome from `recovery` being absent
      entirely (never attempted)?
    decision: "Yes -- both are legal and distinct. recovery present with recovered:false means an attempt was made and failed; recovery absent (only legal when breaking_point is null) means no breaking point existed to recover FROM."
    reasoning: >
      Atlas's own formula names 'recovery' as an OBSERVATION following a
      real cliff -- a system that broke and did not recover on a reduced
      load is a real, disclosable finding (arguably the more operationally
      important one), not an error state. Forcing recovery:true whenever
      recovery is present would silently discard exactly the "the system
      did not come back" case a stress test exists to surface.

open_questions:
  - id: "OQ-STRESSTEST-1"
    question: "id mints a machine_id method-inventory.yaml never carried -- should method-inventory.yaml be updated (has_contract:true, machine_id, corrected line field)? Should F12's own Stress Testing entry ALSO gain a machine_id (e.g. challenge.stress_testing) at the same time, precisely because the two are otherwise indistinguishable by name alone?"
    owner: "operator, or a future session with explicit write scope over method-inventory.yaml"
    blocks: "nothing in this file's own validity"
  - id: "OQ-STRESSTEST-6"
    question: >
      A critic review found THREE undisclosed neighbours placing a
      `stress_test` module under a SIMULATION/data-science family
      (`Master_Plan_v1.md:1776`, `REPOSITORY_ARCHITECTURE.md:308`,
      Atlas's own quick-select L4477) rather than under `devops_sre`.
      Should a future session reconcile the Master Plan's own
      `/modules/simulation/stress_test/` placeholder with this method's
      own home under `devops_sre` + `ai_lego/compute/stress_test/` (a
      rename/merge/cross-reference), or are they genuinely two
      different concerns (an engineering load method here vs. a
      Monte-Carlo-family simulation there) that happen to share a name?
    owner: "operator, or whoever next builds the simulation module family"
    blocks: "nothing in this file's own validity"
  - id: "OQ-STRESSTEST-2"
    question: >
      No structured field exists for WHICH observation breached the
      threshold (latency, error rate, or both) at the breaking point --
      only that step's own index/load_rps are recorded, and a reader
      must re-index load_steps to see why. Should a future revision add
      a `breaching_metric` enum (latency/error_rate/both) alongside
      `breaking_point`?
    owner: "operator, or whoever next revises this contract's own field design"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap"
  - id: "OQ-STRESSTEST-3"
    question: >
      `recovery` supports exactly ONE post-cliff measurement. A caller
      who reduces load in multiple stages to find the RECOVERY point
      (symmetric with the escalating ladder that found the breaking
      point) has no structured way to record intermediate stages. Should
      a future revision support a recovery LADDER, symmetric with
      load_steps?
    owner: "operator, or whoever next revises this contract's own field design"
    blocks: "nothing in this file's own validity"
  - id: "OQ-STRESSTEST-4"
    question: >
      `breaking_point.load_rps` is an EMPIRICALLY discovered ceiling;
      `devops_sre.capacity_model`'s own `current_capacity` is a
      caller-ESTIMATED one. Should a future revision add a soft-link
      field (e.g. `capacity_model_ref`, format-only, the same
      discipline `devops_sre.game_day`'s own `runbook_execution_ref`
      already establishes) so a capacity_model record can cite this
      method's own output as its empirical basis?
    owner: "operator, or whoever next revises either contract's own field design"
    blocks: "nothing in this file's own validity"
  - id: "OQ-STRESSTEST-5"
    question: >
      F19's own Soak Test row (L855: "持續負載→memory/resource
      leak→degradation") shares this method's own load_measurement
      reuse candidacy but asks a different question (degradation over
      SUSTAINED time at one load level, not escalation across levels).
      Should it reuse `#/$defs/load_measurement` too, the way this
      method does?
      ANSWERED 2026-09-05 (thirty-seventh slice): `devops_sre.soak_test`
      reuses `#/$defs/load_measurement` unchanged, the same cross-file
      pattern this contract established, confirming it generalizes to
      a third consumer.
    owner: "operator, or whoever next builds devops_sre.soak_test"
    blocks: "nothing in this file's own validity"


id: learning.reversal_criteria
version: "1.0.0"
family: learning

cognitive_primitives: [VALIDATE, REFLECT, LEARN]
# INFERRED, not cited (Atlas §4 gives no composition formula for this
# method). Atlas's own quoted purpose (L1976, "哪些新資訊或指標達到什麼
# 程度時，我們必須重新評估甚至撤銷目前決策？") is a VALIDATE (checking an
# indicator against a condition) that triggers a REFLECT (re-evaluate the
# decision) so the organization can LEARN (update its committed course) --
# all three CANONICAL_KERNEL members.

purpose:
  - define_conditions_that_trigger_decision_re_review
# Atlas L1976 verbatim sense (quoted directly, not paraphrased in the
# mother document itself): pre-define what new information or indicator,
# at what threshold, requires re-evaluating or reversing a decision.

inputs:
  required:
    - DecisionRef
  # NEW DESIGN. Atlas's own worked example (L1980-1985) monitors "a
  # decision" but no mother document gives `Decision` its own typed-object
  # field shape anywhere in this spec root yet (docs/architecture/
  # REPOSITORY_ARCHITECTURE.md rules Decision belongs at
  # `/core/domain/decision` as a Shared Kernel object, but that schema is
  # not yet built). This contract therefore requires only a free-text
  # reference to the decision being monitored, not a hard $ref to a type
  # that does not exist yet -- see open_questions.

outputs:
  - ReversalCriteriaSet
# NEW output type (see typed-objects/reversal-criteria-set.schema.yaml).
# Same honesty gap every Tier 1 contract this session disclosed: Atlas
# names no PascalCase output type for this method.

preconditions:
  - "at least one criterion supplied"
  - "every criterion names a non-empty owner and a non-empty action"
  # The second precondition is not itself Atlas-cited as a formal
  # precondition, but is the machine-checkable form of Atlas's own named
  # benefit (L1990, "防組織因面子拒絕改方向" -- prevents the organization
  # refusing to change course to save face): a reversal criterion with no
  # accountable owner or no defined action is decorative, not enforceable
  # -- the same class of "the record must actually do the thing its own
  # name claims" discipline `causal.dag`'s acyclic_verified const:true
  # already established for a different method.

quality:
  provenance_required: true
  evidence_labeling_required: false
  # provenance_required: every criterion and the overall record carry a
  # provenance_record. evidence_labeling_required is FALSE: this method's
  # criteria are forward-looking COMMITMENTS (what will trigger a
  # re-review), not backward-looking evidence-cited claims about what
  # already happened -- a genuinely different risk profile from
  # Fishbone/SWOT/causal.dag, re-derived independently rather than copied
  # from any single precedent (same discipline root_cause.pareto's and
  # causal.dag's own departures/re-derivations already modeled).

forbidden_transition: []
# Atlas §11.33 gives no explicit forbidden-transition worked example.
# Same open-question class as every other Tier 1 contract this session
# built.

recommended_next: []
# Atlas §11.33 names no recommended_next method.

rollback:
  side_effect_free: true
  # Same low-risk-by-analogy inference every sibling contract in this
  # directory already uses -- defining monitoring criteria has no
  # described external side effect; ACTING on a triggered criterion would,
  # but that action is out of this method's own scope (see
  # open_questions).

compilation_decisions:
  - question: >
      Atlas's own worked example's `condition` field (L1982, "> 300 USD
      for 3 consecutive months") is free text. Should this contract's
      typed object keep it as free text only, or also support a
      structured, mechanically-evaluable rule?
    decision: >
      Both: `condition_description` (free text, Atlas's own literal
      format, always required) plus an OPTIONAL `structured_rule`
      (operator/threshold/consecutive_periods) a caller may additionally
      supply when the condition is mechanically simple, like Atlas's own
      example genuinely is.
    reasoning: >
      Collapsing to free-text-only would forgo real, testable compute this
      specific worked example clearly supports (a real threshold-crossing
      check, `ai_lego/compute/monitoring/triggers.py`); forcing every
      condition into a structured rule would overstate how many real-world
      reversal criteria are actually this simple (many genuinely are
      qualitative judgment calls, not clean numeric thresholds). Same
      "literal field plus a separate, optional structured mechanism"
      pattern `strategy.swot.contract.yaml`'s `source`/
      `supporting_evidence_refs` split already used.

open_questions:
  - id: "OQ-REVERSALCRITERIA-1"
    question: >
      `DecisionRef` is a free-text reference, not a hard $ref to a real
      `Decision` typed object, because `/core/domain/decision`
      (docs/architecture/REPOSITORY_ARCHITECTURE.md's own ruling for where
      the Decision Shared Kernel object belongs) has not been built as a
      real schema in this spec root yet. Should a future session build
      that schema and upgrade this contract's input to a real $ref?
    owner: "operator, or whoever next builds specs/domain/decision.schema.yaml"
    blocks: "nothing in this file's own validity -- a free-text reference is the more conservative (less invented) choice"
  - id: "OQ-REVERSALCRITERIA-2"
    question: >
      This method's own scope stops at DEFINING criteria and (per the
      runtime module) evaluating whether a structured_rule's threshold has
      been crossed given real observations. It does NOT perform the
      re-review/reversal ACTION itself once a criterion triggers -- Atlas
      gives no worked detail for what "re_review"/"kill" etc. concretely
      do at the platform level. Should a future method contract define
      that downstream action?
    owner: "operator, or whoever next builds the decision re-review workflow this method's triggered criteria would feed"
    blocks: "nothing in this file's own validity"
  - id: "OQ-REVERSALCRITERIA-3"
    question: >
      `cognitive_primitives: [VALIDATE, REFLECT, LEARN]` is this file's
      own inference, not a cited Atlas composition formula. Same open
      question class as every other Tier 1 contract's inferred
      primitives.
    owner: "operator, or whoever adds a dedicated Atlas §4 formula for this method, if one is ever written"
    blocks: "nothing in this file's own validity"


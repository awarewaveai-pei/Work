decided_by: >
  No ADR governs the content. Atlas §11.33 gives a real worked example
  (the strongest concrete-example grounding of any Tier 1 contract this
  session built, stronger even than `causal.dag`'s diagram -- this one is
  literally already in the target data shape) -- direct transcription plus
  low-risk, disclosed compilation choices. Registered in
  `methods/registry/contract-backlog.yaml` `tier_1` as a sixth concrete
  entry.

  `id: learning.reversal_criteria` mints a new machine_id, same situation
  `decision.ahp.contract.yaml` was in (method-inventory.yaml's own entry
  carries none). `family: learning` uses the exact "F17 learning" category

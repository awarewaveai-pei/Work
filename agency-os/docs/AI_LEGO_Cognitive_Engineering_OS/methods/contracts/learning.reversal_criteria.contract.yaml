$id: "ai-lego://methods/contracts/learning.reversal_criteria.contract.yaml"
title: "Reversal Criteria Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry (mandated by the actively-running Cognitive OS
  runtime slice, same class of justification as every Tier 1 contract this
  session built). Eighth Method Atlas slice, and the FIRST from the
  `learning` family (F17 -- "Learning / Reversal", Atlas index L317:
  "何時改變決策？"). Also the first method whose subject is a `Decision`
  Domain Object reference rather than a `CauseHypothesisSet` chain or a
  standalone analytical run.

  Atlas §11.33 (L1971-1995) gives this method a dedicated section: purpose
  (a literal quoted question, not a paraphrase), and -- uniquely among
  every Tier 1 contract this session built -- a REAL worked YAML example
  transcribed directly into this contract's typed object, not a diagram or
  prose description:

  ```yaml
  reversal:
    indicator: CAC
    condition: "> 300 USD for 3 consecutive months"
    action: re_review
    owner: growth_lead
  ```

  A fifth structural shape this session: not a chain (five_whys), a
  calculated ranking (pareto), a graph (causal.dag), or a pairwise-
  comparison matrix (decision.ahp) -- a MONITORING RULE (indicator +
  condition + committed action + accountable owner), evaluated over time
  against real observations, not produced once and left static.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §11.33 決策反轉條件／決策翻轉條件（Reversal Criteria）(L1971-1995) -- purpose, worked YAML example, benefits"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F17 index row (L317): 'Learning / Reversal | 何時改變決策？'"

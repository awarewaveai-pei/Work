  method: >
    Grepped the whole Atlas file for the F01 table (L330-345) and for
    "North Star Metric"/"北極星" -- single hit, L337, no dedicated section.
    Grepped for "KPI Tree" -- same single hit (L337 itself), confirming it
    is not catalogued elsewhere. Read ai_lego/modules/framing/goal_statement.py
    in full to confirm success_condition is a distinct static/project-scoped
    concept. Read ai_lego/modules/decision/wsjf.py in full to confirm no
    "core metric" overlap (different axis: definition vs scoring). Grepped
    the whole ai_lego/ and agency-os/docs/AI_LEGO_Cognitive_Engineering_OS/
    trees for "north_star"/"proxy_metric"/"anti_gaming" (case-insensitive)
    -- zero pre-existing hits before this slice. Read
    framing.goal_statement.contract.yaml/.py/.schema.yaml plus its CLI and

  - "OQ-WBS-2: cognitive_primitives is this file's own inference (Atlas §4 gives no formula for this method) (owner: operator, or whoever adds a dedicated Atlas §4 formula for this method)."
  - "OQ-WBS-3: quality.provenance_required:true and the record-level `provenance` field are a disclosed addition beyond this task's own literal design spec (which specified no provenance field anywhere in the shape) -- added for corpus-wide consistency (see decomposition.issue_tree.contract.yaml's own explicit 100%-universal-field claim, confirmed the same day/batch). A future pass could revisit if this turns out wrong (owner: operator)."
  - "OQ-WBS-4: global node-id uniqueness across the whole tree is NOT enforced (see compilation_decisions) -- should a future revision add it, matching decomposition.issue_tree's own ISSUETREE_DUPLICATE_NODE_ID precedent, if a downstream consumer ever needs to address a specific node unambiguously? (owner: operator)."


id: decomposition.wbs
version: "1.0.0"
family: decomposition

cognitive_primitives: [DECOMPOSE, MAP, VALIDATE]
# INFERRED, not cited -- Atlas §4 gives no composition formula for this method. DECOMPOSE = splitting the
# deliverable into work packages; MAP = structuring the resulting hierarchy; VALIDATE = Atlas's own "降低遺漏"
# (reducing omissions), made concrete here as the mechanical 100%-rule rollup check. Same triple
# decomposition.issue_tree.contract.yaml's own sibling contract already uses for the same family.

purpose:
  - break_down_a_deliverable_into_estimated_owned_work_packages

inputs:
  required: []
  optional: []
  # No upstream typed-object required -- Atlas's own L371 citation names no required input type, same
  # "no hard upstream dependency" position every other thin-citation F02/F08 contract in this suite takes.

outputs:
  - WorkBreakdownStructure
# NEW output type (see typed-objects/work-breakdown-structure.schema.yaml). Atlas names no PascalCase output
# type for this method, same honesty gap every other thin-citation contract in this suite discloses.

preconditions:
  - "deliverable is a well-shaped WbsNode tree (non-empty id/name at every node, children always a present list -- possibly empty for a leaf work package -- of recursively well-shaped WbsNode entries), recursion bounded to MAX_TREE_DEPTH=100"
  - "every LEAF node (children == []) carries a non-null owner AND non-null estimate_hours (Atlas's own 'Work package→owner/estimate' tier); every NON-LEAF node carries owner=null AND estimate_hours=null -- owner/estimate belong only to the work-package (leaf) tier, not the deliverable (parent) tier, matching Atlas's own left-to-right 'Deliverable→Work package→owner/estimate' progression"
  - "total_estimate_hours at EVERY node (leaf and non-leaf alike) is GENUINE_COMPUTE: the real sum of estimate_hours over all LEAF DESCENDANTS of that node (a leaf's own estimate_hours, for a leaf) -- never a builder parameter or caller-supplied value, mechanically re-derived bottom-up by the builder and independently re-derived by the gate from the record's own raw tree (the classic external WBS '100% rule': a parent's total work equals the sum of its parts)"

quality:
  provenance_required: true
  evidence_labeling_required: false
  # provenance_required:true is a disclosed ADDITION beyond this task's own literal design spec (which named no
  # provenance field anywhere) -- added for consistency with the 100%-universal-field convention across every
  # existing typed-object schema in this suite, a convention decomposition.issue_tree.contract.yaml's own
  # sibling (same batch, same family) explicitly re-confirms today. See open_questions and this task's own
  # deviation disclosure. evidence_labeling_required:false mirrors every other thin-bare-table-row F02/F08
  # contract's identical flag (no explicit unevidenced-claim misuse warning cited for this method).

forbidden_transition: []
# No §14.1-style legal/illegal chain citation exists for this method (grep-confirmed).

recommended_next: []
# Atlas L371's own "最佳搭配" (best combo) column names "Critical Path、RACI" -- grep-confirmed neither has a
# real machine_id anywhere in this corpus yet (only a forward reference to an unbuilt
# `architecture.critical_path_method` inside devops_sre.capacity_model.contract.yaml:214) -- left empty rather
# than naming a non-existent id. See open_questions.

rollback:
  side_effect_free: true

compilation_decisions:
  - question: "Node shape: recursive $ref self-reference (issue_tree-style) or a fixed-depth explicit set of $defs?"
    decision: "A single self-referential WbsNode $def, open recursion depth defensively bounded to MAX_TREE_DEPTH=100 -- same shape decomposition.issue_tree's own issue_tree_node already establishes for this same family; Atlas's own citation names no fixed depth."
  - question: "Should owner/estimate_hours live on every node (bcg_matrix-style per-item disclosure) or only on leaves?"
    decision: "Only on leaves (null on non-leaves) -- Atlas's own citation is a strict left-to-right tier progression 'Deliverable→Work package→owner/estimate': owner/estimate are a work-package-tier (leaf-tier) property, not a deliverable-tier (parent-tier) one. A parent claiming its own separate owner/estimate would double-count against its own children's real work."
  - question: "Should total_estimate_hours be caller-supplied (a disclosed estimate, non_goals/bcg_matrix-style judgment field) or GENUINE_COMPUTE?"
    decision: "GENUINE_COMPUTE, REQUIRED at every node -- the real, well-known external WBS '100% rule' is a mechanical bottom-up sum, same class decision.decision_tree's own expected_value rollup already establishes for a different arithmetic (max/weighted-sum vs plain sum here); no builder parameter exists for it, and the gate re-derives it fresh from the record's own raw estimate_hours/children fields via the SAME rollup function construction uses, never a second parallel implementation."
  - question: "Enforce global node-id uniqueness across the whole tree (issue_tree-style ISSUETREE_DUPLICATE_NODE_ID)?"
    decision: "No -- not one of this task's own 2 specified real invariants (leaf/non-leaf owner+estimate placement; GENUINE_COMPUTE rollup). Inventing a third mandatory gate-checked invariant with no citation or task-mandate grounding would be fabricated scope. Left as a disclosed gap, see open_questions."
  - question: "additionalProperties: false at the top level, and on the recursive WbsNode $def?"
    decision: "Yes, both -- baseline hygiene this directory converges on, set correctly from the start."


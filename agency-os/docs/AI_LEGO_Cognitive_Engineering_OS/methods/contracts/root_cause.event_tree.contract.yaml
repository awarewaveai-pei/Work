id: root_cause.event_tree
version: "1.0.0"
family: root_cause

cognitive_primitives: [DECOMPOSE, MAP, VALIDATE]
# INFERRED, not cited. Walking the initiating event forward through an
# ordered barrier sequence is DECOMPOSE; attaching success/failure (and
# optional probability) to each step is MAP; referential integrity +
# ordered-prefix reachability are VALIDATE.

purpose:
  - trace_an_initiating_event_forward_through_an_ordered_barrier_sequence_to_derive_distinct_outcomes
inputs:
  required: [ProblemStatement]
  optional: [EvidenceSet]
outputs: [EventTreeRecord]
preconditions:
  - "every outcomes[].path barrier_id resolves to a real barriers[].barrier_id in the same record (no dangling reference)"
  - "every outcomes[].path, position by position, equals an actual prefix of the declared barriers[] sequence -- length 1..len(barriers), never out of order, never skipping a position"
  - "barrier_id is unique within barriers[]; outcome_id is unique within outcomes[]"
quality:
  provenance_required: true
  evidence_labeling_required: false
forbidden_transition: []
# Atlas gives no worked forbidden-transition example for this method.
recommended_next: [architecture.adr]
# Same forward link root_cause.fault_tree's own contract already establishes
# for a confirmed structural analysis result: once barrier effectiveness is
# evaluated, the next real step is a decision record (add/strengthen a
# barrier, accept residual risk), not another root_cause hypothesis method.
rollback:
  side_effect_free: true

compilation_decisions:
  - question: "Reuse fault_tree's flat id-cross-referenced DAG shape, or a new ordered-sequence shape?"
    decision: "New ordered-sequence shape -- barriers[] is a flat list whose INDEX is semantically its position (unlike fault_tree's gates[], where list order carries no meaning); Atlas's own 'event→barriers...→outcomes' formula is inherently sequential, not a graph."
  - question: "Must every outcome's path traverse ALL barriers, or may it terminate early once determined?"
    decision: "May terminate early (path length 1..len(barriers)) -- a real, disclosed pruned-event-tree practice; a path must still be an exact ordered PREFIX, so early termination never skips or reorders a barrier."
  - question: "Require outcomes to exhaustively cover every success/failure combination (2^n completeness)?"
    decision: "No -- out of scope for this contract's 2 structural invariants (dangling reference + ordered-prefix reachability); tracked as OQ-EVENTTREE-2 rather than silently expanded."
  - question: "Mandate a numeric probability on every path step, matching classic quantitative ETA?"
    decision: "Optional, same as fault_tree's basic_event.probability -- qualitative-only trees stay legal; when present on every step of one outcome, event_tree.outcome_probability computes their product (Atlas's own '評估防護層' benefit, made quantitative)."
  - question: "Reuse ProblemStatement as the required input type (fault_tree's own precedent) or invent a bespoke placeholder (bow_tie's own precedent)?"
    decision: "Reuse ProblemStatement -- an initiating_event is conceptually 'a problem that already started to unfold', the same class fault_tree's own top_event is; mirrors the closer sibling, not the more distant one."

open_questions:
  - "OQ-EVENTTREE-1: task brief's own framing called this Atlas table row '7th of 9' -- grep-verified WRONG before writing anything (Atlas L438 is row 5 of 9: fishbone/5-whys/pareto/fault_tree/**event_tree**/bow-tie/kepner-tregoe/change-analysis/barrier-analysis). No action needed; recorded per R4 claim-before-verify.（owner: operator）"
  - "OQ-EVENTTREE-2: outcomes need not exhaustively cover every success/failure combination across barriers -- should a future revision add a completeness gate (WARN, not a hard invariant) for a record leaving a reachable combination undeclared?（owner: operator）"
  - "OQ-EVENTTREE-3: probability lives on each path STEP (the branch taken), not as a success-rate on the barrier itself (which would need success+failure summing to 1, extra invariant surface) -- should a future revision add that stricter, more classically-ETA-faithful shape?（owner: operator）"


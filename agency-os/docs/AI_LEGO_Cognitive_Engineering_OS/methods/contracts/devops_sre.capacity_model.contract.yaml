      `devops_sre.error_budget`'s own `related_slo_id` already
      established?
    owner: "operator, or whoever next builds devops_sre.load_test or devops_sre.stress_test"
    blocks: "nothing in this file's own validity"
  - id: "OQ-CAPACITYMODEL-3"
    question: >
      §12.41 Critical Path Method's own 限制 line (L3109: "資源限制另需
      resource leveling / capacity model") names this method as a
      complementary technique for a resource-constrained critical path
      -- a critic review found this contract's first draft omitted this
      real citation while disclosing a purely speculative Load Test/

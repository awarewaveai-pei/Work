      future revision of `architecture.critical_path_method` (unbuilt)
      cross-reference this method as its own recommended remediation
      for a resource-constrained path?
    owner: "operator, or whoever next builds a Critical Path Method slice"
    blocks: "nothing in this file's own validity"


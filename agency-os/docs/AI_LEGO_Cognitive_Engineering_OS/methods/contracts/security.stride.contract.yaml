title: "STRIDE Threat Model Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry. Forty-fourth Method Atlas slice, FIRST member
  of a NEW `security` family (F20's own "資安／隱私套件 (Security /
  Privacy Pack)") -- the fourth pack family this session opens, after
  F18 Software Architecture (8 of 10 table rows built, 2 disclosed
  scope skips -- DDD explicitly not built per `architecture
  .event_storming.contract.yaml`, Architecture Trade-off Matrix
  explicitly skipped per `devops_sre.sli_slo.contract.yaml` -- NOT yet
  complete), F19 DevOps/SRE (13/13 table rows built, complete), and F21
  database_data (9 built + 1, Schema Compatibility Analysis, confirmed
  already covered by a sibling's own stage -- complete).

  Atlas gives this method FOUR citations, broad grep across ALL THREE
  normative documents from the FIRST draft (the standing discipline
  every `database_data` slice since the third consecutive due-diligence
  miss established): (1) the F20 tool table's STRIDE row (L882: purpose
  "系統化找常見安全威脅"; usage "DFD→Spoofing/Tampering/Repudiation
  /Information Disclosure/DoS/Elevation"; benefit "威脅覆蓋完整"); (2)
  a dedicated §11.44 STRIDE 威脅建模 section (L2225-2245: the SAME six
  categories spelled out in English -- Spoofing, Tampering, Repudiation,
  Information Disclosure, Denial of Service, Elevation of Privilege --
  usage "Data Flow Diagram → element-by-element threat enumeration →
  controls → residual risk", benefit "建立一致、可重複的威脅分析"); (3)
  the Method Selection Engine's own Security problem-type recipe row
  (§10, L1112: "Assets/DFD→STRIDE/LINDDUN→Attack Tree→Controls→Test"),
  independently confirming the same Assets→DFD→threat-method→Controls
  →Test sequence; (4) §13.11 Security Review Recipe (L3472-3487: "Asset
  Inventory → Data Flow Diagram → Trust Boundaries → STRIDE → LINDDUN →
  Attack Tree → Secret/Identity Review → Supply Chain Review → Control
  Mapping → Adversarial Test → Residual Risk → Human Security
  Approval") -- a THIRD, independent Atlas-side confirmation of the
  Assets→DFD→Trust-Boundaries ordering (a gap the first draft of this
  contract missed, caught by critic review; §13.11 also names a
  review-LEVEL "Residual Risk" step after Control Mapping/Adversarial
  Test, distinct from this record's own per-THREAT `residual_risk`
  field -- disclosed as a real, un-modeled gap in `OQ-STRIDE-6`).

  **A fifth, load-bearing citation found by the broadened search**:
  Execution Contract §32 Security Change Contract (L1231-1260) mandates
  a REAL minimum structure -- "Assets / Trust Boundaries / Entry Points
  / Threats / Controls / Residual Risk / Test Evidence" (L1250-1257) --
  for ANY change touching authn/authz/secrets/crypto/network/egress/
  tenant-isolation/file-parsing/user-content/AI-tools, and explicitly
  NAMES STRIDE as one of the methods Method Atlas may use to satisfy
  it ("Method Atlas 可選 STRIDE／LINDDUN／Attack Tree／PASTA", L1260).
  This is the authoritative CONTAINER structure; Atlas's own §11.44
  formula is the STRIDE-SPECIFIC way of filling its own "Threats" step;
  §13.11 independently confirms the same framing-fields ordering. This
  record's own field design merges all three: `assets`/`trust
  _boundaries`/`entry_points` (EC §32's own first three elements,
  Atlas §13.11's own first three recipe steps) frame the review;
  `data_flow_elements` (Atlas's own "DFD" step, §13.11's own second
  step) is the structural substrate; `threats[]` entries carry EC
  §32's own remaining four elements (category via STRIDE's own six-
  value vocabulary, plus per-threat `control`/`residual_risk`
  /`test_evidence`) together in one place, since a completed review's
  own controls, residual-risk judgment, and test evidence are naturally
  scoped to the SPECIFIC threat they answer, not the review as a whole.

  Also cross-checked: `specs/execution/risk-tier.schema.yaml`'s own
  HIGH-tier `required_actions` list already names "Threat Review" as a
  mandatory gate action (L93) -- a real, confirming cross-reference
  (this method is what satisfies that gate for STRIDE-chosen reviews),
  not a duplicate structure (that file models a RISK-TIER POLICY, not
  threat-review content itself). `specs/cognitive/problem-type
  .schema.yaml`'s own `security` problem-type entry (L291-296)
  `recommended_start` is a verbatim transcription of the same §10
  L1112 recipe row above -- a second confirming cross-reference, not
  a duplicate.

  Due-diligence search, broad across all three normative documents and
  the spec root from the first draft: case-insensitive greps for
  "STRIDE"/"spoofing"/"tampering"/"repudiation"/"elevation of
  privilege"/"data flow diagram"/"trust boundar"/"entry point"/"threat
  review". Real neighbours found and confirmed distinct: `specs
  /execution/handoff.schema.yaml`'s own "trust boundary" (L648, a
  generic verification-limitation sense -- "content truth is not
  mechanically checked" -- unrelated to a STRIDE/DFD trust-boundary
  diagram element); `specs/cognitive/typed-objects/red-team-challenge
  .schema.yaml` (Atlas §11.23 Red Team, an 11-item generic adversarial-
  review checklist with a "no final authority" rule -- a DIFFERENT
  method entirely, not STRIDE's own six fixed threat categories,
  confirmed by direct read). No existing typed object in `specs
  /security/` (`key-vault-lifecycle`, `log-redaction-token`,
  `personal-data-envelope`, `tenant-isolation-controls`) models threat-
  review content -- all four are narrower, specific security-control
  records. No duplicate typed object found.

  **A real prose neighbour, found by critic review, not this method's
  own first-draft search**: `docs/architecture/SECURITY_THREAT_MODEL
  .md` is this repository's OWN completed STRIDE+LINDDUN review (dated
  2026-08-29, PROPOSED status), the flagship real-world instance of
  this exact method inside this spec root. It is NOT a duplicate typed
  object (it is unstructured markdown, not a machine-validated record),
  but reading it against this record's own schema surfaces three real,
  disclosed modeling gaps this contract did not anticipate: (a) its own
  threat table (§3/§4) carries `Source`/`Severity` columns this
  record's own `threat` shape has no field for; (b) at least one of its
  own threats (S2, "人類 Approver session" phishing/hijack) is scoped
  to a TRUST BOUNDARY, not a `data_flow_elements[]` entry -- this
  record's own referential-integrity invariant only recognizes the
  latter; (c) its own `test_evidence`-equivalent row is filled with the
  literal string "不適用於本階段" (not applicable at this stage) for
  the ENTIRE review, a review-level disclosure this record's own
  per-threat `test_evidence` REQUIRED-field design (see
  compilation_decisions below) would force into being repeated
  per-threat instead. All three are disclosed as `OQ-STRIDE-6`, not
  silently unmodeled.

  Real structural invariants that make this record a genuine MODEL:
  every `threats[]` entry's own `element_name` must name a real
  `data_flow_elements` entry (referential integrity, the same class
  `database_data.erd`'s own relationship checks already establish);
  `category` is Atlas's own closed six-value STRIDE vocabulary,
  transcribed verbatim; `element_type` is the standard, textbook four-
  element DFD vocabulary (External Entity / Process / Data Store / Data
  Flow -- Yourdon/Gane-Sarson notation, the same class of established,
  non-invented external theory `database_data.normalization`'s own
  relational-algebra citation already draws on, not this session's own
  invention). `elements_with_no_recorded_threats` is GENUINE, RE-
  DERIVED evidence (the `data_flow_elements[]` names with zero
  `threats[]` entries referencing them) -- surfacing Atlas's own
  "威脅覆蓋完整" (complete threat coverage) benefit as INFORMATION, not
  as an enforced completeness requirement (a caller may have genuinely
  reviewed an element and found no applicable threat).


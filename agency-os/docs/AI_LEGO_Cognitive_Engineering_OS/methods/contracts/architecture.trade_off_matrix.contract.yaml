id: architecture.trade_off_matrix
version: "1.0.0"
family: architecture

cognitive_primitives: [COMPARE, WEIGHT, CALCULATE, PRIORITIZE]
# IDENTICAL to decision.mcda.contract.yaml's own set (L93) -- same real
# operations, same domain-neutral method, applied here to Atlas L825's own
# subject (candidate architectures) rather than a re-derived set.

purpose:
  - score_and_rank_candidate_architectures_against_weighted_multi_criteria
# Same operation as decision.mcda's own purpose
# (score_and_rank_options_against_weighted_multi_criteria), narrowed to
# Atlas L825's own usage column: "比較候選架構" (compare candidate
# architectures).

inputs:
  required: [Options, Criteria, RawScores, Weights]
  optional: []
# IDENTICAL to decision.mcda.contract.yaml's own inputs (L112-118) --
# Options here are candidate architectures (Atlas L825's own "options"
# stage), not a new input shape.

outputs: [MCDAAnalysis]
# REUSES decision.mcda's own already-built typed object
# (specs/cognitive/typed-objects/mcda-analysis.schema.yaml) verbatim. This
# contract mints NO architecture-trade-off-matrix-*.schema.yaml -- see
# description/compilation_decisions for why a new type would be
# undisclosed duplication, not new scope.

preconditions:
  - "identical to decision.mcda.contract.yaml's own preconditions (every criterion carries a direction; weights are non-negative and sum to 1.0, tolerance 1e-6; every raw_scores entry references a known option_id and criterion_id) -- not restated here as a second, driftable copy; enforced by the same ai_lego/modules/decision/mcda.py this method's runtime output is actually generated by"

quality:
  provenance_required: true
  evidence_labeling_required: false
  # Inherited, not independently declared: this method's own runtime
  # output IS an MCDAAnalysis record produced by decision.mcda's own
  # generate_mcda_analysis, so it carries decision.mcda's own quality
  # profile automatically.

forbidden_transition:
  - "Automatic Authority"
# Inherited, not independently re-derived: outputs ARE MCDAAnalysis
# records, so Atlas §22.3 L4154's own MCDA row (the only citation) already
# applies transitively -- enforced by
# ai_lego/modules/decision/mcda.py::assert_no_automatic_authority_claim and
# mcda-analysis.schema.yaml's own additionalProperties:false. §22.3's own
# gate table (L4142-4155, grep-confirmed) has no separate Architecture
# Trade-off Matrix row of its own.

recommended_next: [architecture.adr]
# Same reasoning class every other F18 sibling's own recommended_next
# already uses -- a trade-off decision naturally feeds an ADR
# (architecture.adr, already built). INFERRED, not literally cited at
# L825.

rollback:
  side_effect_free: true

compilation_decisions:
  - question: "Should this method get its own new typed object / module / CLI / test, or reuse decision.mcda's already-built pipeline?"
    decision: "Reuse -- this contract mints a machine_id and Tier 1 registry entry for Atlas L825's own row only; a caller invoking 'Architecture Trade-off Matrix' calls decision.mcda's own generate_mcda_analysis with candidate architectures as options[]."
  - question: "Is this the first time this reuse finding was made in this codebase?"
    decision: "No -- devops_sre.sli_slo.contract.yaml already disclosed the identical finding while surveying F18 before opening a different family; this contract gives that finding its own dedicated machine_id-bearing home rather than re-deriving a different answer."

open_questions:
  - id: "OQ-TOM-1"
    question: "If a future Atlas revision gives this method a dedicated §11.x section with a genuinely new field beyond decision.mcda's own pipeline (e.g. a structured per-option risk field distinct from sensitivity_notes), should a real module/typed-object be built then?（owner: operator, or whoever next reads Atlas for additional Architecture Trade-off Matrix content）"
  - id: "OQ-TOM-2"
    question: "RESOLVED (2026-09-07). method-inventory.yaml updated to has_contract:true/machine_id:architecture.trade_off_matrix/line:825 in the same integration pass that registered this contract.（owner: operator）"
  - id: "OQ-TOM-3"
    question: "This is the only ACTIVE contract in the suite with zero automated test coverage of its own (critic finding, 2026-09-07) -- its entire value is a cross-file identity claim against decision.mcda, the easiest kind of claim to silently rot. tests/unit/test_mcda.py now asserts the resolver resolves this machine_id and its inputs/outputs/forbidden_transition/cognitive_primitives still equal decision.mcda's own -- should coverage go further (e.g. a golden-suite check) if decision.mcda's contract ever changes shape?（owner: operator）"


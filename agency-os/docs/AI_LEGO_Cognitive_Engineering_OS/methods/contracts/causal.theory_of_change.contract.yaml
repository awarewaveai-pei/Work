id: causal.theory_of_change
version: "1.0.0"
family: causal

cognitive_primitives: [DECOMPOSE, MAP, VALIDATE]
# INFERRED, not cited. The 6-stage chain is a DECOMPOSE of "intervention ->
# impact" into a causal pipeline; laying out stages+transitions is MAP; the
# per-arrow Assumption/Evidence/Indicator/Risk requirement (L1703-1708)
# demands each link be VALIDATE-able, same primitive class causal.dag's own
# VALIDATE member already establishes for a different structural check.

purpose:
  - trace_how_an_intervention_produces_outcomes_and_impact_through_an_explicit_assumption_bearing_causal_chain
inputs:
  required: []
  optional: []
  # Atlas §11.22 gives no upstream typed-object dependency (unlike Atlas F02's
  # own 最佳搭配 column naming Objective Tree as a feeder, L367) -- see
  # open_questions on why that is not turned into a hard or soft dependency here.
outputs: [TheoryOfChangeRecord]
preconditions:
  - "stages is EXACTLY the six entries {INPUTS, ACTIVITIES, OUTPUTS, SHORT_TERM_OUTCOMES, LONG_TERM_OUTCOMES, IMPACT}, one each, IN THAT ORDER -- Atlas's own literal mermaid chain order (L1695-1700)"
  - "transitions is EXACTLY the five adjacent-stage-pairs, one each, IN THAT ORDER -- transitions[i] connects stages[i] to stages[i+1]"
  - "every transition carries a non-empty assumption, evidence, indicator, AND risk -- unconditional, per Atlas's own '每條箭頭都應有' (L1703-1708), no exception"
quality:
  provenance_required: true
  evidence_labeling_required: true
  # Every stage and transition is a claim about how the intervention actually
  # works until independently validated -- same evidence-discipline shape
  # causal.dag/framing.five_w_one_h/association.concept_map already use.
forbidden_transition: []
# Atlas §11.22 gives no explicit forbidden-transition worked example, and F11's
# table (L614-624) has no §22.3 Method-specific Gate row for this method
# (grep-confirmed) -- left genuinely empty rather than inventing one.
recommended_next: []
# F11's own tool table (L614-624) has only 4 columns (工具/用途/使用方式/效益) --
# no 最佳搭配/推薦 column, unlike F04's 5-column table that grounded
# association.concept_map's own recommended_next: [causal.dag]. Left empty,
# same "no citation, no invention" restraint every other empty-recommended_next
# sibling in this directory already applies.

compilation_decisions:
  - question: "Positional array (prefixItems, matching framing.five_w_one_h) or explicit from/to references (matching association.concept_map) to lock each transition to its correct adjacent stage pair?"
    decision: "Both. prefixItems positionally locks the 5-entry array order AND each entry also carries its own const-locked from_stage/to_stage fields -- see typed-object schema's own compilation_decisions for the full reasoning."
  - question: "Should assumption/evidence/indicator/risk be conditionally required (matching concept_map's conditional supporting_evidence_refs)?"
    decision: "No -- all 4 are unconditionally required and non-empty on every transition. Atlas's own citation states this as an unqualified property of every arrow."
  - question: "Add a GENUINE_COMPUTE derived field, matching framing.five_w_one_h's information_gaps / association.concept_map's orphan_node_ids?"
    decision: "No. Atlas's own benefit column for this row (L618, '建可驗證政策邏輯') names no gap/orphan-style computed property. The real invariant here is the fixed 6-stage/5-transition shape plus the unconditional 4-attribute completeness per transition, same 'no invented third invariant' restraint causal.dag's own acyclic_verified-as-structural-const (not a derived comparison field) already applies."
  - question: "Depend on Atlas's own named feeder (Objective Tree, F02 L367), unbuilt at this write time, via a hard or soft input reference?"
    decision: "No dependency of any kind, not even an optional soft-link field. This task's own scope explicitly frames Objective Tree as 'note as open question, don't depend on it' -- a stronger restraint than framing.five_w_one_h's/association.concept_map's own optional forward soft-links to THEIR named-next unbuilt siblings, disclosed as a deliberate divergence driven by this task's own instruction rather than a citation-grounded reason."

open_questions:
  - "OQ-THEORYOFCHANGE-1: F02's Objective Tree (Atlas L367, unbuilt at this write time) is named as this method's own upstream feeder via the §12.8/§13.7 recipe chains cited above. No dependency (hard or soft) is added here per this task's own explicit scope instruction (owner: operator, or whoever next builds framing.objective_tree and reconciles the chain)."
  - "OQ-THEORYOFCHANGE-2: `cognitive_primitives: [DECOMPOSE, MAP, VALIDATE]` is this file's own inference, not a cited Atlas composition formula (owner: operator, or whoever adds a dedicated Atlas §4 formula for this method)."
  - "OQ-THEORYOFCHANGE-3: Atlas's own Logic Model row (L619, 'inputs→activities→outputs→short/long outcomes') is structurally near-identical to this method minus Impact and minus the per-arrow Assumption/Evidence/Indicator/Risk requirement -- landing concurrently via a different agent in this same batch, not read or depended on here; a future integration pass should confirm the two methods stay genuinely distinct in their own typed-object shapes (owner: operator, integration pass)."


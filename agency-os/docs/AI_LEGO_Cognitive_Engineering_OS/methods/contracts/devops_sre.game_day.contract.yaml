title: "Game Day Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry. Thirty-fourth Method Atlas slice, NINTH from
  the `devops_sre` family (F19), after `devops_sre.sli_slo`
  (twentieth), `devops_sre.canary_deployment` (twenty-first),
  `devops_sre.chaos_engineering` (twenty-second),
  `devops_sre.blue_green_deployment` (twenty-third),
  `devops_sre.error_budget` (twenty-fourth), `devops_sre.capacity_model`
  (thirty-first), `devops_sre.release_readiness_review` (thirty-second),
  and `devops_sre.runbook_execution` (thirty-third).

  Atlas gives this method exactly ONE citation of its own: the F19 tool
  table's Game Day row (L858: "scenario→roles→inject→recover→AAR",
  purpose "演練故障與 runbook", benefit "驗證人與流程" -- verify people
  and process). No dedicated §11.x section exists (confirmed by direct
  read of the surrounding table, L848-863, and a full spec-root
  case-insensitive grep for "game day"/"gameday" returning only this
  table row, the two method inventories' own entries, and
  `devops_sre.runbook_execution`'s own OQ-RUNBOOKEXECUTION-2).

  The formula's own final phase, "AAR", is itself a NAMED Atlas method:
  F17's After Action Review row (L804: "比較預期與實際 | Expected?
  Actual? Why? Next? | 快速組織學習"). This contract transcribes those
  four questions as the structure of its own `aar` phase output rather
  than inventing a findings/action-items shape -- but does NOT mint an
  F17 machine_id, does not build gates for After Action Review as a
  standalone method, and leaves that F17 entry pending in
  method-inventory.yaml exactly as it was. The `aar` object is Game
  Day's own phase output, cited to the row that defines what an AAR
  asks (see compilation_decisions and OQ-GAMEDAY-2).

  Due-diligence search, deliberately BROADER than a name-only grep (the
  narrow-grep class both `devops_sre.release_readiness_review`'s and
  `devops_sre.runbook_execution`'s own critic rounds caught in
  consecutive slices): case-insensitive spec-root greps for "AAR /
  after action / postmortem / post-mortem", "演練 / drill / tabletop",
  and the already-known "inject" neighbourhood. Real neighbours found,
  each read and each confirmed distinct: (1) `devops_sre
  .chaos_engineering` (built, §11.43) -- injects a fault to test a
  SYSTEM's steady-state hypothesis within a blast radius; Game Day
  injects a failure to rehearse PEOPLE and PROCESS (roles, runbook,
  AAR) -- Atlas lists them as separate F19 rows with separate benefit
  columns ("找隱藏 dependency" vs "驗證人與流程"); a game day may run a
  chaos experiment as its inject phase, disclosed as OQ-GAMEDAY-5, not
  built. (2) `database_data.backup_restore_drill` (built, §12.40) -- a
  DATA restore drill measured against RTO/RPO; distinct object, distinct
  family. (3) `docs/architecture/DEVOPS_SRE_PLAN.md` §3.1 "演練週期"
  table -- schedules a semi-annual "完整跨區 failover 演練" and
  quarterly restore drills; this is the closest real sibling artifact
  (a scheduled DR exercise IS a game-day-class event), operational-
  procedure prose in this same family's scoped-authority plan, not a
  typed object; relationship disclosed as OQ-GAMEDAY-3, not cross-
  referenced. (4) Execution Contract §55 Incident Mode (L1905-1923) ends
  its own incident flow at "Post-mortem", and `DEVOPS_SRE_PLAN.md` §1.4's
  incident record carries `postmortem_ref` -- both are REAL-incident
  learning steps, Atlas's own separate F17 Post-mortem row (L805), not
  a rehearsal's AAR. (5) `specs/execution/risk-tier.schema.yaml:122` and
  `policies/ai-execution/mandatory-gates.yaml` name "Recovery Drill" as
  an R4 required ACTION -- a policy-layer action name, not a typed
  object. (6) ADDED post-critic-review -- `rehears*` was also searched
  after the review found this contract's own purpose verb ("rehearse")
  missing from the term list: Atlas L838, L867, L1111, L3420, L3449 and
  L4481 use "Rehearsal" as an unnamed pre-deploy flowchart/table step (no
  tool-table row, no formula, no benefit column), and the Execution
  Contract §55 incident flow already cited above carries "Rehearsal"
  two steps before "Deploy" -- read, not a method, not a typed object.
  No duplicate typed object or method found; the search that reached
  that conclusion is the broad one, recorded here.

  `id: devops_sre.game_day` follows Atlas's own row name. The typed
  object is a `GameDayRecord` -- ONE EXERCISE's own record, the same
  "record reports on a real event executed elsewhere" split every prior
  devops_sre record-class contract already draws.

  Atlas's own 5-phase formula grounds FOUR real invariants this
  contract enforces: (1) "roles" -- every role is unique (an exercise
  whose benefit is verifying PEOPLE cannot have two people ambiguously
  holding the same role); (2) "recover" -- a recovery duration exists
  iff the recovery happened (`time_to_recover_minutes` REQUIRED when
  `outcome: recovered`, FORBIDDEN when `not_recovered`); (3) the
  optional `recovery.runbook_execution_ref`, when supplied, carries the
  `RunbookExecutionRecord` id prefix `RBEXEC-` -- the soft link
  `devops_sre.runbook_execution`'s own OQ-RUNBOOKEXECUTION-2 asked for;
  (4) "AAR" -- all four of Atlas L804's own questions are answered
  (non-empty), because an AAR with a blank question has not performed
  the phase.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F19 tool table, Game Day row (L858): 'scenario→roles→inject→recover→AAR'"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F17 tool table, After Action Review row (L804): 'Expected? Actual? Why? Next?' -- cited for the `aar` phase's own four fields ONLY; the F17 method itself is not minted here"
  - "methods/registry/method-inventory.yaml Game Day entry (L1162-1166): category 'F19 devops-sre', line field reads 855 -- CORRECTED here to the real L858 position, the same systematic +3 drift already disclosed by seven prior contracts this session (Error Budget, Backup/Restore Drill, Reconciliation, Expand-Contract Migration, Capacity Model, Release Readiness Review, Runbook Execution), now observed a NINTH time"
  - "methods/registry/method-inventory.yaml After Action Review entry (L1042-1046): category 'F17 learning', line field reads 801 (real L804, same +3 drift), has_contract:false -- left UNCHANGED by this contract"
  - "specs/cognitive/method.schema.yaml -- the schema this file's body is validated against"

decided_by: >
  No ADR governs the content. Registered in
  `methods/registry/contract-backlog.yaml` `tier_1` as a
  thirty-second concrete entry. `id: devops_sre.game_day` mints a new

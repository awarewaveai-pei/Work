$id: "ai-lego://methods/contracts/security.zero_trust_review.contract.yaml"
title: "Zero Trust Review Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry. Forty-ninth Method Atlas slice, SIXTH member of
  the `security` family (F20's own "資安／隱私套件"), after
  `security.stride` (44th), `security.linddun` (45th),
  `security.attack_tree` (46th), `security.pasta` (47th), and
  `security.dpia_pia` (48th). Four more F20 table rows (Secrets Threat
  Review, Supply Chain Threat Model, Abuse Case, Security Control
  Mapping) are being built CONCURRENTLY by separate agents in this same
  session -- not yet landed as of this file's own writing, no
  coordination needed since none of these files overlap.

  **THREE distinct sources name this method, across TWO different mother
  documents, disagreeing with each other in a genuinely different way
  than any prior F20 slice's own table-row-vs-dedicated-section
  question**:

  1. Atlas's own F20 tool table row (`AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md:887`):
     purpose "每次存取皆驗證"; usage
     "subject/workload/resource→authn/authz→short-lived credential
     →audit" (a real, ORDERED "→" chain of FOUR positions, but the
     FIRST position is itself "/"-joined -- subject/workload/resource
     -- i.e. three PARALLEL concerns under simultaneous verification,
     not a 3-step sub-sequence; "authn/authz" at position 2 is a single
     access-decision step with two named aspects, not itself a further
     ordered pair); benefit "降 lateral movement".
  2. Atlas's OWN dedicated section, §12.37 "零信任架構／零信任安全模型"
     (`AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md:3027-3042`):
     a bullet-point "工程重點" checklist of SIX items -- Strong identity
     / Workload identity / Short-lived credentials / Least privilege /
     Explicit policy decision / Continuous logging/audit -- with NO
     "→" anywhere in that section, i.e. deliberately UNORDERED. This is
     the MIRROR IMAGE of `security.dpia_pia.contract.yaml`'s own
     table-row-vs-dedicated-section precedent (there, the dedicated
     §11.46 section was BOTH richer AND more precisely ordered than the
     table row, so it won as the `stages` authority). Here, Atlas's OWN
     dedicated section is LESS structurally useful than its OWN table
     row for defining a `stages` shape, because it is the one that
     drops all sequencing.
  3. Master Plan's own §62 "Zero Trust" (`AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md:2636-2657`),
     a DIFFERENT mother document: a real, ORDERED six-step chain
     (`Identity → Workload Identity → Mutual Authentication →
     Short-lived Credentials → Policy Decision → Resource Access`),
     PLUS an explicit "禁止" (forbidden) list (`Shared Password` /
     `Long-lived API Key` / `Hard-coded Secret`, L2652-2656) that no
     other Zero-Trust-relevant citation in this spec root names.

  **Decision on which source is authoritative for `stages`' own
  positional shape**: Atlas's OWN F20 table row (L887), for a reason
  genuinely different from every prior F20 slice's own detail-precedence
  reasoning. `security.dpia_pia`'s own precedent picked the dedicated
  section because it was richer AND better-ordered than its table row.
  Here the table row is picked NOT because it is richer (Master Plan
  §62's six-step chain is objectively richer), but because it is the
  ONLY genuinely ORDERED source that also lives in the SAME document
  and SAME F20 table that defines this method's own membership in the
  family this slice is building for -- Atlas's own dedicated §12.37 is
  actively LESS useful for staging (a checklist, no arrows at all), and
  Master Plan §62, while real and ordered, is a separate document with
  its own scope (MP's own Security Architecture narrative, §61-63), not
  the F20 catalog itself. Master Plan §62's own distinctive content
  (Mutual Authentication, Resource Access, the explicit forbidden list)
  and Atlas §12.37's own distinctive content (Least privilege,
  Continuous logging/audit's own "continuous" qualifier) are NOT
  discarded -- they are folded in as real, disclosed PER-STAGE FIELD
  ENRICHMENT within the F20 table row's own four-position pipeline
  (see compilation_decisions), the same "real practice enriches a
  minimal Atlas-named stage" class `security.pasta.contract.yaml` and
  `security.dpia_pia.contract.yaml` both already establish, applied
  here across a genuine CROSS-DOCUMENT enrichment rather than a
  same-document one.

  **A FIFTH structural sub-variant among F20 members**: STRIDE/LINDDUN
  share a flat-DFD shape; Attack Tree is a recursive AND/OR tree; PASTA
  and DPIA/PIA are both fixed-length positionally-ordered pipelines
  (seven and eight stages respectively) with every position a scalar
  narrative/array stage. `security.zero_trust_review` is ALSO a
  fixed-length positionally-ordered pipeline (four stages), but its
  FIRST position (`identity_context`) is itself a REQUIRED SET of three
  distinct, parallel, independently-shaped sub-entities (subject/
  workload/resource) rather than a single narrative or array field --
  a genuinely new sub-variant neither PASTA nor DPIA/PIA's own pure
  linear-tuple shape already covers, directly extending
  `OQ-PASTA-4`/`OQ-DPIAPIA-4`'s own running "is F20 one shape or many"
  survey with a fifth confirmed distinct answer.

  **Grep-confirmed ZERO mentions of "Zero Trust"/"zero_trust"/"零信任"
  ANYWHERE in the Execution Contract** (case-insensitive, whole-document
  search, not merely within §32) -- even stronger absence evidence than
  `security.dpia_pia`'s own EC search (which only confirmed zero DPIA/PIA
  mentions within an EC that still discusses adjacent topics). EC §32's
  own closing sentence (L1260) names exactly "STRIDE／LINDDUN／Attack
  Tree／PASTA", no fifth option, and this term never appears anywhere
  else in that document either.

  **A more NUANCED non-membership than `security.dpia_pia`'s own,
  disclosed honestly rather than copy-pasting that precedent's simpler
  "genuinely orthogonal trigger" framing**: DPIA/PIA's own trigger
  (personal-data processing) shares NO vocabulary with EC §32's own
  trigger list (authn/authz/secrets/crypto/network/egress/tenant
  -isolation/file-parsing/user-content/AI-tools). Zero Trust Review's
  own subject matter -- authn/authz decisions, credential issuance --
  genuinely OVERLAPS several of those exact EC §32 trigger words. This
  means a real code change that touches authn/authz/secrets (and thus
  DOES trigger EC §32's own mandatory gate) is a plausible, real
  scenario for Zero Trust Review to also apply to -- unlike DPIA/PIA,
  where the two methods' own trigger conditions rarely coincide on the
  same change. But EC §32's own closing sentence is a closed,
  enumerated list of exactly four acceptable methods for satisfying
  ITS OWN gate; Zero Trust Review is not named among them, regardless
  of subject-matter overlap. Consequence, disclosed rather than
  smoothed over: a Zero Trust Review of an authn/authz-touching change
  is REAL, VALUABLE, COMPLEMENTARY security work, but it does NOT
  substitute for the EC §32 gate itself -- a change triggering that
  gate still needs one of STRIDE/LINDDUN/Attack Tree/PASTA to satisfy
  it, even if a Zero Trust Review is ALSO performed on the same change.

  **Because no source names `assets`/`trust_boundaries`/`entry_points`
  for this method, this record carries NONE of EC §32's own framing
  triplet** -- confirmed by direct read of all three Zero-Trust-relevant
  citations (Atlas table row, Atlas §12.37, MP §62): none mentions an
  asset list, a trust boundary, or an entry point anywhere. The SECOND
  F20 typed object to omit that triplet (after `security.dpia_pia`),
  for a genuinely different disclosed reason (nuanced trigger-overlap
  non-membership, not orthogonal-trigger non-membership) -- see
  `security.stride.contract.yaml`'s own `OQ-STRIDE-4`, updated again by
  this contract's own `resolved_by`.

  **Real, already-ratified system-wide infrastructure this record
  SOFT-REFERENCES but does NOT duplicate**: `docs/adr/ADR-016-zero-trust-workload-identity-and-pdp-selection.md`
  (ACCEPTED) and `policies/security/zero-trust.policy.yaml` (ACTIVE)
  already ratify THREE singleton, system-wide vendor/engine decisions --
  IdP = Zitadel (self-hosted), workload identity strategy =
  "cloud-native workload identity + short-lived-credential mTLS"
  (SPIFFE explicitly deferred), PDP engine = Cedar. These are a
  DIFFERENT LAYER than this method: a one-time, static CONFIGURATION
  decision ("which vendor/engine did we pick, system-wide"), not a
  per-access-flow REVIEW record ("does THIS specific subject/workload
  /resource access path actually implement Zero Trust correctly").
  `identity_context.subject.idp_ref`, `identity_context.workload
  .workload_identity_strategy_ref`, and `access_decision.pdp_engine_ref`
  are all OPTIONAL, NULLABLE, FREE-TEXT (not `const`) soft references
  whose descriptions cite the real ratified values verbatim -- free
  text, not `const`, because a REVIEW record's entire purpose is to be
  able to represent a NON-compliant finding (e.g. a legacy access path
  still using a different, non-ratified engine) without being
  schema-blocked from recording that fact; pinning these to `const`
  would make every non-compliant review illegal to even write down,
  defeating the record's own reason to exist. **Technical constraint,
  independently re-verified by direct read of
  `ai_lego/core/contracts/schema_contracts.py:23-36`**: `SchemaContracts.__init__`
  only walks `spec_root / "specs"` (`.rglob("*.yaml")`, line 28) into
  its `$id`-keyed registry -- `policies/security/zero-trust.policy.yaml`
  lives under `policies/`, outside that walk, so a hard JSON Schema
  `$ref` into it could never resolve. Confirmed by direct read, not
  merely asserted from the task brief.

  **No real DEPLOYED instance exists in this repository to model a CLI
  demo on, unlike `security.dpia_pia`'s own genuine ADR-002 precedent,
  disclosed honestly rather than overclaiming one** -- ADR-016's own
  `Migration` section states explicitly: "實際自架 Zitadel 的基礎設施
  建置（安裝、設定、與既有系統整合）是獨立於本 ADR 的未來實作任務，本
  ADR 只批准「選 Zitadel」這個決策，不涵蓋部署本身" (the actual
  infrastructure build-out is future work independent of this ADR; the
  ADR approves only the DECISION, not deployment). The same class of
  disclosed gap `security.pasta.contract.yaml`'s own "no real-world
  usage instance exists... unlike STRIDE/LINDDUN's own due-diligence
  neighbour" already establishes, applied here for a different reason
  (infrastructure not yet built, vs. PASTA's own case of the repo simply
  never having chosen PASTA). This contract's own CLI demo and schema
  example are therefore explicitly ILLUSTRATIVE of what a COMPLIANT
  record would look like once ADR-016's ratified infrastructure is
  actually deployed, grounded in the REAL ratified values (Zitadel/
  Cedar/mTLS strategy string), not a claim that a real, deployed access
  path was actually reviewed.

  Two real invariants beyond stage completeness-and-order:

  1. **Positionally-ordered four-stage pipeline whose first position is
     a required SET of three parallel entities** -- Atlas's own F20
     table row (L887) grounding, described above.
  2. **Forbidden credential-type denylist** on the `credential_issuance`
     stage -- `credential_type` may never be `shared_password` /
     `long_lived_api_key` / `hardcoded_secret`, transcribed directly
     from Master Plan §62's own explicit "禁止" list
     (`AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md:2652-2656`).
     Unlike DPIA/PIA's two invariants (both cross-stage referential
     derivations the schema alone cannot express), this ONE is a
     SINGLE-FIELD denylist expressible directly in JSON Schema
     (`not: {enum: [...]}`) -- so it is enforced at BOTH the schema
     layer (`zero-trust-review-record.schema.yaml`) AND the runtime
     construction/gate layer (defense in depth, matching this session's
     own two-layer invariant discipline), unlike the DPIA/PIA precedent
     where the cross-array invariants could only be expressed at
     runtime.

  This is a STRUCTURAL record (`provenance_required` + one integrity
  gate), NOT `genuine_compute` -- both invariants are structural/
  set-membership derivations (shape-and-order completeness, denylist
  membership), the same class STRIDE/LINDDUN/PASTA/DPIA-PIA's own
  structural invariants already establish, not a numeric/ordinal
  computation like `security.attack_tree`'s own aggregation.


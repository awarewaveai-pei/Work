id: security.zero_trust_review
version: "1.0.0"
family: security

cognitive_primitives: [DECOMPOSE, MAP, VALIDATE]
# INFERRED, not cited. Splitting a single access event into its own
# subject/workload/resource identity context is DECOMPOSE; assigning
# each of the four stages its own real per-stage fields (including the
# three ADR-016 soft references) is MAP; the stage-completeness-and-order
# check PLUS the forbidden-credential denylist are both VALIDATE
# (structural/set-membership derivations, not a numeric COMPUTE step) --
# same inferred triple every prior structural F20 contract already uses.

purpose:
  - review_a_single_subject_workload_resource_access_path_through_atlas_own_four_stage_zero_trust_chain_from_identity_context_to_a_final_audit_trail_and_flag_any_forbidden_long_lived_credential
inputs:
  required: [AccessPathDescriptor, ZeroTrustStageSequence]
  # ZeroTrustStageSequence, not "...Set" -- same shape-accurate-naming
  # discipline PastaStageSequence/DpiaPiaStageSequence already establish:
  # Atlas's own F20 table row is a real "→" dependency order across its
  # four positions, even though position 1 is internally an unordered
  # set of three sub-entities.
  optional: []
outputs: [ZeroTrustReviewRecord]
preconditions:
  - "system_or_component is a non-empty string"
  - "stages is EXACTLY the four entries {identity_context, access_decision, credential_issuance, audit_trail}, one each, IN THAT ORDER -- Atlas's own F20 table row '→' chain is a real dependency order, not an unordered set"
  - "identity_context carries all three of subject/workload/resource, each well-shaped (non-empty id/description; resource additionally carries a sensitivity_classification in EC §61's own {Public, Internal, Confidential, Restricted}) -- Atlas's own '/'-joined notation names a REQUIRED SET, not an optional or partial one"
  - "access_decision has non-empty authn_method, a boolean authn_verified, authz_decision in {permit, deny}, and a boolean least_privilege_confirmed (Atlas §12.37's own 'Least privilege' item, folded in as real enrichment)"
  - "credential_issuance has a credential_type matching ^[a-z][a-z0-9_]*$ that is NOT one of {shared_password, long_lived_api_key, hardcoded_secret} (Master Plan §62's own explicit 禁止 list, L2652-2656), a positive integer ttl_seconds, a non-empty issued_at, and a boolean mutual_authentication_confirmed (Master Plan §62's own 'Mutual Authentication' step, folded in as real enrichment)"
  - "audit_trail has a non-empty audit_log_ref and booleans continuous_monitoring_confirmed (Atlas §12.37's own 'Continuous logging / audit' item) and resource_access_granted (Master Plan §62's own terminal 'Resource Access' step)"
quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class every prior structural (non-genuine-compute) F20 contract
  # already reasons through: stage-completeness-and-order and the
  # forbidden-credential denylist are both structural/set-membership
  # derivations, not a statistical/numeric CALCULATED RESULT.
forbidden_transition: []
# Atlas §22.3's own gate table has no Zero Trust Review row.
recommended_next: [architecture.adr]
# Kept for consistency with every sibling F20 contract, but the
# reasoning is a THIRD genuinely different causal relationship, not
# copy-pasted from either prior disclosure: security.stride's own F18
# Threat-Model-before-ADR chain does not apply (Zero Trust Review is not
# an F18 Threat Model step). security.dpia_pia's own "formula used
# DURING an ADR's drafting" relationship (ADR-002 precedent) also does
# not apply here. The REAL relationship for Zero Trust Review is the
# REVERSE of both: ADR-016 already exists and RATIFIED the singleton
# values this record's own soft-reference fields cite BEFORE this
# record type existed; a COMPLETED Zero Trust Review that finds
# non-compliance with ADR-016's own ratified values (e.g. a forbidden
# credential_type, or a pdp_engine_ref other than Cedar) is exactly the
# kind of concrete evidence that could justify a FUTURE ADR (a
# documented exception, or a remediation decision) -- this record is
# potential INPUT to a future ADR, not a step inside one already being
# drafted, and not a Threat-Model-precedes-ADR sequencing either.
rollback:
  side_effect_free: true
  # The RECORD itself is side-effect-free -- same class every prior
  # structural contract's own rollback field already draws.

compilation_decisions:
  - question: >
      Three sources name this method across two mother documents (Atlas
      F20 table row, Atlas's own dedicated §12.37, Master Plan §62), and
      they disagree in BOTH stage count (4 vs. 6 vs. 6) AND whether they
      are even ordered at all (§12.37 is a deliberately unordered
      checklist). Which is authoritative for `stages`' own positional
      shape?
    decision: "Atlas's OWN F20 table row (L887) -- the four-position chain, with position 1 internally a required set of three sub-entities."
    reasoning: >
      This is NOT the same detail-precedence rule `security.dpia_pia`
      already applied (there, the dedicated section won because it was
      BOTH richer and better-ordered). Here, Atlas's own dedicated
      §12.37 is a bullet checklist with zero sequencing anywhere in that
      section -- picking it as the `stages` authority would silently
      discard the one real "→" chain Atlas itself gives for this
      method. Master Plan §62's own six-step chain is real and richer,
      but it is a DIFFERENT mother document with its own separate scope
      (MP's own §61-63 Security Architecture narrative) -- treating a
      different document's own richer chain as authoritative for an F20
      typed object's OWN stage count would silently override the very
      table that defines this method's membership in the family this
      slice is building for. The table row is the only source that is
      BOTH genuinely ordered AND lives in the document/table this
      method's own F20 identity comes from.
  - question: >
      Given Master Plan §62's own six-step chain and Atlas §12.37's own
      six-item checklist both name real content the four-position table
      row does not (Mutual Authentication, Resource Access, Least
      privilege, "continuous" logging/audit) -- should that content be
      silently dropped, or kept?
    decision: >
      Kept, folded in as PER-STAGE FIELD ENRICHMENT within the
      table row's own four positions, not as additional top-level
      stages: `least_privilege_confirmed` and `pdp_engine_ref` on
      `access_decision`; `mutual_authentication_confirmed` on
      `credential_issuance`; `continuous_monitoring_confirmed` and
      `resource_access_granted` on `audit_trail`.
    reasoning: >
      Discarding this content would understate real, named engineering
      substance both sources give. Inventing two EXTRA top-level stages
      (a 5th/6th position) to hold it would contradict the table row's
      own literal four-position count, the very source this contract
      just chose as the `stages` shape authority -- the same
      "undisclosed over-constraint" class a critic review already
      caught on `database_data.data_contract`'s own first draft, this
      time in the opposite direction (inventing extra structure rather
      than an extra restriction). Enrichment-within-existing-stages is
      the same "real practice enriches a minimal Atlas stage" technique
      `security.pasta.contract.yaml`'s and `security.dpia_pia
      .contract.yaml`'s own per-stage field detail already establish,
      applied across a genuine cross-document source this time rather
      than a same-document one.
  - question: >
      Master Plan §62's own explicit "禁止" list (Shared Password /
      Long-lived API Key / Hard-coded Secret) is a real, named
      prohibition no OTHER Zero-Trust-relevant citation gives. Should it
      be schema-enforced (a JSON Schema `not`/`enum` clause) or
      runtime-enforced only?
    decision: >
      BOTH -- schema-layer `not: {enum: [shared_password,
      long_lived_api_key, hardcoded_secret]}` on `credential_type`, AND
      runtime construction/gate re-derivation, defense in depth.
    reasoning: >
      Unlike DPIA/PIA's own two invariants (both genuinely cross-array
      referential derivations JSON Schema 2020-12 cannot express cleanly
      across `prefixItems` siblings, per that contract's own
      compilation_decisions), this is a SINGLE-FIELD denylist -- a
      canonical case JSON Schema expresses natively and cheaply. Since
      this session's own governing discipline (CLAUDE.md/AGENTS.md)
      requires two-layer invariant enforcement (construction AND an
      independent gate that re-derives from raw fields) as a FLOOR, not
      a ceiling, adding the schema layer on top where it is genuinely
      expressible is additional defense in depth, not a substitute for
      either runtime layer -- both `generate_zero_trust_review_record`
      and `evaluate_zero_trust_review_integrity_gate` independently
      re-check the same denylist against raw fields.
  - question: >
      Should the three ADR-016 soft-reference fields
      (`idp_ref`/`workload_identity_strategy_ref`/`pdp_engine_ref`) be
      pinned to `const` (matching `policies/security/zero-trust.policy
      .yaml`'s own `idp_provider.provider: const Zitadel` /
      `pdp_engine.engine: const Cedar` shape), or left as free,
      nullable strings?
    decision: "Free, nullable strings -- not const."
    reasoning: >
      The POLICY file is a singleton CONFIGURATION declaration (there is
      exactly one system-wide answer, and `const` correctly pins it). A
      Zero Trust REVIEW record is different in kind: its entire reason
      to exist is to document what a SPECIFIC access path ACTUALLY
      does, which may or may not match the ratified singleton (e.g. a
      legacy system predating ADR-016, or a genuine non-compliance
      finding). Pinning these fields to `const: Zitadel`/`const: Cedar`
      would make it schema-ILLEGAL to ever record a non-compliant
      finding -- exactly backwards for an audit/review record, whose
      whole value is being ABLE to say "actual value observed here
      diverges from policy." Kept as free text (nullable, since a review
      may not have investigated a given reference at all), with each
      field's own description quoting the real ratified value verbatim
      so a reader knows what COMPLIANT looks like without the schema
      forcing every instance to claim it.
  - question: >
      Should `ttl_seconds` (on `credential_issuance`) enforce a maximum
      threshold, so an implausibly long "short-lived" credential (e.g.
      ttl_seconds = 315360000, ten years) is refused?
    decision: "No maximum -- only a minimum of 1 (a positive integer)."
    reasoning: >
      No citation (Atlas's own table row, §12.37, or MP §62) names an
      actual number for "short-lived" -- inventing a specific ceiling
      here would be exactly the kind of unstated numeric threshold this
      session's own discipline already refuses to fabricate (the same
      restraint `policies/security/zero-trust.policy.yaml`'s own
      `service_count_reconsideration_threshold` already applies by
      staying `null` until an operator sets a real number). The positive
      -integer floor is the one uncontroversial, universally-true
      requirement (a credential cannot have a zero or negative
      lifetime) -- disclosed as real practice, not an Atlas citation,
      the same "real practice, not Atlas" class `security.pasta
      .contract.yaml`'s own per-stage field detail already establishes.
  - question: >
      Zero Trust Review's own subject matter (authn/authz, credentials)
      genuinely overlaps EC §32's own trigger vocabulary, unlike
      DPIA/PIA's genuinely orthogonal privacy trigger. Does this mean
      Zero Trust Review should carry the EC §32 framing triplet
      (`assets`/`trust_boundaries`/`entry_points`) after all, given the
      overlap?
    decision: "No -- omit the triplet entirely, same as security.dpia_pia, but for a disclosed, DIFFERENT reason."
    reasoning: >
      Subject-matter overlap is not the same question as method
      membership. EC §32's own closing sentence (L1260) is a CLOSED,
      enumerated list of exactly four methods that satisfy ITS OWN
      gate -- Zero Trust Review is not on that list, full stop,
      regardless of how much its own trigger words happen to overlap.
      Separately and independently, none of the three Zero-Trust
      -relevant citations (table row, §12.37, MP §62) mention an asset
      list, a trust boundary, or an entry point anywhere -- so there is
      also no positive grounding to invent the triplet from. Both facts
      point the same direction (omit), but the REASONING is disclosed
      honestly as more nuanced than DPIA/PIA's own simpler orthogonal
      -trigger case, not silently copy-pasted (see description's own
      "more NUANCED non-membership" paragraph for the full disclosure,
      including the real consequence that a Zero Trust Review does NOT
      substitute for the EC §32 gate on an authn/authz-touching change).


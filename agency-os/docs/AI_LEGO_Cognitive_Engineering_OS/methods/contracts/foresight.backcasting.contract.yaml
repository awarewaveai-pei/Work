$id: "ai-lego://methods/contracts/foresight.backcasting.contract.yaml"
title: "Backcasting Method Contract"
status: ACTIVE

description: >
  F13 foresight family (Atlas L683: "Backcasting | 從理想未來倒推 | future
  state->milestones backward->today actions | 長期 roadmap"). No dedicated
  Atlas section exists beyond the F13 table row itself (disclosed). Core
  invariant: the pipeline must actually REACH the present -- milestones
  strictly ordered backward from the future state (strictly decreasing
  ordinal horizon, no duplicate or out-of-order value) and at least one
  today_actions entry required; a backcast that stops at a distant
  milestone and never lands on a present-day action is a wish, not the
  roadmap this method exists to produce.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F13 前瞻 table, Backcasting row (L683)"
  - "specs/cognitive/method.schema.yaml -- the schema this file's body is validated against"

decided_by: >
  No ADR governs the content. Atlas L683 gives a real three-stage
  pipeline -- direct transcription plus low-risk, disclosed compilation
  choices (ordinal-int horizon representation, separate today_actions[]).

id: foresight.backcasting
version: "1.0.0"
family: foresight

cognitive_primitives: [DECOMPOSE, INFER, EXPLAIN]
# INFERRED, not cited. DECOMPOSE breaks the path from future state to
# present into ordered milestones; INFER derives each milestone and
# present-day action from the one shallower in time; EXPLAIN articulates
# each as a real statement. All three CANONICAL_KERNEL members.

purpose:
  - work_backward_from_an_ideal_future_state_to_present_day_actions

inputs:
  required:
    - FutureStateDescription
  # NEW DESIGN. Atlas names no upstream typed-object input; a free-text
  # description of the ideal future state is the honest starting point.

outputs:
  - BackcastingPlan
# NEW output type (see typed-objects/backcasting-plan.schema.yaml).

preconditions:
  - "at least one milestone with strictly decreasing horizon order, and at least one today_actions entry"
  # NEW, structurally necessary -- see description.

quality:
  provenance_required: true

forbidden_transition: []
# No sibling typed object exists yet to name a type-incompatible hop into.

recommended_next: []
# Atlas's F13 table gives no explicit next-step pointer past Backcasting's
# own row (L683); Delphi/Cross-impact Analysis (L684-685) are independent
# forecasting techniques, not a stated continuation of this method's own
# pipeline. Left empty rather than inventing a soft-reference next step.

rollback:
  side_effect_free: true

open_questions:
  - "OQ-BACKCASTING-1: cognitive_primitives is this file's own inference, not a cited Atlas §4 formula.（owner: operator）"
  - "OQ-BACKCASTING-2: ordinal-int horizon vs ISO date -- see typed-objects/backcasting-plan.schema.yaml's own compilation_decisions.（owner: operator）"

verification:
  method: >
    Read Atlas F13 table, Backcasting row (L683) directly -- no dedicated
    section exists beyond the row itself. Grepped the full spec root
    case-insensitively for "backcasting" before writing -- zero
    pre-existing implementation or schema title overlap found. Validated
    against specs/cognitive/method.schema.yaml with
    jsonschema.Draft202012Validator.
  note: >
    No mother document was modified. The three-stage pipeline is
    transcribed verbatim from Atlas L683. purpose/preconditions naming,
    the free-text input scope, and the ordinal-int horizon representation
    are Phase 3-class compilation decisions, disclosed above.

$id: "ai-lego://methods/contracts/decision.impact_effort.contract.yaml"
title: "Impact-Effort Matrix Method Contract"
status: ACTIVE

description: >
  decision.impact_effort, F16, 3rd concrete member (after ahp/mcda). Atlas §11.30 (L1889-1906) dedicated
  section + F16 table row (L760, grep-confirmed -- method-inventory.yaml's own cached line 757 is stale by
  3) + §28 routing row (L4485, First Tool before MCDA/AHP). Distinct from decision.mcda: 2 FIXED named
  dimensions -> categorical quadrant label, not N arbitrary criteria -> continuous weighted score+ranking.
  Invariants: quadrant recomputed fresh from impact/effort/declared thresholds (never trusts a stored
  label), impact/effort each validated against their own declared scale (rejects mixed-scale input).

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §11.30 影響－投入矩陣／效益－難度矩陣（Impact–Effort Matrix）(L1889-1906): purpose, quadrantChart (L1894-1903), caution note (L1905-1906)"

  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §28 快速選工具表 (L4485): '很多方案不知選哪個｜Impact–Effort｜MCDA / AHP｜Vote Only' -- this contract's recommended_next"

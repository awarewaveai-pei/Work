  - "methods/contracts/decision.mcda.contract.yaml and ai_lego/modules/decision/mcda.py (both read in full) -- due-diligence comparison target; methods/contracts/architecture.trade_off_matrix.contract.yaml (read) -- the reuse-only precedent deliberately NOT followed here"
  - "ai_lego/modules/root_cause/fault_tree.py (read in full) -- the two-layer construction+gate, raise-before-write, re-derive-don't-trust pattern this contract's own two invariants follow"

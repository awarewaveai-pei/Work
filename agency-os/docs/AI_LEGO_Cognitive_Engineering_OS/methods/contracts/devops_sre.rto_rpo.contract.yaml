      measured against, closing the loop from both sides?
    owner: "operator, or whoever next revises the backup_restore_drill contract's own field design"
    blocks: "nothing in this file's own validity"
  - id: "OQ-RTORPO-3"
    question: >
      F19 is now complete (13/13). Should the next Method Atlas slice
      move to F21's remaining `database_data` family members (ERD,
      Normalization, Data Contract, Data Quality Dimensions,
      Retention-Deletion Model), F20 (Security/Privacy Pack, entirely
      unbuilt), or another F-category entirely?
    owner: "operator"
    blocks: "nothing in this file's own validity"
  - id: "OQ-RTORPO-4"
    question: >
      `specs/domain/repository-contract.schema.yaml`'s own
      `backup_dr_matrix` (L249-284) already carries real
      `{storage, rpo, rto, method}` rows for this repo's own actual
      storage engines. Should a future revision add a soft-link field
      (format-only, the same discipline `drill_ref` already
      establishes) so an `RtoRpoRecord` can cite which `backup_dr_matrix`
      row it corresponds to, or is the relationship better left as
      "this generic method could describe any of those rows, informally"?
    owner: "operator, or whoever next revises this contract's own field design"
    blocks: "nothing in this file's own validity"


id: devops_sre.rto_rpo
version: "1.0.0"
family: devops_sre

cognitive_primitives: [DECOMPOSE, MAP, VALIDATE]
# INFERRED, not cited (Atlas gives no §4-style composition formula for
# this method). Separating impact/tier/architecture/drill into
# distinct fields is DECOMPOSE; assigning a system to a tier and target
# numbers is MAP; the required-both-RTO-and-RPO and drill_ref-format
# checks are VALIDATE -- the same inferred triple every prior
# structured-record method this session built already uses.

purpose:
  - define_a_quantifiable_recovery_time_and_recovery_point_target_for_one_system_or_component_grounded_in_its_own_business_impact_and_tier_classification
inputs:
  required: [BusinessImpactStatement, TierClassification, SystemOrComponent, RecoveryTargets]
  optional: [BackupRestoreDrillReference]
outputs: [RtoRpoRecord]
preconditions:
  - "system_or_component, business_impact_statement, and tier are all non-empty strings"
  - "rto_target_seconds and rpo_target_seconds are both finite and strictly positive"
  - "drill_ref, when present, is a non-empty string beginning with DRILL- (the database_data.backup_restore_drill record id prefix) -- a format-only soft link"
  # Directly grounded in Atlas's own formula: business_impact_statement
  # ("business impact"), tier ("tiers"), system_or_component
  # ("architecture"), drill_ref ("drill"). Both RTO and RPO required,
  # unlike database_data.backup_restore_drill's own optional RPO pair
  # -- see compilation_decisions.
quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class of departure every structured-record contract in this
  # package already reasons through: the real risk is definitional
  # integrity (are impact/tier/architecture/targets all genuinely
  # present and well-formed), not an evidence-citation risk over a
  # narrative claim.
forbidden_transition: []
# Atlas §22.3's own gate table has no RTO/RPO row.
recommended_next: []
# Atlas gives no explicit 推薦搭配 chain for this method. One real,
# disclosed (not built as a hard link) relationship: this record's own
# rto_target_seconds/rpo_target_seconds are exactly the numbers
# database_data.backup_restore_drill's own record consumes as bare
# caller input -- see compilation_decisions and OQ-RTORPO-2.
rollback:
  side_effect_free: true
  # The RECORD itself is side-effect-free -- the real architecture
  # decisions and drill execution that satisfy these targets happen
  # outside this method's own scope, the same "record reports on/
  # defines an external commitment" class every prior devops_sre
  # contract's own rollback field already draws.

compilation_decisions:
  - question: >
      `database_data.backup_restore_drill.contract.yaml`'s own
      `OQ-BACKUPDRILL-2` asked whether a future rto_rpo method's output
      should feed that method's own rto_target_seconds/rpo_target_seconds
      as a soft link. Should this contract instead retrofit a HARD
      `$ref` into the already-shipped drill contract, or provide the
      link from this side only?
    decision: "Soft link from THIS side only (drill_ref, format-only, pointing INTO the drill record) -- the drill contract itself is not modified."
    reasoning: >
      Retrofitting a hard cross-reference into an already-shipped Tier
      1 contract without operator direction would be exactly the kind
      of unrequested breaking change this session's every prior
      contract already disciplines itself against; `drill_ref` here
      is additive (a new optional field on a NEW record), the same
      "soft, unenforced text link" class `devops_sre.error_budget`'s
      own `related_slo_id` and `devops_sre.game_day`'s own
      `runbook_execution_ref` already establish. The direction of the
      link (rto_rpo -> drill, not drill -> rto_rpo) matches the
      contract's own logical role: a target DEFINITION citing the
      MEASUREMENT that verified it, not the reverse.
  - question: >
      `database_data.backup_restore_drill`'s own RPO fields are
      OPTIONAL (Atlas's own 6-step protocol has no explicit RPO
      action). Should this method's own rpo_target_seconds be
      optional too, for consistency?
    decision: "No -- both rto_target_seconds and rpo_target_seconds are REQUIRED here."
    reasoning: >
      This method's own NAME and purpose line ("定義恢復時間/資料損失")
      name RTO and RPO together as the single thing being DEFINED --
      unlike the drill protocol (which has an explicit timing action
      but no explicit data-staleness action), this method has no
      textual asymmetry between the two halves to justify treating them
      differently. A record that defines a recovery time target but
      declines to define a data-loss target has not actually completed
      Atlas's own "定義恢復時間/資料損失" purpose. ADDED post-critic-
      review: this method and `database_data.backup_restore_drill`
      apply DIFFERING evidentiary standards to the same RTO/RPO word
      pair -- that method's own optionality is grounded in its own
      6-step protocol's own missing action; this method's own
      requiredness is grounded in a purpose SENTENCE, since Atlas gives
      this method no step list to parse at all. Both are real,
      disclosed readings of genuinely different source text for the
      two methods, not an inconsistency between the two contracts.
  - question: >
      Should `tier` be a closed enum (e.g. grounded in
      `DEVOPS_SRE_PLAN.md` §2.2's own Enterprise/Professional/Personal
      Pro/Local Pro edition tiers), or free text?
    decision: "Free text, caller-supplied -- no enum."
    reasoning: >
      Atlas's own text names "tiers" as a formula step but gives no
      tier taxonomy; `DEVOPS_SRE_PLAN.md`'s own table is a real,
      PRODUCT-SPECIFIC (this repo's own edition/pricing structure)
      example, not an Atlas-given universal taxonomy -- hard-coding it
      as an enum would tie this generic Method Atlas contract to one
      product's own current pricing tiers, which is exactly the kind of
      unstated-assumption invention this package's every prior contract
      already disciplines itself against. A caller using this method
      for a different product, or before this repo's own edition
      structure exists, needs a free-text tier just as much.


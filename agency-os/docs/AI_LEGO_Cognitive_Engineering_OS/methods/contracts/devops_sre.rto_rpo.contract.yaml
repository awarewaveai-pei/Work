title: "RTO/RPO Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry. Thirty-eighth Method Atlas slice, THIRTEENTH
  and LAST member of the `devops_sre` family (F19) -- F19 is now
  COMPLETE (13/13), after `devops_sre.sli_slo` (twentieth),
  `devops_sre.canary_deployment` (twenty-first),
  `devops_sre.chaos_engineering` (twenty-second),
  `devops_sre.blue_green_deployment` (twenty-third),
  `devops_sre.error_budget` (twenty-fourth), `devops_sre.capacity_model`
  (thirty-first), `devops_sre.release_readiness_review` (thirty-second),
  `devops_sre.runbook_execution` (thirty-third), `devops_sre.game_day`
  (thirty-fourth), `devops_sre.load_test` (thirty-fifth),
  `devops_sre.stress_test` (thirty-sixth), and `devops_sre.soak_test`
  (thirty-seventh).

  Atlas gives this method exactly ONE citation of its own: the F19 tool
  table's RTO/RPO row (L860: purpose "定義恢復時間/資料損失" -- define
  recovery time / data loss; usage "business impact→tiers→architecture
  →drill"; benefit "DR 可量化驗證" -- make disaster recovery
  quantifiably verifiable). No dedicated §11.x section exists (this
  session's own F19 devops_sre entries jump from §11.43 Chaos
  Engineering directly to §11.44 STRIDE, an F20 method -- confirmed by
  direct read of the surrounding sections before writing this
  contract, the same check `database_data.backup_restore_drill.contract
  .yaml`'s own description already performed when it first compared
  these two methods).

  **This slice resolves a forward reference two prior contracts each
  left open**: `database_data.backup_restore_drill.contract.yaml`'s own
  `OQ-BACKUPDRILL-2` asked whether a future `devops_sre.rto_rpo` should
  feed that method's own `rto_target_seconds`/`rpo_target_seconds` as a
  soft link; this method's own typed object (`RtoRpoRecord`) is exactly
  that -- the DEFINITION half of the RTO/RPO pair, where
  `database_data.backup_restore_drill`'s own record is the MEASUREMENT
  half. Rather than retrofitting a hard link into the already-shipped
  drill contract (a breaking change to a Tier 1 contract this session
  disciplines itself against making without operator direction), this
  method's own `drill_ref` field is the soft link, format-only (prefix
  `DRILL-`), the same direction `devops_sre.game_day`'s own
  `runbook_execution_ref` and `devops_sre.error_budget`'s own
  `related_slo_id` already establish -- see compilation_decisions.

  Due-diligence search, deliberately broad from the first draft
  (learning directly from three consecutive prior slices' own critic
  rounds each catching an insufficiently broad grep): case-insensitive
  spec-root greps for "RTO"/"RPO"/"rto_rpo", "business impact"/"tier",
  "disaster recovery"/"DR", "recovery time"/"recovery point". A critic
  review of this contract's own first draft found the grep results
  (23 files matching "RTO") understated to only 4 named neighbours;
  the complete disclosure, ADDED post-critic-review: (1)
  `database_data.backup_restore_drill.contract.yaml` (already discussed
  above -- the measurement half, not a duplicate); (2)
  `docs/architecture/DEVOPS_SRE_PLAN.md` §2.2's own real RPO/RTO
  tiering table (data layer x edition -> concrete RPO/RTO numbers, e.g.
  "Core metadata: RPO 5min/RTO 2h, Enterprise/Sovereign") -- a
  PRODUCT-SPECIFIC governance table, not this Atlas method's own
  generic taxonomy; disclosed as real prior art for what a `tier` value
  might look like, NOT hard-coded as a default (see
  compilation_decisions); (3) `AI_LEGO_Cognitive_Engineering_Os_Global
  _Master_Plan_v1.md` §74 Disaster Recovery (L2945-2974) -- the
  ORIGINAL source of DEVOPS_SRE_PLAN.md §2.2's own numbers, explicitly
  labeled "範例" (example) in the Master Plan's own text, same
  non-default status; (4) `specs/execution/risk-tier.schema.yaml`'s own
  R0-R4 risk-tier enum -- a GOVERNANCE-ACTION risk classification (how
  much oversight an AI action needs), a different sense of "tier" than
  this method's own business-impact/recovery-speed tier, confirmed
  distinct by direct read; (5) ADDED post-critic-review:
  `specs/domain/repository-contract.schema.yaml`'s own
  `backup_dr_matrix` (L249-284, sourced from
  `docs/architecture/DATA_ARCHITECTURE_PLAN.md` §4, L76-98) -- an
  EXISTING machine-readable `{storage, rpo, rto, method}` tuple per
  storage engine, the closest structural analogue to this new record.
  Distinct, not a duplicate: `backup_dr_matrix` is a PER-STORAGE-ENGINE
  POLICY TABLE fixed to this repo's own architecture (3 SoR rows +
  N derived rows, `rto_basis` a formula not a caller input), while
  `RtoRpoRecord` is a GENERIC per-method-invocation record for ANY
  system/component Atlas's own formula names, with caller-supplied
  free-text tier and numeric targets -- a future revision could
  cross-reference specific `backup_dr_matrix` rows as real-world
  instances this method's own records describe (disclosed, not built,
  `OQ-RTORPO-4`); (6) ADDED post-critic-review: at least two further
  senses of the bare word "tier" exist in the spec root beyond
  `risk_tier` -- `specs/cognitive/primitive.schema.yaml`'s own `tier`
  property (`CANONICAL_KERNEL`/`OBSERVED_EXTENSION`, a primitive's own
  provenance classification) and `specs/domain/repository-contract
  .schema.yaml`'s own `storage_tier.tiers[].tier_id`
  (`TIER_0_ULTIMATE_SOR`/`TIER_1_STRONG_CONSISTENCY`/
  `TIER_2_EVENTUAL_DERIVED`, a System-of-Record hierarchy) -- the
  latter's own "Tier 0" spelling is close enough to this contract's own
  worked example ("Tier 0 - Critical") that a reader could momentarily
  conflate them; both confirmed distinct by direct read, disclosed
  here rather than left for a reader to discover. The exact class of
  terminology collision `devops_sre.chaos_engineering`'s own
  `blast_radius` field and `devops_sre.runbook_execution`'s own
  "Recipe/Runbook" naming collision already established a precedent
  for disclosing rather than silently conflating -- this contract's
  own first draft under-applied that precedent to "tier" specifically.
  No duplicate typed object or method found.

  Atlas's own formula grounds the field set directly (one field per
  formula word, in formula order): `business_impact_statement`
  ("business impact"), `tier` ("tiers"), `system_or_component`
  ("architecture"), and `drill_ref` ("drill", optional soft link).
  `rto_target_seconds`/`rpo_target_seconds` are the NUMBERS this
  method's own purpose line ("定義恢復時間/資料損失") exists to define
  -- both REQUIRED here (unlike `database_data.backup_restore_drill`'s
  own optional RPO pair, because THAT method's own 6-step protocol has
  no explicit RPO action while THIS method's own name and purpose line
  name RTO and RPO together as the deliverable).


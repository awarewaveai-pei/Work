id: root_cause.kepner_tregoe
version: "1.0.0"
family: root_cause

cognitive_primitives: [DECOMPOSE, COMPARE, VALIDATE]
# INFERRED, not cited. The fixed 2x4 grid across 4 dimensions is DECOMPOSE;
# pairing each dimension's IS against its IS-NOT is COMPARE; deriving a
# distinction only from a dimension that genuinely has both is VALIDATE.

purpose:
  - specify_a_problem_via_is_is_not_differential_comparison_across_what_where_when_extent
inputs:
  required: [ProblemStatement]
  optional: []
outputs: [KepnerTregoeProblemSpecification]
preconditions:
  - "problem_statement.status == validated"
  - "dimensions is EXACTLY the four entries {WHAT, WHERE, WHEN, EXTENT}, one each, IN THAT ORDER -- Atlas's own literal 'What/Where/When/Extent' citation order"
  - "every dimension's is field is a non-empty string -- an unknown IS makes the technique meaningless (Atlas's own benefit line, '降低憑直覺猜測', presumes a known IS to compare against)"
  - "when a dimension's is_not field is present, it must NOT be identical (case/whitespace-insensitive) to that dimension's own is field -- an identical pair is a no-op, not a comparison"
  - "every distinction references a dimension that has BOTH a non-empty is AND a non-empty is_not recorded -- a distinction cannot be derived from a dimension never filled in"
  - "every change references an existing distinction_id"
quality:
  provenance_required: true
  evidence_labeling_required: true
forbidden_transition: []
# Atlas gives this method no forbidden_transition citation (only the single
# thin table row) -- left genuinely empty rather than inventing one.
recommended_next: [root_cause.five_whys, causal.dag]
# Same "candidate cause -> validation" downstream relationship
# root_cause.fishbone's own recommended_next already establishes for this
# family -- a completed KT specification's distinctions/changes are exactly
# the kind of candidate-cause material Five Whys or Causal DAG validate next.
rollback:
  side_effect_free: true

compilation_decisions:
  - question: "Should the 4 dimensions be a free-form array or a fixed, positionally-ordered set?"
    decision: "Fixed: exactly WHAT, WHERE, WHEN, EXTENT, one each, in Atlas's own literal citation order -- the same positionally-ordered pipeline class security.pasta/security.abuse_case already establish for their own Atlas-cited chains."
  - question: "Must every dimension carry both IS and IS-NOT at construction time?"
    decision: "No -- only IS is unconditionally required; IS-NOT is required only for a dimension a distinction later cites, since real KT practice often characterizes IS before IS-NOT is known."
  - question: "Require an existing ProblemStatement input (Fishbone's own precedent) or stand alone (Atlas's own KT row cites no input)?"
    decision: "Require ProblemStatement -- reuses the family's already-established entry-point type instead of inventing a second, competing one."


$id: "ai-lego://methods/contracts/database_data.data_contract.contract.yaml"
title: "Data Contract Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry. Fortieth Method Atlas slice, SIXTH from the
  `database_data` family (F21's own "資料庫／資料套件 (DB / Data Pack)"),
  after `database_data.backup_restore_drill` (twenty-fifth),
  `database_data.data_lineage` (twenty-eighth), `database_data
  .expand_contract_migration` (thirtieth), `database_data.reconciliation`
  (twenty-ninth), and `database_data.erd` (thirty-ninth). Directly closes
  `database_data.erd`'s own `OQ-ERD-4` (F21's §11.47 L2305 "起點"
  benefit names this exact pairing) and F21's own DB Migration recipe
  row (L1113: "Data Contract→Compatibility→Expand/Contract→Backfill→
  Restore/Rollback").

  Atlas gives this method FOUR citations, read in full before writing
  this contract (learning from `database_data.erd`'s own first draft,
  whose narrower grep missed a real §11.x section on its first attempt
  -- due-diligence here started BROAD; a critic review confirmed a
  first-draft count of THREE missed the fourth, corrected below): (1)
  the F21 tool table's Data Contract row (L902: purpose "定義
  producer/consumer 承諾"; usage "schema→semantics→quality/SLO→
  ownership→compatibility"; benefit "防無聲 schema break"); (2) a
  dedicated §11.49 資料契約（Data Contract）section (L2332-2351:
  purpose stated as the SAME producer/consumer sentence, formula
  "Schema→Semantics→Owner→Freshness→Quality→Compatibility→
  Deprecation" -- SEVEN steps, a strict superset of the table row's
  five-token compressed usage string: "quality/SLO" in the table
  compresses BOTH the formula's own "Freshness" and "Quality" steps
  into one hyphenated token, and the table's usage string omits
  "Deprecation" entirely even though §11.49's own formula lists it --
  the fuller §11.49 sequence is treated as authoritative, the table row
  as a compressed restatement, not a second candidate structure); (3)
  the DB Migration recipe (§10 Method Selection Engine's own
  problem-type recipe table, L1113: "Data Contract→Compatibility→
  Expand/Contract→Backfill→Restore/Rollback" -- CORRECTED
  post-critic-review from a first-draft mislocation as a "§13-area"
  table; §11 does not begin until L1118, after this recipe table),
  which independently confirms this method's own "Compatibility" step
  genuinely precedes and pairs with `database_data
  .expand_contract_migration` (already built) in a real operational
  sequence, not merely a narrative aside; (4) §11.47's own L2305
  benefit sentence for `database_data.erd` -- "可作為 migration 與
  data contract 的起點" -- ADDED post-critic-review (the first draft's
  own citation count omitted this even though it is the exact sentence
  `database_data.erd`'s own OQ-ERD-4 already quoted and this contract's
  own `schema_ref` field directly resolves).

  Due-diligence search, broad from the start (applying the lesson
  `database_data.erd`'s own critic round forced onto that contract only
  AFTER a first-draft miss): case-insensitive spec-root greps for
  "data contract"/"producer"/"consumer"/"schema break"/"freshness"/
  "deprecation". Real, closely-related structures found, each read in
  full and confirmed either genuinely reusable-by-reference or
  genuinely distinct (no duplicate typed object invented):
  (a) `specs/cognitive/typed-objects/sli-slo-set.schema.yaml`
  (`devops_sre.sli_slo`, already built) carries a `metric_type` enum
  `{availability, latency, correctness, durability, freshness}` --
  `freshness` is LITERALLY one of its five values, the exact word
  Atlas's own §11.49 formula names as this method's own fourth step.
  This is a genuine, Atlas-grounded reuse opportunity (the same class
  of pairing `database_data.erd`'s own `migration_ref` already
  established for its own §11.47 "起點" benefit), not a coincidental
  word match: `freshness_ref` below is a format-only soft link to an
  already-built `devops_sre.sli_slo` record (`SLO-` prefix). No
  matching value exists for the formula's "Quality" step (the closest
  enum entry, `correctness`, is a distinct SLI dimension, not a general
  data-quality concept) -- `quality_notes` below therefore stays free
  text, and a forward pointer to a still-unbuilt
  `database_data.data_quality_dimensions` (F21's own Data Quality
  Dimensions table row, L904) is filed as `OQ-DC-2`, the SAME
  "disclosed forward gap, not
  invented structure" discipline `database_data.erd`'s own `OQ-ERD-4`
  already established for THIS method before it existed. (b)
  `specs/execution/deprecation-pipeline.schema.yaml` (`DEP-` prefix)
  models retirement of exactly seven object types including `Schema`
  (EC §113 L3168-3174) -- a genuine, format-only soft-link target for
  this method's own "Deprecation" step (`deprecation_ref` below),
  distinct in scope from this record's OWN per-field or per-dataset
  deprecation note (that pipeline retires a whole schema/object
  end-to-end with a 7-step gate sequence; a data contract's own
  deprecation notice is a lighter-weight, in-force annotation that a
  replacement is coming -- the two are complementary, not duplicates:
  a contract's own `deprecation_ref` may point at an IN-PROGRESS
  retirement of the schema this contract itself governs). (c)
  `specs/cognitive/typed-objects/erd-record.schema.yaml`
  (`database_data.erd`, already built, `ERD-` prefix) is the exact
  pairing `OQ-ERD-4` itself named -- `schema_ref` below is a format-only
  soft link, OPTIONAL (not every data contract governing a single
  dataset/topic needs a full multi-entity relational model; see
  compilation_decisions for why `fields[]` is embedded directly rather
  than requiring an ERD record to exist). (d)
  `specs/cognitive/typed-objects/expand-contract-migration-record
  .schema.yaml` (`database_data.expand_contract_migration`, already
  built, `ECMIG-` prefix) is the exact pairing the DB Migration recipe
  (L1113) names -- `compatibility_ref` below is a format-only soft
  link. (e) `specs/execution/capability-resolution.schema.yaml`'s own
  incidental uses of the words "producer"/"consumer" (documentation
  prose describing which code module produced a value, and which code
  module consumes a result) are a different, execution-layer sense of
  both words entirely, confirmed by direct read -- not this method's
  own producer/consumer-of-a-dataset concept. No duplicate typed
  object or method found.

  Atlas's own formula grounds real structural invariants that make
  this record a genuine MODEL, not a bag of independently-valid parts:
  at least one consumer must be named (a scope decision, NOT a
  universal truth about every data contract -- contract-first
  publishing, where a producer registers a contract before any
  consumer exists, is a real, documented pattern this method's own
  `consumers` field cannot represent as-is; see compilation_decisions
  and OQ-DC-5, corrected post-critic-review from a first-draft claim
  that zero-consumer contracts are inherently meaningless); `fields[]`
  (the "Schema" step) must be non-empty with unique field names; the
  record's own `id` and every optional soft-link field
  (`schema_ref`/`freshness_ref`/`compatibility_ref`/`deprecation_ref`)
  must carry its own required id prefix when present -- CORRECTED
  post-critic-review: the first draft enforced the four OUTBOUND
  ref prefixes at both the builder and the gate but left the record's
  OWN inbound `DC-` prefix (and `version`'s own type) schema-layer-only,
  an asymmetry a critic review's own mutation probe caught (a record
  minted with `id="ERD-1"` passed both runtime gates, which would let
  it be mistaken for an ERD record by anything reading `schema_ref`
  soft links elsewhere).


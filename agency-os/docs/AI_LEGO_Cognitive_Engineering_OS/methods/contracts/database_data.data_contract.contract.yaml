decided_by: >
  No ADR governs the content. Registered in
  `methods/registry/contract-backlog.yaml` `tier_1` as a
  thirty-eighth concrete entry. `id: database_data.data_contract`
  mints a new machine_id, SIXTH member of the `database_data` family.

id: database_data.data_contract
version: "1.0.0"
family: database_data

cognitive_primitives: [DECOMPOSE, MAP, VALIDATE]
# INFERRED, not cited (Atlas gives no §4-style composition formula for
# this method). Separating a producer/consumer commitment into
# schema/semantics/ownership/policy elements is DECOMPOSE; assigning
# the four optional soft links to their sibling records is MAP; the
# internal-consistency checks (non-empty consumers, unique field
# names, soft-link prefix formats) are VALIDATE -- the same inferred
# triple `database_data.erd` (and every prior structured-record method
# this session built) already uses.

purpose:
  - define_a_producer_consumer_data_contract_covering_schema_semantics_ownership_freshness_quality_compatibility_and_deprecation_as_one_internally_consistent_record
inputs:
  required: [FieldSet, ConsumerSet]
  optional: [SchemaReference, FreshnessReference, CompatibilityReference, DeprecationReference]
outputs: [DataContractRecord]
preconditions:
  - "dataset_or_topic is a non-empty string"
  - "producer is a non-empty string (Atlas's own 'Owner' formula step, and the table row's own 'producer' role)"
  - "consumers has at least 1 entry; every entry is a non-empty string; entries are unique (the table row's own 'producer/consumer 承諾' purpose is meaningless with zero or duplicate-counted consumers)"
  - "fields has at least 1 entry (Atlas's own 'Schema' formula step); every entry has exactly the three known keys (name, data_type, nullable); name/data_type are non-empty strings; nullable is a real bool; field names are unique within the record"
  - "semantics is a non-empty string (Atlas's own 'Semantics' formula step -- free text, no invented per-field grammar)"
  - "quality_notes is a required array (may be empty) of non-empty strings (Atlas's own 'Quality' formula step -- free text, see compilation_decisions for why no structured link exists yet)"
  - "compatibility_policy is a non-empty string (Atlas's own 'Compatibility' formula step -- free text policy statement)"
  - "schema_ref, when present, is a non-empty string beginning with ERD- (the database_data.erd record id prefix) -- a format-only soft link resolving OQ-ERD-4"
  - "freshness_ref, when present, is a non-empty string beginning with SLO- (the devops_sre.sli_slo record id prefix) -- a format-only soft link resolving Atlas's own 'Freshness' formula step"
  - "compatibility_ref, when present, is a non-empty string beginning with ECMIG- (the database_data.expand_contract_migration record id prefix) -- a format-only soft link resolving the DB Migration recipe's own L1113 pairing"
  - "deprecation_ref, when present, is a non-empty string beginning with DEP- (the deprecation-pipeline.schema.yaml record id prefix) -- a format-only soft link resolving Atlas's own 'Deprecation' formula step"
  # Preconditions 1-3 map onto the table row's own 'producer/consumer'
  # purpose; 4 onto 'Schema'; 5 onto 'Semantics'; 6 onto 'Quality'; 7
  # onto 'Compatibility'; 8-11 onto the four soft-linked formula steps
  # (Schema's optional full-model link, Freshness, Compatibility's
  # optional migration-event link, Deprecation). Same "structurally
  # necessary, forbidden-state" class every prior genuine-compute-or-
  # structural contract this session built already establishes.
quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class of departure database_data.erd's own contract already
  # reasons through: the real risk is MODELING integrity (is the
  # contract internally consistent and correctly soft-linked), not an
  # evidence-citation risk over a narrative claim.
forbidden_transition: []
# Atlas §22.3's own gate table has no Data Contract row.
recommended_next: []
# database_data.data_quality_dimensions (F21's own next table row,
# L904) does not exist yet -- see OQ-DC-2. database_data.erd,
# devops_sre.sli_slo, database_data.expand_contract_migration, and the
# deprecation pipeline are all ALREADY built and consumed here as real
# soft-link fields (schema_ref/freshness_ref/compatibility_ref/
# deprecation_ref), not left as bare recommended_next entries -- the
# same "turn a real pairing into a field, not a narrative aside"
# discipline database_data.erd's own migration_ref already established.
rollback:
  side_effect_free: true
  # The RECORD itself is side-effect-free -- the real schema/pipeline/
  # SLO/migration it references are created and governed outside this
  # method's own scope, the same "record describes an external
  # structure" class every prior database_data contract's own rollback
  # field already draws.

compilation_decisions:
  - question: >
      Atlas's own §11.49 formula names "Schema" as its first step. Should
      this record EMBED a field list directly, or REQUIRE a soft link to
      an already-built database_data.erd record (the pairing OQ-ERD-4
      itself proposed)?
    decision: "Embed a lightweight fields[] list directly (required); schema_ref to a full ERD record is OPTIONAL, not required."
    reasoning: >
      Not every data contract governs a multi-entity relational schema
      -- a single Kafka topic or API response payload has ONE flat field
      list, and forcing every such contract to first construct an
      unrelated multi-entity ERD record would be an invented coupling
      Atlas's own text does not ask for (§11.49 says "Schema", not
      "Entity-Relationship Model"). Embedding fields[] directly keeps
      the common case (a single dataset's own field list) self-
      contained, while schema_ref remains available for the genuinely
      Atlas-grounded case where a fuller relational model already exists
      (resolving OQ-ERD-4 without over-constraining every caller).
  - question: >
      Should fields[] reuse database_data.erd's own {name, data_type,
      is_primary_key} attribute shape verbatim, or a different shape?
    decision: "A distinct three-key shape: {name, data_type, nullable} -- is_primary_key is dropped, nullable is added."
    reasoning: >
      A data contract's own field-level concern is nullability (can a
      consumer expect this field to always be present), not primary-key
      status -- a concept meaningful only inside a relational entity
      model, which this record does not require (see the prior
      decision). Reusing the exact same three-key shape as
      erd-record.schema.yaml's own attribute $def would conflate two
      genuinely different concerns under a shared name; a distinct,
      purpose-built shape avoids that, while keeping the same
      `name`/`data_type` naming convention for consistency across the
      `database_data` family.
  - question: >
      Atlas's own §11.49 formula names "Quality" as a step but gives no
      further structure (no rules/profiling/threshold vocabulary --
      that belongs to F21's OWN separate, still-unbuilt Data Quality
      Dimensions row, L904: "rules→profiling→threshold→quarantine→
      owner"). Should this contract invent a structured quality field,
      or borrow devops_sre.sli_slo's own vocabulary the way Freshness
      does?
    decision: "Free text (quality_notes[], may be empty) -- no structured link yet, filed as OQ-DC-2 for when database_data.data_quality_dimensions exists."
    reasoning: >
      devops_sre.sli_slo's own metric_type enum has no 'quality' value
      (the closest entry, 'correctness', is a distinct SLI dimension
      about system behavior, not a general data-quality concept covering
      completeness/accuracy/consistency/uniqueness/timeliness/validity
      -- F21's own Data Quality Dimensions row, L904, names those six
      dimensions explicitly, none of which is 'correctness'). Inventing
      a structured quality vocabulary here would preempt that future
      method's own design and risk exactly the kind of premature,
      unstated-assumption invention this package's every prior contract
      already disciplines itself against. Free text, with an honest
      forward-pointer OQ, is the same restraint `database_data.erd`'s
      own `constraints[]` field and OQ-ERD-4 already modeled for this
      method before it existed.
  - question: >
      Should "Deprecation" be modeled as this record's own multi-step
      pipeline (mirroring deprecation-pipeline.schema.yaml's own 7-step
      Notice→...→Archive sequence), or a lightweight reference?
    decision: "A lightweight, OPTIONAL format-only soft link (deprecation_ref, DEP- prefix) to an existing deprecation-pipeline.schema.yaml record -- no duplicate pipeline modeled here."
    reasoning: >
      deprecation-pipeline.schema.yaml already models retirement of a
      Schema (one of its own 7 object_type enum values, EC §113
      L3168-3174) end-to-end with a real 7-step gate sequence and
      blocking invariants. Re-modeling any part of that pipeline inside
      this record would create exactly the kind of duplicate-registry
      drift that file's own compilation_decisions already disciplines
      itself against avoiding. A data contract's own "Deprecation" step
      is satisfied by POINTING AT that already-built, already-gated
      pipeline when the schema this contract governs is being retired --
      the same reuse-by-reference discipline this contract already
      applies to Freshness, Compatibility, and the optional Schema link.
  - question: >
      Should field-name uniqueness within fields[] (and consumer-name
      uniqueness within consumers[]) be case-sensitive/whitespace-
      sensitive, or normalized?
    decision: "Exact string match on both case and whitespace, same as database_data.erd's own entity/attribute-name uniqueness -- 'orders' and 'Orders', or 'team-a' and 'team-a ', are treated as distinct names."
    reasoning: >
      Same reasoning database_data.erd's own compilation_decisions
      already established for entity/attribute names: real schema
      field names are frequently case-sensitive (JSON keys, many
      column-naming conventions), and Atlas's own text gives no basis
      for inventing a case-folding OR whitespace-trimming rule. ADDED
      post-critic-review: a critic review's own probe found
      whitespace-distinct names (e.g. a trailing space) pass every
      layer as "unique" today -- this is the SAME exact-match decision
      already made for case, extended explicitly to whitespace rather
      than left as an undisclosed edge case. A caller modeling a
      normalized system can supply already-trimmed, already-folded
      names.
  - question: >
      Is "at least one consumer" a universal truth about every data
      contract, or a scope decision this method's own field design
      makes?
    decision: >
      A disclosed SCOPE DECISION, not a universal truth -- CORRECTED
      post-critic-review from a first-draft description that stated
      "zero consumers commits to nothing" as if no real counter-example
      existed.
    reasoning: >
      A critic review found a real, documented counter-example:
      contract-first publishing, where a producer registers a data
      contract BEFORE any consumer exists (a normal initial state in
      data-mesh and schema-registry practice, not a degenerate one).
      This method's own `consumers` field cannot represent that state
      as-is (`minItems: 1`). The invariant is KEPT (not relaxed to
      `minItems: 0`) because the table row's own purpose sentence
      ("定義 producer/consumer 承諾") is this method's primary citation
      for existing at all, and the common, Atlas-cited case IS an
      already-agreed producer/consumer relationship; a caller with a
      genuine contract-first, zero-consumer state is out of this
      method's own declared scope for now -- disclosed as OQ-DC-5, not
      silently unsupported or forced into a placeholder consumer name
      (which would pollute the exact list this design treats as
      load-bearing).

open_questions:
  - id: "OQ-DC-1"
    question: "id mints a machine_id method-inventory.yaml never carried -- should method-inventory.yaml be updated (has_contract:true, machine_id, corrected line field)?"
    owner: "operator, or a future session with explicit write scope over method-inventory.yaml"
    blocks: "nothing in this file's own validity"
  - id: "OQ-DC-2"
    status: >
      ANSWERED (2026-09-06), via a DIFFERENT mechanism than literally
      proposed below -- database_data.data_quality_dimensions now
      exists, but the soft link lives on ITS OWN record
      (`data_contract_ref`, DC- prefix, pointing back at this method),
      not as a new `quality_ref` field retrofitted onto THIS record.
      That contract's own compilation_decisions explain why: adding a
      field to an already-shipped, already-critic-reviewed sibling
      schema is a larger blast radius than the direction every other
      cross-database_data-slice soft link in this session already
      uses (the newer record points back at the older one -- e.g. this
      method's own `schema_ref` to `database_data.erd`). The underlying
      NEED this OQ named (a way to link a data contract's own quality
      commitment to a real quality assessment) is satisfied either way.
    question: >
      F21's own Data Quality Dimensions table row (L904: 'rules→
      profiling→threshold→quarantine→owner') is this method's own
      natural partner
      for the 'Quality' formula step, but does not exist yet. Should a
      future `database_data.data_quality_dimensions` slice add a
      structured `quality_ref` soft link here (the same class of field
      `schema_ref`/`freshness_ref`/`compatibility_ref`/`deprecation_ref`
      already establish), once that method's own id prefix is minted?
    owner: "operator, or whoever next builds database_data.data_quality_dimensions"
    blocks: "nothing in this file's own validity"
  - id: "OQ-DC-3"
    question: >
      This record's own `consumers[]` is a flat list of non-empty
      strings (team/service names) with no per-consumer detail (e.g. a
      consumer-specific SLA, or which fields[] a given consumer actually
      reads). Atlas's own formula names no such per-consumer structure.
      Should a future revision add one?
    owner: "operator, or whoever next revises this contract's own field design"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap"
  - id: "OQ-DC-4"
    question: >
      `schema_ref` (optional link to a full database_data.erd record)
      and the record's OWN embedded `fields[]` are not cross-validated
      against each other -- a caller could supply a schema_ref whose
      referenced ERD record's own entity attributes disagree entirely
      with this record's own fields[]. This method cannot see the
      referenced record (format-only soft link, the same declared limit
      every prior soft-link field in this package already carries).
      Should a future revision add a runtime cross-check (would require
      this method to load and parse the referenced record, a genuinely
      different, heavier design)?
    owner: "operator, or whoever next revises this contract's own scope"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap"
  - id: "OQ-DC-5"
    question: >
      ADDED post-critic-review. `consumers` requires at least 1 entry,
      which cannot represent contract-first publishing (a producer
      registers a contract before any consumer exists -- a real,
      documented data-mesh/schema-registry pattern, not a degenerate
      state). Should a future revision relax `minItems` to 0 and
      demote at-least-one-consumer to an advisory check, or add a
      distinct `status` field (e.g. `draft`/`active`) that legitimizes
      a zero-consumer state only while `draft`?
    owner: "operator, or whoever next revises this contract's own field design"
    blocks: "nothing in this file's own validity -- disclosed scope limit, not a silent gap"


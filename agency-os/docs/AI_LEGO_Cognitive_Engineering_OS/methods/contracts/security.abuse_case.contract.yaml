id: security.abuse_case
version: "1.0.0"
family: security

cognitive_primitives: [DECOMPOSE, MAP, VALIDATE]
# INFERRED, not cited -- same reasoning class security.pasta/security.dpia_pia
# already establish: staging the five-element chain (and the abuse_flow's own
# variable-length step sequence) is DECOMPOSE; assigning per-stage/per-step
# content (actor summary, goal summary, control/detection descriptions) is
# MAP; the dual step-coverage completeness check is VALIDATE (a referential
# derivation, not a numeric COMPUTE step -- no aggregation like Attack Tree's
# own cost/skill/detectability rollup).

purpose:
  - model_a_malicious_actors_goal_and_ordered_abuse_flow_through_atlas_own_five_chain_elements_from_actor_to_detection_with_every_abuse_flow_step_traceable_to_at_least_one_control_and_separately_to_at_least_one_detection_mechanism
inputs:
  required: [TargetSystemDescriptor, AbuseCaseStageSequence]
  # AbuseCaseStageSequence, not "...Set" -- same shape-accurate-naming
  # discipline security.attack_tree's AttackGoalTree, security.pasta's
  # PastaStageSequence, and security.dpia_pia's DpiaPiaStageSequence already
  # establish: Atlas's own "→" chain is a real dependency order, not an
  # unordered set. TargetSystemDescriptor plays the same role
  # ProcessingActivityDescriptor plays for security.dpia_pia -- the thing
  # `system_or_component` names (here, doubling as the "normal use case"
  # Atlas's own benefit line says this method complements -- see
  # `compilation_decisions` on why no separate field was invented for that).
  optional: []
outputs: [AbuseCaseRecord]
preconditions:
  - "system_or_component is a non-empty string"
  - "stages is EXACTLY the five entries {actor, goal, abuse_flow, controls, detection}, one each, IN THAT ORDER -- Atlas's own '→' chain is a real dependency order, not an unordered set"
  - "the actor and goal stages each have a non-empty summary"
  - "the abuse_flow stage has at least one step, each with a unique step_id (prefix STEP-) and a non-empty description -- steps are declared in narrated (attacker-performed) order"
  - "the controls stage has at least one well-shaped control entry, and EVERY control's addresses_step_ids references a step_id that exists in the abuse_flow stage"
  - "EVERY step_id declared in the abuse_flow stage is addressed by at least one control -- no abuse-flow step may be left with zero mitigating controls"
  - "the detection stage has at least one well-shaped detection entry, and EVERY detection's addresses_step_ids references a step_id that exists in the abuse_flow stage"
  - "EVERY step_id declared in the abuse_flow stage is ALSO addressed by at least one detection entry, INDEPENDENTLY of the controls check above -- Atlas's own chain names controls and detection as two distinct final elements, not one merged 'mitigation' step; a step with a control but zero detection (or vice versa) is an INCOMPLETE abuse case under this contract"
quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class every prior structural (non-genuine_compute) F20 contract
  # already establishes: the dual step-coverage completeness check is a
  # structural/referential derivation, not a statistical/numeric CALCULATED
  # RESULT.
forbidden_transition: []
# Atlas §22.3's own gate table has no Abuse Case row.
recommended_next: [architecture.adr]
# Same forward link every sibling F20 contract already establishes, for a
# reason genuinely closer to security.dpia_pia's own disclosed reasoning than
# to security.stride/linddun/attack_tree/pasta's own F18-chain-before-ADR
# reasoning: Abuse Case is NOT one of EC §32's four named Threat Review
# methods (see description), so it is not itself the "Threat Model" step
# Atlas's own F18 Architecture Change chain (L830-842, "...-> Threat Model ->
# ADR -> ...") names. Rather, a COMPLETED Abuse Case record that surfaces a
# step with insufficient control/detection coverage (the T2/E4/Uw1 real
# example this contract's own CLI demo models) is exactly the kind of finding
# an ADR's own Recommendation section would decide how to close -- the same
# "real content feeds an ADR's drafting, not a formal pre-ADR gate step"
# relationship security.dpia_pia.contract.yaml already discloses for its own
# real ADR-002 precedent.
rollback:
  side_effect_free: true
  # The RECORD itself is side-effect-free -- same class every prior
  # structural contract's own rollback field already draws.

compilation_decisions:
  - question: >
      Should `controls` and `detection` be merged into a single
      `mitigations[]` array (each entry optionally flagged
      preventive/detective), matching how a reader might casually
      summarize "controls and detection are both just mitigations"?
    decision: "No -- kept as two separate stages, each independently required to fully cover every abuse_flow step."
    reasoning: >
      Atlas's own F20 row writes the chain as "...→controls→detection",
      two distinct words in two distinct chain positions, not one word.
      Merging them would silently discard one of Atlas's own five named
      chain elements -- the same class of undisclosed structural
      change a critic review already caught (in the opposite direction,
      by ADDING unstated structure) on `database_data.data_contract`'s
      own first draft. It also directly determines this contract's own
      real invariant: the T1 (supply chain) real scenario has both a
      real control and a real, separately-named detection mechanism
      (Rekor transparency log); the T2/E4/Uw1 real scenario has a
      control but explicitly NO detection mechanism per
      SECURITY_THREAT_MODEL.md's own Residual Risk column. A merged
      `mitigations[]` field would have let the T2/E4/Uw1 scenario pass
      with its single EC §35 "control" alone, silently hiding the exact
      gap Prioritized Threat List item 6 names as still unsolved.
  - question: >
      Should this contract invent an EC §32-shaped
      assets/trust_boundaries/entry_points/test_evidence framing quad
      (matching STRIDE/LINDDUN/Attack Tree/PASTA), or omit it (matching
      DPIA/PIA)?
    decision: "Omit it entirely, following security.dpia_pia.contract.yaml's own precedent."
    reasoning: >
      Grep-confirmed (re-verified independently for this method, not
      assumed from the DPIA/PIA precedent) that EC §32's own closing
      sentence (L1260) never names Abuse Case, and that Atlas's own
      §13.11 Security Review Recipe (L3472-3487, current lines) ALSO
      never names it -- a second, independent piece of negative
      evidence DPIA/PIA's own contract did not have available (DPIA/PIA
      is simply absent from EC §32; this method is absent from BOTH EC
      §32 AND Atlas's own default recipe). Inventing the quad anyway,
      purely for cross-sibling cosmetic consistency with
      STRIDE/LINDDUN/Attack Tree/PASTA, would be exactly the kind of
      fabricated structure this session's own governing discipline
      (and the `database_data.data_contract` critic-review precedent)
      already forbids.
  - question: >
      Should a terminal decision/verdict stage (an "approval", matching
      DPIA/PIA, or a final risk verdict, matching PASTA) be added, for
      consistency with those two sibling pipelines?
    decision: "No -- Atlas's own five-word chain ends at 'detection', with no decision/verdict word. No terminal stage is invented."
    reasoning: >
      DPIA/PIA's own eight-word chain literally ends in "Approval";
      PASTA's own seven-word chain literally ends in "Risk" (Risk &
      Impact Analysis, a verdict). Abuse Case's own five-word chain
      ends in "detection" -- a descriptive, not a decision-bearing,
      final element. Inventing an approval/verdict stage neither
      sibling's own real citation gives THIS method would be the same
      "undisclosed over-constraint" class already disclosed and
      avoided elsewhere in this family. An Abuse Case record is
      therefore a completed descriptive artifact on its own; any
      decision about what to do with its findings belongs to the
      downstream ADR this contract's own `recommended_next` already
      names, not to a stage invented here.
  - question: >
      Should `abuse_flow`'s own steps be a FIXED-length, positionally
      -ordered tuple (matching how the outer five-stage `stages` array
      itself is ordered via `prefixItems`), or a variable-length
      ordered array?
    decision: "Variable-length ordered array (minItems: 1, no fixed count or fixed vocabulary)."
    reasoning: >
      The OUTER five-element chain is Atlas's own fixed, named
      vocabulary (actor/goal/abuse_flow/controls/detection) -- the same
      class of fixed vocabulary DPIA/PIA's own eight named stages and
      PASTA's own seven named stages already are, correctly enforced
      via `prefixItems`. An individual abuse flow's own STEPS, by
      contrast, are scenario-specific free narrative (a phishing-based
      abuse flow and a rate-limit-bypass abuse flow have completely
      different step counts and content) -- Atlas gives no fixed
      per-step vocabulary to enforce, so forcing a fixed length here
      would fabricate structure Atlas never specifies. Step UNIQUENESS
      (no duplicate step_id within one abuse_flow) is still enforced,
      the same restraint DPIA/PIA's own duplicate-risk_id check already
      establishes for ITS OWN variable-cardinality risks/controls
      /residual_risk arrays.
  - question: >
      Should `system_or_component` be supplemented with a SEPARATE
      field explicitly naming "the normal use case this abuse case
      complements", directly echoing Atlas's own benefit line ("補足
      正常 use case")?
    decision: "No separate field invented -- system_or_component's own description is written to explicitly double as that reference."
    reasoning: >
      Every sibling F20 typed object (STRIDE/LINDDUN/Attack
      Tree/PASTA/DPIA-PIA) already uses `system_or_component` (or an
      equivalent single framing field) as the one thing the whole
      record is about. Adding a second, overlapping field purely to
      echo Atlas's own five-word benefit phrase more literally would
      duplicate that single framing concept under two names with no
      real behavioral difference -- the same restraint PASTA's own
      compilation_decisions already applies when declining to invent
      per-stage sub-structure Atlas does not itself specify.


$id: "ai-lego://methods/contracts/security.abuse_case.contract.yaml"
title: "Abuse Case Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry. Fifty-second Method Atlas slice (task-assigned
  ordinal), NINTH of Atlas's own TEN F20 table rows by table position
  (STRIDE, Attack Tree, PASTA, LINDDUN, DPIA/PIA, Zero Trust Review,
  Secrets Threat Review, Supply Chain Threat Model, **Abuse Case**,
  Security Control Mapping -- L882-891). Four other F20 rows (Zero Trust
  Review, Secrets Threat Review, Supply Chain Threat Model, Security
  Control Mapping) are being built CONCURRENTLY by separate agents in
  this same session -- this file does not assert a specific relative
  build-order or "Nth security-family member" ordinal among them (only
  the task-assigned "52nd Method Atlas slice overall", which is fixed
  regardless of sibling commit timing), to avoid a claim that could go
  stale the moment a sibling agent's own commit lands.

  **Atlas gives this method exactly ONE citation** -- the F20 tool
  table's own row (L890: purpose "從惡意使用者角度描述濫用"; usage
  "actor→goal→abuse flow→controls→detection"; benefit "補足正常 use
  case"). Broad, independent grep across the Method Atlas, the Master
  Plan, and the Execution Contract (case-sensitive and
  case-insensitive, "Abuse Case"/"misuse case"/"惡意使用者"/"abuse
  flow"/"濫用") found NO dedicated section (unlike STRIDE's §11.44,
  LINDDUN's §11.45, or DPIA/PIA's §11.46), NO worked example, and NO
  second mention anywhere in either mother document. This is the SAME
  "thinnest grounding" class `security.pasta.contract.yaml` already
  establishes, one citation only -- re-confirmed independently for this
  method rather than assumed from that precedent.

  **Confirmed absent from BOTH of Atlas's own security recipes, not
  just from Execution Contract §32's four named Threat Review
  methods**: EC §32's own closing sentence (L1260, re-verified by
  direct read) names exactly "STRIDE／LINDDUN／Attack Tree／PASTA", no
  fifth option -- Abuse Case is absent, the SAME class of absence
  `security.dpia_pia.contract.yaml` already established for DPIA/PIA.
  Additionally, and NEWLY confirmed for this method specifically (Atlas
  §13.11 Security Review Recipe, L3472-3487, re-read directly at its
  CURRENT line numbers rather than trusting a stale citation): "Asset
  Inventory → Data Flow Diagram → Trust Boundaries → STRIDE → LINDDUN →
  Attack Tree → Secret/Identity Review → Supply Chain Review → Control
  Mapping → Adversarial Test → Residual Risk → Human Security Approval"
  -- a twelve-step recipe that ALSO never names Abuse Case (nor DPIA
  /PIA). Abuse Case's own trigger (modeling a malicious actor's usage of
  an ALREADY-DEFINED normal use case, per its own benefit line "補足
  正常 use case") is a genuinely different kind of artifact from EC
  §32's authn/authz/secrets/crypto/network/egress/tenant-isolation
  /file-parsing/user-content/AI-tools trigger list -- it presupposes a
  use-case model already exists to be complemented, not a system-wide
  Threat Review gate of its own. Consequently, following
  `security.dpia_pia.contract.yaml`'s own precedent and reasoning
  exactly, this record carries NONE of
  `assets`/`trust_boundaries`/`entry_points`/`test_evidence` -- the
  SECOND F20 typed object (after DPIA/PIA) to omit that quad entirely,
  further narrowing `security.stride.contract.yaml`'s own `OQ-STRIDE-4`
  (see `open_questions` below for the exact `resolved_by` text this
  file proposes appending there).

  **Confirmed distinct from every existing `specs/security/` typed
  object** (`key-vault-lifecycle`, `log-redaction-token`,
  `personal-data-envelope`, `tenant-isolation-controls`), re-confirmed
  by direct full read: all four are narrower, specific security-CONTROL
  records (a key lifecycle state machine, a token shape, an encryption
  envelope, an isolation-model decision record) -- none models an
  actor-goal-flow narrative review of the kind this method's own
  "actor→goal→abuse flow→controls→detection" chain names. No
  duplication found.

  **Real usage precedent in THIS repository, drawn from an ALREADY
  -DOCUMENTED threat, not invented from scratch (same due-diligence
  bar `security.dpia_pia.contract.yaml`'s own ADR-002 precedent
  already sets, itself stronger than `security.pasta.contract.yaml`'s
  own admittedly-fabricated example)**:
  `docs/architecture/SECURITY_THREAT_MODEL.md` (Status: PROPOSED,
  2026-08-29, this repository's own real STRIDE+LINDDUN threat review)
  names TWO real scenarios this contract's own CLI demo models
  directly, chosen because they land on OPPOSITE sides of this
  contract's own central invariant (see below):

  1. **T1 (Tampering, Supply Chain 簽章金鑰) / `docs/adr/ADR-015
     -supply-chain-security-tooling-selection.md`** -- a REAL, CLOSED
     threat: an attacker (or compromised CI credential) attempting to
     steal a long-lived CI signing key or forge a "Verified Deployment"
     signature. ADR-015 Sub-decision (b) (ACCEPTED 2026-08-30) adopts
     Sigstore/cosign KEYLESS signing via GitHub Artifact Attestations
     (OIDC short-lived credentials + Fulcio) -- SECURITY_THREAT_MODEL
     .md's own T1 row (UPDATED 2026-08-30) states this "結構性改變原始
     威脅...keyless 簽章不存在需要長期保管的 CI 簽章私鑰...改用 OIDC
     短期憑證 + Fulcio + Rekor 透明日誌", explicitly naming Rekor's
     public, append-only transparency log as the mechanism that makes
     every real signing event independently auditable. This is a
     genuine abuse case with BOTH a real control (no static key exists
     to steal) AND a real, named detection mechanism (Rekor transparency
     log) -- it VALIDATES cleanly against this contract's own
     completeness invariant (see below).
  2. **T2 / E4 / Uw1 (Tampering / Elevation of Privilege / Unawareness,
     Untrusted Content → AI 決策流 → Knowledge Memory)** -- a REAL,
     STILL-OPEN gap, Prioritized Threat List item 6
     ("須在記憶子系統 ingestion pipeline 設計前解決"): a prompt-injection
     attacker manipulates an AI agent's tool-call decision and/or
     poisons Knowledge Memory with attacker-controlled content that
     persists as if verified. SECURITY_THREAT_MODEL.md's own T2
     Residual Risk column is explicit: "原則存在但無落地機制：無
     untrusted span 標記方案，無說明該標記能否在寫入 Knowledge Memory
     後存活" -- EC §35's structural principle (Policy/System
     Instructions ≠ Retrieved Source Data) exists, but NO landed
     detection mechanism exists for this abuse pathway anywhere in this
     repository. Modeled faithfully (not weakened or strengthened to
     make a point), this abuse case is REFUSED by this contract's own
     construction-time invariant -- not because the record is malformed,
     but because Atlas's own two named final chain elements (`controls`
     AND `detection`) are genuinely, honestly NOT both present for this
     real, disclosed gap. This is a STRONGER due-diligence result than
     either `security.pasta` or `security.dpia_pia` achieved: rather
     than merely finding a real scenario that happens to validate, this
     slice's own CLI demo proves its invariant is not toothless by
     showing it correctly REFUSE a genuine, currently-open gap this
     repository's own threat model already discloses.

  **The core real invariant, directly grounded in Atlas's own citation
  itself (STRONGER grounding than DPIA/PIA's own two invariants, which
  are disclosed as real EXTERNAL GDPR practice, NOT an Atlas citation)**:
  Atlas's own F20 row literally lists `controls` and `detection` as TWO
  SEPARATE, DISTINCT final chain elements, not one merged
  "mitigation" step. This contract therefore requires, for EVERY step
  declared in the `abuse_flow` stage: (a) at least one `controls` entry
  whose `addresses_step_ids` names that step (forward AND reverse
  referential completeness, the same class `security.dpia_pia
  .contract.yaml`'s own risk-to-control traceability already
  establishes), AND (b) SEPARATELY, at least one `detection` entry
  whose own `addresses_step_ids` names that step. Collapsing these into
  one merged "mitigation" array (as an earlier draft of this
  description considered, then rejected -- see `compilation_decisions`)
  would silently discard one of Atlas's own five named chain elements,
  the exact "undisclosed over-constraint by omission" class a critic
  review already caught on `database_data.data_contract`'s own first
  draft (there by ADDING unstated structure; here the analogous
  mistake would be REMOVING stated structure).

  **A genuinely new structural sub-variant among F20 members**: shares
  PASTA/DPIA-PIA's own "fixed-length, positionally-ordered pipeline"
  class (`prefixItems`, five stages here), but the THIRD stage
  (`abuse_flow`) itself nests a VARIABLE-length, freely-many-steps
  ordered sub-array (unlike DPIA/PIA's fixed eight-stage vocabulary, an
  abuse flow's own step count is scenario-specific, not Atlas-fixed),
  and the completeness invariant runs in TWO independent directions
  over that same nested array (`controls` AND `detection` each
  independently required to fully cover it), rather than DPIA/PIA's
  single risk-to-control-to-residual chain. Also genuinely different
  from PASTA/DPIA-PIA in the other direction: Atlas's own five-word
  chain names NO terminal decision/verdict stage (no "approval", no
  final "risk" verdict) -- an Abuse Case record is a completed
  DESCRIPTIVE artifact, not a decision gate, and this contract does not
  invent one (see `compilation_decisions`).

  This is a STRUCTURAL record (`provenance_required` + one integrity
  gate), NOT `genuine_compute` -- the dual completeness invariant is a
  set-membership/referential derivation, the same class STRIDE/LINDDUN's
  own `elements_with_no_recorded_threats` and DPIA/PIA's own
  risk-traceability already establish, not a numeric/ordinal
  computation like Attack Tree's own cost/skill/detectability
  aggregation.


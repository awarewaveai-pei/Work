decided_by: >
  No ADR governs the content. Registered in
  `methods/registry/contract-backlog.yaml` `tier_1` (see
  `open_questions` for the exact proposed entry text -- NOT written by
  this file, per this task's own hard constraint against editing that
  shared registry directly, to avoid a naming/numbering collision with
  the four sibling agents concurrently registering their own entries in
  the same file this session). `id: security.abuse_case` mints a new
  machine_id. The step-level dual completeness invariant
  (controls-AND-detection, both directions) is grounded DIRECTLY in
  Atlas's own F20 row (two distinct named chain elements), not in
  external practice -- a stronger citation basis than
  `security.dpia_pia.contract.yaml`'s own two invariants, which are
  explicitly disclosed as real GDPR/DPIA practice, NOT an Atlas

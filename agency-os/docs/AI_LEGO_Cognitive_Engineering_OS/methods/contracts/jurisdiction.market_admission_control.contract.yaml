    purpose -- an authored pack's own freshness/residency/override state --
    not this method's per-admission-request PASS/FAIL stage record; no name
    or output-schema-title collision). Validated against
    specs/cognitive/method.schema.yaml with jsonschema Draft202012Validator.
  note: >
    No mother document was modified. The 7-stage pipeline and the fail-
    closed-on-unknown rule are transcribed from Atlas §11.54. The stage-

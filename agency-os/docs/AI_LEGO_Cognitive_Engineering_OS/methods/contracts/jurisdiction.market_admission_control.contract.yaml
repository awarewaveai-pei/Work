    Read Atlas F23 table (L942) and §11.54 (L2440-2465) directly, plus §18.3
    (L4034-4053) for the corroborating mermaid flow. Grepped
    `agency-os/docs/AI_LEGO_Cognitive_Engineering_OS` and
    `Projects/internal/cognitive-engineering-os` case-insensitively for
    "market_admission_control"/"MarketAdmissionRecord"/"market admission"
    before writing -- zero pre-existing method contract or module overlap
    (pre-existing `specs/jurisdiction/pack.schema.yaml` is a distinct,

$id: "ai-lego://methods/contracts/association.mind_map.contract.yaml"
title: "Mind Map Method Contract"
status: ACTIVE

description: >
  association.mind_map, 1st `association` (F04 "關聯映射與組合", Associative Mapping & Combination) family
  member -- family 0/6 built before this batch. Atlas's PRIMARY citation is dedicated §11.1 (L1124-1172),
  corroborated by the F04 table row (L411: "中心→主枝→次枝→關鍵詞") and the F04 mermaid diagram (L418-426, Mind
  Map's own untyped edges contrasted against Concept Map's typed edges in the SAME diagram). NOT the same
  thing as contract-backlog.yaml's own tier_2 `worked_example` under this exact method_id -- that is a
  naming-format illustration lifted from a planning doc, `contract_status: pending`, not edited here. Core
  invariant: a strict, fixed-depth NESTED tree (central_topic -> main_branches[] -> sub_branches[] ->
  keywords[]), never an id-cross-referenced graph -- structurally forecloses the cross-branch/causal claim
  Atlas's own §11.1 限制 forbids ('邊沒有正式語意'／不能因為兩個東西畫在一起就宣稱存在因果), by construction.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F04 tool table, Mind Map row (L411)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §11.1 (L1124-1172) -- dedicated section, primary structural citation, including 標準使用方式 5 steps and 限制 3 bullets"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F04 mermaid diagram (L418-426)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §13.1 Simple Brainstorm Recipe (L3216) and §28 quick-tool table (L4467) -- corroborating recipe-chain citations, same method, no conflicting shape"

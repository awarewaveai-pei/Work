  - "methods/registry/method-inventory.yaml F04 association 'Mind Map' row (L356-361) -- confirms family/category; its own `line: 410` citation is stale by one (real F04 table row is L411, same drift class other rows in this suite already found), not corrected here per Lean Standard §6"
  - "specs/cognitive/typed-objects/non-goals-record.schema.yaml -- closed-key-set nested-entry convention reused"
  - "specs/cognitive/typed-objects/decision-tree-record.schema.yaml -- NESTED, not id-cross-referenced tree-shape precedent reused"

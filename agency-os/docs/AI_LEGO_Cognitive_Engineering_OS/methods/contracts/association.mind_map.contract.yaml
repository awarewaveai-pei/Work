id: association.mind_map
version: "1.0.0"
family: association

cognitive_primitives: [EXPAND, ASSOCIATE]
# INFERRED, not cited -- Atlas's own §4 L188 composition formula for SCAMPER ("EXPAND + ASSOCIATE +
# TRANSFORM") is the closest real precedent for this exact primitive pair; Mind Map's own table citation
# "自由樹狀聯想" (free tree-shaped ASSOCIATE-ion) + "外化工作記憶" via divergent EXPANSION matches both without
# TRANSFORM (Mind Map does not reshape/convert content, only radiates it outward). Both independently confirmed
# real values in specs/cognitive/primitive.schema.yaml's own CANONICAL_KERNEL enum.

purpose:
  - externalize_free_tree_shaped_association_from_one_central_topic_across_main_and_sub_branches

inputs:
  required: []
  optional: []
# Leaf method -- Atlas's own §11.1 places it directly on "資訊尚未結構化" (information not yet structured), no
# upstream typed-object dependency, same entry-point class framing.five_w_one_h's own empty inputs.required
# already establishes.

outputs: [MindMapRecord]

preconditions:
  - "central_topic is exactly one non-empty topic/question, never more than one (Atlas §11.1 step 1, L1131: '中心只放一個主題或問題')"
  - "main_branches has at least 1 entry, each carrying a non-empty label (Atlas §11.1 step 2, L1132: '第一層放主要方向'); main_branches are NOT required to be MECE (Atlas's own explicit '不急著要求 MECE')"
  - "a main_branches[] entry MAY optionally carry sub_branches[] (non-empty when present); a sub_branches[] entry MAY optionally carry keywords[] (non-empty when present) -- Atlas §11.1 step 3, L1133: '第二、三層放關鍵詞、例子、疑問、素材'"
  - "every branch id (main_branches[] and nested sub_branches[]) is unique across the whole record"
  - "no field anywhere expresses a cross-branch or cross-main-branch reference -- Atlas's own 限制 (L1167-1169: '邊沒有正式語意'／'不能因為兩個東西畫在一起就宣稱存在因果') is enforced structurally via nesting, not a runtime denylist"

quality:
  provenance_required: true
  evidence_labeling_required: false
  # Atlas's F04 table has no misuse/evidence column (5-column table: 工具/用途/使用方式/效益/最佳搭配) -- same
  # reasoning framing.non_goals's own contract already applies to its own column-less F01 table, re-derived
  # independently here.

forbidden_transition: []
# Grep-confirmed Mind Map is ABSENT from Atlas §22.3's Method-specific Gate table (L4142-4155) and §14.1's
# worked legal/illegal transition examples (L3544-3584) -- left genuinely empty rather than inventing one,
# same restraint framing.five_w_one_h/framing.non_goals's own identical field already establishes. Atlas's own
# §11.1 限制 text is enforced structurally instead (see preconditions above and compilation_decisions).

recommended_next: []
# Atlas's own real pairing (§11.1 step 4/L1134 + 推薦搭配 L1172: "Mind Map → Affinity Diagram → Concept Map /
# Issue Tree") names association.affinity_diagram and association.concept_map, BOTH unbuilt concurrent
# siblings at this write time (this task's own explicit constraint: do not depend on or invent their shape) --
# left empty rather than asserting a machine_id for an unconfirmed sibling, same restraint
# framing.five_w_one_h's own recommended_next: [] already establishes.

rollback:
  side_effect_free: true

compilation_decisions:
  - question: "Fixed 3-level nesting (main_branch->sub_branch->keyword) or an arbitrary-depth recursive tree like decision.decision_tree's own root?"
    decision: "Fixed -- Atlas's own citation names exactly 4 levels (中心→主枝→次枝→關鍵詞); no 5th level invented, no MAX_TREE_DEPTH bound needed."
  - question: "Nested (embedded) tree or id-cross-referenced graph (contrast fault_tree/event_tree's own flat shape)?"
    decision: "Nested, same representation choice decision.decision_tree already reasoned through for a path-dependent node ('a node can only ever belong to one parent') -- and the ONLY shape that structurally forecloses the exact cross-branch/causal link Atlas's own §11.1 限制 forbids, not merely by convention."
  - question: "Should main_branches be required to be MECE?"
    decision: "No -- Atlas's own literal '不急著要求 MECE' is transcribed as a NON-invariant: only id uniqueness is checked, never content/label overlap or exhaustiveness."
  - question: "Depend on the Atlas-named next steps (Affinity Diagram, Concept Map), both unbuilt at this write time?"
    decision: "No hard dependency -- both are concurrent siblings in this same batch, not read here; recommended_next left empty, both named in open_questions, same restraint framing.five_w_one_h's own recommended_next: [] already establishes for an unbuilt Atlas-named pairing."
  - question: "Record id prefix?"
    decision: "MINDMAP- -- matches the method's own short name, same convention decision.decision_tree's DECISIONTREE- / framing.non_goals's NONGOALS- prefixes already establish."

open_questions:
  - "OQ-MINDMAP-1: cognitive_primitives [EXPAND, ASSOCIATE] is this file's own inference (SCAMPER's own cited composition 'EXPAND + ASSOCIATE + TRANSFORM', Atlas L188, is the closest real precedent for this pair), not a cited Atlas composition formula for Mind Map itself.（owner: operator）"
  - "OQ-MINDMAP-2: recommended_next names no method -- Atlas's own real pairing (Affinity Diagram, then Concept Map / Issue Tree, §11.1 L1134/L1172) is unbuilt at this write time (association.affinity_diagram/association.concept_map are concurrent siblings in this same batch, not read here; Issue Tree is a different, unbuilt F02 method). Add once those mint machine_ids.（owner: operator, or whoever next lands the F04 siblings）"
  - "OQ-MINDMAP-3: method-inventory.yaml's own 'Mind Map' row (line 356-361) cites Atlas line 410; the real F04 table row is line 411 (same off-by-one drift class this batch already found in multiple F01 rows). Not corrected here per Lean Standard §6 (method-inventory.yaml maintenance no longer a mandatory step).（owner: operator, or whoever next does an integration pass over method-inventory.yaml）"


decided_by: >
  No ADR governs the content. `id: association.mind_map` mints the real tier_1 entry for a machine_id that
  already existed as a NAMING-FORMAT ILLUSTRATION only (contract-backlog.yaml's own tier_2 worked_example,
  MACHINE_READABLE_SPEC_PLAN.md §4 L263-266) -- already the ADR-005b-correct bare form, no naming collision.
  Grepped the whole ai_lego tree case-insensitively for "mind_map"/"mind map" before writing -- zero

id: framing.problem_statement
version: "1.0.0"
family: framing

cognitive_primitives: [FRAME, DECOMPOSE, VALIDATE]
# INFERRED. FRAME = Atlas's own purpose column ("建立共同問題定義" -- establish
# a shared problem definition), same kernel token framing.goal_statement's own
# benefit line ("把模糊願望轉明確目標") already maps to. DECOMPOSE = splitting
# into current/expected/gap/impact/constraints. VALIDATE = the two-layer
# invariant re-derivation every sibling module in this family already uses.

purpose:
  - describe_a_shared_problem_as_current_state_expected_state_gap_impact_and_constraints_for_cross_functional_alignment
inputs:
  required: []
  optional: []
# Atlas's own §14.1 chain names ProblemStatement as the chain ORIGIN
# ("ProblemStatement -> Fishbone -> ..."), same entry-point reasoning
# framing.goal_statement's own empty `inputs.required` already establishes for
# this family's "任務起始"-shaped methods.
outputs: [ProblemStatement]
# REUSES the existing typed object verbatim (specs/cognitive/typed-objects/
# problem-statement.schema.yaml) -- see description/compilation_decisions.
preconditions:
  - "id is a non-empty string prefixed PROB-; version is a string; status is one of [draft, under_review, validated, rejected, superseded]"
  - "content.current_state, content.expected_state, and content.gap are each non-empty strings"
  - "content.expected_state must NOT be identical (case/whitespace-insensitive) to content.current_state -- an identical pair is an echo, not a checkable gap"
quality:
  provenance_required: true
  evidence_labeling_required: false
  # Atlas's F01 table has no misuse/evidence column for any row, and this
  # record carries one whole-record provenance, not per-field labels -- same
  # reasoning framing.goal_statement's own quality block already establishes.
forbidden_transition: []
# Atlas §22.3's own gate table (grep-confirmed) has no Problem Statement row.
recommended_next: [root_cause.fishbone]
# Directly grounded in the schema's own description chain ("ProblemStatement
# -> Fishbone -> CauseHypothesisSet -> ...") and root_cause.fishbone's own
# precondition on problem_statement.status. Four other built methods
# (root_cause.event_tree/fault_tree/kepner_tregoe, decision.decision_tree,
# root_cause.change_analysis) also legally consume this output -- a real,
# disclosed one-to-many fan-out unlike a strict linear chain -- but Fishbone
# is the one both the SAME source-of-truth citation (Atlas §14.1) names as
# origin and designates as the immediate next node.
rollback:
  side_effect_free: true

compilation_decisions:
  - question: "Contract-only reuse (fork a, like architecture.trade_off_matrix -> decision.mcda) or a real build (fork b)?"
    decision: "Real build, but reusing the EXISTING schema as outputs (no second schema) -- neither fork as literally templated. No existing method contract produces ProblemStatement (grep-confirmed), so there is no builder to point at the way trade_off_matrix pointed at decision.mcda's generate_mcda_analysis; fishbone.py's own build_problem_statement is real code but enforces zero invariants (a test-fixture helper, not a gated implementation) -- not a reuse target either."
  - question: "Mint a second schema (e.g. problem-statement-record.schema.yaml) to avoid ambiguity with the existing file's name?"
    decision: "No -- the existing problem-statement.schema.yaml IS already this method's real, canonical, heavily-cross-referenced output type (5 sibling contracts require it verbatim). Minting a second schema for the same concept would be the exact undisclosed-duplication failure class this whole corpus repeatedly self-corrects against, in the opposite direction from the risk the task brief anticipated."
  - question: "Enforce a real invariant beyond per-field non-emptiness?"
    decision: "Yes -- expected_state must genuinely differ from current_state (case/whitespace-insensitive), same 'identical pair is a no-op' class framing.goal_statement's own success_condition!=goal invariant already establishes for this family."
  - question: "Should the optional content fields (affected_stakeholders/impact/evidence/constraints/scope_non_goals) be required non-empty when present?"
    decision: "No -- type-checked only (list of strings / string), matching the schema's own permissive shape (no minItems/minLength on those fields). Inventing stricter rules the schema itself does not state would be an undisclosed over-constraint, the same failure class this corpus's own compilation_decisions elsewhere already self-corrects against."


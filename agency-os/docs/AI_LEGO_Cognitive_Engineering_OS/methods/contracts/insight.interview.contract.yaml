    Read Atlas F06 table row (L467) and §12.17 (L2759-2764) directly. Grepped the whole Atlas file
    case-insensitively for "深度訪談" -- confirmed exactly 1 dedicated section. Grepped for "樣本與偏誤" --
    confirmed exactly 1 real hit (L467 table row only; §12.17 itself does NOT repeat this exact phrase, its own
    limitation is the separate "不能用少量訪談直接推估人口比例" sentence -- corrects an initial task-framing
    assumption that the caution was "twice-repeated"; disclosed here per R4 claim-before-verify). Grepped the
    whole `agency-os/docs/AI_LEGO_Cognitive_Engineering_OS` and `Projects/internal/cognitive-engineering-os`
    trees case-insensitively for "insight.interview"/"InterviewStudy" before writing any of this method's own
    files -- zero pre-existing implementation. Read security.pasta.contract.yaml (fixed-length ordered-pipeline

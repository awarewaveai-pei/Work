title: "Affinity Diagram / KJ Method Contract"
status: ACTIVE

description: >
  Tier 1, 1st F04 association family member (family had 0/many built before this batch -- grep-confirmed no
  `ai_lego/modules/association/` directory existed). Atlas's citations: F04 table row (L413: "Affinity
  Diagram｜大量 idea 自然分群｜一卡一 idea→靜默分群→命名｜找 pattern、降低資訊量｜Thematic Analysis") and
  dedicated §11.3 (L1206-1224, 5-step 使用方式). Core invariant: `cards` (one per raw idea) and `groups`
  (post-hoc-named clusters) with mutual-exclusive referential integrity between them; `ungrouped_card_refs` is
  GENUINE_COMPUTE (cards not covered by any group), re-derived by an independent gate, never caller-asserted.
  Atlas step 2 ("do not pre-define category names") is a PROCESS constraint on how the analyst worked, not a
  property of the finished record -- deliberately NOT turned into an unenforceable field (see

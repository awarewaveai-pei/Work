  method: >
    Read Atlas F07 table row (L495) and §12.19 (L2777-2784) directly. Grepped the whole Atlas file for
    "Game Theory"/"賽局" -- confirmed exactly these 2 real citations, no §4 composition formula, no §14.1
    legal-chain mention, no §22.3 gate-table row. Grepped the whole `agency-os/docs/AI_LEGO_Cognitive_Engineering_OS`
    and `Projects/internal/cognitive-engineering-os` trees for "game_theory"/"GAMETH"/"GameTheory" before writing
    any of this method's own files -- zero pre-existing implementation, zero contract-backlog entry. Read
    insight.jtbd.contract.yaml (record-level-only provenance precedent, this batch's fixed placement decision)
    and decision.mcda / mcda-analysis.schema.yaml (per-item list-of-objects with cross-array referential
    integrity left as a runtime invariant, OQ-MCDAANALYSIS-1 precedent for the same class of gap this file's own
    payoff-completeness invariant has) in full before writing this contract. Validated against
    specs/cognitive/method.schema.yaml with jsonschema.Draft202012Validator.
  note: >
    No mother document was modified. `cognitive_primitives` and the flat players/strategies/payoffs shape are

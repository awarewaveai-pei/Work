decided_by: >
  No ADR governs the content. This contract's own `id: security
  .security_control_mapping` mints a new machine_id, TENTH and LAST member
  of the `security` family (F20), closing that family 10/10. The
  consumption design (option (a) over standalone option (b)) and the
  closed two-value `source_record_type` enum are this contract's own
  compilation decisions, grounded in the three citations and two schema
  reads above -- not an ADR-level ruling.

id: security.security_control_mapping
version: "1.0.0"
family: security

cognitive_primitives: [MAP, RELATE, VALIDATE]
# INFERRED, not cited (Atlas gives no §4-style composition formula for this
# method -- it has no dedicated section at all). Deliberately DIFFERENT
# from every other F20 member's own [DECOMPOSE, MAP, VALIDATE] triple: this
# is the FIRST F20 method (and the first structural method built this
# session, confirmed by a spot grep of the family's own cognitive_primitives
# lines) whose own real work does NOT include a DECOMPOSE step, because the
# decomposition already happened in the upstream STRIDE/LINDDUN record this
# method consumes. Its own two real operations are: RELATE (a real kernel
# primitive, specs/cognitive/primitive.schema.yaml L75 -- establishing the
# Threat<->Control edge control_mappings[] IS) and MAP (assigning each
# control its own preventive/detective/recovery category). VALIDATE covers
# both the within-record and cross-record referential-integrity checks plus
# the source_threats_with_no_control_mapping derivation.

purpose:
  - classify_an_existing_threat_models_own_recorded_controls_into_preventive_detective_recovery_categories_with_structured_auditable_evidence_and_surface_which_threats_still_lack_a_mapped_control
inputs:
  required: [StrideThreatModelRecord_or_LinddunPrivacyThreatModelRecord, ControlSet]
  # Soft reference (free-text names per method.schema.yaml's own convention
  # for this field), not an enum -- the actual constraint (stride OR
  # linddun) is enforced by this record's own source_record_type field, not
  # by this string.
  optional: []
outputs: [SecurityControlMappingRecord]
preconditions:
  - "system_or_component is a non-empty string"
  - "source_record_type is one of {stride, linddun} -- the only two F20 siblings confirmed to expose an identical flat threats[] shape"
  - "source_record is a real, well-shaped external record of that type (id correctly prefixed STRIDE-/LINDDUN-, a non-empty threats[] list of entries each carrying a non-empty element_name and category) -- this method's own precondition input, not caller-asserted metadata"
  - "controls has at least 1 entry; every entry's own control_id is unique within the record and CTRL- prefixed, category is one of Atlas's own literal three words {preventive, detective, recovery}, description is non-empty, and evidence is a structured {description, verified_by, verified_date} record, all three non-empty"
  - "control_mappings has at least 1 entry; every entry's own source_threat_index is in range for source_record's own threats[], its denormalized source_threat_element_name/source_threat_category genuinely match what source_record actually has at that index (CROSS-RECORD referential integrity), and its control_id names a real controls[] entry (WITHIN-RECORD referential integrity); no duplicate (source_threat_index, control_id) pair"
  - "source_threat_count and source_threats_with_no_control_mapping are NOT caller-supplied -- the builder computes both internally from the real source_record, and the gate independently re-derives and compares against the stored values (fully, when the same raw source_record is supplied to it; via a weaker but still real self-contained partition check when it is not)"
quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class every prior structural (non-genuine-compute) F20 contract
  # already reasons through: both invariants are structural/referential
  # derivations (the same kind STRIDE's own elements_with_no_recorded
  # _threats and DPIA/PIA's own risk-traceability check already perform),
  # not a statistical/numeric CALCULATED RESULT.
forbidden_transition: []
# Atlas §22.3's own gate table (L4142-4155) has no Security Control Mapping
# row -- grep-confirmed directly, not assumed by copying the sibling
# pattern.
recommended_next: [challenge.red_team]
# A DIFFERENT reasoning than all five prior F20 siblings' own shared
# `[architecture.adr]` choice (grounded in F18's own Threat-Model-before-ADR
# chain / §13.9, neither of which names Control Mapping specifically). This
# is the FIRST F20 member with a LITERAL, SPECIFIC Atlas-named successor:
# §13.11's own recipe (L3483-3484) reads "...→ Control Mapping → Adversarial
# Test →...". `challenge.red_team` (9th slice, already built; Atlas §11.23,
# an 11-item generic adversarial-review checklist -- confirmed by
# `security.stride.contract.yaml`'s own due-diligence text, "a DIFFERENT
# method entirely, not STRIDE's own six fixed threat categories") is Atlas's
# own dedicated adversarial-review method, the best available real-world
# match for the recipe's own "Adversarial Test" step -- disclosed as an
# INFERENCE (Atlas never literally writes "Red Team" at L3484's own recipe
# line), not a verbatim citation, in OQ-SCM-4 below.
rollback:
  side_effect_free: true
  # The RECORD itself is side-effect-free -- same class every prior
  # structural contract's own rollback field already draws. Any real
  # remediation a mapped control's own evidence describes happens outside
  # this method's own scope.

compilation_decisions:
  - question: >
      Should this method be a genuine DOWNSTREAM CONSUMER of an existing
      sibling threat-model record (re-classifying ITS OWN existing threats'
      controls), or a STANDALONE record with its own from-scratch
      threats[]/controls[] arrays?
    decision: "Consumer (option a) -- source_record_id/source_record_type reference an EXTERNAL StrideThreatModelRecord or LinddunPrivacyThreatModelRecord; this record has no threats[] of its own."
    reasoning: >
      See description above for the full three-citation due-diligence
      trail (Atlas's own '每個威脅對應' grammar, §13.11's own sequencing,
      and security.stride.contract.yaml's own explicit forward-pointer).
      The standalone alternative was seriously considered and rejected: it
      would duplicate content STRIDE/LINDDUN already own, violate the
      "one clear owner per concern" discipline security.stride.contract
      .yaml's own fourth compilation_decision already applies in the
      opposite direction (declining to absorb THIS method's own concern
      INTO itself), and would silently ignore the §13.11 sequencing
      evidence.
  - question: >
      Which F20 siblings can plausibly serve as source_record_type -- all
      five already-built threat-model methods (STRIDE/LINDDUN/Attack
      Tree/PASTA/DPIA-PIA), or a narrower set?
    decision: "Exactly two: stride and linddun -- confirmed by direct read of all five sibling schemas to be the only pair sharing an identical flat threats[] shape."
    reasoning: >
      Attack Tree's own record is a recursive AND/OR tree (a 'threat' is a
      leaf_node reached only by tree traversal, no flat list to index into)
      -- structurally incompatible with this record's own index-addressed
      control_mappings[] design. PASTA's own record is a single
      fixed-length seven-stage prefixItems pipeline with exactly ONE
      terminal 'risk' stage carrying control/residual_risk/test_evidence
      for the WHOLE review, not per-threat -- there is no plural threats[]
      to map controls against at all. DPIA/PIA's own record already
      carries its OWN risks[]/controls[]/residual_risk[] traceability
      structure (a DIFFERENT, already-complete Threat[risk]->Control->
      Residual chain, GDPR-grounded, not Atlas-grounded) -- mapping THIS
      method's own preventive/detective/recovery vocabulary onto DPIA/PIA's
      own risk entries would require inventing a translation this
      contract's own due diligence found no citation for. Extending
      source_record_type to a five-way enum padded out to match F20's full
      threat-review roster, when three of the five are confirmed
      incompatible or already self-sufficient, would be exactly the kind
      of undisclosed over-reach a critic review already caught elsewhere
      in this session (an invented correspondence with no real textual or
      structural basis). Disclosed as a real, evidence-based scope limit in
      `OQ-SCM-2`, not silently narrowed.
  - question: >
      Should the Threat→Control edge (`control_mappings[]`) and the
      Control→Evidence record (`controls[]`) be ONE combined array (each
      entry carrying its own full control description AND evidence AND
      which threat it addresses), or TWO separate, cross-referenced arrays?
    decision: "Two separate arrays, cross-referenced by control_id -- the same 'separate stages, cross-referenced by id' shape security.dpia_pia.contract.yaml's own risks[]/controls[]/residual_risk[] triple already establishes as a legitimate class."
    reasoning: >
      A control's own preventive/detective/recovery nature and its own
      evidence are properties of the CONTROL itself, not of any one
      threat it happens to mitigate (a WAF is always preventive regardless
      of which threat is being discussed). Combining the two into one
      per-mapping record would force the SAME control's description and
      evidence to be re-typed once per threat it protects -- both a real
      duplication-of-truth risk (the two copies could silently drift) and
      a failure to model the real-world case this design explicitly wants
      to support: ONE shared control (e.g. a WAF) legitimately mitigating
      SEVERAL different threats (many-to-many), and conversely one threat
      legitimately needing SEVERAL different controls (defense in depth,
      e.g. one preventive + one detective control for the same threat).
      Neither direction is restricted to exactly one.
  - question: >
      Should `evidence` be the same flat free-text string every sibling
      F20 threat's own `test_evidence` field already uses, for consistency
      with the rest of the family, or a structured object?
    decision: "A structured {description, verified_by, verified_date} object -- a deliberate departure from the family-wide free-text convention."
    reasoning: >
      Atlas's own benefit line for THIS method specifically, and ONLY this
      method among all ten F20 rows, is "控制可稽核、可測" (auditable AND
      testable) -- a stronger, more specific claim than any sibling's own
      benefit line makes about its own test_evidence field. A bare
      description string does not make an audit trail concretely
      checkable (WHO verified it, WHEN); the structured fields do, at the
      cost of a real, disclosed asymmetry with the rest of the family (see
      `OQ-SCM-3`). This is the SAME class of "real practice, not Atlas
      literal text" grounding security.pasta.contract.yaml's own per-stage
      field detail and security.dpia_pia.contract.yaml's own two GDPR-
      grounded invariants already establish as session precedent -- Atlas
      names the BENEFIT (auditable, testable), not the exact field shape
      that satisfies it; this contract chose the shape.
  - question: >
      Should the gate's own cross-record check REQUIRE the real
      source_record to be supplied every time (refusing to evaluate at all
      without it), or degrade gracefully to a weaker, self-contained check?
    decision: "Degrade gracefully -- source_record is an OPTIONAL gate keyword; when absent, a real (weaker) self-contained partition check runs instead of the gate refusing to run."
    reasoning: >
      A gate signature of `(record, validator, timestamp)` alone, with no
      extra parameter, is the uniform convention EVERY prior F20 (and
      every other) gate function in this codebase already follows
      (grep-confirmed, zero exceptions) -- a caller invoking this gate
      through any generic, method-agnostic pipeline built against that
      convention would have no way to also supply a second record.
      Refusing to evaluate at all in that case would make this method's
      own gate less available than every sibling's, for a caller who has
      no way to know a second argument even exists. The self-contained
      fallback is not merely "return PASS unconditionally" -- it is a
      REAL, independently-useful invariant (index-partition completeness),
      strengthened by storing `source_threat_count` specifically so it
      cannot be defeated by deleting the last unmapped entry (a real gap
      this contract's own author found and closed while writing the
      check, not merely asserted safe). The weaker mode's own remaining
      limit (a sufficiently determined single-shot forgery that edits
      `source_threat_count` AND the index sets consistently together would
      still pass) is disclosed honestly in `OQ-SCM-1`, not hidden -- the
      same "catches inconsistent tampering, not omniscient forgery" threat
      model every sibling gate in this family already assumes.

open_questions:
  - id: "OQ-SCM-1"
    question: >
      The gate's own self-contained fallback mode (no source_record
      supplied) catches a hand-tamperer who edits control_mappings[] or
      source_threats_with_no_control_mapping WITHOUT also consistently
      updating source_threat_count, but cannot catch one who edits ALL
      THREE fields together to tell a consistent false story (e.g.
      shrinking source_threat_count to match a shrunk, falsely-complete
      coverage claim). Should a future revision add a signed/hashed
      binding between this record and its own source_record's real content
      (e.g. a content hash of the source record's threats[] array) to
      close this residual gap?
    owner: "operator, or whoever next revises this contract's own gate design"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap; the SAME class every sibling gate's own 'does not trust stored values, but assumes single-field not omniscient tampering' threat model already carries"
  - id: "OQ-SCM-2"
    question: >
      source_record_type is a closed two-value enum (stride/linddun) today.
      If a future F20 member (one of the four built concurrently this
      session -- Zero Trust Review, Secrets Threat Review, Supply Chain
      Threat Model, Abuse Case -- or a future revision of Attack
      Tree/PASTA/DPIA-PIA) is later found to ALSO expose a flat,
      index-addressable threats[]-equivalent shape, should
      source_record_type be extended to include it?
    owner: "operator, or whoever next surveys those four concurrently-built siblings' own final shapes against this record's own consumption design"
    blocks: "nothing in this file's own validity -- this contract deliberately did NOT read those four siblings' own in-progress files to avoid depending on file-write ordering between concurrently-running agents, the same concurrent-build caution method.schema.yaml's own compilation_decisions already documents for cognitive_primitives"
  - id: "OQ-SCM-3"
    question: >
      This record's own evidence field is a structured object, a real
      asymmetry with every sibling F20 threat's own flat test_evidence
      string. Should a future revision retrofit the SAME structured shape
      onto STRIDE/LINDDUN/Attack Tree/PASTA/DPIA-PIA's own per-threat
      test_evidence fields, for family-wide consistency?
    owner: "operator, or whoever next revises the F20 family's own evidence-field shape as a whole"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap"
  - id: "OQ-SCM-4"
    question: >
      recommended_next names challenge.red_team as an INFERRED match for
      §13.11's own literal 'Adversarial Test' recipe step -- Atlas never
      writes the words 'Red Team' at that specific recipe line. Should a
      future revision confirm this mapping against a dedicated Atlas
      citation, or introduce a distinct 'Adversarial Test' method instead
      of reusing Red Team for this purpose?
    owner: "operator, or whoever next revises this contract's own recommended_next"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap"
  - id: "OQ-SCM-5"
    question: "id mints a machine_id method-inventory.yaml never carried, and that file's own Security Control Mapping row (line: 888) is stale by the same +3 offset every neighbouring F20 row in that file already discloses (real Atlas line is L891) -- should method-inventory.yaml be updated (has_contract:true, machine_id, corrected line)?"
    owner: "operator, or a future session with explicit write scope over method-inventory.yaml"
    blocks: "nothing in this file's own validity"

verification:

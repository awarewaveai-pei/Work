$id: "ai-lego://methods/contracts/security.security_control_mapping.contract.yaml"
title: "Security Control Mapping Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry. Fifty-third Method Atlas slice, TENTH and LAST
  member of the `security` family (F20's own "資安／隱私套件"), CLOSING F20
  10/10 -- after `security.stride` (44th), `security.linddun` (45th),
  `security.attack_tree` (46th), `security.pasta` (47th), `security.dpia_pia`
  (48th), and four further F20 members built concurrently in this same
  session (Zero Trust Review, Secrets Threat Review, Supply Chain Threat
  Model, Abuse Case -- 49th-52nd). This contract does not depend on, read,
  or reference any of those four concurrent siblings' own files or outputs.

  Atlas gives this method exactly ONE citation, its own F20 tool table row
  (L891: "Threat→Control→Evidence", usage "每個威脅對應
  preventive/detective/recovery control", benefit "控制可稽核、可測") -- the
  THINNEST of all ten F20 rows. Grep-confirmed (case-insensitive, across
  §11.x/§12.x/§13.x) NO dedicated section exists for this method, unlike
  STRIDE's own §11.44, LINDDUN's own §11.45, or DPIA/PIA's own §11.46.

  **The central design question this contract resolves, investigated before
  any field was written**: should this method be (a) a genuine DOWNSTREAM
  CONSUMER of an already-built sibling threat-model record (re-classifying
  ITS OWN existing threats' controls), or (b) a STANDALONE record with its
  own from-scratch threats[]/controls[] arrays, independent of any prior
  record? Three real, independent citations ground choice (a):

  1. Atlas's own F20 row (L891) reads "每個威脅對應" (literally: EACH THREAT
     maps to a control) -- grammatically presupposing threats that ALREADY
     EXIST elsewhere, not a method that discovers threats itself the way
     STRIDE/LINDDUN/PASTA/Attack Tree each independently do.
  2. Atlas §13.11 Security Review Recipe (L3472-3487) is a REAL, ALREADY-
     CITED-BY-A-SIBLING sequencing chain: "Asset Inventory → Data Flow
     Diagram → Trust Boundaries → STRIDE → LINDDUN → Attack Tree →
     Secret/Identity Review → Supply Chain Review → Control Mapping →
     Adversarial Test → Residual Risk → Human Security Approval." Control
     Mapping's own recipe position is IMMEDIATELY AFTER every
     threat-producing method the recipe names -- a positional citation for
     consumption, not independent discovery.
  3. `security.stride.contract.yaml`'s own `compilation_decisions` (its
     fourth entry, verified by direct read) explicitly DECLINED to build "a
     full Threat→Control→Evidence TRACEABILITY structure" inside STRIDE
     itself, naming Security Control Mapping BY NAME as "a DIFFERENT,
     dedicated method for exactly this fuller traceability concern -- ...
     the same restraint `database_data.data_quality_dimensions`'s own
     contract already applied." That same file's own `OQ-STRIDE-5`
     explicitly anticipated: "Should a future `security.security_control
     _mapping` slice add a structured `control_mapping_ref` soft link
     here, once that method exists?" -- this contract's own
     `source_record_id`/`control_mappings[]` design directly answers that
     question (see `resolved_by` below).

  Option (b) (standalone) was seriously considered and rejected: it would
  duplicate threats[] content STRIDE/LINDDUN already model, invent a SECOND
  place a "threat" can be described (contradicting the "one clear owner per
  concern" discipline this whole session already applies -- e.g.
  `security.stride.contract.yaml`'s own fourth compilation_decision refusing
  to absorb Control Mapping's future concern INTO itself, for the identical
  reason in reverse), and would silently ignore Atlas's own §13.11
  sequencing evidence, which is a real citation, not this contract's own
  invention.

  **Which siblings can be consumed -- verified by direct read, not
  assumed**: `stride-threat-model-record.schema.yaml` and
  `linddun-privacy-threat-model-record.schema.yaml` are CONFIRMED to expose
  an IDENTICAL flat `threats[]` shape (`required: [element_name, category,
  description, control, residual_risk, test_evidence]`, verbatim in both
  files -- only the `category` enum vocabulary differs, six STRIDE
  categories vs. LINDDUN's seven privacy categories). `attack-tree-record
  .schema.yaml` (a recursive AND/OR tree -- a "threat" there is a `leaf_node`
  reached only by walking the tree, no flat list) and
  `pasta-threat-model-record.schema.yaml` (a single fixed-length
  `prefixItems` pipeline with exactly ONE terminal `risk` stage carrying
  control/residual_risk/test_evidence for the WHOLE review, not per-threat)
  are CONFIRMED, by direct read of both schemas, structurally incompatible
  with this shape. `source_record_type` is therefore a closed two-value
  enum (`stride`/`linddun`), not an open string or a five-way enum padded
  out to match F20's full threat-review roster -- a disclosed, evidence-
  based scope limit (see `open_questions`), not an oversight.

  **Structurally NEW among F20 members, and among every ai_lego module built
  this session** (confirmed by grep across every `ai_lego/modules/*/*.py`
  gate function signature -- zero prior hits of an extra parameter beyond
  `(record, validator, timestamp)`): every prior F20 typed object is
  SELF-CONTAINED -- every field its own gate needs lives inside its own
  record. This is the FIRST method whose own core invariant is a REFERENCE
  to a DIFFERENT record's raw content. Two real invariants, both two-layer:

  1. WITHIN-RECORD referential integrity -- every `control_mappings[]`
     entry's own `control_id` must name a real `controls[].control_id` (the
     same class STRIDE's own `threats[].element_name` ->
     `data_flow_elements[].name` check already establishes).
  2. CROSS-RECORD referential integrity (the genuinely new class) -- every
     `control_mappings[]` entry's own `source_threat_index` must name a
     REAL entry in the EXTERNAL source record's own `threats[]`, and its
     own denormalized `source_threat_element_name`/`source_threat_category`
     must MATCH what is actually stored there. The BUILDER always performs
     this fully (it requires the real, raw external `source_record` as an
     argument -- there is no other way to construct this record at all).
     The GATE performs it fully too when the SAME raw external record is
     passed to its own OPTIONAL `source_record` keyword (proven by
     `run_security_control_mapping_slice.py`'s own hand-tamper test); when
     it is not supplied, the gate still re-derives a real, weaker, fully
     self-contained invariant instead of skipping silently: that
     `control_mappings[]`'s own covered `source_threat_index` values and
     `source_threats_with_no_control_mapping`'s own indices together cover
     EXACTLY `0..source_threat_count-1` with no overlap and no gap.
     `source_threat_count` (a new, third field beyond what a first pass at
     this design considered) exists specifically to close a real hole this
     contract's own author found while writing the fallback check: without
     an independently-stored total, deleting the LAST entry from
     `source_threats_with_no_control_mapping` could leave the REMAINING
     indices looking accidentally contiguous from `0` -- a real,
     self-caught tamper class the self-contained mode would otherwise miss,
     disclosed here rather than silently shipped.

  `source_threats_with_no_control_mapping` is GENUINE, RE-DERIVED evidence
  (never caller-supplied) -- the source record's own `threats[]` indices
  with zero `control_mappings[]` entries referencing them, the exact same
  "surfaced as information, not enforced" discipline
  `stride-threat-model-record.schema.yaml`'s own
  `elements_with_no_recorded_threats` already establishes, applied here to
  CONTROL coverage instead of THREAT coverage -- directly satisfying
  Atlas's own "控制可稽核、可測" (auditable and testable) benefit line as a
  measurable completeness signal, not merely a design slogan.

  **Evidence is a STRUCTURED record, not the free-text `test_evidence`
  string every sibling F20 threat entry carries** -- `{description,
  verified_by, verified_date}`, all required non-empty strings. This is a
  disclosed, deliberate departure from every sibling's own free-text
  evidence field: Atlas's own benefit line for THIS method specifically is
  "控制可稽核、可測" (auditable AND testable), which a bare description does
  not make concretely checkable (who verified it, when). See
  `compilation_decisions` for the full reasoning.

  A STRUCTURAL record (`provenance_required` + one integrity gate), NOT
  `genuine_compute`: both invariants are set-membership/referential
  derivations, the same class STRIDE's own `elements_with_no_recorded
  _threats` and DPIA/PIA's own risk-traceability check already establish --
  not a numeric/statistical CALCULATED RESULT.

  Due-diligence search performed before writing a single field: read Atlas's
  F20 table row (L891) directly; grepped §11.x/§12.x/§13.x case-
  insensitively for "control mapping"/"threat.*control.*evidence"/
  "preventive"/"detective"/"recovery" (real neighbours found: L439 Bow-Tie's
  own "prevention/recovery" -- a DIFFERENT method, threat->event->
  consequences, not this method's own threat->control->evidence chain,
  confirmed distinct by direct read; L937 F23's own "Obligation-to-Control
  Mapping" -- a DIFFERENT family (F23 legal/compliance), obligation->
  control->owner->evidence->test, a real sibling PATTERN not a duplicate
  SUBJECT, confirmed distinct); read all five already-built F20 sibling
  contracts and typed-object schemas in full (stride, linddun, attack_tree,
  pasta, dpia_pia) to confirm the threats[] shape comparison above; read
  `methods/registry/method-inventory.yaml`'s own Security Control Mapping
  entry (L1232-1236, `line: 888`) and confirmed the same +3 line-offset bug
  every neighbouring F20 row in that file already discloses (STRIDE's own
  entry there reads `line: 879` against the real L882, the identical +3
  gap) -- real Atlas line is L891, not L888.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F20 tool table, Security Control Mapping row (L891): 'Threat→Control→Evidence', usage '每個威脅對應 preventive/detective/recovery control', benefit '控制可稽核、可測' -- this method's ONLY citation"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §13.11 Security Review Recipe (L3472-3487): 'STRIDE → LINDDUN → Attack Tree → Secret/Identity Review → Supply Chain Review → Control Mapping → Adversarial Test → Residual Risk → Human Security Approval' -- the sequencing citation grounding the CONSUMPTION design"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §22.3 Method-specific Gate table (L4142-4155): grep-confirmed no Security Control Mapping row -- forbidden_transition: [] is a verified absence, not an unchecked default"
  - "methods/contracts/security.stride.contract.yaml compilation_decisions (fourth entry) and OQ-STRIDE-5: explicitly named this method as the dedicated future home of Threat→Control→Evidence traceability and anticipated a soft control_mapping_ref link -- this contract's own source_record_id/control_mappings[] design directly resolves it"
  - "specs/cognitive/typed-objects/stride-threat-model-record.schema.yaml (L68-100) and linddun-privacy-threat-model-record.schema.yaml (L78-100): confirmed identical threats[] shape, the two consumable source_record_type values"
  - "specs/cognitive/typed-objects/attack-tree-record.schema.yaml and pasta-threat-model-record.schema.yaml: confirmed structurally incompatible with the flat threats[] shape (recursive tree; single fixed-length pipeline verdict respectively) -- grounds the closed two-value source_record_type enum"
  - "methods/registry/method-inventory.yaml Security Control Mapping entry (L1232-1236, stale line: 888 -- real Atlas line L891, the same +3 offset every neighbouring F20 row in that file already discloses)"

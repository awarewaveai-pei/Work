compilation_decisions:
  - question: >
      Atlas's own notation names 6 element kinds (Domain Event, Command,
      Actor, Policy, External System, Aggregate/Read Model -- the last
      bundled as one arrow target). Should Aggregate and Read Model be
      one element type or two?
    decision: "Two separate element types (aggregate, read_model), not one bundled type."
    reasoning: >
      Atlas's own arrow notation bundles them with a slash
      ("Aggregate／Read Model") purely as a compact NOTATION for 'a
      Domain Event leads to one of these two kinds of downstream effect',
      not as a claim that they are the same concept -- standard Event
      Storming practice (corroborated by the method's own well-
      established real-world vocabulary, the same class of external-
      practice grounding `architecture.adr.contract.yaml`'s own `status`
      field decision already used) treats Aggregates (the write-side
      object handling commands and emitting events) and Read Models (the
      query-side view built from events) as genuinely distinct concepts.
      Splitting them into two element types is the more accurate, not the
      more invented, choice.
  - question: >
      Should this contract enforce which SPECIFIC element-type-to-
      element-type relationships are legal (e.g. "an Actor may only
      relate to a Command, never directly to a Domain Event"), the way
      `causal-dag-analysis.schema.yaml`'s own `role` enum implicitly
      constrains causal-graph edges?
    decision: "No -- only the single orphan-domain-event invariant is enforced. Relationship TYPE-pair legality is left unconstrained."
    reasoning: >
      Atlas's own notation gives a general causal-flow READING (events
      are caused by upstream elements, and cause downstream ones) but no
      exhaustive, worked table of every legal element-type-pair
      combination -- inventing one (e.g. explicitly forbidding
      Policy-to-Aggregate edges) would be presenting a guess as a
      compiled fact, the same restraint `mcda-analysis.schema.yaml`'s own
      single-`weights[]`-field decision and `computation.monte_carlo
      .contract.yaml`'s own no-correlation-modeling decision already
      apply to their own under-specified areas. The one invariant this
      contract DOES enforce (no orphan domain events) is the single rule
      Atlas's own notation unambiguously implies for every reading of the
      arrows, not a specific pair-legality table.

open_questions:

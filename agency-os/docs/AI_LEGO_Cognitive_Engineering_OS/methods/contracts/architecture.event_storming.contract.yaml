$id: "ai-lego://methods/contracts/architecture.event_storming.contract.yaml"
title: "Event Storming Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry (mandated by the actively-running Cognitive OS
  runtime slice, same class of justification as every Tier 1 contract this
  session built). Thirteenth Method Atlas slice, second from the
  `architecture` family (F18's own "Software Architecture Pack") -- a
  second member tool of that same 10-tool pack built (after
  `architecture.adr`), still not the whole pack's chain, same scoping
  discipline the twelfth slice's own contract already applied.

  Atlas §11.36 (L2042-2064) gives this method a compact but genuinely
  structural notation -- not a bare concept list the way its neighboring
  §11.35 (DDD) section is (six named concepts, zero worked pipeline or
  element-relationship shape, disclosed below as the reason DDD was NOT
  chosen for this slice instead):

  ```text
  Domain Event
  ← Command
  ← Actor
  ← Policy
  ← External System
  → Aggregate / Read Model
  ```

  Read as a real causal-flow legend (standard Event Storming vocabulary,
  corroborated by the fact that every one of these six element kinds is a
  well-established, independently-documented notation in the wider
  software industry, not an Atlas invention): a Domain Event is caused by
  (`←`) a Command, which is in turn issued by an Actor, triggered by a
  Policy's reactive rule, or triggered by an External System; a Domain
  Event leads to (`→`) an Aggregate handling it or a Read Model being
  updated. This is genuinely richer grounding than a bare concept list --
  it directly implies a real structural invariant this contract enforces:
  every Domain Event must be traceable to at least one causing element (no
  orphan events), the same "raise before construction on a real, Atlas-
  implied structural rule" discipline `causal.dag`'s own acyclicity check
  already established for a different notation.


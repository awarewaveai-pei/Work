    question: >
      Relationship type-pair legality (e.g. which element kinds may
      legally relate to which others) is unconstrained beyond the single
      orphan-domain-event invariant. Should a future revision add a full
      legal-pairs table once a worked Atlas example or an operator's
      explicit requirement is found?
    owner: "operator, or whoever next needs stricter Event Storming graph validation"
    blocks: "nothing in this file's own validity -- the orphan-event invariant is the one rule every reading of Atlas's own notation supports without further invention"

$id: "ai-lego://methods/contracts/database_data.normalization.contract.yaml"
title: "Normalization Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry. Forty-first Method Atlas slice, SEVENTH from
  the `database_data` family (F21's own "資料庫／資料套件 (DB / Data
  Pack)"), after `database_data.backup_restore_drill` (twenty-fifth),
  `database_data.data_lineage` (twenty-eighth), `database_data
  .expand_contract_migration` (thirtieth), `database_data.reconciliation`
  (twenty-ninth), `database_data.erd` (thirty-ninth), and `database_data
  .data_contract` (fortieth). Directly closes `database_data.erd`'s own
  `OQ-ERD-3` (F21's own Normalization row, L900, was named there as a
  natural consumer of an `ErdRecord`'s own entities).

  Atlas gives this method exactly ONE citation: the F21 tool table's
  Normalization row (L900: purpose "降低重複與更新異常"; usage "1NF→2NF
  →3NF/BCNF；必要時有意識 denormalize"; benefit "提高一致性"). No
  dedicated §11.x/§12.x section exists -- verified by a broad, case-
  insensitive grep for "normaliz"/"1NF"/"2NF"/"3NF"/"BCNF"/"denormal"
  across the full mother document, which returns SIX lines (676, 768,
  769, 900, 1956, 4083), NOT only L900 -- CORRECTED post-critic-review
  from a first-draft claim that the grep "returns ONLY this table row",
  which stated the grep's intended CONCLUSION as if it were the raw
  output. Each of the other five, read directly: L676/768/769/1956 are
  all "normalize" in the MCDA/TOPSIS scoring and cross-jurisdiction-
  comparison sense (normalizing a SCORE to a common scale), a
  completely different mathematical operation from relational
  normal-form theory; L4083 is "Normalize Once" inside "# 20. 零重工
  架構" (zero-rework architecture), a pipeline/idempotency concept, not
  a database schema concept. A second pass with Chinese-language terms
  ("正規"/"範式"/"函數依賴"/"更新異常"/"反正規化") hits only L369 (FAST's
  own "冗餘功能", an unrelated feature-redundancy phrase) and L900
  itself. Cross-checked the family's own §11.x/§12.x section list
  directly (ERD §11.47, Data Lineage §11.48, Data Contract §11.49,
  Expand-Contract Migration §11.50, Data Quality Dimensions §12.39,
  Backup/Restore Drill §12.40 all exist) -- Normalization has none,
  confirming the CONCLUSION (single table-row citation, no dedicated
  section) is correct even though the first draft's own grep-output
  claim was imprecise. Also checked
  `AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md`
  for the same term set (the way F21's own Schema Compatibility
  Analysis and Expand-Contract Migration rows point to EC §28 as their
  own "唯一正本") -- zero hits, nothing to cross-reference. This is the
  thinnest single-citation class this session has already established
  a precedent for (`devops_sre.rto_rpo`'s own F19 row, `architecture
  .quality_attribute_scenario`'s own table-only citation) -- disclosed
  here directly rather than discovered by a critic round, applying the
  lesson `database_data.erd`'s and `database_data.data_contract`'s own
  first drafts each had to learn the hard way (an insufficiently broad
  citation grep missing a real section, or missing a real citation
  count) -- though, per the correction above, this contract's own FIRST
  draft still overstated the grep's own raw output, a milder recurrence
  of the same underlying discipline gap (verify what a claim SAYS
  against what a re-run actually produces, not against what you expect
  it to produce).

  UNLIKE every prior structural `database_data` record, this method's
  own formula ("1NF→2NF→3NF/BCNF") names a real, well-defined,
  COMPUTABLE fact from relational database theory -- not a caller
  assertion. Given an entity's declared primary key, its non-key
  attributes, and a set of caller-supplied functional dependencies
  (X -> A, "X determines A"), the highest normal form the entity
  actually satisfies is DERIVED by the standard textbook attribute-
  closure algorithm (Armstrong's axioms' fixed-point computation),
  the same class of genuine, re-derivable compute this session's
  `database_data.reconciliation` and `devops_sre.capacity_model`
  already established (`quality.genuine_compute: true`, the shared
  `evaluate_statistical_gate` reused UNCHANGED for its seventh time
  this session). 1NF is assumed satisfied by construction (this
  record's own attribute lists are already flat/atomic -- no repeating-
  group representation exists to violate 1NF).

  `schema_ref` is an OPTIONAL format-only soft link to an already-built
  `database_data.erd` record (`ERD-` prefix), resolving `OQ-ERD-3`
  directly: F21's own Normalization row (L900) sits immediately AFTER
  the ERD row (L899) in Atlas's own table, and an ERD's own entities
  (with their own `is_primary_key` flags) are the natural real-world
  source of the `primary_key_attributes`/`non_key_attributes` this
  method requires as input. This method cannot see the referenced
  ERD record's own content (format-only, the same declared limit
  every prior soft-link field in this package already carries) --
  cross-validating this record's own declared key/attributes against
  the referenced entity's own attributes is out of scope, filed as
  `OQ-NORM-3`.

  `denormalization_decision` is an OPTIONAL structured field directly
  answering Atlas's own qualifier "必要時**有意識**denormalize" (when
  necessary, **consciously** denormalize) -- "有意識" (conscious/
  deliberate) is not satisfied by a bare enum flip; a recorded decision
  (either `keep_normalized` or `denormalize`) must always carry
  non-empty `reasoning`, whichever way it goes.

  Due-diligence search, broad from the start (applying the lesson from
  the immediately prior two slices): case-insensitive spec-root greps
  for "normaliz"/"functional_dependenc"/"candidate.key"/"superkey"/
  "1NF"/"2NF"/"3NF"/"BCNF"/"closure". Zero hits for any relational-
  normalization-specific term (`grep -i "closure"` alone returns 22
  files, but every one is a generic English word match -- "loop
  closure", "gap closure", "case closure" -- none is a functional-
  dependency or attribute-closure concept; confirmed by direct read of
  a sample). No duplicate typed object, compute module, or method
  found. `ai_lego/compute/` has no existing normalization-theory
  module; the closest structural analogue, `compute/lineage
  /traversal.py`'s own forward-reachability fixed point, is a DIFFERENT
  algorithm (graph reachability, not attribute closure) solving a
  different problem, confirmed distinct by direct read -- its
  determinism/order-independence DISCIPLINE (not its algorithm) is
  reused directly in this method's own `compute/normalization
  /closure.py`.

  Real invariants that make this record a genuine MODEL, not a bag of
  independently-valid parts: `primary_key_attributes` and `non_key
  _attributes` must be disjoint (an attribute cannot be both);
  every functional dependency's own `determinant`/`dependent` must
  name REAL attributes of this entity, and `dependent` must NOT be a
  member of its own `determinant` (a trivial FD, e.g. `{A,B} -> A`, is
  always vacuously true and would silently pollute the classification's
  own evidence -- refused, not silently accepted); and `achieved_normal
  _form` plus its three violation lists must be exactly what re-running
  `classify_normal_form` on the record's own raw `primary_key
  _attributes`/`non_key_attributes`/`functional_dependencies` produces
  -- a caller cannot assert a stronger normal form than the declared
  key and FDs actually support.


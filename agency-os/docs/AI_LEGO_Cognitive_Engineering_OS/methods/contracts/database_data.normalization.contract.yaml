  - "methods/registry/method-inventory.yaml Normalization entry: category 'F21 database-data', no machine_id -- this contract mints one"
  - "ai_lego/compute/normalization/closure.py -- the standard relational-algebra attribute-closure algorithm this contract's own genuine_compute gate re-derives against"
  - "ai_lego/modules/research/gates.py evaluate_statistical_gate -- reused UNCHANGED for the genuine_compute gate, the same function database_data.reconciliation/devops_sre.capacity_model/devops_sre.error_budget/database_data.data_lineage/root_cause.pareto/decision.ahp/decision.mcda already reuse"
  - "specs/cognitive/typed-objects/erd-record.schema.yaml -- reused by reference for the optional schema_ref field, resolving database_data.erd's own OQ-ERD-3"

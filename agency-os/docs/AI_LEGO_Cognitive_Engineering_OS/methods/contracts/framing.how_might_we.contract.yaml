  - "OQ-HOWMIGHTWE-2: Sec12.3's own chain names JTBD as the upstream (\"JTBD → HMW → ...\") but JTBD is unbuilt. inputs.required left empty on that basis, same reasoning framing.north_star_metric's own OQ-NORTHSTARMETRIC-2 already establishes. Revisit once JTBD is built.（owner: operator）"
  - "OQ-HOWMIGHTWE-3: the stem check accepts only the 2 literal Atlas-cited forms (「我們可以如何」/\"how might we\"). Should a future revision broaden this to a configurable stem list once real HMW authoring at scale surfaces other accepted phrasings in practice?（owner: operator）"
  - "OQ-HOWMIGHTWE-4: method-inventory.yaml's How Might We row still carries has_contract:false/contract_status:pending after this build (only its stale line number was corrected, 341->342, per this task's own scope boundary) -- same deferred-to-integration-pass pattern framing.problem_statement's own OQ-PROBLEMSTATEMENT-2 already establishes.（owner: operator, integration pass）"


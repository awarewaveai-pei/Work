id: association.attribute_listing
version: "1.0.0"
family: association

cognitive_primitives: [DECOMPOSE, TRANSFORM, ASSOCIATE]
# DECOMPOSE: INFERRED from the row's own literal "拆屬性" (split subject into attributes) -- same inference
# class every sibling contract's un-cited DECOMPOSE already applies. TRANSFORM and ASSOCIATE: grounded via
# Atlas L188's own literal "SCAMPER = EXPAND + ASSOCIATE + TRANSFORM" -- this row's own best-pairing (最佳搭配
# column, SCAMPER) and its own 3-step usage text (變換=TRANSFORM the individual attribute; 重組=ASSOCIATE,
# recombining transformed pieces into a new whole) mirror 2 of SCAMPER's own 3 cited primitives. EXPAND
# deliberately EXCLUDED -- this row's own 3-step process has no divergent-generation step (that is SCAMPER's
# own broader 7-lens scope, not Attribute Listing's narrower one).

purpose:
  - decompose_an_existing_subject_into_attributes_and_individually_transform_each_one

inputs:
  required: []
  optional: []
# Atlas's own citation gives no upstream typed-object dependency -- the row places this at "產品改良" (product
# improvement of something that already exists), no named prerequisite typed object.

outputs: [AttributeListingRecord]

preconditions:
  - "subject is a non-empty string -- the ONE existing thing being improved, distinct from association.morphological_analysis's own from-scratch abstract dimensions (no single subject anchor there)"
  - "attributes has at least 1 entry; every attribute_name is unique across the array"
  - "every attribute carries a non-empty original_value and at least 1 transformed_variants entry"
  - "every transformed_variants entry's variant_text is genuinely distinct (case/whitespace-insensitive) from that attribute's own original_value and from every sibling variant of the SAME attribute -- a near-duplicate echo is not '逐項變換' (transform)"
  - "every transformed_variants entry's variant_id is unique within its own attribute (not required globally unique)"
  - "IF recombination is present: combined_from has at least 2 entries, each (attribute_name, variant_id) pair MUST resolve to an actually-existing attribute+variant in THIS record's own attributes array, and no two combined_from entries reference the identical pair"

quality:
  provenance_required: true
  evidence_labeling_required: true

forbidden_transition: []
# Atlas gives this method no forbidden_transition citation (no limitation-column text, no §22.3 row, no
# dedicated §11.x section -- grep-confirmed) -- left genuinely empty rather than inventing one, same restraint
# framing.five_w_one_h's and framing.frame_storming's own identical fields already establish.

recommended_next: []
# Atlas's own best-pairing (F04 table L415, "最佳搭配" column) is SCAMPER, unbuilt at this write time (not
# selected into this batch) -- left empty rather than asserting a hard dependency on an unbuilt sibling. See
# informs_scamper_ref below for the real forward soft-link.

rollback:
  side_effect_free: true

compilation_decisions:
  - question: "Model 'subject' as a required anchor field, though Atlas's own citation names only 'attributes'?"
    decision: "Yes -- required. Attribute Listing's own benefit column is 產品改良 (PRODUCT improvement), and the row's own use pattern starts from ONE existing thing, not abstract from-scratch dimensions (that is Morphological Analysis's own shape, a concurrent sibling) -- same un-cited-but-necessary anchor field class framing.five_w_one_h's own topic and framing.frame_storming's own phenomenon already establish."
  - question: "Should 重組 (recombination) get its own real field, or is it out of this record's scope as a downstream step?"
    decision: "In scope, but OPTIONAL and deliberately thin. Unlike 5W1H's soft-link to a genuinely SEPARATE Atlas-named method row (Problem Statement), 重組 is THIS row's own literal 3rd process step (attributes→變換→重組) -- omitting it entirely would mean the record structurally only ever captures 2 of the row's own 3 steps. But Atlas gives ZERO field-level shape for what a recombined proposal looks like (no named type, no dedicated section) -- OPTIONAL (a record legitimately stops at 'transformed but not yet recombined', same partial-completion legitimacy 5W1H's own UNKNOWN dimensions establish), with a minimal shape: combined_from (which transformed variants, cross-referenced by real id, same referential-integrity pattern framing.frame_storming's own selected_frame_ref already establishes, generalized from one reference to a list) plus one proposal_description string. No richer structure invented."
  - question: "Enforce transformed_variant distinctness as a GENUINE_COMPUTE derived field (like 5W1H's information_gaps), or as a construction/gate-time check with no derived field?"
    decision: "No derived field -- unlike 5W1H's own 'which subset is unknown' structural point (a real benefit-column requirement to SURFACE gaps as data), this method's own benefit column (產品改良) names no analogous summary Atlas asks the record to expose. Distinctness is enforced identically to framing.frame_storming's own candidate_framings distinctness check: a real invariant, re-derived from raw fields by both the builder and an independent gate, but not manufactured into an extra stored field Atlas never asked for."
  - question: "Give transformed_variants[].variant_id a fixed-format id (like a record-level prefix), or leave it caller-chosen?"
    decision: "Caller-chosen, format-checked only as non-empty and unique WITHIN its own attribute (not globally) -- recombination.combined_from's own (attribute_name, variant_id) pair is what makes a reference globally unambiguous, so global uniqueness is unnecessary. Same caller-chosen-id freedom framing.frame_storming's own candidate_framings[].id already establishes."


id: framing.non_goals
version: "1.0.0"
family: framing

cognitive_primitives: [FRAME, DECOMPOSE, VALIDATE]
# INFERRED, not cited -- Atlas gives no composition formula for this row.
# FRAME = the family's own defining act (F01 "Goal & Problem Framing"; this
# method frames a boundary by exclusion rather than inclusion); DECOMPOSE =
# breaking one project scope into discrete excluded items; VALIDATE = the
# re-review-trigger condition is itself a scheduled re-validation act. All 3
# independently confirmed real values in specs/cognitive/primitive.schema.yaml's
# CANONICAL_KERNEL enum by two different sibling contracts' own verification
# work (root_cause.kepner_tregoe.contract.yaml for DECOMPOSE/VALIDATE,
# learning.ooda.contract.yaml for FRAME).

purpose:
  - declare_project_scope_exclusions_with_reason_and_re_review_trigger_per_item

inputs:
  required: []
  optional: []
# Leaf method, same class as decision.moscow/learning.ooda -- Atlas's F01 row
# names no PascalCase input type (table-row-only citation); excluded_scope[]
# content is raw human/AI-supplied text, no upstream typed-object required.

outputs: [NonGoalsRecord]

preconditions:
  - "excluded_scope has at least 1 entry (a Non-goals record declaring zero exclusions is vacuous)"
  - "every excluded_scope[] entry carries a non-empty scope_item, a non-empty reason, AND a non-empty re_review_trigger -- Atlas's own 3-stage citation ('excluded scope→理由→重審條件'), all three mandatory per item, not merely the reason MoSCoW's WONT bucket alone requires"
  - "every excluded_scope[] id is unique within the record"
  - "when related_moscow_wont_ref is present, it is a non-empty string (same shape decision.moscow's own items[].id requires -- see compilation_decisions)"

quality:
  provenance_required: true
  evidence_labeling_required: false
  # Atlas's F01 table has no misuse/evidence column for any row (6-column
  # table: 工具/主要用途/何時使用/標準使用方式/主要效益/最佳搭配) -- same
  # reasoning decision.moscow's own contract already applies to its F16
  # table, re-derived independently here rather than blanket-copied.

forbidden_transition: []
# Grep-confirmed Non-goals/framing is ABSENT from Atlas §22.3's
# Method-specific Gate table (L4142-4155, 10 named rows: Fishbone, Persona,
# Scenario Planning, SWOT, AI Expert Lens, LLM Arithmetic, Red Team, Monte
# Carlo, MCDA, Jurisdiction Inference) -- left genuinely empty rather than
# inventing a "no automatic authority" guard this method was never cited
# for (same precedent decision.moscow/root_cause.kepner_tregoe's own
# contracts already establish for their own §22.3 absence).

recommended_next: [architecture.adr]
# Atlas's own 最佳搭配 column names "WBS、ADR" -- WBS is a different,
# UNBUILT F02 sibling with no minted machine_id (explicitly out of scope
# for this task), so only the already-built architecture.adr is listed;
# inventing a machine_id for an unbuilt method would be fabricated scope.

rollback:
  side_effect_free: true

compilation_decisions:
  - question: "Duplicate of decision.moscow's WONT bucket (same excluded-scope concept)?"
    decision: "No -- verified by reading moscow.py/moscow-prioritization-record.schema.yaml directly: WONT requires only a non-empty reason (conditionally, only for bucket==WONT), no re-review field exists anywhere in that schema/module. Non-goals requires BOTH reason AND re_review_trigger, unconditionally, on every entry -- project-level flat list vs. MoSCoW's per-item classification across 4 buckets for one release scope."
  - question: "Should re_review_trigger be optional (like MoSCoW's conditional reason) or mandatory on every entry?"
    decision: "Mandatory, unconditionally -- Atlas's own citation is a 3-stage pipeline, not 2; making the review-trigger optional would erase the exact field that distinguishes this method from MoSCoW's WONT bucket."
  - question: "OQ-MOSCOW-1: should excluded_scope entries soft-reference a decision.moscow WONT item id?"
    decision: "Yes -- added related_moscow_wont_ref, OPTIONAL, format-checked as a non-empty string. NOT a strict MOSCOW- prefix check: moscow's own items[].id carries no fixed prefix (only the record-level id does, per that schema's own compilation_decisions), so the honest format check here mirrors the SAME shape moscow's own schema imposes on that value, not a fabricated stricter one. Existence of the referenced record/item is NOT verified -- same limitation runbook_execution_ref already accepts."
  - question: "Does this method need a compute/ package (derived numeric values) or an automatic-authority guard (MCDA-style)?"
    decision: "Neither -- no compute/: same as architecture.adr, a structural framing record with no arithmetic. No automatic-authority guard: Atlas §22.3's gate table (grep-confirmed) does not cite this method, unlike MCDA (L4154); inventing one anyway would be fabricated scope, not genuine two-layer discipline. Both disclosed rather than silently added for their own sake."
  - question: "Record id prefix?"
    decision: "NONGOALS- -- matches the method's own short name, same convention decision.moscow's MOSCOW- prefix already establishes (vs. kepner_tregoe's KTPS- initialism, used there because that method's own output type name is itself an initialism)."

open_questions:
  - "OQ-NONGOALS-1: cognitive_primitives [FRAME, DECOMPOSE, VALIDATE] is this file's own inference, not a cited Atlas composition formula.（owner: operator）"
  - "OQ-NONGOALS-2: related_moscow_wont_ref is format-checked only (non-empty string) -- it does NOT verify the referenced moscow record/item actually exists or is genuinely bucket==WONT (no cross-record existence check anywhere in this suite's existing soft-reference convention). Add real cross-record resolution if a consuming workflow ever needs it?（owner: operator）"
  - "OQ-NONGOALS-3: WBS (Atlas's other F01 Non-goals 最佳搭配 pairing) is unbuilt -- recommended_next lists only architecture.adr. Add WBS once that F02 sibling mints a machine_id?（owner: operator, or whoever next builds F02 WBS）"


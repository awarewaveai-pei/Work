$id: "ai-lego://methods/contracts/causal.rct.contract.yaml"
title: "RCT (Randomized Controlled Trial) Method Contract"
status: ACTIVE

description: >
  Tier 1 entry, `causal` family (F11), 2nd member after `causal.dag`
  (F11 was 1/10 built before this batch). Atlas F11 table row L621 ONLY --
  grep-confirmed no dedicated §11.x/§12.x section exists for RCT (unlike
  causal.dag's own §11.21), and the whole Atlas has exactly 2 "RCT"/
  "randomiz"/"隨機分派" hits: this row (L621) and the unrelated A/B Test row
  (L746, a different method). Atlas's own 4-step pipeline: "randomize→power
  →treatment/control→analysis". Scope boundary (task-mandated, see
  `ai_lego/modules/causal/rct.py` module docstring): this method captures
  the STRUCTURE/DESIGN of a study, it does not run an RNG or a statistical
  hypothesis test -- same restraint `association.morphological_analysis`
  applies to combinatorics and `decision.weighted_decision_matrix` applies
  to scoring. Core invariant: `treatment_group` and `control_group` must be
  present AND genuinely distinct -- a record naming an identical arm twice
  is not describing a randomized CONTROLLED trial at all.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F11 tool table, RCT row (L621): '隨機分派估計效果｜randomize→power→treatment/control→analysis｜高品質因果證據' -- the ONLY Atlas citation for this method"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md whole-file grep for RCT/randomiz/隨機分派 (this session, 2026-09-10) -- confirmed exactly 2 hits total (L621 this row, L746 A/B Test row, unrelated), no dedicated §11.x/§12.x section, no §22.3 gate-table row"
  - "methods/contracts/causal.dag.contract.yaml -- 1st F11 member, same family conventions (id grammar, two-layer invariant discipline) reused here"
  - "methods/contracts/framing.how_might_we.contract.yaml -- flat-record-from-thin-citation precedent (2-field record, one echo invariant) reused as this file's own structural template, scaled to 5 fields / 1 echo pair"
  - "methods/contracts/decision.weighted_decision_matrix.contract.yaml -- disclosure-only field precedent (`sensitivity_notes`: presence enforced, methodology not) reused for `power_analysis`/`analysis_summary`"
  - "methods/registry/method-inventory.yaml 'RCT' entry (F11) -- carried no machine_id/contract before this file"
  - "specs/cognitive/method.schema.yaml -- the schema this file's body is validated against"

decided_by: >
  No ADR governs the content. Direct transcription of Atlas L621's own
  4-step pipeline into 5 required disclosure fields (treatment/control
  split into 2 named arms), plus disclosed structurally-necessary
  preconditions -- same standard every Tier 1 contract in this directory
  applies. `id: causal.rct` mints a NEW machine_id; `family: causal` reused
  as the 2nd F11 member (after `causal.dag`).

id: causal.rct
version: "1.0.0"
family: causal

cognitive_primitives: [GROUP, ESTIMATE, CAUSE, VALIDATE]
# INFERRED, not cited (Atlas §4 gives no composition formula for this
# method, same absence class causal.dag's own inference already
# discloses). One primitive per Atlas L621's own 4 pipeline verbs,
# literally: randomize = GROUP (split units into treatment/control
# groups); power = ESTIMATE (sample-size/power justification); treatment/
# control = CAUSE (the causal comparison this design exists to identify);
# analysis = VALIDATE (checking the causal claim via the controlled
# comparison). DECIDE deliberately excluded -- this record documents a
# study design, it does not itself render a decision.

purpose:
  - estimate_a_causal_effect_via_randomized_assignment_to_treatment_and_control
# Atlas L621 verbatim sense: "隨機分派估計效果" (randomized assignment to
# estimate an effect).

inputs:
  required: []
  optional: []
  # No upstream typed-object required -- Atlas's own citation for this
  # method is a single table row with no legal-chain placement (contrast
  # causal.dag's own §14.1-cited position downstream of a
  # CauseHypothesisSet); same "no hard upstream dependency" position
  # association.morphological_analysis's/framing.how_might_we's own
  # inputs.required: [] already take for an analogous standalone method.

outputs:
  - RCTRecord
# NEW output type (see typed-objects/rct-record.schema.yaml). Atlas names
# no PascalCase output type for this method, same honesty gap every other
# Tier 1 contract in this directory discloses.

preconditions:
  - "randomization, power_analysis, treatment_group, control_group, and analysis_summary are all present, non-empty strings -- Atlas L621's own 4-stage pipeline (randomize/power/treatment-control/analysis), transcribed as 5 required disclosure fields since 'treatment/control' names 2 distinct arms"
  - "treatment_group and control_group are genuinely distinct (case/whitespace-insensitive, NFKC-normalized) -- a record naming an identical treatment and control arm is not describing a randomized CONTROLLED trial"
  # NEW, structurally necessary -- Atlas's own table row names the 4
  # pipeline stages but gives no field-level precondition text (same class
  # causal.dag's own preconditions already establish for its sibling
  # method). The distinctness precondition is this method's own name
  # asserting a structural property, the same "the method's own name IS
  # the claim" discipline causal.dag's own acyclicity precondition
  # established for a different structural guarantee.

quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class decision.weighted_decision_matrix.contract.yaml's own
  # quality block already establishes: the real risk here is an
  # incomplete/echoing study-design record, not a missing per-claim
  # evidence citation -- enforced by this method's own 2 real invariants
  # instead (both below and in preconditions).

forbidden_transition: []
# Atlas F11's RCT row is this method's ONLY citation (grep-confirmed, no
# dedicated section, no §22.3 Method-specific Gate table row). Same
# empty-and-disclosed choice causal.dag.contract.yaml's own field applies.

recommended_next: []
# No specific next machine_id cited at L621 (contrast causal.dag's own
# §14.1-cited chain into a Validation step). Same empty-and-disclosed
# choice decision.mcda.contract.yaml's own field applies.

rollback:
  side_effect_free: true

compilation_decisions:
  - question: "Should power_analysis be optional (present only when the study happened to disclose one) or required?"
    decision: "Required, non-empty. A study reporting no power/sample-size justification is a real, well-known methodological red flag worth structurally surfacing -- same 'a declared gap needs an explicit justification, not a silent omission' discipline framing.boundary_critique's own empty_justification field already establishes for a different kind of declared gap. Callers with no formal power analysis must say so explicitly (e.g. 'no formal power analysis conducted'), not omit the field."
  - question: "Should treatment_group/control_group be structured objects (arm size, allocation ratio, description) or plain strings?"
    decision: "Plain non-empty strings, echo-checked against each other -- same thin-citation flat-record precedent framing.how_might_we.contract.yaml's own pain_point/hmw_question shape already establishes (Atlas's own citation for RCT is a single table row, thinner than causal.dag's dedicated §11.21 section, and gives no field-level sub-structure for these 2 stages)."
  - question: "Does this method perform genuine statistical computation (p-values, required-sample-size formulas, effect-size arithmetic)?"
    decision: "No -- explicitly out of scope (task-mandated scope boundary, see module docstring). All 5 content fields are DISCLOSURE-ONLY (presence/distinctness enforced, methodology/correctness not), same class decision.weighted_decision_matrix.contract.yaml's own sensitivity_notes already establishes for a different method. `analysis_summary` captures REPORTED findings/approach, with provenance on the record's own top-level `provenance` field -- it is not itself computed by this record."
  - question: "Is causal.rct the same method as the Atlas §9-cited (still unbuilt) validation.experiment id?"
    decision: "No -- different family (validation vs causal) and a different machine_id. causal.rct is this task's own new F11 entry; validation.experiment (named in causal.dag.contract.yaml's own recommended_next) remains a separate, still-unbuilt id, not touched here."

open_questions:
  - id: "OQ-RCT-1"
    question: "cognitive_primitives [GROUP, ESTIMATE, CAUSE, VALIDATE] is this file's own inference (one primitive per Atlas's own 4 pipeline verbs), not a cited Atlas composition formula."
    owner: "operator, or whoever adds a dedicated Atlas §4 formula for this method, if one is ever written"
    blocks: "nothing in this file's own validity"
  - id: "OQ-RCT-2"
    question: "forbidden_transition/recommended_next are both left empty -- Atlas's F11 table row is RCT's only citation (grep-confirmed, no dedicated §11.x/§12.x section, no §22.3 gate row), unlike causal.dag's own §14.1-cited legal chain."
    owner: "operator, or a future review pass specifically checking Tier 1 contracts with no forbidden_transition/recommended_next example in Atlas"
    blocks: "nothing in this file's own validity"
  - id: "OQ-RCT-3"
    question: "treatment_group/control_group are flat strings, not structured objects (e.g. arm size, allocation ratio, blinding). Revisit if a future consumer needs to parse arm-level detail programmatically rather than read it as prose."
    owner: "operator, or whoever next needs structured arm-level fields"
    blocks: "nothing in this file's own validity"

verification:
  method: >
    Read the whole Atlas F11 table (L612-625) directly, then grepped the
    whole document case-insensitively for "RCT"/"randomiz"/"隨機分派" --
    confirmed exactly 2 hits (L621 this row, L746 A/B Test's own unrelated
    "randomize" usage), no dedicated §11.x/§12.x section, no §22.3 gate-
    table row. Grepped the whole `ai_lego` tree and this docs tree
    case-insensitively for "causal.rct"/"randomized_controlled"/"RCT"
    before writing any of this method's own files -- zero pre-existing
    implementation (a handful of unrelated 3-letter false-positive hits
    triaged and confirmed non-matching). Read causal.dag.contract.yaml,
    framing.how_might_we.contract.yaml, and
    decision.weighted_decision_matrix.contract.yaml in full before writing
    this contract, reusing their established conventions rather than
    inventing new ones. Validated against specs/cognitive/method.schema.yaml
    with jsonschema.Draft202012Validator.
  note: >
    No mother document was modified. Atlas L621's own 4-step formula is
    transcribed verbatim into `purpose`/`preconditions`. The 5-field flat
    record shape, the required (not optional) `power_analysis` field, and
    the disclosure-only (not genuine-compute) treatment of
    `analysis_summary` are Phase 3 compilation choices, explicitly flagged
    above in `compilation_decisions`, not presented as Atlas-cited.

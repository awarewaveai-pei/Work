$id: "ai-lego://methods/contracts/strategy.ansoff.contract.yaml"
title: "Ansoff Matrix Method Contract"
status: ACTIVE

description: >
  Tier 1, F08 context/strategy family, 7th member (`strategy.swot`/`pestel`/`steepv`/`three_c`/`tows`/
  `porter_five_forces` already built). Atlas cites this method ONCE: F08 table row L524
  ("Ansoff｜產品×市場成長策略｜penetration/development/product/diversification｜顯示不同風險｜Risk") --
  grep-confirmed the ONLY real hit, no dedicated section exists (thinner than every other F08 member built
  so far). Core invariant: `quadrants` must name EXACTLY the 4 real Ansoff quadrants, each once, closed SET
  with completeness like `strategy.porter_five_forces`'s `FORCE_NAMES` (not `causal.dag`'s any-subset
  `VALID_ROLES`, not a positional tuple) -- see `ai_lego/modules/strategy/ansoff.py` module docstring for the
  disambiguation of Atlas's own ambiguous 4-token citation into the 4 canonical quadrant names.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F08 tool table, Ansoff row (L524)"
  - "specs/cognitive/method.schema.yaml -- the schema this file's body is validated against"

decided_by: >
  No ADR governs the content. `id: strategy.ansoff` mints a NEW machine_id; `family: strategy` reused as
  the 7th F08 member. The 4-quadrant vocabulary is NOT a direct transcription (Atlas's own row gives 4
  ambiguous fragment-tokens, not the 4 full canonical names) -- resolved via the real, independently-verified,
  standard Ansoff Growth Matrix (product x market, 2x2), see compilation_decisions.

id: strategy.ansoff
version: "1.0.0"
family: strategy

cognitive_primitives: [DECOMPOSE, ESTIMATE, CONTEXTUALIZE]
# INFERRED, not cited -- Atlas §4 gives no composition formula for this method (grep-confirmed, same absence
# class every Tier 1 contract with no §4 formula already discloses). DECOMPOSE = splitting growth strategy
# into the 4 product x market quadrants; ESTIMATE = per-quadrant risk_level judgment call; CONTEXTUALIZE
# (OBSERVED_EXTENSION tier, already catalogued via strategy.swot's identical usage) = writing the concrete
# strategy_description for the actual product/market pair in question.

purpose:
  - assess_product_market_growth_options_by_risk
# Atlas L524 verbatim sense: "產品×市場成長策略" (product x market growth strategy) / benefit "顯示不同風險"
# (shows different risk levels).

inputs:
  required: []
  optional: []
  # No upstream typed-object required -- Atlas's own L524 citation names no required input type, same
  # "no hard upstream dependency" position strategy.porter_five_forces.contract.yaml's own inputs.required: []
  # takes for an analogous standalone method.

outputs:
  - AnsoffMatrix
# NEW output type (see typed-objects/ansoff-matrix.schema.yaml). Atlas names no PascalCase output type for
# this method, same honesty gap every other Tier 1 contract in this directory discloses.

preconditions:
  - "quadrants is present and names EXACTLY the 4 real Ansoff quadrants (MARKET_PENETRATION, MARKET_DEVELOPMENT, PRODUCT_DEVELOPMENT, DIVERSIFICATION), each exactly once, in any order -- a record naming only some of the 4 has not actually mapped the full growth-strategy space the method's own name promises"
  - "every quadrants[] entry carries a non-empty strategy_description and a risk_level in {LOW, MEDIUM, HIGH} -- Atlas's own benefit line ('顯示不同風險') presumes each quadrant is actually assessed for risk, not just named"

quality:
  provenance_required: true
  evidence_labeling_required: false
  # false, NOT generalized from strategy.swot/porter_five_forces's own true -- Atlas's L524 citation for this
  # method is a single bare table row (thinner than strategy.three_c's table-row+§12.12 pair, which itself
  # already set this flag false for the identical reason: no explicit unevidenced-claim misuse warning cited).
  # Inventing an inferred generalization on top of an already-thinner citation than three_c's would overstate
  # what Atlas actually says about THIS method. See open_questions.

forbidden_transition: []
# No §14.1-style legal/illegal chain citation exists for this method (grep-confirmed). Same empty-and-disclosed
# choice strategy.porter_five_forces.contract.yaml's own field applies.

recommended_next: []
# Atlas L524's own "最佳搭配" (best combo) column names "Risk" -- no strategy.risk / risk-assessment machine_id
# exists anywhere in this corpus yet (grep-confirmed), so left empty rather than naming a non-existent id.
# See open_questions.

rollback:
  side_effect_free: true

compilation_decisions:
  - question: "Atlas's own row gives 4 comma-separated fragment-tokens (penetration/development/product/diversification), not the 4 full canonical Ansoff names -- how to disambiguate 'development' (ambiguous between market-development and product-development)?"
    decision: >
      Positional + by-elimination mapping onto the real, well-known Ansoff Growth Matrix (product x market,
      2x2 -- independently verified standard business-strategy knowledge, not obscure): token 1 "penetration"
      -> MARKET_PENETRATION (unambiguous, only one quadrant name contains "penetration"); token 4
      "diversification" -> DIVERSIFICATION (unambiguous); token 3 "product" -> PRODUCT_DEVELOPMENT (by
      elimination, the only remaining canonical quadrant name containing "product"); token 2 "development"
      -> MARKET_DEVELOPMENT (by elimination, the one quadrant left once "product" already claimed token 3).
      This positional order also happens to match the standard low-to-high risk convention (Penetration
      lowest, Market/Product Development intermediate, Diversification highest) that Atlas's own benefit
      column ("顯示不同風險") describes -- a consistency check, not proof, but it corroborates the mapping
      rather than contradicting it.
  - question: "Closed SET (porter_five_forces-style, completeness required, no position) or positional TUPLE (causal.logic_model-style, exact sequence)?"
    decision: "Closed set with completeness, no position -- same shape strategy.porter_five_forces.contract.yaml already establishes for an analogous fixed-name-vocabulary structural method; Atlas's own row lists the 4 quadrants as a flat set, no cited sequence between them."
  - question: "Should risk_level be computed from the quadrant name (e.g. always DIVERSIFICATION=HIGH)?"
    decision: "No -- 3-value enum, disclosed judgment call per instance, same task-mandated restraint strategy.porter_five_forces.contract.yaml's intensity field already establishes. No citation gives a scoring formula; the real-world convention (Diversification riskiest, Penetration safest) is directional guidance for the human/AI judgment call, not a hardcoded per-name value this method's builder assigns."
  - question: "Should there be a top-level synthesis field analogous to porter_five_forces's required overall_attractiveness?"
    decision: >
      No -- Atlas's own stated benefit for Ansoff ('顯示不同風險') is DISTRIBUTED across the 4 quadrants
      (each one shows its own risk level), not a single industry-level conclusion the way Porter's own
      '長期產業吸引力' benefit is. Inventing a top-level 'recommended_quadrant' or similar field here would
      assert a synthesis step Atlas's own bare row does not support. Same "no top-level provenance/synthesis
      field where none is cited" discipline strategy.three_c.contract.yaml's own fit_summary-is-the-only-new-
      claim reasoning applies, one level more conservative (three_c at least has ONE disclosed synthesis
      field; Ansoff's citation supports zero).

open_questions:
  - "OQ-ANSOFF-1: `recommended_next` should probably name a future risk-assessment machine_id (Atlas L524's own '最佳搭配' column names \"Risk\") once such a contract exists -- left empty, no such contract exists yet (owner: operator, or whoever builds it)."
  - "OQ-ANSOFF-2: `quality.evidence_labeling_required: false` reflects this citation's own thinness (a single bare table row, no dedicated section) rather than a positive Atlas statement that evidence labeling does not apply -- a future dedicated Atlas section for Ansoff, if one is ever added, could change this (owner: operator)."
  - "OQ-ANSOFF-3: `cognitive_primitives` is this file's own inference (Atlas §4 gives no formula for this method) (owner: operator, or whoever adds a dedicated Atlas §4 formula for this method)."
  - "OQ-ANSOFF-4: the 'development' token disambiguation (see compilation_decisions) rests on real, independently-verified Ansoff Matrix domain knowledge, not a direct Atlas citation naming the 4 full quadrant names -- if Atlas is ever extended with a dedicated Ansoff section, it should be cross-checked against this disambiguation (owner: operator)."

verification:
  method: >
    Read Atlas F08 table row (L524) directly. Grepped the whole Atlas file case-insensitively for
    "ansoff"/"penetration"/"diversification" -- confirmed exactly 1 real hit (L524), no dedicated section, no
    §4 composition formula, no §14.1 legal-chain mention, no §22.3 gate-table row. Grepped the whole `ai_lego`
    tree case-insensitively for "ansoff" before writing any of this method's own files -- zero pre-existing
    implementation (one doc-only hit: `ai_lego/modules/strategy/__init__.py`'s own "Remaining 8" list, not a
    real contract/schema/module). Read strategy.porter_five_forces.contract.yaml and
    strategy.three_c.contract.yaml in full before writing this contract, reusing their established
    conventions. Validated against specs/cognitive/method.schema.yaml with jsonschema.Draft202012Validator.

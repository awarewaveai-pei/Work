  learning.build_measure_learn, family learning, Atlas F17 L803
  ("Build–Measure–Learn | 產品探索 | build smallest test→measure→learn |
  減少先建後驗證"). No dedicated section beyond the row; not in EC §32.
  Invariants: (1) measure/learn cross-reference build/measure by id;
  (2) build.cut_scope discloses what "smallest" left out.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F17 table row (L803): 'Build–Measure–Learn | 產品探索 | build smallest test→measure→learn | 減少先建後驗證'"
  - "specs/cognitive/method.schema.yaml -- the schema this file's body is validated against"


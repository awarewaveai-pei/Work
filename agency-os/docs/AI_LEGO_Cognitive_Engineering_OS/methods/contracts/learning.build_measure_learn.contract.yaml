id: learning.build_measure_learn
version: "1.0.0"
family: learning

cognitive_primitives: [FRAME, VALIDATE, LEARN]
# INFERRED, not cited -- same inference learning.pdca's own contract makes.
# FRAME=scope the smallest test, VALIDATE=Measure, LEARN=Learn.

purpose:
  - run_one_build_measure_learn_iteration_with_stages_cross_referenced

inputs:
  required: []
  optional: []
# Leaf method, same class as decision_journal/pdca/kill_criteria/reversal_criteria:
# build/measure/learn content is raw human/AI-supplied, not a reference to a
# pre-existing typed object.

outputs: [BuildMeasureLearnCycle]

preconditions:
  - "measure.build_ref equals build.artifact_id"
  - "learn.metric_refs is non-empty and every id resolves to a measure.metrics[].id"
  - "build.cut_scope is a non-empty list of non-empty strings"

quality:
  provenance_required: true
  evidence_labeling_required: false

forbidden_transition: []
recommended_next: []

rollback:
  side_effect_free: true

compilation_decisions:
  - question: "Duplicate of F15's Prototype/MVP/PoC/A-B-Test tools?"
    decision: "No -- due-diligence grep found zero F15-grounded method built anywhere in ai_lego/ (no experiment/validation module family exists); F15 rows are single-experiment mechanics, this is F17's own build-measure-learn iteration record."
  - question: "One record per iteration, or a PDCA-style cycles[] loop?"
    decision: "One iteration per record -- L803's own formula has no trailing repeat arrow, unlike PDCA's L2994 '...->Act->...'."
  - question: "How is 'Measure references Build' enforced?"
    decision: "build.artifact_id / measure.build_ref id cross-reference, same dangling-reference discipline as fault_tree.gate_ref / ooda.observation_refs."
  - question: "How is 'Learn cites Measure's actual data' enforced?"
    decision: "learn.metric_refs must be non-empty and every id must resolve to a real measure.metrics[].id -- empty or unresolved is opinion, not data-grounded learning."
  - question: "How is the literal word 'smallest' operationalized?"
    decision: "build.cut_scope non-empty list -- the build stage must name what was deliberately left out to stay minimal."
  - question: "Does a metric carry a caller-supplied comparison operator or threshold, like kill_criteria/reversal_criteria?"
    decision: "No -- out of scope. A metric is an observed id/name/value/unit/provenance tuple; interpreting it is Learn's own job, not a structural field."

open_questions:
  - "OQ-BUILDMEASURELEARN-1: cognitive_primitives [FRAME, VALIDATE, LEARN] is this file's own inference, not a cited Atlas composition formula.（owner: operator）"
  - "OQ-BUILDMEASURELEARN-2: No chaining field to a prior iteration (e.g. previous_iteration_ref) -- real Lean Startup practice loops; this method models exactly one pass per L803's own formula, deferred not silently dropped.（owner: operator）"
  - "OQ-BUILDMEASURELEARN-3: F17 remaining after this batch (pdca/ooda/build_measure_learn): After Action Review, Post-mortem, Prediction Tracking.（owner: operator）"


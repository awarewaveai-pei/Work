  method: >
    Read Atlas F24 table (L959-973, confirmed line 963 for this row, no
    citation drift), §11.55 (L2468-2489), and §9 Representation Contract
    (L1040-1053) directly. Grepped `agency-os/docs/AI_LEGO_Cognitive_
    Engineering_OS` and `Projects/internal/cognitive-engineering-os`
    case-insensitively for "representation switching"/"representation_
    switching"/"RepresentationSwitchEvent" before writing -- zero
    pre-existing implementation or schema-title overlap (pre-existing
    `specs/cognitive/representation.schema.yaml` is the abstract View/state

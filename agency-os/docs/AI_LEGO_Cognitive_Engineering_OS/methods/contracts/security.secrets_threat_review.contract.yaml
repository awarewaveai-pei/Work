     further data point for `security.stride.contract.yaml`'s own
     `OQ-STRIDE-4` (see `compilation_decisions` and the exact text this
     contract's own due diligence found for that sibling file, which this
     contract does NOT edit).

  **A genuinely disclosed tension, not silently resolved**: Atlas §13.11's
  own recipe step is named "Secret / Identity Review" -- ONE combined step
  -- while the F20 tool table itself SPLITS this into TWO separate rows:
  "Zero Trust Review" (L887: "每次存取皆驗證"; usage

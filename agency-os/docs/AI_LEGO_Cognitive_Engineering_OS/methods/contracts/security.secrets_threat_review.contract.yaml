     尚無 IdP/secret store 實作可審 |` (L52) -- a real, named, still-open
     Phase 3 backlog item in THIS repo's own real threat-model document,
     the SAME class of due-diligence strength `security.dpia_pia`'s own
     ADR-002 "Phase 2 DPIA 待辦" precedent already establishes (stronger
     than `security.pasta`'s own disclosed fabricated-but-realistic
     example). This contract is a first real step toward machine-checking
     that named gap.
  3. **Execution Contract §33 "Secrets Contract"** (L1264-1300, grep
     -confirmed heading "# 33. Secrets Contract" at L1264) -- a real,
     dedicated, load-bearing EC section, SIBLING to (not part of) §32's own
     Security Change Contract. Grep-reconfirmed: EC §32's own closing
     sentence (L1260) names EXACTLY "STRIDE／LINDDUN／Attack Tree／PASTA",
     no fifth option -- Secrets Threat Review is NOT an EC §32 Threat
     Review alternative, the SAME "genuinely distinct trigger, not an EC

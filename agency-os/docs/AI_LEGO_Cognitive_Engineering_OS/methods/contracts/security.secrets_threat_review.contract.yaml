  are real and cited; the granular per-secret inventory used in the demo is
  disclosed as a reasonable reconstruction, NOT verbatim source content (no
  mother document or WORKLOG entry enumerates the exact secret-by-secret
  breakdown), the same honesty class `security.pasta.contract.yaml`'s own
  disclosed "fabricated-but-realistic" precedent already establishes, but
  anchored to a real, named, closed event rather than a purely hypothetical
  one.

  **Two invariants beyond stage completeness-and-order**, both grounded in
  EC §33's own real, dedicated content (an in-repository load-bearing
  contract section, not an external-practice citation -- a DIFFERENT
  grounding class from `security.pasta`/`security.dpia_pia`'s own "real
  external practice, not Atlas" disclosures, but the same "not a bare Atlas
  citation" honesty discipline):

  1. **Exposure-triggers-mandatory-response-flow, ONE-DIRECTIONAL** -- if a
     secret has ANY recorded `exposure` finding (appeared in one of EC §33's
     own ten forbidden locations), the matching `revocation` entry's own
     `response_flow.triggered` MUST be `true` and `flow_stage_reached` MUST
     NOT be `NOT_TRIGGERED` (a bare "no action" disposition over a
     confirmed exposure is refused). A secret with NO exposure finding
     carries NO requirement in EITHER direction -- EC §33's own flow fires
     "若 secret 可能曝光" (IF a secret may be exposed), but nothing in that
     section says revocation may ONLY happen because of a confirmed
     exposure; a secret may be legitimately, proactively revoked for other
     real reasons (departure, scheduled decommission). Asserting the
     reverse direction ("no exposure implies the flow must stay untouched")
     would be an undisclosed over-constraint with no real EC §33 basis --
     this contract's own first draft made exactly that mistake and its own
     real test suite caught it (see
     `docs/FIFTIETH_SLICE_SECURITY_SECRETS_THREAT_REVIEW.md`'s own honest
     -limits section): the illustrative former-employer-desktop-cleanup
     scenario (see `source_of_truth_for`) has ZERO exposure findings for
     either secret, yet both are legitimately, fully revoked on departure
     -- proof by real counter-example that the reverse direction is false.
     `response_flow.triggered` MUST always internally agree with
     `flow_stage_reached` (true if and only if not `NOT_TRIGGERED`) for
     every secret, exposed or not. Directly encodes EC §33's own mandatory
     "STOP↓REVOKE/ROTATE↓INVESTIGATE↓RESUME" sequence (L1290-1300, quoted
     verbatim in `compilation_decisions`) as a MINIMUM for exposed secrets,
     without over-constraining the unexposed case beyond what that section
     actually states.
  2. **Crypto-key secrets defer to the Key Vault as sole owner** -- every
     `inventory` secret with `secret_type: crypto_key` MUST have a non-null
     `storage.entries[].key_vault_ref` (a soft, pattern-free pointer to
     `key-vault-lifecycle.schema.yaml`'s own `key_record.key_id`); every
     OTHER `secret_type` MUST have `key_vault_ref: null`. This is the
     concrete mechanism by which this contract avoids duplicating
     `key-vault-lifecycle.schema.yaml`'s own fields: a crypto-key secret's
     rotation/destruction/physical-copies detail lives EXCLUSIVELY in the
     Vault's own `key_record`; this record only points at it.

  Both invariants are structural/referential derivations (set-membership
  and conditional-pointer checks), the SAME class STRIDE/LINDDUN/DPIA-PIA's
  own real invariants already establish -- NOT `genuine_compute` (no
  numeric/ordinal aggregation like `security.attack_tree`'s own).


      editing any sibling `security.*` file or the specs it does not own)
      carve out such a definition, enabling a real hard `$ref` here without
      embedding a full key_record?
    owner: "operator, or whoever next revises key-vault-lifecycle.schema.yaml"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap"
  - id: "OQ-SECRETSREVIEW-5"
    question: >
      The `exposure` stage's sparse (findings-only) shape trades
      completeness auditability (no way to machine-confirm all ten
      locations were actually CHECKED for a given secret, only that
      findings, if any, were recorded) for practicality (avoiding a
      10-locations-times-N-secrets enumeration). Should a future revision
      add an OPTIONAL `locations_checked` manifest per secret, without
      making it mandatory?
    owner: "operator, or whoever next revises this contract's own scope with a real audit-completeness requirement"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap"


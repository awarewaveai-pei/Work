  pass/fail gates walking a broader "secret" (API key / DB credential /
  OAuth token / webhook secret / TLS certificate / SSH key / crypto key /
  other) through Atlas's own six lifecycle checkpoints. It has NO `access`
  concept (who/what may use a key), NO `exposure` concept (the EC §33
  forbidden-locations list this contract's own `exposure` stage encodes),
  and covers only ONE of this contract's own eight `secret_type` values.
  Execution Contract §33 "Secrets Contract" (L1264-1300, grep-confirmed) was
  also read in full: a forbidden-locations list (Git/Prompt/Chat transcript
  /CLI argv/Logs/Crash dump/Artifact/Test fixture/Markdown/Screenshot), a
  preferred-mechanisms list (Secret Manager/OS Keychain/Short-lived
  Credential/Workload Identity), and a mandatory STOP→REVOKE/ROTATE
  →INVESTIGATE→RESUME flow "若 secret 可能曝光" -- real, load-bearing prose
  with NO machine-checkable predicate anywhere in the spec root before this
  contract. Neither file, nor their combination, already provides a staged,
  gated review record for the six-stage chain Atlas's own F20 table row
  names -- this contract is genuinely ADDITIVE, not a duplicate, and
  explicitly cross-references (does not re-declare) `key-vault-lifecycle
  .schema.yaml` for the one secret type it DOES cover (`crypto_key`, via
  `storage.entries[].key_vault_ref`, soft reference -- see
  `compilation_decisions` for why this is soft, not a hard `$ref`, despite a
  real working `ai_lego/security/key_vault/local_key_vault.py` builder
  existing, unlike `security.dpia_pia`'s own `jurisdiction_pack_ref` case).

  **Atlas gives this method NO dedicated §11.4x section** (grep-confirmed:
  zero `^#.*Secret` headings anywhere in the Atlas file) -- its ONLY direct
  citation is the F20 tool table's own row (L888: purpose "檢查秘密生命週期";
  usage "inventory→storage→access→rotation→exposure→revocation"; benefit
  "防 secrets 進 argv/log/git"). In ISOLATION this would be as thin as
  `security.pasta`'s own single-citation case. But THREE additional,
  independently-verified citations converge on the same concept and
  together give this method richer grounding than a bare table row, though
  distributed across locations rather than concentrated in one dedicated
  section (a genuinely different grounding SHAPE from STRIDE/LINDDUN/DPIA
  -PIA's own single-dedicated-section richness):

  1. **Atlas §13.11 Security Review Recipe** (L3472-3487, grep-verified;
     the recipe HEADING is at L3472, the specific line naming this concept
     is L3481): `Asset Inventory → Data Flow Diagram → Trust Boundaries →
     STRIDE → LINDDUN → Attack Tree → Secret / Identity Review → Supply
     Chain Review → Control Mapping → Adversarial Test → Residual Risk →
     Human Security Approval`. This places "Secret / Identity Review"
     structurally AFTER Attack Tree and BEFORE Supply Chain Review in
     Atlas's own canonical 12-step security recipe -- the SAME causal
     position (Threat-Model-step feeding an eventual ADR) STRIDE/LINDDUN
     /Attack Tree/PASTA already occupy, not DPIA/PIA's own different
     "used during ADR drafting" causal direction.
  2. **`docs/architecture/SECURITY_THREAT_MODEL.md`** (this repository's
     OWN real, applied Phase 2 Security Threat Review, Status: PROPOSED,
     2026-08-29) explicitly names "Secret / Identity Review" as recipe step
     7 in its own §1 coverage table (L38, L52) and HONESTLY DISCLOSES it as

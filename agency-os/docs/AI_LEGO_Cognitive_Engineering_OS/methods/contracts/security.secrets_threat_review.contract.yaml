id: security.secrets_threat_review
version: "1.0.0"
family: security

cognitive_primitives: [DECOMPOSE, MAP, VALIDATE]
# INFERRED, not cited -- same reasoning class every prior F20 contract
# already discloses. Staging the six-stage chain is DECOMPOSE, assigning
# per-secret content into each stage is MAP, and cross-stage referential
# completeness PLUS the exposure-response-flow PLUS the crypto-key
# -defers-to-vault checks are all VALIDATE (referential/conditional
# derivations, not a numeric COMPUTE step).

purpose:
  - walk_a_declared_secret_inventory_through_atlas_own_six_ordered_secrets_threat_review_stages_from_inventory_to_a_final_revocation_disposition_with_full_cross_stage_secret_traceability_and_the_ec_section_33_mandatory_exposure_response_flow
inputs:
  required: [SecretInventoryDescriptor, SecretsThreatReviewStageSequence]
  # SecretsThreatReviewStageSequence, not "...Set" -- same shape-accurate
  # -naming discipline security.attack_tree's AttackGoalTree,
  # security.pasta's PastaStageSequence, and security.dpia_pia's
  # DpiaPiaStageSequence already establish: Atlas's own "→" chain is a real
  # dependency order, not an unordered set.
  optional: []
outputs: [SecretsThreatReviewRecord]
preconditions:
  - "system_or_component is a non-empty string"
  - "stages is EXACTLY the six entries {inventory, storage, access, rotation, exposure, revocation}, one each, IN THAT ORDER -- Atlas's own '→' chain (L888) is a real dependency order, not an unordered set"
  - "the inventory stage has at least one well-shaped secret entry (secret_id, secret_type, owner, system_or_component), with no duplicate secret_id"
  - "the storage, access, rotation, and revocation stages EACH have EXACTLY ONE entry per secret_id declared in inventory -- no dangling (zero entries) and no duplicate (more than one) secret in any of those four stages"
  - "every storage entry with storage_mechanism == OTHER has a non-empty exception_justification; every storage entry with any other storage_mechanism has exception_justification == null"
  - "every storage entry for a secret_id whose inventory secret_type is crypto_key has a non-null key_vault_ref; every storage entry for any other secret_type has key_vault_ref == null"
  - "every exposure finding's secret_id references a secret_id that exists in inventory (forward reference only -- exposure is a sparse list of actual findings, not a full one-entry-per-secret enumeration)"
  - "response_flow.triggered always agrees with flow_stage_reached (true if and only if not NOT_TRIGGERED), for every revocation entry regardless of exposure status"
  - "for every secret_id that appears in ANY exposure finding, the matching revocation entry's response_flow.triggered is true and flow_stage_reached is not NOT_TRIGGERED (EC §33's own mandatory STOP/REVOKE-ROTATE/INVESTIGATE/RESUME flow, a MINIMUM for exposed secrets only -- a secret with NO exposure finding carries no requirement in either direction, since it may be legitimately revoked for other real reasons)"
quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class as every prior F20 structural member: stage completeness
  # -and-order, cross-stage secret traceability, the exposure-response-flow
  # rule, and the crypto-key-defers-to-vault rule are all structural
  # /referential derivations, not a statistical/numeric CALCULATED RESULT.
forbidden_transition: []
# Atlas §22.3's own gate table has no Secrets Threat Review row (checked
# directly, same negative-result disclosure class every sibling F20
# contract already applies).
recommended_next: [architecture.adr]
# Unlike security.dpia_pia's own different "used DURING ADR drafting"
# causal direction, this method occupies the SAME causal position as
# STRIDE/LINDDUN/Attack Tree/PASTA: Atlas §13.11's own recipe places
# "Secret / Identity Review" as step 7, BEFORE "Human Security Approval"
# (step 12) -- a completed review record is real input an eventual ADR
# (e.g. a future secrets-management-standardization ADR) can cite, matching
# the F18-chain-position reasoning the four true EC §32 methods already
# establish.
rollback:
  side_effect_free: true
  # The RECORD itself is side-effect-free -- same class every prior
  # structural contract's own rollback field already draws. (This contract
  # does not itself perform any REVOKE/ROTATE action; it records that a
  # response flow was triggered and how far it has reached.)

compilation_decisions:
  - question: >
      Atlas's own F20 table row (L888) is this method's ONLY direct
      citation, no dedicated §11.4x section exists (grep-confirmed: zero
      `^#.*Secret` headings in the Atlas file). Is this contract as thin as
      `security.pasta`'s own single-citation case, or does richer grounding
      exist elsewhere?
    decision: >
      Richer grounding exists, but distributed across THREE additional
      locations rather than concentrated in one dedicated section: Atlas
      §13.11's own Security Review Recipe (L3472-3487, naming "Secret /
      Identity Review" as recipe step 7), this repository's own real
      `docs/architecture/SECURITY_THREAT_MODEL.md` (honestly disclosing
      that exact recipe step as an undone Phase 3 backlog item, L38/L52),
      and Execution Contract §33's own dedicated "Secrets Contract" section
      (L1264-1300, a real load-bearing sibling section to §32, not part of
      it).
    reasoning: >
      Each of the three additional citations was independently grep
      -verified (not assumed) before being cited: §13.11's real location
      (L3472, heading; L3481, the specific line) differs from
      SECURITY_THREAT_MODEL.md's own stale L3504-3519 citation of it (a
      finding disclosed in this file's own `description`, not silently
      fixed in a file this contract has no authority to edit). This is a
      genuinely different grounding SHAPE from STRIDE/LINDDUN/DPIA-PIA's
      own single-dedicated-section richness -- disclosed as such rather
      than claimed to be the same class.
  - question: >
      Atlas §13.11's own recipe names ONE combined step, "Secret / Identity
      Review", while the F20 tool table SPLITS this into two separate rows
      (Zero Trust Review, L887; Secrets Threat Review, L888, this
      contract's own row). Should this contract attempt to also cover the
      "Identity" half (subject/workload/resource authn/authz, short-lived
      credential, audit) for completeness with §13.11's own combined
      naming?
    decision: >
      No. This contract covers ONLY the "Secret" half. The "Identity" half
      is `security.zero_trust_review`'s own scope, a sibling F20 method
      under separate, concurrent construction this same session by a
      different agent.
    reasoning: >
      The F20 table is this method's OWN primary citation (L888) and gives
      it a distinct formula and a distinct machine_id-worthy identity
      separate from Zero Trust Review's own formula (L887). Silently
      absorbing Zero Trust Review's own scope into this contract to match
      §13.11's combined naming would duplicate work a sibling agent is
      independently producing THIS SAME SESSION and would violate the "no
      duplicate workflow sources" charter principle in the opposite
      direction (two contracts claiming the same ground instead of zero
      contracts claiming it). The tension between §13.11's combined naming
      and the table's own split is disclosed, not silently resolved by
      picking one and hiding the other.
  - question: >
      Execution Contract §32 grounds `assets`/`trust_boundaries`
      /`entry_points`/`test_evidence` for all four true EC §32 Threat
      Review methods (STRIDE/LINDDUN/Attack Tree/PASTA), all of which
      identically re-declare that quadruplet. Grep-reconfirmed: EC §32's
      own closing sentence (L1260) never mentions Secrets Threat Review.
      Should this contract invent an equivalent framing quadruplet anyway,
      or omit it, following `security.dpia_pia`'s own precedent?
    decision: "Omit it entirely -- this record carries none of assets/trust_boundaries/entry_points/test_evidence."
    reasoning: >
      Same reasoning `security.dpia_pia.contract.yaml`'s own
      compilation_decisions already establish: inventing an EC §32-shaped
      framing quadruplet for a method EC §32 never names would be exactly
      the "undisclosed over-constraint" class a critic review already
      caught elsewhere in this corpus. This method's own real framing
      concept is EC §33's own forbidden-locations/preferred-mechanisms
      scope, modeled directly as the `exposure`/`storage` stages'
      respective enums -- a genuinely different kind of framing. This is a
      SECOND, confirming data point for `security.stride.contract.yaml`'s
      own `OQ-STRIDE-4` (already updated once by `security.dpia_pia`'s own
      finding) -- see `open_questions` below for the exact text this
      contract's own due diligence produced for that sibling file, which
      this contract does NOT edit (out of this task's explicit scope).
  - question: >
      Should `storage.entries[].key_vault_ref` be a HARD `$ref` into
      `key-vault-lifecycle.schema.yaml#/definitions/key_record` (technically
      feasible here, unlike `security.dpia_pia`'s own `jurisdiction_pack_ref`
      case, since a real working builder --
      `ai_lego/security/key_vault/local_key_vault.py` -- already exists and
      `schema_contracts.py` indexes every `$id`-bearing file under
      `specs/`), or a soft, pattern-free string pointer?
    decision: "Soft, pattern-free string pointer -- NOT a hard $ref."
    reasoning: >
      The reasoning here is DIFFERENT from DPIA/PIA's own "no builder
      exists yet" case (disclosed as such, not copy-pasted): a hard `$ref`
      into `key-vault-lifecycle.schema.yaml` has no atomic "key-id-only"
      sub-schema to target -- the file's own `definitions` expose only the
      FULL `key_record`/`key_destruction_record`/`vault_restore_event`
      object shapes. Hard-`$ref`-ing `key_vault_ref` against `key_record`
      would require EMBEDDING an entire key record (algorithm,
      sovereignty_mode, rotation_policy, physical_copies, status, ...)
      inside this record's own `storage` stage entry -- duplicating fields
      whose single canonical owner is the Key Vault itself, directly
      contradicting the "one clear owner per concern" principle this task's
      own charter states and the exact anti-duplication instruction this
      task was given. A bare string pointer (the `key_record.key_id`
      value, itself described by that schema only as "a stable identifier",
      with no fixed pattern to reuse) preserves single ownership while
      still giving a real, checkable cross-reference: THIS contract's own
      runtime layer confirms non-null presence for `crypto_key` secrets and
      null absence for every other `secret_type`, without asserting
      anything about the Vault's own internal record shape.
  - question: >
      Should the `exposure` stage require exactly one entry per declared
      secret (matching `storage`/`access`/`rotation`/`revocation`'s own
      full-coverage requirement), recording an explicit "reviewed, clean"
      entry for every secret against every one of EC §33's ten forbidden
      locations, or a sparse list of actual findings only?
    decision: "A sparse list of actual findings only -- no minItems, default []."
    reasoning: >
      A full-coverage shape would require ten location-checks times N
      secrets worth of explicit "not found here" entries for every review,
      which no real threat-review practice performs (EC §33's own flow is
      itself framed as conditional -- "若 secret 可能曝光", IF a secret may
      be exposed -- not an exhaustive negative-space enumeration
      requirement). This is a genuine, disclosed per-stage shape asymmetry
      (four stages full-coverage, one stage sparse-findings-only), not an
      oversight -- see `open_questions` for the disclosed tradeoff this
      leaves open.
  - question: >
      Should the EC §33 exposure-response flow (STOP→REVOKE/ROTATE
      →INVESTIGATE→RESUME) be schema-enforced (a JSON Schema conditional
      across the `exposure` and `revocation` stages) or runtime-enforced?
    decision: "Runtime-enforced only, at both the construction (builder) and gate (re-derivation) layers -- not attempted in the JSON Schema."
    reasoning: >
      The rule spans two DIFFERENT stages (`exposure.findings` and
      `revocation.entries[].response_flow`) inside a `prefixItems` tuple --
      the same "JSON Schema 2020-12 has no clean cross-sibling-array
      conditional mechanism" limitation `security.dpia_pia.contract.yaml`'s
      own escalation-rule decision already documents, and
      `security.attack_tree.contract.yaml`'s own recursive-aggregation
      decision established as precedent before that.


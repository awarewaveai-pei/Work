description: >
  decision.kano, family decision (F16), Atlas F16 table row L765 (grep-confirmed
  sole Atlas hit, bare 4-column row, no dedicated section/§22.3 gate row/§28
  routing mention): "Kano | Basic/Performance/Delighter | 功能需求分類 | 不只看
  票數". 12th concrete F16 member (of 13; WSJF built concurrently, same batch,
  not verified by this session). Distinct from decision.moscow (release-scope
  bucket, caller-asserted) and decision.impact_effort (2 continuous axes ->
  threshold-compared quadrant): classifies FEATURES by satisfaction-curve shape
  via a discrete 5x5 table lookup, GENUINE_COMPUTE like impact_effort, not
  caller-asserted like moscow (see compilation_decisions). Invariant: every
  feature's category is COMPUTED from its functional/dysfunctional response
  pair, never a constructor input; re-derived and cross-checked at the gate.


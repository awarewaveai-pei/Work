$id: "ai-lego://methods/contracts/strategy.porter_five_forces.contract.yaml"
title: "Porter Five Forces Method Contract"
status: ACTIVE

description: >
  Tier 1, F08 context/strategy family, 2nd member (`strategy.swot` is the 1st). Atlas cites this method
  TWICE: F08 table row L520 and dedicated §12.11 (L2659-2675), which names the five forces explicitly and
  gives the method's own benefit ("長期產業吸引力") and limitation (digital platforms/network effects need
  supplementary Platform Strategy). Core invariant: `forces` must name EXACTLY the 5 Atlas-cited forces,
  each once, no position implied (closed SET, not VALID_ROLES' any-subset nor STAGE_ORDER's pipeline -- see
  `ai_lego/modules/strategy/porter_five_forces.py` module docstring for the full shape investigation).

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F08 tool table, Porter Five Forces row (L520)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §12.11 波特五力分析 (L2659-2675) -- five-force list, benefit, limitation"
  - "specs/cognitive/method.schema.yaml -- the schema this file's body is validated against"

decided_by: >
  No ADR governs the content. Direct transcription of Atlas §12.11's five-force list into `forces`'s closed
  set (see typed-objects/porter-five-forces-analysis.schema.yaml). `id: strategy.porter_five_forces` mints a
  NEW machine_id; `family: strategy` reused as the 2nd F08 member.

id: strategy.porter_five_forces
version: "1.0.0"
family: strategy

cognitive_primitives: [DECOMPOSE, ESTIMATE, CONTEXTUALIZE]
# INFERRED, not cited -- Atlas §4 gives no composition formula for this method (grep-confirmed, same
# absence class every Tier 1 contract with no §4 formula already discloses). DECOMPOSE = splitting industry
# structure into the 5 forces; ESTIMATE = per-force intensity judgment call; CONTEXTUALIZE (OBSERVED_EXTENSION
# tier, already catalogued via strategy.swot's identical usage) = synthesizing to overall_attractiveness.

purpose:
  - assess_industry_structural_attractiveness
# Atlas L520 verbatim sense: "分析產業結構" (analyze industry structure) / benefit "長期產業吸引力"
# (long-term industry attractiveness).

inputs:
  required: []
  optional: []
  # No upstream typed-object required -- Atlas's own citations for this method (table row + §12.11) name no
  # required input type, same "no hard upstream dependency" position causal.regression_discontinuity.contract.yaml's
  # own inputs.required: [] takes for an analogous standalone method.

outputs:
  - PorterFiveForcesAnalysis
# NEW output type (see typed-objects/porter-five-forces-analysis.schema.yaml). Atlas names no PascalCase
# output type for this method, same honesty gap every other Tier 1 contract in this directory discloses.

preconditions:
  - "forces is present and names EXACTLY the 5 Atlas §12.11 forces (INDUSTRY_RIVALRY, NEW_ENTRANTS, SUBSTITUTES, SUPPLIER_POWER, BUYER_POWER), each exactly once, in any order -- a record naming only some of the 5 has not actually done a Porter Five Forces analysis, Atlas's own definition of the method IS the five-way split"
  - "every forces[] entry carries a non-empty assessment and an intensity in {HIGH, MEDIUM, LOW} -- Atlas's own benefit line ('長期產業吸引力') presumes each force is actually assessed, not just named"
  - "overall_attractiveness is present and non-empty -- Atlas's own stated benefit for this method IS this conclusion; a record that labels all 5 forces but never states the resulting attractiveness conclusion has not delivered the method's own defining benefit"

quality:
  provenance_required: true
  evidence_labeling_required: true
  # evidence_labeling_required is an INFERRED generalization (disclosed, not directly Atlas-cited for THIS
  # method): §12.11 gives no explicit misuse warning the way SWOT's own L1347 does. Grounded by same-family
  # analogy to strategy.swot.contract.yaml's identical flag -- an unevidenced "supplier power is high" claim
  # is the same hazard class SWOT's own evidence_labeling_required already guards against, generalized to a
  # sibling F08 evidence-backed structural-analysis method. See open_questions.

forbidden_transition: []
# No §14.1-style legal/illegal chain citation exists for this method (grep-confirmed). Same empty-and-disclosed
# choice causal.regression_discontinuity.contract.yaml's own field applies.

recommended_next: []
# Atlas L520's own "最佳搭配" (best combo) column names "Benchmark" -- no strategy.benchmark machine_id exists
# anywhere in this corpus yet (grep-confirmed), so left empty rather than naming a non-existent id. See
# open_questions.

rollback:
  side_effect_free: true

compilation_decisions:
  - question: "Closed SET (VALID_ROLES-style, any subset) or positional TUPLE (STAGE_ORDER-style, exact sequence)?"
    decision: "Neither alone -- closed set WITH completeness (all 5 required) but WITHOUT position (no cited sequence). See porter_five_forces.py module docstring for the full investigation against both precedents."
  - question: "Should intensity be a numeric score instead of HIGH/MEDIUM/LOW?"
    decision: "3-value enum, disclosed judgment call -- no citation supports a mechanical scoring formula (task-mandated restraint)."
  - question: "Should overall_attractiveness be computed from the 5 intensities?"
    decision: "No -- required but caller-supplied disclosed content, never derived by this method's runtime builder."
  - question: "Should the §12.11 digital-platform/network-effects limitation be mechanically enforced?"
    decision: "No -- documented as an open_question/scope boundary only; no citation gives a structural test for 'is this industry a digital platform'."

open_questions:
  - "OQ-PORTERFIVEFORCES-1: `recommended_next` should probably name a future `strategy.benchmark` machine_id (Atlas L520's own '最佳搭配' column names \"Benchmark\") once that method exists -- left empty, no such contract exists yet (owner: operator, or whoever builds strategy.benchmark)."
  - "OQ-PORTERFIVEFORCES-2: `quality.evidence_labeling_required: true` is an inferred same-family generalization from strategy.swot's identical flag, not a direct Atlas citation for this method specifically (owner: operator)."
  - "OQ-PORTERFIVEFORCES-3: `cognitive_primitives` is this file's own inference (Atlas §4 gives no formula for this method) (owner: operator, or whoever adds a dedicated Atlas §4 formula for this method)."
  - "OQ-PORTERFIVEFORCES-4: Atlas §12.11's own limitation (digital platforms/network effects/ecosystem often need supplementary Platform Strategy) is disclosed only, not mechanically enforced (owner: operator, or whoever builds a future strategy.platform_strategy method)."

verification:
  method: >
    Read Atlas F08 table row (L520) and §12.11 (L2659-2675) directly at the cited lines. Grepped the whole
    Atlas file case-insensitively for "Porter"/"Five Forces"/"波特" -- confirmed exactly these 2 real hits
    (plus the section title's own duplicate "Porter Five Forces" substring at L2659), no §4 composition
    formula, no §14.1 legal-chain mention, no §22.3 gate-table row. Grepped the whole `ai_lego` tree and this
    docs tree case-insensitively for "porter"/"five_forces" before writing any of this method's own files --
    zero pre-existing implementation (only doc references: architecture-inventory.yaml, ADR-008,
    MOTHER_DOC_SECTION_INDEX.md, method-inventory.yaml, Master Plan, problem-type.schema.yaml
    recommended_start strings -- none is a real contract/schema/module). Read strategy.swot.contract.yaml and
    causal.regression_discontinuity.contract.yaml in full before writing this contract, reusing their
    established conventions. Validated against specs/cognitive/method.schema.yaml with
    jsonschema.Draft202012Validator.
  note: >
    No mother document was modified. Atlas §12.11's five-force list and stated benefit/limitation are
    transcribed verbatim into `preconditions`/`quality`/`open_questions`. `cognitive_primitives`,
    `evidence_labeling_required`'s grounding, and the closed-set-without-position shape are compilation
    decisions, disclosed above, not presented as directly Atlas-cited.

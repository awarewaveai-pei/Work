$id: "ai-lego://methods/contracts/security.attack_tree.contract.yaml"
title: "Attack Tree Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry. Forty-sixth Method Atlas slice, THIRD member of
  the `security` family (F20's own "資安／隱私套件"), after
  `security.stride` (44th slice) and `security.linddun` (45th slice).

  Atlas gives this method THREE citations, verified by direct read: (1)
  the F20 tool table's Attack Tree row (L883: purpose "從攻擊目標展開
  攻擊路徑"; usage "root goal→AND/OR subgoals→cost/skill/detectability";
  benefit "找最便宜攻擊路徑"); (2) a dedicated §12.38 攻擊樹 section
  (L3046-3062: a worked Mermaid `graph TD` example -- "取得敏感資料" root
  branching into "竊取帳密"/"利用漏洞"/"取得備份", each further
  decomposing into atomic leaf techniques like Phishing/Credential
  Stuffing/RCE/Misconfigured Storage. NOTE: the Mermaid diagram itself
  carries no AND/OR edge labels -- reading the branches as OR is this
  contract's own sound inference from the surrounding prose ("從
  attacker goal 反推所有可行路徑", enumerate ALL feasible paths, which
  implies alternatives, i.e. OR), not a literal transcription of a
  labelled diagram. Benefit: "可找最便宜、最可能、最難偵測的攻擊鏈");
  (3) the §10 Security recipe
  row (L1112, the same row `security.stride`/`security.linddun` already
  cite: "Assets/DFD→STRIDE/LINDDUN→Attack Tree→Controls→Test" --
  confirming Attack Tree sits third in the same recipe, after LINDDUN).
  A FOURTH: §13.11 Security Review Recipe (L3472-3487: "... → LINDDUN →
  Attack Tree → Secret/Identity Review → ..."), independently confirming
  the same LINDDUN-then-Attack-Tree adjacency. A FIFTH, method-pairing
  confirmation (§28's own scenario-routing table, L4483: "Security
  Review | STRIDE | Attack Tree / Red Team | Checklist Only" -- Attack
  Tree named as STRIDE's own recommended SECONDARY method for security
  review scenarios, not a competing primary).

  **A sixth, load-bearing citation, the SAME one `security.stride`/
  `security.linddun` already establish**: Execution Contract §32
  Security Change Contract (L1231-1260) mandates a real minimum
  structure -- "Assets / Trust Boundaries / Entry Points / Threats /
  Controls / Residual Risk / Test Evidence" -- and explicitly NAMES
  Attack Tree (alongside STRIDE/LINDDUN/PASTA) as an acceptable method
  ("Method Atlas 可選 STRIDE／LINDDUN／Attack Tree／PASTA", L1260).

  **This is the FIRST F20 member whose own DFD-substrate step genuinely
  DIVERGES from `security.stride`/`security.linddun`'s own shared shape
  -- and this answers `OQ-LINDDUN-4` specifically (the DFD-substrate
  question), NOT `OQ-STRIDE-4` (see below for why those are two
  DIFFERENT questions this contract's own first draft conflated -- a
  critic-caught error corrected here).** Atlas's own STRIDE/LINDDUN
  formulas both explicitly name a DFD substrate ("DFD→..."); Atlas's own
  Attack Tree formula does NOT -- it names a goal TREE instead ("root
  goal→AND/OR subgoals→..."). Forcing this record into STRIDE/LINDDUN's
  own `data_flow_elements[]`/flat `threats[]` shape would have been
  WRONG, not merely different. `OQ-LINDDUN-4` (which asks specifically
  about the DFD substrate) is CLOSED by this finding, with a
  `resolved_by` note added to `security.linddun.contract.yaml`'s own
  copy in the same commit: no shared DFD-based base schema is factored
  out, because a real third instance proves the DFD step itself is NOT
  method-agnostic.

  **`OQ-STRIDE-4` is a DIFFERENT question and is NOT closed by this
  finding -- it is, if anything, STRENGTHENED, not settled.**
  `OQ-STRIDE-4`'s own literal text asks only about the three EC §32
  FRAMING fields (`assets`/`trust_boundaries`/`entry_points`), not the
  DFD/Threats step. This contract's own field design (see immediately
  below) KEEPS those same three fields identically shaped to STRIDE/
  LINDDUN's own -- meaning this is now the THIRD contract independently
  re-declaring the exact same three-field shape, the precise situation
  `OQ-STRIDE-4` originally flagged as a candidate for factoring out.
  Three-for-three identical instances is stronger evidence FOR
  eventually sharing that specific sub-shape, not evidence against it.
  `OQ-STRIDE-4` is left OPEN, its own text updated (see
  `security.stride.contract.yaml`'s own `resolved_by` note, added in
  this same commit) to record this finding rather than silently
  drifting out of sync with the sibling file that actually owns it.

  **Field design**: `assets`/`trust_boundaries`/`entry_points` (EC §32's
  own first three elements) are KEPT, identically shaped to STRIDE/
  LINDDUN's own fields -- this part of EC §32's baseline genuinely IS
  method-agnostic (every one of Atlas's four named methods reviews the
  same kind of system, just enumerates threats differently) -- this is
  exactly the `OQ-STRIDE-4` situation described above, left open. The
  "Threats" step is replaced by a genuine recursive TREE (`root`, an
  `attack_node` -- Atlas's own "root goal→AND/OR subgoals" formula
  step), where every LEAF node (an atomic, undecomposed attacker
  technique -- Atlas's own worked example's own "Phishing"/"RCE"/etc.)
  carries `cost`/`skill`/`detectability` (Atlas's own three formula
  attributes) PLUS EC §32's own remaining `control`/`residual_risk`
  /`test_evidence` triple (mapping EC §32's "Controls" element onto the
  atomic, actually-controllable attacker action -- a real control
  blocks a SPECIFIC technique like Phishing, not an abstract compound
  goal like "steal sensitive data"). `root_aggregate` is GENUINE,
  RE-DERIVED evidence (NOT caller-supplied): a real bottom-up AND/OR
  tree-aggregation compute -- AND nodes sum `cost` and take the WORST
  (max) `skill`/`detectability` across children (an attacker needs every
  step, so the hardest-skill and most-detectable step is the compound
  plan's own real bottleneck); OR nodes take the cheapest `cost` and the
  BEST (min) `skill`/`detectability` across children, each of the three
  attributes minimized INDEPENDENTLY across children -- DIRECTLY
  implementing Atlas's own benefit line, "找最便宜、最可能、最難偵測的
  攻擊鏈" ("find the cheapest, most likely, hardest-to-detect attack
  chain"), as a REAL computed comparison, not a narrative claim, BUT
  (caught by critic review, disclosed here rather than left implicit)
  the resulting `root_aggregate` at an OR node is a per-attribute BOUND
  -- the cheapest cost found anywhere under this node, the lowest skill
  needed anywhere, the lowest detectability anywhere -- NOT necessarily
  three attributes drawn from the SAME single child, and therefore NOT
  necessarily a single realisable attack path/chain (the cheapest child
  and the stealthiest child may be different children; a genuine
  cheapest-CHAIN answer requires joint/Pareto selection across the
  three attributes together, a harder problem out of scope here -- see
  `OQ-ATTACKTREE-5`). This is `genuine_compute`, the FIRST F20 member to
  be one -- STRIDE/LINDDUN's own `elements_with_no_recorded_threats` is
  a structural set-difference, not a numeric/ordinal aggregation.

  `cost` is a real, caller-supplied NUMBER (currency or hours, caller's
  own unit -- undisclosed which, see compilation_decisions) since
  Atlas's own "最便宜" (cheapest) benefit requires a genuinely
  COMPARABLE, summable quantity; `skill`/`detectability` are a three-
  value ordinal ENUM (low/medium/high), NOT an invented numeric scale --
  Atlas gives no numeric scale for either, and inventing one would be
  exactly the "undisclosed over-constraint" class a critic review
  already caught on `database_data.data_contract`'s own first draft.

  Also cross-checked: broad grep across the whole spec root for "Fault
  Tree" (Atlas's own L437 row, a DIFFERENT AND/OR-tree method for
  reliability top-event analysis, not security) found it named in the
  two `method-inventory.yaml` catalog files (an uncited, un-built
  F-category row, not a typed object) and once more in
  `docs/adr/ADR-002-personal-data-erasure-vs-event-immutability.md:42`
  (a prose mention of the neighbouring Root Cause & Failure Analysis
  family, §11.4 -- not a typed object either) -- confirming no existing
  typed object or module implements it, so there is no risk of
  confusing this contract's own Attack Tree with it. The two methods
  are real,
  textbook-distinct neighbours regardless (same AND/OR tree STRUCTURE,
  different DOMAIN and different root semantics: a top EVENT that
  already happened, not an attacker GOAL not yet achieved), not a
  duplicate. No existing typed object in `specs/security/` models an
  attack path tree.


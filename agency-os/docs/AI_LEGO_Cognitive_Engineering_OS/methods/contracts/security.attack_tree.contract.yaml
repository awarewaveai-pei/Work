decided_by: >
  No ADR governs the content. Registered in
  `methods/registry/contract-backlog.yaml` `tier_1` as a
  forty-fourth concrete entry (added in the same editing pass as this
  contract). `id: security.attack_tree` mints a new machine_id, THIRD

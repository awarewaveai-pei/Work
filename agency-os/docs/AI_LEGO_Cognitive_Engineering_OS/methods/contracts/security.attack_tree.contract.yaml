  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §10 Method Selection Engine, Security recipe row (L1112): 'Assets/DFD→STRIDE/LINDDUN→Attack Tree→Controls→Test' -- the same row security.stride/security.linddun cite"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §13.11 Security Review Recipe (L3472-3487): '... → LINDDUN → Attack Tree → ...'"

    existing typed-object schema models an ADR record's own shape (the
    many "ADR" hits found are all either this repository's OWN naming-
    convention ADRs, cited by number in unrelated contracts' `decided_by`
    sections, or the ubiquitous "No ADR governs this file" disclaimer
    every sibling schema in this directory already carries -- neither is
    a duplicate of what this contract builds). Validated against
    specs/cognitive/method.schema.yaml with jsonschema.Draft202012Validator.
  note: >
    No mother document was modified. The 11-section field list is
    directly transcribed from Atlas's own template (L2066-2094), doubly
    corroborated by F18's own compact table row. `status` is the first
    field in this session's history sourced from real operating practice
    rather than an Atlas citation -- disclosed explicitly in
    compilation_decisions, not silently presented as Atlas-given.

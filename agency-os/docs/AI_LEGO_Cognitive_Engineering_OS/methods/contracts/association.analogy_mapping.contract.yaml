id: association.analogy_mapping
version: "1.0.0"
family: association

cognitive_primitives: [ASSOCIATE, MAP, INFER]
# INFERRED, not cited. ASSOCIATE: family-level primitive, same as every other F04 sibling this batch
# (mind_map/concept_map/morphological_analysis/attribute_listing all include it). MAP: the row's own literal
# verb, twice -- 用途 column "把外部機制映射到問題" (map an external mechanism onto the problem) and 使用方式
# column's own "target mapping" -- same row-name-is-a-primitive precedent concept_map's own MAP already
# establishes for its own row name. INFER: closest kernel member to the row's own "抽象機制" (abstract the
# mechanism) step -- no ABSTRACT token exists anywhere in primitive.schema.yaml's 24-member kernel or its
# 5-member OBSERVED_EXTENSION tier (grep-confirmed), so INFER (extracting an underlying pattern from surface
# detail) is the nearest honest fit, not a literal citation.

purpose:
  - identify_a_source_domains_working_mechanism_and_transfer_its_abstracted_core_onto_a_target_problem

inputs:
  required: []
  optional: []
# Atlas's own citation gives no upstream typed-object dependency -- the row names no prerequisite typed
# object, same as attribute_listing's identical citation-shape.

outputs: [AnalogyMappingRecord]

preconditions:
  - "target_problem is a non-empty string -- the ONE problem this analogy is being applied to; un-cited-but-necessary anchor field, same class attribute_listing's own subject and framing.five_w_one_h's own topic already establish"
  - "source_domain_description is a non-empty string -- the row's own 'source domain', an external field/industry/system with a known working mechanism"
  - "abstracted_mechanism is a non-empty string -- the row's own '抽象機制', the causal/structural core stripped of source-domain-specific surface detail"
  - "target_mapping is a non-empty string -- the row's own 'target mapping', how the abstracted mechanism is proposed to apply to target_problem"
  - "source_domain_description, abstracted_mechanism, and target_mapping are pairwise genuinely distinct (case/whitespace-insensitive, NFKC-normalized) across all 3 unique pairs -- any two stages collapsing to the same text means the row's own 3-step pipeline was not actually walked (see compilation_decisions for why this is syntactic-only, not a semantic abstraction-level check)"
  - "IF supporting_evidence_refs is present: at least 1 entry, backing source_domain_description's own empirical claim (the one factual/citable claim among the 3 stages -- abstracted_mechanism and target_mapping are synthesis, not sourced fact)"

quality:
  provenance_required: true
  evidence_labeling_required: true

forbidden_transition: []
# Atlas gives this method no forbidden_transition citation (no limitation-column text, no §22.3 row, no
# dedicated §11.x section -- grep-confirmed) -- left genuinely empty rather than inventing one, same restraint
# attribute_listing's own identical field already establishes.

recommended_next: []
# Atlas's own best-pairing (F04 table L416, "最佳搭配" column) is Historical Analogy, unbuilt at this write
# time -- left empty rather than asserting a hard dependency on an unbuilt sibling. See
# informs_historical_analogy_ref below for the real forward soft-link.

rollback:
  side_effect_free: true

compilation_decisions:
  - question: "Model 'target_problem' as a required anchor field, though Atlas's own citation names only source domain/mechanism/mapping?"
    decision: "Yes -- required. A 'target mapping' with no named target problem is meaningless; same un-cited-but-necessary anchor field class attribute_listing's own subject already establishes."
  - question: "Enforce a full semantic 'is abstracted_mechanism genuinely a HIGHER level of abstraction than the other two' check, or a syntactic near-duplicate check only?"
    decision: "Syntactic pairwise distinctness only (NFKC/casefold near-duplicate text check). Genuine abstraction-LEVEL verification would require semantic reasoning no runtime gate can honestly perform -- a fully rigorous 3-way abstraction check would be flimsy security theater, not a real invariant. The cheap, honest check that IS enforceable: none of the 3 stages may collapse to the same text, which catches the most degenerate failure (copy-pasting one stage into another and skipping the abstraction work entirely) without pretending to verify something it cannot."
  - question: "Pairwise across all 3 unique stage-pairs, or just the 2 ends (source_domain_description vs target_mapping, mirroring problem_statement's 2-field echo-check)?"
    decision: "All 3 unique pairs. A source-vs-mapping-only check would let abstracted_mechanism silently echo ONE of the two ends (e.g. mechanism == source_domain_description verbatim, while target_mapping is genuinely different from source) and still pass -- that record skipped the abstraction step just as much as an end-to-end echo would. Each pair gets its own error code (MECHANISM_ECHOES_SOURCE / MAPPING_ECHOES_MECHANISM / MAPPING_ECHOES_SOURCE) for precision, same per-failure-code granularity attribute_listing's own VARIANT_ECHOES_ORIGINAL/DUPLICATE_VARIANT_TEXT split already establishes."
  - question: "Add informs_historical_analogy_ref, given Atlas's own best-pairing (F04 L416 最佳搭配) is Historical Analogy?"
    decision: "Yes -- OPTIONAL forward soft-link, same class attribute_listing's own informs_scamper_ref already establishes. Format-only checked (non-empty string); existence of the referenced record is NOT verified (Historical Analogy is unbuilt)."
  - question: "supporting_evidence_refs at record level (flat single field) or per-stage (3 separate fields)?"
    decision: "Record-level, single field, tied to source_domain_description's own claim -- the one empirical/citable fact among the 3 stages (abstracted_mechanism and target_mapping are this record's own synthesis, not sourced claims). This record has no array-of-entries shape needing per-item refs the way attribute_listing's per-attribute/per-variant convention does."


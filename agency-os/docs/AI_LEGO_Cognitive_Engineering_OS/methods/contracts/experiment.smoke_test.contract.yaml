    fault-tree/pdca typed-object mentions of "smoke test" as a generic
    testing-strategy noun, none an implementation of this method; zero
    pre-existing schema title overlap. Validated against
    specs/cognitive/method.schema.yaml with jsonschema.Draft202012Validator.
  note: >
    No mother document was modified. The threshold/decision pipeline is
    transcribed from Atlas L745. The pre-registration timestamp pair and the
    structurally-checked decision field are this file's own compiled
    structure, disclosed above.

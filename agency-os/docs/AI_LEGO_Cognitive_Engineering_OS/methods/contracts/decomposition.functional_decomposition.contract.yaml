title: "Functional Decomposition Method Contract"
status: ACTIVE

description: >
  decomposition.functional_decomposition, family decomposition (F02), 2nd member (after decomposition.issue_tree,
  built concurrently in this same batch by a separate agent -- read only for tone, not imported). Atlas F02 table
  row ONLY (L368: "Functional Decomposition｜按功能拆系統｜Top function→subfunctions→interfaces｜強化模組與責任邊界｜
  C4、DDD") -- grep-confirmed the sole hit case-insensitively across the whole Atlas file, no dedicated section,
  same thin-citation class strategy.bcg_matrix/decomposition.issue_tree already establish. Distinct from
  architecture.ddd/architecture.c4-style modules (Atlas's own "最佳搭配" pairing) -- this method decomposes a
  SYSTEM's functions top-down, DDD decomposes a DOMAIN into bounded contexts; genuinely different objects of
  analysis, not a re-skin. Core invariants: (1) every FunctionNode id anywhere in the WHOLE top_function tree is
  globally unique; (2) every interfaces[] entry's from_function_ref/to_function_ref resolves to a real function id
  actually present in that tree -- Atlas's own literal "interfaces" concept, a dangling reference is a real
  structural defect.


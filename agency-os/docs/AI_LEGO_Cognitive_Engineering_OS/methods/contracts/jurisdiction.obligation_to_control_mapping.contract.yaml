  effect ("法務與工程可對接") -- direct transcription plus low-risk,
  disclosed compilation choices.

id: jurisdiction.obligation_to_control_mapping
version: "1.0.0"
family: jurisdiction

cognitive_primitives: [DECOMPOSE, MAP, VALIDATE]
# INFERRED, not cited (Atlas §4 gives no composition formula for F23
# members). DECOMPOSE breaks a legal source into named obligations, MAP
# builds the obligation->control->owner->evidence->test linkage itself,
# VALIDATE checks every obligation is actually covered. All three
# CANONICAL_KERNEL members.

purpose:
  - map_every_legal_obligation_to_at_least_one_owned_evidenced_tested_control
# Atlas L937 verbatim sense: turn a legal obligation into an engineering
# control with an owner, evidence, and a test, so legal and engineering can
# connect on the same object.

inputs:
  required:
    - ObligationSet
  # NEW DESIGN. Atlas gives no named input typed-object for this method;
  # the starting point is the set of legal obligations under analysis, same
  # honesty-gap class every sibling F-family contract already discloses.


title: "Obligation-to-Control Mapping Method Contract"
status: ACTIVE

description: >
  F23 global jurisdiction/compliance/localization family, table-row-only
  citation (Atlas L937: "Obligation-to-Control Mapping | 法律義務轉工程控制
  | obligation->control->owner->evidence->test | 法務與工程可對接"). Turns a
  legal obligation into a traceable engineering control. Core invariant:
  every declared obligation must be covered by at least one control carrying
  a non-empty owner/evidence/test, and every control must reference a
  declared obligation (no orphan control) -- an uncovered obligation or an
  orphan control is exactly the "法務與工程無法對接" failure this method
  exists to prevent.


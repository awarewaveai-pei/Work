# NEW output type (see typed-objects/obligation-to-control-mapping-record.schema.yaml).

preconditions:
  - "at least 1 declared obligation"
  - "every declared obligation covered by at least 1 control (obligation coverage)"
  - "every control references a declared obligation (no orphan control)"
  # NEW, structurally necessary. Atlas's own pipeline is "obligation->
  # control->owner->evidence->test" -- an obligation with zero controls, or
  # a control that maps to nothing real, lets exactly the "法務與工程無法
  # 對接" failure this method exists to prevent back in through the gap.


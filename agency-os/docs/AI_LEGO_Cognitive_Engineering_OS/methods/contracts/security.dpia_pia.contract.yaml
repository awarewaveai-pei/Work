    question: "id mints a machine_id method-inventory.yaml never carried, and that file's own DPIA/PIA row (line: 883) is stale by the same +3 offset already disclosed for its neighboring F20 rows (real Atlas line is L886) -- should method-inventory.yaml be updated (has_contract:true, machine_id, corrected line)?"
    owner: "operator, or a future session with explicit write scope over method-inventory.yaml"
    blocks: "nothing in this file's own validity"
  - id: "OQ-DPIAPIA-2"
    question: >
      `jurisdiction_pack_ref` is a soft, optional, pattern-only reference
      because no `jurisdiction_pack` ai_lego builder exists yet. Should a
      future revision, once that builder is built, (a) add a hard
      `$ref` into its output schema and (b) make the field required,
      closing the gap between Atlas §11.46's own "由 Jurisdiction Pack
      決定 mandatory" framing and this record's own current
      optional-soft-reference treatment?
    owner: "operator, or whoever next builds a jurisdiction_pack ai_lego module"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap"
  - id: "OQ-DPIAPIA-3"
    question: >
      This contract's own risk-traceability invariant requires EXACTLY
      ONE residual assessment per risk_id. Real DPIA practice sometimes
      re-assesses residual risk over TIME (e.g. quarterly review finds
      a NEW residual level for the same risk) -- should a future
      revision allow multiple time-stamped residual assessments per
      risk_id (most-recent-wins), rather than exactly one?
    owner: "operator, or whoever next revises this contract's own scope with a real time-series DPIA re-assessment requirement"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap"
  - id: "OQ-DPIAPIA-4"
    question: >
      With DPIA/PIA now a FOURTH structural sub-variant among F20
      members, and the FIRST to omit the EC §32 framing triplet
      entirely -- does this settle `OQ-STRIDE-4`'s own question (is
      that triplet worth factoring into a shared F20 base schema)? Not
      fully: DPIA/PIA's own omission strengthens the case that NO
      single base schema serves ALL of F20, but the narrower question
      -- whether the FOUR true EC §32 Threat Review methods
      (STRIDE/LINDDUN/Attack Tree/PASTA) alone might still share a
      base schema for that triplet -- remains open, now with one
      additional confirmed non-member (DPIA/PIA) rather than a
      resolution either way.
    owner: "operator, or whoever next surveys the F20 family as a whole (Zero Trust Review, Secrets Threat Review, Supply Chain Threat Model, Abuse Case, Security Control Mapping remain)"
    blocks: "nothing in this file's own validity"


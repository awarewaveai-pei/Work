  - "docs/adr/ADR-002-personal-data-erasure-vs-event-immutability.md (ACCEPTED, L41, L67): real usage precedent naming Atlas §11.46 as a Recommendation-section skeleton, and a real, still-open 'Phase 2 DPIA 待辦' this contract's own CLI demo models"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §32 (L1231-1260): grep-confirmed ZERO mentions of DPIA/PIA -- the negative evidence this contract's own 'not an EC §32 method' claim rests on"
  - "specs/jurisdiction/pack.schema.yaml: the Jurisdiction Pack typed object this contract's own approval.jurisdiction_pack_ref soft-references (no ai_lego builder exists yet)"
  - "specs/cognitive/method.schema.yaml -- the schema this file's body is validated against"

decided_by: >
  No ADR governs the content. Registered in
  `methods/registry/contract-backlog.yaml` `tier_1` as a forty-sixth
  concrete entry (added in the same editing pass as this contract).
  `id: security.dpia_pia` mints a new machine_id, FIFTH member of the
  `security` family (F20). The risk/control/residual_risk per-stage
  array shapes and the escalation rule are grounded in real, external
  DPIA/GDPR practice (Art. 35 risk-register traceability, Art. 36 prior
  consultation), NOT a mother-document citation -- disclosed throughout,
  same class of decision `security.pasta.contract.yaml`'s own per-stage
  field detail already establishes as precedent.

id: security.dpia_pia
version: "1.0.0"
family: security

cognitive_primitives: [DECOMPOSE, MAP, VALIDATE]
# INFERRED, not cited. Same reasoning as security.pasta: staging the
# eight-step chain is DECOMPOSE, assigning per-stage content is MAP, the
# stage-completeness-and-order PLUS risk-traceability PLUS escalation
# checks are all VALIDATE (referential/conditional derivations, not a
# numeric COMPUTE step).

purpose:
  - walk_a_personal_data_processing_activity_through_atlas_own_eight_ordered_dpia_pia_stages_from_processing_to_a_final_approval_decision_with_full_risk_to_control_to_residual_traceability
inputs:
  required: [ProcessingActivityDescriptor, DpiaPiaStageSequence]
  # DpiaPiaStageSequence, not "...Set" -- same shape-accurate-naming
  # discipline security.attack_tree's AttackGoalTree and
  # security.pasta's PastaStageSequence already establish: Atlas's own
  # "→" chain is a real dependency order, not an unordered set.
  optional: []
outputs: [DpiaPiaImpactAssessmentRecord]
preconditions:
  - "system_or_component is a non-empty string"
  - "stages is EXACTLY the eight entries {processing, purpose, necessity_proportionality, data_subjects, risks, controls, residual_risk, approval}, one each, IN THAT ORDER -- Atlas's own '→' chain is a real dependency order, not an unordered set"
  - "each of the first four stages (processing/purpose/necessity_proportionality/data_subjects) has a non-empty summary"
  - "the risks stage has at least one well-shaped risk entry (risk_id, description, likelihood, severity, affected_rights)"
  - "the controls stage has at least one well-shaped control entry, and EVERY control's mitigates_risk_ids references a risk_id that exists in the risks stage"
  - "the residual_risk stage has EXACTLY ONE assessment per risk_id declared in the risks stage -- no dangling risk (zero assessments) and no duplicate assessment (more than one)"
  - "the approval stage has non-empty approver_role/approver_name/decision_date, decision is one of {approved, approved_with_conditions, escalated, rejected}, and if ANY residual assessment's residual_risk_level is 'high', decision is NOT bare 'approved' (GDPR Art. 36 prior-consultation grounding)"
quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class as security.pasta: stage-completeness-and-order,
  # risk-traceability, and the escalation rule are all structural
  # /referential derivations, not a statistical/numeric CALCULATED
  # RESULT.
forbidden_transition: []
# Atlas §22.3's own gate table has no DPIA/PIA row.
recommended_next: [architecture.adr]
# Kept for consistency with all four sibling F20 contracts, but the
# reasoning is genuinely different -- see description's own "Note on
# causal direction": ADR-002's real precedent shows DPIA/PIA content
# feeding an ADR's own Recommendation section DURING drafting, not a
# prior Threat-Model-step-before-ADR sequencing (security.stride's own
# F18-chain-position reasoning does not apply here, since DPIA/PIA is
# not an EC §32 / F18 Threat Model method at all).
rollback:
  side_effect_free: true
  # The RECORD itself is side-effect-free -- same class every prior
  # structural contract's own rollback field already draws.

compilation_decisions:
  - question: >
      Atlas's own F20 table row (L886) gives a COMPRESSED five-word
      summary ("processing→necessity/proportionality→risk→controls
      →approval"), silently merging Purpose into Processing and
      collapsing Risks/Data Subjects into fewer words, while the
      dedicated §11.46 section (L2278-2287) gives the fuller
      EIGHT-word chain. Which is authoritative for this contract's own
      `stages` shape?
    decision: "The dedicated §11.46 section's own eight-word chain is authoritative; the table row is treated as a compressed pointer only."
    reasoning: >
      Every prior F20 slice that had BOTH a table row and a dedicated
      section (STRIDE §11.44, LINDDUN §11.45) already treated the
      dedicated section as the richer, authoritative source, the table
      row as a summary index -- this contract applies the same
      precedence, not a new rule. The table row's own five-word
      compression is lossy (Purpose and Processing are visibly distinct
      concepts in the dedicated section's own prose, L2280 vs L2279),
      so treating it as authoritative would silently discard two of
      Atlas's own eight named steps (Purpose, Data Subjects) that the
      dedicated section explicitly names.
  - question: >
      Execution Contract §32 grounds `assets`/`trust_boundaries`/
      `entry_points` for all four prior F20 members, all of which
      identically re-declare that triplet (`OQ-STRIDE-4`'s own
      running "N-for-N identical" evidence). Grep confirms EC §32 never
      mentions DPIA/PIA. Should this contract invent an equivalent
      framing triplet anyway (for consistency with its four siblings),
      or omit it?
    decision: "Omit it entirely -- this record carries none of assets/trust_boundaries/entry_points/test_evidence."
    reasoning: >
      Inventing an EC §32-shaped framing triplet for a method EC §32
      never names would be exactly the "undisclosed over-constraint"
      class a critic review already caught on
      `database_data.data_contract`'s own first draft -- fabricating
      structure no mother document specifies, merely for
      cross-sibling cosmetic consistency. DPIA/PIA's own real framing
      concept (per Atlas §11.46's own "全球化要求" line) is Jurisdiction
      Pack applicability, not Assets/Trust Boundaries/Entry Points --
      a genuinely different kind of framing, modeled instead as the
      approval stage's own `jurisdiction_pack_ref`. This is real,
      disclosed evidence that F20 is not uniformly EC §32-shaped,
      directly updating `security.stride.contract.yaml`'s own
      `OQ-STRIDE-4` (see that file's own `resolved_by`).
  - question: >
      Should the `risks`/`controls`/`residual_risk` stages each carry
      a SINGLE object (matching PASTA's own single terminal risk
      verdict), or an ARRAY of entries per stage?
    decision: "An array of entries per stage, with cross-stage risk_id traceability enforced at the runtime layer."
    reasoning: >
      PASTA's own single-verdict scoping is a real, disclosed
      consequence of ITS OWN formula naming exactly one end-to-end
      pipeline producing one risk verdict (its compilation_decisions
      say so explicitly). DPIA/PIA's own real external practice (GDPR
      Art. 35 DPIAs, ICO/CNIL templates) universally enumerates
      MULTIPLE distinct risks per assessment, each independently
      controlled and separately residual-risk-assessed -- collapsing
      to a single risk entry would understate the real methodology
      this Atlas row grounds, the same "real practice, not Atlas"
      class already disclosed for the per-stage field detail overall.
      This also gives this record a genuinely NEW invariant class
      (referential completeness across three sibling arrays) beyond
      what any prior F20 member's own real invariant already covers.
  - question: >
      Should the high-residual-risk escalation rule be schema-enforced
      (a JSON Schema `if`/`then` conditional) or runtime-enforced?
    decision: "Runtime-enforced only, at both the construction (builder) and gate (re-derivation) layers -- not attempted in the JSON Schema."
    reasoning: >
      The rule spans two DIFFERENT stages (residual_risk's own
      `assessments[].residual_risk_level` and approval's own
      `decision`) inside a `prefixItems` tuple -- JSON Schema 2020-12
      has no clean mechanism to write a conditional across two
      different array positions without extreme fragility (a `contains`
      /`if` combination reaching across sibling prefixItems entries).
      The same reasoning `security.attack_tree.contract.yaml` already
      applied to its own recursive AND/OR aggregation (a real invariant
      the schema alone cannot express, verified instead at the runtime
      layer with a two-layer construction+gate check) applies here.
  - question: >
      Should `jurisdiction_pack_ref` be REQUIRED (forcing every DPIA
      /PIA record to name an applicable Jurisdiction Pack, matching
      Atlas §11.46's own "由 Jurisdiction Pack 決定" framing) or
      OPTIONAL?
    decision: "Optional and nullable."
    reasoning: >
      `specs/jurisdiction/pack.schema.yaml` exists but has NO ai_lego
      Python builder yet (confirmed by grep) -- making the field
      required would force every caller of this brand-new method to
      first construct a Jurisdiction Pack object this session's own
      codebase cannot yet build end-to-end, an premature hard
      dependency on unbuilt infrastructure. Optional, soft-referenced
      (pattern-checked only, no hard `$ref`) keeps this contract
      usable standalone today while leaving room for a future revision
      to tighten it once a `jurisdiction_pack` builder exists (see
      open_questions).


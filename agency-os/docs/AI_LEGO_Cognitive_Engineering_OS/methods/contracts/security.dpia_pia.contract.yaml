$id: "ai-lego://methods/contracts/security.dpia_pia.contract.yaml"
title: "DPIA/PIA Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry. Forty-eighth Method Atlas slice, FIFTH member
  of the `security` family (F20's own "資安／隱私套件"), after
  `security.stride` (44th), `security.linddun` (45th),
  `security.attack_tree` (46th), and `security.pasta` (47th).

  **Atlas gives this method its own DEDICATED section, §11.46
  (L2269-2296)** -- richer grounding than PASTA's own single-citation
  case, comparable to STRIDE's §11.44/LINDDUN's §11.45. Full name: DPIA
  = Data Protection Impact Assessment, PIA = Privacy Impact Assessment.
  Formula: `Processing → Purpose → Necessity/Proportionality → Data
  Subjects → Risks → Controls → Residual Risk → Approval` (EIGHT words,
  L2278-2287), plus a "全球化要求" line (L2289-2290): "由 Jurisdiction
  Pack 決定何時 mandatory、誰有 authority、適用哪個版本法規." The F20
  tool table's own row (L886) gives a COMPRESSED five-word summary
  ("processing→necessity/proportionality→risk→controls→approval") --
  the dedicated section is the richer, more detailed source and is
  treated as authoritative for this contract's own `stages` shape, the
  table row treated as a compressed pointer only (the same
  detail-precedence this session already applies whenever a dedicated
  section and a table row disagree in granularity).

  **DPIA/PIA is the FIRST F20 member built this session that is NOT
  one of Execution Contract §32's own four named Threat Review
  methods.** Broad, independent grep across the Execution Contract
  found ZERO mentions of "DPIA" or "PIA" anywhere in that document --
  EC §32's own closing sentence names exactly "STRIDE／LINDDUN／Attack
  Tree／PASTA" (L1260), no fifth option. DPIA/PIA's own trigger is
  privacy-specific ("processing of personal data"), genuinely distinct
  from EC §32's own trigger list (authn/authz/secrets/crypto/network
  /egress/tenant isolation/file parsing/user content/AI tools,
  L1233-1245) -- a personal-data processing activity may exist with
  none of those ten triggers present, and conversely an EC §32 change
  may involve zero personal data. Consequently this record carries
  NONE of `assets`/`trust_boundaries`/`entry_points`/`test_evidence` --
  the first F20 typed object to omit that triplet, directly updating
  `security.stride.contract.yaml`'s own `OQ-STRIDE-4` (see
  compilation_decisions and that file's own `resolved_by`).

  **Real usage precedent in THIS repository, stronger due diligence
  than PASTA's own admittedly-fabricated-but-realistic example**:
  `docs/adr/ADR-002-personal-data-erasure-vs-event-immutability.md`
  (Status: ACCEPTED, 2026-08-29) explicitly names "DPIA/PIA 使用方式
  （Method Atlas §11.46...）作為 Recommendation 段落骨架" (L41) --
  Atlas §11.46's own formula was already used, informally, as the
  structural skeleton for that ADR's own Recommendation section. That
  same ADR's own Option A analysis (L67) explicitly flags a REAL, still
  -open backlog item: "Identifiability 維度未完全歸零...建議列入 Phase
  2 DPIA 待辦而非本 ADR 阻塞項" -- unencrypted event metadata (event
  type, timestamp) surviving DEK destruction can leak the fact that a
  subject "once existed" even after crypto-shredding. This contract's
  own CLI demo models THIS real, named, still-open item -- not a
  fabricated scenario, directly closing the "no real-world usage
  instance" gap `security.pasta.contract.yaml`'s own due diligence had
  to disclose as a limit.

  **Note on causal direction**: unlike STRIDE/LINDDUN/Attack Tree/PASTA
  (whose own real-world placement is BEFORE an ADR, feeding a Threat
  Model step that an ADR then records), ADR-002's own real usage shows
  DPIA/PIA's formula being used DURING/INSIDE the ADR-writing process
  itself (as the Recommendation section's own skeleton), not as a
  separate artifact produced first and then referenced. This contract's
  own `recommended_next: [architecture.adr]` is kept for consistency
  with every sibling F20 contract, but the reasoning is disclosed as
  genuinely different, not copy-pasted: a completed DPIA/PIA record
  (especially one reaching `approved_with_conditions` or `escalated`)
  is real input an ADR's own Recommendation section can cite, matching
  ADR-002's own real precedent, rather than STRIDE/LINDDUN/Attack
  Tree/PASTA's own "Threat Model step precedes ADR in F18's chain"
  reasoning.

  **Two invariants beyond stage completeness-and-order, both real
  external DPIA/GDPR practice, NOT an Atlas citation** (same "real
  practice, not Atlas" disclosure class `security.pasta.contract.yaml`
  already establishes as precedent, itself following
  `architecture.adr.contract.yaml`'s own `status` field):

  1. **Risk traceability** -- every `risk_id` in the `risks` stage must
     be addressed by at least one `controls` entry and have EXACTLY ONE
     `residual_risk` assessment; no dangling or orphaned entries in
     either direction. Standard DPIA/GDPR Art. 35 risk-register
     practice.
  2. **High-residual-risk escalation** -- if any residual assessment's
     `residual_risk_level` is `high`, the `approval` stage's own
     `decision` may not be bare `approved`. Grounded in GDPR Article 36
     "Prior Consultation": a controller may not approve outright when
     high residual risk to data subjects remains without consulting the
     supervisory authority, attaching conditions, or declining to
     proceed.

  **A fourth structural sub-variant among F20 members**: shares PASTA's
  own "fixed-length, positionally-ordered pipeline" class (both use
  `prefixItems`), but ADDS a genuinely new invariant dimension --
  cross-stage REFERENTIAL completeness (risk_id traceable through
  control and residual assessment) and a CONDITIONAL business rule
  (escalation gated on residual severity) -- neither of which PASTA's
  own pure-ordering invariant, STRIDE/LINDDUN's own flat gap-detection,
  nor Attack Tree's own numeric aggregation already covers. This is a
  real, citable data point for `OQ-PASTA-4`'s own open question (is F20
  genuinely heterogeneous, or could a shared base schema serve it) --
  DPIA/PIA's own two extra invariants are NOT structurally reducible to
  any prior F20 member's own real invariant.

  **Jurisdiction Pack**: Atlas §11.46's own "全球化要求" line names
  Jurisdiction Pack as the mandatory-or-not decider. `specs/jurisdiction
  /pack.schema.yaml` already exists (a Wave 4 typed object, built
  independently of this session's own F20 slice work) but has NO
  ai_lego Python builder yet -- confirmed by grep, `jurisdiction` is
  referenced only in `ai_lego/core/domain/tenant.py`'s own
  `home_jurisdiction` field, nowhere else. This contract's own
  `approval` stage carries an OPTIONAL, NULLABLE `jurisdiction_pack_ref`
  (soft reference, pattern `^JPACK-`, no hard `$ref` since no builder
  exists to validate against) -- the FIRST F20 security-family method
  to touch that concept at all, disclosed as a soft, forward-looking
  reference rather than a fully wired integration (see open_questions).

  Confirmed distinct from every existing `specs/security/` typed object
  (`key-vault-lifecycle`, `log-redaction-token`, `personal-data
  -envelope`, `tenant-isolation-controls`) and from
  `specs/jurisdiction/context.schema.yaml` (that file's own "Project
  /Processing Activity" mentions are raw pre-resolution INPUT signals,
  not a staged impact-assessment record) -- re-confirmed by direct read.


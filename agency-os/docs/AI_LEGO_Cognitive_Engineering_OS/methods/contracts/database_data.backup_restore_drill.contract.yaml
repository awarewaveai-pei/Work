title: "Backup / Restore Drill Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry. Twenty-fifth Method Atlas slice, FIRST from the
  `database_data` family (F21's own "資料庫／資料套件 (DB / Data Pack)")
  -- a third pack this session opens, after F18's own "Software
  Architecture Pack" and F19's own "DevOps／SRE／可靠性套件".
  `family: database_data` transcribes method-inventory.yaml's own
  category label ("F21 database-data", hyphen replaced with underscore
  to satisfy `method.schema.yaml`'s own `^[a-z_]+$` pattern -- same class
  of punctuation-forced substitution `devops_sre`'s own naming note
  already disclosed).

  A DELIBERATE comparison, disclosed rather than assumed: this session's
  own F19 "下一步" list named `RTO/RPO` (F19 tool table row, L860) as an
  unassessed candidate. Read BOTH `RTO/RPO`'s own row (thin, one
  citation, same tier as `architecture.quality_attribute_scenario`) AND
  `Backup/Restore Drill`'s own F21 row (L905) before choosing --
  Backup/Restore Drill ALSO has a dedicated §12.40 section (L3086-3100)
  with a real 6-step numbered protocol (select a real backup -> restore
  to an isolated environment -> integrity/application checks -> time it
  -> record issues -> produce evidence), the same tier of citation
  strength `devops_sre.canary_deployment`/`devops_sre.chaos_engineering`
  already established. `RTO/RPO` has no such dedicated section. §12.40's
  own purpose line (L3090: "證明備份不是「檔案存在」，而是「可以在
  RTO/RPO 內恢復成可用系統」" -- prove a backup is not just "a file
  exists" but "restorable to a working system within RTO/RPO") directly
  NAMES RTO/RPO as the pass/fail bar this drill measures against --
  building this method first, with RTO/RPO's target numbers as its own
  INPUT fields (not re-derived), covers the stronger-grounded half of
  both concepts without inventing a second contract for the thinner one.
  A standalone `devops_sre.rto_rpo` contract (how business-impact tiers
  map to target numbers, F19's own L860 formula) remains a real,
  separately-buildable candidate this contract does not claim to close --
  see `open_questions.OQ-BACKUPDRILL-2`.

  The purpose line's own combined "RTO/RPO" bar is a real, enforceable
  invariant this contract enforces on the RTO half directly (Atlas's own
  step 4 "計時" produces the measured duration that step is FOR): a
  drill record cannot claim `status: passed` while
  `actual_recovery_duration_seconds` exceeds `rto_target_seconds`, or
  while `integrity_checks_passed` (Atlas's own step 3) is false.


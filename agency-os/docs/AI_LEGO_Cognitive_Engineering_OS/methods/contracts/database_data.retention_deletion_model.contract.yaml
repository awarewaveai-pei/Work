$id: "ai-lego://methods/contracts/database_data.retention_deletion_model.contract.yaml"
title: "Retention / Deletion Model Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry. Forty-third Method Atlas slice, NINTH and FINAL
  member of the `database_data` family (F21's own "資料庫／資料套件 (DB
  / Data Pack)"), after `database_data.backup_restore_drill`
  (twenty-fifth), `database_data.data_lineage` (twenty-eighth),
  `database_data.expand_contract_migration` (thirtieth), `database_data
  .reconciliation` (twenty-ninth), `database_data.erd` (thirty-ninth),
  `database_data.data_contract` (fortieth), `database_data
  .normalization` (forty-first), and `database_data
  .data_quality_dimensions` (forty-second). F21's own remaining table
  row, `Schema Compatibility Analysis` (L903), was investigated and
  found to be ALREADY FULLY COVERED, not a ninth build candidate -- see
  the dedicated note below.

  Atlas gives this method exactly ONE citation of its own: the F21
  tool table's Retention / Deletion Model row (L906: purpose "保存、
  刪除、legal hold"; usage "data class→purpose→retention→deletion→
  exception→proof"; benefit "降合規與暴露風險"). No dedicated §11.x/
  §12.x section exists in the Atlas mother document itself -- verified
  by a broad grep for "retention"/"保存"/"legal hold"/"data class"/
  "資料分類"/"deletion"/"刪除"/"purge"/"archiv" across the full
  document (the wider term set critic-review-confirmed to still find
  nothing beyond L906 -- the only near-miss, Atlas L2328 "支援 legal
  deletion / correction impact analysis", sits inside §11.48 Data
  Lineage's own benefits list and belongs to `database_data
  .data_lineage`, confirmed distinct).

  **Due diligence here started BROAD ACROSS ALL THREE normative
  documents from the first draft** (applying the invariant this
  session's own AGENTS.md §4 demands after the SAME "due-diligence
  survey covered only Atlas, missed a real citation in a sibling
  document" class was caught on TWO consecutive prior slices --
  `database_data.data_contract`, commit `72b47cd0d`, and `database_data
  .data_quality_dimensions`, same session -- the third occurrence
  threshold this package's own governance treats as mandatory-
  invariant-analysis territory). The broadened search found a real,
  substantial second citation: `AI_LEGO_Cognitive_Engineering_Os_Global
  _Master_Plan_v1.md` §114 "Records Retention / Legal Hold /
  eDiscovery" (L4711-4735) -- a section whose own TITLE nearly
  duplicates this method's own Atlas name. §114 elaborates Atlas's own
  bare "exception" formula step into FIVE named hold/trigger types
  (Legal Hold, Regulatory Hold, Research Hold, Contractual Hold, User
  Deletion Request) alongside the base Retention Policy, and adds a
  genuine conflict-resolution requirement Atlas's own bare table row
  never states: "衝突時 Policy Engine 決定，並產生理由" (when these
  conflict, a Policy Engine decides AND PRODUCES A REASON). This is the
  authoritative source for `holds[]` below, not an invention.

  EIGHT other Master Plan hits for "retention" were individually read
  and confirmed to be unrelated passing checklist items in different
  contexts (**CORRECTED post-critic-review**: a first-draft count of
  "seven" omitted two of them, L3139 and L4532, from the enumeration
  though the grep survey itself had already covered the full document
  -- L1063: a generic "each thing needs a Retention Policy" metadata
  field inside an unrelated Temporary-Context section; L3139: a bare
  "retention/" directory-tree entry inside an unrelated §79 file-layout
  listing; L3899-3901: a compliance-DOMAIN enumeration listing "Records
  Retention"/"Legal Hold" as domain NAMES, not an elaboration; L4308: a
  data-subject-record field list; L4532: "Retention" inside a §107
  compliance-Pack field list; L5224: a risk-approval checklist item;
  L5546/L5570: an AI-PROVIDER evaluation criterion about THAT
  provider's own data-retention practice -- a completely different
  subject). Two further Execution Contract hits beyond EC §31 were also
  read and confirmed unrelated (EC L2848: "retention-controlled" inside
  §102 Logging Contract; EC L3397: "retention" inside §127 Resource
  Ownership) -- no further Execution Contract CITATION exists beyond EC
  §31 itself (see the due-diligence note on `deletion_evidence_ref`
  below, already fully modeled and NOT re-cited as if newly found).

  This method is a STRUCTURAL POLICY record, the same
  provenance_required-plus-one-integrity-gate class as `database_data
  .erd`/`database_data.data_contract` -- NOT genuine compute. A
  deliberate design choice, not an oversight, grounded in TWO textual
  facts rather than a claim about what is technically possible
  (**CORRECTED post-critic-review**: the first draft argued a live
  eligibility check was technically UNAVOIDABLE without breaking this
  session's own "deterministic, stored-data-only" gate discipline --
  a critic review found that framing false: storing an explicit
  `evaluated_as_of` reference timestamp alongside a structured
  retention-period length WOULD keep such a check a pure, deterministic
  function of stored fields, and this very family already has exactly
  that pattern -- `database_data.expand_contract_migration`'s own gate
  compares two STORED `completed_at` timestamps against each other,
  `ai_lego/modules/database_data/expand_contract_migration.py:119`, a
  deterministic temporal computation over stored data, not wall-clock
  "now"). The REAL grounds for this scope decision: (1) Atlas's own
  formula ends in "proof" (recording that a compliant policy and its
  own evidence EXIST), not in an "eligibility" or "check" step -- the
  textual formula itself does not ask for a live computation; (2)
  Master Plan §114's own opening sentence (L4713: "資料不能只用固定
  「30 天刪除」" -- data cannot just use a fixed "30-day deletion" rule)
  actively argues AGAINST inventing a single structured duration
  grammar simple enough to drive a generic eligibility formula --
  real retention rules are commonly conditional, jurisdiction-specific,
  and hold-dependent in ways a single "retention_period_days" field
  cannot faithfully represent without first designing that entire
  structured grammar, itself a substantial, undertaken-elsewhere design
  question. This is disclosed as a real, elective scope boundary
  (`OQ-RDM-2`, corrected to name the known-viable deterministic
  alternative rather than claiming none exists), not silently narrowed
  and not a technical impossibility.

  **Confirmed NOT a duplicate of two real neighbours, each read in
  full**: (1) `specs/execution/data-deletion.schema.yaml` (EC §31 Data
  Deletion Contract -- CORRECTED post-critic-review: `L1181-1230`, not
  a first-draft `L1225-1251` that had run off the end of §31 into §32
  Security Change Contract, an error a critic review found was likely
  INHERITED from that same sibling file's own two pre-existing stale
  citations rather than independently re-derived; `DEL-` prefix) models
  the EXECUTION MECHANICS of carrying out ONE triggered deletion
  request (a 10-step Authorization→...→Deletion Evidence pipeline) --
  a genuinely different layer than this method's own POLICY (which
  data class exists, why it is kept, for how long, and what exceptions
  apply). The two are complementary, not overlapping: EC §31's own
  pipeline literally has "Retention Check" and "Legal Hold Check" as
  STEPS (L1190, L1188) that would consult a policy record shaped like
  THIS method's own output. `deletion_evidence_ref` below is a
  format-only soft link resolving that real relationship. (2) F21's
  own remaining table row, `Schema Compatibility Analysis` (L903:
  "精確步驟序列見 Execution Contract §28（唯一正本）"), redirects to
  the SAME EC §28 15-step sequence `database_data
  .expand_contract_migration` already fully modeled -- and that
  record's own `stage_id` enum ALREADY includes `compatibility_analysis`
  as the third of 15 enum values (`specs/cognitive/typed-objects
  /expand-contract-migration-record.schema.yaml:70`, within the enum
  block L67-82 -- CORRECTED post-critic-review from a first-draft
  citation pointing at that same file's own `examples:` block, L106/122,
  where the value merely appears as sample data rather than at its own
  enum definition). Building a separate `database_data
  .schema_compatibility_analysis` machine_id would duplicate an
  already-tracked stage of an already-shipped, already-critic-reviewed
  method. That said, `expand_contract_migration`'s own record stores
  only that the stage COMPLETED (`{stage_id, completed_at}`), not any
  findings the analysis itself produced (e.g. a backward/forward-
  compatibility verdict or a breaking-change list) -- this method's own
  Atlas cell (L903) carries no formula of its own to model beyond the
  EC §28 redirect, so there is no additional content this coverage
  leaves unmodeled; covered to the FULL EXTENT Atlas's own table cell
  defines, not merely nominally. F21's own TEN-row table (L899-908) is
  therefore FULLY accounted for with NINE built machine_ids (this one
  being the ninth and last) plus ONE confirmed-already-covered row
  (Schema Compatibility Analysis) -- ten rows, nine builds, not a
  discrepancy.

  Atlas's own formula grounds real structural invariants that make
  this record a genuine MODEL: `holds[]` entries use MP §114's own
  five named hold-type vocabulary (not invented); and whenever MORE
  THAN ONE hold is simultaneously `active: true`, a non-empty
  `conflict_resolution` explaining the Policy-Engine-style precedence
  decision is REQUIRED -- directly implementing MP §114's own
  "衝突時...並產生理由" requirement, not an invented cross-check.


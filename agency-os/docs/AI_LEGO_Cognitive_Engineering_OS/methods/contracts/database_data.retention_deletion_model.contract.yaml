id: database_data.retention_deletion_model
version: "1.0.0"
family: database_data

cognitive_primitives: [DECOMPOSE, VALIDATE]
# INFERRED, not cited (Atlas gives no §4-style composition formula for
# this method). Separating a data class's own policy into retention/
# deletion/exception elements is DECOMPOSE; the conflict-resolution
# requirement on simultaneous active holds IS the validation act
# itself -- the same inferred pair `database_data.normalization`'s own
# contract already uses.

purpose:
  - record_a_data_retention_and_deletion_policy_for_a_data_class_including_named_holds_and_their_conflict_resolution_and_evidence_of_compliance
inputs:
  required: [DataClassDeclaration, RetentionRule, DeletionTrigger, ComplianceEvidence]
  optional: [HoldSet, SchemaReference, DeletionEvidenceReference]
outputs: [RetentionDeletionModelRecord]
preconditions:
  - "data_class, purpose, retention_rule, deletion_trigger, and compliance_evidence are all non-empty strings"
  - "holds is a required array (may be empty); every entry's own hold_type is one of MP §114's own five named values (legal_hold, regulatory_hold, research_hold, contractual_hold, user_deletion_request); reason is a non-empty string; active is a real bool"
  - "when MORE THAN ONE holds[] entry has active:true, conflict_resolution is REQUIRED (a non-empty string) -- directly implementing MP §114's own 'Policy Engine 決定，並產生理由' requirement; when 0 or 1 holds are active, conflict_resolution MUST be absent (no conflict exists to resolve, avoiding an invented resolution for a non-conflict)"
  - "schema_ref, when present, is a non-empty string beginning with ERD- (database_data.erd) -- a format-only soft link, OPTIONAL because a data class may span multiple modeled entities or exist outside any modeled ERD"
  - "deletion_evidence_ref, when present, is a non-empty string beginning with DEL- (specs/execution/data-deletion.schema.yaml's own deletion_request) -- a format-only soft link, present once a real deletion has been carried out under this policy"
  # Precondition 1 maps onto 'data class'/'purpose'/'retention'/
  # 'deletion'/'proof'; 2-3 onto 'exception' (MP §114's own five-type
  # vocabulary plus its own conflict-resolution requirement); 4-5 onto
  # the two real cross-references confirmed by due diligence.
quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class every prior structural (non-genuine-compute)
  # database_data contract already reasons through: the real risk is
  # MODELING integrity (is the policy internally consistent and
  # correctly evidenced), not an evidence-citation risk over a
  # narrative claim.
forbidden_transition: []
# Atlas §22.3's own gate table has no Retention / Deletion Model row.
recommended_next: []
# database_data.erd and specs/execution/data-deletion.schema.yaml are
# both ALREADY built/existing and consumed here as real soft-link
# fields, not left as bare recommended_next entries.
rollback:
  side_effect_free: true
  # The RECORD itself is side-effect-free -- any real deletion this
  # policy eventually triggers happens outside this method's own scope
  # (in specs/execution/data-deletion.schema.yaml's own execution
  # layer), the same "record describes an external policy/structure"
  # class every prior database_data contract's own rollback field
  # already draws.

compilation_decisions:
  - question: >
      Should this method compute a live 'is this data class currently
      eligible for deletion' boolean from a stored retention-period
      length and a reference timestamp?
    decision: "No -- this record is a POLICY declaration (data class/purpose/retention rule/deletion trigger/holds/evidence), not a live eligibility computation."
    reasoning: >
      CORRECTED post-critic-review: the first draft argued this was
      technically FORCED (a live check would supposedly have to depend
      on wall-clock time, which no other genuine-compute record in this
      family does) -- a critic review found a real counterexample: an
      `evaluated_as_of` stored timestamp compared against a stored
      retention-period length WOULD stay a deterministic function of
      stored fields, and `database_data.expand_contract_migration`'s
      own gate already compares two stored `completed_at` timestamps
      this same way (`ai_lego/modules/database_data
      /expand_contract_migration.py:119`). The REAL grounds are textual,
      not technical: Atlas's own formula ends in "proof" (evidence that
      a compliant policy exists), not an "eligibility" or "check" step;
      and Master Plan §114's own opening line (L4713, "資料不能只用固定
      「30 天刪除」" -- data cannot just use a fixed 30-day rule) argues
      against inventing the single structured duration grammar a
      generic eligibility formula would need, since real retention
      rules are commonly conditional and hold-dependent in ways one
      field cannot faithfully represent. Disclosed as a real, ELECTIVE
      scope boundary (OQ-RDM-2, corrected to name the known-viable
      deterministic alternative) -- a future revision building a
      genuinely time-aware eligibility engine (using the
      `evaluated_as_of`-style pattern) would be a DIFFERENT, dedicated
      method (or an execution-layer trigger consuming this record as
      input), not a retrofit here.
  - question: >
      MP §114 names FIVE hold/trigger types (Legal/Regulatory/Research
      /Contractual Hold, User Deletion Request) plus a base "Retention
      Policy". Should "Retention Policy" itself be a sixth `hold_type`
      enum value?
    decision: "No -- 'Retention Policy' is this record's own baseline (retention_rule), not one of the five EXCEPTION-shaped hold types holds[] models."
    reasoning: >
      MP §114's own six-item list (L4718-4723) mixes one BASELINE
      concept (Retention Policy -- the default rule) with five
      EXCEPTION concepts (holds that override or accelerate that
      baseline). Atlas's own formula already separates these into two
      distinct steps ("retention" vs. "exception") -- this record's own
      field design follows that same separation: retention_rule is the
      baseline (Atlas's "retention"), holds[] is the exception set
      (Atlas's "exception", using MP §114's own five-item vocabulary
      for it). Folding "Retention Policy" into the same enum as its own
      five exceptions would conflate a rule with the exceptions TO that
      rule.
  - question: >
      Should `holds[]` reject two entries with the identical hold_type
      (e.g. two separate legal_hold entries for two different legal
      matters)?
    decision: "No -- repeated hold_type values are legal."
    reasoning: >
      A real data class can genuinely be subject to two independent
      legal holds from two different matters simultaneously (e.g. two
      separate litigation holds). Atlas's own formula and MP §114 name
      no one-hold-per-type restriction; inventing one would be exactly
      the kind of unstated-assumption invention this package's every
      prior contract already disciplines itself against.

open_questions:
  - id: "OQ-RDM-1"
    question: "id mints a machine_id method-inventory.yaml never carried -- should method-inventory.yaml be updated (has_contract:true, machine_id, corrected line field)?"
    owner: "operator, or a future session with explicit write scope over method-inventory.yaml"
    blocks: "nothing in this file's own validity"
  - id: "OQ-RDM-2"
    question: >
      This record deliberately does NOT compute a live 'eligible for
      deletion now' boolean (see compilation_decisions) -- it declares
      a policy, not a live eligibility engine. This is an ELECTIVE scope
      decision, not a technical impossibility -- CORRECTED post-critic-
      review: a critic review found a real, known-viable deterministic
      design (an `evaluated_as_of` stored reference timestamp compared
      against a stored retention-period length, the same pattern
      `database_data.expand_contract_migration`'s own gate already uses
      to compare two stored `completed_at` timestamps,
      `ai_lego/modules/database_data/expand_contract_migration.py:119`)
      that WOULD stay a pure function of stored data. Should a future,
      DEDICATED method (or an execution-layer trigger consuming this
      record's own retention_rule as input) be built using that pattern
      to perform a genuinely time-aware check?
    owner: "operator, or whoever next scopes a time-aware retention-eligibility engine"
    blocks: "nothing in this file's own validity -- disclosed scope boundary, not a silent gap"
  - id: "OQ-RDM-3"
    question: >
      Neither `schema_ref` nor `deletion_evidence_ref` is cross-
      validated against this record's own `data_class` -- a caller
      could supply refs describing an entirely unrelated dataset. This
      method cannot see either referenced record's own content
      (format-only soft link, the same declared limit every prior
      soft-link field in this package already carries). Should a
      future revision add a runtime cross-check?
    owner: "operator, or whoever next revises this contract's own scope"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap"


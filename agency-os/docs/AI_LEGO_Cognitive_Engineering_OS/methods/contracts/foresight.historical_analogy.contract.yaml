  method: >
    Read Atlas F13 table row L674 directly. Grepped the full spec root case-insensitively for "historical
    analogy"/"analogy_limits" before writing. Validated against specs/cognitive/method.schema.yaml.
  note: "No mother document was modified. Table row transcribed verbatim; the 4-field per-analogy invariant is this file's own compilation decision, disclosed above."

id: security.supply_chain_threat_model
version: "1.0.0"
family: security

cognitive_primitives: [DECOMPOSE, MAP, VALIDATE]
# INFERRED, not cited. Same reasoning as security.pasta/security.dpia_pia:
# staging the seven-step chain is DECOMPOSE, assigning per-stage content
# (including the dependency_entries[] considerations) is MAP, and the
# stage-completeness-and-order PLUS dependency-consideration-completeness
# PLUS production-verified-artifact-gate checks are all VALIDATE
# (structural/referential/conditional derivations, not a numeric COMPUTE
# step).

purpose:
  - walk_a_software_supply_chain_through_atlas_own_seven_ordered_stages_from_source_to_a_final_sign_verify_finding_confirming_dependency_considerations_were_recorded_and_production_deployment_never_outran_artifact_verification
inputs:
  required: [SupplyChainSubjectDescriptor, SupplyChainStageSequence]
  # SupplyChainStageSequence, not "...Set" -- same shape-accurate-naming
  # discipline security.pasta's own PastaStageSequence and security.dpia_pia's
  # own DpiaPiaStageSequence already establish: Atlas's own "→" chain is a
  # real dependency order, not an unordered set. SupplyChainSubjectDescriptor
  # names the system/component under review, the same role
  # ProcessingActivityDescriptor plays for security.dpia_pia.
  optional: []
outputs: [SupplyChainThreatModelRecord]
preconditions:
  - "system_or_component is a non-empty string"
  - "stages is EXACTLY the seven entries {source, dependency, ci, artifact, registry, deploy, sign_verify}, one each, IN THAT ORDER -- Atlas's own F20 table row (L889) '→' chain is a real dependency order, not an unordered set"
  - "each of source/ci/artifact/registry/deploy has a non-empty summary"
  - "the dependency stage has at least one well-shaped dependency_entries[] entry (non-empty name, and a considerations object with ALL SEVEN EC §34 (L1334-1342) dimensions non-empty: maintenance/license/vulnerability_history/replaceability/transitive_dependencies/size_performance/long_term_support)"
  - "the sign_verify stage has a non-empty summary, boolean artifact_verified, boolean production_deployment_occurred, and a non-empty verification_method; production_deployment_occurred may not be true while artifact_verified is false (EC §34 L1328-1332 'Production 只部署：verified artifact', independently converging with Master Plan §66 L2758 'Production 只接受 Signed Artifact')"
quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class as security.pasta/security.dpia_pia: stage-completeness
  # -and-order, dependency-consideration-completeness, and the production
  # -verified-artifact gate are all structural/referential/conditional
  # derivations, not a statistical/numeric CALCULATED RESULT.
forbidden_transition: []
# Atlas §22.3's own gate table (L4142-4155) has no Supply Chain Threat Model
# row -- confirmed by direct read, same class of confirmation every prior
# F20 sibling's own contract already performs.
recommended_next: [architecture.adr]
# Atlas's own F18 Architecture Change chain (L830-841) places "Threat Model"
# directly before "ADR" (L836-837) -- this method's own NAME literally
# contains "Threat Model", making this the MOST direct application of that
# forward link of any F20 member so far (STRIDE/LINDDUN/Attack Tree/PASTA
# needed no extra justification either; DPIA/PIA needed a disclosed
# different reasoning since it is not itself named a Threat Model method --
# this one needs neither hedge).
rollback:
  side_effect_free: true
  # The RECORD itself is side-effect-free -- same class every prior
  # structural F20 contract's own rollback field already draws.

compilation_decisions:
  - question: >
      ADR-015 (ACCEPTED) and `policies/security/supply-chain-security
      .policy.yaml` (ACTIVE) already exist and are literally titled
      "Supply Chain Security". Before designing a single field, is this
      new method contract a duplicate?
    decision: "No -- confirmed additive after reading both files in full. See description's own DUPLICATION CHECK section for the complete reasoning."
    reasoning: >
      ADR-015/the policy file are a SINGLETON, STATIC TOOL-SELECTION
      decision (SBOM format, signing mechanism, SLSA target, vuln-scan
      tooling/thresholds) -- a "which vendor/standard did we pick" layer,
      structurally a single whole-document object with no record-identity
      field, incapable of representing a per-system, per-review record.
      This contract is a "did THIS system's supply chain actually follow
      the seven-stage flow correctly, with real dependency-consideration
      and production-verification evidence" REVIEW RECORD -- the same
      distinction `policies/security/zero-trust.policy.yaml` (static
      IdP/OIDC selection) already draws against `security.zero_trust
      _review` (a sibling F20 slice's own per-access review). Grounding
      this contract's own field richness in ADR-015's real tool choices
      via a soft reference (not inventing placeholder tool names) is the
      correct way to be additive without duplicating.
  - question: >
      Three mother-document citations exist for this same underlying flow
      (Atlas F20 row: 7 stages; Master Plan §66: 7 stages, different
      words; EC §34: 9 stages, different words and a different Sign
      position) -- which is authoritative for `stages[].stage_id`?
    decision: "Atlas's own F20 table row (L889) is authoritative for stage identity/order. Master Plan §66 and EC §34 are used ONLY to ground two additional cross-cutting invariants (dependency-consideration completeness, production-verified-artifact gate), never to re-shape or reorder the stage list itself."
    reasoning: >
      Every prior F20 member's own `stages[].stage_id` enum is drawn from
      ATLAS specifically (never from Master Plan or EC) -- this contract
      follows that same family-wide convention rather than picking
      whichever of the three documents happens to have the most detail.
      Silently merging three DIFFERENT stage lists into one invented
      "best of all three" chain would fabricate a fourth ordering no
      mother document actually states, a worse error than picking one
      real, citable source and disclosing the other two as unreconciled.
      This is a genuinely different situation from `security.dpia_pia`'s
      own "dedicated section vs. table row" precedent (both of THOSE
      citations were the SAME document, Atlas, one richer than the
      other) -- here the two richer alternatives are DIFFERENT documents
      with materially different stage counts and orderings, not a
      richer/thinner pair from the same source.
  - question: >
      Atlas's own literal word order places `sign/verify` AFTER `deploy`
      (the LAST of the seven words) -- read as real pipeline causality,
      this contradicts both Master Plan §66 (verification bundled into
      the terminal "Verified Deployment" step) and EC §34 (Sign at
      position 7 of 9, well before Registry/Deploy). Should this
      contract silently reorder Atlas's own words to match the more
      operationally sensible sequence the other two documents suggest?
    decision: "No -- transcribe Atlas's own literal order verbatim, and disclose the cross-document ordering conflict explicitly instead of silently resolving it."
    reasoning: >
      Silently reordering Atlas's own words would be exactly the
      "invented sub-structure/order beyond what the citation specifies"
      class every prior F20 contract's own compilation_decisions already
      refuses (e.g. security.pasta's own refusal to reorder its own
      seven-word chain even though the real external PASTA methodology
      might suggest richer structure). The disclosed resolution is that
      this record documents a RETROSPECTIVE REVIEW's own stage-by-stage
      account (the same category every other F20 Threat Model record
      already is), not a live execution log asserting real-time causal
      ordering -- the production-verified-artifact-gate invariant is
      therefore written to be field-local within the single `sign_verify`
      stage object, so its own correctness does not depend on resolving
      which document's literal stage ordering is operationally "more
      correct".
  - question: >
      Should the `dependency` stage stay minimal (`stage_id`/`summary`
      only, matching PASTA's own six process stages and this contract's
      own source/ci/artifact/registry/deploy stages), or carry richer
      structure?
    decision: "Richer structure -- dependency_entries[], each with a considerations object carrying all seven of EC §34's own named dimensions."
    reasoning: >
      This is the one stage a mother document (EC §34, L1334-1342) gives
      CONCRETE further detail for -- a real, disclosed asymmetry, not an
      arbitrary design choice. Every OTHER stage in this record stays
      minimal because no mother document names any further sub-structure
      for source/CI/artifact/registry/deploy/sign_verify's own summary
      content beyond what appears in Atlas's own seven-word chain --
      the identical "stay minimal absent a real citation, add structure
      when one exists" discipline `security.pasta.contract.yaml`'s own
      compilation_decisions already establishes, applied here in the
      direction that adds rather than withholds structure because the
      citation genuinely exists for this one stage.
  - question: >
      Should the production-verified-artifact-gate invariant
      (`production_deployment_occurred` implies `artifact_verified`) be
      expressed in the JSON Schema (a same-object `if`/`then`, since both
      fields live in the single `sign_verify` stage object, unlike DPIA
      /PIA's own cross-`prefixItems`-position escalation rule) or kept
      runtime-only?
    decision: "Runtime-only (construction + independent gate), matching the family-wide two-layer discipline every prior F20 sibling already applies to its own real invariants -- not additionally duplicated into the JSON Schema."
    reasoning: >
      Unlike `security.dpia_pia.contract.yaml`'s own reasoning (JSON
      Schema 2020-12 genuinely CANNOT cleanly express a conditional
      spanning two different `prefixItems` positions), this rule COULD be
      written as a single-object `if`/`then` here -- disclosed honestly
      rather than claiming the same schema-level impossibility DPIA/PIA
      cites. The real reason to still keep it runtime-only is different:
      writing the SAME business rule in two independently-maintained
      places (a JSON Schema conditional AND a Python predicate) creates a
      second copy that could silently drift out of sync with the first
      over this record's own 30-year evolution horizon (Atlas's own "30
      年可演化" fitness criterion, §24 gate table L4372) -- one
      authoritative enforcement point, exercised at both the construction
      and the independent gate layer (two LAYERS of the SAME rule, not
      two DIFFERENT copies of it), is the safer long-term shape.
  - question: >
      Should `sign_verify.verification_method` hard-`$ref` into
      `policies/security/supply-chain-security.policy.yaml`'s own
      `signing.mechanism` (`const: "Sigstore/cosign"`), the way a fully
      -wired integration would?
    decision: "No -- a soft, free-text reference only, with a description pointing at the real policy file's own const value."
    reasoning: >
      Confirmed by direct read of `ai_lego/core/contracts/schema_contracts
      .py:24-28`: `SchemaContracts` only globs `spec_root/specs/` into its
      `$ref` registry. `policies/security/supply-chain-security.policy
      .yaml` lives under `policies/`, not `specs/` -- a hard `$ref` there
      would not resolve, the identical technical constraint this
      session's own task briefing already disclosed and this contract
      independently re-confirmed rather than merely trusting. The SAME
      soft-reference pattern `security.dpia_pia.contract.yaml`'s own
      `jurisdiction_pack_ref` already establishes for an analogous
      cross-directory, non-`specs/`-indexed target.


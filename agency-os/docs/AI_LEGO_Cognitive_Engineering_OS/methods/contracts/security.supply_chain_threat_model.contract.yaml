  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §13.11 Security Review Recipe (L3472-3487, 'Supply Chain Review' at L3482): confirming cross-reference that Supply Chain Review is a real step in Atlas's own broader security review sequence, not itself decomposed there"

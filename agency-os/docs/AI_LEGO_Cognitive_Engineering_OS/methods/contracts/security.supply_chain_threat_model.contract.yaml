$id: "ai-lego://methods/contracts/security.supply_chain_threat_model.contract.yaml"
title: "Supply Chain Threat Model Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry. Fifty-first Method Atlas slice (this session), a
  SIXTH member of the `security` family (F20's own "資安／隱私套件"), after
  `security.stride` (44th), `security.linddun` (45th), `security.attack_tree`
  (46th), `security.pasta` (47th), and `security.dpia_pia` (48th). Built
  concurrently with four sibling F20 members (Zero Trust Review, Secrets
  Threat Review, Abuse Case, Security Control Mapping) by independent
  sessions -- this file does not depend on, or conflict with, any of them.

  **DUPLICATION CHECK PERFORMED FIRST, BEFORE ANY FIELD DESIGN (mandatory
  precondition for this slice)**: `docs/adr/ADR-015-supply-chain-security
  -tooling-selection.md` (ACCEPTED 2026-08-30) and its ratified artifact
  `policies/security/supply-chain-security.policy.yaml` (ACTIVE) already
  exist and cover "supply chain security" by name. Read both in full before
  writing this file. Confirmed DIFFERENT LAYER, genuinely additive, not a
  duplicate: ADR-015 is a ONE-TIME, SINGLETON STATIC TOOL/VENDOR SELECTION
  decision -- "which SBOM format" (CycloneDX), "which signing mechanism"
  (Sigstore/cosign keyless), "which SLSA target level" (L2 now, L3 at Phase
  4 CI/CD build-out), "which vulnerability-scan tool and threshold policy"
  (Grype + Dependabot, CVSS/EPSS/KEV-tiered). Its own `verification.note`
  (supply-chain-security.policy.yaml:265-269) is explicit that this is ALL
  it covers. Nowhere does it, or its ADR, ask or answer "does THIS SPECIFIC
  system's software supply chain actually implement source→dependency→CI
  →artifact→registry→deploy→sign/verify correctly, stage by stage, for a
  given system or component under review" -- that is a PER-REVIEW RECORD
  question, the same class of gap every prior F20 Threat Model method fills
  for its own trigger (STRIDE for authn/authz/etc, DPIA/PIA for personal
  -data processing). `policies/security/supply-chain-security.policy.yaml`
  is a single, whole-document, tooling-selection policy (`type: object`, no
  per-instance records, no `id`/record-identity field at all) -- structurally
  incapable of representing "the 2026-09-06 review of System X's supply
  chain," the same way `zero-trust.policy.yaml` (a static IdP/OIDC tooling
  decision) is a genuinely different layer from `security.zero_trust_review`
  (a sibling F20 slice's own per-access REVIEW record). This contract is
  therefore additive: it grounds its own per-stage field richness in
  ADR-015's REAL ratified tool choices via a SOFT reference (see
  `sign_verify.verification_method`'s own description), not invented
  placeholder tool names -- the same soft-reference pattern
  `security.dpia_pia.contract.yaml`'s own `jurisdiction_pack_ref` already
  establishes, required here for the identical technical reason:
  `ai_lego/core/contracts/schema_contracts.py` only globs `spec_root/specs/`
  (`schema_contracts.py:28`, `specs_dir.rglob("*.yaml")`) into its `$ref`
  registry -- `policies/security/supply-chain-security.policy.yaml` lives
  under `policies/`, NOT `specs/`, so a hard `$ref` into it would not
  resolve, confirmed by direct read of that indexing code, not assumed.

  **Grounding citations, THREE independent mother-document mentions of the
  same underlying flow, with genuinely DIFFERENT stage counts/wording --
  disclosed, not silently reconciled** (see `compilation_decisions` for the
  full reasoning on which is authoritative for what):
  1. Atlas F20 tool table, Supply Chain Threat Model row (L889): "source
     →dependency→CI→artifact→registry→deploy→sign/verify" -- SEVEN words,
     no dedicated section anywhere in Atlas (broad case-insensitive grep for
     "supply chain"/"supply-chain" across the Atlas document found exactly
     two OTHER hits, both non-structural: §13.11 Security Review Recipe
     (L3482, "→ Supply Chain Review →", ONE step in a longer 12-step
     recipe, not itself decomposed) and §27's gate table (L4378, "Identity
     /Secrets/Supply Chain 有控制與測試" -- a Security Gate criterion
     naming supply chain as one of three areas needing "controls and
     tests", not a stage breakdown). This F20 table row is Atlas's own
     ONLY structural breakdown of this method, the situation
     `security.pasta.contract.yaml` already establishes precedent for
     (compressed formula, no dedicated section) -- treated here as
     AUTHORITATIVE for this record's own `stages[].stage_id` closed enum,
     transcribed verbatim and in Atlas's own literal order, per that
     precedent.
  2. Master Plan §66 "Supply Chain Security" (L2740-2756): "Source→Signed
     Commit→CI→SBOM→Dependency Scan→Artifact Signing→Verified Deployment"
     (also seven stages, but DIFFERENT wording and, critically, places
     signing/verification content at position 2 AND 6, ending in "Verified
     Deployment" as the terminal stage) plus "Production 只接受 Signed
     Artifact" (L2758).
  3. Execution Contract §34 "Supply Chain Contract" (L1304-1343): "Source
     →Commit→Dependencies→Build→SBOM→Scan→Sign→Registry→Deploy" (NINE
     stages -- splits Atlas's "CI" into Commit+Build, has no explicit
     "Artifact" stage, and places "Sign" at position 7, BEFORE Registry
     /Deploy) plus "Production 只部署：verified artifact" (L1328-1332) plus
     a concrete, named 7-item "新增 dependency 要考慮" checklist (L1334-1342:
     maintenance / license / vulnerability history / replaceability /
     transitive dependencies / size／performance / long-term support).

  **Honest, disclosed cross-document inconsistency, NOT silently smoothed
  over**: all three citations name a "sign"/"verify"/"signed" concept, but
  Atlas's own literal word order places it LAST, after `deploy` -- reading
  this as real-time pipeline causality would put verification AFTER
  production deployment, which contradicts BOTH Master Plan §66's own
  "Verified Deployment" (verification bundled INTO the deploy step, not
  after it) and EC §34's own "Sign" at position 7 of 9, well BEFORE
  "Registry"/"Deploy" (positions 8-9). This is not this contract's error to
  silently fix by reordering Atlas's own words (that would be exactly the
  "invented sub-structure" class every prior F20 contract's own
  compilation_decisions already refuses to do) -- it is read as evidence
  that this record models a RETROSPECTIVE REVIEW's own documentation order
  (the same category every other F20 Threat Model record already is: a
  review artifact, not a live execution log), where the `sign_verify` stage
  is the review's own TERMINAL FINDING about whether verification/signing
  controls existed and held, not a claim about the literal runtime instant
  verification occurred relative to deployment. The real invariant this
  contract enforces (see below) is stated field-locally within that one
  terminal stage precisely so it does not depend on resolving this
  cross-document ordering conflict.

  **Structural shape**: a SEVENTH F20 member overall, sharing PASTA's/DPIA
  -PIA's own "fixed-length, positionally-ordered pipeline" class
  (`prefixItems`, same as those two siblings). Like DPIA/PIA, this record
  carries NONE of `assets`/`trust_boundaries`/`entry_points`/`test_evidence`
  -- confirmed by direct grep of Execution Contract §32 (L1231-1260), whose
  own closing sentence names exactly "STRIDE／LINDDUN／Attack Tree／PASTA",
  no fifth or sixth option, and whose own trigger list (L1233-1245: authn,
  authz, secrets, crypto, network, egress, tenant isolation, file parsing,
  user content, AI tools) never mentions supply chain, dependencies,
  CI/CD, or build in any form. This is the SECOND F20 member confirmed
  genuinely absent from EC §32 entirely (after `security.dpia_pia`, the
  48th slice, the first) -- directly updating `security.stride.contract
  .yaml`'s own `OQ-STRIDE-4` (see `resolved_by` text this contract's own
  final report proposes verbatim, not written into that file directly per
  this session's own write-scope boundary).

  **Two invariants beyond stage completeness-and-order, BOTH grounded in
  real, external mother-document citations (NOT invented, NOT the
  ADR-015/policy tooling-selection layer)**:
  1. **Dependency-consideration completeness** -- the `dependency` stage's
     own `dependency_entries[]` must have at least one entry, and every
     entry's own `considerations` object must carry all SEVEN of EC §34's
     own named dimensions (L1334-1342), each a non-empty string:
     `maintenance`/`license`/`vulnerability_history`/`replaceability`
     /`transitive_dependencies`/`size_performance`/`long_term_support`.
     This is the one stage this contract gives RICHER structure than a
     bare `stage_id`/`summary` (unlike PASTA's own deliberately-minimal
     six process stages) -- a real, disclosed CONSEQUENCE of EC §34
     actually naming seven concrete sub-dimensions for this exact stage,
     the same "real citation, not invention" test PASTA's own
     compilation_decisions already applies in the opposite direction (stay
     minimal WHEN no further detail is cited; add structure WHEN it is).
  2. **Production-verified-artifact gate** -- the terminal `sign_verify`
     stage's own `production_deployment_occurred` (boolean) may not be
     `true` while `artifact_verified` (boolean) is `false`. Grounded in
     TWO INDEPENDENT, CONVERGING mother-document citations (stronger than
     any single-citation invariant in this F20 family so far):
     EC §34 L1328-1332 ("Production 只部署：verified artifact") AND Master
     Plan §66 L2758 ("Production 只接受 Signed Artifact") -- two different
     documents, same rule, same conclusion. Enforced at the runtime layer
     only (construction + independent gate), not the JSON Schema, by
     explicit compilation decision (see below) -- unlike DPIA/PIA's own
     escalation rule, this one COULD be expressed as a single-object JSON
     Schema `if`/`then` (both fields live in the same `sign_verify` stage
     object, not across two different `prefixItems` positions the way
     DPIA/PIA's residual_risk/approval split is), but is kept runtime-only
     for a different, disclosed reason: to avoid the SAME business rule
     existing in two independently-maintained places (schema and Python)
     that could silently drift apart over this record's own 30-year
     evolution horizon.

  This is a STRUCTURAL record (`provenance_required` + one integrity gate),
  NOT `genuine_compute` -- Atlas's own benefit line ("降 dependency/artifact
  compromise") is a qualitative risk-reduction claim, the same class
  STRIDE/LINDDUN/PASTA/DPIA-PIA's own structural derivations already
  establish, not a numeric/ordinal computation like Attack Tree's own
  cost/skill/detectability aggregation.

  Confirmed distinct from every existing `specs/security/` typed object
  (`key-vault-lifecycle`, `log-redaction-token`, `personal-data-envelope`,
  `tenant-isolation-controls`) by direct grep for "supply chain"/"registry"
  /"dependency scan"/"sbom" across that directory -- zero hits beyond an
  unrelated ADR-governance-process mention in `key-vault-lifecycle.schema
  .yaml:515`.


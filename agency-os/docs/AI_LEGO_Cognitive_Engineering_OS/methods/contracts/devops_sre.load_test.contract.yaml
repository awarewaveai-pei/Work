$id: "ai-lego://methods/contracts/devops_sre.load_test.contract.yaml"
title: "Load Test Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry. Thirty-fifth Method Atlas slice, TENTH from the
  `devops_sre` family (F19), after `devops_sre.sli_slo` (twentieth),
  `devops_sre.canary_deployment` (twenty-first),
  `devops_sre.chaos_engineering` (twenty-second),
  `devops_sre.blue_green_deployment` (twenty-third),
  `devops_sre.error_budget` (twenty-fourth), `devops_sre.capacity_model`
  (thirty-first), `devops_sre.release_readiness_review` (thirty-second),
  `devops_sre.runbook_execution` (thirty-third), and
  `devops_sre.game_day` (thirty-fourth).

  Atlas gives this method exactly ONE citation of its own: the F19 tool
  table's Load Test row (L853: purpose "驗證預期負載" -- verify the
  expected load; usage "baseline→target load→latency/errors/resources";
  benefit "找性能瓶頸" -- find the performance bottleneck). No dedicated
  §11.x section exists (confirmed by direct read of the surrounding
  table, L848-863; a full-Atlas grep for "負載" returns only this row,
  its two sibling rows L854-855, and two causal-loop diagram nodes
  "系統負載" at L557/L1609 that belong to system-dynamics examples, not
  to this method).

  The Execution Contract, however, carries TWO real siblings this
  contract cites and aligns with rather than duplicates: (1) §50
  Performance Contract (L1760-1789) -- the governance-side rule for
  WHEN a change must be load-tested, with its own flow "Baseline→
  Target→Load Profile→Test→Compare→Accept/Reject", an observation list
  (latency, throughput, CPU, memory, IO, DB, queue, cost) and the
  closing rule "不要用單次 benchmark" (never a single benchmark). Atlas
  L853 is the METHOD that flow invokes; this contract's typed object
  requires BOTH a baseline and a target measurement by construction --
  a single measurement cannot form a `LoadTestRecord` -- which is
  exactly §50's closing rule made structural. `policy-inventory.yaml:267`
  (Phase 0) lists §50 as a `kind: gate` item with no policy-as-code file
  built yet (confirmed: no `policies/**/performance*` exists), so no
  duplicate artifact exists to reconcile against -- disclosed as
  OQ-LOADTEST-2.
  (2) §73 Expected Result 必填 (L2312-2334) -- its worked example
  carries `performance: p95_latency_ms_max: 300` (L2329); this
  contract's own `acceptance.latency_p95_ms_max` field TRANSCRIBES that
  name (the `300` is a worked value in an example, not a default -- see
  compilation_decisions).

  Broad due-diligence search (case-insensitive spec-root greps for
  "load test"/"負載測試"/"load_test", "bottleneck"/"瓶頸", "p95"/
  "latency budget"/"throughput", "load profile"/"performance contract";
  every neighbour read, each confirmed distinct): `policies/provider/
  ai-gateway-fallback.policy.yaml:59-62` trips a circuit breaker on
  "p95 latency > 3x rolling baseline" -- the SAME p95-relative-to-
  baseline quantity this method computes as `latency_ratio`, but a
  RUNTIME circuit-breaker rule with a fixed multiplier (transcribed from
  `DEVOPS_SRE_PLAN.md` §4 L148), not a load-test acceptance criterion;
  this contract reports the ratio and deliberately does NOT judge it
  against that constant (OQ-LOADTEST-4 asks whether a ratio-based
  acceptance mode should exist). `DEVOPS_SRE_PLAN.md` §2.1 (L78-84)
  gives per-edition p95 latency BUDGETS (e.g. 2s p95 / 4s p99 for
  Enterprise) -- exactly the kind of number a caller supplies as
  `acceptance.latency_p95_ms_max`, not something this method
  hard-codes. `REPOSITORY_ARCHITECTURE.md:324` uses p95 latency as a
  service-extraction signal; `SEARCH_CONTENT_MVP_VERTICAL_SLICE.md:315`
  lists "rate-limit/load test" as a checklist item; `computation
  .monte_carlo`'s own P95 is a simulation percentile, not a latency.
  `devops_sre.capacity_model`'s own OQ-CAPACITYMODEL-2 anticipated this
  method as a source of an OBSERVED `resource_coefficient` -- this
  record carries observed utilizations per resource, not a coefficient,
  so that soft link is still not built (OQ-LOADTEST-3, and that OQ is
  annotated accordingly). Phase-0 `verified-findings.yaml:1052` records
  the near-name collision between F19's Stress Test (L854) and F12's
  Stress Testing (L649); this method is neither -- F19's Stress Test
  and Soak Test (L854-855) remain unbuilt siblings (OQ-LOADTEST-5).
  ADDED post-critic-review, the two nearest TYPED OBJECTS that also
  encode a latency budget: `specs/cognitive/typed-objects/quality-
  attribute-scenario.schema.yaml:67,78` (a REQUIREMENT scenario --
  "turning 'fast' into a testable latency scenario", e.g. `measure:
  "p99 延遲 < 300ms"`) and `sli-slo-set.schema.yaml:72` (a rolling
  PRODUCTION target -- "p99 < 300ms，30 天滾動窗口"); this record is a
  MEASURED COMPARISON against a caller-supplied budget, which a QAS
  may specify and an SLO may later monitor -- distinct objects, each a
  legitimate source of `acceptance.latency_p95_ms_max`, neither a
  duplicate. No duplicate typed object or method found; the search
  that reached that conclusion is the broad one, recorded here.

  Atlas's own formula and benefit ground FIVE real invariants: (1)
  "baseline→target load" -- `target.load_rps` is STRICTLY greater than
  `baseline.load_rps` (a target at or below the baseline is not a load
  test of the expected load); (2) "resources" compared like-for-like --
  both measurements report the SAME set of resource names (a bottleneck
  found among resources only one side measured is not a comparison);
  (3) every measured number is finite and in range (utilizations and
  error rates in [0, 1], latencies strictly positive since the baseline
  is a divisor); (4) `acceptance` thresholds are valid (finite, positive
  latency budget, error budget in [0, 1]) -- re-verified by the gate,
  not builder-only, applying the lesson `devops_sre.capacity_model`'s
  own critic round taught; (5) `latency_ratio`, `error_rate_delta`,
  `bottleneck`, and `status` are COMPUTED (`ai_lego.compute.load_test
  .comparison`), never caller-supplied, and `status` is FULLY DERIVED
  with no conservative override -- there is no operational-judgment
  reading of "is this p95 at or under this budget" (the same reasoning
  `devops_sre.capacity_model`'s own status already established).


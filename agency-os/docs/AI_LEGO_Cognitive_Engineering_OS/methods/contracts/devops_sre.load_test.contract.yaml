id: devops_sre.load_test
version: "1.0.0"
family: devops_sre

cognitive_primitives: [DECOMPOSE, VALIDATE, INFER]
# INFERRED, not cited (Atlas gives no §4-style composition formula for
# this method). Separating baseline from target and the three
# observation classes from each other is DECOMPOSE; judging the target
# against acceptance is VALIDATE; naming the most-saturated resource as
# the bottleneck is INFER (all three are real members of
# specs/cognitive/primitive.schema.yaml's own kernel enum, checked
# before writing this line).

purpose:
  - verify_a_system_meets_its_expected_load_by_comparing_a_target_load_measurement_against_a_baseline_and_naming_the_most_saturated_resource_as_the_bottleneck
inputs:
  required: [BaselineLoadMeasurement, TargetLoadMeasurement, LoadAcceptanceThresholds]
  optional: []
outputs: [LoadTestRecord]
preconditions:
  - "system_under_test is a non-empty string"
  - "baseline and target each carry exactly load_rps / latency_p95_ms / error_rate / resource_utilization; load_rps finite and >= 0, latency_p95_ms finite and > 0, error_rate finite in [0, 1], resource_utilization a non-empty map of non-empty resource names to finite fractions in [0, 1]"
  - "target.load_rps is STRICTLY greater than baseline.load_rps"
  - "baseline and target report the SAME set of resource names"
  - "acceptance carries exactly latency_p95_ms_max (finite, > 0) and error_rate_max (finite, in [0, 1]) -- re-verified independently by the gate (ai_lego.modules.devops_sre.load_test._acceptance_is_valid), not builder-only"
  - "latency_ratio, error_rate_delta, bottleneck, and status are all computed by ai_lego.compute.load_test.comparison plus the shared _derive_status predicate, never caller-supplied independently of that computation"
  - "status:passed iff target.latency_p95_ms <= acceptance.latency_p95_ms_max AND target.error_rate <= acceptance.error_rate_max (both inclusive); status:failed otherwise -- FULLY DERIVED, no caller override"
  # Preconditions 3-4 map onto Atlas's own 'baseline->target load' and
  # 'resources' formula steps; 5-7 onto the 'latency/errors' observation
  # and the benefit column. Same "structurally necessary, forbidden-
  # state" class every prior genuine-compute contract this session
  # built already establishes.
quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class of departure every genuine-compute contract in this
  # package already reasons through: the real risk is computational
  # integrity, not evidence-citation over a narrative claim.
forbidden_transition: []
# Atlas §22.3's own gate table has no Load Test row.
recommended_next: []
# Atlas gives no explicit 推薦搭配 chain for this method. Real, disclosed
# (not built as chains) relationships: EC §50's own Accept/Reject step
# consumes this record's `status`; `devops_sre.capacity_model` could
# consume an observed coefficient derived from this record's own
# utilizations (OQ-LOADTEST-3); F19's own Stress Test / Soak Test rows
# extend the same measurement shape beyond the expected load
# (OQ-LOADTEST-5).
rollback:
  side_effect_free: true
  # The RECORD itself is side-effect-free -- the real load generation
  # and any remediation of the named bottleneck happen outside this
  # method's own scope, the same "record reports on an external
  # observation" class every prior devops_sre contract's own rollback
  # field already draws.

compilation_decisions:
  - question: >
      EC §73's own example carries `p95_latency_ms_max: 300` and
      `DEVOPS_SRE_PLAN.md` §2.1 carries per-edition p95 budgets -- should
      this contract default `acceptance.latency_p95_ms_max` (or
      `error_rate_max`) to any of those numbers?
    decision: "No -- both acceptance thresholds are strictly required caller input, no default."
    reasoning: >
      `300` is a worked value inside an EXAMPLE block, and the §2.1
      budgets are per-edition SLA figures for one specific product tier;
      neither is a load-test constant Atlas states. Inventing a default
      would be exactly the unstated-assumption invention this package's
      every prior contract disciplines itself against -- the same
      restraint `devops_sre.capacity_model`'s own thresholds and
      `database_data.backup_restore_drill`'s own RTO/RPO fields already
      established. Only the field NAME is transcribed from §73.
  - question: >
      Atlas's own benefit column says "找性能瓶頸" (find the performance
      bottleneck) but gives no rule for identifying it. How is
      `bottleneck` computed?
    decision: "The resource with the HIGHEST utilization fraction in the TARGET measurement; ties resolve to the lexicographically smallest resource name."
    reasoning: >
      The most-saturated resource under the expected load is the
      standard, non-inventive reading of "bottleneck" given that
      utilization fractions are the only resource observation Atlas's
      formula names. Alternatives (largest GROWTH from baseline, or a
      caller-asserted name) were rejected: growth can crown a resource
      that went from 1% to 5% over one that sits at 95%, and a caller-
      asserted bottleneck would make the benefit column a narrative
      claim rather than a computed finding. The tie-break is
      deterministic so the gate's own recomputation is reproducible --
      disclosed, not hidden behind dict ordering.
  - question: >
      `ai-gateway-fallback.policy.yaml` already encodes "p95 > 3x
      rolling baseline" as a trip rule -- should this method's
      `status` also fail when `latency_ratio` exceeds a multiplier?
    decision: "No -- status judges the TARGET measurement against ABSOLUTE acceptance thresholds only; latency_ratio is reported, not judged."
    reasoning: >
      That multiplier is a RUNTIME circuit-breaker constant transcribed
      from `DEVOPS_SRE_PLAN.md` §4 for the AI gateway specifically; a
      load test's own acceptance is what EC §73 asks a task to declare
      up front (`p95_latency_ms_max`), an absolute budget. Importing the
      3x constant here would silently couple two different governance
      contexts. Whether a caller-supplied ratio budget should be an
      OPTIONAL second acceptance mode is disclosed as OQ-LOADTEST-4, not
      decided here.
  - question: >
      Should `status` allow a conservative caller override (e.g. a
      caller marking a numerically-passed test `failed` because of a
      qualitative observation), the way `database_data
      .backup_restore_drill`'s own status does?
    decision: "No -- fully derived, no override, the same reasoning devops_sre.capacity_model already applied."
    reasoning: >
      "Is this p95 at or under this budget AND is this error rate at or
      under this budget" is pure arithmetic against caller-supplied
      thresholds; a caller who wants a stricter verdict tightens the
      thresholds. A status that disagrees with the computed one is
      simply wrong, not a legitimate judgment call.

open_questions:
  - id: "OQ-LOADTEST-1"
    question: "id mints a machine_id method-inventory.yaml never carried -- should method-inventory.yaml be updated (has_contract:true, machine_id, corrected line field)?"
    owner: "operator, or a future session with explicit write scope over method-inventory.yaml"
    blocks: "nothing in this file's own validity"
  - id: "OQ-LOADTEST-2"
    question: >
      EC §50 Performance Contract (L1760-1789) is listed in Phase 0's
      `policy-inventory.yaml:267` as a policy item, but no
      `policies/ai-execution/*performance*` policy-as-code file exists
      yet. When one is built, should its Accept/Reject step bind to
      this method's own `status` as its gate input, the way
      `release-policy.yaml` binds gates to typed objects?
    owner: "operator, or whoever next transcribes EC §50 into policies/ai-execution/"
    blocks: "nothing in this file's own validity"
  - id: "OQ-LOADTEST-3"
    question: >
      `devops_sre.capacity_model`'s own OQ-CAPACITYMODEL-2 anticipated a
      load test supplying an OBSERVED `resource_coefficient`. This record
      carries observed utilization FRACTIONS per resource, not a
      resource-units-per-request coefficient -- deriving one needs
      provisioned capacity per resource, which this record does not
      carry. Should a future revision add per-resource capacity so the
      coefficient can be computed, or should capacity_model accept a
      `load_test_ref` soft link and do the derivation itself?
    owner: "operator, or whoever next revises either contract's field design"
    blocks: "nothing in this file's own validity"
  - id: "OQ-LOADTEST-4"
    question: >
      Should `acceptance` gain an OPTIONAL `latency_ratio_max` (a
      relative budget, the shape `ai-gateway-fallback.policy.yaml`'s own
      trip rule uses) alongside the absolute `latency_p95_ms_max`?
    owner: "operator, or whoever next revises this contract's own field design"
    blocks: "nothing in this file's own validity"
  - id: "OQ-LOADTEST-5"
    question: >
      F19's own Stress Test (L854: "超過預期負載→觀察 cliff/recovery") and
      Soak Test (L855: "持續負載→memory/resource leak→degradation") share
      this method's measurement shape but ask different questions
      (breaking point; degradation over time). Should they reuse
      `#/$defs/load_measurement` from this record's schema when built?
      Note the Master Plan already reserves a `/stress_test/`
      directory placeholder (`AI_LEGO_Cognitive_Engineering_Os_Global
      _Master_Plan_v1.md:1776`) with no contents -- a location, not a
      design; whoever builds stress_test should reconcile with it.
      ANSWERED for Stress Test 2026-09-05 (thirty-sixth slice):
      `devops_sre.stress_test` reuses `#/$defs/load_measurement`
      unchanged via a cross-file `$ref`, confirmed to resolve correctly
      under `SchemaContracts`' `referencing`-library registry. Soak
      Test's own answer remains open.
    owner: "operator, or whoever next builds devops_sre.stress_test or devops_sre.soak_test"
    blocks: "nothing in this file's own validity"


  method: >
    Read Atlas's F19 tool table row (L853) directly, confirmed against
    the surrounding table (L848-863) and a full-Atlas grep for "負載"
    that no dedicated §11.x section exists. Read EC §50 (L1760-1789)
    and §73's example (L2322-2334) in full. Ran BROAD case-insensitive
    spec-root greps ("load test"/"負載測試"/"load_test"; "bottleneck"/
    "瓶頸"; "p95"/"latency budget"/"throughput"; "load profile"/
    "performance contract"), read every neighbour surfaced
    (ai-gateway-fallback.policy.yaml, DEVOPS_SRE_PLAN.md §2.1/§4,
    REPOSITORY_ARCHITECTURE.md:324, SEARCH_CONTENT_MVP_VERTICAL_SLICE.md
    :315, computation.monte_carlo, capacity_model OQ-2, Phase-0
    verified-findings:1052), and confirmed each distinct by direct read.
    No duplicate typed object or method found. Validated against
    specs/cognitive/method.schema.yaml with
    jsonschema.Draft202012Validator.
  note: >
    No mother document was modified. All five core invariants are each
    grounded in Atlas's own formula or benefit column, or in EC §50's
    own closing rule; the no-default-thresholds, max-utilization
    bottleneck, absolute-not-ratio acceptance, and no-override status
    designs are all disclosed compilation choices, not silent
    inventions -- see compilation_decisions above.

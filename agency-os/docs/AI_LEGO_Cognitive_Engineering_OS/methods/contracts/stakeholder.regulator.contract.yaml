verification:
  method: >
    Read Atlas §9 (L1032-1047) directly at the cited lines and transcribed
    every field verbatim -- no field invented or inferred. Validated against
    specs/cognitive/lens.schema.yaml#/lens with jsonschema.Draft202012Validator
    (required [id, version, family, type, labels] present, id pattern
    ^[a-z_]+\.[a-z_]+$ satisfied, family is a member of the 10-value
    lens_family enum, all three labels are members of the 3-value
    lens_label_value enum).
  note: >
    No mother document was modified. This file adds zero content beyond
    Atlas §9's own literal example. `family: stakeholder` is derived from
    the `id` prefix per lens.schema.yaml's own field convention, not a new
    fact -- it was already implicit in the id Atlas itself wrote.

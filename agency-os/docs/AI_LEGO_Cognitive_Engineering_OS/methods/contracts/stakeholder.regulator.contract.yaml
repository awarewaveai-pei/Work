title: "Stakeholder / Regulator Lens Contract"
status: ACTIVE

description: >
  Tier 0 (group a) of the Atlas Method Contract backfill strategy
  (docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §4, methods/registry/
  contract-backlog.yaml tier_0 entry `stakeholder.regulator`). This is a
  literal transcription of Atlas §9's Lens Contract example (L1032-1047) --
  the ONE real Lens instance anywhere in the corpus, and the exact evidence
  specs/cognitive/lens.schema.yaml (Wave 3) reverse-engineered its whole
  shape from. This file validates against `lens.schema.yaml#/lens`, not
  `method.schema.yaml` -- a Lens (LEGO dimension C, "Perspective") is a
  structurally different object than a Method (dimension A), even though
  both happen to share Tier 0 backlog status.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §9 LEGO Contract, Lens Contract example (L1032-1047) -- every field below transcribed verbatim"
  - "methods/registry/contract-backlog.yaml tier_0 entry for stakeholder.regulator (has_contract: true, contract_status: complete, category: lens)"
  - "methods/registry/method-inventory.yaml stakeholder.regulator lens entry (Atlas L1036, category: lens)"
  - "specs/cognitive/lens.schema.yaml#/lens -- the schema this file's body is validated against"

decided_by: >
  docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §4 Tier 0 group (a). No ADR
  governs the content -- Atlas §9 gives the one complete worked example

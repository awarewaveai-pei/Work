  method: >
    Read Atlas §11.32 (L1942-1965), the F16 tool-table MCDA row (L768),
    and §22.3's Method-specific Gate table MCDA row (L4154) directly at
    the cited lines. Read `specs/decision/decision.schema.yaml` in full
    before writing this contract (proactive due-diligence, applied for
    the second time this session after `challenge.red_team`'s own),
    confirming its OQ-DECISION-2 explicitly anticipates and defers to
    "a future MCDA-specific ... schema" rather than this contract
    duplicating `Decision` itself. Grepped `specs/` and `methods/`
    exhaustively for "mcda"/"multi-criteria"/"weighted sum"/"criteria
    weight" before writing -- all six hits were either this contract's own
    new files, `decision.schema.yaml`'s own forward-reference, or bare
    method-name mentions in tables/inventories with no defined shape (no
    duplicate typed object found). Validated against
    specs/cognitive/method.schema.yaml with jsonschema.Draft202012Validator.
  note: >
    No mother document was modified. `forbidden_transition` is the
    strongest-grounded field in this file (directly table-cited, §22.3
    L4154, not inferred) -- the second Tier 1 contract this session built
    with that property (after challenge.red_team). `purpose`/
    `preconditions`/`outputs`'s literal names are Phase 3 compilation,
    explicitly flagged. The single-weights-field and sensitivity-
    disclosure-only scope limits are DISCLOSED narrowing decisions, not
    silent omissions -- see compilation_decisions and open_questions.

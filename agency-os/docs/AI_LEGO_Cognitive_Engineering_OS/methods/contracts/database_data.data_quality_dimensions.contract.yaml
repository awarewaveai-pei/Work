title: "Data Quality Dimensions Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry. Forty-second Method Atlas slice, EIGHTH from
  the `database_data` family (F21's own "資料庫／資料套件 (DB / Data
  Pack)"), after `database_data.backup_restore_drill` (twenty-fifth),
  `database_data.data_lineage` (twenty-eighth), `database_data
  .expand_contract_migration` (thirtieth), `database_data.reconciliation`
  (twenty-ninth), `database_data.erd` (thirty-ninth), `database_data
  .data_contract` (fortieth), and `database_data.normalization`
  (forty-first). Directly closes `database_data.data_contract`'s own
  `OQ-DC-2`.

  Atlas gives this method FIVE citations, broad grep from the start
  (applying the lesson every prior slice in this family had to learn --
  three separate rounds each initially undercounted a citation): (1)
  the F21 tool table's Data Quality Dimensions row (L904: purpose "檢查
  完整/準確/一致/唯一/時效/有效"; usage "rules→profiling→threshold→
  quarantine→owner"; benefit "防垃圾資料造成高信心結論"); (2) a
  dedicated §12.39 資料品質維度 section (L3066-3082: the SAME six
  dimensions spelled out as an explicit English list -- Completeness,
  Accuracy, Consistency, Uniqueness, Timeliness, Validity -- purpose
  "任何統計、ML、策略分析前的 mandatory gate", benefit "防止 garbage
  in → confident garbage out"); (3) the Method Selection Engine's own
  Causal problem-type recipe row (§10, L1108: "DAG→Data Quality→
  Identification→Compute→Sensitivity"), naming this method as the
  SECOND recommended step in any causal-analysis workflow, right after
  `root_cause.dag`; (4) a "分析導向" (analysis-oriented) recipe chain
  (L3644-3654: "Question→Dataset→Data Quality→DAG→Statistics→
  Sensitivity→MCDA"), independently confirming the same "Data Quality
  gates everything downstream" positioning; (5) the §26-area system-wide
  architecture invariant table's own "Data 正確" row (L4379: "Schema/
  Data Quality/Lineage/Restore 可驗證" verified by a "Data Gate") --
  naming this method as ONE OF FOUR PILLARS of data correctness
  alongside `database_data.erd` (Schema), `database_data.data_lineage`
  (Lineage), and `database_data.backup_restore_drill` (Restore) -- ALL
  THREE already built this session.

  Due-diligence search, broad from the start: case-insensitive
  spec-root and mother-document greps for "data quality"/"completeness"
  /"accuracy"/"consistency"/"uniqueness"/"timeliness"/"validity"/
  "profiling"/"quarantine". Real neighbours found in the mother document
  and confirmed distinct: L685/767/900/908/1925 "consistency" (Cross-
  impact Analysis's own scenario consistency, the F21 table row's own
  benefit-column "一致性", and `decision.ahp`'s own Consistency Ratio --
  a pairwise-comparison quality metric, already-built or unrelated
  methods in a different sense of the word); L1731/2771 "validity"
  (statistical/construct validity in a research-methodology sense --
  measurement validity, not data-quality validity); L4178/4181
  "completeness"/"accuracy" (Provenance completeness and Method-
  selection accuracy -- epistemic-label and meta-evaluation concepts,
  not this method's own data-quality dimensions); L3095/4118 "隔離"
  (isolation, in an incident-response and a data-classification sense,
  not this method's own "quarantine" formula step).

  **CORRECTED post-critic-review**: the first draft's own due diligence
  covered only the Atlas mother document, missing two directly relevant
  citations in this spec root's own sibling normative documents (the
  SAME two documents `database_data.reconciliation`'s and
  `database_data.data_contract`'s own contracts already cite for
  adjacent reasons): (1)
  `AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md` §35 Data
  Quality Engine (L1807-1821) -- a NINE-item automated pre-analysis
  checklist (Missing Values, Duplicates, Outliers, Impossible Values,
  Data Type Error, Sampling Bias, Leakage, Class Imbalance,
  Distribution Shift) with its own hard rule, "不得在資料品質嚴重異常時
  直接得出高信心結論" (must not draw a high-confidence conclusion while
  data quality is severely abnormal) -- the SAME underlying principle
  as Atlas's own F21 benefit line ("防垃圾資料造成高信心結論"), but a
  GENUINELY DIFFERENT, ML/statistics-specific vocabulary from Atlas
  §12.39's own six classic data-governance dimensions (see
  compilation_decisions for why this contract keeps Atlas's own
  vocabulary rather than adopting MP §35's); (2)
  `AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md`
  §30 Data Integrity Contract (L1154-1165) -- names "Quarantine Policy"
  as one of six required elements of any data change's own integrity
  contract, the authoritative EC-level grounding for Atlas's own
  "quarantine" formula step in a migration-specific context (this
  method's own quarantine mechanism applies more generally, to any
  dataset quality check, not only migrations -- consistent with, not
  contradicting, EC §30's narrower scope). EC §28 (L1077-1116, the
  Expand-Contract Migration "唯一正本" already cited by
  `database_data.expand_contract_migration`) was also checked in full
  and confirmed to have no Data Quality step of its own -- no citation
  owed there.

  No duplicate typed object or compute module found in the spec root.
  **CORRECTED post-critic-review**: the first draft's own claim that
  `devops_sre.sli_slo` shares this method's own "measured value vs.
  threshold" shape is FALSE -- `sli_slo`'s own `slo_target` is a
  free-text string (e.g. "p99 < 300ms，30 天滾動窗口") with no measured-
  value field and no comparison anywhere in that record; read again in
  full to confirm. The genuinely closest structural analogues are
  `devops_sre.load_test`/`devops_sre.soak_test`/`devops_sre
  .stress_test` (each compares a real MEASURED value against a caller-
  supplied acceptance threshold to derive a pass/fail-shaped status) --
  read in full and confirmed a different DOMAIN (system performance
  under load, not data-quality profiling). `devops_sre.capacity_model`'s
  own low/high threshold pair remains a genuinely different domain too
  (a three-way banding of a COMPUTED headroom ratio from a workload
  projection, not a measured-vs-declared threshold).

  This method's own formula ("rules→profiling→threshold→quarantine→
  owner") is GENUINE COMPUTE, the same class `database_data
  .reconciliation`/`devops_sre.capacity_model`/`database_data
  .normalization` already established: `passes_threshold` (per
  dimension) and the overall `quality_gate_status` are NOT caller-
  supplied -- always derived from each dimension's own raw
  `profiled_score`/`threshold`, re-verified fresh at the gate layer.
  FOUR optional fields are format-only soft links to already-built
  sibling records, resolving the two real pairings found above rather
  than re-modeling structure: `schema_ref` (`ERD-`, `database_data
  .erd`), `lineage_ref` (`DLR-`, `database_data.data_lineage`),
  `restore_drill_ref` (`DRILL-`, `database_data.backup_restore_drill`)
  -- together resolving the L4379 "Data Gate" quartet's other three
  pillars -- and `data_contract_ref` (`DC-`, `database_data
  .data_contract`), resolving `OQ-DC-2` (the field lives HERE, on the
  newer record, pointing back at the older one, the SAME direction
  every prior cross-`database_data`-slice soft link in this session
  already uses -- `database_data.normalization`'s own `schema_ref` to
  `erd`, `database_data.data_contract`'s own `schema_ref` to `erd`,
  rather than retrofitting a new field onto an already-shipped, already
  critic-reviewed sibling schema).

  Atlas's own qualifier "核心通常包括" (the core USUALLY includes these
  six) is read literally: `dimensions[]` requires AT LEAST ONE entry
  from the closed six-value enum, not all six -- a caller assessing a
  static reference table with no meaningful "Timeliness" dimension is
  not forced to invent one. Multiple entries for the SAME dimension are
  legal (e.g. two independent Completeness rules for two different
  critical columns) -- Atlas's own formula names no one-rule-per-
  dimension restriction.


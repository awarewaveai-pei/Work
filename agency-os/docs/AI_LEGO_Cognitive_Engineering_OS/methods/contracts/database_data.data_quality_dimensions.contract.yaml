id: database_data.data_quality_dimensions
version: "1.0.0"
family: database_data

cognitive_primitives: [DECOMPOSE, VALIDATE]
# INFERRED, not cited (Atlas gives no §4-style composition formula for
# this method). Separating a dataset's own data quality into per-
# dimension rule/profile/threshold entries is DECOMPOSE; the pass/fail
# derivation and overall gate status computation IS the validation act
# itself -- the same inferred pair `database_data.normalization`'s own
# contract already uses for a method whose formula's own back half is
# a derived classification, not an independently-assigned role.

purpose:
  - assess_a_dataset_against_one_or_more_data_quality_dimensions_and_derive_a_pass_or_quarantine_gate_status_from_measured_profiling_against_declared_thresholds
inputs:
  required: [DimensionAssessmentSet]
  optional: [SchemaReference, LineageReference, RestoreDrillReference, DataContractReference]
outputs: [DataQualityAssessmentRecord]
preconditions:
  - "dataset_or_topic is a non-empty string"
  - "dimensions has at least 1 entry; every entry's own dimension is one of {completeness, accuracy, consistency, uniqueness, timeliness, validity}; rule and owner are non-empty strings; profiled_score and threshold are finite real numbers in the closed range [0.0, 1.0] (explicitly rejecting infinity/NaN, the same guard devops_sre.capacity_model's own critic-caught lesson already established for threshold-bearing fields)"
  - "passes_threshold (per dimension entry) and quality_gate_status (overall) are NOT caller-supplied -- the builder computes them internally (profiled_score >= threshold per entry; quality_gate_status: PASS iff every entry passes, else QUARANTINED), and the gate independently re-derives and compares against the stored values, the same 'no parameter even lets a caller attempt to fake it' discipline devops_sre.capacity_model's own builder and database_data.normalization's own builder already establish"
  - "quarantined_dimensions is NOT caller-supplied -- always the list of dimension entries whose own passes_threshold is false, re-derived at the gate layer"
  - "schema_ref, when present, is a non-empty string beginning with ERD- (database_data.erd) -- a format-only soft link"
  - "lineage_ref, when present, is a non-empty string beginning with DLR- (database_data.data_lineage) -- a format-only soft link"
  - "restore_drill_ref, when present, is a non-empty string beginning with DRILL- (database_data.backup_restore_drill) -- a format-only soft link"
  - "data_contract_ref, when present, is a non-empty string beginning with DC- (database_data.data_contract) -- a format-only soft link resolving OQ-DC-2"
  # Preconditions 1-2 map onto 'rules'+'profiling'+'threshold'+'owner';
  # 3-4 onto the derived 'quarantine' step; 5-8 onto the Data Gate
  # quartet (L4379) and OQ-DC-2's own pairing.
quality:
  provenance_required: true
  evidence_labeling_required: false
  genuine_compute: true
  # Same class of departure database_data.normalization's own contract
  # already reasons through: passes_threshold/quality_gate_status are
  # CALCULATED RESULTS (a >= comparison), not narrative claims needing
  # evidence citations.
forbidden_transition: []
# Atlas §22.3's own gate table has no Data Quality Dimensions row.
recommended_next: []
# database_data.erd, database_data.data_lineage, database_data
# .backup_restore_drill, and database_data.data_contract are all
# ALREADY built and consumed here as real soft-link fields, not left as
# bare recommended_next entries -- the same "turn a real pairing into a
# field, not a narrative aside" discipline every prior database_data
# contract in this session already establishes.
rollback:
  side_effect_free: true
  # The RECORD itself is side-effect-free -- any real remediation of a
  # quarantined dataset happens outside this method's own scope, the
  # same "record describes an external structure" class every prior
  # database_data contract's own rollback field already draws.

compilation_decisions:
  - question: >
      ADDED post-critic-review. Master Plan §35 Data Quality Engine
      (L1807-1821) names a NINE-item pre-analysis checklist (Missing
      Values, Duplicates, Outliers, Impossible Values, Data Type Error,
      Sampling Bias, Leakage, Class Imbalance, Distribution Shift) --
      a genuinely different vocabulary from Atlas §12.39's own six
      classic dimensions (Completeness/Accuracy/Consistency/Uniqueness
      /Timeliness/Validity). Should this method's own `dimension` enum
      be widened to the union of both lists, or replaced with MP §35's
      own nine items?
    decision: "Keep Atlas §12.39's own six-value enum unchanged. Do not merge or replace with MP §35's own vocabulary."
    reasoning: >
      The two lists answer genuinely different questions, not two
      overlapping phrasings of the same one. Atlas §12.39's six
      dimensions are the classic DATA-GOVERNANCE quality framework
      (structural/consistency properties of a dataset AT REST, equally
      meaningful for a single database table with no statistical or ML
      use in mind -- e.g. "is customer_email ever null" is Completeness,
      independent of any model). MP §35's nine items are a STATISTICS/
      ML-SPECIFIC pre-modeling checklist (Outliers, Leakage, Class
      Imbalance, and Distribution Shift are meaningless outside a
      statistical/ML analysis context -- there is no "class imbalance"
      in a customer address table). Atlas's own F21 tool table places
      this method in the "資料庫／資料套件 (DB / Data Pack)" family
      (F21), a general database-quality toolset, not inside any
      statistics- or ML-specific pack -- the citation this contract's
      own machine_id and family assignment are grounded in is §12.39,
      not MP §35. Widening the enum to MP §35's own items would
      silently absorb a DIFFERENT method's own subject matter (an ML
      pre-analysis gate) into a database-quality record, the same
      "inventing structure a different, uncited method actually owns"
      class this package's own restraint discipline already guards
      against elsewhere. MP §35's own checklist remains a real,
      disclosed citation (this method's own benefit line and MP §35's
      own hard rule state the identical underlying principle -- do not
      draw high-confidence conclusions from bad data) without being
      absorbed into this method's own field design; a future,
      dedicated ML-pre-analysis method (if one is ever built) would be
      the correct home for MP §35's own nine items, not a retrofit
      here.
  - question: >
      This method's own gate re-derives `passes_threshold`/
      `quality_gate_status` from the record's own raw `profiled_score`,
      but has no way to verify the `profiled_score` itself was measured
      honestly (a caller could invent a `profiled_score: 0.99` for a
      column that is, in reality, 40% null). What does this method's
      own genuine-compute guarantee actually cover?
    decision: "The gate proves INTERNAL CONSISTENCY (the stored classification correctly follows from the stored scores), not MEASUREMENT TRUTH (that the stored scores themselves reflect reality)."
    reasoning: >
      ADDED post-critic-review, stating explicitly a limit every prior
      genuine-compute record in this session shares implicitly:
      `profiled_score` is itself caller-supplied input, the same
      epistemic position `database_data.normalization`'s own
      `functional_dependencies` occupies (trusted domain knowledge this
      method cannot independently verify against real data it is never
      given). An internally-consistent forgery (a caller inventing both
      a `profiled_score` and letting the builder correctly derive
      `passes_threshold` from it) passes every gate -- because it IS
      internally consistent, which is the only thing genuine compute
      can prove without direct access to the real dataset. This is not
      a gap unique to this method; stating it here plainly is more
      honest than leaving it implicit.
  - question: >
      Atlas's own formula names "rules" and "profiling" as separate
      steps but gives no structured vocabulary for either (no rule
      grammar, no profiling-tool output schema). Should this contract
      invent one?
    decision: "Free text for 'rule' (the human-readable expectation); a single normalized profiled_score in [0.0, 1.0] for 'profiling' (the measured result of applying that rule)."
    reasoning: >
      Atlas gives no rule grammar or profiling-tool schema to transcribe
      (unlike database_data.erd's own attribute shape, which DOES have
      a real referential-integrity structure to enforce). Inventing a
      structured rule-condition language (e.g. parsing 'column X NOT
      NULL') would be exactly the kind of unstated-assumption invention
      this package's every prior contract already disciplines itself
      against -- the same restraint database_data.erd's own free-text
      constraints[] and database_data.data_contract's own free-text
      compatibility_policy already establish. A single [0.0, 1.0] score
      is the natural, engine-agnostic normalization of "how well did
      this profiling run satisfy the rule" -- comparable to a threshold
      without inventing units.
  - question: >
      Atlas's own qualifier reads "核心通常包括" (the core USUALLY
      includes these six dimensions) -- should this method REQUIRE all
      six dimensions to be assessed, or allow a subset?
    decision: "A subset is legal -- dimensions[] requires at least 1 entry from the six-value enum, not all six."
    reasoning: >
      "通常" (usually) is Atlas's own qualifier, not "必須" (must). A
      caller assessing a static reference table (e.g. a country-code
      lookup) has no meaningful "Timeliness" dimension to profile;
      forcing an invented, meaningless entry to satisfy an artificial
      completeness requirement would be worse than allowing a genuinely
      partial assessment. The mandatory-gate framing (Atlas's own
      benefit line, "任何統計、ML、策略分析前的 mandatory gate") is
      satisfied by requiring AT LEAST ONE real dimension, not by forcing
      all six regardless of relevance.
  - question: >
      Should `dimensions[]` require a unique dimension value per entry
      (at most one Completeness rule, at most one Accuracy rule, etc.),
      or allow repeats?
    decision: "Repeats are legal -- multiple entries may share the same dimension value."
    reasoning: >
      Atlas's own formula names no one-rule-per-dimension restriction,
      and a real dataset commonly needs MULTIPLE independent rules under
      the same dimension (e.g. a Completeness rule for column A and a
      separate Completeness rule for column B). Inventing a uniqueness
      restriction Atlas does not ask for would silently prevent a
      legitimate, common real-world assessment shape.
  - question: >
      Should `quarantined_dimensions` store the FULL dimension entry
      (rule/profiled_score/threshold/owner) or just a reference (e.g. an
      index) into `dimensions[]`?
    decision: "The full entry, duplicated inline."
    reasoning: >
      Atlas's own 'quarantine' step benefits directly from self-
      contained evidence -- a consumer inspecting quarantined_dimensions
      should not have to cross-reference back into dimensions[] by
      position to understand WHY something was quarantined. This
      mirrors database_data.reconciliation's own resolution-carrying
      check entries and database_data.normalization's own self-
      contained violation-list entries -- the family's own established
      convention for "evidence should travel with the finding".
  - question: >
      §10's own Causal recipe row (L1108) recommends this method
      immediately follow `root_cause.dag` -- should this record add a
      soft link BACK to a `root_cause.dag` (or `causal.dag`) record, the
      same direction database_data.normalization's own schema_ref
      points at database_data.erd?
    decision: "Not in this revision -- disclosed as OQ-DQD-4, not silently unlinked."
    reasoning: >
      Unlike the Data Gate quartet (L4379, a stable, closed four-member
      set this contract already resolves in full) and OQ-DC-2 (an
      EXPLICIT, already-filed forward pointer this contract directly
      answers), the Causal recipe pairing is a RECOMMENDED SEQUENCE in
      a problem-selection guide, not a data-correctness pairing this
      method's own formula names. Adding a fifth soft-link field on
      SPECULATION, without an existing filed OQ or a closed citation
      set to bound it, risks exactly the kind of scope creep this
      package's own restraint discipline already guards against
      elsewhere. Disclosed as a real, findable pairing for a future
      revision (or for `root_cause.dag`'s own contract to add the
      pointer in the other direction) rather than silently ignored.

open_questions:
  - id: "OQ-DQD-1"
    question: "id mints a machine_id method-inventory.yaml never carried -- should method-inventory.yaml be updated (has_contract:true, machine_id, corrected line field)?"
    owner: "operator, or a future session with explicit write scope over method-inventory.yaml"
    blocks: "nothing in this file's own validity"
  - id: "OQ-DQD-2"
    question: >
      `profiled_score`/`threshold` are single normalized [0.0, 1.0]
      values with no structured provenance of HOW the score was
      computed (which profiling tool, what sample size, what population
      the score is relative to). Should a future revision add
      structured profiling metadata?
    owner: "operator, or whoever next revises this contract's own field design"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap"
  - id: "OQ-DQD-3"
    question: >
      None of the four soft-link fields (schema_ref/lineage_ref/
      restore_drill_ref/data_contract_ref) is cross-validated against
      this record's own dimensions[] or dataset_or_topic -- a caller
      could supply four refs describing an entirely unrelated dataset.
      This method cannot see any referenced record's own content
      (format-only soft link, the same declared limit every prior
      soft-link field in this package already carries). Should a future
      revision add a runtime cross-check?
    owner: "operator, or whoever next revises this contract's own scope"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap"
  - id: "OQ-DQD-4"
    question: >
      §10's own Causal recipe row (L1108: "DAG→Data Quality→
      Identification→Compute→Sensitivity") recommends this method
      immediately follow a causal-DAG method (already built this
      session as a graph-shaped method under a different family).
      Should a future revision add a soft link, or should that method's
      OWN contract add the pointer in the other direction instead (the
      same direction database_data.normalization's own schema_ref
      points backward at database_data.erd)?
    owner: "operator, or whoever next revises either contract's own scope"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap"

verification:
  method: >
    Read Atlas's F21 tool table row (L904), §12.39 (L3066-3082), the
    §10 Causal recipe row (L1108), the 分析導向 recipe chain
    (L3644-3654), and the §26-area 'Data 正確' architecture invariant
    row (L4379) directly. Broad case-insensitive grep across the full
    mother document and spec root for "data quality"/"completeness"/
    "accuracy"/"consistency"/"uniqueness"/"timeliness"/"validity"/
    "profiling"/"quarantine" -- every non-citation hit read and
    confirmed distinct (see description above). Read `devops_sre
    .sli_slo` and `devops_sre.capacity_model` in full to confirm their
    own threshold-comparison SHAPE is a genuinely different DOMAIN, not
    a duplicate. Validated against specs/cognitive/method.schema.yaml
    with jsonschema.Draft202012Validator.
  note: >
    No mother document was modified. The 'rules→profiling→threshold→
    quarantine→owner' formula and the six-dimension list are both
    directly transcribed. The single normalized [0.0, 1.0] profiled
    -score/threshold shape, the subset-not-all-six dimension
    requirement, repeat-dimension legality, and the self-contained
    quarantined_dimensions evidence shape are all disclosed compilation
    choices, not silent inventions -- see compilation_decisions above.

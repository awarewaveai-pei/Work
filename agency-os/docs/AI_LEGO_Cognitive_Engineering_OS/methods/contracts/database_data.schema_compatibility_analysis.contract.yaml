id: database_data.schema_compatibility_analysis
version: "1.0.0"
family: database_data

cognitive_primitives: [DECOMPOSE, CLASSIFY, VALIDATE]
# INFERRED, not cited (Atlas gives no §4-style composition formula for
# this method). Splitting a migration into individual changes is
# DECOMPOSE; mapping each into the closed compatible/breaking vocabulary
# is CLASSIFY; the worst-of-all reduction plus structural checks is
# VALIDATE -- same inferred-triple discipline every prior database_data
# contract already uses (expand_contract_migration/data_contract both
# used [DECOMPOSE, MAP, VALIDATE]; CLASSIFY replaces MAP here since the
# per-change operation is a closed-vocabulary lookup, not a soft-link
# assignment).

purpose:
  - classify_individual_schema_changes_and_derive_a_genuine_compute_zero_downtime_verdict
inputs:
  required: [ChangeSet]
  optional: [MigrationReference]
outputs: [SchemaCompatibilityAnalysisRecord]
preconditions:
  - "changes has at least 1 entry; every entry is a well-shaped {change_type, target, notes?} dict; change_type is one of the 13 closed vocabulary values; target is non-empty"
  - "no two changes share the exact same (change_type, target) pair -- target alone is NOT required unique (one migration may apply multiple different changes to the same target)"
  - "migration_ref, when present, is a non-empty string beginning with ECMIG- (the database_data.expand_contract_migration record id prefix) -- a format-only soft link"
  - "change_classifications/overall_verdict are NEVER accepted parameters -- always computed fresh via ai_lego.compute.schema_compatibility.classification, re-derived independently by the gate"

quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same departure every prior database_data contract already reasons
  # through: the real risk is classification/aggregation integrity (does
  # the stored verdict match the real worst-of-all derivation), not an
  # evidence-citation risk over a narrative claim.

forbidden_transition: []
# Atlas §22.3's own gate table has no Schema Compatibility Analysis row (grep-confirmed).

recommended_next: [database_data.expand_contract_migration]
# EC §28's own sequence: Compatibility Analysis (stage 3) directly
# precedes Expand (stage 5) -- this record's own id is the natural
# evidence_ref an expand_contract_migration stage("compatibility_analysis", ...)
# entry can cite (that method's own compilation_decisions already
# disclose evidence_ref as an unfetched, uninterpreted soft link).

rollback:
  side_effect_free: true
  # The RECORD itself is side-effect-free -- it analyzes a proposed
  # change set; it does not itself execute any schema change.

compilation_decisions:
  - question: "Is this genuinely distinct from expand_contract_migration's own compatibility_analysis stage or data_contract's own compatibility_policy/compatibility_ref, or already fully subsumed by one of them?"
    decision: "Genuinely distinct -- built for real, not a contract-only reuse. expand_contract_migration's stage is presence+timestamp only (WHEN, not WHAT); data_contract's field is a free-text policy statement + soft link (caller-asserted, not computed). Neither performs per-change classification or aggregate-verdict derivation."
  - question: "database_data.retention_deletion_model.contract.yaml already investigated this exact row and concluded 'already fully covered, not a build candidate' -- reached independently, in the same session, by a different agent. Which conclusion is right?"
    decision: "This contract's own (build it) -- that investigation's own citation list omits Atlas §28 快速選工具表 L4482 (checked directly, absent), which independently names Schema Compatibility as a tool distinct from Expand–Contract. Its own reasoning ('no formula beyond the EC §28 redirect' = nothing to build) is also not this session's own actual bar: architecture.trade_off_matrix (the one real prior contract-only-reuse precedent) was skipped for FIELD-FOR-FIELD IDENTICAL output shape to decision.mcda, not for thin Atlas grounding -- decision.ice/decision.rice were both built this session with equally thin/absent Atlas formulas. Flagged for the orchestrating session to reconcile retention_deletion_model.contract.yaml's own now-inaccurate description/source_of_truth_for -- out of this contract's own scope to edit that sibling file directly."
  - question: "Should change_type be an open string, or a closed, disclosed vocabulary?"
    decision: "Closed 13-value vocabulary (ai_lego/compute/schema_compatibility/classification.py::CHANGE_TYPE_COMPATIBILITY), disclosed as external domain knowledge (not Atlas-cited) -- same class decision.ice's own 1-10 scale and decision.rice's own reach unit already establish for this package."
  - question: "Should compatibility classification be a directional BACKWARD/FORWARD split (Confluent schema-registry style), or a single binary compatible/breaking class?"
    decision: "Binary only. Atlas's own row gives no directional vocabulary, and every one of the task's own explicit worked examples is already binary."
  - question: "Should target be required unique across changes[] the way erd's attribute names / data_contract's field names are?"
    decision: "No. One real migration legitimately applies multiple different changes to the same target (e.g. narrow_type + tighten_nullable_to_not_null on one column) -- only a literal (change_type, target) duplicate is refused."


description: >
  Tier 1, F14 feasibility & economics family (Atlas L727), first of two F14 members built this batch (with
  feasibility.npv). New family opened this batch, zero prior siblings. Not an EC §32 security-change method. Core
  invariant: `break_even_volume_units` is GENUINE_COMPUTE via `fixed_cost / contribution_margin_per_unit`, never
  caller-supplied; `contribution_margin_per_unit <= 0` is refused with its own distinct
  BREAKEVEN_NONPOSITIVE_CONTRIBUTION_MARGIN code (a non-positive margin means no finite volume ever breaks even).
  See ai_lego/modules/feasibility/break_even.py module docstring for the full formula and tolerance rationale.


title: "5W1H Problem-Profile Method Contract"
status: ACTIVE

description: >
  Tier 1, 4th F01 framing family member. Atlas's ONLY citation is the F01 table row
  (L340: "5W1H｜快速建立問題輪廓｜資訊不足時｜Who/What/When/Where/Why/How｜找資訊缺口｜Problem Statement"),
  corroborated by dedicated §12.1 (L2544-2550: "低門檻、跨文化容易理解...只負責探索,不代表已完成根因分析")
  and the F01 mermaid flowchart (L348-354: 模糊需求 -> 5W1H -> Problem Statement -> ...). Benefit column
  "找資訊缺口" (find information gaps) is the STRUCTURAL POINT: the record must expose which of the 6
  dimensions are still unanswered, not merely store 6 answers. Core invariant: every dimension is EITHER
  answered (non-empty answer, no gap_note) OR explicitly unknown (no answer key at all, optional gap_note) --
  never silently coerced to an empty string that reads as "answered: nothing". ``information_gaps`` is
  GENUINE_COMPUTE, re-derived from ``dimensions[].status`` by both the builder and an independent gate,
  never caller-asserted.


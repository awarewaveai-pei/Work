$id: "ai-lego://methods/contracts/computation.monte_carlo.contract.yaml"
title: "Monte Carlo Simulation Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry (mandated by the actively-running Cognitive OS
  runtime slice, same class of justification as every Tier 1 contract this
  session built). Eleventh Method Atlas slice, and the FIRST from a family
  that is NOT one of Atlas's own numbered F01-F24 categories --
  `methods/registry/method-inventory.yaml`'s own catalog row for this
  method (L1437-1441) explicitly labels its `category` as "computation
  (uncataloged in F01-F24)", not a synthetic label this contract invented.
  `family: computation` transcribes that same word, and independently
  matches Atlas §3's own primitive-category letter table (L146: "F.
  Computation | 哪些必須真算？ | Python / R / SQL / Stats / Simulation") --
  two independent citations for the same family name, disclosed together
  rather than picking either alone.

  Atlas §11.29 (L1858-1883) gives this method a dedicated section: purpose,
  a real 5-node mermaid pipeline ("Input Distributions -> Monte Carlo N
  Runs -> Outcome Distribution -> {Success Probability, Sensitivity, Tail
  Risk}"), a concrete 6-step usage protocol (define input distributions;
  check correlation/dependency; set a random seed; run enough simulations;
  output a distribution, not just a mean; do sensitivity/tail analysis),
  and named benefits that literally cite P95 as a worked example ("可回答
  P(success)、P95 cost、loss tail", L1880). §22.3's own Method-specific
  Gate table (L4153) gives this contract a directly-cited
  forbidden_transition -- the SAME table that already grounded
  `challenge.red_team.contract.yaml` (L4152) and
  `decision.mcda.contract.yaml` (L4154), a third Tier 1 contract in a row
  drawing from this table.

  First method this session that is genuinely STOCHASTIC rather than
  deterministic in its own subject matter -- yet still satisfies this
  codebase's Trusted Compute discipline: a caller-supplied, schema-required
  `random_seed` makes the entire run byte-for-byte reproducible (same seed,
  same sequence of pseudo-random draws, same output), the same
  `engine: local_python_deterministic_compute` guarantee every genuine-
  compute typed object in this directory already carries -- "stochastic
  subject matter" and "deterministic, reproducible COMPUTATION of that
  subject matter" are not in tension; see `compilation_decisions` for the
  explicit disclosure of why this is not a contradiction.


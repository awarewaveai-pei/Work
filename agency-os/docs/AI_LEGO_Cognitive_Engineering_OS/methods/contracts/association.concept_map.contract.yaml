id: association.concept_map
version: "1.0.0"
family: association

cognitive_primitives: [ASSOCIATE, MAP, RELATE]
# INFERRED, not cited. Family name itself is ASSOCIATE; Atlas's own row-name "Concept Map" is MAP; "節點＋
# typed relations" is RELATE -- all three are members of primitive.schema.yaml's own 24-primitive kernel.

purpose:
  - connect_concepts_via_typed_semantic_relationships_for_knowledge_graph_mapping_and_reasoning
inputs:
  required: []
  optional: []
  # Atlas's own F04 row/section gives no upstream typed-object dependency for Concept Map, same "no required
  # input" class framing.five_w_one_h's own contract already establishes for its own F01 sibling.
outputs: [ConceptMapRecord]
preconditions:
  - "nodes is a list of at least 2 well-shaped {id, label} entries with unique ids"
  - "edges is a non-empty list; every edge carries a non-empty relationship_type (Atlas §11.2 step 2, unconditional)"
  - "every edge's from_node_id/to_node_id resolves to a real node id declared in the SAME record's own nodes -- a dangling reference is refused"
  - "every edge with provenance.epistemic_type == EVIDENCE cites at least 1 supporting_evidence_refs entry (Atlas §11.2 step 3)"
  - "orphan_node_ids always present (empty is meaningful) and MUST equal the set of node ids referenced by zero edges, in nodes order -- re-derived, never caller-trusted"
quality:
  provenance_required: true
  evidence_labeling_required: true
forbidden_transition: []
# Atlas gives this method no forbidden_transition citation (only the table row + §11.2, no §22.3 Method-
# specific Gate table hit -- grep-confirmed, association.concept_map is not among that table's rows) -- left
# genuinely empty rather than inventing one.
recommended_next: [causal.dag]
# Atlas's own L412 最佳搭配 column names "Causal DAG" -- ALREADY BUILT (id: causal.dag), confirmed by direct
# grep before writing (this task's own brief assumed it was unbuilt; corrected here per R4 claim-before-
# verify). Atlas §11.2 step 5 ("因果關係若要進一步證明，轉 Causal DAG") corroborates the same pairing.

compilation_decisions:
  - question: "Should edges carry a dedicated is_inference boolean, or reuse provenance.epistemic_type as the sourced-vs-inferred axis?"
    decision: "Reuse provenance.epistemic_type (no new boolean). Two direct sibling precedents (causal.dag's own edges, framing.five_w_one_h's own dimension entries) already use this axis for the same sourced-vs-inferred distinction, checked gate-only via evidence_labeling_required, not construction-enforced -- matched here rather than inventing a redundant field."
  - question: "Should nodes require their own per-node provenance?"
    decision: "No. Atlas's step 1 names no node-level epistemic labeling; causal-dag-analysis.schema.yaml's own closest-sibling nodes already omit it for the same reason -- only edges carry provenance."
  - question: "Should a record with zero edges be legal (a bare node list)?"
    decision: "No -- edges: minItems 1. Atlas's own F04 contrast (L420-426) defines Concept Map BY its typed edges; a zero-edge record would not exercise this method's own structural point."
  - question: "Is orphan_node_ids worth building as GENUINE_COMPUTE, given Atlas's own benefit column doesn't literally say 'find orphans'?"
    decision: "Yes -- same un-cited-but-benefit-grounded class framing.boundary_critique's own empty_categories already establishes. An unreferenced node contributes zero relations to the graph, directly weakening the cited '可直接映射 Knowledge Graph' benefit (§11.2, L1200-1202)."

open_questions:
  - "OQ-CONCEPTMAP-1: this task's own brief assumed causal.dag (Atlas's own recommended-next pairing) was unbuilt; direct grep before writing confirmed it IS already built and ACTIVE. recommended_next above cites it for real rather than leaving it empty pending a future integration pass.（owner: operator, informational correction only)"
  - "OQ-CONCEPTMAP-2: should an individual causal-flavored edge carry a forward soft-link to a promoted causal.dag record once Atlas §11.2 step 5's 'further proof' conversion happens? Left unaddressed -- out of this slice's own 5-file scope, no such field added.（owner: operator, or whoever next builds a concept-map-to-causal-dag promotion flow)"


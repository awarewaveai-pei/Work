  max_loss/max_time/min_quality must carry a concrete value, and every
  threshold names a non-empty owner -- both checked at construction and
  independently re-derived at the gate.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F17 table row (L808): 'Kill Criteria | 事前定義停止條件 | max loss/time/quality threshold | 控制下行風險'"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §16.1 Idea Object, decision sub-block (L3737-3741): `kill_criteria` (L3740) ellipsis field, sibling to `reversal_conditions` (L3741) -- both listed as separate fields, not aliases"
  - "methods/contracts/learning.reversal_criteria.contract.yaml (same family, structurally adjacent -- read in full to independently confirm the sibling distinction, see compilation_decisions)"
  - "specs/cognitive/method.schema.yaml -- the schema this file's body is validated against"

decided_by: >
  No ADR governs the content. Registered in
  methods/registry/contract-backlog.yaml tier_1, same class of

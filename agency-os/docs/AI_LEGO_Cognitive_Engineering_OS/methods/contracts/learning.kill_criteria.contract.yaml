title: "Kill Criteria Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry, mandated by the actively-running Cognitive OS
  runtime slice. Atlas F17 tool table, Kill Criteria row (L808): "事前定義
  停止條件 | max loss/time/quality threshold | 控制下行風險". No dedicated
  Atlas section beyond the table row (grep-confirmed: only L2408
  Pilot/Kill/Reversal pairing and L4501 rule 10 otherwise mention "Kill
  Criteria"; §16.1 Idea Object's own `decision` sub-block, L3740, names the
  field `kill_criteria` as a bare ellipsis). Second `learning` family (F17)

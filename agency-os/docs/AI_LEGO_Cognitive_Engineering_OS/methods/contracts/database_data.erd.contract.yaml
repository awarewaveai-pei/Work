decided_by: >
  No ADR governs the content. Registered in
  `methods/registry/contract-backlog.yaml` `tier_1` as a
  thirty-seventh concrete entry. `id: database_data.erd` mints a new
  machine_id, FIFTH member of the `database_data` family.

id: database_data.erd
version: "1.0.0"
family: database_data

cognitive_primitives: [DECOMPOSE, MAP, VALIDATE]
# INFERRED, not cited (Atlas gives no §4-style composition formula for
# this method). Separating a schema into entities/attributes/
# relationships/constraints is DECOMPOSE; assigning keys and cardinality
# direction is MAP; the referential-integrity checks and the
# at-least-one-key-per-entity check are VALIDATE -- the same inferred
# triple every prior structured-record method this session built
# already uses.

purpose:
  - model_a_database_schemas_entities_attributes_keys_relationships_and_constraints_as_one_internally_referentially_consistent_record
inputs:
  required: [EntitySet, RelationshipSet]
  optional: [ConstraintSet, MigrationReference]
outputs: [ErdRecord]
preconditions:
  - "system_or_database is a non-empty string"
  - "entities has at least 1 entry; entity names are unique within the record; each entity has at least 1 attribute; attribute names are unique within that entity; each entity has at least one attribute flagged is_primary_key:true"
  - "every relationships[] entry's own from_entity and to_entity both name a real entity in entities[]"
  - "every relationships[] entry's own foreign_key_attributes[] has at least 1 entry, and EVERY entry names a real attribute of that entry's own from_entity (a composite foreign key is one relationship entry with multiple foreign_key_attributes, not multiple independent relationship entries)"
  - "every relationships[] entry's own cardinality is one_to_one or many_to_one (many_to_many is modeled via a junction entity with two many_to_one relationships, not a third enum value -- see compilation_decisions)"
  - "constraints is a required array (may be empty) of non-empty strings"
  - "migration_ref, when present, is a non-empty string beginning with ECMIG- (the database_data.expand_contract_migration record id prefix) -- a format-only soft link"
  # Preconditions 2 maps onto Atlas's own 'entities'+'keys' formula
  # steps; 3-5 onto 'relationships'; 6 onto 'constraints'; 7 onto
  # §11.47's own migration 起點 benefit. Same "structurally necessary,
  # forbidden-state" class every prior genuine-compute-or-structural
  # contract this session built already establishes.
quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class of departure every structured-record contract in this
  # package already reasons through: the real risk is MODELING
  # integrity (is the schema internally referentially consistent), not
  # an evidence-citation risk over a narrative claim.
forbidden_transition: []
# Atlas §22.3's own gate table has no ERD row.
recommended_next: []
# CORRECTED post-critic-review: Atlas's own §11.47 L2305 DOES give an
# explicit 推薦搭配 chain -- "可作為 migration 與 data contract 的起
# 點" -- unlike this session's every OTHER "Atlas gives no explicit
# chain" contract. The migration half is now a REAL field
# (`migration_ref`, format-only soft link to database_data
# .expand_contract_migration's own output), not left as a bare
# disclosed-but-unbuilt relationship; the data-contract half remains
# unbuilt (database_data.data_contract does not exist yet) -- see
# OQ-ERD-4.
rollback:
  side_effect_free: true
  # The RECORD itself is side-effect-free -- the real database schema
  # it models is created/migrated outside this method's own scope, the
  # same "record describes an external structure" class every prior
  # database_data contract's own rollback field already draws.

compilation_decisions:
  - question: >
      This record models a schema with REQUIRED foreign-key fields on
      every relationship. Is this a conceptual Chen-style ER diagram
      (where relationships can exist without a physical FK column), or
      a physical/logical relational schema? The first draft made this
      choice implicitly and never stated it.
    decision: "A PHYSICAL/LOGICAL relational schema (foreign-key-bearing), not a conceptual ER diagram -- now explicitly disclosed."
    reasoning: >
      Atlas's own §11.47 benefit line reads "建立 DB SCHEMA 的共同語言"
      (build a common language for the DB schema specifically, not a
      conceptual data model in the abstract) -- this supports the
      physical reading directly. Within this declared scope, every
      relationship having a real FK column is not an invented
      restriction; it is the definition of what a physical schema's own
      relationships ARE. A caller wanting to record a pre-physicalization
      conceptual model (a relationship with no FK column yet, e.g. "these
      two entities are related, cardinality TBD") is out of this
      method's own declared scope -- disclosed as OQ-ERD-6, not silently
      unsupported.
  - question: >
      Atlas's own §11.47 formula names `cardinality` as a modeling
      target but gives no value vocabulary (no enum, no worked
      example). Should this contract adopt the common four-value ERD
      taxonomy (one_to_one/one_to_many/many_to_one/many_to_many), or a
      narrower one? CORRECTED post-critic-review: the first draft's own
      premise ("Atlas names no cardinality vocabulary") was imprecise --
      Atlas DOES name cardinality (§11.47 L2300), it simply gives no
      VALUES for it.
    decision: "Two values only: one_to_one and many_to_one, from from_entity's own perspective (the side holding the foreign key) -- within this record's own declared physical-schema scope."
    reasoning: >
      This record's own `foreign_key_attributes` field is REQUIRED and
      always lives on `from_entity` -- that structural choice already
      fixes the relationship's own direction: a foreign key column (or
      column set) structurally means "many rows here reference one row
      there" (many_to_one), or "at most one row here references one row
      there" if the FK column(s) are additionally unique (one_to_one). A
      conceptual `one_to_many(A→B)` is NOT lost -- it is the exact same
      real-world relationship as `many_to_one(B→A)`, just expressed from
      the other entity's own perspective, which this record's own field
      design already requires (whichever entity holds the FK is
      `from_entity` by definition). `many_to_many` genuinely IS always
      realized as a junction entity with two `many_to_one` relationships
      **in a physical relational schema** -- CORRECTED post-critic-review:
      the first draft's own claim that "every real ERD NOTATION (Chen,
      Crow's Foot, UML)" requires this was FALSE. Chen's own 1976
      entity-relationship model, Crow's Foot notation, and UML class
      diagrams all draw conceptual M:N directly (a diamond, crow's feet
      on both ends, or a `*..*` association respectively) with no
      association/junction entity required at the CONCEPTUAL level -- the
      junction table is a PHYSICAL-MAPPING step, not a notation rule. The
      corrected claim, scoped to this record's own declared physical-
      schema domain, is accurate: this record cannot express conceptual
      M:N directly, by design (see the physical-schema compilation
      decision above), and a caller with a genuine M:N must resolve it to
      a junction entity before recording it here -- disclosed, not
      silently unsupported.
  - question: >
      Should `constraints[]` be structured (e.g. parsing
      "entity.attribute: constraint_text" into an
      {entity, attribute, rule} object), or free text?
    decision: "Free text, no parsing, no structure."
    reasoning: >
      Atlas's own formula names "constraints" as a step with zero
      further elaboration -- no attribute-level rule grammar, no
      severity, no scope. Inventing a parseable grammar (which entity,
      which attribute, which rule type) would be exactly the kind of
      unstated-assumption invention this package's every prior contract
      already disciplines itself against -- the same restraint
      `database_data.backup_restore_drill`'s own `issues_recorded`
      field and `devops_sre.rto_rpo`'s own free-text `tier` already
      establish for an analogous "Atlas names the concept, not its
      internal structure" gap.
  - question: >
      Should entity/attribute name uniqueness be case-sensitive or
      case-insensitive (e.g. is "Orders" the same entity as "orders")?
    decision: "Case-sensitive exact string match."
    reasoning: >
      Real database identifiers are frequently case-sensitive
      (PostgreSQL's own quoted identifiers, for one) and Atlas's own
      text gives no basis for inventing a case-folding rule; exact
      match is the conservative default that never silently merges two
      names a caller intended to keep distinct. A caller modeling a
      case-INsensitive database can simply supply already-normalized
      names.
  - question: >
      Should this contract reject two relationships with the SAME
      (from_entity, to_entity, foreign_key_attributes) triple that
      disagree on cardinality (e.g. one says one_to_one, another says
      many_to_one for the identical column set)?
    decision: "No -- relationships[] is not deduplicated, and cardinality is a caller-supplied assertion this method does not independently verify against any other field."
    reasoning: >
      Atlas's own formula gives no rule about relationship uniqueness or
      about cross-checking cardinality against a UNIQUE constraint this
      record's own attribute shape has no field for anyway (there is no
      `is_unique` flag on an attribute to verify `one_to_one` against).
      Inventing a de-duplication or cross-check rule Atlas does not ask
      for would be exactly the kind of unstated-assumption invention this
      package's every prior contract already disciplines itself against.
      A caller who supplies two contradictory entries has made an
      authoring mistake this method cannot detect without a field it
      does not have -- disclosed as a real, known limit (OQ-ERD-5), not a
      silent gap.

open_questions:
  - id: "OQ-ERD-1"
    question: "id mints a machine_id method-inventory.yaml never carried -- should method-inventory.yaml be updated (has_contract:true, machine_id, corrected line field)?"
    owner: "operator, or a future session with explicit write scope over method-inventory.yaml"
    blocks: "nothing in this file's own validity"
  - id: "OQ-ERD-2"
    question: >
      No structured field exists for a relationship's own optionality
      (is the foreign key column itself NULLABLE, i.e. is the
      relationship optional or mandatory from from_entity's own side)?
      Atlas's own formula names no such distinction. Should a future
      revision add one?
    owner: "operator, or whoever next revises this contract's own field design"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap"
  - id: "OQ-ERD-3"
    question: >
      F21's own Normalization row (L900: '1NF→2NF→3NF/BCNF；必要時有意識
      denormalize') could take an ErdRecord's own entities as its input
      and check for normal-form violations (e.g. a non-key attribute
      that depends on only part of a composite key). Should a future
      `database_data.normalization` slice consume this record's own
      output as a soft link?
    owner: "operator, or whoever next builds database_data.normalization"
    blocks: "nothing in this file's own validity"
  - id: "OQ-ERD-4"
    status: "ANSWERED (2026-09-06) -- database_data.data_contract now exists and its own `schema_ref` field (ERD- prefix, optional) is exactly this soft link. See methods/contracts/database_data.data_contract.contract.yaml."
    question: >
      F21's own Data Contract row (L902: 'schema→semantics→quality/SLO→
      ownership→compatibility') AND §11.47's own explicit "起點" benefit
      both point at this method as a starting point for a future
      `database_data.data_contract` slice. Should that future slice add
      a soft link to this record's own output (the same
      `migration_ref`-class field this contract already added for the
      migration half of the same benefit sentence)?
    owner: "operator, or whoever next builds database_data.data_contract"
    blocks: "nothing in this file's own validity"
  - id: "OQ-ERD-5"
    question: >
      A critic review confirmed `relationships[]` is not deduplicated
      and `cardinality` is an unverified caller assertion (see
      compilation_decisions) -- two relationship entries with the
      identical (from_entity, to_entity, foreign_key_attributes) triple
      but contradictory cardinality both pass every gate today. Should
      a future revision add an `is_unique` flag to `#/$defs/attribute`
      (or to the relationship entry itself) so `one_to_one` becomes
      independently verifiable rather than a bare assertion?
    owner: "operator, or whoever next revises this contract's own field design"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap"
  - id: "OQ-ERD-6"
    question: >
      This record's own scope is a PHYSICAL/LOGICAL relational schema
      (every relationship requires a real foreign key). A caller wanting
      to record a PRE-PHYSICALIZATION conceptual model (entities related
      with no FK column decided yet, or a genuine conceptual many-to-many
      before junction-table design) cannot use this record as-is. Should
      a future revision add an optional conceptual-modeling mode, or is
      that a genuinely separate method (closer to Atlas's own generic
      "Domain Model" language elsewhere) this contract should not absorb?
    owner: "operator, or whoever next revises this contract's own scope"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap"


$id: "ai-lego://methods/contracts/database_data.erd.contract.yaml"
title: "ERD Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry. Thirty-ninth Method Atlas slice, FIFTH from the
  `database_data` family (F21's own "資料庫／資料套件 (DB / Data Pack)"),
  after `database_data.backup_restore_drill` (twenty-fifth),
  `database_data.data_lineage` (twenty-eighth), `database_data
  .expand_contract_migration` (thirtieth), and `database_data
  .reconciliation` (twenty-ninth). First `database_data` member built
  since F19's `devops_sre` family completed (13/13) in the immediately
  prior slice.

  Atlas gives this method TWO citations: the F21 tool table's ERD row
  (L899: purpose "建模 entity/attribute/relationship"; usage "entities→
  keys→relationships→constraints"; benefit "建立資料結構共識") AND a
  dedicated §11.47 實體關係圖（ERD）section (L2294-2306: purpose "建模
  entity、attribute、primary/foreign key、cardinality"; benefits "建立
  DB schema 的共同語言" and "可作為 migration 與 data contract 的起
  點"). **CORRECTED post-critic-review**: this contract's first draft
  claimed "exactly ONE citation" and "no dedicated §11.x section
  exists" -- both FALSE. A critic review's own broad grep ("ERD"/
  "entity relationship") caught what the first draft's own narrower
  grep missed. §11.47 IS thin (purpose + two benefit bullets, no
  numbered protocol beyond L899's own formula -- genuinely the same
  tier `devops_sre.rto_rpo`'s own F19 row comparison already
  established a precedent for calling "thin"), but it is NOT absent,
  and it directly answers two things the first draft got wrong by
  omission: (1) it explicitly NAMES `cardinality` as a modeling target,
  the same tier as `primary/foreign key` -- the first draft's own
  `compilation_decisions` wrongly premised "Atlas names no cardinality
  vocabulary" as if cardinality itself were unmentioned, when only its
  own VALUE VOCABULARY (which enum values) is unmentioned; (2) it gives
  a REAL 推薦搭配 (recommended pairing) chain -- "可作為 migration 與
  data contract 的起點" -- to `database_data.expand_contract_migration`
  (already built) and a future `database_data.data_contract` (unbuilt),
  which the first draft's own `recommended_next: []` silently dropped
  while separately filing `OQ-ERD-4` as if the pairing were merely
  speculative.

  **This record models a PHYSICAL/LOGICAL relational schema (foreign-
  key-bearing), not a conceptual Chen-style ER diagram** -- a scope
  decision the first draft made implicitly (via required foreign-key
  fields) but never stated, ADDED post-critic-review (see
  compilation_decisions). Atlas's own §11.47 benefit "建立 DB schema
  的共同語言" (build a common language for the DB SCHEMA) supports this
  reading directly.

  Due-diligence search, broad (learning from `devops_sre.stress_test`'s
  and `devops_sre.rto_rpo`'s own critic rounds, both of which caught an
  insufficiently broad citation grep on their FIRST attempt -- and this
  contract's own first draft repeated that exact class a THIRD time,
  caught by ITS OWN critic round): case-insensitive spec-root greps for
  "ERD"/"entity relationship"/"entity_relationship", "primary_key"/
  "foreign_key"/"cardinality", "entities→keys", and -- ADDED post-
  critic-review -- "node"/"edge" (the generic graph-shape vocabulary a
  narrower ERD-specific grep does not surface). Real neighbours found,
  each read and confirmed distinct: (1) `docs/architecture/search-content
  /SEARCH_CONTENT_DOMAIN_MODEL.md`'s own "entity" usage (`raw_observed
  _entity`/`entity_ref`) is an NLP/information-extraction concept, not a
  database schema entity; (2) `AI_LEGO_Cognitive_Engineering_Os_Global
  _Master_Plan_v1.md:2591`'s own "Graph Store → Evidence / Claim /
  Entity Relationships" is a Graph Store DATA-MODEL CONCEPT, not a
  typed object or a generic ERD method; (3) `specs/domain
  /repository-contract.schema.yaml`'s own `storage_tier` is a fixed
  3-tier System-of-Record classification with no entity/attribute/
  relationship modeling of its own; (4) ADDED post-critic-review:
  `specs/cognitive/typed-objects/dependency-map.schema.yaml`'s own
  `nodes[]`/`edges[]` shape -- the closest REAL structural analogue
  this session has built (a graph of named nodes with typed,
  referentially-validated edges, the SAME "cross-reference enforced at
  the runtime layer, not the schema layer" discipline this contract
  also uses) -- distinct: `DependencyMap` models service/vendor/data
  DEPENDENCIES (commonly cyclic, a 3-value node vocabulary), not a
  relational schema's own entities/attributes/keys; (5) ADDED post-
  critic-review: `specs/cognitive/typed-objects/causal-dag-analysis
  .schema.yaml`'s own `from_node_id`/`to_node_id` -- a CAUSAL graph
  (acyclic by construction), a different domain entirely; (6) ADDED
  post-critic-review: `specs/evidence/evidence-graph.schema.yaml`'s own
  `entity_node` -- THAT schema's own due-diligence note already
  disclosed a grep for "Entity Relationship Diagram" as a NON-hit for
  its own purposes (an evidence/claim/decision graph, not a database
  schema); its `entity_node` is a minimal placeholder for a mentioned
  real-world entity (a person, organization) inside an evidence graph,
  not this method's own database entity concept -- confirmed distinct
  by direct read of both files. No duplicate typed object or method
  found.

  Atlas's own formula and §11.47 ground FOUR real invariants that make
  this record a genuine MODEL, not a bag of independently-valid parts:
  every relationship's own `from_entity`/`to_entity` must name a REAL
  entity in `entities[]`; every relationship's own
  `foreign_key_attributes[]` entries must ALL name REAL attributes of
  that relationship's own `from_entity` (the side that structurally
  HOLDS a foreign key) -- an ARRAY, CORRECTED post-critic-review from a
  first-draft single string that could not represent a COMPOSITE
  foreign key even though composite primary keys are explicitly legal;
  every entity must carry at least one attribute flagged
  `is_primary_key: true` (Atlas's own "keys" formula step); and a
  supplied `migration_ref` must carry the
  `database_data.expand_contract_migration` record's own id prefix.


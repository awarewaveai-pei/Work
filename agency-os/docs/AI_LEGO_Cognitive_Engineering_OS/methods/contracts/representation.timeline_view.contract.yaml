description: >
  F24 representation/cognitive-preference/collaboration family, table-row-only
  citation (Atlas L968: "Timeline View | 按時間呈現事件 | events->time->
  decision/change markers | 找時間關係"). Renders a Knowledge Object's events
  in chronological order. Core invariant, same "derived, not asserted"
  discipline this corpus's `experiment.mvp`/`jurisdiction.compliance_gap_
  analysis` already establish: `ordered_event_refs` is MECHANICALLY DERIVED
  by sorting the source events by their own declared event_time -- a
  caller-supplied ordering that disagrees with the real chronological order
  is refused. The view stores only the ordered reference sequence plus a
  closed marker classification, never the events' own substantive content.


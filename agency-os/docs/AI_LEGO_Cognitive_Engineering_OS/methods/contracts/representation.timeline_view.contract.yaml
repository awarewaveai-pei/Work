id: representation.timeline_view
version: "1.0.0"
family: representation

cognitive_primitives: [SEQUENCE, COMPARE, VALIDATE]
# INFERRED, not cited (Atlas §4 gives no composition formula for F24
# members). SEQUENCE orders the events by time, COMPARE checks a
# caller-proposed order against the real chronology, VALIDATE refuses a
# mismatch before any record is returned. All three CANONICAL_KERNEL
# members.

purpose:
  - render_a_knowledge_objects_events_in_a_mechanically_verified_chronological_order
# Atlas L968 verbatim sense: place events on a timeline and surface
# decision/change markers, to find real temporal relationships -- a
# timeline that is not genuinely sorted by time actively misleads rather
# than informs.

inputs:
  required:
    - KnowledgeObjectRef
    - EventSet
  # NEW DESIGN. Atlas gives no named input typed-object for this method; the
  # starting point is a reference to the Knowledge Object being rendered plus
  # its declared events (each carrying its own event_time, the ground truth
  # a proposed ordering must stay faithful to), same honesty-gap class every
  # sibling F-family contract already discloses.

outputs:
  - TimelineView
# NEW output type (see typed-objects/timeline-view-record.schema.yaml).

preconditions:
  - "every ordered_event_refs entry references a real declared event by id, each event referenced exactly once (referential integrity + completeness)"
  - "the event_id sequence of ordered_event_refs equals the source events sorted by event_time, exactly (chronological derivation)"
  - "the view record carries no field capable of holding a copy of the events' own substantive content (Atlas L1053)"
  # NEW, structurally necessary. Atlas's own pipeline is "events->time->
  # decision/change markers" -- a caller narrating a different order than
  # the real one is exactly the "AI 主觀打分" anti-pattern this corpus's own
  # `experiment.mvp`/`jurisdiction.compliance_gap_analysis` were built to
  # structurally prevent, applied here to temporal ordering.


$id: "ai-lego://methods/contracts/security.pasta.contract.yaml"
title: "PASTA Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry. Forty-seventh Method Atlas slice, FOURTH member
  of the `security` family (F20's own "資安／隱私套件"), after
  `security.stride` (44th), `security.linddun` (45th), and
  `security.attack_tree` (46th).

  **Atlas gives this method exactly ONE citation** -- the thinnest
  grounding of any F20 member built so far. The F20 tool table's PASTA
  row (L884: purpose "風險導向威脅建模"; usage "business→scope
  →decompose→threat→vulnerability→attack→risk"; benefit "業務 impact
  與技術威脅連結"). Broad, independent grep across all three normative
  documents and the spec root (case-insensitive, "PASTA"/"business
  objective"/"technical scope"/"application decomposition"
  /"vulnerability analysis"/"attack modeling"/"risk.{0,10}impact
  analysis") found NO dedicated section (unlike STRIDE's §11.44,
  LINDDUN's §11.45, or Attack Tree's §12.38), NO worked example, and NO
  mention in either the §10 recipe row (L1112: "Assets/DFD→STRIDE
  /LINDDUN→Attack Tree→Controls→Test" -- PASTA is conspicuously ABSENT
  from Atlas's own DEFAULT recipe) or §13.11 Security Review Recipe
  (L3472-3487: "...→STRIDE→LINDDUN→Attack Tree→Secret/Identity Review
  →..." -- also absent). PASTA is named ONLY twice in this entire spec
  root: Atlas's own F20 table row, and Execution Contract §32's own
  closing sentence (L1260: "Method Atlas 可選 STRIDE／LINDDUN／Attack
  Tree／PASTA") -- the SAME load-bearing citation `security.stride`
  /`security.linddun`/`security.attack_tree` already establish, listing
  PASTA as a fourth ALTERNATIVE, not part of the recommended default
  chain. `docs/architecture/SECURITY_THREAT_MODEL.md` (this
  repository's own real threat review) explicitly chose STRIDE+LINDDUN
  and does not use PASTA -- no real-world usage instance exists in this
  spec root to draw design lessons from, unlike STRIDE/LINDDUN's own
  due-diligence neighbour. `methods/registry/method-inventory.yaml`'s
  own note about the Execution Contract (L57) cites a SECOND EC mention
  of PASTA "at L1284" -- checked directly, this is STALE (EC's own only
  PASTA mention is at L1260; pre-existing drift in that catalog file,
  not this contract's to fix, the same class of stale line-number
  already found and left unfixed in prior F20 slices' own due
  diligence).

  **Because Atlas gives no structural detail beyond its own seven-word
  compressed formula, this contract's own field-level detail beyond
  that formula is EXPLICITLY GROUNDED IN REAL, EXTERNAL, NAMED PASTA
  METHODOLOGY PRACTICE (Tony UcedaVélez's Process for Attack Simulation
  and Threat Analysis, the OWASP-documented seven-stage risk-centric
  threat modeling methodology this Atlas row is unambiguously
  referencing by name), NOT an Atlas citation** -- disclosed here
  explicitly, the same "first field justified by real practice, not a
  mother-document citation" class `architecture.adr.contract.yaml`'s
  own `status` field already establishes as a precedent for this
  session. Atlas's own seven-word chain ("business→scope→decompose
  →threat→vulnerability→attack→risk") maps onto -- and is directly
  transcribed as -- this record's own `stages[].stage_id` seven-value
  enum, kept as Atlas's own literal short words (not the real
  methodology's own fuller stage names, e.g. "Definition of Business
  Objectives") so the schema's own source-of-truth stays the Atlas
  citation itself, not an external document this session has no
  authority to treat as a mother document.

  **This is a genuinely THIRD structural shape among F20 members**
  (after STRIDE/LINDDUN's shared flat-DFD shape and Attack Tree's own
  recursive tree): PASTA's own formula is neither a DFD-element
  enumeration nor an AND/OR tree, but a SEQUENTIAL, ORDER-DEPENDENT
  seven-stage PIPELINE -- Atlas's own "→" chain is a real dependency
  order (business objectives before scope, decomposition before threat
  analysis, and so on), not an unordered set. `stages[]` is therefore a
  fixed-length-seven array, its own real invariant being that all seven
  `stage_id` values from Atlas's own chain are present EXACTLY ONCE
  EACH, IN Atlas's OWN ORDER -- a genuinely different kind of structural
  invariant than STRIDE/LINDDUN's referential integrity or Attack
  Tree's recursive shape validity. This is a real, citable THIRD data
  point directly answering `OQ-ATTACKTREE-4`'s own open question
  (raised in `security.attack_tree.contract.yaml`: "should PASTA be
  expected to diverge similarly [to Attack Tree], or might it turn out
  closer to the STRIDE/LINDDUN shape?") -- PASTA diverges from BOTH
  prior shapes, in a THIRD distinct direction, further confirming F20
  is a genuinely heterogeneous method family, not a candidate for one
  shared base schema beyond the EC §32 framing triplet (`OQ-STRIDE-4`'s
  own still-open subject).

  **Field design, ALL SEVEN of EC §32's own elements accounted for
  explicitly** (caught by critic review: an earlier draft of this
  description named only "the remaining triple" after the first three,
  silently skipping element #4, "Threats" -- corrected here):
  `assets`/`trust_boundaries`/`entry_points` (EC §32's own first three
  elements) are KEPT, identically shaped to the three siblings' own
  fields -- the same confirmed method-agnostic part of EC §32 every
  prior F20 contract already establishes. EC §32's own FOURTH element,
  "Threats", is filled by the `threat` stage's own `summary` -- a
  single free-text finding, not a structured `threats[]`/tree the way
  STRIDE/LINDDUN/Attack Tree fill it, a real and disclosed consequence
  of PASTA's own pipeline shape (see compilation_decisions). The six
  PROCESS stages (`business`/`scope`/`decompose`/`threat`
  /`vulnerability`/`attack`) each carry only `stage_id`/`summary` --
  deliberately minimal, since Atlas's own formula names the STAGES, not
  any per-stage sub-structure, and inventing one (e.g. a structured
  Application Decomposition DFD sub-object, which the real external
  PASTA methodology's own Stage 3 does use) would be exactly the
  "undisclosed over-constraint" class a critic review already caught on
  `database_data.data_contract`'s own first draft. The FINAL `risk`
  stage additionally carries EC §32's own remaining THREE elements
  (`control`/`residual_risk`/`test_evidence`) -- PASTA is a single END-
  TO-END review producing ONE overall risk verdict (Atlas's own "risk"
  stage IS literally "Risk & Impact Analysis" in the real methodology
  this formula word abbreviates), unlike STRIDE/LINDDUN/Attack Tree's
  own MANY discrete per-threat/per-leaf controls -- so EC §32's triple
  is scoped to the review's own single terminal verdict, not repeated
  six times across stages that have no individual "control" of their
  own (Atlas's own formula shows no controls attached to the business
  /scope/decompose/threat/vulnerability/attack stages individually,
  the same restraint `security.attack_tree.contract.yaml`'s own
  compilation_decisions already applies to its internal, non-leaf
  nodes).

  This is a STRUCTURAL record (`provenance_required` + one integrity
  gate), NOT `genuine_compute` -- Atlas's own benefit line ("業務
  impact 與技術威脅連結") is a qualitative traceability claim, not a
  numeric/ordinal computation like Attack Tree's own cost/skill
  /detectability aggregation; the real invariant here is STRUCTURAL
  completeness-and-order (all seven stages present, correctly ordered,
  none skipped, none duplicated), the same class of derivation
  STRIDE/LINDDUN's own `elements_with_no_recorded_threats` already
  establishes, not a new numeric class.

  Also cross-checked, the SAME confirming cross-references the three
  siblings already establish (re-verified independently): `specs
  /execution/risk-tier.schema.yaml`'s own HIGH-tier `required_actions`
  "Threat Review" (L93, method-agnostic -- satisfied by any of the four
  EC §32-named methods). `specs/cognitive/problem-type.schema.yaml`'s
  own `security` problem-type `recommended_start` (L294) does NOT name
  PASTA (it transcribes the same §10 L1112 default recipe, which itself
  excludes PASTA) -- a real, disclosed asymmetry, not an omission this
  contract needs to fix (that file's own scope is Atlas's own DEFAULT
  recommendation, not the full acceptable-method list). No existing
  typed object in `specs/security/` (`key-vault-lifecycle`, `log
  -redaction-token`, `personal-data-envelope`, `tenant-isolation
  -controls`) models a staged risk-centric review -- all four are
  narrower, specific security-control records, re-confirmed by direct
  read.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F20 tool table, PASTA row (L884): 'business→scope→decompose→threat→vulnerability→attack→risk'"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §32 Security Change Contract (L1231-1260): mandatory minimum 'Assets/Trust Boundaries/Entry Points/Threats/Controls/Residual Risk/Test Evidence' (all SEVEN elements), explicitly naming PASTA as an acceptable method (the ONLY other citation in this entire spec root) -- element #4, Threats, is filled by the 'threat' stage's own summary (see description and compilation_decisions)"

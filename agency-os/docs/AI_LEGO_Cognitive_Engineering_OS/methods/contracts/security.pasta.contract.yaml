id: security.pasta
version: "1.0.0"
family: security

cognitive_primitives: [DECOMPOSE, MAP, VALIDATE]
# INFERRED, not cited. Atlas's own "decompose" formula word is itself
# literally DECOMPOSE; assigning each stage its own summary (and the
# final stage its own control/residual_risk/test_evidence) is MAP; the
# stage-completeness-and-order check is VALIDATE. No COMPUTE step --
# unlike security.attack_tree, this record derives no numeric/ordinal
# value.

purpose:
  - walk_a_system_through_pastas_own_seven_ordered_stages_from_business_objectives_to_a_final_risk_and_impact_verdict_and_record_the_ec32_minimum_review_structure
inputs:
  required: [AssetSet, PastaStageSequence]
  # PastaStageSequence, not "...Set" (caught by critic review): this
  # contract's own headline argument is that Atlas's own "->" chain is
  # a real dependency ORDER, not an unordered set -- naming the input
  # type "Set" would contradict that in the one place a reader would
  # look first. security.attack_tree.contract.yaml's own
  # AttackGoalTree (not AttackNodeSet) already establishes this
  # shape-accurate-naming discipline.
  optional: [TrustBoundarySet, EntryPointSet]
outputs: [PastaThreatModelRecord]
preconditions:
  - "system_or_component is a non-empty string"
  - "assets has at least 1 entry; every entry is a non-empty string (EC §32's own 'Assets' element)"
  - "trust_boundaries is a required array (may be empty); every entry has a non-empty name and description (EC §32's own 'Trust Boundaries' element)"
  - "entry_points is a required array (may be empty) of non-empty strings (EC §32's own 'Entry Points' element)"
  - "stages is EXACTLY the seven entries {business, scope, decompose, threat, vulnerability, attack, risk}, one each, IN THAT ORDER -- no omission, no duplication, no reordering (Atlas's own '→' chain is a real dependency order, not an unordered set)"
  - "each of the first six stages (business/scope/decompose/threat/vulnerability/attack) has a non-empty summary -- the 'threat' stage's own summary is what fills EC §32's own fourth element, Threats; the final risk stage additionally has non-empty control/residual_risk/test_evidence (EC §32's own remaining three elements, scoped to this record's own single terminal verdict, not repeated per-stage)"
quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class every prior structural (non-genuine-compute) F20
  # contract already reasons through: stage-completeness-and-order is
  # a structural derivation (the same class STRIDE/LINDDUN's own
  # elements_with_no_recorded_threats already establishes), not a
  # statistical/numeric CALCULATED RESULT.
forbidden_transition: []
# Atlas §22.3's own gate table has no PASTA row.
recommended_next: [architecture.adr]
# Same forward link security.stride/security.linddun/security.attack_tree
# already establish, for the identical reason: Atlas's own F18 chain
# (L836-837) places a Threat Model step directly before ADR. PASTA is
# Atlas's own FOURTH EC §32-named Threat Model method, so the same
# forward link applies without inventing a new one -- even though PASTA
# itself is absent from Atlas's own §10/§13.11 DEFAULT recipe (see
# description above), it is still unambiguously a Threat Model method
# by EC §32's own naming, which is what grounds this forward link.
rollback:
  side_effect_free: true
  # The RECORD itself is side-effect-free -- same class every prior
  # structural contract's own rollback field already draws.

compilation_decisions:
  - question: >
      EC §32's own minimum structure has SEVEN elements (Assets/Trust
      Boundaries/Entry Points/Threats/Controls/Residual Risk/Test
      Evidence), not three plus a "remaining triple" -- an earlier
      draft of this contract's own description silently skipped element
      #4, Threats (caught by critic review). Which of PASTA's own
      stages fills it?
    decision: "The 'threat' stage's own summary fills EC §32's Threats element -- a single free-text finding, not a structured threats[]/tree."
    reasoning: >
      This is a real, disclosed CONSEQUENCE of PASTA's own pipeline
      shape, not an oversight: STRIDE/LINDDUN represent Threats as a
      flat, referentially-checked list; Attack Tree represents it as a
      recursive tree; PASTA's own formula gives Threat Analysis exactly
      one stage, so its own natural representation is exactly one
      summary. Forcing a structured threats[] list onto a single-stage
      formula word would fabricate structure Atlas never gives for this
      method. Every EC §32 element is now traceable in this contract's
      own field design: Assets/Trust Boundaries/Entry Points ->
      assets/trust_boundaries/entry_points; Threats -> the 'threat'
      stage's own summary; Controls/Residual Risk/Test Evidence -> the
      final 'risk' stage's own triple.
  - question: >
      Atlas gives PASTA only a seven-word compressed formula, no
      dedicated section, no worked example. Should this contract invent
      richer per-stage sub-structure (e.g. a DFD-based Application
      Decomposition sub-object for the 'decompose' stage, matching the
      real external PASTA methodology's own Stage 3 practice), or stay
      minimal?
    decision: "Stay minimal -- each of the six process stages carries only stage_id/summary, no invented sub-structure."
    reasoning: >
      The real external PASTA methodology (which this Atlas row
      abbreviates) does use a DFD for its own Stage 3, and structured
      sub-processes for others -- but Atlas ITSELF gives none of this
      detail, and this session's own governing discipline treats Atlas
      (plus Master Plan and EC) as the mother documents, not external
      named methodologies. Importing the real methodology's own richer
      structure here would silently promote an external, uncited
      source to mother-document status. Minimal, disclosed structure
      (see `OQ-PASTA-2`) leaves room for a future revision informed by
      an explicit operator decision to treat the external methodology
      as authoritative, rather than this contract quietly deciding it.
  - question: >
      Should EC §32's own control/residual_risk/test_evidence triple be
      repeated on EVERY stage (matching STRIDE/LINDDUN/Attack Tree's
      own per-threat/per-leaf placement), or scoped only to the final
      'risk' stage?
    decision: "Scoped only to the final risk stage."
    reasoning: >
      STRIDE/LINDDUN/Attack Tree all enumerate MANY discrete threats or
      leaf techniques, each independently controllable -- EC §32's own
      triple naturally repeats once per discrete item. PASTA's own
      formula names ONE end-to-end pipeline producing ONE overall risk
      verdict (its own final stage IS literally 'Risk & Impact
      Analysis'); the five stages before it (business objectives
      through attack modeling) are process steps building toward that
      verdict, not independently controllable findings of their own --
      Atlas's own formula attaches no controls to them individually.
      Forcing the triple onto every stage would fabricate six
      redundant, contentless 'control' fields for stages that have no
      real controls of their own to name.
  - question: >
      Should `stages` be a caller-supplied array validated for the
      right SET of seven ids (order-independent), or a fixed-length-
      seven array validated for the right ORDER too?
    decision: "Order matters -- stages[0] must be 'business', stages[1] 'scope', ..., stages[6] 'risk', exactly Atlas's own chain order."
    reasoning: >
      Atlas's own formula is written with '→' (a directed chain), not a
      set or an unordered list -- the same distinction this contract's
      own description already draws against STRIDE/LINDDUN's own
      unordered threats[]. A caller providing the seven stages out of
      order (e.g. doing threat analysis before defining technical
      scope) would not have genuinely followed PASTA's own real,
      dependency-ordered process, even if all seven stage_ids are
      technically present -- checking order is not an invented
      over-constraint, it is the one real invariant Atlas's own
      notation actually asserts.

open_questions:
  - id: "OQ-PASTA-1"
    question: "id mints a machine_id method-inventory.yaml never carried -- should method-inventory.yaml be updated (has_contract:true, machine_id, its own stale 'L1284' second-EC-mention cross-reference corrected, AND its own stale 'line: 881' for the PASTA row itself corrected -- Atlas's real PASTA row is L884, the whole nearby F20 block in that file is off by 3)?"
    owner: "operator, or a future session with explicit write scope over method-inventory.yaml"
    blocks: "nothing in this file's own validity"
  - id: "OQ-PASTA-2"
    question: >
      This contract deliberately keeps each of the six process stages
      minimal (stage_id/summary only), declining to import the real
      external PASTA methodology's own richer per-stage structure (see
      compilation_decisions). Should a future revision, on explicit
      operator instruction to treat that external methodology as
      authoritative, add per-stage sub-structure (e.g. a DFD-based
      decomposition object for the 'decompose' stage)?
    owner: "operator, or whoever next revises this contract's own scope with explicit authorization to cite the external PASTA methodology as a source"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap"
  - id: "OQ-PASTA-3"
    question: >
      `assets`/`entry_points`/`trust_boundaries` are not cross-validated
      against the stages' own content (no structural link from, e.g.,
      the 'scope' stage's own summary back to a specific entry_points
      entry). Should a future revision add an optional link?
    owner: "operator, or whoever next revises this contract's own scope"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap"
  - id: "OQ-PASTA-4"
    question: >
      With PASTA now a real THIRD structural shape among F20 members
      (flat-DFD, recursive-tree, ordered-stage-pipeline), directly
      answering `OQ-ATTACKTREE-4`'s own question with "diverges again,
      in a third direction" -- does this settle the broader question of
      whether ANY shared F20 base schema (beyond the EC §32 framing
      triplet, `OQ-STRIDE-4`'s own still-open subject) is worth
      pursuing? Not solved here -- a real question for whoever next
      surveys all built F20 members once more are built (DPIA/PIA, Zero
      Trust Review, Secrets Threat Review, Supply Chain Threat Model,
      Abuse Case, Security Control Mapping remain).
    owner: "operator, or whoever next builds a fifth F20 member or surveys the family as a whole"
    blocks: "nothing in this file's own validity"


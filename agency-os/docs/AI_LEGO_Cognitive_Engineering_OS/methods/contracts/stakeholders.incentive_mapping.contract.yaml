  method: >
    Read Atlas F07 table row (L490) directly -- grepped the whole Atlas file case-insensitively for
    "incentive" -- confirmed 2 hits, L490 (this method's own citation) and L4475 (a DIFFERENT recipe row
    naming "Incentive / BATNA / ZOPA" as a companion concept for a different method, not this contract's own
    citation). Grepped the whole `ai_lego` tree and this docs tree case-insensitively for
    "incentive_mapping"/"IncentiveMap" before writing any of this method's own files: zero pre-existing
    implementation. Read insight.contextual_inquiry.contract.yaml (per-entry completeness precedent) and
    insight.empathy_map.contract.yaml (record-level-only-provenance precedent) in full before writing this
    contract. Validated against specs/cognitive/method.schema.yaml with jsonschema.Draft202012Validator.
  note: >
    No mother document was modified. Atlas L490's own Goals/Incentives/Constraints/Risks vocabulary is
    transcribed verbatim into `preconditions`. `cognitive_primitives` and the per-card-completeness shape are
    compilation decisions, disclosed above, not presented as directly Atlas-cited.

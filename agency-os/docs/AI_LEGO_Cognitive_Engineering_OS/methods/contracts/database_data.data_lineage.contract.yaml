$id: "ai-lego://methods/contracts/database_data.data_lineage.contract.yaml"
title: "Data Lineage Method Contract"
status: ACTIVE

description: >
  Tier 1 concrete entry. Twenty-eighth Method Atlas slice, SECOND from
  the `database_data` family (F21's own "資料庫／資料套件"), after
  `database_data.backup_restore_drill` (twenty-fifth slice).

  Atlas gives this method TWO citations with genuinely DIFFERENT
  vocabularies, disclosed rather than silently reconciled: the F21 tool
  table row (L901: "source→ingest→transform→dataset→model→artifact" --
  6 stages) and the dedicated §11.48 section (L2309-2328), whose own
  flow diagram (L2313-2322) gives an 8-node chain (Source→Ingest→
  Transform→Dataset→AnalysisRun→Result→Claim→Paper/Decision). The first
  4 stages agree (source/ingest/transform/dataset); the table row's
  final two ("model/artifact") and the diagram's final four
  ("AnalysisRun/Result/Claim/Paper-Decision") diverge -- the table row
  reads as a compressed, generic summary and the dedicated section's
  diagram as the fuller worked breakdown, the SAME relationship several
  prior Tier 1 contracts this session found between a table-row formula
  and its own dedicated section (e.g. `devops_sre.canary_deployment`'s
  own two-citation pattern). This contract treats the DIAGRAM's own
  8-stage list as authoritative for the `stage` enum, disclosing the
  table row's shorter, divergent vocabulary rather than silently
  picking one.

  The purpose section's own second benefit bullet (L2327:
  "一個數字可以回到原始來源" -- a number can trace back to its original
  source) is a real, enforceable invariant this contract enforces: a
  node cannot be considered part of a valid lineage record unless
  FOLLOWING its own upstream references actually terminates at a real
  `SOURCE` node -- not merely "claims an upstream", the same "real
  compute, not a claim" discipline `causal.dag`'s own acyclic-
  verification (a structurally analogous graph method, sixth slice)
  already established for a different graph shape. (Not to be confused
  with the F21 TABLE's own separate benefit column, whose text for this
  row is "數字可追溯" -- a related but distinct string; the two are
  cited separately below, not conflated.)

  Due diligence applied before minting, CORRECTED after a critic
  review caught both an over-broad scope claim and a misclassification
  in the first draft: the original claim ("grepped the full spec root
  for 'lineage', 9 hits, all read") actually searched only `specs/**`
  and `methods/**` (where a typed-object concept would actually be
  DEFINED), not the genuinely full spec root -- a true full-repo grep
  returns 34 files, most incidental English-word mentions in mother
  documents/proposals/research artifacts with no bearing on a
  duplicate-concept question. Of the original 9 files in the narrower,
  meaningful scope: SIX are a DIFFERENT concept (Workflow execution
  lineage -- a forked branch/execution-history shape, e.g.
  `specs/workflow/branch.schema.yaml`'s own "forked, isolated execution
  lineage of a Workflow"): `knowledge-canvas.schema.yaml`,
  `blast-radius-chain.schema.yaml`, `branch.schema.yaml`, and
  `workflow-ir.schema.yaml`. TWO more are a THIRD, separately distinct
  concept (schema/document VERSION-HISTORY lineage, not execution and
  not data-flow): `status-codes.schema.yaml`'s own `design_lineage:`
  field and `document-registry.schema.yaml`'s own "major-version
  lineage number" -- the first draft wrongly folded both into the
  "Workflow execution lineage" bucket. The ninth,
  `research.qualitative_coding.contract.yaml`'s own "Dataset 有
  lineage" gate bullet (L491), is satisfied by requiring a single
  `governance/epistemic-label.schema.yaml#/provenance_record` on a
  Dataset -- a genuinely different, single-hop shape (who asserted this
  fact) from what this contract builds (a multi-stage transformation
  CHAIN a piece of data actually passed through). A wider check (not
  claimed as exhaustive) also found two files that SUPPORT, rather than
  compete with, this contract: `policies/ai-execution/trusted-compute-
  gate.policy.yaml` (L42, L51) names "dataset lineage" as an unmet
  requirement for research-class citations, and
  `.ai/research/phase-1/GAP_REGISTER.yaml`'s own `P1-GAP-AI-6` (L340,
  L347) is a REGISTERED GAP describing exactly this absence ("特徵工程
  產生的衍生欄位沒有 lineage 物件記錄來源公式" -- derived fields from
  feature engineering have no lineage object recording their origin
  formula) -- neither is a competing typed object; both are additional
  evidence this method fills a real, previously-named gap rather than
  duplicating an existing one.


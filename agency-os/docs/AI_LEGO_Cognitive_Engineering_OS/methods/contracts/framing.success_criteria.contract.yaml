$id: "ai-lego://methods/contracts/framing.success_criteria.contract.yaml"
title: "Success Criteria Method Contract"
status: ACTIVE

description: >
  framing.success_criteria, family framing (F01), Atlas F01 table row (L338): "Success Criteria | 事前定義
  成功 | 高風險決策 | Must/Should/Guardrail/Stop | 防止事後改標準 | Reversal Criteria" -- grep-confirmed no
  dedicated section beyond the table row. 4th F01 member built this batch (after goal_statement/smart/
  non_goals). Distinct from learning.kill_criteria/reversal_criteria (ongoing monitoring rules re-evaluated
  over an in-flight decision) and from decision.moscow's Must/Should/Could/Won't (per-item release-scope
  triage across MANY items) -- this is a PRE-COMMITMENT classification of criteria STATEMENTS for ONE
  decision, fixed before it begins. Core invariants: `must` non-empty (a criteria set with zero
  non-negotiable items protects nothing), every criterion id unique across all 4 categories.


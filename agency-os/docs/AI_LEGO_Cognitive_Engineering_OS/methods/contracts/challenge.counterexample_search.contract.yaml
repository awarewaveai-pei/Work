  - "OQ-CES-2: cognitive_primitives is this file's own inference (Atlas §4 gives no formula for this method) (owner: operator, or whoever adds a dedicated Atlas §4 formula for this method)."
  - "OQ-CES-3: this record only captures claim/boundary_cases/true_counterexamples -- Atlas's own table-row pipeline stops here; no next-stage method is named (owner: operator)."


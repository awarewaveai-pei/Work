    owner: "operator, or a future review pass specifically checking Tier 1 contracts with no forbidden_transition/recommended_next example in Atlas"
    blocks: "nothing in this file's own validity"
  - id: "OQ-REGRESSIONDISCONTINUITY-3"
    question: "checks is a flat array of strings, not structured objects (e.g. check_type enum, test_statistic, threshold). Revisit if a future consumer needs to parse check-level detail programmatically -- same open question causal.rct's own OQ-RCT-3 raises for treatment_group/control_group."
    owner: "operator, or whoever next needs structured check-level fields"
    blocks: "nothing in this file's own validity"


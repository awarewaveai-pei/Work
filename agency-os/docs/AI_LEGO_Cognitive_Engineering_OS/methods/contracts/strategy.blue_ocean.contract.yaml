  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F08 tool table, Blue Ocean row (L526: 'Blue Ocean｜創造新價值曲線｜Strategy Canvas→ERRC｜擺脫直接競爭｜BMC')"
  - "methods/contracts/strategy.value_chain.contract.yaml -- same family, single-table-row-only citation precedent (no dedicated §12.x section) reused here"

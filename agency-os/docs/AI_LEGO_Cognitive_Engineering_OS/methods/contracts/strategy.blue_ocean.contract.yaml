title: "Blue Ocean Strategy Method Contract"
status: ACTIVE

description: >
  Tier 1, F08 `strategy` family, closing member (14th of 14). Atlas F08 table
  row (L526: "Blue Ocean｜創造新價值曲線｜Strategy Canvas→ERRC｜擺脫直接競爭
  ｜BMC") is this method's ONLY citation -- confirmed by grepping the whole
  Atlas file for "Blue Ocean"/"ERRC"/"藍海"/"Strategy Canvas"/"價值曲線": 1
  total hit, this row, no dedicated §12.x section (same thinness class as
  `strategy.value_chain`'s own single-citation row). Core invariants:
  `competing_factors` covers >=2 factors (a value curve needs >=2 points to
  plot), each factor's `errc_action` is one of the 4 closed real Kim &
  Mauborgne values, `industry_standard_level` is required for existing
  factors (ELIMINATE/REDUCE/RAISE) and forbidden for `CREATE` (a genuinely
  new factor has no industry standard to record), and `new_value_curve_summary`
  is a required, disclosed conclusion (Atlas's own defining purpose IS "創造
  新價值曲線").


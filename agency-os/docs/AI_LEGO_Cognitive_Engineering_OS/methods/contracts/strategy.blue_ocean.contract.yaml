id: strategy.blue_ocean
version: "1.0.0"
family: strategy

cognitive_primitives: [DECOMPOSE, CLASSIFY, COMPARE]
# INFERRED, not cited (Atlas §4 gives no composition formula for Blue Ocean,
# no §4 entry exists for this method). Grounded word-for-word in the
# citation's own 2-clause arrow: "Strategy Canvas" (identify/decompose the
# industry's own competing factors) = DECOMPOSE; "→ERRC" (classify each
# factor into one of 4 fixed actions) = CLASSIFY; the citation's own benefit
# column "擺脫直接競爭" (escape direct competition) requires comparing the
# resulting new value curve against the industry's existing one = COMPARE,
# same 3-primitive inference class strategy.value_chain's own contract
# already establishes for an analogous single-row citation.

purpose:
  - create_a_new_value_curve_that_escapes_direct_competition_via_strategy_canvas_and_errc_grid
# Atlas L526 verbatim sense folded into one purpose label: "創造新價值曲線"
# (create a new value curve, method column) + "擺脫直接競爭" (escape direct
# competition, benefit column).

inputs:
  required: []
  optional: []
  # Atlas's own citation names no upstream typed-object dependency for Blue
  # Ocean (contrast SWOT's own explicit §14.1 KnowledgeSet->SWOT chain) --
  # same self-contained-method precedent strategy.three_c/strategy.value_chain
  # already establish for an analogous thin, standalone citation.

outputs:
  - BlueOceanAnalysis
# NEW output type (see typed-objects/blue-ocean-analysis.schema.yaml).
# Neither the Atlas row nor any other Atlas section gives this method's
# output a PascalCase name.

preconditions:
  - "competing_factors includes at least 2 entries -- Atlas's own 'Strategy Canvas' (L526) plots a value curve across multiple competing factors; a curve plotted through a single point is not a curve"
  - "every competing_factors[] entry's errc_action is one of ELIMINATE, REDUCE, RAISE, CREATE -- Atlas's own '→ERRC' (L526) names this closed 4-value grid as the method's defining second stage"
  - "every competing_factors[] entry with errc_action in {ELIMINATE, REDUCE, RAISE} discloses a non-null industry_standard_level, and every entry with errc_action CREATE discloses none -- ELIMINATE/REDUCE/RAISE apply to an EXISTING competing factor (there is an industry standard to record), CREATE introduces a factor the industry has never offered (there is no industry standard to record); see compilation_decisions"
  - "new_value_curve_summary is a non-empty string -- Atlas's own '創造新價值曲線' (L526, method's own name) is Blue Ocean's whole stated purpose; a record that never states the resulting new curve has not delivered on it"

quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class strategy.value_chain.contract.yaml's own quality block
  # establishes: the real risk this method's citation names is missing
  # factor/ERRC coverage or missing new-curve disclosure (the 4 preconditions
  # above), not a missing per-claim evidence citation -- Atlas's row carries
  # no misuse warning about unevidenced claims (contrast SWOT's own explicit
  # L1356 "沒有 Evidence 就寫...").

forbidden_transition: []
# Atlas's own citation for Blue Ocean gives no §14.1-style illegal-transition
# example (that example, SWOT -> AutomaticProductionDeployment, is SWOT's own
# field). Left empty and disclosed rather than applied to Blue Ocean by
# unverified analogy.

recommended_next:
  - strategy.business_model_canvas
# Atlas's own explicit pairing, L526 last column "BMC" (Business Model
# Canvas). Re-grepped and confirmed strategy.business_model_canvas.contract.yaml
# exists, parses as well-formed YAML, and status: ACTIVE before naming it
# here -- same verified-before-citing discipline strategy.vrio.contract.yaml's
# own recommended_next check already establishes for a different concurrent
# sibling.

rollback:
  side_effect_free: true
  # Pure analysis/knowledge-object production, no external side effect named
  # by the citation -- same low-risk inference class every sibling F08
  # contract's own rollback field already applies.

compilation_decisions:
  - question: "Free-form errc_action or closed 4-value enum?"
    decision: "Closed enum {ELIMINATE, REDUCE, RAISE, CREATE} -- the citation's own '→ERRC' (L526) names this exact 4-letter grid; grounded additionally in the real, named, external Kim & Mauborgne Blue Ocean Strategy framework (Eliminate-Reduce-Raise-Create), same real-external-methodology-naming discipline strategy.vrio.contract.yaml's own Barney 1991 citation already establishes for a different method."
  - question: "Is errc_action GENUINE_COMPUTE (mechanically derived) or a caller-disclosed judgment?"
    decision: "Caller-disclosed judgment, validated only for closed-vocabulary membership at construction -- no citation, Atlas or external, supports mechanically deriving WHICH of the 4 actions fits a given competing factor; that is the strategist's own creative act, same disclosure-only-classification precedent strategy.three_c's own dimension field and strategy.value_chain's own category field already establish (there too the ENUM is validated, the ASSIGNMENT is caller-supplied)."
  - question: "Does CREATE need different handling from ELIMINATE/REDUCE/RAISE?"
    decision: "Yes -- ELIMINATE/REDUCE/RAISE all apply to a competing factor the industry ALREADY competes on (there is a real 'industry_standard_level' to record, i.e. where the current value curve sits before this method acts on it); CREATE introduces a factor the industry has NEVER offered (there is no industry standard, by definition, for something that does not yet exist). Enforced as a real invariant, not left as an unstated schema quirk: industry_standard_level is REQUIRED (non-null) for the first 3 actions and FORBIDDEN (must be entirely absent, not merely null) for CREATE. Investigated and confirmed this asymmetry is the real, well-known ERRC grid's own structure (Eliminate/Reduce/Raise all interrogate an existing factor's current level; Create has no 'current level' axis at all), not an invented rule."
  - question: "industry_standard_level -- free text, or a closed ordinal enum?"
    decision: "Closed 3-value ordinal enum {LOW, MEDIUM, HIGH}, disclosed judgment never mechanically scored -- same precedent strategy.porter_five_forces.contract.yaml's own `intensity` field already establishes for an analogous disclosed-ordinal-level shape, reused here rather than inventing a new numeric scale Atlas's own row does not cite."
  - question: "Should each factor carry a disclosed rationale for its own errc_action?"
    decision: "Yes, required non-empty `rationale` per factor -- same disclosed-judgment-needs-an-audit-trail precedent strategy.vrio.contract.yaml's own per-question `reasoning` field already establishes; an ERRC assignment with no stated reasoning is unauditable caller judgment, not a documented strategy decision."
  - question: "Should competing_factors coverage require all 4 ERRC actions represented (completeness), matching strategy.three_c's dimension-coverage / strategy.value_chain's category-coverage precedent?"
    decision: "No -- Atlas's own citation ('Strategy Canvas→ERRC') gives no completeness requirement across the 4 actions, unlike three_c's own explicit '三面向' (three dimensions, ALL required) or value_chain's own explicit 'primary/support' (BOTH required); a real Blue Ocean analysis may legitimately conclude, for a given competing factor set, that (for example) zero factors warrant CREATE. Inventing an all-4-required rule here would overstate this citation's own content by importing a different sibling method's own structural feature. Only the minItems:2 (>=2 factors to plot a curve at all) and the closed-vocabulary membership check apply."
  - question: "inputs.required -- empty, or an upstream typed-object like SWOT's KnowledgeSet?"
    decision: "Empty -- Atlas's own citation for Blue Ocean names no upstream typed-object dependency (unlike SWOT's own explicit §14.1 chain); same self-contained-method precedent strategy.three_c/strategy.value_chain already establish."


decided_by: >
  No ADR governs the content. Direct transcription of Atlas's own single
  citation into a 2-stage pipeline (Strategy Canvas produces
  `competing_factors`, ERRC classifies each). The real, well-known Kim &
  Mauborgne "Blue Ocean Strategy" framework (Strategy Canvas + Eliminate-
  Reduce-Raise-Create grid) is the named external methodology grounding the
  4-value `errc_action` enum, same "name the real external methodology, cite
  it, restrict fields to what Atlas's own row literally names" discipline
  `strategy.vrio.contract.yaml`'s own Barney 1991 citation already
  establishes for a different method. `id: strategy.blue_ocean` mints a new
  machine_id (no digits/spaces legal in the `<family>.<name>` grammar per

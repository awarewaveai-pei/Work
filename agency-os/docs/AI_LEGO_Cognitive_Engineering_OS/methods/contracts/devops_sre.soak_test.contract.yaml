id: devops_sre.soak_test
version: "1.0.0"
family: devops_sre

cognitive_primitives: [DECOMPOSE, VALIDATE, INFER]
# INFERRED, not cited (Atlas gives no §4-style composition formula for
# this method). Separating the series into discrete time-stamped
# samples is DECOMPOSE; judging the first-vs-last delta against
# degradation_thresholds is VALIDATE; naming WHICH resources leaked is
# INFER -- the same inferred triple `devops_sre.load_test`'s and
# `devops_sre.stress_test`'s own contracts already use.

purpose:
  - verify_long_duration_stability_at_a_constant_load_by_comparing_the_first_and_last_of_a_time_ordered_measurement_series_and_naming_any_resource_that_leaked
inputs:
  required: [SustainedLoadLevel, TimeOrderedMeasurementSeries, DegradationThresholds]
  optional: []
outputs: [SoakTestRecord]
preconditions:
  - "system_under_test is a non-empty string; sustained_load_rps is finite and > 0"
  - "samples has at least 3 entries, each a valid {elapsed_minutes, measurement} pair (measurement: same shape/ranges as devops_sre.load_test's own load_measurement)"
  - "elapsed_minutes is STRICTLY increasing across samples"
  - "every sample's own measurement.load_rps EQUALS sustained_load_rps"
  - "every sample reports the SAME set of resource names"
  - "degradation_thresholds carries exactly latency_p95_increase_ms_max (finite, >= 0), error_rate_increase_max (finite, in [0, 1]), and resource_increase_max (finite, in [0, 1]) -- re-verified independently by the gate (ai_lego.modules.devops_sre.soak_test._thresholds_are_valid), not builder-only"
  - "degradation is computed by ai_lego.compute.soak_test.analysis.detect_degradation comparing samples[0] against samples[-1] -- never caller-supplied independently of that computation"
  - "overall_degraded is true iff latency_degraded OR error_rate_degraded OR degraded_resources is non-empty -- fully derived, no caller override"
  # Preconditions 2-5 map onto Atlas's own '持續負載' formula step; 7-8
  # onto 'memory/resource leak→degradation'. Same "structurally
  # necessary, forbidden-state" class every prior genuine-compute
  # contract this session built already establishes.
quality:
  provenance_required: true
  evidence_labeling_required: false
  # Same class of departure every genuine-compute contract in this
  # package already reasons through: the real risk is computational
  # integrity (was the constant-load invariant actually held, was the
  # degradation verdict actually derived from the recorded samples),
  # not evidence-citation over a narrative claim.
forbidden_transition: []
# Atlas §22.3's own gate table has no Soak Test row.
recommended_next: []
# Atlas gives no explicit 推薦搭配 chain for this method. One real,
# disclosed (not built) relationship: a `degraded_resources` finding
# here could motivate a future devops_sre.capacity_model run with a
# revised resource_coefficient -- no soft-link field exists yet
# (OQ-SOAKTEST-4).
rollback:
  side_effect_free: true
  # The RECORD itself is side-effect-free -- the real sustained load
  # generation and any remediation of a discovered leak happen outside
  # this method's own scope, the same "record reports on an external
  # observation" class every prior devops_sre contract's own rollback
  # field already draws.

compilation_decisions:
  - question: >
      Should `degradation` be computed from a real TREND across all
      samples (e.g. a monotonic-increase check, or a linear-regression
      slope), or from a simple FIRST-vs-LAST delta?
    decision: "First-vs-last delta only -- the temporal twin of devops_sre.load_test's own baseline-vs-target two-point design."
    reasoning: >
      Atlas's own text names a sequence ("持續負載→...→degradation") but
      specifies no statistical technique for detecting it. Inventing a
      trend/regression statistic (what slope counts as a leak? over
      what window? with what noise tolerance?) would be exactly the
      kind of unstated-assumption invention this package's every prior
      contract already disciplines itself against -- the same
      restraint that rejected a computed string-equality outcome for
      `devops_sre.runbook_execution`'s own step outcomes. First-vs-last
      is the simplest reading that is still a REAL comparison (not a
      narrative claim), directly mirrors the two-point design
      `devops_sre.load_test`'s own `status` already established (there:
      two load levels; here: two points in time), and keeps the
      INTERMEDIATE samples genuinely recorded evidence a reader can
      inspect even though the verdict itself does not consume them --
      disclosed as a real limit, not a silent one (see
      OQ-SOAKTEST-2).
  - question: >
      Should `samples` require a MINIMUM of 2 entries (matching
      `devops_sre.load_test`'s own two-measurement design) or more?
    decision: "Minimum 3."
    reasoning: >
      A 2-sample series is indistinguishable in SHAPE from a
      `devops_sre.load_test`-shaped baseline/target pair (this method's
      own constant-load invariant is the only thing that would still
      distinguish them) -- requiring a genuine INTERMEDIATE sample is
      the minimum structural signal that a real DURATION was observed,
      matching Atlas's own "持續" (sustained) language, which a
      two-point read does not honor even though the verdict computation
      itself only needs the endpoints.
  - question: >
      Should `resource_increase_max` be a single threshold applied to
      EVERY resource, or a per-resource map (e.g. a stricter budget for
      `memory` than for `cpu`)?
    decision: "A single threshold, uniform across all resources -- the same design devops_sre.load_test's own acceptance and devops_sre.stress_test's own breaking_thresholds already use."
    reasoning: >
      Atlas's own text names "memory/resource leak" without
      distinguishing a per-resource budget; a caller with a genuine
      need for asymmetric budgets can run the method once per resource
      class or await a future revision -- inventing a per-resource map
      here would be unstated-assumption invention this package already
      disciplines against, and would break the field-shape symmetry
      this session's every prior threshold-pair field already
      establishes.
  - question: >
      Should `degraded_resources` name every resource ABOVE an absolute
      utilization ceiling (e.g. "over 90% now"), or only those whose
      utilization INCREASED by more than `resource_increase_max`?
    decision: "Increase only -- a resource that was already near-saturated at the FIRST sample and stays flat is not exhibiting a leak."
    reasoning: >
      Atlas's own benefit column is "找慢性問題" (find CHRONIC problems)
      via "memory/resource leak" -- a leak is a GROWTH pattern, not an
      absolute level; a resource already busy at t=0 that stays exactly
      as busy at t=N has not leaked anything, and flagging it would
      conflate this method with a simple threshold check (already
      served by other fields elsewhere in this package, e.g.
      `devops_sre.capacity_model`'s own headroom classification).

open_questions:
  - id: "OQ-SOAKTEST-1"
    question: "id mints a machine_id method-inventory.yaml never carried -- should method-inventory.yaml be updated (has_contract:true, machine_id, corrected line field)?"
    owner: "operator, or a future session with explicit write scope over method-inventory.yaml"
    blocks: "nothing in this file's own validity"
  - id: "OQ-SOAKTEST-2"
    question: >
      `degradation` compares only samples[0] and samples[-1] -- a real
      leak that spiked mid-soak and partially recovered by the last
      sample would be under-reported, and the intermediate samples are
      recorded but not consumed by the verdict. Should a future
      revision compute a real trend (e.g. worst-intermediate-sample
      comparison, or a monotonicity check) instead of or alongside the
      first-vs-last delta?
    owner: "operator, or whoever next revises this contract's own field design"
    blocks: "nothing in this file's own validity -- disclosed limit, not a silent gap"
  - id: "OQ-SOAKTEST-3"
    question: >
      F19 will be 13/13 complete once `devops_sre.rto_rpo` is built --
      the last unbuilt member of this pack. Should it be the next
      slice?
    owner: "operator"
    blocks: "nothing in this file's own validity"
  - id: "OQ-SOAKTEST-4"
    question: >
      A `degraded_resources` finding here is exactly the kind of signal
      that could motivate a `devops_sre.capacity_model` re-run with a
      revised `resource_coefficient`. Should a future revision add a
      soft-link field (format-only, the same discipline
      `devops_sre.game_day`'s own `runbook_execution_ref` and
      `devops_sre.stress_test`'s own disclosed-but-unbuilt
      `capacity_model_ref` idea already establish)?
    owner: "operator, or whoever next revises either contract's own field design"
    blocks: "nothing in this file's own validity"


description: >
  Tier 1 concrete entry. Thirty-seventh Method Atlas slice, TWELFTH from
  the `devops_sre` family (F19), after `devops_sre.sli_slo` (twentieth),
  `devops_sre.canary_deployment` (twenty-first),
  `devops_sre.chaos_engineering` (twenty-second),
  `devops_sre.blue_green_deployment` (twenty-third),
  `devops_sre.error_budget` (twenty-fourth), `devops_sre.capacity_model`
  (thirty-first), `devops_sre.release_readiness_review` (thirty-second),
  `devops_sre.runbook_execution` (thirty-third), `devops_sre.game_day`
  (thirty-fourth), `devops_sre.load_test` (thirty-fifth), and
  `devops_sre.stress_test` (thirty-sixth). LAST but one F19 member
  before `devops_sre.rto_rpo` (F19 will then be 13/13 complete).

  Atlas gives this method exactly ONE citation of its own: the F19 tool
  table's Soak Test row (L855: purpose "驗證長時間穩定" -- verify
  long-duration stability; usage "持續負載→memory/resource leak→degrad
  ation" -- sustained load, observe memory/resource leak, observe
  degradation; benefit "找慢性問題" -- find chronic problems). No
  dedicated §11.x section exists (confirmed by direct read of the
  surrounding table, L848-863).

  **The defining difference from this method's two immediate F19
  siblings, both already built**: `devops_sre.load_test` compares TWO
  measurements at DIFFERENT load levels (baseline vs target);
  `devops_sre.stress_test` escalates load across an INCREASING ladder
  to find a breaking point; THIS method holds load PERFECTLY CONSTANT
  (`sustained_load_rps`) and instead varies TIME -- a series of samples
  taken at increasing elapsed minutes, searching for drift (a leak, a
  slow-growing latency/error trend) that only a real DURATION can
  reveal. All three share the same per-observation shape
  (`load_rps`/`latency_p95_ms`/`error_rate`/`resource_utilization`) --
  this contract REUSES `devops_sre.load_test`'s own
  `#/$defs/load_measurement` unchanged across files, the SAME cross-
  file pattern `devops_sre.stress_test` already established, resolving
  that contract's own OQ-STRESSTEST-5 (the mirror of `devops_sre
  .load_test`'s own OQ-LOADTEST-5, now answered for BOTH remaining F19
  siblings that could reuse it).

  Due-diligence search, deliberately broad from the first draft (the
  narrow-grep class two consecutive prior slices' own critic rounds
  caught, and `devops_sre.stress_test`'s own critic round caught a
  THIRD time via a missed simulation-family placeholder): case-
  insensitive spec-root greps for "soak"/"持續負載"/"soak_test",
  "memory leak"/"resource leak"/"記憶體洩漏", "chronic"/"慢性問題",
  "degradation"/"degrad", and -- learning directly from
  `devops_sre.stress_test`'s own missed neighbour -- a check of
  whether `Master_Plan_v1.md`'s own `/modules/simulation/{scenario,
  monte_carlo, sensitivity, stress_test}/` placeholder (L1774-1777,
  already disclosed in `devops_sre.stress_test.contract.yaml`) ALSO
  names a `soak_test` sibling: confirmed it does NOT -- that
  placeholder lists exactly four names and `soak_test`/`soak test` is
  absent from it and from `REPOSITORY_ARCHITECTURE.md`'s own
  simulation-family entries. Real neighbours found and confirmed
  distinct, ADDED post-critic-review (the first draft's own
  enumeration understated the grep results): `specs/execution
  /rollback.schema.yaml`'s own unrelated `degradation_path` field (a
  rollback-plan fallback tier, not a measured drift over time);
  several `docs/architecture/search-content/*.md` uses of
  "degradation" describing retrieval-quality decay; the entire
  `policies/jurisdiction/legal-freshness-sla.policy.yaml`/`specs
  /jurisdiction/pack.schema.yaml`/`docs/architecture
  /GLOBAL_JURISDICTION_PLAN.md` §2.3 "auto_degrade" family (~19 hits)
  -- a document-freshness SLA concept, an unrelated domain; and
  `.ai/research/phase-0/method-inventory.yaml:887`'s own stale
  duplicate Soak Test entry (Phase-0's own research snapshot, not a
  second live registry -- the ACTIVE registry is
  `methods/registry/method-inventory.yaml`, already cited above). No
  duplicate typed object or method found.

  Atlas's own formula and benefit ground SIX real invariants: (1)
  `samples` has at least 3 entries (Atlas's own "持續" -- sustained --
  implies an observed DURATION, not a two-point snapshot; one
  intermediate sample is the minimum that distinguishes a soak from a
  `devops_sre.load_test`-shaped pair); (2) `elapsed_minutes` is
  STRICTLY increasing across samples (time moves forward); (3) EVERY
  sample's own `measurement.load_rps` EQUALS `sustained_load_rps`
  (Atlas's own "持續負載" -- constant, not escalating -- the exact
  opposite discipline from `devops_sre.stress_test`'s own strictly-
  increasing ladder); (4) every sample reports the SAME set of resource
  names (the same like-for-like discipline every prior load-measurement
  method this session built already establishes); (5)
  `degradation_thresholds` is valid and RE-VERIFIED BY THE GATE, not
  builder-only (the lesson `devops_sre.capacity_model`'s,
  `devops_sre.load_test`'s, and `devops_sre.stress_test`'s own critic
  rounds each taught, applied here from the first draft); (6)
  `degradation` is COMPUTED -- comparing the FIRST sample against the
  LAST -- never caller-supplied, `overall_degraded` fully derived from
  its own three sub-signals with no caller override.


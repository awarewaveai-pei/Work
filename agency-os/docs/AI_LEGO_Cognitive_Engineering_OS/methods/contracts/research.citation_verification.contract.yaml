$id: "ai-lego://methods/contracts/research.citation_verification.contract.yaml"
title: "Citation Verification Method Contract"
status: ACTIVE

description: >
  research.citation_verification (Master Plan §42 Research Integrity Engine, Citation Verification
  sub-capability, STRUCTURAL scope only). Checks every item in a literature_search result for well-formed
  citation metadata (DOI format, non-empty authors, plausible publication year, non-empty title). Does NOT
  check DOI resolution, retraction status, or claim contradiction -- MP §42's other seven sub-capabilities
  (Evidence Strength, Retraction Check, Contradiction Detection, Data Provenance, Methodology Check,
  Statistical Validation, Reproducibility Package) remain unbuilt and out of scope for this method; every
  emitted record self-declares `scope: STRUCTURAL_ONLY` so a caller cannot mistake this for a full integrity
  check. GENUINE_COMPUTE: the builder takes no checks/summary parameter -- both are computed from the caller's
  literature items, and the gate independently re-derives them from the record's own stored projection.
  Non-diagnostic: this is a mechanical metadata check, never a judgment on a source's quality or truth.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md §42 (L2028-2050) -- Citation Verification, first of eight named Research Integrity Engine sub-capabilities"
  - "specs/cognitive/typed-objects/citation-verification-record.schema.yaml"
  - "capabilities/contracts/literature_search.capability.yaml -- the retrieval.citation_verification: NOT_PERFORMED field this method is the first real answer to (a caller can now run this method and update its own claim about whether verification happened)"

decided_by: "Operator directive 2026-09-17 (「繼續完成」, EdD gap-closure batch); no ADR governs the content."

id: research.citation_verification
version: "1.0.0"
family: research

cognitive_primitives: [VERIFY, EVALUATE]
# INFERRED, not cited.

purpose:
  - check_that_a_literature_sets_citation_metadata_is_structurally_complete_and_well_formed

inputs:
  required:
    - literature
  # The full LiteratureSet object literature_search emits ({set_id, query, items[], retrieval{}});
  # only items[] and set_id are actually consumed (see runtime module).

outputs:
  - CitationVerificationRecord

preconditions:
  - "literature.set_id is a non-empty string"
  - "literature.items is a non-empty list"
  - "no two items share the same non-null literature_id"

quality:
  provenance_required: true

forbidden_transition:
  - "Claiming a literature_id's citation is verified for anything beyond structural metadata completeness (no DOI resolution, no retraction check, no contradiction check)"
  - "Silently widening scope beyond STRUCTURAL_ONLY without a new contract version"

recommended_next:
  - evidence.triangulation

rollback:
  side_effect_free: true

open_questions:
  - "OQ-CITVER-1: should a future 2.0.0 perform live DOI resolution (a new egress target, doi.org) as a second, clearly-labeled check alongside the structural one, or stay offline-only forever?（owner: operator）"
  - "OQ-CITVER-2: Retraction Check needs an external retraction database (e.g. Retraction Watch's own data feed, which is not a free/open API) -- deferred until the operator picks a source, not attempted here."

verification:
  method: "Grepped the spec root and ai_lego for 'citation_verification'/'citation verification' before writing -- zero prior implementation beyond the NOT_PERFORMED placeholder value. Validated against specs/cognitive/method.schema.yaml via tests/run_golden_tests.py; typed-object schema exercised by tests/unit/test_citation_verification.py."
  note: "No mother document was modified. The STRUCTURAL_ONLY scope boundary is this contract's own compilation decision, made explicit rather than silently narrower than MP §42's full eight-capability list."

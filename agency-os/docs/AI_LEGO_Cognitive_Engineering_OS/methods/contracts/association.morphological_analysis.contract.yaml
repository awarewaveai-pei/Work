title: "Morphological Analysis Method Contract"
status: ACTIVE

description: >
  Tier 1, 1st member of the `association` family (F04, Associative Mapping & Combination -- 0/many built
  before this slice). Atlas's citations: F04 table row (L414: "Morphological Analysis｜多維 options 組合｜
  dimensions→options→合法組合→評估｜系統探索巨大 solution space｜MCDA、Prototype"), dedicated §11.11
  (L1436-1460: worked 4-dimension x 3-option table + 5-step 使用方式), and the §13.5 recipe mermaid node
  (L3341: SCAMPER -> Morphological Analysis -> Assumption Mapping). Not in EC §32. Core invariant:
  `legal_combinations` is GENUINE_COMPUTE -- the full cartesian product over dimensions[].options minus
  every (dimension,option)x(dimension,option) constraint violation, re-derived by both the builder and an
  independent gate, never caller-asserted (Atlas's own step 4, "產生合法 combinations", uses the literal verb
  GENERATE, not "declare").


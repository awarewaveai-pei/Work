  - "methods/contracts/security.attack_tree.contract.yaml -- genuine_compute two-layer + defensive-cap-before-compute (MAX_TREE_DEPTH) precedent reused here (MAX_RAW_COMBINATION_SPACE)"
  - "methods/contracts/framing.five_w_one_h.contract.yaml -- informs_<X>_ref forward soft-link convention reused here as informs_mcda_ref"
  - "methods/contracts/decision.mcda.contract.yaml -- Atlas's own named convergence step (§11.11 step 5), soft-linked only, not hard-required"

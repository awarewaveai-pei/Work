  - "OQ-CTXINQUIRY-2: evidence_labeling_required: false reflects this citation's own thinness (a single bare table row, 'B2B 特別有效' being a usage note not an evidence caution) rather than a positive Atlas statement that evidence labeling does not apply -- a future dedicated Atlas section for this method, if ever added, could change this (owner: operator)."
  - "OQ-CTXINQUIRY-3: cognitive_primitives is this file's own inference (Atlas §4 gives no formula for this method) (owner: operator, or whoever adds a dedicated Atlas §4 formula for this method)."


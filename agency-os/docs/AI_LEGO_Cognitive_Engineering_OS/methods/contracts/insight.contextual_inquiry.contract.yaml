preconditions:
  - "environment_context is present and non-empty -- Atlas's own '在真實環境觀察' framing: the real environment being observed must be disclosed, since the method's whole point (unlike a lab interview) is context-dependence"
  - "observations is present and non-empty -- a contextual inquiry session with zero recorded observations has not actually observed anything (Atlas's own benefit '發現隱性需求' presumes at least one real do-watch-ask cycle happened)"
  - "every observations[] entry carries ALL THREE non-empty fields -- action_observed, researcher_note, followup_question -- GENUINE_COMPUTE-checked (re-derived from the record's own raw fields, never trusted) by both the builder (fail-closed at construction) and an independent gate; an entry missing any one of the three has not actually completed the method's own literal cycle ('使用者做→研究者看→即時追問') for that moment, it is a bare note"

quality:
  provenance_required: true
  evidence_labeling_required: false

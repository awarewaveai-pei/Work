rollback:
  side_effect_free: true

compilation_decisions:
  - question: "Per-field/per-item provenance (one stamp per observations[] entry) or record-level only?"
    decision: "Record-level ONLY, one top-level `provenance` field -- a deliberate BATCH-WIDE decision for this whole F06 build (matching insight.jtbd's own identical record-level-only placement), made specifically to avoid the per-item/record-level ambiguity that hit both the F02 and F03 batches (see their own WORKLOG entries). A contextual inquiry session is one coherent research artifact about one environment, not a list of independently-sourced claims each needing its own provenance stamp."
    reasoning: >
      Not a per-field claim-provenance choice the way strategy.bcg_matrix's per-item quadrant provenance is
      -- observations[] entries are structural cycle-steps within ONE session, not independently-attributable
      claims from different sources.
  - question: "Should observations[] entries carry their own id (matching decomposition.problem_tree's causes[]/effects[].id), enabling a future cross-reference or uniqueness rule?"
    decision: "No -- not grounded in Atlas's own citation (no reference-integrity or cross-item lookup need exists for this method, unlike problem_tree's causes/effects disjointness, which the method's own '分離症狀與原因' benefit directly requires); inventing an id field with nothing to enforce it against would overstate this citation. Task-mandated exact shape is {action_observed, researcher_note, followup_question} only."
  - question: "Should the per-entry completeness check (all 3 fields non-empty) be a single combined invariant with the overall non-empty-list check, or two separate gates?"
    decision: "One combined gate (`observation_cycle_completeness`) covering both -- an empty list and an incomplete entry are the same underlying failure mode (the do-watch-ask cycle did not genuinely happen for some/all of the session), same grouping discipline learning.after_action_review's own `why_analysis` gate already establishes (covers both minimum-count AND per-entry word-floor under one gate id)."
  - question: "Should environment_context get its own independently-gated re-derivation, matching the observation-cycle gate?"
    decision: "No -- checked at construction only, same asymmetry learning.after_action_review's own expected/actual/version fields already establish ('schema owns the envelope, runtime owns the phase invariants'); the schema (`contextual-inquiry-session.schema.yaml`) is the non-emptiness source of truth for this scalar field, re-checked at construction as belt-and-suspenders against a gate re-derivation that may run against a hand-tampered record that never passed through schema validation at all."


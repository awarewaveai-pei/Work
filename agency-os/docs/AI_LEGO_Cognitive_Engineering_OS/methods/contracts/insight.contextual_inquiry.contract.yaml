id: insight.contextual_inquiry
version: "1.0.0"
family: insight

cognitive_primitives: [CONTEXTUALIZE, QUESTION, INFER]
# INFERRED, not cited -- Atlas §4 gives no composition formula for this method. CONTEXTUALIZE (extended
# token, same SWOT-formula precedent method.schema.yaml's sibling primitive.schema.yaml documents at L189)
# = "在真實環境觀察" anchoring the whole method in one real environment; QUESTION (kernel) = "即時追問" the
# literal 3rd arrow of the method's own cycle; INFER (kernel) = "發現隱性需求" (discovering IMPLICIT needs
# the user never states outright -- an inference from observed action, not a reported fact).

purpose:
  - discover_tacit_needs_by_observing_real_user_action_in_its_own_environment
# Atlas L466 verbatim sense: 用途「在真實環境觀察」/ 使用方式「使用者做→研究者看→即時追問」/ 效益「發現隱性需求」.

inputs:
  required: []
  optional: []
  # No upstream typed-object required -- same "no hard upstream dependency" position every other opening/

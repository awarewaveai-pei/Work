# No §14.1-style legal/illegal chain citation exists for this method (grep-confirmed).

recommended_next: []
# Atlas's own F06 table row names no downstream method for Contextual Inquiry specifically, and the F06
# mermaid diagram (L471-476) only chains JTBD -> Pain/Gain -> HMW -> Ideation -> Prototype, never mentioning
# Contextual Inquiry at all (grep-confirmed) -- left empty rather than picking an arbitrary sibling F06

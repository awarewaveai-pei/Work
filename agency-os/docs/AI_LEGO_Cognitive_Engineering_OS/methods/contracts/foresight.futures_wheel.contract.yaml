$id: "ai-lego://methods/contracts/foresight.futures_wheel.contract.yaml"
title: "Futures Wheel Method Contract"
status: ACTIVE

description: >
  F13 foresight family (Atlas L682: "Futures Wheel | 展開 1/2/3 階影響 |
  center event->direct->indirect->structural | 強制 second/third-order").
  Atlas §11.28 (L1837-1860) gives this method a dedicated section with a
  mermaid fan-out graph: one center event to 1st-order to 2nd-order (Atlas's
  own worked example stops at 2nd order; the schema's own order enum still
  permits a declared 3rd order). Core invariant: order-parent consistency --
  an order-1 impact's parent is the center event, an order-N impact's
  parent must be a declared order-(N-1) impact, no orphans and no skipped
  orders -- structurally forcing the second/third-order thinking Atlas
  names as this method's own benefit (強制避免只看「直接好處」).

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §11.28 未來輪／未來影響輪（Futures Wheel）(L1837-1860)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F13 index row (L682)"
  - "specs/cognitive/method.schema.yaml -- the schema this file's body is validated against"

decided_by: >
  No ADR governs the content. Atlas §11.28 gives a real fan-out graph --
  direct transcription plus low-risk, disclosed compilation choices.

id: foresight.futures_wheel
version: "1.0.0"
family: foresight

cognitive_primitives: [DECOMPOSE, INFER, EXPLAIN]
# INFERRED, not cited. DECOMPOSE fans one center event out into successive
# order tiers; INFER identifies each order-N effect from its order-(N-1)
# parent; EXPLAIN articulates each effect as a real statement. All three
# CANONICAL_KERNEL members.

purpose:
  - fan_a_center_event_into_ordered_direct_indirect_structural_effects

inputs:
  required:
    - CenterEventDescription
  # NEW DESIGN. Atlas names no upstream typed-object input; a free-text
  # description of the center event is the honest starting point.

outputs:
  - FuturesWheel
# NEW output type (see typed-objects/futures-wheel.schema.yaml).

preconditions:
  - "at least one order-1 impact, and every declared impact's parent_id resolves per the order-parent consistency rule"
  # NEW, structurally necessary -- a wheel with a center and nothing
  # fanned out around it is not a wheel.

quality:
  provenance_required: true

forbidden_transition: []
# No sibling typed object exists yet to name a type-incompatible hop into.

recommended_next:
  - foresight.backcasting
# Same F13 table ordering (Atlas L682-683) -- once downstream effects are
# mapped, backcasting from a chosen future state to today's actions is the
# natural next step.

rollback:
  side_effect_free: true

open_questions:
  - "OQ-FUTURESWHEEL-1: cognitive_primitives is this file's own inference, not a cited Atlas §4 formula.（owner: operator）"
  - "OQ-FUTURESWHEEL-2: CENTER_EVENT_PARENT_ID sentinel vs a real id on center_event -- see typed-objects/futures-wheel.schema.yaml's own open_questions.（owner: operator）"

verification:
  method: >
    Read Atlas §11.28 (L1837-1860) and the F13 index row (L682) directly.
    Grepped the full spec root case-insensitively for "futures wheel"/
    "futures_wheel" before writing -- zero pre-existing implementation or
    schema title overlap found. Validated against specs/cognitive/
    method.schema.yaml with jsonschema.Draft202012Validator.
  note: >
    No mother document was modified. The 1/2/3-order fan-out is
    transcribed verbatim from Atlas §11.28's own mermaid graph.
    purpose/preconditions naming, the free-text input scope, and the
    CENTER_EVENT_PARENT_ID sentinel are Phase 3-class compilation
    decisions, disclosed above.

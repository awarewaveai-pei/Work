    aggregation to this Atlas row) and this contract's own sibling epistemic.bayesian_updating. No duplicate
    found. Validated against specs/cognitive/method.schema.yaml with jsonschema.Draft202012Validator.
  note: >
    No mother document was modified. Atlas names the technique and purpose only; the Brier score formula is a
    disclosed compilation decision. cognitive_primitives, the self-contained predictions[] shape, and the
    rounding/tolerance choices are disclosed compilation decisions above.

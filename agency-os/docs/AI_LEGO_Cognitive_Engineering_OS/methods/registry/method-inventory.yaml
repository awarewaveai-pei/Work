$id: "ai-lego://methods/registry/method-inventory.yaml"
title: Atlas Method Inventory (Phase 3 Registry)
version: "1.0.0"
status: ACTIVE

description: >
  Machine-readable registry of every method/lens/primitive/recipe entry the
  Cognitive Method Atlas, Master Plan, and Execution Contract mother documents
  define or reference. This file is a MIGRATION of the Phase 0 mechanical
  catalog (.ai/research/phase-0/method-inventory.yaml, 289 entries, produced by
  workflow wf_7d1cd8d8-038 reading every line of all three mother docs), NOT a
  re-cataloging. docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §2.7's row for
  this file is explicit: "沿用 Phase 0 既有 289 條目編目...升級為 Phase 3 正式 registry（非重新編目）".
  Two things were added on top of the Phase 0 content, nothing was removed or
  re-derived: (1) this header block, in the house style established by
  specs/governance/epistemic-label.schema.yaml; (2) a `contract_status` field on
  every entry, mechanically derived from that same entry's pre-existing
  `has_contract` field (true -> complete, false -> pending) so this registry can
  be cross-referenced against the new methods/registry/contract-backlog.yaml
  without a second source of truth for the same fact. The `by_document` grouping,
  every `name`/`line`/`category`/`machine_id`/`has_contract`/`note` value, and
  the original line numbers (1-indexed into the hashed mother-doc snapshots) are
  copied verbatim from the Phase 0 file. **EXCEPTION, 2026-09-12**: every `line`
  value under the Atlas document key was re-synced against the live Atlas file
  (230 of 284 rows were stale, drifting in era-shaped bands -- +1 for the
  primitives/F01-F08/F10 block, +3 for F11/F13-F21, -9 for F22-F24 and the
  §11.29/lens entries, -18/-32 for the §13 recipes -- because this migration
  froze a Phase 0 snapshot of an older Atlas revision and nothing ever re-synced
  it). Successive family batches had each been correcting only their own rows
  (F12 found its 10 off by 3; F09 its 8 off by 1), which never closed the class.
  `tests/unit/test_method_inventory_line_numbers.py` now mechanically asserts
  every citation lands on the line that defines its entry, so this cannot
  silently drift again. Names/categories/machine_ids remain Phase 0 content --
  only the stale coordinates were corrected. Known inconsistencies such
  as the "SWOT" entry's `machine_id: method.swot` predating
  docs/adr/ADR-005-db-migration-recipe-and-method-id-grammar.md's bare
  `<family>.<name>` grammar decision (that ADR's own worked example instead
  gives `strategy.swot`; see methods/registry/contract-backlog.yaml's Tier 0
  entry for the corrected form). Reconciling that drift is out of scope for a
  migration and is left for whoever writes this method's formal
  cognitive/method.schema.yaml contract.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md primitives (L158-181), F01-F24 method families (L333-981), Monte Carlo Simulation (L1867), stakeholder.regulator lens (L1036), recipes (L3228-3523) -- catalog membership only, not contract content"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md example methods used in Workflow IR samples (L742-833, L1027)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md Evidence-first Debugging (L3633)"

decided_by: >
  Catalog content: no ADR governs Phase 0's mechanical extraction (see that
  file's own header: "this REGISTERS what exists; nothing is fixed here").
  Promotion of this catalog to Wave 3 registry status (this file's existence
  and location): docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §2.7 row for
  method-inventory.yaml (status: READY, "遷移既有檔案，非新建內容"),
  itself part of the Wave 0-3 build order in §3 (Wave 3, parallel with
  specs/cognitive/*.schema.yaml). The `contract_status` field's two-value
  mapping (complete/pending) and its cross-reference to
  methods/registry/contract-backlog.yaml follow §4 "Atlas Method Contract
  補齊策略" of the same plan document.


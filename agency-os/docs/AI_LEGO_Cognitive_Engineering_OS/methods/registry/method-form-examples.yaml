# One worked example per method, shown in the dashboard as 「用這個範例填入」: it fills the real form.
#
# `input` is keyed by BUILDER PARAMETER, exactly like the dashboard's own form state, so filling the form
# with it and pressing 執行 sends what is written here. Row provenance is deliberately absent -- the form
# fills its own honest default, the same as for a person typing.
#
# These are the same scenarios method-display-metadata.yaml's `example_zh` describes in prose, but as data:
# tests/unit/test_method_form.py pushes every entry through the form serializer into the real builder and
# its gates, so an example can never drift from what the method actually accepts. Prose cannot be tested.
#
# Two methods have no entry (research.qualitative_coding, evidence.triangulation): their inputs are other
# steps' outputs, so they run only inside their recipe.
examples:
  architecture.adr:
    input:
      alternatives_considered:
      - 維持 WooCommerce 外掛方案，接受單平台限制
      - 自建 adapter 層同時支援外掛與 native，複雜度換取相容性
      compatibility: 既有外掛客戶不受影響，向前相容。
      context: 多客戶／多平台需求成長，app 本身定位是操作台而非商店本體，既有外掛方案耦合單一平台且難以擴充。
      data_impact: 訂單 schema 需要一次性遷移腳本，既有客戶資料不動。
      decision: 新客戶一律走 native fulfillment pipeline；既有客戶不強制遷移。
      migration: 新客戶直接走 native；既有客戶維持現狀，無強制遷移時程。
      operational_impact: 新增一條獨立 pipeline 需要維運，短期維運成本上升。
      revisit_reversal_conditions: 若 native pipeline 維運成本超過外掛方案 2 倍，重新評估。
      rollback: native pipeline 若出問題，個別客戶可退回外掛方案（一次性、非自動）。
      security_privacy_impact: 訂單資料不再經過第三方外掛儲存層，降低資料外洩面。
      status: accepted
      title: POD 訂單履約走 native 架構，不走 WooCommerce 外掛
      validation: 上線後追蹤前 3 個 native 客戶的訂單成功率與人工介入率。
    scenario: 團隊要把 MySQL 換成 PostgreSQL。

$id: "ai-lego://methods/registry/method-display-metadata.yaml"
title: "Method Display Metadata -- bilingual name + usage blurb per ACTIVE method"
status: ACTIVE

description: >
  Separate from each method's own `.contract.yaml` on purpose: a contract's `description` field is
  written for a future engineer/AI reading it (compilation rationale, Atlas line citations, tier
  justification) per AGENTS.md §9 -- it is NOT end-user copy and was never meant to be. This file is
  the single source of truth for what the DASHBOARD shows a human operator: a clean bilingual name and
  a one-breath "what it does + when to use it" blurb. One file, not 280 edited contracts, so this can be
  revised without touching contract provenance. Built 2026-09-18 (operator: dashboard UI overhaul,
  "我不是要看 slug 名稱，而是要有中英文名稱...每個工具應該說明介紹功能和使用方式").

  Content origin, disclosed: for the ~13 `art_therapy.*` methods, the Chinese name and use-line are
  quoted near-verbatim from the contract's own therapeutic-use description (already operator-authored,
  from ART_THERAPY_METHOD_ATLAS_GAP_LIST.md). For the ~267 Method-Atlas-sourced methods, the blurb is
  written from the method's own well-known real-world definition (ADR, MCDA, SWOT, RCT, FMEA, etc. are
  standard, independently-verifiable frameworks) plus the specific scope/caveat this contract's own
  description discloses (e.g. "records study DESIGN only, does not run the actual regression").

decided_by: >
  No ADR. A UI/UX content file, not a domain or execution contract -- schema-golden-test suite does
  not need to validate this the way it validates methods/contracts/*.contract.yaml.

entries:

  # ---- architecture (F18 Software Architecture Pack) ----
  architecture.adr:
    name_en: "Architecture Decision Record"
    abbr: "ADR"
    name_zh: "架構決策紀錄"
    blurb_en: "Records one architecture decision -- context, options considered, the decision, and its consequences -- so future readers know why it was made this way. Use it whenever you lock in a significant technical choice."
    blurb_zh: "記錄一個架構決策：脈絡、考慮過的選項、最後決定、後續影響，讓未來的人知道當初為什麼這樣選。做重大技術選型時用。"
    why_en: "Forces the context, alternatives, and consequences to be written down at decision time, so 'why we chose this' survives staff turnover -- the decision becomes a traceable record instead of living only in someone's memory."
    why_zh: "強制把決策當下的脈絡、選項、後果寫下來，讓「為什麼當初這樣選」不會隨人員流動而消失——決策變成可追溯的紀錄，不是只存在某人記憶裡。"
    url: "https://adr.github.io/"
    example_en: "Scenario: the team decides to switch from MySQL to PostgreSQL. title: 'Switch to PostgreSQL from MySQL'; status: 'proposed'; context: 'MySQL table-locks under high write concurrency'; decision: 'Migrate to PostgreSQL for its MVCC engine'; alternatives_considered: ['Keep MySQL with read replicas', 'Switch to MongoDB']; each impact field (security_privacy_impact/data_impact/operational_impact/compatibility/migration/rollback/validation) gets 1-2 real sentences, e.g. migration: 'Dual-write for 3 months before cutting over traffic.'"
    example_zh: "情境：團隊要把 MySQL 換成 PostgreSQL。\ntitle：「改用 PostgreSQL 取代 MySQL」\nstatus：「proposed」\ncontext：「MySQL 高並發寫入時鎖表」\ndecision：「遷移到 PostgreSQL，用其 MVCC 機制」\nalternatives_considered：[\"維持 MySQL 加讀寫分離\", \"改用 MongoDB\"]\n其餘影響類欄位（security_privacy_impact/data_impact/operational_impact/compatibility/migration/rollback/validation）各寫 1-2 句實際內容，例如 migration：「先雙寫 3 個月再切流量」。\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
  architecture.atam:
    name_en: "Architecture Tradeoff Analysis Method"
    abbr: "ATAM"
    name_zh: "架構取捨分析法"
    blurb_en: "Systematically finds Sensitivity Points, Tradeoff Points, Risks and Non-risks in a proposed architecture. Use it to pressure-test whether a design actually holds up."
    blurb_zh: "針對一個架構方案，系統性找出敏感點、取捨點、風險、非風險四類發現。要驗證架構設計禁不禁得起壓力測試時用。"
    why_en: "Having stakeholders jointly brainstorm scenarios against the architecture systematically surfaces sensitivity points and tradeoffs, instead of a gut feeling that the architecture is 'probably fine.'"
    why_zh: "讓利害關係人一起針對架構腦力激盪情境，系統性逼出敏感點和取捨點，而不是憑感覺說架構「應該還可以」。"
    url: "https://en.wikipedia.org/wiki/Architecture_tradeoff_analysis_method"
    example_en: "Scenario: evaluating whether a new order system can survive Black Friday traffic. architecture_description: 'Order service + message queue + MySQL primary-replica'; findings has >=1 entry, e.g. {category: 'sensitivity_point', description: 'Queue shard count directly caps peak throughput', quality_attribute: 'performance'} (category must be one of sensitivity_point/tradeoff_point/risk/non_risk)."
    example_zh: "情境：評估新訂單系統扛不扛得住尖峰流量。\narchitecture_description：「訂單服務+訊息佇列+MySQL 主從」\nfindings 至少 1 筆，例如 {category: \"sensitivity_point\", description: \"佇列分片數直接決定尖峰吞吐上限\", quality_attribute: \"performance\"}（category 必須是 sensitivity_point/tradeoff_point/risk/non_risk 其中之一）。\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
  architecture.ddd:
    name_en: "Domain-Driven Design"
    abbr: "DDD"
    name_zh: "領域驅動設計"
    blurb_en: "Splits a complex business domain into subdomains, bounded contexts, and a context map. Use it when system boundaries are fuzzy and you need to clarify who owns what."
    blurb_zh: "把複雜業務領域拆成子領域、限界脈絡、脈絡地圖。系統邊界模糊、想釐清「這塊該歸誰管」時用。"
    why_en: "Forces a large, fuzzy business domain to be split into subdomains with clear boundaries first, then maps how they actually talk to each other -- the most common symptom of fuzzy boundaries (the same word meaning different things to two teams) gets forced to the surface."
    why_zh: "強迫先把大而模糊的業務領域拆成邊界清楚的子領域，再畫出彼此怎麼互動——邊界不清楚最常見的後果（同一個詞在兩團隊代表不同意思）會被迫浮現。"
    url: "https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf"
    example_en: "Scenario: an e-commerce platform clarifies what 'order' means to logistics vs. customer service. domain_description: 'Order processing for an e-commerce platform'; subdomains has >=1 entry, e.g. {name: 'Logistics', type: 'core'} (type must be core/supporting/generic); optional bounded_contexts/context_map describe the integration pattern between subdomains (e.g. 'customer_supplier')."
    example_zh: "情境：電商平台釐清「訂單」在物流跟客服眼中的不同定義。\ndomain_description：「電商平台的訂單處理」\nsubdomains 至少 1 筆，每筆需要唯一 id，例如 {id: \"logistics\", name: \"物流\", type: \"core\"}（type 選填，填的話必須是 core/supporting/generic 其中之一）。\n（選填）bounded_contexts：每筆需要唯一 id 跟至少 1 個 subdomain_ids（對應到真實存在的 subdomain id），例如 {id: \"logistics-bc\", subdomain_ids: [\"logistics\"]}。\n（選填）context_map：描述兩個 bounded_context 之間的整合模式，from_context_id/to_context_id 都要對到真實存在的 bounded_context id，pattern 必須是 9 種標準 DDD 模式之一（例如 customer_supplier），例如 {from_context_id: \"logistics-bc\", to_context_id: \"support-bc\", pattern: \"customer_supplier\"}。\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
  architecture.dependency_mapping:
    name_en: "Dependency Mapping"
    abbr: ""
    name_zh: "相依關係地圖"
    blurb_en: "Maps the dependencies between services, vendors, and data to surface hidden single points of failure. Use it to answer 'what breaks if this goes down?'"
    blurb_zh: "畫出服務／廠商／資料之間的相依關係，找出隱藏的單點故障。想知道「這個東西掛了會拖累誰」時用。"
    why_en: "Makes 'what depends on what' explicit as nodes and edges, so 'if I change this, who else is affected' becomes something you read off a map, instead of relying on a developer's memory or asking around."
    why_zh: "把「誰依賴誰」明講成節點跟邊，這樣「改這個會影響誰」是圖上直接查得到的答案，不用靠開發者記憶或臨時問人。"
    url: "https://aws.amazon.com/what-is/dependency-mapping/"
    example_en: "Scenario: figuring out what breaks if the 'user authentication service' changes. system_under_mapping: 'User Authentication Service'; nodes has >=1 entry, e.g. {id: 'auth-svc', node_type: 'service'} (node_type must be service/vendor/data); edges has >=1 entry, e.g. {from_id: 'order-svc', to_id: 'auth-svc', is_critical: true, fallback: 'Degrade to read-only mode'} (fallback is required whenever is_critical is true)."
    example_zh: "情境：搞清楚改動「使用者驗證服務」會波及誰。\nsystem_under_mapping：「使用者驗證服務」\nnodes 至少 1 筆，例如 {id: \"auth-svc\", node_type: \"service\"}（node_type 必須是 service/vendor/data 其中之一）\nedges 至少 1 筆，例如 {from_id: \"order-svc\", to_id: \"auth-svc\", is_critical: true, fallback: \"降級為唯讀模式\"}（is_critical 為 true 時 fallback 必填）。\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
  architecture.event_storming:
    name_en: "Event Storming"
    abbr: ""
    name_zh: "事件風暴"
    blurb_en: "Bottom-up discovery of a business process by listing every domain event first, before any structure is imposed. Use it when designing a new system or untangling how an old one actually behaves."
    blurb_zh: "用「先列出所有領域事件」的方式，由下而上探索一個業務流程的真實樣貌。設計新系統或釐清舊系統邏輯時用。"
    why_en: "The constraint of 'list every business event first' forces participants to think in a timeline instead of jumping straight to technical details -- once the causal chain between events is visible, system boundaries tend to surface on their own."
    why_zh: "用「先列出所有業務事件」的限制，逼參與者用時間順序思考，而不是一開始就掉進技術細節——事件之間的因果關係看清楚後，系統邊界會自然浮現。"
    url: "https://www.eventstorming.com/"
    example_en: "Scenario: mapping 'customer places order to shipment'. domain_process_description: 'E-commerce order-to-shipment flow'; elements has >=1 entry, each needing a unique id and a type from {domain_event, command, actor, policy, external_system, aggregate, read_model}, e.g. {id: 'cmd1', type: 'command', label: 'Customer submits order'} and {id: 'evt1', type: 'domain_event', label: 'Order Placed'}; relationships has >=1 entry linking them, e.g. {from_id: 'cmd1', to_id: 'evt1'} -- every domain_event element needs at least one incoming relationship (no orphan events)."
    example_zh: "情境：梳理「客戶下單到出貨」流程。\ndomain_process_description：「電商下單到出貨流程」\nelements 至少 1 筆，每筆需要唯一 id 跟一個 type（從 domain_event/command/actor/policy/external_system/aggregate/read_model 選），例如 {id: \"cmd1\", type: \"command\", label: \"客戶送出訂單\"} 和 {id: \"evt1\", type: \"domain_event\", label: \"訂單已建立\"}\nrelationships 至少 1 筆連接它們，例如 {from_id: \"cmd1\", to_id: \"evt1\"}——每個 domain_event 元素都要至少有一筆指向它的關係（不能是孤兒事件）。\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
  architecture.fitness_functions:
    name_en: "Architecture Fitness Functions"
    abbr: ""
    name_zh: "架構適應度函數"
    blurb_en: "Turns an architecture invariant into an automated, continuously-checked test or metric so the architecture doesn't quietly decay over time. Use it to permanently enforce a rule (e.g. 'no cross-module direct DB calls')."
    blurb_zh: "把架構的不變量寫成可自動化檢查的測試／指標，持續守住不讓架構隨時間腐化。想長期守住某個架構原則時用。"
    why_en: "Turns 'has this architecture degraded' from a subjective meeting argument into an objective check that runs automatically on every CI/CD pipeline run -- guarding quality no longer depends on someone remembering to look."
    why_zh: "把「架構有沒有變壞」從開會時的主觀爭論，變成每次 CI/CD 都自動跑的客觀檢查——不再依賴有人記得要盯著看。"
    url: "https://www.thoughtworks.com/en-us/insights/articles/fitness-function-driven-development"
    example_en: "Scenario: ensuring a microservices architecture doesn't quietly grow circular dependencies. architecture_under_governance: 'Order microservices cluster'; functions has >=1 entry, e.g. {name: 'no_circular_dependencies', type: 'static_analysis', threshold: '0 circular dependencies', frequency: 'every CI build'}."
    example_zh: "情境：確保微服務架構不會悄悄長出循環依賴。\narchitecture_under_governance：「訂單微服務群」\nfunctions 至少 1 筆，例如 {name: \"no_circular_dependencies\", type: \"static_analysis\", threshold: \"0 個循環依賴\", frequency: \"每次 CI build\"}。\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
  architecture.quality_attribute_scenario:
    name_en: "Quality Attribute Scenario"
    abbr: ""
    name_zh: "品質屬性情境"
    blurb_en: "Turns a vague non-functional goal ('stable, secure, fast') into a testable scenario: Source -> Stimulus -> Artifact -> Environment -> Response -> Measure. Use it when requirements or acceptance criteria are too fuzzy to test."
    blurb_zh: "把模糊的非功能需求（穩定、安全、快）轉成可測試的具體情境（來源→刺激→產物→環境→回應→量測）。寫需求或驗收標準太空泛時用。"
    why_en: "Breaks a vague expectation like 'the system should be fast enough' into six concrete parts (source/stimulus/artifact/environment/response/measure), forcing out an actual testable number instead of an endlessly-arguable adjective."
    why_zh: "把「系統要夠快」這種說不清楚的期待，拆成六個具體欄位（來源/刺激/產物/環境/回應/量測），逼出真的能拿去測試的數字，不是永遠吵不完的形容詞。"
    url: "https://www.sei.cmu.edu/documents/5465/2013_018_101_60984.pdf"
    example_en: "Scenario: pinning down 'the system needs to survive peak traffic'. quality_goal: 'Performance'; source: 'Traffic spike from a marketing campaign'; stimulus: '5000 order requests per second'; artifact: 'Order service'; environment: 'Normal operating hours'; response: 'System queues requests without dropping any'; measure: '99% of requests respond within 2 seconds, 0 orders lost'. All 7 text fields must be non-empty."
    example_zh: "情境：把「系統要撐住尖峰流量」講清楚。\nquality_goal：「效能」\nsource：「行銷活動導入的突發流量」\nstimulus：「每秒 5000 個下單請求」\nartifact：「訂單服務」\nenvironment：「正常營運時段」\nresponse：「系統排隊處理，不掉單」\nmeasure：「99% 請求 2 秒內回應，0 筆訂單遺失」\n以上 7 個文字欄位都必須非空。\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
  architecture.strangler_fig:
    name_en: "Strangler Fig Pattern"
    abbr: ""
    name_zh: "絞殺者模式"
    blurb_en: "Replace a legacy system incrementally: pick a seam, migrate one small slice, verify, expand, retire the old piece. Use it when you need to replace a legacy system but can't risk a big-bang rewrite."
    blurb_zh: "找一個切入點，逐步用新系統取代舊系統的一小塊，驗證後擴大範圍，最後淘汰舊系統。要漸進式汰換遺留系統、不敢一次重寫時用。"
    why_en: "Instead of a risky big-bang rewrite, it puts an interception layer in front of the legacy system and migrates one slice at a time, each independently verifiable -- the old system is slowly replaced, not demolished and rebuilt in one shot."
    why_zh: "不是一次性重寫（風險最高），而是在舊系統前架一層攔截層，一小片一小片搬到新系統，每片都能立刻驗證——舊系統慢慢被取代，不是被推倒重蓋。"
    url: "https://martinfowler.com/bliki/StranglerFigApplication.html"
    example_en: "Scenario: gradually replacing a ten-year-old monolith with microservices. legacy_system_under_migration: 'Ten-year-old order-processing monolith'; seams has >=1 entry, e.g. {name: 'Order lookup API', interception_point: 'API Gateway'}; slices has >=1 entry with a status from {planned, verified, expanded, retired}, e.g. {name: 'Migrate order lookup to new service', order: 1, status: 'planned'}."
    example_zh: "情境：把十年歷史的單體系統慢慢換成微服務。\nlegacy_system_under_migration：「十年歷史的訂單單體系統」\nseams 至少 1 筆，例如 {name: \"訂單查詢 API\", interception_point: \"API Gateway\"}\nslices 至少 1 筆，status 必須是 planned/verified/expanded/retired 其中之一，例如 {name: \"訂單查詢遷移到新服務\", order: 1, status: \"planned\"}。\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
  architecture.system_context_model:
    name_en: "C4 Model"
    abbr: "C4"
    name_zh: "C4 模型"
    blurb_en: "Explains the same architecture at four depths (System Context -> Container -> Component -> Code) appropriate to the audience. Use it when talking to different audiences (executives vs engineers) about the same system."
    blurb_zh: "用系統脈絡→容器→元件→程式碼四個層次，依聽眾需要的深度解釋同一個架構。要跟不同對象（主管／工程師）溝通架構時用。"
    why_en: "Draws the coarsest picture first -- where this system's boundary with the outside world is -- before zooming into containers and components, avoiding the most common failure mode: a diagram stuffed with detail from the start that nobody can read the big picture from."
    why_zh: "先畫最粗略的圖（系統跟外部世界的邊界在哪），再逐層放大到容器、元件——避免一開始就塞滿技術細節、沒人看得懂全貌的常見失敗模式。"
    url: "https://c4model.com/"
    example_en: "Scenario: letting a new hire understand an e-commerce system in 5 minutes. system_context: 'E-commerce platform; users place orders via web, integrated with a payment gateway and logistics providers'; containers has >=1 entry, each needing a unique id, e.g. {id: 'web-frontend', name: 'Web frontend', technology: 'React', description: 'Order-placing UI'}. Optional components must each reference a real container_id; optional code must each reference a real component_id."
    example_zh: "情境：讓新人 5 分鐘看懂電商系統的整體樣貌。\nsystem_context：「電商平台，使用者透過網頁下單，串接金流與物流廠商」\ncontainers 至少 1 筆，每筆需要唯一 id，例如 {id: \"web-frontend\", name: \"Web 前端\", technology: \"React\", description: \"使用者下單介面\"}。\n（選填）components：每筆需要唯一 id 且 container_id 對到真實存在的 container，例如 {id: \"order-ui\", container_id: \"web-frontend\", name: \"訂單頁面元件\"}。\n（選填）code：每筆的 component_id 要對到真實存在的 component。\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
  architecture.trade_off_matrix:
    name_en: "Architecture Trade-off Matrix"
    abbr: ""
    name_zh: "架構取捨矩陣"
    blurb_en: "Compares multiple candidate architectures with weighted criteria and sensitivity analysis. Use it when you're choosing between several real architecture options."
    blurb_zh: "用權重跟評分比較多個候選架構方案，含敏感度分析。要在多個架構選項之間做決定時用。"
    why_en: "Turns 'pick an option by gut feeling' into 'every option scored on every criterion, multiplied by weight and summed' -- the decision becomes inspectable and repeatable. If someone later asks why, the answer is a number in a table, not a vague impression."
    why_zh: "把「憑感覺選方案」變成「每個方案在每個標準上都有分數，乘上權重加總」——決策可以被檢視、複製。事後有人問為什麼，答案是表格裡的數字，不是模糊印象。"
    url: "https://nanoglobals.com/tools/decision-matrix/"
    example_en: "Scenario: choosing between two cloud providers on cost and performance. options has >=2 entries with a unique id, e.g. [{id: 'aws'}, {id: 'gcp'}]; criteria each need id/label/direction (maximize or minimize), e.g. [{id: 'cost', label: 'Cost', direction: 'minimize'}, {id: 'performance', label: 'Performance', direction: 'maximize'}]; raw_scores has one entry per option x criteria pair, e.g. {option_id: 'aws', criterion_id: 'cost', raw_value: 7}; weights must sum to exactly 1.0, e.g. [{criterion_id: 'cost', weight: 0.4}, {criterion_id: 'performance', weight: 0.6}]; sensitivity_notes is a required non-empty string disclosing how sensitive the ranking is to the weights chosen."
    example_zh: "情境：在兩個雲端供應商之間依成本與效能做選擇。\noptions 至少 2 筆且各有唯一 id，例如 [{id: \"aws\"}, {id: \"gcp\"}]\ncriteria 每筆需要 id/label/direction（maximize 或 minimize），例如 [{id: \"cost\", label: \"成本\", direction: \"minimize\"}, {id: \"performance\", label: \"效能\", direction: \"maximize\"}]\nraw_scores 對每個「方案×標準」組合給一筆，例如 {option_id: \"aws\", criterion_id: \"cost\", raw_value: 7}\nweights 總和必須剛好是 1.0，例如 [{criterion_id: \"cost\", weight: 0.4}, {criterion_id: \"performance\", weight: 0.6}]\nsensitivity_notes 是必填非空字串，說明排名對權重選擇有多敏感。\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"

  # ---- art_therapy (operator's 54-item art-therapy tool list; Chinese names/use are source-original) ----
  art_therapy.conflict_mapping:
    name_en: "Conflict Mapping"
    abbr: ""
    name_zh: "衝突地圖"
    blurb_en: "Reviews past internal/external conflicts and marks the path of transformation, turning it into a resource memory. Non-diagnostic -- holds the client's own words."
    blurb_zh: "回顧曾經的內外衝突，標示轉化路徑，形成資源記憶。非診斷工具，記錄的是案主自己的話。"
  art_therapy.full_stop_method:
    name_en: "Full Stop Method"
    abbr: ""
    name_zh: "句點分析法"
    blurb_en: "Breaks thoughts/emotions into segments, sentence by sentence, to unpack over-generalized or emotionally-charged phrasing. Non-diagnostic."
    blurb_zh: "把思緒／情緒分段檢視，逐句拆解過度概括或情緒化句型。非診斷工具。"
  art_therapy.life_wheel:
    name_en: "Life Wheel"
    abbr: ""
    name_zh: "生命之輪"
    blurb_en: "Rates the balance across several self-named life dimensions (0-10 each). Non-diagnostic self-rating."
    blurb_zh: "評估生活各面向的平衡狀態，案主自評 0-10 分。非診斷工具。"
  art_therapy.metaphor_dialogue:
    name_en: "Metaphor Dialogue"
    abbr: ""
    name_zh: "隱喻對話"
    blurb_en: "A dialogue with a self-created symbolic figure to reconcile conflict and support transformation. Non-diagnostic."
    blurb_zh: "與自創象徵角色進行對話，調和衝突、支持轉化。非診斷工具。"
  art_therapy.motivation_matrix:
    name_en: "Motivation Matrix"
    abbr: ""
    name_zh: "動機矩陣"
    blurb_en: "Analyzes what drives or blocks an action, scored by source (intrinsic/extrinsic) and polarity. Non-diagnostic."
    blurb_zh: "分析推動或阻礙行動的動機來源。非診斷工具。"
  art_therapy.role_playing:
    name_en: "Role Playing"
    abbr: ""
    name_zh: "角色扮演"
    blurb_en: "Simulates a role's behavior to anticipate and reflect on it. Non-diagnostic."
    blurb_zh: "模擬角色行為以預測與反思。非診斷工具。"
  art_therapy.story_completion:
    name_en: "Story Completion"
    abbr: ""
    name_zh: "故事延續"
    blurb_en: "Designs an 'unfinished story' for the client to complete, surfacing inner characters and feelings. Non-diagnostic."
    blurb_zh: "設計「未說完的故事」讓案主接續完成，表達內在角色與感受動力。非診斷工具。"
  art_therapy.storytelling:
    name_en: "Storytelling"
    abbr: ""
    name_zh: "故事敘說"
    blurb_en: "Builds meaning and shared experience through narrative (setting/conflict/resolution/meaning). Non-diagnostic."
    blurb_zh: "用敘事建構意義與共享經驗。非診斷工具。"
  art_therapy.synonym_substitution:
    name_en: "Synonym Substitution"
    abbr: ""
    name_zh: "同義詞替換"
    blurb_en: "Adjusts habitual negative language, e.g. reframing 'I'm terrible' as 'I'm still learning'. Non-diagnostic."
    blurb_zh: "調整負面語言習慣，例如將「我很糟」換成「我正在學習中」。非診斷工具。"
  art_therapy.turning_point_analysis:
    name_en: "Turning Point Analysis"
    abbr: ""
    name_zh: "轉折點分析"
    blurb_en: "Guides awareness of key turning-point events in life and explores their deep effect on emotion and belief. Non-diagnostic."
    blurb_zh: "引導案主覺察生命中的關鍵轉折事件，探索其對情緒與信念的深層影響。非診斷工具。"
  art_therapy.value_clarification:
    name_en: "Value Clarification"
    abbr: ""
    name_zh: "價值澄清"
    blurb_en: "Helps a client name the core values and life direction that emerged after a transformation. Non-diagnostic."
    blurb_zh: "協助案主明確轉化過後最核心的價值與人生方向。非診斷工具。"
  art_therapy.visual_metaphor:
    name_en: "Visual Metaphor"
    abbr: ""
    name_zh: "視覺隱喻創作"
    blurb_en: "Uses imagery to express subconscious experience, giving shape to vague feelings -- a non-verbal creative starting point. Non-diagnostic."
    blurb_zh: "用圖像表達潛意識經驗，將模糊感受具象化，是非語言創作啟動工具。非診斷工具。"
  art_therapy.wusheng_five_phase:
    name_en: "WuSheng Five Phase Method"
    abbr: ""
    name_zh: "五階段療程系統（五行五階段）"
    blurb_en: "Places a client at one of five fixed phases (WS-01 to WS-05) in a change-hypothesis cycle grounded in Chinese Five-Element/Zang-Fu theory, requiring the practitioner's own written progress evidence at each phase. Use it to track where a client is in a structured, multi-phase change process -- it records the evidence, but a human still judges whether a phase's own target was actually met."
    blurb_zh: "把個案安置在五個固定階段（WS-01 至 WS-05）之一，此階段架構源自中醫五行／臟腑理論對應改變假設驗證循環，每個階段都需要治療師親自寫下的進度證據。想追蹤個案在一個結構化多階段改變歷程中的位置時用——系統只負責記錄證據，是否真的達標仍由人判斷。"
  art_therapy.workshop_certificate_drawing:
    name_en: "Workshop Certificate Drawing"
    abbr: ""
    name_zh: "工作坊證章畫"
    blurb_en: "Creates a symbolic 'healing-journey completion certificate' -- a ritual closing and blessing. Non-diagnostic."
    blurb_zh: "創作「療癒旅程完成證明」，象徵性封存與儀式性祝福。非診斷工具。"

  # ---- association (F04) ----
  association.affinity_diagram:
    name_en: "Affinity Diagram / KJ Method"
    abbr: ""
    name_zh: "親和圖／KJ 法"
    blurb_en: "Write raw ideas one-per-card, silently group them, then name the clusters to find patterns and cut noise. Use it after a messy brainstorm."
    blurb_zh: "把大量零散想法一張一張卡片寫下來，靜默分群後命名，找出隱藏主題、降低資訊量。腦力激盪完一堆想法但很亂時用。"
    why_en: "Naming categories before sorting biases you toward whatever framework you already had in mind; sorting silently first lets patterns emerge bottom-up from the data itself, and tracking which cards land in no group (instead of forcing every card into one) keeps the coverage gap honest instead of hidden."
    why_zh: "先取類別名稱再分類，會被你原本腦中的框架牽著走；先靜默分群，讓模式從資料本身由下往上浮現，而且會記錄哪些卡片沒被任何群組收進去（而不是硬塞一個），讓覆蓋不到的缺口保持誠實、不被掩蓋。"
    url: "https://asq.org/quality-resources/affinity"
    example_zh: "情境：訪談後有一堆零散的觀察，想找出隱藏主題。\ntopic：「遠端團隊晚上仍在回訊息的原因」\ncards 至少 1 筆，每筆要 id／text／provenance，例如 [{id: \"C1\", text: \"重組後怕漏掉重要訊息\", provenance: {...}}, {id: \"C2\", text: \"主管習慣晚上傳訊息\", provenance: {...}}, {id: \"C3\", text: \"睡前習慣性看一次信箱\", provenance: {...}}]\ngroups 至少 1 筆，item_refs 必須指向真實存在的 card id，同一張卡不能被兩個群組同時收錄，例如 [{id: \"G1\", name: \"組織壓力\", item_refs: [\"C1\", \"C2\"], provenance: {...}}, {id: \"G2\", name: \"個人習慣\", item_refs: [\"C3\"], provenance: {...}}]\n（選填）higher_level_themes：跨群組的更高層主題，group_refs 至少要 2 個不同群組，例如 [{theme: \"下班界線消失\", group_refs: [\"G1\", \"G2\"]}]——只用一個群組改名不算跨群主題，系統會拒絕。\nungrouped_card_refs（沒被任何群組收錄的卡片）由系統自動算出，不用也不能自己填。\n（選填）version：留空由系統帶入預設值即可，通常不用填。"
    example_en: "Scenario: a pile of scattered observations after interviews, looking for hidden themes. topic: 'Why remote teams still reply to messages at night'; cards has >=1 entry, each needs id/text/provenance, e.g. [{id: 'C1', text: 'Afraid of missing something important after the restructure', provenance: {...}}, {id: 'C2', text: 'Manager tends to message in the evening', provenance: {...}}, {id: 'C3', text: 'Habit of checking inbox once before bed', provenance: {...}}]; groups has >=1 entry, item_refs must resolve to real card ids and no card may belong to two groups, e.g. [{id: 'G1', name: 'Organizational pressure', item_refs: ['C1', 'C2'], provenance: {...}}, {id: 'G2', name: 'Personal habit', item_refs: ['C3'], provenance: {...}}]. Optional: higher_level_themes, a cross-group theme needs >=2 DIFFERENT group_refs, e.g. [{theme: 'Erosion of after-work boundaries', group_refs: ['G1', 'G2']}] -- renaming a single group doesn't count and is refused. ungrouped_card_refs is computed by the system, never supplied. version can be left blank."
  association.analogy_mapping:
    name_en: "Analogy Mapping"
    abbr: ""
    name_zh: "類比映射"
    blurb_en: "Maps a mechanism that works in another domain onto your problem (source domain -> abstract mechanism -> target mapping). Use it to borrow solutions across industries."
    blurb_zh: "把其他領域的成功機制對應到你的問題上。想跨行業借鏡解法時用。"
    why_en: "Copying a solution from another industry verbatim usually fails because the surface details don't transfer; forcing an explicit middle step -- stating the ABSTRACTED mechanism, distinct from both the source and the target -- makes you prove there is a real structural transplant happening, not just a surface-level metaphor with a different label."
    why_zh: "直接把別的產業的解法整套抄過來通常會失敗，因為表面細節根本對不上；強迫寫出一個獨立的「抽象機制」中間步驟——必須跟來源和目標都不一樣——逼你證明這是真正的結構性移植，而不是換個說法的表面比喻。"
    url: "https://www.boardofinnovation.com/tools/analogy-thinking/"
    example_zh: "情境：想降低客服等待時間。\ntarget_problem：「降低客服等待時間」\nsource_domain_description：「急診檢傷分類：不是先到先看，是先依症狀嚴重度分級再排順序」\nabstracted_mechanism：「用一個獨立於抵達順序的『急迫度』指標重新排定處理隊伍」——這一步必須跟來源、目標都明顯不同，只是換句話講來源或目標會被拒絕\ntarget_mapping：「客服工單先跑自動急迫度評分（帳務停用／資安／一般諮詢），改成依評分排隊而非先到先服務」\n（選填）supporting_evidence_refs：如果來源領域的描述是引用真實案例，附上引用來源\n（選填）informs_historical_analogy_ref：如果這個映射之後要接歷史類比法（historical_analogy）做更嚴謹的限制類比分析，填對方的 record id。\n（選填）version：留空由系統帶入預設值即可。"
    example_en: "Scenario: reducing customer-support wait time. target_problem: 'Reduce customer support wait time'; source_domain_description: 'ER triage: patients are seen by severity of condition, not arrival order'; abstracted_mechanism: 'Re-order the processing queue using an urgency score that is independent of arrival order' -- this stage must be visibly distinct from BOTH the source and the target, echoing either one gets refused; target_mapping: 'Support tickets first run an automatic urgency score (account lockout / security / general inquiry), queue by score instead of first-come-first-served'. Optional: supporting_evidence_refs, if the source domain description cites a real case; informs_historical_analogy_ref, if this mapping feeds into a later historical_analogy record for a more rigorous limited comparison. version can be left blank."
  association.attribute_listing:
    name_en: "Attribute Listing"
    abbr: ""
    name_zh: "屬性列舉法"
    blurb_en: "Breaks a product or plan into attributes, then tries transforming and recombining them. Use it to improve something that already exists."
    blurb_zh: "把一個產品／方案拆成屬性，逐項嘗試變換再重組出新版本。想改良一個現有東西時用。"
    why_en: "Looking at a whole product at once, you naturally fixate on the 1-2 attributes that already bother you; forcing a full attribute-by-attribute pass surfaces improvement angles you would not have thought to look for, and requiring each transformed variant to be genuinely distinct from the original (not a reworded echo) stops rubber-stamped 'changes' from passing as real ideas."
    why_zh: "一次看整個產品，很自然只會盯著讓你不爽的那 1-2 個屬性；強迫逐項掃過每個屬性，會逼出你原本不會想到要看的改良角度，而且規定每個變換後的版本都要跟原始值明顯不同（不能只是換句話說），能擋掉「換湯不換藥」的假點子。"
    url: "https://www.mycoted.com/Attribute_Listing"
    example_zh: "情境：想改良一款保溫瓶。\nsubject：「保溫瓶」\nattributes 至少 1 筆，每筆要 attribute_name／original_value／provenance，且 transformed_variants 至少 1 筆（每個 variant_text 都要跟 original_value 明顯不同），例如 [{attribute_name: \"瓶蓋開啟方式\", original_value: \"旋轉式瓶蓋\", transformed_variants: [{variant_id: \"V1\", variant_text: \"按壓式瓶蓋\", provenance: {...}}, {variant_id: \"V2\", variant_text: \"感應式瓶蓋\", provenance: {...}}], provenance: {...}}, {attribute_name: \"外殼材質\", original_value: \"不鏽鋼\", transformed_variants: [{variant_id: \"V3\", variant_text: \"可食用矽膠外層\", provenance: {...}}], provenance: {...}}]\n（選填）recombination：把不同屬性的變換組合成一個新方案，combined_from 至少要 2 筆、且必須指向真實存在的 (attribute_name, variant_id) 組合，例如 {combined_from: [{attribute_name: \"瓶蓋開啟方式\", variant_id: \"V1\"}, {attribute_name: \"外殼材質\", variant_id: \"V3\"}], proposal_description: \"按壓式瓶蓋＋矽膠外殼的兒童友善保溫瓶\", provenance: {...}}——只組合 1 個變換不算「重組」，系統會拒絕。\n（選填）informs_scamper_ref、version：留空即可。"
    example_en: "Scenario: improving an insulated water bottle. subject: 'Insulated water bottle'; attributes has >=1 entry, each needs attribute_name/original_value/provenance and >=1 transformed_variants (each variant_text must be genuinely distinct from original_value), e.g. [{attribute_name: 'Cap opening mechanism', original_value: 'Screw-on cap', transformed_variants: [{variant_id: 'V1', variant_text: 'Push-button cap', provenance: {...}}, {variant_id: 'V2', variant_text: 'Sensor-activated cap', provenance: {...}}], provenance: {...}}, {attribute_name: 'Shell material', original_value: 'Stainless steel', transformed_variants: [{variant_id: 'V3', variant_text: 'Food-grade silicone outer layer', provenance: {...}}], provenance: {...}}]. Optional: recombination, combining variants across different attributes into one new proposal -- combined_from needs >=2 entries resolving to real (attribute_name, variant_id) pairs, e.g. {combined_from: [{attribute_name: 'Cap opening mechanism', variant_id: 'V1'}, {attribute_name: 'Shell material', variant_id: 'V3'}], proposal_description: 'A child-friendly bottle combining a push-button cap with a silicone shell', provenance: {...}} -- combining just 1 variant is not 'recombination' and is refused. informs_scamper_ref/version can be left blank."
  association.concept_map:
    name_en: "Concept Map"
    abbr: ""
    name_zh: "概念圖"
    blurb_en: "Draws LABELED relationships between concepts (e.g. 'A causes B', 'A is part of B') -- unlike a Mind Map's unlabeled branches. Use it to express precise logical relationships."
    blurb_zh: "畫出概念之間「有標籤的關係」（不像 Mind Map 只是無標籤分支），例如「A 導致 B」。想精確表達概念之間邏輯關係時用。"
    why_en: "An unlabeled line between two ideas (a Mind Map branch) lets you feel like you've connected them without ever saying HOW; requiring every edge to carry a real relationship_type forces you to commit to the actual nature of the connection (causes/requires/is-part-of), which is what makes the result usable for downstream reasoning instead of just a nicer-looking brainstorm."
    why_zh: "兩個想法之間畫一條無標籤的線（Mind Map 的分支）會讓你感覺好像連起來了，卻從沒說清楚「怎麼連」；規定每條邊都要有真正的 relationship_type，逼你講清楚連接的本質（導致／需要／屬於），這樣結果才能拿去做後續推理，而不只是好看一點的腦力激盪。"
    url: "https://cmap.ihmc.us/docs/theory-of-concept-maps.php"
    example_zh: "情境：分析遠端工作倦怠的成因。\ncontext：「遠端工作倦怠成因」\nnodes 至少 2 筆、id 唯一，例如 [{id: \"N1\", label: \"組織重組\"}, {id: \"N2\", label: \"下班後查看訊息\"}, {id: \"N3\", label: \"情緒耗竭\"}]\nedges 至少 1 筆，from_node_id／to_node_id 必須指向真實存在的 node id，relationship_type 不能空白，例如 [{from_node_id: \"N1\", to_node_id: \"N2\", relationship_type: \"導致\", provenance: {...}}, {from_node_id: \"N2\", to_node_id: \"N3\", relationship_type: \"加劇\", provenance: {...}, supporting_evidence_refs: [\"SRC-1\"]}]\norphan_node_ids（沒有任何邊連到的節點，例如上例的 N3 若只當終點就不算孤立）由系統自動算出，不用自己填。\n（選填）version：留空即可。"
    example_en: "Scenario: analyzing the causes of remote-work burnout. context: 'Causes of remote-work burnout'; nodes has >=2 entries with unique ids, e.g. [{id: 'N1', label: 'Org restructure'}, {id: 'N2', label: 'Checking messages after hours'}, {id: 'N3', label: 'Emotional exhaustion'}]; edges has >=1 entry, from_node_id/to_node_id must resolve to real node ids and relationship_type cannot be blank, e.g. [{from_node_id: 'N1', to_node_id: 'N2', relationship_type: 'causes', provenance: {...}}, {from_node_id: 'N2', to_node_id: 'N3', relationship_type: 'intensifies', provenance: {...}, supporting_evidence_refs: ['SRC-1']}]. orphan_node_ids (nodes no edge references) is computed by the system, never supplied. version can be left blank."
  association.mind_map:
    name_en: "Mind Map"
    abbr: ""
    name_zh: "心智圖"
    blurb_en: "Free-associates outward from a central topic into main branches, sub-branches, and keywords. Use it for quick divergent thinking and organizing a mess of thoughts."
    blurb_zh: "從中心主題向外長出主枝、次枝、關鍵詞，自由聯想。想快速發散、整理思緒時用。"
    why_en: "Forcing exactly one center and not requiring the first-level branches to be mutually exclusive removes the upfront structuring cost that slows down divergent thinking; that same freedom is deliberate -- there is no field anywhere to assert a cross-branch or causal link, so you cannot mistake 'drawn near each other' for 'proven related' (switch to Concept Map or Causal DAG the moment you need that)."
    why_zh: "規定中心只能有一個、且第一層分支不用互斥完整，拿掉了會拖慢發散思考的前置結構化成本；這個自由是刻意的——完全沒有欄位可以宣稱跨分支或因果關係，所以你不會把「畫得很近」誤認成「證實相關」（一旦需要那種關係，就該切到 Concept Map 或 Causal DAG）。"
    url: "https://www.mind-mapping.org/index.php?title=Tony_Buzan_has_defined_these_%22rules%22_for_Mind_Mapping"
    example_zh: "情境：籌備新產品發表會，先把想法都倒出來。\ncentral_topic：「新產品發表會籌備」（只能一個主題，不能是清單）\nmain_branches 至少 1 筆，id 全樹唯一，例如 [{id: \"B1\", label: \"場地\", provenance: {...}, sub_branches: [{id: \"B1-1\", label: \"容納人數\", provenance: {...}, keywords: [\"150人\", \"舞台區\"]}]}, {id: \"B2\", label: \"行銷\", provenance: {...}}]\n（選填）每個 main_branch 的 sub_branches、每個 sub_branch 的 keywords：都可以不填，但一旦填就不能是空陣列。\n第一層分支不用互斥完整（不用 MECE），這是刻意的、不是漏做。\n（選填）version：留空即可。"
    example_en: "Scenario: kicking off ideation for a product launch event. central_topic: 'Product launch event planning' (exactly one topic, not a list); main_branches has >=1 entry, ids unique across the WHOLE tree, e.g. [{id: 'B1', label: 'Venue', provenance: {...}, sub_branches: [{id: 'B1-1', label: 'Capacity', provenance: {...}, keywords: ['150 people', 'stage area']}]}, {id: 'B2', label: 'Marketing', provenance: {...}}]. Optional: each main_branch's sub_branches, each sub_branch's keywords -- both may be omitted, but never an empty array when present. First-level branches are deliberately NOT required to be mutually exclusive (no MECE requirement) -- that is by design, not an oversight. version can be left blank."
  association.morphological_analysis:
    name_en: "Morphological Analysis"
    abbr: ""
    name_zh: "型態分析法"
    blurb_en: "Lists a problem's dimensions and each dimension's options, then systematically combines them into every legal combination for evaluation. Use it to exhaustively explore a huge solution space without missing combinations."
    blurb_zh: "列出問題的多個維度與各維度選項，系統性組合出所有「合法組合」再評估。想窮舉龐大解空間、不漏掉組合時用。"
    why_en: "Manually brainstorming combinations only surfaces the 'obvious' pairings your brain already gravitates to; GENERATING the full cartesian product first (then filtering out illegal pairings with constraints) surfaces combinations you would never have thought to compare side-by-side, and the resulting count tells you honestly how big the real solution space is before you narrow it down with something like MCDA."
    why_zh: "手動腦力激盪組合，只會冒出你腦中本來就偏好的「顯而易見」配對；先用系統性方式產生完整的笛卡兒乘積組合（再用限制條件濾掉不合法的配對），才會冒出你原本根本不會想到要放在一起比較的組合，而且產生出來的數量會誠實告訴你真實解空間有多大，之後再用 MCDA 之類的方法縮小範圍。"
    url: "https://www.swemorph.com/ma.html"
    example_zh: "情境：規劃新辦公室的座位與合約制度。\nsubject：「新辦公室選址與制度」\ndimensions 至少 2 個維度，每個維度名稱唯一、選項至少 2 個且不重複，例如 [{name: \"地點\", options: [\"市中心\", \"郊區\", \"純遠端\"]}, {name: \"座位制度\", options: [\"固定座位\", \"彈性座位\", \"無實體座位\"]}]\nconstraints 可以是空陣列，但欄位一定要給；用來排除不合法組合，兩邊必須是不同維度、且選項要真實存在於各自維度，例如 [{dimension_a: \"地點\", option_a: \"純遠端\", dimension_b: \"座位制度\", option_b: \"固定座位\"}]（純遠端不可能配固定實體座位）\nlegal_combinations／legal_combination_count（濾掉不合法組合後剩下的所有組合）由系統自動算出，不用也不能自己填；0 個合法組合也是有意義的合法結果（代表限制條件互相衝突），不會被拒絕。\n（選填）informs_mcda_ref、version：留空即可。"
    example_en: "Scenario: planning a new office's location and seating policy. subject: 'New office site and policy'; dimensions has >=2 entries, each name unique with >=2 unique options, e.g. [{name: 'Location', options: ['Downtown', 'Suburb', 'Fully remote']}, {name: 'Seating policy', options: ['Assigned desks', 'Hot-desking', 'No physical desks']}]; constraints may be an empty list but the field is always required -- it rules out illegal pairings, the two sides must name different dimensions with options that really exist in each, e.g. [{dimension_a: 'Location', option_a: 'Fully remote', dimension_b: 'Seating policy', option_b: 'Assigned desks'}] (fully remote can't pair with assigned physical desks). legal_combinations/legal_combination_count (everything left after filtering) is computed by the system, never supplied -- 0 legal combinations is itself a meaningful, valid result (the constraints fully conflict), not refused. Optional: informs_mcda_ref, version."

  # ---- causal (F11) ----
  causal.counterfactual_reasoning:
    name_en: "Counterfactual Reasoning"
    abbr: ""
    name_zh: "反事實推理"
    blurb_en: "Compares what actually happened against what would have happened without the intervention, giving a clear causal baseline. Use it to check whether an intervention really worked."
    blurb_zh: "比較「實際發生的」跟「假設沒介入會怎樣」，建立明確的因果比較基準。想確認一個介入措施是否真的有效時用。"
    why_en: "'It happened after we intervened' is not the same claim as 'it happened because we intervened' -- writing down the counterfactual (what would have happened WITHOUT the intervention) as its own explicit, distinct field forces you to state the comparison you're actually relying on, and requiring at least one disclosed assumption stops an unstated leap from correlation to causation from hiding inside a confident-sounding claim."
    why_zh: "「介入之後發生了」跟「因為介入才發生」是兩個不同的主張；把「假設沒介入會怎樣」寫成一個獨立、明確的欄位，逼你講清楚自己實際上是在做哪一種比較，而且規定至少要揭露一個假設，能擋掉一句聽起來很篤定、卻偷偷把相關性當因果的說法。"
    url: "https://www.geeksforgeeks.org/artificial-intelligence/counterfactual-reasoning-in-causal-analysis/"
    example_zh: "情境：檢查上線一個新的客服自動回覆功能是否真的降低了流失率。\nintervention：「上線客服自動回覆功能」\nactual_outcome：「上線後流失率降到 4%」\ncounterfactual_outcome：「若未上線，估計流失率仍會維持在 6%」——這一項必須跟 intervention、actual_outcome 都明顯不同，寫成一樣的內容會被拒絕\nassumptions 至少 1 筆，例如 [\"同期沒有其他行銷活動介入\"，\"客群組成跟上線前相近\"]\n（選填）version：留空即可。"
    example_en: "Scenario: checking whether a new auto-reply support feature actually reduced churn. intervention: 'Launched auto-reply support feature'; actual_outcome: 'Churn dropped to 4% after launch'; counterfactual_outcome: 'Without the launch, churn is estimated to have stayed at 6%' -- this must be genuinely distinct from BOTH intervention and actual_outcome, restating either one is refused; assumptions has >=1 entry, e.g. ['No other marketing campaign ran in the same period', 'Customer mix stayed similar to before launch']. Optional: version can be left blank."
  causal.dag:
    name_en: "Causal DAG"
    abbr: "DAG"
    name_zh: "因果圖"
    blurb_en: "Draws a directed graph of causal relationships between variables to find confounders and the real causal path. Use it to avoid mistaking correlation for causation."
    blurb_zh: "用有向圖畫出變數之間的因果關係，找出干擾變數與正確的因果路徑。想釐清「到底是誰影響誰」、避免把相關性當因果時用。"
    why_en: "Two variables moving together could mean A causes B, B causes A, or a third variable (a confounder) causes both -- a DAG forces you to draw the actual causal role of every variable (treatment/outcome/confounder/mediator/collider) and every directed edge, so a hidden confounder you forgot to control for becomes visible as a missing node rather than an invisible bias in your conclusion. The graph is mechanically checked to be genuinely acyclic (a variable can't cause itself through a loop), not just eyeballed."
    why_zh: "兩個變數一起變動，可能是 A 造成 B、B 造成 A，或是有第三個變數（干擾變數）同時造成兩者——DAG 逼你把每個變數的真實因果角色（處理／結果／干擾／中介／碰撞）跟每條有向邊都畫出來，這樣一個你忘記控制的隱藏干擾變數，會變成一個看得見的「缺節點」，而不是躲在結論裡看不見的偏誤。圖本身會被機械驗證真的是無環的（變數不能透過迴圈造成自己），不是用肉眼看看而已。"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10712057/"
    example_zh: "情境：分析「咖啡因攝取」跟「心臟病」之間的關係，懷疑「吸菸」是干擾變數。\nanalysis_id：任意字串（例如 \"CAUSALDAG-T1\"）\ncause_hypothesis_set：要引用一個既有的 root_cause.fishbone 之類的因果假設集合，至少要有 {id: \"...\"}\nnodes 至少 2 筆，每筆要 id／label／role，role 只能是 TREATMENT／OUTCOME／CONFOUNDER／MEDIATOR／COLLIDER 五選一，例如 [{id: \"N1\", label: \"咖啡因攝取\", role: \"TREATMENT\"}, {id: \"N2\", label: \"心臟病\", role: \"OUTCOME\"}, {id: \"N3\", label: \"吸菸\", role: \"CONFOUNDER\"}]\nedges 至少 1 筆，from_node_id／to_node_id 必須指向真實節點，例如 [{from_node_id: \"N3\", to_node_id: \"N1\", provenance: {...}}, {from_node_id: \"N3\", to_node_id: \"N2\", provenance: {...}}, {from_node_id: \"N1\", to_node_id: \"N2\", provenance: {...}, supporting_evidence_refs: [\"SRC-1\"]}]\n重要：edges 組成的圖必須真的是無環（acyclic），有循環會被拒絕；acyclic_verified 由系統驗證計算，不用自己填。\n（選填）version：留空即可。"
    example_en: "Scenario: analyzing the relationship between caffeine intake and heart disease, suspecting smoking is a confounder. analysis_id: any string (e.g. 'CAUSALDAG-T1'); cause_hypothesis_set: must reference an existing hypothesis set (e.g. from root_cause.fishbone), at minimum {id: '...'}; nodes has >=2 entries, each needs id/label/role, role is one of TREATMENT/OUTCOME/CONFOUNDER/MEDIATOR/COLLIDER, e.g. [{id: 'N1', label: 'Caffeine intake', role: 'TREATMENT'}, {id: 'N2', label: 'Heart disease', role: 'OUTCOME'}, {id: 'N3', label: 'Smoking', role: 'CONFOUNDER'}]; edges has >=1 entry, from_node_id/to_node_id must resolve to real nodes, e.g. [{from_node_id: 'N3', to_node_id: 'N1', provenance: {...}}, {from_node_id: 'N3', to_node_id: 'N2', provenance: {...}}, {from_node_id: 'N1', to_node_id: 'N2', provenance: {...}, supporting_evidence_refs: ['SRC-1']}]. Important: the graph formed by edges must be genuinely acyclic -- a cycle is refused; acyclic_verified is computed and verified by the system, never supplied. Optional: version can be left blank."
  causal.difference_in_differences:
    name_en: "Difference-in-Differences"
    abbr: "DiD"
    name_zh: "差異中的差異法"
    blurb_en: "Records a treated-vs-control, before-vs-after study design (design only -- it does not run the regression). Use it to lay out the design before evaluating a policy's causal effect."
    blurb_zh: "記錄一個「處理組 vs 對照組、介入前 vs 介入後」的研究設計（只記錄設計，不跑迴歸）。想評估政策效果，先把研究設計寫清楚時用。"
    why_en: "DiD's entire causal claim rests on ONE assumption: absent treatment, the treated and control groups would have moved in parallel. Making parallel_trends_justification a required field (not an optional footnote) forces you to state, in writing, why you believe that untestable assumption holds BEFORE you interpret any gap between the groups as a real policy effect -- the same discipline real DiD papers are expected to satisfy with a pre-trend chart, made explicit here as text."
    why_zh: "DiD 整個因果主張只靠一個假設撐著：若沒有介入，處理組跟對照組本來會平行變動。把 parallel_trends_justification 設成必填（不是選填備註），逼你在把兩組之間的差距解讀成真實政策效果之前，先白紙黑字寫清楚為什麼相信這個無法直接驗證的假設成立——這正是真實 DiD 論文通常要用「介入前趨勢圖」交代的紀律，這裡改用文字明確要求。"
    url: "https://en.wikipedia.org/wiki/Difference_in_differences"
    example_zh: "情境：評估某城市最低工資調漲對就業率的影響，用鄰近未調漲城市當對照組。\ntreated_group：「調漲最低工資的城市」\ncontrol_group：「未調漲最低工資的鄰近城市」——必須跟 treated_group 明顯不同\npre_period：「調漲前 12 個月」\npost_period：「調漲後 12 個月」——必須跟 pre_period 明顯不同\nparallel_trends_justification：不能空白，例如「兩城市過去 3 年就業率趨勢高度平行，且產業結構相近」\nanalysis_summary：「處理組就業率變化 -1.2%，對照組 -0.3%，估計政策效果約 -0.9 個百分點」\n（選填）version：留空即可。"
    example_en: "Scenario: evaluating a minimum-wage increase's effect on employment, using a neighboring city that didn't raise wages as control. treated_group: 'City that raised the minimum wage'; control_group: 'Neighboring city that did not raise it' -- must be genuinely distinct from treated_group; pre_period: '12 months before the increase'; post_period: '12 months after the increase' -- must be genuinely distinct from pre_period; parallel_trends_justification cannot be blank, e.g. 'Both cities' employment trends ran closely parallel for the past 3 years and have similar industry composition'; analysis_summary: 'Treated group employment changed -1.2%, control -0.3%, estimated policy effect ~-0.9pp'. Optional: version can be left blank."
  causal.instrumental_variables:
    name_en: "Instrumental Variables"
    abbr: "IV"
    name_zh: "工具變數法"
    blurb_en: "Records a study design that uses an instrumental variable to address endogeneity (design only -- no 2SLS regression run). Use it when you suspect two-way causation would bias a direct regression."
    blurb_zh: "記錄一個用工具變數處理內生性問題的研究設計（只記錄設計，不跑迴歸）。懷疑變數間有雙向因果時，先把設計寫清楚用。"
    why_en: "An instrument is only valid if it clears TWO separate conditions -- relevance (it actually moves the endogenous variable) and exclusion (it affects the outcome ONLY through that variable, never directly). Requiring both justifications as separate required fields (not one combined 'why this instrument' blurb) stops a design from silently satisfying one condition while quietly ignoring the other, which is exactly how a weak or invalid instrument produces confident-looking but wrong causal estimates."
    why_zh: "一個工具變數要成立，得同時通過兩個獨立條件——相關性（它真的會影響內生變數）跟排他性（它只能透過那個變數影響結果，不能有其他直接路徑）。把兩個理由拆成各自必填的獨立欄位（而不是合併成一句「為什麼選這個工具變數」），能擋掉「只顧一頭、悄悄漏掉另一頭」的設計——這正是弱工具變數或無效工具變數會產出看似篤定、實則錯誤的因果估計的典型原因。"
    url: "https://en.wikipedia.org/wiki/Instrumental_variables_estimation"
    example_zh: "情境：研究「教育年數」對「收入」的因果效果，懷疑能力等未觀察因素同時影響兩者，用「出生季節」當工具變數。\ninstrument：「出生季節（影響入學年齡進而影響教育年數，但不直接影響收入）」\nendogenous_variable：「教育年數」——必須跟 instrument 明顯不同\nrelevance_justification：不能空白，例如「出生季節透過入學規則影響實際受教育年數，第一階段迴歸的 F 統計量需 >10」\nexclusion_justification：不能空白，例如「出生季節本身不太可能透過教育以外的路徑直接影響成年後收入」\nanalysis_summary：「2SLS 估計教育年數每增加一年，收入提升約 8%」\n（選填）version：留空即可。"
    example_en: "Scenario: studying education's causal effect on income, suspecting unobserved ability affects both, using season of birth as an instrument. instrument: 'Season of birth (affects school-entry age and thus years of education, but not income directly)'; endogenous_variable: 'Years of education' -- must be genuinely distinct from instrument; relevance_justification cannot be blank, e.g. 'Season of birth affects actual years of schooling via enrollment-age rules; first-stage F-statistic should exceed 10'; exclusion_justification cannot be blank, e.g. 'Season of birth is unlikely to affect adult income through any channel other than education'; analysis_summary: '2SLS estimates each additional year of education raises income by ~8%'. Optional: version can be left blank."
  causal.logic_model:
    name_en: "Logic Model"
    abbr: ""
    name_zh: "邏輯模型"
    blurb_en: "Structures a project/program as Inputs -> Activities -> Outputs -> Short-term Outcomes -> Long-term Outcomes. Use it for project evaluation or aligning with KPIs."
    blurb_zh: "用「投入→活動→產出→短期成果→長期成果」固定五階段，結構化描述一個專案／方案。做專案評估或跟 KPI 對齊時用。"
    why_en: "A program description in prose lets 'outcomes' stay vague and unmeasurable; forcing the fixed 5-stage pipeline and requiring every outcome stage to name at least one concrete indicator turns 'this program helps people' into something you can actually check against KPIs later, which is the whole point of doing this before you launch rather than after."
    why_zh: "用散文描述一個專案，很容易讓「成果」停留在模糊、無法衡量的狀態；強制走固定的 5 階段管線、規定每個成果階段都要指名至少一個具體指標，能把「這個專案對人有幫助」變成之後真的能拿 KPI 檢驗的東西——這正是為什麼要在專案開跑前先做這件事，而不是事後才做。"
    url: "https://safesupportivelearning.ed.gov/resources/wk-kellogg-foundation-logic-model-development-guide"
    example_zh: "情境：規劃一個社區長者健康促進專案。\nprogram_name：「社區長者健康促進計畫」\nstages 必須「剛好」5 筆，且順序固定是 INPUTS／ACTIVITIES／OUTPUTS／SHORT_TERM_OUTCOMES／LONG_TERM_OUTCOMES，每筆要 stage／description／provenance，例如 [{stage: \"INPUTS\", description: \"3 名社工、活動場地、10 萬元經費\", provenance: {...}}, {stage: \"ACTIVITIES\", description: \"每週 2 次運動課程、每月健康講座\", provenance: {...}}, {stage: \"OUTPUTS\", description: \"全年開課 100 場、參與人次 2000\", provenance: {...}}, {stage: \"SHORT_TERM_OUTCOMES\", description: \"參與者運動習慣提升\", provenance: {...}, indicators: [\"每週運動 >=3 次的比例提升 20%\"]}, {stage: \"LONG_TERM_OUTCOMES\", description: \"社區長者整體健康狀況改善\", provenance: {...}, indicators: [\"年度健檢異常率下降\"]}]\n重要：SHORT_TERM_OUTCOMES／LONG_TERM_OUTCOMES 這兩個階段一定要有 indicators（至少 1 筆），其餘 3 階段選填。\n（選填）version：留空即可。"
    example_en: "Scenario: planning a community senior health-promotion program. program_name: 'Community Senior Health Promotion Program'; stages must be EXACTLY 5 entries in the fixed order INPUTS/ACTIVITIES/OUTPUTS/SHORT_TERM_OUTCOMES/LONG_TERM_OUTCOMES, each needs stage/description/provenance, e.g. [{stage: 'INPUTS', description: '3 social workers, activity venue, $100K budget', provenance: {...}}, {stage: 'ACTIVITIES', description: 'Exercise classes 2x/week, monthly health talks', provenance: {...}}, {stage: 'OUTPUTS', description: '100 sessions held over the year, 2000 participant-visits', provenance: {...}}, {stage: 'SHORT_TERM_OUTCOMES', description: 'Participants exercise more regularly', provenance: {...}, indicators: ['20% increase in share exercising >=3x/week']}, {stage: 'LONG_TERM_OUTCOMES', description: 'Overall improvement in seniors' community health', provenance: {...}, indicators: ['Lower annual health-checkup abnormality rate']}]. Important: SHORT_TERM_OUTCOMES/LONG_TERM_OUTCOMES both require indicators (>=1 entry); the other 3 stages' indicators are optional. Optional: version can be left blank."
  causal.process_tracing:
    name_en: "Process Tracing"
    abbr: ""
    name_zh: "過程追蹤法"
    blurb_en: "Checks a causal chain step by step using mechanism evidence rather than statistics. Use it when the sample is too small for statistical causal inference."
    blurb_zh: "用機制證據（不只是統計相關）逐步檢查一條因果鏈是否成立。樣本數很小、無法做統計因果推論時用。"
    why_en: "Not all evidence proves the same thing: a HOOP test you fail eliminates your hypothesis outright (it was a necessary condition), while a SMOKING_GUN test you pass confirms it outright (it was a sufficient condition) -- but failing a smoking-gun test or passing a hoop test proves much less. The system computes each evidence entry's own logical implication and the overall hypothesis status from this asymmetric table, so you can't accidentally treat weak, inconclusive evidence as if it were dispositive."
    why_zh: "不是所有證據都在證明同一件事：沒通過 HOOP 測試會直接推翻假設（因為那是必要條件），通過 SMOKING_GUN 測試則會直接確認假設（因為那是充分條件）——但沒通過 smoking-gun 測試或通過 hoop 測試，能證明的其實少很多。系統會依這張不對稱的對照表算出每筆證據自己的邏輯意涵、以及整體假設狀態，這樣你就不會不小心把薄弱、無定論的證據當成決定性證據來用。"
    url: "https://polisci.berkeley.edu/sites/default/files/people/u3827/Understanding%20Process%20Tracing.pdf"
    example_zh: "情境：追蹤「某政策宣導」是否真的是「民眾行為改變」的因果機制。\ncausal_mechanism：「政策宣導 -> 民眾認知提升 -> 行為改變」\nevidence 至少 1 筆，每筆要 id／test_type／description／result／provenance，test_type 只能是 HOOP 或 SMOKING_GUN，result 只能是 PRESENT 或 ABSENT，例如 [{id: \"EV1\", test_type: \"HOOP\", description: \"檢查民眾是否真的接觸過宣導內容\", result: \"PRESENT\", provenance: {...}}, {id: \"EV2\", test_type: \"SMOKING_GUN\", description: \"檢查行為改變者是否明確提及受宣導內容影響\", result: \"PRESENT\", provenance: {...}}]\nimplication（每筆證據的邏輯意涵）跟 hypothesis_status（整體假設狀態：ELIMINATED／SURVIVING／CONFIRMED）都由系統依 test_type/result 自動算出，不用也不能自己填。\n（選填）cause_hypothesis_set_ref：如果要連結一個既有的因果假設集合，填對方的 record id。\n（選填）version：留空即可。"
    example_en: "Scenario: tracing whether a policy campaign is really the causal mechanism behind a change in public behavior. causal_mechanism: 'Policy campaign -> increased public awareness -> behavior change'; evidence has >=1 entry, each needs id/test_type/description/result/provenance, test_type is HOOP or SMOKING_GUN only, result is PRESENT or ABSENT only, e.g. [{id: 'EV1', test_type: 'HOOP', description: 'Check whether the public was actually exposed to the campaign', result: 'PRESENT', provenance: {...}}, {id: 'EV2', test_type: 'SMOKING_GUN', description: 'Check whether people who changed behavior explicitly cite the campaign', result: 'PRESENT', provenance: {...}}]. implication (each entry's own logical meaning) and hypothesis_status (overall: ELIMINATED/SURVIVING/CONFIRMED) are both computed by the system from test_type/result, never supplied. Optional: cause_hypothesis_set_ref, to link an existing hypothesis set; version can be left blank."
  causal.rct:
    name_en: "Randomized Controlled Trial"
    abbr: "RCT"
    name_zh: "隨機對照試驗"
    blurb_en: "Records a randomized treatment-vs-control study design (design only -- no statistical analysis run). Use it to write down a rigorous trial design before running it."
    blurb_zh: "記錄一個隨機分派、把樣本分成處理組／對照組的研究設計（只記錄設計，不跑統計分析）。想用最嚴謹方式驗證因果，先把設計寫清楚用。"
    why_en: "A trial with too few subjects can fail to detect a real effect (and one that 'finds nothing' gets wrongly read as 'no effect'), which is exactly why power_analysis is a required field here, not an afterthought -- a trial that never states how it justified its sample size is disclosing a well-known methodological red flag, and the treatment/control distinctness check stops a record from claiming to be a 'controlled' trial while naming the same arm twice."
    why_zh: "受試者太少的試驗可能偵測不到真實存在的效果（而「沒發現效果」常被誤讀成「真的沒有效果」），這正是為什麼 power_analysis 在這裡是必填、不是事後補充——一個從沒交代樣本數怎麼算出來的試驗，本身就是在揭露一個知名的方法論警訊；處理組／對照組的差異檢查則能擋掉「號稱有對照組，卻兩邊寫成同一個」的情況。"
    url: "https://en.wikipedia.org/wiki/Randomized_controlled_trial"
    example_zh: "情境：驗證新版 App 引導流程是否提升付費轉換率。\nrandomization：「用戶 ID 末位數字隨機分派，各 50%」\npower_analysis：不能空白，例如「預期基準轉換率 5%、想偵測到 1 個百分點差異，80% 檢定力、雙尾 alpha=0.05，估計每組需要 3140 人」\ntreatment_group：「看到新版引導流程」\ncontrol_group：「看到舊版引導流程」——必須跟 treatment_group 明顯不同\nanalysis_summary：「處理組轉換率 6.1% vs 對照組 5.0%，差異在統計上顯著」\n（選填）version：留空即可。"
    example_en: "Scenario: testing whether a new app onboarding flow improves paid-conversion rate. randomization: 'Random assignment by last digit of user ID, 50/50 split'; power_analysis cannot be blank, e.g. 'Baseline conversion assumed 5%, detecting a 1pp difference, 80% power, two-tailed alpha=0.05, estimated ~3140 per arm needed'; treatment_group: 'Sees the new onboarding flow'; control_group: 'Sees the old onboarding flow' -- must be genuinely distinct from treatment_group; analysis_summary: 'Treatment conversion 6.1% vs control 5.0%, statistically significant difference'. Optional: version can be left blank."
  causal.regression_discontinuity:
    name_en: "Regression Discontinuity Design"
    abbr: "RDD"
    name_zh: "斷點迴歸設計"
    blurb_en: "Records a study design that estimates causal effect from samples near a cutoff (design only). Use it when there's a clear eligibility threshold (score, age) to exploit as a natural experiment."
    blurb_zh: "記錄一個利用「切點附近樣本」估計因果效果的研究設計（只記錄設計）。有明確資格門檻可做自然實驗時用。"
    why_en: "RDD's whole logic is that units just above and just below a cutoff are nearly identical except for treatment status, so a jump right AT the cutoff is a plausible causal effect -- which only holds if the cutoff_value is a real, checkable number on the running variable's own scale (not a vague narrative claim) and if the disclosed checks (e.g. no manipulation of who sits near the cutoff) are genuinely distinct validations, not the same check padded out under different names."
    why_zh: "斷點迴歸的整個邏輯是：切點附近的樣本除了「有沒有被處理」之外幾乎一模一樣，所以切點正上方發生的跳動，是個可信的因果效果——但這只有在 cutoff_value 是跑分變數量尺上一個真實、可查核的數字（而不是含糊的敘述）、而且揭露的 checks（例如檢查有沒有人操縱誰落在切點附近）真的是彼此不同的獨立驗證、不是換個名字重複講同一件事時才成立。"
    url: "https://en.wikipedia.org/wiki/Regression_discontinuity_design"
    example_zh: "情境：評估「入學測驗 60 分」門檻對後續學業表現的因果效果。\nrunning_variable：「入學測驗分數」\ncutoff_value：必須是有限實數，例如 60\nbandwidth：「切點上下各 5 分」\nchecks 至少 1 筆，且每筆內容必須彼此明顯不同，例如 [\"密度檢定：確認分數在切點附近沒有異常堆積（無人為操縱）\", \"安慰劑檢定：在假切點（如 55 分）重跑一次，確認沒有假跳動\"]\n（選填）analysis_summary：例如「切點處學業表現跳動約 0.3 個標準差」\n（選填）version：留空即可。"
    example_en: "Scenario: evaluating a 60-point entrance-exam cutoff's causal effect on later academic performance. running_variable: 'Entrance exam score'; cutoff_value must be a finite real number, e.g. 60; bandwidth: 'Plus/minus 5 points around the cutoff'; checks has >=1 entry, and every entry must be genuinely distinct from every other, e.g. ['Density test: confirm no abnormal bunching of scores near the cutoff (no manipulation)', 'Placebo test: rerun at a fake cutoff (e.g. 55) to confirm no false jump appears']. Optional: analysis_summary, e.g. 'Academic performance jumps ~0.3 SD at the cutoff'; version can be left blank."
  causal.synthetic_control:
    name_en: "Synthetic Control"
    abbr: ""
    name_zh: "合成控制法"
    blurb_en: "Records a study design that builds a weighted 'synthetic' control group from other cases (design only). Use it when there's only one treated case and no real control group."
    blurb_zh: "記錄一個用其他個案加權組合出「虛擬對照組」的研究設計（只記錄設計）。只有一個處理個案、找不到真實對照組時用。"
    why_en: "With only one treated case, there's no real control group to compare against -- a synthetic control BUILDS one by weighting untreated donor units, which only means anything if there are enough real donors to blend (a 1-donor 'pool' is just a single comparison unit wearing a fancier name), every weight actually points at a declared donor, and you ran placebo tests (pretending each untreated donor was 'treated') to check your result isn't just noise that any random unit would show."
    why_zh: "只有一個處理個案時，根本沒有真正的對照組可以比較——合成控制法是靠加權組合未受處理的「捐贈者」單位「造出」一個對照組，這只有在捐贈者夠多可以真的拿來混合（只有 1 個「捐贈者庫」其實就只是換個好聽名字的單一比較單位）、每個權重都真的指向一個宣告過的捐贈者、而且你真的做過安慰劑檢定（假裝每個未受處理的捐贈者「被處理了」）確認你的結果不是隨便一個單位都會出現的雜訊時才有意義。"
    url: "https://www.aeaweb.org/content/file?id=12409"
    example_zh: "情境：評估某州調高菸稅對香菸消費量的因果效果，用其他州加權組合出虛擬對照州。\ntreated_unit：「調高菸稅的 A 州」\ndonor_pool 至少 2 筆，且不能包含 treated_unit 本身，例如 [\"B 州\", \"C 州\", \"D 州\"]\nfit_quality：「合成對照在介入前 10 年跟 A 州的香菸消費軌跡幾乎重合，RMSPE 很低」\nweights 至少 1 筆，每筆的 donor 必須是 donor_pool 裡真實存在的名稱，例如 [{donor: \"B 州\", weight: 0.6}, {donor: \"C 州\", weight: 0.4}]（權重數值本身不驗證加總是否為 1，只驗證有沒有指到真實捐贈者）\npost_treatment_gap：「介入後 A 州跟合成對照的消費量差距逐年擴大，5 年後約低 15%」\nplacebo_tests 至少 1 筆，例如 [\"對 B 州做安慰劑檢定：假裝 B 州也調了菸稅，觀察到的落差遠小於 A 州的真實落差\"]\n（選填）version：留空即可。"
    example_en: "Scenario: evaluating a state's cigarette-tax increase effect on consumption, using other states to build a synthetic control. treated_unit: 'State A (raised cigarette tax)'; donor_pool has >=2 entries and must NOT include treated_unit itself, e.g. ['State B', 'State C', 'State D']; fit_quality: 'The synthetic control tracks State As pre-intervention consumption trajectory closely over 10 years, low RMSPE'; weights has >=1 entry, each donor must be a name that really exists in donor_pool, e.g. [{donor: 'State B', weight: 0.6}, {donor: 'State C', weight: 0.4}] (weight magnitudes/sum-to-1 are not validated, only whether each one names a real donor); post_treatment_gap: 'The gap between State A and its synthetic control widens each year post-intervention, ~15% lower after 5 years'; placebo_tests has >=1 entry, e.g. ['Placebo test on State B: pretending State B also raised its tax shows a gap much smaller than State As real gap']. Optional: version can be left blank."
  causal.theory_of_change:
    name_en: "Theory of Change"
    abbr: ""
    name_zh: "改變理論"
    blurb_en: "Chains Inputs -> Activities -> Outputs -> Short-term -> Long-term Outcomes -> Impact, with an assumption/evidence/indicator/risk on every transition. Use it to plan a long-term project or social-impact initiative."
    blurb_zh: "用「投入→活動→產出→短期成果→長期成果→影響」六階段，串起假設、證據、指標、風險。做長期專案或社會影響評估規劃時用。"
    why_en: "A Logic Model chain (inputs to outcomes) tells you WHAT is supposed to happen but not WHY you believe each step actually leads to the next; requiring every one of the 5 transitions between stages to carry its own assumption, evidence, indicator, and risk turns an unexamined chain of boxes into a chain whose weakest links are visible and checkable before you commit years of funding to it."
    why_zh: "Logic Model 那種投入到成果的鏈條，只講了「應該會發生什麼」，沒講「為什麼你相信每一步真的會導向下一步」；規定 5 個階段轉換每一個都要附上自己的假設、證據、指標、風險，能把一串沒被檢驗過的方塊，變成一條最弱的環節在投入好幾年資金之前就看得見、查得出來的鏈條。"
    url: "https://unsdg.un.org/sites/default/files/UNDG-UNDAF-Companion-Pieces-7-Theory-of-Change.pdf"
    example_zh: "情境：規劃一個「提升偏鄉學童識字率」的長期社會影響專案。\nintervention：「提供偏鄉學校每週雙語閱讀課程」\nstages 必須「剛好」6 筆，順序固定是 INPUTS／ACTIVITIES／OUTPUTS／SHORT_TERM_OUTCOMES／LONG_TERM_OUTCOMES／IMPACT，每筆要 stage／description／provenance，例如 [{stage: \"INPUTS\", description: \"師資、教材、經費\", provenance: {...}}, {stage: \"ACTIVITIES\", description: \"每週雙語閱讀課\", provenance: {...}}, {stage: \"OUTPUTS\", description: \"開課校數、上課時數\", provenance: {...}}, {stage: \"SHORT_TERM_OUTCOMES\", description: \"學童識字率提升\", provenance: {...}}, {stage: \"LONG_TERM_OUTCOMES\", description: \"學童升學率提升\", provenance: {...}}, {stage: \"IMPACT\", description: \"偏鄉教育落差縮小\", provenance: {...}}]\ntransitions 必須「剛好」5 筆，每筆連接相鄰的兩個階段（位置與 from_stage/to_stage 都要對得上，例如第 1 筆一定是 INPUTS 到 ACTIVITIES），每筆的 assumption／evidence／indicator／risk 全部必填不能空白，例如第 1 筆 {from_stage: \"INPUTS\", to_stage: \"ACTIVITIES\", assumption: \"師資到位後課程能如期開課\", evidence: \"過去類似專案的開課達成率\", indicator: \"實際開課校數 / 預計開課校數\", risk: \"師資招募不足導致延後開課\", provenance: {...}}\n（選填）version：留空即可。"
    example_en: "Scenario: planning a long-term social-impact project to raise literacy in rural schools. intervention: 'Provide weekly bilingual reading classes at rural schools'; stages must be EXACTLY 6 entries in the fixed order INPUTS/ACTIVITIES/OUTPUTS/SHORT_TERM_OUTCOMES/LONG_TERM_OUTCOMES/IMPACT, each needs stage/description/provenance, e.g. [{stage: 'INPUTS', description: 'Teachers, materials, budget', provenance: {...}}, {stage: 'ACTIVITIES', description: 'Weekly bilingual reading classes', provenance: {...}}, {stage: 'OUTPUTS', description: 'Number of schools reached, class-hours delivered', provenance: {...}}, {stage: 'SHORT_TERM_OUTCOMES', description: 'Student literacy rates rise', provenance: {...}}, {stage: 'LONG_TERM_OUTCOMES', description: 'Student progression rates rise', provenance: {...}}, {stage: 'IMPACT', description: 'Rural education gap narrows', provenance: {...}}]; transitions must be EXACTLY 5 entries connecting each adjacent stage pair (both position AND from_stage/to_stage must match, e.g. entry 1 must be INPUTS to ACTIVITIES), every entry needs non-empty assumption/evidence/indicator/risk, e.g. entry 1: {from_stage: 'INPUTS', to_stage: 'ACTIVITIES', assumption: 'Once staffed, classes launch on schedule', evidence: 'Launch completion rate from past similar programs', indicator: 'Schools actually launched / schools planned', risk: 'Staff recruitment shortfall delays launch', provenance: {...}}. Optional: version can be left blank."

  # ---- challenge (F12 Red Team / Risk) ----
  challenge.blue_team:
    name_en: "Blue Team"
    abbr: ""
    name_zh: "藍隊防禦"
    blurb_en: "Finds the matching defenses for attacks/risks already raised. Use it right after a Red Team attack pass to add the defensive side."
    blurb_zh: "針對已提出的攻擊／風險找出對應的防禦措施。做完 Red Team 攻擊分析後，用它補上防守方案。"
    why_en: "improvements[] must contain at least one entry before the record is accepted -- a Blue Team review that records zero improvements didn't actually steelman anything. This is a deliberate tightening relative to its sibling red_team (which legitimately permits zero findings, since examining a dimension and finding it clean is a real result): Blue Team's entire purpose is to strengthen the proposal, so recording nothing strengthened is refused outright, not silently accepted as 'a clean review'."
    why_zh: "improvements 至少要有 1 筆才會被接受——一份記錄零改善的 Blue Team 審查，根本沒有真的把方案 steelman 過。這是刻意比姊妹方法 red_team 更嚴格的規則（red_team 允許零發現，因為檢查完一個面向沒問題也是真實結果）：Blue Team 存在的目的就是強化方案，所以「什麼都沒強化」會被直接拒絕，不會被誤當成一份「乾淨的審查」默默放行。"
    url: "https://umbrex.com/resources/tools-for-thinking/what-is-steelmanning/"
    example_zh: "情境：對「導入第三方 AI 供應商」提案做 Blue Team 審查，把它強化到最強版本。\nproposal_ref：「提案-AI供應商導入-v2」\nimprovements 至少 1 筆，category 只能是 CONTROLS／EVIDENCE／FALLBACK／MONITORING／RECOVERY 五選一，description 不能空白，例如 [{id: \"IMP-1\", category: \"MONITORING\", description: \"加入供應商回應時間異常告警\", provenance: {...}}, {id: \"IMP-2\", category: \"FALLBACK\", description: \"保留舊供應商合約 3 個月作為備援\", provenance: {...}}]\n（選填）supporting_evidence_refs 可以不給\n（重點）improvements 不能是空陣列——空陣列代表這份審查沒有真的強化任何東西，會被拒絕建立。"
    example_en: "Scenario: run a Blue Team review on a 'adopt a third-party AI vendor' proposal to steelman it to its strongest version. proposal_ref: 'Proposal-AI-Vendor-Adoption-v2'; improvements has >=1 entry, category is one of CONTROLS/EVIDENCE/FALLBACK/MONITORING/RECOVERY, description must be non-empty, e.g. [{id: 'IMP-1', category: 'MONITORING', description: 'Add alerting for abnormal vendor response times', provenance: {...}}, {id: 'IMP-2', category: 'FALLBACK', description: 'Keep the old vendor contract active for 3 months as a fallback', provenance: {...}}]. Optional: supporting_evidence_refs may be omitted. Key point: improvements cannot be an empty list -- an empty list means the review strengthened nothing, and is refused at construction."
  challenge.counterexample_search:
    name_en: "Counterexample Search"
    abbr: ""
    name_zh: "反例搜尋"
    blurb_en: "Finds boundary cases for a claim/rule and filters for the ones that actually disprove it. Use it to test a rule's real limits."
    blurb_zh: "針對一個規則／主張找邊界案例，篩出真正推翻它的反例。想測試一個規則的適用邊界時用。"
    why_en: "true_counterexamples[] may legitimately be empty (a claim surviving the search is a real, useful result, not a failure) -- but every entry that IS recorded must reference a real, pre-declared boundary_cases[] entry. A case can't be confirmed a counterexample if it was never actually examined as a boundary case, which is what stops this method from degrading into 'I found a problem somewhere' hand-waving."
    why_zh: "true_counterexamples 可以合法地是空陣列（一個主張撐過搜尋是真實、有用的結果，不是失敗）——但只要記錄了任何一筆，就一定要指向一筆真實、事先宣告過的 boundary_cases 條目。一個案例如果從來沒被當成邊界案例檢查過，就不能被確認為反例，這正是讓這個方法不會退化成「我好像在哪裡發現了問題」這種空泛說法的關鍵。"
    url: "https://en.wikipedia.org/wiki/Counterexample"
    example_zh: "情境：測試「所有付費使用者都會在 7 天內完成 onboarding」這條規則的邊界。\nclaim：「所有付費使用者都會在 7 天內完成 onboarding」\nboundary_cases 至少 1 筆，id 要唯一，例如 [{id: \"BC-1\", description: \"企業方案、需要走 SSO 設定的使用者\"}, {id: \"BC-2\", description: \"免費試用轉付費的使用者\"}]\ntrue_counterexamples 可以是空陣列；若有記錄，boundary_case_id 一定要指向上面真實存在的邊界案例，例如 [{boundary_case_id: \"BC-1\", contradiction_explanation: \"實際追蹤發現企業方案使用者平均要 14 天才完成 SSO 設定，超出 7 天規則\"}]\n（重點）如果 true_counterexamples 裡的 boundary_case_id 指向一個沒在 boundary_cases 出現過的 id，會被拒絕建立——反例一定要是真的被檢查過的邊界案例。"
    example_en: "Scenario: test the boundary of the claim 'all paying users complete onboarding within 7 days'. claim: 'All paying users complete onboarding within 7 days'; boundary_cases has >=1 entry with a unique id, e.g. [{id: 'BC-1', description: 'Enterprise-plan users who must complete SSO setup'}, {id: 'BC-2', description: 'Users who convert from free trial to paid'}]; true_counterexamples may be an empty list; any recorded entry's boundary_case_id must resolve to a real boundary case above, e.g. [{boundary_case_id: 'BC-1', contradiction_explanation: 'Actual tracking shows enterprise-plan users take an average of 14 days to complete SSO setup, exceeding the 7-day rule'}]. Key point: a true_counterexamples entry whose boundary_case_id never appears in boundary_cases is refused at construction -- a counterexample must be a boundary case that was actually examined."
  challenge.devils_advocate:
    name_en: "Devil's Advocate"
    abbr: ""
    name_zh: "魔鬼代言人"
    blurb_en: "Deliberately builds the strongest case for 'what if the mainstream view is wrong', preventing groupthink. Use it when a meeting's opinions are suspiciously unanimous."
    blurb_zh: "刻意建立「如果主流觀點是錯的」最強反方論證，防止團體迷思。開會意見太一致、想防止盲點時用。"
    why_en: "alternative_position must, after normalization, actually differ from mainstream_position -- a record where the 'alternative' is just a reworded copy of the mainstream view is refused before its supporting_arguments are even inspected. Requiring at least one real supporting argument on top of that stops the alternative from being a bare assertion: Atlas's own framing is to build the STRONGEST version of 'what if the mainstream view is wrong', and an unargued restatement or an argued-for alternative that isn't actually different both fail that bar."
    why_zh: "alternative_position 正規化後一定要跟 mainstream_position 真的不一樣——如果「另一種觀點」只是換句話說的主流觀點，這一步就會直接拒絕，連 supporting_arguments 都不會檢查。在此之上還要求至少 1 個真實的支持論點，避免另一種觀點只是空泛斷言：這個方法要做的是建立「如果主流觀點是錯的」的最強版本，不管是沒有論證的複述，還是有論證但根本不算另一種觀點，都達不到這個標準。"
    url: "https://www.psychologynoteshq.com/groupthink/"
    example_zh: "情境：對「這次改版應該全面採用微服務架構」這個主流觀點做 Devil's Advocate 挑戰。\nmainstream_position：「這次改版應該全面採用微服務架構」\nalternative_position 一定要跟 mainstream_position 正規化後不同，例如「這次改版應該維持模組化的單體架構，只在真正需要獨立擴展的部分拆出服務」\nsupporting_arguments 至少 1 筆非空字串，例如 [\"團隊目前只有 4 名後端工程師，微服務的維運負擔可能壓垮團隊\", \"目前流量還沒有明顯的單一瓶頸模組，過早拆分缺乏真實依據\"]\n（重點）如果 alternative_position 正規化後跟 mainstream_position 一樣（例如只是加了空白或改大小寫），會被拒絕建立——「另一種觀點」不能只是換句話說的主流觀點。"
    example_en: "Scenario: challenge the mainstream position 'this rewrite should fully adopt a microservices architecture' with a Devil's Advocate case. mainstream_position: 'This rewrite should fully adopt a microservices architecture'; alternative_position must differ from mainstream_position after normalization, e.g. 'This rewrite should keep a modular monolith, splitting out only the parts that genuinely need independent scaling'; supporting_arguments has >=1 non-empty string, e.g. ['The team currently has only 4 backend engineers -- microservices' operational overhead could overwhelm them', 'There is no clear single bottleneck module yet in current traffic, so splitting this early lacks real justification']. Key point: if alternative_position normalizes to the same text as mainstream_position (e.g. differing only in whitespace or case), the record is refused at construction -- an 'alternative' can't just be the mainstream view reworded."
  challenge.disconfirming_evidence:
    name_en: "Disconfirming Evidence"
    abbr: ""
    name_zh: "反證搜尋"
    blurb_en: "Actively searches for evidence that does NOT support your belief, instead of only evidence that does, cutting confirmation bias. Use it before acting on something you're already convinced of."
    blurb_zh: "主動去找「不支持自己想法」的資料，而不是只找支持的證據，降低確認偏誤。驗證一個自己深信的判斷前用。"
    why_en: "falsifier_criteria[] (what WOULD disprove current_belief) must be declared BEFORE any search_results[] entry can reference one, enforced as a cross-array foreign key checked at construction. This makes post-hoc rationalization -- inventing a falsifier AFTER finding something convenient -- structurally impossible rather than merely discouraged: Popperian discipline is define the falsifier, then search, and this method refuses the reverse order outright."
    why_zh: "falsifier_criteria（什麼證據出現就代表 current_belief 是錯的）一定要先宣告好，之後 search_results 裡的條目才能引用它，這是建構時就檢查的跨陣列外鍵。這讓「先找到方便的結果、再回頭發明一個 falsifier」這種事後合理化，變成結構上不可能發生，而不只是不建議——Popper 式的紀律是先定義什麼算反證，再去搜尋，這個方法直接拒絕反過來的順序。"
    url: "https://plato.stanford.edu/entries/popper/"
    example_zh: "情境：檢驗「我們的新功能上線後留存率一定會提升」這個信念是否禁得起考驗。\ncurrent_belief：「新功能上線後留存率一定會提升」\nfalsifier_criteria 至少 1 筆，id 要唯一，一定要先宣告，例如 [{id: \"F-1\", description: \"上線後 4 週留存率沒有顯著提升甚至下降\"}, {id: \"F-2\", description: \"重度使用者的留存率反而下降\"}]\nsearch_results 可以是空陣列；若有記錄，falsifier_criteria_id 一定要指向上面真實宣告過的 falsifier，found 要是真的布林值，found 為 true 時 evidence_description 不能空白，例如 [{falsifier_criteria_id: \"F-2\", found: true, evidence_description: \"上線後 4 週數據顯示重度使用者留存率從 78% 降到 71%\"}]\n（重點）如果 search_results 裡的 falsifier_criteria_id 指向一個沒在 falsifier_criteria 宣告過的 id（例如上線後才臨時想到的理由），會被拒絕建立——這正是防止「先射箭再畫靶」的事後合理化。"
    example_en: "Scenario: test whether the belief 'our new feature will definitely raise retention' survives scrutiny. current_belief: 'Our new feature will definitely raise retention after launch'; falsifier_criteria has >=1 entry with a unique id, declared BEFORE any search, e.g. [{id: 'F-1', description: 'Retention shows no meaningful improvement, or even declines, 4 weeks after launch'}, {id: 'F-2', description: 'Heavy users' retention actually drops'}]; search_results may be an empty list; any recorded entry's falsifier_criteria_id must resolve to a real falsifier declared above, found must be a genuine boolean, and found=true requires a non-empty evidence_description, e.g. [{falsifier_criteria_id: 'F-2', found: true, evidence_description: 'Data 4 weeks post-launch shows heavy-user retention dropped from 78% to 71%'}]. Key point: a search_results entry whose falsifier_criteria_id was never declared in falsifier_criteria (e.g. a reason invented after the fact) is refused at construction -- this is exactly what stops shooting the arrow first and painting the target after."
  challenge.fmea:
    name_en: "Failure Mode and Effects Analysis"
    abbr: "FMEA"
    name_zh: "失效模式與影響分析"
    blurb_en: "Steps through Function -> Failure Mode -> Effect -> Cause -> Existing Control -> Severity -> Occurrence -> Detection -> Action Priority to rank which risk to fix first. Use it for a pre-launch risk review."
    blurb_zh: "逐步檢查功能→失效模式→影響→原因→現有控制→嚴重度→機率→可偵測度→行動優先序，找出最該優先處理的風險點。上線前做風險盤點時用。"
    why_en: "action_priority is never a caller-supplied field -- it's always derived from severity/occurrence/detection, and a severity of 9 or 10 ALWAYS forces action_priority to MANDATORY_CONTROL_REQUIRED regardless of how low occurrence and detection (and therefore the RPN) are. This makes Atlas's own explicit warning structural instead of advisory: a catastrophic-but-rare, easy-to-detect failure mode (severity=10, occurrence=1, detection=1, RPN=10 -- which an RPN-only ranking would call LOW) still cannot slip through as routine."
    why_zh: "action_priority 從來不是呼叫端能直接給值的欄位——永遠是從 severity／occurrence／detection 算出來的，而且只要 severity 是 9 或 10，action_priority 就一定會被強制設成 MANDATORY_CONTROL_REQUIRED，不管 occurrence 跟 detection（因此 RPN）有多低。這把 Atlas 原本只是提醒性質的警語變成結構性規則：一個後果慘重但機率極低、又容易偵測的失效模式（severity=10、occurrence=1、detection=1，RPN 只有 10——如果只看 RPN 排序會被歸成 LOW），還是不會被誤判成一般項目而放過。"
    url: "https://www.juran.com/blog/guide-to-failure-mode-and-effect-analysis-fmea/"
    example_zh: "情境：對「客戶付款流程」做 FMEA 分析。\nsubject_ref：「客戶付款流程」\nfailure_modes 至少 1 筆，欄位剛好是 id／function／failure_mode／effect／cause／existing_control／severity／occurrence／detection 這 9 個（不含 rpn／action_priority，這兩個是系統算的，不能自己填），severity／occurrence／detection 都要是 1-10 的整數\n例如 [{id: \"FM-1\", function: \"扣款\", failure_mode: \"重複扣款\", effect: \"客戶被扣兩次錢，客訴與退款成本\", cause: \"重試邏輯沒有冪等性保護\", existing_control: \"\", severity: 9, occurrence: 2, detection: 3}]\n（existing_control 可以是空字串——「目前還沒有控制措施」本身就是一個重要且合法的發現）\n（重點）上面這筆 severity 是 9，屬於系統定義的「強制控制」門檻（9 分以上），所以不管 occurrence／detection 多低，算出來的 action_priority 一定是 MANDATORY_CONTROL_REQUIRED，不會因為 RPN（=9×2×3=54，只到 MEDIUM 等級）而被誤判成中等優先。"
    example_en: "Scenario: run an FMEA on the customer payment flow. subject_ref: 'Customer payment flow'; failure_modes has >=1 entry with EXACTLY these 9 keys (id, function, failure_mode, effect, cause, existing_control, severity, occurrence, detection -- rpn/action_priority are computed, never supplied), severity/occurrence/detection must each be an integer 1-10. E.g. [{id: 'FM-1', function: 'Charge card', failure_mode: 'Duplicate charge', effect: 'Customer charged twice, support/refund cost', cause: 'Retry logic lacks idempotency protection', existing_control: '', severity: 9, occurrence: 2, detection: 3}] (existing_control may be an empty string -- 'no control exists yet' is itself an important, valid finding). Key point: severity=9 here crosses the system's mandatory-control threshold (>=9), so regardless of how low occurrence/detection are, the computed action_priority is always MANDATORY_CONTROL_REQUIRED -- it is never downgraded to a mid-tier priority just because the RPN (=9x2x3=54, only MEDIUM-tier) looks moderate."
  challenge.hazop:
    name_en: "Hazard and Operability Study"
    abbr: "HAZOP"
    name_zh: "危害與可操作性分析"
    blurb_en: "Systematically finds process deviations using a standard set of guide words (no/more/less/reverse...). Use it for a thorough hazard analysis of a high-risk process."
    blurb_zh: "用一組標準引導詞（沒有／更多／更少／反向等）系統性找出流程可能的偏差。做高風險流程的完整性風險分析時用。"
    why_en: "deviations[] may legitimately be empty for any given node-guide-word pair (not every guide word produces a real deviation, and this method deliberately does not demand exhaustive node-by-guide-word coverage) -- but every entry that IS recorded must reference a real, pre-declared node and a guide word from the closed 11-word vocabulary. A deviation pointing at a node that was never examined, or a made-up guide word, is refused before it can pollute the study."
    why_zh: "對任一節點×引導詞的組合，deviations 可以合法地是空的（不是每個引導詞都會對每個節點產生真實偏差，這個方法也刻意不要求逐一窮舉每個節點對每個引導詞都要有記錄）——但只要記錄了任何一筆，就一定要指向一個真實存在、事先宣告過的節點，而且 guide_word 一定要是封閉的 11 個標準詞其中之一。一筆指向從未被檢查過的節點、或亂編引導詞的偏差記錄，會在污染研究結果之前就被拒絕。"
    url: "https://dustsafetyscience.com/hazop-hazard-operability-study-guide/"
    example_zh: "情境：對「化學品儲槽進料流程」做 HAZOP 研究。\nnodes 至少 1 筆，id 要唯一，例如 [{id: \"N-1\", description: \"進料泵浦到儲槽的管線段\"}]\ndeviations 可以是空陣列；若有記錄，node_id 一定要指向上面真實存在的節點，guide_word 只能是 NO_NOT／MORE／LESS／AS_WELL_AS／PART_OF／REVERSE／OTHER_THAN／EARLY／LATE／BEFORE／AFTER 這 11 個標準引導詞之一，cause／consequence 不能空白，safeguard 可以是空字串（代表目前沒有安全措施，這本身就是重要發現）\n例如 [{node_id: \"N-1\", guide_word: \"MORE\", cause: \"控制閥卡在全開位置\", consequence: \"儲槽過量進料，可能溢流\", safeguard: \"高液位警報\", risk_rating: 7}]\n（選填）risk_rating 可以不給\n（重點）如果 node_id 指向一個沒在 nodes 出現過的節點，或 guide_word 填了 11 個標準詞以外的字（例如自己發明的詞），會被拒絕建立。"
    example_en: "Scenario: run a HAZOP study on a chemical storage tank feed line. nodes has >=1 entry with a unique id, e.g. [{id: 'N-1', description: 'Piping segment from feed pump to storage tank'}]; deviations may be an empty list; any recorded entry's node_id must resolve to a real node above, guide_word must be one of the 11 standard words (NO_NOT/MORE/LESS/AS_WELL_AS/PART_OF/REVERSE/OTHER_THAN/EARLY/LATE/BEFORE/AFTER), cause/consequence must be non-empty, safeguard may be an empty string (no safeguard exists yet is itself an important finding). E.g. [{node_id: 'N-1', guide_word: 'MORE', cause: 'Control valve stuck fully open', consequence: 'Tank overfed, possible overflow', safeguard: 'High-level alarm', risk_rating: 7}]. Optional: risk_rating may be omitted. Key point: a deviation whose node_id was never declared in nodes, or whose guide_word is outside the 11 standard words (e.g. an invented term), is refused at construction."
  challenge.independent_judge:
    name_en: "Independent Judge"
    abbr: ""
    name_zh: "獨立裁決"
    blurb_en: "A third-party final ruling after Red Team attacks and Blue Team defenses are both in. Use it when you want an unbiased final call."
    blurb_zh: "在 Red Team 攻擊、Blue Team 防守都做完後，由第三方角度做最終裁決。想要不偏袒任一方的最終結論時用。"
    why_en: "a ruling cannot be rendered without at least one position actually weighed AND at least one criterion actually cited AND a non-empty judgment -- all three re-derived independently by their own gate from raw fields, not just checked once at construction. A ruling reached by counting positions with no stated rule for why is exactly the majority-vote-as-truth failure this method exists to avoid, so a criterion-free 'ruling' is refused just as hard as a position-free one."
    why_zh: "一份裁決要成立，一定要至少有一個立場被真正權衡過、至少有一個判準被真正引用、而且 judgment 不能空白——這三項都由各自獨立的 gate 從原始欄位重新推導，不是只在建構時檢查一次。一個靠數立場數量做出來、卻說不出憑什麼判準的裁決，正是這個方法要避免的「多數決真理」失敗模式，所以一份沒有判準的「裁決」跟一份沒有立場的「裁決」一樣，都會被拒絕。"
    url: "https://en.wikipedia.org/wiki/Wisdom_of_the_crowd"
    example_zh: "情境：對「是否採用供應商 A 還是供應商 B」這個提案做獨立裁決。\nproposal_ref：「供應商選型提案-2026Q3」\npositions_considered 至少 1 筆，每筆 description 不能空白，例如 [{id: \"POS-1\", description: \"採用供應商 A：價格較低但支援回應較慢\", provenance: {...}}, {id: \"POS-2\", description: \"採用供應商 B：價格較高但有 SLA 保障\", provenance: {...}}]\ncriteria_used 至少 1 筆非空字串，例如 [\"是否有書面 SLA\", \"過去 12 個月的服務中斷次數\"]\njudgment 不能空白，例如「依 SLA 與過去中斷紀錄兩項判準，採用供應商 B」\n（選填）minority_opinion／unknowns／reversal_conditions 都可以不給\n（重點）criteria_used 不能是空陣列——一份沒有引用任何判準、只靠立場數量做的裁決，正是這個方法要防止的多數決謬誤，會被拒絕建立。"
    example_en: "Scenario: render an independent ruling on 'should we choose Vendor A or Vendor B'. proposal_ref: 'Vendor-selection-proposal-2026Q3'; positions_considered has >=1 entry with a non-empty description, e.g. [{id: 'POS-1', description: 'Choose Vendor A: lower price but slower support response', provenance: {...}}, {id: 'POS-2', description: 'Choose Vendor B: higher price but SLA-backed', provenance: {...}}]; criteria_used has >=1 non-empty string, e.g. ['Whether a written SLA exists', 'Number of service outages in the past 12 months']; judgment must be non-empty, e.g. 'Based on the SLA and past-outage criteria, choose Vendor B'. Optional: minority_opinion/unknowns/reversal_conditions may all be omitted. Key point: criteria_used cannot be an empty list -- a ruling reached purely by counting positions with no cited criterion is exactly the majority-vote fallacy this method exists to prevent, and is refused at construction."
  challenge.pre_mortem:
    name_en: "Pre-mortem"
    abbr: ""
    name_zh: "事前驗屍"
    blurb_en: "Assume the project already failed: everyone independently lists why, then cluster, rank, and set prevention/detection/recovery controls. Use it before a project starts to surface real hidden worries early."
    blurb_zh: "假設專案已經失敗，每人先獨立列出可能原因，再分群、排序、訂出預防／偵測／復原措施。專案開始前想提早揪出真正隱憂時用。"
    why_en: "priority is never a caller-supplied field -- it's always derived from a fixed 9-cell (likelihood x impact) lookup table -- but the real invariant is that every failure cause must be covered by at least one control before the record is accepted. A pre-mortem that names failure causes but builds zero controls for one of them didn't actually complete Atlas's own 5-step process; it just stopped at step 2."
    why_zh: "priority 從來不是呼叫端能直接給值的欄位——永遠是從一張固定的 3x3（likelihood × impact）對照表算出來的——但真正的核心不變量是：每一個失敗原因，在紀錄被接受之前都一定要有至少一個控制措施對應到它。一份寫出了失敗原因、卻有一個完全沒建控制措施的 pre-mortem，其實沒有真的走完 Atlas 自己的五步流程，只是停在第二步而已。"
    url: "https://en.wikipedia.org/wiki/Pre-mortem"
    example_zh: "情境：假設「新產品上市 3 個月後失敗」，做 pre-mortem 分析。\nfailure_scenario：「新產品上市 3 個月後被市場放棄」\nfailure_causes 欄位剛好是 id／description／cluster／likelihood／impact 這 5 個（不含 priority，這是系統算的），likelihood／impact 只能是 LOW／MEDIUM／HIGH，例如 [{id: \"FC-1\", description: \"onboarding 流程太複雜，新用戶第一週就流失\", cluster: \"使用者體驗\", likelihood: \"HIGH\", impact: \"HIGH\"}]\ncontrols 每筆的 addresses_cause_id 一定要指向真實存在的 failure_causes id，control_type 只能是 PREVENTION／DETECTION／RECOVERY 三選一，例如 [{id: \"CTRL-1\", control_type: \"PREVENTION\", description: \"上線前找 10 位真實使用者做 onboarding 可用性測試\", addresses_cause_id: \"FC-1\"}]\n（重點）如果 FC-1 完全沒有任何一筆 controls 對應到它，整筆記錄會被拒絕建立——寫出失敗原因卻不建控制措施，等於沒有真的走完流程。priority 這個例子中會自動算成 CRITICAL（因為 likelihood 跟 impact 都是 HIGH），不用也不能自己填。"
    example_en: "Scenario: imagine the new product has failed 3 months after launch, and run a pre-mortem. failure_scenario: 'The new product is abandoned by the market 3 months after launch'; failure_causes entries have EXACTLY these 5 keys (id, description, cluster, likelihood, impact -- no priority, that's computed), likelihood/impact are each LOW/MEDIUM/HIGH only, e.g. [{id: 'FC-1', description: 'Onboarding is too complex, new users churn in week 1', cluster: 'User experience', likelihood: 'HIGH', impact: 'HIGH'}]; every controls entry's addresses_cause_id must resolve to a real failure_causes id, control_type is one of PREVENTION/DETECTION/RECOVERY, e.g. [{id: 'CTRL-1', control_type: 'PREVENTION', description: 'Run onboarding usability testing with 10 real users before launch', addresses_cause_id: 'FC-1'}]. Key point: if FC-1 had zero matching controls entries, the whole record would be refused -- naming a failure cause without building a control for it means the process was never actually completed. priority here is automatically computed as CRITICAL (since both likelihood and impact are HIGH) -- it is never supplied directly."
  challenge.red_team:
    name_en: "Red Team"
    abbr: ""
    name_zh: "紅隊攻擊"
    blurb_en: "Systematically attacks your own plan against an 11-dimension checklist (assumptions, logic, missing variables, counterexamples, security, privacy, legal, culture, operations, statistical validity, overconfidence). Use it before finalizing a plan to find its weaknesses."
    blurb_zh: "用一份含 11 個面向的檢查清單（假設／邏輯／遺漏變數／反例／資安／隱私／法遵／文化／營運／統計效度／過度自信），系統性攻擊自己的方案找漏洞。方案定案前想找出弱點時用。"
    why_en: "the builder refuses to construct a record carrying ANY key shaped like a final-authority claim (approved/verdict/final_decision/authorized/decision/outcome), at both the top level and inside every finding, and the schema's own additionalProperties:false independently blocks a hand-crafted bypass too. This makes Atlas's own explicit rule -- 'Red Team has no final authority, it may only output a challenge artifact' -- a hard structural fact rather than a norm a caller could quietly ignore."
    why_zh: "只要記錄（不管是最上層還是任何一筆 finding 裡）帶有任何看起來像「最終判定」的欄位（approved／verdict／final_decision／authorized／decision／outcome），builder 就直接拒絕建構，schema 自己的 additionalProperties:false 又獨立擋掉一次手動繞過的可能。這讓 Atlas 明講的規則——「Red Team 沒有 final authority，只能輸出 challenge artifact」——變成硬性的結構事實，而不是一條呼叫端可以悄悄無視的規範。"
    url: "https://en.wikipedia.org/wiki/Red_team"
    example_zh: "情境：對「全面停用內部工具的雙因子驗證以加快登入速度」這個提案做 Red Team 挑戰。\nproposal_ref：「提案-停用2FA-2026」\ndimensions_examined 至少 1 筆，只能是 ASSUMPTIONS／LOGIC／MISSING_VARIABLES／COUNTEREXAMPLES／SECURITY／PRIVACY／LEGAL／CULTURE／OPERATIONS／STATISTICAL_VALIDITY／OVERCONFIDENCE 這 11 種其中幾種，例如 [\"SECURITY\", \"LEGAL\"]\nfindings 每筆的 dimension 一定要在上面 dimensions_examined 出現過，例如 [{id: \"F-1\", dimension: \"SECURITY\", description: \"停用 2FA 會讓帳號在密碼外洩情境下完全暴露\", provenance: {...}}]\n（重點）record 本身跟每一筆 finding 都絕對不能出現 approved／verdict／final_decision／authorized／decision／outcome 這類欄位——就算硬塞進去也會被拒絕建立，因為 Red Team 依規定沒有最終決定權，只能提出挑戰，不能自己下判定。"
    example_en: "Scenario: run a Red Team challenge on the proposal 'disable two-factor auth on internal tools to speed up login'. proposal_ref: 'Proposal-disable-2FA-2026'; dimensions_examined has >=1 entry drawn from the 11 valid values (ASSUMPTIONS/LOGIC/MISSING_VARIABLES/COUNTEREXAMPLES/SECURITY/PRIVACY/LEGAL/CULTURE/OPERATIONS/STATISTICAL_VALIDITY/OVERCONFIDENCE), e.g. ['SECURITY', 'LEGAL']; every findings entry's dimension must appear in dimensions_examined above, e.g. [{id: 'F-1', dimension: 'SECURITY', description: 'Disabling 2FA fully exposes accounts if a password leaks', provenance: {...}}]. Key point: neither the record itself nor any finding may ever carry a key like approved/verdict/final_decision/authorized/decision/outcome -- even forcing one in is refused at construction, because Red Team by rule has no final authority; it may only raise a challenge, never render a verdict."
  challenge.stress_testing:
    name_en: "Stress Testing"
    abbr: ""
    name_zh: "壓力測試（情境）"
    blurb_en: "Designs extreme-but-plausible scenarios and tests where the plan actually breaks. Use it to find a plan's real resilience limit."
    blurb_zh: "設計極端但合理的情境，測試方案在壓力下的崩潰點在哪。想知道一個方案的韌性極限時用。"
    why_en: "every scenario's extreme_value must fall STRICTLY outside its own normal_range -- a value sitting at the boundary still counts as normal, not extreme. A 'stress test' scenario whose extreme_value is actually inside the documented normal operating range isn't stressing anything; it's normal operation wearing an 'extreme' label, which is exactly the failure this invariant exists to catch."
    why_zh: "每個情境的 extreme_value 一定要真的落在自己 normal_range 之外——連剛好卡在邊界上的值都還算正常，不算極端。一個「壓力測試」情境，如果它的 extreme_value 其實落在文件記載的正常運作範圍之內，那就完全沒在測試什麼，只是把正常操作貼上「極端」的標籤，而這正是這個不變量要抓的失敗情況。"
    url: "https://www.ibm.com/think/topics/bank-stress-test"
    example_zh: "情境：對「訂單結帳流程能不能撐過極端但合理的情境」做壓力測試（注意：這是認知面的情境推演，跟 devops_sre.stress_test 那種真的對系統打流量的工程壓測是兩回事）。\nproposal_ref：「結帳流程 2026 年終大促備戰計畫」\nscenarios 至少 1 筆，normal_range.min／max 都要是實數，extreme_value 一定要嚴格落在 [min, max] 之外（連邊界值都不算極端），outcome 只能是 WITHIN_TOLERANCE／DEGRADED／BROKEN 三選一，例如 [{id: \"SC-1\", description: \"單日訂單量突然暴增\", normal_range: {min: 1000, max: 5000}, extreme_value: 50000, outcome: \"DEGRADED\"}]\n（重點）如果 extreme_value 填成 3000（落在 1000-5000 的正常範圍內），會被拒絕建立——這樣不是壓力測試，只是正常操作換個標籤，沒有真的測試任何極端情境。"
    example_en: "Scenario: stress-test whether the checkout flow can survive an extreme-but-plausible scenario (note: this is a cognitive scenario walkthrough, distinct from devops_sre.stress_test's real engineering load test that actually fires traffic at a running system). proposal_ref: 'Checkout flow year-end sale readiness plan'; scenarios has >=1 entry, normal_range.min/max must both be real numbers, extreme_value must fall STRICTLY outside [min, max] (even a boundary value doesn't count as extreme), outcome is one of WITHIN_TOLERANCE/DEGRADED/BROKEN, e.g. [{id: 'SC-1', description: 'Sudden spike in daily order volume', normal_range: {min: 1000, max: 5000}, extreme_value: 50000, outcome: 'DEGRADED'}]. Key point: if extreme_value were set to 3000 (inside the normal 1000-5000 range), the record would be refused at construction -- that's not stress-testing, just normal operation under a different label, testing no extreme scenario at all."

  # ---- computation ----
  computation.monte_carlo:
    name_en: "Monte Carlo Simulation"
    abbr: ""
    name_zh: "蒙地卡羅模擬"
    blurb_en: "Simulates an uncertain outcome's distribution via large-scale random sampling, giving you probabilities instead of a single number. Use it when many uncertain factors interact and you need best/worst/most-likely odds."
    blurb_zh: "用大量隨機抽樣模擬一個不確定結果的分布，得到機率而不是單一數字。有很多不確定因素、想知道最好／最壞／最可能情境的機率時用。"
    why_en: "A single-point estimate ('expected revenue: $500K') hides how much the inputs could actually vary; sampling each uncertain input thousands of times and summing the results turns 'it depends on several unknowns' into a concrete probability (e.g. '68% chance of hitting the target') and an honest worst-case tail, which a single spreadsheet formula cannot give you."
    why_zh: "單一估計值（「預期營收 50 萬」）會掩蓋輸入本身其實有多大的變動空間；把每個不確定輸入抽樣幾千次再加總，能把「這要看好幾個未知數」變成一個具體機率（例如「68% 機率達標」）跟誠實的最壞情境尾端，這是單一試算表公式給不出來的。"
    url: "https://www.ibm.com/think/topics/monte-carlo-simulation"
    example_zh: "情境：估計新方案上線後的淨效益分布，有 2 個不確定因素。\nsimulation_id：任意字串即可（例如 \"MONTECARLO-T1\"），系統目前不強制檢查前綴格式\ninput_distributions 至少 1 筆，每筆要 id／label／distribution_type／params，distribution_type 是 normal／uniform／triangular 三選一，params 依類型而定：normal 要 {mean, std_dev}、uniform 要 {min, max}、triangular 要 {min, max, mode}，例如 [{id: \"D1\", label: \"新增訂單收益\", distribution_type: \"normal\", params: {mean: 500, std_dev: 120}}, {id: \"D2\", label: \"額外維運成本\", distribution_type: \"triangular\", params: {min: -200, max: -50, mode: -100}}]（多個分布會直接加總）\nrandom_seed：任意整數，例如 42（同樣的 seed 會重現一樣的結果，這是刻意設計、不是巧合）\nnum_runs：至少 2，實務上常用 1000 以上，例如 2000\nsensitivity_notes：不能空白，寫清楚哪個輸入對結果影響最大、假設有多敏感，例如「維運成本假設若惡化 50%，達標機率會明顯下降」\n（選填）success_threshold／success_direction：兩個要嘛都給、要嘛都不給，direction 只能是 at_least 或 at_most，例如 success_threshold: 300, success_direction: \"at_least\"（淨效益至少 300 才算成功）\noutcome_distribution／tail_risk／success_probability 都由系統算出，不用也不能自己填；結果絕對不能宣稱「保證」達成任何結果（Atlas 明文禁止）。\n（選填）version、combine_mode：留空由系統帶入預設值（combine_mode 目前僅支援 \"sum\"）。"
    example_en: "Scenario: estimating the net-benefit distribution of a new initiative with 2 uncertain factors. simulation_id: any string works (e.g. 'MONTECARLO-T1'), the system does not currently enforce a prefix format for it; input_distributions has >=1 entry, each needs id/label/distribution_type/params, distribution_type is one of normal/uniform/triangular, params depends on the type: normal needs {mean, std_dev}, uniform needs {min, max}, triangular needs {min, max, mode}, e.g. [{id: 'D1', label: 'Incremental order revenue', distribution_type: 'normal', params: {mean: 500, std_dev: 120}}, {id: 'D2', label: 'Extra operating cost', distribution_type: 'triangular', params: {min: -200, max: -50, mode: -100}}] (multiple distributions are summed); random_seed: any integer, e.g. 42 (the same seed reproduces the same result -- by design, not coincidence); num_runs: >=2, commonly 1000+ in practice, e.g. 2000; sensitivity_notes cannot be blank -- state which input drives the result most and how sensitive the assumptions are, e.g. 'If the operating-cost assumption worsens by 50%, the success probability drops noticeably'. Optional: success_threshold/success_direction, must be given together or not at all, direction is 'at_least' or 'at_most' only, e.g. success_threshold: 300, success_direction: 'at_least' (net benefit >=300 counts as success). outcome_distribution/tail_risk/success_probability are all computed by the system, never supplied -- the result must never claim a 'guaranteed' outcome (explicitly forbidden). version/combine_mode can be left blank (combine_mode currently supports only 'sum')."

  # ---- database_data (F21 DB / Data Pack) ----
  database_data.backup_restore_drill:
    name_en: "Backup / Restore Drill"
    abbr: ""
    name_zh: "備份還原演練"
    blurb_en: "Records a real drill of restoring from backup, proving the backup actually works before you need it in an emergency. Use it periodically for anything you can't afford to lose."
    blurb_zh: "記錄一次真實的備份還原演練，證明備份真的能用，而不是等到出事才發現壞了。定期對重要資料做這件事。"
    why_en: "A backup that exists is not the same claim as a backup that restores usably within the time and data-loss limits the business actually needs -- this method refuses to let a record say status:passed unless integrity checks genuinely passed AND the real measured recovery time stayed under the RTO target AND (if RPO is tracked) the real measured data age stayed under the RPO target. The check is one-directional on purpose: a cautious status:failed despite good numbers is still allowed, because that is a legitimate human judgment call this method should never override."
    why_zh: "「備份存在」跟「備份真的能在業務能接受的時間跟資料遺失範圍內還原成可用系統」是兩個不同的主張——這個方法不會讓紀錄寫 status:passed，除非完整性檢查真的通過、而且實際測到的還原時間真的低於 RTO 目標、而且（如果有追蹤 RPO）實際測到的資料落後時間真的低於 RPO 目標。這個檢查是刻意單向的：就算數字都合格，還是可以保守地寫 status:failed，因為這是這個方法永遠不該覆蓋的正當人為判斷。"
    url: "https://oneuptime.com/blog/post/2026-08-06-prove-rpo-rto-with-restore-drills/view"
    example_zh: "情境：對正式環境資料庫做一次還原演練。\nbackup_id：「prod-db-2026-09-17-nightly」\nrestore_environment：「隔離的還原測試環境（非正式環境）」\nintegrity_checks_passed：true 或 false，例如 true\nrto_target_seconds：必須是有限正數，例如 3600（1 小時）\nactual_recovery_duration_seconds：必須是有限非負數，例如 2100（實際只花 35 分鐘）\nstatus：只能是 passed 或 failed，要寫 passed，前面幾項條件必須「真的」全部達標，不然系統會拒絕，例如 \"passed\"\n（選填）rpo_target_seconds／observed_data_age_seconds：兩個要嘛都給、要嘛都不給，例如 rpo_target_seconds: 900（15 分鐘），observed_data_age_seconds: 600（實際資料落後 10 分鐘）\n（選填）issues_recorded：字串陣列，不能是單一字串（會被逐字元拆開），例如 [\"還原過程中有一次連線逾時，重試後成功\"]\n（選填）version：留空即可。"
    example_en: "Scenario: running a restore drill against the production database. backup_id: 'prod-db-2026-09-17-nightly'; restore_environment: 'Isolated restore test environment (not production)'; integrity_checks_passed: true or false, e.g. true; rto_target_seconds must be a finite positive number, e.g. 3600 (1 hour); actual_recovery_duration_seconds must be a finite non-negative number, e.g. 2100 (took only 35 minutes); status is passed or failed only -- to write 'passed', the criteria above must ALL genuinely be met or the system refuses it, e.g. 'passed'. Optional: rpo_target_seconds/observed_data_age_seconds, must be given together or not at all, e.g. rpo_target_seconds: 900 (15 min), observed_data_age_seconds: 600 (actual data lag 10 min). Optional: issues_recorded, a list of strings, never a bare string (which would be split into individual characters), e.g. ['One connection timeout during restore, succeeded on retry']. Optional: version can be left blank."
  database_data.data_contract:
    name_en: "Data Contract"
    abbr: ""
    name_zh: "資料契約"
    blurb_en: "Defines the agreed shape/semantics of data exchanged between a producer and consumer, so a schema change can't silently break the other side. Use it whenever one team's data feeds another team's system."
    blurb_zh: "定義資料生產方與消費方之間約定好的資料格式與語意，避免欄位改動悄悄弄壞對方系統。一個團隊的資料要餵給另一個系統用時用。"
    why_en: "Without a written contract, a producer team can rename or drop a field and only find out it broke someone else when a downstream dashboard goes blank -- writing down the exact fields, their types and nullability, plus who actually consumes this data, turns an implicit assumption into something a schema change can be checked against BEFORE shipping, not after the pager goes off."
    why_zh: "沒有書面契約的情況下，生產端團隊改個欄位名稱或砍掉一個欄位，往往要等到下游某個儀表板整個開天窗才會知道弄壞了誰——把欄位的確切名稱、型別、是否可為空，加上真正在消費這份資料的對象都寫清楚，能把一個隱性假設變成一個能在改動上線「之前」就拿來檢查的東西，而不是等呼叫器響了才知道。"
    url: "https://dataproducts.substack.com/p/an-engineers-guide-to-data-contracts"
    example_zh: "情境：訂閱系統的「訂單建立事件」跟下游分析團隊訂出資料契約。\ndataset_or_topic：「orders.order_created 事件」\nproducer：「訂單服務」\nconsumers 至少 1 筆且彼此不重複，例如 [\"分析團隊的營收儀表板\", \"財務對帳批次任務\"]\nfields 至少 1 筆，每筆要 name／data_type／nullable，名稱在整份契約裡要唯一，例如 [{name: \"order_id\", data_type: \"string\", nullable: false}, {name: \"discount_code\", data_type: \"string\", nullable: true}]\nsemantics：「order_id 是訂單建立時產生的唯一識別碼，不會重複使用」\nquality_notes：可以是空陣列，但欄位要給，例如 [\"discount_code 只有走過優惠碼流程的訂單才會有值\"]\ncompatibility_policy：「新增欄位必須是可為空或有預設值；不得直接砍欄位，需先走棄用流程」\n（選填）schema_ref：如果有對應的 database_data.erd 紀錄，填其 record id（\"ERD-\" 開頭）\n（選填）freshness_ref、compatibility_ref、deprecation_ref：分別指向對應的既有紀錄，格式要求各自的前綴。\n（選填）version：留空即可。"
    example_en: "Scenario: a data contract for an order service order-created event, agreed with a downstream analytics team. dataset_or_topic: 'orders.order_created event'; producer: 'Order service'; consumers has >=1 entry, all unique, e.g. ['Analytics team revenue dashboard', 'Finance reconciliation batch job']; fields has >=1 entry, each needs name/data_type/nullable, names unique across the whole contract, e.g. [{name: 'order_id', data_type: 'string', nullable: false}, {name: 'discount_code', data_type: 'string', nullable: true}]; semantics: 'order_id is a unique identifier generated at order creation and never reused'; quality_notes may be an empty list but the field is required, e.g. ['discount_code is only populated for orders that went through the promo-code flow']; compatibility_policy: 'New fields must be nullable or carry a default; fields may never be dropped directly, only via a deprecation process'. Optional: schema_ref, if a matching database_data.erd record exists, its record id (starting with 'ERD-'). Optional: freshness_ref/compatibility_ref/deprecation_ref, each pointing to a matching existing record with its own required prefix. Optional: version can be left blank."
  database_data.data_lineage:
    name_en: "Data Lineage"
    abbr: ""
    name_zh: "資料血緣"
    blurb_en: "Traces a data field from its source through ingest/transform/dataset all the way to the paper/decision that used it. Use it to answer 'where did this number actually come from?'"
    blurb_zh: "追蹤一個資料欄位從來源、蒐集、轉換、資料集，一路到最後被拿去做決策的完整路徑。想回答「這個數字到底哪裡來的」時用。"
    why_en: "A node CLAIMING it traces back to a source is not the same as it actually resolving to one -- the system genuinely walks the declared upstream_refs chain for every node and computes whether it really terminates at a real SOURCE node, rather than trusting a caller-asserted flag. A node whose upstream chain dead-ends, loops, or points nowhere is caught here, exactly the silent-orphan failure that makes a number impossible to actually trace back despite the record claiming otherwise."
    why_zh: "一個節點「宣稱」自己能追溯回來源，跟它「真的」能解析到一個來源，是兩回事——系統會真的沿著每個節點宣告的 upstream_refs 鏈走一遍，計算它是不是真的終結在一個真實的 SOURCE 節點，而不是相信呼叫端自己說的旗標。一個上游鏈斷掉、繞圈、或指向不存在節點的情況會在這裡被抓到，這正是那種讓一個數字明明紀錄上宣稱可追溯、實際上卻是孤兒節點的失效狀況。"
    url: "https://www.ibm.com/think/topics/descriptive-data-lineage"
    example_zh: "情境：追蹤一份月報裡「活躍用戶數」這個數字的完整血緣。\ndataset_ref：「月報 -- 活躍用戶數」\nnodes 至少 1 筆，id 全記錄唯一，stage 只能是 SOURCE／INGEST／TRANSFORM／DATASET／ANALYSIS_RUN／RESULT／CLAIM／PAPER_OR_DECISION 八選一，SOURCE 節點不能有 upstream_refs，例如 [{id: \"N1\", stage: \"SOURCE\", description: \"應用程式登入事件原始 log\", upstream_refs: [], provenance: {...}}, {id: \"N2\", stage: \"TRANSFORM\", description: \"依使用者 ID 去重、依月份聚合\", upstream_refs: [\"N1\"], provenance: {...}}, {id: \"N3\", stage: \"PAPER_OR_DECISION\", description: \"董事會月報\", upstream_refs: [\"N2\"], provenance: {...}}]\n重要：至少要有 1 個 SOURCE 節點，而且每個非 SOURCE 節點的 upstream_refs 鏈最終都要能真的走到一個 SOURCE 節點，走不到的話會被拒絕，不是自己說能追溯就算數。\ntraces_to_source（每個節點是否真的能追溯到來源）由系統自動計算，不用也不能自己填。\n（選填）version：留空即可。"
    example_en: "Scenario: tracing the full lineage of the 'active users' number in a monthly report. dataset_ref: 'Monthly report -- active user count'; nodes has >=1 entry, id unique across the record, stage is one of SOURCE/INGEST/TRANSFORM/DATASET/ANALYSIS_RUN/RESULT/CLAIM/PAPER_OR_DECISION, a SOURCE node must have no upstream_refs, e.g. [{id: 'N1', stage: 'SOURCE', description: 'Raw application login event log', upstream_refs: [], provenance: {...}}, {id: 'N2', stage: 'TRANSFORM', description: 'Deduplicated by user ID, aggregated by month', upstream_refs: ['N1'], provenance: {...}}, {id: 'N3', stage: 'PAPER_OR_DECISION', description: 'Board monthly report', upstream_refs: ['N2'], provenance: {...}}]. Important: at least 1 SOURCE node is required, and every non-SOURCE node's upstream_refs chain must actually resolve all the way to a real SOURCE node -- a dead-end chain is refused, claiming traceability alone does not count. traces_to_source (whether each node genuinely traces back to a source) is computed by the system, never supplied. Optional: version can be left blank."
  database_data.data_quality_dimensions:
    name_en: "Data Quality Dimensions"
    abbr: ""
    name_zh: "資料品質維度"
    blurb_en: "Scores a dataset across standard quality dimensions (completeness, accuracy, consistency, timeliness, etc.). Use it to systematically check whether data is actually trustworthy before relying on it."
    blurb_zh: "用一組標準品質維度（完整性、準確性、一致性、時效性等）評分一份資料集。想有系統地檢查資料能不能信任時用。"
    why_en: "Whether a profiled score actually clears its own threshold, and whether the dataset as a whole passes its quality gate, are real comparisons the system computes fresh every time -- never a caller-asserted pass/fail. That closes the gap where someone could type profiled_score: 0.6, threshold: 0.9, passes_threshold: true into a record and have it silently accepted; the DAMA six-dimension vocabulary this uses also stops 'data quality' from meaning something different in every conversation."
    why_zh: "一個評測分數是不是真的超過它自己的門檻、整份資料集是不是真的通過品質關卡，都是系統每次重新算出來的真實比較——絕不是呼叫端自己說了算的通過／不通過。這能堵住有人打進 profiled_score: 0.6、threshold: 0.9、卻宣稱 passes_threshold: true 卻被悄悄接受的漏洞；用 DAMA 的六大維度詞彙，也能避免「資料品質」在每場對話裡代表不同的東西。"
    url: "https://dama-nl.org/wp-content/uploads/2020/11/How-to-Select-the-Right-Dimensions-of-Data-Quality-v1.1-d.d.-14-Nov-2020.pdf"
    example_zh: "情境：評估一份客戶資料表的品質。\ndataset_or_topic：「客戶主檔資料表」\ndimensions 至少 1 筆，dimension 只能是 completeness／accuracy／consistency／uniqueness／timeliness／validity 六選一，profiled_score／threshold 都必須是 0.0~1.0 之間的有限實數，例如 [{dimension: \"completeness\", rule: \"email 欄位不可為空\", profiled_score: 0.97, threshold: 0.95, owner: \"資料團隊\"}, {dimension: \"uniqueness\", rule: \"手機號碼不可重複\", profiled_score: 0.88, threshold: 0.99, owner: \"資料團隊\"}]\npasses_threshold（每個維度是否過關）、quality_gate_status（整體是否過關）、quarantined_dimensions（哪些維度沒過關）都由系統自動計算，不用也不能自己填。\n（選填）schema_ref、lineage_ref、restore_drill_ref、data_contract_ref：分別指向對應的既有紀錄，格式要求各自的前綴（ERD-／DLR-／DRILL-／DC-）。\n（選填）version：留空即可。"
    example_en: "Scenario: assessing the quality of a customer master data table. dataset_or_topic: 'Customer master table'; dimensions has >=1 entry, dimension is one of completeness/accuracy/consistency/uniqueness/timeliness/validity, profiled_score/threshold must both be finite reals in [0.0, 1.0], e.g. [{dimension: 'completeness', rule: 'email field must not be empty', profiled_score: 0.97, threshold: 0.95, owner: 'Data team'}, {dimension: 'uniqueness', rule: 'phone number must not be duplicated', profiled_score: 0.88, threshold: 0.99, owner: 'Data team'}]. passes_threshold (whether each dimension clears its bar), quality_gate_status (whether the dataset overall passes), and quarantined_dimensions (which dimensions failed) are all computed by the system, never supplied. Optional: schema_ref/lineage_ref/restore_drill_ref/data_contract_ref, each pointing to a matching existing record with its own required prefix (ERD-/DLR-/DRILL-/DC-). Optional: version can be left blank."
  database_data.erd:
    name_en: "Entity-Relationship Diagram"
    abbr: "ERD"
    name_zh: "實體關係圖"
    blurb_en: "Models entities, attributes, and relationships as a structured diagram-as-data record. Use it to design or document a database schema."
    blurb_zh: "把實體、屬性、關係建模成結構化的圖表資料紀錄。設計或整理資料庫結構時用。"
    why_en: "A picture of boxes and lines proves nothing on its own -- this record requires every entity to actually carry a primary key, and every relationship's from_entity/to_entity/foreign_key_attributes to genuinely resolve against real entities and their real attributes, so a relationship pointing at a typo'd entity name or a foreign key naming a column that does not exist gets caught as a real modeling error, not just an inconsistency nobody noticed on the diagram."
    why_zh: "一張畫著方框跟線條的圖，本身什麼都證明不了——這份紀錄要求每個實體真的要有一個主鍵、每個關係的 from_entity／to_entity／foreign_key_attributes 都要真的能對應到真實存在的實體跟屬性，這樣一個指向打錯字的實體名稱、或外鍵指名一個根本不存在的欄位的關係，就會被抓成一個真正的建模錯誤，而不只是一個沒人在圖上注意到的不一致。"
    url: "https://www.csc.lsu.edu/~chen/pdf/erd-5-pages.pdf"
    example_zh: "情境：設計「訂單」與「客戶」的資料庫結構。\nsystem_or_database：「電商訂單系統」\nentities 至少 1 筆，名稱在整份紀錄裡唯一，每個實體至少要有 1 個屬性標 is_primary_key: true，例如 [{name: \"customers\", attributes: [{name: \"customer_id\", data_type: \"UUID\", is_primary_key: true}, {name: \"email\", data_type: \"VARCHAR(255)\", is_primary_key: false}]}, {name: \"orders\", attributes: [{name: \"order_id\", data_type: \"UUID\", is_primary_key: true}, {name: \"customer_id\", data_type: \"UUID\", is_primary_key: false}]}]\nrelationships 可以是空陣列，但每筆若有給，from_entity／to_entity 必須是真實存在的實體名稱，foreign_key_attributes 必須是 from_entity 自己真實存在的屬性（陣列，支援複合外鍵），cardinality 只能是 one_to_one 或 many_to_one（many_to_many 要改用中介實體表示），例如 [{from_entity: \"orders\", to_entity: \"customers\", cardinality: \"many_to_one\", foreign_key_attributes: [\"customer_id\"]}]\nconstraints：字串陣列，可以是空的，例如 [\"email 必須唯一\"]\n（選填）migration_ref：如果有對應的 database_data.expand_contract_migration 紀錄，填其 record id（\"ECMIG-\" 開頭）\n（選填）version：留空即可。"
    example_en: "Scenario: designing the database structure for orders and customers. system_or_database: 'E-commerce order system'; entities has >=1 entry, names unique across the record, each entity needs at least 1 attribute flagged is_primary_key: true, e.g. [{name: 'customers', attributes: [{name: 'customer_id', data_type: 'UUID', is_primary_key: true}, {name: 'email', data_type: 'VARCHAR(255)', is_primary_key: false}]}, {name: 'orders', attributes: [{name: 'order_id', data_type: 'UUID', is_primary_key: true}, {name: 'customer_id', data_type: 'UUID', is_primary_key: false}]}]. relationships may be an empty list, but any entry given must have from_entity/to_entity naming real entities, foreign_key_attributes must be real attributes of from_entity itself (an array, supporting composite foreign keys), cardinality is one_to_one or many_to_one only (many_to_many is modeled via a junction entity), e.g. [{from_entity: 'orders', to_entity: 'customers', cardinality: 'many_to_one', foreign_key_attributes: ['customer_id']}]. constraints: an array of strings, may be empty, e.g. ['email must be unique']. Optional: migration_ref, if a matching database_data.expand_contract_migration record exists, its record id (starting with 'ECMIG-'). Optional: version can be left blank."
  database_data.expand_contract_migration:
    name_en: "Expand-Contract Migration"
    abbr: ""
    name_zh: "擴張-收縮式遷移"
    blurb_en: "Plans a zero-downtime schema migration in two safe phases: expand (add the new shape alongside the old) then contract (remove the old shape once everything's migrated). Use it for any breaking database schema change on a live system."
    blurb_zh: "把資料庫改動拆成「先擴張（新舊並存）再收縮（確定都遷移完才刪舊的）」兩階段，做零停機的破壞性 schema 變更。正式環境要改資料庫結構時用。"
    why_en: "A stage marked complete does not itself prove the migration is actually safe -- exit code zero is not proof, only a genuinely non-decreasing real-world timeline is. The system checks every recorded completion timestamp against the canonical 15-stage order and refuses a record where, for example, the old schema was contracted (destroyed) BEFORE reconciliation actually finished, even if both stage_ids are technically present -- presence alone was exactly the gap that let a genuinely unsafe migration look complete."
    why_zh: "一個標記完成的階段，本身不能證明遷移真的安全——exit code 為零不是證明，真正的證明是現實世界裡的時間軸真的沒有倒退。系統會把每個記錄的完成時間戳，拿去對照那 15 個階段的標準順序核對，如果舊 schema 在真正對帳完成「之前」就被收縮（銷毀）了，就算兩個 stage_id 都技術上存在，這份紀錄還是會被拒絕——光「存在」本身，正是讓一個實際上不安全的遷移看起來像已經完成的漏洞。"
    url: "https://martinfowler.com/bliki/ParallelChange.html"
    example_zh: "情境：記錄一個正在進行中的資料庫欄位型別遷移。\nmigration_ref：任意字串，用來對應這次遷移的整體識別（例如票務系統的工單編號）\nstages 至少 1 筆，stage_id 必須是 15 個標準階段名稱之一（依序是 schema_baseline／data_contract／compatibility_analysis／backup_restore_validation／expand／deploy_compatible_code／enable_dual_write／backfill／reconciliation／dual_read_verification／canary／traffic_migration_switch／observe／contract_old_schema／close_rollback_window），completed_at 必須是可解析的 ISO-8601 時間戳，例如 [{stage_id: \"schema_baseline\", completed_at: \"2026-09-01T09:00:00Z\"}, {stage_id: \"data_contract\", completed_at: \"2026-09-01T10:00:00Z\"}, {stage_id: \"compatibility_analysis\", completed_at: \"2026-09-02T09:00:00Z\"}]\n重要：已記錄的階段必須是標準順序裡「連續的前綴」（不能跳過中間某個較早的階段），而且依標準順序排列後，completed_at 時間戳必須不遞減——就算階段名稱都對，時間倒退一樣會被拒絕。\n（選填）evidence_ref：每個階段可以附上證據連結，例如 {stage_id: \"reconciliation\", completed_at: \"2026-09-10T15:00:00Z\", evidence_ref: \"對帳報告連結\"}\n（選填）version：留空即可。"
    example_en: "Scenario: recording an in-progress database column-type migration. migration_ref: any string identifying this overall migration (e.g. a ticketing-system work-item id); stages has >=1 entry, stage_id must be one of the 15 canonical stage names (in order: schema_baseline/data_contract/compatibility_analysis/backup_restore_validation/expand/deploy_compatible_code/enable_dual_write/backfill/reconciliation/dual_read_verification/canary/traffic_migration_switch/observe/contract_old_schema/close_rollback_window), completed_at must be a parseable ISO-8601 timestamp, e.g. [{stage_id: 'schema_baseline', completed_at: '2026-09-01T09:00:00Z'}, {stage_id: 'data_contract', completed_at: '2026-09-01T10:00:00Z'}, {stage_id: 'compatibility_analysis', completed_at: '2026-09-02T09:00:00Z'}]. Important: recorded stages must form a CONTIGUOUS PREFIX of the canonical order (no skipping an earlier stage), and once sorted by canonical order, completed_at timestamps must be non-decreasing -- even with every stage_id correct, a timestamp that goes backward is refused. Optional: evidence_ref per stage, e.g. {stage_id: 'reconciliation', completed_at: '2026-09-10T15:00:00Z', evidence_ref: 'Link to reconciliation report'}. Optional: version can be left blank."
  database_data.normalization:
    name_en: "Normalization"
    abbr: ""
    name_zh: "正規化"
    blurb_en: "Checks a schema against normal-form rules to remove redundancy and update anomalies. Use it when designing or reviewing a relational schema."
    blurb_zh: "用正規化規則檢查 schema，移除重複資料與更新異常。設計或審查關聯式資料庫結構時用。"
    why_en: "Which normal form a table actually achieves is a computable fact of relational theory, not an opinion -- the system derives it fresh from your declared primary key and functional dependencies, and it specifically refuses a declared key that is a superkey but not MINIMAL (irreducible), because 'prime attribute' (the exception 3NF cares about) is only a meaningful concept relative to a truly minimal key; a non-minimal key would silently make the classifier OVER-report how normalized the table really is."
    why_zh: "一張表到底達到哪個正規化形式，是關聯式理論裡一個可以算出來的事實，不是意見——系統會從你宣告的主鍵跟功能相依性重新推算，而且會特別拒絕一個雖然是超鍵、卻不是「最小」（不可再約簡）的宣告主鍵，因為「主屬性」（3NF 在意的那個例外）這個概念，只有相對於一個真正最小的鍵才有意義；一個非最小的鍵會讓分類器悄悄「高估」這張表實際達到的正規化程度。"
    url: "https://www.digitalocean.com/community/tutorials/database-normalization"
    example_zh: "情境：檢查一張「訂單明細」表的正規化程度。\nentity_name：「訂單明細」\nprimary_key_attributes 至少 1 筆、不重複，而且必須是「最小」的（不能是可以再約簡的超鍵），例如 [\"order_id\", \"line_number\"]\nnon_key_attributes：不重複，且不能跟主鍵重疊，例如 [\"product_name\", \"product_price\", \"quantity\"]\nfunctional_dependencies 可以是空陣列，每筆要 determinant（陣列，決定方）／dependent（單一屬性，被決定方），dependent 不能出現在自己的 determinant 裡（不能是無意義的恆等關係），例如 [{determinant: [\"order_id\", \"line_number\"], dependent: \"quantity\"}, {determinant: [\"product_name\"], dependent: \"product_price\"}]（這一條 FD 顯示 product_price 只依賴 product_name、不依賴完整主鍵，屬於遞移相依）\nachieved_normal_form（實際達到的正規化形式）跟三個違規清單都由系統依上面欄位自動算出，不用也不能自己填。\n（選填）schema_ref：對應的 database_data.erd 紀錄 id（\"ERD-\" 開頭）\n（選填）denormalization_decision：例如 {decision: \"keep_normalized\", reasoning: \"目前查詢量不大，先維持正規化\"}\n（選填）version：留空即可。"
    example_en: "Scenario: checking the normalization level of an order-line-items table. entity_name: 'Order line items'; primary_key_attributes has >=1 entry, unique, and must be MINIMAL (not a reducible superkey), e.g. ['order_id', 'line_number']; non_key_attributes: unique, disjoint from the primary key, e.g. ['product_name', 'product_price', 'quantity']; functional_dependencies may be an empty list, each entry needs determinant (an array, the determining side) and dependent (a single attribute, the determined side), dependent must not appear in its own determinant (no trivial identity relation), e.g. [{determinant: ['order_id', 'line_number'], dependent: 'quantity'}, {determinant: ['product_name'], dependent: 'product_price'}] (this FD shows product_price depends only on product_name, not the full primary key -- a transitive dependency). achieved_normal_form (the actual normal form reached) and all three violation lists are computed by the system from the fields above, never supplied. Optional: schema_ref, a matching database_data.erd record id (starting with 'ERD-'). Optional: denormalization_decision, e.g. {decision: 'keep_normalized', reasoning: 'Query volume is low for now, staying normalized'}. Optional: version can be left blank."
  database_data.reconciliation:
    name_en: "Reconciliation"
    abbr: ""
    name_zh: "資料對帳"
    blurb_en: "Compares counts/checksums/business invariants between two data states and resolves any diff, proving a migration completed correctly. Use it right after any data migration or sync."
    blurb_zh: "比對兩個資料狀態的筆數／checksum／業務不變量，找出差異並解決，證明遷移真的完整。資料遷移或同步完成後用。"
    why_en: "A COUNT comparison computed with ordinary floating point silently loses precision above 2^53, which can make two genuinely different large numbers compare as equal with no tampering required -- this method uses exact decimal arithmetic instead and computes matches/diff itself, never accepting a caller-asserted verdict. overall_status:reconciled is refused unless every single check is actually satisfied (a real match, or an explicit human resolution documenting it as expected), so a migration cannot be marked provably complete while one real diff is quietly still open."
    why_zh: "用一般浮點數做 COUNT 比對，在超過 2^53 時會悄悄失去精度，可能讓兩個真的不一樣的大數字比出「相等」，完全不需要任何人動手腳——這個方法改用精確的十進位運算，而且自己算出 matches／diff，絕不接受呼叫端自己宣稱的結論。除非每一項檢查都真的滿足（真的相符，或有人明確記錄「這個差異在預期之內」的解決說明），否則不能寫 overall_status:reconciled，這樣一次遷移就不能在還有一個真實差異悄悄開著的情況下，被標成「可證明完整」。"
    url: "https://montecarlo.ai/blog-data-reconciliation"
    example_zh: "情境：資料庫遷移後，對帳來源與目標系統的訂單資料。\nsource_ref：「舊資料庫 orders 表」\ntarget_ref：「新資料庫 orders 表」\nchecks 至少 1 筆，id 不重複，check_type 只能是 COUNT／CHECKSUM／BUSINESS_INVARIANT 三選一，matches／diff 由系統依 source_value／target_value 自動算出（不用也不能自己填），例如 [{id: \"CHK-1\", name: \"訂單總筆數\", check_type: \"COUNT\", source_value: \"15000\", target_value: \"15000\"}, {id: \"CHK-2\", name: \"訂單總金額 checksum\", check_type: \"CHECKSUM\", source_value: \"a1b2c3...\", target_value: \"a1b2c3...\"}]\n若某個檢查沒有真的相符，可以附上 resolution 說明為什麼這樣算通過，resolved_as_expected 若填 false 代表「這個差異不 OK」，即使 matches 是 true 也一樣不算通過，例如 {id: \"CHK-3\", name: \"取消訂單數\", check_type: \"COUNT\", source_value: \"50\", target_value: \"48\", resolution: {resolved_as_expected: true, note: \"2 筆是遷移期間新取消的訂單，屬於預期差異\"}}\noverall_status：要寫 \"reconciled\" 就必須每一筆 check 都真的滿足，不滿足的話系統會拒絕；沒把握時可以誠實寫 \"open\"。\n（選填）version：留空即可。"
    example_en: "Scenario: reconciling order data between source and target systems after a database migration. source_ref: 'Old database orders table'; target_ref: 'New database orders table'; checks has >=1 entry, id unique, check_type is COUNT/CHECKSUM/BUSINESS_INVARIANT only, matches/diff are computed by the system from source_value/target_value (never supplied), e.g. [{id: 'CHK-1', name: 'Total order count', check_type: 'COUNT', source_value: '15000', target_value: '15000'}, {id: 'CHK-2', name: 'Order total-amount checksum', check_type: 'CHECKSUM', source_value: 'a1b2c3...', target_value: 'a1b2c3...'}]. If a check does not actually match, you may attach a resolution explaining why it still counts as handled -- resolved_as_expected: false means 'this difference is NOT fine', overriding even a true matches, e.g. {id: 'CHK-3', name: 'Cancelled order count', check_type: 'COUNT', source_value: '50', target_value: '48', resolution: {resolved_as_expected: true, note: '2 orders were cancelled during the migration window, an expected difference'}}. overall_status: to write 'reconciled', EVERY check must genuinely be satisfied or the system refuses it; when unsure, honestly write 'open'. Optional: version can be left blank."
  database_data.retention_deletion_model:
    name_en: "Retention / Deletion Model"
    abbr: ""
    name_zh: "保留與刪除模型"
    blurb_en: "Defines how long each kind of data is kept and how it's deleted (hard delete, soft delete, anonymize). Use it to plan compliant data retention before you're forced to answer 'how long do we keep this?' under pressure."
    blurb_zh: "定義每種資料要保留多久、怎麼刪除（硬刪除／軟刪除／匿名化）。想規劃合規的資料保留政策時，提早想清楚用。"
    why_en: "When two or more legal/regulatory holds are active on the same data at once (e.g. a litigation hold AND a regulatory retention requirement), someone has to decide which one governs and WHY -- this method makes that decision structurally mandatory the moment more than one hold is active, and just as structurally forbidden to invent when it is not actually needed, so a resolution never gets fabricated for a non-conflict and never gets silently skipped for a real one."
    why_zh: "當同一份資料同時有兩個以上的法律／法規保留要求生效（例如訴訟保留跟法規保留要求同時存在），一定要有人決定哪一個優先、為什麼——這個方法在真的有一個以上保留生效的當下，把這個決定變成結構上強制要有；在根本不需要的時候，也結構上禁止捏造一個，這樣一個解決理由就不會在沒有衝突時被憑空生出來，也不會在真的有衝突時被悄悄跳過。"
    url: "https://en.wikipedia.org/wiki/Data_retention"
    example_zh: "情境：制定客戶交易紀錄的保留與刪除政策。\ndata_class：「客戶交易紀錄」\npurpose：「稅務申報與客訴處理」\nretention_rule：「交易完成後保留 7 年」\ndeletion_trigger：「保留期滿且無生效中的保留要求」\nholds 可以是空陣列，若有給則每筆 hold_type 只能是 legal_hold／regulatory_hold／research_hold／contractual_hold／user_deletion_request 五選一，例如 [{hold_type: \"regulatory_hold\", reason: \"稅務機關要求延長保留 2 年\", active: true}]\ncompliance_evidence：「依當地稅法第 X 條規定」\n重要：如果同時有超過 1 個 hold 是 active: true，conflict_resolution 就一定要填（非空字串）；如果 0 個或 1 個 active，conflict_resolution 就絕對不能填。上面範例只有 1 個 active hold，所以不填 conflict_resolution。\n（選填）schema_ref、deletion_evidence_ref：分別指向對應的既有紀錄，格式要求各自的前綴（ERD-／DEL-）。\n（選填）version：留空即可。"
    example_en: "Scenario: defining a retention and deletion policy for customer transaction records. data_class: 'Customer transaction records'; purpose: 'Tax filing and customer dispute handling'; retention_rule: 'Retain for 7 years after transaction completion'; deletion_trigger: 'Retention period elapsed and no active hold remains'; holds may be an empty list, if given each hold_type is one of legal_hold/regulatory_hold/research_hold/contractual_hold/user_deletion_request, e.g. [{hold_type: 'regulatory_hold', reason: 'Tax authority requires a 2-year extension', active: true}]; compliance_evidence: 'Per local tax code Article X'. Important: if more than 1 hold is active: true, conflict_resolution is required (a non-empty string); with 0 or 1 active, conflict_resolution must be absent entirely. The example above has only 1 active hold, so conflict_resolution is omitted. Optional: schema_ref/deletion_evidence_ref, each pointing to a matching existing record with its own required prefix (ERD-/DEL-). Optional: version can be left blank."
  database_data.schema_compatibility_analysis:
    name_en: "Schema Compatibility Analysis"
    abbr: ""
    name_zh: "Schema 相容性分析"
    blurb_en: "Checks whether a proposed schema change is backward/forward compatible before you ship it. Use it before any ALTER that could break an existing consumer."
    blurb_zh: "在上線前檢查一個 schema 改動是否向前／向後相容。任何可能弄壞現有使用端的 ALTER 之前用。"
    why_en: "Whether a given DDL operation (drop a column, narrow a type, add a NOT NULL without a default) is compatible or breaking is a fixed fact about the operation itself, not a judgment call -- the system classifies each declared change against a disclosed, closed vocabulary and reduces the whole migration to a single worst-of verdict: ONE breaking change anywhere is enough to forbid calling the rollout safe for zero downtime, the same way one weak link breaks a chain."
    why_zh: "一個 DDL 操作（砍掉一個欄位、把型別縮小、加一個沒有預設值的 NOT NULL）到底是相容還是破壞性的，是那個操作本身的固定事實，不是憑感覺判斷——系統會用一套公開、封閉的詞彙表對每個宣告的改動分類，再把整次遷移歸納成一個「最壞情況」的整體結論：只要有一個破壞性改動存在，就不能宣稱這次上線可以零停機，就像一條鏈子只要有一個環節脆弱就整條斷掉一樣。"
    url: "https://docs.confluent.io/platform/current/schema-registry/fundamentals/schema-evolution.html"
    example_zh: "情境：檢查一組即將上線的 schema 改動是否能零停機部署。\nsubject：「訂單表 schema 變更」\nchanges 至少 1 筆，change_type 必須是封閉詞彙表其中之一（例如 add_nullable_column／add_column_with_default／widen_type／relax_not_null_to_nullable／drop_column／narrow_type／tighten_nullable_to_not_null／add_not_null_column_without_default／rename_column／add_unique_constraint 等），target 是這個改動作用的欄位或物件名稱，例如 [{change_type: \"add_nullable_column\", target: \"orders.shipping_note\"}, {change_type: \"drop_column\", target: \"orders.legacy_status\"}]\n（選填）notes：每筆改動可以附加說明，例如 {change_type: \"drop_column\", target: \"orders.legacy_status\", notes: \"確認無任何服務仍在讀取此欄位\"}\nchange_classifications（每個改動被分類成 compatible 或 breaking）跟 overall_verdict（safe_for_zero_downtime 或 requires_coordinated_deploy）都由系統自動計算，不用也不能自己填——上面範例裡 drop_column 一定會被分類成 breaking，所以整體結論一定是 requires_coordinated_deploy，不是自己能決定的。\n（選填）migration_ref：對應的 database_data.expand_contract_migration 紀錄 id（\"ECMIG-\" 開頭）\n（選填）version：留空即可。"
    example_en: "Scenario: checking whether a set of upcoming schema changes can deploy with zero downtime. subject: 'Orders table schema change'; changes has >=1 entry, change_type must be one of the closed vocabulary (e.g. add_nullable_column/add_column_with_default/widen_type/relax_not_null_to_nullable/drop_column/narrow_type/tighten_nullable_to_not_null/add_not_null_column_without_default/rename_column/add_unique_constraint, etc.), target is the column or object the change applies to, e.g. [{change_type: 'add_nullable_column', target: 'orders.shipping_note'}, {change_type: 'drop_column', target: 'orders.legacy_status'}]. Optional: notes per change, e.g. {change_type: 'drop_column', target: 'orders.legacy_status', notes: 'Confirmed no service still reads this column'}. change_classifications (each change classified compatible or breaking) and overall_verdict (safe_for_zero_downtime or requires_coordinated_deploy) are both computed by the system, never supplied -- in the example above, drop_column will always classify as breaking, so the overall verdict is necessarily requires_coordinated_deploy, not something you get to decide yourself. Optional: migration_ref, a matching database_data.expand_contract_migration record id (starting with 'ECMIG-'). Optional: version can be left blank."

  # ---- decision (F16) ----
  decision.ahp:
    name_en: "Analytic Hierarchy Process"
    abbr: "AHP"
    name_zh: "層級分析法"
    blurb_en: "Builds a goal -> criteria hierarchy, uses pairwise comparisons to derive weights, and checks the comparisons are internally consistent. Use it for a rigorous multi-criteria decision where you want the weights themselves to be defensible."
    blurb_zh: "建立目標→準則的層級結構，用兩兩比較推導出權重，並檢查比較是否前後一致。要做嚴謹的多準則決策、連權重本身都要站得住腳時用。"
    why_en: "Directly assigning weights to 5+ criteria at once is cognitively hard and hard to defend; comparing only two at a time (Saaty's 1-9 scale) is much easier, and the built-in consistency ratio catches self-contradictory judgments (e.g. A>B, B>C, but C>A) before they corrupt the result."
    why_zh: "一次要幫 5 個以上準則直接打權重很難、也很難服眾；一次只比較兩個（Saaty 的 1-9 尺度）容易得多，而且內建的一致性比率會抓出自相矛盾的判斷（例如 A>B、B>C，卻 C>A）在它污染結果之前。"
    url: "https://en.wikipedia.org/wiki/Analytic_hierarchy_process"
    example_zh: "情境：在 3 個雲端方案間選擇，準則是成本／效能／穩定度。\ngoal：「選出最適合的雲端供應商」\ncriteria 至少 2 筆且各有唯一 id，例如 [{id: \"cost\"}, {id: \"performance\"}, {id: \"stability\"}]\npairwise_comparisons 需要每對準則剛好 1 筆（3 個準則 = 3 筆），value 用 Saaty 1/9~9 尺度（1=同等重要，9=極重要），例如 [{criterion_a_id: \"cost\", criterion_b_id: \"performance\", value: 3}, {criterion_a_id: \"cost\", criterion_b_id: \"stability\", value: 2}, {criterion_a_id: \"performance\", criterion_b_id: \"stability\", value: 0.5}]\n（選填）options：例如 [{id: \"aws\"}, {id: \"gcp\"}]；有給 options 才需要一併給 option_scores（每個「方案×準則」一筆 0-1 分數），例如 [{option_id: \"aws\", criterion_id: \"cost\", score: 0.6}, ...]——兩者都不給也能算出權重與一致性比率，只是不會有 ranking。\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
    example_en: "Scenario: choosing among 3 cloud providers on cost/performance/stability. goal: 'Pick the best cloud provider'; criteria has >=2 entries with unique ids, e.g. [{id: 'cost'}, {id: 'performance'}, {id: 'stability'}]; pairwise_comparisons needs exactly 1 entry per criterion pair (3 criteria = 3 entries), value on Saaty's 1/9-9 scale, e.g. [{criterion_a_id: 'cost', criterion_b_id: 'performance', value: 3}, {criterion_a_id: 'cost', criterion_b_id: 'stability', value: 2}, {criterion_a_id: 'performance', criterion_b_id: 'stability', value: 0.5}]. Optional: options, e.g. [{id: 'aws'}, {id: 'gcp'}]; if given, option_scores is also needed (one 0-1 score per option x criterion). Without either, weights and the consistency ratio still compute, just no ranking. version/generated_by_method can be left blank, the system supplies defaults."
  decision.decision_tree:
    name_en: "Decision Tree"
    abbr: ""
    name_zh: "決策樹"
    blurb_en: "Branches through decision nodes and chance nodes (with probabilities and payoffs) to surface uncertainty explicitly. Use it for a multi-stage decision where later choices depend on earlier random outcomes."
    blurb_zh: "用決策節點與機率節點（含機率與報酬）分支呈現不確定性。多階段決策、後面選擇取決於前面隨機結果時用。"
    why_en: "A multi-stage decision with uncertain events in between is hard to reason about in your head; drawing it as decision/chance/terminal nodes forces every branch's probability and payoff to be explicit, and the expected value at each node is computed bottom-up, not guessed."
    why_zh: "中間夾雜不確定事件的多階段決策，光用想的很難理清楚；畫成決策/機率/終點節點會逼你把每個分支的機率跟報酬都寫清楚，每個節點的期望值是由下往上算出來的，不是用猜的。"
    url: "https://en.wikipedia.org/wiki/Decision_tree"
    example_zh: "情境：要不要為新產品線投資做市場調查。\ndecision_context：「新產品線是否要先做市場調查」\nroot 是一個 decision 節點，例如：{node_type: \"decision\", label: \"是否調查\", branches: [{label: \"調查\", child: {node_type: \"chance\", label: \"調查結果\", branches: [{label: \"樂觀\", probability: 0.6, child: {node_type: \"terminal\", label: \"樂觀後上市\", payoff: 80}}, {label: \"悲觀\", probability: 0.4, child: {node_type: \"terminal\", label: \"悲觀後上市\", payoff: 20}}]}}, {label: \"不調查直接上市\", child: {node_type: \"terminal\", label: \"直接上市\", payoff: 50}}]}\n規則：decision／chance 節點至少 2 個分支；chance 節點底下同層機率總和必須是 1.0；decision 分支不能有 probability 欄位；expected_value／optimal_branch_label 由系統計算，不用也不能自己填。\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
    example_en: "Scenario: whether to commission market research before launching a new product line. decision_context: 'Whether to research before launching the new line'; root is a decision node, e.g. {node_type: 'decision', label: 'Research or not', branches: [{label: 'Research', child: {node_type: 'chance', label: 'Research outcome', branches: [{label: 'Optimistic', probability: 0.6, child: {node_type: 'terminal', label: 'Launch after optimistic result', payoff: 80}}, {label: 'Pessimistic', probability: 0.4, child: {node_type: 'terminal', label: 'Launch after pessimistic result', payoff: 20}}]}}, {label: 'Launch directly', child: {node_type: 'terminal', label: 'Direct launch', payoff: 50}}]}. Rules: decision/chance nodes need >=2 branches; a chance node's own branch probabilities must sum to 1.0; a decision branch never carries probability; expected_value/optimal_branch_label are computed by the system, never supplied. version/generated_by_method can be left blank, the system supplies defaults."
  decision.eisenhower_matrix:
    name_en: "Eisenhower Matrix"
    abbr: ""
    name_zh: "艾森豪矩陣"
    blurb_en: "Scores each task by urgency x importance against your own declared thresholds, sorting it into Do First / Schedule / Delegate / Eliminate. Use it for a fast first-pass triage of a task list before deeper prioritization."
    blurb_zh: "用「緊急程度 x 重要程度」對照你自訂的門檻，把每項任務分到「立即做／排程／委派／刪除」四象限。想快速對一份任務清單做第一輪篩選時用。"
    why_en: "Urgency and importance are two dimensions people habitually collapse into one gut feeling; scoring them separately and crossing them is what reveals that a loud, urgent task can still be low-importance and belong on someone else's plate, not an instinctive top priority."
    why_zh: "緊急程度跟重要程度是兩個常被憑直覺混在一起判斷的維度——分開評分再交叉比對，才會發現「很吵很急」的事其實不重要，該委派出去，而不是本能地優先處理最大聲的事。"
    url: "https://www.eisenhower.me/eisenhower-matrix/"
    example_zh: "情境：整理本週待辦事項。\nsubject：「本週工作清單」\nurgency_scale：{min: 0, max: 10}\nimportance_scale：{min: 0, max: 10}\nurgency_threshold：5\nimportance_threshold：5\ntasks 至少 1 筆，每筆需要唯一 id/label/urgency/importance，例如 {id: \"T1\", label: \"修復上線中的錯誤\", urgency: 9, importance: 9}（urgency、importance 都要落在上面宣告的 scale 範圍內；quadrant 由系統自動計算，不用也不能自己填）。\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
    example_en: "Scenario: triaging this week's to-do list. subject: 'This week's work list'; urgency_scale: {min: 0, max: 10}; importance_scale: {min: 0, max: 10}; urgency_threshold: 5; importance_threshold: 5; tasks has >=1 entry, each needing a unique id/label/urgency/importance, e.g. {id: 'T1', label: 'Fix the production bug', urgency: 9, importance: 9} (urgency/importance must fall within the declared scale; quadrant is computed by the system, never supplied). Optional: version/generated_by_method can be left blank, the system supplies defaults."
  decision.expected_value:
    name_en: "Expected Value"
    abbr: ""
    name_zh: "期望值"
    blurb_en: "Sums probability x outcome across an exhaustive set of states to get one flat expected number. Use it as the simple baseline before reaching for a full Decision Tree or Monte Carlo."
    blurb_zh: "把機率乘以結果加總，算出單一期望值。要在動用完整決策樹或蒙地卡羅之前，先算一個簡單基準時用。"
    why_en: "Forces every possible future state and its probability to be listed explicitly (and to sum to 1.0 -- no unaccounted-for possibility) before multiplying and summing, turning a vague 'I think it's worth it' into one specific, checkable number."
    why_zh: "強迫把每一種可能的未來狀態跟機率都明講出來（而且要加總等於 1.0，不能有漏掉的可能性），再相乘加總——把「我覺得值得」這種模糊感覺變成一個具體、可以檢查的數字。"
    url: "https://en.wikipedia.org/wiki/Expected_value"
    example_zh: "情境：估算一個新功能上線的期望收益。\ndecision_subject：「新功能上線的預期收益」\nstates 至少 2 筆，機率總和必須是 1.0，每筆需要唯一 id，例如 [{id: \"S1\", label: \"大幅成長\", probability: 0.3, outcome_value: 100}, {id: \"S2\", label: \"持平\", probability: 0.5, outcome_value: 10}, {id: \"S3\", label: \"下滑\", probability: 0.2, outcome_value: -20}]（outcome_value 可以是負數，代表損失）\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
    example_en: "Scenario: estimating the expected payoff of launching a new feature. decision_subject: 'Expected payoff of launching the new feature'; states has >=2 entries whose probabilities sum to 1.0, each with a unique id, e.g. [{id: 'S1', label: 'Strong growth', probability: 0.3, outcome_value: 100}, {id: 'S2', label: 'Flat', probability: 0.5, outcome_value: 10}, {id: 'S3', label: 'Decline', probability: 0.2, outcome_value: -20}] (outcome_value may be negative, representing a loss). version/generated_by_method can be left blank, the system supplies defaults."
  decision.ice:
    name_en: "Impact x Confidence x Ease Scoring"
    abbr: "ICE"
    name_zh: "ICE 評分法"
    blurb_en: "Scores each option on one unified scale across Impact, Confidence, and Ease for a quick rough ranking. Use it to fast-sort a big backlog before a deeper analysis."
    blurb_zh: "用同一個尺度為每個選項打影響力、信心度、容易度三個分數，快速粗排優先序。想快速排序一大堆候選項目時用。"
    why_en: "No caller-chosen weights, no cross-item normalization -- exactly 3 fixed dimensions scored 1-10 each, averaged. That fixed simplicity is the point: it is fast enough to run on a whole backlog in one sitting, at the cost of being rougher than AHP/MCDA."
    why_zh: "沒有自訂權重、也不用跟其他項目比較——就是固定 3 個維度、各打 1-10 分、取平均。這種固定的簡單正是重點：快到可以一次跑完整個待辦清單，代價是比 AHP/MCDA 粗略。"
    url: "https://www.productplan.com/glossary/ice-scoring-model/"
    example_zh: "情境：從一堆新功能點子中快速篩出優先項目。\ncontext：「Q3 新功能點子初篩」\nitems 至少 1 筆，每筆需要唯一 id/label，impact/confidence/ease 各是 1-10 的數字，例如 [{id: \"F1\", label: \"加入單一登入\", impact: 8, confidence: 6, ease: 4}, {id: \"F2\", label: \"換按鈕顏色\", impact: 2, confidence: 9, ease: 9}]（ice_score 由系統自動計算為三者平均，不用也不能自己填）\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
    example_en: "Scenario: quickly triaging a pile of new feature ideas. context: 'Q3 new-feature idea triage'; items has >=1 entry with a unique id/label, impact/confidence/ease each 1-10, e.g. [{id: 'F1', label: 'Add SSO', impact: 8, confidence: 6, ease: 4}, {id: 'F2', label: 'Change button color', impact: 2, confidence: 9, ease: 9}] (ice_score is computed by the system as their average, never supplied). version/generated_by_method can be left blank, the system supplies defaults."
  decision.impact_effort:
    name_en: "Impact-Effort Matrix"
    abbr: ""
    name_zh: "影響力-努力矩陣"
    blurb_en: "Plots options on two fixed axes (impact, effort) into quadrants (quick win / big bet / fill-in / money pit). Use it for a fast visual prioritization with just two dimensions."
    blurb_zh: "用兩個固定軸（影響力、努力程度）把選項分到四個象限（快贏／大賭注／填補／坑）。只需要兩個維度、想快速視覺化排優先序時用。"
    why_en: "Only 2 axes means the whole picture fits on one chart at a glance -- good enough to separate 'quick win' from 'money pit' fast, though the tool itself warns it is a first-pass screen only, not a decision-maker for high-stakes calls."
    why_zh: "只有兩個軸，整張圖一眼就看完——足以快速分出「快贏」跟「坑」，但工具本身就提醒這只是第一輪篩選，高風險決策不能只靠這張圖。"
    url: "https://untools.co/impact-effort-matrix/"
    example_zh: "情境：篩選這一季一堆改善點子該先做哪個。\nsubject：「本季改善點子初篩」\nimpact_scale／effort_scale：{min: 0, max: 10}\nimpact_threshold／effort_threshold：5\nideas 至少 1 筆，每筆需要唯一 id/label，impact/effort 都要落在上面宣告的 scale 內，例如 {id: \"I1\", label: \"加自動化測試\", impact: 8, effort: 3}（quadrant 由系統自動計算，不用也不能自己填）\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
    example_en: "Scenario: triaging this quarter's pile of improvement ideas. subject: 'This quarter's improvement idea triage'; impact_scale/effort_scale: {min: 0, max: 10}; impact_threshold/effort_threshold: 5; ideas has >=1 entry with a unique id/label, impact/effort within the declared scale, e.g. {id: 'I1', label: 'Add automated tests', impact: 8, effort: 3} (quadrant is computed by the system, never supplied). version/generated_by_method can be left blank, the system supplies defaults."
  decision.kano:
    name_en: "Kano Model"
    abbr: ""
    name_zh: "卡諾模型"
    blurb_en: "Classifies a feature as Basic, Performance, or Delighter based on its satisfaction-curve shape, not just vote counts. Use it to decide which features actually matter to users, not just which got the most votes."
    blurb_zh: "依滿意度曲線形狀（不只是票數）把功能分類成基本／表現／驚喜型。想判斷哪些功能真的對使用者重要時用。"
    why_en: "Asking customers only 'do you want this' produces a flat vote count that can't tell a must-have from a delighter; asking BOTH how they'd feel if the feature were present AND absent, then looking up that pair in Kano's own evaluation table, reveals the actual shape of the satisfaction curve."
    why_zh: "只問「你想不想要這個功能」得到的只是平的票數，分不出「沒有會抓狂」跟「有了會驚喜」；同時問「有這功能你感覺如何」跟「沒有這功能你感覺如何」，再對照 Kano 的評估表，才能看出滿意度曲線真正的形狀。"
    url: "https://en.wikipedia.org/wiki/Kano_model"
    example_zh: "情境：評估「深色模式」這個功能對使用者的重要性。\nsubject：「深色模式功能評估」\nfeatures 至少 1 筆，每筆需要唯一 id/label，functional_response（有這功能你感覺如何）跟 dysfunctional_response（沒有這功能你感覺如何）都必須是 LIKE／MUST_BE／NEUTRAL／LIVE_WITH／DISLIKE 其中之一，例如 {id: \"F1\", label: \"深色模式\", functional_response: \"LIKE\", dysfunctional_response: \"NEUTRAL\"}（category 由系統自動判斷，不用也不能自己填）\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
    example_en: "Scenario: assessing how much a 'dark mode' feature actually matters to users. subject: 'Dark mode feature assessment'; features has >=1 entry with a unique id/label; functional_response (how you'd feel WITH the feature) and dysfunctional_response (how you'd feel WITHOUT it) must each be one of LIKE/MUST_BE/NEUTRAL/LIVE_WITH/DISLIKE, e.g. {id: 'F1', label: 'Dark mode', functional_response: 'LIKE', dysfunctional_response: 'NEUTRAL'} (category is determined by the system, never supplied). version/generated_by_method can be left blank, the system supplies defaults."
  decision.mcda:
    name_en: "Multi-Criteria Decision Analysis"
    abbr: "MCDA"
    name_zh: "多準則決策分析"
    blurb_en: "Scores options against N caller-defined weighted criteria (Options -> Criteria -> Weights -> Normalize -> Score -> Sensitivity). Use it whenever you have several options and several things you care about, and need a defensible ranked recommendation."
    blurb_zh: "用多個自訂加權準則為選項打分（選項→準則→權重→正規化→評分→敏感度）。有多個選項、多個評分標準時，用它算出有依據的排名建議。"
    why_en: "Criteria in the real world come in different units (cost in dollars, speed in seconds) that can't be summed directly; normalizing each criterion to a common 0-1 scale first, then applying caller-declared weights, makes 'weighted total score' a meaningful, comparable number instead of adding apples to oranges."
    why_zh: "現實中的準則單位常常不同（成本用美元、速度用秒），不能直接加總；先把每個準則正規化到同一個 0-1 尺度，再套用自訂權重，「加權總分」才是有意義、可比較的數字，而不是拿蘋果加橘子。"
    url: "https://en.wikipedia.org/wiki/Multiple-criteria_decision_analysis"
    example_zh: "情境：在兩個供應商之間依成本與交期做選擇。\noptions 至少 2 筆且各有唯一 id，例如 [{id: \"vendor_a\"}, {id: \"vendor_b\"}]\ncriteria 至少 1 筆，每筆需要 id/label/direction（maximize 或 minimize），例如 [{id: \"cost\", label: \"成本\", direction: \"minimize\"}, {id: \"leadtime\", label: \"交期\", direction: \"minimize\"}]\nraw_scores 對每個「方案×準則」給一筆真實數值（單位不拘，正規化由系統處理），例如 {option_id: \"vendor_a\", criterion_id: \"cost\", raw_value: 12000}\nweights 對每個準則給權重、總和必須是 1.0，例如 [{criterion_id: \"cost\", weight: 0.6}, {criterion_id: \"leadtime\", weight: 0.4}]\nsensitivity_notes 是必填非空字串，說明排名對權重選擇有多敏感，例如「若成本權重降到 0.4，vendor_b 會反超」。\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
    example_en: "Scenario: choosing between two vendors on cost and lead time. options has >=2 entries with unique ids, e.g. [{id: 'vendor_a'}, {id: 'vendor_b'}]; criteria has >=1 entry needing id/label/direction (maximize or minimize), e.g. [{id: 'cost', label: 'Cost', direction: 'minimize'}, {id: 'leadtime', label: 'Lead time', direction: 'minimize'}]; raw_scores gives one real value per option x criterion (any unit, the system normalizes), e.g. {option_id: 'vendor_a', criterion_id: 'cost', raw_value: 12000}; weights gives one weight per criterion summing to 1.0, e.g. [{criterion_id: 'cost', weight: 0.6}, {criterion_id: 'leadtime', weight: 0.4}]; sensitivity_notes is a required non-empty string disclosing how sensitive the ranking is to the chosen weights. version/generated_by_method can be left blank, the system supplies defaults."
  decision.moscow:
    name_en: "MoSCoW Method"
    abbr: "MoSCoW"
    name_zh: "MoSCoW 優先分級"
    blurb_en: "Buckets many items into Must/Should/Could/Won't to build an explicit not-doing list. Use it to lock a release's scope."
    blurb_zh: "把一堆項目分到「必須／應該／可以／不做」四類，建立明確的「不做清單」。要鎖定一個版本的範圍時用。"
    why_en: "A backlog with no explicit 'won't' list quietly grows scope forever; forcing every WON'T item to carry a stated reason turns silent scope creep into an explicit, defensible decision anyone can review later."
    why_zh: "沒有明確「不做清單」的待辦事項會不知不覺一直長大；強制每個「不做」項目都要寫理由，把悄悄的範圍蔓延變成一個明確、之後任何人都能檢視的決定。"
    url: "https://en.wikipedia.org/wiki/MoSCoW_method"
    example_zh: "情境：鎖定下一版的功能範圍。\nrelease_scope：「v2.0 版範圍鎖定」\nitems 至少 1 筆，每筆需要唯一 id/description/bucket（MUST／SHOULD／COULD／WONT 其中之一）跟 provenance，例如 {id: \"IT1\", description: \"支援單一登入\", bucket: \"MUST\", provenance: {epistemic_type: \"DECISION\", authorship_state: \"HUMAN_APPROVED\", locked: null}}\n（bucket 是 WONT 時 reason 必填）例如 {id: \"IT2\", description: \"支援離線模式\", bucket: \"WONT\", reason: \"這版時程不夠，下一版再評估\", provenance: {epistemic_type: \"DECISION\", authorship_state: \"HUMAN_APPROVED\", locked: null}}\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
    example_en: "Scenario: locking the scope for the next release. release_scope: 'v2.0 scope lock'; items has >=1 entry with a unique id/description/bucket (one of MUST/SHOULD/COULD/WONT) and provenance, e.g. {id: 'IT1', description: 'Support SSO', bucket: 'MUST', provenance: {epistemic_type: 'DECISION', authorship_state: 'HUMAN_APPROVED', locked: null}}. A WONT-bucket item requires a reason, e.g. {id: 'IT2', description: 'Support offline mode', bucket: 'WONT', reason: 'Not enough time this release, revisit next one', provenance: {epistemic_type: 'DECISION', authorship_state: 'HUMAN_APPROVED', locked: null}}. version/generated_by_method can be left blank, the system supplies defaults."
  decision.pareto_frontier:
    name_en: "Pareto Frontier"
    abbr: ""
    name_zh: "柏拉圖前緣"
    blurb_en: "Finds the set of options where no option is strictly better on every objective at once (multi-objective dominance) -- different from a single-dimension 80/20 cut. Use it when you're optimizing 2+ competing objectives at the same time."
    blurb_zh: "找出「沒有其他選項在每個目標上都更好」的一組方案（多目標優勢分析）——跟單一維度的 80/20 不同。同時要優化兩個以上互相拉扯的目標時用。"
    why_en: "Collapsing 2+ competing objectives into one weighted score (like MCDA does) hides the trade-off; removing only the options that are strictly worse on every objective at once (dominated) keeps every genuine trade-off visible in the surviving set, instead of pretending one number can decide it."
    why_zh: "把兩個以上互相拉扯的目標壓成一個加權總分（像 MCDA 那樣）會把取捨藏起來；只拿掉「在每個目標上都被別的選項打敗」（被支配）的選項，讓真正的取捨留在剩下的方案裡看得見，而不是假裝一個數字就能決定一切。"
    url: "https://en.wikipedia.org/wiki/Pareto_front"
    example_zh: "情境：在成本與效能之間找出真正值得考慮的方案，不要太早壓成單一總分。\nsubject：「伺服器規格選型」\nobjectives 至少 2 筆，每筆需要唯一 id/label/direction（maximize 或 minimize），例如 [{id: \"cost\", label: \"成本\", direction: \"minimize\"}, {id: \"performance\", label: \"效能\", direction: \"maximize\"}]\noptions 至少 2 筆且各有唯一 id/label，例如 [{id: \"spec_a\", label: \"規格 A\"}, {id: \"spec_b\", label: \"規格 B\"}, {id: \"spec_c\", label: \"規格 C\"}]\noption_values 對每個「方案×目標」給一筆真實數值，例如 {option_id: \"spec_a\", objective_id: \"cost\", value: 500}（status/dominated_by 由系統自動計算，不用也不能自己填）\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
    example_en: "Scenario: finding genuinely worth-considering options between cost and performance, without collapsing to a single score too early. subject: 'Server spec selection'; objectives has >=2 entries with a unique id/label/direction (maximize or minimize), e.g. [{id: 'cost', label: 'Cost', direction: 'minimize'}, {id: 'performance', label: 'Performance', direction: 'maximize'}]; options has >=2 entries with unique id/label, e.g. [{id: 'spec_a', label: 'Spec A'}, {id: 'spec_b', label: 'Spec B'}, {id: 'spec_c', label: 'Spec C'}]; option_values gives one real value per option x objective, e.g. {option_id: 'spec_a', objective_id: 'cost', value: 500} (status/dominated_by are computed by the system, never supplied). version/generated_by_method can be left blank, the system supplies defaults."
  decision.rice:
    name_en: "RICE Prioritization"
    abbr: "RICE"
    name_zh: "RICE 優先排序法"
    blurb_en: "Scores Reach x Impact x Confidence / Effort to prioritize a product backlog. Use it when effort really should divide down the score, not just subtract from it."
    blurb_zh: "用「觸及人數×影響力×信心度÷努力程度」為產品待辦事項排序。想讓「努力程度」用除的方式真正拉低分數時用。"
    why_en: "Reach is required to carry a real unit (e.g. 'users/quarter'), not a bare number -- an idea's score is meaningless for cross-idea comparison without knowing what the number of people actually counts. Effort divides the score (not subtracts), so a huge-effort idea gets punished proportionally harder, matching how real capacity constraints bite."
    why_zh: "Reach 一定要附真實單位（例如「使用者/季」），不能是裸數字——不知道這個數字算的是什麼，這個分數對其他點子來說毫無意義。Effort 是用除的（不是用減的），讓超花力氣的點子被按比例扣得更重，貼近真實產能限制的感覺。"
    url: "https://www.intercom.com/blog/rice-simple-prioritization-for-product-managers/"
    example_zh: "情境：幫一個新功能點子打 RICE 分數。\nidea：{id: \"IDEA1\", label: \"加入批次匯出\"}\nreach：{value: 500, unit: \"users/quarter\"}（一定要附單位，裸數字不合法）\nimpact：2（常見尺度：3=巨大、2=高、1=中、0.5=低、0.25=極小）\nconfidence：0.8（0-1 之間，代表信心度）\neffort：3（人月或類似單位，數字必須大於 0）\n（rice_score 由系統自動計算為 reach.value × impact × confidence ÷ effort，不用也不能自己填）\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
    example_en: "Scenario: scoring a new feature idea with RICE. idea: {id: 'IDEA1', label: 'Add batch export'}; reach: {value: 500, unit: 'users/quarter'} (a unit is required, a bare number is invalid); impact: 2 (common scale: 3=massive, 2=high, 1=medium, 0.5=low, 0.25=minimal); confidence: 0.8 (0-1); effort: 3 (person-months or similar, must be > 0). rice_score is computed by the system as reach.value x impact x confidence / effort, never supplied. version/generated_by_method can be left blank, the system supplies defaults."
  decision.topsis:
    name_en: "Technique for Order of Preference by Similarity to Ideal Solution"
    abbr: "TOPSIS"
    name_zh: "逼近理想解排序法"
    blurb_en: "Ranks options by distance to the computed ideal and anti-ideal points, not by a weighted sum. Use it as a genuinely different ranking lens from MCDA when a weighted-sum score doesn't feel right."
    blurb_zh: "用選項跟理想解／最差解的距離排序，不是用加權總分。想要跟 MCDA 加權總分不同的排序邏輯時用。"
    why_en: "A weighted-sum score (MCDA's approach) can let one bad criterion hide behind several good ones; ranking instead by geometric distance to a computed 'best possible' point and a computed 'worst possible' point rewards options that are consistently good across criteria, not just high on average."
    why_zh: "加權總分（MCDA 的做法）可能讓一個很差的準則被其他幾個好準則蓋過去；改用跟「理論最佳點」和「理論最差點」的幾何距離排序，獎勵的是「每個準則都穩定不差」的選項，而不只是平均起來高。"
    url: "https://en.wikipedia.org/wiki/TOPSIS"
    example_zh: "情境：在 3 個廠商之間依成本與品質排序。\noptions 至少 2 筆且各有唯一 id，例如 [{id: \"v1\"}, {id: \"v2\"}, {id: \"v3\"}]\ncriteria 至少 1 筆，每筆需要 id/label/direction（maximize 或 minimize），例如 [{id: \"cost\", label: \"成本\", direction: \"minimize\"}, {id: \"quality\", label: \"品質\", direction: \"maximize\"}]\nraw_scores 對每個「方案×準則」給一筆真實數值，例如 {option_id: \"v1\", criterion_id: \"cost\", raw_value: 8000}\nweights 對每個準則給權重、總和必須是 1.0，例如 [{criterion_id: \"cost\", weight: 0.5}, {criterion_id: \"quality\", weight: 0.5}]（normalized_scores／ideal_points／ranking 由系統自動計算，不用也不能自己填）\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
    example_en: "Scenario: ranking 3 vendors on cost and quality. options has >=2 entries with unique ids, e.g. [{id: 'v1'}, {id: 'v2'}, {id: 'v3'}]; criteria has >=1 entry with id/label/direction (maximize or minimize), e.g. [{id: 'cost', label: 'Cost', direction: 'minimize'}, {id: 'quality', label: 'Quality', direction: 'maximize'}]; raw_scores gives one real value per option x criterion, e.g. {option_id: 'v1', criterion_id: 'cost', raw_value: 8000}; weights gives one weight per criterion summing to 1.0, e.g. [{criterion_id: 'cost', weight: 0.5}, {criterion_id: 'quality', weight: 0.5}] (normalized_scores/ideal_points/ranking are computed by the system, never supplied). version/generated_by_method can be left blank, the system supplies defaults."
  decision.weighted_decision_matrix:
    name_en: "Weighted Decision Matrix"
    abbr: ""
    name_zh: "加權決策矩陣"
    blurb_en: "Scores options x criteria x weights on one common declared scale (no per-criterion unit normalization, simpler than MCDA). Use it for a straightforward weighted comparison when all criteria can share one rating scale."
    blurb_zh: "用選項×準則×權重、在同一個評分尺度上打分（不像 MCDA 需要逐項正規化，更簡單）。所有準則能共用同一個評分尺度時，用它做直接的加權比較。"
    why_en: "When every criterion can honestly be rated on the same scale (e.g. 1-5), skipping MCDA's per-criterion unit normalization removes a step without losing rigor -- but it also means every option must be scored on every criterion (no missing cells), since there is no normalization step left to make a gap visible."
    why_zh: "當每個準則都能誠實地用同一個尺度打分（例如 1-5），跳過 MCDA 那套逐項正規化不會犧牲嚴謹度——但代價是每個方案在每個準則上都必須有分數（不能空格），因為沒有正規化步驟能讓漏掉的格子顯現出來。"
    url: "https://en.wikipedia.org/wiki/Decision-matrix_method"
    example_zh: "情境：在 3 個辦公室地點之間依租金、交通、空間打分。\noptions 至少 2 筆且各有唯一 id，例如 [{id: \"site_a\"}, {id: \"site_b\"}, {id: \"site_c\"}]\ncriteria 至少 1 筆且各有唯一 id/label（不含 direction，方向由評分習慣決定），例如 [{id: \"rent\", label: \"租金\"}, {id: \"transit\", label: \"交通\"}]\nscale_min／scale_max：1／5（所有分數都要落在這個共同尺度內）\nscores 必須每個「方案×準則」都恰好一筆，例如 {option_id: \"site_a\", criterion_id: \"rent\", value: 4}（3 個方案×2 個準則＝需要剛好 6 筆）\nweights 對每個準則給權重、總和必須是 1.0，例如 [{criterion_id: \"rent\", weight: 0.6}, {criterion_id: \"transit\", weight: 0.4}]\nsensitivity_notes 是必填非空字串，例如「租金權重若降到 0.4，site_b 會勝出」。\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
    example_en: "Scenario: scoring 3 office locations on rent, transit, and space. options has >=2 entries with unique ids, e.g. [{id: 'site_a'}, {id: 'site_b'}, {id: 'site_c'}]; criteria has >=1 entry with a unique id/label (no direction field -- direction is your own scoring convention), e.g. [{id: 'rent', label: 'Rent'}, {id: 'transit', label: 'Transit'}]; scale_min/scale_max: 1/5 (every score must fall in this shared scale); scores must have exactly one entry per option x criterion, e.g. {option_id: 'site_a', criterion_id: 'rent', value: 4} (3 options x 2 criteria = exactly 6 entries needed); weights gives one weight per criterion summing to 1.0, e.g. [{criterion_id: 'rent', weight: 0.6}, {criterion_id: 'transit', weight: 0.4}]; sensitivity_notes is a required non-empty string, e.g. 'If rent's weight drops to 0.4, site_b wins instead.' version/generated_by_method can be left blank, the system supplies defaults."
  decision.wsjf:
    name_en: "Weighted Shortest Job First"
    abbr: "WSJF"
    name_zh: "加權最短工作優先法"
    blurb_en: "Divides Cost of Delay by Job Size to prioritize a portfolio by what's most expensive to postpone relative to how long it takes. Use it in a SAFe/Agile portfolio to sequence work by delay cost, not just effort."
    blurb_zh: "用「延遲成本÷工作量」排序一個投資組合，凸顯「拖越久越貴」的項目。在敏捷投資組合裡想依延遲成本（不只是工作量）排序時用。"
    why_en: "Cost of Delay is broken into 3 inspectable sub-factors (business value, time criticality, risk reduction/opportunity enablement) instead of one opaque number -- that breakdown is what actually lets someone see WHY a job is urgent, not just trust a single unexplained score. Dividing by job size (not multiplying) means a big-but-not-urgent job doesn't jump the queue just because it's large."
    why_zh: "延遲成本被拆成 3 個看得見的子因子（商業價值、時間急迫性、風險降低/機會促成），不是一個看不懂的黑箱數字——這個拆解才能真正讓人看出「為什麼這件事急」，而不是只信任一個沒有解釋的分數。用除的（不是乘的）代表一件大但不急的工作不會只因為規模大就插隊。"
    url: "https://framework.scaledagile.com/wsjf/"
    example_zh: "情境：在敏捷投資組合裡幫一項工作算 WSJF 分數。\njob：{id: \"J1\", label: \"重構付款流程\"}\ncost_of_delay：{business_value: 8, time_criticality: 5, risk_reduction_opportunity_enablement: 3}（三個子因子都是 ≥0 的數字，總和會自動算出 cost_of_delay_total）\njob_size：4（必須大於 0，代表相對工作量）\n（wsjf_score 由系統自動計算為 cost_of_delay_total ÷ job_size，不用也不能自己填）\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
    example_en: "Scenario: scoring a piece of work with WSJF in an Agile portfolio. job: {id: 'J1', label: 'Refactor the payment flow'}; cost_of_delay: {business_value: 8, time_criticality: 5, risk_reduction_opportunity_enablement: 3} (all 3 sub-factors are numbers >=0; their sum is computed automatically as cost_of_delay_total); job_size: 4 (must be > 0, the relative size of the job). wsjf_score is computed by the system as cost_of_delay_total / job_size, never supplied. version/generated_by_method can be left blank, the system supplies defaults."

  # ---- decomposition (F02) ----
  decomposition.fast:
    name_en: "Function Analysis System Technique"
    abbr: "FAST"
    name_zh: "功能分析系統技術"
    blurb_en: "Builds a function chain by asking 'why' (toward the higher-order function) and 'how' (toward the lower-order function). Use it to find redundant functions and alternative solutions in value engineering."
    blurb_zh: "往左問 Why、往右問 How，建出功能鏈。想找出冗餘功能與替代方案時用（價值工程）。"
    why_en: "exactly one function must have why_ref: null (the unique root), and following every function's why_ref chain must terminate there without looping back on itself -- a function that is its own transitive ancestor, or a diagram with zero or multiple roots, is refused. This mechanizes the FAST 'why left, how right' logic: every function must trace back to exactly one higher-order purpose, never a circular justification."
    why_zh: "一定要剛好有 1 個功能的 why_ref 是 null（唯一的根），而且每個功能沿著 why_ref 往上追，最後一定要真的走到那個根、不能繞回自己——一個會變成自己祖先的功能、或是根本沒有根／有超過 1 個根的圖，都會被拒絕。這把 FAST「往左問 Why、往右問 How」的邏輯變成機械檢查：每個功能都要能追溯回唯一一個更高層的目的，不能是一個自我循環的理由。"
    url: "https://www.valueanalysis.ca/fast.php"
    example_zh: "情境：分析「自動門鎖」這個產品的功能鏈。\nfunctions 至少 1 筆、id 要唯一，剛好要有 1 筆的 why_ref 是 null（最高層目的），其餘每筆的 why_ref 都要指向同一份清單裡真實存在的另一個 id，例如 [{id: \"F1\", name: \"保障居家安全\", why_ref: null}, {id: \"F2\", name: \"防止未授權進入\", why_ref: \"F1\"}, {id: \"F3\", name: \"辨識授權使用者\", why_ref: \"F2\"}]\n（重點）如果把 F1 的 why_ref 改成指向 F3（形成 F1→F3→F2→F1 的循環），會被拒絕建立——一個功能不能是自己的間接上層目的。同樣地，如果兩筆都填 why_ref: null（兩個根），也會被拒絕。"
    example_en: "Scenario: analyze the function chain of a 'smart door lock' product. functions has >=1 entry with a unique id, EXACTLY 1 entry has why_ref: null (the top-level purpose), and every other entry's why_ref must resolve to a real id in the same list, e.g. [{id: 'F1', name: 'Protect home security', why_ref: null}, {id: 'F2', name: 'Prevent unauthorized entry', why_ref: 'F1'}, {id: 'F3', name: 'Identify authorized users', why_ref: 'F2'}]. Key point: if F1's why_ref were changed to point at F3 (forming a cycle F1->F3->F2->F1), the record would be refused at construction -- a function can't be its own indirect higher-order purpose. Likewise, having two entries both with why_ref: null (two roots) would also be refused."
  decomposition.functional_decomposition:
    name_en: "Functional Decomposition"
    abbr: ""
    name_zh: "功能分解"
    blurb_en: "Breaks a system into a top function -> subfunctions -> interfaces tree. Use it to strengthen module boundaries and clarify responsibility."
    blurb_zh: "按功能拆解系統：頂層功能→子功能→介面。想強化模組邊界與責任劃分時用。"
    why_en: "every interface's from_function_ref and to_function_ref must resolve to a real function node id that actually exists somewhere in the tree -- an interface connecting to a function that was never decomposed is a dangling reference, refused rather than silently stored. Combined with whole-tree id uniqueness, this keeps 'strengthen module and responsibility boundaries' (Atlas's own benefit) grounded in a decomposition that's actually internally consistent."
    why_zh: "每一個 interface 的 from_function_ref／to_function_ref 都一定要指向樹裡真實存在的功能節點 id——一個連到根本沒被拆解過的功能的介面，是懸空引用，會被拒絕，不會悄悄存起來。搭配整棵樹的 id 唯一性檢查，這樣「強化模組與責任邊界」（Atlas 自己講的效益）才會建立在一個真的內部一致的拆解結果上。"
    url: "https://www.baeldung.com/cs/functional-decomposition"
    example_zh: "情境：把「訂單處理系統」按功能拆解，並標出模組間的介面。\ntop_function 是一棵遞迴樹，每個節點是 {id, function_name, children}，id 在整棵樹裡都要唯一，例如 {id: \"F0\", function_name: \"處理訂單\", children: [{id: \"F1\", function_name: \"驗證庫存\", children: []}, {id: \"F2\", function_name: \"處理付款\", children: []}]}\ninterfaces（選填）每筆的 from_function_ref／to_function_ref 都要指向樹裡真實存在的 id，例如 [{id: \"I1\", from_function_ref: \"F1\", to_function_ref: \"F2\", description: \"庫存確認後才觸發付款\"}]\n（重點）如果 interfaces 裡的 to_function_ref 填了一個沒在 top_function 樹裡出現過的 id（例如 \"F99\"），會被拒絕建立——介面不能連到一個根本沒被拆解出來的功能。"
    example_en: "Scenario: decompose an 'order processing system' by function and mark the interfaces between modules. top_function is a recursive tree of {id, function_name, children} nodes, id unique across the whole tree, e.g. {id: 'F0', function_name: 'Process order', children: [{id: 'F1', function_name: 'Verify inventory', children: []}, {id: 'F2', function_name: 'Process payment', children: []}]}; interfaces (optional) has entries whose from_function_ref/to_function_ref must resolve to a real id in the tree, e.g. [{id: 'I1', from_function_ref: 'F1', to_function_ref: 'F2', description: 'Payment triggers only after inventory is confirmed'}]. Key point: if an interfaces entry's to_function_ref named an id that never appears in top_function (e.g. 'F99'), the record would be refused at construction -- an interface can't connect to a function that was never actually decomposed."
  decomposition.hierarchical_task_analysis:
    name_en: "Hierarchical Task Analysis"
    abbr: ""
    name_zh: "階層式任務分析"
    blurb_en: "Breaks a human task into a Goal -> Task -> Subtask -> Plan tree. Use it to find where operational burden or error is likely to occur."
    blurb_zh: "把人類工作拆解成目標→任務→子任務→計畫的樹狀結構。想找出操作負擔或容易出錯的環節時用。"
    why_en: "plan is required whenever a node has 2 or more children, and must be null whenever it has 0 or 1 -- both directions enforced, not just one. A multi-step node with no stated execution order hides real ambiguity about sequencing, and a plan attached to a leaf or single-child node has nothing left to sequence, so either direction being violated is refused, not silently accepted as harmless extra detail."
    why_zh: "只要一個節點有 2 個以上子節點，就一定要填 plan；只要是 0 個或 1 個子節點，plan 就一定要是 null——兩個方向都會被檢查，不是只查一邊。一個有多個步驟卻沒說明執行順序的節點，隱藏了真正的操作歧義；一個葉節點或只有 1 個子節點的節點卻填了 plan，代表根本沒有東西可以排序。兩種情況都會被拒絕，不會被當成無傷大雅的多餘細節放行。"
    url: "https://ixdf.org/literature/topics/hierarchical-task-analysis"
    example_zh: "情境：拆解「線上結帳」這個使用者任務。\ngoal 是一棵遞迴樹，每個節點是 {id, task_name, plan, children}，例如 {id: \"G\", task_name: \"完成線上結帳\", plan: \"先 1，若庫存不足則改做 2\", children: [{id: \"T1\", task_name: \"確認購物車內容\", plan: null, children: []}, {id: \"T2\", task_name: \"改用替代商品\", plan: null, children: []}]}\n（重點）根節點 G 有 2 個子節點，所以 plan 一定要填（上面填了）；T1／T2 都只有 0 個子節點（葉節點），plan 一定要是 null。如果 T1 也填了一句 plan（例如「先做 A 再做 B」），會被拒絕建立——葉節點沒有任何東西需要排序。如果 G 的 plan 拿掉變成 null，也會被拒絕——2 個子節點卻不說明執行順序，隱藏了真正的操作歧義。"
    example_en: "Scenario: decompose the user task 'complete online checkout'. goal is a recursive tree of {id, task_name, plan, children} nodes, e.g. {id: 'G', task_name: 'Complete online checkout', plan: 'Do 1 first; if out of stock, do 2 instead', children: [{id: 'T1', task_name: 'Confirm cart contents', plan: None, children: []}, {id: 'T2', task_name: 'Switch to a substitute item', plan: None, children: []}]}. Key point: root node G has 2 children, so plan is required (and given above); T1/T2 each have 0 children (leaves), so plan must be null. If T1 also had a plan (e.g. 'do A then B'), the record would be refused at construction -- a leaf has nothing to sequence. If G's plan were removed (null), it would also be refused -- 2 children with no stated execution order hides real ambiguity."
  decomposition.issue_tree:
    name_en: "Issue Tree"
    abbr: ""
    name_zh: "議題樹"
    blurb_en: "Breaks a big question into branches at open recursion depth, checking nothing's been missed. Use it to build an analysis plan for a broad, unstructured problem."
    blurb_zh: "把大問題拆成可分析的分支，深度不設限，檢查有沒有遺漏。要為一個龐大、還沒結構化的問題建立分析計畫時用。"
    why_en: "every node id anywhere in the whole tree -- root and every descendant, at any depth -- must be globally unique, not just unique among siblings. A duplicate id would make 'the specific branch named X' ambiguous, defeating Atlas's own benefit that research scope, ownership, and evidence collection can be unrolled directly along the tree -- that only works if every branch is unambiguously addressable by its own id."
    why_zh: "整棵樹裡每一個節點的 id（根節點跟所有子孫節點，不管在哪一層）都一定要是全域唯一，不只是在兄弟節點之間唯一。一個重複的 id 會讓「特定叫 X 的那個分支」變得模糊不清，違背 Atlas 自己講的效益——研究範圍、責任分工、證據蒐集都要能直接沿著這棵樹展開，而這只有在每個分支都能靠自己的 id 被明確定位時才成立。"
    url: "https://en.wikipedia.org/wiki/Issue_tree"
    example_zh: "情境：拆解「是否進入新市場？」這個主問題。\nroot 是一棵遞迴樹，每個節點是 {id, question, children}，id 要在整棵樹裡全域唯一，例如 {id: \"Q0\", question: \"是否進入新市場？\", children: [{id: \"Q1\", question: \"市場吸引力如何？\", children: []}, {id: \"Q2\", question: \"公司能力是否足夠？\", children: []}]}\n（重點）如果把 Q2 底下再加一個子問題、id 又設成 \"Q1\"（跟另一個分支撞名），會被拒絕建立——就算兩者分屬不同分支，只要 id 重複，就沒辦法明確指名「Q1 到底是哪一個問題」，違反這棵樹要能逐支明確定位的前提。"
    example_en: "Scenario: decompose the core question 'should we enter a new market?'. root is a recursive tree of {id, question, children} nodes, id must be globally unique across the whole tree, e.g. {id: 'Q0', question: 'Should we enter a new market?', children: [{id: 'Q1', question: 'How attractive is the market?', children: []}, {id: 'Q2', question: 'Is the company capable enough?', children: []}]}. Key point: if a sub-question were added under Q2 and given the id 'Q1' (colliding with the other branch), the record would be refused at construction -- even though they're in different branches, a duplicate id makes it impossible to say unambiguously which question 'Q1' actually refers to, violating the tree's own requirement that every branch be addressable."
  decomposition.logic_tree:
    name_en: "Logic Tree"
    abbr: ""
    name_zh: "邏輯樹"
    blurb_en: "Classifies by a single, declared-once classification rule before expanding the tree, preventing mixed dimensions. Use it when you keep accidentally mixing classification criteria partway through a breakdown."
    blurb_zh: "先定好單一分類規則，再展開樹狀結構，防止維度混亂。發現自己拆到一半分類標準跑掉時用。"
    why_en: "at every single level of the tree -- not just the root's own children, but every descendant's own children too -- no two siblings under the same parent may share the same category_value. Two siblings sharing a value under one classification rule means the classification didn't actually partition anything at that level, which is exactly the 'dimension confusion' Atlas names as the failure this method exists to prevent."
    why_zh: "樹裡的每一層——不只是根節點自己的子節點，每一個子孫節點自己的子節點也一樣——同一個父節點底下的兄弟節點都不能共用同一個 category_value。如果同一條分類規則下有兩個兄弟共用同一個值，代表那一層根本沒有真的分類到任何東西，這正是 Atlas 講的「維度混亂」——這個方法存在的目的就是要防止這件事。"
    url: "https://en.wikipedia.org/wiki/Taxonomy_(general)"
    example_zh: "情境：先定好「依銷售通路分類」這條規則，再展開產品線的邏輯樹。\nclassification_rule：「依銷售通路分類」（Atlas 要求先定規則再展開）\nroot 是一棵遞迴樹，每個節點是 {id, category_value, children}，同一個父節點底下的兄弟節點 category_value 不能重複，例如 {id: \"N0\", category_value: \"全部產品\", children: [{id: \"N1\", category_value: \"線上通路\", children: []}, {id: \"N2\", category_value: \"實體通路\", children: []}]}\n（重點）如果在 N0 底下再加一個節點、category_value 也填「線上通路」（跟 N1 撞值），會被拒絕建立——同一層裡兩個兄弟節點用同一個分類值，代表這一層根本沒有真的分出兩類，正是 Atlas 要防止的「維度混亂」。注意：不同層、不同父節點底下的節點可以合法重複使用同一個 category_value（例如另一個分支底下也有一個「線上通路」），只有同一個父節點下的兄弟不能重複。"
    example_en: "Scenario: declare the rule 'classify by sales channel' first, then expand a product-line logic tree. classification_rule: 'Classify by sales channel' (Atlas requires declaring the rule before expanding); root is a recursive tree of {id, category_value, children} nodes, siblings under the same parent must not repeat category_value, e.g. {id: 'N0', category_value: 'All products', children: [{id: 'N1', category_value: 'Online channel', children: []}, {id: 'N2', category_value: 'Retail channel', children: []}]}. Key point: if another node were added under N0 with category_value also set to 'Online channel' (colliding with N1), the record would be refused at construction -- two siblings sharing one classification value means that level didn't actually partition into two categories, exactly the 'dimension confusion' Atlas names as the failure to prevent. Note: nodes under a DIFFERENT parent may legitimately reuse the same category_value (e.g. another branch may also have an 'Online channel' node) -- only siblings under the same parent are restricted."
  decomposition.mece:
    name_en: "MECE Check"
    abbr: "MECE"
    name_zh: "MECE 檢查"
    blurb_en: "Checks that a set of categories is Mutually Exclusive and Collectively Exhaustive -- finds overlaps and omissions. Use it as a sanity check on any breakdown/classification you've built."
    blurb_zh: "檢查一組分類是否互斥且完整，找出重疊與遺漏。對任何已經拆好的分類結構做健檢時用。"
    why_en: "overlaps, gaps, unknown_members, and is_mece are never caller-supplied -- all four are always computed fresh from the real set arithmetic between universe_item_ids and every category's members, and is_mece: False is NOT refused (Atlas's own caution: not every real system can be perfectly MECE). Only structural malformation is refused; the check itself always tells the truth about whether the classification is actually mutually exclusive and collectively exhaustive, rather than letting a caller assert a clean result that doesn't hold."
    why_zh: "overlaps、gaps、unknown_members、is_mece 這四個欄位都不是呼叫端能直接給值的——永遠是從 universe_item_ids 跟每個分類的成員之間真實的集合運算算出來的，而且 is_mece: False 不會被拒絕（Atlas 自己講的但書：不是所有現實系統都能完美 MECE）。只有結構本身有問題才會被拒絕；這個檢查本身永遠誠實地告訴你這個分類到底有沒有真的做到互斥且完整，不會讓呼叫端隨便宣稱一個乾淨的結果。"
    url: "https://en.wikipedia.org/wiki/MECE_principle"
    example_zh: "情境：檢查「客戶分群」這個分類是否互斥且完整。\nuniverse_item_ids 至少 1 筆、不重複，例如 [\"customer-1\", \"customer-2\", \"customer-3\"]\ncategories 至少 1 筆、category_name 不重複，例如 [{category_name: \"新客戶\", member_item_ids: [\"customer-1\"]}, {category_name: \"回頭客\", member_item_ids: [\"customer-1\", \"customer-2\"]}]\n（重點）overlaps／gaps／unknown_members／is_mece 都不用也不能自己填，系統會自動算出來：上面這個例子 customer-1 同時出現在兩類（overlaps=[\"customer-1\"]），customer-3 完全沒被分到任何一類（gaps=[\"customer-3\"]），所以 is_mece 會自動算成 false——這是合法的結果，不會被拒絕建立，因為 MECE 檢查本身就是要誠實回報分類有沒有問題，不是要求分類一定要完美。"
    example_en: "Scenario: check whether a 'customer segmentation' classification is mutually exclusive and collectively exhaustive. universe_item_ids has >=1 unique entry, e.g. ['customer-1', 'customer-2', 'customer-3']; categories has >=1 entry with unique category_name, e.g. [{category_name: 'New customers', member_item_ids: ['customer-1']}, {category_name: 'Repeat customers', member_item_ids: ['customer-1', 'customer-2']}]. Key point: overlaps/gaps/unknown_members/is_mece are never supplied directly -- the system computes them automatically: in this example customer-1 appears in both categories (overlaps=['customer-1']), and customer-3 is in neither category (gaps=['customer-3']), so is_mece is automatically false. This is a legal outcome, not refused at construction -- the whole point of a MECE check is to honestly report whether the classification has a problem, not to require a perfect classification."
  decomposition.objective_tree:
    name_en: "Objective Tree"
    abbr: ""
    name_zh: "目標樹"
    blurb_en: "Converts a Problem Tree into positive objectives, one negative state at a time. Use it right after a Problem Tree, to turn diagnosis into a solution-design starting point."
    blurb_zh: "把 Problem Tree 的負面狀態逐項轉成正向目標。做完問題樹後，想直接連到方案設計時用。"
    why_en: "the set of objectives' source_item_ref values must equal EXACTLY the set of source_problem_items ids -- every negative item converted by exactly one objective, no duplicates, no gaps, no dangling reference. On top of that, an objective's positive_statement can't be character-for-character identical to the negative statement it's supposedly converting -- a 'conversion' that just copies the negative text hasn't actually transformed anything into positive."
    why_zh: "objectives 裡 source_item_ref 的集合，一定要跟 source_problem_items 的 id 集合完全一樣——每一個負面項目都要剛好被 1 個目標轉換，不能重複、不能遺漏、不能懸空引用。在此之上，一個目標的 positive_statement 不能跟它要轉換的那個負面陳述逐字相同——一個只是把負面文字複製過來的「轉換」，根本沒有真的把它轉成正向。"
    url: "https://www.thegrassrootscollective.org/problem-objective-tree-development"
    example_zh: "情境：把「顧客流失率高」這個問題樹的項目轉成目標樹。\nsource_problem_items 至少 1 筆、id 要唯一，polarity 只能是 CAUSE／EFFECT，例如 [{id: \"P1\", statement: \"客服回應時間過長\", polarity: \"CAUSE\"}, {id: \"P2\", statement: \"顧客滿意度下降\", polarity: \"EFFECT\"}]\nobjectives 每筆的 source_item_ref 都要指向上面真實存在的項目，而且 P1／P2 各自剛好要被 1 個目標覆蓋，positive_statement 不能跟來源的 statement 逐字相同，例如 [{id: \"O1\", source_item_ref: \"P1\", positive_statement: \"客服回應時間縮短到 30 分鐘內\"}, {id: \"O2\", source_item_ref: \"P2\", positive_statement: \"顧客滿意度提升\"}]\n（重點）如果 O2 的 positive_statement 填成跟 P2 一模一樣的「顧客滿意度下降」，會被拒絕建立——這不是轉換，只是把負面陳述複製過來。如果 P1 完全沒有任何目標覆蓋它，也會被拒絕——每個負面項目都要被逐項轉換。"
    example_en: "Scenario: convert items from a 'high customer churn' problem tree into an objective tree. source_problem_items has >=1 entry with a unique id, polarity is CAUSE or EFFECT, e.g. [{id: 'P1', statement: 'Support response time is too slow', polarity: 'CAUSE'}, {id: 'P2', statement: 'Customer satisfaction is declining', polarity: 'EFFECT'}]; every objectives entry's source_item_ref must resolve to a real item above, and P1/P2 must each be covered by exactly one objective, positive_statement must not be character-for-character identical to the source statement, e.g. [{id: 'O1', source_item_ref: 'P1', positive_statement: 'Support response time reduced to under 30 minutes'}, {id: 'O2', source_item_ref: 'P2', positive_statement: 'Customer satisfaction improves'}]. Key point: if O2's positive_statement were the exact same text as P2 ('Customer satisfaction is declining'), the record would be refused at construction -- that's not a conversion, just a copy of the negative statement. If P1 had no objective covering it at all, it would also be refused -- every negative item must be converted, item by item."
  decomposition.problem_tree:
    name_en: "Problem Tree"
    abbr: ""
    name_zh: "問題樹"
    blurb_en: "Structures causes (below) -> core problem (center) -> effects (above), cleanly separating symptoms from causes. Use it before jumping to solutions, to make sure you're solving the real problem."
    blurb_zh: "原因在下、核心問題在中、效果在上，把問題結構化排開，避免把症狀當成原因。跳去想解法之前，先確認問題本身抓對了。"
    why_en: "causes ids and effects ids must be disjoint sets -- and unique within each of their own lists too. If the same id appeared in both causes and effects, the tree wouldn't have actually separated anything, defeating Atlas's own stated benefit of this method (separate symptoms from causes); a caller can't have it both ways by reusing one id to mean both a cause and an effect."
    why_zh: "causes 的 id 集合跟 effects 的 id 集合一定要完全不重疊——而且各自在自己的清單裡也要唯一。如果同一個 id 同時出現在 causes 跟 effects 裡，代表這棵樹根本沒有真的分開任何東西，違背了 Atlas 講的這個方法的核心效益（把症狀跟原因分開）；呼叫端不能一魚兩吃，用同一個 id 同時代表一個原因又代表一個後果。"
    url: "https://odi.org/en/publications/planning-tools-problem-tree-analysis/"
    example_zh: "情境：分析「都市空氣品質惡化」這個核心問題的原因與後果。\ncore_problem：「都市空氣品質惡化」\ncauses 至少 1 筆、id 在 causes 內要唯一，每筆都要有 provenance，例如 [{id: \"C1\", statement: \"工業排放缺乏有效監管\", provenance: {...}}]\neffects 至少 1 筆、id 在 effects 內要唯一，且不能跟 causes 的任何 id 重複，例如 [{id: \"E1\", statement: \"呼吸道疾病就診率上升\", provenance: {...}}]\n（重點）如果把 effects 裡的某一筆 id 也設成 \"C1\"（跟 causes 撞名），會被拒絕建立——這代表同一個 id 同時被當成原因又當成後果，樹根本沒有真的把症狀跟原因分開。"
    example_en: "Scenario: analyze the causes and effects of the core problem 'urban air quality deterioration'. core_problem: 'Urban air quality deterioration'; causes has >=1 entry with a unique id within causes, each with provenance, e.g. [{id: 'C1', statement: 'Industrial emissions lack effective regulation', provenance: {...}}]; effects has >=1 entry with a unique id within effects, and none may collide with any causes id, e.g. [{id: 'E1', statement: 'Respiratory illness clinic visits are rising', provenance: {...}}]. Key point: if an effects entry were also given the id 'C1' (colliding with causes), the record would be refused at construction -- that means the same id is being used as both a cause and an effect, meaning the tree never actually separated symptoms from causes."
  decomposition.wbs:
    name_en: "Work Breakdown Structure"
    abbr: "WBS"
    name_zh: "工作分解結構"
    blurb_en: "Breaks a deliverable into work packages with an owner and estimate each. Use it to plan a project so nothing falls through the cracks."
    blurb_zh: "把交付項目拆成工作包，每包指定負責人與估算。規劃專案、降低遺漏時用。"
    why_en: "a leaf node (no children) must carry both a non-null owner and a non-null estimate_hours, while a non-leaf node must carry neither -- a parent claiming its own separate estimate would double-count against its own children's real work. total_estimate_hours is never a caller-supplied field either; at every node it's always the sum of estimate_hours across every leaf descendant, mechanizing the real external WBS '100% rule' that a parent's total work equals exactly the sum of its parts."
    why_zh: "一個葉節點（沒有子節點）一定要同時有非空的 owner 跟 estimate_hours，而一個非葉節點則兩者都一定要是 null——如果一個父節點自己也宣稱一個獨立的估算工時，就會跟底下子節點的真實工作量重複計算。total_estimate_hours 也不是呼叫端能直接給值的欄位——每個節點的值永遠是它所有葉節點後代的 estimate_hours 加總，這把 WBS 真正的外部標準「100% 原則」（父層的總工作量剛好等於各部分加總）變成機械檢查。"
    url: "https://www.pmi.org/blog/work-breakdown-structure"
    example_zh: "情境：把「辦一場產品發表會」拆成工作分解結構。\ndeliverable 是一棵遞迴樹，每個節點是 {id, name, owner, estimate_hours, children}，例如 {id: \"D0\", name: \"辦一場產品發表會\", owner: null, estimate_hours: null, children: [{id: \"WP1\", name: \"場地布置\", owner: \"小美\", estimate_hours: 8, children: []}, {id: \"WP2\", name: \"邀請媒體\", owner: \"小華\", estimate_hours: 5, children: []}]}\n（重點）D0 是非葉節點（有子節點），所以 owner／estimate_hours 都一定要是 null（上面正確）；WP1／WP2 是葉節點，owner／estimate_hours 都一定要非空（上面正確）。如果 D0 自己也填了 estimate_hours: 20，會被拒絕建立——父節點不能自己宣稱一個跟子節點工作量分開計算的估計，那會重複計算。total_estimate_hours 不用也不能自己填，系統會自動算出來：D0 的值會自動算成 13（8+5），這正是 WBS 的 100% 原則。"
    example_en: "Scenario: break down 'run a product launch event' into a work breakdown structure. deliverable is a recursive tree of {id, name, owner, estimate_hours, children} nodes, e.g. {id: 'D0', name: 'Run a product launch event', owner: None, estimate_hours: None, children: [{id: 'WP1', name: 'Venue setup', owner: 'Amy', estimate_hours: 8, children: []}, {id: 'WP2', name: 'Media outreach', owner: 'Howard', estimate_hours: 5, children: []}]}. Key point: D0 is a non-leaf node (has children), so owner/estimate_hours must both be null (correct above); WP1/WP2 are leaves, so owner/estimate_hours must both be non-null (correct above). If D0 also supplied estimate_hours: 20, the record would be refused at construction -- a parent can't claim its own separate estimate on top of its children's real work, which would double-count. total_estimate_hours is never supplied directly -- the system computes it automatically: D0's value is automatically 13 (8+5), exactly the WBS 100% rule."

  # ---- delivery (F22 PM/Delivery/Governance) ----
  delivery.change_risk_matrix:
    name_en: "Change Risk Matrix"
    abbr: ""
    name_zh: "變更風險矩陣"
    blurb_en: "Mechanically derives a LOW/MEDIUM/HIGH risk tier for a production change from 5 named factors (scope, reversibility, data, traffic, security). Use it before any production change to decide how much extra control it needs."
    blurb_zh: "從範圍、可逆性、資料、流量、安全性五個因子機械式算出一個正式環境變更的風險等級（低／中／高）。任何上線變更前，用它決定要不要加控管。"
    why_en: "risk_tier is never accepted as a parameter -- it's derived as the worst-of-5 across the declared factors, so a caller can never assert a rosier tier than the facts support. required_controls must then be a superset of that derived tier's minimum control baseline -- the 3 baselines are nested by construction (each is the previous one plus more), so Atlas's own 'higher risk automatically increases controls' holds structurally, not by convention."
    why_zh: "risk_tier 從來不是呼叫端能填的參數——永遠是從宣告的 5 個因子裡「最壞的那一個」推導出來的，呼叫端不能宣稱一個比事實更樂觀的風險等級。required_controls 接著一定要是這個推導出來的等級對應的最低控制措施集合的超集——3 個基準是用結構方式疊加的（每一級都是前一級再加更多），所以 Atlas 講的「高風險自動增加控制」是結構上的事實，不是靠人自覺遵守的慣例。"
    url: "https://en.wikipedia.org/wiki/Change_control"
    example_zh: "情境：評估「資料庫主鍵型別從 int 改成 bigint」這個正式環境變更的風險。\nchange_description：「資料庫主鍵型別從 int 改成 bigint」\nfactors：{scope:\"HIGH\", reversibility:\"MEDIUM\", data_sensitivity:\"HIGH\", traffic_impact:\"MEDIUM\", security_impact:\"LOW\"}\nrisk_tier 不用也不能自己填，系統會自動算成「HIGH」（5 個因子裡最嚴重的是 HIGH）。\nrequired_controls（HIGH 等級最低要求）：[\"peer_review\", \"staging_validation\", \"rollback_plan\", \"change_advisory_board_signoff\", \"canary_or_blue_green_deploy\", \"post_deploy_verification\"]\n（重點）如果 required_controls 漏掉「change_advisory_board_signoff」，會被拒絕建立——risk_tier 是 HIGH 時，控制措施一定要涵蓋 HIGH 等級的全部最低要求，少一個都不行。"
    example_en: "Scenario: assessing the risk of a production change: 'change the database primary key type from int to bigint'. change_description: 'change the database primary key type from int to bigint'; factors: {scope:'HIGH', reversibility:'MEDIUM', data_sensitivity:'HIGH', traffic_impact:'MEDIUM', security_impact:'LOW'}. risk_tier is never supplied directly -- the system computes it as 'HIGH' automatically (the worst of the 5 factors is HIGH). required_controls (HIGH tier's minimum): ['peer_review', 'staging_validation', 'rollback_plan', 'change_advisory_board_signoff', 'canary_or_blue_green_deploy', 'post_deploy_verification']. Key point: if required_controls omitted 'change_advisory_board_signoff', the record would be refused at construction -- when risk_tier is HIGH, the controls must cover every one of HIGH's own minimum requirements, missing even one is not allowed."
  delivery.critical_path_method:
    name_en: "Critical Path Method"
    abbr: ""
    name_zh: "要徑法"
    blurb_en: "Finds the task chain that actually determines the shortest possible project duration, via a real forward/backward pass. Use it to know exactly which tasks can never slip without delaying the whole project."
    blurb_zh: "用前推／後推法找出真正決定最短工期的任務鏈。想知道哪些任務絕對不能延、一延就拖累整個專案時用。"
    why_en: "the builder accepts ONLY raw task_id/duration/depends_on input -- every computed field (earliest_start, latest_finish, slack, critical_path, project_duration) is this method's own output, never a caller-supplied value. A caller can never assert which tasks are 'critical'; the critical_path is derived via a genuine forward/backward pass, and every dependency must resolve to a real declared task or the computation refuses outright."
    why_zh: "建構函式只接受最原始的 task_id／duration／depends_on 輸入——每個計算出來的欄位（最早開始／最晚結束／浮時／critical_path／project_duration）都只是這個方法自己的輸出，呼叫端永遠不能自己填。呼叫端不能自己宣稱哪些任務是「關鍵」；critical_path 是透過真正的正推／反推排程算出來的，而且每個依賴都一定要對應到真實宣告的任務，否則整個計算會直接拒絕。"
    url: "https://www.projectmanager.com/guides/critical-path-method"
    example_zh: "情境：找出四個任務中真正決定工期的關鍵路徑。\ntasks：[{task_id:\"T1\", duration:5, depends_on:[]}, {task_id:\"T2\", duration:3, depends_on:[\"T1\"]}, {task_id:\"T3\", duration:8, depends_on:[\"T1\"]}, {task_id:\"T4\", duration:2, depends_on:[\"T2\", \"T3\"]}]\ncritical_path／project_duration／每個任務的 earliest_start 等欄位都不用也不能自己填，系統會自動跑正推／反推算出：project_duration=15，critical_path=[\"T1\", \"T3\", \"T4\"]（T2 有 5 天浮時，不在關鍵路徑上）。\n（重點）如果某個任務的 depends_on 填了一個不存在的 task_id（例如 \"T99\"），會被拒絕建立——每個依賴都要對應到真實宣告的任務，不能指向空氣。"
    example_en: "Scenario: finding the true schedule-determining critical path across 4 tasks. tasks: [{task_id:'T1', duration:5, depends_on:[]}, {task_id:'T2', duration:3, depends_on:['T1']}, {task_id:'T3', duration:8, depends_on:['T1']}, {task_id:'T4', duration:2, depends_on:['T2', 'T3']}]. critical_path/project_duration/every task's earliest_start etc. are never supplied directly -- the system runs a real forward/backward pass automatically: project_duration=15, critical_path=['T1', 'T3', 'T4'] (T2 has 5 days of slack and isn't on the critical path). Key point: if a task's depends_on named a task_id that doesn't exist (e.g. 'T99'), the record would be refused at construction -- every dependency must resolve to a genuinely declared task, not point at nothing."
  delivery.decision_log:
    name_en: "Decision Log"
    abbr: ""
    name_zh: "決策日誌"
    blurb_en: "Preserves each important decision's context, decision, evidence, and owner so it isn't re-litigated later. Use it whenever a team keeps re-debating a decision that was already made."
    blurb_zh: "保存每個重要決策的脈絡、決定、證據、負責人，避免以後重複爭論。團隊老是重新吵一個已經決定過的事情時用。"
    why_en: "revisit.mode must be exactly SCHEDULED (with a non-empty trigger) or NO_REVISIT_PLANNED (with trigger exactly None) -- silence on revisit is the exact 'is this permanent or provisional?' ambiguity this field exists to remove. evidence must also be a non-empty list -- a logged decision with no stated evidence defeats this method's own 'avoid re-litigating' benefit, since nobody can tell whether re-arguing it would surface new information."
    why_zh: "revisit.mode 一定要剛好是 SCHEDULED（附非空的 trigger）或 NO_REVISIT_PLANNED（trigger 一定要是 None）——對「要不要重審」保持沉默，正是這個欄位要消除的「這是永久決定還是暫時決定？」的模糊地帶。evidence 也一定要是非空清單——一個沒有附上證據的決策紀錄，會直接破壞這個方法「避免重複爭論」的效益，因為沒有人能判斷重新爭論是否會浮現新資訊。"
    url: "https://www.projectmanager.com/blog/project-decision-log"
    example_zh: "情境：記錄「改用第三方搜尋服務」這個已經做出的決策。\ncontext：「是否繼續投資自建搜尋引擎還是改用第三方服務」\ndecision：「改用第三方搜尋服務(Algolia)」\nevidence：[\"自建團隊過去 6 個月只完成 40% 預定功能\", \"第三方服務報價比自建人力成本低 60%\"]\nowner：「技術長」\nrevisit：{mode:\"SCHEDULED\", trigger:\"若 Algolia 年費調漲超過 50% 則重新評估\"}\n（重點）如果 revisit 填成 {mode:\"NO_REVISIT_PLANNED\", trigger:\"某個條件\"}（宣告不重審卻又留了一個觸發條件），會被拒絕建立——mode 是 NO_REVISIT_PLANNED 時 trigger 一定要是 null，不能兩者都留。"
    example_en: "Scenario: recording an already-made decision to switch to a third-party search service. context: 'whether to keep investing in an in-house search engine or switch to a third-party service'; decision: 'switch to a third-party search service (Algolia)'; evidence: ['the in-house team completed only 40% of planned features over the last 6 months', \"the third-party quote is 60% cheaper than the in-house team's labor cost\"]; owner: 'CTO'; revisit: {mode:'SCHEDULED', trigger:\"re-evaluate if Algolia's annual fee rises more than 50%\"}. Key point: if revisit were {mode:'NO_REVISIT_PLANNED', trigger:'some condition'} (declaring no revisit while still leaving a trigger condition), the record would be refused at construction -- when mode is NO_REVISIT_PLANNED, trigger must be null, the two can't both be present."
  delivery.definition_of_done:
    name_en: "Definition of Done"
    abbr: ""
    name_zh: "完成的定義"
    blurb_en: "Requires all 12 named dimensions (functional, tests, security, privacy, data, observability, capacity, docs, migration, rollback, recovery, evidence) before something can be called done. Use it to stop 'it runs, so it's done' from slipping into production."
    blurb_zh: "要求 12 個面向（功能、測試、安全、隱私、資料、可觀測性、容量、文件、遷移、回滾、復原、證據）都過了才能宣告完成。防止「能跑就算完成」溜進正式環境時用。"
    why_en: "dimensions must declare EXACTLY the 12 §12.42 dimensions, no missing and no extra -- a record silently missing even one (e.g. never declaring Rollback) is exactly the functional-only anti-pattern this method exists to prevent. overall_status is never caller-supplied either -- it's mechanically recomputed as DONE only when every dimension is MET or NOT_APPLICABLE, so a record can never claim DONE with even one dimension left NOT_MET."
    why_zh: "dimensions 一定要剛好宣告 §12.42 的全部 12 個面向，不能少一個也不能多一個——一個悄悄漏掉某個面向（例如從沒宣告 Rollback）的記錄，正是這個方法要防止的「只看功能完成」反樣式。overall_status 也從來不是呼叫端能自己填的——永遠是機械算出來的：只有全部 12 個面向都是 MET 或 NOT_APPLICABLE 才會是 DONE，一筆記錄不可能在還有任何一個面向是 NOT_MET 時宣稱 DONE。"
    url: "https://www.leadingagile.com/2017/02/definition-of-done/"
    example_zh: "情境：判斷「使用者匯出報表功能 v2」是否真正完成。\ntarget：「使用者匯出報表功能 v2」\ndimensions（12 個面向都要填，僅列部分）：{functional:{status:\"MET\", note:\"已通過驗收測試\"}, tests:{status:\"MET\", note:\"單元測試覆蓋率 92%\"}, security:{status:\"MET\", note:\"已過資安掃描無高風險項目\"}, privacy:{status:\"NOT_APPLICABLE\", note:\"此功能不涉及個資\"}, rollback:{status:\"MET\", note:\"可透過 feature flag 立即關閉\"}, ...（其餘 7 個面向比照）}\noverall_status 不用也不能自己填，系統會自動算成「DONE」（全部 12 個面向都是 MET 或 NOT_APPLICABLE）。\n（重點）如果 dimensions 漏填「rollback」這個鍵，會被拒絕建立——12 個面向缺一個都不行，這正是防止「只證明功能能跑就算完成」的機制。"
    example_en: "Scenario: judging whether 'user report export feature v2' is genuinely done. target: 'user report export feature v2'; dimensions (all 12 required, showing a subset): {functional:{status:'MET', note:'passed acceptance testing'}, tests:{status:'MET', note:'92% unit test coverage'}, security:{status:'MET', note:'passed security scan with no high-risk findings'}, privacy:{status:'NOT_APPLICABLE', note:'feature does not touch personal data'}, rollback:{status:'MET', note:'can be disabled instantly via a feature flag'}, ...(the other 7 dimensions follow the same shape)}. overall_status is never supplied directly -- the system computes it as 'DONE' automatically (all 12 dimensions are MET or NOT_APPLICABLE). Key point: if dimensions omitted the 'rollback' key, the record would be refused at construction -- missing even one of the 12 dimensions isn't allowed, which is exactly the mechanism that prevents declaring something done just because it runs."
  delivery.dependency_graph:
    name_en: "Dependency Graph"
    abbr: ""
    name_zh: "任務相依圖"
    blurb_en: "Models task/deliverable/milestone dependencies explicitly, with owner+fallback required for every critical edge. Use it to reduce hidden blockers in a project plan."
    blurb_zh: "明確建模任務／交付物／里程碑之間的相依，每個關鍵相依都要有負責人與備援方案。降低專案裡隱性 blocker 時用。"
    why_en: "every edge with critical: true must carry a non-empty owner AND a non-empty fallback -- Atlas's own arrow sequence reads 'critical edges->owner->fallback', and a critical edge with no owner or no fallback IS exactly the hidden blocker this method's own benefit column names. A label alone is not a mitigation."
    why_zh: "每個標記 critical:true 的邊，都一定要有非空的 owner 跟非空的 fallback——Atlas 自己的箭頭順序寫的是「關鍵邊→負責人→備援方案」，一個沒有負責人或沒有備援方案的關鍵邊，正是這個方法效益欄講的「隱性 blocker」。只貼一個標籤不算緩解措施。"
    url: "https://www.atlassian.com/team-playbook/plays/dependency-mapping"
    example_zh: "情境：明確標出「付款 API 串接」對「第三方支付商核准」的依賴關係。\nnodes：[{node_id:\"N1\", node_type:\"task\", description:\"完成付款 API 串接\"}, {node_id:\"N2\", node_type:\"milestone\", description:\"第三方支付商核准上線\"}]\nedges：[{from_node_id:\"N2\", to_node_id:\"N1\", critical:true, owner:\"技術長\", fallback:\"若核准延遲，先用備援支付商上線\"}]\n（重點）如果這條邊標記 critical:true，卻把 owner 填成空字串，會被拒絕建立——一個沒有負責人的關鍵依賴，只是一個標籤，不是真正的緩解機制。"
    example_en: "Scenario: explicitly marking the dependency of 'payment API integration' on 'third-party payment provider approval'. nodes: [{node_id:'N1', node_type:'task', description:'complete payment API integration'}, {node_id:'N2', node_type:'milestone', description:'third-party payment provider approves go-live'}]; edges: [{from_node_id:'N2', to_node_id:'N1', critical:true, owner:'CTO', fallback:'launch with a backup payment provider if approval is delayed'}]. Key point: if this edge were marked critical:true but owner were an empty string, the record would be refused at construction -- a critical dependency with no owner is just a label, not a real mitigation."
  delivery.gantt_chart:
    name_en: "Gantt Chart"
    abbr: ""
    name_zh: "甘特圖"
    blurb_en: "Manages project tasks and timeline (unique tasks, ISO dates, dependencies) -- good for scheduling concrete action plans and phased goals."
    blurb_zh: "專案任務與時間進度管理工具。規劃具體行動時程表，適用目標分期計畫與行為追蹤。"
    why_en: "a task must start strictly AFTER each of its dependencies' end date (finish-to-start, inclusive days) -- a schedule violating this is drawn, not planned. Every depends_on id must also resolve to another declared task, with no self-dependency and no duplicate -- a dependency cycle becomes structurally impossible as a direct consequence of the strict finish-to-start rule, not a separately-checked case."
    why_zh: "一個任務一定要在它每個依賴的結束日期之後才能開始（完成才能開始，日期採含頭含尾計算）——違反這條規則的排程只是畫出來的，不是真的規劃過的。每個 depends_on 也一定要對應到另一個真實宣告的任務，不能自己依賴自己、也不能重複——依賴循環在嚴格的「完成才能開始」規則下結構上就不可能發生，不需要另外檢查。"
    url: "https://en.wikipedia.org/wiki/Gantt_chart"
    example_zh: "情境：規劃辦公室搬遷計畫的時程。\nproject：「辦公室搬遷計畫」\ntasks：[{id:\"T1\", name:\"簽新辦公室租約\", start:\"2026-10-01\", end:\"2026-10-05\", depends_on:[]}, {id:\"T2\", name:\"裝修新辦公室\", start:\"2026-10-06\", end:\"2026-10-20\", depends_on:[\"T1\"]}]\n（重點）如果 T2 的 start 填成 \"2026-10-05\"（跟 T1 的 end 同一天，不是嚴格在之後），會被拒絕建立——完成才能開始的規則要求依賴任務結束後才能開始，同一天不算真的完成才開始。"
    example_en: "Scenario: scheduling an office relocation plan. project: 'office relocation plan'; tasks: [{id:'T1', name:'sign the new office lease', start:'2026-10-01', end:'2026-10-05', depends_on:[]}, {id:'T2', name:'renovate the new office', start:'2026-10-06', end:'2026-10-20', depends_on:['T1']}]. Key point: if T2's start were '2026-10-05' (the same day as T1's end, not strictly after), the record would be refused at construction -- finish-to-start requires the dependent task to start after its dependency actually finishes, not on the same day."
  delivery.outcome_roadmap:
    name_en: "Outcome Roadmap"
    abbr: ""
    name_zh: "成果導向路線圖"
    blurb_en: "Structures a roadmap by outcomes rather than features (themes -> outcomes -> bets -> evidence), every bet traceable to a real outcome. Use it to keep a roadmap strategically flexible instead of a fixed feature list."
    blurb_zh: "用「成果」而不是「功能」排路線圖（主題→成果→賭注→證據），每個賭注都要能追溯到真實成果。想讓路線圖保持策略彈性、不被功能清單綁死時用。"
    why_en: "every bets[].outcome_id must resolve to a declared outcomes[] entry -- Atlas's own benefit is 'keep strategic flexibility', and a bet with no real outcome parent IS exactly the feature-driven roadmap entry this method's own 'outcomes, not features' pipeline order exists to prevent from sneaking in under a different label. themes and outcomes each require >=1 entry, but bets may legally be empty -- a roadmap may declare outcomes with no committed bets yet, which is the more strategically flexible state, not a malformed one."
    why_zh: "每個 bets[].outcome_id 都一定要對應到已宣告的 outcomes[] 項目——Atlas 自己的效益是「保持策略彈性」，一個沒有真實 outcome 父項的 bet，正是這個方法「用 outcomes 而非 feature 排序」的管線順序要防止的、換個標籤偷渡進來的功能導向項目。themes 跟 outcomes 都至少要有 1 筆，但 bets 可以合法地是空清單——一份 roadmap 可以只宣告 outcomes、還沒有承諾任何 bet，這是更有策略彈性的狀態，不是格式錯誤。"
    url: "https://melissaperri.com/blog/2017/02/15/product-roadmaps"
    example_zh: "情境：用 outcome 導向排出新用戶留存的 roadmap。\nthemes：[{theme_id:\"TH1\", name:\"提升新用戶留存\"}]\noutcomes：[{outcome_id:\"O1\", theme_id:\"TH1\", description:\"新用戶 7 天留存率從 20% 提升到 35%\"}]\nbets：[{bet_id:\"B1\", outcome_id:\"O1\", description:\"加入新手引導教學\", evidence:[\"A/B 測試顯示有引導的用戶留存率高 12%\"]}]\nnext_review：「2026-Q1」\n（重點）如果 bets 的 outcome_id 填成一個 outcomes 裡不存在的 id（例如 \"O99\"），會被拒絕建立——一個沒有真實 outcome 父項的 bet，等於偷渡了一個以 feature 為導向的項目，違背這個方法「用 outcomes 而非 feature 排序」的核心。"
    example_en: "Scenario: building an outcome-oriented roadmap for new-user retention. themes: [{theme_id:'TH1', name:'improve new-user retention'}]; outcomes: [{outcome_id:'O1', theme_id:'TH1', description:'raise 7-day new-user retention from 20% to 35%'}]; bets: [{bet_id:'B1', outcome_id:'O1', description:'add an onboarding tutorial', evidence:['A/B test showed users who saw onboarding retained 12% better']}]; next_review: '2026-Q1'. Key point: if a bet's outcome_id named an id that doesn't exist in outcomes (e.g. 'O99'), the record would be refused at construction -- a bet with no real outcome parent is a feature-driven entry sneaking in under a different label, against this method's own 'outcomes, not features' core."
  delivery.raci:
    name_en: "Delivery RACI Matrix"
    abbr: "RACI"
    name_zh: "交付 RACI 矩陣"
    blurb_en: "Assigns Responsible/Accountable/Consulted/Informed per deliverable, with a due date on each. Use it to close accountability gaps on a delivery-focused project."
    blurb_zh: "為每個交付項目指定負責／當責／諮詢／被告知角色，並附截止日期。想防止責任空洞時用。"
    why_en: "if a deliverable's Accountable assignment has status UNAVAILABLE, escalation_path (a fallback Accountable) must be a non-empty string -- an unavailable Accountable with no declared fallback IS the responsibility void this method's own 'prevent a responsibility void' benefit exists to prevent. Exactly one Accountable and at least one Responsible per deliverable is also required, carried over from standard RACI discipline."
    why_zh: "如果一個交付項目的 Accountable（負責拍板者）狀態是 UNAVAILABLE（無法出面），escalation_path（備援負責人）就一定要是非空字串——一個無法出面卻沒有宣告備援的負責人，正是這個方法「防責任空洞」效益要防止的責任真空。每個交付項目也一定要剛好有 1 位 Accountable、至少 1 位 Responsible，這是標準 RACI 紀律的延伸。"
    url: "https://en.wikipedia.org/wiki/Responsibility_assignment_matrix"
    example_zh: "情境：為「第三方支付串接上線」這個交付項目指派 RACI。\ndeliverables：[{deliverable_name:\"第三方支付串接上線\", due_date:\"2026-11-15\", assignments:[{stakeholder_name:\"小華\", role:\"A\", status:\"AVAILABLE\"}, {stakeholder_name:\"小美\", role:\"R\", status:\"AVAILABLE\"}], escalation_path:null}]\n（重點）如果小華（Accountable）的 status 改成 \"UNAVAILABLE\"，卻沒有填 escalation_path，會被拒絕建立——負責拍板的人無法出面卻沒有備援，正是這個方法要防止的責任真空。"
    example_en: "Scenario: assigning RACI roles for the deliverable 'third-party payment integration launch'. deliverables: [{deliverable_name:'third-party payment integration launch', due_date:'2026-11-15', assignments:[{stakeholder_name:'Howard', role:'A', status:'AVAILABLE'}, {stakeholder_name:'Amy', role:'R', status:'AVAILABLE'}], escalation_path:null}]. Key point: if Howard (the Accountable) had status changed to 'UNAVAILABLE' with no escalation_path filled in, the record would be refused at construction -- an accountable decision-maker who can't be reached, with no declared fallback, is exactly the responsibility void this method exists to prevent."
  delivery.raid_log:
    name_en: "RAID Log"
    abbr: ""
    name_zh: "RAID 日誌"
    blurb_en: "Tracks Risks, Assumptions, Issues, and Dependencies in one place with owner/status/next action, so nothing gets lost in chat. A closed item must carry evidence."
    blurb_zh: "在一個地方管理風險／假設／議題／相依，含負責人、狀態、下一步。防止風險散落在聊天訊息裡時用。"
    why_en: "a RAID item whose status is CLOSED or RESOLVED must carry non-empty evidence -- a RAID item silently closed with no evidence defeats this method's own 'formalize scattered knowledge' benefit, since the closure itself must be checkable, not just a status flip. type must also be one of RISK/ASSUMPTION/ISSUE/DEPENDENCY -- literally what the R-A-I-D acronym names."
    why_zh: "一個狀態是 CLOSED 或 RESOLVED 的 RAID 項目，一定要有非空的 evidence——一個沒有證據就悄悄關閉的 RAID 項目，會直接破壞這個方法「把散落知識正式化」的效益，因為關閉這個動作本身也要能被檢查，不能只是改個狀態就算數。type 也一定要是 RISK／ASSUMPTION／ISSUE／DEPENDENCY 其中之一——這就是 R-A-I-D 縮寫本身講的四個字。"
    url: "https://www.projectmanager.com/blog/raid-log-use-one"
    example_zh: "情境：記錄「主要雲端供應商可能調漲價格」這個風險。\nitems：[{item_id:\"R1\", type:\"RISK\", statement:\"主要雲端供應商可能調漲價格\", owner:\"採購經理\", impact:\"可能增加 20% 年度雲端支出\", status:\"OPEN\", next_action:\"詢問其他供應商報價作為談判籌碼\", due_review_date:\"2026-10-01\"}]\n（重點）如果把 status 改成 \"CLOSED\"，卻沒有填 evidence（空字串），會被拒絕建立——一個關閉的項目一定要有證據佐證真的處理完了，不能只是把狀態改掉。"
    example_en: "Scenario: logging the risk 'the main cloud provider may raise prices'. items: [{item_id:'R1', type:'RISK', statement:'the main cloud provider may raise prices', owner:'procurement manager', impact:'could increase annual cloud spend by 20%', status:'OPEN', next_action:'get quotes from alternative providers as negotiating leverage', due_review_date:'2026-10-01'}]. Key point: if status were changed to 'CLOSED' with evidence left as an empty string, the record would be refused at construction -- a closed item must have evidence proving it was actually resolved, not just a flipped status."
  delivery.risk_register:
    name_en: "Risk Register"
    abbr: ""
    name_zh: "風險登記表"
    blurb_en: "Formally manages risks with probability x impact -> exposure (mechanically derived), owner, control, and trigger. Use it to make risk visible and trackable instead of just talked about."
    blurb_zh: "正式管理風險：機率×影響機械式算出曝險程度，附負責人、控制措施、觸發條件。想讓風險可追蹤而不只是嘴上說說時用。"
    why_en: "exposure is never a caller-supplied field -- the per-risk builder doesn't even accept an exposure parameter, so it's always mechanically derived as probability * impact, and the gate independently re-derives it from a record's own raw fields on every check. Every risk also needs a non-empty owner/control/trigger -- a risk register entry missing any of these three is a label, not a tracked risk."
    why_zh: "exposure（風險曝險值）從來不是呼叫端能填的欄位——單一風險項目的建構函式根本沒有 exposure 這個參數，永遠是機械算成 probability × impact，而且 gate 每次檢查都會從記錄自己的原始欄位獨立重算一次。每個風險也一定要有非空的 owner／control／trigger——一個缺少這三者任何一個的風險登記項目，只是一個標籤，不是真正被追蹤的風險。"
    url: "https://en.wikipedia.org/wiki/Risk_register"
    example_zh: "情境：登記「關鍵工程師離職導致專案延誤」這個風險。\nrisks：[{risk_id:\"RISK-1\", description:\"關鍵工程師離職導致專案延誤\", probability:0.3, impact:0.7, owner:\"專案經理\", control:\"建立知識文件並安排 pair programming\", trigger:\"該工程師遞交辭呈或連續 2 週請假\"}]\nexposure 不用也不能自己填，系統會自動算成 0.21（0.3×0.7）。\n（重點）如果 owner 填空字串，會被拒絕建立——沒有負責人的風險項目只是一個標籤，不算真正被追蹤的風險。"
    example_en: "Scenario: logging the risk 'a key engineer's departure could delay the project'. risks: [{risk_id:'RISK-1', description:\"a key engineer's departure could delay the project\", probability:0.3, impact:0.7, owner:'project manager', control:'build knowledge documentation and schedule pair programming', trigger:'the engineer resigns or takes 2+ consecutive weeks of leave'}]. exposure is never supplied directly -- the system computes it as 0.21 (0.3 x 0.7) automatically. Key point: if owner were an empty string, the record would be refused at construction -- a risk entry with no owner is just a label, not an actually-tracked risk."
  delivery.stage_gate:
    name_en: "Stage-Gate"
    abbr: ""
    name_zh: "階段關卡法"
    blurb_en: "Decides Go/Hold/Rework/Kill at each stage based on evidence, not momentum -- a Go requires evidence. Use it to avoid sunk-cost-driven projects that only reveal they're wrong at the very end."
    blurb_zh: "每個階段用證據決定 Go／暫停／重做／中止，Go 一定要有證據。防止靠沉沒成本硬撐、做到最後才發現方向錯時用。"
    why_en: "a stage review decided GO must carry a non-empty evidence array -- a GO with no evidence recreates, inside the very tool meant to prevent it, exactly the 'go all the way before discovering the wrong direction' failure Atlas's own benefit column names. gate_decision must also be one of GO/HOLD/REWORK/KILL, Atlas's own verbatim pipeline terminus."
    why_zh: "一個決定為 GO 的階段審查，一定要有非空的 evidence 陣列——一個沒有證據的 GO，等於在這個本來要防止「一路做到底才發現方向錯」的工具裡，重新製造出一模一樣的失敗。gate_decision 也一定要是 GO／HOLD／REWORK／KILL 其中之一，這是 Atlas 自己管線的終點字面用詞。"
    url: "https://www.stage-gate.com/blog/the-stage-gate-model-an-overview/"
    example_zh: "情境：對一個新產品概念驗證階段做關卡審查。\nstage_reviews：[{stage_name:\"概念驗證階段\", evidence:[\"PoC 顯示核心演算法在 100ms 內完成運算，符合效能門檻\"], gate_criteria:[\"效能達標\", \"初步成本估算在預算內\"], gate_decision:\"GO\"}]\n（重點）如果 gate_decision 填「GO」，卻把 evidence 留空清單，會被拒絕建立——沒有證據支撐的 GO 決定，等於又走回「做到底才發現方向錯」的老路，正是這個方法要防止的事。"
    example_en: "Scenario: conducting a gate review for a new product's proof-of-concept stage. stage_reviews: [{stage_name:'proof-of-concept stage', evidence:['the PoC showed the core algorithm completes within 100ms, meeting the performance bar'], gate_criteria:['performance target met', 'preliminary cost estimate is within budget'], gate_decision:'GO'}]. Key point: if gate_decision were 'GO' but evidence were left as an empty list, the record would be refused at construction -- a GO decision with no evidence recreates the exact 'go all the way before discovering the wrong direction' failure this method exists to prevent."

  # ---- devops_sre (F19 DevOps/SRE/Reliability Pack) ----
  devops_sre.blue_green_deployment:
    name_en: "Blue-Green Deployment"
    abbr: ""
    name_zh: "藍綠部署"
    blurb_en: "Fully deploys and verifies the new version (Green) before cutting traffic over, keeping the old version (Blue) as an instant fallback. Use it for a release where you need a near-instant rollback option."
    blurb_zh: "新版本（Green）完整部署驗證後才切流量，舊版本（Blue）保留做即時備援。需要近乎瞬間回滾能力的上線時用。"
  devops_sre.canary_deployment:
    name_en: "Canary Deployment"
    abbr: ""
    name_zh: "金絲雀部署"
    blurb_en: "Rolls out a new version in stages (1% -> 5% -> 25% -> 50% -> 100%), rolling back immediately if any stage looks unhealthy. Use it to limit blast radius when releasing something risky."
    blurb_zh: "分階段放量（1%→5%→25%→50%→100%），任何階段不健康就立刻回滾。要限制風險爆炸半徑的上線時用。"
  devops_sre.capacity_model:
    name_en: "Capacity Model"
    abbr: ""
    name_zh: "容量模型"
    blurb_en: "Projects workload growth against resource coefficients to find headroom, preventing both capacity incidents and over-provisioning. Use it before you scale up (or need to justify not scaling up yet)."
    blurb_zh: "用工作量成長對照資源係數，算出還有多少餘裕，同時防容量事故與過度採購。要擴充資源前，或要說明現在還不需要擴充時用。"
  devops_sre.chaos_engineering:
    name_en: "Chaos Engineering"
    abbr: ""
    name_zh: "混沌工程"
    blurb_en: "Sets a steady-state hypothesis, limits blast radius, injects a specific failure, and checks the system recovers -- stopping immediately if it doesn't. Use it to proactively find resilience gaps before a real outage does."
    blurb_zh: "建立穩態假設、限定影響範圍、注入特定故障、驗證系統是否自動恢復，不如預期立即停止。想在真的出事前主動找出韌性缺口時用。"
  devops_sre.error_budget:
    name_en: "Error Budget"
    abbr: ""
    name_zh: "錯誤預算"
    blurb_en: "Derives a burn rate from 1-SLO and lets it drive release policy (slow down when the budget's nearly spent). Use it to make 'should we ship more features or focus on reliability' a data-driven call instead of a debate."
    blurb_zh: "從 1-SLO 算出燃燒速率，用它決定發布節奏（預算快用完就放慢腳步）。想讓「該衝功能還是顧穩定」變成有數據依據的決定時用。"
  devops_sre.game_day:
    name_en: "Game Day"
    abbr: ""
    name_zh: "演習日"
    blurb_en: "Runs a planned scenario with assigned roles, injects a problem, and reviews the response. Use it to rehearse an incident response before a real one happens."
    blurb_zh: "用預先設計的情境、指派角色、注入問題、事後檢討。想在真正出事前先演練事故應變流程時用。"
  devops_sre.load_test:
    name_en: "Load Test"
    abbr: ""
    name_zh: "負載測試"
    blurb_en: "Records real load-test measurements (throughput, latency, error rate) at increasing traffic levels. Use it to know your system's actual capacity before launch or a traffic spike."
    blurb_zh: "記錄逐步加壓下的真實負載測試數據（吞吐量、延遲、錯誤率）。上線或預期流量暴增前，想知道系統真實承載能力時用。"
  devops_sre.release_readiness_review:
    name_en: "Release Readiness Review"
    abbr: ""
    name_zh: "發布就緒審查"
    blurb_en: "Checks change/data/security/observability/rollback/capacity together before a release, to catch cross-domain risk one team alone would miss. Use it as a final go/no-go checklist before shipping."
    blurb_zh: "上線前一次檢查變更、資料、安全、可觀測性、回滾、容量，抓出單一團隊會漏掉的跨領域風險。上線前的最終 go/no-go 檢查用。"
  devops_sre.rto_rpo:
    name_en: "Recovery Time Objective / Recovery Point Objective"
    abbr: "RTO / RPO"
    name_zh: "復原時間目標／復原點目標"
    blurb_en: "Defines how long you can be down (RTO) and how much data you can afford to lose (RPO) for a system. Use it to set concrete disaster-recovery targets before you need them."
    blurb_zh: "定義一個系統最多能停機多久（RTO）、最多能損失多少資料（RPO）。想提早訂出具體的災難復原目標時用。"
  devops_sre.runbook_execution:
    name_en: "Runbook Execution"
    abbr: ""
    name_zh: "作業手冊執行"
    blurb_en: "Records preconditions -> steps -> expected output -> stop/go -> rollback for executing an operational procedure. Use it to reduce operator error on a routine-but-risky manual procedure."
    blurb_zh: "記錄操作程序的前置條件→步驟→預期結果→停止/繼續→回滾。想降低例行但有風險的手動操作出錯機率時用。"
  devops_sre.sli_slo:
    name_en: "Service Level Indicator / Objective / Agreement"
    abbr: "SLI / SLO / SLA"
    name_zh: "服務等級指標／目標／協議"
    blurb_en: "Defines what you measure (SLI), the target (SLO), and the external commitment (SLA) for a service's reliability. Use it as the foundation before Error Budget or Canary Deployment make sense."
    blurb_zh: "定義服務可靠性要量測什麼（SLI）、目標值（SLO）、對外承諾（SLA）。這是用 Error Budget 或 Canary Deployment 之前的基礎工作。"
  devops_sre.soak_test:
    name_en: "Soak Test"
    abbr: ""
    name_zh: "浸泡測試"
    blurb_en: "Runs load at a steady level for an extended period to catch slow degradation (memory leaks, resource exhaustion) that a short load test would miss. Use it before a long-running production launch."
    blurb_zh: "用穩定負載跑很長一段時間，抓短時間負載測試抓不到的緩慢退化（記憶體洩漏、資源耗盡）。長時間運行的正式環境上線前用。"
  devops_sre.stress_test:
    name_en: "Stress Test"
    abbr: ""
    name_zh: "壓力測試（工程）"
    blurb_en: "Pushes load past normal levels to find the actual breaking point and whether the system recovers after. Use it to know your system's true ceiling, not just its comfortable operating range."
    blurb_zh: "把負載推到超過正常水位，找出真正的崩潰點以及事後能不能恢復。想知道系統真正的上限，不只是舒適運作範圍時用。"

  # ---- divergent (F03 divergent ideation) ----
  divergent.brainwriting:
    name_en: "Brainwriting"
    abbr: ""
    name_zh: "腦力書寫法"
    blurb_en: "Everyone writes ideas individually first, then shares/merges -- reduces anchoring and lets introverts contribute equally. Use it for cross-hierarchy groups where the loudest voice tends to dominate."
    blurb_zh: "先各自寫下想法，再分享合併，降低定錨效應與從眾心理。跨階級／怕外向者主導討論的團隊用。"
  divergent.classic_brainstorming:
    name_en: "Classic Brainstorming"
    abbr: ""
    name_zh: "經典腦力激盪"
    blurb_en: "Generate a large volume of ideas fast with judgment explicitly deferred to a separate, later evaluation step. Use it whenever you need many raw ideas without killing them early."
    blurb_zh: "快速產生大量想法，明確把評判延後到之後獨立的評估步驟。想要大量原始想法、不要邊想邊否決時用。"
  divergent.crazy_eights:
    name_en: "Crazy 8s"
    abbr: ""
    name_zh: "瘋狂 8 法"
    blurb_en: "8 concepts in 8 minutes on an 8-panel grid, forcing you past your first (safest) answer. Use it for UI/interface or product-concept sketching, not for final selection."
    blurb_zh: "8 分鐘畫出 8 個不同概念，強迫自己跳過第一個答案。適合介面／產品概念發想，不適合當最終方案評選。"
  divergent.creative_constraints:
    name_en: "Creative Constraints"
    abbr: ""
    name_zh: "創意限制"
    blurb_en: "Imposes an artificial material constraint (only red, only your left hand) to break habitual expression and build creative flexibility. Non-diagnostic."
    blurb_zh: "以限制媒材方式（只能用紅色、只能用左手）促發非慣性表達與創作彈性。非診斷工具。"
  divergent.design_thinking:
    name_en: "Design Thinking"
    abbr: ""
    name_zh: "設計思考"
    blurb_en: "Solves a problem through empathize, define, ideate, prototype, test. Non-diagnostic."
    blurb_zh: "透過同理、定義、發想、原型、測試解決問題。非診斷工具。"
  divergent.forced_connections:
    name_en: "Forced Connections"
    abbr: ""
    name_zh: "強制關聯法"
    blurb_en: "Forces a connection between two unrelated concepts (list features -> cross-combine) to spark new product/business-model ideas. Use it when you're stuck and need a genuinely novel angle."
    blurb_zh: "強制連結兩個不相關概念（列特徵→交叉組合），激發新產品／商業模式創意。卡住、需要真正跳脫的角度時用。"
  divergent.lateral_thinking:
    name_en: "Lateral Thinking"
    abbr: ""
    name_zh: "水平思考"
    blurb_en: "Escapes a named dominant assumption via a nonlinear provocation technique. Non-diagnostic."
    blurb_zh: "跳脫邏輯慣性，以非線性方式解題。非診斷工具。"
  divergent.lotus_blossom:
    name_en: "Lotus Blossom"
    abbr: ""
    name_zh: "蓮花座法"
    blurb_en: "A center idea spreads into 8 branches, each branch spawning 8 more ideas -- large volume with real structure. Use it when you want a lot of ideas but still organized enough to cluster afterward."
    blurb_zh: "中心主題展開 8 個分支，每個分支再各自長出 8 個想法，大量但有結構。想要大量想法但還能事後分群整理時用。"
  divergent.random_stimulus:
    name_en: "Random Stimulus"
    abbr: ""
    name_zh: "隨機刺激法"
    blurb_en: "Forces a connection between your problem and a random word or image to break habitual thinking. Ideas need a feasibility screen afterward -- it's for breaking ruts, not for final selection."
    blurb_zh: "用隨機詞或圖強制找出跟問題的關聯，打破慣性思考。之後需要可行性篩選——它是用來打破思路卡住，不是拿來做最終決定。"
  divergent.reverse_brainstorming:
    name_en: "Reverse Brainstorming"
    abbr: ""
    name_zh: "反向腦力激盪法"
    blurb_en: "Instead of 'how do we solve X', brainstorm 'how could we cause or worsen X', then invert each answer into a real candidate solution. Use it when direct problem-solving keeps circling the same ideas."
    blurb_zh: "不直接想「怎麼解決 X」，而是先想「怎麼樣會讓 X 更糟」，再把每個答案反過來變成真正的解法。想解決問題卻一直卡在同樣幾個想法時用。"
    why_en: "Directly asking 'how do we fix this' often stalls on the same few ideas; asking 'how could we sabotage this' is usually easier to answer freely, and inverting each sabotage into its opposite produces a concrete fix while surfacing failure mechanisms a direct framing tends to route around."
    why_zh: "直接問「怎麼解決」常常卡住、繞著同幾個想法打轉；反過來問「怎麼樣會搞砸它」通常更容易放開想，再把每個「搞砸的方法」倒過來，就變成一個具體的解法，還能順便揭露原本沒注意到的失敗風險。"
    url: "https://miro.com/brainstorming/what-is-reverse-brainstorming/"
    example_zh: "情境：新用戶完成註冊的比例偏低，一直想不出怎麼提升，反過來想「怎麼樣會讓註冊完成率更低」。\nproblem_statement：「新用戶完成註冊的比例偏低」\nworsening_ideas 至少 1 筆，每筆需要唯一 id/text/provenance，例如 {id: \"W1\", text: \"註冊表單要填 20 個欄位\", provenance: {epistemic_type: \"ASSUMPTION\", authorship_state: \"HUMAN_ORIGINAL\", locked: null}}。\n（選填）inversions：把每個「讓事情更糟」的點子倒過來變成解法，worsening_idea_ref 要對到真實存在的 worsening_ideas id，例如 {worsening_idea_ref: \"W1\", inverted_solution: \"把表單砍到只剩 3 個必填欄位，其餘留到之後補\", provenance: {epistemic_type: \"HYPOTHESIS\", authorship_state: \"HUMAN_ORIGINAL\", locked: null}}。\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
    example_en: "Scenario: new-user signup completion is low and direct brainstorming keeps stalling, so the team asks 'how could we make completion even worse' instead. problem_statement: 'New-user signup completion rate is low'; worsening_ideas has >=1 entry, each needing a unique id/text/provenance, e.g. {id: 'W1', text: 'Make the signup form require 20 fields', provenance: {epistemic_type: 'ASSUMPTION', authorship_state: 'HUMAN_ORIGINAL', locked: null}}. Optional: inversions flips each 'way to make it worse' into a solution, worsening_idea_ref must point at a real worsening_ideas id, e.g. {worsening_idea_ref: 'W1', inverted_solution: 'Cut the form down to 3 required fields, defer the rest', provenance: {epistemic_type: 'HYPOTHESIS', authorship_state: 'HUMAN_ORIGINAL', locked: null}}. version/generated_by_method can be left blank, the system supplies defaults."
  divergent.scamper:
    name_en: "SCAMPER"
    abbr: "SCAMPER"
    name_zh: "SCAMPER 檢核表法"
    blurb_en: "Systematically remixes an existing product/process through 7 lenses (Substitute/Combine/Adapt/Modify/Put to other use/Eliminate/Reverse). It generates ideas -- it does not prove market demand or business viability."
    blurb_zh: "用 7 個角度（替代／結合／調整／修改／挪用／消除／反轉）系統性改造已有的產品或流程。能產生想法，但不能證明市場需求或商業可行性。"
  divergent.six_thinking_hats:
    name_en: "Six Thinking Hats"
    abbr: ""
    name_zh: "六頂思考帽"
    blurb_en: "Switches between six perspectives (emotion, logic, critique, creativity, etc.) to strengthen integrative thinking. Non-diagnostic."
    blurb_zh: "讓案主切換多元觀點：情緒、邏輯、批判、創意等，強化整合力。非診斷工具。"
  divergent.six_three_five:
    name_en: "6-3-5 Brainwriting"
    abbr: ""
    name_zh: "6-3-5 腦力書寫法"
    blurb_en: "6 people x 3 ideas x 5 minutes, passing sheets around to build on each other's ideas -- structured, fast, high volume. Use it when you want brainwriting's benefits with a tight time-box."
    blurb_zh: "6 人×3 個想法×5 分鐘，輪流傳遞接力延伸，結構化又快速產生大量變體。想要腦力書寫的效果又要控制時間時用。"
  divergent.starbursting:
    name_en: "Starbursting"
    abbr: ""
    name_zh: "星爆法"
    blurb_en: "Diverges through questions across Who/What/When/Where/Why/How to surface unknowns and research questions. Use it early, before you've defined requirements, to find what you don't know yet."
    blurb_zh: "用 Who/What/When/Where/Why/How 六個角度發散提問，找出未知與研究問題。需求前期、想找出還不知道的事情時用。"
  divergent.synectics:
    name_en: "Synectics"
    abbr: ""
    name_zh: "類比創意法"
    blurb_en: "Reframes a problem through direct/personal/symbolic analogy for a deeper creative breakthrough. Facilitation-heavy -- best run as a guided workshop."
    blurb_zh: "用直接／個人／象徵類比重構問題，追求更深層的創意突破。對引導技巧要求較高，適合工作坊形式進行。"
  divergent.triz:
    name_en: "Theory of Inventive Problem Solving"
    abbr: "TRIZ"
    name_zh: "創新理論工具"
    blurb_en: "A systematic method for resolving seemingly contradictory problems using inventive principles. Non-diagnostic."
    blurb_zh: "系統化解決矛盾問題的方法論。面對看似矛盾的內在衝突，用「矛盾解決思維」打開出路。非診斷工具。"

  # ---- epistemic (F10 epistemic quality) ----
  epistemic.argument_mapping:
    name_en: "Argument Mapping"
    abbr: ""
    name_zh: "論證地圖"
    blurb_en: "Structures one main claim plus its supporting reasons, objections, and rebuttals into a checkable graph. Use it to make an argument's logic inspectable instead of buried in prose."
    blurb_zh: "把主張、支持理由、反對意見、反駁整理成可檢查的論證圖。想讓一個論證的邏輯可被檢視，而不是埋在文字裡時用。"
    why_en: "every rebuttal must reference a real, declared objection -- a rebuttal answering an objection that was never raised is a dangling argument node, refused before construction. Requiring at least one support on top of that means a bare claim with nothing backing it doesn't even count as an argument yet, matching Atlas's own pipeline order (main claim -> SUPPORT -> objection, not main claim -> objection first)."
    why_zh: "每一筆 rebuttal 都一定要指向一個真實宣告過的 objection——回應一個從未被提出過的異議，就是一個懸空的論證節點，會在建構前被拒絕。在此之上還要求至少 1 筆 support，一個完全沒有任何支持理由的主張，根本還不算一個論證，這跟 Atlas 自己的管線順序一致（先主張→SUPPORT，不是先主張→objection）。"
    url: "https://en.wikipedia.org/wiki/Argument_map"
    example_zh: "情境：對「公司應該全面轉為遠端工作」這個主張建立論證地圖。\nmain_claim 至少要有 claim_id 跟 statement，例如 {claim_id: \"C-1\", statement: \"公司應該全面轉為遠端工作\", provenance: {...}}\nsupports 至少 1 筆，例如 [{id: \"S-1\", text: \"可以招募到不受地理限制的人才\"}]\nobjections 的 id 要唯一，例如 [{id: \"O-1\", text: \"新人 onboarding 跟團隊文化建立會變困難\"}]\nrebuttals 的 objection_id 一定要指向上面真實存在的 objection，例如 [{id: \"R-1\", objection_id: \"O-1\", text: \"改用結構化 buddy 制度加每週實體聚會可以緩解\"}]\n（重點）如果 rebuttals 裡的 objection_id 指向一個沒在 objections 出現過的 id，會被拒絕建立——回應一個從未被提出的異議是懸空的論證。"
    example_en: "Scenario: build an argument map for the claim 'the company should go fully remote'. main_claim needs at least claim_id and statement, e.g. {claim_id: 'C-1', statement: 'The company should go fully remote', provenance: {...}}; supports has >=1 entry, e.g. [{id: 'S-1', text: 'Can recruit talent without geographic limits'}]; objections have unique ids, e.g. [{id: 'O-1', text: 'Onboarding and building team culture becomes harder'}]; every rebuttals entry's objection_id must resolve to a real objection above, e.g. [{id: 'R-1', objection_id: 'O-1', text: 'A structured buddy system plus weekly in-person meetups can offset this'}]. Key point: a rebuttal whose objection_id never appears in objections is refused at construction -- answering an objection that was never raised is a dangling argument node."
  epistemic.assumption_mapping:
    name_en: "Assumption Mapping"
    abbr: ""
    name_zh: "假設地圖"
    blurb_en: "Sorts assumptions by impact-if-wrong x uncertainty into a quadrant, so you know which to validate first. Use it to decide which risky assumption to test before you bet on it."
    blurb_zh: "依「錯了會怎樣×不確定程度」把假設排進四象限，知道該先驗證哪個。想決定先測試哪個高風險假設時用。"
    why_en: "quadrant is never a caller-supplied field -- it's always mechanically derived from the (impact, uncertainty) pair via a fixed 4-cell table, so a hand-crafted assumption can't claim to be VALIDATE_FIRST (or any other quadrant) except by actually having the impact/uncertainty combination that quadrant requires. This forces prioritization to follow from the two real judgments made, not from wherever someone felt like filing the assumption."
    why_zh: "quadrant 從來不是呼叫端能直接給值的欄位——永遠是從 (impact, uncertainty) 這組值透過固定的 4 格對照表機械算出來的，所以一筆手動建立的假設沒辦法宣稱自己是 VALIDATE_FIRST（或任何其他象限），除非它真的具備那個象限要求的 impact／uncertainty 組合。這樣優先順序就一定是從兩個真實判斷推出來的，而不是有人隨便想歸到哪一格就歸到哪一格。"
    url: "https://www.moccu.com/en/insights/digital-design/assumption-mapping/"
    example_zh: "情境：對「新訂閱制方案」的幾個關鍵假設排優先順序。\nmapped_assumptions 欄位剛好是 assumption_id／impact／uncertainty 這 3 個（不含 quadrant，這是系統算的），assumption_id 要符合 ^ASM-[0-9]+$ 格式且唯一，impact／uncertainty 只能是 HIGH／LOW\n例如 [{assumption_id: \"ASM-1\", impact: \"HIGH\", uncertainty: \"HIGH\"}, {assumption_id: \"ASM-2\", impact: \"HIGH\", uncertainty: \"LOW\"}]\n（重點）ASM-1 因為 impact 跟 uncertainty 都是 HIGH，quadrant 會自動算成 VALIDATE_FIRST（最優先驗證）；ASM-2 因為 impact HIGH、uncertainty LOW，會自動算成 KNOWN_CRITICAL。quadrant 不用也不能自己填。"
    example_en: "Scenario: prioritize a few key assumptions behind a new subscription plan. mapped_assumptions entries have EXACTLY these 3 keys (assumption_id, impact, uncertainty -- no quadrant, that's computed), assumption_id must match ^ASM-[0-9]+$ and be unique, impact/uncertainty are each HIGH or LOW. E.g. [{assumption_id: 'ASM-1', impact: 'HIGH', uncertainty: 'HIGH'}, {assumption_id: 'ASM-2', impact: 'HIGH', uncertainty: 'LOW'}]. Key point: ASM-1's quadrant is automatically computed as VALIDATE_FIRST (both impact and uncertainty are HIGH -- validate this first), and ASM-2's as KNOWN_CRITICAL (HIGH impact, LOW uncertainty) -- quadrant is never supplied directly."
  epistemic.assumption_registry:
    name_en: "Assumption Registry"
    abbr: ""
    name_zh: "假設登記表"
    blurb_en: "Formally records every assumption's statement, type, evidence, confidence, and status so assumptions stop hiding inside prose. Use it to keep a running, visible list of everything a plan is betting on."
    blurb_zh: "正式記錄每個假設的內容、類型、證據、信心度、狀態，讓假設不再藏在文字裡。想維護一份持續可見的「這個計畫在賭什麼」清單時用。"
    why_en: "is_critical_assumption is never a caller-supplied field -- it's always derived from whether impact_if_wrong equals exactly 'Critical', so an entry can't be flagged critical (or non-critical) except by what its own impact_if_wrong actually says. Separately, an entry whose status claims 'validated' or 'verified' must carry a non-empty validation field describing how -- a status that pretends certainty with no recorded validation method is exactly the assumption-hidden-in-prose failure this registry exists to prevent."
    why_zh: "is_critical_assumption 從來不是呼叫端能直接給值的欄位——永遠是從 impact_if_wrong 是否剛好等於「Critical」算出來的，一筆條目不能自己宣稱是不是關鍵假設，只能看它自己的 impact_if_wrong 怎麼寫。另外，只要 status 宣稱「validated」或「verified」，就一定要附上非空的 validation 欄位說明怎麼驗證的——一個假裝已經確定、卻沒有記錄任何驗證方法的狀態，正是這個登記表要防止的「假設藏在文字中」失敗。"
    url: "https://asana.com/resources/raid-log"
    example_zh: "情境：正式登記「主要供應商能在 48 小時內完成 API 整合」這個假設。\nentries 至少 1 筆，id 要符合 ^ASM-[0-9]+$ 格式，provenance 的 epistemic_type 一定要是 ASSUMPTION，例如 [{id: \"ASM-1\", statement: \"主要供應商能在 48 小時內完成 API 整合\", status: \"Unverified\", impact_if_wrong: \"Critical\", provenance: {epistemic_type: \"ASSUMPTION\", ...}}]\n（選填）type／evidence_strength／evidence／confidence／validation／owner 都可以不給，除非 status 宣稱已驗證\n（重點）is_critical_assumption 不用也不能自己填，系統會看 impact_if_wrong 是不是剛好等於「Critical」自動算出來——上面這筆會自動算成 true。如果 status 改成 \"Validated\" 卻沒填 validation 欄位，會被拒絕建立。"
    example_en: "Scenario: formally register the assumption 'the primary vendor can complete API integration within 48 hours'. entries has >=1 entry with an id matching ^ASM-[0-9]+$, and each entry's provenance.epistemic_type must be ASSUMPTION, e.g. [{id: 'ASM-1', statement: 'The primary vendor can complete API integration within 48 hours', status: 'Unverified', impact_if_wrong: 'Critical', provenance: {epistemic_type: 'ASSUMPTION', ...}}]. Optional: type/evidence_strength/evidence/confidence/validation/owner may all be omitted, unless status claims validation. Key point: is_critical_assumption is never supplied directly -- the system computes it from whether impact_if_wrong is exactly 'Critical' (it would be true here). If status were changed to 'Validated' with no validation field filled in, the record would be refused at construction."
  epistemic.bayesian_updating:
    name_en: "Bayesian Updating"
    abbr: ""
    name_zh: "貝氏更新"
    blurb_en: "Updates a belief's probability (prior -> likelihood -> posterior) as new evidence arrives. Use it when you want your confidence in something to update rigorously as evidence comes in, not just vibes-based."
    blurb_zh: "隨新證據更新一個信念的機率（先驗→概似→後驗）。想讓信心程度隨證據嚴謹更新，而不是憑感覺調整時用。"
    why_en: "posterior is never a caller-supplied field -- it's always computed via Bayes' rule from prior/likelihood_given_true/likelihood_given_false, and if the denominator works out to exactly zero (e.g. a prior of 0 combined with a likelihood_given_false of 0), the method refuses to return a record at all rather than silently treating an undefined posterior as 0. This stops a belief update from ever reporting a confident number where the math genuinely has no answer."
    why_zh: "posterior 從來不是呼叫端能直接給值的欄位——永遠是用貝氏定理從 prior／likelihood_given_true／likelihood_given_false 算出來的，如果分母剛好算成 0（例如 prior 是 0 又搭配 likelihood_given_false 是 0），這個方法會直接拒絕回傳任何紀錄，而不是把一個數學上根本沒有答案的後驗機率悄悄當成 0 處理。這樣一次信念更新就不會在算式真的無解的情況下，還報出一個看起來很有信心的數字。"
    url: "https://en.wikipedia.org/wiki/Bayesian_inference"
    example_zh: "情境：根據新的 A/B 測試數據，更新「新版結帳流程能提高轉換率」這個假設的信心。\nhypothesis：「新版結帳流程能提高轉換率」\nprior：0.5（事前信心，即更新前的機率）\nlikelihood_given_true：0.8（假設為真時，觀察到目前這組數據的機率）\nlikelihood_given_false：0.3（假設為假時，觀察到目前這組數據的機率）\nevidence_ref：「A/B測試報告-2026-09」\n（重點）posterior 不用也不能自己填，系統會用貝氏定理自動算出來（此例約 0.727）。如果 prior 跟 likelihood_given_false 都填 0，會因為分母算成 0（後驗機率數學上無定義）而被拒絕建立，不會悄悄回傳一個 0。"
    example_en: "Scenario: update confidence in the hypothesis 'the new checkout flow raises conversion' given new A/B test data. hypothesis: 'The new checkout flow raises conversion'; prior: 0.5 (belief before seeing this evidence); likelihood_given_true: 0.8 (probability of observing this data if the hypothesis is true); likelihood_given_false: 0.3 (probability of observing this data if the hypothesis is false); evidence_ref: 'AB-test-report-2026-09'. Key point: posterior is never supplied directly -- the system computes it via Bayes' rule (approximately 0.727 here). If prior and likelihood_given_false were both 0, the record would be refused at construction because the denominator works out to 0 (a mathematically undefined posterior), rather than silently returning 0."
  epistemic.confidence_calibration:
    name_en: "Confidence Calibration"
    abbr: ""
    name_zh: "信心校準"
    blurb_en: "Checks whether your stated confidence actually matches your accuracy (predictions vs actuals -> calibration curve), to catch overconfidence. Use it to see if 'I'm 90% sure' actually means 90% right, historically."
    blurb_zh: "檢查你說的信心程度是不是真的準（預測 vs 實際結果→校準曲線），抓出過度自信。想知道自己說的「9 成把握」歷史上到底準不準時用。"
    why_en: "brier_score is never a caller-supplied field -- it's always computed as the mean squared error between each stated_confidence and its realized outcome, and the method requires at least 2 predictions because Atlas's own pipeline is plural ('predictions -> actuals -> calibration curve'): a single point can't draw a curve at all. actual_outcome must genuinely be a bool, not an int 0/1 -- both would compute the same score arithmetically, but accepting an int would silently tolerate a category error this method refuses instead."
    why_zh: "brier_score 從來不是呼叫端能直接給值的欄位——永遠是每一筆 stated_confidence 跟它實際結果之間的均方誤差算出來的，而且這個方法要求至少 2 筆預測，因為 Atlas 自己的管線本來就是複數的（「predictions→actuals→calibration curve」）：單一一個點根本畫不出校準曲線。actual_outcome 一定要是真正的布林值，不能是整數 0／1——雖然算術上兩者算出來的分數會一樣，但接受整數等於默默容忍一個型別錯誤，這個方法選擇直接拒絕而不是容忍。"
    url: "https://en.wikipedia.org/wiki/Brier_score"
    example_zh: "情境：檢驗一位分析師過去幾次「這個功能會提升留存率」的信心程度校準得準不準。\npredictions 至少 2 筆，id 要唯一，stated_confidence 是 0-1 的實數，actual_outcome 一定要是真正的布林值（不能是 0／1 整數），例如 [{id: \"P-1\", stated_confidence: 0.9, actual_outcome: true}, {id: \"P-2\", stated_confidence: 0.6, actual_outcome: false}, {id: \"P-3\", stated_confidence: 0.7, actual_outcome: true}]\n（重點）brier_score 不用也不能自己填，系統會自動算出均方誤差（此例約 0.153）。如果只給 1 筆預測，會被拒絕建立——單一一個點畫不出校準曲線。"
    example_en: "Scenario: check how well-calibrated an analyst's past confidence levels in 'this feature will raise retention' turned out to be. predictions has >=2 entries with unique ids, stated_confidence is a real number in [0,1], actual_outcome must be a genuine bool (not an int 0/1), e.g. [{id: 'P-1', stated_confidence: 0.9, actual_outcome: true}, {id: 'P-2', stated_confidence: 0.6, actual_outcome: false}, {id: 'P-3', stated_confidence: 0.7, actual_outcome: true}]. Key point: brier_score is never supplied directly -- the system computes the mean squared error automatically (approximately 0.153 here). A single prediction would be refused at construction -- one point can't draw a calibration curve."
  epistemic.contradiction_detection:
    name_en: "Contradiction Detection"
    abbr: ""
    name_zh: "矛盾偵測"
    blurb_en: "Finds where sources or models actually conflict with each other (claims matching -> support/contradict/context). Use it to expose hidden uncertainty when several sources disagree."
    blurb_zh: "找出來源或模型之間真正互相衝突的地方。多個來源意見不一致、想暴露隱藏的不確定性時用。"
    why_en: "{A,B} and {B,A} are treated as the exact same pair -- declaring it twice, even in the opposite order or with a conflicting relation value, is refused as an authoring error that would make the contradiction set internally inconsistent. Combined with the no-self-relation and referential-integrity checks, this stops the map of who-conflicts-with-whom from silently containing contradictions about itself."
    why_zh: "{A,B} 跟 {B,A} 被視為完全相同的一組配對——不管是反過來宣告一次、還是給了互相衝突的 relation 值，重複宣告都會被拒絕，因為那正是會讓整個矛盾關係圖自相矛盾的作者錯誤。搭配「不能自我關聯」跟「引用一定要真實存在」這兩項檢查，這樣「誰跟誰衝突」這張圖本身就不會悄悄自己出現矛盾。"
    url: "https://nlp.stanford.edu/projects/snli/"
    example_zh: "情境：比對三份不同來源對「遠端工作是否降低生產力」的主張是否互相衝突。\nclaims 至少 2 筆，claim_id 要符合 C-數字 格式且唯一，例如 [{claim_id: \"C-1\"}, {claim_id: \"C-2\"}, {claim_id: \"C-3\"}]\nrelations 每筆的 claim_id_a／claim_id_b 都要指向上面真實存在的 claim、彼此不能相同，relation 只能是 SUPPORTS／CONTRADICTS／CONTEXT_DEPENDENT 三選一，例如 [{claim_id_a: \"C-1\", claim_id_b: \"C-2\", relation: \"CONTRADICTS\"}]\n（重點）同一組 {claim_id_a, claim_id_b} 不能宣告兩次，就算把 C-1／C-2 反過來寫成 C-2／C-1 也算重複——會被拒絕建立，因為這樣可能出現互相矛盾的兩種判定。"
    example_en: "Scenario: compare three sources' claims about whether remote work lowers productivity for mutual contradiction. claims has >=2 entries with a unique claim_id matching the C-<number> pattern, e.g. [{claim_id: 'C-1'}, {claim_id: 'C-2'}, {claim_id: 'C-3'}]; each relations entry's claim_id_a/claim_id_b must both resolve to a real claim above and must differ from each other, relation is one of SUPPORTS/CONTRADICTS/CONTEXT_DEPENDENT, e.g. [{claim_id_a: 'C-1', claim_id_b: 'C-2', relation: 'CONTRADICTS'}]. Key point: the same {claim_id_a, claim_id_b} pair cannot be declared twice, even reversed as C-2/C-1 -- that still counts as a duplicate and is refused at construction, since it could assert two conflicting relation values for the same pair."
  epistemic.evidence_hierarchy:
    name_en: "Evidence Hierarchy"
    abbr: ""
    name_zh: "證據強度階層"
    blurb_en: "Ranks evidence by strength on a domain-specific hierarchy so sources aren't all treated as equally reliable. Use it whenever you're weighing evidence of very different quality on the same question."
    blurb_zh: "用該領域的證據強度階層排序，避免把不同等級的來源當成同樣可信。權衡品質差很多的證據來回答同一個問題時用。"
    why_en: "rank values across hierarchy_levels[] must be unique -- a strict total order, because two levels tying for the same rank makes 'which evidence is stronger' unanswerable, which is exactly the source-equivalence failure this method exists to prevent. The method deliberately does not impose one universal Weak/Medium/Strong scale on every domain: each run declares its own ordered levels, because a medical evidence hierarchy (RCT > cohort > case report) is not a market-research one, and forcing a single scale would misrepresent that domain-specific reality."
    why_zh: "hierarchy_levels 裡的 rank 值一定要彼此不同——形成一個嚴格全序，因為兩個層級如果並列同一個 rank，就會讓「哪個證據比較強」這個問題答不出來，這正是這個方法要防止的「來源等價化」失敗。這個方法刻意不對所有領域套用同一套通用的弱／中／強量表：每次執行都自己宣告一組有順序的層級，因為醫學證據階層（RCT > 世代研究 > 病例報告）跟市場研究的證據階層本來就不一樣，硬套同一套量表會扭曲每個領域各自的真實情況。"
    url: "https://www.cebm.ox.ac.uk/resources/levels-of-evidence/ocebm-levels-of-evidence"
    example_zh: "情境：為「使用者研究」這個領域建立自己的證據強度階層。\ndomain：「使用者研究」\nhierarchy_levels 不能是空陣列，level_id 要唯一、rank 也要唯一（整數，不能是布林值），例如 [{level_id: \"L1\", label: \"大規模對照可用性測試\", rank: 1}, {level_id: \"L2\", label: \"單次深度訪談\", rank: 2}, {level_id: \"L3\", label: \"團隊內部猜測\", rank: 3}]\nevidence_assignments 的 level_id 一定要指向上面真實存在的層級，例如 [{evidence_id: \"E-1\", level_id: \"L1\"}]\n（重點）如果 hierarchy_levels 裡有兩筆的 rank 填了同一個數字（例如都填 1），會被拒絕建立——兩個層級並列第一名，就無法回答「哪個證據比較強」這個問題。"
    example_en: "Scenario: build a domain-specific evidence-strength hierarchy for 'user research'. domain: 'User research'; hierarchy_levels cannot be an empty list, level_id must be unique and rank must be unique too (an integer, bool excluded), e.g. [{level_id: 'L1', label: 'Large-scale controlled usability testing', rank: 1}, {level_id: 'L2', label: 'A single in-depth interview', rank: 2}, {level_id: 'L3', label: 'Internal team guesswork', rank: 3}]; every evidence_assignments entry's level_id must resolve to a real level above, e.g. [{evidence_id: 'E-1', level_id: 'L1'}]. Key point: if two hierarchy_levels entries shared the same rank number (e.g. both rank 1), the record would be refused at construction -- two levels tied for first place can't answer 'which evidence is stronger'."
  epistemic.evidence_matrix:
    name_en: "Evidence Matrix"
    abbr: ""
    name_zh: "證據矩陣"
    blurb_en: "Aligns claims against evidence in a matrix (rows=claims, cols=evidence) so a weakly-supported claim is immediately visible. Use it to quickly spot which of your claims are actually under-supported."
    blurb_zh: "把主張跟證據排成矩陣（列=主張、欄=證據），一眼看出哪個主張證據薄弱。想快速看出哪些主張其實支撐不足時用。"
    why_en: "every declared claim must appear in at least one link before the record is accepted -- a claim floating in the matrix with zero evidence alignment IS the weak claim this method exists to surface, so it can never be silently accepted as part of a 'complete' matrix. This is the opposite failure mode from a dangling reference: instead of a link pointing nowhere, it's a claim nothing points to, and both are refused."
    why_zh: "每一筆宣告的 claim，在紀錄被接受之前都一定要出現在至少一個 link 裡——一個完全沒有任何證據對齊的 claim，正是這個方法要揭露的「薄弱主張」，不能悄悄被當成一份「完整」矩陣的一部分放行。這跟懸空引用是相反的失敗模式：不是 link 指向不存在的東西，而是有一個 claim 完全沒有任何 link 指向它，兩種情況都會被拒絕。"
    url: "https://www.cia.gov/resources/csi/static/Tradecraft-Primer-apr09.pdf"
    example_zh: "情境：對照「導入新定價方案會提升營收」跟「客戶會因為漲價而流失」這兩個主張各自的證據強度。\nclaims 至少 1 筆，每筆至少要有 claim_id／statement，例如 [{claim_id: \"C-1\", statement: \"導入新定價方案會提升營收\"}, {claim_id: \"C-2\", statement: \"客戶會因為漲價而流失\"}]\nevidence_items 至少 1 筆，至少要有 evidence_id，例如 [{evidence_id: \"E-1\"}, {evidence_id: \"E-2\"}]\nlinks 每筆的 claim_id／evidence_id 都要指向上面真實存在的項目，relation 只能是 SUPPORTS／CONTRADICTS／NEUTRAL 三選一，例如 [{claim_id: \"C-1\", evidence_id: \"E-1\", relation: \"SUPPORTS\"}, {claim_id: \"C-2\", evidence_id: \"E-2\", relation: \"CONTRADICTS\"}]\n（重點）如果 C-2 完全沒有出現在任何 links 裡，整筆記錄會被拒絕建立——這正是這個方法要快速抓出來的「薄弱主張」，不能讓它悄悄躲過去。"
    example_en: "Scenario: cross-check the strength of evidence behind two claims -- 'the new pricing plan will raise revenue' and 'customers will churn due to the price hike'. claims has >=1 entry with at least claim_id/statement, e.g. [{claim_id: 'C-1', statement: 'The new pricing plan will raise revenue'}, {claim_id: 'C-2', statement: 'Customers will churn due to the price hike'}]; evidence_items has >=1 entry with at least evidence_id, e.g. [{evidence_id: 'E-1'}, {evidence_id: 'E-2'}]; every links entry's claim_id/evidence_id must resolve to a real item above, relation is one of SUPPORTS/CONTRADICTS/NEUTRAL, e.g. [{claim_id: 'C-1', evidence_id: 'E-1', relation: 'SUPPORTS'}, {claim_id: 'C-2', evidence_id: 'E-2', relation: 'CONTRADICTS'}]. Key point: if C-2 never appeared in any links entry, the whole record would be refused at construction -- that's exactly the 'weak claim' this method exists to surface quickly, and it can't quietly slip through."
  epistemic.ladder_of_inference:
    name_en: "Ladder of Inference"
    abbr: ""
    name_zh: "推論階梯"
    blurb_en: "Climbs four fixed rungs -- data, meaning, assumption, conclusion -- in strict order, exposing the exact point a cognitive leap happened. Use it when someone jumped to a conclusion and you want to see where the reasoning actually broke."
    blurb_zh: "依序爬過資料→意義→假設→結論四個階梯，找出認知跳躍發生在哪一步。有人跳到結論、想看清楚推理到底哪裡斷掉時用。"
    why_en: "a higher rung may only be populated once every lower rung already is -- assumptions_made requires meanings_assigned first, and conclusions_drawn requires assumptions_made first. A conclusion recorded with no assumption or meaning rung beneath it IS the cognitive leap this method exists to expose, so skipping straight from data to conclusion is refused rather than silently stored as if the missing steps didn't matter."
    why_zh: "比較高的階梯只有在下面每一階都已經有內容時才能填——assumptions_made 要先有 meanings_assigned，conclusions_drawn 要先有 assumptions_made。一個下面完全沒有假設或意義解讀階段、卻直接記錄了結論的紀錄，正是這個方法要揭露的「認知跳躍」，所以從資料直接跳到結論會被拒絕，不會假裝中間那些步驟不重要而悄悄存起來。"
    url: "https://www.pon.harvard.edu/daily/negotiation-skills-daily/the-ladder-of-inference-a-resource-list/"
    example_zh: "情境：拆解「這位新同事一定不適合這份工作」這個結論是怎麼一步步爬上來的。\nobserved_data 至少 1 筆，例如 [\"他這週有兩次會議遲到 10 分鐘\"]\nmeanings_assigned（選填）例如 [\"他對這份工作不夠重視\"]\nassumptions_made（選填，但要填就一定要先有 meanings_assigned）例如 [\"準時是這個團隊評斷責任感的標準\"]\nconclusions_drawn（選填，但要填就一定要先有 assumptions_made）例如 [\"這位新同事不適合這份工作\"]\n（重點）如果直接跳過 meanings_assigned 跟 assumptions_made、只給 observed_data 跟 conclusions_drawn，會被拒絕建立——一個底下完全沒有意義解讀跟假設的結論，正是這個方法要抓的認知跳躍。"
    example_en: "Scenario: unpack how the conclusion 'this new colleague definitely isn't right for the job' got climbed to. observed_data has >=1 entry, e.g. ['He was 10 minutes late to two meetings this week']; meanings_assigned (optional), e.g. ['He doesn't take this job seriously enough']; assumptions_made (optional, but requires meanings_assigned first), e.g. ['Punctuality is how this team judges commitment']; conclusions_drawn (optional, but requires assumptions_made first), e.g. ['This new colleague isn't right for the job']. Key point: skipping straight from observed_data and conclusions_drawn with no meanings_assigned or assumptions_made in between is refused at construction -- a conclusion with no meaning or assumption rung beneath it is exactly the cognitive leap this method exists to catch."
  epistemic.toulmin_model:
    name_en: "Toulmin Model"
    abbr: ""
    name_zh: "圖爾敏論證模型"
    blurb_en: "Fills in Claim/Grounds/Warrant/Backing/Qualifier/Rebuttal column by column, so an argument can't skip the reasoning bridge (Warrant) between evidence and conclusion. Use it to check whether an argument actually holds together or is just a bare assertion."
    blurb_zh: "逐欄填寫主張／依據／立論理由／後盾／限定詞／反駁，防止論證缺少從證據到結論的推理橋梁。想檢查一個論證是不是真的站得住腳、還是只是空口斷言時用。"
    why_en: "warrant must be a non-blank string before the record is accepted -- it IS the reasoning bridge Atlas's own effect column names, so a claim+grounds pair with no warrant is a bare assertion wearing a Toulmin costume, not a real argument. Backing can only be populated if warrant is non-blank, checked in that order, since backing by definition supports the warrant -- backing with nothing to back is structurally incoherent, not just unusual."
    why_zh: "warrant 一定要是非空白字串才會被接受——它就是 Atlas 效益欄位講的那座推理橋梁，所以一個有 claim 跟 grounds、卻沒有 warrant 的紀錄，只是穿著 Toulmin 外衣的空泛斷言，不是真正的論證。backing 只有在 warrant 非空白時才能填，而且檢查順序就是先看這個，因為 backing 依定義是在支持 warrant——沒有 warrant 可以支持的 backing，不只是少見，而是結構上說不通。"
    url: "https://courses.lumenlearning.com/suny-englishcomp2kscopexmaster/chapter/toulmins-argument-model/"
    example_zh: "情境：用 Toulmin 模型分析「這個城市應該禁止市中心私家車通行」這個論證。\nclaim：「這個城市應該禁止市中心私家車通行」\ngrounds 至少 1 筆，例如 [\"市中心的空氣品質指數長期超標\", \"其他實施同樣政策的城市空污下降了 30%\"]\nwarrant 不能空白，例如「減少私家車流量能直接降低空氣污染，進而改善市中心空氣品質」\n（選填）backing 例如 [\"世界衛生組織的空污研究報告\"]，qualifier 例如「在配套大眾運輸到位的前提下」，rebuttal 例如「除非商業區有特殊物流需求」\n（重點）warrant 空白時整筆記錄會被拒絕建立——有主張跟理由卻沒有推理橋梁，只是一個穿著論證外衣的空泛斷言。如果 warrant 空白卻填了 backing，也會被拒絕，因為 backing 本來就是要支持 warrant，沒有 warrant 就沒有東西可以支持。"
    example_en: "Scenario: analyze the argument 'this city should ban private cars from the downtown core' using the Toulmin model. claim: 'This city should ban private cars from the downtown core'; grounds has >=1 entry, e.g. ['Downtown air quality index has chronically exceeded safe levels', 'Other cities that adopted this policy saw a 30% drop in air pollution']; warrant must be non-blank, e.g. 'Reducing private car traffic directly lowers air pollution, which improves downtown air quality'. Optional: backing e.g. ['WHO air pollution research report'], qualifier e.g. 'provided adequate public transit is in place first', rebuttal e.g. 'unless the commercial district has special logistics needs'. Key point: a blank warrant gets the whole record refused at construction -- a claim and grounds with no reasoning bridge is just a bare assertion wearing an argument's costume. Populating backing while warrant is blank is refused too, since backing exists to support the warrant, and there's nothing to support without one."

  # ---- evidence ----
  evidence.triangulation:
    name_en: "Evidence Triangulation"
    abbr: ""
    name_zh: "證據三角驗證"
    blurb_en: "Cross-references themes against a literature set to see which findings are corroborated by citable sources. Use it after qualitative coding, to check your themes against outside literature rather than resting on interview data alone."
    blurb_zh: "把主題跟文獻集合做交叉比對，看哪些發現有可引用的來源佐證。質性編碼完成後，想拿外部文獻檢驗自己的主題、不只靠訪談資料時用。"
    why_en: "A theme that only came from your own interviews could just be an artifact of who you happened to talk to; checking it against an independent literature source is Denzin's own 'methodological triangulation' logic (multiple independent sources converging is stronger evidence than one), and every finding here stays explicitly NEEDS_HUMAN_REVIEW rather than silently upgrading to a publication-ready claim, so a stale or synthetic corpus can never be mistaken for a fresh literature search."
    why_zh: "一個只從你自己訪談冒出來的主題，可能只是「剛好訪問到這些人」的產物；拿獨立的文獻來源交叉比對，就是 Denzin 講的「方法論三角驗證」邏輯（多個獨立來源互相印證，證據力比單一來源強），而且這裡每個發現都會明確標成 NEEDS_HUMAN_REVIEW，不會偷偷升級成可直接發表的定論，這樣過時或合成的文獻庫就不會被誤認成一次新鮮的文獻搜尋。"
    url: "https://pubmed.ncbi.nlm.nih.gov/25158659/"
    example_zh: "情境：質性編碼跑完後，想拿文獻檢驗主題是否有外部佐證。\n這個方法沒有自己的 record_id／provenance 頂層欄位，是直接吃 research.qualitative_coding 的 theme_set 輸出跟文獻搜尋的結果做交叉比對，用法上是「先跑編碼、再跑文獻搜尋、才跑這個」的鏈式方法，不是獨立填表單。\nthemes：要有至少 1 筆、每筆有 theme_id 或 label，例如來自質性編碼的 theme_set.themes\nliterature：要有 items（至少 1 筆、每筆有 literature_id 跟 source_kind）、以及 retrieval.mode／retrieval.status_code，例如來自文獻搜尋能力回傳的 literature 物件\n輸出的 findings［].validation_status 固定是 NEEDS_HUMAN_REVIEW，這是刻意的——本地文獻庫是離線合成語料，永遠不會自動宣稱「已驗證可發表」。"
    example_en: "Scenario: after finishing qualitative coding, checking whether the resulting themes have outside literature support. This method has no top-level record_id/provenance fields of its own -- it directly consumes research.qualitative_coding's theme_set output plus a literature-search result and cross-references them; the real usage is a chain (code first, search literature next, then this), not a standalone form. themes: needs >=1 entry, each with a theme_id or label, e.g. from qualitative coding's theme_set.themes. literature: needs items (>=1 entry, each with literature_id and source_kind) plus retrieval.mode/retrieval.status_code, e.g. the literature object returned by a literature-search capability. Every output finding's validation_status is always NEEDS_HUMAN_REVIEW by design -- the local literature corpus is an offline synthetic fixture, so it never auto-claims to be a publication-ready, verified conclusion."

  # ---- experiment (F15 experiment & validation) ----
  experiment.ab_test:
    name_en: "A/B Test"
    abbr: ""
    name_zh: "A/B 測試"
    blurb_en: "Randomly compares two versions with a pre-registered metric and sample size, avoiding peeking and p-hacking. Use it for the most reliable causal evidence when you can run a controlled comparison."
    blurb_zh: "隨機比較兩個版本，事先登記好指標與樣本數，避免偷看結果、多重檢定造假。能做對照實驗、想要最可靠因果證據時用。"
    why_en: "registered_at must be strictly earlier than analyzed_at -- Atlas's own explicit warning names 'peeking' as an anti-pattern; a hypothesis/metric/sample-size locked only after (or at the same instant as) the analysis is a post-hoc rationalization of the interim results, not a pre-registered test. primary_metric must also be genuinely distinct from every guardrail_metrics entry -- the metric that decides the outcome can't also be listed as a mere guardrail."
    why_zh: "registered_at 一定要嚴格早於 analyzed_at——Atlas 自己明講的警告把「偷看結果」（peeking）列為反樣式；一個直到分析之後（或同一時刻）才鎖定的假設／指標／樣本數，是對中途結果的事後合理化，不是真正的預先註冊實驗。primary_metric 也一定要跟每個 guardrail_metrics 項目真正不同——決定結果的關鍵指標不能同時被列為只是護欄指標。"
    url: "https://en.wikipedia.org/wiki/A/B_testing"
    example_zh: "情境：測試把 CTA 按鈕改成綠色是否提升點擊率。\nhypothesis：「將 CTA 按鈕改成綠色會提升點擊率」\nprimary_metric：「CTA 點擊率」\nguardrail_metrics：[\"頁面停留時間\", \"跳出率\"]\nsample_size_per_arm：5000\nrandomization_unit：「使用者 ID」\nregistered_at：「2026-08-01T00:00:00Z」\nanalyzed_at：「2026-08-15T00:00:00Z」\ndecision：「SHIP」\n（重點）如果 registered_at 填得比 analyzed_at 晚（例如先看到結果才回頭補寫假設），會被拒絕建立——這正是 Atlas 警告的「偷看」反樣式，不是真正的預先註冊。"
    example_en: "Scenario: testing whether changing the CTA button to green increases click-through rate. hypothesis: 'changing the CTA button to green increases click-through rate'; primary_metric: 'CTA click-through rate'; guardrail_metrics: ['time on page', 'bounce rate']; sample_size_per_arm: 5000; randomization_unit: 'user ID'; registered_at: '2026-08-01T00:00:00Z'; analyzed_at: '2026-08-15T00:00:00Z'; decision: 'SHIP'. Key point: if registered_at were later than analyzed_at (e.g. the hypothesis was written after seeing the results), the record would be refused at construction -- that's exactly the 'peeking' anti-pattern Atlas warns against, not a genuine pre-registered test."
  experiment.benchmark:
    name_en: "Benchmark"
    abbr: ""
    name_zh: "標竿比較"
    blurb_en: "Compares candidates against a baseline/competitor under a fixed workload and environment, all candidates scored on exactly the same metric set. Use it to choose a technology or vendor without relying on impressions."
    blurb_zh: "在固定的工作負載與環境下，跟基準／競品比較，所有候選都用同一組指標評分。避免憑印象選型時用。"
    why_en: "every candidate's results must cover EXACTLY the declared metrics set, no missing metric and no extra metric -- Atlas's own pipeline says 'fixed... metrics', and a candidate scored on a different metric set is exactly the 'choosing by impression' this method's own benefit column exists to prevent. At least 2 candidates are also required -- a benchmark of 1 candidate has nothing to compare against."
    why_zh: "每個候選方案的 results 一定要剛好涵蓋宣告的 metrics 集合，不能缺一個也不能多一個——Atlas 自己的管線講的是「固定的…指標」，一個用不同指標集合評分的候選方案，正是這個方法的效益欄要防止的「憑印象選型」。也一定要至少 2 個候選方案——只有 1 個候選方案的基準測試沒有東西可以比較。"
    url: "https://www.browserstack.com/guide/benchmark-testing"
    example_zh: "情境：比較兩種訂單匯入方案的效能。\nworkload：{description:\"處理 10 萬筆訂單匯入\", parameters:{batch_size:1000}}\nenvironment：{description:\"單台 8 核 32GB 測試機\"}\nmetrics：[\"處理總耗時(秒)\", \"記憶體峰值(MB)\"]\ncandidates：[{candidate_id:\"C1\", label:\"方案A：批次寫入\", results:{\"處理總耗時(秒)\":42, \"記憶體峰值(MB)\":850}}, {candidate_id:\"C2\", label:\"方案B：逐筆寫入\", results:{\"處理總耗時(秒)\":118, \"記憶體峰值(MB)\":320}}]\n（重點）如果 C2 的 results 只填了「處理總耗時(秒)」，漏掉「記憶體峰值(MB)」，會被拒絕建立——每個候選方案都要用完全一樣的指標集合評分，不能各憑印象各評各的。"
    example_en: "Scenario: comparing two order-import approaches' performance. workload: {description:'importing 100k orders', parameters:{batch_size:1000}}; environment: {description:'single 8-core 32GB test machine'}; metrics: ['total processing time (sec)', 'peak memory (MB)']; candidates: [{candidate_id:'C1', label:'Approach A: batch writes', results:{'total processing time (sec)':42, 'peak memory (MB)':850}}, {candidate_id:'C2', label:'Approach B: row-by-row writes', results:{'total processing time (sec)':118, 'peak memory (MB)':320}}]. Key point: if C2's results only reported 'total processing time (sec)' and omitted 'peak memory (MB)', the record would be refused at construction -- every candidate must be scored on exactly the same metric set, not each judged by a different impression."
  experiment.concierge_test:
    name_en: "Concierge Test"
    abbr: ""
    name_zh: "門房測試"
    blurb_en: "Manually delivers the service by hand (zero automation) and measures real usage/willingness-to-pay before building anything. Use it to validate value before you automate."
    blurb_zh: "人工先提供服務（完全不自動化），量測真實使用意願／付費意願再決定要不要蓋。先驗證價值再自動化時用。"
    why_en: "manual_delivery.automation_components must be an empty list -- Atlas's own 'manual' half is a scope to enumerate and check is empty, not a label to merely assert; a record declaring even one automation component was not manually delivered. At least 1 measured usage/willingness-to-pay signal is also required -- a concierge test with zero measured signal never validated anything, it's just doing the work by hand with no falsification test attached."
    why_zh: "manual_delivery.automation_components 一定要是空清單——Atlas 自己講的「人工」不是一個可以隨口宣稱的標籤，而是一個要列舉出來、然後檢查真的是空的範圍；一個宣告了任何一項自動化元件的記錄，就不算真的人工提供服務。也至少要有 1 筆測量到的使用量／付費意願訊號——一個沒有任何測量訊號的服務式測試，什麼都沒驗證到，只是徒手做了工作，沒有真正附上一個可以證偽的測試。"
    url: "https://umbrex.com/resources/frameworks/product-management-frameworks/concierge-mvp/"
    example_zh: "情境：先用人工方式幫顧客規劃每週健身菜單，驗證是否有真實需求。\nservice_description：「幫顧客手動規劃每週健身菜單」\nmanual_delivery：{delivered_by:\"創辦人本人\", automation_components:[]}\nmeasurements：[{metric_type:\"USAGE_COUNT\", value:23, unit:\"人\", sample_size:30, measured_at:\"2026-08-30T00:00:00Z\"}]\n（重點）如果 automation_components 填了 [\"自動寄送 Email 提醒\"]，會被拒絕建立——只要有任何一項自動化元件，就不算是先用純人工驗證價值，違背這個方法「先驗證價值再自動化」的核心。"
    example_en: "Scenario: manually planning weekly fitness menus for customers to validate real demand first. service_description: 'manually planning a weekly fitness menu for each customer'; manual_delivery: {delivered_by:'the founder personally', automation_components:[]}; measurements: [{metric_type:'USAGE_COUNT', value:23, unit:'people', sample_size:30, measured_at:'2026-08-30T00:00:00Z'}]. Key point: if automation_components listed ['automated email reminders'], the record would be refused at construction -- even one automation component breaks the 'validate value manually before automating' core of this method."
  experiment.fake_door:
    name_en: "Fake Door"
    abbr: ""
    name_zh: "假門測試"
    blurb_en: "Puts up a call-to-action for a feature that doesn't exist yet, discloses that it's not available, and measures click interest. Use it as a low-cost way to quantify demand before building."
    blurb_zh: "放一個還沒做出來的功能入口，點了會告知尚未開放，量測點擊興趣。低成本量化需求時用。"
    why_en: "disclosure_shown must be exactly True and disclosure_text non-empty -- Atlas's own pipeline stage 'disclose: not yet available' is mandatory, not optional narrative color; a Fake Door that lets a user believe a feature is real and available is dark-pattern deception, not a validated demand experiment. click_count must also be <= impression_count -- a click count exceeding its own impression count isn't a measurement of anything real."
    why_zh: "disclosure_shown 一定要剛好是 True，且 disclosure_text 一定要非空——Atlas 自己的管線階段「告知尚未開放」是強制的，不是可有可無的敘事裝飾；一個讓使用者誤以為功能真實存在且可用的 Fake Door，是暗黑模式的欺騙，不是一個有效的需求驗證實驗。click_count 也一定要小於等於 impression_count——點擊數超過曝光數，不是一個真實的測量結果。"
    url: "https://amplitude.com/explore/experiment/fake-door-testing"
    example_zh: "情境：測試「匯出成 Notion 格式」這個功能的真實需求。\nfeature_under_test：「匯出成 Notion 格式」\ncta_copy：「匯出成 Notion（點我試試）」\ndisclosure_shown：true\ndisclosure_text：「此功能尚未開放，感謝登記，上線會通知您」\nimpression_count：3200\nclick_count：210\n（重點）如果 disclosure_shown 填 false（點擊後沒有告知功能尚未開放），會被拒絕建立——不告知使用者功能不存在，是暗黑模式的欺騙，不是正當的需求驗證實驗。"
    example_en: "Scenario: testing real demand for an 'export to Notion' feature. feature_under_test: 'export to Notion format'; cta_copy: 'Export to Notion (click to try)'; disclosure_shown: true; disclosure_text: 'This feature is not yet available -- thanks for your interest, we'll notify you at launch'; impression_count: 3200; click_count: 210. Key point: if disclosure_shown were false (clicking gave no notice that the feature isn't available), the record would be refused at construction -- not disclosing that the feature doesn't exist is dark-pattern deception, not a legitimate demand experiment."
  experiment.mvp:
    name_en: "Minimum Viable Product"
    abbr: "MVP"
    name_zh: "最小可行產品"
    blurb_en: "Builds the least amount needed to get evidence that could actually change a decision -- not a worse version of the final product. Use it to shorten your learning cycle on a critical assumption."
    blurb_zh: "做出最少的東西，換取足以改變決策的證據——不是把正式產品做爛一點。想縮短學習週期、驗證核心價值時用。"
    why_en: "decision_threshold.decision_if_met must differ from decision_if_not_met -- Atlas's own 'what is the least you can do to get evidence sufficient to CHANGE A DECISION?' is meaningless if both arms of the threshold lead to the same action, exactly the 'making the real product slightly worse' anti-pattern this method's own section names. outcome.metric_met/decision_taken are never caller-supplied -- they're mechanically recomputed from real_usage_result against decision_threshold, so a pre-registered rule decides, never a narrative override."
    why_zh: "decision_threshold.decision_if_met 一定要跟 decision_if_not_met 不同——Atlas 自己講的「正確問題」（最少做什麼才能拿到足以改變決策的證據？）如果門檻兩邊都導向同一個行動，這個問題就沒有意義，正是這個方法自己講的「把正式產品做爛一點」反樣式。outcome.metric_met／decision_taken 從來不是呼叫端能自己填的——永遠是從 real_usage_result 對照 decision_threshold 機械算出來的，讓預先註冊的規則來決定，不是事後的敘事覆蓋。"
    url: "https://en.wikipedia.org/wiki/Minimum_viable_product"
    example_zh: "情境：驗證用戶是否真的願意持續使用自動記帳功能。\ncritical_assumption：{statement:\"用戶會願意每週至少使用一次自動記帳功能\", falsifiable_if:\"4 週內活躍使用率低於 20%\"}\ndecision_threshold：{metric:\"週活躍使用率\", target_value:0.2, comparison:\"GTE\", decision_if_met:\"投入資源打磨並正式上線\", decision_if_not_met:\"停止開發，訪談使用者了解原因\"}\nreal_usage_result：{actual_value:0.35, real_users_count:150, usage_context:\"4 週封測\"}\noutcome 不用也不能自己填，系統會自動算出 metric_met:true（0.35≥0.2）、decision_taken:\"投入資源打磨並正式上線\"。\n（重點）如果 decision_if_met 跟 decision_if_not_met 填成一樣的內容，會被拒絕建立——門檻兩邊都導向同一個行動，根本無法真的改變任何決策。"
    example_en: "Scenario: validating whether users actually keep using an auto-bookkeeping feature. critical_assumption: {statement:'users will use the auto-bookkeeping feature at least weekly', falsifiable_if:'4-week active usage rate falls below 20%'}; decision_threshold: {metric:'weekly active usage rate', target_value:0.2, comparison:'GTE', decision_if_met:'invest resources to polish and launch', decision_if_not_met:'stop development and interview users about why'}; real_usage_result: {actual_value:0.35, real_users_count:150, usage_context:'4-week closed beta'}. outcome is never supplied directly -- the system computes metric_met:true (0.35>=0.2) and decision_taken:'invest resources to polish and launch' automatically. Key point: if decision_if_met and decision_if_not_met were the same text, the record would be refused at construction -- a threshold whose two arms lead to the same action can't actually change any decision."
  experiment.pilot:
    name_en: "Pilot"
    abbr: ""
    name_zh: "試點計畫"
    blurb_en: "Runs a small-scale real trial with success/stop/rollback criteria defined BEFORE it starts (mandatory). Use it to reduce the blast radius of a full rollout."
    blurb_zh: "小規模真實試行，開始前一定要先定義成功／停止／回滾標準。想降低全面上線的爆炸半徑時用。"
    why_en: "success_criteria, stop_criteria, and rollback_criteria must each be a non-empty list -- Atlas's own explicit MANDATORY rule ('Success/Stop/Rollback criteria MUST be defined before the pilot starts') made structural, deliberately not diluted to a recommendation. A pilot record cannot be constructed at all unless all three are declared."
    why_zh: "success_criteria／stop_criteria／rollback_criteria 都一定要是非空清單——Atlas 自己明講的強制規則（「Pilot 開始前必須定義 Success/Stop/Rollback criteria」）被變成結構限制，刻意不稀釋成「建議」。只要三者有任何一個沒宣告，就完全無法建立這筆試行記錄。"
    url: "https://www.quickbase.com/blog/conducting-a-pilot-may-be-the-best-bet-for-project-success"
    example_zh: "情境：在 2 個分店試行新排班系統。\nscope：{description:\"在 2 個分店試行新排班系統\", boundaries:[\"僅限台北兩間分店\", \"為期 6 週\"]}\nsuccess_criteria：[\"員工排班衝突投訴減少 50%\"]\nstop_criteria：[\"任何一週出現無人排班的班次\"]\nrollback_criteria：[\"系統當機超過 4 小時\"]\nmonitoring_metrics：[\"每週排班衝突次數\", \"系統可用率\"]\n（重點）如果 rollback_criteria 留空清單（沒定義回滾條件），會被拒絕建立——Atlas 明講三個條件都是強制的，缺一個都不能開始試行。"
    example_en: "Scenario: piloting a new scheduling system at 2 store locations. scope: {description:'pilot the new scheduling system at 2 store locations', boundaries:['limited to 2 Taipei locations', '6-week duration']}; success_criteria: ['staff scheduling-conflict complaints drop 50%']; stop_criteria: ['any week with an unstaffed shift']; rollback_criteria: ['system downtime exceeding 4 hours']; monitoring_metrics: ['weekly scheduling conflict count', 'system uptime']. Key point: if rollback_criteria were an empty list (no rollback conditions defined), the record would be refused at construction -- Atlas explicitly makes all three criteria mandatory, and missing even one means the pilot can't be started."
  experiment.proof_of_concept:
    name_en: "Proof of Concept"
    abbr: ""
    name_zh: "概念驗證"
    blurb_en: "Runs an isolated (non-production) implementation against a pre-defined benchmark to falsify a technical-feasibility assumption. Use it to remove technical unknowns before committing to a build."
    blurb_zh: "用一個獨立於正式環境的實作，對照事先定義的標準驗證技術是否可行。想先排除技術未知數再投入時用。"
    why_en: "implementation.isolated must be true AND production_integration must be false -- Atlas's own pipeline names 'isolated implementation' as a distinct stage before 'benchmark'; a PoC silently wired into production has already committed before the technical unknown is resolved, exactly the opposite of resolving the unknown FIRST. feasibility_verdict is never caller-supplied either -- it's mechanically recomputed from benchmark_result against success_criteria, so the benchmark number decides, not a narrative claim of feasibility."
    why_zh: "implementation.isolated 一定要是 true，且 production_integration 一定要是 false——Atlas 自己的管線把「獨立實作」列為「benchmark」之前的獨立階段；一個悄悄接進正式環境的 PoC，等於在技術未知數還沒解決之前就先做了承諾，正好違背「先去除技術未知」的順序。feasibility_verdict 也從來不是呼叫端能自己填的——永遠是從 benchmark_result 對照 success_criteria 機械算出來的，讓 benchmark 的數字來決定，不是敘事上宣稱可行。"
    url: "https://en.wikipedia.org/wiki/Proof_of_concept"
    example_zh: "情境：驗證現有向量資料庫能否在 100ms 內完成百萬級向量相似度搜尋。\ntechnical_unknown：{statement:\"不確定現有向量資料庫能否在 100ms 內處理百萬級向量的相似度搜尋\"}\nsuccess_criteria：{metric:\"查詢延遲(ms)\", threshold:100, comparison:\"LTE\"}\nimplementation：{description:\"在獨立測試環境載入 100 萬筆向量做查詢測試\", isolated:true, production_integration:false}\nbenchmark_result：{measured_value:78, environment:\"獨立測試環境，16GB RAM\", methodology:\"連續執行 1000 次查詢取平均值\"}\nfeasibility_verdict 不用也不能自己填，系統會自動算成 true（78 ≤ 100）。\n（重點）如果 implementation.isolated 填 false（代表接進了正式環境），會被拒絕建立——PoC 一定要獨立於正式環境，不能在技術未知數還沒解決前就先接上 production。"
    example_en: "Scenario: validating whether an existing vector database can complete million-scale similarity search within 100ms. technical_unknown: {statement:'unsure whether the current vector database can handle million-scale similarity search within 100ms'}; success_criteria: {metric:'query latency (ms)', threshold:100, comparison:'LTE'}; implementation: {description:'loaded 1 million vectors in an isolated test environment for query testing', isolated:true, production_integration:false}; benchmark_result: {measured_value:78, environment:'isolated test environment, 16GB RAM', methodology:'averaged over 1000 consecutive query runs'}. feasibility_verdict is never supplied directly -- the system computes it as true (78 <= 100) automatically. Key point: if implementation.isolated were false (meaning it was wired into production), the record would be refused at construction -- a PoC must stay isolated from production, it can't be connected before the technical unknown is resolved."
  experiment.prototype:
    name_en: "Prototype"
    abbr: ""
    name_zh: "原型測試"
    blurb_en: "Tests a concept/interaction with a low-fidelity build and real user observation, iterating from actual feedback. Use it to find problems cheaply before building the real thing."
    blurb_zh: "用低保真原型測試概念／互動，依真實使用者觀察迭代。想低成本先發現問題再動工時用。"
    why_en: "fidelity.level must be LOW or MEDIUM, never HIGH -- Atlas's own text says 'low-fidelity'; a 'prototype' built at high fidelity is a full-cost build, not a cheap test of an interaction assumption. Every iteration's triggered_by_observation_index must also resolve to a real user_test.observations[] entry -- an 'iterated based on user feedback' claim with no real observation behind it is exactly the unfalsifiable, AI-narrated confidence this family's core principle exists to refuse."
    why_zh: "fidelity.level 一定要是 LOW 或 MEDIUM，絕對不能是 HIGH——Atlas 自己的文字講的是「低保真」；一個做成高保真的「原型」其實是全成本的建置，不是一個便宜測試互動假設的東西。每個 iteration 的 triggered_by_observation_index 也一定要對應到 user_test.observations[] 裡真實存在的項目——一個「根據使用者回饋迭代」卻背後沒有真實觀察支撐的宣稱，正是這個家族的核心原則要拒絕的、無法證偽的 AI 敘事式自信。"
    url: "https://www.nngroup.com/articles/ux-prototype-hi-lo-fidelity/"
    example_zh: "情境：測試使用者能否理解新的三步驟結帳流程。\nlearning_goal：{statement:\"使用者能否理解新的三步驟結帳流程\", falsifiable_if:\"超過一半的測試者在第二步卡住超過 30 秒\"}\nfidelity：{level:\"LOW\", rationale:\"用紙本線框稿測試，不做可互動介面\"}\nuser_test：{method:\"5 人可用性測試\", participant_count:5, observations:[\"3 位使用者在第二步不確定該按哪個按鈕\", \"1 位使用者誤以為已經完成付款\"]}\niterations：[{change:\"把第二步的按鈕文字改成更明確的『確認付款』\", triggered_by_observation_index:0}]\n（重點）如果 iterations 的 triggered_by_observation_index 填成 99（user_test.observations 根本沒有第 99 筆），會被拒絕建立——每次迭代都要真的連結到一筆實際觀察，不能憑空宣稱「根據回饋調整」。"
    example_en: "Scenario: testing whether users understand a new 3-step checkout flow. learning_goal: {statement:'can users understand the new 3-step checkout flow', falsifiable_if:'more than half of testers get stuck for over 30 seconds on step 2'}; fidelity: {level:'LOW', rationale:'tested with paper wireframes, no interactive UI built'}; user_test: {method:'5-person usability test', participant_count:5, observations:['3 users were unsure which button to press on step 2', '1 user mistakenly thought payment was already complete']}; iterations: [{change:\"changed step 2's button text to the clearer 'Confirm Payment'\", triggered_by_observation_index:0}]. Key point: if an iteration's triggered_by_observation_index were 99 (user_test.observations has no 99th entry), the record would be refused at construction -- every iteration must actually connect to a real observation, it can't just claim to be 'based on feedback' out of thin air."
  experiment.smoke_test:
    name_en: "Smoke Test"
    abbr: ""
    name_zh: "煙霧測試（市場）"
    blurb_en: "Tests market demand before building, via a landing page/ad/offer against a pre-registered signup/preorder threshold. Use it to quickly validate demand before writing any code."
    blurb_zh: "還沒動工前用 landing page／廣告／優惠測市場，對照事先定好的註冊／預購門檻。想快速驗證需求、還沒開始寫程式前用。"
    why_en: "decision must equal 'GO' when measured_signups >= threshold and 'NO_GO' otherwise -- the decision is the mechanical consequence of the pre-registered rule applied to the real measurement, never a separate assertion a caller could set independently of the data. threshold_declared_at must also be strictly earlier than measured_at -- a threshold declared after the measurement is a post-hoc rationalization, not a real go/no-go bar."
    why_zh: "decision 一定要在 measured_signups ≥ threshold 時是「GO」，否則是「NO_GO」——這個決定是預先註冊的規則套用到真實測量結果後的機械結果，不是呼叫端可以脫離數據自己另外宣稱的東西。threshold_declared_at 也一定要嚴格早於 measured_at——一個在測量之後才宣告的門檻，是事後合理化，不是真正的 go/no-go 判斷標準。"
    url: "https://help.glidr.io/en/articles/1648431-landing-page-smoke-test"
    example_zh: "情境：用預購頁面測試智慧澆花器的市場需求。\noffer_description：「智慧澆花器預購頁面」\nsignup_or_preorder_threshold：200\nthreshold_declared_at：「2026-07-01T00:00:00Z」\nmeasured_signups：340\nmeasured_at：「2026-07-31T00:00:00Z」\ndecision：「GO」\n（重點）如果 measured_signups 是 340（超過門檻 200），卻把 decision 填成「NO_GO」，會被拒絕建立——決定一定要是門檻規則套用到真實數字後的機械結果，不能自己另外宣稱一個跟數據矛盾的結論。"
    example_en: "Scenario: testing market demand for a smart plant-watering device using a pre-order landing page. offer_description: 'smart plant-watering device pre-order page'; signup_or_preorder_threshold: 200; threshold_declared_at: '2026-07-01T00:00:00Z'; measured_signups: 340; measured_at: '2026-07-31T00:00:00Z'; decision: 'GO'. Key point: if measured_signups were 340 (above the 200 threshold) but decision were set to 'NO_GO', the record would be refused at construction -- the decision must be the mechanical result of applying the threshold rule to the real number, not a separately asserted conclusion that contradicts the data."
  experiment.technical_spike:
    name_en: "Technical Spike"
    abbr: ""
    name_zh: "技術試探"
    blurb_en: "A time-boxed investigation into a technical unknown, ending in a decision note. Use it to raise your estimation confidence before committing to a schedule."
    blurb_zh: "限時研究一個技術未知數，最後留下決策筆記。想在排期前提升估算可信度時用。"
    why_en: "decision_note.decided_at must fall within the spike's own actual [started_at, closed_at] window -- a decision recorded before the spike started or long after it closed is not the spike's own terminating act, it's a disconnected afterthought. The timebox itself must also be genuinely kept: deadline strictly after started_at, and the actual closed_at within [started_at, deadline] -- declaring a timebox and then blowing past it is the same failure this method's own estimation-credibility benefit exists to prevent."
    why_zh: "decision_note.decided_at 一定要落在這次 spike 自己實際的 [started_at, closed_at] 時間窗內——一個在 spike 開始前或結束很久之後才記錄的決定，不算是這次 spike 自己的收尾動作，只是一個脫節的事後想法。timebox 本身也一定要真的被遵守：deadline 要嚴格晚於 started_at，而實際的 closed_at 要落在 [started_at, deadline] 之內——宣告了時限卻超時，正是這個方法自己講的「提升估算可信度」這個效益要防止的失敗。"
    url: "https://www.mountaingoatsoftware.com/blog/spikes"
    example_zh: "情境：用限時研究釐清能否在 3 天內把推薦引擎換成向量搜尋。\nquestion：「能不能在 3 天內把現有推薦引擎換成向量搜尋而不影響現有 API 介面？」\ntimebox：{started_at:\"2026-09-01T09:00:00Z\", deadline:\"2026-09-04T09:00:00Z\", closed_at:\"2026-09-03T17:00:00Z\"}\nfindings：[{source_type:\"EXPERIMENT\", summary:\"實測向量搜尋回傳格式需要額外轉換層，多花 1 天\"}]\ndecision_note：{decision:\"採用向量搜尋，但排程延後 1 天\", rationale:\"轉換層工作量可控，技術風險已釐清\", decided_at:\"2026-09-03T16:00:00Z\"}\n（重點）如果 decision_note.decided_at 填成 spike 結束後一週（超出 [started_at, closed_at] 這個實際時間窗），會被拒絕建立——決定一定要是這次 spike 自己收尾當下做的，不能是脫節的事後補記。"
    example_en: "Scenario: a time-boxed spike to determine whether the recommendation engine can be switched to vector search within 3 days. question: 'can the recommendation engine be switched to vector search within 3 days without breaking the existing API?'; timebox: {started_at:'2026-09-01T09:00:00Z', deadline:'2026-09-04T09:00:00Z', closed_at:'2026-09-03T17:00:00Z'}; findings: [{source_type:'EXPERIMENT', summary:'testing showed vector search output needs an extra conversion layer, adding 1 day'}]; decision_note: {decision:'adopt vector search, but push the schedule back 1 day', rationale:'the conversion-layer effort is manageable and the technical risk is now clear', decided_at:'2026-09-03T16:00:00Z'}. Key point: if decision_note.decided_at were a week after the spike closed (outside the actual [started_at, closed_at] window), the record would be refused at construction -- the decision must be this spike's own closing act, not a disconnected afterthought."
  experiment.wizard_of_oz:
    name_en: "Wizard of Oz"
    abbr: ""
    name_zh: "綠野仙蹤測試"
    blurb_en: "Presents a front end that looks automated while a human secretly operates the backend, validating an interaction before building the real system. Use it to test whether people even want the interaction, before investing in automation."
    blurb_zh: "前台看起來自動化，後台其實是真人操作，驗證互動而不用先蓋完整系統。想先確認大家真的需要這個互動，再投資自動化時用。"
    why_en: "front_end.presented_as_automated and back_end.actually_human_operated must both be literally True -- Wizard of Oz specifically tests an interaction that looks automated while a human runs it; without both flags true, a record isn't testing that contrast (Concierge Test, by comparison, has no automated-looking front end at all). disclosure.faked_components must also name at least one faked component -- a 'Wizard of Oz test' that never records which parts are faked is structurally indistinguishable from simply shipping a fake feature with no test attached."
    why_zh: "front_end.presented_as_automated 跟 back_end.actually_human_operated 一定都要剛好是 true——Wizard of Oz 專門測試「看起來自動化、但背後是真人操作」這個對比；只要有一個不是 true，這筆記錄就沒有真的在測試那個對比（相較之下，Concierge Test 根本沒有看起來自動化的前台）。disclosure.faked_components 也一定要至少列出一項偽裝的元件——一個從不記錄「哪些部分是偽裝的」的「Wizard of Oz 測試」，在結構上跟直接出貨一個假功能、完全沒有附上測試沒有兩樣。"
    url: "https://en.wikipedia.org/wiki/Wizard_of_Oz_experiment"
    example_zh: "情境：測試 AI 客服聊天機器人是否能有效回答退換貨問題（實際由真人假扮）。\ninteraction_description：「AI 客服聊天機器人回答退換貨問題」\nfront_end：{presented_as_automated:true, description:\"使用者看到的是即時聊天視窗，介面標示『AI 助理』\"}\nback_end：{actually_human_operated:true, operator_role:\"客服專員\", description:\"專員在後台即時手動輸入回覆，偽裝成 AI 回應\"}\ndisclosure：{faked_components:[\"AI 自動回覆\"], real_components:[\"聊天視窗 UI\", \"訊息即時傳遞\"], disclosed_to:\"WILL_DISCLOSE_TO_USER_AT_STUDY_END\"}\n（重點）如果 back_end.actually_human_operated 填 false（宣稱後台真的是自動化的），會被拒絕建立——那樣就只是宣稱做出了一個真正的自動化功能，不是在測試「看起來自動化、其實真人操作」這個對比。"
    example_en: "Scenario: testing whether an 'AI' customer-service chatbot can effectively handle return/exchange questions (actually a human posing as the bot). interaction_description: 'AI customer-service chatbot answering return/exchange questions'; front_end: {presented_as_automated:true, description:\"users see a live chat window labeled 'AI Assistant'\"}; back_end: {actually_human_operated:true, operator_role:'customer service rep', description:'the rep types replies live in the backend, disguised as AI responses'}; disclosure: {faked_components:['AI auto-reply'], real_components:['chat window UI', 'real-time message delivery'], disclosed_to:'WILL_DISCLOSE_TO_USER_AT_STUDY_END'}. Key point: if back_end.actually_human_operated were false (claiming the backend really is automated), the record would be refused at construction -- that would just be claiming to have shipped a real automated feature, not testing the 'looks automated but a human runs it' contrast."

  # ---- feasibility (F14 feasibility & economics) ----
  feasibility.break_even:
    name_en: "Break-even Analysis"
    abbr: ""
    name_zh: "損益兩平分析"
    blurb_en: "Computes the volume at which fixed cost is exactly covered by contribution margin. Use it to know the minimum volume a plan needs before it stops losing money."
    blurb_zh: "算出固定成本剛好被邊際貢獻打平所需的銷售量。想知道一個方案最少要賣多少才不虧錢時用。"
    why_en: "contribution_margin_per_unit must be strictly greater than zero -- a zero or negative per-unit margin means no finite sales volume ever breaks even, so the method refuses to compute a break_even_volume_units rather than return a nonsense negative or undefined number. break_even_volume_units is never a caller-supplied field either -- it's always fixed_cost divided by contribution_margin_per_unit, so a caller can't just assert a rosier minimum-viable-scale number than the real ratio produces."
    why_zh: "contribution_margin_per_unit 一定要嚴格大於零——如果每單位邊際貢獻是零或負的，代表不管賣多少量都不可能損益兩平，所以這個方法會直接拒絕算出 break_even_volume_units，而不是回傳一個沒意義的負數或無法定義的答案。break_even_volume_units 也不是呼叫端能直接給值的欄位——永遠是 fixed_cost 除以 contribution_margin_per_unit 算出來的，呼叫端不能憑空宣稱一個比真實比例更樂觀的最低可行規模。"
    url: "https://corporatefinanceinstitute.com/resources/accounting/break-even-analysis/"
    example_zh: "情境：評估一項新產品要賣多少件才不虧錢。\nsubject_ref：「新產品 X 損益兩平評估」\nfixed_cost（固定成本，如租金＋固定人力）：50000\ncontribution_margin_per_unit（每件邊際貢獻＝售價－變動成本，如 100－75）：25\n（重點）break_even_volume_units 不用也不能自己填，系統會自動算成 2000（50000÷25）。如果 contribution_margin_per_unit 填 0 或負數，例如變動成本已經超過售價，會被拒絕建立——因為不管賣多少件都不可能打平，不是一個可以算出來的答案。"
    example_en: "Scenario: how many units a new product must sell before it stops losing money. subject_ref: 'Break-even assessment for new product X'; fixed_cost (rent + fixed staffing): 50000; contribution_margin_per_unit (price minus variable cost per unit, e.g. 100-75): 25. Key point: break_even_volume_units is never supplied directly -- the system computes it automatically as 2000 (50000/25). If contribution_margin_per_unit were 0 or negative (variable cost already exceeds price), the record would be refused at construction -- no sales volume, however large, would ever break even, so it isn't a computable answer."
  feasibility.cost_benefit_analysis:
    name_en: "Cost-Benefit Analysis"
    abbr: ""
    name_zh: "成本效益分析"
    blurb_en: "Monetizes and compares alternatives' costs and benefits over their lifecycle, with discounting and sensitivity required, and non-monetizable items explicitly marked rather than fake-priced. Use it to compare options in dollar terms while being honest about what can't be priced."
    blurb_zh: "把方案的成本與效益貨幣化後全生命週期比較，一定要做折現與敏感度分析，無法定價的項目要明確標示，不能硬掰一個數字。用金額比較選項、又想誠實面對算不出價格的東西時用。"
    why_en: "every alternative's discount_rate/sensitivity_analysis/distributional_effects are all required fields -- Atlas's own '需 discounting、sensitivity、distributional effects' rule made structural, so a caller can't skip any of the three and still construct a record. Each cost/benefit item's non_monetizable flag is coupled to its value field in both directions: non_monetizable:true REQUIRES value: null (refusing exactly the fake precise price on an unpriceable factor Atlas warns against), and non_monetizable:false REQUIRES a real numeric value (a priceable item can't be left unpriced either)."
    why_zh: "每個 alternative 的 discount_rate／sensitivity_analysis／distributional_effects 都是必填欄位——把 Atlas 自己講的「需 discounting、sensitivity、distributional effects」變成結構限制，呼叫端不能三個裡面漏填任何一個還建立成功。每個成本／效益項目的 non_monetizable 標記跟 value 欄位雙向綁定：non_monetizable:true 一定要 value: null（拒絕 Atlas 警告的「幫算不出價格的東西硬掰一個假精準價格」），non_monetizable:false 則一定要有真實數字（可以定價的項目也不能不定價）。"
    url: "https://clintonwhitehouse5.archives.gov/OMB/circulars/a094/a094.html"
    example_zh: "情境：比較「自建 CRM」vs「採購 SaaS CRM」兩個方案。\nalternatives 至少 1 筆，例如 ALT-BUILD：costs=[{id:\"C1\", description:\"自建開發人力 12 個月\", value:800000, non_monetizable:false}]；benefits=[{id:\"B1\", description:\"系統客製化彈性\", value:null, non_monetizable:true}, {id:\"B2\", description:\"3 年累計節省授權費\", value:600000, non_monetizable:false}]；discount_rate:0.08；sensitivity_analysis：「若開發延遲 3 個月，成本增加約 15%」；distributional_effects：「開發團隊工時增加，客服團隊短期無影響」\n（重點）如果把 B1（已標記 non_monetizable:true）的 value 填成 100 而不是 null，會被拒絕建立——不能幫一個自己說「無法定價」的效益硬塞一個假精準數字。反過來，如果 B2（non_monetizable:false）的 value 填 null，也會被拒絕——可以定價的項目不能不定價。"
    example_en: "Scenario: comparing 'build CRM in-house' vs 'buy a SaaS CRM'. alternatives needs >=1 entry, e.g. ALT-BUILD: costs=[{id:'C1', description:'12 months in-house dev', value:800000, non_monetizable:false}]; benefits=[{id:'B1', description:'customization flexibility', value:None, non_monetizable:true}, {id:'B2', description:'3-year cumulative license savings', value:600000, non_monetizable:false}]; discount_rate:0.08; sensitivity_analysis: 'If development slips 3 months, cost rises ~15%'; distributional_effects: 'Dev team workload rises, support team unaffected short-term'. Key point: if B1 (flagged non_monetizable:true) had value:100 instead of null, the record would be refused at construction -- you can't force a fake precise number onto a benefit you've just declared unpriceable. Conversely, if B2 (non_monetizable:false) had value:null, that's also refused -- a priceable item can't be left unpriced."
  feasibility.cost_effectiveness:
    name_en: "Cost-Effectiveness"
    abbr: ""
    name_zh: "成本效果分析"
    blurb_en: "Compares alternatives by cost per unit of the SAME outcome, for when the benefit itself is hard to put a dollar value on. Use it instead of Cost-Benefit when you can't monetize the outcome but can still measure it."
    blurb_zh: "用「每單位同樣成果的成本」比較方案，適合效益很難換算成金額的情況。效益沒辦法貨幣化、但可以量測時，用它取代成本效益分析。"
    why_en: "cost_per_unit is never a caller-supplied field -- always cost divided by effectiveness_outcome_units, computed fresh and independently re-derived by the gate. effectiveness_outcome_units must be strictly positive: a zero or negative outcome count would make cost-per-unit either undefined or a nonsense negative ratio, so it's refused with its own CE_ZERO_EFFECTIVENESS code before any division runs, never a ZeroDivisionError and never a silent inf."
    why_zh: "cost_per_unit 從來不是呼叫端能直接給值的欄位——永遠是 cost 除以 effectiveness_outcome_units 現算的，而且會被 gate 獨立重算驗證。effectiveness_outcome_units 一定要嚴格大於零：如果成果單位數是零或負的，每單位成本會變成無法定義或荒謬的負值，所以會用專屬的 CE_ZERO_EFFECTIVENESS 錯誤在除法執行前就拒絕，不會是 ZeroDivisionError，也不會悄悄回傳 inf。"
    url: "https://www.cdc.gov/polaris/php/economics/cost-effectiveness.html"
    example_zh: "情境：比較兩個公衛介入方案，用「預防病例數」當共同成果單位（效益本身很難換算成金額）。\nalternatives：[{id:\"ALT-A\", cost:500000, effectiveness_outcome_units:200}, {id:\"ALT-B\", cost:300000, effectiveness_outcome_units:100}]\ncost_per_unit 不用也不能自己填，系統自動算成 ALT-A＝2500（500000÷200）、ALT-B＝3000（300000÷100）——ALT-A 每單位成本較低，較具成本效果。\n（重點）如果某個方案的 effectiveness_outcome_units 填 0（例如尚未有任何預防病例數據），會被拒絕建立——因為每單位成本在那個情況下無法定義，不是一個可以算出來的答案。"
    example_en: "Scenario: comparing two public-health interventions by 'cases prevented' as the shared outcome unit (the benefit itself is hard to monetize). alternatives: [{id:'ALT-A', cost:500000, effectiveness_outcome_units:200}, {id:'ALT-B', cost:300000, effectiveness_outcome_units:100}]. cost_per_unit is never supplied directly -- the system computes ALT-A as 2500 (500000/200) and ALT-B as 3000 (300000/100) automatically, so ALT-A is more cost-effective per unit. Key point: if an alternative's effectiveness_outcome_units were 0 (e.g. no prevented-case data yet), the record would be refused at construction -- cost-per-unit is undefined in that case, not a computable answer."
  feasibility.irr:
    name_en: "Internal Rate of Return"
    abbr: "IRR"
    name_zh: "內部報酬率"
    blurb_en: "Solves for the discount rate at which a cash flow series' NPV is exactly zero -- an intuitive single return-rate number. Use it to compare an investment's return against a hurdle rate."
    blurb_zh: "算出讓現金流淨現值剛好等於零的折現率，一個直觀的報酬率數字。想拿投資報酬率跟門檻報酬率比較時用。"
    why_en: "irr is solved via a real bisection root-find over NPV(rate)==0, never a caller-supplied field or a closed-form approximation -- the gate independently RE-SOLVES it from scratch (not just re-checking bounds). Refuses to compute one at all when every cash flow amount shares the same sign (IRR_UNDEFINED_SAME_SIGN_CASH_FLOWS) -- an all-outflow or all-inflow series has an NPV(rate) curve that never crosses zero, so no rate is a real answer, and meets_hurdle is likewise always freshly recomputed as irr >= hurdle_rate, never trusted from storage."
    why_zh: "irr 是用真正的二分逼近法解 NPV(rate)==0 算出來的，不是呼叫端能直接給值的欄位，也不是公式近似值——gate 會從零開始獨立重新求解一次（不只是檢查範圍）。如果所有現金流金額同號（IRR_UNDEFINED_SAME_SIGN_CASH_FLOWS），會直接拒絕計算——全部流出或全部流入的序列，NPV(rate) 曲線永遠不會過零，沒有一個利率是真正的答案；meets_hurdle 也永遠是現算的 irr >= hurdle_rate，不會相信儲存值。"
    url: "https://corporatefinanceinstitute.com/resources/valuation/internal-rate-return-irr/"
    example_zh: "情境：評估一筆設備採購案的內部報酬率。\nsubject_ref：「設備採購案 IRR 評估」\ncash_flows：[{period:0, amount:-1000}, {period:1, amount:1200}]（第 0 期投入 1000，第 1 期回收 1200）\nhurdle_rate（門檻報酬率）：0.10\nirr 不用也不能自己填，系統會自動解出 0.2（因為 1+r＝1200/1000）；meets_hurdle 也自動算成 true（0.2 ≥ 0.10）。\n（重點）如果 cash_flows 全部同號，例如 [{period:0, amount:-1000}, {period:1, amount:-500}]（兩期都是流出，沒有任何流入），會被拒絕建立——這種現金流序列的淨現值曲線永遠不會等於零，沒有一個利率是有意義的答案。"
    example_en: "Scenario: evaluating the internal rate of return for an equipment purchase. subject_ref: 'IRR assessment for equipment purchase'; cash_flows: [{period:0, amount:-1000}, {period:1, amount:1200}] (invest 1000 at period 0, recover 1200 at period 1); hurdle_rate: 0.10. irr is never supplied directly -- the system solves it as 0.2 (since 1+r = 1200/1000), and meets_hurdle is likewise computed automatically as true (0.2 >= 0.10). Key point: if cash_flows were all the same sign, e.g. [{period:0, amount:-1000}, {period:1, amount:-500}] (both periods are outflows, no inflow at all), the record would be refused at construction -- that series' NPV curve never crosses zero, so no rate is a meaningful answer."
  feasibility.npv:
    name_en: "Net Present Value"
    abbr: "NPV"
    name_zh: "淨現值分析"
    blurb_en: "Discounts a series of future cash flows back to today's value at a given discount rate. Use it to compare investments that pay off at different times on a like-for-like basis."
    blurb_zh: "把未來一系列現金流用折現率換算回今天的價值。想公平比較不同時間點回收的投資時用。"
    why_en: "npv is always computed fresh from cash_flows and discount_rate -- sum(amount/(1+discount_rate)**period) -- never a caller-supplied field, and the gate independently recomputes it from the record's own stored inputs rather than trusting the stored value. discount_rate must be strictly greater than -1: at exactly -1 the formula's own denominator (1+discount_rate)**period is zero for every period>0, an undefined NPV, not a computable answer, so it's refused with NPV_INVALID_DISCOUNT_RATE before any division runs."
    why_zh: "npv 永遠是從 cash_flows 跟 discount_rate 現算的——sum(amount/(1+discount_rate)**period)——不是呼叫端能直接給值的欄位，gate 也會從記錄自己儲存的原始輸入獨立重算，不會相信儲存值。discount_rate 一定要嚴格大於 -1：剛好等於 -1 時，公式本身的分母 (1+discount_rate)**period 在每個 period>0 時都是零，變成無法定義的 NPV，不是一個可以算出來的答案，所以會在除法執行前就用 NPV_INVALID_DISCOUNT_RATE 拒絕。"
    url: "https://en.wikipedia.org/wiki/Net_present_value"
    example_zh: "情境：評估一筆為期 3 年、初期投入 10 萬的投資案。\nsubject_ref：「3 年期投資案 NPV 評估」\ncash_flows：[{period:0, amount:-100000}, {period:1, amount:40000}, {period:2, amount:40000}, {period:3, amount:40000}]\ndiscount_rate（折現率）：0.10\nnpv 不用也不能自己填，系統會自動算成約 -525.92（三期現金流折現後加總扣掉初期投入，代表用 10% 折現率評估，這筆投資略低於損益兩平）。\n（重點）如果 discount_rate 填 -1，會被拒絕建立——公式的分母在每一期都會變成零，NPV 根本無法定義，不是一個可以算出來的答案。"
    example_en: "Scenario: evaluating a 3-year investment with a 100k upfront cost. subject_ref: 'NPV assessment for 3-year investment'; cash_flows: [{period:0, amount:-100000}, {period:1, amount:40000}, {period:2, amount:40000}, {period:3, amount:40000}]; discount_rate: 0.10. npv is never supplied directly -- the system computes it as approximately -525.92 (the three discounted inflows summed, minus the upfront cost -- at a 10% discount rate this investment falls just short of breaking even). Key point: if discount_rate were -1, the record would be refused at construction -- the formula's own denominator becomes zero at every period, so NPV is genuinely undefined, not a computable answer."
  feasibility.real_options:
    name_en: "Real Options"
    abbr: ""
    name_zh: "實質選擇權"
    blurb_en: "Treats delay/expand/exit as options with a trigger, cost, and future-state value, instead of forcing a one-time yes/no. Use it for a decision you'd rather stage than commit to all at once."
    blurb_zh: "把延後／擴張／退出當成選擇權（觸發條件、成本、未來情境價值），而不是一次性 yes/no。想分階段決策、不想一次全押時用。"
    why_en: "every option needs a non-empty trigger_condition -- an 'option' with no defined exercise condition is a hope, not a real option -- and needs >=2 future_states with distinct (casefolded, whitespace-normalized) descriptions, refused with ROPT_INSUFFICIENT_FUTURE_STATES otherwise. A single-future-state option analysis has collapsed back into the one-shot yes/no decision Atlas's own stated benefit for this method exists to avoid."
    why_zh: "每個 option 都要有非空的 trigger_condition——沒有明確觸發條件的「選擇權」只是一廂情願，不是真正的選擇權——而且一定要有至少 2 個描述不同（去除大小寫與空白差異後仍不同）的 future_states，否則會用 ROPT_INSUFFICIENT_FUTURE_STATES 拒絕。只有 1 個未來情境的選擇權分析，等於又退回 Atlas 這個方法本來要避免的一次性 yes/no 決策。"
    url: "https://en.wikipedia.org/wiki/Real_options_valuation"
    example_zh: "情境：評估「先小規模試點，若成功再擴張海外市場」的選擇權。\nsubject_ref：「海外市場擴張選擇權評估」\noptions：[{id:\"OPT-1\", option_type:\"EXPAND\", trigger_condition:\"若第一年海外試點月活躍用戶超過 5 萬，啟動擴張\", cost:200000, future_states:[{id:\"FS1\", description:\"試點成功，需求強勁\", estimated_value:1500000}, {id:\"FS2\", description:\"試點表現平平，維持現狀\", estimated_value:0}]}]\n（重點）如果 future_states 只放 1 筆（例如只寫「試點成功」），會被拒絕建立——只有一個未來情境等於又變回一次性 yes/no 決策，不是真正的實質選擇權分析。trigger_condition 如果填空字串，也會被拒絕——沒有觸發條件的「選擇權」只是一廂情願。"
    example_en: "Scenario: evaluating the option to run a small pilot first, then expand overseas only if it succeeds. subject_ref: 'Overseas expansion real-options assessment'; options: [{id:'OPT-1', option_type:'EXPAND', trigger_condition:'If year-1 overseas pilot exceeds 50k monthly active users, trigger expansion', cost:200000, future_states:[{id:'FS1', description:'Pilot succeeds, strong demand', estimated_value:1500000}, {id:'FS2', description:'Pilot is lukewarm, stay as-is', estimated_value:0}]}]. Key point: if future_states had only 1 entry (e.g. just 'pilot succeeds'), the record would be refused at construction -- a single future state collapses this back into a one-shot yes/no decision, not a real options analysis. An empty trigger_condition is likewise refused -- an 'option' with no exercise condition is just a hope."
  feasibility.tco:
    name_en: "Total Cost of Ownership"
    abbr: "TCO"
    name_zh: "總持有成本"
    blurb_en: "Sums all 12 required cost categories across the full lifecycle (acquisition, implementation, operation, people, exit, migration, etc.) to surface hidden costs and lock-in. Use it before choosing a vendor/platform, when the sticker price hides the real cost."
    blurb_zh: "加總全生命週期 12 個必要成本類別（取得、導入、營運、人力、退場、遷移等），看出隱性成本與被綁死的風險。選供應商／平台前，牌價背後藏著真實成本時用。"
    why_en: "cost_categories must explicitly declare all 12 of Atlas section 12.26's own named categories (purchase, implementation, migration, people, operation, support, security, compliance, downtime, exit, data_egress, decommission) -- 0 is a legal explicit value, but a MISSING category is refused, because an omitted category is exactly a hidden cost slipping through unexamined. total_tco is never a caller-supplied field -- always the sum of all 12, independently re-derived by the gate from the record's own stored categories."
    why_zh: "cost_categories 一定要明確列出 Atlas 第 12.26 節自己講的全部 12 個類別（取得、導入、遷移、人力、營運、支援、資安、合規、停機、退場、資料搬遷費、除役）——0 是合法的明確值，但漏掉某個類別會被拒絕，因為一個沒被列出的類別，正是一筆會被忽略掉的隱性成本。total_tco 也不是呼叫端能直接給值的欄位——永遠是這 12 個類別的加總，gate 會從記錄自己儲存的類別獨立重算驗證。"
    url: "https://www.gartner.com/en/information-technology/glossary/total-cost-of-ownership-tco"
    example_zh: "情境：評估導入一套新系統的總持有成本。\nsubject_ref：「新系統導入 TCO 評估」\ncost_categories 必須剛好包含全部 12 個類別，例如 {purchase:200000, implementation:50000, migration:30000, people:80000, operation:120000, support:40000, security:25000, compliance:15000, downtime:10000, exit:5000, data_egress:8000, decommission:12000}\ntotal_tco 不用也不能自己填，系統會自動算成 595000（12 個類別加總）。\n（重點）如果漏填其中一個類別，例如整個 cost_categories 裡沒有 decommission 這個鍵，會被拒絕建立——一個沒被明確列出的類別，正是牌價之外會被忽略的隱性成本，不能讓它悄悄消失在分析之外。"
    example_en: "Scenario: assessing the total cost of ownership for a new system rollout. subject_ref: 'TCO assessment for new system rollout'; cost_categories must contain exactly all 12 categories, e.g. {purchase:200000, implementation:50000, migration:30000, people:80000, operation:120000, support:40000, security:25000, compliance:15000, downtime:10000, exit:5000, data_egress:8000, decommission:12000}. total_tco is never supplied directly -- the system computes it automatically as 595000 (the sum of all 12 categories). Key point: if one category were omitted -- e.g. cost_categories had no 'decommission' key at all -- the record would be refused at construction: an unlisted category is exactly the hidden cost that sits outside the sticker price, and it can't be allowed to quietly disappear from the analysis."
  feasibility.telos:
    name_en: "TELOS Feasibility"
    abbr: "TELOS"
    name_zh: "TELOS 可行性檢核"
    blurb_en: "Checks 5 required dimensions -- Technical, Economic, Legal, Operational, Schedule -- each needing real evidence, not just 'we can build it technically'. Use it to check a project's feasibility from more than just the engineering angle."
    blurb_zh: "檢查技術、經濟、法律、營運、時程五個必要面向，每個都要有實際證據，不能只證明「技術做得到」就說可行。想從不只工程角度檢查專案可行性時用。"
    why_en: "all 5 dimensions (technical/economic/legal/operational/schedule) are required positional parameters -- there's no way to call the builder while omitting one, a plain TypeError rather than a silently-accepted partial assessment. Each dimension itself must carry at least one non-empty entry across its own assumptions/evidence/gaps/stop_conditions combined -- a dimension recorded as entirely empty was never actually assessed, exactly the 'declared feasible on technical grounds alone' failure Atlas's own benefit column warns against."
    why_zh: "技術、經濟、法律、營運、時程這 5 個面向都是必填的位置參數——沒有辦法漏填任何一個還呼叫成功，會是很單純的 Python TypeError，不是被悄悄接受的不完整評估。每個面向自己也一定要在 assumptions／evidence／gaps／stop_conditions 四個欄位合計至少有 1 筆非空內容——一個完全空白的面向等於根本沒真的評估過，正是 Atlas 自己警告的「只證明技術做得到就說可行」這種失敗模式。"
    url: "https://en.wikipedia.org/wiki/Feasibility_study"
    example_zh: "情境：評估一項系統遷移專案的五面向可行性。\nassessment_id：「TELOS-2026-001」\n五個面向都要填，例如 technical＝dimension(assumptions=[\"現有團隊具備 Kubernetes 維運經驗\"], evidence=[\"POC 已驗證核心 API 延遲 <200ms\"])；economic＝dimension(assumptions=[\"雲端費用年增不超過 10%\"], gaps=[\"尚未取得 3 年 TCO 估算\"])；legal＝dimension(evidence=[\"法務已確認符合當地資料落地要求\"])；operational＝dimension(assumptions=[\"現有客服團隊可吸收新流程\"], stop_conditions=[\"若客服團隊反對比例超過 50% 則暫停\"])；schedule＝dimension(assumptions=[\"6 個月內可完成遷移\"], gaps=[\"尚未排定人力甘特圖\"])\n（重點）如果呼叫 dimension() 時 assumptions／evidence／gaps／stop_conditions 四個欄位全部留空，會被拒絕建立——一個完全沒有內容的面向，代表這個面向根本沒有真的被評估過，不能算「已檢查」。"
    example_en: "Scenario: assessing a system-migration project across all 5 TELOS dimensions. assessment_id: 'TELOS-2026-001'; all 5 dimensions are required, e.g. technical=dimension(assumptions=['existing team has Kubernetes operations experience'], evidence=['POC confirmed core API latency <200ms']); economic=dimension(assumptions=['cloud cost grows <=10%/year'], gaps=['3-year TCO estimate not yet obtained']); legal=dimension(evidence=['legal confirmed local data-residency compliance']); operational=dimension(assumptions=['existing support team can absorb the new process'], stop_conditions=['pause if support-team objection rate exceeds 50%']); schedule=dimension(assumptions=['migration completable within 6 months'], gaps=['staffing Gantt chart not yet scheduled']). Key point: calling dimension() with all four of assumptions/evidence/gaps/stop_conditions left empty would be refused at construction -- a dimension with zero content was never actually assessed, and can't count as 'checked'."
  feasibility.unit_economics:
    name_en: "Unit Economics"
    abbr: ""
    name_zh: "單位經濟效益"
    blurb_en: "Checks whether each customer/transaction is actually profitable (ARPU/margin/CAC/LTV/payback/churn), flagging non-scalable when contribution margin is negative. Use it to catch 'revenue growing but losing more per sale' before it scales."
    blurb_zh: "檢查每個客戶／交易到底賺不賺錢（客單價／毛利／取得成本／終身價值／回收期／流失率），邊際貢獻是負的就標記不可擴張。想在規模化之前抓出「營收成長但越賣越虧」時用。"
    why_en: "ltv_to_cac_ratio and scalable are both GENUINE_COMPUTE -- neither is a builder parameter at all (a caller attempting either as a keyword argument gets a plain TypeError). cac must be strictly positive -- refused with UECON_INVALID_CAC otherwise, since the ratio is undefined at cac=0 and a non-positive acquisition cost isn't a sensible fact anyway. scalable is the minimal structural encoding of Atlas's own named failure mode ('revenue growing but losing more per sale'): true only when contribution_margin is non-negative, and nothing fancier (no invented LTV:CAC threshold) is modeled beyond what Atlas itself states."
    why_zh: "ltv_to_cac_ratio 跟 scalable 都是 GENUINE_COMPUTE——兩個都不是建構函式的參數（呼叫端想用關鍵字參數塞值會直接得到 Python TypeError）。cac 一定要嚴格大於零——否則用 UECON_INVALID_CAC 拒絕，因為 cac 是 0 時這個比例根本無法定義，而且非正的客戶取得成本本來就不是合理的事實。scalable 是 Atlas 自己講的失敗模式（「營收成長但越賣越虧」）最小化的結構呈現：只有 contribution_margin 非負時才是 true，沒有多做任何 Atlas 沒講的加碼判斷（例如自己發明一個 LTV:CAC 門檻）。"
    url: "https://mercury.com/blog/understanding-unit-economics"
    example_zh: "情境：檢查一個 SaaS 訂閱方案每位客戶到底賺不賺錢。\nsubject_ref：「SaaS 訂閱方案 A 單位經濟效益」\ncac（客戶取得成本）：300；ltv（顧客終身價值）：1200；gross_margin（毛利率）：0.75；payback_period（回收期，月）：6；churn_rate（流失率）：0.05；arpu（每用戶平均營收）：50；contribution_margin（邊際貢獻）：37.5\nltv_to_cac_ratio 不用也不能自己填，系統會自動算成 4.0（1200÷300）；scalable 也自動算成 true（因為 contribution_margin 37.5 ≥ 0）。\n（重點）如果 cac 填 0，會被拒絕建立——用 0 當分母，這個比例根本無法定義，而且取得成本是 0 也不是合理的事實。"
    example_en: "Scenario: checking whether each customer of a SaaS subscription plan is actually profitable. subject_ref: 'Unit economics for SaaS plan A'; cac (customer acquisition cost): 300; ltv (customer lifetime value): 1200; gross_margin: 0.75; payback_period (months): 6; churn_rate: 0.05; arpu: 50; contribution_margin: 37.5. ltv_to_cac_ratio is never supplied directly -- the system computes it automatically as 4.0 (1200/300); scalable is likewise computed automatically as true (since contribution_margin 37.5 >= 0). Key point: if cac were 0, the record would be refused at construction -- dividing by zero makes the ratio undefined, and a zero acquisition cost isn't a sensible fact either."

  # ---- finance ----
  finance.financial_assumptions:
    name_en: "Financial Assumptions"
    abbr: ""
    name_zh: "財務假設"
    blurb_en: "Records the financial assumptions (currency, discount rate, horizon, cash-flow projection) that ground a business plan's numbers. Use it as the first step before building any financial projection."
    blurb_zh: "記錄支撐一份商業計畫數字的財務假設（幣別、折現率、期間、現金流預測）。做任何財務預測之前的第一步。"
    why_en: "Every downstream financial calculation (NPV, payback period, valuation) is only as trustworthy as the assumptions feeding it; recording each assumption with its own named basis (not just a bare number typed into a formula) is what makes a projection auditable -- a reviewer can check WHY discount_rate is 8%, not just accept that it is."
    why_zh: "所有下游的財務計算（NPV、回本期、估值）能不能信，完全取決於餵進去的假設；把每個假設連同它的依據一起記錄下來（而不是直接把數字打進公式），才能讓預測經得起審查——審查者可以檢查折現率為什麼是 8%，而不是只能照單全收。"
    url: "https://corporatefinanceinstitute.com/resources/financial-modeling/financial-modeling-assumptions/"
    example_zh: "情境：新產品線的財務假設，期間抓 3 年。\nsubject_ref：「新產品線財務假設」\ncurrency：3 碼大寫幣別代碼，例如 \"USD\"\ndiscount_rate：0~1 之間的實數，例如 0.08（代表 8%）\nhorizon_years：1~30 之間的整數，例如 3\nassumptions 至少 1 筆，每筆要 id／name／value／unit／basis／provenance，basis 是這個數字的依據來源，例如 [{id: \"A1\", name: \"客單價\", value: 45, unit: \"USD/order\", basis: \"過去 6 個月同類產品平均客單價\", provenance: {...}}, {id: \"A2\", name: \"月成長率\", value: 0.05, unit: \"ratio\", basis: \"產業報告估計的保守成長率\", provenance: {...}}]\ncash_flow_projection 筆數必須剛好是 horizon_years+1 筆（因為 period 0 是期初投入），period 必須是 0..horizon_years 依序排列，例如 horizon_years=3 時要有 [{period: 0, amount: -50000}, {period: 1, amount: 15000}, {period: 2, amount: 22000}, {period: 3, amount: 30000}]\n（選填）version：留空即可。"
    example_en: "Scenario: financial assumptions for a new product line over a 3-year horizon. subject_ref: 'New product line financial assumptions'; currency: a 3-letter uppercase code, e.g. 'USD'; discount_rate: a real number in [0, 1], e.g. 0.08 (meaning 8%); horizon_years: an integer 1..30, e.g. 3; assumptions has >=1 entry, each needs id/name/value/unit/basis/provenance, basis is the actual grounding for that number, e.g. [{id: 'A1', name: 'Average order value', value: 45, unit: 'USD/order', basis: 'Trailing 6-month average for comparable products', provenance: {...}}, {id: 'A2', name: 'Monthly growth rate', value: 0.05, unit: 'ratio', basis: 'Conservative estimate from an industry report', provenance: {...}}]; cash_flow_projection must have EXACTLY horizon_years+1 entries (period 0 is the initial outlay), periods must run 0..horizon_years in order, e.g. for horizon_years=3: [{period: 0, amount: -50000}, {period: 1, amount: 15000}, {period: 2, amount: 22000}, {period: 3, amount: 30000}]. Optional: version can be left blank."

  # ---- foresight (F13 unknown-unknowns & foresight) ----
  foresight.adjacent_discipline_search:
    name_en: "Adjacent Discipline Search"
    abbr: ""
    name_zh: "鄰近學科搜尋"
    blurb_en: "Finds missing variables by looking at genuinely adjacent fields (not your team's current disciplines) and importing their models. Use it to reduce a single-profession blind spot."
    blurb_zh: "從真正的鄰近學科（不是團隊現有專業）找遺漏變數，並引入其模型。想降低單一專業盲點時用。"
    why_en: "adjacent_fields[] must be disjoint from current_disciplines[] (normalized) -- a field already in the team's own current set isn't adjacent by definition, and listing it would defeat this method's whole stated purpose of reducing the single-discipline blind spot. Every imported_models[].field_ref must also resolve to a declared adjacent field -- an imported model attributed to a field nobody actually searched is a fabricated provenance chain."
    why_zh: "adjacent_fields[] 一定要跟 current_disciplines[]（正規化後）互斥——一個已經在團隊現有專業裡的領域，定義上就不算「鄰近」，硬列進去會直接違背這個方法「降低單一專業盲點」的整個存在目的。每個 imported_models[].field_ref 也一定要對應到一個真的被列為 adjacent_fields 的領域——把一個模型歸功於一個根本沒被搜尋過的領域，等於捏造來源鏈。"
    url: "https://www.sciencedirect.com/science/article/abs/pii/S1045235422000600"
    example_zh: "情境：團隊做顧客流失預測，想借用非本行的模型。\ncurrent_disciplines（現有專業）：[\"軟體工程\", \"資料科學\"]\nadjacent_fields（要搜尋的鄰近領域）：[\"流行病學\", \"生態學\"]\nimported_models：[{id:\"IM1\", field_ref:\"流行病學\", model_description:\"借用傳染病 SIR 模型的『傳播率』概念類比顧客流失擴散速度\"}]\n（重點）如果 adjacent_fields 填成 [\"資料科學\"]（跟 current_disciplines 裡已經有的重複），會被拒絕建立——一個團隊本來就有的專業不算「鄰近」，這樣列等於沒有真的跨出去找。"
    example_en: "Scenario: a team building a churn-prediction model wants to borrow a model from outside its own field. current_disciplines: ['software engineering', 'data science']; adjacent_fields (fields to search): ['epidemiology', 'ecology']; imported_models: [{id:'IM1', field_ref:'epidemiology', model_description:\"borrowed the SIR infectious-disease model's transmission-rate concept as an analogy for churn-spread velocity\"}]. Key point: if adjacent_fields were ['data science'] (duplicating an entry already in current_disciplines), the record would be refused at construction -- a field the team already has is not adjacent by definition, and listing it means no real search outside the team's own expertise actually happened."
  foresight.backcasting:
    name_en: "Backcasting"
    abbr: ""
    name_zh: "回溯規劃"
    blurb_en: "Works backward from an ideal future state through milestones to today's actions. Use it for long-term roadmapping when forecasting forward from today doesn't get you there."
    blurb_zh: "從理想的未來狀態往回推導出里程碑，一路推到今天該做的事。做長期路線圖、從現在往前推導不出方向時用。"
    why_en: "milestones[] must be strictly ordered by horizon, decreasing from the one nearest the future state to the one nearest today -- Atlas's own pipeline is 'future state -> milestones backward -> today actions', and an out-of-order or duplicate horizon breaks that backward chain. At least one today_actions entry is also required: a backcast that stops at a distant milestone and never lands on a present-day action is a wish, not a roadmap -- exactly this method's own stated output."
    why_zh: "milestones[] 的 horizon 一定要嚴格遞減排序，從離未來情境最近的第一個排到離今天最近的最後一個——Atlas 自己的管線是「未來情境→里程碑倒推→今天的行動」，順序錯了或 horizon 重複就打斷了這條倒推鏈。今天的行動（today_actions）也至少要有一項——一個只停在遙遠里程碑、從沒真的落到今天可以做的行動的倒推，只是個願望，不是路線圖，而路線圖正是這個方法本來要產出的東西。"
    url: "https://en.wikipedia.org/wiki/Backcasting"
    example_zh: "情境：從「2030 年公司達成碳中和」倒推今天該做什麼。\nfuture_state：「2030 年公司達成碳中和」\nmilestones（horizon 從遠到近嚴格遞減）：[{id:\"M1\", description:\"2028 年完成全面再生能源採購\", horizon:2}, {id:\"M2\", description:\"2026 年完成排放盤查基準線\", horizon:1}]\ntoday_actions：[\"啟動排放盤查專案招標\"]\n（重點）如果 milestones 順序顛倒，例如 M1 horizon:1、M2 horizon:2（變成遞增），會被拒絕建立——倒推鏈一定要嚴格從未來往今天遞減，不能中間反過來。"
    example_en: "Scenario: backcasting from 'the company reaches carbon neutrality by 2030' to figure out what to do today. future_state: 'company reaches carbon neutrality by 2030'; milestones (horizon strictly decreasing, far to near): [{id:'M1', description:'complete full renewable procurement by 2028', horizon:2}, {id:'M2', description:'complete emissions baseline audit by 2026', horizon:1}]; today_actions: ['launch the emissions-audit procurement process']. Key point: if the milestones were reversed -- M1 horizon:1, M2 horizon:2 (increasing instead of decreasing) -- the record would be refused at construction -- the backward chain must run strictly from the future toward today, never flip partway."
  foresight.black_swan_exercise:
    name_en: "Black Swan Exercise"
    abbr: ""
    name_zh: "黑天鵝演練"
    blurb_en: "Chains tail events -> exposure -> survivability -> hedges to strengthen resilience against low-probability, high-impact events. Use it to prepare for the rare disaster you can't afford to be blindsided by."
    blurb_zh: "串起尾端風險事件→曝險程度→存活能力→避險措施，強化面對低機率高衝擊事件的韌性。想提早準備承受不起的意外時用。"
    why_en: "every declared tail_events[] entry must be traced by >=1 exposures[] entry, and every exposures[] entry must be covered by >=1 survivability_assessments[] entry -- Atlas's own 'tail events->exposure->survivability' chain, mechanized as referential completeness rather than a suggestion. hedges[] are checked only for referential integrity (every hedge's exposure_id must resolve), with no coverage requirement -- a black swan exercise may legitimately conclude some exposures are accepted risk with no hedge built yet."
    why_zh: "每個宣告的 tail_events[] 項目都一定要被至少 1 個 exposures[] 項目追蹤到，每個 exposures[] 項目也一定要被至少 1 個 survivability_assessments[] 項目覆蓋——這是 Atlas 自己的「tail events→exposure→survivability」鏈，被機械化成參照完整性檢查，不只是建議。hedges[] 只檢查參照完整性（每個 hedge 的 exposure_id 都要能對應到真實存在的 exposure），沒有覆蓋率要求——一次黑天鵝演練可以合理地判斷某些暴露是可接受風險、暫時不建避險機制。"
    url: "https://en.wikipedia.org/wiki/Black_swan_theory"
    example_zh: "情境：演練「主要雲端供應商長時間停機」這個尾端風險。\ntail_events：[{id:\"TE1\", description:\"主要雲端供應商全球性長時間停機\"}]\nexposures：[{id:\"EX1\", tail_event_id:\"TE1\", description:\"核心服務完全依賴單一雲端區域，無跨雲備援\"}]\nsurvivability_assessments：[{id:\"SA1\", exposure_id:\"EX1\", description:\"目前只能撐 4 小時，超過就開始流失客戶\"}]\nhedges：[{id:\"H1\", exposure_id:\"EX1\", description:\"建立跨雲備援環境，目標 RTO 縮短到 30 分鐘\"}]\n（重點）如果拿掉 SA1（EX1 沒有任何 survivability_assessments 覆蓋），會被拒絕建立——一個暴露沒人評估過撐不撐得住，正是 Atlas「exposure→survivability」這一步要求要做卻被跳過的那一步。"
    example_en: "Scenario: running a black swan exercise on 'major cloud provider suffers an extended global outage'. tail_events: [{id:'TE1', description:'major cloud provider suffers an extended global outage'}]; exposures: [{id:'EX1', tail_event_id:'TE1', description:'core services depend entirely on a single cloud region with no cross-cloud failover'}]; survivability_assessments: [{id:'SA1', exposure_id:'EX1', description:'currently survives about 4 hours before customer churn begins'}]; hedges: [{id:'H1', exposure_id:'EX1', description:'build cross-cloud failover, target RTO under 30 minutes'}]. Key point: if SA1 were removed (EX1 has zero covering survivability_assessments), the record would be refused at construction -- an exposure nobody assessed for survivability is exactly the skipped step Atlas's 'exposure->survivability' stage exists to force."
  foresight.cross_country_comparison:
    name_en: "Cross-country Comparison"
    abbr: ""
    name_zh: "跨國比較"
    blurb_en: "Compares a metric across 2+ jurisdictions under an explicitly declared normalization basis. Use it to find local variation without comparing apples to oranges."
    blurb_zh: "在明確宣告的標準化基準下比較多個國家／地區的指標。想找出地區差異又不想拿蘋果比橘子時用。"
    why_en: "at least 2 distinct jurisdictions are required -- a 'comparison' of one jurisdiction is not a comparison, refused with its own distinct code before any comparison content is even inspected. Every comparison also requires a non-empty normalization_basis -- Atlas's own pipeline is 'comparable jurisdictions->normalize->compare', and comparing raw cross-country figures with no stated basis (per-capita, PPP-adjusted, whatever) is exactly the error that pipeline stage exists to prevent."
    why_zh: "至少要有 2 個不同的國家／地區——比較「1 個」國家不是比較，這個規則在檢查任何比較內容之前就先用專屬錯誤碼擋下來。每個比較也一定要有非空的 normalization_basis（標準化基準）——Atlas 自己的管線是「可比較的國家／地區→標準化→比較」，用沒有說明基準（人均、購買力平價調整等）的原始跨國數字直接比較，正是這個步驟要阻止的錯誤。"
    url: "https://www.sciencedirect.com/science/article/pii/S0168851013000961"
    example_zh: "情境：比較台灣、新加坡、日本三地的最低工資水準。\njurisdictions：[\"台灣\", \"新加坡\", \"日本\"]\ncomparisons：[{metric:\"最低工資\", normalization_basis:\"以每小時計，換算為美元購買力平價(PPP)\", values:[{jurisdiction:\"台灣\", value:5.2}, {jurisdiction:\"新加坡\", value:6.8}, {jurisdiction:\"日本\", value:7.1}]}]\n（重點）如果 jurisdictions 只填 1 個地區，例如只有 [\"台灣\"]，會被拒絕建立——比較只有 1 個對象不算比較。"
    example_en: "Scenario: comparing minimum wage levels across Taiwan, Singapore, and Japan. jurisdictions: ['Taiwan', 'Singapore', 'Japan']; comparisons: [{metric:'minimum wage', normalization_basis:'per hour, converted to USD PPP', values:[{jurisdiction:'Taiwan', value:5.2}, {jurisdiction:'Singapore', value:6.8}, {jurisdiction:'Japan', value:7.1}]}]. Key point: if jurisdictions had only 1 entry, e.g. ['Taiwan'] alone, the record would be refused at construction -- a comparison of a single jurisdiction is not a comparison."
  foresight.cross_impact_analysis:
    name_en: "Cross-impact Analysis"
    abbr: ""
    name_zh: "交叉影響分析"
    blurb_en: "Analyzes how a full matrix of event pairs change each other's probability, so trends aren't mistakenly treated as independent. Use it when several forecasted events could plausibly affect each other."
    blurb_zh: "分析一整組事件兩兩之間如何互相改變機率，避免把趨勢誤當獨立事件。多個預測事件彼此可能互相影響時用。"
    why_en: "every unordered pair of declared events must be present in impact_pairs[] exactly once -- Atlas's own pipeline literally says 'event pair matrix', and a matrix silently missing a pair lets exactly the 'treat trends as independent' assumption this method's benefit column names back in through the gap. A missing pair is refused with its own distinct code, not silently treated as 'no interaction'."
    why_zh: "每組已宣告事件的兩兩配對，一定要在 impact_pairs[] 裡剛好出現一次——Atlas 自己的管線字面上就是「event pair matrix」，一個矩陣悄悄漏掉一組配對，等於讓「把趨勢當獨立事件」這個假設從漏洞鑽回來，而這正是這個方法自己的效益欄要防的事。漏掉一組配對會用專屬錯誤碼拒絕，不會被默默當成「沒有互相影響」處理。"
    url: "https://en.wikipedia.org/wiki/Cross_impact_analysis"
    example_zh: "情境：分析「主要供應商破產」與「關稅大幅調漲」這兩個事件是否互相影響。\nevents：[{event_id:\"E1\", description:\"主要供應商無預警破產\"}, {event_id:\"E2\", description:\"關稅大幅調漲\"}]\nimpact_pairs（2 個事件剛好需要 1 組配對）：[{event_a_id:\"E1\", event_b_id:\"E2\", conditional_probability_shift:0.3}]\n（重點）如果 impact_pairs 留空（一組配對都沒填），會被拒絕建立——2 個事件的矩陣理應剛好有 1 組配對，一組都沒有就是矩陣不完整，正是這個方法存在的目的要抓的錯誤。"
    example_en: "Scenario: analyzing whether 'a key supplier goes bankrupt' and 'tariffs rise sharply' affect each other's probability. events: [{event_id:'E1', description:'key supplier goes bankrupt without warning'}, {event_id:'E2', description:'tariffs rise sharply'}]; impact_pairs (2 events need exactly 1 pair): [{event_a_id:'E1', event_b_id:'E2', conditional_probability_shift:0.3}]. Key point: if impact_pairs were left empty (zero pairs declared), the record would be refused at construction -- a 2-event matrix should have exactly 1 pair, and having none makes the matrix incomplete, exactly the defect this method exists to catch."
  foresight.cross_industry_transfer:
    name_en: "Cross-industry Transfer"
    abbr: ""
    name_zh: "跨產業移植"
    blurb_en: "Transplants a mechanism from another industry that shares the same underlying job/constraint. Use it to avoid reinventing a solution that already exists elsewhere."
    blurb_zh: "把其他產業針對相同工作／限制的解法機制移植過來。想避免重新發明已經存在的解法時用。"
    why_en: "source_industry and target_industry must differ after normalization -- transferring an industry's own mechanism to itself is not a CROSS-industry transfer. shared_job_or_constraint and adaptation are both required non-empty fields: without a named shared job/constraint the transfer is cargo-culting a mechanism between unrelated contexts, and without a recorded adaptation it's just copying a mechanism verbatim, not the 'adapt' step Atlas's own pipeline names as the second half."
    why_zh: "source_industry 跟 target_industry 正規化後一定要不同——把一個產業自己的機制移植給自己不算「跨產業」移植。shared_job_or_constraint 跟 adaptation 都是必填非空欄位：沒有指名共同的工作／限制，這個移植就是在不相關的情境間亂套機制；沒有記錄實際的調整內容，那就只是原封不動照抄，不是 Atlas 自己管線第二步「adapt」該做的事。"
    url: "https://www.innovation.wiki/en/navigator/the-cross-industry-innovation-approach/"
    example_zh: "情境：把航空業的檢查清單機制移植到醫療業。\ntransfers：[{id:\"T1\", source_industry:\"航空業\", target_industry:\"醫療業\", shared_job_or_constraint:\"都需要在高風險環境下標準化檢查以降低人為疏失\", source_mechanism:\"飛行前檢查清單(pre-flight checklist)\", adaptation:\"改造成手術室安全檢查清單，加入器械清點與交班確認步驟\"}]\n（重點）如果 source_industry 跟 target_industry 填成一樣，例如都填「航空業」，會被拒絕建立——移植給自己的產業不是跨產業移植。"
    example_en: "Scenario: transplanting the aviation industry's checklist mechanism into healthcare. transfers: [{id:'T1', source_industry:'aviation', target_industry:'healthcare', shared_job_or_constraint:'both need standardized checks in a high-risk environment to reduce human error', source_mechanism:'pre-flight checklist', adaptation:'adapted into a surgical safety checklist, adding instrument-count and handoff-confirmation steps'}]. Key point: if source_industry and target_industry were the same, e.g. both 'aviation', the record would be refused at construction -- transferring a mechanism to its own industry is not a cross-industry transfer."
  foresight.delphi:
    name_en: "Delphi Method"
    abbr: ""
    name_zh: "德爾菲法"
    blurb_en: "Anonymous multi-round expert estimation (round 1 -> summary -> round 2 -> dispersion), preserving the minority view instead of forcing false consensus. Use it to get expert judgment on an uncertain question without groupthink or authority bias."
    blurb_zh: "匿名多輪專家估計（第一輪→彙整→第二輪→分歧程度），保留少數意見而不是強迫假共識。想在不確定的問題上取得專家判斷、又不想被權威效應或從眾左右時用。"
    why_en: "responses are structurally anonymous -- no identity-shaped key (name/expert_name/author/affiliation/email/title) can ever be attached, since a named expert defeats the exact 'reduce authority effects' benefit this method exists for. A record carrying consensus_summary must ALSO carry either a non-empty minority_positions[] or an explicit minority_positions_none_recorded_reason: collapsing to consensus while silently discarding the minority range is precisely the failure this method's own limitation warns against -- consensus is not truth."
    why_zh: "每個回應都結構性匿名——絕對不能附上任何身分性欄位（name／expert_name／author／affiliation／email／title），因為一個具名的專家意見會直接破壞這個方法要達成的「降低權威效應」效果。一份記錄如果有 consensus_summary（共識摘要），就一定要同時有非空的 minority_positions[]（少數意見）或明確的 minority_positions_none_recorded_reason（沒有少數意見的說明）——收斂到共識卻悄悄丟掉少數意見的範圍，正是這個方法自己講的限制要防的失敗：共識不等於真相。"
    url: "https://www.rand.org/topics/delphi-method.html"
    example_zh: "情境：用德爾菲法估計某新技術三年後的市場滲透率。\nrounds（至少 2 輪，每輪至少 2 個回應）：round1=[{participant_id:\"P1\", estimate:60}, {participant_id:\"P2\", estimate:45}]；round2（看過第一輪摘要後）=[{participant_id:\"P1\", estimate:55}, {participant_id:\"P2\", estimate:50}]\nconsensus_summary：「多數專家收斂在 50-55% 區間」\nminority_positions：[\"仍有 1 位專家堅持不應低於 65%，因其引用不同的成長曲線資料\"]\ndispersion 不用也不能自己填，系統會用第二輪（最終輪）的估計自動算出約 2.5（母體標準差）。\n（重點）如果 consensus_summary 有填，但 minority_positions 跟 minority_positions_none_recorded_reason 兩個都留空，會被拒絕建立——共識被記錄下來，卻沒有交代少數意見的去向，正是這個方法明講要防的事。"
    example_en: "Scenario: using Delphi to estimate a new technology's market penetration 3 years out. rounds (>=2 rounds, >=2 responses each): round1=[{participant_id:'P1', estimate:60}, {participant_id:'P2', estimate:45}]; round2 (after seeing round1's summary)=[{participant_id:'P1', estimate:55}, {participant_id:'P2', estimate:50}]; consensus_summary: 'most experts converged on the 50-55% range'; minority_positions: ['one expert still holds out for >=65%, citing a different growth-curve dataset']. dispersion is never supplied directly -- the system computes it from round2 (the final round)'s estimates automatically as approximately 2.5 (population standard deviation). Key point: if consensus_summary were filled in but both minority_positions and minority_positions_none_recorded_reason were left empty, the record would be refused at construction -- recording a consensus while giving no account of where the minority view went is exactly what this method's own rule exists to prevent."
  foresight.futures_wheel:
    name_en: "Futures Wheel"
    abbr: ""
    name_zh: "未來輪"
    blurb_en: "Fans a center event out to direct, indirect, and structural (1st/2nd/3rd-order) impacts. Use it to force yourself past the obvious first-order consequence."
    blurb_zh: "把一個中心事件展開成直接、間接、結構性（一階／二階／三階）影響。想強迫自己想到明顯的一階影響之外時用。"
    why_en: "an order-1 impact's parent must be the center event itself (a reserved sentinel, since the center event is a bare description with no id of its own), and an order-2/3 impact's parent must resolve to a declared impact of exactly one order shallower -- no orphans, no skipped orders. Because ids are unique and every parent reference must point to a strictly shallower order, a cycle (an impact being its own ancestor) is structurally impossible by construction, not merely discouraged."
    why_zh: "一階影響的 parent 一定要是中心事件本身（一個保留的哨兵值，因為中心事件只是一段描述文字，沒有自己的 id）；二階／三階影響的 parent 則一定要對應到剛好淺一階的已宣告影響——不能有孤兒節點，也不能跳過某一階。因為 id 唯一、而且每個 parent 參照都一定要指向嚴格更淺的一階，一個影響變成自己的祖先（循環）在結構上根本不可能發生，不只是不建議而已。"
    url: "https://en.wikipedia.org/wiki/Futures_wheel"
    example_zh: "情境：展開「政府宣布全面電動車補貼政策」這個中心事件的漣漪效應。\ncenter_event：「政府宣布全面電動車補貼政策」\nimpacts：[{id:\"I1\", order:1, parent_id:\"CENTER\", description:\"電動車銷量短期大增\"}, {id:\"I2\", order:2, parent_id:\"I1\", description:\"充電站需求暴增，出現排隊現象\"}]\n（重點）如果新增一個一階影響，例如 {id:\"I3\", order:1, parent_id:\"I1\", ...}（parent_id 填成另一個影響而不是 \"CENTER\"），會被拒絕建立——任何一階影響的 parent 一定要是中心事件本身。"
    example_en: "Scenario: expanding the ripple effects of 'government announces a comprehensive EV subsidy policy'. center_event: 'government announces a comprehensive EV subsidy policy'; impacts: [{id:'I1', order:1, parent_id:'CENTER', description:'EV sales surge in the short term'}, {id:'I2', order:2, parent_id:'I1', description:'charging-station demand spikes, causing queues'}]. Key point: if a new order-1 impact were added, e.g. {id:'I3', order:1, parent_id:'I1', ...} (parent_id pointing to another impact instead of 'CENTER'), the record would be refused at construction -- every order-1 impact's parent must be the center event itself."
  foresight.historical_analogy:
    name_en: "Historical Analogy"
    abbr: ""
    name_zh: "歷史類比"
    blurb_en: "Compares a current situation to a historical precedent, extracting the mechanism while explicitly naming where the analogy breaks down. Use it to borrow from history without a superficial 'this is just like X' comparison."
    blurb_zh: "把現況跟歷史先例比較，抽出機制，並明確標出類比不成立的地方。想借鏡歷史又避免流於表面類比時用。"
    why_en: "every analogy requires >=1 similarity AND >=1 difference AND a non-empty extracted_mechanism AND a non-empty analogy_limits. An analogy record asserting only similarities, with no differences and no stated limits, IS the surface-level analogy this method exists to prevent -- refused at construction, not merely discouraged."
    why_zh: "每個類比都一定要至少 1 個相似點、至少 1 個差異點、一個非空的 extracted_mechanism（抽出的機制），還要有非空的 analogy_limits（類比的限制）。一個只主張相似點、完全沒寫差異也沒講限制的類比記錄，本身就是這個方法要防止的表面類比——在建構時就直接拒絕，不只是被勸阻而已。"
    url: "https://smallwarsjournal.com/2023/01/02/book-review-thinking-time-uses-history-decision-makers/"
    example_zh: "情境：用歷史先例分析當前的數位平台監管改革。\nanalogies：[{id:\"A1\", historical_case:\"1990 年代電信業解除管制\", similarities:[\"都是政府從管制走向開放市場\", \"都出現既有大型業者與新進者的競爭重組\"], differences:[\"電信業解除管制花了將近 10 年，本次數位平台監管改革預期 3 年內完成\", \"電信業有龐大固定資產，數位平台的進入門檻結構完全不同\"], extracted_mechanism:\"解除管制初期會出現價格戰與整併潮，存活下來的少數業者最後靠規模經濟建立護城河\", analogy_limits:\"電信業的資本密集特性讓這個類比能解釋『整併動態』，但無法直接套用在數位平台『網路效應』主導的競爭結構上\"}]\n（重點）如果 differences 留空（只填 similarities），會被拒絕建立——只有相似點沒有差異點，正是這個方法要防止的表面類比。"
    example_en: "Scenario: using historical precedent to analyze current digital-platform regulatory reform. analogies: [{id:'A1', historical_case:'1990s telecom deregulation', similarities:['both are government shifts from regulation to open markets', 'both saw competitive restructuring between incumbents and new entrants'], differences:['telecom deregulation took nearly a decade; this platform reform is expected to complete within 3 years', 'telecom has massive fixed assets; digital platforms have a completely different entry-barrier structure'], extracted_mechanism:'early deregulation triggers price wars and consolidation; the few survivors eventually build a moat through economies of scale', analogy_limits:\"telecom's capital-intensive nature makes this analogy useful for explaining 'consolidation dynamics', but it doesn't transfer directly to a network-effect-driven competitive structure like digital platforms\"}]. Key point: if differences were left empty (only similarities filled in), the record would be refused at construction -- similarities with no stated differences is exactly the surface-level analogy this method exists to prevent."
  foresight.horizon_scanning:
    name_en: "Horizon Scanning"
    abbr: ""
    name_zh: "地平線掃描"
    blurb_en: "Systematically scans domains/sources for emerging signals, each requiring source/date/geography/status/impact/confidence. Use it to catch external change early instead of being surprised by it."
    blurb_zh: "系統性掃描各領域／來源找出新興變化訊號，每個訊號都要有來源、日期、地區、狀態、影響、信心度。想提早發現外部變化、不要被打措手不及時用。"
    why_en: "every signal must carry all six of source/date/geography/status/impact/confidence, non-empty -- not advisory, a hard per-signal field requirement. Every signal's domain/source must also resolve to a declared domains[]/sources[] entry -- Atlas's own literal pipeline is 'domains/sources->signals', not the reverse, so a signal citing a domain or source nobody declared is refused."
    why_zh: "每個訊號都一定要有 source（來源）、date（日期）、geography（地區）、status（狀態）、impact（影響）、confidence（信心度）這六個欄位、且都不能是空的——這不是建議，是每個訊號的硬性欄位要求。每個訊號的 domain／source 也一定要對應到已宣告的 domains[]／sources[] 項目——Atlas 自己的管線字面上就是「領域／來源→訊號」，不是反過來，所以一個訊號引用了沒人宣告過的領域或來源會被拒絕。"
    url: "https://en.wikipedia.org/wiki/Horizon_scanning"
    example_zh: "情境：掃描 AI 監理領域的新興變化訊號。\ndomains：[{domain_id:\"D1\", name:\"人工智慧監理\"}]\nsources：[{source_id:\"S1\", name:\"歐盟執委會公告\"}]\nsignals：[{id:\"SIG1\", domain:\"D1\", source:\"S1\", description:\"歐盟研擬新的 AI 責任指令\", date:\"2026-03\", geography:\"歐盟\", status:\"立法草案階段\", impact:\"高\", confidence:\"中\"}]\n（重點）如果 confidence（信心度）留空字串，會被拒絕建立——六個必要欄位缺一個都不行，這是硬性要求，不是可有可無的建議欄位。"
    example_en: "Scenario: scanning for emerging signals in AI regulation. domains: [{domain_id:'D1', name:'AI regulation'}]; sources: [{source_id:'S1', name:'European Commission announcement'}]; signals: [{id:'SIG1', domain:'D1', source:'S1', description:'EU is drafting a new AI liability directive', date:'2026-03', geography:'EU', status:'draft legislation', impact:'high', confidence:'medium'}]. Key point: if confidence were an empty string, the record would be refused at construction -- all six mandatory fields are required, none is optional advisory metadata."
  foresight.outlier_analysis:
    name_en: "Outlier Analysis"
    abbr: ""
    name_zh: "異常個案分析"
    blurb_en: "Investigates an anomaly by first ruling out data error, THEN digging into the mechanism -- never skipping straight to a story about a bad data point. Use it when a weird data point might actually be a real, new phenomenon."
    blurb_zh: "先排除資料錯誤，才深挖異常個案背後的機制，不能跳過驗證就直接編故事。奇怪的資料點可能是真實新現象時用。"
    why_en: "a mechanism_hypothesis may only be present when data_error_ruled_out is exactly True (a real bool -- int 0/1 is not accepted) AND data_error_assessment is non-empty. Atlas's own 3-step pipeline puts ruling out data error strictly BEFORE digging into mechanism -- a hypothesis about WHY an outlier happened, offered before data error has actually been ruled out, is refused rather than silently accepted as a plausible-sounding story."
    why_zh: "mechanism_hypothesis（機制假說）只有在 data_error_ruled_out（已排除資料錯誤）剛好是 True（真正的布林值，int 0/1 不算）且 data_error_assessment（資料錯誤評估）非空時才能填。Atlas 自己的三步驟管線把「排除資料錯誤」嚴格放在「深挖機制」之前——一個在資料錯誤都還沒真的排除前就先給的機制假說，會被拒絕，不會被當成一個聽起來合理的故事就默默接受。"
    url: "https://en.wikipedia.org/wiki/Outlier"
    example_zh: "情境：分析某分店單月營收暴增 300% 的異常個案。\noutliers：[{id:\"O1\", description:\"某分店單月營收暴增 300%\", data_error_ruled_out:true, data_error_assessment:\"已核對 POS 紀錄與銀行對帳單，排除輸入錯誤與重複入帳\", mechanism_hypothesis:\"該分店同期舉辦快閃店活動，吸引大量非常客一次性消費\"}]\n（重點）如果 data_error_ruled_out 填 false（尚未排除資料錯誤），卻還是填了 mechanism_hypothesis，會被拒絕建立——資料錯誤都還沒排除就先編一個機制故事，正是這個方法要防止的跳步驟。"
    example_en: "Scenario: investigating a store branch's single-month revenue spike of 300%. outliers: [{id:'O1', description:\"one branch's monthly revenue spiked 300%\", data_error_ruled_out:true, data_error_assessment:'cross-checked POS records against bank statements, ruled out entry errors and duplicate postings', mechanism_hypothesis:'the branch ran a pop-up event during the same period, drawing a large one-time influx of non-regular customers'}]. Key point: if data_error_ruled_out were false (data error not yet ruled out) while mechanism_hypothesis was still supplied, the record would be refused at construction -- offering a mechanism story before data error is actually ruled out is exactly the skipped step this method exists to prevent."
  foresight.scenario_planning:
    name_en: "Scenario Planning"
    abbr: ""
    name_zh: "情境規劃"
    blurb_en: "Builds exactly 4 scenarios across 2 critical uncertainties, each fully fleshed out, instead of betting on one single forecast. Use it to plan for multiple plausible futures instead of one predicted one."
    blurb_zh: "用兩個關鍵不確定因素，建出正好四個完整情境，而不是只押注單一預測。想為多種可能未來做規劃、不依賴單一預測時用。"
    why_en: "exactly 2 critical_uncertainties and exactly 4 scenarios are required -- Atlas's own worked diagram is built on exactly two axes producing four named quadrants, and this method enforces that literal diagram rather than inventing an unwritten general 2^N rule. Every scenario also requires all 9 of Atlas's own verbatim elements (drivers/assumptions/narrative/stakeholder_responses/competitor_responses/second_third_order_effects/signposts/strategy_performance/reversal_condition) non-empty -- a scenario missing any one of these hasn't actually completed Atlas's own worked list."
    why_zh: "一定要剛好 2 個 critical_uncertainties（關鍵不確定因素）跟剛好 4 個 scenarios（情境）——Atlas 自己的圖解就是用兩個軸畫出四個命名象限，這個方法照字面實作這張圖，而不是自己發明一個 Atlas 沒寫過的「2 的 N 次方」通則。每個情境也一定要有 Atlas 自己列出的全部 9 個要素（驅動因子／假設／敘事／利害關係人反應／競爭者反應／二三階效應／訊號指標／策略表現／反轉條件），缺一個都算沒有真的填完 Atlas 自己的清單。"
    url: "https://en.wikipedia.org/wiki/Scenario_planning"
    example_zh: "情境：用「法規鬆緊」「AI 訓練成本高低」兩個關鍵不確定因素建 4 個情境。\ncritical_uncertainties：[\"法規鬆緊\", \"AI 訓練成本高低\"]\n4 個情境對應 2x2 象限（寬鬆+低成本／寬鬆+高成本／嚴格+低成本／嚴格+高成本），以「寬鬆+低成本」為例，9 個必填欄位都要填：drivers:[\"政府傾向產業自律，不預先立法\"]、assumptions:[\"晶片與能源成本持續下降\"]、narrative:\"法規寬鬆疊加訓練成本快速下降，大量新創湧入市場\"、stakeholder_responses:[\"新創加速產品上市搶佔市場\"]、competitor_responses:[\"大型業者降價並開源部分工具\"]、second_third_order_effects:[\"低品質應用氾濫，一旦出事會引發突發式監管\"]、signposts:[\"新創 AI 產品上架數量單季成長超過 30%\"]、strategy_performance:\"低成本結構下能快速擴張，但品牌與合規風險同步升高\"、reversal_condition:\"若發生重大 AI 事故引發輿論，政府可能短時間內轉向嚴格立法\"；其餘 3 個象限比照同樣 9 個欄位、各自填寫對應象限的真實內容。\n（重點）如果只填 3 個情境（例如漏掉「嚴格+高成本」），會被拒絕建立——2 個關鍵不確定因素一定要對應剛好 4 個情境，少一個都不行。"
    example_en: "Scenario: building 4 scenarios from 'regulation loose/strict' and 'AI training cost high/low' as the 2 critical uncertainties. critical_uncertainties: ['regulatory strictness', 'AI training cost level']; the 4 scenarios map to the 2x2 quadrants (loose+low-cost / loose+high-cost / strict+low-cost / strict+high-cost). For 'loose+low-cost', all 9 required fields: drivers:['government favors industry self-regulation over pre-emptive legislation']; assumptions:['chip and energy costs keep falling']; narrative:'loose regulation plus fast-falling training cost draws a flood of startups into the market'; stakeholder_responses:['startups accelerate product launches to grab market share']; competitor_responses:['incumbents cut prices and open-source some tooling']; second_third_order_effects:['low-quality applications proliferate; a major incident could trigger sudden regulatory backlash']; signposts:['startup AI product launches grow >30% quarter over quarter']; strategy_performance:'the low-cost structure enables rapid expansion but raises brand and compliance risk in parallel'; reversal_condition:'a major AI incident drawing public attention could push government toward strict legislation quickly'. The other 3 quadrants follow the same 9-field shape with their own real content. Key point: if only 3 scenarios were supplied (e.g. 'strict+high-cost' omitted), the record would be refused at construction -- 2 critical uncertainties must map to exactly 4 scenarios, no fewer."
  foresight.weak_signal_detection:
    name_en: "Weak Signal Detection"
    abbr: ""
    name_zh: "微弱訊號偵測"
    blurb_en: "Finds not-yet-mainstream signals and requires 2+ independent corroborating sources before treating one as real (not just an anecdote). Use it to get early warning without chasing every random anecdote."
    blurb_zh: "找出還沒成為主流的訊號，且必須有兩個以上獨立來源佐證才算數（不只是單一軼事）。想提前偵測趨勢又不想追著每個道聽塗說跑時用。"
    why_en: "corroborating_source_refs must have >=2 DISTINCT sources after whitespace normalization -- ' eu ' and 'eu' count as one source, not two, closing a real bug a prior batch shipped. Atlas's own pipeline word is 'triangulate': a weak signal corroborated by only 1 source has not been triangulated, it is an anecdote, and silently accepting it would defeat this method's whole stated benefit of gaining lead time without false positives."
    why_zh: "corroborating_source_refs（佐證來源）在去除空白後一定要有至少 2 個不同的來源—— \" eu \" 跟 \"eu\" 算同一個來源，不是兩個，這是修正之前一批曾經出過的真實 bug。Atlas 自己的管線用詞是「triangulate」（三角驗證）：只有 1 個來源佐證的微弱訊號根本沒被三角驗證過，只是一則軼事，默默接受它會直接破壞這個方法「提早獲得提前量、又不製造誤報」的整個效益。"
    url: "https://en.wikipedia.org/wiki/Strategic_early_warning_system"
    example_zh: "情境：偵測一個關於「合成生物材料」的微弱訊號。\nweak_signals：[{id:\"WS1\", description:\"多個獨立團隊開始用合成生物材料取代塑膠包裝\", corroborating_source_refs:[\"歐盟研究報告\", \"日本新創募資新聞\"], monitor_status:\"MONITORING\"}]\n（重點）如果 corroborating_source_refs 只填 [\"歐盟研究報告\"] 這一個來源，或填了 [\"歐盟研究報告\", \" 歐盟研究報告 \"]（去除空白後其實是同一個），都會被拒絕建立——Atlas 自己講的「triangulate」要求至少 2 個真正不同的來源，1 個來源只是軼事。"
    example_en: "Scenario: detecting a weak signal about 'synthetic bio-based packaging materials'. weak_signals: [{id:'WS1', description:'multiple independent teams are starting to replace plastic packaging with synthetic bio-based materials', corroborating_source_refs:['EU research report', 'Japanese startup funding news'], monitor_status:'MONITORING'}]. Key point: if corroborating_source_refs had only 1 entry, e.g. ['EU research report'] alone, or ['EU research report', ' EU research report '] (the same source after whitespace normalization), the record would be refused at construction -- Atlas's own 'triangulate' requires at least 2 genuinely distinct sources; a single source is just an anecdote."
  foresight.wild_cards:
    name_en: "Wild Cards"
    abbr: ""
    name_zh: "外卡情境"
    blurb_en: "Injects a dramatic, non-mainstream event and re-runs your strategy under it to test for regime shifts. Use it to stress-test a strategy against a genuinely disruptive surprise."
    blurb_zh: "加入一個劇烈的非主流事件，重新跑一次策略，測試是否遇到典範轉移。想用真正顛覆性的意外測試策略韌性時用。"
    why_en: "every declared wild card must carry a non-empty strategy_rerun -- Atlas's own literal pipeline is 'wild card->re-run strategy', and the stated benefit ('test for a regime shift') only holds if the strategy was actually re-run under the card. strategy_rerun is modeled as a checkable sub-structure (strategy_ref/outcome_under_card/still_holds), not a bare string, and still_holds must be a genuine boolean -- an int 0/1 is refused, never silently treated as a legal boolean."
    why_zh: "每個宣告的外卡都一定要有非空的 strategy_rerun（策略重跑結果）——Atlas 自己的管線字面上就是「外卡→重跑策略」，而且「測試典範轉移」這個效益，只有在策略真的被重跑過的前提下才成立。strategy_rerun 被建模成一個可檢查的子結構（strategy_ref／outcome_under_card／still_holds），不是一段自由文字，而且 still_holds 一定要是真正的布林值——int 0/1 會被拒絕，不會被默默當成合法的布林值接受。"
    url: "https://en.wikipedia.org/wiki/Wild_card_(foresight)"
    example_zh: "情境：測試「央行系統性失能導致惡性通膨」這張外卡對現行訂價策略的衝擊。\nwild_cards：[{id:\"WC1\", description:\"中央銀行系統性失能導致惡性通膨\", strategy_rerun:{strategy_ref:\"STRAT-PRICING-2026\", outcome_under_card:\"重新模擬後，固定年度訂價策略會在 6 個月內侵蝕全部毛利\", still_holds:false}}]\n（重點）如果 still_holds 填 0 或 1（int）而不是 true/false（真正的布林值），會被拒絕建立——still_holds 一定要是真正的布林值，不接受用整數偷渡。"
    example_en: "Scenario: testing the wild card 'central bank systemic failure causes hyperinflation' against the current pricing strategy. wild_cards: [{id:'WC1', description:'central bank systemic failure causes hyperinflation', strategy_rerun:{strategy_ref:'STRAT-PRICING-2026', outcome_under_card:'re-simulation shows the fixed annual pricing strategy would erode all margin within 6 months', still_holds:false}}]. Key point: if still_holds were 0 or 1 (an int) instead of true/false (a genuine boolean), the record would be refused at construction -- still_holds must be a real boolean, not an int smuggled in as one."

  # ---- framing (F01) ----
  framing.boundary_critique:
    name_en: "Boundary Critique"
    abbr: ""
    name_zh: "邊界批判"
    blurb_en: "Checks who's the decision maker, who's affected, who's excluded, what resources, and what values are in play -- revealing hidden power and value assumptions. Use it when a decision affects people who aren't in the room."
    blurb_zh: "檢視誰是決策者、誰受影響、誰被排除、有哪些資源、隱含什麼價值觀，揭露隱藏的權力與價值假設。決策會影響到不在場的人時用。"
  framing.five_w_one_h:
    name_en: "5W1H Problem Profile"
    abbr: "5W1H"
    name_zh: "5W1H 問題輪廓"
    blurb_en: "Quickly profiles a fuzzy problem across Who/What/When/Where/Why/How, explicitly marking which dimensions are still unanswered. Use it right at the start when information is too thin to even define the problem yet."
    blurb_zh: "用 Who/What/When/Where/Why/How 快速建立模糊問題的輪廓，明確標出哪些面向還沒答案。資訊不足、連問題都還定義不清楚時，最開始用它。"
  framing.frame_storming:
    name_en: "Frame Storming"
    abbr: ""
    name_zh: "框架風暴"
    blurb_en: "Generates several distinct framings of a problem, then explicitly picks one -- so the chosen frame is a real selection, not the only one considered. Use it before committing to how you're even looking at a problem."
    blurb_zh: "先產生多個不同的問題框架，再明確選出一個——確保是真的選過，而不是只想到一種角度。要決定用哪個角度看問題之前用。"
  framing.future_compass:
    name_en: "Future Compass"
    abbr: ""
    name_zh: "未來羅盤"
    blurb_en: "Clarifies future goals and sense of direction. Non-diagnostic."
    blurb_zh: "釐清未來目標與方向感。非診斷工具。"
  framing.goal_statement:
    name_en: "Goal Statement"
    abbr: ""
    name_zh: "目標陳述"
    blurb_en: "Turns a vague wish into a concrete goal: goal -> beneficiary -> timeframe -> success condition -> constraints. Use it at the very start of a task to prevent scope drift later."
    blurb_zh: "把模糊願望轉成明確目標：目標→受益者→時間→成功條件→限制。任務起始時用，降低之後的範圍漂移。"
  framing.grow_model:
    name_en: "GROW Model"
    abbr: "GROW"
    name_zh: "GROW 模型"
    blurb_en: "Sets a goal and concrete action strategy (Goal/Reality/Options/Will). Non-diagnostic."
    blurb_zh: "設定目標與具體行動策略。非診斷工具。"
  framing.how_might_we:
    name_en: "How Might We"
    abbr: "HMW"
    name_zh: "我們可以如何…"
    blurb_en: "Reframes a pain point into an open, solution-agnostic question ('How might we...') to widen the solution space. Use it right before a creative/ideation session, so you don't accidentally pre-suppose the answer."
    blurb_zh: "把痛點轉成開放、不預設方案的問題（「我們可以如何…」），擴大解法空間。進入創意發想階段之前用，避免不小心先預設了答案。"
  framing.non_goals:
    name_en: "Non-goals"
    abbr: ""
    name_zh: "非目標清單"
    blurb_en: "Explicitly states what you will NOT do, with a reason and a re-review condition. Use it on a large project to control scope and cost."
    blurb_zh: "明確說出「這次不做什麼」，附理由與重審條件。大型專案想控制範圍與成本時用。"
  framing.north_star_metric:
    name_en: "North Star Metric"
    abbr: ""
    name_zh: "北極星指標"
    blurb_en: "Names the core value proposition, its proxy metric, and an anti-gaming check -- a genuine proxy, not the value itself restated. Use it to focus a product strategy on one long-term value metric."
    blurb_zh: "找出核心價值主張、其代理指標、以及防造假驗證——代理指標必須真的不同於核心價值本身。想讓產品策略聚焦單一長期價值指標時用。"
  framing.okr:
    name_en: "Objectives and Key Results"
    abbr: "OKR"
    name_zh: "OKR 目標關鍵成果"
    blurb_en: "Separates direction (Objective) from 2-5 measurable Key Results, each with an owner and review cadence. Use it for team/quarterly goal-setting so you don't just track busywork."
    blurb_zh: "把方向（O）跟 2-5 個可衡量成果（KR）分開，各自指定負責人與檢視頻率。團隊／季度目標設定，避免只追工作量時用。"
  framing.problem_statement:
    name_en: "Problem Statement"
    abbr: ""
    name_zh: "問題陳述"
    blurb_en: "Describes Current -> Expected -> Gap -> Impact -> Constraints, building a shared problem definition across people. Use it when a team needs to agree on what the actual problem is before debating solutions."
    blurb_zh: "描述現況→預期→落差→影響→限制，建立跨人共同的問題定義。團隊需要先對齊「問題到底是什麼」再吵解法時用。"
  framing.reframing:
    name_en: "Reframing"
    abbr: ""
    name_zh: "框架轉換"
    blurb_en: "Reinterprets a painful experience from another angle, redefining 'failure/shame/regret'. Non-diagnostic."
    blurb_zh: "換角度詮釋痛苦經驗，重新定義「失敗／羞恥／後悔」。非診斷工具。"
  framing.smart:
    name_en: "SMART Goal"
    abbr: "SMART"
    name_zh: "SMART 目標"
    blurb_en: "Refines an already-stated goal against 5 fixed criteria: Specific, Measurable, Achievable, Relevant, Time-bound. Use it right after Goal Statement, to sharpen a goal that's still too soft."
    blurb_zh: "用五個固定標準（明確、可衡量、可達成、相關、有時限）精煉一個已經說出口的目標。在目標陳述之後、覺得目標還不夠具體時用。"
  framing.success_criteria:
    name_en: "Success Criteria"
    abbr: ""
    name_zh: "成功標準"
    blurb_en: "Pre-defines Must/Should/Guardrail/Stop criteria BEFORE a high-stakes decision, so the bar can't be moved after the fact. Use it before any decision where you'd be tempted to redefine 'success' in hindsight."
    blurb_zh: "在高風險決策之前，先定義必須／應該／護欄／停止標準，防止事後改標準。任何你可能事後改口「成功」定義的決策之前用。"
  framing.value_sorting:
    name_en: "Value Sorting"
    abbr: ""
    name_zh: "價值觀排序"
    blurb_en: "Clarifies the core values of a person or team by ranking candidates. Non-diagnostic."
    blurb_zh: "釐清個人或團隊的核心價值。非診斷工具。"

  # ---- insight (F06 human/customer insight) ----
  insight.contextual_inquiry:
    name_en: "Contextual Inquiry"
    abbr: ""
    name_zh: "情境訪查"
    blurb_en: "Observes a user doing the real task in their real environment, asking questions in the moment, to surface needs they wouldn't think to mention. Especially effective for B2B workflows."
    blurb_zh: "在真實環境觀察使用者實際操作，即時追問，發現他們自己不會主動說的隱性需求。B2B 場景特別有效。"
    why_en: "every observations[] entry must carry ALL THREE non-empty fields (action_observed/researcher_note/followup_question) -- Atlas's own literal 3-arrow cycle is 'user does -> researcher observes -> immediate follow-up question', and an entry missing any one of the three has not actually completed that cycle for that moment, it's a bare note, not a contextual-inquiry observation."
    why_zh: "每個 observations[] 項目都一定要有三個欄位全部非空（action_observed／researcher_note／followup_question）——Atlas 自己的三箭頭循環是「使用者做→研究者看→即時追問」，缺一個都算沒有真的完成那個當下的循環，只是一則普通筆記，不是情境訪查觀察。"
    url: "https://www.nngroup.com/articles/contextual-inquiry/"
    example_zh: "情境：在顧客家中廚房觀察她實際操作智慧型烤箱。\nenvironment_context：「顧客家中廚房，實際操作智慧型烤箱」\nobservations：[{action_observed:\"使用者按了三次同一個按鈕才找到預熱功能\", researcher_note:\"操作路徑不直覺，圖示不夠清楚\", followup_question:\"為什麼會先按這個按鈕而不是別的？\"}]\n（重點）如果 followup_question 填空字串（只記錄了做了什麼跟觀察，沒有當場追問），會被拒絕建立——三個欄位缺一個，就沒有真的完成「做→看→問」這個循環。"
    example_en: "Scenario: observing a customer operating a smart oven in her own kitchen. environment_context: 'customer's home kitchen, actually operating the smart oven'; observations: [{action_observed: 'user pressed the same button 3 times before finding the preheat function', researcher_note: \"the interaction path isn't intuitive, the icon isn't clear enough\", followup_question: 'why did you press this button first instead of another one?'}]. Key point: if followup_question were an empty string (only recording the action and the observation, with no immediate follow-up question), the record would be refused at construction -- missing any one of the three fields means the do-watch-ask cycle wasn't actually completed."
  insight.empathy_map:
    name_en: "Empathy Map"
    abbr: ""
    name_zh: "同理心地圖"
    blurb_en: "Fills Says/Thinks/Does/Feels from real interviews/observations, each entry tagged fact or inference -- never pure AI guesswork. Use it to find the gap between what users say and what they actually do."
    blurb_zh: "從真實訪談／觀察填寫「說／想／做／感受」，每項都要標明是事實還是推論，不可純靠 AI 猜。想找出使用者說的跟做的之間的落差時用。"
    why_en: "entries must cover all 4 quadrants (SAYS/THINKS/DOES/FEELS) at least once each -- Atlas's own citation lists these as 4 co-equal parts, and an empathy map covering only some of them hasn't actually built one (more than 4 entries, i.e. multiple observations per quadrant, is explicitly allowed). Every entry's basis must also be FACT or INFERENCE -- mechanizing Atlas's own '標 fact/inference' instruction and its '不可純 AI 猜' caution, so an entry can never claim an unlabeled guess."
    why_zh: "entries 一定要涵蓋全部 4 個象限（SAYS／THINKS／DOES／FEELS）各至少一次——Atlas 自己的引用把這 4 個列為地位相同的四個部分，只涵蓋其中幾個算沒有真的做出同理心地圖（一個象限有超過 4 筆觀察是明確允許的）。每個項目的 basis 也一定要是 FACT 或 INFERENCE——把 Atlas 自己「標 fact/inference」的指示跟「不可純 AI 猜」的警告變成結構限制，一個項目永遠不能沒有標記就宣稱一個猜測。"
    url: "https://xplane.com/the-empathy-map-a-human-centered-tool-for-understanding-how-your-audience-thinks/"
    example_zh: "情境：了解新手用戶對記帳 App 的真實感受。\nsubject：「新手用戶對記帳 App 的使用經驗」\nentries：[{quadrant:\"SAYS\", content:\"這個介面看起來很複雜\", basis:\"FACT\"}, {quadrant:\"THINKS\", content:\"我可能會漏記一筆帳，錯過該還的錢\", basis:\"INFERENCE\"}, {quadrant:\"DOES\", content:\"反覆點開又關閉分類選單\", basis:\"FACT\"}, {quadrant:\"FEELS\", content:\"有點焦慮，怕自己用錯\", basis:\"INFERENCE\"}]\n（重點）如果 entries 只涵蓋 SAYS／THINKS／DOES 三個象限、漏了 FEELS，會被拒絕建立——四個象限缺一個都算沒有真的做出同理心地圖。"
    example_en: "Scenario: understanding a first-time user's real experience with a budgeting app. subject: \"first-time user's experience with a budgeting app\"; entries: [{quadrant:'SAYS', content:'this interface looks complicated', basis:'FACT'}, {quadrant:'THINKS', content:'I might forget to log an expense and miss a payment', basis:'INFERENCE'}, {quadrant:'DOES', content:'repeatedly opens and closes the category dropdown', basis:'FACT'}, {quadrant:'FEELS', content:\"a bit anxious, worried about using it wrong\", basis:'INFERENCE'}]. Key point: if entries only covered SAYS/THINKS/DOES and omitted FEELS, the record would be refused at construction -- missing even one of the 4 quadrants means an empathy map hasn't actually been built."
  insight.focus_group:
    name_en: "Focus Group"
    abbr: ""
    name_zh: "焦點團體"
    blurb_en: "Explores group perspective and interaction with 6-10 participants under moderation. Not for estimating population proportions -- use it to see social dynamics, not to poll."
    blurb_zh: "用 6-10 人的引導式討論探索群體觀點與互動。不能拿來估人口比例——是用來看社會互動，不是做民調。"
    why_en: "participant_count must be an int (bool excluded) in the closed range [6, 10] -- Atlas's own literal '6-10 人' IS the method's defining identity, not an example headcount. generalizability_scope is never a caller-supplied parameter -- every record this builder produces is fixed to 'qualitative exploration, not a population estimate', mechanizing Atlas's own caution that a focus group must never be used to estimate population proportions."
    why_zh: "participant_count 一定要是整數（排除布林值）且落在 [6, 10] 這個閉區間——Atlas 自己講的「6–10 人」就是這個方法的定義，不是舉例的人數。generalizability_scope 永遠不是呼叫端能自己填的參數——這個建構函式產出的每筆記錄都固定寫死「質性探索，不是母體估計」，把 Atlas 自己的警告「不用來估人口比例」變成結構上不可能違反的保證。"
    url: "https://www.scribbr.com/methodology/focus-group/"
    example_zh: "情境：針對新款保溫瓶的開瓶設計做焦點團體訪談。\ntopic：「新款保溫瓶的開瓶設計」\nparticipant_count：8\nmoderation_approach：「半結構式訪談，先個別體驗產品再開放討論」\ndiscussion_summary：「多數參與者認為單手開瓶很方便，但有 3 位提到瓶蓋容易滑手」\nanalysis：「開瓶便利性是共識優點，防滑材質是下一步可以改善的方向」\ngeneralizability_scope 不用也不能自己填，系統固定寫死「質性探索，不是母體比例估計」。\n（重點）如果 participant_count 填 15（超過 10 人上限），會被拒絕建立——6–10 人是這個方法自己的定義範圍，不是隨便的建議值。"
    example_en: "Scenario: running a focus group on a new thermos bottle's opening mechanism design. topic: 'opening mechanism design for the new thermos bottle'; participant_count: 8; moderation_approach: 'semi-structured -- individual hands-on trial first, then open discussion'; discussion_summary: 'most participants found one-handed opening convenient, but 3 mentioned the cap feels slippery'; analysis: 'opening convenience is a consensus strength; a non-slip material is the next improvement direction'. generalizability_scope is never supplied directly -- the system fixes it to 'qualitative exploration, not a population estimate'. Key point: if participant_count were 15 (over the 10-person ceiling), the record would be refused at construction -- 6-10 is this method's own defining range, not a loose suggestion."
  insight.interview:
    name_en: "Interview"
    abbr: ""
    name_zh: "深度訪談"
    blurb_en: "Full qualitative pipeline: research question -> sampling -> guide -> consent -> interview -> transcribe -> code -> themes -> negative cases. Cannot extrapolate population proportions from a small sample -- use it to understand the why/how behind behavior."
    blurb_zh: "完整質性研究流程：研究問題→抽樣→訪談大綱→同意書→訪談→逐字稿→編碼→主題→反例。不能用少量訪談推估人口比例——是用來理解行為背後的為什麼／怎麼做。"
    why_en: "all 9 of §12.17's own literal pipeline stages must be present and non-empty (codes/themes as non-empty lists, the rest as non-empty strings) -- a study missing any one of them hasn't actually completed the chain. documented_biases is a SEPARATE, ADDITIONAL required field, not one of the 9 stages -- it mechanizes the F06 table row's own explicit caution ('樣本與偏誤要記錄') as a real structural requirement rather than a soft caution a caller could silently skip."
    why_zh: "§12.17 自己的 9 個管線階段（研究問題／抽樣方式／訪談大綱／同意流程／訪談筆記／逐字稿參照／編碼／主題／反例）都一定要存在且非空（codes／themes 是非空字串清單，其餘是非空字串）——缺一個階段就沒有真的走完這條鏈。documented_biases（記錄的偏誤）是另一個獨立的必填欄位，不算 9 個階段之一——它把 F06 表格列自己講的警告「樣本與偏誤要記錄」變成真的結構要求，不是一個呼叫端可以默默跳過的軟性提醒。"
    url: "https://delvetool.com/blog/negativecase"
    example_zh: "情境：研究使用者為什麼取消訂閱制健身 App。\nresearch_question：「使用者為什麼放棄訂閱制健身 App？」\nsampling_approach：「立意抽樣，找 3 個月內取消訂閱的用戶」\ndocumented_biases：「樣本全部來自同一個城市，可能無法代表其他地區的使用習慣」\nguide：「半結構式訪談大綱，聚焦取消前的最後一次使用經驗」\nconsent_process：「口頭同意錄音，告知可隨時中止」\ninterview_notes：「多數受訪者提到續訂價格上升是主因」\ntranscript_ref：「TRANSCRIPT-2026-INT-014」\ncodes：[\"價格敏感\", \"功能未被使用\", \"忘記取消\"]\nthemes：[\"續訂價格是主要流失原因\"]\nnegative_cases：「1 位受訪者續訂價格沒變也取消，原因是搬家後健身房會員更划算」\n（重點）如果 documented_biases 留空，會被拒絕建立——記錄樣本與偏誤是 Atlas 自己講的明確警告，不是可有可無的欄位。"
    example_en: "Scenario: researching why users cancel a subscription fitness app. research_question: 'why do users cancel their subscription fitness app?'; sampling_approach: 'purposive sampling, targeting users who canceled within the last 3 months'; documented_biases: 'all participants came from the same city, may not represent usage habits elsewhere'; guide: 'semi-structured guide focused on the last usage experience before cancellation'; consent_process: 'verbal consent to record, informed they could stop anytime'; interview_notes: 'most participants cited the renewal price increase as the main reason'; transcript_ref: 'TRANSCRIPT-2026-INT-014'; codes: ['price sensitivity', 'unused features', 'forgot to cancel']; themes: ['renewal price is the primary churn driver']; negative_cases: 'one participant canceled despite an unchanged renewal price, because a gym membership became cheaper after moving'. Key point: if documented_biases were left empty, the record would be refused at construction -- documenting sample and bias is Atlas's own explicit caution, not an optional field."
  insight.journey_map:
    name_en: "Customer Journey Map"
    abbr: ""
    name_zh: "顧客旅程地圖"
    blurb_en: "Maps stages -> actions -> emotion -> pain -> opportunity across an end-to-end experience. Use it to find where the experience breaks down and where the highest-value fixes are."
    blurb_zh: "畫出端到端體驗的階段→行動→情緒→痛點→機會。想找出體驗斷點跟最有價值的改善點時用。"
    why_en: "the set of stage_number values across all stages must equal exactly {1, 2, ..., N} where N is the number of stages -- no gaps, no duplicates. Atlas's own 'end-to-end experience' framing IS a real ordered sequence, and a journey map with a skipped or duplicated stage number hasn't actually mapped a coherent one."
    why_zh: "所有 stages 的 stage_number 集合起來，一定要剛好等於 {1, 2, ..., N}（N 是階段總數）——不能有空缺，也不能重複。Atlas 自己的「端到端體驗」框架講的就是一條真實的有序序列，一個跳號或重複編號的旅程地圖，等於沒有真的畫出一條連貫的序列。"
    url: "https://www.nngroup.com/articles/journey-mapping-101/"
    example_zh: "情境：畫出「線上訂餐從搜尋到收到餐點」的旅程地圖。\njourney_subject：「線上訂餐從搜尋到收到餐點」\nstages：[{stage_number:1, stage_name:\"搜尋餐廳\", actions:\"在 App 上搜尋附近評價高的餐廳\", emotion:\"期待\", pain:\"選項太多不知道怎麼選\", opportunity:\"可以加入依口味/預算篩選功能\"}, {stage_number:2, stage_name:\"下單付款\", actions:\"選好餐點後結帳\", emotion:\"有點緊張怕選錯\", pain:\"付款頁面跳轉太多步驟\", opportunity:\"簡化付款流程到 2 步內\"}]\n（重點）如果只有 2 個階段卻編號成 1 跟 3（跳過 2），會被拒絕建立——階段編號一定要剛好覆蓋 1 到階段總數，不能有空缺。"
    example_en: "Scenario: mapping the journey of 'ordering food online, from search to delivery'. journey_subject: 'ordering food online, from search to delivery'; stages: [{stage_number:1, stage_name:'search for a restaurant', actions:'searches the app for highly-rated restaurants nearby', emotion:'anticipation', pain:'too many options, hard to choose', opportunity:'add filtering by taste/budget'}, {stage_number:2, stage_name:'order and pay', actions:'checks out after selecting items', emotion:'slightly anxious about picking wrong', pain:'checkout has too many steps', opportunity:'simplify checkout to 2 steps'}]. Key point: if there were only 2 stages but numbered 1 and 3 (skipping 2), the record would be refused at construction -- stage numbers must cover exactly 1 through the total stage count, with no gaps."
  insight.jtbd:
    name_en: "Jobs To Be Done"
    abbr: "JTBD"
    name_zh: "待完成任務理論"
    blurb_en: "Frames what a user is really trying to accomplish: 'When [situation], I want to [motivation], so I can [desired outcome].' Use it for a new product, to avoid designing feature-first instead of need-first."
    blurb_zh: "用「當〔情境〕，我想要〔動機〕，這樣我就能〔期望結果〕」框出使用者真正想完成的事。做新產品時用，避免陷入 feature-first 而不是 need-first。"
    why_en: "local_evidence is mandatory, never optional -- this is §11.12's own explicit standalone rule ('必須搭配 Local Evidence -- 不能假設不同文化的 motivation 相同'), disclosed as a hard requirement, not an inferred caution. situation/motivation/desired_outcome must also each be non-empty -- §11.12's own 3-clause template has exactly 3 required clauses, and a statement missing any one of them is not actually a JTBD statement."
    why_zh: "local_evidence（在地證據）是強制欄位，絕對不是可有可無的——這是 §11.12 自己明講的獨立規則（「必須搭配 Local Evidence——不能假設不同文化的 motivation 相同」），是揭露出來的硬性要求，不是推論出來的提醒。situation／motivation／desired_outcome 也一定要各自非空——§11.12 自己的三句式模板剛好有 3 個必要子句，缺一個都不算真正的 JTBD 陳述。"
    url: "https://www.christenseninstitute.org/theory/jobs-to-be-done/"
    example_zh: "情境：了解用戶為什麼想要離線學習功能。\nsituation：「當我在通勤路上想追進度但網速不穩」\nmotivation：「想要離線也能繼續看課程影片」\ndesired_outcome：「這樣我到公司前就能學完一個單元，不浪費通勤時間」\nlocal_evidence：「台灣用戶訪談中 6/10 人提到通勤是主要學習時段，且抱怨行動網路不穩定」\nworkaround（選填）：「目前會提前在有 wifi 時手動下載影片存到手機相簿」\n（重點）如果 local_evidence 留空字串，會被拒絕建立——§11.12 明確要求不能假設不同文化的 motivation 相同，沒有在地證據就不能只憑假設寫這個陳述。"
    example_en: "Scenario: understanding why users want an offline-viewing feature. situation: 'when I want to keep up with a course during my commute but the connection is unstable'; motivation: 'I want to keep watching course videos even offline'; desired_outcome: 'so I can finish a unit before I get to the office, without wasting commute time'; local_evidence: '6 of 10 Taiwanese users interviewed cited commuting as their main learning time and complained about unstable mobile data'; workaround (optional): \"currently pre-downloads videos to the phone's gallery whenever wifi is available\". Key point: if local_evidence were an empty string, the record would be refused at construction -- §11.12 explicitly requires never assuming motivation is identical across cultures, so this statement can't rest on assumption alone without local evidence."
  insight.persona:
    name_en: "Persona"
    abbr: ""
    name_zh: "使用者原型"
    blurb_en: "Builds a representative user model from real research data (goals/behavior/context) -- a persona is not a public-opinion poll. Use it to build a shared reference point for who you're designing for."
    blurb_zh: "用真實研究資料建立代表性使用者模型（目標／行為／情境）——persona 不等於真實民意。想為「到底在為誰設計」建立共同參考點時用。"
    why_en: "research_basis must be a non-empty list -- the mechanized form of Atlas's own explicit misuse caution 'Persona != real public opinion': a persona with zero disclosed research grounding is an invented composite presented as if it represents real people, exactly the abuse the caution warns against. goals and behaviors must also each be non-empty lists -- Atlas's own literal 'goals/behavior/context' split, and a persona with zero goals or behaviors hasn't actually modeled anything."
    why_zh: "research_basis（研究依據）一定要是非空清單——這是 Atlas 自己明講的誤用警告「Persona ≠ 真實民意」的機械化版本：一個完全沒有揭露研究依據的 persona，等於是一個被包裝成真實人群的憑空捏造角色，正是這個警告要防的濫用。goals 跟 behaviors 也一定要各自是非空清單——Atlas 自己的「goals/behavior/context」三分法，一個沒有目標或行為的 persona 等於沒有真的建模任何東西。"
    url: "https://en.wikipedia.org/wiki/Persona_(user_experience)"
    example_zh: "情境：為一個食譜 App 建立代表性使用者。\npersona_name：「小美，34 歲，雙薪家庭的忙碌媽媽」\ngoals：[\"快速做出健康的晚餐\", \"不想每天想菜單\"]\nbehaviors：[\"下班路上用手機看食譜\", \"傾向選擇 30 分鐘內能完成的料理\"]\ncontext：「全職工作＋照顧 2 個小孩，晚上時間非常有限」\nresearch_basis：[\"2026 年 3 月對 15 位雙薪家長的深度訪談\", \"App 使用數據顯示晚間 6-8 點是尖峰使用時段\"]\n（重點）如果 research_basis 留空清單，會被拒絕建立——沒有揭露研究依據的 persona，就是把憑空捏造的角色包裝成真實使用者，正是 Atlas 自己警告的「Persona ≠ 真實民意」。"
    example_en: "Scenario: building a representative user persona for a recipe app. persona_name: 'Mei, 34, a busy mom in a dual-income household'; goals: ['make a healthy dinner quickly', \"doesn't want to think up a menu every day\"]; behaviors: ['browses recipes on her phone during the commute home', 'tends to pick meals completable within 30 minutes']; context: 'works full-time and cares for 2 young kids, very little time in the evening'; research_basis: ['in-depth interviews with 15 dual-income parents, March 2026', 'app usage data shows 6-8pm is peak usage time']. Key point: if research_basis were an empty list, the record would be refused at construction -- a persona with no disclosed research grounding is an invented composite dressed up as a real user, exactly what Atlas's own 'persona != real public opinion' caution warns against."
  insight.service_blueprint:
    name_en: "Service Blueprint"
    abbr: ""
    name_zh: "服務藍圖"
    blurb_en: "Maps customer actions against frontstage, backstage, support, and systems layers together -- not just the UI. Use it for a service system where fixing the interface alone won't fix the experience."
    blurb_zh: "把顧客行動對照前台、後台、支援、系統層一起畫出來，不是只改介面。服務型系統、光改 UI 解決不了問題時用。"
    why_en: "layers must cover all 5 LAYER_TYPES (CUSTOMER_ACTIONS/FRONTSTAGE/BACKSTAGE/SUPPORT_PROCESSES/SYSTEMS_DATA) at least once, duplicates permitted -- a blueprint missing even one of the 5 named layers has structurally reproduced the exact frontstage-only tunnel vision this method's own stated benefit ('避免只改 UI') exists to prevent."
    why_zh: "layers 一定要涵蓋全部 5 個層級（顧客行動／前台／後台／支援流程／系統資料）各至少一次，重複是允許的——一個漏掉其中任何一層的藍圖，等於結構性地重現了這個方法自己要防止的「只改前台畫面」的隧道視野。"
    url: "https://www.smaply.com/blog/service-blueprint"
    example_zh: "情境：畫出連鎖咖啡店線上預點服務的服務藍圖。\nservice_name：「連鎖咖啡店線上預點服務」\nlayers：[{layer_type:\"CUSTOMER_ACTIONS\", description:\"顧客在 App 選好飲品並預付款\"}, {layer_type:\"FRONTSTAGE\", description:\"店員在螢幕看到新訂單並確認\"}, {layer_type:\"BACKSTAGE\", description:\"吧檯人員依序製作飲品\"}, {layer_type:\"SUPPORT_PROCESSES\", description:\"庫存系統自動扣除對應原料\"}, {layer_type:\"SYSTEMS_DATA\", description:\"POS 系統同步訂單狀態給顧客 App\"}]\n（重點）如果 layers 漏掉 SYSTEMS_DATA 這一層，會被拒絕建立——5 個層級缺一個，就等於沒有真的看到「畫面看起來簡單，但後端流程很痛」的問題。"
    example_en: "Scenario: blueprinting a coffee chain's online pre-order service. service_name: 'coffee chain online pre-order service'; layers: [{layer_type:'CUSTOMER_ACTIONS', description:'customer selects a drink and prepays in the app'}, {layer_type:'FRONTSTAGE', description:'staff sees the new order on screen and confirms it'}, {layer_type:'BACKSTAGE', description:'barista prepares the drink in order'}, {layer_type:'SUPPORT_PROCESSES', description:'inventory system automatically deducts the corresponding ingredients'}, {layer_type:'SYSTEMS_DATA', description:'POS system syncs order status back to the customer app'}]. Key point: if layers omitted the SYSTEMS_DATA layer, the record would be refused at construction -- missing even one of the 5 layers means the 'the screen looks simple but the backend process is painful' problem hasn't actually been surfaced."
  insight.survey:
    name_en: "Survey / Questionnaire"
    abbr: ""
    name_zh: "問卷調查"
    blurb_en: "Large-scale quantitative pipeline (construct -> question -> pilot -> sample -> analysis) with sampling-bias awareness; translated versions need semantic equivalence testing, not literal translation. Use it to estimate proportions or segment a large population."
    blurb_zh: "大規模量化流程（構念→問題→試測→抽樣→分析），要注意抽樣偏誤；翻譯版本要做語義等值測試，不是直譯。想估計比例或做大規模分群時用。"
    why_en: "every one of the 4 closed quality_dimensions (CONSTRUCT_VALIDITY/SAMPLING/QUESTION_WORDING/NON_RESPONSE_BIAS) must appear at least once with a non-empty mitigation_note -- Atlas's own §12.18 names these as the method's defining quality concerns. When is_translated is True, both semantic_equivalence_check and local_pilot_ref become required non-empty fields; when False, both must be entirely absent -- mechanizing Atlas's own explicit global requirement that a translated survey needs semantic equivalence checking and a local pilot, not just a literal translation."
    why_zh: "quality_dimensions 這 4 個封閉類別（建構效度／抽樣／題目用詞／無回應偏誤）每一個都一定要至少出現一次、且各自要有非空的 mitigation_note（緩解說明）——這是 Atlas §12.18 自己點名的這個方法的定義性品質疑慮。當 is_translated 是 True 時，semantic_equivalence_check（語義等值檢查）跟 local_pilot_ref（在地前測參照）都變成必填非空欄位；是 False 時兩者都一定要完全不存在——把 Atlas 自己明講的全球化要求（翻譯後必須做語義等值與在地前測，不是直譯就好）變成結構規則。"
    url: "https://www.qualtrics.com/articles/strategy-research/survey-bias/"
    example_zh: "情境：設計一份測量顧客滿意度的問卷（未翻譯，單一語言市場）。\nconstruct_definition：「定義『顧客滿意度』為對產品易用性、客服回應速度、價格合理性三面向的綜合評分」\nquestion_design：「每面向各 3 題 5 點量表，避免雙重否定與誘導性用詞」\npilot_summary：「對 20 人做前測，修正 2 題語意不清的題目」\nsampling_plan：「從近 6 個月購買紀錄中分層抽樣，涵蓋新舊客戶比例」\nanalysis_plan：「用描述統計呈現各面向平均分，並用迴歸分析找出對整體滿意度影響最大的面向」\nquality_dimensions：[{dimension:\"CONSTRUCT_VALIDITY\", mitigation_note:\"題目已請 2 位外部專家審查是否真的測到滿意度而非單純情緒\"}, {dimension:\"SAMPLING\", mitigation_note:\"確認樣本涵蓋不同購買頻率的客群，避免只問常客\"}, {dimension:\"QUESTION_WORDING\", mitigation_note:\"前測後修正了容易誤解的雙重否定題目\"}, {dimension:\"NON_RESPONSE_BIAS\", mitigation_note:\"比對填答者與未填答者的基本輪廓，確認無明顯系統性差異\"}]\nis_translated：false\n（重點）如果 is_translated 改成 true，卻沒填 semantic_equivalence_check，會被拒絕建立——翻譯後的問卷一定要做語義等值檢查，不能只是直譯就上線。"
    example_en: "Scenario: designing a customer-satisfaction survey (untranslated, single-language market). construct_definition: \"defines 'customer satisfaction' as a composite score across product usability, support responsiveness, and price fairness\"; question_design: '3 five-point-scale questions per dimension, avoiding double negatives and leading wording'; pilot_summary: 'piloted with 20 respondents, revised 2 ambiguously-worded questions'; sampling_plan: 'stratified sampling from the last 6 months of purchase records, covering both new and repeat customers'; analysis_plan: 'descriptive statistics per dimension, plus regression to identify the dimension most predictive of overall satisfaction'; quality_dimensions: [{dimension:'CONSTRUCT_VALIDITY', mitigation_note:'2 external experts reviewed whether the questions actually measure satisfaction rather than mere sentiment'}, {dimension:'SAMPLING', mitigation_note:'confirmed the sample spans different purchase-frequency segments, not just frequent buyers'}, {dimension:'QUESTION_WORDING', mitigation_note:'the pilot caught and fixed an easily-misread double-negative question'}, {dimension:'NON_RESPONSE_BIAS', mitigation_note:'compared respondent vs. non-respondent profiles and found no clear systematic difference'}]; is_translated: false. Key point: if is_translated were changed to true without supplying semantic_equivalence_check, the record would be refused at construction -- a translated survey must undergo a semantic-equivalence check, it can't just ship as a literal translation."

  # ---- jurisdiction (F23 global jurisdiction/compliance/localization) ----
  jurisdiction.applicable_law_graph:
    name_en: "Applicable Law Graph"
    abbr: ""
    name_zh: "適用法規圖譜"
    blurb_en: "Maps legal sources and their applicability conditions (jurisdiction -> source -> effective date -> scope -> conflict). Use it to support versioning and conflict-of-law reasoning across jurisdictions."
    blurb_zh: "建立法規來源與適用條件的圖譜（管轄區→來源→生效日→範圍→衝突）。想支援跨管轄區的版本與衝突法推理時用。"
    why_en: "Mechanically detects unflagged legal conflicts by deriving date-range overlap directly from the stored effective_date/expiry_date fields, rather than trusting a human to remember whether two entries clash. Two laws covering the same jurisdiction+scope with overlapping effective windows are silently contradictory unless both carry a non-null conflict note -- so a live conflict can't be missed just because nobody happened to notice it."
    why_zh: "直接從存好的 effective_date／expiry_date 算出日期範圍是否重疊，機械式抓出「沒被標記的法律衝突」，不用靠人記得去比對；同一個管轄區＋範圍的兩筆法規，只要生效期間重疊，就是悄悄互相牴觸，除非兩筆都填了衝突說明，這樣才不會因為沒人注意到而漏掉一個正在生效的衝突。"
    url: "https://en.wikipedia.org/wiki/Choice_of_law"
    example_zh: "情境：比對台灣與 EU 客群適用的個資法規，並抓出衝突。\njurisdiction_nodes 至少 1 筆，jurisdiction_id 要唯一，例如 [{jurisdiction_id: \"TW\", description: \"台灣子公司資料蒐集\"}, {jurisdiction_id: \"EU\", description: \"EU 客群，適用 GDPR\"}]\nlaw_entries 至少 1 筆，law_id 要唯一，jurisdiction_id 必須指向真實存在的 jurisdiction_nodes，effective_date 要是合法 ISO-8601 日期字串，例如 [{law_id: \"LAW-TW-PDPA-2015\", jurisdiction_id: \"TW\", scope: \"個人資料蒐集與利用\", source: \"個人資料保護法(舊版)\", effective_date: \"2010-01-01\", expiry_date: \"2015-12-31\", conflict: null}, {law_id: \"LAW-TW-PDPA-2016\", jurisdiction_id: \"TW\", scope: \"個人資料蒐集與利用\", source: \"個人資料保護法(修正版)\", effective_date: \"2016-01-01\", expiry_date: null, conflict: null}]\n（選填）expiry_date／conflict 可以是 null；但只要兩筆法規的 jurisdiction_id＋scope 相同、生效期間又重疊，這兩筆的 conflict 就都不能是 null，例如同屬 EU＋「跨境資料傳輸」且都從 2018-05-25 生效的兩筆：[{law_id: \"LAW-EU-GDPR\", jurisdiction_id: \"EU\", scope: \"跨境資料傳輸\", source: \"GDPR\", effective_date: \"2018-05-25\", expiry_date: null, conflict: \"與會員國國內法在特定產業的跨境傳輸規則重疊，需個案認定何者優先\"}, {law_id: \"LAW-DE-BDSG-TELECOM\", jurisdiction_id: \"EU\", scope: \"跨境資料傳輸\", source: \"德國電信資料保護特別規定\", effective_date: \"2018-05-25\", expiry_date: null, conflict: \"與 GDPR 一般規則重疊，電信業須先適用本條款\"}]"
    example_en: "Scenario: compare Taiwan and EU personal-data law applicability and catch conflicts. jurisdiction_nodes has >=1 entry with a unique jurisdiction_id, e.g. [{jurisdiction_id: 'TW', description: 'Taiwan subsidiary data collection'}, {jurisdiction_id: 'EU', description: 'EU customer base, GDPR applies'}]; law_entries has >=1 entry with a unique law_id, jurisdiction_id must resolve to a real jurisdiction_nodes entry, effective_date must be a valid ISO-8601 date string, e.g. [{law_id: 'LAW-TW-PDPA-2015', jurisdiction_id: 'TW', scope: 'Personal data collection and use', source: 'Personal Data Protection Act (old)', effective_date: '2010-01-01', expiry_date: '2015-12-31', conflict: null}, {law_id: 'LAW-TW-PDPA-2016', jurisdiction_id: 'TW', scope: 'Personal data collection and use', source: 'Personal Data Protection Act (amended)', effective_date: '2016-01-01', expiry_date: null, conflict: null}]. Optional: expiry_date/conflict may be null -- but whenever two entries share the same jurisdiction_id+scope AND their effective windows overlap, both entries' conflict must be non-null, e.g. two EU + 'cross-border data transfer' entries both effective 2018-05-25: [{law_id: 'LAW-EU-GDPR', jurisdiction_id: 'EU', scope: 'Cross-border data transfer', source: 'GDPR', effective_date: '2018-05-25', expiry_date: null, conflict: 'Overlaps with a member state's own cross-border transfer rules for a specific sector; needs case-by-case precedence'}, {law_id: 'LAW-DE-BDSG-TELECOM', jurisdiction_id: 'EU', scope: 'Cross-border data transfer', source: 'German telecom-specific data protection rule', effective_date: '2018-05-25', expiry_date: null, conflict: 'Overlaps with the general GDPR rule; telecom sector must apply this provision first'}]"
  jurisdiction.compliance_gap_analysis:
    name_en: "Compliance Gap Analysis"
    abbr: ""
    name_zh: "合規缺口分析"
    blurb_en: "Mechanically derives the gap between required controls and implemented controls, with severity and a remediation plan. Use it to quickly know whether you're actually ready to launch in a regulated area."
    blurb_zh: "機械式算出「要求的控制」跟「已實作的控制」之間的差距，附嚴重度與補救計畫。想快速知道能不能在受規管領域上線時用。"
    why_en: "The gap set is derived (required_controls minus implemented_controls), and the caller's own annotated gap list must match that derived set EXACTLY -- missing a real gap or padding in a non-gap is both refused. This means a 'we're compliant' claim can't quietly omit a real gap, and can't fake rigor by annotating a control_id that was never actually missing."
    why_zh: "缺口清單是機械算出來的（要求控制－已實作控制），呼叫端自己標註的缺口清單必須跟這個算出來的結果完全一致（少標或多標都會被拒絕）——這樣「我們合規了」的宣稱就不能悄悄漏掉一個真缺口，也不能硬塞一個不存在的缺口來裝樣子。"
    url: "https://www.v-comply.com/glossary/control-mapping/"
    example_zh: "情境：某 SaaS 產品要在歐盟上線前做合規缺口分析。\nrequired_controls 至少 1 筆且不重複，例如 [\"加密靜態資料\", \"存取紀錄留存 1 年\", \"資料可攜出\"]\nimplemented_controls 可以是空陣列，但已經做到的要列出來，例如 [\"加密靜態資料\"]\ngap_annotations 只能剛好對應 required_controls 減 implemented_controls 算出來的缺口，一個都不能少標也不能多標；severity 只能是 low／medium／high／critical 四選一，plan 不能空白，例如 [{control_id: \"存取紀錄留存 1 年\", severity: \"high\", plan: \"Q4 導入集中式 log 保留服務\"}, {control_id: \"資料可攜出\", severity: \"medium\", plan: \"開發使用者資料匯出 API\"}]\n（如果 implemented_controls 已經涵蓋全部 required_controls，gap_annotations 就要給空陣列，不能隨便掰一個不存在的缺口）"
    example_en: "Scenario: a SaaS product runs a compliance gap analysis before launching in the EU. required_controls has >=1 entry with no duplicates, e.g. ['Encrypt data at rest', 'Retain access logs for 1 year', 'Data portability export']; implemented_controls may be an empty list, but anything already done must be listed, e.g. ['Encrypt data at rest']; gap_annotations must match EXACTLY the gap set computed as required_controls minus implemented_controls -- neither missing nor extra is allowed; severity is one of low/medium/high/critical, plan must be non-empty, e.g. [{control_id: 'Retain access logs for 1 year', severity: 'high', plan: 'Roll out centralized log retention service in Q4'}, {control_id: 'Data portability export', severity: 'medium', plan: 'Build a user data export API'}]. (If implemented_controls already covers every required control, gap_annotations must be an empty list -- inventing a gap that isn't real is refused.)"
  jurisdiction.conflict_of_law_review:
    name_en: "Conflict-of-Law Review"
    abbr: ""
    name_zh: "法律衝突審查"
    blurb_en: "Decides which law governs when multiple laws conflict -- and REQUIRES human legal sign-off before any conflict is finalized (never auto-resolved). Use it whenever cross-border activity could be governed by more than one legal system."
    blurb_zh: "多個法律衝突時決定適用哪一個，且任何衝突的最終判定都要有真人法務簽核（絕不自動判定）。跨境活動可能受多套法律管轄時用。"
    why_en: "applicable_law can never be set to non-null without an attached, well-formed legal_review (reviewer/date/outcome) already present on the SAME conflict entry -- the builder refuses construction outright rather than accepting a 'finalized' conflict with no human sign-off. This is exactly the automation-misapplies-law failure this method exists to prevent, made a hard construction-time rule rather than a guideline a caller could skip."
    why_zh: "只要 applicable_law 要設成非空值，同一筆 conflict 就一定要已經附上格式正確的 legal_review（審查人／日期／結論）——builder 直接拒絕建構，不接受一個「已判定」卻沒有真人簽核的衝突紀錄。這正是這個方法存在的目的：防止自動化系統誤用法律去做最終判定，而且是建構時就擋下來的硬規則，不是呼叫端可以跳過的指引。"
    url: "https://www.law.cornell.edu/wex/conflict_of_laws"
    example_zh: "情境：一份跨境合約同時被兩套法律主張管轄，需要人工升級判定。\ngoverning_laws 至少 1 筆，law_id 要唯一，例如 [{law_id: \"LAW-SG\", jurisdiction: \"新加坡\", description: \"合約準據法條款指定新加坡法\"}, {law_id: \"LAW-TW\", jurisdiction: \"台灣\", description: \"消費者保護法屬地強制適用\"}]\nmandatory_rules 可以是空陣列，若有給，rule_id 不能跟 governing_laws 的 law_id 重複\nconflicts 每筆的 disputed_law_ids 至少 2 個、且都要能對應到 governing_laws 或 mandatory_rules 裡真實存在的 id，例如 [{conflict_id: \"CONF-1\", disputed_law_ids: [\"LAW-SG\", \"LAW-TW\"], description: \"消費爭議應適用新加坡合約法還是台灣消保法\", legal_review: null, applicable_law: null}]\n（重點）只要 applicable_law 要填成 disputed_law_ids 裡的其中一個（等於做出最終判定），legal_review 就一定要一起給值，不能是 null，例如 legal_review: {reviewer: \"法務長 王小明\", date: \"2026-09-18\", outcome: \"因消費者慣居地在台灣，強制適用台灣消保法\"}，applicable_law: \"LAW-TW\"——沒有 legal_review 卻填了 applicable_law 會被拒絕建立。"
    example_en: "Scenario: a cross-border contract is claimed by two competing laws and needs human escalation. governing_laws has >=1 entry with a unique law_id, e.g. [{law_id: 'LAW-SG', jurisdiction: 'Singapore', description: 'Contract's governing-law clause names Singapore law'}, {law_id: 'LAW-TW', jurisdiction: 'Taiwan', description: 'Consumer protection law applies territorially, mandatorily'}]; mandatory_rules may be an empty list, and if given its rule_id must not collide with any governing_laws law_id; each conflicts[] entry's disputed_law_ids has >=2 entries that must all resolve to a real id in governing_laws or mandatory_rules, e.g. [{conflict_id: 'CONF-1', disputed_law_ids: ['LAW-SG', 'LAW-TW'], description: 'Should the consumer dispute be governed by Singapore contract law or Taiwan consumer protection law', legal_review: null, applicable_law: null}]. Key point: the moment applicable_law is set to one of disputed_law_ids (i.e. a final determination is made), legal_review must be supplied too, never null, e.g. legal_review: {reviewer: 'General Counsel Wang', date: '2026-09-18', outcome: 'Taiwan consumer protection law applies mandatorily since the consumer's habitual residence is Taiwan'}, applicable_law: 'LAW-TW' -- setting applicable_law with no legal_review is refused at construction."
  jurisdiction.cultural_context_review:
    name_en: "Cultural Context Review"
    abbr: ""
    name_zh: "文化脈絡審查"
    blurb_en: "Assesses 8 cultural factors (trust, authority, privacy perception, etc.) using local evidence -- a hypothesis to test, never a stereotype. High-stakes decisions need local data/interview/survey/expert review, not assumption."
    blurb_zh: "用在地證據評估 8 個文化因素（信任、權威、隱私觀感等）——是待驗證的假設，不是刻板印象。高風險決策要有在地資料／訪談／問卷／專家審查，不能只靠猜。"
    why_en: "Bundles the anti-stereotype rule directly into the per-factor validity check -- a HIGH risk_level factor with zero evidence items is not just discouraged, it's a construction-time error, so a cultural judgment can't reach production as a bare assertion. This operationalizes the same idea Hofstede-style dimensional analysis depends on (a 'high power distance' or 'high uncertainty avoidance' claim must be grounded in comparative data, not a stereotype) as a structural requirement rather than a methodology footnote."
    why_zh: "把「不能只憑刻板印象」這條規則直接綁進每個因素的合法性檢查——risk_level 是 HIGH 卻沒有任何一筆 evidence，不只是「不建議」，而是建構時就會直接報錯，這樣一個文化判斷就不可能只憑一句斷言上線。這其實是把 Hofstede 那種文化維度分析（例如「高權力距離」或「高不確定性規避」都必須有比較資料佐證，而不是刻板印象）從方法論註腳變成結構性的強制要求。"
    url: "https://en.wikipedia.org/wiki/Hofstede%27s_cultural_dimensions_theory"
    example_zh: "情境：評估某東南亞市場的文化脈絡，決定產品的權限設計與溝通風格。\ntarget：「越南消費者市場的行動支付 App」\nfactors 這個 dict 必須剛好有 8 個 key（trust、authority、communication_style、privacy_perception、risk_preference、technology_acceptance、education_expectation、historical_context），一個不能少也不能多，每個 key 的值都要有 risk_level（LOW／MEDIUM／HIGH）、note（不能空白）、evidence（陣列，只能是 LOCAL_DATA／INTERVIEW／SURVEY／EXPERT_REVIEW 這幾種）\n例如 trust: {risk_level: \"HIGH\", note: \"當地消費者對純線上品牌信任度低，偏好熟人介紹\", evidence: [\"LOCAL_DATA\", \"INTERVIEW\"]}、authority: {risk_level: \"MEDIUM\", note: \"決策傾向徵詢家中長輩意見\", evidence: [\"SURVEY\"]}、communication_style: {risk_level: \"LOW\", note: \"偏好直接明確的訊息，不需迂迴鋪陳\", evidence: [\"SURVEY\"]}、privacy_perception: {risk_level: \"MEDIUM\", note: \"對行動支付綁定個資有疑慮\", evidence: [\"INTERVIEW\"]}、risk_preference: {risk_level: \"LOW\", note: \"對小額行動支付接受度高\", evidence: []}、technology_acceptance: {risk_level: \"LOW\", note: \"智慧型手機普及率高，接受度佳\", evidence: [\"LOCAL_DATA\"]}、education_expectation: {risk_level: \"LOW\", note: \"App 需提供簡易圖示引導\", evidence: [\"EXPERT_REVIEW\"]}、historical_context: {risk_level: \"LOW\", note: \"與台灣市場歷史脈絡差異不大\", evidence: []}\n（重點）只要某個 factor 的 risk_level 填 HIGH，evidence 就不能是空陣列——例如上面 trust 標成 HIGH 風險，就一定要至少 1 筆 LOCAL_DATA／INTERVIEW／SURVEY／EXPERT_REVIEW 佐證，不能只憑印象斷定；其他 risk_level 是 LOW／MEDIUM 的因素，evidence 則可以是空陣列（如 risk_preference、historical_context）。"
    example_en: "Scenario: assess the cultural context of a Southeast Asian market to shape a product's permission design and communication style. target: 'A mobile payment app for the Vietnamese consumer market'; factors must be a dict with EXACTLY 8 keys (trust, authority, communication_style, privacy_perception, risk_preference, technology_acceptance, education_expectation, historical_context) -- none missing, none extra -- and each key's value needs risk_level (LOW/MEDIUM/HIGH), note (non-empty), and evidence (a list drawn only from LOCAL_DATA/INTERVIEW/SURVEY/EXPERT_REVIEW). E.g. trust: {risk_level: 'HIGH', note: 'Local consumers distrust purely online brands, prefer referrals from people they know', evidence: ['LOCAL_DATA', 'INTERVIEW']}; authority: {risk_level: 'MEDIUM', note: 'Decisions tend to be run by household elders', evidence: ['SURVEY']}; communication_style: {risk_level: 'LOW', note: 'Prefers direct, explicit messaging over indirect framing', evidence: ['SURVEY']}; privacy_perception: {risk_level: 'MEDIUM', note: 'Wary of linking personal data to mobile payment accounts', evidence: ['INTERVIEW']}; risk_preference: {risk_level: 'LOW', note: 'High acceptance of small-value mobile payments', evidence: []}; technology_acceptance: {risk_level: 'LOW', note: 'High smartphone penetration, strong acceptance', evidence: ['LOCAL_DATA']}; education_expectation: {risk_level: 'LOW', note: 'App needs simple iconography-led onboarding', evidence: ['EXPERT_REVIEW']}; historical_context: {risk_level: 'LOW', note: 'Not meaningfully different from Taiwan market history', evidence: []}. Key point: the moment any factor's risk_level is HIGH, its evidence cannot be an empty list -- e.g. trust above is marked HIGH risk and requires at least 1 LOCAL_DATA/INTERVIEW/SURVEY/EXPERT_REVIEW item, never a bare assumption; factors at LOW/MEDIUM risk (like risk_preference, historical_context here) may have empty evidence."
  jurisdiction.data_residency_assessment:
    name_en: "Data Residency Assessment"
    abbr: ""
    name_zh: "資料落地評估"
    blurb_en: "Decides where each class of data is legally permitted to be stored/processed, across data subjects, laws, and contracts. Use it to support sovereignty requirements and cross-border data flow decisions."
    blurb_zh: "決定每一類資料在法律上能存放／處理在哪裡，涵蓋資料主體、法規、合約。想支援資料主權要求與跨境資料流動決策時用。"
    why_en: "Every declared data class must resolve to at least one routing decision before the record is accepted -- a data category that was named but never assigned a storage/processing region is exactly the 'we said we'd handle it but never actually decided where' gap that turns into an undetected sovereignty violation later. Deriving this from the raw arrays (rather than trusting a status flag) means a hand-edited record can't fake completeness either."
    why_zh: "每一類宣告的資料，在紀錄被接受之前都一定要對應到至少一筆路由決策——一個被命名了卻從來沒有被指定該存放／處理在哪個地區的資料類別，正是「我們說會處理但其實沒真的決定放哪裡」這種日後才會被發現的資料主權漏洞。這個檢查是直接從原始陣列算出來的（不是信任一個狀態旗標），所以就算有人手動改記錄也做不出假的「已完成」。"
    url: "https://www.ibm.com/think/topics/data-sovereignty-vs-data-residency"
    example_zh: "情境：決定客戶個資與交易紀錄兩類資料各自能存放在哪個地區。\ndata_classes 至少 1 筆，data_class_id 要唯一，subjects／applicable_laws 都要是非空字串陣列，例如 [{data_class_id: \"DC-PII\", description: \"客戶個人識別資訊\", subjects: [\"EU 居民\", \"台灣居民\"], applicable_laws: [\"GDPR\", \"個人資料保護法\"]}, {data_class_id: \"DC-TXN\", description: \"交易紀錄\", subjects: [\"全球使用者\"], applicable_laws: [\"PCI-DSS\"]}]\nrouting_decisions 的 data_class_id 一定要對應到上面真實存在的資料類別，而且每一個資料類別都至少要有一筆路由決策，例如 [{data_class_id: \"DC-PII\", region: \"eu-west-1\", rationale: \"EU 居民個資須落地在歐盟境內\"}, {data_class_id: \"DC-TXN\", region: \"ap-southeast-1\", rationale: \"交易量集中在亞太，就近處理降低延遲\"}]\n（如果 DC-TXN 完全沒有出現在任何 routing_decisions 裡，整筆記錄會被拒絕——資料類別宣告了就一定要決定放哪）"
    example_en: "Scenario: decide where two data classes -- customer PII and transaction records -- may each be stored. data_classes has >=1 entry with a unique data_class_id, and subjects/applicable_laws must both be non-empty string lists, e.g. [{data_class_id: 'DC-PII', description: 'Customer personally identifiable information', subjects: ['EU residents', 'Taiwan residents'], applicable_laws: ['GDPR', 'Personal Data Protection Act']}, {data_class_id: 'DC-TXN', description: 'Transaction records', subjects: ['Global users'], applicable_laws: ['PCI-DSS']}]; routing_decisions' data_class_id must resolve to a real data class above, and every data class needs at least one routing decision, e.g. [{data_class_id: 'DC-PII', region: 'eu-west-1', rationale: 'EU resident PII must reside within the EU'}, {data_class_id: 'DC-TXN', region: 'ap-southeast-1', rationale: 'Transaction volume is concentrated in APAC; process locally to cut latency'}]. (If DC-TXN never appears in any routing_decisions entry, the whole record is refused -- a declared data class must always be routed.)"
  jurisdiction.localization_review:
    name_en: "Localization Review"
    abbr: ""
    name_zh: "在地化審查"
    blurb_en: "Checks 13 required dimensions (language, date/time, currency, units, address, tax, accessibility, etc.) -- translation alone is not localization. Use it before launching in a new locale."
    blurb_zh: "檢查 13 個必要面向（語言、日期時間、貨幣、單位、地址、稅務、無障礙等）——翻譯不等於在地化。要在新地區上線前用。"
    why_en: "overall_status is never a caller-supplied field -- it's mechanically recomputed as READY iff all 13 dimensions are MET or NOT_APPLICABLE, so a team can't mark a launch 'localization-ready' while quietly leaving units or tax formatting unresolved. Requiring exactly 13 named dimensions (not just 'language') is what stops translation from being mistaken for localization."
    why_zh: "overall_status 從來不是呼叫端可以直接給值的欄位，而是機械式算出來的：13 個面向全部是 MET 或 NOT_APPLICABLE 才會是 READY——這樣團隊就不能一邊悄悄留著單位或稅務格式沒處理，一邊宣稱「在地化已就緒」。要求剛好 13 個具名面向（而不是只有「語言」），就是防止把翻譯誤當成在地化的關鍵。"
    url: "https://www.w3.org/International/"
    example_zh: "情境：某記帳 App 要在日本上線前做在地化審查。\ntarget：「記帳 App 日本上線」\ndimensions 這個 dict 必須剛好有 13 個 key（language、date_time、timezone、currency、number_format、units、address、name、phone、tax、ui_layout、accessibility、content_expectations），每個 key 的值都要有 status（MET／NOT_MET／NOT_APPLICABLE）跟 note（不能空白）\n例如 language: {status: \"MET\", note: \"已完成日文翻譯與在地語氣調整\"}、date_time: {status: \"MET\", note: \"日期格式改為年/月/日\"}、timezone: {status: \"MET\", note: \"已支援 Asia/Tokyo\"}、currency: {status: \"MET\", note: \"已支援日圓且無小數點顯示\"}、number_format: {status: \"MET\", note: \"千分位改為日式慣例\"}、units: {status: \"NOT_APPLICABLE\", note: \"此 App 不涉及度量衡\"}、address: {status: \"NOT_APPLICABLE\", note: \"此 App 不收集地址\"}、name: {status: \"MET\", note: \"姓名欄位改為姓／名分開輸入\"}、phone: {status: \"MET\", note: \"已支援日本電話格式驗證\"}、tax: {status: \"NOT_MET\", note: \"消費稅發票格式尚未串接國稅系統\"}、ui_layout: {status: \"MET\", note: \"已確認日文字元不會截斷\"}、accessibility: {status: \"MET\", note: \"已通過螢幕閱讀器測試\"}、content_expectations: {status: \"MET\", note: \"已調整符合當地法規揭露用語\"}\noverall_status 不用也不能自己填，系統會用「13 個面向是否都是 MET 或 NOT_APPLICABLE」自動算出來——上面這個例子因為 tax 是 NOT_MET，overall_status 會自動算成 NOT_READY。"
    example_en: "Scenario: a budgeting app runs a localization review before launching in Japan. target: 'Budgeting app Japan launch'; dimensions must be a dict with EXACTLY 13 keys (language, date_time, timezone, currency, number_format, units, address, name, phone, tax, ui_layout, accessibility, content_expectations), each needing a status (MET/NOT_MET/NOT_APPLICABLE) and a non-empty note. E.g. language: {status: 'MET', note: 'Japanese translation and tone localization complete'}; date_time: {status: 'MET', note: 'Date format switched to year/month/day'}; timezone: {status: 'MET', note: 'Asia/Tokyo supported'}; currency: {status: 'MET', note: 'Yen supported, no decimal display'}; number_format: {status: 'MET', note: 'Thousands separator switched to Japanese convention'}; units: {status: 'NOT_APPLICABLE', note: 'This app has no units of measurement'}; address: {status: 'NOT_APPLICABLE', note: 'This app does not collect addresses'}; name: {status: 'MET', note: 'Name field split into family/given name inputs'}; phone: {status: 'MET', note: 'Japanese phone format validation supported'}; tax: {status: 'NOT_MET', note: 'Consumption tax invoice format not yet wired to the national tax system'}; ui_layout: {status: 'MET', note: 'Confirmed Japanese characters are not truncated'}; accessibility: {status: 'MET', note: 'Passed screen reader testing'}; content_expectations: {status: 'MET', note: 'Disclosure language adjusted to match local regulatory expectations'}. overall_status is never supplied -- the system computes it from whether all 13 dimensions are MET or NOT_APPLICABLE; in this example, because tax is NOT_MET, overall_status is automatically NOT_READY."
  jurisdiction.market_admission_control:
    name_en: "Market Admission Control"
    abbr: ""
    name_zh: "市場准入控管"
    blurb_en: "A go/no-go gate for entering a new market across 7 stages (legal freshness, data residency, AI provider, security, localization, sector controls, human sign-off) -- any critical unknown fails closed. Use it before entering any new geographic market."
    blurb_zh: "進入新市場的 go/no-go 關卡，涵蓋 7 個階段（法規時效、資料落地、AI 供應商、安全、在地化、產業別控管、真人簽核）——任何關鍵未知一律阻擋。進入任何新地理市場前用。"
    why_en: "admission_decision is never a caller-supplied field -- ENABLE is only ever computed, never asserted, and requires every one of the 7 stages to be PASS plus a non-empty human sign-off. A single stage left UNKNOWN or a missing sign-off mechanically forces FAIL_CLOSED, so a new-market launch can't go live on an unverified assumption just because someone forgot to check one stage."
    why_zh: "admission_decision 從來不是呼叫端能直接給值的欄位——ENABLE 永遠是算出來的，不能用宣稱的，而且一定要 7 個階段全部 PASS 加上非空的真人簽核才行。只要有一個階段是 UNKNOWN 或簽核沒填，系統就會機械式強制判定 FAIL_CLOSED，這樣新市場上線就不會因為有人漏檢查了一個階段，而憑一個沒驗證過的假設就開通。"
    url: "https://en.wikipedia.org/wiki/Go/no-go"
    example_zh: "情境：評估是否開放印尼作為新市場。\nmarket_id：「印尼」\nstages 一定要剛好是這 7 個階段名稱各出現一次：jurisdiction_pack、legal_freshness、data_residency、ai_provider、security_privacy、localization_accessibility、sector_controls，每筆要有 status（PASS／FAIL／UNKNOWN）跟 note（不能空白）\n例如 [{stage: \"jurisdiction_pack\", status: \"PASS\", note: \"已建立印尼管轄包\"}, {stage: \"legal_freshness\", status: \"PASS\", note: \"法規時效性審查通過\"}, {stage: \"data_residency\", status: \"PASS\", note: \"資料落地評估通過\"}, {stage: \"ai_provider\", status: \"PASS\", note: \"AI 供應商合規審查通過\"}, {stage: \"security_privacy\", status: \"PASS\", note: \"資安隱私審查通過\"}, {stage: \"localization_accessibility\", status: \"UNKNOWN\", note: \"在地化審查尚未完成\"}, {stage: \"sector_controls\", status: \"PASS\", note: \"產業別控管審查通過\"}]\nhuman_signoff 可以是 null（代表尚未簽核）\n（重點）上面這個例子因為 localization_accessibility 是 UNKNOWN，就算 human_signoff 有填值，admission_decision 還是會被自動算成 FAIL_CLOSED；要拿到 ENABLE，7 個階段必須全部 PASS，而且 human_signoff 要是非空字串。"
    example_en: "Scenario: assess whether to admit Indonesia as a new market. market_id: 'Indonesia'; stages must contain EXACTLY these 7 stage names, each once: jurisdiction_pack, legal_freshness, data_residency, ai_provider, security_privacy, localization_accessibility, sector_controls, each with a status (PASS/FAIL/UNKNOWN) and a non-empty note. E.g. [{stage: 'jurisdiction_pack', status: 'PASS', note: 'Indonesia jurisdiction pack established'}, {stage: 'legal_freshness', status: 'PASS', note: 'Legal freshness review passed'}, {stage: 'data_residency', status: 'PASS', note: 'Data residency assessment passed'}, {stage: 'ai_provider', status: 'PASS', note: 'AI provider compliance review passed'}, {stage: 'security_privacy', status: 'PASS', note: 'Security/privacy review passed'}, {stage: 'localization_accessibility', status: 'UNKNOWN', note: 'Localization review not yet complete'}, {stage: 'sector_controls', status: 'PASS', note: 'Sector-specific control review passed'}]; human_signoff may be null (not yet signed off). Key point: in this example, because localization_accessibility is UNKNOWN, admission_decision is automatically FAIL_CLOSED even if human_signoff is filled in; to get ENABLE, all 7 stages must be PASS AND human_signoff must be a non-empty string."
  jurisdiction.obligation_to_control_mapping:
    name_en: "Obligation-to-Control Mapping"
    abbr: ""
    name_zh: "義務對應控制措施"
    blurb_en: "Turns a legal obligation into a traceable engineering control with owner, evidence, and test. Use it to make sure legal and engineering are actually talking about the same thing."
    blurb_zh: "把法律義務轉成可追溯的工程控制措施，附負責人、證據、測試。想確保法務跟工程真的對得上焦時用。"
    why_en: "Every declared legal obligation must be referenced by at least one control before the record is accepted -- an obligation that legal wrote down but engineering never built anything against is exactly the disconnect this method exists to catch. Requiring owner+evidence+test on every control (not just a control_id) stops a control from being a label with nobody actually accountable for it."
    why_zh: "每一筆宣告的法律義務，在紀錄被接受之前都一定要有至少一筆控制措施對應到它——法務寫下了義務、工程卻完全沒做任何對應措施，正是這個方法要抓的落差。而且每筆控制措施都要有負責人／證據／測試（不能只有一個 control_id），這樣控制措施才不會只是一個掛名、實際上沒人真正負責。"
    url: "https://www.v-comply.com/glossary/control-mapping/"
    example_zh: "情境：把兩條法律義務（申請刪除個資、申請資料可攜出）都轉成可追蹤的工程控制。\nobligations 至少 1 筆，obligation_id 要唯一，例如 [{obligation_id: \"OBL-1\", description: \"依 GDPR 第 17 條，使用者可申請刪除個資\"}, {obligation_id: \"OBL-2\", description: \"依 GDPR 第 20 條，使用者可申請資料可攜出\"}]\ncontrols 每筆都要有 owner／evidence／test 三個非空欄位，obligation_id 必須對應到上面真實存在的義務，而且每一條義務都至少要有一筆控制對應，例如 [{control_id: \"CTRL-1\", obligation_id: \"OBL-1\", owner: \"後端團隊\", evidence: \"帳號刪除 API 的設計文件\", test: \"每季執行一次刪除請求的端對端測試\"}, {control_id: \"CTRL-2\", obligation_id: \"OBL-2\", owner: \"後端團隊\", evidence: \"資料匯出 API 的設計文件\", test: \"每季執行一次匯出請求的端對端測試\"}]\n（重點）如果拿掉 CTRL-2、只留 CTRL-1，OBL-2 就完全沒有任何控制對應到它，整筆記錄會被拒絕建立——法律義務宣告了就一定要有對應的工程控制，不能只停在法務端。"
    example_en: "Scenario: turn two legal obligations (request deletion, request data portability) into traceable engineering controls. obligations has >=1 entry with a unique obligation_id, e.g. [{obligation_id: 'OBL-1', description: 'Under GDPR Art. 17, users may request deletion of their personal data'}, {obligation_id: 'OBL-2', description: 'Under GDPR Art. 20, users may request data portability'}]; every controls entry needs non-empty owner/evidence/test, obligation_id must resolve to a real obligation above, and every obligation needs at least one control, e.g. [{control_id: 'CTRL-1', obligation_id: 'OBL-1', owner: 'Backend team', evidence: 'Account-deletion API design doc', test: 'Quarterly end-to-end test of the deletion request flow'}, {control_id: 'CTRL-2', obligation_id: 'OBL-2', owner: 'Backend team', evidence: 'Data-export API design doc', test: 'Quarterly end-to-end test of the export request flow'}]. Key point: if CTRL-2 were dropped and only CTRL-1 kept, OBL-2 would have zero matching controls and the whole record would be refused at construction -- a declared legal obligation must always have a matching engineering control, not stay stuck on the legal side."
  jurisdiction.regulatory_horizon_scan:
    name_en: "Regulatory Horizon Scan"
    abbr: ""
    name_zh: "法規前瞻掃描"
    blurb_en: "Tracks proposed or coming regulation from official sources only (government/regulator/legislative record). Use it to avoid being blindsided by a new law."
    blurb_zh: "只從官方來源（政府／主管機關／立法紀錄）追蹤即將上路的法規。想避免被新法規突襲時用。"
    why_en: "source_type is restricted to a closed set of official channels (government/regulator/legislative record) at construction time -- an entry sourced from a rumor or an unofficial blog is refused outright. In regulatory tracking (unlike generic trend-scanning) an unconfirmed source doesn't just add noise, it can trigger costly false preparation for a law that never actually happens."
    why_zh: "source_type 在建構時就限定在一個封閉的官方來源清單裡（政府／主管機關／立法紀錄）——來源是謠言或非官方部落格的條目會直接被拒絕。因為在法規追蹤這件事上（跟一般趨勢掃描不一樣），一個未經證實的來源不只是多一點雜訊，還可能讓團隊為了一個根本不會發生的法規，白白花錢做了準備。"
    url: "https://safetyculture.com/topics/horizon-scanning/regulatory-horizon-scanning"
    example_zh: "情境：追蹤即將上路、可能影響產品的新資料法規。\nentries 至少 1 筆，entry_id 要唯一，source_type 只能是 OFFICIAL_GOVERNMENT／OFFICIAL_REGULATOR／OFFICIAL_LEGISLATIVE_RECORD 三選一（來自論壇或新聞猜測一律不算），其餘欄位都要非空字串\n例如 [{entry_id: \"RHS-1\", regulation_title: \"EU AI 法案分級要求修訂案\", source: \"歐盟執委會官方公告\", source_type: \"OFFICIAL_REGULATOR\", status: \"草案徵詢意見中\", effective_date_or_estimate: \"預估 2027 Q2 生效\", impact: \"公司的 AI 風險評估功能需重新分類為高風險系統\", owner: \"法遵長\"}]\n（重點）如果 source_type 填的是「網路論壇討論串」這種非官方來源，這一筆會直接被拒絕建立——這個方法只追蹤官方來源，避免把未經證實的傳言當成真的法規訊號在追。"
    example_en: "Scenario: track upcoming data regulation that could affect the product. entries has >=1 entry with a unique entry_id; source_type is one of OFFICIAL_GOVERNMENT/OFFICIAL_REGULATOR/OFFICIAL_LEGISLATIVE_RECORD only (a forum post or news speculation does not qualify), and every other field must be a non-empty string. E.g. [{entry_id: 'RHS-1', regulation_title: 'EU AI Act risk-tier amendment', source: 'European Commission official announcement', source_type: 'OFFICIAL_REGULATOR', status: 'Draft open for consultation', effective_date_or_estimate: 'Estimated effective Q2 2027', impact: 'Our AI risk assessment feature would need reclassification as high-risk', owner: 'Chief Compliance Officer'}]. Key point: if source_type were 'an online forum thread' -- an unofficial source -- this entry would be refused at construction; this method only tracks official channels, so an unconfirmed rumor never gets treated as a real regulatory signal."
  jurisdiction.resolver:
    name_en: "Jurisdiction Resolver"
    abbr: ""
    name_zh: "管轄權解析器"
    blurb_en: "Resolves which jurisdictions jointly govern an activity across 11+ dimensions (entity, user location, data location, provider, sector, etc.) -- not just 'which country is the user in'. Use it whenever a simple country-name guess isn't good enough."
    blurb_zh: "從 11 個以上維度（實體、使用者位置、資料位置、供應商、產業別等）解析真正適用的管轄權，不只是「使用者在哪個國家」這麼粗略。單純猜國名不夠精確時用。"
    why_en: "When 2+ dimensions are declared, the resolution as a whole must trace back to at least 2 distinct dimensions -- so a genuinely multi-factor situation (entity in one country, users in another, data processed in a third) can't collapse into a single 'user's country == the answer' shortcut, which is exactly the naive judgment call this method exists to replace."
    why_zh: "只要宣告了 2 個以上維度，最終的解析結果就一定要能追溯回至少 2 個不同維度——這樣一個真正牽涉多個因素的情境（實體在一國、使用者在另一國、資料處理又在第三國）就不能被偷偷簡化成「使用者在哪個國家＝答案」這種粗略捷徑，而這正是這個方法存在的目的：取代這種粗判。"
    url: "https://gdpr-info.eu/art-3-gdpr/"
    example_zh: "情境：判斷一家台灣公司經營、伺服器在新加坡、卻鎖定歐盟使用者的服務適用哪些管轄權。\ndeclared_dimensions 每筆的 dimension 只能是 11 個固定值其中之一（LEGAL_ENTITY、USER_LOCATION、DATA_SUBJECT_LOCATION、PROCESSING_LOCATION、STORAGE_LOCATION、PROVIDER_LOCATION、MARKET、CONTRACT_GOVERNING_LAW、SECTOR、GOVERNMENT_LEVEL、SPECIAL_TERRITORY_INDIGENOUS_JURISDICTION），同一個 dimension 不能重複宣告，例如 [{dimension: \"LEGAL_ENTITY\", value: \"台灣公司登記地\"}, {dimension: \"USER_LOCATION\", value: \"歐盟\"}, {dimension: \"PROCESSING_LOCATION\", value: \"新加坡\"}]\nresolved_jurisdictions 每筆的 derived_from_dimensions 必須指向上面真實宣告過的維度，例如 [{jurisdiction_id: \"TW\", derived_from_dimensions: [\"LEGAL_ENTITY\"], basis: \"公司設立登記地\"}, {jurisdiction_id: \"EU\", derived_from_dimensions: [\"USER_LOCATION\"], basis: \"GDPR 第 3 條的鎖定原則\"}]\n（重點）因為宣告了 3 個維度（>=2），整份解析結果合起來至少要用到其中 2 個不同維度才會通過——上面例子用到了 LEGAL_ENTITY 跟 USER_LOCATION 兩個，符合規定；如果 resolved_jurisdictions 全部都只從 USER_LOCATION 推導（等於又退回「使用者在哪國」這種粗判），就會被拒絕。"
    example_en: "Scenario: determine which jurisdictions apply to a service run by a Taiwan-registered company, hosted on servers in Singapore, targeting EU users. Each declared_dimensions entry's dimension is one of 11 fixed values (LEGAL_ENTITY, USER_LOCATION, DATA_SUBJECT_LOCATION, PROCESSING_LOCATION, STORAGE_LOCATION, PROVIDER_LOCATION, MARKET, CONTRACT_GOVERNING_LAW, SECTOR, GOVERNMENT_LEVEL, SPECIAL_TERRITORY_INDIGENOUS_JURISDICTION), and the same dimension cannot be declared twice, e.g. [{dimension: 'LEGAL_ENTITY', value: 'Company incorporated in Taiwan'}, {dimension: 'USER_LOCATION', value: 'EU'}, {dimension: 'PROCESSING_LOCATION', value: 'Singapore'}]; each resolved_jurisdictions entry's derived_from_dimensions must point back to a dimension actually declared above, e.g. [{jurisdiction_id: 'TW', derived_from_dimensions: ['LEGAL_ENTITY'], basis: 'Place of incorporation'}, {jurisdiction_id: 'EU', derived_from_dimensions: ['USER_LOCATION'], basis: 'GDPR Article 3 targeting criterion'}]. Key point: since 3 dimensions were declared (>=2), the resolution as a whole must draw on at least 2 distinct ones to pass -- the example above uses LEGAL_ENTITY and USER_LOCATION, so it's fine; if every resolved_jurisdictions entry were derived from USER_LOCATION alone (collapsing back to a naive 'whichever country the user is in' shortcut), it would be refused."

  # ---- learning (F17 learning/reversal) ----
  learning.after_action_review:
    name_en: "After Action Review"
    abbr: ""
    name_zh: "行動後檢討"
    blurb_en: "Compares Expected vs Actual, asks why, and names next actions -- a fast, single-pass retrospective. Use it right after any event or project to quickly organize what was learned."
    blurb_zh: "比較預期與實際結果，問為什麼，訂出下一步——快速的單輪回顧。任何活動或專案結束後，想快速整理學到什麼時用。"
    why_en: "why_factors needs >= 2 entries, each at least 3 whitespace-separated words, with no two normalizing to the same text -- a single one-line 'why' or two factors that just restate each other is not a real root-cause analysis. next_actions needs >= 1 entry, and every entry must name a non-empty owner -- an unowned lesson is a wasted retrospective, never actually acted on."
    why_zh: "why_factors 至少要有 2 筆，每筆至少 3 個以空白分隔的字詞，而且不能有兩筆正規化後文字相同——只寫一行『為什麼』，或兩個原因其實在講同一件事，都不算真正的根因分析。next_actions 至少要有 1 筆，且每筆都要有非空的 owner——沒有人負責的教訓，等於這次檢討白做了。"
    url: "https://en.wikipedia.org/wiki/After-action_review"
    example_zh: "情境：檢討新版結帳流程上線後轉換率不升反降。\nexpected：「新版結帳流程上線後轉換率應提升 10%」\nactual：「轉換率反而下降 3%」\nwhy_factors：[{id:\"W1\", description:\"新流程 比舊版 多了一個確認步驟\"}, {id:\"W2\", description:\"按鈕位置 在行動版 變得不明顯\"}]（description 用空白分隔至少 3 個詞——這個欄位的不變量是「以空白分隔的字數」，純中文若不加空白會被判定成只有 1 個詞）\nnext_actions：[{id:\"A1\", description:\"移除多餘確認步驟並重新測試\", owner:\"小美\"}]\n（重點）如果 why_factors 只填 1 筆，會被拒絕建立——至少要 2 個獨立原因才算真正分析了為什麼，不是隨口寫一個理由就交差。"
    example_en: "Scenario: reviewing why the new checkout flow's conversion rate dropped instead of rising after launch. expected: 'conversion rate should rise 10% after the new checkout flow launches'; actual: 'conversion rate dropped 3% instead'; why_factors: [{id:'W1', description:'the new flow added an extra confirmation step'}, {id:'W2', description:'the mobile button position became less visible'}]; next_actions: [{id:'A1', description:'remove the redundant confirmation step and re-test', owner:'Amy'}]. Key point: if why_factors had only 1 entry, the record would be refused at construction -- at least 2 independent reasons are required for this to count as a real why-analysis, not a single offhand excuse."
  learning.appreciative_inquiry:
    name_en: "Appreciative Inquiry"
    abbr: ""
    name_zh: "欣賞式探詢"
    blurb_en: "Focuses on positive experience and possibility to drive change (Discover/Dream/Design/Destiny). Non-diagnostic."
    blurb_zh: "聚焦正向經驗與可能性進行改變，導向「什麼對你有用」的正向敘事轉化。非診斷工具。"
    why_en: "discover/design/destiny must each be a non-empty list of non-empty strings, and dream a non-empty string -- the 4-D cycle (Discover/Dream/Design/Destiny) is only complete when every D has real content; missing any one of them makes it a wish list, not the whole cycle."
    why_zh: "discover／design／destiny 都一定要是非空清單，dream 一定要是非空字串——4-D 循環（探索／夢想／設計／命運）只有在每個 D 都有真實內容時才算完整，缺一個都只是一份願望清單，不是完整的循環。"
    url: "https://positivepsychology.com/appreciative-inquiry/"
    example_zh: "情境：用欣賞式探詢改善新人入職體驗。\naffirmative_topic：「打造讓新人第一週就有歸屬感的入職體驗」\ndiscover：[\"上次有一位新人主動說『第一天就被安排跟資深同事一起吃午餐讓我很放心』\"]\ndream：「每個新人第一週結束時都主動想跟人分享今天學到的事」\ndesign：[\"入職第一天指派一位『歡迎夥伴』一起吃午餐\"]\ndestiny：[\"下週開始為新進的 2 位工程師試辦歡迎夥伴制度\"]\n（重點）如果 destiny 留空清單，會被拒絕建立——4-D 循環少了「命運／落實」這一步，就只是空想，沒有真的變成行動。"
    example_en: "Scenario: using Appreciative Inquiry to improve new-hire onboarding. affirmative_topic: 'building an onboarding experience where new hires feel belonging in week one'; discover: ['a past new hire said unprompted that being paired with a senior colleague for lunch on day one put them at ease']; dream: 'every new hire wants to share what they learned with someone by the end of week one'; design: ['assign a welcome buddy for lunch on day one of onboarding']; destiny: ['pilot the welcome-buddy program next week with the 2 incoming engineers']. Key point: if destiny were an empty list, the record would be refused at construction -- a 4-D cycle missing the 'destiny/follow-through' step is just wishful thinking, never actually turned into action."
  learning.build_measure_learn:
    name_en: "Build-Measure-Learn"
    abbr: ""
    name_zh: "建構-衡量-學習"
    blurb_en: "Builds the smallest test, measures it, and learns -- with the scope you deliberately cut disclosed. Use it for product discovery, to avoid building before validating."
    blurb_zh: "建構最小測試→衡量→學習，並明確揭露刻意省略了什麼範圍。產品探索階段，想避免先建後驗證時用。"
    why_en: "build.cut_scope must be a non-empty list -- Atlas's own literal word 'smallest' requires the build stage to name what was deliberately left out to stay minimal; an undisclosed 'smallest' test can't be told apart from an accidentally-incomplete one. measure.build_ref must equal build.artifact_id, and learn.metric_refs must be non-empty and resolve to real measure.metrics -- a Learn stage citing nothing measured is opinion, not data-grounded learning."
    why_zh: "build.cut_scope 一定要是非空清單——Atlas 自己講的「smallest」（最小化）要求 build 階段明確講出為了保持最小化而刻意捨棄了什麼；一個沒有揭露捨棄內容的「最小化測試」，跟一個不小心做得不完整的東西根本分不清楚。measure.build_ref 一定要等於 build.artifact_id，learn.metric_refs 也一定要非空且對應到真實存在的 measure.metrics——一個沒有引用任何測量數據的 Learn 階段只是意見，不是有數據支撐的學習。"
    url: "https://www.viima.com/blog/lean-startup"
    example_zh: "情境：驗證「一鍵匯出報表」功能是否真的有需求。\nbuild：{description:\"只做 CSV 匯出，不做 PDF/Excel\", artifact_id:\"ARTIFACT-EXPORT-V1\", cut_scope:[\"不做排程匯出\", \"不做多語系欄位名稱\"]}\nmeasure：{description:\"追蹤一週內的匯出按鈕點擊與完成率\", build_ref:\"ARTIFACT-EXPORT-V1\", metrics:[{id:\"METRIC-1\", name:\"點擊匯出按鈕次數\", value:47, unit:\"次/週\"}]}\nlearn：{conclusion:\"需求確實存在，但完成率偏低，可能是欄位選擇介面太複雜\", metric_refs:[\"METRIC-1\"]}\n（重點）如果 build.cut_scope 留空清單（沒有講清楚為了最小化捨棄了什麼），會被拒絕建立——一個沒有揭露捨棄範圍的「最小化測試」，沒辦法跟做得不完整的東西區分開來。"
    example_en: "Scenario: validating whether a 'one-click report export' feature is actually wanted. build: {description:'CSV export only, no PDF/Excel', artifact_id:'ARTIFACT-EXPORT-V1', cut_scope:['no scheduled exports', 'no multi-language column names']}; measure: {description:'track export-button clicks and completion rate over one week', build_ref:'ARTIFACT-EXPORT-V1', metrics:[{id:'METRIC-1', name:'export button click count', value:47, unit:'per week'}]}; learn: {conclusion:'the demand is real, but completion rate is low, possibly because the column-selection UI is too complex', metric_refs:['METRIC-1']}. Key point: if build.cut_scope were an empty list (not disclosing what was cut to stay minimal), the record would be refused at construction -- an undisclosed 'minimal test' can't be distinguished from one that's just accidentally incomplete."
  learning.decision_journal:
    name_en: "Decision Journal"
    abbr: ""
    name_zh: "決策日誌"
    blurb_en: "Captures context, options, evidence, forecast, and confidence WHILE the outcome is still unknown, preventing hindsight bias later. Use it right when you make a significant decision, before you know how it turns out."
    blurb_zh: "在結果還未知時就記下脈絡、選項、證據、預測、信心度，防止事後諸葛。做出重大決策的當下就用，不要等結果出來才寫。"
    why_en: "options needs >= 2 entries with exactly one marked chosen -- Atlas names 'options' (plural): a record with only one recorded option was never actually a decision, there was nothing to choose between. stage1_integrity_hash is computed over context/options/evidence/forecast/confidence at construction, then independently re-verified on every gate call -- catches any direct hand-edit of those fields after the fact (e.g. bumping confidence up once the outcome is known), the structural defense against hindsight bias this method exists to provide."
    why_zh: "options 至少要有 2 筆，且剛好 1 筆標記 chosen——Atlas 講的是「options」複數，只記錄 1 個選項的紀錄，根本沒有真的做過選擇。stage1_integrity_hash 在建構時對 context／options／evidence／forecast／confidence 算一次雜湊，之後每次 gate 檢查都會獨立重算比對——能抓到任何事後直接手動改動這些欄位的行為（例如結果出來後偷偷把信心度調高），這正是這個方法要提供的、對抗事後諸葛偏誤的結構性防線。"
    url: "https://www.annieduke.com/overcoming-outcome-bias-how-to-improve-learning-decision-making-ft-annie-duke-ovul-sezer/"
    example_zh: "情境：記錄是否續簽年度雲端服務合約的決策。\ncontext：「決定是否簽下年度雲端服務合約」\noptions：[{id:\"O1\", description:\"續約現有供應商\", chosen:true}, {id:\"O2\", description:\"改用新供應商\", chosen:false}]\nforecast：「預期續約後年度成本持平，服務中斷次數不變」\nconfidence：65\nevidence（本方法允許合法的空清單，誠實記錄「證據其實很薄弱」也是有價值的內容）：[]\n（重點）如果 options 只填 1 筆（例如只寫「續約現有供應商」），會被拒絕建立——只有 1 個選項代表根本沒有真的在做決策，沒有東西可以選。"
    example_en: "Scenario: recording a decision about whether to renew an annual cloud-service contract. context: 'deciding whether to sign the annual cloud service contract'; options: [{id:'O1', description:'renew with the current vendor', chosen:true}, {id:'O2', description:'switch to a new vendor', chosen:false}]; forecast: 'expect annual cost to stay flat and outage count to stay the same after renewal'; confidence: 65; evidence (this method legally allows an empty list -- honestly recording 'the evidence was actually thin' is valuable content too): []. Key point: if options had only 1 entry (e.g. just 'renew with the current vendor'), the record would be refused at construction -- a single option means no real decision was ever made, there was nothing to choose between."
  learning.dmaic:
    name_en: "Define-Measure-Analyze-Improve-Control"
    abbr: "DMAIC"
    name_zh: "定義-測量-分析-改善-控制"
    blurb_en: "The Six Sigma quality-improvement cycle: Define/Measure/Analyze/Improve/Control. Non-diagnostic; useful for building a diagnosis-and-improvement plan for a recurring problem."
    blurb_zh: "六標準差品質改善流程：定義／測量／分析／改善／控制。為重複性困擾建立流程診斷與精進計畫時用。"
    why_en: "phases must have exactly the 5 named keys (define/measure/analyze/improve/control), and measure.items/control.items each need >= 1 item -- a metric with a baseline (measure) is what lets you show anything actually improved, and a control (a mechanism that keeps the gain) is what stops the process from silently reverting once nobody's watching."
    why_zh: "phases 一定要剛好有 5 個命名鍵（定義／量測／分析／改善／控制），而且 measure.items／control.items 都至少要有 1 項——有基準值的量測（measure）才能證明真的有改善，而控制（維持成果的機制）才能防止流程在沒人盯著時悄悄故態復萌。"
    url: "https://asq.org/quality-resources/dmaic"
    example_zh: "情境：改善客服電子郵件回應時間超過 SLA 的問題。\nproblem_statement：「客服平均回應時間超過 SLA 4 小時目標」\nphases：{define:{summary:\"定義問題範圍：僅限電子郵件客服通道\", items:[\"確認 SLA 目標為 4 小時\"]}, measure:{summary:\"量測目前平均回應時間\", items:[\"過去 3 個月平均回應時間為 7.2 小時\"]}, analyze:{summary:\"分析延遲原因\", items:[\"工單分派規則造成同一人塞單\"]}, improve:{summary:\"改善分派邏輯\", items:[\"改為依當前工單量自動平均分派\"]}, control:{summary:\"建立監控機制避免故態復萌\", items:[\"每週自動報表監控平均回應時間，超過 5 小時觸發告警\"]}}\n（重點）如果 control.items 留空清單，會被拒絕建立——沒有維持成果的機制，改善很可能會在沒人注意時悄悄退回原狀。"
    example_en: "Scenario: fixing email customer-support response times that exceed the 4-hour SLA. problem_statement: 'average support response time exceeds the 4-hour SLA target'; phases: {define:{summary:'scope: email support channel only', items:['confirmed SLA target is 4 hours']}, measure:{summary:'measure current average response time', items:['average response time over the last 3 months is 7.2 hours']}, analyze:{summary:'analyze the delay cause', items:['ticket-assignment rules are overloading one agent']}, improve:{summary:'fix the assignment logic', items:['switch to automatic load-balanced assignment']}, control:{summary:'build a monitoring mechanism to prevent regression', items:['weekly automated report monitors average response time, alerts if it exceeds 5 hours']}}. Key point: if control.items were an empty list, the record would be refused at construction -- with no mechanism to hold the gain, the improvement could quietly regress once nobody is watching."
  learning.kill_criteria:
    name_en: "Kill Criteria"
    abbr: ""
    name_zh: "終止條件"
    blurb_en: "Pre-defines stop conditions (max loss/time/quality threshold) BEFORE starting, to control downside risk. Use it before any initiative where you could be tempted to keep going past the point of no return."
    blurb_zh: "事前定義停止條件（最大損失／時間／品質門檻），控制下行風險。任何可能讓你「騎虎難下」的計畫開始前用。"
    why_en: "thresholds must be a non-empty list, and dimension must be one of Atlas's own 3 named dimensions (max_loss/max_time/min_quality) -- an empty kill-criteria set, or one with no real dimension/value, can never fire, defeating the whole point of controlling downside risk. Every threshold also needs a non-empty owner -- someone accountable for actually invoking the stop when the threshold is crossed; an unowned threshold is decorative, not a real control."
    why_zh: "thresholds 一定要是非空清單，dimension 一定要是 Atlas 自己講的 3 個維度之一（max_loss／max_time／min_quality）——一個空的停損條件集合，或一個沒有真實維度／數值的條件，永遠不可能被觸發，直接違背「控制下行風險」的整個目的。每個 threshold 也一定要有非空的 owner——要有人真正負責在門檻被跨過時真的執行停損，一個沒有負責人的門檻只是裝飾，不是真正的控制措施。"
    url: "https://www.stratrix.com/strategy-lexicon/kill-criteria"
    example_zh: "情境：為一項新市場擴張試點案設定停損條件。\ndecision_ref：「新市場擴張試點案」\nthresholds：[{id:\"T1\", dimension:\"max_loss\", value:500000, unit:\"USD\", owner:\"財務長\", stop_action:\"立即停止試點，資源轉回既有市場\"}]\n（重點）如果 owner 填空字串，會被拒絕建立——沒有人負責在虧損達到 50 萬美元時真的喊停，這個停損條件就只是紙上文字，不是真的能被執行的控制措施。"
    example_en: "Scenario: setting kill criteria for a new-market expansion pilot. decision_ref: 'new-market expansion pilot'; thresholds: [{id:'T1', dimension:'max_loss', value:500000, unit:'USD', owner:'CFO', stop_action:'immediately stop the pilot and redirect resources to existing markets'}]. Key point: if owner were an empty string, the record would be refused at construction -- with nobody accountable for actually calling the stop once the $500k loss threshold is crossed, this kill criterion is just words on paper, not an enforceable control."
  learning.ooda:
    name_en: "OODA Loop"
    abbr: "OODA"
    name_zh: "OODA 循環"
    blurb_en: "Observe -> Orient -> Decide -> Act, for fast dynamic decision-making. Use it in a high-change environment where PDCA's slower cycle is too slow."
    blurb_zh: "觀察→定位→決策→行動，做快速動態決策。高變動環境、PDCA 的節奏太慢時用。"
    why_en: "stage_type sequence must equal exactly (OBSERVE, ORIENT, DECIDE, ACT), and every ORIENT stage's observation_refs must resolve to a real id in the SAME record's OBSERVE observations[] -- an ORIENT stage connected to nothing observed is an unexplained decision, not orientation. This operationalizes Boyd's own insight that Orient is the decisive stage: reorienting the mental model faster than a rival, not a mechanical checklist step disconnected from what was actually observed."
    why_zh: "stage_type 的順序一定要剛好是（OBSERVE, ORIENT, DECIDE, ACT），而且每個 ORIENT 階段的 observation_refs 都一定要對應到同一筆記錄裡 OBSERVE 階段真實存在的 observations[] id——一個沒有連結到任何觀察內容的 ORIENT 階段，只是一個沒有解釋的決定，不是真正的「定向」。這把 Boyd 自己的洞見變成結構規則：Orient 才是決定性的階段，是比對手更快重新調整心智模型，不是脫離實際觀察內容的機械化檢查表步驟。"
    url: "https://en.wikipedia.org/wiki/OODA_loop"
    example_zh: "情境：面對競爭對手突然大幅降價的快速決策循環。\nsituation：「競爭對手突然大幅降價」\nstages：[OBSERVE：{content:\"觀察競爭對手降價動作\", observations:[{id:\"OBS1\", content:\"監測到競爭對手網站價格昨晚下調 20%\"}]}, ORIENT：{content:\"重新評估我方定價策略是否還站得住腳\", observation_refs:[\"OBS1\"], mental_model_update:\"原本假設『價格不是主要競爭因素』需要修正\"}, DECIDE：{content:\"決定推出限時對應方案而非直接跟跌\"}, ACT：{content:\"上線限時方案並通知業務團隊\"}]（各階段的 timestamp 需嚴格不遞減）\n（重點）如果 ORIENT 的 observation_refs 填成 [\"OBS99\"]（OBSERVE 階段根本沒有這個 id），會被拒絕建立——ORIENT 一定要真的連結到這筆記錄自己觀察到的內容，不能憑空定向。"
    example_en: "Scenario: a rapid decision cycle in response to a competitor's sudden price cut. situation: 'a competitor suddenly cut prices sharply'; stages: [OBSERVE: {content:'observe the competitor's price cut', observations:[{id:'OBS1', content:\"detected the competitor's website price dropped 20% overnight\"}]}, ORIENT: {content:'re-assess whether our pricing strategy still holds up', observation_refs:['OBS1'], mental_model_update:\"the assumption that 'price is not a major competitive factor' needs revising\"}, DECIDE: {content:'decide to launch a limited-time counter-offer instead of matching the price cut directly'}, ACT: {content:'launch the limited-time offer and notify the sales team'}] (each stage's timestamp must be non-decreasing). Key point: if ORIENT's observation_refs were ['OBS99'] (an id that doesn't exist in the OBSERVE stage), the record would be refused at construction -- ORIENT must actually connect to something this same record observed, it can't orient out of thin air."
  learning.pdca:
    name_en: "Plan-Do-Check-Act"
    abbr: "PDCA"
    name_zh: "PDCA 循環"
    blurb_en: "Plan -> Do -> Check -> Act, for continuous improvement of a stable process. Use it for long-term, incremental process improvement, not a fast-moving crisis."
    blurb_zh: "計畫→執行→檢核→行動，用於穩定流程的長期改進。長期漸進式流程改善，不是要應付快速變化的危機時用。"
    why_en: "each cycle's stages[] must be an ordered prefix of PLAN/DO/CHECK/ACT, and cycle_number must run 1..N with no gaps or reordering. Cycle N>1's PLAN.carried_forward_action_item_ids must resolve to real ids from cycle N-1's own ACT.action_items -- Atlas's own trailing repeat arrow ('...->Act->...') is a real continuity requirement, not decorative: a new cycle's plan is not allowed to just invent that it's building on the prior cycle's own learning."
    why_zh: "每個 cycle 的 stages[] 一定要是 PLAN／DO／CHECK／ACT 的有序前綴，cycle_number 也一定要從 1 到 N 連續、不能跳號或錯位。第 N 個（N>1）cycle 的 PLAN.carried_forward_action_item_ids 一定要對應到第 N-1 個 cycle 自己 ACT.action_items 裡真實存在的 id——Atlas 自己畫的那個「…→Act→…」循環箭頭是真的延續性要求，不是裝飾：新一輪的計畫不能憑空宣稱自己是延續上一輪的學習成果。"
    url: "https://en.wikipedia.org/wiki/PDCA"
    example_zh: "情境：兩輪 PDCA 持續改善一個上線流程。\nprocess_under_improvement：「新功能上線檢查流程」\ncycles：[{cycle_number:1, stages:[PLAN(carried_forward_action_item_ids:null), DO, CHECK, ACT(action_items:[{id:\"ACTION-1\", description:\"下次多測試手機版排版\"}])]}, {cycle_number:2, stages:[PLAN(carried_forward_action_item_ids:[\"ACTION-1\"]), DO, CHECK, ACT(...)]}]\n（重點）如果第 2 輪的 PLAN.carried_forward_action_item_ids 填了一個第 1 輪 ACT.action_items 裡不存在的 id，會被拒絕建立——延續性不能憑空宣稱，一定要真的對應到上一輪產出的行動項目。"
    example_en: "Scenario: two PDCA cycles continuously improving a feature-launch checklist. process_under_improvement: 'new-feature launch checklist'; cycles: [{cycle_number:1, stages:[PLAN(carried_forward_action_item_ids:null), DO, CHECK, ACT(action_items:[{id:'ACTION-1', description:'test mobile layout more thoroughly next time'}])]}, {cycle_number:2, stages:[PLAN(carried_forward_action_item_ids:['ACTION-1']), DO, CHECK, ACT(...)]}]. Key point: if cycle 2's PLAN.carried_forward_action_item_ids named an id that doesn't exist in cycle 1's own ACT.action_items, the record would be refused at construction -- continuity can't be asserted out of thin air, it must actually resolve to what the prior cycle produced."
  learning.post_mortem:
    name_en: "Post-mortem"
    abbr: ""
    name_zh: "事後檢討"
    blurb_en: "Reviews timeline -> impact -> causes -> actions after an incident, blame-free by design. Use it after any incident to prevent recurrence without turning it into a blame session."
    blurb_zh: "事件後檢視時間軸→影響→原因→行動，設計上就不指責個人。任何事故發生後，想防止重發又不搞成互相指責時用。"
    why_en: "timeline[]/causes[] entries are closed key sets with no field for a named individual -- Atlas's own '非 blame' (no-blame) requirement made structural, not just a cultural norm. Every cause's timeline_ref must also resolve to a real timeline[] event in the SAME record -- a cause floating free of any timeline event hasn't actually been traced back to what happened. Every action needs a non-empty owner -- forward-looking accountability for preventing recurrence, never fault attribution."
    why_zh: "timeline[]／causes[] 的欄位是封閉集合，完全沒有能填具名個人的欄位——把 Atlas 自己講的「非 blame」（不究責）要求變成結構限制，不只是文化上的期許。每個 cause 的 timeline_ref 也一定要對應到同一筆記錄裡真實存在的 timeline[] 事件——一個沒有連結到任何時間軸事件的原因，等於沒有真的追溯回實際發生的事。每個 action 都一定要有非空的 owner——這是向前看的、防止重演的責任歸屬，絕對不是究責。"
    url: "https://sre.google/sre-book/postmortem-culture/"
    example_zh: "情境：檢討一次付款服務半夜中斷 40 分鐘的事故。\nincident_name：「付款服務半夜中斷 40 分鐘」\ntimeline：[{event_id:\"T-1\", timestamp:\"2026-09-15T02:10:00Z\", description:\"監控系統偵測到付款成功率驟降至 0%\"}]\nimpact_description：「約 1,200 筆訂單付款失敗，估計損失營收 15 萬元」\ncauses：[{cause_id:\"C-1\", description:\"資料庫連線池設定值過低，尖峰時段耗盡連線\", timeline_ref:\"T-1\"}]\nactions：[{action_id:\"A-1\", description:\"調高連線池上限並加入自動擴充機制\", owner:\"小華\"}]\n（重點）如果 causes 的 timeline_ref 填成 \"T-99\"（timeline 裡根本沒有這個事件），會被拒絕建立——原因一定要真的連結到這次事故時間軸上實際發生的事件，不能憑空冒出一個原因。"
    example_en: "Scenario: reviewing a 40-minute overnight payment-service outage. incident_name: '40-minute overnight payment service outage'; timeline: [{event_id:'T-1', timestamp:'2026-09-15T02:10:00Z', description:'monitoring detected payment success rate dropped to 0%'}]; impact_description: 'approximately 1,200 orders failed payment, estimated revenue loss of $150,000'; causes: [{cause_id:'C-1', description:'database connection pool was set too low and exhausted during peak traffic', timeline_ref:'T-1'}]; actions: [{action_id:'A-1', description:'raise the connection pool limit and add auto-scaling', owner:'Howard'}]. Key point: if a cause's timeline_ref were 'T-99' (an event that doesn't exist in timeline), the record would be refused at construction -- a cause must actually connect to something that really happened on this incident's own timeline, it can't appear out of nowhere."
  learning.prediction_tracking:
    name_en: "Prediction Tracking"
    abbr: ""
    name_zh: "預測追蹤"
    blurb_en: "Records a prediction, horizon, and actual outcome, computing the real error to improve calibration over time. Use it to build a track record of how good your predictions actually are."
    blurb_zh: "記錄預測、時間範圍、實際結果，算出真實誤差以改善校準。想長期追蹤自己預測到底準不準時用。"
    why_en: "error is never a caller-suppliable parameter -- always computed internally from the prediction vs. the actual (Brier score for PROBABILITY, absolute error for POINT_ESTIMATE), and independently re-derived by the gate on every call. Exactly one of predicted_probability/predicted_value must be set, matching prediction_type -- the other is structurally None, never merely unused. stage1_integrity_hash locks statement/prediction_type/predicted_probability/predicted_value/horizon before any actual is known, the same commit-before-the-outcome discipline decision_journal establishes, so a forecast can't be quietly touched up after the fact to look more accurate."
    why_zh: "error（誤差）從來不是呼叫端能自己填的參數——永遠是從預測值跟實際值內部算出來的（機率型用 Brier score，數值型用絕對誤差），而且 gate 每次都會獨立重新計算比對。predicted_probability／predicted_value 一定要剛好設定其中一個、且要跟 prediction_type 搭配——另一個一定要結構性地是 None，不能只是「沒填但技術上存在」。stage1_integrity_hash 在結果還沒揭曉前，就把 statement／prediction_type／predicted_probability／predicted_value／horizon 鎖住——跟 decision_journal 一樣的「先承諾再看結果」紀律，這樣一個預測就不能在事後被悄悄改得更準。"
    url: "https://en.wikipedia.org/wiki/Philip_E._Tetlock"
    example_zh: "情境：追蹤「這次產品發表會後付費轉換率會提升」這個預測。\nstatement：「這次產品發表會後，付費轉換率會提升」\nprediction_type：「PROBABILITY」\npredicted_probability：0.7\nhorizon：「發表會後 30 天」\n30 天後用 record_actual 附加實際結果：observed_outcome:true → error 不用也不能自己填，系統自動算出 Brier score 約 0.09（(0.7-1)²）。\n（重點）如果同時填了 predicted_probability:0.7 又填 predicted_value:100，會被拒絕建立——prediction_type 是 PROBABILITY 時，只能設定 predicted_probability，predicted_value 一定要是 None，不能兩個都給值。"
    example_en: "Scenario: tracking the prediction 'paid conversion rate will rise after this product launch event'. statement: 'paid conversion rate will rise after this product launch event'; prediction_type: 'PROBABILITY'; predicted_probability: 0.7; horizon: '30 days after the launch event'. 30 days later, record_actual attaches the real outcome: observed_outcome:true -> error is never supplied directly, the system computes a Brier score of approximately 0.09 ((0.7-1)^2) automatically. Key point: if both predicted_probability:0.7 and predicted_value:100 were supplied together, the record would be refused at construction -- when prediction_type is PROBABILITY, only predicted_probability may be set; predicted_value must be None, not both given a value."
  learning.reversal_criteria:
    name_en: "Reversal Criteria"
    abbr: ""
    name_zh: "決策逆轉條件"
    blurb_en: "Defines, for an already-made decision, exactly what new evidence would justify reversing it. Use it right after a big decision, to pre-commit to what would change your mind."
    blurb_zh: "針對已經做的決策，事先定義「出現什麼新證據該翻案」。大決策做完後，想先講好什麼情況下會改變心意時用。"
    why_en: "action and owner are both validated non-empty at construction -- a criterion with no committed action or accountable owner is decorative, not enforceable. This structurally implements the same 'if-then' pre-commitment principle (indicator -> condition -> committed action, decided BEFORE the triggering moment arrives) that psychology's own implementation-intentions research shows roughly doubles real follow-through, versus a vague intention decided only in the moment."
    why_zh: "action 跟 owner 在建構時都會驗證非空——一個沒有承諾行動、沒有負責人的準則只是裝飾，不是真的能被執行的規則。這在結構上實作了跟心理學「if-then 執行意圖」研究相同的預先承諾原則（指標→條件→承諾的行動，在觸發時刻真的到來之前就先決定好）——這類研究顯示這種做法讓實際落實的機率大約加倍，遠勝過臨場才決定的模糊意圖。"
    url: "https://www.thebehavioralscientist.com/glossary/implementation-intentions"
    example_zh: "情境：為「採用新的客服自動化機器人」這個決策設定重審條件。\ndecision_ref：「採用新的客服自動化機器人」\ncriteria：[{id:\"R1\", indicator:\"客戶滿意度(CSAT)\", condition:\"連續 3 個月低於 80%\", action:\"重新加入真人客服選項並暫停機器人優先分流\", owner:\"客服主管\"}]\n（重點）如果 action 填空字串（只定義了指標跟條件，沒講清楚觸發時要做什麼），會被拒絕建立——沒有承諾行動的準則，等於只是觀察而已，不是真的能被執行的重審機制。"
    example_en: "Scenario: setting a re-review trigger for the decision to adopt a new customer-service automation bot. decision_ref: 'adopting a new customer-service automation bot'; criteria: [{id:'R1', indicator:'customer satisfaction (CSAT)', condition:'below 80% for 3 consecutive months', action:'re-add a live-agent option and pause bot-first routing', owner:'customer service lead'}]. Key point: if action were an empty string (only the indicator and condition defined, with no committed action when triggered), the record would be refused at construction -- a criterion with no committed action is just an observation, not an enforceable re-review mechanism."

  # ---- representation (F24 representation/cognitive-preference views) ----
  representation.audio_conversational_view:
    name_en: "Audio / Conversational View"
    abbr: ""
    name_zh: "語音／對話檢視"
    blurb_en: "Lets a user operate an existing knowledge object by voice, requiring readback + explicit confirmation before anything is committed. Use it to lower the input barrier for someone who'd rather talk than type."
    blurb_zh: "讓使用者用語音操作既有的知識物件，一定要先讀回並經使用者確認才算數。想降低輸入門檻、給喜歡用講的而不是打字的人用。"
    why_en: "status=CONFIRMED requires a non-empty readback_transcript AND confirmed_by_user=true, or it's refused outright. This mirrors the aviation readback/hearback protocol: the confirmation step is the only moment a misheard instruction can be caught, so skipping it turns a low-friction voice interface into a silently-unreliable one."
    why_zh: "status=CONFIRMED 一定要有非空的 readback_transcript 且 confirmed_by_user=true，否則直接拒絕——這跟航空界的 readback/hearback（覆誦確認）協定是同一個道理：覆誦確認是唯一能抓到「聽錯指令」的時刻，跳過這一步會讓一個原本低門檻的語音介面，變成一個悄悄不可靠的介面。"
    url: "https://skybrary.aero/articles/read-back-or-hear-back"
    example_zh: "情境：用語音操作記錄「本週待辦事項」這個 Knowledge Object。\nknowledge_ref：「TASK-2026-W38」\nstructured_objects 每筆的 object_id 要唯一，status 只能是 DRAFT／CONFIRMED，例如 [{object_id: \"SO-1\", status: \"DRAFT\", transcript: \"新增一項：週五前完成月報\", readback_transcript: null, confirmed_by_user: false}, {object_id: \"SO-2\", status: \"CONFIRMED\", transcript: \"刪除待辦：舊版簡報\", readback_transcript: \"確認要刪除「舊版簡報」這項待辦，對嗎？\", confirmed_by_user: true}]\nstate 是一個 dict，可以是空的 {}\n（重點）如果 SO-1 的 status 改成 CONFIRMED，但 readback_transcript 還是 null，會被拒絕建立——語音操作在真人覆誦確認之前，不能被當成已確認的結果。"
    example_en: "Scenario: manage 'this week's to-do list' Knowledge Object via voice. knowledge_ref: 'TASK-2026-W38'; structured_objects entries have a unique object_id, status is DRAFT or CONFIRMED, e.g. [{object_id: 'SO-1', status: 'DRAFT', transcript: 'Add item: finish the monthly report by Friday', readback_transcript: null, confirmed_by_user: false}, {object_id: 'SO-2', status: 'CONFIRMED', transcript: 'Delete item: old deck', readback_transcript: 'Confirming: delete the to-do item \"old deck\", correct?', confirmed_by_user: true}]; state is a dict, may be empty {}. Key point: if SO-1's status were changed to CONFIRMED while readback_transcript stayed null, the record would be refused at construction -- a voice-derived edit can't count as confirmed before a human actually reads it back and confirms."
  representation.causal_view:
    name_en: "Causal View"
    abbr: ""
    name_zh: "因果檢視"
    blurb_en: "A presentation layer over an existing causal DAG/loop diagram where every edge must carry its assumption -- so a generic diagram never gets mistaken for verified causation. Use it to visually present causal reasoning honestly."
    blurb_zh: "在既有因果圖／迴路圖上加一層呈現，每個箭頭都要附假設，避免一般圖表被誤當成已驗證的因果。想誠實地視覺化呈現因果推理時用。"
    why_en: "every rendered causal edge must carry a non-empty declared assumption, or it's refused -- an edge with no stated assumption is exactly the 'ordinary diagram mistaken for causation' failure this method exists to prevent. A causal diagram is only ever as trustworthy as the assumptions behind each arrow, and those assumptions are never statistically testable from the diagram alone -- they have to be written down."
    why_zh: "每一條被渲染出來的因果邊都一定要附上非空的宣告假設，否則直接拒絕——一條沒有寫明假設的邊，正是這個方法要防止的「把一般圖誤當因果」失敗。一張因果圖的可信度，說到底就是每一支箭頭背後的假設有多站得住腳，而這些假設本來就沒辦法只從圖本身用統計方法驗證，一定要有人明確寫下來。"
    url: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10712057/"
    example_zh: "情境：渲染一份「行銷預算增加會提升營收」的因果視圖。\nknowledge_ref：「CDA-marketing-revenue-2026」（指向既有的 causal.dag 或 systems.causal_loop_diagram 記錄）\nrendered_edges 每筆的 edge_id 要唯一、assumption 不能空白，例如 [{edge_id: \"E-1\", assumption: \"假設沒有其他同期活動（如季節性促銷）同時影響營收\"}, {edge_id: \"E-2\", assumption: \"假設預算增加確實轉化為曝光量增加，而非被內部效率損耗吃掉\"}]\nstate 可以是空的 {}\n（重點）如果 E-2 的 assumption 填成空字串，會被拒絕建立——一條沒有寫明假設的因果邊，正是這個方法要防止的「把一般圖誤當因果」。"
    example_en: "Scenario: render a causal view of 'increased marketing budget raises revenue'. knowledge_ref: 'CDA-marketing-revenue-2026' (points to an existing causal.dag or systems.causal_loop_diagram record); rendered_edges entries have a unique edge_id and a non-empty assumption, e.g. [{edge_id: 'E-1', assumption: 'Assumes no other concurrent activity (e.g. seasonal promotions) is also driving revenue'}, {edge_id: 'E-2', assumption: 'Assumes the budget increase actually converts to more impressions, rather than being absorbed by internal inefficiency'}]; state may be empty {}. Key point: if E-2's assumption were an empty string, the record would be refused at construction -- an edge with no declared assumption is exactly the 'ordinary diagram mistaken for causation' failure this method exists to prevent."
  representation.concept_graph_view:
    name_en: "Concept Graph View"
    abbr: ""
    name_zh: "概念圖檢視"
    blurb_en: "Renders an existing knowledge object's typed relations as a graph, without duplicating or altering the underlying content. Use it to visualize knowledge and contradictions without copying data around."
    blurb_zh: "把既有知識物件的關係渲染成圖，不複製也不竄改底層內容。想可視化知識與矛盾，又不想到處複製資料時用。"
    why_en: "every rendered edge's relation_type and provenance_ref must exactly match its referenced source relation's real values -- an edge asserting a DIFFERENT relation type than the underlying data actually has is refused, never silently rendered. This operationalizes 'visualize knowledge and its contradictions faithfully' -- the rendering layer is not allowed to invent or soften a relationship that the source data doesn't actually assert."
    why_zh: "每一條被渲染出來的邊，它的 relation_type 跟 provenance_ref 都一定要跟它指向的來源關係實際的值完全一樣——一條主張了跟底層資料不一樣的關係類型的邊，會被拒絕，不會悄悄被畫出來。這是把「忠實視覺化知識與矛盾」這句話變成硬規則：渲染層不能自己發明或淡化一個來源資料根本沒有主張的關係。"
    url: "https://linkurious.com/blog/knowledge-graph-visualization/"
    example_zh: "情境：把一份知識庫裡「兩份研究報告互相矛盾」的關係渲染成概念圖。\nknowledge_ref：「KB-climate-reports-2026」\nsource_relations（真實來源資料，不會存進最終記錄）至少 1 筆，relation_id 要唯一，例如 [{relation_id: \"REL-1\", relation_type: \"CONTRADICTS\", provenance_ref: \"REPORT-A-vs-REPORT-B\"}]\nedges 每筆的 relation_id 要指向上面真實存在的關係，而且 relation_type／provenance_ref 一定要跟該關係完全一樣，例如 [{edge_id: \"E-1\", relation_id: \"REL-1\", relation_type: \"CONTRADICTS\", provenance_ref: \"REPORT-A-vs-REPORT-B\", layout_position: {x: 100, y: 50}, visible: true}]\n（重點）如果 edges 裡把 relation_type 改填成 \"SUPPORTS\"（跟 source_relations 裡真實的 \"CONTRADICTS\" 不符），會被拒絕建立——渲染層不能自己竄改底層資料實際主張的關係。"
    example_en: "Scenario: render a concept graph of a 'these two research reports contradict each other' relation from a knowledge base. knowledge_ref: 'KB-climate-reports-2026'; source_relations (the real ground truth, never persisted onto the final record) has >=1 entry with a unique relation_id, e.g. [{relation_id: 'REL-1', relation_type: 'CONTRADICTS', provenance_ref: 'REPORT-A-vs-REPORT-B'}]; every edges entry's relation_id must resolve to a real relation above, and its relation_type/provenance_ref must exactly match that relation, e.g. [{edge_id: 'E-1', relation_id: 'REL-1', relation_type: 'CONTRADICTS', provenance_ref: 'REPORT-A-vs-REPORT-B', layout_position: {x: 100, y: 50}, visible: true}]. Key point: if the edges entry's relation_type were changed to 'SUPPORTS' (disagreeing with source_relations' real 'CONTRADICTS'), the record would be refused at construction -- the rendering layer can't misrepresent what the underlying data actually asserts."
  representation.expert_lego_mode:
    name_en: "Expert LEGO Mode"
    abbr: ""
    name_zh: "專家自由組裝模式"
    blurb_en: "Lets an expert freely assemble typed method-blocks into a custom chain, with mandatory compatibility/policy/jurisdiction/gate checks -- free assembly, never free destruction. Use it when you know exactly which methods you want chained together, in what order."
    blurb_zh: "讓專家自由拖拉組裝方法積木成自訂鏈，但強制做相容性／政策／管轄權／閘門檢查——是自由組裝，不是自由破壞。你很清楚想串哪些方法、什麼順序時用。"
    why_en: "compile_status is never a caller-supplied field -- it's always computed as COMPILED iff all 7 mandatory checks (type, precondition, policy, jurisdiction, cost, risk, required-gate-injection) are PASS, else REJECTED. This makes Atlas's own rule -- 'this is free assembly, not free destruction' -- structural: an expert can drag any methods together, but the chain can never claim to be compiled unless every one of the 7 checks the compiler is supposed to run actually passed."
    why_zh: "compile_status 從來不是呼叫端能直接給值的欄位——永遠是「7 個強制檢查（型別、前置條件、政策、管轄權、成本、風險、必要 gate 注入）是不是全部 PASS」算出來的，全過才是 COMPILED，否則就是 REJECTED。這把 Atlas 自己的規則——「這是自由組裝，不是自由破壞」——變成結構性事實：專家可以自由拖拉任何方法組成一條鏈，但這條鏈絕不能宣稱自己編譯成功，除非編譯器該跑的 7 項檢查真的全部通過。"
    url: "https://www.geeksforgeeks.org/compiler-design/type-checking-in-compiler-design/"
    example_zh: "情境：專家自由組裝一條「JTBD → 假設地圖 → 蒙地卡羅模擬」的方法鏈。\nchain 至少 2 步、step_id 要唯一，method_id 要符合 family.method 的格式，例如 [{step_id: \"S1\", method_id: \"insight.jtbd\"}, {step_id: \"S2\", method_id: \"epistemic.assumption_mapping\"}, {step_id: \"S3\", method_id: \"computation.monte_carlo\"}]\nchecks 一定要剛好是這 7 項各出現一次：type_check、precondition_check、policy_check、jurisdiction_check、cost_estimate、risk_estimate、required_gate_injection，每項要有 status（PASS／FAIL）跟 note，例如 [{check: \"type_check\", status: \"PASS\", note: \"每步輸出型別跟下一步輸入型別相容\"}, {check: \"precondition_check\", status: \"PASS\", note: \"前置條件皆滿足\"}, {check: \"policy_check\", status: \"PASS\", note: \"無政策違規\"}, {check: \"jurisdiction_check\", status: \"FAIL\", note: \"S3 需要的運算資源不在允許的管轄區\"}, {check: \"cost_estimate\", status: \"PASS\", note: \"預估成本在預算內\"}, {check: \"risk_estimate\", status: \"PASS\", note: \"風險評估通過\"}, {check: \"required_gate_injection\", status: \"PASS\", note: \"已注入必要 gate\"}]\n（重點）上面這個例子因為 jurisdiction_check 是 FAIL，就算其他 6 項都 PASS，compile_status 還是會自動算成 REJECTED；要拿到 COMPILED，7 項檢查必須全部 PASS。"
    example_en: "Scenario: an expert freely assembles a method chain 'JTBD -> Assumption Mapping -> Monte Carlo simulation'. chain has >=2 steps with a unique step_id, method_id matches the family.method pattern, e.g. [{step_id: 'S1', method_id: 'insight.jtbd'}, {step_id: 'S2', method_id: 'epistemic.assumption_mapping'}, {step_id: 'S3', method_id: 'computation.monte_carlo'}]; checks must contain EXACTLY these 7 names, each once: type_check, precondition_check, policy_check, jurisdiction_check, cost_estimate, risk_estimate, required_gate_injection, each with a status (PASS/FAIL) and a note. E.g. [{check: 'type_check', status: 'PASS', note: 'Each steps output type is compatible with the next steps input'}, {check: 'precondition_check', status: 'PASS', note: 'All preconditions satisfied'}, {check: 'policy_check', status: 'PASS', note: 'No policy violations'}, {check: 'jurisdiction_check', status: 'FAIL', note: 'S3s required compute resource is outside the permitted jurisdiction'}, {check: 'cost_estimate', status: 'PASS', note: 'Estimated cost within budget'}, {check: 'risk_estimate', status: 'PASS', note: 'Risk assessment passed'}, {check: 'required_gate_injection', status: 'PASS', note: 'Required gate injected'}]. Key point: in this example, because jurisdiction_check is FAIL, compile_status is automatically REJECTED even though the other 6 checks all PASS; to get COMPILED, all 7 checks must be PASS."
  representation.guided_mode:
    name_en: "Guided Mode"
    abbr: ""
    name_zh: "引導模式"
    blurb_en: "Asks one question at a time and auto-selects the right method from your answer, so tool-choice complexity stays in the engine, not on you. Use it when you don't know which tool to reach for."
    blurb_zh: "一次問一個問題，依你的答案自動選出合適方法，讓「選哪個工具」的複雜度留在系統裡，不丟給你。不知道該用哪個工具時用。"
    why_en: "selected_method_id must resolve as an ACTIVE contract in the real method catalog -- not merely look like a well-formed id string -- before the session is accepted. This stops guided mode from ever 'selecting' a method that doesn't actually exist in the system, the same discipline that keeps the whole corpus from improvising method behavior from narrative alone. Requiring at least one real question-answer pair on top of that means a selection can't happen with zero actual questions asked, which is the progressive-disclosure promise Atlas names -- the system, not the user, carries the complexity of choosing."
    why_zh: "selected_method_id 在這個對話紀錄被接受之前，一定要在真實的方法目錄裡解析成一個 ACTIVE 的合約——不是只看起來像一個格式正確的 id 字串就好。這樣就不會出現「引導模式選了一個系統裡根本不存在的方法」這種情況，跟整個語料庫「不能只憑敘述亂編方法行為」是同一套紀律。在此之上還要求至少 1 組真實的問答，這樣就不會出現「一個問題都沒問就選好方法」的情況，這正是 Atlas 講的漸進揭露承諾——複雜度該留在系統裡，不是丟給使用者。"
    url: "https://www.nngroup.com/videos/progressive-disclosure/"
    example_zh: "情境：使用者不確定該用哪個方法找問題根因，系統逐步提問後自動選定方法。\nqa_trail 至少 1 組，question／answer 都不能空白，例如 [{question: \"你目前是在找「可能原因」，還是已經有數據想驗證原因？\", answer: \"還在找可能原因，還沒有數據\"}]\nselected_method_id 格式要是 family.method，而且一定要能在真實的方法目錄裡解析成一個 ACTIVE 合約，例如 \"root_cause.fishbone\"\n（重點）如果 selected_method_id 填一個系統裡根本沒有合約的方法名（例如打錯字或已下架的方法），會被拒絕建立——引導模式不能選一個實際上不存在的方法。qa_trail 也不能是空陣列，一個問題都沒問就選定方法，正是這個方法要防止的黑箱選擇。"
    example_en: "Scenario: a user isn't sure which method to use for root-cause analysis, and the system asks questions step by step before auto-selecting one. qa_trail has >=1 pair, question/answer both non-empty, e.g. [{question: 'Are you currently looking for possible causes, or do you already have data you want to test a cause against?', answer: 'Still looking for possible causes, no data yet'}]; selected_method_id matches the family.method pattern AND must resolve as an ACTIVE contract in the real method catalog, e.g. 'root_cause.fishbone'. Key point: if selected_method_id named a method with no real contract in the system (a typo, or a retired method), the record would be refused at construction -- guided mode can't select a method that doesn't actually exist. qa_trail also cannot be an empty list -- selecting a method with zero questions asked is exactly the black-box selection this method exists to prevent."
  representation.mind_map_view:
    name_en: "Mind Map View"
    abbr: ""
    name_zh: "心智圖檢視"
    blurb_en: "Renders an EXISTING knowledge object's own nodes as a radial mind map -- a presentation layer, not a new mind map generator (that's association.mind_map). Use it to re-view something you already built, spatially."
    blurb_zh: "把既有知識物件的節點渲染成放射狀心智圖——是呈現層，不是產生新心智圖（那是 association.mind_map）。想用空間方式重新檢視已經建好的東西時用。"
    why_en: "every node_positions entry holds only a bare reference id plus numeric coordinates -- never a label, topic, or keyword -- and layout.center_node_id, when given, must resolve to a node that's actually being rendered. This structurally distinguishes it from association.mind_map (which generates new brainstorm content): this method can only render an already-existing Knowledge Object's own nodes at radial positions, never invent new content through the view layer."
    why_zh: "每一筆 node_positions 只能存放一個純粹的參照 id 加上數字座標——絕對不能放標籤、主題或關鍵字內容——而 layout.center_node_id 如果有填，就一定要指向一個真的有被渲染出來的節點。這在結構上把這個方法跟 association.mind_map（會產生全新腦力激盪內容的方法）徹底分開：這個方法只能把一個已經存在的 Knowledge Object 自己的節點，用放射狀座標排出來，不能透過這個檢視層自己發明新內容。"
    url: "http://www.mindmapsoft.com/create-radial-mind-map/"
    example_zh: "情境：把一份既有的腦力激盪知識物件，用放射狀佈局渲染成心智圖畫面。\nsource_knowledge_object_id：「MINDMAP-brainstorm-2026-09」（指向既有的 association.mind_map 記錄，本身不含任何內容文字）\nnode_positions 不能是空陣列，node_id 要唯一，例如 [{node_id: \"central_topic\", x: 0, y: 0}, {node_id: \"branch-1\", x: 100, y: 50, distance_from_center: 111.8}]\n（選填）layout：{center_node_id: \"central_topic\", orientation: \"clockwise\"}\n（重點）如果 layout.center_node_id 填了一個沒在 node_positions 出現過的節點，會被拒絕建立——放射狀佈局不能宣告一個根本沒被畫出來的中心點。"
    example_en: "Scenario: render an existing brainstorm Knowledge Object as a radial mind-map layout. source_knowledge_object_id: 'MINDMAP-brainstorm-2026-09' (points to an existing association.mind_map record, contains no content text itself); node_positions cannot be an empty list, node_id must be unique, e.g. [{node_id: 'central_topic', x: 0, y: 0}, {node_id: 'branch-1', x: 100, y: 50, distance_from_center: 111.8}]. Optional: layout: {center_node_id: 'central_topic', orientation: 'clockwise'}. Key point: if layout.center_node_id named a node that never appears in node_positions, the record would be refused at construction -- a radial layout can't declare a center that was never actually rendered."
  representation.switching:
    name_en: "Representation Switching"
    abbr: ""
    name_zh: "表徵切換"
    blurb_en: "Renders the SAME underlying knowledge object through different views (text/table/mind map/graph/timeline/causal/canvas/audio) with provenance kept consistent -- never forking into conflicting copies. Use it when different people need to look at the same data differently."
    blurb_zh: "把同一個底層知識物件用不同檢視方式呈現（文字／表格／心智圖／概念圖／時間軸／因果圖／畫布／語音），來源保持一致，不會因換介面就複製出互相衝突的內容。不同人需要用不同方式看同一份資料時用。"
    why_en: "every view in the switch event must reference the exact same knowledge_object_id AND carry deep-equal provenance -- a switch record naming two different underlying objects, or whose per-view provenance diverges, IS the exact 'a UI change forks the content into conflicting copies' failure this method exists to prevent. This operationalizes the single-source-of-truth principle at the record level: switching how something is displayed can never fork what is actually being displayed."
    why_zh: "一次切換事件裡的每一個 view，都一定要指向完全相同的 knowledge_object_id，而且 provenance 也要完全相等（深度比對）——一份記錄如果混進了兩個不同的底層物件、或每個 view 的 provenance 各不相同，正是這個方法要防止的「UI 一變就複製出多份互相衝突內容」失敗。這是把「單一事實來源」原則落實在紀錄層級：切換顯示方式，絕對不能連帶把「顯示的到底是什麼」也分岔出去。"
    url: "https://en.wikipedia.org/wiki/Single_source_of_truth"
    example_zh: "情境：讓使用者在「文字大綱」跟「心智圖」兩種呈現方式之間切換，看同一份會議記錄。\nviews 至少 2 筆，category 只能是 text／outline／table／matrix／mindmap／conceptmap／timeline／causal／graph／canvas／audio 這 11 種其中之一，例如 [{category: \"outline\", knowledge_object_id: \"MEETING-2026-09-18\", provenance: {...}}, {category: \"mindmap\", knowledge_object_id: \"MEETING-2026-09-18\", provenance: {...}}]\n（重點）兩個 view 的 knowledge_object_id 一定要完全一樣、provenance 也一定要完全一樣（同一個值），如果其中一個 view 指向不同的 knowledge_object_id，或 provenance 跟另一個不同，會被拒絕建立——切換呈現方式不能連帶讓內容本身分岔。"
    example_en: "Scenario: let a user switch between a 'text outline' view and a 'mind map' view of the same meeting record. views has >=2 entries, category is one of the 11 values text/outline/table/matrix/mindmap/conceptmap/timeline/causal/graph/canvas/audio, e.g. [{category: 'outline', knowledge_object_id: 'MEETING-2026-09-18', provenance: {...}}, {category: 'mindmap', knowledge_object_id: 'MEETING-2026-09-18', provenance: {...}}]. Key point: every view's knowledge_object_id must be identical, and provenance must be identical too (the exact same value) -- if one view named a different knowledge_object_id, or its provenance differed from the other, the record would be refused at construction -- switching how something is displayed can never fork the content itself."
  representation.table_matrix_view:
    name_en: "Table / Matrix View"
    abbr: ""
    name_zh: "表格／矩陣檢視"
    blurb_en: "Renders an entities-by-criteria comparison over existing data, with any computed score clearly marked as a view-level computation, not stored fact. Use it for efficient side-by-side comparison of many things."
    blurb_zh: "把既有資料渲染成實體×準則的比較表，任何算出來的分數都明確標記為檢視層計算，不是儲存的事實。想高效率並排比較很多東西時用。"
    why_en: "every scores entry must carry computed: true as a literal boolean -- a score is always a view-level presentation artifact derived by filtering/sorting/scoring, never a new fact about the entities, and asserting one without that flag is refused. This stops a comparison view from silently smuggling in what looks like new canonical data through the back door of a 'score'."
    why_zh: "每一筆 scores 都一定要附上字面值 True 的 computed 欄位——一個分數永遠是靠篩選／排序／計分這個檢視層算出來的呈現產物，不是關於這些實體的新事實，宣稱一個分數卻沒附上這個旗標會被拒絕。這樣一個比較檢視就不能悄悄從「分數」這個後門，夾帶看起來像新的正式資料進去。"
    url: "https://en.wikipedia.org/wiki/Decision_matrix"
    example_zh: "情境：比較三個雲端供應商在「價格」跟「SLA」兩個準則上的表現。\nsource_knowledge_object_id：「VENDOR-comparison-2026」\nentities 至少 1 筆、不重複，例如 [\"vendor-a\", \"vendor-b\", \"vendor-c\"]\ncriteria 至少 1 筆、不重複，例如 [\"price\", \"sla\"]\n（選填）scores 每筆的 entity_id／criterion_id 都要指向上面真實存在的項目，computed 一定要是字面值 true，例如 [{entity_id: \"vendor-a\", criterion_id: \"price\", score: 8.5, computed: true}]\n（重點）如果 scores 裡的 computed 填成 false 或乾脆不給，會被拒絕建立——分數一定要標明自己是算出來的呈現產物，不能被誤當成關於供應商的原始事實資料。"
    example_en: "Scenario: compare three cloud vendors on 'price' and 'SLA' criteria. source_knowledge_object_id: 'VENDOR-comparison-2026'; entities has >=1 unique entry, e.g. ['vendor-a', 'vendor-b', 'vendor-c']; criteria has >=1 unique entry, e.g. ['price', 'sla']. Optional: every scores entry's entity_id/criterion_id must resolve to a real item above, and computed must be the literal boolean true, e.g. [{entity_id: 'vendor-a', criterion_id: 'price', score: 8.5, computed: true}]. Key point: if a scores entry's computed were false or omitted, the record would be refused at construction -- a score must always be labeled as a derived presentation artifact, never mistaken for raw fact data about the vendors."
  representation.text_outline_view:
    name_en: "Text / Outline View"
    abbr: ""
    name_zh: "文字／大綱檢視"
    blurb_en: "Renders an existing knowledge object as a nested outline (summary -> outline -> details -> evidence links). Use it when you want to read something deeply and linearly instead of visually."
    blurb_zh: "把既有知識物件渲染成巢狀大綱（摘要→大綱→細節→證據連結）。想深度、線性閱讀而不是用視覺化方式看時用。"
    why_en: "every summary -- top-level and every outline node, recursively -- must be non-empty and at most 240 characters, and the schema has no field anywhere to hold a full-text blob. This structural absence, not a length check alone, is what enforces Atlas's own no-duplication law: there's simply nowhere on this record for a pasted-in copy of the underlying content to live, only short summaries plus bare reference ids pointing back to the real detail."
    why_zh: "每一個 summary（最上層跟每一個大綱節點，遞迴適用）都一定要非空且不超過 240 字元，而且整個 schema 裡完全沒有任何欄位可以放全文內容。這個結構上的「沒有那個欄位」，而不只是長度檢查本身，才是真正落實 Atlas 不得重複內容規定的關鍵：這份紀錄上根本沒有地方可以貼一份底層內容的複本，只有短摘要加上指回真正細節的純參照 id。"
    url: "https://www.nngroup.com/articles/inverted-pyramid/"
    example_zh: "情境：把一份長篇研究報告渲染成摘要優先的大綱檢視。\nsource_knowledge_object_id：「REPORT-market-2026」\nsummary 不能空白、不能超過 240 字元，例如「2026 年市場報告：三大趨勢與對應建議」\noutline 不能是空陣列，每個節點的 id／summary 都要符合同樣規則，可以遞迴巢狀，例如 [{id: \"N1\", summary: \"趨勢一：訂閱制成長放緩\", evidence_links: [\"EVID-report-p12\"], children: [{id: \"N1-1\", summary: \"北美市場成長率降至 3%\", details_ref: \"REPORT-market-2026:section-2.1\"}]}]\n（重點）這個 schema 裡沒有任何欄位可以放報告全文——details_ref／evidence_links 都只能是不含空白的參照字串，不能貼真正的內容文字進去；summary 超過 240 字元也會被拒絕建立。"
    example_en: "Scenario: render a long research report as a summary-first outline view. source_knowledge_object_id: 'REPORT-market-2026'; summary must be non-empty and at most 240 characters, e.g. '2026 Market Report: three key trends and recommendations'; outline cannot be an empty list, every node's id/summary follows the same rule and may nest recursively, e.g. [{id: 'N1', summary: 'Trend 1: subscription growth is slowing', evidence_links: ['EVID-report-p12'], children: [{id: 'N1-1', summary: 'North American growth rate dropped to 3%', details_ref: 'REPORT-market-2026:section-2.1'}]}]. Key point: there is no field anywhere in this schema that can hold the report's full text -- details_ref/evidence_links can only be whitespace-free reference strings, never pasted-in content; a summary over 240 characters is also refused at construction."
  representation.timeline_view:
    name_en: "Timeline View"
    abbr: ""
    name_zh: "時間軸檢視"
    blurb_en: "Renders an existing knowledge object's events in true chronological order (mechanically sorted, never caller-asserted). Use it to see how things relate over time."
    blurb_zh: "把既有知識物件的事件按真實時間順序渲染（機械式排序，不接受人工亂填順序）。想看事情在時間上的關聯時用。"
    why_en: "the event_id sequence of ordered_event_refs must exactly equal the source events sorted by their own real event_time -- a caller-proposed order that disagrees with actual chronology is refused, never silently accepted. A timeline that isn't genuinely sorted by time doesn't just fail to help find temporal relationships, it actively misleads about them, which is worse than not rendering a timeline at all."
    why_zh: "ordered_event_refs 的 event_id 排列順序，一定要跟來源事件依照它們真實的 event_time 排序後完全一致——一個呼叫端自己主張的順序，只要跟真實時序不符就會被拒絕，不會悄悄被接受。一個沒有真的按時間排序的時間軸，不只是沒幫上忙去找時間關係，而是會主動誤導使用者的時間認知，這比乾脆不渲染時間軸還糟。"
    url: "https://datavizcatalogue.com/methods/timeline.html"
    example_zh: "情境：把三個既有事件渲染成一條時間軸。\nknowledge_ref：「PROJECT-launch-2026」\nevents（真實來源資料，不會存進最終記錄）至少 1 筆，event_id 要唯一，event_time 是實數，例如 [{event_id: \"EV-1\", event_time: 3}, {event_id: \"EV-2\", event_time: 1}, {event_id: \"EV-3\", event_time: 2}]\nordered_event_refs 每個 event 都要出現恰好一次，marker_type 只能是 event／decision／change 三選一，而且排列順序一定要跟 events 依 event_time 排序後一致，也就是 EV-2（1）→ EV-3（2）→ EV-1（3），例如 [{event_id: \"EV-2\", marker_type: \"event\"}, {event_id: \"EV-3\", marker_type: \"decision\"}, {event_id: \"EV-1\", marker_type: \"change\"}]\n（重點）如果 ordered_event_refs 寫成 EV-1→EV-2→EV-3 這種跟真實時序不符的順序，會被拒絕建立——時間軸的順序永遠是從真實時間算出來的，不能自己主張。"
    example_en: "Scenario: render a timeline from three existing events. knowledge_ref: 'PROJECT-launch-2026'; events (the real ground truth, never persisted onto the final record) has >=1 entry with a unique event_id and a real-number event_time, e.g. [{event_id: 'EV-1', event_time: 3}, {event_id: 'EV-2', event_time: 1}, {event_id: 'EV-3', event_time: 2}]; ordered_event_refs must reference every event exactly once, marker_type is one of event/decision/change, and the sequence must match the events sorted by event_time -- i.e. EV-2 (1) -> EV-3 (2) -> EV-1 (3), e.g. [{event_id: 'EV-2', marker_type: 'event'}, {event_id: 'EV-3', marker_type: 'decision'}, {event_id: 'EV-1', marker_type: 'change'}]. Key point: an order like EV-1 -> EV-2 -> EV-3 that disagrees with the real chronology would be refused at construction -- a timeline's order is always computed from real time, never asserted by the caller."

  # ---- research ----
  research.qualitative_coding:
    name_en: "Qualitative Coding (Open / Axial / Selective)"
    abbr: ""
    name_zh: "質性編碼（開放／軸心／選擇性）"
    blurb_en: "Codes raw qualitative data through open, axial, and selective coding stages toward grounded themes. Use it to systematically analyze interview/transcript data instead of eyeballing it."
    blurb_zh: "透過開放編碼、軸心編碼、選擇性編碼三階段，從原始質性資料歸納出紮根理論主題。想系統性分析訪談／逐字稿資料，而不是憑印象看時用。"
    why_en: "Reading transcripts and 'just noticing' themes lets your first impression silently become the conclusion; the open -> axial -> selective pipeline forces every theme to be traceable back through a category to specific coded quotes, a code with no fitting category is honestly parked in a pending bucket instead of force-fitted, and a second coder's independent labels give you an actual agreement check instead of one person's read of the data."
    why_zh: "讀逐字稿「憑感覺抓主題」，會讓你的第一印象悄悄變成結論；開放→軸心→選擇性這條管線逼每個主題都要能一路追溯回具體的編碼引言，找不到合適類別的編碼會誠實放進待審分類，而不是硬塞一個；第二位編碼者的獨立標籤則給你一個真正的一致性檢查，而不是只有一個人的解讀。"
    url: "https://researchbasics.education.uconn.edu/open-in-vivo-axial-and-selective-coding/"
    example_zh: "情境：4 位受訪者的逐字稿已經跑完第一輪 AI 建議編碼，現在要人工複核鎖定。\ntranscript：至少要有 status: \"normalized\" 跟 provenance（一個 dict），例如 {status: \"normalized\", provenance: {...}}——這代表逐字稿已經過標準化前處理，不是原始錄音檔。\nlocked_code：人工複核後鎖定的第一筆編碼，例如 {code_id: \"CODE-C1-001\", coder_id: \"CODER-1\", source_id: \"SRC-1\", quote: \"重組後我開始晚餐後還一直查看訊息\", label: \"after_hours_monitoring\", provenance: {...}, human_action: \"ACCEPT_AND_LOCK\", originated_as: \"SUGGESTION-1\"}\nai_review：對第二筆 AI 建議編碼的人工複核決定，action 是 ACCEPT／ACCEPT_AND_LOCK／REJECT 三選一，例如 {action: \"ACCEPT\", source_id: \"SRC-2\", quote: \"我開始根據會不會有緊急訊息來安排晚上行程\", result_label: \"evening_planning_around_messages\", suggestion_id: \"SUGGESTION-2\"}（若要 ACCEPT_AND_LOCK，asserted_epistemic_type 必須是 SOURCE_FACT，不能是 AI_INFERENCE）\nat：時間戳字串，例如 \"2026-09-18T10:00:00Z\"\n（選填）pending_ai_labels／coder_two_labels／category_of_label／themes_v11 等：不填會用內建的示範資料；真正接上自己資料時才需要覆寫這些，把 AI 建議的分類／分群結果傳進來。"
    example_en: "Scenario: 4 interview transcripts have gone through a first pass of AI-suggested coding, now under human review and locking. transcript: needs at least status: 'normalized' and provenance (a dict), e.g. {status: 'normalized', provenance: {...}} -- meaning the transcript has already been through standardization, not a raw recording. locked_code: the first coded entry, already reviewed and locked by a human, e.g. {code_id: 'CODE-C1-001', coder_id: 'CODER-1', source_id: 'SRC-1', quote: 'After the restructure I started checking messages after dinner', label: 'after_hours_monitoring', provenance: {...}, human_action: 'ACCEPT_AND_LOCK', originated_as: 'SUGGESTION-1'}. ai_review: the human review decision on a second AI-suggested code, action is one of ACCEPT/ACCEPT_AND_LOCK/REJECT, e.g. {action: 'ACCEPT', source_id: 'SRC-2', quote: 'I began planning my evenings around whether an urgent message might arrive', result_label: 'evening_planning_around_messages', suggestion_id: 'SUGGESTION-2'} (to ACCEPT_AND_LOCK, asserted_epistemic_type must be SOURCE_FACT, never AI_INFERENCE). at: a timestamp string, e.g. '2026-09-18T10:00:00Z'. Optional: pending_ai_labels/coder_two_labels/category_of_label/themes_v11 etc. -- omitted, they default to the built-in demo fixture; override them with your own AI-suggested categorization/grouping output once you connect real data."
  research.reporting_guideline_checklist:
    name_en: "Reporting Guideline Checklist"
    abbr: ""
    name_zh: "報告規範查核清單"
    blurb_en: "Checks a manuscript's content item-by-item against an official academic reporting standard (currently SRQR, for qualitative research), with completion tracked as a computed view, never a self-reported claim. Use it while drafting a thesis or paper's methodology chapter to make sure every required reporting item is actually covered before submission."
    blurb_zh: "逐項對照官方學術報告規範（目前是質性研究的 SRQR 標準）檢查論文內容涵蓋度，完成度是即時計算出來的，不是自己宣稱的。寫論文或期刊稿的方法論章節時用，確保投稿前每個規定項目都真的有寫到。"
    why_en: "A researcher's own checklist ('I think I covered rigor and sampling') silently skips items and paraphrases the standard's wording from memory; this method requires EVERY official item_id and its exact verbatim requirement_text from the source standard (a caller cannot submit a partial or reworded list), and completion is recomputed fresh from each item's actual drafted_content every time -- a status label alone can never inflate the completion percentage."
    why_zh: "研究者自己列的檢查表（「我覺得嚴謹性跟抽樣都寫到了」）容易漏項、也容易憑印象改寫規範原文；這個方法強制要求官方規範裡「每一個」item_id 都要在、而且 requirement_text 要跟原文逐字一致（不能只交一部分或改寫過的清單），完成度每次都是從每個項目實際的 drafted_content 重新算出來的——光貼一個 status 標籤絕對沖不高完成度。"
    url: "http://www.equator-network.org/reporting-guidelines/srqr/"
    example_zh: "情境：EdD 論文方法論章節，對照 SRQR（質性研究報告規範，共 21 項官方項目）逐項檢查。\nguideline_id：目前僅支援 \"SRQR\"\nguideline_citation：必須跟目錄裡的官方引用文字逐字一致，可用 catalog_citation(\"SRQR\") 取得，不要自己改寫\nitems 必須「剛好」涵蓋全部 21 個官方 item_id，不能少也不能多，每個 item 的 requirement_text 也必須跟官方原文一致（可用 catalog_items(\"SRQR\") 取得完整清單，不要自己手打），以下只示範其中 2 項的形狀：\n[{item_id: \"S1\", requirement_text: \"Title — Concise description of the nature and topic of the study Identifying the study as qualitative or indicating the approach (e.g., ethnography, grounded theory) or data collection methods (e.g., interview, focus group) is recommended\", drafted_content: \"本研究為個案研究，標題已標明採質性訪談法\", status: \"DRAFTED\"},\n {item_id: \"S9\", requirement_text: \"Ethical issues pertaining to human subjects — Documentation of approval by an appropriate ethics review board and participant consent, or explanation for lack thereof; other confidentiality and data security issues\", drafted_content: \"TBD: 尚待補上 IRB 核准文號\", status: \"NOT_STARTED\"}, ...其餘 19 項依此形狀]\n實務上通常不會手打全部 21 項——先用 build_checklist_brief(\"SRQR\", 研究事實) 組出 AI 草稿提示詞，讓 AI 依官方原文逐項起草 drafted_content，再逐項人工編輯，比從零手打快很多。\ncompletion_percentage 由系統即時算出（drafted_content 若還是 \"TBD:\" 開頭就不算完成），不用也不能自己填。\n（選填）version：留空即可。"
    example_en: "Scenario: an EdD dissertation methodology chapter, checked item-by-item against SRQR (the qualitative-research reporting standard, 21 official items). guideline_id: only 'SRQR' is supported today; guideline_citation must match the catalog's official citation text verbatim -- fetch it via catalog_citation('SRQR') rather than retyping it; items must cover EXACTLY all 21 official item_ids, no fewer and no more, and each item's requirement_text must match the official wording verbatim too (fetch the full list via catalog_items('SRQR') rather than hand-typing it) -- only 2 items' shape is illustrated here: [{item_id: 'S1', requirement_text: 'Title — Concise description of the nature and topic of the study Identifying the study as qualitative or indicating the approach (e.g., ethnography, grounded theory) or data collection methods (e.g., interview, focus group) is recommended', drafted_content: 'This is a case study; the title already identifies the qualitative interview approach used', status: 'DRAFTED'}, {item_id: 'S9', requirement_text: 'Ethical issues pertaining to human subjects — Documentation of approval by an appropriate ethics review board and participant consent, or explanation for lack thereof; other confidentiality and data security issues', drafted_content: 'TBD: IRB approval number still needed', status: 'NOT_STARTED'}, ...the remaining 19 items follow the same shape]. In practice you would not hand-type all 21 -- use build_checklist_brief('SRQR', research_facts) to build an AI draft prompt that drafts each item's drafted_content from the official wording, then edit each by hand; far faster than starting from a blank list. completion_percentage is computed live by the system (a drafted_content still starting with 'TBD:' does not count as complete), never supplied. Optional: version can be left blank."

  # ---- root_cause (F05) ----
  root_cause.barrier_analysis:
    name_en: "Barrier Analysis"
    abbr: ""
    name_zh: "屏障分析"
    blurb_en: "Traces Hazard -> Target -> Barrier -> Failure to find which control failed to stop an incident, with no field for blaming an individual. Use it to focus on system controls, not people, after something went wrong."
    blurb_zh: "追蹤危害→目標→屏障→失效，找出哪個控制措施沒能阻止事件，且設計上完全沒有歸咎個人的欄位。出事後想聚焦系統控制、不是怪人時用。"
    why_en: "Blaming a person for an incident ends the investigation right where it should start -- a person is rarely the only thing standing between a hazard and harm, a barrier (a systemic control) is. This method structurally cannot record a named individual anywhere (no such field exists in either barriers or failure_modes), so the analysis is forced to stay on which control failed and why, not who to blame."
    why_zh: "把事故怪到一個人頭上，會讓調查停在原本該開始的地方——真正擋在危害跟傷害之間的，很少只是一個人，而是屏障（系統性的控制措施）。這個方法在結構上完全沒有地方可以記錄具名個人（barriers 跟 failure_modes 都沒有這種欄位），逼分析停留在「哪個控制失效、為什麼失效」，而不是「該怪誰」。"
    url: "https://blog.thinkreliability.com/what-is-barrier-analysis"
    example_zh: "情境：倉庫堆高機撞傷人員的事故分析。\nsystem_or_incident：「倉庫堆高機作業區事故」\nhazard_description：「行進中的堆高機」\ntarget_description：「行走中的作業人員」\nbarriers 至少 1 筆，每筆 barrier_id 必須是 \"B-\" 開頭，例如 [{barrier_id: \"B-1\", description: \"人車分道警示線\"}, {barrier_id: \"B-2\", description: \"堆高機倒車警報聲\"}]\nfailure_modes 至少 1 筆，failure_mode_id 必須是 \"FM-\" 開頭，barrier_ref 必須指向真實存在的 barrier_id，例如 [{failure_mode_id: \"FM-1\", barrier_ref: \"B-1\", description: \"警示線因貨物堆放而遮蔽\"}]\n重要：整個欄位設計裡沒有任何地方能填「負責人」或「肇事者」，這是刻意的，不是漏做。\n（選填）version：留空即可。"
    example_en: "Scenario: analyzing a warehouse forklift-collision incident. system_or_incident: 'Warehouse forklift operating area incident'; hazard_description: 'A moving forklift'; target_description: 'A pedestrian worker'; barriers has >=1 entry, barrier_id must start with 'B-', e.g. [{barrier_id: 'B-1', description: 'Pedestrian/vehicle lane marking'}, {barrier_id: 'B-2', description: 'Forklift reverse alarm'}]; failure_modes has >=1 entry, failure_mode_id must start with 'FM-', barrier_ref must resolve to a real barrier_id, e.g. [{failure_mode_id: 'FM-1', barrier_ref: 'B-1', description: 'Lane marking was obscured by stacked goods'}]. Important: there is no field anywhere in this shape for a responsible person or an at-fault individual -- that is deliberate, not an oversight. Optional: version can be left blank."
  root_cause.bow_tie:
    name_en: "Bow-Tie Analysis"
    abbr: ""
    name_zh: "蝴蝶結分析"
    blurb_en: "Threats on the left (prevention), consequences on the right (mitigation), meeting at a top event -- every control needs a real owner and test. Use it to manage both prevention AND recovery for the same risk at once."
    blurb_zh: "左邊威脅（預防）、右邊後果（緩解），中間是頂端事件——每個控制措施都要有真正的負責人跟測試方式。想同時管理同一個風險的預防跟復原時用。"
    why_en: "A control nobody owns and nobody tests is not a real control, it is a wish written down on a diagram -- requiring every single control to name both an owner and a test turns a bow-tie from a nice picture into something you can actually audit. Splitting threats (left, prevention) from consequences (right, mitigation) around one top event also keeps you from confusing 'stopping this from happening' with 'limiting the damage once it does', which need different controls entirely."
    why_zh: "一個沒人負責、沒人測試的控制措施不是真的控制措施，只是畫在圖上的一個願望——規定每一個控制措施都要指名負責人跟測試方式，能把蝴蝶結圖從一張好看的圖變成真的可以稽核的東西。把威脅（左邊、預防）跟後果（右邊、緩解）圍繞著同一個頂端事件分開，也能避免把「阻止這件事發生」跟「發生後限制傷害」混為一談——這兩者需要完全不同的控制措施。"
    url: "https://www.wolterskluwer.com/en/solutions/enablon/bowtie/expert-insights/barrier-based-risk-management-knowledge-base/incident-analysis-methods"
    example_zh: "情境：資料外洩風險的蝴蝶結分析。\nsystem_or_component：「客戶資料庫」\ntop_event_description：「客戶個資外洩」\nthreats 至少 1 筆，threat_id 必須是 \"T-\" 開頭且描述不能跟 top_event_description 相同，例如 [{threat_id: \"T-1\", description: \"員工帳號密碼外流\"}]\nconsequences 至少 1 筆，consequence_id 必須是 \"C-\" 開頭且描述不能跟 top_event_description 相同，例如 [{consequence_id: \"C-1\", description: \"客戶提告求償\"}]\ncontrols 至少 1 筆，side 只能是 prevention 或 mitigation，target_id 必須指向對應那一側真實存在的 threat/consequence，owner／test 都不能空白，例如 [{control_id: \"CTRL-1\", side: \"prevention\", target_id: \"T-1\", description: \"強制雙因子驗證\", owner: \"資安團隊\", test: \"每季稽核登入紀錄\"}, {control_id: \"CTRL-2\", side: \"mitigation\", target_id: \"C-1\", description: \"法務通報與和解流程\", owner: \"法務部\", test: \"每年演練一次\"}]\n（選填）version：留空即可。"
    example_en: "Scenario: bow-tie analysis of a customer-data-breach risk. system_or_component: 'Customer database'; top_event_description: 'Customer personal data breach'; threats has >=1 entry, threat_id must start with 'T-' and its description must differ from top_event_description, e.g. [{threat_id: 'T-1', description: 'Employee password leaked'}]; consequences has >=1 entry, consequence_id must start with 'C-' and differ from top_event_description, e.g. [{consequence_id: 'C-1', description: 'Customer lawsuit for damages'}]; controls has >=1 entry, side is prevention or mitigation only, target_id must resolve to a real threat/consequence on the matching side, owner and test cannot be blank, e.g. [{control_id: 'CTRL-1', side: 'prevention', target_id: 'T-1', description: 'Mandatory two-factor authentication', owner: 'Security team', test: 'Quarterly login-log audit'}, {control_id: 'CTRL-2', side: 'mitigation', target_id: 'C-1', description: 'Legal notification and settlement process', owner: 'Legal department', test: 'Annual drill'}]. Optional: version can be left blank."
  root_cause.change_analysis:
    name_en: "Change Analysis"
    abbr: ""
    name_zh: "變更分析"
    blurb_en: "Compares before/after a failure and correlates it against a change list -- correlation is not causation, so this narrows scope, it doesn't conclude. Use it right after an incident to quickly shortlist 'what changed recently'."
    blurb_zh: "比對故障前後狀態，跟變更清單做關聯——關聯不等於因果，這是用來縮小範圍，不是下結論。事故發生後，想快速列出「最近改了什麼」時用。"
    why_en: "Right after an incident it is tempting to jump straight from 'we changed X recently' to 'X caused this' -- this method structurally cannot make that leap: there is no field anywhere (caused_by, root_cause, confirmed_cause and similar are all rejected outright) for asserting causation, only correlation_strength and temporal_proximity descriptors. That keeps the method doing what it is actually good at -- narrowing a huge space of possible causes down to a short, ranked list worth investigating -- instead of quietly overclaiming a verdict it cannot support."
    why_zh: "事故剛發生時，很容易直接從「我們最近改了 X」跳到「X 就是原因」——這個方法在結構上不可能做這種跳躍：完全沒有欄位（caused_by、root_cause、confirmed_cause 這類名稱全部會被拒絕）可以拿來斷言因果，只有 correlation_strength 跟 temporal_proximity 這兩種描述性欄位。這讓這個方法專心做它真正擅長的事——把一大堆可能原因縮小成一份值得深入調查、排好序的短清單——而不是悄悄宣稱一個它撐不起來的結論。"
    url: "https://www.bill-wilson.net/root-cause-analysis/rca-tools/change-analysis"
    example_zh: "情境：API 回應時間在某天突然變慢，列出可疑變更。\nsystem_under_analysis：「訂單查詢 API」\nfault_description：「回應時間從平均 200ms 惡化到 3000ms」\nbaseline：{before_state: \"正常運作，平均 200ms\", after_state: \"回應緩慢，平均 3000ms\"}\nchanges 至少 1 筆，每筆要 id／description／before_state／after_state／temporal_proximity／correlation_strength／provenance，before_state 跟 after_state 不能相同（否則不算真的變更），temporal_proximity 只能是 CONCURRENT／IMMEDIATELY_BEFORE／SHORTLY_BEFORE／DISTANT_BEFORE／AFTER_FAULT，correlation_strength 只能是 NONE／WEAK／MODERATE／STRONG，例如 [{id: \"CH1\", description: \"資料庫索引調整\", before_state: \"舊索引\", after_state: \"新複合索引\", temporal_proximity: \"IMMEDIATELY_BEFORE\", correlation_strength: \"STRONG\", provenance: {...}}]\n重要：欄位裡完全沒有 caused_by／root_cause 這類名稱，這是刻意設計，逼你只描述關聯強度跟時序，不宣稱因果。\n（選填）version：留空即可。"
    example_en: "Scenario: an API response time suddenly degraded one day, listing suspect changes. system_under_analysis: 'Order lookup API'; fault_description: 'Response time worsened from ~200ms average to ~3000ms'; baseline: {before_state: 'Operating normally, ~200ms average', after_state: 'Slow responses, ~3000ms average'}; changes has >=1 entry, each needs id/description/before_state/after_state/temporal_proximity/correlation_strength/provenance, before_state and after_state must differ (otherwise it is not a real change), temporal_proximity is one of CONCURRENT/IMMEDIATELY_BEFORE/SHORTLY_BEFORE/DISTANT_BEFORE/AFTER_FAULT, correlation_strength is one of NONE/WEAK/MODERATE/STRONG, e.g. [{id: 'CH1', description: 'Database index change', before_state: 'Old index', after_state: 'New composite index', temporal_proximity: 'IMMEDIATELY_BEFORE', correlation_strength: 'STRONG', provenance: {...}}]. Important: there is no field anywhere named caused_by/root_cause or similar -- deliberate, forcing you to describe correlation strength and timing only, never asserting causation. Optional: version can be left blank."
  root_cause.event_tree:
    name_en: "Event Tree"
    abbr: ""
    name_zh: "事件樹分析"
    blurb_en: "Branches forward from a single initiating event through each barrier's success/fail outcome to a full set of end-state consequences. Use it to see every possible outcome of one triggering event, as the forward-looking complement to Fault Tree's backward analysis."
    blurb_zh: "從單一起始事件出發，依序分岔每個屏障成功／失敗的結果，推演出完整的後果分支。想看一個觸發事件的所有可能後果時用，是 Fault Tree 反向分析的正向對照版。"
    why_en: "An outcome that skips a barrier, or reaches barrier 3 without ever passing through barrier 1 and 2 first, describes a walk through your protection layers that could never actually happen -- the system checks every outcome path really is an ordered, unbroken prefix of the declared barrier sequence, so you cannot accidentally evaluate a phantom scenario as if it were a real one."
    why_zh: "一個跳過某個屏障、或沒先經過屏障 1、2 就直接跳到屏障 3 的結果，描述的是一條在你的防護層裡根本不可能發生的路徑——系統會檢查每個結果路徑真的是宣告的屏障序列裡一段有序、不間斷的前綴，這樣你就不會不小心把一個不可能存在的幻影情境當成真實情境來評估。"
    url: "https://www.ntnu.edu/documents/624876/1277590549/chapt03-eta.pdf"
    example_zh: "情境：伺服器機房失火後，評估各層防護是否成功阻止損害擴大。\nsystem_under_analysis：「伺服器機房」\ninitiating_event：{description: \"機房內電氣設備起火\"}\nbarriers 至少 1 筆，順序即代表發生順序，barrier_id 必須是 \"BAR-\" 開頭，例如 [{barrier_id: \"BAR-1\", description: \"煙霧偵測器觸發\"}, {barrier_id: \"BAR-2\", description: \"自動滅火系統啟動\"}]\noutcomes 至少 1 筆，outcome_id 必須是 \"OUT-\" 開頭，path 必須是 barriers 序列的「有序前綴」（不能跳過或調換順序），每個 path 步驟要 barrier_id／result（只能 success 或 failure），例如 [{outcome_id: \"OUT-1\", description: \"偵測與滅火都成功，損害輕微\", path: [{barrier_id: \"BAR-1\", result: \"success\", probability: 0.95}, {barrier_id: \"BAR-2\", result: \"success\", probability: 0.9}]}, {outcome_id: \"OUT-2\", description: \"偵測到但滅火失敗，損害擴大\", path: [{barrier_id: \"BAR-1\", result: \"success\", probability: 0.95}, {barrier_id: \"BAR-2\", result: \"failure\", probability: 0.1}]}]\npath 可以提早結束（不用走完所有屏障），但走過的每一步順序必須跟宣告的屏障序列一致。\n（選填）version：留空即可。"
    example_en: "Scenario: after a server room fire, evaluating whether each protective layer succeeded in limiting the damage. system_under_analysis: 'Server room'; initiating_event: {description: 'Electrical equipment fire in the server room'}; barriers has >=1 entry, list order IS the sequence order, barrier_id must start with 'BAR-', e.g. [{barrier_id: 'BAR-1', description: 'Smoke detector triggers'}, {barrier_id: 'BAR-2', description: 'Automatic suppression system activates'}]; outcomes has >=1 entry, outcome_id must start with 'OUT-', path must be an ORDERED PREFIX of the barriers sequence (no skipping or reordering), each path step needs barrier_id/result (success or failure only), e.g. [{outcome_id: 'OUT-1', description: 'Both detection and suppression succeed, minor damage', path: [{barrier_id: 'BAR-1', result: 'success', probability: 0.95}, {barrier_id: 'BAR-2', result: 'success', probability: 0.9}]}, {outcome_id: 'OUT-2', description: 'Detected but suppression fails, damage spreads', path: [{barrier_id: 'BAR-1', result: 'success', probability: 0.95}, {barrier_id: 'BAR-2', result: 'failure', probability: 0.1}]}]. A path may end early (not every outcome needs to walk every barrier), but whatever steps it does walk must match the declared barrier order exactly. Optional: version can be left blank."
  root_cause.fault_tree:
    name_en: "Fault Tree"
    abbr: ""
    name_zh: "故障樹分析"
    blurb_en: "Works backward from a top event (something that already failed) through AND/OR logic gates down to the basic events that could cause it. Use it to find every combination of underlying failures that could produce a known bad outcome."
    blurb_zh: "從頂端事件（已經發生的故障）出發，透過 AND/OR 邏輯閘往回推到基本事件。想找出會導致某個已知壞結果的所有根本失效組合時用。"
    why_en: "A gate labeled AND that only actually requires 1 of 3 children, or an OR gate that quietly requires all of them, would silently misrepresent the real failure logic -- the system checks that every gate's required_count genuinely matches its own AND/OR label, and that no gate transitively lists itself as its own child (a cycle would mean a gate has to have already fired to determine whether it fires), so the tree you get out is one that could actually be evaluated against a real scenario."
    why_zh: "一個標成 AND 卻實際上只需要 3 個子節點裡的 1 個、或標成 OR 卻悄悄要求全部子節點都要成立的邏輯閘，會默默扭曲真實的失效邏輯——系統會檢查每個閘的 required_count 真的跟它自己的 AND/OR 標籤一致，也會檢查沒有任何閘遞迴地把自己列為自己的子節點（有循環就代表一個閘要先觸發才能判斷它有沒有觸發），這樣產出的樹才是真的能拿去對真實情境做評估的樹。"
    url: "https://s3vi.ndc.nasa.gov/ssri-kb/static/resources/Fault%20Tree%20Handbook_NASA.pdf"
    example_zh: "情境：分析伺服器無法開機的所有可能根因組合。\nsystem_under_analysis：「伺服器主機」\ntop_event：{description: \"伺服器無法開機\", gate_ref: \"G1\"}（gate_ref 必須指向真實存在的 gate id，不能直接指向 basic_event）\nbasic_events 至少 1 筆，例如 [{id: \"BE1\", description: \"電源供應器故障\", probability: 0.02}, {id: \"BE2\", description: \"主機板故障\", probability: 0.01}, {id: \"BE3\", description: \"記憶體故障\", probability: 0.03}]\ngates 至少 1 筆，gate_type 只能是 AND 或 OR，required_count 必須跟 gate_type 一致（AND 要等於子節點數量、OR 要等於 1），children 裡的 id 必須都是真實存在的 basic_event 或 gate，例如 [{id: \"G1\", description: \"硬體層失效\", gate_type: \"OR\", required_count: 1, children: [\"BE1\", \"BE2\", \"BE3\"]}]（電源、主機板、記憶體任一個壞就會導致無法開機，所以是 OR）\n重要：basic_events 跟 gates 的 id 必須在同一個命名空間裡彼此不重複；整個參照關係不能有循環。\n（選填）version：留空即可。"
    example_en: "Scenario: analyzing every possible root-cause combination behind a server failing to boot. system_under_analysis: 'Server host'; top_event: {description: 'Server fails to boot', gate_ref: 'G1'} (gate_ref must resolve to a real gate id, never directly to a basic_event); basic_events has >=1 entry, e.g. [{id: 'BE1', description: 'Power supply failure', probability: 0.02}, {id: 'BE2', description: 'Motherboard failure', probability: 0.01}, {id: 'BE3', description: 'Memory failure', probability: 0.03}]; gates has >=1 entry, gate_type is AND or OR only, required_count must match gate_type (AND equals the number of children, OR equals 1), every id inside children must be a real basic_event or gate, e.g. [{id: 'G1', description: 'Hardware-layer failure', gate_type: 'OR', required_count: 1, children: ['BE1', 'BE2', 'BE3']}] (any one of power/motherboard/memory failing causes the boot failure, hence OR). Important: basic_events and gates ids share one namespace and must all be unique; the whole reference graph must not contain a cycle. Optional: version can be left blank."
  root_cause.fishbone:
    name_en: "Fishbone / Ishikawa Diagram"
    abbr: ""
    name_zh: "魚骨圖（石川圖）"
    blurb_en: "Organizes candidate causes of one problem into standard categories (people, process, equipment, materials, environment) branching off a central spine. Use it to brainstorm and categorize causes broadly before narrowing down with Five Whys or Pareto."
    blurb_zh: "把一個問題的候選原因，依標準類別（人、流程、設備、物料、環境）分支排列在一條主幹上。想先廣泛腦力激盪、分類原因，再用 Five Whys 或 Pareto 收斂時用。"
    why_en: "Fishbone can only ever produce a set of HYPOTHESES about the cause, never a confirmed root cause -- the system enforces this structurally: there is no code path that lets a fishbone hypothesis jump straight to a confirmed RootCauseFact, that promotion is refused unless the hypothesis set has actually been run through a real validation method (Five Whys, Pareto, or a causal DAG) first. This stops a good-looking brainstorm from being mistaken for proof."
    why_zh: "魚骨圖永遠只能產出一組「假設」，不能直接產出已確認的根因——系統在結構上強制這件事：沒有任何程式路徑能讓魚骨圖的假設直接升級成已確認的 RootCauseFact，除非這組假設真的先跑過一個真正的驗證方法（Five Whys、Pareto，或因果圖），否則升級會被拒絕。這能避免一場好看的腦力激盪被誤認為是證明。"
    url: "https://asq.org/quality-resources/fishbone"
    example_zh: "情境：分析「網站結帳流程放棄率過高」的候選原因。\n第一步先建立問題陳述（build_problem_statement）：problem_id 任意字串、content 是自訂的問題描述 dict（例如 {current_state: \"...\", expected_state: \"...\"}）、status 必須是 \"validated\" 才能進到下一步。\n第二步 generate_cause_hypothesis_set：\nchs_id：任意字串\nproblem_statement：上一步產生、status=\"validated\" 的物件\nhypotheses 至少 1 筆，每筆要 id／statement／category／provenance，category 通常對應魚骨圖的標準分類，例如 [{id: \"H1\", statement: \"結帳頁面載入過慢\", category: \"技術／設備\", provenance: {...}}, {id: \"H2\", statement: \"必填欄位過多讓使用者放棄\", category: \"流程\", provenance: {...}}]\n（選填）suggested_categories：例如 [\"人\", \"流程\", \"設備\", \"環境\"]\n產出的 promotion 欄位（是否可升級成根因）由系統管理，不用自己填；一開始一定是「尚未可升級」，要等真的跑過驗證方法才會改變。"
    example_en: "Scenario: analyzing candidate causes behind a high checkout-abandonment rate. Step 1, build a problem statement (build_problem_statement): problem_id is any string, content is your own problem-description dict (e.g. {current_state: '...', expected_state: '...'}), status must be 'validated' to proceed. Step 2, generate_cause_hypothesis_set: chs_id: any string; problem_statement: the validated object from step 1; hypotheses has >=1 entry, each needs id/statement/category/provenance, category typically maps to the standard fishbone categories, e.g. [{id: 'H1', statement: 'Checkout page loads too slowly', category: 'Technology/Equipment', provenance: {...}}, {id: 'H2', statement: 'Too many required fields cause users to abandon', category: 'Process', provenance: {...}}]. Optional: suggested_categories, e.g. ['People', 'Process', 'Equipment', 'Environment']. The output promotion field (whether this can be upgraded to a root cause) is managed by the system, never supplied -- it always starts as 'not yet promotable' and only changes once a real validation method has actually run."
  root_cause.five_whys:
    name_en: "Five Whys"
    abbr: ""
    name_zh: "五個為什麼"
    blurb_en: "Iteratively asks 'why' on each successive answer, drilling from a surface symptom down to a root cause in a single causal chain. Use it for a fast, lightweight drill-down when the problem is simple enough for one linear chain of causes."
    blurb_zh: "針對每個答案反覆追問「為什麼」，從表面症狀一路往下鑽到根本原因，形成單一因果鏈。想用輕量、快速的方式往下鑽、且問題單純到一條線就能講清楚時用。"
    why_en: "Five Whys is famous for two specific failure modes: confidently declaring a cause with no supporting data, and stopping the chain the moment it reaches a human error instead of asking why the system let that error matter. The first is checked structurally (computed from whether ANY step in the chain actually cites evidence, not a self-report), and the record explicitly discloses whether the other two known failure modes were avoided -- so a shallow, one-line why-chain cannot quietly pass as a rigorous validation."
    why_zh: "Five Whys 有兩個出了名的失效模式：沒有數據卻自信宣告原因、以及一路問到「人為疏失」就停下來，沒有再問「系統為什麼會讓這個疏失造成影響」。第一個由系統結構性檢查（從整條鏈裡有沒有任何一步真的引用證據算出來，不是自己說了算），另外兩個失效模式則要求記錄裡明確揭露是否有發生——這樣一條只問一兩層、很淺的「為什麼」鏈，就不會被悄悄當成一次嚴謹的驗證蒙混過去。"
    url: "https://en.wikipedia.org/wiki/Five_whys"
    example_zh: "情境：延續上面 root_cause.fishbone 的例子，驗證「結帳頁面載入過慢」這個假設（hypothesis H1）。\nvalidation_id：任意字串\ncause_hypothesis_set：來自 root_cause.fishbone 產出的物件\ntarget_hypothesis_id：\"H1\"——必須是 cause_hypothesis_set.hypotheses 裡真實存在的 id\nwhy_chain 至少 1 筆，每筆要 step／question／answer／provenance，例如 [{step: 1, question: \"為什麼結帳頁面載入過慢?\", answer: \"因為載入了未優化的高解析度圖片\", provenance: {...}, supporting_evidence_refs: [\"perf-report-2026-09\"]}, {step: 2, question: \"為什麼圖片沒有優化?\", answer: \"部署流程沒有自動壓縮圖片的步驟\", provenance: {...}}]\nstop_conditions_met 至少 1 筆，只能是 CONTROLLABLE_BY_ORGANIZATION／CLEAR_EVIDENCE_TO_VERIFY／FOUND_SYSTEM_PROCESS_MECHANISM／FURTHER_QUESTIONING_BECOMES_ABSTRACT 四選一，例如 [\"FOUND_SYSTEM_PROCESS_MECHANISM\"]\n（選填）single_path_oversimplifies_multi_causal_problem、human_carelessness_treated_as_final_cause：預設都是 false，只有真的發生這兩種已知失效模式時才填 true（填 true 會被系統拒絕建立紀錄，因為這代表驗證本身不成立）。\ndeclared_without_data（是否整條鏈都沒有引用任何證據）由系統從 why_chain 自動算出，不用自己填。"
    example_en: "Scenario: continuing the root_cause.fishbone example above, validating hypothesis H1 ('checkout page loads too slowly'). validation_id: any string; cause_hypothesis_set: the object produced by root_cause.fishbone; target_hypothesis_id: 'H1' -- must be a real id in cause_hypothesis_set.hypotheses; why_chain has >=1 entry, each needs step/question/answer/provenance, e.g. [{step: 1, question: 'Why does the checkout page load slowly?', answer: 'It loads unoptimized high-resolution images', provenance: {...}, supporting_evidence_refs: ['perf-report-2026-09']}, {step: 2, question: 'Why are the images not optimized?', answer: 'The deployment pipeline has no automatic image-compression step', provenance: {...}}]; stop_conditions_met has >=1 entry, one of CONTROLLABLE_BY_ORGANIZATION/CLEAR_EVIDENCE_TO_VERIFY/FOUND_SYSTEM_PROCESS_MECHANISM/FURTHER_QUESTIONING_BECOMES_ABSTRACT, e.g. ['FOUND_SYSTEM_PROCESS_MECHANISM']. Optional: single_path_oversimplifies_multi_causal_problem, human_carelessness_treated_as_final_cause -- both default false, set true only if that known failure mode genuinely occurred (setting either true makes the system refuse to build the record, since that means the validation itself does not hold). declared_without_data (whether the whole chain cites zero evidence) is computed by the system from why_chain, never supplied."
  root_cause.kepner_tregoe:
    name_en: "Kepner-Tregoe Problem Specification"
    abbr: ""
    name_zh: "凱普納-崔果問題分析"
    blurb_en: "Frames a problem with a 2x4 IS / IS-NOT grid across What/Where/When/Extent, then looks for distinctions and changes that explain the pattern. Use it when Five Whys feels too subjective and you need a structured, evidence-based problem specification first."
    blurb_zh: "用 What/Where/When/Extent 四個維度的 2x4「是／不是」表格框定問題，再找出能解釋這個型態的特徵與變化。覺得 Five Whys 太主觀、想先做結構化、證據導向的問題界定時用。"
    why_en: "Guessing at a cause without first precisely bounding the problem invites confirmation bias -- filling in what the problem IS without ever writing down what it is NOT lets you overlook the pattern hiding in the contrast. Requiring every dimension IS/IS-NOT pair to be genuinely distinct, and every distinction to come from a dimension that actually has both sides filled in, forces the comparison to be real before you are allowed to draw any conclusion from it."
    why_zh: "還沒精確界定問題邊界就開始猜原因，很容易掉入確認偏誤——只填「問題是什麼」卻從不寫「問題不是什麼」，會讓你錯過藏在對比裡的型態。規定每個維度的「是／不是」一定要真的不同、而且每個特徵都得從一個「是」跟「不是」都真的填了的維度推導出來，逼你先做出真實的對比，才能從裡面得出任何結論。"
    url: "https://www.toolshero.com/problem-solving/kepner-tregoe-method/"
    example_zh: "情境：延續 root_cause.fishbone 的問題陳述，用結構化方式界定「結帳頁面載入過慢」發生的確切範圍。\nspec_id：任意 \"KTPS-\" 開頭字串，例如 \"KTPS-T1\"\nproblem_statement：必須是 id 為 \"PROB-\" 開頭、status=\"validated\" 的問題陳述物件\ndimensions 必須「剛好」4 筆，順序固定是 WHAT／WHERE／WHEN／EXTENT，每筆要 dimension／is／provenance，is_not 選填但一旦填就不能跟 is 一樣，例如 [{dimension: \"WHAT\", is: \"結帳頁面載入超過 5 秒\", is_not: \"其他頁面載入正常\", provenance: {...}}, {dimension: \"WHERE\", is: \"僅行動裝置版本\", is_not: \"桌機版本正常\", provenance: {...}}, {dimension: \"WHEN\", is: \"上週改版後開始\", provenance: {...}}, {dimension: \"EXTENT\", is: \"約 30% 的行動裝置訂單\", provenance: {...}}]\n（選填）distinctions：只能從「是」跟「不是」都有填的維度推導，distinction_id 必須是 \"DIST-\" 開頭，例如 [{distinction_id: \"DIST-1\", dimension: \"WHERE\", description: \"只有行動版用了新的圖片元件\", provenance: {...}}]\n（選填）changes：distinction_id 必須指向真實存在的 distinction，change_id 必須是 \"CHG-\" 開頭，例如 [{change_id: \"CHG-1\", distinction_id: \"DIST-1\", description: \"上週改版換了行動版圖片元件\", provenance: {...}}]\n（選填）version：留空即可。"
    example_en: "Scenario: continuing root_cause.fishbone's problem statement, structurally bounding exactly where the checkout-page slowness occurs. spec_id: any string starting with 'KTPS-', e.g. 'KTPS-T1'; problem_statement: must be a problem-statement object with an id starting with 'PROB-' and status='validated'; dimensions must be EXACTLY 4 entries in the fixed order WHAT/WHERE/WHEN/EXTENT, each needs dimension/is/provenance, is_not is optional but must differ from is when present, e.g. [{dimension: 'WHAT', is: 'Checkout page takes over 5 seconds to load', is_not: 'Other pages load normally', provenance: {...}}, {dimension: 'WHERE', is: 'Mobile version only', is_not: 'Desktop version is fine', provenance: {...}}, {dimension: 'WHEN', is: 'Started after last week release', provenance: {...}}, {dimension: 'EXTENT', is: 'About 30% of mobile orders', provenance: {...}}]. Optional: distinctions -- can only be derived from a dimension that has BOTH is and is_not filled in, distinction_id must start with 'DIST-', e.g. [{distinction_id: 'DIST-1', dimension: 'WHERE', description: 'Only the mobile version uses the new image component', provenance: {...}}]. Optional: changes -- distinction_id must resolve to a real distinction, change_id must start with 'CHG-', e.g. [{change_id: 'CHG-1', distinction_id: 'DIST-1', description: 'Last week release swapped in a new mobile image component', provenance: {...}}]. Optional: version can be left blank."
  root_cause.pareto:
    name_en: "Pareto Analysis"
    abbr: ""
    name_zh: "柏拉圖分析（80/20 法則）"
    blurb_en: "Ranks causes by frequency or impact and highlights the vital few (typically ~20%) responsible for most of the effect (~80%). Use it to prioritize which causes to fix first when you have many candidates but limited time."
    blurb_zh: "依發生頻率或影響程度排序原因，找出佔多數效果（約 80%）的少數關鍵原因（約 20%）。有很多候選原因但時間有限，需要決定先修哪個時用。"
    why_en: "80/20 is a rule of thumb, not a law of nature -- the real ratio depends entirely on your own data, so this method never assumes a threshold for you. The ranking itself is real computed arithmetic (not an AI guess at percentages), and a 'vital few' list only appears once you explicitly supply your own threshold percentage; leaving it out is a legitimate answer that produces a full ranking with no cutoff, rather than a silently invented 80/20 split."
    why_zh: "80/20 是經驗法則，不是自然法則——真正的比例完全取決於你自己的資料，所以這個方法不會替你假設一個門檻。排序本身是真實計算出來的（不是 AI 用猜的百分比），「關鍵少數」清單只有在你明確給出自己的門檻百分比時才會出現；不給門檻是合法的答案，會得到完整排序但沒有切點，而不是被悄悄套用一個假設的 80/20 分界。"
    url: "https://asq.org/quality-resources/pareto"
    example_zh: "情境：延續 root_cause.fishbone 的假設集合，統計哪些假設對應的客訴次數最多。\nanalysis_id：任意字串\ncause_hypothesis_set：來自 root_cause.fishbone 產出的物件\nmetric_name：「客訴次數」\ndataset 至少 1 筆，每筆要 hypothesis_id（必須是 cause_hypothesis_set.hypotheses 裡真實存在的 id）／metric_value（不能是負數），同一個 hypothesis_id 出現多次會自動加總，例如 [{hypothesis_id: \"H1\", metric_value: 45}, {hypothesis_id: \"H2\", metric_value: 12}, {hypothesis_id: \"H1\", metric_value: 8}]\nranking（依總量排序、含累計佔比）由系統真實計算，不用也不能自己填。\n（選填）vital_few_threshold_percent：例如 80（代表想找出佔累計 80% 的關鍵少數）——不給的話 threshold_status 會是「尚待人工設定」、vital_few_hypothesis_ids 會是空清單，這是合法狀態，不是缺陷。\n（選填）version：留空即可。"
    example_en: "Scenario: continuing root_cause.fishbone's hypothesis set, counting which hypotheses correspond to the most customer complaints. analysis_id: any string; cause_hypothesis_set: the object produced by root_cause.fishbone; metric_name: 'Complaint count'; dataset has >=1 entry, each needs hypothesis_id (must be a real id in cause_hypothesis_set.hypotheses) and metric_value (must not be negative), the same hypothesis_id repeated is summed automatically, e.g. [{hypothesis_id: 'H1', metric_value: 45}, {hypothesis_id: 'H2', metric_value: 12}, {hypothesis_id: 'H1', metric_value: 8}]. ranking (sorted by total, with cumulative share) is computed by the system, never supplied. Optional: vital_few_threshold_percent, e.g. 80 (find the vital few making up 80% cumulative share) -- if omitted, threshold_status becomes 'pending operator decision' and vital_few_hypothesis_ids is an empty list, which is a legitimate state, not a defect. Optional: version can be left blank."

  # ---- security (F20 Security / Privacy Pack) ----
  security.stride:
    name_en: "STRIDE Threat Model"
    abbr: "STRIDE"
    name_zh: "STRIDE 威脅模型"
    blurb_en: "Walks a data-flow diagram element by element and checks each one against six threat categories: Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege. Use it as the standard starting point for structured threat modeling of a system design."
    blurb_zh: "逐一檢視資料流圖的每個元件，對照六類威脅：偽冒、竄改、否認、資訊洩露、阻斷服務、權限提升。想對系統設計做結構化威脅建模時，這是標準起手式。"
    why_en: "Threat modeling done from memory tends to only surface the 2-3 threat types you happen to think of first; walking every single data-flow element against the SAME fixed six categories forces systematic coverage instead of ad-hoc brainstorming. The system also computes which elements ended up with zero recorded threats, so a component nobody actually analyzed cannot silently look 'reviewed' just because the record exists."
    why_zh: "憑印象做威脅建模，通常只會想到 2-3 種你剛好想到的威脅類型；規定每個資料流元件都要對照同一組固定六大類逐一檢查，能強迫做到系統性涵蓋，而不是隨興腦力激盪。系統還會算出哪些元件最後完全沒有記錄任何威脅，這樣一個根本沒人真正分析過的元件，不會因為紀錄存在就被誤認為「已審查」。"
    url: "https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-threats"
    example_zh: "情境：對一個使用者登入流程做 STRIDE 威脅建模。\nsystem_or_component：「使用者登入流程」\nassets 至少 1 筆非空字串，例如 [\"使用者密碼雜湊\", \"session token\"]\ntrust_boundaries、entry_points 可以是空陣列，但欄位要給，例如 trust_boundaries: [{name: \"公網／內網邊界\", description: \"使用者瀏覽器到 API Gateway\"}]，entry_points: [\"POST /login\"]\ndata_flow_elements 至少 1 筆，element_type 只能是 external_entity／process／data_store／data_flow 四選一，name 在整筆記錄裡要唯一，例如 [{name: \"登入表單\", element_type: \"external_entity\"}, {name: \"驗證服務\", element_type: \"process\"}, {name: \"使用者資料庫\", element_type: \"data_store\"}]\nthreats 可以是空陣列，但每筆若有給要指向真實存在的 data_flow_elements 名稱，category 只能是六大類其中之一（spoofing／tampering／repudiation／information_disclosure／denial_of_service／elevation_of_privilege），例如 [{element_name: \"驗證服務\", category: \"spoofing\", description: \"攻擊者偽造已登入使用者的 session\", control: \"session token 綁定 IP 與 User-Agent\", residual_risk: \"低\", test_evidence: \"2026 Q3 滲透測試報告\"}]\nelements_with_no_recorded_threats（哪些元件完全沒被記錄過威脅）由系統自動算出，不用也不能自己填。\n（選填）version：留空即可。"
    example_en: "Scenario: STRIDE threat modeling of a user login flow. system_or_component: 'User login flow'; assets has >=1 non-empty string, e.g. ['User password hash', 'Session token']; trust_boundaries and entry_points may be empty lists but the fields are required, e.g. trust_boundaries: [{name: 'Public/internal boundary', description: 'User browser to API gateway'}], entry_points: ['POST /login']; data_flow_elements has >=1 entry, element_type is one of external_entity/process/data_store/data_flow, name must be unique within the record, e.g. [{name: 'Login form', element_type: 'external_entity'}, {name: 'Auth service', element_type: 'process'}, {name: 'User database', element_type: 'data_store'}]; threats may be an empty list, but any entry given must reference a real data_flow_elements name, category is one of the six (spoofing/tampering/repudiation/information_disclosure/denial_of_service/elevation_of_privilege), e.g. [{element_name: 'Auth service', category: 'spoofing', description: 'Attacker forges an already-logged-in session', control: 'Session token bound to IP and User-Agent', residual_risk: 'Low', test_evidence: '2026 Q3 pentest report'}]. elements_with_no_recorded_threats (which elements have zero recorded threats) is computed by the system, never supplied. Optional: version can be left blank."
  security.attack_tree:
    name_en: "Attack Tree"
    abbr: ""
    name_zh: "攻擊樹"
    blurb_en: "Decomposes a root attack goal into AND/OR subgoals down to atomic techniques, each annotated with attacker cost/skill/detectability. Use it to map out every path an attacker could take toward one specific goal, and compare which path is cheapest for them."
    blurb_zh: "把一個攻擊目標拆解成 AND/OR 子目標，一路拆到最基本的攻擊技巧，每個節點標註攻擊者的成本／技能／可偵測性。想畫出攻擊者達成某個目標的所有路徑、比較哪條路徑對他們最便宜時用。"
    why_en: "An AND node needs every child step to succeed (so its cost is the SUM of all of them, and its difficulty is set by its single hardest step), while an OR node needs only the cheapest alternative anywhere beneath it -- mixing these up would silently misjudge how hard an attack chain really is. The system computes cost/skill/detectability bottom-up from the real AND/OR structure every time, rather than trusting a number someone typed at the root, so the aggregate always reflects the actual tree beneath it."
    why_zh: "AND 節點需要每個子步驟都成功（所以成本是全部加總，難度由其中最困難的那一步決定），OR 節點則只需要底下任何一個最便宜的替代方案就夠了——把這兩者搞混，會悄悄誤判一條攻擊鏈到底有多難。系統每次都會從真實的 AND/OR 結構由下往上重新計算成本／技能／可偵測性，而不是相信有人在頂端隨手打的一個數字，這樣加總結果才會真的反映底下那棵樹。"
    url: "https://www.schneier.com/academic/archives/1999/12/attack_trees.html"
    example_zh: "情境：分析攻擊者取得管理員帳號的攻擊樹。\nsystem_or_component：「後台管理系統」\nassets 至少 1 筆，例如 [\"管理員帳號憑證\"]\ntrust_boundaries、entry_points 可以是空陣列但欄位要給。\nroot 是一個遞迴結構，內部節點要 name／node_type（AND 或 OR）／children，葉節點要 name／cost／skill（low/medium/high）／detectability（low/medium/high）／control／residual_risk／test_evidence，兩種節點類型不能混用同一個 dict，例如：{name: \"取得管理員權限\", node_type: \"OR\", children: [{name: \"竊取憑證\", cost: 500, skill: \"low\", detectability: \"medium\", control: \"強制雙因子驗證\", residual_risk: \"中\", test_evidence: \"2026 Q3 red team 報告\"}, {name: \"利用未修補漏洞\", cost: 5000, skill: \"high\", detectability: \"high\", control: \"每月弱點掃描\", residual_risk: \"低\", test_evidence: \"掃描紀錄\"}]}（取得權限只需要「竊取憑證」或「利用漏洞」任一條路徑成功，所以是 OR，攻擊者會選最便宜的「竊取憑證」）\nroot_aggregate（整棵樹算出來的成本／技能／可偵測性）由系統自動計算，不用也不能自己填。\n（選填）version：留空即可。"
    example_en: "Scenario: an attack tree analyzing how an attacker could obtain an admin account. system_or_component: 'Admin backend system'; assets has >=1 entry, e.g. ['Admin account credentials']; trust_boundaries and entry_points may be empty lists but the fields are required. root is a recursive structure -- an internal node needs name/node_type (AND or OR)/children, a leaf node needs name/cost/skill (low/medium/high)/detectability (low/medium/high)/control/residual_risk/test_evidence, the two node shapes must never be mixed in one dict, e.g.: {name: 'Obtain admin privilege', node_type: 'OR', children: [{name: 'Steal credentials', cost: 500, skill: 'low', detectability: 'medium', control: 'Mandatory two-factor authentication', residual_risk: 'Medium', test_evidence: '2026 Q3 red-team report'}, {name: 'Exploit unpatched vulnerability', cost: 5000, skill: 'high', detectability: 'high', control: 'Monthly vulnerability scanning', residual_risk: 'Low', test_evidence: 'Scan records'}]} (obtaining privilege needs only ONE of 'steal credentials' or 'exploit vulnerability' to succeed, hence OR -- the attacker would pick the cheaper 'steal credentials' path). root_aggregate (the whole tree's computed cost/skill/detectability) is computed by the system, never supplied. Optional: version can be left blank."
  security.pasta:
    name_en: "Process for Attack Simulation and Threat Analysis"
    abbr: "PASTA"
    name_zh: "PASTA 攻擊模擬與威脅分析流程"
    blurb_en: "Runs threat modeling as a 7-stage pipeline from business objectives through scope decomposition, threat analysis, vulnerability, and attack simulation to business-impact risk. Use it when you need to justify security spend to the business, since every threat is traced back to a real business impact."
    blurb_zh: "把威脅建模跑成 7 個階段的管線：從商業目標出發，經過範圍拆解、威脅分析、弱點、攻擊模擬，最後回到商業衝擊風險。想跟業務端證明資安投資合理性時用，因為每個威脅都連得回真實商業衝擊。"
    why_en: "Most threat models start from the system diagram and never connect back to why the business should care; PASTA's own defining property is starting from business objectives FIRST and ending at business-impact risk LAST, in that fixed order -- the system enforces the 7 stages positionally, so a security team cannot skip straight to 'here are some vulnerabilities' without first stating what business objective is actually at stake."
    why_zh: "大多數威脅建模都是從系統圖開始，卻從沒連回「業務端為什麼該在乎」；PASTA 的定義特性就是先從商業目標出發、最後回到商業衝擊風險，順序固定不能跳——系統會依位置強制檢查這 7 個階段的順序，讓資安團隊不能跳過「這牽涉到哪個商業目標」直接講「這裡有一些弱點」。"
    url: "https://versprite.com/cybersecurity-listings/devsecops/pasta-threat-modeling/"
    example_zh: "情境：對一個線上支付功能做 PASTA 分析。\nsystem_or_component：「線上支付功能」\nassets、trust_boundaries、entry_points 同 STRIDE 的規則（assets 至少 1 筆，其餘可空但要給）。\nstages 必須「剛好」7 筆，順序固定是 business／scope／decompose／threat／vulnerability／attack／risk，前 6 個階段只要 stage_id／summary，例如 [{stage_id: \"business\", summary: \"確保支付流程不影響營收與商譽\"}, {stage_id: \"scope\", summary: \"涵蓋結帳頁到金流商回呼\"}, {stage_id: \"decompose\", summary: \"拆解成前端表單、API、金流商串接三個部分\"}, {stage_id: \"threat\", summary: \"識別出中間人竄改金額、重放攻擊等威脅\"}, {stage_id: \"vulnerability\", summary: \"API 缺少金額簽章驗證\"}, {stage_id: \"attack\", summary: \"模擬竄改請求金額後重送\"}]\n第 7 個階段（risk）多 3 個必填欄位，例如 {stage_id: \"risk\", summary: \"竄改金額若成功，單筆最高損失估計 5 萬元\", control: \"每筆交易加上伺服器端簽章驗證\", residual_risk: \"低\", test_evidence: \"2026 Q3 支付安全測試報告\"}\n（選填）version：留空即可。"
    example_en: "Scenario: PASTA analysis of an online payment feature. system_or_component: 'Online payment feature'; assets/trust_boundaries/entry_points follow the same rules as STRIDE (assets >=1 entry, the rest may be empty but required). stages must be EXACTLY 7 entries in the fixed order business/scope/decompose/threat/vulnerability/attack/risk, the first 6 stages need only stage_id/summary, e.g. [{stage_id: 'business', summary: 'Ensure the payment flow does not harm revenue or reputation'}, {stage_id: 'scope', summary: 'Covers checkout page through payment-provider callback'}, {stage_id: 'decompose', summary: 'Decomposed into frontend form, API, and payment-provider integration'}, {stage_id: 'threat', summary: 'Identified threats: man-in-the-middle amount tampering, replay attacks'}, {stage_id: 'vulnerability', summary: 'API lacks amount-signature verification'}, {stage_id: 'attack', summary: 'Simulated tampering with the request amount and resubmitting'}]. The 7th stage (risk) adds 3 required fields, e.g. {stage_id: 'risk', summary: 'If amount tampering succeeds, estimated max loss per transaction is $50,000', control: 'Server-side signature verification on every transaction', residual_risk: 'Low', test_evidence: '2026 Q3 payment security test report'}. Optional: version can be left blank."
  security.linddun:
    name_en: "LINDDUN Privacy Threat Model"
    abbr: "LINDDUN"
    name_zh: "LINDDUN 隱私威脅模型"
    blurb_en: "STRIDE's privacy-focused sibling: walks a data flow and checks each element against seven privacy threat categories (linkability, identifiability, non-repudiation, detectability, disclosure, unawareness, non-compliance). Use it alongside or after STRIDE when personal data is involved and security threats alone aren't enough."
    blurb_zh: "STRIDE 的隱私版兄弟：逐一檢視資料流，對照七類隱私威脅（可連結性、可識別性、不可否認性、可偵測性、資訊洩露、不知情、不合規）。系統涉及個資、光做安全威脅建模不夠時，搭配 STRIDE 一起用或接著用。"
    why_en: "A system can pass every STRIDE security check and still violate user privacy in ways STRIDE was never designed to catch -- e.g. two separately-anonymous data flows that become linkable when combined, which is a privacy threat with no direct security-confidentiality equivalent. Using the SAME data-flow-element structure as STRIDE but a genuinely different seven-category vocabulary means privacy gets its own systematic pass, not an afterthought squeezed into the security review."
    why_zh: "一個系統可以通過每一項 STRIDE 安全檢查，卻還是用 STRIDE 從沒設計要抓的方式侵犯使用者隱私——例如兩個各自匿名的資料流，組合起來就變得可以互相連結，這是一種沒有直接安全機密性對應概念的隱私威脅。用跟 STRIDE 一樣的資料流元件結構、但真正不同的七大類詞彙，能讓隱私得到自己專屬的系統性檢查，而不是被硬塞進安全審查裡的事後補充。"
    url: "https://linddun.org/"
    example_zh: "情境：對一個會蒐集使用者行為紀錄的分析功能做 LINDDUN 隱私威脅建模。\nsystem_or_component：「使用者行為分析功能」\nassets、trust_boundaries、entry_points、data_flow_elements 的規則跟 security.stride 完全一樣（element_type 四選一，name 唯一）。\nthreats 的 category 只能是 LINDDUN 的七大類：linkability／identifiability／non_repudiation／detectability／disclosure／unawareness／non_compliance，例如 [{element_name: \"行為紀錄資料庫\", category: \"linkability\", description: \"跨裝置的匿名行為紀錄可能被組合識別出同一人\", control: \"跨裝置紀錄改用不可逆雜湊 ID\", residual_risk: \"中\", test_evidence: \"隱私影響評估報告\"}]\nelements_with_no_recorded_threats 由系統自動算出，不用自己填。\n（選填）version：留空即可。"
    example_en: "Scenario: LINDDUN privacy threat modeling of a user-behavior analytics feature. system_or_component: 'User behavior analytics feature'; assets/trust_boundaries/entry_points/data_flow_elements follow exactly the same rules as security.stride (element_type is one of the four values, name unique). threats' category is one of LINDDUN's seven: linkability/identifiability/non_repudiation/detectability/disclosure/unawareness/non_compliance, e.g. [{element_name: 'Behavior log database', category: 'linkability', description: 'Anonymous cross-device behavior logs could be combined to re-identify one person', control: 'Cross-device logs use irreversible hashed IDs', residual_risk: 'Medium', test_evidence: 'Privacy impact assessment report'}]. elements_with_no_recorded_threats is computed by the system, never supplied. Optional: version can be left blank."
  security.dpia_pia:
    name_en: "Data Protection / Privacy Impact Assessment"
    abbr: "DPIA / PIA"
    name_zh: "資料保護／隱私影響評估"
    blurb_en: "Formally assesses one data-processing activity across purpose, necessity/proportionality, affected data subjects, risks, and controls. Use it before launching any feature or process that processes personal data, especially where a regulator would expect a documented assessment (e.g. GDPR Art. 35)."
    blurb_zh: "針對一項資料處理活動，正式評估其目的、必要性／比例原則、受影響當事人、風險與控制措施。要推出任何處理個資的功能或流程前用，尤其是法規要求要有書面評估的情境（如 GDPR 第 35 條）。"
    why_en: "A risk register that lists risks but never traces each one to a control and a residual-risk verdict is not actually a completed assessment -- the system requires every declared risk to be covered by at least one control AND exactly one residual-risk assessment, and if any residual risk lands 'high', the approval stage cannot record a bare 'approved' decision (GDPR Art. 36 requires prior regulator consultation at that point). That escalation rule is enforced structurally, not left to reviewer discipline."
    why_zh: "一份只列出風險、卻從沒把每個風險連到控制措施跟殘餘風險結論的登記表，其實不算真的做完評估——系統要求每個宣告的風險都要有至少一個控制措施涵蓋、而且要有剛好一筆殘餘風險評估，如果任何一筆殘餘風險是「高」，核准階段就不能記錄成一句空泛的「已核准」（GDPR 第 36 條規定這種情況要先諮詢主管機關）。這條升級規則是結構性強制執行的，不是靠審查者自己記得。"
    url: "https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/accountability-and-governance/data-protection-impact-assessments-dpias/"
    example_zh: "情境：對「新增臉部辨識打卡功能」做 DPIA。\nsystem_or_component：「臉部辨識打卡功能」\nstages 必須「剛好」8 筆，順序固定是 processing／purpose／necessity_proportionality／data_subjects／risks／controls／residual_risk／approval。\n前 4 個是敘述型階段，只要 stage_id／summary，例如 [{stage_id: \"processing\", summary: \"蒐集員工臉部特徵值用於打卡驗證\"}, {stage_id: \"purpose\", summary: \"防止代打卡\"}, {stage_id: \"necessity_proportionality\", summary: \"評估是否有較不侵入的替代方案（如指紋、卡片）\"}, {stage_id: \"data_subjects\", summary: \"全體在職員工，約 300 人\"}]\nrisks 階段：risk_id 必須是 \"RISK-\" 開頭，例如 [{risk_id: \"RISK-1\", description: \"臉部特徵值外洩可能造成永久性生物特徵風險\", likelihood: \"low\", severity: \"high\", affected_rights: [\"個人資料保護權\"]}]\ncontrols 階段：每筆 mitigates_risk_ids 必須指向真實存在的 risk_id，例如 [{control_id: \"CTRL-1\", description: \"特徵值加密儲存且不可還原成原始影像\", mitigates_risk_ids: [\"RISK-1\"]}]\nresidual_risk 階段：每個 risk_id 剛好要有 1 筆評估，不多不少，例如 [{risk_id: \"RISK-1\", residual_likelihood: \"low\", residual_severity: \"medium\", residual_risk_level: \"medium\", accepted_by: \"資安主管\"}]\napproval 階段：decision 只能是 approved／approved_with_conditions／escalated／rejected 四選一，若前面殘餘風險有任一筆是 high，這裡就不能是 approved，例如 {stage_id: \"approval\", approver_role: \"資料保護長\", approver_name: \"王小明\", decision: \"approved_with_conditions\", decision_date: \"2026-09-18\", conditions: [\"半年後重新評估\"], jurisdiction_pack_ref: null}\n（選填）version：留空即可。"
    example_en: "Scenario: a DPIA for a new facial-recognition attendance feature. system_or_component: 'Facial recognition attendance feature'; stages must be EXACTLY 8 entries in the fixed order processing/purpose/necessity_proportionality/data_subjects/risks/controls/residual_risk/approval. The first 4 are narrative stages needing only stage_id/summary, e.g. [{stage_id: 'processing', summary: 'Collects employee facial feature vectors for attendance verification'}, {stage_id: 'purpose', summary: 'Prevent buddy punching'}, {stage_id: 'necessity_proportionality', summary: 'Assessed whether a less invasive alternative exists (e.g. fingerprint, badge)'}, {stage_id: 'data_subjects', summary: 'All active employees, about 300 people'}]. risks stage: risk_id must start with 'RISK-', e.g. [{risk_id: 'RISK-1', description: 'Leaked facial feature vectors create a permanent biometric risk', likelihood: 'low', severity: 'high', affected_rights: ['Right to data protection']}]. controls stage: every mitigates_risk_ids must resolve to a real risk_id, e.g. [{control_id: 'CTRL-1', description: 'Feature vectors are encrypted at rest and cannot be reversed into the original image', mitigates_risk_ids: ['RISK-1']}]. residual_risk stage: EXACTLY 1 assessment per risk_id, no more no fewer, e.g. [{risk_id: 'RISK-1', residual_likelihood: 'low', residual_severity: 'medium', residual_risk_level: 'medium', accepted_by: 'Security lead'}]. approval stage: decision is one of approved/approved_with_conditions/escalated/rejected, and if any residual risk above is 'high' this cannot be 'approved', e.g. {stage_id: 'approval', approver_role: 'Data Protection Officer', approver_name: 'Jane Doe', decision: 'approved_with_conditions', decision_date: '2026-09-18', conditions: ['Reassess in 6 months'], jurisdiction_pack_ref: null}. Optional: version can be left blank."
  security.zero_trust_review:
    name_en: "Zero Trust Review"
    abbr: ""
    name_zh: "零信任架構檢視"
    blurb_en: "Reviews a system's access architecture against zero-trust principles: verify every request explicitly, grant least privilege, and assume the network is already breached. Use it to audit whether a design still relies on 'trusted internal network' as an implicit security boundary."
    blurb_zh: "依零信任原則檢視系統的存取架構：每次請求都明確驗證、最小權限、假設網路已經被入侵。想稽核設計是否還隱性依賴「內部網路等於可信任」這個假設時用。"
    why_en: "Zero trust fails silently the moment a long-lived shared credential sneaks back in -- one static API key defeats the entire 'verify every request' premise no matter how well everything else is designed. This method hard-refuses three specific forbidden credential types (shared password, long-lived API key, hardcoded secret) at construction time, so a review cannot accidentally record a design as zero-trust-compliant while it still relies on exactly the pattern zero trust exists to eliminate."
    why_zh: "只要一個長效期的共用憑證悄悄溜回來，零信任就會無聲失效——不管其他部分設計得多好，一把靜態 API 金鑰就能打破「每次請求都要驗證」這整個前提。這個方法在建立紀錄時會硬性拒絕三種特定的禁用憑證類型（共用密碼、長效期 API 金鑰、硬編碼機密），這樣一份審查紀錄就不會不小心把一個其實還依賴著零信任本來就是要消滅的那種模式的設計，記成「符合零信任」。"
    url: "https://tsapps.nist.gov/publication/get_pdf.cfm?pub_id=930420"
    example_zh: "情境：檢視一個微服務對資料庫的存取路徑是否符合零信任原則。\nsystem_or_component：「訂單服務存取訂單資料庫」\nstages 必須「剛好」4 筆，順序固定是 identity_context／access_decision／credential_issuance／audit_trail。\nidentity_context 這個階段內部一定要同時有 subject／workload／resource 三個子物件，例如 {stage_id: \"identity_context\", subject: {subject_id: \"svc-order\", description: \"訂單服務身分\", idp_ref: null}, workload: {workload_id: \"order-service-prod\", description: \"生產環境訂單服務 pod\", workload_identity_strategy_ref: \"mTLS\"}, resource: {resource_id: \"orders-db\", description: \"訂單資料庫\", sensitivity_classification: \"Confidential\"}}（sensitivity_classification 只能是 Public／Internal／Confidential／Restricted 四選一）\naccess_decision：authz_decision 只能是 permit 或 deny，例如 {stage_id: \"access_decision\", authn_method: \"mTLS 憑證\", authn_verified: true, authz_decision: \"permit\", least_privilege_confirmed: true, pdp_engine_ref: \"Cedar\"}\ncredential_issuance：credential_type 絕對不能是 shared_password／long_lived_api_key／hardcoded_secret 這三種被明文禁止的類型，例如 {stage_id: \"credential_issuance\", credential_type: \"short_lived_token\", ttl_seconds: 900, issued_at: \"2026-09-18T10:00:00Z\", mutual_authentication_confirmed: true}\naudit_trail：例如 {stage_id: \"audit_trail\", audit_log_ref: \"cloudtrail-2026-09-18\", continuous_monitoring_confirmed: true, resource_access_granted: true}\n（選填）version：留空即可。"
    example_en: "Scenario: reviewing whether a microservice's access path to a database is zero-trust compliant. system_or_component: 'Order service access to order database'; stages must be EXACTLY 4 entries in the fixed order identity_context/access_decision/credential_issuance/audit_trail. identity_context must carry all three of subject/workload/resource together, e.g. {stage_id: 'identity_context', subject: {subject_id: 'svc-order', description: 'Order service identity', idp_ref: null}, workload: {workload_id: 'order-service-prod', description: 'Production order-service pod', workload_identity_strategy_ref: 'mTLS'}, resource: {resource_id: 'orders-db', description: 'Order database', sensitivity_classification: 'Confidential'}} (sensitivity_classification is one of Public/Internal/Confidential/Restricted); access_decision: authz_decision is permit or deny only, e.g. {stage_id: 'access_decision', authn_method: 'mTLS certificate', authn_verified: true, authz_decision: 'permit', least_privilege_confirmed: true, pdp_engine_ref: 'Cedar'}; credential_issuance: credential_type must never be shared_password/long_lived_api_key/hardcoded_secret (explicitly forbidden), e.g. {stage_id: 'credential_issuance', credential_type: 'short_lived_token', ttl_seconds: 900, issued_at: '2026-09-18T10:00:00Z', mutual_authentication_confirmed: true}; audit_trail: e.g. {stage_id: 'audit_trail', audit_log_ref: 'cloudtrail-2026-09-18', continuous_monitoring_confirmed: true, resource_access_granted: true}. Optional: version can be left blank."
  security.secrets_threat_review:
    name_en: "Secrets Threat Review"
    abbr: ""
    name_zh: "機密資訊威脅檢視"
    blurb_en: "Reviews how an application's secrets (API keys, tokens, credentials) are stored, rotated, and accessed, looking for leak paths like hardcoding, logging, or over-broad access. Use it before shipping anything that introduces a new secret or credential store."
    blurb_zh: "檢視應用程式的機密資訊（API 金鑰、token、憑證）如何儲存、輪替、存取，找出硬編碼、寫進 log、權限過寬等外洩路徑。新增任何機密資訊或憑證儲存機制前用。"
    why_en: "A secret that was actually exposed (found in git history, a log, a chat transcript) but never triggered a real revoke-or-rotate response is a live compromise being tracked as a paperwork exercise -- the system enforces that any secret with an exposure finding must show its response flow moved past 'not triggered', closing exactly the gap between 'we noticed the leak' and 'we actually did something about it'."
    why_zh: "一個真的被曝光過（在 git 歷史紀錄、log、對話紀錄裡被找到）卻從沒觸發真正撤銷或輪替回應的機密資訊，就是一個正在被當成書面作業處理的真實入侵——系統會強制檢查，任何有曝光紀錄的機密資訊，其回應流程一定要顯示已經超過「尚未觸發」的狀態，堵住「我們發現外洩了」跟「我們真的採取行動了」之間的落差。"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
    example_zh: "情境：檢視第三方金流 API 金鑰的機密資訊治理狀況。\nsystem_or_component：「金流串接服務」\nstages 必須「剛好」6 筆，順序固定是 inventory／storage／access／rotation／exposure／revocation。\ninventory：secret_id 必須是 \"SECRET-\" 開頭，secret_type 只能是 api_key／db_credential／crypto_key／oauth_token／webhook_secret／tls_certificate／ssh_key／other 八選一，例如 {stage_id: \"inventory\", secrets: [{secret_id: \"SECRET-1\", secret_type: \"api_key\", owner: \"金流團隊\", system_or_component: \"金流串接服務\"}]}\nstorage、access、rotation 三個階段每一個都必須「剛好」涵蓋 inventory 宣告的每個 secret_id（不能多也不能少），例如 storage: {stage_id: \"storage\", entries: [{secret_id: \"SECRET-1\", storage_mechanism: \"SECRET_MANAGER\", exception_justification: null, key_vault_ref: null}]}（storage_mechanism 若是 OTHER 就一定要填 exception_justification，其餘機制則一定要是 null；secret_type 是 crypto_key 才需要 key_vault_ref，其餘都要是 null）\nexposure：是稀疏清單，只放真的有發現曝光的，可以是空清單，例如 {stage_id: \"exposure\", findings: []}\nrevocation：一樣要涵蓋每個 secret_id，response_flow.triggered 必須跟 flow_stage_reached 內部一致（true 對應非 NOT_TRIGGERED），若該 secret 在 exposure 有紀錄，flow_stage_reached 就不能停在 NOT_TRIGGERED，例如 {stage_id: \"revocation\", entries: [{secret_id: \"SECRET-1\", response_flow: {triggered: false, flow_stage_reached: \"NOT_TRIGGERED\"}}]}\n（選填）version：留空即可。"
    example_en: "Scenario: reviewing secrets governance for a third-party payment API key. system_or_component: 'Payment integration service'; stages must be EXACTLY 6 entries in the fixed order inventory/storage/access/rotation/exposure/revocation. inventory: secret_id must start with 'SECRET-', secret_type is one of api_key/db_credential/crypto_key/oauth_token/webhook_secret/tls_certificate/ssh_key/other, e.g. {stage_id: 'inventory', secrets: [{secret_id: 'SECRET-1', secret_type: 'api_key', owner: 'Payments team', system_or_component: 'Payment integration service'}]}. storage/access/rotation must each cover EVERY inventory secret_id exactly (no more, no fewer), e.g. storage: {stage_id: 'storage', entries: [{secret_id: 'SECRET-1', storage_mechanism: 'SECRET_MANAGER', exception_justification: null, key_vault_ref: null}]} (exception_justification is required only when storage_mechanism is OTHER, else must be null; key_vault_ref is required only for secret_type crypto_key, else must be null). exposure: a sparse list of actual findings only, may be empty, e.g. {stage_id: 'exposure', findings: []}. revocation: also must cover every secret_id, response_flow.triggered must internally agree with flow_stage_reached (true iff not NOT_TRIGGERED), and if that secret has an exposure finding, flow_stage_reached cannot stay at NOT_TRIGGERED, e.g. {stage_id: 'revocation', entries: [{secret_id: 'SECRET-1', response_flow: {triggered: false, flow_stage_reached: 'NOT_TRIGGERED'}}]}. Optional: version can be left blank."
  security.supply_chain_threat_model:
    name_en: "Supply Chain Threat Model"
    abbr: ""
    name_zh: "供應鏈威脅模型"
    blurb_en: "Threat-models the dependencies, build pipeline, and third-party vendors a system relies on, not just the system's own code. Use it when adding a new dependency, CI/CD step, or vendor integration that could become a compromise vector even if your own code is clean."
    blurb_zh: "對系統依賴的套件、建置流程、第三方供應商做威脅建模，而不只是看自己的程式碼。新增依賴套件、CI/CD 步驟或供應商整合時用，因為就算自己的程式碼乾淨，這些也可能變成入侵管道。"
    why_en: "Your own code can be perfectly clean and still ship a backdoor if a dependency was compromised upstream, or if production accepts an artifact nobody actually verified -- this method requires evaluating a new dependency against all 7 real risk dimensions (maintenance, license, vulnerability history, replaceability, transitive dependencies, size/performance, long-term support) rather than just 'does it work', and structurally refuses a record claiming production deployment happened without the artifact having been verified first."
    why_zh: "就算自己的程式碼完全乾淨，只要上游有一個依賴套件被入侵、或正式環境接受了一個根本沒人驗證過的產物，後門照樣能被夾帶進來——這個方法要求對新增的依賴套件用全部 7 個真實風險維度（維護狀況、授權條款、漏洞歷史、可替代性、遞移依賴、體積效能、長期支援）評估，而不只是「能不能動」，而且結構上直接拒絕一份宣稱「正式環境已部署」卻沒先驗證過產物的紀錄。"
    url: "https://slsa.dev/"
    example_zh: "情境：新增一個第三方 npm 套件並走一次完整供應鏈審查。\nsystem_or_component：「後端 API 服務」\nstages 必須「剛好」7 筆，順序固定是 source／dependency／ci／artifact／registry／deploy／sign_verify。\nsource、ci、artifact、registry、deploy 五個階段只要 stage_id／summary，例如 {stage_id: \"source\", summary: \"程式碼存放於私有 GitHub repo，強制簽署 commit\"}\ndependency 階段：每個新依賴都要有完整 7 個考量維度，一個都不能少，例如 {stage_id: \"dependency\", dependency_entries: [{name: \"left-pad-successor\", considerations: {maintenance: \"近 6 個月有持續維護\", license: \"MIT\", vulnerability_history: \"近 2 年無重大 CVE\", replaceability: \"功能簡單，容易自行實作替代\", transitive_dependencies: \"零遞移依賴\", size_performance: \"打包後小於 5KB\", long_term_support: \"維護者為知名基金會，長期支援可信\"}}]}\nsign_verify（最後階段）：production_deployment_occurred 若是 true，artifact_verified 就一定要是 true（不能反過來），例如 {stage_id: \"sign_verify\", summary: \"使用 Sigstore/cosign 做無金鑰簽章\", artifact_verified: true, production_deployment_occurred: true, verification_method: \"cosign verify + Rekor 透明日誌查核\"}\n（選填）version：留空即可。"
    example_en: "Scenario: adding a new third-party npm package and running a full supply-chain review. system_or_component: 'Backend API service'; stages must be EXACTLY 7 entries in the fixed order source/dependency/ci/artifact/registry/deploy/sign_verify. source/ci/artifact/registry/deploy need only stage_id/summary, e.g. {stage_id: 'source', summary: 'Code lives in a private GitHub repo, commit signing enforced'}. dependency stage: every new dependency needs all 7 consideration dimensions, none may be skipped, e.g. {stage_id: 'dependency', dependency_entries: [{name: 'left-pad-successor', considerations: {maintenance: 'Actively maintained in the last 6 months', license: 'MIT', vulnerability_history: 'No major CVEs in the past 2 years', replaceability: 'Simple functionality, easy to reimplement in-house', transitive_dependencies: 'Zero transitive dependencies', size_performance: 'Bundled size under 5KB', long_term_support: 'Maintained by a well-known foundation, long-term support is credible'}}]}. sign_verify (final stage): if production_deployment_occurred is true, artifact_verified must also be true (never the reverse), e.g. {stage_id: 'sign_verify', summary: 'Keyless signing via Sigstore/cosign', artifact_verified: true, production_deployment_occurred: true, verification_method: 'cosign verify plus Rekor transparency-log check'}. Optional: version can be left blank."
  security.abuse_case:
    name_en: "Abuse Case"
    abbr: ""
    name_zh: "濫用案例"
    blurb_en: "Writes the negative mirror of a user story: how a malicious actor would deliberately misuse this specific feature, not just how an attacker breaks the system in general. Use it alongside normal use-case/user-story writing so abuse scenarios get designed against, not discovered after launch."
    blurb_zh: "寫使用者故事的負面鏡像版：一個惡意使用者會如何刻意濫用這個特定功能，而不是泛泛談攻擊者怎麼攻破系統。跟正常使用案例／使用者故事一起寫，讓濫用情境在設計階段就被考慮，而不是上線後才發現。"
    why_en: "Atlas's own chain names controls and detection as two SEPARATE final elements, not one -- a control that would stop the abuse is not the same guarantee as being able to tell it happened, and a feature can have one without the other. The system requires every single step in the abuse flow to be covered by at least one control AND, independently, at least one detection entry, so a feature cannot be marked 'reviewed' while some step in the abuse chain is silently unmitigated or silently invisible."
    why_zh: "Atlas 的鏈條把控制措施跟偵測機制列成兩個獨立的最終元素，不是一個——能阻止濫用發生的控制措施，跟能不能發現濫用真的發生過，是兩種不同的保證，一個功能完全可能只有其中一種。系統要求濫用流程裡的每一步都要至少有一個控制措施涵蓋、而且獨立地至少要有一個偵測機制涵蓋，這樣一個功能就不會在濫用鏈裡某一步根本沒被緩解、或發生了也看不見的情況下，被標成「已審查」。"
    url: "https://www.cs.auckland.ac.nz/courses/compsci725s2c/archive/termpapers/csia.pdf"
    example_zh: "情境：分析「優惠券兌換功能」可能被怎麼濫用。\nsystem_or_component：「優惠券兌換功能」\nstages 必須「剛好」5 筆，順序固定是 actor／goal／abuse_flow／controls／detection。\nactor、goal 是敘述型，只要 stage_id／summary，例如 [{stage_id: \"actor\", summary: \"擁有多個帳號的一般使用者\"}, {stage_id: \"goal\", summary: \"用同一張優惠券重複兌換超過限額\"}]\nabuse_flow：steps 的 step_id 必須是 \"STEP-\" 開頭，例如 {stage_id: \"abuse_flow\", steps: [{step_id: \"STEP-1\", description: \"用多個帳號各自兌換同一張優惠券\"}, {step_id: \"STEP-2\", description: \"用腳本高速重複呼叫兌換 API\"}]}\ncontrols：control_id 必須是 \"CTRL-\" 開頭，addresses_step_ids 必須涵蓋 abuse_flow 裡「每一個」step_id（不能漏），例如 {stage_id: \"controls\", controls: [{control_id: \"CTRL-1\", description: \"優惠券綁定單一已驗證帳號\", addresses_step_ids: [\"STEP-1\"]}, {control_id: \"CTRL-2\", description: \"API 加上頻率限制\", addresses_step_ids: [\"STEP-2\"]}]}\ndetection：detection_id 必須是 \"DET-\" 開頭，同樣要獨立涵蓋每一個 step_id，例如 {stage_id: \"detection\", detections: [{detection_id: \"DET-1\", description: \"監控同一張優惠券被多帳號兌換的異常模式\", addresses_step_ids: [\"STEP-1\"]}, {detection_id: \"DET-2\", description: \"監控單一 IP 對兌換 API 的異常呼叫頻率\", addresses_step_ids: [\"STEP-2\"]}]}\n（選填）version：留空即可。"
    example_en: "Scenario: analyzing how a coupon-redemption feature could be abused. system_or_component: 'Coupon redemption feature'; stages must be EXACTLY 5 entries in the fixed order actor/goal/abuse_flow/controls/detection. actor and goal are narrative stages needing only stage_id/summary, e.g. [{stage_id: 'actor', summary: 'A regular user controlling multiple accounts'}, {stage_id: 'goal', summary: 'Redeem the same coupon beyond its intended limit'}]. abuse_flow: step_id must start with 'STEP-', e.g. {stage_id: 'abuse_flow', steps: [{step_id: 'STEP-1', description: 'Redeem the same coupon separately across multiple accounts'}, {step_id: 'STEP-2', description: 'Script rapid repeated calls to the redemption API'}]}. controls: control_id must start with 'CTRL-', addresses_step_ids must cover EVERY step_id in abuse_flow (none may be missed), e.g. {stage_id: 'controls', controls: [{control_id: 'CTRL-1', description: 'Bind the coupon to a single verified account', addresses_step_ids: ['STEP-1']}, {control_id: 'CTRL-2', description: 'Rate-limit the redemption API', addresses_step_ids: ['STEP-2']}]}. detection: detection_id must start with 'DET-', also independently covering every step_id, e.g. {stage_id: 'detection', detections: [{detection_id: 'DET-1', description: 'Monitor for the same coupon being redeemed across abnormally many accounts', addresses_step_ids: ['STEP-1']}, {detection_id: 'DET-2', description: 'Monitor abnormal call-rate from a single IP to the redemption API', addresses_step_ids: ['STEP-2']}]}. Optional: version can be left blank."
  security.security_control_mapping:
    name_en: "Security Control Mapping"
    abbr: ""
    name_zh: "安全控制對照表"
    blurb_en: "Maps each identified threat to the specific control that mitigates it, exposing any threat with no control and any control with no clear threat it addresses. Use it as the closing step after any threat-modeling exercise, to prove coverage instead of assuming it."
    blurb_zh: "把每個識別出的威脅對應到實際緩解它的控制措施，找出沒有控制措施的威脅、以及不知道在防什麼的控制措施。做完任何威脅建模後的收尾步驟，用來證明涵蓋率，而不是憑感覺假設有涵蓋。"
    why_en: "This is the only method in the whole catalog whose core job is checking its own claims against a DIFFERENT, already-existing record (a real STRIDE or LINDDUN threat model) rather than being self-contained -- every mapping's own denormalized threat name/category must genuinely match what that external record actually says at that index, not just what the mapper remembers or asserts. That is what turns 'we mapped controls to threats' from a self-reported claim into something checkable against the real source."
    why_zh: "這是全語料庫裡唯一一個核心工作是拿自己的主張去對照另一份「已經存在」的紀錄（一份真實的 STRIDE 或 LINDDUN 威脅模型）、而不是自成一體的方法——每筆對照裡冗餘記錄的威脅名稱／分類，都必須真的跟那份外部紀錄在那個索引位置實際寫的東西一致，不能只憑對照者自己的記憶或宣稱。這正是讓「我們把控制措施對照到威脅了」從一句自我宣稱，變成真的可以拿外部原始紀錄核對的東西。"
    url: "https://en.wikipedia.org/wiki/Security_controls"
    example_zh: "情境：對一份既有的 STRIDE 威脅模型做控制對照收尾。\nsystem_or_component：「使用者登入流程」\nsource_record：一份真實既有的 StrideThreatModelRecord 物件（例如 security.stride 產出的那份，id 要是 \"STRIDE-\" 開頭）\nsource_record_type：\"stride\"（目前只支援 stride 或 linddun 兩種來源）\ncontrols 至少 1 筆，control_id 必須是 \"CTRL-\" 開頭，category 只能是 preventive／detective／recovery 三選一，evidence 要有 description／verified_by／verified_date 三個具體欄位（不是隨便一句話），例如 [{control_id: \"CTRL-1\", category: \"preventive\", description: \"強制雙因子驗證\", evidence: {description: \"抽查 20 個帳號皆已啟用\", verified_by: \"資安工程師 A\", verified_date: \"2026-09-18\"}}]\ncontrol_mappings 至少 1 筆，source_threat_index 是來源紀錄 threats 陣列裡的位置索引（從 0 開始），source_threat_element_name／source_threat_category 必須跟來源紀錄在那個索引的真實內容完全一致，control_id 要指向真實存在的 controls 項目，例如 [{source_threat_index: 0, source_threat_element_name: \"驗證服務\", source_threat_category: \"spoofing\", control_id: \"CTRL-1\"}]\nsource_record_id／source_threat_count／source_threats_with_no_control_mapping 都由系統直接從真實的 source_record 取得或計算，不用也不能自己填。\n（選填）version：留空即可。"
    example_en: "Scenario: closing out control mapping against an existing STRIDE threat model. system_or_component: 'User login flow'; source_record: a real, already-existing StrideThreatModelRecord object (e.g. the one produced by security.stride, id starting with 'STRIDE-'); source_record_type: 'stride' (only stride or linddun are supported today); controls has >=1 entry, control_id must start with 'CTRL-', category is preventive/detective/recovery only, evidence needs description/verified_by/verified_date as concrete fields (not a vague one-liner), e.g. [{control_id: 'CTRL-1', category: 'preventive', description: 'Mandatory two-factor authentication', evidence: {description: 'Spot-checked 20 accounts, all enabled', verified_by: 'Security engineer A', verified_date: '2026-09-18'}}]; control_mappings has >=1 entry, source_threat_index is the position (0-based) in the source record's own threats array, source_threat_element_name/source_threat_category must exactly match what the source record really has at that index, control_id must resolve to a real controls entry, e.g. [{source_threat_index: 0, source_threat_element_name: 'Auth service', source_threat_category: 'spoofing', control_id: 'CTRL-1'}]. source_record_id/source_threat_count/source_threats_with_no_control_mapping are all taken or computed directly from the real source_record, never supplied. Optional: version can be left blank."

  # ---- stakeholder (singular -- Lens, not Method) ----
  stakeholder.regulator:
    name_en: "Stakeholder / Regulator Lens"
    abbr: ""
    name_zh: "利害關係人／監管者視角"
    blurb_en: "A reusable 'perspective' lens (not a method) that re-reads existing analysis through a regulator's priorities: compliance, precedent, public accountability. Use it to pressure-test a decision or plan by asking 'how would a regulator see this', without re-running the whole analysis from scratch."
    blurb_zh: "一個可重複套用的「視角」（不是方法），用監管者的優先順序——合規、先例、公共問責——重新檢視既有分析。想用「監管者會怎麼看這件事」來壓力測試一個決策或計畫，又不想整個分析重跑一次時用。"
    why_en: "An AI adopting an expert persona sounds more authoritative without actually knowing more -- research on persona prompting finds it changes tone and confidence, not accuracy, which is exactly the failure mode this Lens's own governance labels are built to block: evidence_backed=required means a regulator-lens claim still needs a real citation, and impersonation=forbidden means the output must stay visibly a hypothetical role-play, never presented as an actual regulator's real opinion. That labeling discipline is what makes 'how would a regulator see this' a useful pressure-test instead of a confident-sounding guess."
    why_zh: "AI 套上專家人設，講話會更有權威感，但不代表它真的懂更多——角色扮演提示詞的研究發現，它改變的是語氣跟自信程度，不是準確度，這正是這個 Lens 的治理標籤要擋的失效模式：evidence_backed=required 代表監管者視角講出來的主張還是要有真實引用佐證，impersonation=forbidden 代表輸出必須明顯是假設性角色扮演，絕不能被當成真的監管者本人的意見。有這層標籤紀律，「監管者會怎麼看這件事」才是有用的壓力測試，而不是一個聽起來很有把握的猜測。"
    url: "https://ai-analytics.wharton.upenn.edu/insights/stop-telling-ai-who-to-be-why-personas-dont-improve-accuracy/"
    example_zh: "重要：這是全語料庫唯一的「Lens／視角」條目，跟其他 284 個方法的形狀不一樣——它沒有 generate_* 建構函式、沒有可以送進系統驗證的填表欄位，是套在既有分析結果上的一組治理規則，不是一個獨立方法。\n實務用法：先用其他方法（例如 decision.mcda、strategy.swot）做出一個既有的 PerspectiveAssessment 型分析結果，接著要求 AI「以監管者的優先順序（合規／先例／公共問責）重新檢視這份分析」，並套用這個 Lens 的三條治理規則：\n1. evidence_backed: required——監管者視角提出的任何事實性主張，都要能指到真實引用來源，不能憑空斷言。\n2. hypothetical_role_perspective: allowed——輸出必須明確標示「這是假設性角色扮演」，不是真人意見。\n3. impersonation: forbidden——絕對不能寫成「某監管機關表示...」這種冒充真實機構發言的語氣。\nrequires：JurisdictionContext（這個視角需要知道套用在哪個司法管轄脈絡下）；output：PerspectiveAssessment（跟其他視角共用的評估產出型別）。"
    example_en: "Important: this is the ONLY 'Lens/Perspective' entry in the whole corpus -- its shape differs from all 284 other methods. There is no generate_* builder and no fillable form fields to submit to the system; it is a set of governance rules applied ON TOP of an existing analysis result, not a standalone method. Real usage: first produce an existing PerspectiveAssessment-shaped result with some other method (e.g. decision.mcda, strategy.swot), then ask the AI to 're-read this analysis through a regulator's priorities (compliance / precedent / public accountability)', applying this Lens's own 3 governance rules: 1. evidence_backed: required -- any factual claim made from the regulator perspective must cite a real source, never asserted from nowhere. 2. hypothetical_role_perspective: allowed -- the output must be clearly labeled as hypothetical role-play, not a real person's opinion. 3. impersonation: forbidden -- never phrased as 'Regulator X stated...', which would impersonate a real institution. requires: JurisdictionContext (this lens needs to know which jurisdiction's context it's being applied under); output: PerspectiveAssessment (the same assessment type other lenses share)."

  # ---- stakeholders (F07 Stakeholder / Power / Negotiation Pack) ----
  stakeholders.batna:
    name_en: "Best Alternative To a Negotiated Agreement"
    abbr: "BATNA"
    name_zh: "最佳替代方案（BATNA）"
    blurb_en: "Names your best alternative if the current negotiation fails, then uses it as the real floor for evaluating any offer on the table. Use it before any negotiation, so you know the walk-away point instead of guessing under pressure."
    blurb_zh: "找出如果這次談判破局，你手上最好的替代方案，並用它作為評估任何提案的真實底線。談判前先用，才不會臨場憑感覺猜底線。"
    why_en: "best_alternative_id must not just resolve to a real alternative but must actually be the one netting the highest value -- naming a strictly inferior alternative as 'best' is refused, not merely a formatting error. reservation_point is never supplied directly; it's always the selected alternative's own value_estimate minus cost_estimate, so a caller can't understate or inflate their own walk-away value independent of the real numbers behind it."
    why_zh: "best_alternative_id 不能只是「隨便一個真實存在的選項」，還必須是淨值真的最高的那一個——挑一個明顯較差的選項當「最佳」會被拒絕，不只是格式錯誤。reservation_point 從來不是直接給值的欄位，永遠是被選中選項自己的 value_estimate 減去 cost_estimate，這樣呼叫端就不能脫離背後真實數字，隨便低報或高報自己的談判底線。"
    url: "https://www.pon.harvard.edu/tag/best-alternative-to-a-negotiated-agreement/"
    example_zh: "情境：評估一份供應商合約談不成時的最佳替代方案。\nsubject：「與供應商 A 的年約續約談判」\nalternatives 至少 1 筆、id 要唯一，例如 [{id: \"ALT-1\", label: \"改用供應商 B\", value_estimate: 500000, cost_estimate: 80000}, {id: \"ALT-2\", label: \"自建內部團隊\", value_estimate: 600000, cost_estimate: 300000}]\nbest_alternative_id 一定要指向淨值（value_estimate－cost_estimate）真的最高的那個，上面 ALT-1 淨值 420000、ALT-2 淨值 300000，所以要填 \"ALT-1\"\n（重點）如果 best_alternative_id 填成 \"ALT-2\"（淨值較低的選項），會被拒絕建立——選最佳 BATNA 不能選一個不是真的最好的選項。reservation_point 不用也不能自己填，系統會自動算成 420000。"
    example_en: "Scenario: assess the best fallback if a supplier contract renewal negotiation fails. subject: 'Annual contract renewal negotiation with Supplier A'; alternatives has >=1 entry with a unique id, e.g. [{id: 'ALT-1', label: 'Switch to Supplier B', value_estimate: 500000, cost_estimate: 80000}, {id: 'ALT-2', label: 'Build an in-house team', value_estimate: 600000, cost_estimate: 300000}]; best_alternative_id must name the entry with the actual highest net value (value_estimate minus cost_estimate) -- ALT-1 nets 420000, ALT-2 nets 300000, so it must be 'ALT-1'. Key point: if best_alternative_id were 'ALT-2' (the lower-net option), the record would be refused at construction -- selecting the best BATNA can't name an option that isn't actually the best. reservation_point is never supplied directly -- the system computes it as 420000."
  stakeholders.coalition_mapping:
    name_en: "Coalition Mapping"
    abbr: ""
    name_zh: "聯盟關係圖"
    blurb_en: "Maps each stakeholder's interests, power, and resources, then projects which ones would likely align into coalitions on a given issue. Use it before a contested decision where alliances matter as much as any individual stakeholder's position."
    blurb_zh: "畫出每個利害關係人的利益、權力、資源，並推估在特定議題上誰可能結盟。在有爭議的決策中，結盟關係跟個別立場一樣重要時用。"
    why_en: "every coalition scenario's member_ids must have at least 2 unique entries, and each must resolve to a stakeholder actually profiled in the same record -- a 'coalition' naming a stakeholder nobody profiled, or naming only one member, is refused. This keeps a coalition scenario grounded in the interests/power/resources analysis actually done, rather than a scenario invented independently of the stakeholder pool it claims to draw from."
    why_zh: "每一個聯盟情境的 member_ids 都一定要至少有 2 個不重複的成員，而且每一個都要能對應到同一份記錄裡真的有做過剖繪的利害關係人——一個聯盟情境如果指名了一個從未被剖繪過的人、或只有 1 個成員，會被拒絕。這樣一個聯盟情境就一定是根基於真的做過的利益／權力／資源分析，而不是憑空想像出一個跟利害關係人池子無關的情境。"
    url: "https://www.railstotrails.org/trailnation/playbook/coalition-building/"
    example_zh: "情境：評估「都市自行車道政策」可能形成的聯盟。\ncontext：「都市自行車道擴建政策」\nstakeholder_profiles 至少 2 筆、id 要唯一，每個欄位都不能空白，例如 [{id: \"S1\", name: \"單車團體\", interests: \"擴大自行車道網絡\", power: \"中（媒體聲量大）\", resources: \"志工人力、社群動員\"}, {id: \"S2\", name: \"商圈協會\", interests: \"保留路邊停車格\", power: \"高（地方政治關係）\", resources: \"資金、地方議員關係\"}]\ncoalition_scenarios 至少 1 筆，member_ids 至少 2 個不重複、且要指向上面真實存在的 stakeholder_profiles id，例如 [{id: \"SC-1\", label: \"單車團體＋環保團體聯盟\", member_ids: [\"S1\", \"S2\"]}]\n（重點）如果 member_ids 只放 1 個成員，或放了一個沒在 stakeholder_profiles 出現過的 id，會被拒絕建立——一個聯盟至少要有兩方，而且每一方都要是真的剖繪過的利害關係人。"
    example_en: "Scenario: assess possible coalitions around an 'urban bike lane policy'. context: 'Urban bike lane expansion policy'; stakeholder_profiles has >=2 entries with a unique id, every field non-empty, e.g. [{id: 'S1', name: 'Cyclist advocacy group', interests: 'Expand the bike lane network', power: 'Medium (strong media voice)', resources: 'Volunteer labor, community mobilization'}, {id: 'S2', name: 'Merchants association', interests: 'Preserve street parking', power: 'High (local political ties)', resources: 'Funding, ties to local council members'}]; coalition_scenarios has >=1 entry, member_ids has >=2 unique entries that must resolve to a real stakeholder_profiles id above, e.g. [{id: 'SC-1', label: 'Cyclist + environmental group coalition', member_ids: ['S1', 'S2']}]. Key point: if member_ids had only 1 member, or named an id that never appears in stakeholder_profiles, the record would be refused at construction -- a coalition needs at least two parties, and every party must be a stakeholder that was actually profiled."
  stakeholders.game_theory:
    name_en: "Game Theory"
    abbr: ""
    name_zh: "賽局理論"
    blurb_en: "Models a strategic interaction as players, strategies, and payoffs, then computes the equilibrium once every payoff is disclosed. Use it when outcomes depend on what other parties do, not just your own choice, and you want to reason about it rigorously instead of intuitively."
    blurb_zh: "把一個策略互動建模成參與者、策略、報酬，並在報酬都揭露後算出均衡解。結果不只取決於自己的選擇、還取決於對方怎麼做時用，想嚴謹推理而不是憑直覺。"
    why_en: "equilibrium can never be accepted until every declared strategy has exactly one recorded payoff -- a strategy with no payoff blocks the whole record before the equilibrium claim is even inspected. This mechanizes Atlas's own explicit warning ('get the payoffs wrong and the model, however elegant, is worthless') as a hard precondition: you can't rule out a profitable unilateral deviation for a strategy whose payoff was never even written down."
    why_zh: "在每一個宣告的策略都剛好有一筆記錄好的 payoff 之前，equilibrium 絕對不會被接受——一個沒有 payoff 的策略會擋下整筆記錄，equilibrium 主張連檢查的機會都沒有。這把 Atlas 自己明講的警語（「Payoff 設錯，模型再漂亮也無用」）變成一條硬性前提：一個連 payoff 都沒被記錄過的策略，根本沒辦法排除對方會不會單方面改變策略更有利可圖。"
    url: "https://www.britannica.com/science/Nash-equilibrium"
    example_zh: "情境：對「兩家公司要不要同時降價」建立賽局模型。\nplayers 至少 2 筆、id 要唯一，例如 [{id: \"P1\", name: \"公司 A\"}, {id: \"P2\", name: \"公司 B\"}]\nstrategies 每個 player 都至少要有 1 個策略，例如 [{player_id: \"P1\", strategy_id: \"降價\", name: \"公司 A 降價\"}, {player_id: \"P1\", strategy_id: \"維持\", name: \"公司 A 維持原價\"}, {player_id: \"P2\", strategy_id: \"降價\", name: \"公司 B 降價\"}, {player_id: \"P2\", strategy_id: \"維持\", name: \"公司 B 維持原價\"}]\npayoffs 每個策略都要剛好有 1 筆對應的 payoff，value 要是真的數字（不能是布林值），例如 [{player_id: \"P1\", strategy_id: \"降價\", value: -5}, {player_id: \"P1\", strategy_id: \"維持\", value: 10}, {player_id: \"P2\", strategy_id: \"降價\", value: -5}, {player_id: \"P2\", strategy_id: \"維持\", value: 10}]\nequilibrium：「雙方同時降價（一起維持原價其實對雙方都更好，但誰先維持原價都怕被對方降價搶市，形成囚徒困境）」\n（重點）如果公司 A 的「維持」策略完全沒有對應的 payoff，整筆記錄會被拒絕建立——一個沒被記錄 payoff 的策略，代表模型連自己宣稱的均衡都無法驗證。"
    example_en: "Scenario: model a game of whether two companies simultaneously cut prices. players has >=2 entries with a unique id, e.g. [{id: 'P1', name: 'Company A'}, {id: 'P2', name: 'Company B'}]; every player needs >=1 strategy, e.g. [{player_id: 'P1', strategy_id: 'cut', name: 'Company A cuts price'}, {player_id: 'P1', strategy_id: 'hold', name: 'Company A holds price'}, {player_id: 'P2', strategy_id: 'cut', name: 'Company B cuts price'}, {player_id: 'P2', strategy_id: 'hold', name: 'Company B holds price'}]; every strategy needs EXACTLY one matching payoff, value must be a genuine number (bool excluded), e.g. [{player_id: 'P1', strategy_id: 'cut', value: -5}, {player_id: 'P1', strategy_id: 'hold', value: 10}, {player_id: 'P2', strategy_id: 'cut', value: -5}, {player_id: 'P2', strategy_id: 'hold', value: 10}]; equilibrium: 'Both companies cut simultaneously (both holding would actually be better for everyone, but each fears the other undercutting them first -- a prisoner's dilemma)'. Key point: if Company A's 'hold' strategy had no matching payoff, the whole record would be refused at construction -- a strategy with no recorded payoff means the model can't even verify the equilibrium it claims."
  stakeholders.incentive_mapping:
    name_en: "Incentive Mapping"
    abbr: ""
    name_zh: "誘因圖"
    blurb_en: "Builds one card per stakeholder covering their goals, incentives, constraints, and risks. Use it to predict how a stakeholder will actually behave, instead of how you assume they should behave."
    blurb_zh: "為每個利害關係人做一張卡片，涵蓋他的目標、誘因、限制、風險。想預測一個人實際上會怎麼做，而不是你以為他應該怎麼做時用。"
    why_en: "every incentive card must have all 5 of its own fields non-empty -- a card missing even one (say, risks) hasn't actually completed that stakeholder's card, regardless of how complete every other card in the list is. This is a per-card check, not a list-wide average: predicting one stakeholder's real behavior from an incomplete card is exactly the guesswork this method exists to replace with a disciplined, complete disclosure."
    why_zh: "每一張激勵卡都一定要自己 5 個欄位全部非空——就算漏掉其中一個（例如 risks），也代表那位利害關係人的卡片沒有真的完成，不管清單裡其他卡片有多完整都一樣。這是逐卡檢查，不是整份清單的平均值：想從一張不完整的卡片去預測某個人的真實行為，正是這個方法要用嚴謹、完整的揭露取代的臆測。"
    url: "https://en.wikipedia.org/wiki/Principal%E2%80%93agent_problem"
    example_zh: "情境：分析「導入新的績效考核制度」時，各關鍵利害關係人的真實行為動機。\nincentive_cards 至少 1 筆，每筆都要有 stakeholder_name／goals／incentives／constraints／risks 這 5 個非空欄位，例如 [{stakeholder_name: \"部門主管\", goals: \"團隊績效數字好看\", incentives: \"考核結果影響主管自己的年終獎金\", constraints: \"沒有額外時間做一對一輔導\", risks: \"新制度上線初期團隊產出可能下滑，影響自己考核\"}]\n（重點）如果這筆卡片的 risks 填成空字串，會被拒絕建立——5 個欄位少一個，這位利害關係人的激勵卡就沒有真的完成，沒辦法用來預測他實際會怎麼反應。"
    example_en: "Scenario: analyze key stakeholders' real behavioral motivations behind rolling out a new performance review system. incentive_cards has >=1 entry, each with 5 non-empty fields (stakeholder_name/goals/incentives/constraints/risks), e.g. [{stakeholder_name: 'Department manager', goals: 'Team performance numbers look good', incentives: 'Review outcomes affect the manager's own year-end bonus', constraints: 'No extra time available for 1-on-1 coaching', risks: 'Team output may dip during the new system's early rollout, hurting their own review'}]. Key point: if this card's risks were an empty string, the record would be refused at construction -- missing even one of the 5 fields means that stakeholder's incentive card was never actually completed, and can't be used to predict how they'll really behave."
  stakeholders.interest_based_negotiation:
    name_en: "Interest-Based Negotiation"
    abbr: ""
    name_zh: "利益導向談判"
    blurb_en: "Separates each party's stated position from their underlying interests, then looks for options that satisfy the real interests instead of splitting the difference on positions. Use it (Fisher & Ury's classic approach) whenever a negotiation is stuck because both sides are defending positions instead of naming what they actually need."
    blurb_zh: "把每一方表面的立場跟底層真正的利益分開，再找出能滿足真正利益的方案，而不是在立場上各退一步。談判卡住、雙方都在捍衛立場而不是講出真正需求時用（Fisher 與 Ury 經典談判法）。"
    why_en: "when a position is recorded, no interests entry may be a normalized verbatim echo of it -- pasting the same stated demand into 'interests' under a different field name is refused. This operationalizes Fisher & Ury's own core move (translate a stated position into the underlying interest behind it): a record can't claim to have done that transformation while its interests field is just the position wearing a new label."
    why_zh: "只要記錄了 position，interests 裡的任何一項都不能是它正規化後的逐字複述——把同一句話貼到 interests 底下換個欄位名稱放，會被拒絕。這是把 Fisher & Ury 原始理論的核心動作（把說出口的立場翻譯成背後真正的利益）變成硬規則：一份記錄不能一邊宣稱做了這個轉換，一邊 interests 欄位只是把立場換個名字重貼一次。"
    url: "https://www.pon.harvard.edu/daily/negotiation-skills-daily/principled-negotiation-focus-interests-create-value/"
    example_zh: "情境：分析一場「租金調漲」的房東房客協商。\nseparate_people_from_problem：「先跟房客表達理解他的財務壓力，再回到租約條件本身討論，不把對方當對手」\ninterests 至少 1 筆，例如 [\"房東需要租金跟得上維修成本上漲\", \"房客需要可預期、不會突然大漲的居住成本\"]\noptions 至少 1 筆，例如 [\"分兩年逐步調漲，而非一次到位\"]\nobjective_criteria 至少 1 筆，例如 [\"參考當地同類型房屋近一年租金行情\"]\n（選填）position：「房東最初開的口頭要求：租金一次調漲 20%」\n（重點）如果 interests 裡有一項正規化後跟 position 完全一樣（例如也寫「租金一次調漲 20%」），會被拒絕建立——這代表根本沒有真的把立場轉換成利益，只是換個欄位名稱貼上去。"
    example_en: "Scenario: analyze a landlord-tenant negotiation over a rent increase. separate_people_from_problem: 'Start by acknowledging the tenant's financial pressure, then return to the lease terms themselves -- not treating them as an adversary'; interests has >=1 entry, e.g. ['Landlord needs rent to keep pace with rising maintenance costs', 'Tenant needs predictable housing costs with no sudden spikes']; options has >=1 entry, e.g. ['Phase the increase over two years instead of all at once']; objective_criteria has >=1 entry, e.g. ['Reference comparable local rental rates over the past year']. Optional: position: 'Landlord's initial verbal demand: a 20% rent increase all at once'. Key point: if an interests entry normalized to the exact same text as position (e.g. also stating 'a 20% rent increase all at once'), the record would be refused at construction -- that means the position was never actually translated into an interest, just relabeled."
  stakeholders.power_interest:
    name_en: "Power-Interest Matrix"
    abbr: ""
    name_zh: "權力-利益矩陣"
    blurb_en: "Plots every stakeholder on a power x interest grid, computed from their own disclosed scores, to sort them into manage-closely / keep-satisfied / keep-informed / monitor quadrants. Use it to decide how much engagement effort each stakeholder actually warrants."
    blurb_zh: "把每個利害關係人依權力×利益畫在四象限圖上（由各自的分數計算得出），分成密切管理／保持滿意／保持知情／持續監控四類。想決定該花多少心力經營哪個利害關係人時用。"
    why_en: "quadrant is never a caller-supplied field -- it's always mechanically derived from each stakeholder's own power_score and interest_score via a fixed 4-cell table. The record also has no importance/ranking field anywhere: Atlas's own explicit caution is that this decides an engagement STRATEGY, not who the 'more important' person is, so the schema structurally has nowhere to put a priority ranking even if someone wanted to add one."
    why_zh: "quadrant 從來不是呼叫端能直接給值的欄位——永遠是從每個利害關係人自己的 power_score 跟 interest_score，透過固定的 4 格對照表算出來的。這份記錄也完全沒有任何重要性／排名欄位：Atlas 自己明講這是在決定溝通策略，不是判斷誰比較「重要」，所以就算有人想加一個優先順序排名，schema 結構上也沒有地方可以放。"
    url: "https://mutomorro.com/tools/mendelow-power-interest-matrix"
    example_zh: "情境：對「公司內部系統換新」這個專案的關鍵利害關係人分類，決定溝通策略。\nstakeholders 至少 1 筆，power_score／interest_score 都是 1-10 的整數（不能是布林值），每筆都要附理由，例如 [{stakeholder_name: \"IT 部門主管\", power_score: 8, power_reasoning: \"掌握系統換新的預算核准權\", interest_score: 9, interest_reasoning: \"新系統直接影響他的部門日常運作\"}, {stakeholder_name: \"一般員工\", power_score: 3, power_reasoning: \"沒有決策權，只能提意見\", interest_score: 8, interest_reasoning: \"每天都要用這套系統工作\"}]\n（重點）quadrant 不用也不能自己填，系統會自動算出來——IT 部門主管（power 8、interest 9，都是 HIGH）會自動算成 MANAGE_CLOSELY；一般員工（power 3 LOW、interest 8 HIGH）會自動算成 KEEP_INFORMED。整份記錄裡也沒有任何欄位可以填「誰比較重要」的排名。"
    example_en: "Scenario: classify key stakeholders in an internal system replacement project to decide engagement strategy. stakeholders has >=1 entry, power_score/interest_score are each an integer 1-10 (bool excluded), each with its own reasoning, e.g. [{stakeholder_name: 'IT department head', power_score: 8, power_reasoning: 'Controls budget approval for the system replacement', interest_score: 9, interest_reasoning: 'The new system directly affects their department's daily operations'}, {stakeholder_name: 'Rank-and-file employee', power_score: 3, power_reasoning: 'No decision authority, can only give input', interest_score: 8, interest_reasoning: 'Uses this system to work every day'}]. Key point: quadrant is never supplied directly -- the system computes it automatically. The IT department head (power 8, interest 9, both HIGH) is automatically MANAGE_CLOSELY; the rank-and-file employee (power 3 LOW, interest 8 HIGH) is automatically KEEP_INFORMED. There is also no field anywhere in the record for ranking 'who matters more'."
  stakeholders.raci:
    name_en: "RACI Matrix"
    abbr: "RACI"
    name_zh: "RACI 責任矩陣"
    blurb_en: "Assigns exactly who is Responsible, Accountable, Consulted, and Informed for every task in a list. Use it whenever a project stalls because 'who owns this' is ambiguous."
    blurb_zh: "為清單上的每一項任務，指定誰是負責執行（R）、當責（A）、需諮詢（C）、需被告知（I）。專案卡在「這件事到底誰負責」時用。"
    why_en: "every task must have EXACTLY one Accountable assignment -- never zero (nobody answerable) and never two or more, which IS the responsibility ambiguity RACI exists to remove, not a safety margin. Two people both marked 'accountable' for the same task is refused just as hard as nobody being accountable at all."
    why_zh: "每一個任務都一定要剛好有 1 個 Accountable（負責究責）指派——不能是 0 個（沒人可問責），也不能是 2 個以上（那正是 RACI 存在的目的要消除的責任模糊，不是多一層保險）。兩個人同時被標成對同一個任務究責，跟根本沒人究責一樣，都會被拒絕。"
    url: "https://en.wikipedia.org/wiki/Responsibility_assignment_matrix"
    example_zh: "情境：為「產品上線」這個專案指派責任歸屬。\ntasks 至少 1 筆，task_name 不能重複（正規化後比對），每個任務的 assignments 至少 1 筆，例如 [{task_name: \"撰寫上線公告\", assignments: [{stakeholder_name: \"行銷專員\", role: \"R\"}, {stakeholder_name: \"行銷經理\", role: \"A\"}, {stakeholder_name: \"產品經理\", role: \"C\"}, {stakeholder_name: \"客服團隊\", role: \"I\"}]}]\nrole 只能是 R／A／C／I 四選一\n（重點）如果同一個任務裡有 2 個人都標成 A（例如行銷經理跟產品經理都是 A），會被拒絕建立——這正是 RACI 要消除的責任模糊，不是多一層保障。同樣地，如果沒有任何人標成 R，也會被拒絕，因為沒人實際做事。"
    example_en: "Scenario: assign responsibility for a 'product launch' project. tasks has >=1 entry, task_name must not repeat (compared after normalization), each task's assignments has >=1 entry, e.g. [{task_name: 'Write launch announcement', assignments: [{stakeholder_name: 'Marketing specialist', role: 'R'}, {stakeholder_name: 'Marketing manager', role: 'A'}, {stakeholder_name: 'Product manager', role: 'C'}, {stakeholder_name: 'Support team', role: 'I'}]}]; role is one of R/A/C/I only. Key point: if the same task had 2 people both marked A (e.g. both the marketing manager and product manager), the record would be refused at construction -- that's exactly the responsibility ambiguity RACI exists to remove, not extra insurance. Likewise, if nobody were marked R, it would also be refused, since nobody would actually be doing the work."
  stakeholders.salience_model:
    name_en: "Salience Model"
    abbr: ""
    name_zh: "顯著性模型"
    blurb_en: "Scores each stakeholder on three yes/no dimensions -- power, legitimacy, urgency -- each requiring a written justification, then computes a salience class from how many they have. Use it as a quick triage before a fuller mapping exercise, to decide who deserves deeper attention first."
    blurb_zh: "針對每個利害關係人評估三個是非題——權力、正當性、急迫性——每一項都要求寫理由，再依符合幾項算出顯著性等級。想在做更完整的利害關係人圖之前先快速分流、決定先關注誰時用。"
    why_en: "whenever a dimension is marked present, it must carry a non-empty justification -- a dimension can't be checked true with no disclosed evidence. dimension_count and salience_class are never caller-supplied either; both are always derived from the same 3 booleans by one total function, so the two outputs can never disagree with each other or with what was actually marked present."
    why_zh: "只要一個維度被標成 present，就一定要附上非空的 justification——不能只打勾說某個維度存在卻沒有任何佐證。dimension_count 跟 salience_class 也都不是呼叫端能直接給值的欄位，永遠是同一個函式從那 3 個布林值算出來的，這樣這兩個輸出彼此之間、跟實際被標記的維度之間，都不可能出現互相矛盾的情況。"
    url: "https://umbrex.com/resources/frameworks/organization-frameworks/stakeholder-salience-model-mitchell-agle-wood/"
    example_zh: "情境：評估「環保團體」對某開發案的顯著性（salience）。\nstakeholder_name：「當地環保團體」\npower：{present: true, justification: \"有能力發動媒體輿論施壓，過去曾成功延宕類似開發案\"}\nlegitimacy：{present: true, justification: \"訴求與當地既有環境法規保障範圍一致\"}\nurgency：{present: false, justification: null}\n（重點）power 標成 true 卻沒填 justification（或填空字串）會被拒絕建立——不能只打勾沒證據。dimension_count／salience_class 不用也不能自己填，系統會自動算出來：這個例子是 2 個維度為 true，salience_class 會自動算成 POWER_LEGITIMACY。"
    example_en: "Scenario: assess the salience of a 'local environmental group' regarding a development project. stakeholder_name: 'Local environmental group'; power: {present: true, justification: 'Can mobilize media pressure; has successfully delayed similar developments before'}; legitimacy: {present: true, justification: 'Their claim aligns with existing local environmental regulations'}; urgency: {present: false, justification: null}. Key point: marking power as true with no justification (or an empty string) would be refused at construction -- a dimension can't be checked true with no disclosed evidence. dimension_count/salience_class are never supplied directly -- the system computes them automatically: in this example, 2 dimensions are true, so salience_class is automatically POWER_LEGITIMACY."
  stakeholders.stakeholder_map:
    name_en: "Stakeholder Map"
    abbr: ""
    name_zh: "利害關係人圖"
    blurb_en: "Lists every party with influence or interest in a decision, each tagged with a relationship type (direct/indirect/beneficiary/risk-bearer). Use it as the foundational first pass before any deeper stakeholder analysis (power-interest, salience, coalition mapping) -- you can't score what you haven't first listed."
    blurb_zh: "列出對一個決策有影響力或利益關係的所有各方，每個都標註關係類型（直接／間接／受益者／風險承擔者）。做任何更深入的利害關係人分析（權力利益、顯著性、聯盟圖）前的基礎第一步——沒先列出來，就沒辦法評分。"
    why_en: "the union of relationship_types across the WHOLE map must cover at least 2 of the 4 categories -- a map where every single entry is tagged only DIRECT has degenerated into exactly the 'only looking at decision-makers' failure Atlas's own benefit column names. This is a whole-map check, not a per-entry one: no single entry needs to cover multiple categories, but the map as a whole can't claim completeness while only ever answering one of the four questions (who influences, who's affected, who benefits, who bears risk)."
    why_zh: "整份地圖裡 relationship_types 的聯集，一定要涵蓋 4 類裡至少 2 種不同的值——如果每一筆條目都只標 DIRECT，這份地圖就退化成 Atlas 自己講的「只看決策者」失敗。這是整份地圖層級的檢查，不是單筆條目：不要求單一條目要涵蓋多種類別，但整份地圖不能只回答「誰有直接影響力」這一個問題，就宣稱自己完整列出了誰在影響、誰被影響、誰受益、誰承擔風險。"
    url: "https://en.wikipedia.org/wiki/Stakeholder_analysis"
    example_zh: "情境：為「新產品定價策略」列出完整的利害關係人地圖。\nstakeholders 至少 1 筆，relationship_types 只能是 DIRECT／INDIRECT／BENEFICIARY／RISK_BEARER 這 4 種，每筆內不能重複，例如 [{name: \"定價委員會\", category: \"決策層\", relationship_types: [\"DIRECT\"]}, {name: \"現有訂閱用戶\", category: null, relationship_types: [\"RISK_BEARER\"]}, {name: \"業務團隊\", category: \"執行層\", relationship_types: [\"BENEFICIARY\"]}]\n（重點）如果所有條目全部都只標 DIRECT（整份地圖的聯集只有 1 種類型），會被拒絕建立——這樣就退化成只看決策者，不算完整列出所有影響與被影響者。上面這個例子聯集涵蓋了 DIRECT／RISK_BEARER／BENEFICIARY 三種，符合最少 2 種的要求。"
    example_en: "Scenario: build a complete stakeholder map for a new product pricing strategy. stakeholders has >=1 entry, relationship_types is drawn only from DIRECT/INDIRECT/BENEFICIARY/RISK_BEARER with no duplicates within one entry, e.g. [{name: 'Pricing committee', category: 'Decision-makers', relationship_types: ['DIRECT']}, {name: 'Existing subscribers', category: null, relationship_types: ['RISK_BEARER']}, {name: 'Sales team', category: 'Execution', relationship_types: ['BENEFICIARY']}]. Key point: if every single entry were tagged only DIRECT (the whole map's union covering just 1 type), the record would be refused at construction -- that degenerates into only looking at decision-makers, not a complete list of who influences and who's affected. The example above covers DIRECT/RISK_BEARER/BENEFICIARY -- three types, satisfying the minimum of 2."
  stakeholders.zopa:
    name_en: "Zone of Possible Agreement"
    abbr: "ZOPA"
    name_zh: "可能同意區間（ZOPA）"
    blurb_en: "Compares the seller's minimum acceptable position against the buyer's maximum, and computes whether a zone of possible agreement even exists. Use it before a negotiation session to know upfront whether a deal is mathematically possible at all."
    blurb_zh: "比較賣方能接受的最低條件跟買方能接受的最高條件，算出兩者之間是否真的存在可能同意的區間。談判開始前先用，才會知道這筆交易在數學上到底成不成立。"
    why_en: "zopa_exists and zopa_range are never caller-supplied -- zopa_exists is always computed as seller_minimum <= buyer_maximum, and zopa_range is always exactly [seller_minimum, buyer_maximum] when a zone exists, else null. This is not a caution about misuse; it's the literal definition of what this method computes, so there is no code path through which a record could claim a deal zone exists while the two reservation points it's supposedly based on don't actually overlap."
    why_zh: "zopa_exists 跟 zopa_range 都不是呼叫端能直接給值的欄位——zopa_exists 永遠是「seller_minimum <= buyer_maximum」算出來的，zopa_range 在區間存在時永遠剛好是 [seller_minimum, buyer_maximum]，不存在時就是 null。這不是防呆提醒，而是這個方法本身的定義：不可能出現一筆記錄宣稱有成交區間、但背後那兩個底線數字其實根本沒有重疊的情況。"
    url: "https://online.hbs.edu/blog/post/understanding-zopa"
    example_zh: "情境：分析一場二手車買賣的可成交區間。\nseller_minimum：280000（賣方能接受的最低價）\nbuyer_maximum：320000（買方能接受的最高價）\n（重點）zopa_exists／zopa_range 都不用也不能自己填，系統會自動算出來：因為 280000 <= 320000，zopa_exists 會自動算成 true，zopa_range 會自動算成 [280000, 320000]。如果 seller_minimum 改成 350000（高於 buyer_maximum），zopa_exists 會自動算成 false，zopa_range 會自動算成 null——不可能出現「雙方底線沒重疊、卻宣稱有成交區間」這種自相矛盾的記錄。"
    example_en: "Scenario: analyze the possible deal zone in a used-car sale. seller_minimum: 280000 (the lowest price the seller will accept); buyer_maximum: 320000 (the highest price the buyer will pay). Key point: zopa_exists/zopa_range are never supplied directly -- the system computes them: since 280000 <= 320000, zopa_exists is automatically true and zopa_range is automatically [280000, 320000]. If seller_minimum were changed to 350000 (above buyer_maximum), zopa_exists would automatically become false and zopa_range would automatically become null -- there is no way to get a self-contradictory record claiming a deal zone exists while the two reservation points don't actually overlap."

  # ---- strategy (F08 Context / Strategy Pack) ----
  strategy.swot:
    name_en: "SWOT Analysis"
    abbr: "SWOT"
    name_zh: "SWOT 分析"
    blurb_en: "The classic 2x2 of internal Strengths/Weaknesses against external Opportunities/Threats. Use it as the standard first-pass framing for a strategic situation before moving to a more specific tool like TOWS or Porter's Five Forces."
    blurb_zh: "經典的 2x2 分析：內部優勢／劣勢對照外部機會／威脅。想對一個策略情境做標準的第一輪框架分析，之後再接 TOWS 或五力分析做更深入的工具時用。"
    why_en: "Splitting internal (controllable) from external (uncontrollable) factors first prevents the most common strategy-session failure mode: arguing about a market trend as if it were a company weakness, or vice versa. The internal/external split is the whole analytical value, before any of the four categories are even filled in."
    why_zh: "先把「內部（可控）」跟「外部（不可控）」分開，能避免策略會議最常見的失敗模式：把市場趨勢當成公司弱點在討論，或反過來。光是先做這個切分，分析價值就已經產生了，還沒開始填四個象限的內容。"
    url: "https://en.wikipedia.org/wiki/SWOT_analysis"
    example_zh: "情境：評估一家新創公司要不要進入某個新市場。\nknowledge_set_ref：「新市場進入評估-知識庫」\nknowledge_set 至少 1 筆真實 evidence 記錄（不能是空清單，代表「已取得證據」）\nfactors 至少 1 筆，每筆需要唯一 id/category（STRENGTH／WEAKNESS／OPPORTUNITY／THREAT 其中之一）/statement/geography/time/source，例如 {id: \"F1\", category: \"OPPORTUNITY\", statement: \"當地法規剛放寬外資限制\", geography: \"台灣\", time: \"2026 Q3\", source: \"經濟部公告\"}\n（選填）supporting_evidence_refs：某一筆若標記 provenance.epistemic_type 為 \"EVIDENCE\"，就必須附至少 1 個引用來源字串。"
    example_en: "Scenario: assessing whether a startup should enter a new market. knowledge_set_ref: 'New-market-entry-evidence-base'; knowledge_set needs >=1 real evidence record (cannot be an empty list -- represents 'evidence_available'); factors has >=1 entry with a unique id/category (one of STRENGTH/WEAKNESS/OPPORTUNITY/THREAT)/statement/geography/time/source, e.g. {id: 'F1', category: 'OPPORTUNITY', statement: 'Local regulation just eased foreign-investment limits', geography: 'Taiwan', time: '2026 Q3', source: 'Ministry of Economic Affairs announcement'}. Optional: supporting_evidence_refs is required (>=1 string) whenever an entry's provenance.epistemic_type is 'EVIDENCE'."
  strategy.pestel:
    name_en: "PESTEL Analysis"
    abbr: "PESTEL"
    name_zh: "PESTEL 分析"
    blurb_en: "Scans six macro-environment dimensions -- Political, Economic, Social, Technological, Environmental, Legal -- for facts, trends, and implications. Use it to build the external-environment picture that feeds into scenario planning or SWOT's opportunities/threats side."
    blurb_zh: "掃描六個總體環境面向——政治、經濟、社會、科技、環境、法律——找出事實、趨勢與意涵。想建立外部環境全貌，餵給情境規劃或 SWOT 的機會／威脅那一側時用。"
    why_en: "Every factor carries its own geography/time/source/validity-window fields, not just a bare statement -- that is what makes a PESTEL factor genuinely reusable across teams and time periods, instead of a stale one-off observation nobody can re-check later."
    why_zh: "每個因子都附自己的地理範圍／時間／來源／有效期間，不是只有一句話——這才是讓 PESTEL 因子真正能跨團隊、跨時間重複使用的原因，而不是一個之後沒人能查證的過時觀察。"
    url: "https://en.wikipedia.org/wiki/PESTLE_analysis"
    example_zh: "情境：評估東南亞市場的總體環境。\nfactors 至少 1 筆，每筆需要唯一 id/dimension（POLITICAL／ECONOMIC／SOCIAL／TECHNOLOGICAL／ENVIRONMENTAL／LEGAL 其中之一）/statement/geography/source/source_type（official／research／market／other 其中之一）/effective_from（ISO 日期）/trend/implication/confidence，例如 {id: \"F1\", dimension: \"ECONOMIC\", statement: \"中產階級消費力持續成長\", geography: \"越南\", source: \"世界銀行報告\", source_type: \"research\", effective_from: \"2026-01-01\", trend: \"上升\", implication: \"消費性產品市場擴大\", confidence: \"高\"}\n（選填）effective_to：留空代表持續有效至今；若有填，不能早於 effective_from。\n（選填）supporting_evidence_refs：某一筆若標記 provenance.epistemic_type 為 \"EVIDENCE\"，就必須附至少 1 個引用來源字串。"
    example_en: "Scenario: assessing the macro-environment of the Southeast Asian market. factors has >=1 entry with a unique id/dimension (one of POLITICAL/ECONOMIC/SOCIAL/TECHNOLOGICAL/ENVIRONMENTAL/LEGAL)/statement/geography/source/source_type (one of official/research/market/other)/effective_from (ISO date)/trend/implication/confidence, e.g. {id: 'F1', dimension: 'ECONOMIC', statement: 'Middle-class purchasing power keeps rising', geography: 'Vietnam', source: 'World Bank report', source_type: 'research', effective_from: '2026-01-01', trend: 'Rising', implication: 'Consumer goods market expanding', confidence: 'High'}. Optional: effective_to left blank means still in effect; if given, cannot precede effective_from. supporting_evidence_refs is required (>=1 string) whenever an entry's provenance.epistemic_type is 'EVIDENCE'."
  strategy.steepv:
    name_en: "STEEPV Analysis"
    abbr: "STEEPV"
    name_zh: "STEEPV 分析"
    blurb_en: "PESTEL plus a sixth dimension, Values -- the social/ethical values shaping a market. Use it instead of plain PESTEL when a decision is sensitive to shifting public or organizational values, not just economic and regulatory trends."
    blurb_zh: "在 PESTEL 六面向之外再加上第六個維度：價值觀——形塑市場的社會／倫理價值觀。決策對公眾或組織價值觀的變化敏感，不只是受經濟與法規趨勢影響時，用這個取代單純的 PESTEL。"
    why_en: "A long-term social-change scan that skips Values will still catch economic and regulatory shifts, but miss the shifting ethics/culture that often drives them in the first place -- this method structurally requires at least one VALUES factor, so that dimension can't be silently skipped the way it is in plain PESTEL."
    why_zh: "只掃 PESTEL 六面向的長期社會變遷分析，還是抓得到經濟跟法規的變化，但常常抓不到真正在背後推動這些變化的倫理/文化轉變——這個方法結構上強制至少要有 1 筆 VALUES 因子，讓這個面向不會像純 PESTEL 那樣被悄悄跳過。"
    url: "https://foresightguide.com/horizon-scanning-frameworks/"
    example_zh: "情境：評估一個長期社會變遷趨勢對品牌的影響。\nfactors 至少 1 筆，每筆需要唯一 id/dimension（SOCIAL／TECHNOLOGICAL／ECONOMIC／ENVIRONMENTAL／POLITICAL／VALUES 其中之一）/statement，且**至少要有 1 筆 dimension 是 VALUES**，例如 {id: \"F1\", dimension: \"VALUES\", statement: \"年輕消費者越來越重視品牌的永續承諾是否言行一致\"}\n其餘因子例如 {id: \"F2\", dimension: \"TECHNOLOGICAL\", statement: \"AI 生成內容大量普及\"}\n（選填）supporting_evidence_refs：某一筆若標記 provenance.epistemic_type 為 \"EVIDENCE\"，就必須附至少 1 個引用來源字串。"
    example_en: "Scenario: assessing a long-term social-change trend's impact on a brand. factors has >=1 entry with a unique id/dimension (one of SOCIAL/TECHNOLOGICAL/ECONOMIC/ENVIRONMENTAL/POLITICAL/VALUES)/statement, and **at least 1 entry must have dimension VALUES**, e.g. {id: 'F1', dimension: 'VALUES', statement: 'Younger consumers increasingly scrutinize whether a brand's sustainability claims match its actions'}. Other factors, e.g. {id: 'F2', dimension: 'TECHNOLOGICAL', statement: 'AI-generated content becomes widespread'}. Optional: supporting_evidence_refs is required (>=1 string) whenever an entry's provenance.epistemic_type is 'EVIDENCE'."
  strategy.three_c:
    name_en: "3C Analysis"
    abbr: "3C"
    name_zh: "3C 分析"
    blurb_en: "Examines Customer, Competitor, and Company across the same question and concludes with an explicit fit statement between them. Use it for a fast, focused read on whether your company's offering actually fits its customers and competitive position."
    blurb_zh: "從顧客、競爭者、公司三個角度檢視同一個問題，最後明確寫出三者間的契合度結論。想快速、聚焦地判斷公司的產品／服務是否真的契合顧客需求跟競爭位置時用。"
    why_en: "Only 3 fixed angles (vs. SWOT's 4 or PESTEL's 6) makes this fast enough for a same-meeting read, and requiring all 3 to be covered before a fit conclusion prevents the common trap of analyzing your own company in isolation without checking it against customers or rivals."
    why_zh: "只有 3 個固定角度（比 SWOT 的 4 個、PESTEL 的 6 個都少），快到可以在同一場會議裡就做完；而且強制三個角度都要涵蓋到才能下契合度結論，避免只分析自己公司、沒對照顧客或對手這個常見陷阱。"
    url: "https://en.wikipedia.org/wiki/3Cs_model"
    example_zh: "情境：判斷新推出的訂閱服務是否真的站得住腳。\nfindings 至少 3 筆，且必須涵蓋 CUSTOMER／COMPETITOR／COMPANY 三個 dimension（各至少 1 筆），每筆需要唯一 id/dimension/statement，例如 [{id: \"F1\", dimension: \"CUSTOMER\", statement: \"目標客群願意為省時付費，但對長期綁約敏感\"}, {id: \"F2\", dimension: \"COMPETITOR\", statement: \"主要對手主打低價但功能陽春\"}, {id: \"F3\", dimension: \"COMPANY\", statement: \"我們有現成的自動化技術但品牌知名度低\"}]\nfit_summary 是必填非空字串，例如「客群重視省時、對手功能陽春、我方技術對得上——但品牌需要先建立信任才能轉換」。"
    example_en: "Scenario: judging whether a newly-launched subscription service genuinely holds up. findings has >=3 entries and must cover all 3 dimensions CUSTOMER/COMPETITOR/COMPANY (>=1 each), each with a unique id/dimension/statement, e.g. [{id: 'F1', dimension: 'CUSTOMER', statement: 'Target customers will pay to save time but are wary of long lock-in'}, {id: 'F2', dimension: 'COMPETITOR', statement: 'The main rival competes on low price with bare-bones features'}, {id: 'F3', dimension: 'COMPANY', statement: 'We already have the automation tech but low brand awareness'}]. fit_summary is a required non-empty string, e.g. 'Customers value time savings, the rival is feature-poor, our tech fits -- but we need to build trust before conversion.'"
  strategy.tows:
    name_en: "TOWS Matrix"
    abbr: "TOWS"
    name_zh: "TOWS 矩陣"
    blurb_en: "Cross-pairs an existing SWOT analysis's own factors into four strategy types -- SO/ST/WO/WT -- turning a static SWOT list into actionable strategy options. Use it right after SWOT, not standalone, since it validates every pairing against your actual SWOT record."
    blurb_zh: "把既有 SWOT 分析的因子交叉配對成四種策略類型——SO/ST/WO/WT——把靜態的 SWOT 清單變成可執行的策略選項。要接在 SWOT 之後用，不能單獨使用，因為每個配對都會對照你實際的 SWOT 紀錄做驗證。"
    why_en: "A plain SWOT list often just sits there -- nobody turns 'we have strength X' and 'there's opportunity Y' into an actual move. Forcing every pairing to reference two REAL factors from an actual SWOT record (never a made-up pair) and computing the SO/ST/WO/WT label from their real categories is what turns a list into strategy, not just a longer list."
    why_zh: "單純的 SWOT 清單常常就停在那裡——沒有人把「我們有優勢 X」跟「有機會 Y」真的變成一個行動。強制每個配對都要指向一份真實 SWOT 紀錄裡實際存在的兩個因子（不能亂配），並且從它們的真實類別自動算出 SO/ST/WO/WT 標籤，才是把清單變成策略的關鍵，而不只是清單變更長。"
    url: "https://www.mindtools.com/pages/article/newSTR_89.htm"
    example_zh: "情境：把先前做好的 SWOT 分析轉成具體策略選項（**先決條件：已有一份真實的 SwotAnalysis 記錄**）。\nswot_analysis：貼上剛剛那份 SWOT 分析的完整輸出（不是 ID 字串，是整份記錄）\npairings 至少 1 筆，每筆需要唯一 id、internal_factor_id（必須對到 SWOT 裡真實的 STRENGTH 或 WEAKNESS 因子 id）、external_factor_id（必須對到 SWOT 裡真實的 OPPORTUNITY 或 THREAT 因子 id）、strategy_option（非空字串），例如 {id: \"P1\", internal_factor_id: \"F1\"（一個 STRENGTH）, external_factor_id: \"F2\"（一個 OPPORTUNITY）, strategy_option: \"用現有技術優勢搶進剛開放的市場\"}（pairing_type 由系統依兩個因子的真實類別自動算出 SO/ST/WO/WT，不用也不能自己填）。"
    example_en: "Scenario: turning a previously-built SWOT analysis into concrete strategy options (**prerequisite: a real SwotAnalysis record already exists**). swot_analysis: paste that SWOT analysis's full output (not an id string -- the whole record); pairings has >=1 entry with a unique id, internal_factor_id (must resolve to a real STRENGTH or WEAKNESS factor in that SWOT), external_factor_id (must resolve to a real OPPORTUNITY or THREAT factor), and a non-empty strategy_option, e.g. {id: 'P1', internal_factor_id: 'F1' (a STRENGTH), external_factor_id: 'F2' (an OPPORTUNITY), strategy_option: 'Use our existing tech edge to enter the newly-opened market'} (pairing_type is computed by the system from the two factors' real categories as SO/ST/WO/WT, never supplied)."
  strategy.porter_five_forces:
    name_en: "Porter's Five Forces"
    abbr: ""
    name_zh: "五力分析"
    blurb_en: "Scores an industry's competitive intensity across the five classic Porter forces: rivalry, supplier power, buyer power, threat of substitutes, threat of new entrants. Use it to understand industry-level profitability pressure, with the caveat that digital platforms and network effects may need a supplementary platform-strategy lens."
    blurb_zh: "從五個經典 Porter 構面評估一個產業的競爭強度：同業競爭、供應商議價力、買方議價力、替代品威脅、新進入者威脅。想了解產業層級的獲利壓力時用；但數位平台與網路效應可能需要額外的平台策略視角補充。"
    why_en: "Requiring all 5 forces to be scored (never just the obvious ones like direct rivalry) surfaces the forces people habitually forget -- supplier power and substitute threats are the two most often skipped in an informal competitive discussion, and they're often where the real long-term margin pressure comes from."
    why_zh: "強制 5 個構面都要評分（不能只挑明顯的，像同業競爭），逼出人們常常忘記的構面——供應商議價力跟替代品威脅是非正式競爭討論裡最常被跳過的兩個，但長期的獲利壓力常常就是從這兩個地方來的。"
    url: "https://en.wikipedia.org/wiki/Porter%27s_five_forces_analysis"
    example_zh: "情境：評估雲端儲存產業的競爭強度。\nforces 必須剛好是這 5 個各一筆（順序不限）：INDUSTRY_RIVALRY、NEW_ENTRANTS、SUBSTITUTES、SUPPLIER_POWER、BUYER_POWER，每筆需要 intensity（HIGH／MEDIUM／LOW）跟 assessment（非空字串），例如 {force: \"NEW_ENTRANTS\", intensity: \"LOW\", assessment: \"雲端基礎建設資本支出門檻極高\"}\noverall_attractiveness 是必填非空字串，例如「中等吸引力：進入門檻高但供應商集中度也高」。\n（選填）supporting_evidence_refs：某一筆若標記 provenance.epistemic_type 為 \"EVIDENCE\"，就必須附至少 1 個引用來源字串。"
    example_en: "Scenario: assessing competitive intensity in the cloud storage industry. forces must be exactly these 5, one entry each, any order: INDUSTRY_RIVALRY, NEW_ENTRANTS, SUBSTITUTES, SUPPLIER_POWER, BUYER_POWER, each needing intensity (HIGH/MEDIUM/LOW) and a non-empty assessment, e.g. {force: 'NEW_ENTRANTS', intensity: 'LOW', assessment: 'Cloud infrastructure capex is a very high barrier'}. overall_attractiveness is a required non-empty string, e.g. 'Medium attractiveness: high entry barriers but supplier concentration is also high.' Optional: supporting_evidence_refs is required (>=1 string) whenever an entry's provenance.epistemic_type is 'EVIDENCE'."
  strategy.vrio:
    name_en: "VRIO Resource Analysis"
    abbr: "VRIO"
    name_zh: "VRIO 資源分析"
    blurb_en: "Tests one resource or capability against four questions -- Value, Rarity, Imitability, Organization -- and computes the resulting competitive implication rather than letting you assert it. Use it to check whether something you call a 'competitive advantage' actually survives all four tests, or is just a capability you happen to have."
    blurb_zh: "用四個問題檢驗一項資源或能力：有價值嗎、稀有嗎、難以模仿嗎、組織有效運用嗎，並依此算出對應的競爭意涵，而不是讓你自己宣稱。想檢查一個自稱的「競爭優勢」是不是真的通過全部四關，還是只是剛好擁有的能力時用。"
    why_en: "The competitive_implication is computed from the 4 YES/NO answers via a fixed lookup table, never something you can directly assert -- this is exactly what stops the common failure Barney's own framework warns against: labeling any capability you happen to have as a 'moat' without it actually passing all four tests."
    why_zh: "competitive_implication 是從 4 個 YES/NO 答案用固定對照表算出來的，不能直接自己宣稱——這正是為了擋住 Barney 框架本身要防的常見錯誤：把剛好擁有的能力直接貼上「護城河」標籤，卻沒有真的通過全部四關。"
    url: "https://en.wikipedia.org/wiki/VRIO"
    example_zh: "情境：檢驗公司的客製化演算法是否構成真正的競爭優勢。\nresource_description：「公司自研的客製化推薦演算法」\nquestions 必須剛好是這 4 個各一筆（順序不限）：VALUE、RARITY、IMITABILITY、ORGANIZATION，每筆需要 answer（YES 或 NO）跟 reasoning（非空字串），例如 {dimension: \"VALUE\", answer: \"YES\", reasoning: \"確實提升了轉換率\"}、{dimension: \"RARITY\", answer: \"YES\", reasoning: \"同業還沒有類似演算法\"}、{dimension: \"IMITABILITY\", answer: \"NO\", reasoning: \"競爭對手用 6 個月就能複製出類似效果（IMITABILITY=NO 代表容易模仿，注意這題的 YES 才是「難以模仿」）\"}、{dimension: \"ORGANIZATION\", answer: \"YES\", reasoning: \"已有專責團隊持續優化\"}（competitive_implication 由系統依 4 個答案自動算出，不用也不能自己填）。\n（選填）supporting_evidence_refs：某一筆若標記 provenance.epistemic_type 為 \"EVIDENCE\"，就必須附至少 1 個引用來源字串。"
    example_en: "Scenario: testing whether a company's custom recommendation algorithm is a real competitive advantage. resource_description: 'The company's own custom recommendation algorithm'; questions must be exactly these 4, one entry each, any order: VALUE, RARITY, IMITABILITY, ORGANIZATION, each needing answer (YES or NO) and a non-empty reasoning, e.g. {dimension: 'VALUE', answer: 'YES', reasoning: 'It genuinely lifts conversion rate'}, {dimension: 'RARITY', answer: 'YES', reasoning: 'No competitor has a similar algorithm yet'}, {dimension: 'IMITABILITY', answer: 'NO', reasoning: 'A rival could replicate similar results within 6 months (note: IMITABILITY=YES means costly to imitate -- YES is the favorable answer here)'}, {dimension: 'ORGANIZATION', answer: 'YES', reasoning: 'A dedicated team continuously improves it'} (competitive_implication is computed by the system from the 4 answers, never supplied). Optional: supporting_evidence_refs is required (>=1 string) whenever an entry's provenance.epistemic_type is 'EVIDENCE'."
  strategy.stp:
    name_en: "Segmentation, Targeting, Positioning"
    abbr: "STP"
    name_zh: "STP 市場區隔定位"
    blurb_en: "Runs market segmentation, targeting, and positioning as a genuinely sequential pipeline, where the targeting decision must reference a real segment from the segmentation stage. Use it to go from 'who is the whole market' down to 'what specific position do we claim' without skipping a step."
    blurb_zh: "把市場區隔、目標選擇、定位跑成真正循序的流程，目標選擇的決策必須指向區隔階段實際產出的某個區隔。想從「整個市場有誰」一路走到「我們要佔據什麼定位」、且不跳過任何一步時用。"
    why_en: "Targeting is forced to reference a real segment id that Segmentation itself produced -- this stops the common shortcut of jumping straight to 'let's target young professionals' without first having actually done the segmentation work that identified that group."
    why_zh: "目標選擇被強制要指向 Segmentation 階段真的產出的區隔 id——這擋住一個常見的抄捷徑做法：沒有真的做完區隔分析、就直接跳到「我們要瞄準年輕上班族」這種結論。"
    url: "https://en.wikipedia.org/wiki/Segmenting-targeting-positioning"
    example_zh: "情境：為一款新的健身 App 決定市場定位。\nsegments 至少 1 筆，每筆需要唯一 id/description/criteria（非空字串陣列），例如 [{id: \"S1\", description: \"忙碌上班族\", criteria: [\"25-40 歲\", \"每週運動 <2 次\", \"願意付費省時間\"]}]\ntargeting_decision 的 targeted_segment_id 必須對到上面 segments 真實存在的 id，rationale 非空，例如 {targeted_segment_id: \"S1\", rationale: \"這群人付費意願高且市場缺乏針對性產品\"}\npositioning_statement 是必填非空字串，例如「給沒時間上健身房的忙碌上班族，一天 15 分鐘的居家高效訓練」。"
    example_en: "Scenario: deciding market positioning for a new fitness app. segments has >=1 entry with a unique id/description/criteria (non-empty string array), e.g. [{id: 'S1', description: 'Busy professionals', criteria: ['Age 25-40', 'Exercises <2x/week', 'Willing to pay to save time']}]; targeting_decision's targeted_segment_id must resolve to a real id from segments above, rationale non-empty, e.g. {targeted_segment_id: 'S1', rationale: 'High willingness to pay and the market lacks a targeted product'}; positioning_statement is a required non-empty string, e.g. '15-minute daily home workouts for busy professionals with no time for the gym.'"
  strategy.value_chain:
    name_en: "Value Chain Analysis"
    abbr: ""
    name_zh: "價值鏈分析"
    blurb_en: "Splits a business into primary and support activities and identifies each activity's cost and value drivers. Use it to find where in the chain you should cut cost or add differentiation, before jumping to benchmarking against competitors."
    blurb_zh: "把一個事業拆成主要活動與支援活動，找出每項活動的成本驅動因子與價值驅動因子。想找出該在哪個環節降低成本或增加差異化，再進一步跟競爭者做標竿比較時用。"
    why_en: "Requiring both a PRIMARY and a SUPPORT activity to be covered (never just the obvious customer-facing ones) forces the analysis onto the whole chain -- support activities like procurement or HR are exactly where hidden cost/differentiation opportunities tend to hide, precisely because they're the ones people skip when thinking about 'the business.'"
    why_zh: "強制 PRIMARY 跟 SUPPORT 活動都要涵蓋到（不能只挑明顯的客戶端活動），逼分析涵蓋整條鏈——採購、人資這類支援活動常常正是藏著隱藏成本或差異化機會的地方，因為那正是大家想到「這個事業」時最容易跳過的部分。"
    url: "https://en.wikipedia.org/wiki/Value_chain"
    example_zh: "情境：分析一家電商公司的價值鏈找出高槓桿改善點。\nactivities 至少 2 筆，且必須涵蓋 PRIMARY 跟 SUPPORT 兩種 category（各至少 1 筆），每筆需要唯一 id/category/activity_name，且 cost_driver 跟 value_driver 至少填一個，例如 [{id: \"A1\", category: \"PRIMARY\", activity_name: \"物流配送\", cost_driver: \"最後一哩配送成本佔比高\"}, {id: \"A2\", category: \"SUPPORT\", activity_name: \"供應商管理\", value_driver: \"長期合作換取優先供貨權\"}]\nleverage_points 是必填非空字串，例如「物流最後一哩是最大改善槓桿點，優化後可同時降成本又提升顧客體驗」。"
    example_en: "Scenario: analyzing an e-commerce company's value chain to find high-leverage improvements. activities has >=2 entries and must cover both PRIMARY and SUPPORT categories (>=1 each), each with a unique id/category/activity_name, and at least one of cost_driver/value_driver, e.g. [{id: 'A1', category: 'PRIMARY', activity_name: 'Logistics delivery', cost_driver: 'Last-mile delivery is a large share of cost'}, {id: 'A2', category: 'SUPPORT', activity_name: 'Supplier management', value_driver: 'Long-term partnerships secure priority supply'}]. leverage_points is a required non-empty string, e.g. 'Last-mile logistics is the biggest leverage point -- optimizing it cuts cost and improves customer experience at once.'"
  strategy.ansoff:
    name_en: "Ansoff Matrix"
    abbr: ""
    name_zh: "Ansoff 矩陣"
    blurb_en: "Names a growth move as exactly one of four quadrants -- market penetration, market development, product development, diversification -- and flags its relative risk. Use it to classify a proposed growth strategy and immediately see how much risk that quadrant typically carries."
    blurb_zh: "把一個成長方案歸類到四個象限之一——市場滲透、市場開發、產品開發、多角化——並標示其相對風險。想為提案的成長策略分類、並立刻看出該象限通常帶有多少風險時用。"
    why_en: "Requiring all 4 quadrants to be filled in (not just the one you're proposing) forces a side-by-side risk comparison -- seeing 'diversification carries HIGH risk' right next to 'penetration carries LOW risk' is what makes the relative risk claim (Atlas's own stated benefit) actually visible, not just asserted about one option in isolation."
    why_zh: "強制 4 個象限都要填（不是只填你正在提案的那個），逼出並排的風險比較——看到「多角化是 HIGH 風險」跟「市場滲透是 LOW 風險」並排放在一起，才是真正讓「相對風險」這個好處看得見，而不是只對單一選項孤立地宣稱。"
    url: "https://en.wikipedia.org/wiki/Ansoff_matrix"
    example_zh: "情境：為公司評估四種成長方向的風險。\nquadrants 必須剛好是這 4 個各一筆（順序不限）：MARKET_PENETRATION、MARKET_DEVELOPMENT、PRODUCT_DEVELOPMENT、DIVERSIFICATION，每筆需要 strategy_description（非空字串）跟 risk_level（LOW／MEDIUM／HIGH），例如 {quadrant: \"MARKET_PENETRATION\", strategy_description: \"加碼行銷現有產品在現有市場\", risk_level: \"LOW\"}\n其餘 3 個象限依樣填寫，例如 DIVERSIFICATION 常見會標 risk_level: \"HIGH\"（但這是判斷不是強制規則）。\n（選填）supporting_evidence_refs：某一筆若標記 provenance.epistemic_type 為 \"EVIDENCE\"，就必須附至少 1 個引用來源字串。"
    example_en: "Scenario: assessing the risk of 4 possible growth directions for a company. quadrants must be exactly these 4, one entry each, any order: MARKET_PENETRATION, MARKET_DEVELOPMENT, PRODUCT_DEVELOPMENT, DIVERSIFICATION, each needing a non-empty strategy_description and risk_level (LOW/MEDIUM/HIGH), e.g. {quadrant: 'MARKET_PENETRATION', strategy_description: 'Increase marketing spend on existing products in existing markets', risk_level: 'LOW'}. Fill in the other 3 quadrants similarly -- DIVERSIFICATION is commonly risk_level: 'HIGH', though that's a judgment call, not a hardcoded rule. Optional: supporting_evidence_refs is required (>=1 string) whenever an entry's provenance.epistemic_type is 'EVIDENCE'."
  strategy.business_model_canvas:
    name_en: "Business Model Canvas"
    abbr: ""
    name_zh: "商業模式圖"
    blurb_en: "Lays out all nine standard business-model blocks (key partners, activities, resources, value propositions, customer relationships, channels, segments, cost structure, revenue streams) on one canvas, explicitly marked as a hypothesis until validated against a real business. Use it to describe an entire business model on a single page before committing to a full business plan."
    blurb_zh: "把九個標準商業模式區塊（關鍵夥伴、關鍵活動、關鍵資源、價值主張、顧客關係、通路、客群、成本結構、收益流）畫在同一張畫布上，並明確標記為假設，直到對照真實商業運作驗證過為止。想在投入完整商業計畫前，先用一頁描述整個商業模式時用。"
    why_en: "Requiring all 9 blocks to be filled (not just the exciting ones like value propositions) forces the less glamorous operational blocks -- key partners, key activities, cost structure -- onto the same page, so a business model isn't declared 'described' while quietly skipping how it would actually run day to day."
    why_zh: "強制 9 個區塊都要填（不是只填價值主張這種吸引人的），逼出比較不吸引人但一樣重要的營運區塊——關鍵夥伴、關鍵活動、成本結構——都要出現在同一頁上，不會讓「商業模式已經描述完成」的宣稱悄悄跳過「這個事業實際上要怎麼每天運作」這件事。"
    url: "https://www.strategyzer.com/library/the-business-model-canvas"
    example_zh: "情境：描述一家 B2B SaaS 公司的商業模式。\nblocks 必須剛好是這 9 個各一筆（順序不限）：CUSTOMER_SEGMENTS、VALUE_PROPOSITIONS、CHANNELS、CUSTOMER_RELATIONSHIPS、REVENUE_STREAMS、KEY_RESOURCES、KEY_ACTIVITIES、KEY_PARTNERS、COST_STRUCTURE。\n每一筆需要 block/content/provenance 三個欄位，例如 CUSTOMER_SEGMENTS 這筆：{block: \"CUSTOMER_SEGMENTS\", content: \"50-500 人規模的中型企業人資部門\", provenance: {epistemic_type: \"EVIDENCE\", authorship_state: \"HUMAN_APPROVED\", locked: null}}\n（選填）supporting_evidence_refs：某一筆的 provenance.epistemic_type 若填 \"EVIDENCE\"，這筆就必須附至少 1 個引用來源字串；填 \"HYPOTHESIS\" 或其他類型則不用附。\nvalidation_status 由系統自動填入 \"UNVALIDATED_HYPOTHESIS\"，不是欄位、不用也不能自己填。\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
    example_en: "Scenario: describing a B2B SaaS company's business model. blocks must be exactly these 9, one entry each, any order: CUSTOMER_SEGMENTS, VALUE_PROPOSITIONS, CHANNELS, CUSTOMER_RELATIONSHIPS, REVENUE_STREAMS, KEY_RESOURCES, KEY_ACTIVITIES, KEY_PARTNERS, COST_STRUCTURE. Each entry needs block/content/provenance, e.g. the CUSTOMER_SEGMENTS entry: {block: 'CUSTOMER_SEGMENTS', content: 'HR departments at mid-size companies with 50-500 employees', provenance: {epistemic_type: 'EVIDENCE', authorship_state: 'HUMAN_APPROVED', locked: null}}. Optional: supporting_evidence_refs is required (>=1 string) whenever that entry's provenance.epistemic_type is 'EVIDENCE'; not needed for 'HYPOTHESIS' or other types. validation_status is filled in by the system as 'UNVALIDATED_HYPOTHESIS' automatically -- not a field you supply. version/generated_by_method can be left blank, the system supplies defaults."
  strategy.lean_canvas:
    name_en: "Lean Canvas"
    abbr: ""
    name_zh: "精實畫布"
    blurb_en: "Ash Maurya's startup-focused adaptation of the Business Model Canvas: swaps out the 4 'running an existing business' blocks (Key Partners/Activities/Resources/Customer Relationships) for 4 'starting a new business' blocks (Problem, Solution, Key Metrics, Unfair Advantage). Use it for an early-stage or pre-validation startup idea, where BMC's operations-focused blocks don't fit yet."
    blurb_zh: "Ash Maurya 把 Business Model Canvas 改成新創專用版：拿掉「怎麼經營一家已存在的公司」的 4 個區塊（關鍵夥伴、關鍵活動、關鍵資源、顧客關係），換成「怎麼開始一家新公司」的 4 個區塊（問題、解決方案、關鍵指標、難以模仿的優勢）。剛起步、還沒驗證過的新創點子，BMC 那套營運導向的區塊還用不上時用這個。"
    why_en: "Business Model Canvas assumes a business that already exists and needs describing; a pre-validation startup doesn't have Key Partners or a Customer Relationships process yet -- it has a guess about a Problem and a Solution that hasn't been tested. Swapping in Problem/Solution/Key Metrics/Unfair Advantage forces the canvas to ask the questions that actually matter before you've built anything: is this problem real, and what stops someone from copying you the moment it works?"
    why_zh: "商業模式圖假設一家公司已經存在、只是需要被描述清楚；但一個還沒驗證的新創點子根本還沒有關鍵夥伴、也沒有顧客關係流程——它有的只是一個尚未被測試過的「問題」猜想和「解決方案」猜想。換成問題／解決方案／關鍵指標／難以模仿的優勢，逼你在還沒做出東西之前，先回答真正關鍵的問題：這個問題是真的嗎？一旦做成了，別人要怎麼樣才抄不走？"
    url: "https://leanstack.com/lean-canvas"
    example_zh: "情境：想做一個幫小型會計師事務所整合多客戶對帳的工具。\nblocks 必須剛好是這 9 個區塊各一筆（順序不限）：PROBLEM、CUSTOMER_SEGMENTS、UNIQUE_VALUE_PROPOSITION、SOLUTION、CHANNELS、REVENUE_STREAMS、COST_STRUCTURE、KEY_METRICS、UNFAIR_ADVANTAGE。\n每一筆需要 block／content／provenance 三個欄位，例如 PROBLEM 這筆：{block: \"PROBLEM\", content: \"小型會計師事務所每週花 5 小時手動對帳多個客戶的帳本\", provenance: {epistemic_type: \"EVIDENCE\", authorship_state: \"HUMAN_APPROVED\"}}。\n（選填）supporting_evidence_refs：某一筆的 provenance.epistemic_type 若填 \"EVIDENCE\"，這筆就必須附至少 1 個引用來源字串，例如 [\"訪談紀錄-003\"]；填 \"HYPOTHESIS\" 或其他類型則不用附。\nvalidation_status 由系統自動填入 \"UNVALIDATED_HYPOTHESIS\"，不是欄位、不用也不能自己填。\n（選填）version、generated_by_method：留空由系統帶入預設值即可，通常不用填。"
    example_en: "Scenario: building a tool that helps small accounting practices reconcile multiple clients' books in one place. blocks must be exactly these 9, one entry each, any order: PROBLEM, CUSTOMER_SEGMENTS, UNIQUE_VALUE_PROPOSITION, SOLUTION, CHANNELS, REVENUE_STREAMS, COST_STRUCTURE, KEY_METRICS, UNFAIR_ADVANTAGE. Each entry needs block/content/provenance, e.g. the PROBLEM entry: {block: 'PROBLEM', content: \"Small accounting practices lose 5h/week reconciling multiple clients' books by hand\", provenance: {epistemic_type: 'EVIDENCE', authorship_state: 'HUMAN_APPROVED'}}. Optional: supporting_evidence_refs is required (>=1 string) whenever that entry's provenance.epistemic_type is 'EVIDENCE', e.g. ['interview-notes-003']; not needed for 'HYPOTHESIS' or other types. validation_status is filled in by the system as 'UNVALIDATED_HYPOTHESIS' automatically -- not a field you supply. version/generated_by_method can be left blank, the system supplies defaults."
  strategy.value_proposition_canvas:
    name_en: "Value Proposition Canvas"
    abbr: ""
    name_zh: "價值主張圖"
    blurb_en: "Matches a customer profile (jobs/pains/gains) against a value map (products, pain relievers, gain creators) and records the resulting fit hypotheses. Use it as a zoomed-in companion to the Business Model Canvas, focused specifically on whether your value proposition actually fits the customer."
    blurb_zh: "把顧客輪廓（任務／痛點／獲益）對照價值地圖（產品、痛點解方、獲益創造者），並記錄產生的契合假設。作為商業模式圖的放大鏡版本，專門檢查價值主張是否真的契合顧客需求時用。"
    why_en: "Every fit_hypothesis's fit_type (pain-relief or gain-creation) is computed from which real list each referenced item actually belongs to, never asserted -- this stops the common mistake of claiming a feature 'relieves a pain' when it was actually built to create a gain (or vice versa), a mismatch that would otherwise pass silently."
    why_zh: "每個 fit_hypothesis 的 fit_type（緩解痛點或創造獲益）是從引用的項目實際屬於哪個清單自動算出來的，不是自己宣稱——這擋住一個常見錯誤：明明是為了創造獲益做的功能，卻宣稱它是在「緩解痛點」（或反過來），這種不匹配原本會悄悄過關。"
    url: "https://www.strategyzer.com/library/the-value-proposition-canvas"
    example_zh: "情境：檢查一款記帳 App 的功能是否真的契合使用者需求。\n六個陣列都必須至少 1 筆，每筆需要唯一 id/statement：\njobs 例如 [{id: \"J1\", statement: \"追蹤每月支出\"}]\npains 例如 [{id: \"P1\", statement: \"手動記帳很麻煩常常忘記\"}]\ngains 例如 [{id: \"G1\", statement: \"想一眼看懂錢花去哪\"}]\nproducts_and_services 例如 [{id: \"PS1\", statement: \"自動分類記帳 App\"}]\npain_relievers 例如 [{id: \"PR1\", statement: \"自動讀取銀行簡訊記帳\"}]\ngain_creators 例如 [{id: \"GC1\", statement: \"每月自動產生視覺化報表\"}]\nfit_hypotheses 至少 1 筆，reliever_or_creator_id 對到 pain_relievers 或 gain_creators 的真實 id，pain_or_gain_id 對到 pains 或 gains 的真實 id（一個 pain_reliever 只能配 pain，一個 gain_creator 只能配 gain），fit_rationale 非空，例如 {id: \"FH1\", reliever_or_creator_id: \"PR1\", pain_or_gain_id: \"P1\", fit_rationale: \"自動讀取直接解決忘記記帳的痛點\"}（fit_type 由系統自動算出 PAIN_RELIEF 或 GAIN_CREATION，不用也不能自己填）。"
    example_en: "Scenario: checking whether a budgeting app's features genuinely fit user needs. All 6 arrays need >=1 entry with a unique id/statement: jobs e.g. [{id: 'J1', statement: 'Track monthly spending'}]; pains e.g. [{id: 'P1', statement: 'Manual bookkeeping is tedious and easy to forget'}]; gains e.g. [{id: 'G1', statement: 'Want to see at a glance where money went'}]; products_and_services e.g. [{id: 'PS1', statement: 'Auto-categorizing budgeting app'}]; pain_relievers e.g. [{id: 'PR1', statement: 'Auto-reads bank SMS to log transactions'}]; gain_creators e.g. [{id: 'GC1', statement: 'Auto-generates a monthly visual report'}]. fit_hypotheses has >=1 entry where reliever_or_creator_id resolves to a real pain_relievers or gain_creators id, pain_or_gain_id resolves to a real pains or gains id (a pain_reliever may only pair with a pain, a gain_creator only with a gain), fit_rationale non-empty, e.g. {id: 'FH1', reliever_or_creator_id: 'PR1', pain_or_gain_id: 'P1', fit_rationale: 'Auto-reading directly solves the forgetting-to-log pain'} (fit_type is computed by the system as PAIN_RELIEF or GAIN_CREATION, never supplied)."
  strategy.blue_ocean:
    name_en: "Blue Ocean Strategy"
    abbr: ""
    name_zh: "藍海策略"
    blurb_en: "Plots a value curve against competitors on a Strategy Canvas, then forces every competing factor through Eliminate/Reduce/Raise/Create (Kim & Mauborgne's ERRC grid). Use it when you want to design a genuinely new, uncontested market space instead of competing head-on in an existing one."
    blurb_zh: "在策略畫布上畫出跟競爭者對照的價值曲線，再把每個競爭因素套進消除／降低／提升／創造（Kim 與 Mauborgne 的 ERRC 表）四個動作。想設計一個真正無人競爭的全新市場空間，而不是在既有市場正面競爭時用。"
    why_en: "Structurally separating CREATE (a factor the industry has never offered -- no industry-standard level can exist) from ELIMINATE/REDUCE/RAISE (an existing factor, which requires disclosing its current industry level) is what forces genuine 'what could we create that nobody offers' thinking, instead of just relabeling ordinary competitive moves as 'blue ocean.'"
    why_zh: "把 CREATE（產業從沒提供過的因素，不該有產業標準水準）跟消除/降低/提升（既有因素，必須揭露目前的產業水準）在結構上分開，逼出真正的「我們能創造出別人都沒有的什麼」思考，而不是把普通的競爭動作貼上「藍海」標籤。"
    url: "https://en.wikipedia.org/wiki/Blue_ocean_strategy"
    example_zh: "情境：為一家健身房品牌設計差異化策略。\ncompeting_factors 至少 2 筆，每筆需要唯一 id/factor_name/errc_action（ELIMINATE／REDUCE／RAISE／CREATE 其中之一）/rationale，例如 {id: \"F1\", factor_name: \"教練一對一時數\", errc_action: \"REDUCE\", rationale: \"多數會員其實不需要那麼多一對一\", industry_standard_level: \"HIGH\"}（ELIMINATE／REDUCE／RAISE 這三種必須附 industry_standard_level；CREATE 則不能附，因為定義上就是產業從未提供過）\n例如 CREATE 因子：{id: \"F2\", factor_name: \"社群共同運動配對\", errc_action: \"CREATE\", rationale: \"業界沒有人做這個，可以創造全新差異化\"}\nnew_value_curve_summary 是必填非空字串，例如「降低一對一教練時數換取更低價格，加上獨創的社群配對功能」。"
    example_en: "Scenario: designing a differentiation strategy for a gym brand. competing_factors has >=2 entries with a unique id/factor_name/errc_action (one of ELIMINATE/REDUCE/RAISE/CREATE)/rationale, e.g. {id: 'F1', factor_name: '1-on-1 coaching hours', errc_action: 'REDUCE', rationale: 'Most members don't actually need that much 1-on-1 time', industry_standard_level: 'HIGH'} (ELIMINATE/REDUCE/RAISE all require industry_standard_level; CREATE must NOT include it, since by definition the industry has never offered it). E.g. a CREATE factor: {id: 'F2', factor_name: 'Community workout matching', errc_action: 'CREATE', rationale: 'Nobody in the industry does this -- a genuinely new differentiator'}. new_value_curve_summary is a required non-empty string, e.g. 'Cut 1-on-1 coaching hours for a lower price, add a unique community-matching feature.'"
  strategy.bcg_matrix:
    name_en: "BCG Growth-Share Matrix"
    abbr: "BCG"
    name_zh: "BCG 成長占有率矩陣"
    blurb_en: "Plots each item in a portfolio by growth rate x relative market share, computing which quadrant it falls into -- Star, Cash Cow, Question Mark, or Dog. Use it to decide where to invest, hold, or divest across a portfolio of products or business units."
    blurb_zh: "依成長率×相對市佔率，把投資組合中的每個項目畫在圖上，自動算出落在哪個象限——明星、金牛、問題、狗。想決定投資組合裡的產品或事業單位該加碼、維持還是撤資時用。"
    why_en: "The quadrant label is computed from your own disclosed growth/share judgments via a fixed lookup table, not something you pick yourself -- so you can't quietly call a struggling product a 'Star' to justify continued investment; the label has to follow from what you actually said about growth and share."
    why_zh: "象限標籤是從你自己揭露的成長率/市佔判斷、用固定對照表算出來的，不是自己挑——所以不能悄悄把一個表現不好的產品叫做「明星」來合理化繼續投資；標籤必須跟隨你對成長率跟市佔實際說了什麼。"
    url: "https://en.wikipedia.org/wiki/Growth%E2%80%93share_matrix"
    example_zh: "情境：檢視公司三條產品線該加碼還是撤資。\nportfolio_items 至少 1 筆，每筆需要 item_name/growth_rate（HIGH 或 LOW）/growth_rate_reasoning/relative_share（HIGH 或 LOW）/relative_share_reasoning，例如 {item_name: \"主力 App\", growth_rate: \"LOW\", growth_rate_reasoning: \"市場已成熟成長趨緩\", relative_share: \"HIGH\", relative_share_reasoning: \"市占率遠高於競爭對手\"}（quadrant 由系統依 growth_rate/relative_share 自動算出 STAR／CASH_COW／QUESTION_MARK／DOG，不用也不能自己填，這個例子會算出 CASH_COW）。"
    example_en: "Scenario: reviewing whether to invest more or divest across 3 product lines. portfolio_items has >=1 entry needing item_name/growth_rate (HIGH or LOW)/growth_rate_reasoning/relative_share (HIGH or LOW)/relative_share_reasoning, e.g. {item_name: 'Flagship app', growth_rate: 'LOW', growth_rate_reasoning: 'The market has matured and growth has slowed', relative_share: 'HIGH', relative_share_reasoning: 'Market share is far ahead of competitors'} (quadrant is computed by the system from growth_rate/relative_share as STAR/CASH_COW/QUESTION_MARK/DOG, never supplied -- this example computes to CASH_COW)."
  strategy.market_analysis:
    name_en: "Market Analysis"
    abbr: ""
    name_zh: "市場分析"
    blurb_en: "Sizes a market as a TAM >= SAM >= SOM funnel and records each segment with its own growth rate and supporting evidence. Use it when scoping a business plan's realistic addressable market, not just the total industry size."
    blurb_zh: "把市場規模拆解成 TAM（總體市場）≥ SAM（可服務市場）≥ SOM（可獲得市場）的漏斗，並為每個區隔記錄成長率與支持證據。做商業計畫、想界定實際可觸及的市場規模而不只是產業總量時用。"
    why_en: "Enforcing TAM >= SAM >= SOM as a real numeric constraint (not just three separate numbers) is what stops the classic pitch-deck mistake of quoting a huge TAM as if it were your realistic revenue ceiling -- and requiring a non-empty evidence_ref per segment means a segment can't be pure guesswork."
    why_zh: "強制 TAM ≥ SAM ≥ SOM 是真的數字限制（不是三個各自獨立的數字），擋住簡報常見的錯誤：引用一個巨大的 TAM，卻讓人誤以為那是你實際能拿到的營收上限；而且每個區隔都要有非空的 evidence_ref，代表區隔不能純粹用猜的。"
    url: "https://www.seerinteractive.com/insights/marketing-sizing-with-tam-sam-som"
    example_zh: "情境：為一款新的 SaaS 產品估算市場規模。\nmarket_definition：「中小企業排班管理 SaaS」\nsizing：{tam: 5000000000, sam: 800000000, som: 40000000, unit: \"USD\"}（必須符合 tam ≥ sam ≥ som）\nsegments 至少 1 筆，每筆需要唯一 id/name/size_estimate/growth_rate（-1 到 10 之間的小數，代表成長率）/evidence_ref（非空字串），例如 {id: \"SEG1\", name: \"零售業中小企業\", size_estimate: 15000000, growth_rate: 0.08, evidence_ref: \"產業報告 2026-Q2\"}。"
    example_en: "Scenario: sizing the market for a new SaaS product. market_definition: 'SMB employee-scheduling SaaS'; sizing: {tam: 5000000000, sam: 800000000, som: 40000000, unit: 'USD'} (must satisfy tam >= sam >= som); segments has >=1 entry with a unique id/name/size_estimate/growth_rate (a decimal between -1 and 10, i.e. the growth rate)/evidence_ref (non-empty string), e.g. {id: 'SEG1', name: 'Retail SMBs', size_estimate: 15000000, growth_rate: 0.08, evidence_ref: 'Industry report 2026-Q2'}."

  # ---- systems (F09 Systems Thinking Pack) ----
  systems.leverage_point_analysis:
    name_en: "Leverage Point Analysis"
    abbr: ""
    name_zh: "槓桿點分析"
    blurb_en: "Classifies an intervention point into one of Donella Meadows' 5-tier leverage hierarchy -- parameters, feedback loops, rules, goals, paradigm -- and computes its depth rank automatically. Use it to compare interventions by how deep their leverage actually is, since shallow fixes (parameters) rarely solve systemic problems."
    blurb_zh: "把一個介入點分類到 Donella Meadows 五層槓桿點階層之一——參數、回饋迴路、規則、目標、典範——並自動算出其深度等級。想比較不同介入方案的槓桿深度時用，因為淺層修改（參數）通常解決不了系統性問題。"
  systems.causal_loop_diagram:
    name_en: "Causal Loop Diagram"
    abbr: ""
    name_zh: "因果回饋圖"
    blurb_en: "Maps feedback loops between variables and independently recomputes each loop's reinforcing/balancing classification from its own edge polarities, rather than trusting a caller's label. Use it to understand why a system keeps amplifying or self-correcting a trend, not just what the trend is."
    blurb_zh: "畫出變數間的回饋迴路，並根據連結的正負極性獨立重新計算每個迴路是「增強」還是「平衡」，而不是相信使用者自己貼的標籤。想理解一個系統為什麼會不斷放大或自我修正某個趨勢，而不只是看到趨勢本身時用。"
  systems.stock_and_flow:
    name_en: "Stock & Flow"
    abbr: ""
    name_zh: "存量與流量圖"
    blurb_en: "Models accumulations (stocks) and the rates that fill or drain them (flows), requiring every stock to be touched by at least one real flow. Use it to understand dynamic behavior over time -- inventory, budget, population -- that a static snapshot can't show."
    blurb_zh: "把累積量（存量）跟填入／流出的速率（流量）建模出來，要求每個存量至少被一個真實流量影響。想理解庫存、預算、人口等隨時間變化的動態行為，而靜態快照看不出來時用。"
  systems.iceberg_model:
    name_en: "Iceberg Model"
    abbr: ""
    name_zh: "冰山模型"
    blurb_en: "Digs a surface event down through recurring patterns and systemic structures to the mental models sustaining them, one level at a time. Use it to avoid reacting to a single event in isolation and instead find the deeper structure producing a whole class of similar events."
    blurb_zh: "把一個表面事件逐層往下挖——重複發生的型態、系統性結構、支撐這一切的心智模式，一次一層。想避免只針對單一事件反應，而是找出產生一整類類似事件的深層結構時用。"
  systems.rich_picture:
    name_en: "Rich Picture"
    abbr: ""
    name_zh: "豐富圖像"
    blurb_en: "Freely sketches actors, processes, and conflicts in a messy situation that resists formal modeling, then requires every noted issue to trace back to a real actor. Use it as a first, informal pass on a complicated situation before forcing it into a more rigid framework."
    blurb_zh: "在一個混亂、還套不進正式模型的情境中，自由地畫出角色、流程、衝突，並要求每個記錄的議題都能追溯回真實角色。想對複雜情境先做一次非正式的初步梳理，之後再套進更嚴謹的框架時用。"
  systems.systems_archetypes:
    name_en: "Systems Archetypes"
    abbr: ""
    name_zh: "系統原型"
    blurb_en: "Matches an observed situation against a closed vocabulary of 10 known systemic patterns (like Limits to Growth, Fixes that Fail), each match requiring cited observed symptoms as evidence. Use it to recognize a familiar systemic trap instead of re-diagnosing a pattern from scratch."
    blurb_zh: "把觀察到的情況對照到 10 種已知系統原型（如成長的極限、飲鴆止渴）的封閉清單，每個判定都要求引用實際觀察到的症狀作為證據。想辨認出一個熟悉的系統性陷阱、而不是每次都從零重新診斷時用。"
  systems.agent_based_modeling:
    name_en: "Agent-Based Modeling"
    abbr: ""
    name_zh: "主體模型模擬"
    blurb_en: "Simulates emergent group behavior from individual agents, each following its own declared rules within a shared environment across multiple runs. Use it when a system's overall behavior can't be predicted from any single agent's rules alone -- you need to actually run the simulation to see what emerges."
    blurb_zh: "從個別主體各自的規則出發，在共享環境中跑多次模擬，觀察整體行為如何浮現。系統整體行為沒辦法單從某一個主體的規則推算出來、必須真的跑模擬才看得到湧現結果時用。"
  systems.behavior_over_time:
    name_en: "Behavior Over Time Graph"
    abbr: "BOT"
    name_zh: "隨時間變化行為圖"
    blurb_en: "Plots one tracked variable across a strictly chronological series of points, refusing a single-point or out-of-order series. Use it to force an analysis onto the time dimension instead of reasoning from a single snapshot."
    blurb_zh: "把一個追蹤的變數，依嚴格時間順序畫成一條序列，不接受單一個點或順序錯亂的資料。想強迫分析聚焦在「隨時間變化」，而不是只看單一時間點的快照時用。"
  systems.flowchart:
    name_en: "Flowchart"
    abbr: ""
    name_zh: "流程圖"
    blurb_en: "Visualizes a workflow as connected steps with exactly one start and at least one end, and every decision point branching into at least two conditioned paths. Use it to spot where a recurring process actually gets stuck, by literally drawing out the steps."
    blurb_zh: "把工作流程畫成連續步驟，只有一個起點、至少一個終點，每個決策點至少分岔出兩條有條件的路徑。想找出一個反覆出現的困擾歷程實際卡在哪一步，直接把步驟畫出來看時用。"
  systems.force_field_analysis:
    name_en: "Force Field Analysis"
    abbr: ""
    name_zh: "場域分析（推力與阻力分析）"
    blurb_en: "Lists the forces driving a change against the forces restraining it, each scored 1-5, and derives the net force automatically. Use it to see at a glance whether a proposed change currently has more push or more resistance behind it."
    blurb_zh: "列出推動一項改變的力量跟阻礙它的力量，各自評分 1-5，並自動算出淨力。想一眼看出目前一項改變究竟是推力比較大還是阻力比較大時用。"
  systems.life_system_mapping:
    name_en: "Life System Mapping"
    abbr: ""
    name_zh: "生活系統圖"
    blurb_en: "Maps a person's life subsystems (family, work, relationships, etc.) and the direction of influence between them. Use it to see how different life domains affect each other, instead of examining each area in isolation."
    blurb_zh: "畫出一個人生活中的各個子系統（家庭、工作、人際關係等），以及彼此之間的影響方向。想看出不同生活面向如何互相影響，而不是把每個領域分開來看時用。"
  systems.sipoc:
    name_en: "Suppliers-Inputs-Process-Outputs-Customers"
    abbr: "SIPOC"
    name_zh: "SIPOC（供應者-輸入-流程-輸出-顧客）"
    blurb_en: "Frames a process end-to-end across five columns: Suppliers, Inputs, Process, Outputs, Customers. Use it to scope a process and its key factors before diving into detailed process mapping."
    blurb_zh: "用五個欄位——供應者、輸入、流程、輸出、顧客——完整框定一個流程。想在深入細部流程對照之前，先界定流程範圍跟關鍵因素時用。"

# Method input forms: labels and the few structural overrides for the dashboard form.
#
# The form's STRUCTURE comes from each method's own record schema (specs/cognitive/typed-objects/),
# read by ai_lego/apps/api/method_form.py. This file only adds what a schema cannot say:
#   glossary      field key -> Chinese label (or {label, hint}); applies to every method
#   enum_labels   enum / fixed-row value -> Chinese label; applies to every method
#   methods.<id>  per-method entries, looked up before the glossary:
#     <path> or <key>      label / {label, hint} for that field (path = dotted from the parameter)
#     "<path>=" / "<key>="  {value: label} for that field's options
#     _computed            record fields the builder computes (never inputs) the schema does not mark
#     _inputs              fields the schema calls computed but the builder still requires as input
#     _params.<param>      schema: JSON-Schema snippet for a parameter the record schema does not hold
#                          upstream: method id (or {select_by, methods}) when the parameter IS another
#                          method's whole record
#     _workflow_only       recipe id -- the method's inputs are other steps' outputs; no hand form
# tests/unit/test_method_form.py fails when a visible field or option has no Chinese label, or when a
# form cannot produce input the real builder accepts.

_provenance: &provenance
  $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"
_evidence_refs: &evidence_refs
  type: array
  items: {type: string, pattern: "^E-[0-9]+$"}

methods:
  systems.iceberg_model:   # the four questions of docs/mockups/iceberg-result-mock.html
    events: {label: "① 事件：發生了什麼？", hint: "一件具體的事，有時間、有數字；跟上次比多少。"}
    patterns: {label: "② 模式：以前發生過嗎？多常？跟什麼一起出現？", hint: "一再發生的型態：多久一次、什麼時候特別多。這是線索，不是原因。"}
    structures: {label: "③ 結構：什麼流程、規則、人力安排在製造它？", hint: "寫制度，不寫某個人：順序、時間分配、表單、權責。"}
    mental_models: {label: "④ 心智模型：哪個沒說出口的假設撐住這些結構？", hint: "常藏在口頭禪裡；用引號寫一句話，自己的假設也要寫。"}
  framing.five_w_one_h:
    topic: {label: 要釐清的主題, hint: 這六個面向共同在問的那一件事。}
    dimensions: {label: 六何（5W1H）, hint: 每一列：知道答案就選「已知」並寫下來；還不知道就選「未知」，可以寫缺什麼資訊。系統會自動列出資訊缺口。}
    "dimensions.dimension=":
      WHO: Who（何人）：主角、參與者或對象是誰
      WHAT: What（何事）：發生了什麼事、要做什麼或討論什麼
      WHEN: When（何時）：發生的時間、期限或進度
      WHERE: Where（何地）：發生的地點、場所或範圍
      WHY: Why（為何）：背後的原因、目的或動機
      HOW: How（如何）：執行的步驟、方法、過程或解法
    dimensions.status: 這一面向目前
    dimensions.gap_note: 還缺什麼資訊（選填）

  challenge.fmea:
    _computed: [failure_modes.rpn, failure_modes.action_priority]

  decision.decision_tree:
    _computed: [expected_value, optimal_branch_label]
    "node_type=": {decision: 決策節點, chance: 機率節點, terminal: 終點節點}

  epistemic.assumption_registry:
    _computed: [entries.is_critical_assumption]

  strategy.tows:
    _computed: [pairings.pairing_type]

  devops_sre.stress_test:
    # the builder requires the caller's own recovered verdict and refuses it when it disagrees with the computed one
    _inputs: [recovery.recovered]

  jurisdiction.compliance_gap_analysis:
    _params:
      gap_annotations:
        schema:
          type: array
          items:
            type: object
            required: [control_id, severity, plan]
            properties:
              control_id: {type: string}
              severity: {type: string, enum: [low, medium, high, critical]}
              plan: {type: string}

  representation.concept_graph_view:
    _params:
      source_relations:
        schema:
          type: array
          items:
            type: object
            required: [relation_id, relation_type, provenance_ref]
            properties:
              relation_id: {type: string}
              relation_type: {type: string}
              provenance_ref: {type: string}

  representation.timeline_view:
    _params:
      events:
        schema:
          type: array
          items:
            type: object
            required: [event_id, event_time]
            properties:
              event_id: {type: string}
              event_time: {type: number}  # the builder sorts on a real number (ordinal or timestamp), not a date string

  security.security_control_mapping:
    _params:
      source_record:
        upstream:
          select_by: source_record_type
          methods: {stride: security.stride, linddun: security.linddun}

  strategy.swot:
    _params:
      knowledge_set:
        schema:
          type: array
          minItems: 1
          items: {$ref: "ai-lego://specs/evidence/evidence.schema.yaml"}

  decision.eisenhower_matrix:
    _params:
      subject: {schema: {type: string}}
      tasks:
        schema:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, label, urgency, importance]
            properties:
              id: {type: string}
              label: {type: string}
              urgency: {type: number}
              importance: {type: number}
      urgency_scale:
        schema: &eisenhower_scale
          type: object
          required: [min, max]
          properties:
            min: {type: number}
            max: {type: number}
      importance_scale: {schema: *eisenhower_scale}
      urgency_threshold: {schema: {type: number}}
      importance_threshold: {schema: {type: number}}

  divergent.reverse_brainstorming:
    _params:
      problem_statement: {schema: {type: string}}
      worsening_ideas:
        schema:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, text, provenance]
            properties:
              id: {type: string}
              text: {type: string}
              provenance: *provenance
      inversions:
        schema:
          type: array
          items:
            type: object
            required: [worsening_idea_ref, inverted_solution, provenance]
            properties:
              worsening_idea_ref: {type: string}
              inverted_solution: {type: string}
              provenance: *provenance

  strategy.lean_canvas:
    _params:
      blocks:
        schema:
          type: array
          prefixItems:
            - &lean_block {type: object, required: [block, content, provenance], properties: {block: {const: PROBLEM}, content: {type: string}, provenance: *provenance, supporting_evidence_refs: *evidence_refs}}
            - {<<: *lean_block, properties: {block: {const: CUSTOMER_SEGMENTS}, content: {type: string}, provenance: *provenance, supporting_evidence_refs: *evidence_refs}}
            - {<<: *lean_block, properties: {block: {const: UNIQUE_VALUE_PROPOSITION}, content: {type: string}, provenance: *provenance, supporting_evidence_refs: *evidence_refs}}
            - {<<: *lean_block, properties: {block: {const: SOLUTION}, content: {type: string}, provenance: *provenance, supporting_evidence_refs: *evidence_refs}}
            - {<<: *lean_block, properties: {block: {const: CHANNELS}, content: {type: string}, provenance: *provenance, supporting_evidence_refs: *evidence_refs}}
            - {<<: *lean_block, properties: {block: {const: REVENUE_STREAMS}, content: {type: string}, provenance: *provenance, supporting_evidence_refs: *evidence_refs}}
            - {<<: *lean_block, properties: {block: {const: COST_STRUCTURE}, content: {type: string}, provenance: *provenance, supporting_evidence_refs: *evidence_refs}}
            - {<<: *lean_block, properties: {block: {const: KEY_METRICS}, content: {type: string}, provenance: *provenance, supporting_evidence_refs: *evidence_refs}}
            - {<<: *lean_block, properties: {block: {const: UNFAIR_ADVANTAGE}, content: {type: string}, provenance: *provenance, supporting_evidence_refs: *evidence_refs}}

  research.reporting_guideline_checklist:
    # official item wording is compared verbatim by the builder: rows come from the catalog, the user only drafts
    _reference_variant:
      file: reference-data/reporting-guidelines.reference.yaml
      collection: guidelines
      discriminator: guideline_id
      option_label: name
      constants: {guideline_citation: citation}
      rows:
        param: items
        source: items
        row_key: item_id
        row_label: requirement_text
        constants: {requirement_text: requirement_text}
        fields:
          # the builder's own not-yet-drafted placeholder convention (_PLACEHOLDER_PREFIX)
          drafted_content: {type: string, default: "TBD:"}
          status: {type: string, enum: [NOT_STARTED, DRAFTED, NOT_APPLICABLE], default: NOT_STARTED}

  evidence.triangulation:
    _workflow_only: research-qualitative-v1

  research.qualitative_coding:
    _workflow_only: research-qualitative-v1


open_questions:
  - id: "OQ-BACKLOG-1"
    question: >
      Now that all 4 Tier 0 entries are `contract_status: complete` in this
      file, should method-inventory.yaml's own per-document catalog rows
      (which independently track has_contract/contract_status per citation
      context, e.g. root_cause.fishbone's EC L742 row still reads
      has_contract:false even though this backlog and Atlas's own L433 row
      both say true) be reconciled into a single consistent has_contract
      value per method, or is per-document-citation tracking intentionally
      independent of the method's overall contract status?
    owner: "operator, or a future session with explicit write scope over method-inventory.yaml (this task's scope was building methods/contracts/ and updating THIS backlog file, not re-annotating that registry)"
    blocks: "nothing in this file's own validity -- this backlog is the authoritative Tier 0/1/2 tracker per MACHINE_READABLE_SPEC_PLAN.md §4, independent of method-inventory.yaml's own per-citation has_contract bookkeeping"


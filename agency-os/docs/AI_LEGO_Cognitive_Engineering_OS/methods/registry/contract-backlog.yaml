# Tier 2 -- remaining pending methods, policy + one worked example only
# =============================================================================
tier_2:
  policy: >
    **CORRECTED 2026-08-29 (Codex cross-cutting review, CONFIRMED finding #4;
    field name corrected again same day, critic review MAJOR finding #4)**:
    the Tier 2 set is the UNION of two disjoint sources, not method-inventory.yaml
    alone: (a) every entry in methods/registry/method-inventory.yaml keyed by
    its `name` field (NOT `method_id` — that field does not exist anywhere in
    method-inventory.yaml; its 289 entries are keyed by `name`, with only 13
    additionally carrying a `machine_id`) with `contract_status: pending` that
    is NOT listed under tier_0 or assigned to tier_1 above, PLUS (b) every
    entry under `explicit_entries` below (which DOES use `method_id`, matching
    tier_0's own field name — the two registries intentionally use different
    join-key field names, `name` vs `method_id`, see the standalone note
    below). The two sources are disjoint by construction: `explicit_entries` exists precisely
    for ADR-mandated methods (like `finance.financial_assumptions`) that do
    NOT appear in method-inventory.yaml at all (verified by grep: zero hits),
    because Atlas never catalogued them (no domain-pack content exists yet).
    A compiler that reads ONLY the method-inventory.yaml rule and ignores
    `explicit_entries` would silently drop the ADR-008-mandated Finance gap —
    this is the exact failure mode the original wording (below, superseded)
    did not rule out. Both sources MUST be read together to get the true
    Tier 2 set; method-inventory.yaml is still not re-enumerated verbatim
    here (that would duplicate its own contract_status field), but
    `explicit_entries` below is never optional or supplementary-only.
  original_policy_superseded: >
    Every method_id in methods/registry/method-inventory.yaml with
    `contract_status: pending` that is NOT listed under tier_0 or assigned to
    tier_1 above is Tier 2 by default. Tier 2 methods are not individually
    enumerated in this file (see file-level description for why: it would
    duplicate method-inventory.yaml's own contract_status field with zero
    added information). Cross-reference method-inventory.yaml directly to
    enumerate the current Tier 2 set. [This omitted `explicit_entries` from
    the stated rule — see correction above.]
  join_key_note: >
    method-inventory.yaml's 289 entries are keyed by `name` (always present)
    and optionally `machine_id` (only 13 entries carry it — where `name`
    itself isn't already a clean bare `<family>.<name>` identifier). This
    file's `tier_0`/`explicit_entries` blocks use `method_id` as their own
    key field, matching ADR-005's grammar directly. A compiler implementing
    "Tier 2 = method-inventory.yaml pending entries" MUST join on
    method-inventory.yaml's `name` field, not on a `method_id` field that
    does not exist there — this was a real bug (critic review MAJOR
    finding #4, 2026-08-29) that would have silently produced an EMPTY Tier 2
    set if implemented literally as first (mis-)written.
  entry_count_at_time_of_writing: 285
  entry_count_basis: >
    284 from method-inventory.yaml (289 total catalog entries - 2
    has_contract:true (Tier 0 complete) - 2 Tier 0 pending (strategy.swot,
    evidence.triangulation, matched by machine_id, counting each of
    root_cause.fishbone's 2 appearances as excluded) = 284) PLUS 1 from
    `explicit_entries` below (finance.financial_assumptions, which does NOT
    appear in method-inventory.yaml — verified by grep, zero hits — so it is
    additive, not already counted in the 284) = **285 total**. The plan's own
    text says "260+" as an estimate, not an exact figure — 285 is not a
    contradiction of that estimate, just this task's precise count against
    the now-migrated registry plus the one ADR-mandated addition.
  gating_status_code: "PLANNING_BLOCKED_METHOD_CONTRACT_REQUIRED"
  gating_status_code_source: "specs/execution/status-codes.schema.yaml (status: NEW_PROPOSED_2026-08-29)"
  gating_behavior: >
    If the Method Selection Engine is asked to select a method whose
    contract_status is `pending`, it MUST fail-closed and return
    PLANNING_BLOCKED_METHOD_CONTRACT_REQUIRED rather than silently guessing
    compatibility from narrative-only fields -- modeled on Master Plan's
    existing PLANNING_BLOCKED_METHOD_ATLAS_REQUIRED "missing precondition ->
    stop" pattern (see status-codes.schema.yaml's design_lineage note for that
    entry).
  worked_example:
    # Lifted verbatim from MACHINE_READABLE_SPEC_PLAN.md §4's own record-format
    # illustration (L263-266) -- an example the plan itself already committed
    # to text, not a method this task independently selected for Tier 2.
    method_id: "association.mind_map"
    contract_status: pending
    tier: 2
    note: >
      As given by the plan's own example block. NAMING CAVEAT (same class as
      strategy.swot above): method-inventory.yaml's Atlas F04 association row
      for "Mind Map" (L257, Atlas L410) records `machine_id:
      "method.association.mind_map"` -- the pre-ADR-005 prefixed form. The
      plan's own example already uses the ADR-005-correct bare form
      (`association.mind_map`), which is reproduced here unchanged; the older
      `method.association.mind_map` form in method-inventory.yaml is left
      as-is per that file's migration-not-re-cataloging scope.
  explicit_entries:
    # These are NOT a re-enumeration of the Tier 2 pool (that stays a policy
    # pointer, per this file's description). Each entry here was individually
    # mandated, by exact method_id/contract_status/tier/note, by a prior
    # ACCEPTED ADR that names THIS file by path -- found via this task's R4
    # bughunt grep across agency-os/docs/AI_LEGO_Cognitive_Engineering_OS for
    # "contract-backlog" before writing this file. Omitting it would mean
    # building this file without honoring a decision already on the books.
    - method_id: "finance.financial_assumptions"
      contract_status: pending
      tier: 2
      note: "見 ADR-008，P1-CONFLICT-4；Business Planning Mode 非目前選定 MVP 切片"
      mandated_by: "docs/adr/ADR-008-business-planning-recipe-method-gap.md Migration step 4 (L107), Status: ACCEPTED (2026-08-29)"
      mandate_verbatim: >
        "待 Phase 3 建立 methods/registry/contract-backlog.yaml
        （MACHINE_READABLE_SPEC_PLAN.md §2.7 已規劃但尚未建立）時，補一筆條目：
        method_id: finance.financial_assumptions, contract_status: pending,
        tier: 2, note: 見 ADR-008，P1-CONFLICT-4；Business Planning Mode
        非目前選定 MVP 切片——這一步不阻塞本 ADR 的加註修法，屬於後續銜接，
        本 ADR 僅記錄建議、不代為建立該檔案。"
      caveat: >
        This method_id does not appear anywhere in
        methods/registry/method-inventory.yaml -- it names a gap (no Atlas
        finance domain pack exists yet for this method), not a catalogued
        entry, matching ADR-008's own framing (P1-CONFLICT-4: Master Plan §43's
        flagship Business Planning Recipe references a method that does not
        exist in the Atlas). Recorded here exactly as ADR-008 Migration step 4
        specifies, not cross-checked against method-inventory.yaml because
        there is nothing there to check against.


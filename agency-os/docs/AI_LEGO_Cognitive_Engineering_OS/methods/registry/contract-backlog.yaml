$id: "ai-lego://methods/registry/contract-backlog.yaml"
title: Atlas Method Contract Backlog
version: "1.0.0"
status: ACTIVE

description: >
  Per-method tracking table for the Atlas Method Contract backfill strategy
  defined in docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §4 ("Atlas Method
  Contract 補齊策略", resolving P1-GAP-AI-7). Of the 289 method/lens/primitive
  entries catalogued in methods/registry/method-inventory.yaml, only 2 carry a
  real structured contract today (`has_contract: true` / `contract_status:
  complete`); the remaining 287 have only narrative fields, which the Method
  Selection Engine's Compatibility Check cannot mechanically evaluate. §4
  explicitly rules out backfilling all 289 at once (Phase 5's MVP vertical
  slice -- Learning/Research/Business -- is still `NOT_STARTED` per Program
  Plan §9, so a full backfill now would write contracts for methods that may
  never be exercised, and the work volume alone would exceed the rest of
  Phase 3's deliverables combined) and instead prescribes 3 tiers. This file
  is the tracking table for that 3-tier strategy; it does not itself contain
  any method.schema.yaml contract content.

  This file records ONLY what this task actually verified or was explicitly
  told not to guess -- it does not fabricate a Tier 1 list or enumerate all
  284 Tier 2 entries as individual records here. method-inventory.yaml already
  carries a `contract_status` field per entry (this file's sibling, built in
  the same task); duplicating all 284 `pending` entries into a second flat
  list here would be pure restatement with zero new information and would
  itself become a second source of truth to keep in sync -- the kind of
  duplication AGENTS.md R0 asks every design to avoid. What Tier 2 actually
  needs beyond method-inventory.yaml's existing field is the *policy*
  (fail-closed via a status code) applied when one of those pending methods is
  selected, which is recorded below as a rule plus one worked example lifted
  verbatim from the plan itself, not invented here.

source_of_truth_for:
  - "docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §4 (L240-266, 3-tier Atlas Method Contract backfill strategy) -- this file IS the tracking table that section calls for"
  - "docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §2.7 row 2 (L168, contract-backlog.yaml purpose/dependencies)"

decided_by: >
  docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §4 (status: READY, no ADR
  blocks Tier 0/2 population; Tier 1 is explicitly deferred pending a Phase 5
  decision that is Round-2/operator scope, not this file's). The
  PLANNING_BLOCKED_METHOD_CONTRACT_REQUIRED status code referenced by Tier 2
  is defined in specs/execution/status-codes.schema.yaml (status:
  NEW_PROPOSED_2026-08-29, proposed_by MACHINE_READABLE_SPEC_PLAN.md §4, not
  yet present in any mother document).

# =============================================================================
# Tier 0 -- Phase 3 immediate (plan estimate: ~5-10 methods)
# =============================================================================
# §4 names two groups for Tier 0: (a) the 2 methods that already have
# has_contract:true, to be rewritten in the new method.schema.yaml format as
# the template for every future contract; (b) methods Atlas/Master Plan
# repeatedly cite as teaching examples of "how this is used" -- if even the
# worked examples lack a real contract, the documents' own demonstrations are
# unverifiable. §4 names exactly 3 methods in group (b): root_cause.fishbone
# (already counted in group a), strategy.swot, and evidence.triangulation
# (Atlas §9/§24.1, Master Plan §8.4 / Workflow IR sample research.qualitative.v4).
# That gives 4 concrete Tier 0 methods -- within the plan's "~5-10" estimate,
# not a fixed count of 5-10 to pad out; no 5th-10th method is named anywhere
# in the plan text, so none is invented here.
tier_0:
  - method_id: "root_cause.fishbone"
    contract_status: complete
    tier: 0
    has_contract: true
    source:
      - "methods/registry/method-inventory.yaml: Fishbone / Ishikawa (Atlas F05 root_cause, L433) -- the has_contract:true, machine_id-bearing definition"
      - "methods/registry/method-inventory.yaml: root_cause.fishbone (Master Plan L742, example-only, Atlas-authoritative)"
    note: >
      One of the 2 pre-existing has_contract:true methods. §4 Tier 0 group (a):
      rewritten under the new cognitive/method.schema.yaml format as the
      template other contracts follow. **UPDATED (2026-08-29)**: the rewrite
      this note originally described as not-yet-done is now built --
      `methods/contracts/root_cause.fishbone.contract.yaml` is a literal
      transcription of Atlas §9's own worked LEGO Contract example
      (L987-1030), validated against cognitive/method.schema.yaml with
      jsonschema (0 errors). `contract_status: complete` continues to be
      accurate, now for both the pre-existing Phase 0/1 simplified record AND
      this new full-schema file.

  - method_id: "stakeholder.regulator"
    contract_status: complete
    tier: 0
    has_contract: true
    source:
      - "methods/registry/method-inventory.yaml: stakeholder.regulator lens (Atlas L1036, category: lens)"
    note: >
      The other of the 2 pre-existing has_contract:true methods. §4 Tier 0
      group (a). **UPDATED (2026-08-29)**:
      `methods/contracts/stakeholder.regulator.contract.yaml` is now built --
      a literal transcription of Atlas §9's Lens Contract example
      (L1032-1047), validated against cognitive/lens.schema.yaml#/lens (0
      errors). This is a Lens (LEGO dimension C), not a Method (dimension A)
      -- validated against a different schema than the other 3 Tier 0
      contracts in this same directory.

  - method_id: "strategy.swot"
    contract_status: complete
    tier: 0
    has_contract: true
    source:
      - "methods/registry/method-inventory.yaml: strategy.swot (Master Plan L746, example-only, Atlas-authoritative, typed example KnowledgeSet->SWOTAnalysis)"
      - "methods/contracts/strategy.swot.contract.yaml (built 2026-08-29, this task)"
    note: >
      §4 Tier 0 group (b): teaching example, referenced Atlas §9/§24.1 and
      Master Plan §8.4. **UPDATED (2026-08-29)**: `strategy.swot` -> complete
      -- `methods/contracts/strategy.swot.contract.yaml` is now built,
      assembling content from three separate Atlas locations (§11.7 protocol
      section, §4 primitive-composition formula, §14.1 legal/illegal
      transition example) since no single worked LEGO Contract block exists
      for SWOT the way Fishbone/stakeholder.regulator each had one -- see
      that file's own `open_questions.OQ-SWOT-2` for the honest disclosure of
      that assembly choice. Validated against cognitive/method.schema.yaml
      with jsonschema (0 errors). NAMING CAVEAT (unchanged): the Atlas
      document's own F08 strategy catalog entry for "SWOT"
      (method-inventory.yaml L409, Atlas L517) records `machine_id:
      "method.swot"`, which predates
      docs/adr/ADR-005-db-migration-recipe-and-method-id-grammar.md's Option B
      decision (ACCEPTED 2026-08-29): bare `<family>.<name>` grammar, no
      `method.` prefix. This backlog entry's `strategy.swot` (matching the new
      contract file's real `id`) is correct per ADR-005b; method-inventory.yaml's
      Atlas F08 row is deliberately left showing `method.swot` verbatim
      (migration, not re-cataloging, per that file's own stated policy) --
      this backlog entry being marked complete does NOT retroactively update
      that row's `has_contract`/`machine_id` fields, which remain out of this
      task's scope (see open_questions.OQ-BACKLOG-1 below).

  - method_id: "evidence.triangulation"
    contract_status: complete
    tier: 0
    has_contract: true
    source:
      - "methods/registry/method-inventory.yaml: evidence.triangulation (Master Plan L833, example-only, used in Workflow IR sample research.qualitative.v4)"
      - "methods/contracts/evidence.triangulation.contract.yaml (built 2026-08-29, this task)"
    note: >
      §4 Tier 0 group (b): teaching example. **UPDATED (2026-08-29)**:
      `evidence.triangulation` -> complete --
      `methods/contracts/evidence.triangulation.contract.yaml` is now built,
      but on GENUINELY THIN evidence (exhaustive grep of "triangulat" across
      all three mother documents returns exactly one structural hit, this
      same Master Plan §9 Workflow IR node -- no dedicated protocol section
      or primitive-composition formula exists anywhere in Atlas for this
      method, unlike strategy.swot). That file's `cognitive_primitives`,
      `purpose`, and `outputs` fields are Phase 3 compilation INFERENCES,
      individually flagged inline and in that file's own open_questions
      rather than presented with the same confidence as directly-cited
      content -- `contract_status: complete` here means "a real
      method.schema.yaml-conformant file now exists," not "every field is
      independently source-verified" the way root_cause.fishbone's is.
      Validated against cognitive/method.schema.yaml with jsonschema (0
      errors). No competing/older machine_id form was found for this method
      anywhere in method-inventory.yaml (unlike strategy.swot above), so no
      naming caveat applies here.

open_questions:
  - id: "OQ-BACKLOG-1"
    question: >
      Now that all 4 Tier 0 entries are `contract_status: complete` in this
      file, should method-inventory.yaml's own per-document catalog rows
      (which independently track has_contract/contract_status per citation
      context, e.g. root_cause.fishbone's EC L742 row still reads
      has_contract:false even though this backlog and Atlas's own L433 row
      both say true) be reconciled into a single consistent has_contract
      value per method, or is per-document-citation tracking intentionally
      independent of the method's overall contract status?
    owner: "operator, or a future session with explicit write scope over method-inventory.yaml (this task's scope was building methods/contracts/ and updating THIS backlog file, not re-annotating that registry)"
    blocks: "nothing in this file's own validity -- this backlog is the authoritative Tier 0/1/2 tracker per MACHINE_READABLE_SPEC_PLAN.md §4, independent of method-inventory.yaml's own per-citation has_contract bookkeeping"


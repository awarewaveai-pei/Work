    Read docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §4 in full (L240-266)
    and §2.7 (L163-169); Read docs/adr/ADR-005-db-migration-recipe-and-method-id-grammar.md
    in full, Grepped for "swot|triangulation|grammar|bare|<family>" to locate
    the Option B ruling; Read specs/execution/status-codes.schema.yaml's
    PLANNING_BLOCKED_METHOD_CONTRACT_REQUIRED entry (L322-355) in full; ran a
    python/PyYAML load of the sibling method-inventory.yaml to programmatically
    cross-check machine_id values and count the Tier 2 pool (284) rather than
    hand-counting; Grepped agency-os/docs/AI_LEGO_Cognitive_Engineering_OS for
    "contract-backlog" before writing this file (R4/BUGHUNT scope) and found
    ADR-008 Migration step 4 mandates one specific Tier 2 entry
    (finance.financial_assumptions) by exact field values -- added under
    tier_2.explicit_entries rather than silently omitted.
  claims_this_file_does_NOT_make:
    - "That a method.schema.yaml contract file was written for any method in this task -- none was; only this tracking table."
    - "That Tier 1's method list has been decided -- it has not; see tier_1.status."
    - "That all 284 Tier 2 methods are listed individually here -- they are not; see tier_2.policy. Only ADR-008's one explicitly-mandated entry is listed under tier_2.explicit_entries."

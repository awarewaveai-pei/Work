$id: "ai-lego://methods/registry/contract-backlog.yaml"
title: Atlas Method Contract Backlog
version: "1.0.0"
status: ACTIVE

description: >
  Per-method tracking table for the Atlas Method Contract backfill strategy
  defined in docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §4 ("Atlas Method
  Contract 補齊策略", resolving P1-GAP-AI-7). Of the 289 method/lens/primitive
  entries catalogued in methods/registry/method-inventory.yaml, only 2 carry a
  real structured contract today (`has_contract: true` / `contract_status:
  complete`); the remaining 287 have only narrative fields, which the Method
  Selection Engine's Compatibility Check cannot mechanically evaluate. §4
  explicitly rules out backfilling all 289 at once (Phase 5's MVP vertical
  slice -- Learning/Research/Business -- is still `NOT_STARTED` per Program
  Plan §9, so a full backfill now would write contracts for methods that may
  never be exercised, and the work volume alone would exceed the rest of
  Phase 3's deliverables combined) and instead prescribes 3 tiers. This file
  is the tracking table for that 3-tier strategy; it does not itself contain
  any method.schema.yaml contract content.

  **Authoring standard (2026-09-06 operator directive)**: any new Tier 1
  entry from here on follows `../METHOD_ATLAS_SLICE_LEAN_STANDARD.md` --
  real citations/dedup-check/two-layer invariants/tests stay mandatory;
  the long prose (`compilation_decisions` reasoning paragraphs,
  `open_questions` essays, a standalone per-slice doc, per-slice full
  regression runs) is cut. Read that file before writing a new contract.

  This file records ONLY what this task actually verified or was explicitly
  told not to guess -- it does not fabricate a Tier 1 list or enumerate all
  284 Tier 2 entries as individual records here. method-inventory.yaml already
  carries a `contract_status` field per entry (this file's sibling, built in
  the same task); duplicating all 284 `pending` entries into a second flat
  list here would be pure restatement with zero new information and would
  itself become a second source of truth to keep in sync -- the kind of
  duplication AGENTS.md R0 asks every design to avoid. What Tier 2 actually
  needs beyond method-inventory.yaml's existing field is the *policy*
  (fail-closed via a status code) applied when one of those pending methods is
  selected, which is recorded below as a rule plus one worked example lifted
  verbatim from the plan itself, not invented here.

source_of_truth_for:
  - "docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §4 (L240-266, 3-tier Atlas Method Contract backfill strategy) -- this file IS the tracking table that section calls for"
  - "docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §2.7 row 2 (L168, contract-backlog.yaml purpose/dependencies)"

decided_by: >
  docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §4 (status: READY, no ADR
  blocks Tier 0/2 population; Tier 1 is explicitly deferred pending a Phase 5
  decision that is Round-2/operator scope, not this file's). The
  PLANNING_BLOCKED_METHOD_CONTRACT_REQUIRED status code referenced by Tier 2
  is defined in specs/execution/status-codes.schema.yaml (status:
  NEW_PROPOSED_2026-08-29, proposed_by MACHINE_READABLE_SPEC_PLAN.md §4, not
  yet present in any mother document).


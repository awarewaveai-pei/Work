# EC section 94 category: secrets
#
# PLACEMENT NOTE: EC section 94 (Test Paths) names a `secrets/` subdirectory
# under tests/governance/ai-execution/ (already created empty via mkdir, per
# the literal mother-document layout). This fixture's CONTENT could not be
# written inside that directory: this repo's own
# mcp/claude-userlevel/hooks/rules/sensitive-file-block.js hook
# unconditionally blocks any Write/Edit whose path contains "/secrets/"
# (pattern `/\.(env|pem|key)$|\/secrets\/|credentials/`, no override
# mechanism, by design -- it exists to stop real credential material from
# being committed). That is a legitimate security control this file should
# not route around, even though this specific write is a schema-conformance
# test fixture with no real secret in it. Rather than edit the hook or
# bypass it, this fixture lives one level up, at
# tests/governance/ai-execution/secrets-category-fixture.fixtures.yaml,
# and the `secrets/` directory stays empty (present for EC section 94
# layout completeness; a future runtime test suite can place real content
# there once it exists to write it, at which point the hook's block on that
# specific write would need a deliberate, human-approved exception -- not
# something this Wave should silently arrange).
schema_id: "ai-lego://specs/security/log-redaction-token.schema.yaml"
target_ref: ""
category: secrets
description: >
  HONEST SUBSTITUTION, recorded rather than papered over: no schema in this
  corpus governs secret/API-key/credential handling specifically (that is
  policies/security/'s SKELETON_ONLY territory per
  MACHINE_READABLE_SPEC_PLAN.md section 2.9 -- P1-GAP-SEC-1/2, awaiting
  operator IdP/standard selection). The closest already-built real
  mechanism that touches "secrets" is log-redaction-token.schema.yaml: a
  one-way HMAC token standing in for a sensitive value inside log output,
  so the underlying secret/personal-data value never appears in plaintext
  logs. This demonstrates that mechanism, not a full secrets-management
  golden scenario.
valid:
  - name: valid_redaction_token
    instance:
      token_alg: "HMAC-SHA256"
      hmac_key_ref: "ai-lego://specs/security/key-vault-lifecycle.schema.yaml#/definitions/hmac_signing_key_policy"
      classification_tag: "Confidential"
      tenant_scope: "tenant-acme-2026"
      token: "a3f5e8c9d1b2a4f6e8c9d1b2a4f6e8c9d1b2a4f6e8c9d1b2a4f6e8c9d1b2a4f6"
invalid:
  - name: token_not_hex64
    instance:
      token_alg: "HMAC-SHA256"
      hmac_key_ref: "ai-lego://specs/security/key-vault-lifecycle.schema.yaml#/definitions/hmac_signing_key_policy"
      classification_tag: "Confidential"
      tenant_scope: "tenant-acme-2026"
      token: "not-a-real-hmac-token"
    reason: "token must match pattern ^[a-f0-9]{64}$ (a real HMAC-SHA256 hex digest) -- a placeholder string would silently defeat the whole redaction guarantee by never actually matching the real hash on lookup"

open_questions:
  - id: "OQ-GOLDEN-SECRETS-1"
    question: "Should a dedicated credential/API-key-lifecycle schema exist under policies/security/ (currently SKELETON_ONLY) covering rotation/revocation/scoping, distinct from log-redaction-token.schema.yaml's narrower log-output-masking purpose?"
    owner: "operator, via P1-GAP-SEC-1/2 resolution"
    blocks: "nothing in this fixture's own validity"

schema_id: "ai-lego://policies/privacy/data-deletion.policy.yaml"
target_ref: ""
description: >
  Exercises the policy-layer content on top of the embedded EC §31 pipeline
  ($ref into specs/execution/data-deletion.schema.yaml#/deletion_request):
  the allOf/if/then branch-conditional requirement/prohibition of
  key_destruction_evidence ($ref into specs/security/
  key-vault-lifecycle.schema.yaml#/definitions/key_destruction_record), the
  const-enforced A4 authority_level_required, and the DEFINED/OPEN_QUESTION
  gating of sla.default_response_window_days.
valid:
  - name: crypto_shred_with_key_destruction_evidence
    instance:
      trigger:
        authorization_pathway:
          flow: "Agent -> Intent -> Policy Engine -> Permission Check -> Human Approval / Auto Rule -> Execution"
          source: >-
            Master Plan §65 Agent ≠ Authority (L2744-2769); already
            formalized for agent_action DELETE by
            policies/ai-execution/forbidden-actions.yaml#/seed_content,
            which itself soft-references this suite's
            data-deletion.schema.yaml Authorization step as the
            DSAR-specific instantiation of this same mediated path.
          direct_agent_execution_forbidden: true
        authority_level_required: "A4"
        initiating_role:
          status: SKELETON_ONLY
          gap_description: >-
            WHICH concrete human role/request-type may exercise or grant
            the A4 authority this pipeline requires is not decided by any
            mother document, ADR, or this file — it is the same open
            question specs/execution/authority.schema.yaml's
            role_to_authority_mapping already records as SKELETON_ONLY
            (P1-GAP-SEC-6, open_questions.OQ-AUTH-1). This file
            deliberately does not fork that gap into a second,
            deletion-specific copy.
          entries: []
      sla:
        status: OPEN_QUESTION
        default_response_window_days: null
        jurisdiction_dependent: true
        operational_incident_remediation_window_example:
          applies_to: >-
            rollback.scenarios.operational_key_vault_incident remediation
            target ONLY (specs/execution/data-deletion.schema.yaml#/rollback
            and specs/security/key-vault-lifecycle.schema.yaml#/definitions/rollback_scenario)
            — NOT this policy's general per-request SLA.
          citation: "GDPR Art. 12(3): one month, extendable once (cited as an illustrative example, not a chosen universal constant)."
          source: "ADR-002 Migration/Rollback, Codex-revised, L139: \"如 GDPR Art. 12(3) 一個月，可延長一次\"."
      deletion_pipeline:
        request_id: "DEL-2026-000001"
        deletion_type: "personal_data_crypto_shred"
        subject_id: "subj-abc123"
        requested_at: "2026-08-29T10:00:00Z"

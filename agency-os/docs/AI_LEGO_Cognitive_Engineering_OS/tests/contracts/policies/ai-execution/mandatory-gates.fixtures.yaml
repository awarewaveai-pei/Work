schema_id: "ai-lego://policies/ai-execution/mandatory-gates.yaml"
target_ref: ""
description: >
  mandatory-gates.yaml is PROVISIONAL (status field) -- its `gate_ref` value
  space is TBD_PENDING_ROUND2_ADR (bare string, no enum) and no fake
  resolved gate_id list is invented anywhere below. Root $refs
  `#/mandatory_gate_rules`: an open-ended array (minItems: 1 only, no
  contains/coverage guard -- unlike the closed-set siblings, more rules are
  expected once Round 2 ADR resolves OQ-10). This fixture validates the
  parts of `mandatory_gate_rule` that ARE decided: `rule_id` pattern,
  `action` enum, the locally-owned closed `gate_concept_id` enum
  ([HUMAN_REVIEW_CLASS] only -- deliberately not an open taxonomy so this
  file cannot become an unreviewed second gate registry), and `risk_tier_in`
  items via the $ref'd risk_tier enum.

valid:
  - name: real_grounded_rule
    instance:
      - rule_id: "MGATE-R3-R4-HUMAN-REVIEW"
        condition: "risk_tier IN ['R3', 'R4']"
        action: REQUIRE_HUMAN_REVIEW
        risk_tier_in: [R3, R4]
        gate_ref: "TBD_PENDING_ROUND2_ADR"
        gate_concept: HUMAN_REVIEW_CLASS
        source: "execution/risk-tier.schema.yaml tiers.R3.required_actions (Human Approval), tiers.R4.required_actions (Explicit Human Authority)."
        mother_doc_text: null
  - name: minimal_rule_without_optional_fields
    instance:
      - rule_id: "MGATE-TEST-MINIMAL"
        condition: "risk_tier IN ['R2']"
        action: ALLOW
        risk_tier_in: [R2]
        gate_ref: "TBD_PENDING_ROUND2_ADR"
        source: "test fixture -- structural validity only, proving gate_concept and mother_doc_text are genuinely optional (no default surfacing as a required-field error)."

invalid:
  - name: rule_id_pattern_violation
    instance:
      - rule_id: "GATE-001"
        condition: "risk_tier IN ['R3', 'R4']"
        action: REQUIRE_HUMAN_REVIEW
        risk_tier_in: [R3, R4]
        gate_ref: "TBD_PENDING_ROUND2_ADR"
        source: "test fixture"
    reason: >
      `rule_id` requires `pattern: "^MGATE-"` -- "GATE-001" does not start
      with that prefix.
  - name: risk_tier_in_invalid_enum_value
    instance:
      - rule_id: "MGATE-TEST-BAD-TIER"
        condition: "risk_tier IN ['R5']"
        action: REQUIRE_HUMAN_REVIEW
        risk_tier_in: [R5]
        gate_ref: "TBD_PENDING_ROUND2_ADR"
        source: "test fixture"
    reason: >
      `risk_tier_in` items $ref
      `execution/risk-tier.schema.yaml#/risk_tier`, a closed
      enum [R0,R1,R2,R3,R4] -- "R5" is not a member.
  - name: gate_concept_invented_second_taxonomy_value
    instance:
      - rule_id: "MGATE-TEST-ROLLBACK"
        condition: "risk_tier IN ['R4']"
        action: REQUIRE_HUMAN_REVIEW
        risk_tier_in: [R4]
        gate_ref: "TBD_PENDING_ROUND2_ADR"
        gate_concept: ROLLBACK_CLASS
        source: "test fixture"
    reason: >
      `gate_concept` $refs `#/definitions/gate_concept_id`, whose enum is
      deliberately closed to `[HUMAN_REVIEW_CLASS]` only -- OQ-MGATE-2
      explicitly declined to add a Rollback/Recovery-class rule this Wave
      (2-of-3 candidate convergence, weaker than the 3-of-3 basis
      HUMAN_REVIEW_CLASS used). "ROLLBACK_CLASS" would silently promote that
      declined rule into the schema's accepted vocabulary, exactly the
      "unreviewed second gate taxonomy" this closed enum exists to prevent.
  - name: missing_required_source_field
    instance:
      - rule_id: "MGATE-TEST-NO-SOURCE"
        condition: "risk_tier IN ['R3', 'R4']"
        action: REQUIRE_HUMAN_REVIEW
        risk_tier_in: [R3, R4]
        gate_ref: "TBD_PENDING_ROUND2_ADR"
    reason: >
      `mandatory_gate_rule` requires
      `[rule_id, condition, action, risk_tier_in, gate_ref, source]` --
      `source` (the citation grounding this rule's condition side) is
      omitted entirely.

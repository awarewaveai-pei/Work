schema_id: "ai-lego://policies/ai-execution/release-policy.yaml"
target_ref: "#/release_gate_requirement"
description: >
  release-policy.yaml is `status: ACTIVE` (upgraded 2026-08-30 from
  `PROVISIONAL` — see file header). `release_gate_requirement.scope` was a
  single-value enum `[TBD_PENDING_ROUND2_ADR]` until 2026-08-30; it is now
  RESOLVED by `docs/adr/ADR-011-platform-gate-ownership-and-unification.md`
  into a structured object with two required fields (`always_required`,
  `conditionally_required`), each a `const` pointer into
  `gate.schema.yaml#/gate_catalog/global` and
  `mandatory-gates.yaml#/mandatory_gate_rules` respectively. This fixture
  validates both the still-decided literal fields (`condition`, `action`,
  `gate_rules_source`, `required_status`) and the now-resolved `scope`
  object shape — this is a BREAKING schema change from the pre-2026-08-30
  fixture (the old bare-string `scope: TBD_PENDING_ROUND2_ADR` fixtures no
  longer validate, since `scope` changed type from string to object).

valid:
  - name: real_worked_example
    instance:
      condition: "NOT (every rule in policies/ai-execution/mandatory-gates.yaml#/mandatory_gate_rules that applies to this task has reached an acceptable Final Status per required_status below)"
      action: DENY
      gate_rules_source: "ai-lego://policies/ai-execution/mandatory-gates.yaml#/grounded_rules/rules"
      required_status: [PASS, PASS_WITH_APPROVED_RISK]
      scope:
        always_required: "ai-lego://specs/execution/gate.schema.yaml#/gate_catalog/global"
        conditionally_required: "ai-lego://policies/ai-execution/mandatory-gates.yaml#/grounded_rules/rules"
  - name: single_status_minimal_array
    instance:
      condition: "NOT (every rule in policies/ai-execution/mandatory-gates.yaml#/mandatory_gate_rules that applies to this task has reached an acceptable Final Status per required_status below)"
      action: DENY
      gate_rules_source: "ai-lego://policies/ai-execution/mandatory-gates.yaml#/grounded_rules/rules"
      required_status: [PASS]
      scope:
        always_required: "ai-lego://specs/execution/gate.schema.yaml#/gate_catalog/global"
        conditionally_required: "ai-lego://policies/ai-execution/mandatory-gates.yaml#/grounded_rules/rules"

invalid:
  - name: action_not_deny
    instance:
      condition: "NOT (every rule in policies/ai-execution/mandatory-gates.yaml#/mandatory_gate_rules that applies to this task has reached an acceptable Final Status per required_status below)"
      action: ALLOW
      gate_rules_source: "ai-lego://policies/ai-execution/mandatory-gates.yaml#/grounded_rules/rules"
      required_status: [PASS, PASS_WITH_APPROVED_RISK]
      scope:
        always_required: "ai-lego://specs/execution/gate.schema.yaml#/gate_catalog/global"
        conditionally_required: "ai-lego://policies/ai-execution/mandatory-gates.yaml#/grounded_rules/rules"
    reason: >
      `action` is `const: DENY` -- the release_gate_requirement's function
      is to DENY the STAGED RELEASE transition when `condition` holds
      (Master Plan §64's first worked-example shape), not REQUIRE_HUMAN_
      REVIEW or ALLOW. "ALLOW" violates the const.
  - name: condition_paraphrased_not_verbatim
    instance:
      condition: "Deny release unless all mandatory gates passed"
      action: DENY
      gate_rules_source: "ai-lego://policies/ai-execution/mandatory-gates.yaml#/grounded_rules/rules"
      required_status: [PASS, PASS_WITH_APPROVED_RISK]
      scope:
        always_required: "ai-lego://specs/execution/gate.schema.yaml#/gate_catalog/global"
        conditionally_required: "ai-lego://policies/ai-execution/mandatory-gates.yaml#/grounded_rules/rules"
    reason: >
      `condition` is `const` with the exact predicate string "NOT (every
      rule in policies/ai-execution/mandatory-gates.yaml#/mandatory_gate_
      rules that applies to this task has reached an acceptable Final
      Status per required_status below)" -- a paraphrase, even a faithful
      one, does not satisfy a `const` (exact string equality) constraint.
  - name: required_status_invalid_enum_value
    instance:
      condition: "NOT (every rule in policies/ai-execution/mandatory-gates.yaml#/mandatory_gate_rules that applies to this task has reached an acceptable Final Status per required_status below)"
      action: DENY
      gate_rules_source: "ai-lego://policies/ai-execution/mandatory-gates.yaml#/grounded_rules/rules"
      required_status: [SUCCESS]
      scope:
        always_required: "ai-lego://specs/execution/gate.schema.yaml#/gate_catalog/global"
        conditionally_required: "ai-lego://policies/ai-execution/mandatory-gates.yaml#/grounded_rules/rules"
    reason: >
      `required_status` items $ref
      `status-codes.schema.yaml#/reference_vocabulary/final_status/schema`,
      whose enum is [PASS, PASS_WITH_APPROVED_RISK, BLOCKED, FAILED,
      NEEDS_HUMAN_REVIEW, ROLLED_BACK, PARTIAL_SUCCESS] -- "SUCCESS" is not
      a member (it is not the EC §70 Final Status vocabulary this file
      deliberately chose over the narrower per-gate status enum).
  - name: scope_still_bare_tbd_string_pre_2026-08-30_shape
    instance:
      condition: "NOT (every rule in policies/ai-execution/mandatory-gates.yaml#/mandatory_gate_rules that applies to this task has reached an acceptable Final Status per required_status below)"
      action: DENY
      gate_rules_source: "ai-lego://policies/ai-execution/mandatory-gates.yaml#/grounded_rules/rules"
      required_status: [PASS]
      scope: TBD_PENDING_ROUND2_ADR
    reason: >
      RESOLVED 2026-08-30 by ADR-011: `scope` changed type from a
      single-value string enum to a required object with
      `always_required`/`conditionally_required` const fields (see
      `release-policy.yaml#/release_gate_requirement/properties/scope`).
      A bare string, even the pre-resolution placeholder value itself, now
      fails on `type` (expected object, got string) before any const check
      is even reached. This fixture intentionally keeps the pre-2026-08-30
      shape as a regression check: it proves the schema migration is a real
      breaking change an old producer's stale output would be caught by,
      not a silently-widened field that still happens to accept the old
      shape.
  - name: scope_object_wrong_always_required_value
    instance:
      condition: "NOT (every rule in policies/ai-execution/mandatory-gates.yaml#/mandatory_gate_rules that applies to this task has reached an acceptable Final Status per required_status below)"
      action: DENY
      gate_rules_source: "ai-lego://policies/ai-execution/mandatory-gates.yaml#/grounded_rules/rules"
      required_status: [PASS]
      scope:
        always_required: "ai-lego://specs/execution/gate.schema.yaml#/gate_catalog/high_risk"
        conditionally_required: "ai-lego://policies/ai-execution/mandatory-gates.yaml#/grounded_rules/rules"
    reason: >
      `always_required` is `const:
      "ai-lego://specs/execution/gate.schema.yaml#/gate_catalog/global"` --
      it must point at the always-required Global 14-item set specifically,
      not the risk-tier-conditional `high_risk` set (which is what
      `conditionally_required`, via mandatory-gates.yaml, already covers).
      Swapping them would silently misrepresent the Global tier as
      conditional and vice versa -- exactly the "which tier is actually
      unconditional" ambiguity ADR-011's own `gate_catalog.global.
      description` exists to settle.

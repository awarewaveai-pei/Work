    reason: >
      Only 4 entries -- violates `minItems: 5`/`maxItems: 5` on
      `forbidden_actions`, AND the MODIFY_LOCKED_FACT `contains`/
      `minContains: 1` guard finds zero matches. Master Plan §65's list is a
      closed, exhaustive 5-verb set; dropping one verb is not a smaller
      valid policy, it is an incomplete one.

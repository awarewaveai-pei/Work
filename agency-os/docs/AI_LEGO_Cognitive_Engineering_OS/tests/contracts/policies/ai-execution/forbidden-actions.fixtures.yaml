schema_id: "ai-lego://policies/ai-execution/forbidden-actions.yaml"
target_ref: ""
description: >
  forbidden-actions.yaml's root $refs `#/forbidden_actions`: a CLOSED
  5-item array (minItems: 5, maxItems: 5) of `forbidden_action_rule`
  objects, with `allOf`/`contains`/`minContains: 1`/`maxContains: 1` guards
  requiring exactly one row per Master Plan §65 verb (DELETE, PUBLISH,
  DEPLOY, SEND, MODIFY_LOCKED_FACT). Unlike authority.yaml's
  forbidden_actions_ref guards, `agent_action` here is already a required
  field of `forbidden_action_rule` (required: [agent_action, condition,
  action, mediated_path, mother_doc_text]), so no item can omit it -- the
  MAJ-2-style vacuous-omission bypass is not structurally possible for this
  file's own contains clauses even though they likewise lack an explicit
  `required:` inside the contains schema. This fixture instead exercises the
  exact-one-per-verb (`maxContains: 1`) duplication case, the `const: DENY`
  verdict, and the `agent_action_id` enum.

valid:
  - name: real_5_row_transcription
    instance:
      - agent_action: DELETE
        condition: "Agent attempts to execute this action directly, bypassing Policy Engine -> Permission Check -> Human Approval / Auto Rule (Master Plan §65 flow, L2748-2760)."
        action: DENY
        mediated_path: "Agent -> Intent -> Policy Engine -> Permission Check -> Human Approval / Auto Rule -> Execution"
        mechanism_ref: "specs/execution/data-deletion.schema.yaml (soft reference)."
        mother_doc_text: "Delete"
      - agent_action: PUBLISH
        condition: "Agent attempts to execute this action directly, bypassing Policy Engine -> Permission Check -> Human Approval / Auto Rule (Master Plan §65 flow, L2748-2760)."
        action: DENY
        mediated_path: "Agent -> Intent -> Policy Engine -> Permission Check -> Human Approval / Auto Rule -> Execution"
        mechanism_ref: null
        mother_doc_text: "Publish"
      - agent_action: DEPLOY
        condition: "Agent attempts to execute this action directly, bypassing Policy Engine -> Permission Check -> Human Approval / Auto Rule (Master Plan §65 flow, L2748-2760)."
        action: DENY
        mediated_path: "Agent -> Intent -> Policy Engine -> Permission Check -> Human Approval / Auto Rule -> Execution"
        mechanism_ref: "specs/execution/authority.schema.yaml#/levels/A4 (soft cross-reference)."
        mother_doc_text: "Deploy"
      - agent_action: SEND
        condition: "Agent attempts to execute this action directly, bypassing Policy Engine -> Permission Check -> Human Approval / Auto Rule (Master Plan §65 flow, L2748-2760)."
        action: DENY
        mediated_path: "Agent -> Intent -> Policy Engine -> Permission Check -> Human Approval / Auto Rule -> Execution"
        mechanism_ref: "specs/execution/authority.schema.yaml#/levels/A4 (soft cross-reference)."
        mother_doc_text: "Send"
      - agent_action: MODIFY_LOCKED_FACT
        condition: "Agent attempts to execute this action directly, bypassing Policy Engine -> Permission Check -> Human Approval / Auto Rule (Master Plan §65 flow, L2748-2760)."
        action: DENY
        mediated_path: "Agent -> Intent -> Policy Engine -> Permission Check -> Human Approval / Auto Rule -> Execution"
        mechanism_ref: "specs/governance/epistemic-label.schema.yaml#/definitions/locked (hard $ref-grade cross-reference)."
        mother_doc_text: "Modify Locked Fact"


      cvss_tiering: { kev_listed: { action: "BLOCK immediately", basis: "CISA Known Exploited Vulnerabilities catalog listing" }, critical_and_exploitable: { threshold: "CVSS >= 9.0 AND EPSS > 0.1", action: "BLOCK + 7-day SLA" }, high: { threshold: "CVSS 7.0-8.9", action: "WARN + 30-day SLA" }, below_high: { threshold: "CVSS < 7.0", action: "track only (no SLA)" }, rescan_requirement: { cadence: "scheduled re-scan of already-approved artifacts, not just at build time", reason: "a CVE's EPSS score can rise from low to high probability with no code change on this project's side -- 'passed once' is not 'passed forever'", interval_days: 30, owner: "SRE on-call rotation" } }

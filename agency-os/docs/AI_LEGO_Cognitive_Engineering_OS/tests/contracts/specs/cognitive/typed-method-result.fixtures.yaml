    instance:
      execution_id: "EX-2026-08-29-000042"
      task_id: "TASK-2026-000001"
      method_id: "root_cause.fishbone"
      method_version: "1.0.0"
      status: PASS
      evaluated_at: "2026-08-29T15:20:00Z"
      provenance:
        epistemic_type: HYPOTHESIS
        authorship_state: AI_GENERATED
      quality:
        provenance_required: true
        evidence_labeling_required: true
      outputs:
        - output_type: "CauseHypothesisSet"
          value: { id: "CHS-2026-08-29-000007" }
          hash: "a3f5c1e2b4d6f8a0c2e4b6d8f0a2c4e6b8d0f2a4c6e8b0d2f4a6c8e0b2d4f6a8"
      rollback_ref: null

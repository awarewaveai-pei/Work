schema_id: "ai-lego://specs/cognitive/typed-method-result.schema.yaml"
target_ref: ""
description: >
  Exercises TypedMethodResult's required fields, the `status` field's
  multi-hop $ref chain (this file -> execution/result.schema.yaml#/properties/status
  -> execution/status-codes.schema.yaml's 7-value EC §70 Final Status
  enum), the required top-level `provenance` (epistemic-label's universal
  content/claim mandate), and the `execution_id` ^EX- pattern.

valid:

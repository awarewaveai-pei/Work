invalid:
  - name: status_not_in_final_status_vocabulary
    instance:
      execution_id: "EX-2026-08-29-000100"
      method_id: "strategy.swot"
      method_version: "1.0.0"
      status: SUCCESS
      evaluated_at: "2026-08-29T16:05:00Z"
      provenance:
        epistemic_type: UNKNOWN
        authorship_state: AI_GENERATED
    reason: "status chains through execution/result.schema.yaml#/properties/status into status-codes.schema.yaml's 7-value EC §70 Final Status enum [PASS, PASS_WITH_APPROVED_RISK, BLOCKED, FAILED, NEEDS_HUMAN_REVIEW, ROLLED_BACK, PARTIAL_SUCCESS]; 'SUCCESS' is not one of them."
  - name: missing_required_top_level_provenance
    instance:
      execution_id: "EX-2026-08-29-000101"
      method_id: "strategy.swot"
      method_version: "1.0.0"
      status: PASS
      evaluated_at: "2026-08-29T16:10:00Z"
    reason: "provenance is REQUIRED at the top level (a TypedMethodResult is itself a claim under epistemic-label.schema.yaml's universal content/claim mandate) — entirely absent here."
  - name: execution_id_missing_EX_prefix
    instance:
      execution_id: "2026-08-29-000102"
      method_id: "strategy.swot"
      method_version: "1.0.0"
      status: PASS
      evaluated_at: "2026-08-29T16:15:00Z"
      provenance:
        epistemic_type: UNKNOWN
        authorship_state: AI_GENERATED
    reason: "execution_id must match pattern ^EX- (Atlas §16.3's join-key convention); '2026-08-29-000102' has no EX- prefix."

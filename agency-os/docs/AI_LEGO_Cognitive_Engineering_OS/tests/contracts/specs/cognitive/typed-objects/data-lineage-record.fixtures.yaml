      computation_provenance_ref: "ai_lego.compute.lineage.traversal.traces_to_source"
      provenance: {epistemic_type: CALCULATED_RESULT, authorship_state: AI_GENERATED}
    reason: "stage is enum [SOURCE, INGEST, TRANSFORM, DATASET, ANALYSIS_RUN, RESULT, CLAIM, PAPER_OR_DECISION] -- 'MODEL' (the table-row's own divergent vocabulary) is not a member of the diagram's own enum."

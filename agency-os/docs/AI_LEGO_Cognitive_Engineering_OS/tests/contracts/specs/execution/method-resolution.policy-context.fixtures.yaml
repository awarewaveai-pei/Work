schema_id: "ai-lego://specs/execution/method-resolution.schema.yaml"
target_ref: "#/resolved_selection_context"
description: >
  Exercises the 2026-08-29 policy_context/regulatory_exposure addition
  (P1-GAP-LEGAL-7, GLOBAL_JURISDICTION_PLAN.md §6) on top of
  resolved_selection_context's 7 required original-17 fields.
valid:
  - name: no_policy_signal_defaults_absent
    instance:
      goal_type: "assess_market_entry_feasibility"
      problem_type: strategic
      domain: ["market_entry"]
      jurisdiction_context: "us-federal"
      risk_tier: R1
      reversibility: high
      required_rigor: professional
  - name: high_regulatory_exposure_with_full_policy_context
    instance:
      goal_type: "assess_ai_regulation_compliance"
      problem_type: policy
      domain: ["compliance"]
      jurisdiction_context: "eu-west"
      risk_tier: R3
      reversibility: low
      required_rigor: board_grade
      policy_context:
        current_regulation_refs: ["LAW-EU-AI-ACT-01"]
        proposed_regulation_refs: []
        budget_context: {available: 500000, source: "operating_budget", cycle: "FY2027"}
        industrial_policy_tags: ["ai_sector"]
        tax_exposure: {present: false, refs: []}
        trade_exposure: {present: false, refs: []}
        sector_policy_refs: []
        privacy_exposure: {present: true}
        ai_regulation_exposure: ["LAW-EU-AI-ACT-01"]
        election_cycle_window: {start: null, end: null}
        geopolitical_refs: []
      regulatory_exposure: high
invalid:
  - name: bad_regulatory_exposure_enum_value
    instance:
      goal_type: "x"
      problem_type: strategic
      domain: ["x"]
      jurisdiction_context: "us-federal"
      risk_tier: R1
      reversibility: high
      required_rigor: professional
      regulatory_exposure: "very_high"
    reason: "regulatory_exposure enum is exactly [none, low, moderate, high] per GLOBAL_JURISDICTION_PLAN.md §6.2 -- 'very_high' is not a member."
  - name: tax_exposure_missing_required_present
    instance:
      goal_type: "x"
      problem_type: strategic
      domain: ["x"]
      jurisdiction_context: "us-federal"
      risk_tier: R1
      reversibility: high
      required_rigor: professional
      policy_context:
        tax_exposure: {refs: ["LAW-0001"]}
    reason: "policy_context.tax_exposure requires 'present' (boolean) -- an exposure object with only refs and no present flag is exactly the kind of ambiguous half-populated state {present: bool, refs: [...]} in §6.2's own worked example exists to prevent."
  - name: current_regulation_refs_wrong_prefix
    instance:
      goal_type: "x"
      problem_type: strategic
      domain: ["x"]
      jurisdiction_context: "us-federal"
      risk_tier: R1
      reversibility: high
      required_rigor: professional
      policy_context:
        current_regulation_refs: ["EU-AI-ACT-01"]
    reason: "current_regulation_refs items require the 'LAW-' prefix pattern (matching this corpus's established LAW-* legal-source-reference convention, e.g. ai-gateway-fallback.policy.yaml's obligation_ref) -- a bare id without the prefix is not a legal reference."

  values, each exactly once -- the same "uniqueItems alone insufficient" bug
  class this file's own comment documents, matching data-deletion.schema.yaml
  and deprecation-pipeline.schema.yaml's identical fix), the `final_status`
  hard $ref chain (handoff -> result.schema.yaml#/properties/status ->
  status-codes.schema.yaml's final_status enum), and the `handoff_id`/
  `task_id` patterns.

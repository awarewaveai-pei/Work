        - { name: "Repository / Commit", status: "OBSERVED", summary: "v20" }
      evidence_log: []
      drift:
        detected: false
    reason: "20 whole-object-unique entries (differing only by summary) all named 'Repository / Commit' satisfy uniqueItems+minItems:20+maxItems:20 but the allOf/contains/minContains/maxContains coverage-guard fails twice over: maxContains:1 for 'Repository / Commit' (20 occurrences) and minContains:1 for each of the other 19 canonical names (0 occurrences) -- the exact bypass this file's own comment documents as previously found and closed"
  - name: dimension_status_outside_enum
    instance:
      task_id: "TASK-2026-000013"
      reconstructed_at: "2026-08-29T15:00:00Z"

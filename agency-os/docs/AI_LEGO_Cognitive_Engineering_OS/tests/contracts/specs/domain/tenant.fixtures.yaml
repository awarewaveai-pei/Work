schema_id: "ai-lego://specs/domain/tenant.schema.yaml"
target_ref: ""
description: >
  Exercises the status enum, the data_residency_region lowercase-slug
  pattern, and the required-but-nullable deleted_at key (required to be
  PRESENT even though its legal value is null for most tenants -- omitting
  the key entirely is illegal, distinct from setting it to null).
valid:
  - name: active_tenant_deleted_at_null
    instance:
      tenant_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      legal_name: "Example Regulatory Agency"
      status: active
      home_jurisdiction: "jurisdiction-pack.eu-gdpr.v1"
      data_residency_region: "eu-west"
      encryption_root_key_ref: "kms.tenant-root.3fa85f64"
      created_at: "2026-08-29T00:00:00Z"
      deleted_at: null
  - name: offboarding_tenant
    instance:
      tenant_id: "9c858901-8a57-4791-81fe-4c455b099bc9"
      legal_name: "Former Client Corp"
      status: offboarding
      home_jurisdiction: "jurisdiction-pack.us-federal.v1"
      data_residency_region: "us-east"
      encryption_root_key_ref: "kms.tenant-root.9c858901"
      created_at: "2025-01-15T00:00:00Z"
      deleted_at: null
invalid:
  - name: status_not_in_enum
    instance:
      tenant_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      legal_name: "Example Regulatory Agency"
      status: pending
      home_jurisdiction: "jurisdiction-pack.eu-gdpr.v1"
      data_residency_region: "eu-west"
      encryption_root_key_ref: "kms.tenant-root.3fa85f64"
      created_at: "2026-08-29T00:00:00Z"
      deleted_at: null
    reason: "status enum is [active, suspended, offboarding, deleted] verbatim from ADR-003; 'pending' is not a legal value (and per this file's fail-closed design there is no default to fall back to)."
  - name: data_residency_region_uppercase_pattern_violation
    instance:
      tenant_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      legal_name: "Example Regulatory Agency"
      status: active
      home_jurisdiction: "jurisdiction-pack.eu-gdpr.v1"
      data_residency_region: "EU-WEST"
      encryption_root_key_ref: "kms.tenant-root.3fa85f64"
      created_at: "2026-08-29T00:00:00Z"
      deleted_at: null
    reason: "data_residency_region pattern ^[a-z][a-z0-9-]*$ requires a lowercase-starting slug; uppercase fails the pattern."
  - name: deleted_at_key_omitted_entirely
    instance:
      tenant_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      legal_name: "Example Regulatory Agency"
      status: active
      home_jurisdiction: "jurisdiction-pack.eu-gdpr.v1"
      data_residency_region: "eu-west"
      encryption_root_key_ref: "kms.tenant-root.3fa85f64"
      created_at: "2026-08-29T00:00:00Z"
    reason: "deleted_at is in the required key list (required-but-nullable per compilation_decisions) -- omitting the key entirely fails required even though null is itself a legal value for the key."

    detail: "The mandatory release-gate set differs materially between the Master Plan and the Atlas. Master Plan §158 Global Definition of Done requires 11 PASS items and for high risk adds ONLY `Human Specialist Review PASS` (L5923-5926). Atlas §22.1 Global Gate requires 14 PASS items (adds Evidence PASS, Reasoning PASS, Capacity PASS) and §22.2 High-risk Gate requires SIX additional items (Human Specialist Review, Counterevidence, Red Team, Independent Judge, Reversal Criteria, Recovery/Rollback Rehearsal). A high-risk deliverable that fully satisfies MP §158 fails Atlas §22.2 (no Red Team, no Counterevidence, no Recovery Rehearsal). Execution Contract §68 (L2250-2276) sides with the Atlas's larger set. Both MP and Atlas state their lists as 必須/要求 — they cannot both define 'done'."
    evidence:

  - id: "CROSS-T-3"
    type: "term_conflict"
    severity: "high"
    severity_source: "analyst_assessed"
    verdict: "CONFIRMED"
    independent_votes: 2
    detail: "The machine field risk_tier carries two incompatible enums. The Method Atlas selection_context defines risk_tier: low|medium|high|critical (L1077) and keys Mandatory Gate Injection on `risk_tier = critical` (L3599). The Execution Contract defines the five-level scheme R0–R4 (§8, L379–475) and puts risk_tier into the same task_context record (L374) that its Method Resolution flow feeds into the Atlas's Method Selection Engine. No mapping between {low,medium,high,critical} and {R0..R4} exists in any document, so a compiler cannot decide when Atlas mandatory gates (Red Team, Reversal Criteria, etc.) must be injected — the gate trigger value 'critical' is unexpressible in R0–R4 terms and vice versa."
    evidence:
      - file: "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md"
        line: 1077
        quote: "risk_tier: low|medium|high|critical"
      - file: "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md"
        line: 3599
        quote: "如果 `risk_tier = critical`："
      - file: "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md"
        line: 374
        quote: "risk_tier: ..."
      - file: "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md"
        line: 379
        quote: "# 8. Risk Tier"
    verdict_votes:
      - verdict: "CONFIRMED"
        reason: "Atlas L1077 'risk_tier: low|medium|high|critical' and L3599 '如果 `risk_tier = critical`：' exact. EC L374 task_context risk_tier (undeclared value domain, only occurrence in EC) and L379 '# 8. Risk Tier' (R0-R4 at L381-454) exact. Grep confirms no R0-R4 tokens in Atlas/MP and no low|medium|high|critical enum in EC — no mapping exists anywhere."
      - verdict: "CONFIRMED"
        reason: "Atlas L1077 'risk_tier: low|medium|high|critical' and L3599 '如果 `risk_tier = critical`：' exact. EC L374 'risk_tier: ...' (task_context, no value domain) and L379 '# 8. Risk Tier' (R0-R4 at L381-475) exact. Grep confirms zero R0-R4 references in the Atlas and zero low/medium/high/critical risk-tier enum in the EC or MP; no mapping anywhere. EC §14 (L705-717) pipes Task Context → Method Atlas → Method Selection Engine, so the gate-trigger incompatibility is real."

# AI LEGO OS — Phase 1 Gap Register
# Produced by 6 role-cluster lens agents (architecture/data, infra/ops/MLOps, security/privacy/IAM,
# AI/data-science/research, product/business/ops, legal/global/policy) sweeping the 3 mother specs
# against the full role x failure-mode matrix (Program Plan §5). Each agent cross-checked against
# verified-findings.yaml (71 Phase 0 items) and the cross-review artifacts before reporting — these
# are Claude-only, single-pass findings (NOT yet Codex-verified; unlike Phase 0's dual-verified set).
# 5 items originally reported as GAP were promoted to CONFLICT_REGISTER.yaml or DUPLICATION_REGISTER.yaml
# (cross-referenced below by their original cluster id) because they describe contradictory or
# duplicated normative content rather than pure absence.
# Phase 1 rule: REGISTERED, not fixed.
clusters:
  architecture_data:
    roles: [System Architect, Software Architect, Domain Architect, Data Architect, Database Engineer]
    gaps:
      - id: P1-GAP-ARCH-2
        severity: high
        role: Database Engineer / Data Architect
        title: "7 種異質儲存引擎宣告但無 system-of-record 或跨儲存一致性機制"
        detail: |
          MP §60 宣告 PostgreSQL/Object Storage/Vector Index/Graph Store/Event Store/Search Index/Time-series 七種儲存，
          僅一句「應用層透過 Repository Contract，不直接依賴資料庫」。Repository Contract 全文僅此一次出現，無 schema。
          全文搜尋 system of record / eventual consistency / distributed transaction / saga(跨儲存語境) / polyglot 皆缺席。
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md, line: 2610, quote: "PostgreSQL→Structured Metadata / Object Storage / Vector Index / Graph Store / Event Store / Search Index / Time-series"}
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md, line: 2635, quote: "應用層透過 Repository Contract，不直接依賴資料庫。"}
        consequence: "同一 Claim 物件同時活在 Postgres row + Graph Store node，沒有 authoritative 來源、寫入順序或和解機制；並發更新跨三個儲存系統無法原子化，會產生跨儲存資料不一致而無人偵測。"
      - id: P1-GAP-ARCH-3
        severity: high
        role: Database Engineer
        title: "Disaster Recovery 只給 2/7 個儲存系統的 RPO/RTO"
        detail: "§74 只覆蓋 PostgreSQL(Core metadata, RPO<5min) 與 Object Storage(Artifacts, RPO<24h)；Vector Index/Graph Store/Event Store/Search Index/Time-series 全數缺席，且 DR 流程無跨儲存 Reconciliation 步驟。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md, line: 2995, quote: "Core metadata: RPO < 5 min / Artifacts: RPO < 24h / Recovery: RTO < 2h"}
        consequence: "災難復原後 Postgres 還原到事故前 5 分鐘，但 Graph Store 無對應 RPO 保證，可能還原到不同時間點——出現 Postgres Claim row 指向 Graph Store 不存在或版本不同的節點，且無偵測機制。"
      - id: P1-GAP-ARCH-4
        severity: medium
        role: Database Engineer
        title: "並發寫入控制只有一句宣告，無隔離等級或跨儲存機制"
        detail: "「同一檔案/migration/production resource 的 concurrent write 必須 lock 或序列化」——無 isolation level/optimistic lock/pessimistic lock/serializable/race condition 相關定義。配合 P1-GAP-ARCH-2 的 7-store 架構，跨儲存序列化機制完全空白。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md, line: 2010, quote: "同一檔案 / migration / production resource 的 concurrent write 必須 lock 或序列化。"}
        consequence: "兩個 Agent 併發改同一 Claim（跨 Postgres+Graph+Vector）該怎麼序列化沒有機制描述，實作者無從選擇分散式鎖/DB鎖/樂觀版本控制。"
      - id: P1-GAP-ARCH-5
        severity: medium
        role: Database Engineer
        title: "Vector Index schema evolution（換 embedding model）無遷移程序"
        detail: "Embedding Version 只是 AI/Model Change Contract 要記錄的欄位，非可執行的 backfill/dual-index/cutover 程序。EC §28 的 Lock Duration/Foreign Keys 等評估項目對向量重建完全不適用。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md, line: 1425, quote: "Embedding Version"}
        consequence: "換 embedding model 是常見營運事件，但無對應遷移契約——這類遷移目前無契約可循。"
      - id: P1-GAP-ARCH-7
        severity: medium
        role: Data Architect
        title: "Knowledge/Evidence Graph 溯源鏈與 Data Lab/Reproducible Research 溯源鏈互不相交"
        detail: |
          §13 溯源鏈：SOURCE→EVIDENCE→CLAIM→INFERENCE→ASSUMPTION→DECISION；
          §37 Reproducible Research 溯源鏈：Paper Sentence→Result→AnalysisRun→Code→Dataset→Original Source（Dataset 直接連回 Source，跳過 Evidence/Claim）。
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md, line: 1046, quote: "SOURCE↓EVIDENCE↓CLAIM↓INFERENCE↓ASSUMPTION↓DECISION"}
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md, line: 1942, quote: "Paper Sentence→Result→AnalysisRun→Code→Dataset→Original Source"}
        consequence: "Evidence 被標記 quarantine 或撤回時，不會自動使依賴同一 Source 的 Dataset/AnalysisRun 失效——「Evidence 已有問題但論文用的 Dataset 不知道」的知識不一致。"
      - id: P1-GAP-ARCH-9
        severity: medium
        role: Data Architect
        title: "Retention/Deletion 衝突（多種 Hold 類型）無預設優先順序"
        detail: "Legal Hold/Regulatory Hold/Research Hold/Contractual Hold/User Deletion Request 衝突時只交給「Policy Engine 決定，並產生理由」——同等重要（甚至更高風險）的場景卻沒有像 document-authority-map 的 8 層 conflict_resolution_order 那樣的預設順序。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md, line: 4718, quote: "資料不能只用固定「30 天刪除」。...衝突時 Policy Engine 決定，並產生理由。"}
        consequence: "User Deletion Request 撞上 Research Hold 時，實作者可能依「方便」判斷——文件明文提醒過這個陷阱（不得選對自己方便的一條），但這條原則沒有延伸到資料刪除場景。"
      - id: P1-GAP-ARCH-10
        severity: high
        role: Domain Architect
        title: "20 個 /modules 目錄無對應到 22 個 Domain Model 物件的擁有權/依賴方向/context map"
        detail: "全文搜尋 owns/depends on/dependency graph/shared kernel/anti-corruption/context map/circular 皆 0 命中。範例矛盾：Simulation 獨立擁有頂層 /modules/simulation/，但 Experiment 被埋在三層深的 /modules/analytics/experiments/，定位邏輯不一致無說明。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md, line: 3188, quote: "/modules/canvas, knowledge, research, business, learning, brainstorm, analytics..."}
        consequence: "沒有 bounded context 契約，任兩個模組都可能宣稱擁有同一個 Domain 物件的寫入權（如 Decision 出現在多處），造成多模組並發寫入同一實體卻無仲裁規則——與 P1-GAP-ARCH-2/4 的並發問題同根。"
      - id: P1-GAP-ARCH-13
        severity: medium
        role: System Architect / Software Architect
        title: "「避免過早拆微服務」無量化門檻"
        detail: "「真正需要時再抽離 Service」——全文搜尋 extract service/split service/scale threshold/team size/traffic threshold/Conway 皆 0 命中，無客觀信號可判斷。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md, line: 2794, quote: "初期不要一開始拆成上百 Microservices。... 真正需要時再抽離 Service。"}
        consequence: "任何工程師都能引用同一句話合理化「現在就該拆」或「永遠不用拆」，判準等於不存在。"
    risks_ref: "此 cluster 無獨立 RISK 項目（consequence 已內嵌於各 gap）"
  infra_ops_mlops:
    roles: [DevOps Engineer, SRE, Cloud Architect, Local/Offline Architect, Network Engineer, MLOps Engineer]
    gaps:
      - id: P1-GAP-INFRA-1
        severity: high
        role: DevOps/SRE
        title: "Incident Mode 無 on-call/paging/escalation policy 或嚴重度分級"
        detail: "§55 定義完整生命週期 state machine（Declare→Contain→Freeze Evidence→...），但無 SEV1-3 等分級、無誰有權 Declare 的定義。全庫搜尋 on-call/pager/PagerDuty/incident commander/SEVx/war room/status page 皆 0 命中。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md, line: 1912, quote: "# 55. Incident Mode ... Declare ↓ Contain ↓ Freeze Evidence ..."}
        consequence: "高風險 incident 可能無人接手，卡在流程第一步。"
      - id: P1-GAP-INFRA-2
        severity: medium
        role: DevOps/SRE
        title: "SLA 是販售項目但全文無量化 SLI/SLO/SLA 數字"
        detail: "MP 把 SLA 列為 Enterprise/Sovereign edition 販售項目，唯一數字化的 RTO/RPO 明確標示為「範例」。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md, line: 571, quote: "SLA"}
        consequence: "業務對 Enterprise 客戶簽約承諾 SLA，工程端沒有對應的可驗證數字基線。"
      - id: P1-GAP-INFRA-3
        severity: medium
        role: SRE
        title: "備份還原演練無固定週期"
        detail: "只要求「高風險 data change 前」才需 restore drill evidence；唯一「定期」測試（30-year Replacement Drill）未給出具體週期。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md, line: 3041, quote: "高風險 data change 前：restore drill evidence"}
        consequence: "若長期沒觸發高風險變更，備份可能數月至數年未被實測還原過——「有備份沒驗證能不能救」的典型失效模式。"
      - id: P1-GAP-INFRA-4
        severity: medium
        role: SRE / Durability
        title: "無 WORM/immutable backup/anti-ransomware 保護要求"
        detail: "系統對「原始域資料」有強烈 Immutable-first 原則，但備份本身的存取權限、保留鎖定、與正式環境寫入權限的隔離未被要求。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md, line: 2570, quote: "# 58. Immutable-first ... 所有檔案 Content-addressed"}
        consequence: "被入侵的高權限帳號理論上可同時刪除主要 store 與其備份，DR 計畫失去保護力。"
      - id: P1-GAP-INFRA-5
        severity: high
        role: MLOps Engineer
        title: "AI Gateway Fallback 無 circuit breaker/健康檢查頻率/failover 觸發條件"
        detail: "宣稱「單一供應商故障不會癱瘓整個系統」但無 circuit breaker/health check/熔斷機制定義；Method Atlas 本身也無 Circuit Breaker 條目。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md, line: 622, quote: "單一供應商故障不會癱瘓整個系統"}
        consequence: "「Fallback」只是敘事性目標，實際 provider outage 發生時系統行為不可預測。"
      - id: P1-GAP-INFRA-6
        severity: medium
        role: MLOps Engineer
        title: "model_profile 字串無 Model Registry 元件"
        detail: "AI/Model Change Contract 要求記錄 Provider/Model Identifier/Model Profile 等欄位，但無地方定義這個字串解析到哪個 provider/endpoint/weights hash/棄用日期。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md, line: 2165, quote: "model_profile: ..."}
        consequence: "Champion/Challenger 升級或 rollback 時，model_profile 字串無法被獨立查證——Replay 與 30-year Replacement Drill 都因缺 registry 難以精確執行。"
      - id: P1-GAP-INFRA-7
        severity: high
        role: Local/Offline Architect
        title: "Local 離線硬體需求無下限規格"
        detail: "§5.2 要求 Local LLM/Embedding/RAG/ML 必須支援完全離線，但「GPU」一詞三份文件合計僅出現一次，無 VRAM/RAM/磁碟空間/CPU-only 推論延遲下限。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md, line: 435, quote: "必須支援完全離線：Local LLM ... ML"}
        consequence: "買 Local Pro 或 Air-gapped Enterprise 版的客戶拿到「必須離線可用」的能力清單，卻沒人告訴他們跑得動需要什麼硬體。"
      - id: P1-GAP-INFRA-8
        severity: high
        role: Local/Offline Architect / Supply-chain
        title: "Air-gapped 環境下 Local Model 更新無簽章/驗證/來源證明機制"
        detail: "系統對法規內容有 Signed Offline Law Packs、對授權有 Signed Offline License，但對 Local Model 更新完全沒有對應機制。§83 Offline Execution 只說「local model 可替換」，無簽章/checksum/provenance 字樣。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md, line: 2588, quote: "Offline：... local model 可替換。"}
        consequence: "Air-gapped 客戶更新本地模型時，AI 模型是整個系統中唯一沒有簽章驗證要求的可執行內容。"
      - id: P1-GAP-INFRA-9
        severity: medium
        role: Local/Offline Architect
        title: "Cloud↔Local 可攜無雙向合併/衝突解決策略"
        detail: "§76 只定義單向搬遷（Cloud→Export→Local 或反向），沒有處理「離線編輯期間雲端版本也被改動」的合併/衝突解決（CRDT、last-write-wins 皆未提及），儘管系統明確支援多裝置協作。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md, line: 3026, quote: "Cloud → Export → Local / Local → Encrypted Package → Cloud"}
        consequence: "使用者離線工作後重新連網，若雲端同時被其他協作者變更，系統行為未定義——可能靜默覆蓋，違反「人類內容不能被 AI 靜默覆蓋」精神。"
      - id: P1-GAP-INFRA-10
        severity: high
        role: Cloud Architect
        title: "Capability Availability Matrix 只涵蓋法律管轄權，未涵蓋部署模式(Cloud/Local/Hybrid)可用性"
        detail: "唯一的 capability 可用性矩陣範圍限定 capability × jurisdiction；MP 其餘 150+ 個編號能力完全沒有對應的 offline 可用性判定（完全可用/降級/不可用）。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md, line: 5508, quote: "capability_availability: ... jurisdiction: ... status: prohibited"}
        consequence: "產品定位聲稱三種部署模式並存，但沒有系統化方式回答「這個功能離線時是完全可用/降級/不可用」，功能對等承諾沒有可驗證規格支撐。"
      - id: P1-GAP-INFRA-11
        severity: medium
        role: Cloud Architect
        title: "無 auto-scaling/capacity planning/load balancing 策略"
        detail: "Queue Lag 被列為受監控指標，但無任何機制消費這個指標觸發擴縮容。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md, line: 2794, quote: "Modular Monolith Core + Isolated Workers + Event Bus"}
        consequence: "可觀測性存在但沒有形成閉環，流量尖峰時只能靠人工介入。"
      - id: P1-GAP-INFRA-12
        severity: high
        role: Network Engineer
        title: "傳輸層安全機制全文件零提及"
        detail: "近千行的 Global Jurisdiction & Compliance Plane 鉅細靡遺處理跨境資料傳輸法律機制，但 TLS/mTLS/VPN/Private Link/VPC/IPsec/WireGuard 全庫零命中；Sovereign Regional Cell 畫出 EU/US/APAC 三個 Cell 卻無網路層隔離機制說明。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md, line: 4405, quote: "EU Cell US Cell APAC Cell / Local DB Local DB Local DB / Local KMS Local KMS Local KMS"}
        consequence: "資料落地政策講得極細，但沒有網路層規格保證政策在物理/邏輯網路上真的被強制執行——稽核時無法回答「資料真的沒有經過非法域網段」。"
    risks_ref: "見 RISK_REGISTER.yaml P1-RISK-INFRA-1（cost explosion, MLOps Engineer）"
  security_privacy_iam:
    roles: [Security Architect, Privacy Engineer, IAM Engineer]
    gaps:
      - id: P1-GAP-SEC-1
        severity: high
        role: Security Architect
        title: "Zero Trust 只有階段名稱流程圖，無協定/標準綁定"
        detail: "無 IdP/OIDC provider、無 workload identity 標準(SPIFFE/mTLS)、無 Policy Decision Point 引擎名稱(OPA/Rego/Cedar)。整節只有紅線(禁止項)，無正向機制定義。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md, line: 2668, quote: "Identity ↓ Workload Identity ↓ Mutual Authentication ↓ Short-lived Credentials ↓ Policy Decision ↓ Resource Access"}
        consequence: "實作團隊各自選 IdP/token 格式，30 年後不同 cell 用不同身分協定，跨 cell 身分聯邦時無共同標準可比對。"
        resolution: >
          RESOLVED 2026-08-30 by docs/adr/ADR-016-zero-trust-workload-identity-and-pdp-selection.md. All 3
          sub-gaps closed: workload identity standard = cloud-native mTLS (SPIFFE deferred with named
          reconsideration triggers); PDP engine = Cedar; IdP/OIDC provider = Zitadel (self-hosted). The IdP
          sub-gap was correctly held open at first ratification (genuine new vendor spend/lock-in decision,
          AGENTS.md R0 "取捨影響產品方向" stop condition) and closed the same day by the operator's own
          explicit real-time decision in conversation ("偏好自架", then Zitadel over Keycloak) -- not derived
          by Claude. Machine-readable: policies/security/zero-trust.policy.yaml (status: ACTIVE).
      - id: P1-GAP-SEC-2
        severity: high
        role: Security Architect
        title: "Supply Chain Security 無具體標準版本"
        detail: "SBOM 格式(SPDX/CycloneDX)、簽章機制(Sigstore/cosign/GPG)、SLSA provenance 等級、漏洞掃描門檻全部未定義。全文搜尋 SLSA/cosign/sigstore/SPDX/CycloneDX/CVSS/CVE 皆 0 命中。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md, line: 2772, quote: "Source ↓ Signed Commit ↓ CI ↓ SBOM ↓ Dependency Scan ↓ Artifact Signing ↓ Verified Deployment"}
        consequence: "「Verified Deployment」在合規稽核時無可驗證標準對照——SolarWinds 級供應鏈事件事後最常見的稽核缺口類型。"
        resolution: >
          RESOLVED 2026-08-30 by docs/adr/ADR-015-supply-chain-security-tooling-selection.md. All 5 sub-decisions
          ratified: SBOM=CycloneDX primary, signing=Sigstore/cosign keyless, SLSA=L2 immediate/L3 at Phase 4
          CI/CD build-out, vuln scan=Grype+Dependabot with explicit reconciliation rule, CVSS/EPSS/KEV layered
          tiering with scheduled re-scan requirement. Machine-readable:
          policies/security/supply-chain-security.policy.yaml. No new vendor spend/lock-in in any of the 5
          items -- open standards / OSS tools / already-included GitHub platform features only.
      - id: P1-GAP-SEC-3
        severity: high
        role: IAM Engineer / Security Architect
        title: "Explicit Human Authority 無身分驗證強度要求"
        detail: "R3/R4 核准要求「誰算 human」沒有驗證機制——無核准當下的 step-up/MFA 要求，無核准與具體 action hash 綁定的簽章(non-repudiation)。EC:2031 只排除了「AI 冒充人」一種情境，沒堵住帳號被盜/session 被劫持的情境。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md, line: 470, quote: "R4 Explicit Human Authority"}
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md, line: 2031, quote: "第二個 AI 不是法律意義的人類 approval"}
        consequence: "攻擊者釣魚取得授權核准者 session 後可對破壞性操作按下核准，Audit Event 記錄「合法核准者身分」，稽核事後無法區分真人決策與帳號劫持。"
      - id: P1-GAP-SEC-4
        severity: medium
        role: Security Architect
        title: "Untrusted Content Contract 缺具體 sanitization 機制"
        detail: "無 untrusted span delimiter/tagging 方案、無防禦「工具鏈式間接注入」、無說明 untrusted 標籤能否在寫入 Knowledge Memory 後存活。File Parsing Safety 只列風險類別，無 parser allowlist 或 fail-open/fail-closed 說明。"
        evidence:
          - {file: AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md, line: 1370, quote: "Policy/System Instructions ≠ Retrieved Source Data"}
        consequence: "惡意 PDF 首次觸發的注入指令若成功寫入 Semantic Memory，之後任何任務讀取會把它當內部已驗證知識而非 UNTRUSTED DATA。"

        - [「每次都在週日晚上吵」是哪一層？, 模式：一再發生的型態，不是原因。]
        - [「沒有分工表，誰看到誰做」是哪一層？, 結構：是制度在製造模式。]
        - [「這種小事不用講」是哪一層？, 心智模型：沒說出口、撐住制度的信念。]
    read:
      how: <b>怎麼讀</b>先看三步讀法，再對照下面的九段；結果頁每段開頭只留一句，詳細讀法都在這裡。<b>你要做的</b>不用做；結果頁哪一段看不懂，回這個分頁找同一個編號。
      steps:
        - [① 先看結論與冰山圖, 一句話結論、三個發現；再看你填的四段話各在哪一層。]
        - [② 看圖表與四張卡, 趨勢圖、因果回饋圖、槓桿對比；四張卡同一格式：這層問什麼 → 你填了什麼 → 這代表什麼 → 在這層出手會怎樣。]
        - [③ 看總結、解決方案、下一步, 最有力的出手點在哪一層；三個方案比一比；90 天行動計畫與三個追蹤指標；接著做什麼，不做也可以。]
      short: 只有 30 秒？看 ① 的一句話和建議就夠。
      terms_label: 四個詞
      terms:
        - [事件, 這次發生的事]
        - [模式, 一再發生]
        - [結構, 為什麼一再]
        - [心智模型, 為什麼沒人改]
      rows:
        - [頁首, 上面是你填的四個格子（改了可以重跑），右上角「怎麼用？」開這堂課。狀態列說草稿還是已核准、資料有多少（你填的幾段、外部來源幾筆）、四層完整度、花費；資料少，結論的信心就低。]
        - [① 結論, 一句話＋三個發現，每個發現標信心（高／中／低）和理由；「改判條件」= 出現哪些證據就要改結論。最下面寫你自己的判斷（同意／部分同意／不同意）：你的原話才是紀錄，AI 寫的只是附掛。]
        - [② 冰山圖, 左邊是每層要回答的問題和你填的內容，右邊是在這層出手的方式；★ 是建議先出手的層。圖下的「資料厚度」說哪一層填得最薄；放錯層就回上面改，再執行一次。]
        - [③ 圖表分析, 三張圖各回答一個問題：趨勢（真的在變嗎）、因果迴路（是什麼在推）、槓桿（在哪一層出手最值得）。每張圖下有「怎麼看／看到／注意／來源」；標「示意」的圖要接上真實資料才算數。]
        - [④ 四層解讀, 四張卡同一格式：這層問 → 你填的 → 這代表 → 在這層出手（附槓桿：低／中低／高／最高）→ 對應 ⑦ 的方案 → 資料厚度。找出最薄的一層，之後補資料。]
        - [⑤ 總結, 三句話：問題在哪、先做哪層、還缺什麼（證據缺口）。缺口裡的資料你手上有，就回上面補、再執行一次。]
        - [⑥ 對照表, 一列一層：出手方式、時間取向、這層問的問題、你的案例、建議動作。越往下越慢越難，但越根本；四列都要有人負責，負責人填在 ⑦ 的 B 表。]
        - [⑦ 解決方案, A 三條路比一比 → B 排成 90 天行動計畫 → C 三個指標盯著、90 天後自動重跑。表裡的字：見效 = 多久看得到；成本 = 要投入什麼；持久度 = 會不會回彈；風險 = 最可能失敗的地方。目標數字由你定，系統只帶入現況。]
        - [⑧ 下一步, 旅程列是你在哪；每張卡寫做了會得到什麼、會自動帶入什麼、還要你填幾格。可以選一張、把建議的幾步串成工作流，或都不做。]
        - [⑨ 引註與核准, "[n] 是那句話的來源：「你的輸入」= 你填的原文，「外部來源」= 抓來的網頁（網址、抓取時間、指紋）。最下面：核准 = 成為正式紀錄；退回 = 寫原因重做，這一版保留；專家模式收著閘門表與 JSON。"]
    teach:
      how: <b>怎麼讀</b>其他分頁是學員版（5 分鐘自學）；這裡把同一堂課排成 45 分鐘課堂：流程、講稿要點、討論題、學員常錯、講義。<b>你要做的</b>只在你要教別人時展開；可整份匯出成講義與投影片大綱。
      flow:
        - [0–5, 破冰：每人說一件「最近一再發生」的事, 「認識」的「什麼時候用」]
        - [5–15, 講四層，例子換成學員的領域, 「認識」（切領域）]
        - [15–30, 分組把自己的案例填成四層；用好壞例當互評表, 「怎麼填」]
        - [30–40, 各組報告；其他組專門找「跳層」和「怪人」, 「怎麼填」的常見錯誤]
        - [40–45, 收尾：填不出的那一層就是要補資料的層；帶大家看一次結果頁；預告下一步工具, 「開始」卡、「看懂結果」、結果頁 ⑧]
      script:
        - 這是什麼：先問「你們最近有沒有一件事換了人、換了工具還是一直發生」，再給冰山圖。不要先講定義。
        - 四層：用「一次／一再／為什麼一再／為什麼沒人改」四個詞帶，每層停 30 秒讓學員對到自己的案例。
        - 做完的例子：只講「每往下一層，解法就不一樣」，不要解釋案例細節。
        - 怎麼填：把壞例投影出來，讓學員說哪裡缺，再翻出好例。
        - 常見錯誤：「怪人」和「跳層」一定親自示範一次錯的寫法。
        - 開始：告訴學員填不出來的層留白，工具會把它列成證據缺口，不是失敗。
      questions:
        - 你的案例裡，哪一層是你最不想寫的？為什麼？
        - 如果只能改一層，你選哪一層？三個月後怎麼知道有沒有用？
        - 你自己在這個系統裡的假設是什麼？寫進第四層了嗎？
      errors:
        - 把模式寫成原因 → 反問：「這件事多久一次？什麼時候特別多？」把它推回第 2 層。
        - 結構層寫人名 → 反問：「如果換一個人，還會發生嗎？」會，就是結構。
        - 第四層寫「態度有問題」 → 反問：「他們相信什麼，才會這樣安排？」要一句可以被否證的話。
      handout: 列印版講義 = 第 2 步四層表（學員領域版）＋第 4 步好壞例＋一張空白四格工作單；投影片大綱 = 六步各一頁＋冰山圖一頁。兩者都從這一頁匯出（匯出功能還在做）。
      note: 教材版和學員版由同一份工具資料生成（來源 [1]–[3]），改課文就同時改兩版。藝術反思工具的帶領腳本（Airtable 的「帶活動者提示用語」「時間分段」「停止活動訊號」）會直接進這一段。
    sources:
      - The Systems Thinking，「Iceberg Model」教學（定義 → 四層 → 例子 → 步驟 → 常見錯誤的課程結構；本課改寫，非轉載）
      - untools.co，「Iceberg Model」（定義與四層名稱；工具資料裡的權威網址）
      - NPC 冰山工作單（每層要回答的問題與介入動詞：回應／預測／設計／轉化）

# lessons v2 -- each method's lesson and the per-unit knowledge its result page shows (plan D17/D23/D25, I11 M1–M12).
# Rendered by COS/docs/mockups/lessonkit.py: the web app's lesson pages (lessons.generated.ts) and the result page's
# unit facts (toolsheets.generated.ts); systems.iceberg_model's lesson mock is rendered from here too. Every map keyed
# by domain holds exactly the active domains of methods/examples/domains.yaml. Text may carry inline HTML
# (<b>, <dfn>, <cite>); [n] cites the method's sources, numbered in order.
# v2 (handoff 2026-10-15「課 v2 設計」): a unit's `ask` is its ONE question -- the run form's label, the lesson and the
# result page's ②④⑥ all print it (tests/unit/test_method_form.py); 看例子 and the demo half of 看懂結果 are drawn from the
# tool's demo analyses (apps/cognitive-web/fixtures/demo), what each result card answers from
# methods/registry/result-page-sections.yaml -- so worked.cases, read.steps and read.rows are gone.
kind: lessons
version: v2
methods:
  systems.iceberg_model:
    minutes: 5
    outcomes: 分清四層、把一件事填成四段、看懂結果頁、知道什麼時候不該用
    start:
      new: 四個空格子，每格旁邊有提示和例子；按「執行分析」才開始
      demo:
        edd: 主動分享 6 → 2 人那個例子
        partner: 畫廊延後付款那個例子
        decision: 加開平日班那個例子
        ecom: 退貨率 12% 那個例子
        daily: 週日晚上吵架那個例子
      prepare:
        - 一件具體的事（時間、數字）
        - 過去半年左右的紀錄或數字（同一件事發生幾次）
        - 相關的流程、規則、人力安排
        - 你們開會時常常出現的那句話（信念通常藏在口頭禪裡）
    what:
      how: |-
        <b>怎麼讀</b>先讀三段文字，再看下面那張四層冰山：左邊是每層要問的問題，右邊是在那一層出手會得到什麼；結果頁用的是同一張圖，只是填上你的資料。<b>你要做的</b>不用做；只看「什麼時候不用」那一句：你的問題如果是一次性的意外，這個工具不適合，去最上面「開始」卡按第三顆按鈕。
      lead: 冰山浮在水面上的只有一小角。<b>問題也是</b>：你看到的是「發生了什麼事」，真正決定它一再發生的原因藏在水面下。
      body: |-
        冰山模型是一種<dfn title="Systems Thinking：把問題當成一個互相牽動的系統來看，而不是單一事件">系統思考</dfn>的工具：把一件事往下挖四層，從「發生什麼」挖到「大家心裡怎麼想」。挖得越深，能改的東西越根本 <cite>[2]</cite>。
      when: 什麼時候用：同一種問題一再出現、換人換工具都沒用、大家在互相怪罪的時候。什麼時候不用：一次性的意外、單純缺資料的問題 <cite>[1]</cite>。
      picture: |-
        <svg viewBox="0 0 1070 575" role="img" aria-label="冰山模型四層圖">
          <defs>
            <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fbe3d6"/><stop offset="0.2" stop-color="#cfe3f3"/><stop offset="0.5" stop-color="#5a93c4"/><stop offset="0.75" stop-color="#245b8a"/><stop offset="1" stop-color="#0b2a4a"/>
            </linearGradient>
            <clipPath id="berg"><path d="M550,150 L585,40 L620,85 L645,55 L690,150 L810,290 L780,420 L690,540 L560,540 L460,420 L420,290 Z"/></clipPath>
          </defs>
          <rect x="0" y="150" width="1070" height="425" class="water" opacity="0.55"/>
          <path d="M0,150 q20,-8 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0" fill="none" stroke="#7aa7cc" stroke-width="2.5"/>
          <line x1="30" y1="290" x2="1050" y2="290" stroke="#7aa7cc" stroke-dasharray="5 5"/>
          <line x1="30" y1="420" x2="1050" y2="420" stroke="#7aa7cc" stroke-dasharray="5 5"/>
          <path d="M550,150 L585,40 L620,85 L645,55 L690,150 L810,290 L780,420 L690,540 L560,540 L460,420 L420,290 Z" fill="url(#ice)" stroke="#1f3b5c" stroke-width="2"/>
          <g clip-path="url(#berg)">
            <line x1="400" y1="290" x2="840" y2="290" stroke="#fff" stroke-dasharray="4 4" opacity=".7"/>
            <line x1="400" y1="420" x2="840" y2="420" stroke="#fff" stroke-dasharray="4 4" opacity=".7"/>
          </g>
          <g font-weight="700" text-anchor="middle">
            <text class="tip" x="618" y="128" font-size="17">事件 Events</text>
            <text x="618" y="230" font-size="17" class="w">模式 Patterns</text>
            <text x="618" y="362" font-size="17" class="w">結構 Structures</text>
            <text x="618" y="490" font-size="17" class="w">心智模型 Mental Models</text>
          </g>
          <text x="30" y="62" font-size="15" font-weight="700">看得見：發生了什麼</text>
          <text x="30" y="172" font-size="15" font-weight="700">看不見：</text>
          <g font-size="14.5">
            <text x="30" y="96" font-weight="700">① 事件｜發生了什麼？</text>
            <text x="30" y="118" font-size="13" class="m">一件具體的事：時間、人數、數字</text>
            <text x="30" y="212" font-weight="700">② 模式｜以前發生過嗎？多常？跟什麼一起出現？</text>
            <text x="30" y="234" font-size="13" class="m">一直重複的模式（是線索，不是原因）</text>
            <text x="30" y="346" font-weight="700">③ 結構｜什麼流程、規則、人力安排在製造它？</text>
            <text x="30" y="368" font-size="13" class="m">製造模式的制度（寫制度，不寫某個人）</text>
            <text x="30" y="472" font-weight="700">④ 心智模型｜哪個沒說出口的假設撐住這些結構？</text>
            <text x="30" y="494" font-size="13" class="m">撐住制度的信念（常藏在口頭禪裡；自己的也要寫）</text>
          </g>
          <g font-size="14.5">
            <text x="830" y="96" font-weight="700">回應 React</text>
            <text x="830" y="118" font-size="13" class="m">當次有效，下次一樣</text>
            <text x="830" y="212" font-weight="700">預測 Anticipate</text>
            <text x="830" y="234" font-size="13" class="m">提早看到，不會阻止</text>
            <text x="830" y="346" font-weight="700">設計 Design</text>
            <text x="830" y="368" font-size="13" class="m">改流程、改規則 → 持久</text>
            <text x="830" y="472" font-weight="700">轉化 Transform</text>
            <text x="830" y="494" font-size="13" class="m">改信念、改角色 → 最根本</text>
            <text x="830" y="560" font-size="12" class="a">↓ 越往下：越難改，效果越大越持久</text>
          </g>
        </svg>
      can: 問題為什麼一再發生（哪一層在推）、先在哪一層出手最值得、接下來該做什麼。
      cant: 誰對誰錯；你填的內容以外的事實（除非接上資料蒐集）；數字目標由你定，AI 不替你定。
    units:
      title: 四層，各配一個你領域的例子
      how: |-
        <b>怎麼讀</b>先在分頁上面按你的領域，再從上往下看四層各一個例子；每層的「問」是你之後要回答的問題 <cite>[3]</cite>。<b>你要做的</b>按一個領域（每個分頁的例子都會跟著換）；把你自己的問題在心裡套進四層試一次。
      items:
        - key: events
          head: ① 事件 Events（看得見）
          ask: 發生了什麼？
          examples:
            edd: 第 6 次 session，8 人只有 2 人主動說自己的作品；第 1 次是 6 人。
            partner: 合作的畫廊這次又延後付款。
            decision: 這個月又有 5 位家長問能不能加開平日班。
            ecom: 這個月退貨率 12%，上個月 5%。
            daily: 這週又為了家事吵架。
          result: {name: 事件 Events, title: 事件 Events, short: 事件, seen: 看得見, time: 現在, when: 現在, mode: 回應 React, effect: 當下的因應, lasting: 短期}
        - key: patterns
          head: ② 模式 Patterns
          ask: 以前發生過嗎？多常？跟什麼一起出現？
          examples:
            edd: 三期都從第 4 次開始掉；帶領者先解讀作品的那幾次掉得最多；線上場更低。
            partner: 近一年每次展覽結束都延 30 到 60 天才付。
            decision: 每年暑假前詢問暴增，開學後又回落。
            ecom: 每次上新品後兩週退貨都衝高；尺寸類商品特別多；促銷檔期更嚴重。
            daily: 每次都在週日晚上。
          result: {name: 模式 Patterns, title: 模式與趨勢 Patterns & Trends, short: 模式, seen: 看不見, time: 過去到現在, when: 過去→現在, mode: 預測 Anticipate, effect: 看出趨勢, lasting: 提早看到}
        - key: structures
          head: ③ 結構 Structures
          ask: 什麼流程、規則、人力安排在製造它？
          examples:
            edd: 帶領者先講作品的意義再請人回應，說明佔 35 分；紀錄表只問「達到洞察？」。
            partner: 合約沒寫付款期限；對方會計每季才結一次帳。
            decision: 現有教室只有週末滿，平日閒置；老師都是兼職，平日排不出人。
            ecom: 商品頁的尺寸表直接用供應商給的、沒人核對；退貨流程只有「同意／不同意」，不問原因。
            daily: 沒有分工表，誰看到誰做。
          result: {name: 結構 Structures, title: 結構與流程 Structures & Processes, short: 結構, seen: 看不見, time: 現在到未來, when: 現在→未來, mode: 設計 Design, effect: 改流程、改制度, lasting: 持久}
        - key: mental_models
          head: ④ 心智模型 Mental Models（最深）
          ask: 哪個沒說出口的假設撐住這些結構？
          examples:
            edd: 「參與者需要專家幫他們看見意義。」
            partner: 「小工作室不好意思催款。」
            decision: 「擴大就是成長。」
            ecom: 「退貨是客人的問題，不是我們的問題。」
            daily: 「這種小事不用講。」
          result: {name: 心智模型 Mental Models, title: 心智模型 Mental Models, short: 心智模型, seen: 最深、最看不見, time: 未來, when: 未來, mode: 轉化 Transform, effect: 改信念, lasting: 根本}
      mnemonic: 記法：事件是「一次」，模式是「一再」，結構是「為什麼一再」，心智模型是「為什麼沒人改」。例子跟著你進來的那條線走；不會拿你真實填過的案例當教材。
    worked:
      how: <b>怎麼讀</b>這是示範案例真的跑完的那一次分析：左到右是這一層你填了什麼、它代表什麼、在這一層出手會怎樣；★ 是建議先出手的層。<b>你要做的</b>不用做；想看整頁結果按下面的按鈕。
      columns: [層, 你填的, 這代表, 在這一層出手]
      after: 每往下一層，看得到的解法就不一樣；整頁結果還有圖表、方案比較和下一步。
      result_link: 同一個案例，做完的九段結果
    fill:
      title: 怎麼填：四格，每格一個好例子和一個壞例子
      how: <b>怎麼讀</b>每步一好一壞，壞例括號裡寫的是它缺什麼。<b>你要做的</b>拿你的那件事，照「好」的樣子在心裡寫一句；寫不出來的那一層就是你要去補資料的層。
      steps:
        - title: 把事件講清楚
          how: 一件具體的事、有時間、有數字。
          good:
            edd: 第 6 次 session 8 人只有 2 人主動分享；第 1 次是 6 人。
            partner: 這檔展覽結束 45 天還沒收款，合約寫 30 天；上一檔延了 60 天。
            decision: 這個月 5 位家長問平日班；去年同月 2 位。
            ecom: 本月退貨率 12%，上月 5%；退的 70% 是尺寸類。
            daily: 週日晚上為了誰洗碗吵了 20 分鐘；這個月第 3 次。
          bad:
            edd: 大家都不認真。（哪一次？幾人？跟第 1 次比呢？）
            partner: 他們老是拖。（哪一檔？幾天？合約寫幾天？）
            decision: 很多人在問。（幾位？哪個月？跟去年比呢？）
            ecom: 退貨變多了。（多少？哪一類？跟上月比呢？）
            daily: 我們最近常吵。（哪一天？為了什麼？幾次？）
        - title: 找模式
          how: 這件事什麼時候發生、多常、跟什麼一起出現。
          good:
            edd: 三期都從第 4 次開始掉；帶領者先解讀的場次最低；線上場更低。
            partner: 近一年四檔都延 30–60 天；小型聯展延最久。
            decision: 每年暑假前詢問暴增、開學後回落；三年都一樣。
            ecom: 每次上新品後兩週退貨衝高；促銷檔期更嚴重。
            daily: 每次都在週日晚上；一忙就吵。
          bad:
            edd: 一直都這樣。（多久？多常？有什麼一起變？）
            partner: 一直都這樣。（多久？多常？有什麼一起變？）
            decision: 一直都有人問。（多久？多常？有什麼一起變？）
            ecom: 常常這樣。（多久？多常？有什麼一起變？）
            daily: 一直都這樣。（多久？多常？有什麼一起變？）
        - title: 找結構
          how: 哪個流程、規則、人力安排在製造這個模式。寫「制度」，不寫「某個人」。
          good:
            edd: 帶領者先講意義、說明佔 35 分；紀錄表只問「達到洞察？」。
            partner: 合約沒寫逾期條款；對方會計每季結一次帳；我們沒人負責催。
            decision: 教室只有週末滿；老師都是兼職，平日排不出人。
            ecom: 尺寸表直接用供應商的、沒人核對；退貨表不問原因。
            daily: 沒有分工表，誰看到誰做；週日晚上兩人都最累。
          bad:
            edd: 某某帶領者不重視。（這是怪人，不是結構）
            partner: 他們會計很混。（這是怪人，不是結構）
            decision: 老師不配合。（這是怪人，不是結構）
            ecom: 客服不夠細心。（這是怪人，不是結構）
            daily: 對方很懶。（這是怪人，不是結構）
        - title: 問信念
          how: 大家沒說出口、但決定規則和優先順序的那句話。也問問自己的。
          good:
            edd: 「參與者需要專家幫他們看見意義。」
            partner: 「小工作室不好意思催款。」
            decision: 「擴大就是成長。」
            ecom: 「退貨是客人的問題，不是我們的問題。」
            daily: 「這種小事不用講。」
          bad:
            edd: 大家心態不對。（太籠統，指不出哪個假設）
            partner: 我們太軟弱。（太籠統，指不出哪個假設）
            decision: 我們不夠有企圖心。（太籠統，指不出哪個假設）
            ecom: 大家不重視品質。（太籠統，指不出哪個假設）
            daily: 我們個性不合。（太籠統，指不出哪個假設）
      after: 填不出某一層沒關係，留白比硬湊好；工具會把它列成「證據缺口」，告訴你該去補什麼資料。
    mistakes:
      how: <b>怎麼讀</b>四條，每條都是「看起來對、其實錯」。<b>你要做的</b>對照你上面心裡寫的那幾句，看有沒有中。
      items:
        - title: 急著怪人
          text: 一直問「是誰」，就挖不到「為什麼」。結構層要寫制度，不寫名字。
        - title: 跳層
          text: 從事件直接跳到「他們心態有問題」。中間的模式和結構才是能動手改的地方。
        - title: 把模式當原因
          by_domain:
            edd: 「每期第 4 次之後分享變少」是模式，不是原因；原因是第 4 次之後流程哪裡變了。
            partner: 「每檔展覽都延後付款」是模式，不是原因；原因是合約和結帳流程哪裡讓它一再發生。
            decision: 「每年暑假前詢問暴增」是模式，不是原因；原因是教室和排班怎麼安排才讓它每年重演。
            ecom: 「每次上新品退貨就衝高」是模式，不是原因；原因是上架和退貨流程哪裡漏了。
            daily: 「每次都在週日晚上吵」是模式，不是原因；原因是那個晚上的安排哪裡讓兩個人都最累。
        - title: 只看別人的假設
          text: 你自己也在這個系統裡；你的假設也要寫進第四層。
    quiz:
      edd:
        - [「每期第 4 次之後分享變少」是哪一層？, 模式：一再發生的型態，不是原因。]
        - [「紀錄表只問有沒有達到洞察」是哪一層？, 結構：是制度在製造模式。]
        - [「參與者需要專家幫他們看見意義」是哪一層？, 心智模型：沒說出口、撐住制度的信念。]
      partner:
        - [「每檔展覽結束都延後付款」是哪一層？, 模式：一再發生的型態，不是原因。]
        - [「合約沒寫逾期條款」是哪一層？, 結構：是制度在製造模式。]
        - [「小工作室不好意思催款」是哪一層？, 心智模型：沒說出口、撐住制度的信念。]
      decision:
        - [「每年暑假前詢問暴增」是哪一層？, 模式：一再發生的型態，不是原因。]
        - [「老師都是兼職，平日排不出人」是哪一層？, 結構：是制度在製造模式。]
        - [「擴大就是成長」是哪一層？, 心智模型：沒說出口、撐住制度的信念。]
      ecom:
        - [「每次上新品後兩週退貨衝高」是哪一層？, 模式：一再發生的型態，不是原因。]
        - [「退貨流程不問原因」是哪一層？, 結構：是制度在製造模式。]
        - [「退貨是客人的問題」是哪一層？, 心智模型：沒說出口、撐住制度的信念。]
      daily:
        - [「每次都在週日晚上吵」是哪一層？, 模式：一再發生的型態，不是原因。]
        - [「沒有分工表，誰看到誰做」是哪一層？, 結構：是制度在製造模式。]
        - [「這種小事不用講」是哪一層？, 心智模型：沒說出口、撐住制度的信念。]
    read:
      how: <b>怎麼讀</b>先看三步讀法；再看示範案例做完的結論怎麼讀；最後對照頁首和九段，每段回答一件事。<b>你要做的</b>不用做；結果頁哪一段看不懂，回這個分頁找同一個編號。
      short: 只有 30 秒？看 ① 的一句話和 ⑤ 的建議順序就夠。
      terms_label: 四個詞
      terms:
        - [事件, 這次發生的事]
        - [模式, 一再發生]
        - [結構, 為什麼一再]
        - [心智模型, 為什麼沒人改]
    teach:
      how: <b>怎麼讀</b>其他分頁是學員版（5 分鐘自學）；這裡把同一堂課排成 45 分鐘課堂：流程、講稿要點、討論題、學員常錯、講義。<b>你要做的</b>只在你要教別人時展開；可整份匯出成講義與投影片大綱。
      flow:
        - [0–5, 破冰：每人說一件「最近一再發生」的事, 「認識」的「什麼時候用」]
        - [5–15, 講四層，例子換成學員的領域, 「認識」（切領域）]
        - [15–30, 分組把自己的案例填成四層；用好壞例當互評表, 「怎麼填」]
        - [30–40, 各組報告；其他組專門找「跳層」和「怪人」, 「怎麼填」的常見錯誤]
        - [40–45, 收尾：填不出的那一層就是要補資料的層；帶大家看一次結果頁；預告下一步工具, 「開始」卡、「看懂結果」、結果頁 ⑧]
      script:
        - 這是什麼：先問「你們最近有沒有一件事換了人、換了工具還是一直發生」，再給冰山圖。不要先講定義。
        - 四層：用「一次／一再／為什麼一再／為什麼沒人改」四個詞帶，每層停 30 秒讓學員對到自己的案例。
        - 做完的例子：只講「每往下一層，解法就不一樣」，不要解釋案例細節。
        - 怎麼填：把壞例投影出來，讓學員說哪裡缺，再翻出好例。
        - 常見錯誤：「怪人」和「跳層」一定親自示範一次錯的寫法。
        - 開始：告訴學員填不出來的層留白，工具會把它列成證據缺口，不是失敗。
      questions:
        - 你的案例裡，哪一層是你最不想寫的？為什麼？
        - 如果只能改一層，你選哪一層？三個月後怎麼知道有沒有用？
        - 你自己在這個系統裡的假設是什麼？寫進第四層了嗎？
      errors:
        - 把模式寫成原因 → 反問：「這件事多久一次？什麼時候特別多？」把它推回第 2 層。
        - 結構層寫人名 → 反問：「如果換一個人，還會發生嗎？」會，就是結構。
        - 第四層寫「態度有問題」 → 反問：「他們相信什麼，才會這樣安排？」要一句可以被否證的話。
      handout: 列印版講義 = 第 2 步四層表（學員領域版）＋第 4 步好壞例＋一張空白四格工作單；投影片大綱 = 六步各一頁＋冰山圖一頁。兩者都從這一頁匯出（匯出功能還在做）。
      note: 教材版和學員版由同一份工具資料生成（來源 [1]–[3]），改課文就同時改兩版。藝術反思工具的帶領腳本（Airtable 的「帶活動者提示用語」「時間分段」「停止活動訊號」）會直接進這一段。
    sources:
      - text: The Systems Thinking，「Iceberg Model」教學（定義 → 四層 → 例子 → 步驟 → 常見錯誤的課程結構；本課改寫，非轉載）

  method: >
    Read docs/adr/ADR-007-pii-redaction-vs-pseudonymization-timing.md in
    full (190 lines) before drafting this file. Read
    specs/security/log-redaction-token.schema.yaml and
    specs/security/key-vault-lifecycle.schema.yaml#/definitions/
    hmac_signing_key_policy directly to confirm both prerequisites ADR-007
    called for already exist and this file's field names/references match
    their actual current shape (not guessed). Read EC §101 (L2955-2971) and
    §102 (L2974-2999) directly at the cited lines to confirm the
    classification enum and the 8 minimum log keys. Grepped
    MACHINE_READABLE_SPEC_PLAN.md:48,185 to confirm both rows still read
    BLOCKED_PENDING_ROUND2_ADR before creating this file (corrected in the
    same commit).
  note: >
    No mother document was modified to produce this file. ADR-007's
    Recommendation is transcribed into machine-readable form; the
    `allOf`/`if`/`then` cross-field enforcement of "redaction_required
    derives from classification+identifies_natural_person, not asserted
    independently" and the `const`-enforced HMAC-SHA256/keyed-HMAC
    requirement are this file's own additive compilation decisions,
    individually justified above -- not new ADR-level tradeoffs.

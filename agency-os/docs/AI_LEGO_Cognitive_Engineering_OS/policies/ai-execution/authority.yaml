$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://policies/ai-execution/authority.yaml"
title: Authority Level Action Bindings
version: "1.0.0"
status: ACTIVE

description: >
  Policy-as-code binding of specs/execution/authority.schema.yaml's A0-A4
  Autonomy/Authority Level enum onto concrete action categories, per
  Execution Contract §91 "Policy-as-Code Paths" (L2750-2762), which places
  this file as item 1 of an explicit 8-file /policies/ai-execution/ list.
  Answers: WHICH `required_authority_level` makes an action category
  ALLOW-able, once that level is actually granted through Master Plan §65's
  Agent -> Intent -> Policy Engine -> Permission Check -> Human Approval /
  Auto Rule -> Execution pipeline (transcribed in `agent_not_authority_
  pipeline` below).

  Directory-layout resolution (applies to this whole Wave, stated once
  here): Execution Contract §91 "Policy-as-Code Paths" (L2750-2762) gives a
  concrete 8-file layout under /policies/ai-execution/ (authority.yaml,
  risk-tiers.yaml, mandatory-gates.yaml, tool-permissions.yaml, forbidden-
  actions.yaml, network-egress.yaml, exception-policy.yaml, release-
  policy.yaml). Master Plan §64 "Policy-as-Code" (L2714-2727) gives a
  DIFFERENT, broader 6-category layout (/policies/{data,ai,publishing,
  research,security,enterprise}/) with no concrete file list. Resolved the
  same way this suite already resolved the identical-shaped question for
  result.schema.yaml's version/sha256 vs declared_version/content_hash
  naming (pick the side with real, concrete, machine-consumable content):
  EC §91's 8-file layout is primary and is what this file (and its sibling
  risk-tiers.yaml) is built under; Master Plan §64's /ai/ category is
  satisfied by this subtree. MP §64's other 5 categories (/data/,
  /publishing/, /research/, /security/, /enterprise/) have zero EC
  grounding and are OUT OF SCOPE for this Wave — not built, not stubbed,
  no content invented for them.

  Sibling-file discovery (2026-08-29, read in full before writing this
  file, per this suite's "read >= 3 siblings first" discipline):
  policies/ai-execution/forbidden-actions.yaml and .../tool-permissions.yaml
  already exist in this working tree (untracked — evidently compiled by a
  parallel Wave 6 pass covering other items of EC §91's 8-file list).
  forbidden-actions.yaml already transcribes Master Plan §65's 5-item
  "Agent 不可直接" list (Delete/Publish/Deploy/Send/Modify Locked Fact) as
  its own closed `agent_action_id` enum and models the DENY-when-executed-
  directly verdict, including a full, well-reasoned MODIFY_LOCKED_FACT
  entry citing EC §57 and governance/epistemic-label.schema.yaml's `locked`
  field. To avoid duplicating that already-canonical treatment, THIS file's
  scope is narrowed to exactly the positive/ALLOW half of the ladder: it
  does not re-derive a Modify-Locked-Fact row (EC §57 gives that action no
  A-level path at all — it is categorically out of an "authority LEVEL"
  file's scope, not merely a high one), and where a row corresponds to one
  of MP §65's other 4 items (Delete/Publish/Send/Deploy), it cross-
  references forbidden-actions.yaml's `agent_action_id` enum via `$ref`
  rather than re-declaring a parallel category vocabulary.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §9 Autonomy / Authority Levels (L478-529) — primary grounding for this file's 10 rows' `required_authority_level` assignments, verbatim examples"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md §65 Agent ≠ Authority (L2744-2769) — the Agent->Intent->Policy Engine->...->Execution pipeline; cross-checked against this file's A4 rows via forbidden_actions_ref"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md §64 Policy-as-Code (L2714-2741) — condition/action rule-shape source; directory layout superseded, see description above"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §91 Policy-as-Code Paths (L2750-2762) — this file is item 1 of the 8-file /policies/ai-execution/ list"
  - "specs/execution/authority.schema.yaml#/authority_level and #/levels — the A0-A4 enum and per-level requirements this file binds via $ref, not redefined"
  - "policies/ai-execution/forbidden-actions.yaml#/definitions/agent_action_id — the MP §65 5-item enum this file cross-references for 4 of its 5 A4 rows, not re-declared"
decided_by: >
  No ADR. Master Plan §65's 5-item list and Execution Contract §9's A0-A4
  ladder are each uncontested single-source lists (grep-confirmed, same
  precedent risk-tier.schema.yaml / authority.schema.yaml / forbidden-
  actions.yaml already established for this class of decision), so binding
  one onto the other via direct EC-grounded examples is Low-risk direct
  compilation, not an ADR matter. The one place this file goes beyond pure
  transcription is the Deploy reversible/irreversible split
  (compilation_decisions below) and the directory-wide action-vocabulary
  choice (also below) — both recorded with reasoning, not silently
  asserted as EC-literal fact.

compilation_decisions:
  - question: >
      Should this file also state a fixed risk_tier -> authority_level
      mapping, given both enums appear as sibling fields using matching
      numerals in EC §16's one task.manifest.yaml worked example
      (risk.tier: R2 / authority.max_autonomy: A2, L769-772)?
    decision: >
      No. This file inherits authority.schema.yaml's own OQ-AUTH-2
      position (no fixed numeral correspondence asserted from one
      example) and does not phrase any condition below in terms of
      risk_tier. See policies/ai-execution/risk-tiers.yaml's
      `human_authority_crosswalk` for the sharper, evidence-based version
      of this same question (an observation, not a rule).
    reasoning: >
      Asserting a numeral-parity rule from a single worked example would
      be exactly the "happens to line up this once" leap R0's 補丁判準
      forbids for code changes; the same discipline applies here, and
      authority.schema.yaml already made this call explicitly for the
      schema layer — a policy-layer file compiled afterward does not get
      to quietly re-open it.
  - question: >
      forbidden-actions.yaml and tool-permissions.yaml (this file's
      directory siblings, read in full before writing this file) already
      resolved the "what values may `action` take" question by extending
      Master Plan §64's own literal condition-action words (DENY, REQUIRE
      HUMAN REVIEW) into a SNAKE_CASE enum [DENY, ALLOW, SCOPE_TO,
      REQUIRE_HUMAN_REVIEW] — neither file reuses
      specs/execution/status-codes.schema.yaml's already-canonical
      BLOCKED / NEEDS_HUMAN_REVIEW values via $ref, even though that file
      states plainly it is the sole source of truth for exactly this kind
      of signal ("the mother documents reference it, they do not redefine
      these codes"). This task's own instructions point the other way
      (reuse status-codes.schema.yaml where a rule's action overlaps an
      already-canonicalized status code). Which convention should THIS
      file follow?
    decision: >
      Followed the sibling precedent: `action` is `const: ALLOW`
      (SNAKE_CASE, same directory vocabulary), not a $ref into
      status-codes.schema.yaml. Did not attempt to retrofit
      forbidden-actions.yaml or tool-permissions.yaml to reuse
      status-codes.schema.yaml instead (out of this task's scope — it
      names only authority.yaml and risk-tiers.yaml as deliverables).
      Recorded the tension in `open_questions.OQ-AUTHPOL-3` for a future
      reconciliation pass rather than silently picking a side or
      introducing a THIRD, incompatible vocabulary into a 4-file
      directory that already has two files agreeing with each other.
    reasoning: >
      2 of 2 existing directory siblings already committed to the same
      choice. A 3rd and 4th file (this one and risk-tiers.yaml) each
      independently reusing status-codes.schema.yaml instead would leave
      the /policies/ai-execution/ directory internally split 2-vs-2 on
      its own core vocabulary — worse than any single choice, including
      one this task's own instructions did not anticipate. Directory-
      internal consistency, discovered by actually reading the sibling
      files rather than compiling in isolation, outweighs a instruction
      written before those siblings' existence was known.
  - question: >
      This file's scope, after excluding forbidden-actions.yaml's
      Modify-Locked-Fact territory, is entirely rows whose action is
      ALLOW (once the stated required_authority_level is actually
      granted). Should `action` therefore be a free enum (in case a
      future row needs DENY/SCOPE_TO/REQUIRE_HUMAN_REVIEW), or a `const`?
    decision: >
      `const: ALLOW`, mirroring forbidden-actions.yaml's own
      `action: {const: DENY}` choice for the exact same reason (its whole
      scope is uniformly DENY; this file's whole scope, after the split
      above, is uniformly ALLOW).
    reasoning: >
      Symmetric with the sibling file's already-established pattern.
      Together, the two files exhaustively cover Master Plan §65's
      Agent≠Authority framing without overlap: forbidden-actions.yaml is
      the constant-DENY-when-direct half, this file is the
      constant-ALLOW-once-properly-authorized half.
  - question: >
      EC §9's A4 examples are introduced with "例：" (L517, "for
      example") — the SAME illustrative framing tool-permissions.yaml's
      compilation_decisions identified for EC §97's worked examples,
      textually distinct from forbidden-actions.yaml's un-"例"-qualified,
      flat Master Plan §65 list. Should this file's row set therefore be
      treated as a closed set (full `allOf`+`contains`+`minContains`+
      `maxContains` coverage, forbidden-actions.yaml's style) or an open
      one (minContains only, tool-permissions.yaml's style)?
    decision: >
      Open set: `minContains: 1` per canonical `required_authority_level`
      value (A0-A4) and per referenced `forbidden_actions_ref` value
      (DELETE, PUBLISH, SEND, DEPLOY) — no `maxContains`, no `minItems`/
      `maxItems` lock on the array's total length.
    reasoning: >
      EC §9 itself uses "例：" for A0's, A4's, and (implicitly, via "可"
      framing) A1-A3's action lists — none of the five levels' example
      lists are stated as exhaustive. Locking an exact count here would
      assert EC §9's example lists are closed when EC's own wording says
      otherwise, the same class of error tool-permissions.yaml's
      compilation_decisions already flagged and avoided for EC §97.
  - question: >
      Of the 4 MP §65 items with an EC §9 A-level home (Delete, Publish,
      Send, Deploy — Modify Locked Fact excluded per the scope split
      above), Deploy is the only one EC §9 splits by reversibility: A3
      ("reversible production change") vs A4's literal example "deploy
      irreversible migration". Should this file add a distinct
      AUTHZ-A3-DEPLOY-REVERSIBLE row, or leave "Deploy" as a single A4
      row matching only EC §9's one literal example?
    decision: >
      Add both AUTHZ-A3-DEPLOY-REVERSIBLE (`inferred: true`) and
      AUTHZ-A4-DEPLOY-IRREVERSIBLE (verbatim). The reversible row is
      flagged non-verbatim in its own `inferred` field and in
      `open_questions.OQ-AUTHPOL-1`, not presented as an EC §9-literal
      example.
    reasoning: >
      EC §9 never states "a reversible deploy is A3" in so many words —
      this is an inference from applying EC §9's own reversible(A3)-vs-
      irreversible(A4) distinction, already explicit in how it names A3
      ("Production Reversible Change") and A4 ("Irreversible / External
      High-impact"), to the one action category (Deploy) EC §9 gives an
      irreversible example for but no reversible one. Independently
      corroborated, not invented from nothing: forbidden-actions.yaml's
      own DEPLOY entry (seed_content.rules, mechanism_ref field, written
      by whichever pass built that file) already states the identical
      split verbatim: "A4's worked examples include 'deploy irreversible
      migration', requiring explicit_human_authority; a reversible
      deploy sits at A3, requiring policy_allow + required_gates_pass +
      authorized_approval together." Two independently-compiled files
      converging on the same reading raises confidence this is a
      reasonable inference, but it is still recorded as inferred, not
      promoted to verbatim on the strength of that agreement alone.
  - question: >
      Scope check: how much of Execution Contract §91's 8-file
      /policies/ai-execution/ list does this Wave actually build?
    decision: >
      This pass builds exactly 2: authority.yaml (this file) and
      risk-tiers.yaml. forbidden-actions.yaml and tool-permissions.yaml
      already exist (see sibling-file discovery above, built by a
      parallel pass, not this one). mandatory-gates.yaml, network-
      egress.yaml, exception-policy.yaml, and release-policy.yaml were
      unbuilt AT THE TIME this file was first written; all 4 were built
      later in the same Wave 6 batch and merged in the same commit — see
      the 2026-08-29 POST-MERGE UPDATE note directly below. This entry is
      left in past tense deliberately (an accurate record of this file's
      own compile-time state), not edited to erase what was true when
      written.
    reasoning: >
      Honesty about partial coverage of a named list is this suite's
      established practice (e.g. status-codes.schema.yaml's
      `referenced_by` section listing forward dependents that are NOT
      this file's job to build).
    post_merge_update_2026-08-29: >
      All 8 files in EC §91's /policies/ai-execution/ list now exist:
      authority.yaml, risk-tiers.yaml, tool-permissions.yaml,
      forbidden-actions.yaml, network-egress.yaml, exception-policy.yaml,
      mandatory-gates.yaml, release-policy.yaml — 8/8 BUILT (2 ACTIVE +
      2 pre-existing ACTIVE + 4 PROVISIONAL, per each file's own `status`
      field). Flagged by critic review (Wave 6 batch, MAJ-4) as a
      same-commit-race staleness: this decision's `decision` field, plus
      risk-tiers.yaml:344's `future_home` note and
      exception-policy.yaml:576-577's "unbuilt sibling" reference, all
      described a mid-batch snapshot as if it were the final state.

# ---------------------------------------------------------------------------
# Master Plan §65's own framing, transcribed verbatim (L2744-2769) — governs
# how the `rules` below relate to forbidden-actions.yaml's DENY-when-direct
# rows for the same 4 shared action categories (Delete/Publish/Send/Deploy).
# ---------------------------------------------------------------------------
agent_not_authority_pipeline:
  quote: "Agent 只能提出 Intent。"
  translation: "An Agent may only propose Intent."
  source: "AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md §65 (L2744-2760)"
  flow: [Agent, Intent, "Policy Engine", "Permission Check", "Human Approval / Auto Rule", Execution]
  agent_may_not_directly: [Delete, Publish, Deploy, Send, "Modify Locked Fact"]
  reconciliation_note: >
    4 of these 5 (Delete/Publish/Deploy/Send) map onto EC §9's own A3/A4
    examples with a legitimate ALLOW-once-authorized path — this file's
    AUTHZ-A4-DELETE / AUTHZ-A4-PUBLISH / AUTHZ-A4-SEND /
    AUTHZ-A3-DEPLOY-REVERSIBLE / AUTHZ-A4-DEPLOY-IRREVERSIBLE rows below
    are that path's ALLOW side; forbidden-actions.yaml's matching entries
    are its DENY-when-attempted-directly side. "Modify Locked Fact" alone
    has no such path anywhere in EC (§57: "不得由 AI 修改" — MUST NOT be
    modified by AI, unconditionally) — it is out of THIS file's scope by
    design (see compilation_decisions), not omitted by oversight.

# Root $ref (established pattern in this suite — see risk-tier.schema.yaml,
# authority.schema.yaml, forbidden-actions.yaml, tool-permissions.yaml:
# without a root-level type constraint, a validator pointed at this file's
# ROOT would accept ANY value). This file's root validates as `rules_schema`
# (an array of rule objects) — its actual payload is a rule-SET, matching
# tool-permissions.yaml's root-shape precedent, not a single-record shape.
$ref: "#/rules_schema"

policy_rule:
  description: >
    One authority-level binding: an action category, the
    `required_authority_level` it needs, and the (always ALLOW, see
    compilation_decisions) verdict once that level is actually granted.
  type: object
  required: [id, condition, required_authority_level, action, source]
  properties:
    id:
      type: string
      pattern: "^AUTHZ-"
    condition:
      type: string
      description: "Free-text action-category description, Master Plan §64 rule-shape style."
    required_authority_level:
      $ref: "ai-lego://specs/execution/authority.schema.yaml#/authority_level"
      description: >
        Bound to a SPECIFIC level (set membership), not phrased as a
        "minimum" ordinal comparison — neither EC §9 nor
        authority.schema.yaml states A0<A1<A2<A3<A4 is a formal total
        order for comparison purposes (only a naming/severity
        progression), mirroring risk-tier.schema.yaml's own choice to
        phrase its gate trigger as "risk_tier IN [R3, R4]" rather than
        "risk_tier >= R3".
    action:
      type: string
      const: ALLOW
      description: >
        Constant across every row in this file — see
        compilation_decisions for why (this file's scope is entirely the
        ALLOW-once-properly-authorized half of Master Plan §65's
        Agent≠Authority framing; the DENY-when-direct half lives in
        forbidden-actions.yaml).
    forbidden_actions_ref:
      description: >
        Soft cross-reference to policies/ai-execution/forbidden-
        actions.yaml's `agent_action_id` enum, where this row's condition
        corresponds to one of Master Plan §65's 5 named "Agent 不可直接"
        items. Null where no such correspondence exists (e.g.
        AUTHZ-A4-CREDENTIAL-ROTATION — root-credential rotation is not
        one of MP §65's 5 items, honestly left null rather than
        force-fit). Restricted to [DELETE, PUBLISH, DEPLOY, SEND] —
        MODIFY_LOCKED_FACT deliberately EXCLUDED from this file's legal
        values, since EC §57 gives it no ALLOW-able authority-level path
        at all (see compilation_decisions' scope-split decision). Where
        non-null, this row and forbidden-actions.yaml's matching entry
        describe the SAME action from two lawful/unlawful angles of the
        identical Master Plan §65 mediated path — not competing rules.
      oneOf:
        - type: "null"
        - allOf:
            - $ref: "ai-lego://policies/ai-execution/forbidden-actions.yaml#/definitions/agent_action_id"
            - enum: [DELETE, PUBLISH, DEPLOY, SEND]
      default: null
    inferred:
      type: boolean
      default: false
      description: >
        true only for a row this file derives by applying EC §9's own
        reversible/irreversible framing rather than transcribing a named
        EC §9 example verbatim (AUTHZ-A3-DEPLOY-REVERSIBLE is currently
        the only such row).
    source:
      type: string
      description: "EC/MP citation this row transcribes or infers from."
    notes:
      type: string

rules_schema:
  description: >
    The type `rules` (below) must satisfy. Array coverage of the closed
    A0-A4 enum is enforced via `allOf`+`contains`+`minContains` rather than
    `uniqueItems` alone (uniqueItems cannot enforce "every enum value
    appears at least once" — proven insufficient twice already this
    session). No `maxContains` / `minItems` / `maxItems` lock — see
    compilation_decisions' open-set-vs-closed-set entry for why.
  type: array
  items:
    $ref: "#/policy_rule"
  allOf:
    - contains: {type: object, properties: {required_authority_level: {const: A0}}, required: [required_authority_level]}
      minContains: 1
    - contains: {type: object, properties: {required_authority_level: {const: A1}}, required: [required_authority_level]}
      minContains: 1
    - contains: {type: object, properties: {required_authority_level: {const: A2}}, required: [required_authority_level]}
      minContains: 1
    - contains: {type: object, properties: {required_authority_level: {const: A3}}, required: [required_authority_level]}
      minContains: 1
    - contains: {type: object, properties: {required_authority_level: {const: A4}}, required: [required_authority_level]}
      minContains: 1
    - contains: {type: object, properties: {forbidden_actions_ref: {const: DELETE}}, required: [forbidden_actions_ref]}
      minContains: 1
    - contains: {type: object, properties: {forbidden_actions_ref: {const: PUBLISH}}, required: [forbidden_actions_ref]}
      minContains: 1
    - contains: {type: object, properties: {forbidden_actions_ref: {const: SEND}}, required: [forbidden_actions_ref]}
      minContains: 1
    - contains: {type: object, properties: {forbidden_actions_ref: {const: DEPLOY}}, required: [forbidden_actions_ref]}
      minContains: 1

# ---------------------------------------------------------------------------
# The 10 rows: EC §9's A0-A4 examples, bound to required_authority_level,
# cross-referenced against forbidden-actions.yaml where MP §65 overlaps.
# ---------------------------------------------------------------------------
rules:
  - id: AUTHZ-A0-OBSERVE
    condition: "Agent action is read, search, analyze, or read-only test."
    required_authority_level: A0
    action: ALLOW
    forbidden_actions_ref: null
    inferred: false
    source: "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §9 (L486-494)"

  - id: AUTHZ-A1-LOCAL-EDIT
    condition: "Agent modifies content, scoped to an isolated branch or workspace (not shared/staging/production)."
    required_authority_level: A1
    action: ALLOW
    forbidden_actions_ref: null
    inferred: false
    source: "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §9 (L495-498)"

  - id: AUTHZ-A2-STAGED-WRITE
    condition: "Agent writes to a dev or staging environment."
    required_authority_level: A2
    action: ALLOW
    forbidden_actions_ref: null
    inferred: false
    source: "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §9 (L499-502)"
    notes: "A2's own `gate` requirement is defined by authority.schema.yaml#/levels/A2/requirements — not restated here."

  - id: AUTHZ-A3-PROD-REVERSIBLE
    condition: "Agent performs a reversible change to production."
    required_authority_level: A3
    action: ALLOW
    forbidden_actions_ref: null
    inferred: false
    source: "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §9 (L503-514)"
    notes: "A3's `policy_allow` + `required_gates_pass` + `authorized_approval` (all three together, per EC §9's '+' chain) are defined by authority.schema.yaml#/levels/A3 — not restated here."

  - id: AUTHZ-A3-DEPLOY-REVERSIBLE
    condition: "Agent deploys to production WHERE the deploy is reversible (e.g. supports rollback / blue-green) AND granted_authority_level == A3."
    required_authority_level: A3
    action: ALLOW
    forbidden_actions_ref: DEPLOY
    inferred: true
    source: "Inferred from EC §9's A3 'Production Reversible Change' vs A4 'Irreversible' distinction (L503-528); see compilation_decisions for the reasoning and forbidden-actions.yaml's independent corroboration."
    notes: "See open_questions.OQ-AUTHPOL-1."

  - id: AUTHZ-A4-DELETE
    condition: "Agent deletes production data AND granted_authority_level == A4."
    required_authority_level: A4
    action: ALLOW
    forbidden_actions_ref: DELETE
    inferred: false
    source: "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §9 (L519)"

  - id: AUTHZ-A4-SEND
    condition: "Agent sends external communication AND granted_authority_level == A4."
    required_authority_level: A4
    action: ALLOW
    forbidden_actions_ref: SEND
    inferred: false
    source: "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §9 (L520)"

  - id: AUTHZ-A4-PUBLISH
    condition: "Agent publishes regulated output AND granted_authority_level == A4."
    required_authority_level: A4
    action: ALLOW
    forbidden_actions_ref: PUBLISH
    inferred: false
    source: "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §9 (L521)"

  - id: AUTHZ-A4-CREDENTIAL-ROTATION
    condition: "Agent revokes or rotates a root credential AND granted_authority_level == A4."
    required_authority_level: A4
    action: ALLOW
    forbidden_actions_ref: null
    inferred: false
    source: "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §9 (L522)"
    notes: "No Master Plan §65 counterpart — root-credential rotation is not one of that section's 5 named items; honestly left null rather than force-fit onto DELETE/DEPLOY/etc."

  - id: AUTHZ-A4-DEPLOY-IRREVERSIBLE
    condition: "Agent deploys an irreversible migration AND granted_authority_level == A4."
    required_authority_level: A4
    action: ALLOW
    forbidden_actions_ref: DEPLOY
    inferred: false
    source: "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §9 (L523)"

open_questions:
  - id: "OQ-AUTHPOL-1"
    question: >
      Should "Deploy" formally be split into reversible (A3) / irreversible
      (A4) sub-categories, as this file and forbidden-actions.yaml both
      independently infer, or should a Round 2 ADR / EC amendment state
      this explicitly rather than leaving it as a convergent inference by
      two separately-compiled policy files?
    owner: "operator or Round 2 ADR"
    blocks: "nothing in this file's own validity — AUTHZ-A3-DEPLOY-REVERSIBLE is schema-valid and clearly flagged `inferred: true` either way"
  - id: "OQ-AUTHPOL-2"
    question: >
      EC §9 defines no default/catch-all binding for an action category not
      covered by any of its five levels' worked examples. What SHOULD
      happen for an unenumerated action (e.g. a new tool category EC §9's
      authors did not anticipate)? This file does not assume a fail-safe
      default (e.g. "treat as A4 until classified") — that would be
      inventing a rule EC never states.
    owner: "operator or Round 2 ADR"
    blocks: "nothing in this file's own validity — this is a coverage-completeness question about the mother document, not about this file's transcription of it"
  - id: "OQ-AUTHPOL-3"
    question: >
      This file and its 6 directory siblings (risk-tiers.yaml,
      mandatory-gates.yaml, tool-permissions.yaml, forbidden-actions.yaml,
      network-egress.yaml, exception-policy.yaml — 7 files total) all
      define `action` as a local SNAKE_CASE enum/const

  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §8 Risk Tier (L379-475) — R0-R4 `required_actions`, the textual basis for `approval_requirements` below (already compiled verbatim into `execution/risk-tier.schema.yaml`, not re-transcribed here)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §9 Autonomy / Authority Levels (L478-529) — A3 'authorized approval' (L512), A4 'human authority' (L525) + 'AI 不得自行把自己的建議當 approval' (L527), the textual basis for `self_approval_prohibition` below"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §24 Exception / Workaround Contract (L1013-1041) — the record this policy governs the granting of"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §25 Code Change Contract (L1045-1060, L1053 blanket-exception-not-error-handling prohibition)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §46 Feature Flag Contract (L1691-1703) — structurally analogous 'expiry field required, no horizon number given' pattern, cited only as corpus-wide corroboration, NOT itself about exceptions"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §55 Incident Mode (L1912-1962, L1954-1961 emergency-containment 'temporary + owner + expiry + follow-up root cause') — same analogous-pattern caveat as §46"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §91 Policy-as-Code Paths (L2750-2762, `exception-policy.yaml` at L2760)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §108 Time / Clock (L3086-3094) — governs HOW an expiry timestamp is stored (UTC instant), not HOW FAR OUT it may be set; confirms no horizon rule hides here either"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §128 Cleanup (L3520-3534) — same analogous-pattern caveat as §46"

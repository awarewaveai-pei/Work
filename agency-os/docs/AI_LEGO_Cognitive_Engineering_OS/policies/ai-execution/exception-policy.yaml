$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://policies/ai-execution/exception-policy.yaml"
title: Exception Grant Policy
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable POLICY for WHEN an Exception / Workaround
  (`specs/execution/exception.schema.yaml`) MAY be granted at all, per
  Execution Contract §91 "Policy-as-Code Paths" (L2750-2762,
  `exception-policy.yaml` at L2760) — one of EC §91's own 8-file
  `/policies/ai-execution/` list. `exception.schema.yaml` (Wave 5) already
  anticipated this file by name in its own `relationship_to_exception_policy`
  block, which named exactly the three questions this file must answer: (a)
  which `risk_tier` requires which `required_authority_level` to approve an
  exception, (b) the maximum allowable `expires_at` horizon, (c) whether any
  scope is categorically forbidden from ever having an exception. This file
  answers all three — (a) directly, by binding two already-ACTIVE schemas'
  existing fields to each other; (b) and (c) by reporting, with full grep
  evidence, that no mother document supplies either, and leaving both as
  explicit `open_questions` rather than inventing values.

  This is a POLICY schema (the rules governing whether an exception may be
  granted), not a RECORD schema — `exception.schema.yaml` remains the sole
  definition of what a valid, already-granted exception instance looks like.
  This file never redefines any of that record's 12 EC §24 fields
  (`id`/`reason`/`owner`/`scope`/`risk`/`approved_by`/`created_at`/
  `expires_at`/`test`/`migration_plan`/`removal_condition`/`adr`) or its
  additive `status` field; it only consumes the record's two OTHER additive
  fields (`risk_tier`, `required_authority_level`) as VALUE TYPES, via the
  same two canonical enum files (`execution/risk-tier.schema.yaml`,
  `execution/authority.schema.yaml`) `exception.schema.yaml` itself already
  $refs — see `relationship_to_exception_schema` and `compilation_decisions`
  below for why this counts as reference-by-name, not redefinition.

  Lives at `/policies/ai-execution/exception-policy.yaml` per EC §91; this
  path is one of EC's own 8-file concrete list, reconciled against Master
  Plan §64's broader 6-category layout
  (`/policies/{data,ai,publishing,research,security,enterprise}/`) as an
  already-decided Phase-3-compilable naming question outside this file's
  scope to re-litigate — same reconciliation note this Wave's sibling
  `tool-permissions.yaml` already recorded for the same EC-vs-MP path
  tension, not repeated in full here.


$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://policies/ai-execution/mandatory-gates.yaml"
title: Mandatory Gates Policy
version: "1.0.0"
status: ACTIVE

description: >
  Policy-as-code binding of WHICH gates are mandatory for WHICH conditions —
  Execution Contract §91 "Policy-as-Code Paths" (L2750-2762) names this file
  `/policies/ai-execution/mandatory-gates.yaml` at L2756, one of the 8 files
  in that directory listing. Originally built (2026-08-29) under the EXACT
  same blocking condition as `specs/execution/gate.schema.yaml` (Wave 5): the
  Global/High-risk Gate LIST itself (findings CROSS-R-5, CROSS-R-7,
  CROSS-T-11) had no Round 2 ADR ruling — Master Plan §158 (L5903-5926)
  listed 11 Global + 1 high-risk item, Method Atlas §22.1/22.2 (L4164-4194)
  listed 14 Global + 6 high-risk items, Execution Contract §68 (L2246-2278)
  copied Atlas's 14+6 counts but with gate-NAME drift. Tracked as OQ-10
  (.ai/research/phase-0/open-questions.yaml L68-72) and as
  MACHINE_READABLE_SPEC_PLAN.md's MRSP-1 (§5 Open Questions, L328).

  **RESOLVED 2026-08-30 by `docs/adr/ADR-011-platform-gate-ownership-and-
  unification.md`** — see that ADR for the full Ownership/Content/Naming
  reasoning. This file's `gate_ref` fields now populate real values from
  `specs/execution/gate.schema.yaml#/gate_catalog` instead of
  `TBD_PENDING_ROUND2_ADR`, and a second grounded rule
  (`MGATE-R3-R4-RECOVERY-ROLLBACK`) is added below — see the updated
  `OQ-MGATE-2` entry in `compilation_decisions` for why that rule's
  previously-blocking "2-of-3 convergence" concern no longer applies once
  ADR-011's union content is the reference point. `status` is upgraded from
  `PROVISIONAL` to `ACTIVE` accordingly: this file's practical payload (the
  gate_ref value space) is no longer blocked, unlike its state at
  2026-08-29 build time.

  Per MRSP §3 Build Order (L288: "只影響 Wave 5 的 gate.schema.yaml 與 Wave 6
  的 release-policy.yaml") and §2.9's row for `ai-execution/` (L183:
  "mandatory-gates.yaml 需套用 ADR-004a 的 R3∪R4 擴大規則"), this file's job
  was narrower than the disputed list at 2026-08-29 build time: it did NOT
  enumerate WHICH gate_id values exist (that was deferred to
  `specs/execution/gate.schema.yaml#/gate_id_registry`, now resolved as
  `#/gate_catalog`), it defined the STRUCTURAL rule shape ("when
  <condition>, a gate is mandatory") plus the one condition-side rule that
  IS ADR-004-decided and grounded independently of the disputed list:
  risk_tier IN [R3, R4] mandates a human-review-class gate.

  This file still does NOT itself pick a side among the mother documents'
  prose — that stays ADR-011's job and the downstream ADR-006 proposal
  flow's job, not this file's. What changed 2026-08-30: this file's
  `gate_ref` fields, previously `TBD_PENDING_ROUND2_ADR` placeholders, now
  reference ADR-011's resolved catalog — see `grounded_rules` below.

  Directory context (discovered mid-task, not assumed in advance): at the
  time of writing, `policies/ai-execution/` already contains
  `tool-permissions.yaml`, `forbidden-actions.yaml`, and
  `network-egress.yaml` (mtimes 2026-08-29 18:40-18:45, ahead of this
  file's own write), apparently produced by a concurrent session working
  through EC §91's same 8-file list; `exception-policy.yaml` was also
  present in the working tree at write time but was NOT read in full for
  this file's own shape-alignment pass (corrected 2026-08-29 — critic
  review, Minor: this paragraph previously named it as a 4th aligned
  sibling, an internal contradiction with `verification`'s own "read all 3
  in full" claim). This file aligns its rule shape with the 3
  concurrently-built, independently-established siblings actually read
  (`definitions:` block, root `$ref` to a plural array type, literal
  `condition`/`action` fields per Master Plan §64's Policy-as-Code rule
  shape, an `<x>_id`-style closed vocabulary for this file's own small
  concept) rather than inventing a divergent shape — see `verification` for
  how this was confirmed and `compilation_decisions` for where this file's
  content necessarily differs from those 3 siblings' fully-grounded cases.


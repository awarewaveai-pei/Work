blocked_scope:
  status: RESOLVED_2026-08-30
  resolved_by: "docs/adr/ADR-011-platform-gate-ownership-and-unification.md"
  historical_status_pre_2026-08-30: "TBD_PENDING_ROUND2_ADR, blocked_by OQ-10 (.ai/research/phase-0/open-questions.yaml L68-72); findings CROSS-R-5, CROSS-R-7, CROSS-T-11"
  this_file_does: >
    Defines the mandatory_gate_rule RECORD SHAPE, and now states 2
    condition-side rules (R3/R4 -> human-review-class gate;
    R3/R4 -> recovery-rollback-rehearsal-class gate) grounded in
    ADR-004 (trigger condition) + ADR-011 (gate_ref values). Does not yet
    enumerate a rule for every one of `gate_catalog`'s remaining 18 items —
    see `this_file_does_not` below, an intentional scope boundary, not an
    oversight.
  this_file_does_not: >
    Does not assert that the Global 14-item list is itself, item-by-item,
    an R3/R4-triggered `mandatory_gate_rule` — the Global tier is mandatory
    for EVERY deliverable regardless of risk tier (per ADR-011's own
    `gate_catalog.global.description`), which is a different kind of rule
    (unconditional, not risk-tier-triggered) than this file's
    `mandatory_gate_rule` shape models. Encoding the Global tier's
    always-on nature as `mandatory_gate_rule` entries (one per item, or one
    rule with `condition: "always"`) is left as a further, distinct
    compilation task — not performed here — since ADR-011 resolved the gate
    LIST, not this file's own further backlog of which items to encode as
    explicit rule rows.
  defers_to: "specs/execution/gate.schema.yaml#/gate_catalog (resolved 20-item registry, full detail)"

open_questions:
  - id: "OQ-MGATE-1"
    question: >
      RESOLVED 2026-08-30, same resolution as gate.schema.yaml's own
      OQ-GATE-1 (the two were always meant to resolve together — see the
      original question text below for why): `gate_ref` values are
      populated as literal strings referencing `gate.schema.yaml`'s
      `#/gate_catalog` as a documented list, not a hard schema `enum` on
      either side — `gate.schema.yaml` remains the one place the catalog's
      canonical content lives; this file's `gate_ref` continues to `$ref`
      that file's `gate_id` node for its TYPE only (unchanged since
      2026-08-29), now populated with real values instead of a TBD marker.

      Original question (2026-08-29, preserved for audit continuity): "Once
      Round 2 ADR resolves OQ-10, should `gate_ref` values be populated as
      literal strings (this file becomes the registry), or should this file
      instead `$ref` each rule's `gate_ref` against a strict `enum` defined
      back in `gate.schema.yaml` once THAT file gains one? The two open
      questions must be resolved together — whichever file becomes the enum
      owner, the other references it, not both independently declaring
      one."
    owner: "closed"
    blocks: "nothing — resolved"
  - id: "OQ-MGATE-2"
    question: >
      CORRECTED 2026-08-29 (critic-flagged MAJ-3 — see compilation_decisions
      above for the full re-adjudication). MP §158's Global 11-item list IS
      fully known (L5910-5920, includes "Rollback PASS" at L5918) — the
      original version of this question wrongly treated it as unverified.
      With the item names confirmed: should a second rule encode a
      Rollback/Recovery-class gate for R3/R4, paralleling the
      human-review-class rule above? Verified NOT on a clean 3-way
      convergence: Atlas §22.2 ("Recovery / Rollback Rehearsal PASS",
      L4193) and EC §68 ("Recovery Rehearsal", L2275) each place a
      Rollback/Recovery item at the HIGH-RISK tier (the same tier the
      human-review rule's convergence was grounded on); MP §158's high-risk
      addon contains only "Human Specialist Review PASS" (L5926) — its
      Rollback item ("Rollback PASS", L5918) sits at the GLOBAL tier only,
      with no high-risk-tier counterpart. So the convergence is 2-of-3 at
      the high-risk tier, not 3-of-3. Separately, risk-tier.schema.yaml's
      own R4.required_actions independently name "Recovery Drill" /
      "Rollback or Compensating Plan" — that is grounded ADR-004 content
      already, orthogonal to this Global/High-risk-gate-list question, and
      does not by itself resolve whether the Atlas/EC high-risk item should
      also become an R3/R4-triggered `mandatory_gate_rule` here. Left as an
      open question (not a rule) because a 2-of-3 convergence is a
      materially weaker basis than the 3-of-3 the human-review rule used,
      and because whether the Global 14/11-item list (which does include
      Rollback for all 3 candidates) applies universally at every risk tier
      remains itself the still-open CROSS-R-5/CROSS-R-7 question this whole
      file declines to adjudicate (see `blocked_scope`).
    owner: "closed"
    blocks: >
      RESOLVED 2026-08-30 — see this entry's postscript in
      `compilation_decisions` and the new `MGATE-R3-R4-RECOVERY-ROLLBACK`
      rule in `grounded_rules`. ADR-011 changed MP §158's (recommended)
      content to the 3-candidate union, closing the 2-of-3 gap this
      question was blocked on.
  - id: "OQ-MGATE-3"
    question: >
      PARTIALLY RESOLVED 2026-08-30: `action`'s enum gained
      `REQUIRE_RECOVERY_REHEARSAL` for the Rollback-class case (OQ-MGATE-2
      resolved it, see above), closing that half of this question. Original
      question (2026-08-29, preserved): "Should `action`'s enum eventually
      gain a value more precise than `REQUIRE_HUMAN_REVIEW` for
      non-human-review-class mandatory gates (e.g. a Red-Team-class or
      Rollback-class gate, once OQ-MGATE-2 or Round 2 ADR grounds one)?"
      The Red-Team-class half remains open — no grounded rule for a
      Red-Team-class gate exists yet (ADR-011 resolved the gate LIST, not
      which items get their own `mandatory_gate_rule` row — see
      `blocked_scope.this_file_does_not`), so no further `action` value is
      invented here.
    owner: "operator or future Phase 3/4 compilation pass (Red-Team-class half only)"
    blocks: "nothing — `action` stays the current 5-value enum until a concrete Red-Team-class rule needs a 6th value"


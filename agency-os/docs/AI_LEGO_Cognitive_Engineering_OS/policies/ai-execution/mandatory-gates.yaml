decided_by: >
  `docs/adr/ADR-011-platform-gate-ownership-and-unification.md` (ACCEPTED
  2026-08-30) now governs the gate_id VALUE SPACE this file's `gate_ref`
  fields reference — see `specs/execution/gate.schema.yaml#/gate_catalog`
  for the resolved 20-item registry. Before 2026-08-30, no ADR governed it
  and OQ-10 was REQUIRES_HUMAN_DECISION (identical situation to
  gate.schema.yaml at that time). ADR-004 Sub-decision (a) separately and
  independently governs the trigger CONDITION this file's grounded rules
  encode: risk-tier.schema.yaml's `mandatory_gate_injection_trigger`
  (`risk_tier IN [R3, R4]`, ACCEPTED 2026-08-29) is the machine-checkable
  form of Atlas §14.2's rule, expanded from Atlas's original R4-only
  ("risk_tier = critical") trigger to R3∪R4 — ADR-004's own text (L126):
  "Gate Injection 觸發條件從 critical 單一值擴大為 R3 ∪ R4 是語意變更...此為
  關閉既有保護缺口，非新增未經論證的範圍." This file applies that
  ADR-004-decided condition directly, exactly as MRSP §2.9 instructs, now
  with `gate_ref` (WHICH gate fires) populated from ADR-011's resolved
  catalog instead of the prior TBD_PENDING_ROUND2_ADR placeholder.

compilation_decisions:
  - question: >
      Given gate_id cannot be enumerated, should this whole file be
      deferred until Round 2 ADR lands — the way
      `specs/jurisdiction/conflict-of-laws-output.schema.yaml` was deferred
      in full (MRSP §2.6 L162, "兩個機制哪個該贏尚未裁決，非單純缺
      schema")?
    decision: >
      No. Build the rule SHAPE and the one grounded condition-side rule
      now; leave only `gate_ref` blocked per rule, not the whole file.
    reasoning: >
      The conflict-of-laws case is disputed at the MECHANISM level (which
      ENGINE governs is itself undecided) — nothing there is safely
      buildable without picking a side. Here, by contrast, the trigger
      CONDITION (`risk_tier IN [R3, R4]`) is already ADR-004-decided and is
      logically independent of the disputed gate-NAME/COUNT question — MRSP
      §3 (L288) draws exactly this distinction for `gate.schema.yaml` and
      `release-policy.yaml`, and this file follows the identical reasoning.
      Deferring the whole file would silently forfeit ADR-004's own
      already-accepted decision alongside the genuinely-undecided part,
      which is a worse outcome than building the shape and marking one
      field blocked.
  - question: >
      All three disputed gate-list candidates independently name SOME
      human-review-class high-risk gate (Master Plan §158 high_risk_addon:
      "Human Specialist Review PASS" — its ONLY high-risk item; Method
      Atlas §22.2: "Human Specialist Review PASS", L4188; Execution
      Contract §68: "Human Specialist", L2270 — the CROSS-T-11
      naming-drift item). risk-tier.schema.yaml's own ADR-004-decided
      `required_actions` separately mandate "Human Approval" (R3) and
      "Explicit Human Authority" (R4). Should this convergence be encoded
      as a rule now, using a coarse concept distinct from the disputed
      `gate_id`, per this task's explicit suggestion?
    decision: >
      Yes — add one grounded rule, condition `risk_tier IN [R3, R4]`,
      action `REQUIRE_HUMAN_REVIEW`, tagged with ONE new coarse
      `gate_concept: HUMAN_REVIEW_CLASS` value (not a general taxonomy),
      `gate_ref` left TBD_PENDING_ROUND2_ADR.
    reasoning: >
      This is not "inventing a gate list" or picking among the 3 disputed
      candidates — it records an observation true regardless of which
      candidate Round 2 ADR eventually picks: every one of the 3 disputed
      high-risk lists, AND risk-tier.schema.yaml's own independently
      ADR-004-decided R3/R4 required_actions, separately converge on SOME
      human-review gate for high-risk tiers. Naming the concept
      `HUMAN_REVIEW_CLASS` (not any of the 3 candidates' exact strings —
      "Human Specialist Review PASS" / "Human Specialist" — since
      CROSS-T-11's naming drift is specifically about THIS item) avoids
      endorsing one spelling. `action: REQUIRE_HUMAN_REVIEW` is a precise,
      non-forced fit: it is literally Master Plan §64's own second worked
      example's verdict ("Financial recommendation AND confidence < 0.8 ->
      REQUIRE HUMAN REVIEW"), reused here for a different condition, not a
      stretch mapping the way e.g. forcing "no deployment authority" onto
      one of EC §96's 7 Tool Broker dimensions would have been (see
      `tool-permissions.yaml`'s own compilation_decisions, which explicitly
      declined that stretch and used an additive field instead — the same
      discipline this file applies via `gate_concept`/`gate_ref` as
      additive fields alongside `condition`/`action`, not a replacement for
      them). `gate_concept` is informational metadata on the rule only; it
      is NOT a substitute for `gate_ref` and is NOT written back onto
      `gate.schema.yaml`'s `gate_result.gate_id` or any enum there —
      consistent with that file's own refusal to add a `category`
      discriminator to `gate_result` (its compilation_decisions, first
      entry) for the same "don't quietly pre-empt OQ-10" reason.
  - question: >
      Should a second rule be added for the Rollback/Recovery-class gate
      that also appears across the disputed candidates (Atlas/EC high-risk
      "Recovery / Rollback Rehearsal PASS" / "Recovery Rehearsal";
      risk-tier.schema.yaml R4 "Recovery Drill" / "Rollback or Compensating
      Plan")?
    decision: >
      Not added at 2026-08-29 build time — left as an explicit open
      question (OQ-MGATE-2). SUPERSEDED 2026-08-30: now added as
      `MGATE-R3-R4-RECOVERY-ROLLBACK` in `grounded_rules` below — see the
      postscript at the end of this entry's `reasoning` for why the
      blocking 2-of-3 concern no longer applies.
    reasoning: >
      CORRECTED 2026-08-29 (critic-flagged MAJ-3: the original version of
      this entry claimed MP §158's Global 11-item list's names were "not
      transcribed anywhere in this project's existing artifacts" — false;
      direct read of MP §158 L5910-5920 confirms all 11 names, including
      "Rollback PASS" at L5918). The corrected picture: all 3 candidates DO
      name a Rollback-class item — MP §158 "Rollback PASS" (Global tier,
      L5918), Atlas §22.1 "Rollback PASS" (Global tier, L4178), EC §68
      "Rollback" (Global tier, L2262). But the ORIGINAL question here was
      narrower than plain existence: it asked whether a Rollback/Recovery
      gate should be added as an R3/R4-triggered rule PARALLELING the
      MGATE-R3-R4-HUMAN-REVIEW rule above — i.e. whether it belongs to the
      same HIGH-RISK-ADDON convergence class that rule was grounded on, not
      merely whether the item name exists anywhere. On that narrower
      question, the 3-way convergence does NOT hold: Atlas §22.2 and EC §68
      each separately list a HIGH-RISK addon item ("Recovery / Rollback
      Rehearsal PASS", L4193; "Recovery Rehearsal", L2275) distinct from
      their own Global "Rollback PASS"/"Rollback" entries — but MP §158's
      high-risk addon contains ONLY "Human Specialist Review PASS" (L5926,
      confirmed by direct read: no second high-risk line exists at
      L5923-5927); MP's Rollback item is Global-tier only, with no
      high-risk-tier counterpart. So only 2 of 3 candidates (Atlas, EC)
      converge on a High-risk-tier Rollback/Recovery item — the same
      convergence bar the human-review rule met (3 of 3) is not met here
      (2 of 3). Adding an R3/R4-triggered Rollback rule on a 2-of-3 basis
      would be a materially weaker inference than the human-review rule's
      justification, not the same class of "true regardless of which
      candidate wins" observation — so the original "not added, left open"
      OUTCOME still holds, now for the correct, verified reason (a
      confirmed 2-of-3 split on the high-risk-tier question, not an
      unverifiable gap in what MP §158 names). See OQ-MGATE-2 below,
      likewise corrected.

      **POSTSCRIPT 2026-08-30**: `docs/adr/ADR-011-platform-gate-ownership-
      and-unification.md` Sub-decision (b) resolves the underlying 2-of-3
      split this entry's whole analysis turned on — MP §158's content,
      once amended per that ADR, becomes the UNION of all three
      candidates, which includes the Recovery/Rollback high-risk item. The
      2-of-3-convergence objection was specifically about MP's *original*
      11+1 content not naming a high-risk Recovery/Rollback item; ADR-011
      changes what MP's content IS, not merely how MP/Atlas/EC are
      reconciled around each other. With MP's own (ADR-011-recommended)
      content now including it, all three candidates converge — the same
      3-of-3 bar the human-review rule already met. `MGATE-R3-R4-
      RECOVERY-ROLLBACK` is added to `grounded_rules` below on that basis.
  - question: >
      Sibling files `tool-permissions.yaml`/`forbidden-actions.yaml` each
      pair their condition/action rule shape with a literal
      `mother_doc_text` field preserving one verbatim mother-document
      quote per rule. Should this file's rule carry one too?
    decision: >
      `mother_doc_text` is included in the shape as OPTIONAL
      (`type: [string, "null"]`, default null), left `null` on the one
      populated rule.
    reasoning: >
      Unlike EC §97's 4 examples or Master Plan §65's 5-item list (each a
      single, self-contained verbatim bullet a sibling file's rule
      instantiates 1:1), this file's grounded rule synthesizes MULTIPLE
      independent citations (risk-tier.schema.yaml's two separate
      required_actions entries, plus 3 disputed-candidate documents' each
      naming a differently-worded human-review item) — there is no single
      mother-document sentence this rule is "the transcription of".
      Forcing one citation into `mother_doc_text` would misrepresent a
      synthesis as a quotation. The full citation trail is instead carried
      in `source` (a free-text, multi-citation field), and the field stays
      in the shape (rather than being dropped) so a FUTURE rule that does
      instantiate one literal mother-document quote can populate it,
      keeping this file's shape compatible with its siblings'.

# ---------------------------------------------------------------------------
# Schema body
# ---------------------------------------------------------------------------

# Root $ref (established pattern in this suite — see risk-tier.schema.yaml,
# tool-permissions.yaml, forbidden-actions.yaml: without a root-level type
# constraint, a validator pointed at this file's ROOT would accept ANY
# value). This file's root validates as `mandatory_gate_rules` (an array of
# rule objects) — an open-ended rule set, not a fixed-count one (contrast
# forbidden-actions.yaml's closed 5-item array).
$ref: "#/mandatory_gate_rules"

definitions:

  gate_concept_id:
    description: >
      A small, LOCALLY-owned vocabulary of coarse gate concepts that are
      true regardless of how Round 2 ADR resolves OQ-10 (see
      `compilation_decisions`). Deliberately NOT the same kind of thing as
      `gate.schema.yaml#/gate_result/properties/gate_id` (the disputed,
      externally-owned identifier space this file does not enumerate) —
      this enum only grows when a NEW cross-candidate convergence is
      independently confirmed, the way `HUMAN_REVIEW_CLASS` was here.
    type: string
    enum: [HUMAN_REVIEW_CLASS]

  mandatory_gate_rule:
    description: >
      "When <condition>, a gate is mandatory." Structural shape only; only
      `gate_ref` (per rule) carries the blocked value space — the shape
      itself and the one populated rule in `grounded_rules` below are not
      blocked. Field shape aligned with sibling files `tool-permissions
      .yaml`/`forbidden-actions.yaml`/`network-egress.yaml` (Master Plan
      §64 condition/action rule style, plus this file's own additive
      gate-specific fields).
    type: object
    required: [rule_id, condition, action, risk_tier_in, gate_ref, source]
    properties:
      rule_id:
        type: string
        pattern: "^MGATE-"
      condition:
        type: string
        description: >
          Structured predicate, Master Plan §64 rule-shape style (e.g.
          "risk_tier IN ['R3', 'R4']"). Free text — no formal predicate
          grammar is defined anywhere in the mother-document corpus for
          this purpose, so none is invented here (same choice
          `tool-permissions.yaml`'s `condition` field made).
      action:
        type: string
        enum: [DENY, ALLOW, SCOPE_TO, REQUIRE_HUMAN_REVIEW, REQUIRE_RECOVERY_REHEARSAL]
        description: >
          Master Plan §64's own condition/action vocabulary (DENY/ALLOW/
          SCOPE_TO/REQUIRE_HUMAN_REVIEW), reused verbatim from sibling file
          `tool-permissions.yaml`, PLUS one additive value,
          `REQUIRE_RECOVERY_REHEARSAL` (added 2026-08-30, closing
          `open_questions.OQ-MGATE-3`'s forward-looking question): grounded
          by ADR-011's resolved `recovery_rollback_rehearsal` gate item
          (`specs/execution/gate.schema.yaml#/gate_catalog/high_risk`) via
          the `MGATE-R3-R4-RECOVERY-ROLLBACK` rule below. Kept as a
          non-closed enum — unlike `forbidden-actions.yaml`'s
          exhaustively-known 5-verb set, this file's rule set may still
          grow (e.g. if a future Red-Team-class rule is grounded), and a
          future gate rule may need a verdict this file's 2 current
          grounded rules do not use.
      risk_tier_in:
        type: array
        minItems: 1
        items:
          $ref: "ai-lego://specs/execution/risk-tier.schema.yaml#/risk_tier"
        description: >
          Grounded in execution/risk-tier.schema.yaml
          `mandatory_gate_injection_trigger.condition`
          ("risk_tier IN [R3, R4]"), itself ADR-004 Sub-decision (a)'s
          R3∪R4 union of Atlas §14.2's original R4-only trigger. Additive
          detail alongside the free-text `condition` field above, the same
          "literal condition/action plus granular fields" convention
          `tool-permissions.yaml`'s compilation_decisions established.
      gate_ref:
        description: >
          TBD_PENDING_ROUND2_ADR. Reuses (does not re-declare)
          `gate.schema.yaml`'s `gate_result.gate_id` identifier type — the
          same untyped-string-with-marker treatment, deferred to the same
          OQ-10 resolution. The JSON Pointer target is
          `#/gate_result/properties/gate_id` (gate_id is nested under the
          `gate_result` object's `properties` in that file, not at its
          document root) — resolution verified with a Draft202012Validator
          + `ai-lego://` resolver, see `verification`.
        $ref: "ai-lego://specs/execution/gate.schema.yaml#/gate_result/properties/gate_id"
      gate_concept:
        $ref: "#/definitions/gate_concept_id"
        description: >
          OPTIONAL. Populated only where ALL 3 disputed gate-list
          candidates independently converge (see `compilation_decisions`).
          NOT a substitute for `gate_ref`.
      source:
        type: string
        description: "Citation(s) grounding this rule's condition side."
      mother_doc_text:
        type: [string, "null"]
        default: null
        description: >
          OPTIONAL, unlike sibling files where it is required — see
          `compilation_decisions` for why this file's grounded rule is a
          multi-citation synthesis rather than a single verbatim quote.
    constraints:
      - "gate_ref SHOULD be one of specs/execution/gate.schema.yaml#/gate_catalog's ids (RESOLVED 2026-08-30 by ADR-011). Before 2026-08-30 this constraint instead forbade populating gate_ref with any disputed candidate string — historical detail retained in `compilation_decisions` for audit continuity, not restated as a live rule."
      - "gate_concept, when present, MUST be one of #/definitions/gate_concept_id's enum values — deliberately NOT open-ended, to prevent this file from becoming an unreviewed second gate taxonomy alongside gate.schema.yaml#/gate_catalog."

mandatory_gate_rules:
  type: array
  minItems: 1
  items:
    $ref: "#/definitions/mandatory_gate_rule"
  description: >
    Open-ended rule set — NOT a closed/fixed-count array (contrast
    `forbidden-actions.yaml`'s `minItems: 5, maxItems: 5` treatment of its
    exhaustively-known 5-verb set). More rules may still be added as
    further convergences are found (e.g. a future Red-Team-class rule, per
    `open_questions.OQ-MGATE-3`) — this is no longer blocked on OQ-10,
    which ADR-011 resolved 2026-08-30.

# ---------------------------------------------------------------------------
# GROUNDED — this file's actual policy content: 2 rules as of 2026-08-30
# (MGATE-R3-R4-RECOVERY-ROLLBACK added when ADR-011 resolved OQ-MGATE-2's
# blocking 2-of-3-convergence concern).
# ---------------------------------------------------------------------------
grounded_rules:
  description: >
    This file's actual policy content today — the 2 rules
    `mandatory_gate_rules` above validates. Named separately from the
    schema-body node (which some validators may point at directly), same
    convention as sibling files' `worked_examples`/`seed_content`.
  rules:
    - rule_id: "MGATE-R3-R4-HUMAN-REVIEW"
      condition: "risk_tier IN ['R3', 'R4']"
      action: REQUIRE_HUMAN_REVIEW
      risk_tier_in: [R3, R4]
      gate_ref: "human_specialist_review"
      gate_concept: HUMAN_REVIEW_CLASS
      source: >
        execution/risk-tier.schema.yaml tiers.R3.required_actions
        ("Human Approval"), tiers.R4.required_actions ("Explicit Human
        Authority") — both ADR-004-decided; cross-checked against all 3
        disputed high-risk gate-list candidates independently naming a
        human-review-class gate (Master Plan §158 high_risk_addon "Human
        Specialist Review PASS"; Method Atlas §22.2 "Human Specialist
        Review PASS", L4188; Execution Contract §68 "Human Specialist",
        L2270 — CROSS-T-11's naming-drift item, now resolved to
        "Human Specialist Review PASS" by ADR-011 Sub-decision (c)).
        `gate_ref` value updated 2026-08-30 from `TBD_PENDING_ROUND2_ADR`
        to `specs/execution/gate.schema.yaml#/gate_catalog/high_risk`'s
        `human_specialist_review` id, per ADR-011.
      mother_doc_text: null
    - rule_id: "MGATE-R3-R4-RECOVERY-ROLLBACK"
      condition: "risk_tier IN ['R3', 'R4']"
      action: REQUIRE_RECOVERY_REHEARSAL
      risk_tier_in: [R3, R4]
      gate_ref: "recovery_rollback_rehearsal"
      source: >
        Added 2026-08-30, closing `open_questions.OQ-MGATE-2` (see that
        entry's 2026-08-30 postscript for the full re-adjudication).
        ADR-011 Sub-decision (b) makes Master Plan §158's (recommended)
        content the union of all three candidates, which now includes
        Atlas §22.2 / EC §68's High-risk "Recovery / Rollback Rehearsal
        PASS" / "Recovery Rehearsal" item (`specs/execution/
        gate.schema.yaml#/gate_catalog/high_risk`'s
        `recovery_rollback_rehearsal` id) — closing the 2-of-3 convergence
        gap that previously blocked this rule (MP's pre-ADR-011 content
        named only a Global-tier Rollback item, not a High-risk-tier one).
        Independently corroborated by risk-tier.schema.yaml's own
        ADR-004-decided R4.required_actions ("Recovery Drill", "Rollback or
        Compensating Plan") — orthogonal grounding that does not by itself
        require this rule, but is consistent with it.
      mother_doc_text: null


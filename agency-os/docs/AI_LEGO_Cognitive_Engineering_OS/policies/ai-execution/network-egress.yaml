$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://policies/ai-execution/network-egress.yaml"
title: Network Egress Policy
version: "1.0.0"
status: PARTIALLY_DEFINED  # 2026-08-30: allowlist 主體已由操作者提供並填入 seed_content.rules 的 EGRESS-EC99-2；OQ-EGRESS-2/3 仍待決，見 open_questions

description: >
  Canonical machine-readable STRUCTURE for the Network Egress policy named
  by Execution Contract §99 (L2920-2934) — a genuinely thin source: three
  short lines of prose, no worked examples, no field names, and (verified by
  grep across all three mother documents, every accepted ADR, and every
  `.ai/research/` artifact) zero real domain names anywhere in the corpus
  for this purpose. EC §99 states exactly 3 things: (1) for 高敏感專案
  (high-sensitivity projects), the default posture is `deny by default`;
  (2) reaching an external domain at all requires an `allowlist` — the
  named escape-hatch mechanism around the deny-by-default baseline; (3)
  regardless of the above, avoid untrusted-document-induced data
  exfiltration ("避免 untrusted document 誘導資料外傳").

  This file builds the RULE SHAPE and the two structural/behavioral rules
  EC §99 actually decides (deny-by-default; watch for document-induced
  exfiltration) as real, ACTIVE-grade content. At original compilation time
  it deliberately did NOT invent the one thing EC §99 leaves unstated: which
  actual domains belong on the allowlist — that content required
  operator/organizational input no mother document, ADR, or research
  artifact supplied, the same class of gap `gate.schema.yaml`'s
  `gate_id_registry` (renamed `gate_catalog` and resolved 2026-08-30 by
  ADR-011) and `rigor-level.schema.yaml`'s
  `required_rigor_mapping.deep_intelligence` established a precedent for in
  this suite (build the skeleton now, mark the blocked value space
  explicitly, do not guess).

  **RESOLVED 2026-08-30**: the operator provided the real global-default
  allowlist directly in chat (a full `aware-wave.com` DNS zone export plus
  4 additional client/product domains), and it is now populated in
  `seed_content.rules`'s `EGRESS-EC99-2.allowlist` (first-party domains plus
  known third-party integrations already documented in AGENTS.md — no new
  guessing). This is why top-level `status` above reads `PARTIALLY_DEFINED`,
  not the original `PROVISIONAL`: the allowlist — this file's primary
  practical payload — now has real global-default content, so the file can
  do its main job. It is `PARTIALLY_DEFINED` rather than `ACTIVE` only
  because per-tenant/per-project scoping (part of `OQ-EGRESS-1`) and
  `OQ-EGRESS-2`/`OQ-EGRESS-3` remain genuinely open — see `open_questions`
  below for exactly what's still undecided. See `compilation_decisions` for
  the file's original PROVISIONAL rationale, kept as historical record.

  Also cross-references EC §101 Data Classification (L2955-2972) — "Restricted：
  external provider routing must be policy-approved" is the same network-
  egress concern viewed from the data-classification angle — and Master
  Plan §64's own literal worked example ("Restricted data AND
  external_model = true -> DENY", L2731-2734), which this file reuses
  as one grounded worked example that needs no domain name at all (a
  blanket deny on Restricted-classified data reaching any external model,
  regardless of which domain).

source_of_truth_for:
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §99 Network Egress (L2920-2934) — the file's entire structural grounding"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §101 Data Classification (L2955-2972) — Restricted data's external-provider-routing rule, cross-referenced"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §91 Policy-as-Code Paths (L2750-2762, network-egress.yaml at L2759)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md §64 Policy-as-Code (L2714-2741) — condition/action rule-shape style, and the literal 'Restricted data AND external_model = true -> DENY' worked example this file reuses"
  - "specs/security/personal-data-envelope.schema.yaml#/properties/classification_tag (soft cross-reference — the existing canonical instance of the MP §61/EC §101 four-value Public/Internal/Confidential/Restricted vocabulary; no standalone domain/data-classification.schema.yaml exists in this repo, verified by grep, so this file cites that vocabulary by name rather than inventing a second copy of it)"
  - ".ai/research/phase-0/policy-inventory.yaml (L435-437: 'Network Egress deny-by-default + allowlist for high-sensitivity projects' tagged kind=policy — independent corroboration of EC §99's own framing, no additional content beyond what EC §99 itself states)"
decided_by: >
  No ADR. docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §2.9 lists
  `ai-execution/` (EC §91's 8-file list, including network-egress.yaml) as
  READY overall, but that row's READY status describes the EC §91 list's
  8 files as a GROUP relative to the BLOCKED_PENDING_ROUND2_ADR rows
  elsewhere in the same table (release/, and gate.schema.yaml's own
  gate_id) — it does not certify that every one of the 8 files has fully
  populated, operator-ready content. This file's own allowlist content gap
  is the same SHAPE of blockage `gate.schema.yaml` (Wave 5) already
  encountered and resolved by building the skeleton now with the blocked
  value space explicitly marked (MACHINE_READABLE_SPEC_PLAN.md §3 Build
  Order, L288 — corrected 2026-08-29, critic-flagged Minor: originally
  mis-cited as "§4 L246", wrong section AND wrong line even before the
  capability-contract edit that later shifted this file's other §3/§5
  citations by +1 line; re-verified directly against the current document:
  "可以先建這兩檔的骨架...gate_id enum 留 TBD_PENDING_ROUND2，不阻塞其餘
  30+ 個檔案的建置") — applying that same established precedent here, for
  the same reason (a genuinely undecided value space must not block the
  surrounding structural work, but also must not be silently guessed).
  Unlike gate_id's blockage (which is a NAMING/LIST dispute the corpus
  already argues about — CROSS-R-5/CROSS-R-7/CROSS-T-11), this file's gap
  is a pure ABSENCE (no mother document, ADR, or research artifact contains
  even a candidate domain), which is why `open_questions` below frames it
  as requiring fresh operator input rather than an ADR adjudicating between
  competing existing lists.

compilation_decisions:
  - question: >
      Every other file in this suite (46 files checked via grep) uses
      top-level `status: ACTIVE`, including files with a genuinely blocked
      sub-field (`gate.schema.yaml`'s `gate_id_registry.status:
      TBD_PENDING_ROUND2_ADR` at this task's write time — since renamed to
      `gate_catalog` and resolved 2026-08-30 by ADR-011; cited as a
      point-in-time precedent, not current status — and
      `authority.schema.yaml`'s
      `role_to_authority_mapping.status: SKELETON_ONLY`). This task's
      instructions explicitly direct `status: PROVISIONAL` for this file
      specifically. Should this file instead follow the suite-wide
      ACTIVE-at-top-level convention, with the gap marked only at the
      `allowlist` field level (matching `gate.schema.yaml`'s precedent
      exactly)?
    decision: >
      Follow this task's explicit instruction: top-level `status:
      PROVISIONAL`. This is a deliberate, disclosed deviation from the
      suite's prior unanimous ACTIVE-at-top-level pattern, not an
      inconsistency introduced by accident. **Superseded 2026-08-30**: once
      the operator supplied the real allowlist (see top-of-file description),
      top-level `status` was promoted from `PROVISIONAL` to
      `PARTIALLY_DEFINED` — the reasoning below for why file-level (not
      just field-level) marking matters still holds, it now marks "the
      global-default case is real, per-tenant/per-project scoping is still
      open" rather than "the whole allowlist is empty."
    reasoning: >
      The distinguishing factor from `gate.schema.yaml` is WHERE the
      blocked content sits relative to the file's purpose.
      `gate.schema.yaml`'s `gate_result` record shape (gate_id, status,
      evidence, validator, timestamp, rationale) is fully usable today —
      only the VALUE SPACE of one identifying field (`gate_id`) is
      undecided, and a real gate outcome can still be recorded, audited,
      and reasoned about with a provisional string in that field. This
      file's situation is structurally worse: a Network Egress policy's
      entire practical function IS the allowlist — a `network-egress.yaml`
      with an empty allowlist enforces total deny-by-default for external
      domains, which may or may not be the operator's intent (it is
      certainly EC §99-compliant, but likely not deployable as-is for any
      project that needs ANY external domain reachable). Marking only the
      `allowlist` field internally (gate.schema.yaml-style) while leaving
      top-level `status: ACTIVE` would risk a downstream reader treating
      this file as "ready to enforce" when its central content is empty by
      design — exactly the failure mode `authority.schema.yaml`'s
      `role_to_authority_mapping.status: SKELETON_ONLY` field-level marker
      was built to prevent for an EMPTY ARRAY specifically ("An empty array
      alone is genuinely ambiguous... could be misread as materially
      different and dangerous"). Promoting that same honesty to file-level
      `status` here is the more conservative, more visible choice for a
      file whose blocked content is not a peripheral field but its reason
      to exist.
  - question: >
      EC §99's three lines (deny-by-default for high-sensitivity projects;
      allowlist for external domains; avoid untrusted-document-induced
      exfiltration) could be modeled either as ONE unified layered policy
      (a single deny-by-default rule, with the allowlist as its escape
      hatch and the exfiltration warning as an overlay) or as up to 3
      independently-scoped named rules. Which did this file choose, and
      why?
    decision: >
      Modeled as 3 independently-scoped named rules, distinguished by an
      `egress_scope` enum with exactly 3 values
      (HIGH_SENSITIVITY_PROJECT, EXTERNAL_DOMAIN_ROUTING,
      UNTRUSTED_DOCUMENT_CONTEXT — SNAKE_CASE-normalized from EC §99's own
      3-part textual structure). Flagged as an interpretive choice, not a
      certainty, in `open_questions.OQ-EGRESS-2` — a future operator or
      Round-2 review may prefer the single-layered-policy reading instead.
    reasoning: >
      This suite's established convention for a policy/record collection is
      an array of individually-auditable, separately-versionable rule
      instances (every sibling file in this Wave — tool-permissions.yaml,
      forbidden-actions.yaml — follows this shape), rather than one
      monolithic composite rule. Keeping the 3 scopes as separate rule
      instances also makes each one independently `contains`-checkable for
      coverage (see the next decision below) without forcing an artificial
      choice about layering order EC §99's own 3 short, unordered lines do
      not actually specify.
  - question: >
      EC §99's 3-part structure has no "例如"/"for example" framing (unlike
      tool-permissions.yaml's EC §97 source) — is `egress_scope` a closed,
      exhaustive 3-value set requiring the same full-coverage `contains`
      treatment this Wave's forbidden-actions.yaml applies to its 5-value
      set?
    decision: >
      Partially. Apply `contains`/`minContains: 1` per `egress_scope`
      value (guaranteeing all 3 named cases are represented at least once)
      but deliberately do NOT apply `maxContains: 1` or a fixed
      `minItems`/`maxItems` on the rule array as a whole — unlike
      forbidden-actions.yaml's 5 mutually-exclusive singleton verbs, a real
      deployment legitimately needs MULTIPLE rules sharing one
      `egress_scope` (e.g. many different EXTERNAL_DOMAIN_ROUTING rules,
      one per tenant or data-classification tier) — that is an expected,
      healthy pattern here, not a duplicate-detection concern the way a 2nd
      DELETE entry would be in forbidden-actions.yaml.
    reasoning: >
      EC §99's list IS closed as a set of NAMED CONCERNS (no 4th concern is
      textually present), which is what `minContains: 1` per value
      guarantees — but it is not closed as a set of RULE INSTANCES, which
      is what `maxContains: 1` would wrongly imply. Treating this file's
      array exactly like forbidden-actions.yaml's would misrepresent an
      open-ended rule set as a fixed 3-item list.
  - question: >
      How should `allowlist` avoid ever being mistaken for a real, decided
      domain list, given this task's explicit instruction not to fabricate
      one?
    decision: >
      Every real rule instance in `seed_content` below carries `allowlist:
      []` (empty). A separate, explicitly `ILLUSTRATIVE_NON_NORMATIVE`
      shape example uses the single domain string `example.invalid` — the
      IANA-reserved "invalid" TLD (RFC 2606), guaranteed to never resolve
      to any real, registrable service — rather than `example.com` (a real,
      resolvable domain that could be misread as an implicit
      recommendation).
    reasoning: >
      Matches `authority.schema.yaml`'s `role_to_authority_mapping
      .entry_shape` precedent (`_status: ILLUSTRATIVE_NON_NORMATIVE`, an
      explicit `_warning`, empty real `entries: []`) for the same class of
      gap: a structurally-necessary field with zero legitimate content to
      populate yet.

# ---------------------------------------------------------------------------
# Schema body
# ---------------------------------------------------------------------------

# Root $ref (established pattern in this suite — see risk-tier.schema.yaml,
# tool-permissions.yaml, forbidden-actions.yaml: without a root-level type
# constraint, a validator pointed at this file's ROOT would accept ANY
# value). Full absolute `ai-lego://` form used throughout this file, not a
# bare `#/...` fragment. CAVEAT SCOPED 2026-08-29 (critic-flagged
# Suggestion): the original comment here claimed a bare same-document
# `#/...` $ref "can silently fail to resolve" under any validator once the
# base scope is a custom scheme. Critic review re-tested this directly and
# found it true ONLY for jsonschema's deprecated `RefResolver`; under
# `referencing` (jsonschema >= 4.18, the library's current default), bare
# `#/` fragments resolve correctly even against an `ai-lego://` base — and
# bare `#/` is in fact this corpus's dominant convention (56 pre-existing
# instances vs. 67 absolute, per that review). This file's own choice to
# write full absolute form throughout is kept as-is (harmless, and matches
# 3 of its 7 directory siblings), but the comment no longer overstates the
# hazard as universal — it applies specifically to code still using the
# legacy `RefResolver`. See this file's `verification` section for the
# original jsonschema run this was caught by.
$ref: "ai-lego://policies/ai-execution/network-egress.yaml#/egress_rules"

definitions:

  egress_scope:
    description: >
      EC §99's own 3-part structure (L2920-2934), SNAKE_CASE-normalized. No
      4th value is invented — see compilation_decisions.
    type: string
    enum: [HIGH_SENSITIVITY_PROJECT, EXTERNAL_DOMAIN_ROUTING, UNTRUSTED_DOCUMENT_CONTEXT]

  egress_rule:
    description: >
      One Network Egress rule instance. `allowlist` is meaningful only for
      `scope: EXTERNAL_DOMAIN_ROUTING` rules whose `action` is
      `ALLOWLIST_GATED`; it MUST be `[]` for any other scope/action
      combination (see `constraints`).
    type: object
    required: [scope, condition, default_policy, action, mother_doc_text]
    properties:
      rule_id:
        type: string
        pattern: "^EGRESS-"
      scope:
        $ref: "ai-lego://policies/ai-execution/network-egress.yaml#/definitions/egress_scope"
      condition:
        type: string
        description: "Structured predicate, Master Plan §64 rule-shape style."
      default_policy:
        type: string
        enum: [deny, allow]
        description: "EC §99's own literal 'deny by default' framing, as a two-value baseline-posture field."
      action:
        type: string
        enum: [DENY, ALLOW, ALLOWLIST_GATED, REQUIRE_HUMAN_REVIEW]
        description: >
          Master Plan §64's condition-action vocabulary, extended with
          `ALLOWLIST_GATED` — necessary because EC §99's own allowlist
          mechanism is neither a bare ALLOW nor a bare DENY, it is
          conditional on domain-list membership, a verdict shape MP §64's
          2 worked examples (both plain DENY / REQUIRE HUMAN REVIEW) never
          needed to express.
      allowlist:
        type: array
        default: []
        items:
          type: string
          description: "A domain string. See compilation_decisions and open_questions.OQ-EGRESS-1 — deliberately empty in every real rule instance below."
      classification_tag_ref:
        anyOf:
          - type: string
            enum: [Public, Internal, Confidential, Restricted]
          - type: "null"
        default: null
        description: >
          ADDITIVE, optional. Soft cross-reference to the MP §61/EC §101
          four-value classification vocabulary (also the exact enum
          `specs/security/personal-data-envelope.schema.yaml
          #/properties/classification_tag` uses) — populated when a rule's
          condition is scoped to a specific data classification, as in the
          Master Plan §64 worked example below.
      mechanism_ref:
        type: [string, "null"]
        default: null
      source:
        type: string
      mother_doc_text:
        type: string
        description: "The literal EC §99 (or MP §64) text this rule instantiates, verbatim."
    constraints:
      - "`allowlist` MUST be `[]` unless `scope == EXTERNAL_DOMAIN_ROUTING AND action == ALLOWLIST_GATED`."
      - "`default_policy` MUST be `deny` for every rule this file currently defines — EC §99 states no case where an external-facing default of `allow` is sanctioned (see open_questions.OQ-EGRESS-2 for whether a future rule could ever legitimately set it to `allow`)."

egress_rules:
  type: array
  items:
    $ref: "ai-lego://policies/ai-execution/network-egress.yaml#/definitions/egress_rule"
  allOf:
    - contains: { properties: { scope: { const: HIGH_SENSITIVITY_PROJECT } } }
      minContains: 1
    - contains: { properties: { scope: { const: EXTERNAL_DOMAIN_ROUTING } } }
      minContains: 1
    - contains: { properties: { scope: { const: UNTRUSTED_DOCUMENT_CONTEXT } } }
      minContains: 1

# ---------------------------------------------------------------------------
# EC §99's 3 named concerns, plus the MP §64 worked example, instantiated.
# `allowlist` is `[]` in every entry — see compilation_decisions and
# open_questions.OQ-EGRESS-1. This is this file's entire real content;
# nothing beyond EC §99 and MP §64's literal text is invented here.
# ---------------------------------------------------------------------------
seed_content:
  description: >
    4 rule instances validating against `egress_rule` above: one per EC
    §99 named concern, plus Master Plan §64's own literal worked example
    (which needs no domain name — a blanket deny on Restricted data
    reaching any external model).
  rules:
    - rule_id: "EGRESS-EC99-1"
      scope: HIGH_SENSITIVITY_PROJECT
      condition: "project_sensitivity = high"
      default_policy: deny
      action: DENY
      allowlist: []
      classification_tag_ref: null
      mechanism_ref: null
      source: "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §99 (L2922-2926)"
      mother_doc_text: "高敏感專案：deny by default"

    - rule_id: "EGRESS-EC99-2"
      scope: EXTERNAL_DOMAIN_ROUTING
      condition: "destination = external domain"
      default_policy: deny
      action: ALLOWLIST_GATED
      allowlist:
        # 2026-08-30 操作者於對話中提供：① aware-wave.com DNS zone 全文匯出
        # ② wusheng.foundation/hope-flow.org/weartheworld.org/chi.aware-wave.com
        # 手動補充。單人公司（見 authority.schema.yaml role_to_authority_mapping
        # 2026-08-30 決議），目前無多租戶區隔需求，此為 global default scope。
        # 第一方網域（AwareWave 自有／代管）：
        - "aware-wave.com"
        - "www.aware-wave.com"
        - "api.aware-wave.com"
        - "app.aware-wave.com"
        - "cognitive.aware-wave.com"
        - "chi.aware-wave.com"
        - "docs.aware-wave.com"
        - "ks-aw-01.aware-wave.com"
        - "mainwp.aware-wave.com"
        - "n8n.aware-wave.com"
        - "oracle.aware-wave.com"
        - "portal.aware-wave.com"
        - "postiz.aware-wave.com"
        - "remotion-svc.aware-wave.com"
        - "studio.aware-wave.com"
        - "supabase.aware-wave.com"
        - "trigger.aware-wave.com"
        - "trust.aware-wave.com"
        - "uptime.aware-wave.com"
        - "video-svc.aware-wave.com"
        # 客戶/專案網域（操作者代管的獨立品牌站）：
        - "wusheng.foundation"
        - "hope-flow.org"
        - "weartheworld.org"
        # 既有已知第三方整合（AGENTS.md 已記載的實際串接，非本次新猜測）：
        - "github.com"
        - "api.anthropic.com"
        - "api.openai.com"
        - "chatgpt.com"
        - "resend.com"
        - "api.resend.com"
        - "amazonses.com"
        - "api.cloudflare.com"
        # 學術文獻 provider（2026-09-17 操作者指示 EdD 文獻搜尋改為真實查詢；免金鑰、唯讀）。
        # runtime 對應：docker-compose.yml COGNITIVE_OS_NETWORK_EGRESS_ALLOWLIST，
        # ai_lego/modules/research/literature_providers.py require_egress_allowed()。
        - "api.openalex.org"
        # api.anthropic.com（已列於上方第三方整合）自 2026-09-17 起也是 AI gateway 的 runtime 目的地：
        # ai_lego/platform/ai_gateway/provider.py，key 走 COGNITIVE_OS_ANTHROPIC_API_KEY（deploy/.env，不進 git）。
      classification_tag_ref: null
      mechanism_ref: >-
        2026-08-30 操作者提供第一方網域清單（DNS zone 全文 + 口頭補充 4 個），
        解除 OQ-EGRESS-1 主要阻塞。第三方整合網域取自 AGENTS.md 既有記載的
        真實串接（非新猜測）。**未完成**：per-tenant/per-project 細分
        （OQ-EGRESS-1 原問的另一半）——目前 HCI/Cognitive OS 尚無真實外部
        customer tenant，暫以 global default 處理；有真實多租戶客戶時需
        重新檢視是否要拆分。
      source: "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §99 (L2928-2932)"
      mother_doc_text: "外部 domain：allowlist"

    - rule_id: "EGRESS-EC99-3"
      scope: UNTRUSTED_DOCUMENT_CONTEXT
      condition: "content ingested from an untrusted document instructs or induces an outbound network request"
      default_policy: deny
      action: DENY
      allowlist: []
      classification_tag_ref: null
      mechanism_ref: >-
        No dedicated schema/mechanism exists yet in this repo for
        prompt-injection or exfiltration-intent detection specifically —
        EC §100 File Parsing Safety (L2938-2952) is the thematically
        closest adjacent section but addresses parser-level safety
        (archive bombs, path traversal, macros), not egress-triggered-by-
        untrusted-content specifically. See open_questions.OQ-EGRESS-3.
      source: "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §99 (L2934)"
      mother_doc_text: "避免 untrusted document 誘導資料外傳"

    - rule_id: "EGRESS-MP64-1"
      scope: EXTERNAL_DOMAIN_ROUTING
      condition: "classification_tag = Restricted AND external_model = true"
      default_policy: deny
      action: DENY
      allowlist: []
      classification_tag_ref: Restricted
      mechanism_ref: >-
        specs/security/personal-data-envelope.schema.yaml
        #/properties/classification_tag (soft cross-reference — same
        Restricted value); EC §101 Data Classification (L2966-2970,
        "Restricted：external provider routing must be policy-approved")
        states the identical rule from the data-classification angle.
      source: "AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md §64 (L2730-2734)"
      mother_doc_text: "Restricted data AND external_model = true -> DENY"

# ---------------------------------------------------------------------------
# BLOCKED — the allowlist VALUE SPACE. Recorded for auditability, not
# adjudicated. Same treatment style as gate.schema.yaml's gate_id_registry
# (that section is now named gate_catalog and resolved, since 2026-08-30's
# ADR-011 — cited here for its original PROVISIONAL-precedent shape).
# ---------------------------------------------------------------------------
allowlist_registry:
  status: OPERATOR_SIGNED_OFF  # 2026-08-30, see EGRESS-EC99-2.mechanism_ref for source
  this_file_does: >
    Defines the `egress_rule` SHAPE, including the `allowlist` field's
    type (array of domain strings) and the rule under which it is
    consulted (scope EXTERNAL_DOMAIN_ROUTING, action ALLOWLIST_GATED).
    2026-08-30: `EGRESS-EC99-2.allowlist` now carries the operator's real
    global-default domain list (first-party + known third-party
    integrations) — no longer a bare empty structural example.
  this_file_does_not: >
    Does not yet pick a PER-TENANT or PER-PROJECT allowlist scope — only a
    single global-default list (see EGRESS-EC99-2.mechanism_ref). That finer
    split remains open until a real external customer tenant exists (HCI /
    Cognitive OS are pre-launch as of 2026-08-30).
  allowlist_entry_shape:
    _status: ILLUSTRATIVE_NON_NORMATIVE
    _warning: >
      SHAPE EXAMPLE ONLY. `example.invalid` is the IANA-reserved "invalid"
      TLD (RFC 2606) — chosen specifically because it can never resolve to
      a real, registrable service, so it cannot be mistaken for an implicit
      domain recommendation. This value MUST NOT be copied into any real
      rule's `allowlist` array or enforced as policy.
    example: "example.invalid"


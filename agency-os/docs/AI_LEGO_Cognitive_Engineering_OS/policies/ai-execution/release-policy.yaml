# ---------------------------------------------------------------------------
# GROUNDED — EC §146 full standard flow, the segment bracketing release
# (verbatim node sequence, L3893-3937).
# ---------------------------------------------------------------------------
release_sequence:
  source: "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §146 完整標準流程 (L3893-3937)"
  description: >
    EC §146's full flow has 21 stages (USER/SYSTEM TASK through
    MONITOR/LEARN/REVERSE WHEN NEEDED, recounted directly against L3896-3936
    after critic review flagged the original "20" as an off-by-one, 2026-08-29);
    only the release-adjacent segment is transcribed here — see the source
    for the complete sequence, not re-duplicated in full.
  ordered_stages:
    - "QUALITY GATES"
    - "HUMAN AUTHORITY IF REQUIRED"
    - "STAGED RELEASE"
    - "POST-VERIFY"
    - "OBSERVATION WINDOW"
    - "HANDOFF"
    - "CLOSE"
  constraints:
    - "STAGED RELEASE MUST NOT occur before QUALITY GATES and HUMAN AUTHORITY IF REQUIRED (when required) have completed, per §146's linear ordering."
    - "POST-VERIFY, OBSERVATION WINDOW, and HANDOFF MUST all occur after STAGED RELEASE and before CLOSE, per §146's linear ordering — matches post_release_checklist's 'Observation window satisfied' / 'Handoff complete' items above."


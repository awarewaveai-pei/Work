$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://policies/ai-execution/release-policy.yaml"
title: Release Policy
version: "1.0.0"
status: ACTIVE

description: >
  Policy-as-code binding of the release-readiness rules — Execution
  Contract §91 "Policy-as-Code Paths" (L2750-2762) names this file
  `/policies/ai-execution/release-policy.yaml` at L2761. Originally named
  (2026-08-29) in MACHINE_READABLE_SPEC_PLAN.md §3 Build Order (L288)
  alongside `gate.schema.yaml` as blocked on the same undecided
  Global/High-risk Gate list (CROSS-R-5/CROSS-R-7/CROSS-T-11, OQ-10) —
  "只影響 Wave 5 的 gate.schema.yaml 與 Wave 6 的 release-policy.yaml".

  **RESOLVED 2026-08-30 by `docs/adr/ADR-011-platform-gate-ownership-and-
  unification.md`**: `release_gate_requirement.scope` now references
  `gate.schema.yaml#/gate_catalog` directly (both its always-required
  `global` items and its risk-tier-conditional `high_risk` items via
  `mandatory-gates.yaml`), closing `OQ-RELPOL-2` below. Per §2.9's own row
  for `ai-execution/` (L183, "BUILT（2026-08-29，8/8）"), this file's status
  was READY overall at write time, with the BLOCKED annotation applying
  specifically to `scope` — not to the entire file; that one field is now
  resolved too.

  What IS grounded, independent of the disputed list, and built here in
  full: EC §143 Pre-release Checklist (11 items, verbatim, L3846-3860) and
  §144 Post-release Checklist (10 items, verbatim, L3864-3877) — a
  PLAIN-TEXT checklist that is textually SEPARATE from the EC §68/Atlas §22
  Global/High-risk Gate enumeration (different item wording, different
  section, no cross-reference between them found in either section's own
  text, and not itself named in CROSS-R-5/CROSS-R-7/CROSS-T-11's finding
  text; see `compilation_decisions` for why this file does not assume they
  are the same list); EC §146's full standard flow (L3893-3937), for the
  sequencing constraint around STAGED RELEASE; and
  execution/risk-tier.schema.yaml's R3/R4 `required_actions` items that are
  release-specific (Canary/Blue-Green, Post-deployment Verification,
  Recovery Drill, Rollback or Compensating Plan, Emergency Stop) — all
  ADR-004-decided.

  What was BLOCKED (2026-08-29): the STRUCTURAL rule "release requires
  mandatory gates to PASS" was buildable (it only needed
  `gate.schema.yaml`'s `gate_result.status` enum, `status-codes.schema.yaml`'s
  Final Status enum, and this same Wave's sibling `mandatory-gates.yaml`'s
  rule shape, all three grounded), but WHICH gate_id values that rule
  ultimately ranges over was not. RESOLVED 2026-08-30 — see above.

  This file does not pick a side in the mother-document prose itself (that
  is ADR-011's job and the downstream ADR-006 proposal flow's). `status` is
  upgraded from `PROVISIONAL` to `ACTIVE` (2026-08-30): sibling file
  `network-egress.yaml`'s own criterion ("`PROVISIONAL` when the blocked
  content is close to the file's ENTIRE practical payload, `ACTIVE` when
  only one field of an otherwise-complete shape is blocked") now points to
  `ACTIVE`, since the one previously-blocked field (`release_gate_
  requirement.scope`) is resolved — see `compilation_decisions` for the
  full disclosure trail.

  Directory context (discovered mid-task): at the time of writing,
  `policies/ai-execution/` already contains `tool-permissions.yaml`,
  `forbidden-actions.yaml`, `network-egress.yaml`, and
  `exception-policy.yaml`, apparently produced by a concurrent session
  working through EC §91's same 8-file list, plus this Wave's sibling
  `mandatory-gates.yaml` (built immediately before this file, in the same
  task). This file's `release_gate_requirement` rule shape aligns with that
  concurrent convention (`condition`/`action` fields per Master Plan §64)
  rather than inventing a divergent shape.


# ---------------------------------------------------------------------------
# Schema body for the one structural rule this file defines. RESOLVED
# 2026-08-30 by ADR-011 — `scope` now names both the always-required
# gate_catalog.global set and the risk-tier-conditional mandatory-gates.yaml
# rule set (2 rules as of 2026-08-30), instead of a TBD placeholder.
# ---------------------------------------------------------------------------

# Root $ref (established pattern in this suite — see risk-tier.schema.yaml,
# tool-permissions.yaml, forbidden-actions.yaml, mandatory-gates.yaml):
# without a root-level type constraint, a validator pointed at this file's
# ROOT would accept ANY value. Unlike those array-shaped siblings, this
# file's practical payload is genuinely multi-component (two checklists, a
# sequence, tier requirements, one rule) — matching `gate.schema.yaml`'s own
# precedent of NOT adding a single root $ref for a multi-component file,
# since no single fragment here is "the" root concept.
release_gate_requirement:
  type: object
  description: >
    "STAGED RELEASE (release_sequence above) MAY NOT proceed unless every
    applicable mandatory gate's outcome is an acceptable Final Status."
    Structural rule only — ranges over whatever `policies/ai-execution
    /mandatory-gates.yaml#/mandatory_gate_rules` currently contains (today:
    1 rule, R3/R4 human-review-class), not a fixed list re-declared here.
    Field shape aligned with this Wave's `condition`/`action` convention —
    see `compilation_decisions`.
  required: [condition, action, gate_rules_source, required_status, scope]
  properties:
    condition:
      type: string
      const: "NOT (every rule in policies/ai-execution/mandatory-gates.yaml#/mandatory_gate_rules that applies to this task has reached an acceptable Final Status per required_status below)"
      description: "Master Plan §64 rule-shape style predicate."
    action:
      type: string
      const: DENY
      description: >
        Verdict on the STAGED RELEASE transition when `condition` holds.
        Master Plan §64's own condition-action vocabulary, same field the
        sibling files and mandatory-gates.yaml use — see
        compilation_decisions for why DENY (not REQUIRE_HUMAN_REVIEW) is
        the correct verdict for this specific rule.
    gate_rules_source:
      type: string
      const: "ai-lego://policies/ai-execution/mandatory-gates.yaml#/mandatory_gate_rules"
      description: "The single source of truth this rule composes with — not duplicated here."
    required_status:
      type: array
      minItems: 1
      items:
        $ref: "ai-lego://specs/execution/status-codes.schema.yaml#/reference_vocabulary/final_status/schema"
      description: >
        Acceptable per-gate-rule outcomes for release to proceed. Grounded
        in EC §70 Final Status vocabulary via status-codes.schema.yaml —
        NOT the narrower gate_result.status enum (PASS/FAIL/BLOCKED/
        NOT_APPLICABLE); see compilation_decisions for why the task-level
        vocabulary is used here instead.
    scope:
      type: object
      description: >
        RESOLVED 2026-08-30 by ADR-011 (closes `OQ-RELPOL-2`): this rule's
        coverage is TWO-PART, not a single flat list — `always_required`
        (every one of `gate_catalog.global`'s 14 items, unconditional on
        risk_tier, per that catalog's own `description`) plus
        `conditionally_required` (whatever
        `mandatory-gates.yaml#/mandatory_gate_rules` currently enumerates —
        today 2 rules, both R3/R4-triggered). This two-part shape mirrors
        `gate_catalog`'s own global/high_risk split rather than flattening
        it into one undifferentiated set.
      required: [always_required, conditionally_required]
      properties:
        always_required:
          type: string
          const: "ai-lego://specs/execution/gate.schema.yaml#/gate_catalog/global"
        conditionally_required:
          type: string
          const: "ai-lego://policies/ai-execution/mandatory-gates.yaml#/mandatory_gate_rules"
  constraints:
    - "This rule's actual gate coverage is the UNION of gate_catalog.global (always, every release) and whatever policies/ai-execution/mandatory-gates.yaml#/mandatory_gate_rules currently enumerates for this release's risk_tier (today: 2 rules, both R3/R4-triggered) — RESOLVED 2026-08-30 by ADR-011, see `scope` above."
  examples:
    - condition: "NOT (every rule in policies/ai-execution/mandatory-gates.yaml#/mandatory_gate_rules that applies to this task has reached an acceptable Final Status per required_status below)"
      action: DENY
      gate_rules_source: "ai-lego://policies/ai-execution/mandatory-gates.yaml#/mandatory_gate_rules"
      required_status: [PASS, PASS_WITH_APPROVED_RISK]
      scope:
        always_required: "ai-lego://specs/execution/gate.schema.yaml#/gate_catalog/global"
        conditionally_required: "ai-lego://policies/ai-execution/mandatory-gates.yaml#/mandatory_gate_rules"

open_questions:
  - id: "OQ-RELPOL-1"
    question: >
      Are EC §143/§144's Pre-/Post-release Checklist items the SAME concept
      as EC §68/Atlas §22's Global/High-risk Gate list (just release-scoped
      and independently worded), a genuinely SEPARATE checklist, or a
      PARTIAL OVERLAP (e.g. "Security PASS"/"Data PASS" map 1:1 onto §68's
      "Security"/"Data" Global Gate items, while "Change matches plan"/"No
      scope creep" do not map onto anything in §68)? This compilation pass
      found no cross-reference between the two in either section's own
      text and treated them as separate (see `compilation_decisions`
      above), but this is this file's own inference from absence of a
      cross-reference, not a confirmed ADR ruling — and is NOT one of the
      3 previously-tracked findings (CROSS-R-5/CROSS-R-7/CROSS-T-11).
    owner: "operator or Round 2 ADR (candidate to fold into the same OQ-10 batch, since resolving the Gate list's identity would also resolve this)"
    blocks: >
      nothing today — pre_release_checklist/post_release_checklist are
      built as their own verbatim, self-contained lists either way
  - id: "OQ-RELPOL-2"
    question: >
      RESOLVED 2026-08-30 by ADR-011: `release_gate_requirement.scope` is
      BOTH, not an either/or — `always_required` (gate_catalog.global's 14
      items, every release, unconditional) `conditionally_required`
      (mandatory-gates.yaml's risk-tier-triggered rules, today 2). Original
      question (2026-08-29, preserved): "Once Round 2 ADR resolves OQ-10,
      should `release_gate_requirement`'s `scope` become the FULL Global
      Gate list (all gates, every release) or stay scoped to whatever
      `mandatory-gates.yaml#/mandatory_gate_rules` enumerates
      (risk-tier-conditional gates only)?" The answer turned out to be
      "both, as two distinct fields" rather than a single choice between
      them — `gate_catalog`'s own global/high_risk split (unconditional vs
      risk-tier-conditional) made the false dichotomy visible once the
      catalog existed to consult.
    owner: "closed"
    blocks: "nothing — resolved"

verification:
  method: >
    Read EC §143 (L3846-3860), §144 (L3864-3877), and §146 (L3893-3937) in
    full at the cited lines — confirmed no cross-reference to §68/§69
    exists in either checklist's own text. Read
    execution/risk-tier.schema.yaml tiers.R3/R4.required_actions in full.
    Read .ai/research/phase-0/policy-inventory.yaml L603-610 confirming
    phase-0's own independent catalog entry for both checklists, with no
    recorded cross-reference to the Global/High-risk Gate entries in the
    same file. Grepped EC/Atlas/MP for "Pre-release Checklist" /
    "Post-release Checklist" case-insensitively — one hit each, both in EC,
    confirming no competing mother-document version exists to reconcile.

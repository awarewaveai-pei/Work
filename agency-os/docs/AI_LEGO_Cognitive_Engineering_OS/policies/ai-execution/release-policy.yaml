decided_by: >
  `docs/adr/ADR-011-platform-gate-ownership-and-unification.md` (ACCEPTED
  2026-08-30) now governs the gate_id VALUE SPACE `release_gate_requirement
  .scope` ranges over — same resolution as gate.schema.yaml and
  mandatory-gates.yaml (see their `decided_by`). Before 2026-08-30, no ADR
  governed it. The §143/§144 checklists
  and §146 sequencing carry no ADR either, because none is needed: they are
  direct, low-risk, single-source verbatim transcriptions with no competing
  mother-document version (grepped EC/Atlas/MP for "Pre-release Checklist" /
  "Post-release Checklist" case-insensitively — each appears exactly once,
  only in EC §143/§144; no duplicate/conflicting version exists to
  reconcile). This is the same class of Low-risk direct-transcription
  compilation gate.schema.yaml's `gate_result` shape and
  risk-tier.schema.yaml's tier examples/required_actions used.

compilation_decisions:
  - question: >
      MACHINE_READABLE_SPEC_PLAN.md §3 (L288) says release-policy.yaml is
      blocked "同 gate.schema.yaml" (same as gate.schema.yaml) on the
      disputed Global/High-risk Gate list. But EC §143/§144's Pre-/Post-
      release Checklist items ("Tests PASS", "Security PASS", "Data PASS",
      "Rollback ready", "Release strategy ready", etc.) read similarly to
      some of EC §68's Global Gate names ("Security", "Data", "Rollback").
      Should this file treat §143/§144 as the SAME list as §68's Global
      Gates (just release-scoped), and therefore treat the ENTIRE checklist
      as blocked too, not just the gate_id-referencing part?
    decision: >
      No. Treat §143/§144 as a SEPARATE, self-contained checklist — build
      it in full, verbatim, unblocked. Only the distinct
      `release_gate_requirement` rule (which explicitly ranges over
      `gate_id`) is blocked.
    reasoning: >
      Textual overlap is not identity. (1) §143/§144's items are plain
      checklist LINES ("[ ] Security PASS"), not `gate_id` references —
      they never use the word "gate" or cite §68/§69 anywhere in their own
      text (verified by reading L3846-3877 directly: no cross-reference to
      §68/§69 exists there). (2) The item SETS genuinely differ: §143 has
      11 items including "Change matches plan", "No scope creep", "Human
      approval where required" — none of which appear in EC §68's 14-item
      Global Gate list or Atlas §22.1's identical 14; §68's list includes
      "Localization"/"Accessibility"/"Capacity"/"Documentation"/"Golden
      Test", none of which appear in §143/§144. Asserting they are the same
      list (or a subset/superset of each other) would be an unverified
      inference, not a transcription — exactly what R0 forbids and exactly
      the class of error `gate.schema.yaml`'s own compilation_decisions
      warned against (its first entry, refusing to infer a `category`
      discriminator not actually stated). (3) CORRECTED 2026-08-29
      (critic-flagged, Minor): the original version of this argument cited
      Phase 0's own `policy-inventory.yaml` cataloging §143/§144 (L603-610)
      as separate line items from §68's Global/High-risk Gate entries
      (L339-341) as "independent confirmation" of a split. Direct re-read
      shows the opposite: both entries carry the IDENTICAL `kind: "gate"`
      tag (L341, L605, L609) — phase-0's own taxonomy does NOT distinguish
      them, which is evidence against treating this as a confirmed split,
      not confirmation of one. This argument is retracted; it does not
      change the decision, which rests on arguments (1) and (2) above (no
      "gate"/§68/§69 cross-reference in either checklist's own text, and
      genuinely non-overlapping item sets) — both independently re-verified
      by critic review directly against the mother documents and found
      sound (see that review's "Verified Clean" section). This distinction
      is recorded as `OQ-RELPOL-1` below (a genuinely new observation, not
      a previously-tracked CROSS-*/DOC-* finding) rather than silently
      assumed.
  - question: >
      Given §143/§144 are unblocked, should this file ALSO build the
      "release requires mandatory gates to PASS" structural rule the
      plan's §2.9 annotation implies release-policy.yaml needs
      (gate.schema.yaml-dependent content), or omit it entirely since its
      gate_id range is blocked?
    decision: >
      Build the STRUCTURAL rule (`release_gate_requirement`), with its
      gate coverage sourced from `policies/ai-execution/mandatory-
      gates.yaml#/mandatory_gate_rules` (currently exactly 1 rule) rather
      than a standalone enumeration.
    reasoning: >
      Omitting it entirely would under-deliver relative to what MRSP §2.9's
      own annotation ("release-policy.yaml 內容依附 gate.schema.yaml")
      implies is the intended coupling; building a second, independent
      partial gate list here (instead of referencing mandatory-gates.yaml)
      would duplicate — and risk drifting from — the one already built in
      this same Wave. Composing the two keeps exactly ONE place
      (`mandatory-gates.yaml`) as the registry of which gates are mandatory
      for which condition, with this file only consuming it, matching the
      "single source of truth, mother documents reference it" discipline
      `status-codes.schema.yaml`'s own `description` states explicitly.
  - question: >
      Should `release_gate_requirement.required_status` cite
      `gate.schema.yaml#/gate_result/properties/status` (the per-gate
      PASS/FAIL/BLOCKED/NOT_APPLICABLE enum, EC §69) or
      `status-codes.schema.yaml#/reference_vocabulary/final_status/schema`
      (the task-level PASS/PASS_WITH_APPROVED_RISK/BLOCKED/FAILED/
      NEEDS_HUMAN_REVIEW/ROLLED_BACK/PARTIAL_SUCCESS enum, EC §70)?
    decision: "final_status (EC §70), not gate_result.status (EC §69)."
    reasoning: >
      A release-readiness VERDICT is a judgment about the whole release
      (has every applicable gate reached an acceptable outcome), which is
      exactly what EC §70's Final Status vocabulary is for — and it already
      includes `PASS_WITH_APPROVED_RISK`, a verdict EC §69's narrower
      per-gate enum has no equivalent of (a gate is PASS/FAIL/BLOCKED/
      NOT_APPLICABLE; nothing in EC §69 lets one FAILED gate be
      risk-accepted while the release still proceeds — that concept exists
      only at the §70 level). Conflating the two enums would either lose
      `PASS_WITH_APPROVED_RISK` (if using §69's enum) or imply individual
      gates can independently be "PARTIAL_SUCCESS"/"ROLLED_BACK" (§70
      values that make sense for a whole task, not a single gate) if using
      §70's enum at the per-gate level. Keeping them distinct, with this
      file citing §70's task-level enum for its task-level verdict field,
      preserves both vocabularies' own scope.
  - question: >
      Should `release_gate_requirement` follow this Wave's now-established
      `condition`/`action` rule shape (Master Plan §64), matching sibling
      files and this file's own `mandatory-gates.yaml` (built immediately
      before this file, in the same task)?
    decision: >
      Yes — `release_gate_requirement` carries literal `condition` (a
      release-readiness predicate) and `action` (enum, same 4 values), in
      ADDITION to its granular `gate_rules_source`/`required_status`/
      `scope` fields.
    reasoning: >
      Consistent with the "condition/action plus granular fields" additive
      convention `tool-permissions.yaml` established and
      `mandatory-gates.yaml` (this task's other deliverable) already
      applied. `action: DENY` is the correct verdict here (not
      `REQUIRE_HUMAN_REVIEW`, which `mandatory-gates.yaml`'s own rule
      uses): the release_gate_requirement's function is to DENY the
      STAGED RELEASE transition (see `release_sequence` below) when its
      condition is NOT met — a blocking precondition on a workflow
      transition, which is exactly Master Plan §64's first worked example's
      shape ("Restricted data AND external_model = true -> DENY"), not its
      second (REQUIRE HUMAN REVIEW is a distinct verdict already used by
      the gate this rule composes with, not this rule itself).


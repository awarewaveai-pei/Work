    Validated `grounded_rules.rules[0]` against
    `#/definitions/trusted_compute_gate_rule` with
    `jsonschema.Draft202012Validator` using a custom `ai-lego://` resolver
    (registry-backed retrieve function mapping each `ai-lego://` URI to its

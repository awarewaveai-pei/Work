$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://policies/ai-execution/trusted-compute-gate.policy.yaml"
title: Trusted Compute Gate Policy
version: "1.0.0"
status: ACTIVE

description: >
  Policy-as-code binding that gives real mechanics to a redline three
  independent mother-document passages state but none of them, by
  themselves, operationalize: an AI is never allowed to mentally calculate
  a numeric/statistical/simulated result and assert it as
  `CALCULATED_RESULT` (or `SIMULATED_RESULT`) — it must route the
  computation through the Trusted Compute pipeline (Plan -> Execute ->
  Validate -> Result Artifact -> Interpret) and produce a real, checkable
  Result Artifact instead.

  Three convergent citations, read in full for this file:
  - Execution Contract §39 "Trusted Compute Contract" (L1499-1521): the
    canonical 5-stage pipeline diagram ("AI plans / Trusted Compute
    executes / Validator verifies / Result Artifact / AI interprets",
    L1503-1513) immediately followed by an explicit forbidden block
    ("LLM mentally calculates / -> CALCULATED_RESULT", L1517-1520). This
    is the ONE section that states the redline as a literal, quotable
    anti-pattern — the `mother_doc_text` on this file's grounded rule below
    transcribes it verbatim. §39's own opening line ("數學、統計、模擬、
    最佳化：", L1501 — "mathematics, statistics, SIMULATION,
    optimization:") is this file's grounding for including
    `SIMULATED_RESULT` alongside `CALCULATED_RESULT` as a second triggering
    epistemic_type, not merely the first.
  - Master Plan §27 "Data Science Plane" (L1688-1707): the same pipeline
    stated as a 6-box diagram ("AI / Analysis Planner / Trusted Compute
    Engine / Validation / Result Artifact / AI Interpretation",
    L1695-1706) opening with "AI 不直接編造數學結果。" ("AI does not
    directly fabricate mathematical results.", L1690) — corroborating,
    independently-worded evidence for the identical pipeline EC §39
    diagrams, not a second, different mechanism. See `compilation_decisions`
    for how this file reconciles MP's 6-box diagram against EC's 5-box one
    (MP splits EC's single "AI plans" box into two: "AI" then "Analysis
    Planner").
  - **CITATION CORRECTION** (verified by direct read, not trusted from this
    file's own build brief): the third source, describing literature/
    citation/dataset-lineage/reproducibility requirements for research-class
    tasks, is **Execution Contract §40 "Research Integrity Execution"
    (L1524-1536)** — grep-confirmed there is no Master Plan §40 with this
    title; Master Plan's own §40 is "Qualitative Research" (a different
    topic, L2033). EC §39 and EC §40 are adjacent sections in the SAME
    document (§39 ends at L1521, §40 begins at L1524), which is presumably
    the source of the mislabel. EC §40 is cited here as corroborating
    context for WHY the Trusted Compute pipeline matters for research-class
    outputs specifically (its 8 bullets — literature verifiability, no
    fabricated citations, DOI verification, dataset lineage, reproducible
    AnalysisRun, statistical-assumption checks, traceable authorship — all
    presuppose a real, auditable compute/evidence trail, not an
    LLM-asserted one) — this file does NOT model EC §40's 8 bullets as
    additional rules; see `constraints` for that explicit scope boundary.

  This file closes `.ai/research/phase-1/GAP_REGISTER.yaml` P1-GAP-AI-2
  (L283-291, severity high, role Statistician/AI Engineer): "Trusted
  Compute 全文件零 schema，AI 竄改數字無任何 gate 攔截" ("Trusted Compute
  appears nowhere as a schema across the whole corpus; nothing mechanically
  intercepts an AI that alters/fabricates a number") — its own named
  consequence: "「AI 只 Plan/Explain/Interpret，不得捏造 calculation」這條
  紅線沒有任何機器可稽核的落地點" (the redline has no machine-auditable
  landing point). `docs/architecture/MVP_VERTICAL_SLICE_PLAN.md` §4 (L117)
  is the one planning document that names this exact deliverable ahead of
  time: "`/policies/ai-execution/`：Trusted Compute Gate policy（EC
  §39，解 `P1-GAP-AI-2`）" — this file is that named deliverable.
  `docs/architecture/MACHINE_READABLE_SPEC_PLAN.md` (the actively-maintained
  Wave-tracking document most other Phase 3 files cite as their build
  authority) has **zero hits** for "Trusted Compute" (grep-confirmed) —
  unlike sibling files `mandatory-gates.yaml`/`capability-contract.schema.yaml`,
  this file's sole prior planning citation is the earlier
  MVP_VERTICAL_SLICE_PLAN.md, not an MRSP Wave row; its build here is
  authorized directly by this task's instruction, not by an MRSP Wave
  assignment (recorded honestly, not backfilled as if an MRSP row existed).

  `docs/architecture/MVP_VERTICAL_SLICE_PLAN.md` L79-80 additionally gives a
  fully concrete worked scenario tying this exact redline to the
  `run_statistics` capability
  (`specs/domain/capability-contract.schema.yaml`'s own named example, MP
  §8.1/§8.2 L651-689): "兩位編碼者的編碼結果交給 `run_statistics`
  capability 計算一致性統計量（如 Cohen's Kappa）——**必須經 Trusted
  Compute Engine 真正執行，不得由 LLM「口算」後宣稱
  CALCULATED_RESULT**（MP §27；EC §39...直接撞見並協助收斂
  `P1-GAP-AI-2`）" — this is the `worked_example` this file's grounded rule
  cites, per this task's explicit instruction to bind to that capability
  example rather than redefine it.

  Rule SHAPE follows `policies/ai-execution/mandatory-gates.yaml`'s own
  established `condition`/`action` convention (Master Plan §64 Policy-as-
  Code rule style) — a locally-owned `action` enum with one additive value
  for a verdict none of the base 4 values (`DENY`/`ALLOW`/`SCOPE_TO`/
  `REQUIRE_HUMAN_REVIEW`) precisely fits, the exact precedent
  `mandatory-gates.yaml`'s own `compilation_decisions` set when it added
  `REQUIRE_RECOVERY_REHEARSAL` (2026-08-30): "routing THIS output through a
  specific execution mechanism" is a different verdict than "deny",
  "allow", "scope", or "get human review" — see `compilation_decisions`
  below for the full reasoning, applying that same precedent rather than
  stretch-fitting an existing value.

  Filename uses the `<name>.policy.yaml` suffix — new to `policies/
  ai-execution/` specifically (its existing 8 files from the EC §91
  directory listing all use bare `<name>.yaml`), but NOT a new convention
  invented for this file: `policies/security/zero-trust.policy.yaml`,
  `policies/security/supply-chain-security.policy.yaml`,
  `policies/privacy/pii-redaction.policy.yaml`, and
  `policies/provider/model-registry.policy.yaml` /
  `policies/provider/ai-gateway-fallback.policy.yaml` already established
  `.policy.yaml` as this project's live suffix for policy files built
  outside EC §91's original named-8 list. This file is `ai-execution/`'s
  first instance of that (already-precedented elsewhere) pattern, per this
  task's own explicit filename instruction — recorded here so a future
  reader does not mistake it for an unreviewed one-off spelling.


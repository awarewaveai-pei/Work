$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://policies/security/zero-trust.policy.yaml"
title: Zero Trust Identity, Workload Identity & Policy Decision Point Policy
version: "1.0.0"
status: ACTIVE

description: >
  Closes P1-GAP-SEC-1 (severity: high, `.ai/research/phase-1/GAP_REGISTER.yaml:190-197`)
  IN FULL -- Master Plan's `Identity → Workload Identity → Mutual
  Authentication → Short-lived Credentials → Policy Decision → Resource
  Access` stage flow (AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md:2668)
  named no protocol/engine anywhere; all 3 sub-gaps are now resolved -- see
  `docs/adr/ADR-016-zero-trust-workload-identity-and-pdp-selection.md`
  (ACCEPTED 2026-08-30 for Sub-decisions b/c at first ratification;
  Sub-decision a UPDATED same day to ACCEPTED once the operator made the
  real vendor decision in a live conversation -- see `decided_by` below).

  **HISTORY (preserved for audit continuity)**: at first ratification this
  file shipped with `status: PROVISIONAL` because `idp_provider` was a
  genuine open vendor/spend decision (WorkOS managed vs. self-hosted
  Zitadel/Keycloak) that AGENTS.md R0's "取捨影響產品方向" stop condition
  correctly kept out of Claude's unilateral authority -- see ADR-016's own
  Decision Drivers for the litmus test that drew this line, still valid
  reasoning for why Claude did not pick a vendor on its own initiative. The
  operator has since made that decision directly (self-hosted, Zitadel over
  Keycloak) -- `status` is now `ACTIVE` and `idp_provider` carries the real
  value below.

source_of_truth_for:
  - "docs/architecture/ZERO_TRUST_SUPPLY_CHAIN_SELECTION_PLAN.md §1.1-1.3 (Gap 1 -- Zero Trust), §3 rows 1-3, §4 risks 1/2/3, §5 citations"
  - "docs/adr/ADR-016-zero-trust-workload-identity-and-pdp-selection.md Recommendation -- this file IS that Recommendation, now fully ratified"
  - ".ai/research/phase-1/GAP_REGISTER.yaml P1-GAP-SEC-1 (L190-197)"
  - "docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §2.9 row for policies/security/ (SKELETON_ONLY prior to this file)"

decided_by: >
  docs/adr/ADR-016-zero-trust-workload-identity-and-pdp-selection.md
  (ACCEPTED 2026-08-30, Sub-decisions b and c at first ratification;
  Sub-decision a (`idp_provider`) UPDATED same day, ACCEPTED by the
  operator's own explicit real-time decision -- not derived by Claude from
  re-reading mother documents, and not chosen from the plan's own
  recommendation (WorkOS) -- the operator chose the self-hosted path
  instead, then chose Zitadel over Keycloak when asked. See
  `open_questions.OQ-ZEROTRUST-1` for the closure record.

compilation_decisions:
  - question: >
      Should `idp_provider` be omitted entirely from this file's required
      shape until the operator decides, the way a genuinely future field
      might be left out of a schema altogether?
    decision: >
      Kept as a REQUIRED field, but its own required sub-field is only
      `status` (a blocked-placeholder marker), not a real provider name --
      the recommended candidate and blocking reason are additive, optional
      context.
    reasoning: >
      Omitting the field entirely would understate the gap -- P1-GAP-SEC-1
      names IdP/OIDC provider as one of 3 explicit missing pieces, and
      MACHINE_READABLE_SPEC_PLAN.md §2.9's row for this file should not read
      as fully resolved when 1 of 3 sub-gaps remains open. Keeping the field
      required with an explicit blocked-status marker is the same technique
      `policies/ai-execution/mandatory-gates.yaml` used for `gate_ref:
      TBD_PENDING_ROUND2_ADR` before ADR-011 resolved it -- state the shape
      fully, mark exactly the blocked value, don't silently drop the field.
  - question: >
      Source plan §1.2 recommends deferring SPIFFE/SPIRE rather than ruling
      it out forever. Should the deferral be open-ended, given §4 risk 2's
      own warning that retrofitting SPIFFE onto an already-live mTLS system
      later is real migration work, not a config flip?
    decision: >
      `spiffe_reconsideration_triggers` is a required, non-empty array of
      concrete conditions, not a free-text "revisit later" note.
    reasoning: >
      Same discipline as the sibling supply-chain policy's
      `slsa.l3_migration_trigger` -- an open-ended deferral in an
      organization with a documented history of "policy exists but nothing
      enforces it" (§4 risk 6 of the sibling plan; ClickHouse override.xml
      recurrence pattern in WORKLOG.md) is indistinguishable from a
      permanent decision dressed as a temporary one. Naming the 2 concrete
      triggers the source plan itself already proposed (service-count
      threshold, first cross-tenant agent-delegation scenario) makes this
      checkable rather than aspirational.
  - question: >
      2026-08-30 `/codex-review` HIGH finding (real, independently
      verified): the first version of `spiffe_reconsideration_triggers`
      was `items: {type: string}` -- a free-text array. Any placeholder
      string (e.g. "revisit later") would validate, silently defeating the
      "concrete, checkable" guarantee this field's own description already
      claimed. Separately, the fixture's own trigger text referenced a
      threshold "N" that was never defined anywhere in the repo as an
      actual field.
    decision: >
      Tightened `spiffe_reconsideration_triggers.items` to a CLOSED 2-value
      enum (`service_count_exceeds_threshold`,
      `first_cross_tenant_agent_delegation_scenario`) matching the exact 2
      triggers ADR-016/source plan §4 risk 2 named -- no free text. Added a
      new sibling field `service_count_reconsideration_threshold` (nullable
      integer, operator-set) and an `allOf`/`if`/`contains`/`then` rule
      requiring it be a real integer whenever
      `service_count_exceeds_threshold` is present in the triggers array.
    reasoning: >
      This is the same "enum + allOf/if/then cross-field enforcement"
      pattern already established across this corpus (e.g.
      `gate.schema.yaml`'s NOT_APPLICABLE->rationale rule,
      `branch.schema.yaml`'s per-state required blocks) -- a free-text
      array masquerading as an enforced guarantee is exactly the
      unenforced-`constraints:`-block bug class this session already fixed
      twice before (see `pii-redaction.policy.yaml`'s own
      compilation_decisions citing the same lesson). The threshold value
      itself is still NOT invented here (same restraint as `idp_provider`
      and `l3_migration_trigger`) -- `null` is valid until
      `service_count_exceeds_threshold` is actually asserted, at which
      point the schema now forces a real number instead of leaving it
      dangling as undefined prose.
  - question: >
      `idp_provider` was originally a required-but-blocked placeholder
      (`status: TBD_PENDING_OPERATOR_VENDOR_DECISION`) because this is a
      genuine vendor/spend decision AGENTS.md R0 requires Claude to stop on
      and report rather than decide unilaterally. Same day, the operator
      directly answered the question in conversation: "偏好自架" (prefer
      self-hosting), then chose Zitadel over Keycloak when the two
      self-hosted candidates' trade-off (native multi-tenant hierarchy vs.
      AGPL-3.0 license) was surfaced. Should this file now assert a real
      `provider` value?
    decision: >
      Yes -- `idp_provider` restructured from the blocked placeholder shape
      to `{provider: const Zitadel, deployment_model: const self-hosted,
      rationale, licensing_acknowledgment, workos_rejected_reason,
      keycloak_rejected_reason}`. `status` upgraded ACTIVE (from
      PROVISIONAL). `open_questions.OQ-ZEROTRUST-1` closed.
    reasoning: >
      This is NOT Claude deciding unilaterally -- it is transcribing an
      explicit operator decision made directly in conversation, the exact
      mechanism R0's stop condition exists to require (stop, report, let
      the operator decide) rather than a workaround of it. The WorkOS
      recommendation and its rejection reason are preserved as
      `workos_rejected_reason` rather than deleted, matching this corpus's
      own established audit-continuity convention (e.g. ADR_INDEX.md's
      preserved-original-text pattern for superseded findings) -- a future
      reader should be able to see what was recommended and why it was not
      chosen, not just the final answer. The AGPL-3.0 licensing point is
      kept as an explicit `licensing_acknowledgment` (not silently dropped
      now that a decision exists) because it is a live operational
      constraint, not a decision-blocking concern that resolves itself once
      Zitadel is chosen.

# ---------------------------------------------------------------------------
# Schema body -- one singleton policy document (same shape convention as
# sibling policies/security/supply-chain-security.policy.yaml).
# ---------------------------------------------------------------------------
type: object
required: [idp_provider, workload_identity, pdp_engine]
properties:

  idp_provider:
    type: object
    description: >
      ADR-016 Sub-decision (a) -- ACCEPTED 2026-08-30, operator explicit
      real-time decision (self-hosted, Zitadel over Keycloak; WorkOS
      managed was the plan's own original recommendation but was not
      chosen). Source plan §1.1, §3 row 1, §4 risk 1.
    required: [provider, deployment_model, rationale]
    properties:
      provider:
        type: string
        const: Zitadel
      deployment_model:
        type: string
        const: self-hosted
      rationale:
        type: string
        const: "Operator 2026-08-30 explicit decision: prefer self-hosting over WorkOS (managed) -- avoids the multi-year per-connection/SCIM-directory billing lock-in the source plan's own risk analysis flagged (§4 risk 1), in exchange for owning IdP operations (patching/scaling/on-call) for the project's full lifetime. Zitadel chosen over the other self-hosted candidate, Keycloak, because Zitadel's native Instance→Org→Project→App hierarchy matches this project's multi-tenant architecture directly, where Keycloak's realm-per-tenant model does not scale as cleanly as tenant count grows."
      licensing_acknowledgment:
        type: string
        const: "Zitadel's core license changed to AGPL-3.0 as of v3 (~2025-03). Running it unmodified as an internal backend service does not itself trigger AGPL's network-use disclosure clause -- that clause activates only if a MODIFIED fork of Zitadel's own source is offered as a network service to users. Flagged as an ongoing operational constraint (re-check before ever forking+modifying+redistributing Zitadel itself as a service), not a blocker to this decision."
      workos_rejected_reason:
        type: string
        const: "Would have avoided the self-hosted ops burden entirely, but the multi-year per-connection/SCIM-directory billing model creates real vendor lock-in once tenants are onboarded against it -- operator chose to avoid this recurring spend commitment rather than get a quote."
      keycloak_rejected_reason:
        type: string
        const: "Apache 2.0 (more permissive than Zitadel's AGPL-3.0) and a longer enterprise track record, but its realm-per-tenant model does not scale as cleanly with this project's growing multi-tenant count as Zitadel's native Instance→Org→Project→App hierarchy."

  workload_identity:
    type: object
    description: "ADR-016 Sub-decision (b), ACCEPTED. Source plan §1.2, §3 row 2, §4 risk 2."
    required: [strategy, spiffe_deferred, spiffe_reconsideration_triggers]
    properties:
      strategy:
        type: string
        const: "cloud-native workload identity + short-lived-credential mTLS"
      spiffe_deferred: { type: boolean, const: true }
      spiffe_deferral_rationale:
        type: string
        const: "SPIFFE/SPIRE is CNCF-graduated and production-proven at scale (Uber ~4,500 services, Netflix, Pinterest, Bloomberg, Square, GitHub), but its control-plane build cost (attestation nodes, registration server, dedicated CA) is disproportionate to this project's current team size -- multiple 2026 sources note most teams cannot afford to do SPIFFE right. Cloud-native mTLS satisfies the same Mutual-Authentication + Short-lived-Credentials stages of the mother-document flow without that infrastructure."
      spiffe_reconsideration_triggers:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum: [service_count_exceeds_threshold, first_cross_tenant_agent_delegation_scenario]
        description: >
          CLOSED enum, not free text (2026-08-30 /codex-review HIGH finding: a
          free-text array lets any placeholder string validate, silently
          defeating the 'concrete, checkable' guarantee this field exists to
          make -- see compilation_decisions). The 2 values are the only
          reconsideration triggers ADR-016/source plan §4 risk 2 actually
          named; a 3rd trigger requires a real ADR update to this enum, not a
          free-text addition.
      service_count_reconsideration_threshold:
        type: [integer, "null"]
        minimum: 1
        description: >
          The 'N' in service_count_exceeds_threshold -- operator-set, `null`
          until set (same TBD-placeholder discipline as `idp_provider.status`
          below). REQUIRED to be a real integer once
          `service_count_exceeds_threshold` appears in
          spiffe_reconsideration_triggers (see `allOf` below) -- prevents the
          threshold from staying an undefined "N" referenced only in prose,
          the other half of the same 2026-08-30 finding.
    allOf:
      - if:
          properties:
            spiffe_reconsideration_triggers:
              contains: { const: service_count_exceeds_threshold }
          required: [spiffe_reconsideration_triggers]
        then:
          required: [service_count_reconsideration_threshold]
          properties:
            service_count_reconsideration_threshold: { type: integer }

  pdp_engine:
    type: object
    description: "ADR-016 Sub-decision (c), ACCEPTED. Source plan §1.3, §3 row 3, §4 risk 3."
    required: [engine, rationale, scope_limitation]
    properties:
      engine: { type: string, const: Cedar }
      rationale:
        type: string
        const: "AWS 2023-05 open source (Apache 2.0), formally verified for safety/correctness, purpose-built for authorization (principal/action/resource/context) -- maps near 1:1 onto this project's already-ACCEPTED R0-R4 risk_tier / A0-A4 authority_level vocabulary (ADR-004), and is readable enough for non-engineering roles (legal, the operator) to audit -- a real requirement here, not a nice-to-have."
      scope_limitation:
        type: string
        const: "Cedar is narrower than OPA/Rego -- pure authorization only, not general policy-as-code. If a future need arises for policy-driven data transformation (not just access decisions), OPA/Rego may be ADDED alongside Cedar, not substituted for it."

open_questions:
  - id: "OQ-ZEROTRUST-1"
    question: >
      RESOLVED 2026-08-30 by the operator's own explicit real-time decision
      (self-hosted, Zitadel over Keycloak). Original question (preserved):
      "idp_provider selection (WorkOS managed vs. self-hosted
      Zitadel/Keycloak) requires (1) a real multi-year WorkOS quote, and
      (2) an explicit build-vs-buy call weighing recurring SaaS spend +
      lock-in against perpetual self-hosted IdP ops burden. This is a
      genuine business/vendor trade-off, not an architecture-internal
      question with a derivable correct answer from re-reading the mother
      documents -- squarely the class of decision AGENTS.md R0 requires
      stopping on and reporting, not one Claude decides unilaterally even
      under general '你決定' delegation." The operator answered directly
      rather than requesting a formal WorkOS quote -- self-hosting was
      chosen precisely to avoid that vendor-spend question entirely.
    owner: "closed"
    blocks: "nothing -- resolved"
  - id: "OQ-ZEROTRUST-2"
    question: >
      `service_count_reconsideration_threshold` (the 'N' in
      service_count_exceeds_threshold) is `null` by design -- no source
      document names an actual number. Who sets N, and when? This is an
      operational capacity-planning judgment (how many services is "too
      many for cloud-native mTLS"), not an architecture-internal question
      with a derivable correct answer.
    owner: "operator, or a future DevOps/capacity-planning pass once real
      service count telemetry exists to ground a number in"
    blocks: "nothing in this file's own validity -- null is a valid, honest
      value until set; the allOf rule only fires once
      service_count_exceeds_threshold is actually asserted as a live
      trigger, which has not happened yet"

verification:
  method: >
    Read docs/architecture/ZERO_TRUST_SUPPLY_CHAIN_SELECTION_PLAN.md §1 and
    §3 rows 1-3 and §4 risks 1/2/3 and §5 citations in full before drafting
    this file. Every `const` value for workload_identity/pdp_engine
    transcribed verbatim from that document's §3 recommendation table and
    §1's supporting paragraphs. Cross-checked
    .ai/research/phase-1/GAP_REGISTER.yaml:190-197 (P1-GAP-SEC-1) to confirm
    this file's scope matches all 3 named sub-gaps (IdP/OIDC provider /
    workload identity standard / PDP engine) -- all 3 now closed, none
    silently dropped. `idp_provider`'s `provider`/`deployment_model` values
    transcribed directly from the operator's own explicit answers in
    conversation (2026-08-30), not derived from any document.
  note: >
    No mother document was modified. This file does not include SBOM
    format, signing mechanism, SLSA target, or vulnerability-scan tooling --
    those are Gap 2 (Supply Chain Security) and live in the sibling
    policies/security/supply-chain-security.policy.yaml under a separate,
    fully-ratified ADR (ADR-015).

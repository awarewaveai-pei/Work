$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/domain/capability-contract.schema.yaml"
title: Capability Contract
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of a **Capability Contract** — Master
  Plan §8.3 (L699-729)'s literal, and the corpus's ONLY concrete, worked
  example of the shape ("Capability = 系統「能執行什麼」", MP §8.1 L638-646,
  distinguished from Cognitive Method = "問題「應該如何思考」"). MP §8.3's
  literal `cognitive.execute_method` instance (transcribed verbatim in
  `worked_example` below) is the sole real YAML instance of this shape
  anywhere in the three mother documents; MP §8.1/§8.2 (L648-689) and §9's
  Workflow IR node examples (L819-839) only ever NAME capabilities
  (`transcribe`, `run_statistics`, `execute_method`, `validate_artifact`,
  `literature_search`, `artifact.generate_research_paper`, …), they never
  give a second populated Contract.

  This file was deferred twice before this build: first at Wave 2/3
  (`docs/architecture/MACHINE_READABLE_SPEC_PLAN.md`, historically at
  L220-221, "延後（依賴 method-execution-request）"), then again at Wave 5
  (historically at L241-242, "仍延後（可於下一輪立即建置，依賴的
  method-execution-request.schema.yaml 已完成）") — NOTE (added 2026-08-29,
  critic-flagged Minor): both line citations describe the plan document's
  content BEFORE this same build's own edit to it; the L241-242 text was
  itself REPLACED, in this same commit, with the "✅ BUILT" line this file's
  Wave-tracking update produced (see `source_of_truth_for` below for the
  document's current line for this row) — the citation is a historical
  record of what blocked this file, not a live pointer into today's
  document. Both times blocked on `cognitive/method-execution-request.schema.yaml`,
  which that file's own `input.type` field cites as the literal string
  `MethodExecutionRequest` this Contract's one worked instance names (MP
  L708). That dependency is now BUILT (Wave 5, 2026-08-29); this file is the
  "下一輪" (next round) both plan entries anticipated.

  MACHINE_READABLE_SPEC_PLAN.md §2.5's own row for this file (L152) states
  its job in one line: "既有 Capability Contract（id/version/input/output/
  preconditions/quality/security/rollback）+ 補 edition/tier/entitlement
  欄位" (the existing Capability Contract shape, PLUS adding edition/tier/
  entitlement fields) — i.e. this file has two genuinely different jobs, not
  one: (1) formalize MP §8.3's 8-field shape as real JSON Schema (Low-risk,
  direct transcription — the fields are already named and populated in MP's
  own text), and (2) close P1-GAP-PROD-1
  (`.ai/research/phase-1/GAP_REGISTER.yaml` L337-344, severity high, role
  Product Manager): "Capability Contract schema
  (id/version/input/output/preconditions/quality/security/rollback) 無
  edition/tier/entitlement 欄位；Capability Availability Matrix enum 完全是
  jurisdiction 語境，無 Community/Pro/Enterprise 值" — with named consequence
  "Community-tier 帳號可以呼叫 Professional-only Capability，無中央 gate
  攔截，無稽核欄位——靜默 entitlement bypass" (a Community-tier account can
  call a Professional-only capability with no central gate interception and
  no audit field — a silent entitlement bypass). Job (2) is genuinely NEW
  DESIGN (additive fields with no direct mother-document shape to
  transcribe), not a correction — see `compilation_decisions` for the
  grounding used and its honest limits.

  Not to be confused with, and deliberately NOT collapsing into,
  `execution/authority.schema.yaml`'s A0-A4 ladder or EC §96 Tool Broker /
  §97 Least Privilege: those govern AUTHORIZATION (is an already-technically-
  possible action PERMITTED for this actor/task right now — "Capability ≠
  Authority", EC §9 L480-484, `authority.schema.yaml`'s own
  `capability_vs_authority` block). THIS file governs CAPABILITY — the
  static, versioned, technical declaration of what an action IS (its typed
  input/output, its preconditions, its quality/security/rollback posture,
  and now which product Edition may call it at all) independent of any one
  task's runtime authorization to invoke it. A capability with an
  `entitlement` block naming which Editions may call it is still a statement
  about WHAT MAY BE CALLED BY THAT EDITION IN GENERAL, not WHETHER THIS
  TASK, RIGHT NOW, IS AUTHORIZED — the same layering EC §96's own pipeline
  keeps distinct (`AI Intent -> Tool Broker -> Policy -> Scope -> Authority
  -> Execution -> Audit`, L2851-2865): entitlement is resolved at the
  `Policy`/`Scope` stage, which is downstream of, and does not replace, that
  pipeline's own `Authority` stage.


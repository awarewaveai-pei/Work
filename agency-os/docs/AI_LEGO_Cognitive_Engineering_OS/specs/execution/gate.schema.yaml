decided_by: >
  `docs/adr/ADR-011-platform-gate-ownership-and-unification.md` (ACCEPTED
  2026-08-30) resolves OQ-10 and governs `gate_catalog` below in full.
  Before 2026-08-30, no ADR governed this file and OQ-10 was
  REQUIRES_HUMAN_DECISION — verified at the time by grep across
  docs/adr/ADR-001~010: none ruled on the Global/High-risk Gate list.
  MACHINE_READABLE_SPEC_PLAN.md's §3 Build Order (L288) had prescribed
  exactly what this file could do while that ADR was pending ("可以先建這兩
  檔的骨架（欄位結構）、gate_id enum 留 TBD_PENDING_ROUND2，不阻塞其餘 30+
  個檔案的建置") — the `gate_result` record SHAPE (gate_id, status,
  evidence, validator, timestamp, rationale) was already decided as a
  direct, low-risk transcription of EC §69 at that time; only the gate_id
  VALUE SPACE was deferred. ADR-011 is that deferred resolution. Per
  ADR-011's own scope note, this ADR governs the schema/policy-file
  content directly (Low-risk machine-readable-spec compilation, the same
  class every other ADR-001~010-derived schema file in this project
  already applies) — the mother-document prose edits it recommends (MP §158
  content amendment, Atlas §22.1/22.2 and EC §68 reduction to pointers)
  remain separately gated behind the ADR-006 `.ai/proposals/` flow and are
  NOT performed by this file.

compilation_decisions:
  - question: >
      Given `gate_id` cannot be enumerated yet, should this file instead
      model a coarser discriminator now — e.g. a `category` field
      distinguishing "global" vs "high-risk-addon" vs "method-specific" gate
      results — since EC §68 and Atlas §22 both preserve that three-way
      split even though their item lists disagree?
    decision: >
      Do not add a category discriminator. Keep `gate_result` flat, matching
      EC §69's own worked example exactly (gate_id/status/evidence/
      validator/timestamp only — no category key).
    reasoning: >
      Even the CATEGORY BOUNDARY itself is part of the unresolved dispute,
      not just the item lists within each category: MP §158 (L5903-5926)
      only distinguishes "全部" (all 11) vs "高風險另加" (+1), while Atlas
      §22.1 vs §22.2 vs §22.3 draws a three-way line (Global / High-risk /
      Method-specific) that EC §68 mirrors but MP does not. Adding a
      `category` enum now would silently pre-empt part of OQ-10's answer
      (whether the future canonical list even keeps a two-way or three-way
      split) under the guise of "just a structural field" — exactly the
      kind of quiet scope-creep R0 forbids for a file whose own plan entry
      says not to pick a side. EC §68's own closing line — "Method-specific
      gate 從 Method Atlas 取得" (L2278) — is preserved instead as informational
      context in `gate_catalog.method_specific` below (renamed from this
      section's original `gate_id_registry` when ADR-011 resolved OQ-10,
      2026-08-30), not modeled as a schema field.
  - question: >
      `evidence` in EC §69's worked example is a bare `[...]` with no
      element shape given. Should this file define a typed evidence-item
      object (mirroring how EC §65 Content-addressed Evidence, L2166-2169,
      defines hash/source/timestamp/producer for a different evidence
      concept) rather than leaving it fully untyped?
    decision: "Leave `evidence` untyped (`items: {}`) — do not borrow EC §65's shape."
    reasoning: >
      EC §69 does not cross-reference §65, and nothing in either section
      states that a gate's evidence array uses the Content-addressed
      Evidence shape — that would be an inference by analogy, not a
      transcription, and this file's job per the plan is narrowly "build the
      record shape EC §69 actually gives", not "design a fuller evidence
      contract EC never specified". Flagged in `open_questions` (OQ-GATE-2)
      as a plausible future improvement rather than decided silently here.

# ---------------------------------------------------------------------------
# The gate_result record shape — GROUNDED, verbatim from EC §69. gate_id's
# value space is now RESOLVED (ADR-011, 2026-08-30) — see gate_catalog below.
# ---------------------------------------------------------------------------
gate_result:
  type: object
  description: "One gate's execution outcome. Field set verbatim from EC §69 (L2285-2290)."
  required: [gate_id, status]
  properties:
    gate_id:
      type: string
      description: >
        Identifier of the gate that ran. RESOLVED 2026-08-30 by
        `docs/adr/ADR-011-platform-gate-ownership-and-unification.md`: for a
        Global or High-risk gate, this SHOULD be one of `gate_catalog`'s 20
        `id` values below (kept as a documented catalog rather than a hard
        schema `enum` — see `gate_catalog.note` for why). For a
        Method-specific gate (Atlas §22.3's own open-ended, per-method
        namespace, unaffected by ADR-011), this is any value that
        namespace's own per-method contract defines — still not enumerable
        here, per `open_questions.OQ-GATE-3` (unresolved by ADR-011).
      examples:
        - "security"
      x-status: RESOLVED_2026-08-30_ADR-011
    status:
      type: string
      enum: [PASS, FAIL, BLOCKED, NOT_APPLICABLE]
      description: "Verbatim EC §69 enum (L2287)."
    evidence:
      type: array
      items: {}
      description: >
        Verbatim EC §69 `evidence: [...]` field (L2288). Left untyped —
        EC §69 gives no further structure for an evidence item at this
        location. See compilation_decisions above for why EC §65's
        Content-addressed Evidence shape was NOT borrowed here.
    validator:
      type: string
      description: >
        Verbatim EC §69 `validator: ...` field (L2289). Free-text identifier
        of who or what validated the gate (human reviewer id, CI job id,
        automated checker name). No further typing given by EC.
    timestamp:
      type: string
      format: date-time
      description: "Verbatim EC §69 `timestamp: ...` field (L2290)."
    rationale:
      type: string
      description: >
        REQUIRED when status == NOT_APPLICABLE (EC §69 L2293:
        "NOT_APPLICABLE 必須有 rationale" — "NOT_APPLICABLE must carry a
        rationale"). See `constraints` below.
  constraints:
    - "status == NOT_APPLICABLE requires `rationale` to be present and non-empty (EC §69 L2293)."
  # 2026-08-29 (Wave 8 golden-test bughunt, independently found by 3
  # separate test-writing passes this same Wave): the `constraints:` list
  # above was PROSE ONLY -- confirmed empirically (jsonschema
  # Draft202012Validator, 0 errors) that {gate_id: "x", status:
  # NOT_APPLICABLE} with no `rationale` validated successfully before this
  # fix. `if`/`then` below make the already-documented rule real.
  if:
    properties: { status: { const: NOT_APPLICABLE } }
    required: [status]
  then:
    required: [rationale]
    properties:
      rationale: { minLength: 1 }

# ---------------------------------------------------------------------------
# The trigger mechanism gate_result records are expected to be produced by.
# This file only supplies the RECORD SHAPE the trigger fires into — it does
# not itself define or count which/how many gates fire (see registry below).
# ---------------------------------------------------------------------------
trigger_context:
  description: >
    A gate_result record is expected whenever
    execution/risk-tier.schema.yaml's `mandatory_gate_injection_trigger`
    fires (condition: `risk_tier IN [R3, R4]`, per ADR-004 — R3's
    `gate_injection.triggers_mandatory_gates` and R4's identical flag). Per
    ADR-004's own reasoning (risk-tier.schema.yaml tiers.R3.gate_injection.
    description), this UNIONS Atlas §14.2's originally R4-only trigger onto
    R3 as well, so R3-tier operations (DB migration, Identity/Authorization
    changes) do not skip the same protections.
  source: "execution/risk-tier.schema.yaml#/mandatory_gate_injection_trigger, #/tiers/R3/gate_injection, #/tiers/R4/gate_injection"
  produces: "zero or more gate_result records, one per gate that fires — the COUNT and IDENTITY of which gates fire is enumerated in gate_catalog below"

# ---------------------------------------------------------------------------
# RESOLVED 2026-08-30 by ADR-011 — the canonical Global/High-risk gate_id
# value catalog. Kept as a documented catalog (not folded into `gate_id`'s
# JSON Schema as a hard `enum`) because Atlas §22.3's Method-specific Gate
# namespace is separate, open-ended, and grows per-method — a hard enum here
# would make every future Method-specific gate_id fail validation.
# ---------------------------------------------------------------------------
gate_catalog:
  status: RESOLVED_2026-08-30
  resolved_by: "docs/adr/ADR-011-platform-gate-ownership-and-unification.md"
  resolves_finding: ["OQ-10", "CROSS-R-5", "CROSS-R-7", "CROSS-T-11"]
  note: >
    This is the RECOMMENDED value catalog for `gate_result.gate_id` when the
    gate is a Global or High-risk gate. It is deliberately a documented list
    (for tooling/lint to validate against), not a schema-level `enum` on
    `gate_id` itself — see the block comment above. Master Plan §158 is
    ADR-011's designated SSOT for this content once the mother document is
    actually amended via the ADR-006 proposal process; until then, this
    catalog is this project's own machine-readable record of ADR-011's
    Recommendation, same status as every other ADR-001~010-derived schema
    content in this project (ADR ACCEPTED ≠ mother document edited).
  global:
    description: "14 items, all mandatory for every deliverable regardless of risk tier."
    items:
      - { id: functional, display_name: "Functional PASS" }
      - { id: evidence, display_name: "Evidence PASS" }
      - { id: reasoning, display_name: "Reasoning PASS" }
      - { id: security, display_name: "Security PASS" }
      - { id: privacy, display_name: "Privacy PASS" }
      - { id: data, display_name: "Data PASS" }
      - { id: jurisdiction, display_name: "Jurisdiction PASS" }
      - { id: localization, display_name: "Localization PASS" }
      - { id: accessibility, display_name: "Accessibility PASS" }
      - { id: observability, display_name: "Observability PASS" }
      - { id: capacity, display_name: "Capacity PASS" }
      - { id: rollback, display_name: "Rollback PASS" }
      - { id: documentation, display_name: "Documentation PASS" }
      - { id: golden_test, display_name: "Golden Test PASS" }
  high_risk:
    description: >
      6 additional items, mandatory on top of `global` when
      execution/risk-tier.schema.yaml's mandatory_gate_injection_trigger
      fires (risk_tier IN [R3, R4]).
    items:
      - id: human_specialist_review
        display_name: "Human Specialist Review PASS"
        deprecated_aliases: ["Human Specialist"]
      - { id: counterevidence, display_name: "Counterevidence PASS" }
      - { id: red_team, display_name: "Red Team PASS" }
      - id: independent_judge
        display_name: "Independent Judge PASS"
        deprecated_aliases: ["Independent Review"]
      - { id: reversal_criteria, display_name: "Reversal Criteria PASS" }
      - id: recovery_rollback_rehearsal
        display_name: "Recovery / Rollback Rehearsal PASS"
        deprecated_aliases: ["Recovery Rehearsal"]
  method_specific:
    description: >
      NOT enumerated here — Atlas §22.3's own open-ended, per-method
      namespace, unaffected by ADR-011 (Atlas's own Scoped Authority grant
      already covers Method-specific Gate). See open_questions.OQ-GATE-3 for
      the still-unresolved question of whether it shares this same flat
      gate_id string space or needs a namespaced form.
    owner: "Method Atlas §22.3, per-method contract"

open_questions:
  - id: "OQ-GATE-1"
    question: >
      RESOLVED 2026-08-30 by ADR-011 (implicitly, via this file's own
      compilation choice): `gate_result.gate_id` stays `type: string`
      validated against `gate_catalog` above as a documented list, not a
      hard schema `enum` — because Atlas §22.3's Method-specific namespace
      (OQ-GATE-3 below) is open-ended and a closed enum would reject every
      future Method-specific gate_id. `policies/ai-execution/
      mandatory-gates.yaml`'s own `gate_ref` field ($ref's this file's
      `gate_id` node) follows the identical choice — see that file's
      OQ-MGATE-1, resolved the same way.
    owner: "closed"
    blocks: "nothing — resolved"
  - id: "OQ-GATE-2"
    question: >
      Should `gate_result.evidence[]` eventually adopt a typed shape (e.g.
      matching EC §65 Content-addressed Evidence's hash/source/timestamp/
      producer fields, L2166-2169) for consistency with how other execution
      records represent evidence, or is a fully free-form array intentional
      here? See compilation_decisions above — left open, not decided, since
      EC §69 itself gives no such structure.
    owner: "operator or future Phase 3/4 compilation pass"
    blocks: "nothing — `evidence: []` validates any array today"
  - id: "OQ-GATE-3"
    question: >
      EC §68's closing line (L2278: "Method-specific gate 從 Method Atlas
      取得") names a THIRD gate category distinct from Global/High-risk, but
      neither EC nor Atlas states whether a method-specific gate's execution
      outcome uses this SAME `gate_result` shape, or a separate one Method
      Atlas defines for itself. This file assumes (but does not confirm) the
      same shape applies by default, since EC §69 is presented as the sole
      Gate Result definition in the corpus and no alternate shape exists
      anywhere to point to instead.
    owner: "operator or Round 2 ADR (may be resolved alongside OQ-10 since both concern the same §68/§22 gate taxonomy)"
    blocks: "nothing structurally — if a different shape is later required for method-specific gates, it would be a new sibling schema, not a breaking change to this one"


    Read EC §68-69 (L2246-2293) in full at the cited lines. Read Atlas
    §22.1/§22.2 (L4164-4194) and §14.2 (L3588-3612). Read Master Plan §158
    (L5903-5926). Read .ai/research/phase-0/open-questions.yaml OQ-10
    (L68-72) and .ai/research/phase-0/verified-findings.yaml CROSS-R-5
    (L98-116), CROSS-R-7 (L398-421), CROSS-T-11 (L495-517) verbatim. Read
    docs/adr/ADR-011-platform-gate-ownership-and-unification.md (2026-08-30)
    in full — the resolution this update applies. Read this project's own
    existing precedent in execution/manifest.schema.yaml (L303-315) and
    cognitive/recipe.schema.yaml (L149-165, L333-342) confirming gate_id/
    gate_ref stay untyped strings elsewhere (unaffected by this resolution).
  note: >
    No mother document was modified — ADR-011's Recommendation (MP §158
    content amendment, Atlas §22.1/22.2 and EC §68 reduction to pointers)
    remains gated behind the separate ADR-006 `.ai/proposals/` flow. This
    file's own edit (gate_catalog, resolved gate_id description) is a
    machine-readable-spec compilation change, the same Low-risk class every
    other ADR-001~010-derived schema file in this project already applies.
    `gate_id` stays `type: string` (not a hard enum) for the reason recorded
    in `gate_catalog`'s own block comment — Atlas §22.3's Method-specific
    namespace remains open-ended and unresolved (OQ-GATE-3), so a closed

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/execution/gate.schema.yaml"
title: Gate Result
version: "1.0.0"
status: ACTIVE

description: >
  Structural (field-shape) definition of a Gate Execution Result record —
  EC §69 "Gate Result" (L2282-2293): what one gate's execution outcome looks
  like (which gate ran, when, PASS/FAIL/BLOCKED/NOT_APPLICABLE, what
  evidence backs the verdict, who/what validated it), PLUS (2026-08-30,
  ADR-011) the canonical Global/High-risk `gate_id` value catalog itself.

  Until 2026-08-30 this file's `gate_id` field was BLOCKED_PENDING_ROUND2_ADR
  because the Global/High-risk Gate LIST was disputed across three
  mother-document copies with different item counts: Master Plan §158
  (L5903-5926) listed 11 Global items + 1 high-risk add-on ("Human
  Specialist Review PASS" only); Method Atlas §22.1/22.2 (L4164-4194) listed
  14 Global items + 6 high-risk add-ons; Execution Contract §68 (L2246-2278)
  copied Atlas's 14+6 counts but with gate-NAME drift ("Independent Review"
  vs Atlas's "Independent Judge PASS"; "Human Specialist" vs "Human
  Specialist Review PASS"; "Recovery Rehearsal" vs "Recovery / Rollback
  Rehearsal PASS"). This was findings CROSS-R-5 / CROSS-R-7 / CROSS-T-11,
  tracked as open question OQ-10 (.ai/research/phase-0/open-questions.yaml
  L68-72).

  **RESOLVED 2026-08-30 by `docs/adr/ADR-011-platform-gate-ownership-and-
  unification.md`**: Master Plan is the sole canonical owner of the
  platform-wide Global/High-risk Gate (per both MP's and EC's own
  self-declared Scoped Authority tables — ADR-011 Sub-decision (a)); its
  content, once amended via the ADR-006 proposal process, is the verified
  union of all three candidates — 14 Global + 6 High-risk items, since the
  smaller candidates are strict subsets, not genuine disagreements
  (Sub-decision (b)); the 3 CROSS-T-11 name-drifted items adopt Atlas's
  wording, with EC's 3 names becoming deprecated aliases (Sub-decision (c)).
  `gate_catalog` below is that resolved 20-item registry. `gate_id` stays
  `type: string` rather than a closed `enum` because Atlas §22.3's
  Method-specific Gate namespace (unaffected by ADR-011, still Atlas's own
  granted scope) is open-ended and grows per-method — a real `gate_id` value
  for a Global/High-risk gate SHOULD be one of `gate_catalog`'s 20 entries,
  but this is recorded as a documented catalog (see `gate_catalog`'s own
  cross-reference), not a hard schema constraint, so a Method-specific
  gate_id remains valid without needing to be enumerated here too — the
  precedent `execution/manifest.schema.yaml`'s `results.gates` field
  (L303-315) and `cognitive/recipe.schema.yaml`'s `steps[].gate_ref` field
  (L149-165, L333-342) already set (leaving gate references as untyped
  strings, not requiring a schema-level enum) still applies post-resolution,
  just with a real catalog to validate against at the tooling/lint layer
  instead of a TBD placeholder. Everything else in `gate_result` (status,
  evidence, validator, timestamp, the NOT_APPLICABLE-requires-rationale
  rule) is a direct, low-risk transcription of EC §69 and was already fully
  buildable before this resolution.


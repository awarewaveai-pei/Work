referenced_by:
  - "manifest.schema.yaml's `properties/results` sub-block is the stub this file formalizes/expands (see open_questions.OQ-RESULT-1 for the un-actioned upgrade)."
  - "cognitive/typed-method-result.schema.yaml (built; MACHINE_READABLE_SPEC_PLAN.md §2.3 row, L122, lists 'execution/result.schema.yaml' as its dependency) — the per-method-invocation output type that resolves CROSS-R-3 in full. This file's top-level description explains the scope split between the two."

open_questions:
  - id: "OQ-RESULT-1"
    question: >
      `manifest.schema.yaml`'s `properties/results/properties/status` is
      currently typed as a bare `{ type: string }`, and `properties/results/properties/gates`
      as a bare `{ type: array, items: { type: string } }`. Both could now
      become real `$ref`s into this file (`status` -> this file's own
      `properties/status` target, i.e. the same status-codes.schema.yaml
      final_status values; `gates` -> `#/definitions/gate_result`) so the
      two files stop being able to drift apart on the same concept.
    owner: "operator / future Phase 3 session"
    blocks: "nothing in this file — the upgrade is entirely inside manifest.schema.yaml"
    why_not_done_here: >
      Task boundary for this session is to create exactly one new file;
      `manifest.schema.yaml` is an already-committed Wave 1 file explicitly
      marked read-only for this task. Editing it is a separate, reviewable
      change (a real schema shape change to a file other consumers may
      already assume the shape of), not a compilation detail to slip in
      silently.
  - id: "OQ-RESULT-2"
    status: "RESOLVED_2026-08-29"
    question: >
      For `status`'s `$ref` (see compilation_decisions) to be resolvable
      by a strict JSON Schema validator rather than only by a human reader
      following the pointer, `status-codes.schema.yaml`'s
      `reference_vocabulary.final_status` node would need an additive
      `type: string` key alongside its existing `source`/`values` keys
      (non-breaking — `values` stays as the human-citation array; a
      validator would instead dereference a sibling `enum` key that
      mirrors `values`). This file's `$ref` target
      (`#/reference_vocabulary/final_status/values`) would then need
      updating to point at the new `enum` key instead of `values`.
    resolution: >
      RESOLVED 2026-08-29 (critic review CRITICAL finding #1, same fix
      already noted at this file's own `properties/status` above):
      `status-codes.schema.yaml` gained the additive `reference_vocabulary.
      final_status.schema` node (`{type: string, enum: [...]}`,
      status-codes.schema.yaml L86-95) and this file's `status.$ref` was
      retargeted from `.../final_status/values` to `.../final_status/
      schema` the same day. **Correction 2026-08-30**: this open question
      itself was left claiming the upgrade "would need" doing, contradicting
      this file's own `properties/status` description two sections above
      which already documents the fix as done — found and annotated while
      auditing this file for a different, unrelated stale-premise class
      (the `gate.schema.yaml` existence question). Closed, not re-opened.
    owner: "closed"
    blocks: "nothing — resolved"
  - id: "OQ-RESULT-3"
    status: "PARTIALLY_RESOLVED_2026-08-30"
    question: >
      Should `gates[].gate_id` eventually become a real `$ref` into
      `gate.schema.yaml` once MRSP-1's Round 2 ADR lands? At that point
      this file's untyped `gate_id: { type: string }` would need
      upgrading, mirroring the exact same upgrade `manifest.schema.yaml`
      itself is waiting on for its own `gates` field.
    resolution_2026-08-30: >
      MRSP-1's Round 2 ADR landed (`docs/adr/ADR-011-platform-gate-
      ownership-and-unification.md`, ACCEPTED 2026-08-30) — the blocker
      this question anticipated is gone, `gate.schema.yaml` exists with a
      resolved 20-item `gate_catalog`. Re-examined against that reality:
      the answer is NO, `gate_id` should NOT become a hard `$ref`/`enum`
      — `gate.schema.yaml`'s own `gate_id` property independently made the
      same "documented catalog, not schema enum" choice for the same
      reason (Atlas §22.3 Method-specific open-endedness), so there is
      nothing stricter to upgrade INTO. This question is closed for the
      `gate_id` scalar. See `open_questions.OQ-RESULT-4` below for the
      adjacent, genuinely still-open question this correction surfaced:
      whether `gates[]`'s ITEM SHAPE (the whole `gate_result` object, not
      just its `gate_id` field) should become a hard `$ref` into
      `gate.schema.yaml#/gate_result` instead of staying a local
      `definitions/gate_result` duplicate.
    owner: "closed (gate_id scalar) — see OQ-RESULT-4 for the open item shape question"
    blocks: "nothing — gate.schema.yaml exists; the untyped gate_id choice is unchanged, confirmed correct rather than assumed"
  - id: "OQ-RESULT-4"
    question: >
      Discovered 2026-08-30 while correcting OQ-RESULT-3 above (not part
      of the original Phase 3 compilation): now that `gate.schema.yaml`
      exists and defines its own full `gate_result` object
      (`gate.schema.yaml#/gate_result`, verbatim EC §69 shape), it and this
      file's local `definitions/gate_result` describe the SAME concept
      with two DIFFERENT shapes for one field — `evidence`.
      `gate.schema.yaml#/gate_result/properties/evidence` is deliberately
      untyped (`items: {}`; that file's own `compilation_decisions`
      explicitly declined to borrow EC §65's Content-addressed Evidence
      shape, reasoning that EC §69 never cross-references EC §65). THIS
      file's `definitions/gate_result/properties/evidence` is TYPED
      (`items: {$ref: "#/definitions/evidence_ref"}`, EC §65's shape,
      reused because `evidence_ref` is also this file's OWN top-level
      `evidence[]` shape and EC §65 is explicitly this file's grounding
      per `source_of_truth_for`). Neither file is "wrong" against its own
      stated reasoning — but the two now silently disagree on one field's
      shape for what both call `gate_result`, and no finding or ADR names
      this disagreement. Should `gates[]` here become a hard `$ref` into
      `gate.schema.yaml#/gate_result` (adopting its untyped evidence,
      losing this file's `evidence_ref` typing), should
      `gate.schema.yaml#/gate_result/properties/evidence` be upgraded to
      match this file's typed shape instead, or should the two
      legitimately stay separate concepts (gate.schema.yaml's `gate_result`
      = the record shape only; this file's `gates[]` = that shape PLUS
      execution-level enrichment)?

      Note (2026-08-30, critic review): a SEPARATE gap the same review
      surfaced while checking this `gate_result` block — the NOT_APPLICABLE
      -requires-rationale rule was prose-only (no JSON Schema `if`/`then`,
      unlike `gate.schema.yaml`'s already-fixed enforcement) — is NOT part
      of this open question. That one had a verified, PoC-confirmed correct
      answer (structurally enforce it, matching the sibling file) and has
      been fixed directly in `definitions/gate_result` and `constraints`
      above, not left open. Only the `evidence` shape question above (which
      genuinely has no single correct answer without a new design choice)
      remains open here.
    owner: "operator / future session — this is a genuine cross-file design
      choice, not a doc-sync correction, so it is surfaced here rather than
      picked unilaterally"
    blocks: "nothing today — both files independently validate against
      their own fixtures; this is a latent drift risk (the two `gate_result`
      shapes could diverge further under future maintenance), not a
      current breakage"


$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/execution/result.schema.yaml"
title: Execution Result
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of the Execution Result — the
  standalone record of how one whole Execution (an `EX-*` run) ended: its
  Final Status (EC §70), its optional canonical reason_code when that outcome
  is BLOCKED or NEEDS_HUMAN_REVIEW (ADR-019), which Global/High-risk gates ran
  and how (EC §69), the evidence bundle behind that determination (EC §65),
  and any artifacts it produced. EC §92 promises this file (`result.schema.yaml`, L2766-2781,
  the file itself named at L2781) but never gives it field-level shape there
  — §92 is only a directory listing. This file supplies that shape by
  compiling EC §64's `results{status, gates}` sub-block (L2178-2181, the
  in-manifest stub this file formalizes and expands), EC §69's `gate_result`
  record (L2282-2293), and EC §65's content-addressed evidence record
  (L2163-2172), while reusing (not redeclaring) EC §70's Final Status
  vocabulary via `status-codes.schema.yaml`.

  Resolves `.ai/research/phase-0/verified-findings.yaml` CROSS-R-3
  PARTIALLY, per `docs/architecture/MACHINE_READABLE_SPEC_PLAN.md` §2.2's
  own row for this file (L104: "CROSS-R-3（部分：result.schema.yaml 不等於
  TypedMethodResult，見 2.3）"). CROSS-R-3's full finding is that the Master
  Plan's `cognitive.execute_method` Capability Contract (MP §8.3, L708/712)
  types its output as `TypedMethodResult` but no schema anywhere defines
  it. This file does NOT define `TypedMethodResult` and does not claim to:
  it is the GENERIC envelope for one whole Execution's final outcome (an
  `EX-*` run, which may invoke many methods across a workflow — see
  `manifest.schema.yaml`'s `method_execution_log[]`), not the typed
  input/output contract for one `cognitive.execute_method` invocation. The
  `cognitive/typed-method-result.schema.yaml`
  (MACHINE_READABLE_SPEC_PLAN.md §2.3 row, L122) is the file that closes
  CROSS-R-3, and that row already names this file
  (`execution/result.schema.yaml`) as its own dependency — see
  `referenced_by` below. This file is the single source of truth for the
  whole-execution result shape; the mother documents and
  `manifest.schema.yaml` reference it, they do not redefine it.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §64 Execution Manifest, results{} sub-block (L2178-2181)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §65 Content-addressed Evidence (L2161-2175)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §68 Global Gates (L2246-2280, gate_id name pool — not enumerated as an enum here, see compilation_decisions)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §69 Gate Result (L2282-2293)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §70 Final Status (L2297-2318, vocabulary reused via $ref, not redeclared)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §92 Machine-readable Execution Specs (L2766-2781, result.schema.yaml named at L2781)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §121 Execution Result Template (L3332-3396, human-readable narrative sibling — see compilation_decisions on scope)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §16.3 Method Execution, outputs.hashes field (L3821-3857, precedent for this file's `outputs[]` shape at the whole-execution grain)"
  - "specs/execution/manifest.schema.yaml properties/results (the stub sub-block this file formalizes/expands) and properties/execution/execution_id (the join key)"
  - "specs/execution/status-codes.schema.yaml reference_vocabulary/final_status (the reused, not redeclared, enum)"
  - ".ai/research/phase-0/verified-findings.yaml CROSS-R-3 (L49-75)"
  - "docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §2.2, row for result.schema.yaml (L104)"

decided_by: >
  No ADR governs this file specifically. `docs/architecture/MACHINE_READABLE_SPEC_PLAN.md`
  §2.2 listed `result.schema.yaml` as READY with no ADR dependency at
  compilation time (verified by reading its row, L104); that row now
  reads **BUILT (2026-08-29)** — corrected here 2026-08-30, same audit
  pass as the `gate.schema.yaml` correction below — unlike `gate.schema.yaml`'s row (L102), which
  WAS `BLOCKED_PENDING_ROUND2_ADR` when this file was originally compiled
  (2026-08-29) and has since been RESOLVED by
  `docs/adr/ADR-011-platform-gate-ownership-and-unification.md` (ACCEPTED
  2026-08-30) — `gate.schema.yaml` now exists on disk with a 20-item
  `gate_catalog`. **Corrected 2026-08-30** (found while working an unrelated
  task, verified independently in this session): this file's
  `compilation_decisions` and `open_questions` below were written against
  the pre-ADR-011 premise that `gate.schema.yaml` did not exist; that
  premise is now false and every affected passage is annotated in place
  rather than silently rewritten — see `compilation_decisions`'s second
  entry and `open_questions.OQ-RESULT-3`. Field-naming and structural
  choices below are Phase 3 compilation decisions, following the same
  "formalize an existing stub without inventing new architecture" mandate
  `manifest.schema.yaml` used for its own compilation_decisions.

compilation_decisions:
  - question: >
      The task requires the top-level `status` field to be "a real $ref"
      to EC §70's Final Status vocabulary, not a re-declared enum. That
      vocabulary already lives in `status-codes.schema.yaml` as
      `reference_vocabulary.final_status`, but reading that file shows its
      node is shaped `{source: <string>, values: [<7 literals>]}` — a
      citation/documentation shape, NOT a JSON-Schema-shaped fragment
      (`{type: string, enum: [...]}`). Every other real cross-file `$ref`
      in this project's specs/ (e.g. `section-registry.schema.yaml`'s ref
      into `manifest.schema.yaml#/properties/documents/items/properties/document_id`,
      or `decision.schema.yaml`'s ref into
      `epistemic-label.schema.yaml#/provenance_record`) resolves to a node
      that itself has a `type` key — a strict JSON Schema validator could
      dereference it directly. `reference_vocabulary/final_status` has no
      `type` key at that path, only `source` and `values`.
    decision: >
      `status: { $ref: "ai-lego://specs/execution/status-codes.schema.yaml#/reference_vocabulary/final_status/values" }`
      — point at the exact array of 7 literals, reproducing zero characters
      of the enum locally (satisfying "not a re-declaration" precisely),
      rather than fabricating a parallel `type: string, enum: [...]` block
      inside a `definitions:` section of THIS file (which would itself be a
      re-declaration by another name, and would drift the moment
      status-codes.schema.yaml's 7 values change).
    reasoning: >
      This project's existing verification method throughout specs/ is
      "Read/Grep against mother documents" (see every sibling file's
      `verification.method`), not "run an ajv validator" — no file in this
      tree has been demonstrated to pass literal JSON Schema $ref
      resolution end-to-end. Given that, pointing at the precise, unique,
      byte-identical location of the 7-value list is the correct
      house-style choice: it is auditable by a human reader (open the
      target file, find the exact key path, see the 7 values) even though
      it would need one additional step (wrapping `values` in a `type` key)
      before an automated JSON Schema tool could dereference it as a
      strict schema. That gap is status-codes.schema.yaml's shape, not this
      file's — and this file's task boundary is to create ONE new file,
      not edit that sibling. Flagged as `open_questions.OQ-RESULT-2` rather
      than silently worked around.
  - question: >
      The task instructions describe all three cross-file grounding points
      (epistemic-label.schema.yaml, gate.schema.yaml, cas-path.schema.yaml)
      uniformly as "soft-reference". But (AT COMPILATION TIME, 2026-08-29)
      `gate.schema.yaml` did not exist on disk (confirmed then:
      `specs/execution/` listing had 7 files, no `gate.schema.yaml`;
      MACHINE_READABLE_SPEC_PLAN.md §2.2 L102 marked it
      `BLOCKED_PENDING_ROUND2_ADR`), while `epistemic-label.schema.yaml`
      and `cas-path.schema.yaml` were both already BUILT (confirmed on
      disk). Every other Wave 2+ file in this tree (`evidence.schema.yaml`,
      `decision.schema.yaml`, `claim.schema.yaml`, `section-registry.schema.yaml`,
      `normative-context.schema.yaml`, `cause-hypothesis-set.schema.yaml`)
      uses a REAL hard `$ref` into already-built files, reserving the
      documented "soft reference by name/convention only, NOT a hard $ref"
      pattern specifically for files that do not yet exist or would create
      a forward Wave dependency (e.g. `manifest.schema.yaml`'s
      `document_id` vs. `document-registry.schema.yaml`, or
      `cas-path.schema.yaml`'s own `tenant_segment` vs.
      `domain/tenant.schema.yaml` at the time it was written).
    decision: >
      Use a REAL hard `$ref` for `provenance` (into
      `epistemic-label.schema.yaml#/provenance_record`) and for evidence/
      output hash fields (into `cas-path.schema.yaml#/definitions/sha256_hash`)
      — both files already exist, so the established convention calls for
      a real ref, not a soft one. Keep `gates[].gate_id` genuinely untyped
      (no `$ref`, no `enum`) — AT THE TIME, `gate.schema.yaml` did not
      exist and its content was blocked on Round 2 ADR (MRSP-1), so there
      was nothing to hard-`$ref` into; this exactly mirrored
      `manifest.schema.yaml`'s own established wording for the identical
      gap. **Re-verified 2026-08-30, decision UNCHANGED for a different
      reason**: `gate.schema.yaml` now exists (built 2026-08-29, completed
      2026-08-30 by ADR-011) and its own `gate_result.gate_id` property is
      ITSELF still `type: string` with no `enum` — deliberately, per that
      file's own `gate_catalog.note`, because Atlas §22.3's Method-specific
      gate namespace is open-ended and a closed enum would reject every
      future Method-specific `gate_id`. A hard `$ref` from this file's
      `gate_id` into `gate.schema.yaml`'s `gate_id` property would therefore
      resolve to another plain `{type: string}` node — syntactically legal
      but adding no enforcement, only an indirection. Genuinely untyped
      stays correct; only the REASON changes, from "target doesn't exist"
      to "target exists and made the identical open-ended choice this file
      already made independently".
    reasoning: >
      Matching the file's actual build state (not the task prompt's
      informal wording) keeps this schema consistent with every sibling
      file already on disk, and avoids two different meanings of
      "soft-reference" coexisting silently in the same file. The task's
      wording is read as "tie into / ground in", not as the stricter
      "NOT a hard $ref" jargon this project's own compilation_decisions
      sections use — a distinction worth recording explicitly per R4
      (claim-before-verify), not silently resolved either way.

      **Correction note (2026-08-30, found and fixed in a separate
      consistency-check session, not the original compilation)**: the
      question/decision above are preserved as the historical record of
      what was actually true and decided on 2026-08-29 — not rewritten —
      because the underlying DECISION (keep `gate_id` untyped) survives
      re-verification against present reality; only the now-stale premise
      needed annotating. The one place ADR-011's arrival DOES change
      something new is `gate_result` as a whole OBJECT SHAPE, not just the
      `gate_id` field: `gate.schema.yaml` now independently defines its own
      full `gate_result` record (`#/gate_result`, EC §69 shape) — and its
      `evidence` property is deliberately left UNTYPED (`items: {}`; that
      file's own `compilation_decisions` explicitly declined to borrow EC
      §65's Content-addressed Evidence shape), whereas THIS file's
      `definitions/gate_result.evidence` below is TYPED
      (`items: {$ref: "#/definitions/evidence_ref"}`, this file's own
      Q3 below explains why). Two sibling files now hold two different,
      undeclared-as-such shapes for the same EC §69 concept. Silently
      picking one (e.g. by hard-`$ref`-ing this file's `gates[]` into
      `gate.schema.yaml#/gate_result` and losing the `evidence_ref` typing,
      or vice versa) would be a NEW design decision this doc-sync pass is
      not authorized to make unilaterally — recorded instead as
      `open_questions.OQ-RESULT-4` below, not resolved here.
  - question: >
      EC §69's `gate_result` shape (`gate_id, status, evidence, validator,
      timestamp`) is a CONCRETE, fully-specified record — unlike
      `gate.schema.yaml`'s blocker (AT COMPILATION TIME, 2026-08-29), which
      was specifically about the LEGAL SET of `gate_id` values (EC §68's 14
      Global + 6 High-risk names, MRSP-1's "14+6 vs 11+1" undecided count),
      not about the shape of one gate result entry. `manifest.schema.yaml`'s
      existing `results.gates` field pre-dates this distinction: it types
      `gates` as a bare `array of string` (gate ID references only, no
      status/evidence/validator/timestamp), with a comment that the field
      is "deliberately untyped ... pending that ADR."
    decision: >
      This file's `gates[]` uses the FULL EC §69 `gate_result` object shape
      (`gate_id` untyped string + `status` enum PASS/FAIL/BLOCKED/
      NOT_APPLICABLE, drawn directly from EC §69's own literal text, which
      is NOT blocked + `evidence[]` + `validator` + `timestamp`), not
      `manifest.schema.yaml`'s simplified string-array form. Only the
      `gate_id` VALUE SPACE remains untyped/opaque, using the identical
      rationale `manifest.schema.yaml` already recorded for that one field
      — everything else about a gate result is safe to type today because
      EC §69 already specifies it and no finding disputes it.
    reasoning: >
      Directly fulfills the task's framing: "formalize and EXPAND" the
      manifest sub-block into the full standalone type. Reusing
      `manifest.schema.yaml`'s bare-string shape here would under-deliver
      on "full" while offering no benefit — EC §69's richer shape carries
      real information (pass/fail per gate, who validated it, when, on
      what evidence) that 30-year replay explicitly needs and that no
      finding or ADR blocks. `manifest.schema.yaml` itself is left
      untouched (task boundary); its simpler `gates: array of string`
      field remains valid but strictly less detailed than this file's —
      flagged as a follow-up in `open_questions.OQ-RESULT-1`.

      **Correction note (2026-08-30)**: the "14+6 vs 11+1 undecided count"
      premise above is now RESOLVED — ADR-011 (ACCEPTED 2026-08-30) settled
      the count at 20 (14 Global + 6 High-risk, the verified union — see
      `gate.schema.yaml#/gate_catalog`). This does not change the decision
      recorded above (`gates[].gate_id` stays untyped regardless of whether
      the legal set has 11, 17, or 20 members — see Q2's correction note
      for why a hard `$ref`/`enum` still isn't warranted even now that the
      set is known); it only removes the now-stale "undecided" framing of
      the premise itself.
  - question: >
      EC §121's "Execution Result Template" (L3332-3396) is a much richer,
      19-section MARKDOWN template (Task/Objective/Current State/Root
      Cause/Normative Documents/Methods/Risk-Authority/Selected Approach/
      Alternatives Rejected/Exact Paths Changed/Data-Schema-API Impact/
      Security-Privacy-Jurisdiction Impact/Tests & Gates/Expected Result/
      Actual Result/Rollback/Observability/Known Risks-Unknowns/ADR-Evidence)
      for a HUMAN-facing handoff write-up, not obviously a promise of a
      13-file `/specs/execution/` machine schema. Should this file
      machine-type all 19 sections?
    decision: >
      No. This file grounds only the fields §121 implies AND that map onto
      concrete, already-specified machine records elsewhere (Final Status
      -> `status`; "Rollback" -> `rollback_ref`; "Exact Paths Changed" /
      Atlas §16.3 `outputs.hashes` -> `outputs[]`; "Tests & Gates" -> EC
      §69's `gates[]`). It does NOT attempt to machine-type narrative
      sections with no existing structured counterpart anywhere in the
      corpus (Root Cause, Alternatives Rejected, Selected Approach,
      Observability, etc.) — doing so would be new architecture design
      invented by this file, not a compilation of an existing promise, and
      is out of scope for a single-file Phase 3 task. `summary` is kept as
      one free-text field for whatever narrative content an implementation
      wants to carry, rather than inventing 15 more structured fields with
      no source-of-truth citation.
    reasoning: >
      Per R0's "不接受可能是" standard: every REQUIRED/typed field in this
      file must trace to a concrete citation. §121's narrative sections
      have no machine shape anywhere in the three mother documents to
      compile from — typing them would be guessing, which R0 and
      `AGENTS.md`'s 補丁判準 both forbid ("未讀現有邏輯即重寫 / 猜測補未知").

# ADR-019 placement decision (2026-08-30): reason_code belongs to this
# whole-execution result, which owns the EC §70 final status. The state
# machine's optional trigger_signal remains transition-local evidence; a
# second synonymous field there would create two sources of truth. The
# vocabulary is hard-$ref'd from status-codes.schema.yaml, whose registry is
# the sole owner of named signals. The field is schema-optional for historical
# records, while new BLOCKED/NEEDS_HUMAN_REVIEW producers must emit it.

# ---------------------------------------------------------------------------
# Schema body
# ---------------------------------------------------------------------------

definitions:

  evidence_ref:
    description: >
      One content-addressed evidence item, per EC §65 (L2163-2172) verbatim:
      "重要 evidence：hash / source / timestamp / producer... 避免「同名檔案
      內容已變」造成歷史失真" (guards against same-filename-different-content
      history corruption). Used both by this file's top-level `evidence[]`
      (why the whole execution's status was determined) and by
      `gate_result.evidence[]` (EC §69's own `evidence: [...]` field on one
      gate) — EC never distinguishes two evidence shapes, so this file does
      not invent one either.
    type: object
    required: [hash, timestamp]
    properties:
      hash:
        $ref: "ai-lego://specs/artifact/cas-path.schema.yaml#/definitions/sha256_hash"
        description: "Real hard $ref: cas-path.schema.yaml already exists on disk."
      source:
        type: string
        description: "EC §65 `source` field, verbatim — where this evidence came from."
      timestamp:
        type: string
        format: date-time
      producer:
        type: string
        description: >
          EC §65 `producer` field, verbatim. Kept as a plain string (actor/
          service identity) per EC's own literal 4-field list — NOT
          expanded into a full `provenance_record` here, since EC §65 names
          exactly one field for this and gives it no further structure; the
          richer `provenance_record` shape is reserved for this file's own
          top-level `provenance` field (see below), which answers a
          different question (what kind of claim is this whole result,
          and who authorized it) than "who/what produced one evidence
          item".

  gate_result:
    description: >
      One gate's outcome, per EC §69 Gate Result (L2282-2293) verbatim
      shape. See compilation_decisions above for why `gate_id` stays
      untyped while every other field is fully typed.
    type: object
    required: [gate_id, status]
    properties:
      gate_id:
        type: string
        description: >
          RESOLVED 2026-08-30 by
          `docs/adr/ADR-011-platform-gate-ownership-and-unification.md`:
          the Global/High-risk gate list is no longer undecided — it is
          the 20-item catalog (14 Global + 6 High-risk) now recorded at
          `gate.schema.yaml#/gate_catalog`. Kept `type: string` here with
          no `$ref`/`enum` nonetheless (unchanged from the pre-ADR-011
          draft, but now for a verified rather than assumed reason):
          `gate.schema.yaml`'s own `gate_result.gate_id` property makes the
          identical choice — a documented catalog, not a hard schema
          `enum` — because Atlas §22.3's Method-specific gate namespace is
          open-ended and a closed enum would reject every future
          Method-specific `gate_id`; see this file's `compilation_decisions`
          (Q2's correction note) for the full comparison. This field's
          ORIGINAL description (kept below for local readability, not
          deleted) named EC §68's example DISPLAY-NAME pool
          (Functional/Evidence/Reasoning/Security/Privacy/Data/
          Jurisdiction/Localization/Accessibility/Observability/Capacity/
          Rollback/Documentation/Golden Test, plus the High-risk set
          Human Specialist/Counterevidence/Red Team/Independent Review/
          Reversal Criteria/Recovery Rehearsal) as informal guidance only.
          **Value-space clarification (2026-08-30, since a reader could
          otherwise copy one of those display names verbatim into this
          field)**: those are `gate_catalog[].display_name` strings, NOT
          this field's actual value space — a real `gate_id` here SHOULD be
          one of `gate.schema.yaml#/gate_catalog`'s `id` slugs (snake_case,
          "PASS"-suffix stripped, e.g. `security`, `human_specialist_review`
          — see ADR-011 Sub-decision (c) for why slugs, not display names,
          are canonical). Of the display names above, 3 are now deprecated
          aliases superseded by Atlas's wording (`Independent Review` →
          `independent_judge`/"Independent Judge PASS"; `Human Specialist`
          → `human_specialist_review`/"Human Specialist Review PASS";
          `Recovery Rehearsal` → `recovery_rollback_rehearsal`/"Recovery /
          Rollback Rehearsal PASS"), per CROSS-T-11's resolution.
      status:
        type: string
        enum: [PASS, FAIL, BLOCKED, NOT_APPLICABLE]
        description: >
          EC §69's own literal vocabulary (L2287: "PASS|FAIL|BLOCKED|
          NOT_APPLICABLE") — a DIFFERENT, smaller enum than this file's
          top-level `status` (EC §70 Final Status, 7 values). EC never
          conflates the two: one gate's pass/fail is not the whole
          execution's final disposition. Declared inline (not $ref'd) as
          it has no separate promised schema file of its own, unlike §70's
          vocabulary which `status-codes.schema.yaml` already owns.
      rationale:
        type: string
        description: >
          REQUIRED when status == NOT_APPLICABLE, per EC §69's own text
          (L2293): "`NOT_APPLICABLE` 必須有 rationale。" **Fixed 2026-08-30**
          (critic review, cross-checked against a real jsonschema
          Draft202012Validator run): this property was previously left
          optional at the property level with the rule stated only as
          prose in `constraints` below (no JSON Schema `if`/`then`) — the
          same PROSE-ONLY gap `gate.schema.yaml`'s `gate_result` had until
          its own 2026-08-29 Wave 8 golden-test bughunt fix (see that
          file's `gate_result` block comment, L182-187: "confirmed
          empirically... {gate_id, status: NOT_APPLICABLE} with no
          rationale validated successfully before this fix"). A PoC run
          against THIS file's pre-fix `#/definitions/gate_result`
          reproduced the identical gap:
          `{gate_id: "security", status: NOT_APPLICABLE}` (no `rationale`)
          validated with zero errors. Now enforced structurally below —
          see the sibling `if`/`then` block, copied from
          `gate.schema.yaml`'s already-fixed pattern.
      evidence:
        type: array
        items: { $ref: "#/definitions/evidence_ref" }
        description: "EC §69's own `evidence: [...]` field on one gate result."
      validator:
        type: string
        description: "EC §69 `validator` field, verbatim — who/what ran this gate."
      timestamp:
        type: string
        format: date-time
    if:
      properties: { status: { const: NOT_APPLICABLE } }
      required: [status]
    then:
      required: [rationale]
      properties:
        rationale: { minLength: 1 }

  artifact_ref:
    description: >
      One output/artifact the execution produced or changed. Grounded in
      Atlas §16.3's `outputs.hashes` field (L3821-3857, already embedded at
      the per-method-invocation grain in `manifest.schema.yaml`'s
      `method_execution_log[].outputs.hashes`, a bare array of strings) and
      EC §121's "Exact Paths Changed" template section (L3332-3396) — this
      file needs the same concept at the whole-EXECUTION grain, one level
      up from a single method invocation. Kept to a hash reference plus an
      optional human-readable label, matching Atlas §16.3's own
      hash-only precedent rather than inventing a richer shape with no
      source-of-truth citation.
    type: object
    required: [hash]
    properties:
      hash:
        $ref: "ai-lego://specs/artifact/cas-path.schema.yaml#/definitions/sha256_hash"
        description: "Real hard $ref: cas-path.schema.yaml already exists on disk."
      path:
        type: string
        description: >
          OPTIONAL human-readable label for the artifact (e.g. a
          repository-relative file path), additive detail Atlas §16.3
          leaves implicit in its bare hash array.
      description:
        type: string

type: object
required: [execution_id, status, evaluated_at, provenance]
properties:

  execution_id:
    type: string
    pattern: "^EX-"
    description: >
      Join key back to the owning Execution. Same value and same pattern
      as `manifest.schema.yaml`'s `properties/execution/properties/execution_id`
      for the same run — this file and manifest.schema.yaml are two
      per-execution artifacts describing one `EX-*` run from two angles
      (manifest = what was pinned/consumed going in; result = what
      happened coming out). Not a hard `$ref` (this is a plain pattern
      string, not a schema-object reference) — the regex is reused
      verbatim rather than duplicated by accident.

  task_id: { type: string, pattern: "^TASK-" }
  run_id: { type: string, pattern: "^RUN-" }
  trace_id: { type: string, pattern: "^TRACE-" }

  status:
    $ref: "ai-lego://specs/execution/status-codes.schema.yaml#/reference_vocabulary/final_status/schema"
    description: >
      Real $ref into EC §70's Final Status vocabulary as already registered
      by `status-codes.schema.yaml`'s `reference_vocabulary.final_status.schema`
      node — NOT redeclared here. **Fixed 2026-08-29 (critic review CRITICAL
      finding #1)**: this previously pointed at `.../final_status/values`,
      which is a bare YAML array, not a schema object — `$ref` to a
      non-schema node crashes any real JSON Schema validator. Retargeted to
      the new `/schema` sibling node added to `status-codes.schema.yaml` for
      exactly this purpose; the original `open_questions.OQ-RESULT-2`
      follow-up below (which anticipated needing exactly this kind of
      additive, non-breaking key) is now resolved by this fix, not merely
      proposed.

  reason_code:
    $ref: "ai-lego://specs/execution/status-codes.schema.yaml#/reference_vocabulary/emittable_reason_codes/schema"
    description: >
      OPTIONAL canonical cause for a BLOCKED or NEEDS_HUMAN_REVIEW final
      status. New producers must emit it for those outcomes; historical
      records remain valid without it. The hard $ref permits only the nine
      currently-emittable named signals in status-codes.schema.yaml.

  rationale:
    type: string
    description: >
      Human-readable justification for `status`, expected whenever
      `status` is not `PASS` (documented in `constraints` below, not a hard
      JSON Schema `required`). MUST NOT be one of EC §70's explicitly
      forbidden vague answers (L2311-2318: "應該好了 / 看起來沒問題 /
      大概完成").

  evaluated_at:
    type: string
    format: date-time
    description: "When this final status was determined."

  provenance:
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"
    description: >
      Real hard $ref: epistemic-label.schema.yaml already exists on disk.
      Required per that file's own stated universal mandate ("the minimal
      provenance object every content/claim object must carry") — an
      Execution Result is itself a claim ("this execution's final status
      is X"), so it is in scope for that mandate like any other
      content/claim object in the system.

  gates:
    type: array
    items: { $ref: "#/definitions/gate_result" }
    description: >
      Full EC §69 gate_result records for every gate that ran on this
      execution. Expands `manifest.schema.yaml`'s simplified
      `results.gates: array of string` stub — see compilation_decisions
      and `open_questions.OQ-RESULT-1`. No `minItems`: which gates (if
      any) are required is compiled by EC §67's Definition of Done
      Compiler from Task Type + Risk Tier + Domain + ... , not by this
      file (e.g. an R0 read-only task may legitimately run zero gates,
      per `risk-tier.schema.yaml`'s R0 tier: `required_actions: []`).

  evidence:
    type: array
    items: { $ref: "#/definitions/evidence_ref" }
    description: >
      Execution-level evidence bundle supporting `status` as a whole,
      distinct from any single gate's own `gates[].evidence[]`. Same EC
      §65 shape reused, not redeclared, at both grains.

  outputs:
    type: array
    items: { $ref: "#/definitions/artifact_ref" }
    description: >
      Artifacts this execution produced or changed, at the whole-execution
      grain. See `artifact_ref` above for grounding.

  rollback_ref:
    type: [string, "null"]
    description: >
      Populated when `status == ROLLED_BACK` (or when a rollback occurred
      as part of reaching another status). Whole-execution counterpart of
      Atlas §16.3's per-method-invocation `rollback_ref`, already embedded
      in `manifest.schema.yaml`'s `method_execution_log[].rollback_ref`;
      also answers EC §121's template "## Rollback" section at the
      whole-execution grain. Nullable: absent/null when no rollback
      occurred.

  summary:
    type: string
    description: >
      Free-text narrative, e.g. a filled EC §121 Execution Result Template
      instance or any subset of it. Deliberately unstructured — see
      compilation_decisions on why §121's 19 narrative sections are not
      individually machine-typed by this file.

allOf:
  # Historical records can omit reason_code. A present reason is valid only
  # for the two escalated final states, preventing a PASS-with-block-reason.
  - if:
      required: [reason_code]
    then:
      properties:
        status:
          enum: [BLOCKED, NEEDS_HUMAN_REVIEW]

constraints:
  description: >
    Cross-field rules this schema's JSON-Schema `properties` block above
    cannot express structurally, recorded as prose per this project's
    established convention (e.g. `epistemic-label.schema.yaml`'s `locked`
    constraints) rather than left implicit.
  rules:
    - "gates[].rationale MUST be present when gates[].status == NOT_APPLICABLE (EC §69 L2293, verbatim). **Fixed 2026-08-30**: this was prose-only (no structural enforcement) until a critic review caught the gap by PoC — `definitions/gate_result` now also carries a real `if`/`then` making this rule machine-enforced, not just documented; this prose line is kept as the human-readable citation, not the sole enforcement mechanism."
    - "rationale (top-level) SHOULD be present whenever status != PASS; if present, MUST NOT be one of EC §70's forbidden vague answers (L2311-2318: 應該好了/看起來沒問題/大概完成)."
    - "Newly emitted BLOCKED or NEEDS_HUMAN_REVIEW results MUST carry reason_code. The additive schema keeps historical records without it valid; if reason_code is present, status MUST be BLOCKED or NEEDS_HUMAN_REVIEW."
    - "rollback_ref SHOULD be non-null when status == ROLLED_BACK (EC §70 L2307); MAY be non-null for other statuses if a partial rollback occurred en route (e.g. PARTIAL_SUCCESS)."
    - "outputs[] and evidence[].hash entries are plain sha256 hashes (cas-path.schema.yaml#/definitions/sha256_hash), not full tenant-scoped cas_path objects — resolving a hash to its storage path is that schema's job, not this file's, matching Atlas §16.3's own hash-only precedent."


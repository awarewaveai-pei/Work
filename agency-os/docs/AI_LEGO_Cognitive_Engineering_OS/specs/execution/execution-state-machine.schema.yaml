$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/execution/execution-state-machine.schema.yaml"
title: Execution State Machine
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of Execution Contract §10 "Execution
  State Machine" (L531-577, range verified by direct read this session): the
  14-state primary sequence RECEIVED -> DOCUMENTS_RESOLVED ->
  CURRENT_STATE_ESTABLISHED -> RISK_CLASSIFIED -> METHODS_RESOLVED ->
  PLAN_COMPILED -> ROLLBACK_VALIDATED -> APPROVED -> EXECUTING -> VERIFYING
  -> READY_FOR_RELEASE -> RELEASING -> POST_VERIFY -> CLOSED (L534-560,
  verbatim names/order), plus the transition-legality rule EC states in its
  own voice immediately after the diagram -- "禁止跳過必要 state" (L575,
  skipping a necessary state is forbidden) -- and the per-state entry
  preconditions the mother documents specify elsewhere for specific states.

  This file is the gap `status-codes.schema.yaml` explicitly named but did
  not fill: that file's own block comment (its L68-71) states its "only job
  is mapping named signals onto these existing values" and that the 7 legal
  side-states are "cited verbatim from EC §10/§70" -- it deliberately does
  NOT define the full state-transition graph. EC §92's own 13-file
  `/specs/execution/` list (L2766-2783) does not name a state-machine file
  either. **Correction (found and fixed in this same compilation pass, not
  a later session)**: an earlier draft of this paragraph additionally
  claimed no planning document names this gap at all -- that claim was
  FALSE and is corrected here rather than silently rewritten out of
  existence. `docs/architecture/MVP_VERTICAL_SLICE_PLAN.md` §4 "Required
  Phase-3 Specs" (Status: PROPOSED, L111) DOES name this exact file:
  "`execution-state-machine.schema.yaml`（EC §10，含
  `BLOCKED`／`PLANNING_BLOCKED_METHOD_ATLAS_REQUIRED`）" -- found via a
  broader grep sweep for this filename across the whole repo AFTER the
  narrower grep against `MACHINE_READABLE_SPEC_PLAN.md`/`GAP_REGISTER.yaml`/
  `DUPLICATION_REGISTER.yaml`/`verified-findings.yaml` had already come back
  empty; that narrower sweep's "no ADR/finding governs this" conclusion
  still holds (MVP_VERTICAL_SLICE_PLAN.md is a PROPOSED planning document,
  not an ADR or a registered finding, and its own scope-boundary note says
  it "不修改三母文件" and gates actual slice execution behind Phase 3/4
  completion + a separate operator approval -- it does not itself authorize
  or block building this schema file, which this task's own instruction
  already separately authorized). The plan's parenthetical
  "PLANNING_BLOCKED_METHOD_ATLAS_REQUIRED" mention is consistent with, not
  in tension with, `status-codes.schema.yaml`'s own prior resolution of
  that exact name as a deprecated alias of the canonical
  METHOD_RESOLUTION_BLOCKED (see this file's `preconditions.METHODS_RESOLVED`
  below, which already cites METHOD_RESOLUTION_BLOCKED) -- no schema content
  changed as a result of finding this citation, only the provenance claim
  above. This file is therefore a genuinely NEW schema build, anticipated by
  one PROPOSED planning document but not yet governed by any ADR or
  registered finding -- the same situation `audit.schema.yaml` (built
  alongside this file, same session, also named at the same
  MVP_VERTICAL_SLICE_PLAN.md §4 line) documents about itself.

  The 7 legal side states (BLOCKED / NEEDS_HUMAN_REVIEW / FAILED /
  CANCELLED / ROLLED_BACK / COMPENSATED / PARTIAL_SUCCESS, EC §10 L563-573)
  are `$ref`'d from `status-codes.schema.yaml`'s own
  `reference_vocabulary/legal_side_states/schema` node, NOT redeclared here
  -- that file is already the single source of truth for that enum and for
  the per-signal mapping of named blocking codes onto it. This file is the
  single source of truth for legal PRIMARY-state ordering, the enforced
  no-skip rule, and the per-state preconditions cited below; EC §10's own
  prose remains the source of truth for the state NAMES and the two
  verbatim rules, unchanged.


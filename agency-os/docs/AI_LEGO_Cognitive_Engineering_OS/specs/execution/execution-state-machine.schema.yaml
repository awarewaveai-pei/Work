  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §3 AI Boot Contract (L141-167) -- the 11-step boot flow this state sequence parallels in places (see compilation_decisions for how much correspondence is actually asserted)"

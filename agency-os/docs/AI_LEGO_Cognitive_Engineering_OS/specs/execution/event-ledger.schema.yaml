    NOT a closed enum. New values are expected over time, following the
    PascalCase convention `event_type`'s own `pattern` documents, per
    DATA_ARCHITECTURE_PLAN.md §5's own explicit statement that its new
    event name "沿用 MP §57 既有...事件命名慣例" (follows MP §57's existing
    naming CONVENTION, not a closed list).
  mp_57_example_list:

decided_by: >
  No single ADR governs this file's overall existence or shape. Like
  `execution/current-state.schema.yaml`, the core Event envelope
  (event_id/event_type/occurred_at/tenant_id/aggregate_id/sequence/payload)
  is a direct Phase 3 compilation of already-written mother-document prose
  (MP §57 L2546-2567, EC §27 L1099-1125) — not a Phase 0/1 finding
  resolution or a new architecture decision requiring ADR review. Two
  narrower pieces of this file's content ARE ADR-governed: (1) the
  encryption-envelope integration and PersonalDataRedacted's status as MP
  §57's 10th event type are `docs/adr/ADR-002-personal-data-erasure-vs-
  event-immutability.md` Option A / Option C / Consequences items 4-5
  (ACCEPTED); (2) this file's field-naming choice (`aggregate_id` +
  `sequence`, not `stream_id`/`sequence_number`) is honestly NOT itself
  ADR-authorized for THIS file — it is a Phase 3 compilation decision that
  reuses naming `docs/adr/ADR-013-batch-ratification-of-proposed-document-
  transcriptions.md` Sub-decision 1 (ACCEPTED 2026-08-30) already ratified
  when it confirmed `repository-contract.schema.yaml`'s faithful
  transcription of `DATA_ARCHITECTURE_PLAN.md` §3's mechanism.
  `DATA_ARCHITECTURE_PLAN.md` itself remains its own `Status: PROPOSED`,
  and ADR-013's ratification is explicitly scoped to
  `repository-contract.schema.yaml`/`tenant-isolation-controls.schema.yaml`'s
  OWN field transcriptions (ADR-013 Decision Driver 4: "本 ADR 批准的範圍嚴格
  限定在...這 5 個機讀 schema/policy 檔案"), not to any later file (this one
  included) that merely reuses the same field NAMES for cross-file naming
  consistency — recorded here honestly rather than claimed as
  ADR-authorized. All other field-level type/format/reference choices below
  are Phase 3 compilation decisions, recorded in `compilation_decisions`
  above, not new architecture decisions.

# ---------------------------------------------------------------------------
# Schema body
# ---------------------------------------------------------------------------
# Root $ref: see compilation_decisions above (mirrors epistemic-label.schema.yaml's
# own Codex-reviewed fix) — without this, a validator pointed at this file's bare
# root would have no type constraint and would accept any value.
$ref: "#/event"

event:
  type: object
  description: >
    One Event Ledger record. MP §57 + EC §27, compiled — see top-level
    description and compilation_decisions for full grounding.
  required: [event_id, event_type, occurred_at, tenant_id, aggregate_id, sequence, payload]
  properties:

    event_id:
      type: string
      minLength: 1
      description: >
        Opaque identifier, no assumed format (see compilation_decisions).
        This is EC §27's "Idempotency Key" concept for this event — the
        value a consumer uses to detect and discard a duplicate delivery
        under EC §27's "At-least-once + Idempotent Consumer" principle.

    event_type:
      type: string
      pattern: "^[A-Z][A-Za-z0-9]*$"
      description: >
        Open string, NOT a closed enum — see compilation_decisions. The
        pattern documents the PascalCase NAMING CONVENTION every known
        event_type value in this corpus follows (MP §57's 9 examples,
        ADR-002's PersonalDataRedacted, DATA_ARCHITECTURE_PLAN.md's
        ResultPromotedToEvidence/DeleteDerivedProjections — see
        `known_event_types` below); it does not constrain WHICH names are
        legal, only their FORMAT.

    occurred_at:
      type: string
      format: date-time
      description: >
        When this event occurred. No mother document names this field
        explicitly (MP §57/EC §27 are prose-only); this follows this
        corpus's own established `<verb>_at` timestamp-naming pattern
        (`created_at`/`started_at`/`redacted_at`/`deleted_at`), generalized
        since — unlike `personal-data-redacted-event.schema.yaml`'s
        domain-specific `redacted_at` — this envelope's event_type varies.

    tenant_id:
      $ref: "ai-lego://specs/domain/tenant.schema.yaml#/properties/tenant_id"
      description: >
        Hard $ref — see compilation_decisions for why this diverges from
        `personal-data-redacted-event.schema.yaml`'s soft-reference choice
        for the same target. Every event is scoped to exactly one Tenant
        (ADR-003 blast-radius boundary) — there is no cross-tenant event.

    aggregate_id:
      type: string
      minLength: 1
      description: >
        Which Domain Model aggregate root this event is "about" (e.g. a
        specific Claim/Evidence/Decision/Document — DATA_ARCHITECTURE_PLAN.md
        :68's own examples). Field name reused verbatim from
        `repository-contract.schema.yaml#/consistency_concurrency_strategy`
        — see compilation_decisions for why this is `aggregate_id`, not the
        task brief's suggested `stream_id`.

    sequence:
      type: integer
      minimum: 0
      description: >
        Monotonic position of this event WITHIN `aggregate_id`'s own stream
        — per-aggregate, NOT globally monotonic across the whole Ledger
        (see compilation_decisions). Forms the composite optimistic-
        concurrency key `(aggregate_id, sequence)` per
        DATA_ARCHITECTURE_PLAN.md:68 / repository-contract.schema.yaml
        #/consistency_concurrency_strategy/aggregate_optimistic_concurrency.
        This IS the ordering key MP §57's "Replay 到任意歷史狀態" replays
        along for a single aggregate; `replay_query` below additionally
        supports timestamp-anchored replay across aggregates.

    payload:
      type: object
      description: >
        Event-type-specific data. Open object for every event_type EXCEPT
        one enforced override below (see `allOf`) — see compilation_decisions
        for why a full discriminated union across every known event_type is
        NOT attempted here. A Confidential/Restricted field WITHIN this
        object (MP §61) is expected to be replaced by an instance of
        `encrypted_payload_field` below rather than storing plaintext (per
        ADR-002 Option A and MVP_VERTICAL_SLICE_PLAN.md step 8's worked
        example) — descriptive only, not mechanically enforced here (see
        compilation_decisions and open_questions.OQ-EL-4).

    provenance:
      $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"
      description: >
        OPTIONAL. Hard $ref to the epistemic_type/authorship_state axes —
        see compilation_decisions for why this is optional and why this
        file hard-$refs rather than soft-references (a documented
        divergence from `personal-data-redacted-event.schema.yaml`'s own
        `provenance` field, which uses the identical field NAME for the
        identical concept). Absent when a producer does not populate it;
        downstream consumers MUST NOT treat its absence as an error.

  allOf:
    - if:
        properties: { event_type: { const: PersonalDataRedacted } }
        required: [event_type]
      then:
        properties:
          payload:
            $ref: "ai-lego://specs/domain/personal-data-redacted-event.schema.yaml"

  constraints:
    - "event_id MUST NEVER be reused across the Event Ledger's entire lifetime (EC §27, L1125: 'Event ID 不得重用'). JSON Schema can only validate one instance at a time and CANNOT check global uniqueness across every event ever emitted -- that invariant MUST be enforced by the write path (e.g. a database-level UNIQUE constraint on event_id), the same honest limitation this file records for the separate (aggregate_id, sequence) pair below."
    - "(aggregate_id, sequence) MUST be unique across the Ledger (DATA_ARCHITECTURE_PLAN.md:68's UNIQUE constraint, ratified via ADR-013 Sub-decision 1 into repository-contract.schema.yaml) -- again a write-path invariant this schema cannot itself check across separate instances."
    - "Once emitted, an event's payload is immutable (MP §58 Immutable-first, L2570-2586) -- a correction is a NEW event (a higher `sequence` on the same `aggregate_id`), never a mutation of this one. Mirrors personal-data-redacted-event.schema.yaml's identical constraint for its own event type."
    - "When event_type == PersonalDataRedacted, payload MUST validate against specs/domain/personal-data-redacted-event.schema.yaml -- mechanically enforced above via allOf/if/then, not prose-only."

# ---------------------------------------------------------------------------
# Documentation-only $ref target for a Confidential/Restricted payload field's
# replacement shape -- NOT wired into event.properties.payload. See
# compilation_decisions above for why this cannot be mechanically enforced.
# ---------------------------------------------------------------------------
encrypted_payload_field:
  description: >
    The shape any `payload` field MUST take once its plaintext value is
    classified Confidential/Restricted (MP §61) and has been replaced by an
    encrypted envelope before being written to the Ledger — per ADR-002
    Option A and MVP_VERTICAL_SLICE_PLAN.md step 8's worked example
    (`TranscriptGenerated`'s payload embeds exactly these 6 fields for each
    Confidential/Restricted field it carries). Referenced, not redefined.
  $ref: "ai-lego://specs/security/personal-data-envelope.schema.yaml"

# ---------------------------------------------------------------------------
# Provisional, deliberately partial "replay to point in time" request shape.
# See compilation_decisions above for exactly what is and is not modeled.
# ---------------------------------------------------------------------------
replay_query:
  description: >
    Models only what MVP_VERTICAL_SLICE_PLAN.md step 27 / Acceptance
    Criterion 1 (L131) actually demonstrates — three timestamp-anchored
    historical points (T0 before a deletion, T1 after it, T2 after a
    prompt_version upgrade), each replaying the whole Projection, never
    narrowed to one aggregate_id in the worked example. Does NOT model a
    response/output (Projection) shape or a replay-engine mechanism — see
    open_questions.OQ-EL-2.
  type: object
  required: [as_of_timestamp]
  properties:
    tenant_id:
      $ref: "ai-lego://specs/domain/tenant.schema.yaml#/properties/tenant_id"
      description: >
        OPTIONAL scope narrowing. Every worked example in
        MVP_VERTICAL_SLICE_PLAN.md replays within one Tenant's Projection,
        but no mother document states whether a replay query must always
        be tenant-scoped — left optional rather than required.
    aggregate_id:
      type: string
      minLength: 1
      description: >
        OPTIONAL scope narrowing to a single aggregate's own stream. When
        omitted, interpreted as "replay the full Projection" per MP §57 and
        MVP step 27's own usage (neither ever narrows to one aggregate_id).
    as_of_timestamp:
      type: string
      format: date-time
      description: >
        REQUIRED — every worked T0/T1/T2 example is anchored purely by a
        moment in time ("刪除前" / "刪除完成後" / "一次 prompt_version 升級
        後"), never by a sequence number. See compilation_decisions for why
        an `as_of_sequence_number` sibling variant is NOT added despite the
        task brief's own suggestion — no worked example anywhere in this
        corpus anchors a real replay to one instead of a timestamp.

# ---------------------------------------------------------------------------
# Non-normative catalog — event_type stays an open string (see
# compilation_decisions); this documents every value with a real source in
# this corpus today, for tooling/lint convenience only.
# ---------------------------------------------------------------------------
known_event_types:

      (§5, L102-128) WAS independently re-verified faithful and folded into
      repository-contract.schema.yaml by ADR-013 Sub-decision 1.
      DeleteDerivedProjections's defining bullet (§6, L136, the ADR-002
      integration sub-section) sits inside the L132-147 span ADR-013
      Sub-decision 2 cites for tenant-isolation-controls.schema.yaml, but
      that sub-decision's own ratification prose names only 3 specific
      fields (default_isolation_model/shared_component_controls/
      object_storage_path_reuse) -- none of which is this event -- so this
      specific name has NOT itself been independently re-verified/ratified
      the way ResultPromotedToEvidence's was. Both are listed here only as
      real-world evidence the naming convention keeps extending, not as
      ADR-confirmed legal values.
    source: "docs/architecture/DATA_ARCHITECTURE_PLAN.md §5 (L109-119), §6 (L136)"
    items: [ResultPromotedToEvidence, DeleteDerivedProjections]


$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/execution/event-ledger.schema.yaml"
title: Event Ledger Envelope
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of the Event Ledger envelope — Master
  Plan §57 "Event-native Architecture" (L2546-2567): "核心狀態用 Event Ledger，
  而非只靠 CRUD" (core state lives in an Event Ledger, not plain CRUD),
  "Current State = Events 的 Projection" (L2564, Current State is a
  Projection of Events, never stored directly), and "可以 Replay 到任意歷史
  狀態" (L2566, the system MUST support replaying to an arbitrary historical
  point in time). MP §57 gives a 9-item example event-type list (verbatim,
  L2552-2562): `DocumentUploaded / TranscriptGenerated / TranscriptCorrected
  / ClaimCreated / ClaimVerified / ClaimRejected / StrategyGenerated /
  StrategyApproved / ArtifactPublished` — but never gives the envelope a
  field-level shape. Execution Contract §27 "Event / Messaging Contract"
  (L1099-1125) adds the cross-cutting invariants every event must satisfy
  (At-least-once + Idempotent Consumer + Idempotency Key + Replay-safe +
  Versioned Event Schema; Outbox/Inbox/Deduplication/Sequence-Causality/
  Compensation; and, load-bearing for this file, "Event ID 不得重用" at
  L1125 — an event_id, once used, MUST NEVER be reused). Neither mother
  document, nor any existing spec file, gives this envelope a schema — this
  file fills that gap. It is a genuinely new file: it does NOT appear in EC
  §92's 13-file `/specs/execution/` list (L2766-2783), the ONLY existing
  reference to it anywhere in this corpus (grep-confirmed, 2026-08-30) is
  `docs/architecture/MVP_VERTICAL_SLICE_PLAN.md:111`, which names
  `event-ledger.schema.yaml`（依 ADR-002 擴充加密 envelope 欄位）as a
  Required Phase-3 Spec for the Research-mode vertical slice.

  This file does NOT redefine four things that already have their own
  schemas — it references them:
  1. `specs/security/personal-data-envelope.schema.yaml` — the encryption
     envelope (`cipher_alg/kek_ref/dek_key_id/dek_wrapped/iv/ciphertext/
     classification_tag`) that a Confidential/Restricted payload field is
     replaced by before being written to the Ledger (ADR-002 Option A).
  2. `specs/domain/personal-data-redacted-event.schema.yaml` — the
     `PersonalDataRedacted` event (ADR-002 Option C), MP §57's 10th event
     type, treated here as ONE concrete example of an event TYPE that flows
     through this Ledger, not re-specified.
  3. `specs/governance/epistemic-label.schema.yaml#/provenance_record` — the
     epistemic_type/authorship_state axes, for events whose emission is
     itself worth labeling AI-generated vs. human-asserted.
  4. `specs/domain/tenant.schema.yaml#/properties/tenant_id` — the Tenant
     identity every event is scoped under (ADR-003 blast-radius boundary).

  The MVP vertical-slice walkthrough (`docs/architecture/
  MVP_VERTICAL_SLICE_PLAN.md`, Status: PROPOSED) gives the only concrete,
  field-level worked examples of this envelope anywhere in the corpus:
  step 4 ("Event Ledger 寫入 `DocumentUploaded`（×4）（MP §57；`event_id`
  不得重用，EC §27）"), step 8 ("Event 寫入 `TranscriptGenerated`，payload
  含 envelope 欄位 cipher_alg/kek_ref/dek_wrapped/iv/ciphertext/
  classification_tag"), step 25 ("寫一筆 `PersonalDataRedacted{subject_id,
  redacted_fields[], redacted_at, authorization_ref}` 稽核事件"), and step 27
  / Acceptance Criterion 1 (L131) — replaying the Projection to three
  historical points T0 (before deletion) / T1 (after deletion) / T2 (after a
  prompt_version upgrade), each anchored by a moment in TIME, never by a
  sequence number.

compilation_decisions:
  - question: >
      Should `event_type` be a closed enum (MP §57's 9 names, plus
      `PersonalDataRedacted` as the ADR-002-added 10th) or an open string?
    decision: >
      Open `type: string` with a documented PascalCase convention
      (`pattern: "^[A-Z][A-Za-z0-9]*$"`) and a non-normative
      `known_event_types` catalog below — NOT a closed enum.
    reasoning: >
      MP §57 introduces its 9-item list with "例如" (for example) — the
      mother document itself signals non-exhaustiveness. Real precedent for
      growth beyond MP §57's own list already exists in this corpus:
      ADR-002 Option C adds `PersonalDataRedacted` as an explicit 10th entry
      (Consequences item 5), and `docs/architecture/DATA_ARCHITECTURE_PLAN.md`
      §5 (L109-119) adds `ResultPromotedToEvidence`, explicitly stating its
      naming "沿用 MP §57 既有 XCreated/XVerified 事件命名慣例" (follows MP
      §57's existing naming CONVENTION) — proof that new event types are
      added over time by following a naming pattern, not by extending a
      closed list. This is the same shape of problem `execution/
      gate.schema.yaml` already solved for `gate_id` via its
      `gate_catalog.method_specific` block ("intentionally open-ended, not
      enumerated here" for Atlas §22.3's per-method gate namespace) — a
      documented catalog for tooling/lint, not a schema-level enum that
      would reject every future addition.
  - question: >
      What should the two fields be named that identify "which aggregate
      this event belongs to" and "this event's position within that
      aggregate's stream" — the task brief suggested `stream_id`/
      `aggregate_id` and `sequence_number`?
    decision: "`aggregate_id` + `sequence` (bare, not `sequence_number`)."
    reasoning: >
      `docs/architecture/DATA_ARCHITECTURE_PLAN.md` §3 (L64-72, Status:
      PROPOSED) gives the ONLY concrete mechanism anywhere in this corpus
      for these two fields: "每個 Domain Model aggregate root（Claim/
      Evidence/Decision 等）的「版本」= 該 aggregate 已套用的 event 數。寫入
      時 `INSERT INTO events (aggregate_id, sequence, ...) ... ON CONFLICT
      (aggregate_id, sequence) DO NOTHING`" (L68) — and this EXACT mechanism,
      with these EXACT field names, was independently re-verified faithful
      and folded into `specs/domain/repository-contract.schema.yaml`'s
      `consistency_concurrency_strategy.aggregate_optimistic_concurrency`
      by `docs/adr/ADR-013-batch-ratification-of-proposed-document-
      transcriptions.md` Sub-decision 1 (ACCEPTED 2026-08-30, covering
      DATA_ARCHITECTURE_PLAN.md §1-5 verbatim, §3 explicitly named at
      L64-72). Inventing a second name (`stream_id`/`sequence_number`) for
      the identical two fields a sibling schema already names would create
      exactly the kind of "same concept, two vocabularies" drift this whole
      corpus exists to eliminate (see epistemic-label.schema.yaml's own
      four-vocabulary story). See `decided_by` below for the precise scope
      of what ADR-013 does and does NOT authorize about reusing this naming
      here.
  - question: "Is `sequence` monotonic per-aggregate (a stream) or globally across the whole Ledger?"
    decision: "Per-aggregate (per-stream)."
    reasoning: >
      DATA_ARCHITECTURE_PLAN.md:68's own UNIQUE constraint is the COMPOSITE
      key `(aggregate_id, sequence)`, not `sequence` alone — this is only a
      meaningful concurrency guard if `sequence` restarts (or is at least
      independently scoped) per aggregate; a single global counter would
      make the composite key redundant with `sequence` by itself. This
      directly answers the task brief's own explicit open question
      ("whether sequence_number is per-stream or global") from grounded
      source material rather than leaving it a coin flip.
  - question: >
      How should `payload` (the event-type-specific data) relate to
      `specs/domain/personal-data-redacted-event.schema.yaml`, given the
      task instruction to "$ref it as a possible event payload shape"
      without redefining it or inventing a full discriminated union across
      all 12 known event types (only one of which — PersonalDataRedacted —
      has a field-level schema anywhere in this corpus)?
    decision: >
      `payload` stays a fully open `type: object` for every event_type,
      EXCEPT one mechanically-enforced `if`/`then` override: when
      `event_type == PersonalDataRedacted`, `payload` MUST validate against
      `specs/domain/personal-data-redacted-event.schema.yaml` in full
      (a hard `$ref`, no fields re-declared here).
    reasoning: >
      This makes the "$ref it as a payload shape" instruction real and
      testable for the one case where real grounding exists, while being
      honest that DocumentUploaded/TranscriptGenerated/ClaimCreated/etc.
      have NO field-level schema anywhere in the mother documents or this
      corpus to enforce against — inventing one here would be scope creep
      disguised as thoroughness (the same trap `gate.schema.yaml`'s own
      compilation_decisions explicitly named and avoided for `evidence[]`).
      One accepted side effect: `personal-data-redacted-event.schema.yaml`
      was authored as a self-sufficient event record with its OWN
      `event_type` const baked in (it has no `event_id`/`occurred_at`/
      `tenant_id` of its own — it was designed as payload-shaped content,
      not as a full top-level envelope instance), so nesting it under
      `payload` means `payload.event_type` redundantly re-states the outer
      `event.event_type` value. Both consts agree (`PersonalDataRedacted`)
      by construction of the `if` condition, so this is harmless
      duplication, not a conflict — fixing the redundancy would mean
      editing that sibling file, which is out of this file's scope (it must
      not be redefined, per task instruction).
  - question: >
      Should `tenant_id` (→ `domain/tenant.schema.yaml`) and the optional
      authorship-labeling field (→ `governance/epistemic-label.schema.yaml
      #/provenance_record`) be hard `$ref`s or soft references-by-name?
      `specs/domain/personal-data-redacted-event.schema.yaml` — the most
      recent sibling to face this identical choice for these SAME two
      target files — chose soft references for both.
    decision: >
      Hard `$ref` for both: `tenant_id` → `ai-lego://specs/domain/
      tenant.schema.yaml#/properties/tenant_id`; the optional `provenance`
      field → `ai-lego://specs/governance/epistemic-label.schema.yaml
      #/provenance_record`.
    reasoning: >
      Both target files are fully BUILT and `status: ACTIVE` by the time
      this file is authored (they are not concurrent same-session siblings
      the way `personal-data-redacted-event.schema.yaml` and
      `key-vault-lifecycle.schema.yaml` were to each other) — matching
      `specs/jurisdiction/context.schema.yaml`'s own precedent and stated
      reasoning for hard-referencing `tenant.schema.yaml#/properties/
      home_jurisdiction` ("already BUILT on disk... a safe backward
      reference"), and matching the task brief's own explicit instruction
      to "$ref" (not "soft-reference") both concepts. This is a reasoned,
      documented DIVERGENCE from `personal-data-redacted-event.schema.yaml`'s
      choice for the identical two target files, not an oversight — that
      file's own reasoning ("same soft-reference convention tenant.schema.
      yaml and manifest.schema.yaml both use") is a general style
      preference, not a load-bearing constraint; this corpus has real
      precedent for EITHER choice depending on build-order safety
      (soft: `security/personal-data-envelope.schema.yaml`'s `kek_ref`;
      hard: `context.schema.yaml`'s `tenant_home_jurisdiction_ref`), and
      build-order safety favors hard here.
  - question: >
      Should the optional authorship-labeling field (`provenance`) be
      `required` on every Event, given the task brief frames it as
      answering "was this event AI-generated or human-asserted?"
    decision: "OPTIONAL, not required."
    reasoning: >
      No ADR or mother-document text mandates that every Event Ledger
      record carry epistemic/authorship labeling — MP §11.3/EC §57 apply
      that labeling to content/claim objects, and an Event is a narrower,
      more mechanical concept (a fact of occurrence) than a claim. The one
      sibling file that already added this exact concept to an event type
      (`personal-data-redacted-event.schema.yaml`'s own `provenance` field)
      made the identical optional/additive choice, for the identical reason
      (a plan-declared dependency relationship, not a literal per-field ADR
      mandate) — reused verbatim, including the field NAME `provenance`,
      for cross-corpus consistency of the same concept.
  - question: >
      MVP_VERTICAL_SLICE_PLAN.md step 8 shows a Confidential/Restricted
      payload FIELD being replaced by `personal-data-envelope.schema.yaml`'s
      6 envelope fields (embedded inside that payload field's own value,
      not as a sibling of `event_id`/`occurred_at` at the envelope's own
      top level). How should this file model that, given `payload` is
      generically `type: object` with no per-event-type field list to hang
      a per-field encryption requirement off of?
    decision: >
      Add a documentation-only top-level block, `encrypted_payload_field`,
      whose sole content is `$ref: "ai-lego://specs/security/
      personal-data-envelope.schema.yaml"` — NOT wired into
      `event.properties.payload` as an enforced constraint.
    reasoning: >
      ADR-002 Consequences item 4 itself acknowledges there is no closed
      vocabulary anywhere of which event_type's payload fields carry
      Confidential/Restricted content ("MP §57 event 清單旁需標註哪些既有
      event type 含 Confidential/Restricted 分級欄位——現況零標註") — a gap
      `personal-data-redacted-event.schema.yaml`'s own `open_questions.
      MRSP-pdr-2` already surfaces. Without that vocabulary, this file
      cannot mechanically require encryption on any specific payload key
      for any specific event_type — attempting to would either be a no-op
      (validating nothing) or would silently invent the missing vocabulary,
      which is the same kind of scope creep the `payload` decision above
      already ruled out. This block instead gives a concrete, real `$ref`
      TARGET that a future per-event-type payload schema (once ADR-002
      Consequences item 4's gap is closed) can point at, instead of
      re-declaring `personal-data-envelope.schema.yaml`'s 6 fields itself —
      satisfying the task's "reference them, do NOT redefine" instruction
      even though this file has no single fixed property to hang the $ref
      off of.
  - question: >
      How far should `replay_query` (a request shape for "replay to point
      in time") be modeled, given MP §57 states the CAPABILITY in one bare
      sentence and no mother document specifies a request/response shape?
    decision: >
      Model only what `MVP_VERTICAL_SLICE_PLAN.md` step 27 / Acceptance
      Criterion 1 (L131) actually demonstrates: a REQUIRED `as_of_timestamp`
      plus OPTIONAL `tenant_id`/`aggregate_id` scope-narrowing. Do NOT model
      an `as_of_sequence_number` sibling, a response/output (Projection)
      shape, or a replay-engine mechanism.
    reasoning: >
      Every one of the walkthrough's three worked replay points (T0 = before
      deletion, T1 = after deletion, T2 = after a prompt_version upgrade) is
      anchored by a moment in TIME, never by a sequence number — there is no
      grounded worked example anywhere in this corpus of a
      sequence-number-anchored replay to justify adding that variant
      speculatively. The walkthrough also never narrows its own replay to a
      single `aggregate_id` (it replays "the Projection" as a whole each
      time) — scope granularity beyond that is therefore left to
      `open_questions` per the task brief's own explicit permission ("if
      the source material doesn't give you enough concrete detail... leave
      it as a documented open_questions entry... rather than inventing
      detailed replay-engine semantics that no mother document actually
      specifies").
  - question: >
      `event_id` must be "globally unique, never reused" (EC §27, L1125) —
      what type/format should it carry, and how should the never-reuse
      invariant be recorded given JSON Schema cannot check uniqueness
      across separate validated instances?
    decision: >
      Opaque `type: string, minLength: 1`, no assumed UUID/prefix format;
      the never-reuse invariant is recorded as a `constraints` entry
      describing exactly what this file can and cannot mechanically check.
    reasoning: >
      Same "no mother document commits to a concrete identity scheme"
      reasoning `personal-data-redacted-event.schema.yaml` used for
      `subject_id` — EC §27 states the INVARIANT (never reused) but no
      concrete format (unlike `manifest.schema.yaml`'s execution_id, which
      Atlas/EC's own machine blocks concretely prefix `EX-`). Global
      uniqueness across every event ever emitted is a write-path/database
      invariant (the same class of thing DATA_ARCHITECTURE_PLAN.md:68's
      `(aggregate_id, sequence)` UNIQUE constraint enforces for a DIFFERENT,
      narrower pair of fields) — this schema states the rule honestly as
      unenforceable-here rather than gesturing at a `pattern` that would
      falsely imply structural enforcement.
  - question: >
      This file defines multiple named top-level blocks (`event`,
      `replay_query`, `encrypted_payload_field`, `known_event_types`) rather
      than putting the Event envelope's own `type: object`/`properties`
      directly at file root (the pattern `tenant.schema.yaml`/`manifest.
      schema.yaml`/`personal-data-envelope.schema.yaml`/`personal-data-
      redacted-event.schema.yaml` all use). Per this corpus's own
      established convention (`epistemic-label.schema.yaml`'s Codex-review
      fix, finding #1: "a validator pointed at this file's ROOT... has no
      type constraint and would accept any value"), what should this file's
      bare root look like?
    decision: >
      Add an explicit root `$ref: "#/event"`, mirroring `epistemic-label.
      schema.yaml`'s own fix exactly.
    reasoning: >
      `execution/gate.schema.yaml` faces the identical multi-block shape
      (`gate_result`/`trigger_context`/`gate_catalog`) and does NOT carry
      this fix — its own fixture deliberately targets `#/gate_result`
      rather than bare root, sidestepping rather than closing the gap. This
      file instead follows the corpus's more recent, explicitly
      Codex-reviewed precedent (`epistemic-label.schema.yaml`) rather than
      repeating gate.schema.yaml's unfixed shape, since the task brief
      itself calls out root-level validity as "this corpus's established
      pattern" to honor.


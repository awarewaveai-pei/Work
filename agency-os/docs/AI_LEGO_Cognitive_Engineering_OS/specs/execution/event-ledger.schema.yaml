open_questions:
  - id: "OQ-EL-1"
    question: >
      EC §27's "Event ID 不得重用" (L1125) is a global-uniqueness invariant
      this schema can only document, never mechanically check (JSON Schema
      validates one instance in isolation). Non-blocking — the same honest
      limitation applies to the (aggregate_id, sequence) pair (see
      `constraints`).
    owner: "implementation team, at write-path/database-constraint design time"
    blocks: "nothing in this schema's own validity"
  - id: "OQ-EL-2"
    question: >
      `replay_query`'s scope granularity (single-aggregate vs. whole-tenant
      vs. whole-Ledger) and its response/output shape (a "Projection" — MP
      §57's own term, never itself given a schema anywhere in this corpus)
      are both left undecided — no mother document specifies either, and
      MVP_VERTICAL_SLICE_PLAN.md's own worked example never narrows scope.
      Per the task brief's own explicit permission, left open rather than
      inventing replay-engine semantics no source material grounds.
    owner: "operator or a future Wave, once a Projection schema exists"
    blocks: "nothing in this file's own validity; blocks building a real replay ENGINE against this request shape"
  - id: "OQ-EL-3"
    question: >
      `sequence`'s starting index (0 or 1) is unspecified by
      DATA_ARCHITECTURE_PLAN.md:68 — its own worked example only shows the
      UNIQUE-constraint mechanism, not a concrete starting value.
    owner: "operator, non-blocking"
    blocks: "nothing"
  - id: "OQ-EL-4"
    question: >
      Which specific payload KEYS of which specific event_type require the
      `encrypted_payload_field` treatment remains undocumented corpus-wide
      — ADR-002 Consequences item 4's own acknowledged gap ("MP §57 event
      清單旁需標註哪些既有 event type 含 Confidential/Restricted 分級欄位—
      —現況零標註"), already separately flagged by
      `personal-data-redacted-event.schema.yaml`'s own
      `open_questions.MRSP-pdr-2`. This file inherits and surfaces the same
      pre-existing gap; it does not introduce a new one.
    owner: "operator, via a future documentation PROPOSAL against MP §57 (ADR-006 process) that annotates each event type's PII-bearing fields"
    blocks: "mechanical enforcement of per-field encryption on payload; does not block this schema's own structural validity"
  - id: "OQ-EL-5"
    question: >
      MVP_VERTICAL_SLICE_PLAN.md's own walkthrough uses informal narrative
      tenant identifiers ("TEN-NORDBROOK", "TEN-CASCADIA") that do NOT
      conform to `tenant.schema.yaml#/properties/tenant_id`'s `format: uuid`
      constraint. This file's own `examples` above use real UUIDs instead,
      treating the walkthrough's identifiers as narrative shorthand, not
      literal field values — flagged here so a future reader does not
      mistake the walkthrough's prose IDs for this schema's expected format.
    owner: "operator, non-blocking (a documentation-only discrepancy in a Status: PROPOSED planning document, not a schema defect)"
    blocks: "nothing in this schema"

verification:
  method: >
    Read MP §57 (L2540-2568) and EC §27 (L1095-1129) in full at the cited
    lines, confirming both the 9-item event-type list and the "Event ID 不得
    重用" citation independently (the latter specifically because the task
    that commissioned this file flagged it as NOT independently re-verified
    when `MVP_VERTICAL_SLICE_PLAN.md:58` first cited it — confirmed CORRECT:
    EC §27 spans L1099-1125, "Event ID 不得重用" is the section's own closing
    line at L1125, verbatim). Read
    `docs/adr/ADR-002-personal-data-erasure-vs-event-immutability.md` Option
    A/C sections and Consequences items 4-5 in full. Read
    `docs/architecture/MVP_VERTICAL_SLICE_PLAN.md` §0-§5 in full (walkthrough
    steps 1-28, Required Phase-3 Specs list at L101-123, Acceptance Criteria
    at L127-136), confirming step numbers 4/8/25/27 and the L111 citation of
    this exact filename. Read `docs/architecture/DATA_ARCHITECTURE_PLAN.md`
    §3 (L62-72) and the ADR-002/003/005 integration section (§6, L130-147)
    in full. Read `docs/adr/ADR-013-batch-ratification-of-proposed-document-
    transcriptions.md` in full (Decision Drivers, Sub-decisions 1-2) to
    determine the precise scope of what it does and does not authorize about
    reusing DATA_ARCHITECTURE_PLAN.md-sourced field names in a file ADR-013
    itself never names. Read `specs/domain/repository-contract.schema.yaml`
    #/consistency_concurrency_strategy and #/storage_engine_assignment in
    full to confirm the exact field names (`aggregate_id`, `sequence`)
    already ratified there. Read `specs/security/personal-data-envelope.
    schema.yaml`, `specs/domain/personal-data-redacted-event.schema.yaml`,
    `specs/governance/epistemic-label.schema.yaml`, and `specs/domain/
    tenant.schema.yaml` in full — all four $ref targets, confirmed their
    exact `$id`/fragment paths by direct read rather than by assumption.
    Grep-confirmed (2026-08-30) that "event-ledger" appears in exactly one
    place anywhere in this corpus outside this file itself:
    `docs/architecture/MVP_VERTICAL_SLICE_PLAN.md:111`.
  note: >
    No mother document, ADR, or existing spec/policy file's normative
    content was modified to produce this file. MP §57's 9-item list and EC
    §27's invariants are transcribed verbatim. The `aggregate_id`/`sequence`
    field names are reused verbatim from `repository-contract.schema.yaml`
    (itself an ADR-013-ratified transcription of a Status: PROPOSED
    document) rather than re-derived independently — see `decided_by` for
    the honest scope limit on what that reuse is and is not authorized by.
    All four cross-file `$ref` targets (`personal-data-envelope.schema.yaml`,
    `personal-data-redacted-event.schema.yaml`, `epistemic-label.schema.yaml
    #/provenance_record`, `tenant.schema.yaml#/properties/tenant_id`) point
    at already-built, `status: ACTIVE` files — none of their content is
    redefined here.

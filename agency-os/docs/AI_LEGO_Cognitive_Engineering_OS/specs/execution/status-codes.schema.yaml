$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/execution/status-codes.schema.yaml"
title: Blocking / Escalation Status Codes
version: "1.0.0"
status: ACTIVE

description: >
  Canonical registry of every named blocking/escalation machine-readable status
  code scattered across the three mother documents, plus their mapping onto the
  Execution Contract §10 Execution State Machine's 7 legal side states and §70
  Final Status vocabulary. Resolves: (1) CROSS-R-4 / CROSS-T-5 — Master Plan and
  Execution Contract each mandate a DIFFERENT status code
  (PLANNING_BLOCKED_METHOD_ATLAS_REQUIRED vs METHOD_RESOLUTION_BLOCKED) for the
  IDENTICAL failure condition (Method Atlas unreadable/unloadable while method
  selection is needed) — this file resolves it as a genuine duplicate, not two
  distinct signals; (2) DOC-execution_contract-9 — the Execution Contract emits
  9 named blocking/escalation signals but never maps any of them onto its own
  §10 side-state vocabulary, and no §92 schema was designated to carry them —
  this file is that designated schema and supplies the missing mapping;
  (3) DOC-execution_contract-3 — `NEEDS_REVIEW` (EC §61 L2082) is used as if it
  were a status value but is not declared in any enum; this file resolves it as
  an informal shorthand for the canonical NEEDS_HUMAN_REVIEW, not a 10th signal.
  This file is the single source of truth; the mother documents reference it,
  they do not redefine these codes.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md §0.0 (L45-49, PLANNING_BLOCKED_METHOD_ATLAS_REQUIRED — deprecated alias)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §3.1 (L169-185, DOCUMENT_RESOLUTION_BLOCKED)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §2 (L131-137, CONFLICT_REQUIRES_HUMAN_REVIEW)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §10 (L531-577, Execution State Machine + 7 legal side states)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §11 (L579-638, CURRENT_STATE_DRIFT_DETECTED)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §14 (L700-728, METHOD_RESOLUTION_BLOCKED — canonical)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §17 (L786-814, SCOPE_CHANGE_REQUIRED)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §41 (L1539-1584, LEGAL_REVIEW_REQUIRED)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §61 (L2064-2085, NEEDS_REVIEW — undeclared, resolved as alias)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §70 (L2297-2318, Final Status vocabulary)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §78 (L2492-2508, PREEXISTING_WORKTREE_CHANGES)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §83 (L2588-2606, OFFLINE_SOURCE_STALE)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §84 (L2608-2627, BUDGET_REVIEW_REQUIRED)"
  - "docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §4 (L304, PLANNING_BLOCKED_METHOD_CONTRACT_REQUIRED — new proposal)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md §0.0.2 (L83, CONFLICT_REQUIRES_HUMAN_REVIEW — second, matching appearance)"

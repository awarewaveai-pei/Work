open_questions:
  - id: "OQ-STATUS-1"
    question: >
      Should any of the 9 EC signals mapped here to NEEDS_HUMAN_REVIEW or
      BLOCKED (a many-to-one collapse onto 7 generic side-states) instead
      become first-class named side-states in their own right in a future EC
      revision, so downstream monitors/tests can distinguish e.g. a legal-review
      pause from a budget-review pause without inspecting a separate signal
      field? This is a genuine granularity trade-off (precision vs. state-machine
      surface area), not a factual compilation question — left for Round 2 ADR
      or operator decision, not decided here.
  - id: "OQ-STATUS-2"
    question: >
      PLANNING_BLOCKED_METHOD_CONTRACT_REQUIRED (NEW_PROPOSED) uses the
      "PLANNING_BLOCKED_" naming family (MP-style), while this file just
      deprecated that same prefix on METHOD_RESOLUTION_BLOCKED in favor of
      EC's "<Domain>_RESOLUTION_BLOCKED"/"<Domain>_BLOCKED" family for
      structural consistency with the §10 state machine. Should the new code
      be renamed to something like METHOD_CONTRACT_RESOLUTION_BLOCKED for
      naming-family consistency before it is ever emitted by real code? Left
      open rather than decided, since MACHINE_READABLE_SPEC_PLAN.md §4
      specified the exact string PLANNING_BLOCKED_METHOD_CONTRACT_REQUIRED and
      renaming it is outside this file's compilation mandate.
  - id: "OQ-STATUS-3"
    new_finding: true
    question: >
      NOT one of the 4 findings this file was assigned to resolve — surfaced
      during this session's broader grep sweep (`_BLOCKED`/`_REQUIRED`/
      `_REVIEW`/`_DETECTED` across all 3 mother documents) and not present in
      any Phase 0/1 register as of this writing (checked: verified-findings.yaml,
      GAP_REGISTER.yaml P1-GAP-LEGAL-1/3/4/7, DUPLICATION_REGISTER.yaml,
      CONFLICT_REGISTER.yaml — none cover it; Phase 0's terminology-map.yaml
      L184-187/552-560/609-612 and policy-inventory.yaml L231/815/853 recorded
      both enums' existence but did not flag them as conflicting with each
      other). Master Plan defines TWO different, non-matching legal-uncertainty
      status vocabularies in two different sections: §98 Conflict-of-Laws
      Engine (L4198-4206) outputs one of
      `RESOLVED / CONSERVATIVE_SAFE_MODE / AMBIGUOUS / CONFLICT / LEGAL_REVIEW_REQUIRED`
      (5 values), while §134 "Legal Uncertainty Is a First-class State"
      (L5262-5271) outputs one of
      `KNOWN / INTERPRETATION_REQUIRED / AMBIGUOUS / CONFLICTING / STALE / UNKNOWN`
      (6 values). They share only `AMBIGUOUS` verbatim; `CONFLICT` vs
      `CONFLICTING` is a casing/form drift on what looks like the same concept;
      neither document cross-references the other section; and it is unclear
      whether §134's vocabulary is meant to be evaluated BEFORE §98 narrows
      down to the Conflict-of-Laws Engine specifically, or whether the two are
      independent, competing designs for the same "how certain is this legal
      answer" question. This file's registry above only captures the one leaf
      value (`LEGAL_REVIEW_REQUIRED`) that happens to be shared verbatim
      between MP §98 and EC §41 — it does NOT attempt to reconcile the two
      enclosing MP enums against each other, since that is a duplication
      analysis of a scope and depth (which enum is authoritative, how §98 and
      §134 relate procedurally) that goes beyond this file's compilation
      mandate and belongs in a DUPLICATION_REGISTER.yaml addendum / Round 2 ADR
      review, analogous to P1-GAP-LEGAL-4's existing treatment of the
      Conflict-of-Laws Engine's other unresolved overlap.


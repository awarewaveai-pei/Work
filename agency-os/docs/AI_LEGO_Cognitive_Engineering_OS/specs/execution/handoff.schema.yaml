      - contains: { required: [item], properties: { item: { const: "final_status" } } }
        minContains: 1
        maxContains: 1
    description: >
      EC §71's 30-item Handoff Protocol (MANDATORY, "必須交付"). MUST contain
      exactly one entry per `checklist_entry.item` enum value — see
      `constraints`.

  receiving_authority:
    type: object
    description: >
      OPTIONAL — NEW DESIGN, not literal EC §71/§72 text. See
      compilation_decisions and open_questions.OQ-HANDOFF-2 for the full
      honesty disclosure on this field's grounding.
    properties:
      receiver_role:
        type: string
        description: >
          Free text — NOT validated against authority.schema.yaml's
          role_to_authority_mapping (that registry's entries[] is
          SKELETON_ONLY/empty by that file's own disclosure; populating a
          closed enum here would misrepresent an undecided operator question
          as settled, the same failure mode authority.schema.yaml itself
          refused to commit).
      authority_level:
        $ref: "ai-lego://specs/execution/authority.schema.yaml#/authority_level"
        description: >
          Real hard $ref — MACHINE_READABLE_SPEC_PLAN.md's own declared
          dependency for this file. The A0-A4 enum values themselves are
          grounded/non-skeleton (EC §9, L478-529); only the human-role
          mapping is skeleton.
      acknowledged:
        type: boolean
        default: false
      acknowledged_at:
        type: [string, "null"]
        format: date-time
        default: null

  provenance:
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"
    description: "OPTIONAL — see compilation_decisions."

# ---------------------------------------------------------------------------
# Docs-only hint (NOT a schema $ref — each of these is a separate on-disk
# file, not an inline object): which files[] kinds already have a real
# sibling schema to validate their own content against.
# ---------------------------------------------------------------------------
file_kind_content_shape:
  EXECUTION_RESULT_YAML: "ai-lego://specs/execution/result.schema.yaml (whole file)"
  GATE_RESULTS_YAML: "ai-lego://specs/execution/gate.schema.yaml#/gate_result (array of)"
  EVIDENCE_INDEX_YAML: "ai-lego://specs/execution/result.schema.yaml#/definitions/evidence_ref (array of)"
  EXECUTION_RESULT_MD: "Free-form Markdown, expected to follow EC §121's Execution Result Template (L3332-3396) — result.schema.yaml's own `summary` field is the machine-typed sibling of this same content."
  CHANGED_PATHS_TXT: "Plain text, one path per line — no schema, per EC §72's own literal `.txt` extension."
  TEST_RESULTS_YAML: "No sibling schema exists yet in this corpus — untyped."
  ROLLBACK_EVIDENCE_YAML: "No dedicated schema; expected to reference ai-lego://specs/execution/rollback.schema.yaml#/properties/plan_id (soft, by convention, matching that file's own established pattern for this field)."
  KNOWN_RISKS_YAML: "No sibling schema exists yet in this corpus — untyped."

constraints:
  description: >
    Cross-field rules this schema's JSON-Schema `properties` block cannot
    express structurally, recorded as prose per this project's established
    convention (e.g. epistemic-label.schema.yaml's `locked` constraints,
    result.schema.yaml's/typed-method-result.schema.yaml's own `constraints`
    blocks).
  rules:
    - "checklist[] MUST contain exactly one entry per checklist_entry.item enum value (all 30) — EC §71's own '必須交付' (MUST deliver) is unconditional, unlike EC §68/69's risk-tiered gate requirements."
    - "checklist[].note MUST be present and non-empty when checklist[].present == false (mirrors EC §69's NOT_APPLICABLE+rationale requirement, gate.schema.yaml's identical constraint, applied here to the analogous declared-not-applicable Handoff Protocol item)."
    - "files[] has no minItems and is not in required — EC §72's own header is '建議' (recommended), a textually weaker mandate than §71's; this file does not silently upgrade it to mandatory."
    - "When receiving_authority is present, authority_level SHOULD reflect the ceiling the AI itself determined this task's completed change required (EC §9's A3/A4 'authorized approval'/'explicit human authority' requirements) — this file does not mechanically verify that the recorded acknowledgement actually originated from a human distinct from the AI (EC §9 L527's own load-bearing rule); see open_questions.OQ-HANDOFF-4."

open_questions:
  - id: "OQ-HANDOFF-1"
    question: >
      Grepping "handoff" (case-insensitive) across
      `.ai/research/phase-0/verified-findings.yaml` returns 4 hits: CROSS-T-16
      (uses "handoff" colloquially for the UNRELATED Method-Resolution ->
      Method-Selection-Engine data-flow seam, already resolved by
      `method-resolution.schema.yaml` per the plan — not this file's
      concept), and 3 incidental hits inside DOC-execution_contract-8's
      discussion of the §95 module inventory missing a `replay/` directory
      (where "handoff/" appears only as one of 14 listed module names in
      that unrelated drift finding). None of the 4 target the "named at §92,
      shaped nowhere" gap this file actually addresses.
      `.ai/research/phase-1/GAP_REGISTER.yaml` returns 0 hits. This gap
      appears to have gone uncaught by Phase 0/1 analysts as its own
      numbered finding, unlike the structurally identical
      `normative-context.yaml`/`Section Registry` gap (CROSS-T-18).
    owner: "operator — informational, not a blocker"
    blocks: "nothing in this schema; recorded per R4 (claim-before-verify) so this file is not silently presented as if it resolves a finding it does not"
  - id: "OQ-HANDOFF-2"
    question: >
      Is `receiving_authority`'s link to `authority.schema.yaml` the
      operator's INTENDED reading of MACHINE_READABLE_SPEC_PLAN.md's
      dependency arrow, or was a different connection meant — e.g.
      "authority_level already computed earlier in the task (at
      change-plan/preflight time), simply carried through to the handoff
      record for audit" rather than "who received/accepted the handoff and
      at what level"? Both readings are equally consistent with one
      undisambiguated dependency arrow and no further plan text. This file
      commits to the "receiving party" reading (see compilation_decisions)
      because it is the one EC §143/§144's adjacent checklist items
      textually support, but does not foreclose the alternative.
    owner: "operator / future Round 2 ADR"
    blocks: "nothing in this schema today — receiving_authority is OPTIONAL either way"
  - id: "OQ-HANDOFF-3"
    question: >
      Should EC §72's 8 named files (or a subset — `changed-paths.txt`,
      `known-risks.yaml`, `test-results.yaml`) eventually get their OWN
      dedicated schemas rather than being generic `files[]` index entries
      with no sibling shape (see `file_kind_content_shape` above — 3 of 8
      kinds currently have no sibling schema at all)? Same class of
      follow-up as `result.schema.yaml`'s `open_questions.OQ-RESULT-1` and
      `typed-method-result.schema.yaml`'s `OQ-TMR-2`.
    owner: "operator / future Phase 3+ session"
    blocks: "nothing today — those 3 kinds stay opaque content-addressed blobs either way"
  - id: "OQ-HANDOFF-4"
    question: >
      `checklist[].present` and `receiving_authority.acknowledged` are both
      self-reported booleans — nothing in this file (or any mother document)
      mechanically verifies that a `present: true`/`acknowledged: true`
      claim corresponds to real, non-vacuous content, or that an
      acknowledgement genuinely originated from a human distinct from the
      proposing AI (EC §9 L527). Same class of limitation this project's own
      `verify-closeout-completeness` gate already documents as a known,
      accepted trust boundary (evidence-line format is checked, content
      truth is not) — flagged, not solved, since solving it is an
      implementation/tooling problem, not a schema-shape problem.
    owner: "operator / whichever tool first implements handoff assembly + acceptance"
    blocks: "nothing in this schema's validity; blocks mechanical enforcement of EC §9 L527's approval-distinctness rule until addressed"

verification:
  method: >
    Read EC §15 (L730-749), §71 (L2321-2356), §72 (L2360-2374), §92
    (L2766-2783), §143-144 (L3846-3877), §148 (L3962-3984), §149 Phase 3-4
    (L4033-4059), §150 (L4160-4181) in full at the cited lines; grepped
    "handoff"/"hand-off"/"hand off" (case-insensitive) across all three
    mother documents (EC only — MP and Atlas return zero hits, confirmed);
    grepped "handoff" across `.ai/research/phase-0/verified-findings.yaml`
    (4 hits, none targeting this gap — see OQ-HANDOFF-1) and
    `.ai/research/phase-1/GAP_REGISTER.yaml` (0 hits);
    `docs/architecture/MACHINE_READABLE_SPEC_PLAN.md` §2.2 row for this file
    (L105); `specs/execution/authority.schema.yaml` read in full (A0-A4 enum
    real/non-skeleton vs. role_to_authority_mapping SKELETON_ONLY —
    grounding for why only `authority_level`, not `receiver_role`, gets a
    hard $ref); `specs/execution/result.schema.yaml` read in full (status
    $ref target, evidence_ref definition, `summary` field precedent for why
    this file does not re-type EC §121 narrative content);
    `specs/execution/gate.schema.yaml` and `specs/execution/rollback.schema.yaml`
    read for their identity fields (`plan_id` `^RB-` pattern) and
    `gate_result` shape, used in `file_kind_content_shape`'s docs-only hints;
    `specs/execution/manifest.schema.yaml`'s `architecture.adr_refs` (untyped
    `array of string`) read as precedent for keeping this file's own
    `adr`/`evidence` checklist items as bare completeness flags rather than
    typed sub-objects; `specs/artifact/cas-path.schema.yaml` and
    `specs/execution/risk-tier.schema.yaml` read in full before writing
    hard $refs into them; `git log --oneline -15` against this project
    directory (no prior commit touches handoff.schema.yaml, confirmed no
    rework).
  note: >
    No mother document, ADR, or sibling spec file was modified to produce
    this file. Ratio honesty (per house convention): EC §71's 30-item
    checklist vocabulary, EC §72's 8-file kind enum, this file's existence,
    and its storage path are all TRANSCRIBED VERBATIM from mother-document
    text — a materially higher grounded fraction than a from-scratch gap
    like `normative-context.schema.yaml`'s CROSS-T-18 (a purpose-only
    sentence), because EC gives concrete, enumerable content here. What IS
    new design, with zero direct textual mandate: the `files[]`
    content-addressed wrapper shape, the `checklist[]` boolean-ledger
    pattern (a deliberate choice modeled on `result.schema.yaml`'s own
    established precedent for not machine-typing narrative content, not an
    arbitrary invention), and the entire `receiving_authority` block (whose
    only grounding is the plan's dependency arrow plus an inference from EC
    §9's separate approval-distinctness rule — see OQ-HANDOFF-2). Roughly:
    ~55% grounded (the 30-item checklist vocabulary + 8-file kind enum + the
    artifact's existence, storage path, and MUST/RECOMMENDED strength
    distinction, all verbatim-cited) / ~45% new design (the JSON wrapper
    shapes connecting them, and the authority-linking field, honestly
    flagged as inference rather than transcription).

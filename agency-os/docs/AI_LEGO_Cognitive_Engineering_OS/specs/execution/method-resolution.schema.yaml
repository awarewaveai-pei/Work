$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/execution/method-resolution.schema.yaml"
title: Method Resolution — Task Context to Selection Context Adapter
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of the field-mapping/adapter layer
  between `execution/task.schema.yaml`'s `task_context` and
  `AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md`'s
  `selection_context` (Atlas §10 Selector Inputs, L1071-1088) — the seam
  named by EC §14 "Method Resolution" (L700-728): "Task Context ↓ Method
  Atlas ↓ Method Selection Engine ↓ Candidate Methods ↓ Mandatory Method
  Gates ↓ Workflow Plan". Formalizes the EC §92 promise
  (`method-resolution.schema.yaml` at L2775) per
  MACHINE_READABLE_SPEC_PLAN.md §2.2 row 95.

  Resolves CROSS-T-16 (verified-findings.yaml L593-611, verdict PARTIAL, 2
  independent votes) directly: "The seam between the Execution Contract's
  Method Resolution flow and the Atlas's Method Selection Engine has no
  field mapping ... Only risk_tier and jurisdiction_context overlap — and
  risk_tier's enums conflict (CROSS-T-3). No document defines the
  transformation, so the central handoff of the whole system is
  unimplementable without invention." Both verdict_votes additionally
  corrected the "only two fields overlap" claim: `reversibility` also
  appears in both records, and `domains`/`domain` nearly match — this file
  verifies and encodes that correction directly (see `field_mapping` below,
  which independently re-derives the overlap by comparing every one of
  task.schema.yaml's 12 fields against every one of Atlas's 17
  selection_context fields, not by trusting the finding's summary alone).

  NEW DESIGN notice: Atlas's `selection_context` block gives concrete
  shape to only 4 of its 17 fields (`problem_type`'s 7-value enum,
  `risk_tier`'s already-deprecated 4-value enum, `required_rigor`'s
  4-value enum, and `stakeholders`' array-bracket `[...]` syntax — verified
  by direct re-read of L1071-1088, not assumed; `cognitive_preferences` and
  `accessibility_needs` LOOK like they might share that bracket syntax on a
  first skim but do not — see field_mapping below for the correction). The
  remaining 13 fields are bare `...` placeholders with zero type signal
  beyond their name. Per this suite's own
  discipline (`cognitive/method.schema.yaml`'s `compilation_decisions`
  explicitly rejected inventing a rich `preconditions` expression grammar
  Atlas gives no evidence of), every placeholder field below is typed with
  the loosest structurally-honest shape a plain reading of its name
  supports (string, or array-of-string when the name is plural) — not a
  semantically rich type this file cannot justify from any mother-document
  text. See `verification.note` for the grounded-vs-invented ratio.

compilation_decisions:

  - question: >
      What is the actual shape of the "field mapping" MACHINE_READABLE_SPEC_PLAN.md
      §2.2 row 95 says this file must supply?
    decision: >
      A `field_mapping` array with one entry per Atlas selection_context
      field (17 entries) PLUS a reverse `task_context_only_fields` list (the
      8 task.schema.yaml fields with no selection_context counterpart at
      all) — so the mapping is verifiably exhaustive in both directions, not
      just a list of the fields that happen to line up easily.
    reasoning: >
      CROSS-T-16's own verdict_votes disagreed with each other about how
      much overlap exists (the first vote said "only risk_tier and
      jurisdiction_context", the second corrected it to include
      reversibility and domains/domain) — the safest way to not repeat that
      undercount is to enumerate every field on both sides explicitly and
      classify each one, rather than asserting a summary count.

  - question: >
      Four mapping types recur across the 17 Atlas fields. What are they and
      what does each imply for an implementation?
    decision: >
      `DIRECT_MATCH` (identical concept, reuse task.schema.yaml's field via
      hard $ref, no transform), `NEAR_MATCH_CARDINALITY_MISMATCH` (same
      concept, incompatible shape — requires an explicit widening/narrowing
      rule, recorded per-field), `SUPPLEMENT_REQUIRED` (no task_context
      field exists at all — this file must define a NEW field, honestly
      flagged), `SUPPLEMENT_REQUIRED_VIA_EXISTING_SCHEMA` (no task_context
      field exists, but a sibling schema already canonicalizes the exact
      axis — reuse it via hard $ref instead of inventing a parallel one).
    reasoning: >
      Collapsing these into a binary "mapped / unmapped" would lose the
      distinction CROSS-T-16's own text draws between a genuine overlap
      (risk_tier, jurisdiction_context, reversibility), a near-miss that
      still needs a decision (domain cardinality), and a true gap that needs
      new design (goal_type, decision_criticality, etc.) — three materially
      different obligations for an implementer, not one.

  - question: >
      Atlas L1073's `problem_type` enum (7 values) is the one non-placeholder
      field this file must carry that has no existing sibling schema.
      MACHINE_READABLE_SPEC_PLAN.md §2.3 row 120 names a FUTURE
      `cognitive/problem-type.schema.yaml` meant to own this exact enum plus
      a §10 routing table — should this file wait for it, or inline the
      enum now?
    decision: >
      AT THE TIME (this file's original Wave 5A compilation): inline Atlas's
      7-value enum verbatim (`SUPPLEMENT_REQUIRED`, not
      `..._VIA_EXISTING_SCHEMA`); flagged in `open_questions` as a forward
      migration point once `problem-type.schema.yaml` exists. SUPERSEDED
      2026-08-29 (critic review MAJOR finding #6): that file now exists,
      `problem_type` is a real hard $ref, and `field_mapping`'s
      `mapping_type` was corrected to `SUPPLEMENT_REQUIRED_VIA_EXISTING_SCHEMA`
      to match — see `open_questions.OQ-mres-2` for the resolution record.
    reasoning: >
      HISTORICAL, describing why the ORIGINAL inline-now choice was made —
      `problem-type.schema.yaml` did not exist yet at that time.
      MACHINE_READABLE_SPEC_PLAN.md's own dependency graph (§3, L120:
      dependency = `method-resolution.schema.yaml`) made it appear DOWNSTREAM
      of this file, not upstream, so a hard $ref to it then would have been
      circular/forward and unresolvable. Atlas already gave a concrete
      7-value enum with real text (L1073) — the honest move was to use that
      real value set (not degrade it to a bare string the way the true
      zero-signal placeholders are handled) while flagging that a future
      file would supersede it, the same forward-compatibility pattern
      `cognitive/method.schema.yaml` used for its `cognitive_primitives`
      field pending `cognitive/primitive.schema.yaml`. That future file now
      exists — see `decision` above for the actual current state.

  - question: >
      Atlas L1086's `required_rigor` (4-value enum) already has a dedicated
      canonical sibling, `cognitive/rigor-level.schema.yaml` (built this same
      Phase 3 run, resolving CROSS-T-15's related 5-vs-4-value mismatch).
      MACHINE_READABLE_SPEC_PLAN.md §2.2 row 95's own dependency column for
      THIS file lists only `risk-tier.schema.yaml, cognitive/method.schema.yaml`
      — `rigor-level.schema.yaml` is not named. Reuse it anyway?
    decision: >
      Yes — `SUPPLEMENT_REQUIRED_VIA_EXISTING_SCHEMA`, hard $ref to
      `cognitive/rigor-level.schema.yaml#/rigor_mode` for the supplement
      INPUT, translated down to Atlas's native 4-value `required_rigor` for
      the resolved OUTPUT via that same file's own `required_rigor_mapping`.
    reasoning: >
      Same honesty move `cognitive/method.schema.yaml` made when it added a
      `risk_tier` field the plan's dependency column for THAT file didn't
      list either: the task instruction for this file explicitly points at
      `rigor-level.schema.yaml` as "how it already handles required_rigor as
      part of this same selection_context", and inventing a second,
      parallel 4-or-5-value rigor enum here — duplicating a real, already-
      ACCEPTED-precedent sibling file just because one plan row's dependency
      column is incomplete — would recreate exactly the kind of duplicate-
      vocabulary problem ADR-004/CROSS-T-15 exist to close. The discrepancy
      with the plan's dependency column is recorded here rather than
      silently reconciled either way, per R4.
    scope_note: >
      Reusing `rigor-level.schema.yaml`'s existing PROVISIONAL
      `deep_intelligence` → `board_grade` default (that file's own Part 2,
      still `PROVISIONAL_PENDING_OPERATOR_SIGNOFF`) means this file's own
      `required_rigor` resolution inherits that same provisional status —
      not re-litigated here, see that file's `open_questions.MRSP-rigor-1`.

  - question: >
      Atlas L1074 writes `domain: ...` (singular); task.schema.yaml's
      `domains` (per EC L367) is a plural array. Which cardinality wins in
      the resolved `selection_context.domain` output field?
    decision: >
      The resolved field is an ARRAY (`domain: array of string`), widening
      Atlas's apparent singular to match task_context's plural rather than
      narrowing task_context's array down to one value.
    reasoning: >
      Same "widen rather than silently drop data" precedent
      `manifest.schema.yaml` used when it broadened MP §69's single flat
      pin-list into EC's richer array shape (see that file's
      `compilation_decisions`, item 3) — a real task can legitimately span
      multiple domains, and Atlas's `...` placeholder gives no evidence it
      deliberately intended a single-domain constraint (unlike
      `required_rigor`'s or `problem_type`'s enums, which ARE concrete
      evidence of intent). Narrowing to one value would silently discard
      information task_context already collects; widening does not.
    scope_note: >
      This changes Atlas's OWN selection_context shape (a resolved-output
      concern), not task.schema.yaml — task.schema.yaml's `domains` field is
      untouched by this decision.

  - question: >
      Is `task_context.user_impact` a plausible source for
      `selection_context.stakeholders`, given both concern "who is
      affected"?
    decision: "No — kept as two independent SUPPLEMENT/TASK_CONTEXT_ONLY fields, not merged or derived."
    reasoning: >
      `user_impact` (EC L373) is a free-text impact description; `stakeholders`
      (Atlas L1076) is a list of parties. Answering "how are users affected"
      does not answer "who are the stakeholders" — conflating them would
      silently invent a derivation rule neither mother document states. Same
      class of explicit-rejection discipline `cognitive/method.schema.yaml`
      applied when distinguishing `quality.provenance_required` (runtime
      output provenance) from `contract_provenance` (contract-authorship
      provenance) rather than merging two adjacent-looking concepts.

  - question: >
      P1-GAP-LEGAL-7 (GAP_REGISTER.yaml L446-453): MP §26.3 (MP:1669-1685)
      lists 11 policy-analysis dimensions (Current Regulation, Proposed
      Regulation, Budget, Industrial Policy, Tax/Trade, Education Policy,
      Privacy, AI Regulation, Election Cycle, International Relations) but
      Atlas's own `selection_context` (the 17 fields this file otherwise
      mirrors exactly) has no policy field at all — two tasks with identical
      risk_tier/jurisdiction_context but wildly different regulatory
      exposure would resolve to the identical candidate method set. Does
      closing this gap belong in this file?
    decision: >
      Yes — add `policy_context` (2026-08-29) as an 18th field, sourced
      verbatim from `docs/architecture/GLOBAL_JURISDICTION_PLAN.md` §6
      (Status: PROPOSED, 2026-08-29), PLUS its derived companion
      `regulatory_exposure`. This is a DELIBERATE, disclosed departure from
      this file's own stated design ("mirrors Atlas L1071-1088's field set
      exactly, 17 fields") — see the honesty note in
      `resolved_selection_context.description` and `open_questions.OQ-mres-4`
      below. `policy_context`'s 11 sub-fields are typed exactly per §6.2's
      worked YAML example, not re-invented; `regulatory_exposure` is a
      derived enum (`none|low|moderate|high`), explicitly marked as
      "DERIVED, never hand-set" per §6.2's own comment, so it is NOT added
      to `selection_context_supplement` (hand-supplied inputs only) — only
      to `resolved_selection_context` (the resolved output).
    reasoning: >
      This is the same "seam that would otherwise silently produce wrong
      answers" class of gap CROSS-T-16 (the reason this whole file exists)
      already addresses for risk_tier/jurisdiction_context/reversibility —
      P1-GAP-LEGAL-7's own consequence text ("兩個 risk_tier 與
      jurisdiction_context 相同但監理曝險截然不同的決策，會被 Method
      Selection Engine 選出完全相同的方法組合") describes exactly the same
      failure mode this file's whole reason for existing is to close. Fixing
      it anywhere other than this exact adapter file (e.g. only in
      GLOBAL_JURISDICTION_PLAN.md prose) would leave the machine-readable
      seam broken even though the human-readable design already exists.
    scope_note: >
      §6.4's "forcing rule" (`regulatory_exposure IN {moderate, high}` forces
      the Policy method chain's Jurisdiction step into the candidate set
      REGARDLESS of classified problem_type) is a SELECTION-ALGORITHM
      behavior over in `method_resolution_result.candidate_methods` — a
      genuinely different object, populated by an actual selection process
      this schema does not simulate. It is documented here
      (`open_questions.OQ-mres-5`) rather than encoded as an `allOf`/`if`/
      `then` constraint, because JSON Schema validates the SHAPE of a given
      instance; it cannot assert "some OTHER field in a document this
      schema doesn't describe must contain a specific candidate" — that is
      the Method Selection Engine's own runtime behavior to implement
      correctly, not a static structural constraint this file can enforce.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §10 Selector Inputs, selection_context block (L1066-1089, all 17 fields individually cited below)"
  - "docs/architecture/GLOBAL_JURISDICTION_PLAN.md §6 Policy-to-Method-Selection Mapping (L297-345) -- source of policy_context/regulatory_exposure, verbatim field shapes from §6.2's worked example (L303-322)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md §26.3 (MP:1669-1685) -- the 11 policy-analysis dimensions policy_context's sub-fields map to, per GLOBAL_JURISDICTION_PLAN.md §6.3's mapping table"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §14 Method Resolution (L700-728, flow + METHOD_RESOLUTION_BLOCKED)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md §92 Machine-readable Execution Specs list (L2766-2783, method-resolution.schema.yaml at L2775)"
  - "specs/execution/task.schema.yaml (this file's task_context input side, same Wave 5 session)"
  - "specs/execution/risk-tier.schema.yaml (hard $ref target for risk_tier)"
  - "specs/cognitive/rigor-level.schema.yaml (hard $ref target for required_rigor — see compilation_decisions for the plan-dependency-column discrepancy this introduces)"
  - "specs/cognitive/method.schema.yaml (hard $ref target for candidate_methods[].method_id, the id pattern this file's output bridges into)"
  - "specs/execution/status-codes.schema.yaml (soft reference for METHOD_RESOLUTION_BLOCKED, the failure signal for this file's own flow)"
  - "docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §2.2 row 95 (method-resolution.schema.yaml, dependency column: risk-tier, cognitive/method)"
  - ".ai/research/phase-0/verified-findings.yaml CROSS-T-16 (L593-611, both verdict_votes)"

decided_by: >
  No ADR governs this file — CROSS-T-16 is a `missing_contract` finding (an
  undefined seam, not a documented conflict between two competing existing
  designs), so there is nothing for an ADR to arbitrate between, the same
  situation `normative-context.schema.yaml`'s `decided_by` documents for
  CROSS-T-18. All field-mapping classifications, the `problem_type`
  inlining-now decision, the `required_rigor`/`rigor-level.schema.yaml` reuse
  (despite the plan's incomplete dependency column), and the domain
  cardinality widening are Phase 3 compilation decisions recorded above, not
  a separate ADR-level ruling.

# ---------------------------------------------------------------------------
# The field mapping proper — one entry per Atlas selection_context field
# (L1072-1088, 17 fields, in source order), PLUS one final 18th entry
# (policy_context, 2026-08-29) that is NOT one of Atlas's original 17 --
# see compilation_decisions' P1-GAP-LEGAL-7 entry for why it lives here
# anyway, and mapping_type NEW_FIELD_NOT_IN_ATLAS_17 below for how it is
# honestly distinguished from the 17 genuine Atlas-sourced entries.
# ---------------------------------------------------------------------------

field_mapping:

  - selection_context_field: goal_type
    task_context_field: null
    mapping_type: SUPPLEMENT_REQUIRED
    note: >
      Atlas L1072, bare placeholder. `task_context.objective` (EC L364, free
      text) MAY plausibly inform a derived goal_type, but EC/Atlas define no
      derivation rule or algorithm — until one exists, goal_type must be
      supplied explicitly via `selection_context_supplement`, not
      auto-derived from objective text.

  - selection_context_field: problem_type
    task_context_field: null
    mapping_type: SUPPLEMENT_REQUIRED_VIA_EXISTING_SCHEMA
    # 2026-08-29 (critic review MAJOR finding #6, corrected by an independent
    # critic pass after the initial fix): was SUPPLEMENT_REQUIRED when this
    # field was an inline enum with no sibling schema to reuse. Now that
    # problem_type is a real hard $ref to cognitive/problem-type.schema.yaml,
    # this is exactly the case compilation_decisions above (L74-79) defines
    # SUPPLEMENT_REQUIRED_VIA_EXISTING_SCHEMA for — matches `required_rigor`'s
    # identical situation below.
    note: >
      Atlas L1073, concrete 7-value enum (diagnostic, exploratory, creative,
      strategic, causal, decision, operational). Originally inlined verbatim
      below (see compilation_decisions for why, at the time
      `cognitive/problem-type.schema.yaml` did not exist yet); upgraded
      2026-08-29 to a hard $ref to that file now that it exists — see
      open_questions.OQ-mres-2 (resolved).

  - selection_context_field: domain
    task_context_field: domains
    mapping_type: NEAR_MATCH_CARDINALITY_MISMATCH
    note: >
      Atlas L1074 singular vs. task_context.domains (EC L367) plural array.
      Resolved by widening: `resolved_selection_context.domain` below is
      typed as an array. See compilation_decisions for the widen-not-narrow
      reasoning.

  - selection_context_field: jurisdiction_context
    task_context_field: jurisdiction_context
    mapping_type: DIRECT_MATCH
    note: "Atlas L1075, identical field name to task_context (EC L371). No transform; hard $ref reuse."

  - selection_context_field: stakeholders
    task_context_field: null
    mapping_type: SUPPLEMENT_REQUIRED
    note: >
      Atlas L1076, array placeholder. Explicitly compared against and
      rejected as a match for task_context.user_impact — see
      compilation_decisions.

  - selection_context_field: risk_tier
    task_context_field: risk_tier
    mapping_type: DIRECT_MATCH
    note: >
      Atlas L1077, identical field name to task_context (EC L374). Both
      sides already point at the same canonical source
      (`execution/risk-tier.schema.yaml`) per ADR-004a — this mapping needs
      no translation, only a single shared hard $ref.

  - selection_context_field: decision_criticality
    task_context_field: null
    mapping_type: SUPPLEMENT_REQUIRED
    note: >
      Atlas L1078, bare placeholder. Structurally resembles risk_tier's own
      R0-R4 scale, but no mother document states that resemblance is
      intentional — NOT mapped onto risk-tier.schema.yaml here; kept as an
      independent free-text field. See open_questions.

  - selection_context_field: evidence_available
    task_context_field: null
    mapping_type: SUPPLEMENT_REQUIRED
    note: "Atlas L1079, bare placeholder. One of the 7 fields the task instruction names explicitly as a CROSS-T-16 gap."

  - selection_context_field: data_available
    task_context_field: null
    mapping_type: SUPPLEMENT_REQUIRED
    note: >
      Atlas L1080, bare placeholder. Confirmed missing by direct
      field-by-field comparison during this file's compilation — not one of
      the 7 fields the task instruction named explicitly, but genuinely
      absent from task_context all the same.

  - selection_context_field: uncertainty
    task_context_field: null
    mapping_type: SUPPLEMENT_REQUIRED
    note: "Atlas L1081, bare placeholder. One of the 7 fields the task instruction names explicitly as a CROSS-T-16 gap."

  - selection_context_field: reversibility
    task_context_field: reversibility
    mapping_type: DIRECT_MATCH
    note: >
      Atlas L1082, identical field name to task_context (EC L372). Atlas
      gives no enum of its own; task_context's concrete 4-value enum
      (high/medium/low/irreversible) is reused via hard $ref — same
      "adopt the side with real values" precedent execution/risk-tier.schema.yaml
      set for its own field.

  - selection_context_field: time_horizon
    task_context_field: null
    mapping_type: SUPPLEMENT_REQUIRED
    note: "Atlas L1083, bare placeholder. One of the 7 fields the task instruction names explicitly as a CROSS-T-16 gap."

  - selection_context_field: budget
    task_context_field: null
    mapping_type: SUPPLEMENT_REQUIRED
    note: >
      Atlas L1084, bare placeholder. Confirmed missing by direct comparison;
      not one of the 7 explicitly-named fields but genuinely absent.

  - selection_context_field: time_budget
    task_context_field: null
    mapping_type: SUPPLEMENT_REQUIRED
    note: >
      Atlas L1085, bare placeholder. Confirmed missing by direct comparison;
      not one of the 7 explicitly-named fields but genuinely absent.

  - selection_context_field: required_rigor
    task_context_field: null
    mapping_type: SUPPLEMENT_REQUIRED_VIA_EXISTING_SCHEMA
    note: >
      Atlas L1086, concrete 4-value enum, already canonicalized (and
      extended to 5 values) by `cognitive/rigor-level.schema.yaml`. One of
      the 7 fields the task instruction names explicitly. See
      compilation_decisions for the reuse-despite-incomplete-plan-column
      reasoning.

  - selection_context_field: cognitive_preferences
    task_context_field: null
    mapping_type: SUPPLEMENT_REQUIRED
    note: >
      Atlas L1087, bare `...` placeholder (NOT bracket syntax — verified by
      direct re-read; unlike stakeholders at L1076, which does use `[...]`).
      Typed as an array below on the plural field-name signal alone, per
      this file's top-level description's naming rule. Confirmed missing
      from task_context by direct comparison; not one of the 7
      explicitly-named fields but genuinely absent.

  - selection_context_field: accessibility_needs
    task_context_field: null
    mapping_type: SUPPLEMENT_REQUIRED
    note: >
      Atlas L1088, bare `...` placeholder (NOT bracket syntax — same
      correction as cognitive_preferences above). Typed as an array below on
      the plural field-name signal alone. Confirmed missing from
      task_context by direct comparison; not one of the 7 explicitly-named
      fields but genuinely absent.

  - selection_context_field: policy_context
    task_context_field: null
    mapping_type: NEW_FIELD_NOT_IN_ATLAS_17
    note: >
      2026-08-29, closes P1-GAP-LEGAL-7. Not one of Atlas's 17
      selection_context fields at all (Atlas L1066-1089 has no policy field)
      — added per GLOBAL_JURISDICTION_PLAN.md §6.2 (Status: PROPOSED). See
      compilation_decisions above for the full disclosure of why this
      deviates from "one entry per Atlas field". Its companion derived
      field, `regulatory_exposure`, appears only in `resolved_selection_context`
      (never in `selection_context_supplement` — it is computed, not
      hand-supplied, per §6.2's own "DERIVED, never hand-set" comment) and
      so has no field_mapping entry of its own here.

# ---------------------------------------------------------------------------
# Reverse direction — task_context fields with NO selection_context
# counterpart at all, so the mapping above is verifiably exhaustive in both
# directions (see compilation_decisions, item 1)
# ---------------------------------------------------------------------------
task_context_only_fields:
  - field: task_id
    note: "Task identity, not a method-selection input."
  - field: objective
    note: "See goal_type's field_mapping entry above for the considered-but-rejected derivation path."
  - field: requester
    note: "Task-lifecycle metadata, not a method-selection input."
  - field: environment
    note: "Deployment/execution environment, not a method-selection input."
  - field: affected_modules
    note: "Task-lifecycle metadata, not a method-selection input."
  - field: data_impact
    note: "Task-lifecycle metadata, not a method-selection input. See task.schema.yaml's own open_questions for its risk_tier correlation caveat."
  - field: external_side_effects
    note: "Task-lifecycle metadata, not a method-selection input."
  - field: user_impact
    note: "See stakeholders' field_mapping entry above for the considered-but-rejected match."

# ---------------------------------------------------------------------------
# The supplement — NEW fields (per field_mapping's SUPPLEMENT_REQUIRED*
# entries) that must be provided in addition to task_context to fully
# populate selection_context. This is the literal "補齊...等 EC task_context
# 缺失欄位" MACHINE_READABLE_SPEC_PLAN.md §2.2 row 95 calls for.
# ---------------------------------------------------------------------------

selection_context_supplement:
  type: object
  description: >
    Every field here corresponds to a SUPPLEMENT_REQUIRED* entry in
    field_mapping above. None of these fields exist anywhere in
    task.schema.yaml — see verification.note for the honest
    grounded-vs-invented ratio behind their types.
  properties:
    goal_type:
      type: string
      description: "NEW DESIGN. Atlas L1072 gives zero shape signal beyond the name."
    problem_type:
      $ref: "ai-lego://specs/cognitive/problem-type.schema.yaml#/problem_type"
      description: >
        2026-08-29 (critic review MAJOR finding #6): upgraded from Atlas
        L1073's inline 7-value enum to a real hard $ref now that
        cognitive/problem-type.schema.yaml exists (it did not when this
        file was first compiled — see open_questions.OQ-mres-2, resolved).
        The target's 13-value enum is a strict superset (adds
        incident/policy/architecture/security/db_migration/market_entry;
        keeps all 7 original values, unchanged spelling) — this widens
        what validates here, it does not narrow or rename anything a
        caller may already depend on.
    stakeholders:
      type: array
      items: { type: string }
      description: "NEW DESIGN. Atlas L1076 gives array-bracket syntax only; item shape invented as bare strings."
    decision_criticality:
      type: string
      description: "NEW DESIGN. Atlas L1078 gives zero shape signal beyond the name. See open_questions on the risk_tier-scale resemblance."
    evidence_available:
      type: string
      description: "NEW DESIGN. Atlas L1079 gives zero shape signal beyond the name — kept as free text rather than an invented boolean/enum."
    data_available:
      type: string
      description: "NEW DESIGN. Atlas L1080 gives zero shape signal beyond the name — kept as free text rather than an invented boolean/enum."
    uncertainty:
      type: string
      description: "NEW DESIGN. Atlas L1081 gives zero shape signal beyond the name."
    time_horizon:
      type: string
      description: "NEW DESIGN. Atlas L1083 gives zero shape signal beyond the name."
    budget:
      type: string
      description: "NEW DESIGN. Atlas L1084 gives zero shape signal beyond the name — kept as free text rather than an invented currency/number type with no stated unit."
    time_budget:
      type: string
      description: "NEW DESIGN. Atlas L1085 gives zero shape signal beyond the name — kept as free text rather than an invented duration type with no stated unit."
    required_rigor:
      $ref: "ai-lego://specs/cognitive/rigor-level.schema.yaml#/rigor_mode"
      description: >
        Real hard $ref, 5-value canonical input. Translated down to Atlas's
        native 4-value `required_rigor` for `resolved_selection_context`
        below via rigor-level.schema.yaml's own `required_rigor_mapping`
        (inherits that file's PROVISIONAL deep_intelligence default).
    cognitive_preferences:
      type: array
      items: { type: string }
      description: "NEW DESIGN. Atlas L1087 is a bare `...` placeholder (no bracket syntax); array type invented from the plural field name alone, item shape invented as bare strings."
    accessibility_needs:
      type: array
      items: { type: string }
      description: "NEW DESIGN. Atlas L1088 is a bare `...` placeholder (no bracket syntax); array type invented from the plural field name alone, item shape invented as bare strings."
    policy_context:
      $ref: "#/policy_context"
      description: >
        NOT one of Atlas's original 17 selection_context fields — added
        2026-08-29 per GLOBAL_JURISDICTION_PLAN.md §6 (Status: PROPOSED),
        closing P1-GAP-LEGAL-7. See compilation_decisions above. Optional:
        absence means no policy-analysis signal was supplied, which
        `regulatory_exposure`'s derivation (resolved_selection_context)
        treats as `none`.

# ---------------------------------------------------------------------------
# policy_context's own shape -- verbatim from GLOBAL_JURISDICTION_PLAN.md
# §6.2's worked YAML example (L303-322), field-for-field
# ---------------------------------------------------------------------------

policy_context:
  type: object
  description: >
    GLOBAL_JURISDICTION_PLAN.md §6.2, all 11 fields transcribed verbatim.
    §6.3's mapping table (L324-337) documents which MP §26.3 policy-analysis
    dimension each field answers and what selection effect it has -- that
    mapping is documentation of INTENT, not a structural constraint this
    schema enforces (see compilation_decisions scope_note on the forcing
    rule for why).
  properties:
    current_regulation_refs:
      type: array
      items: { type: string, pattern: "^LAW-" }
      description: "§6.3: feeds Stage 0 jurisdiction resolution; forces the Policy problem-type's Jurisdiction step into the candidate set."
    proposed_regulation_refs:
      type: array
      items: { type: string, pattern: "^LAW-" }
      description: "§6.3: forces Scenario Planning to model pre/post-enactment branches."
    budget_context:
      type: object
      properties:
        available: { type: [number, "null"] }
        source: { type: [string, "null"] }
        cycle: { type: [string, "null"] }
      description: "§6.3: adjusts MCDA / cost-benefit criteria weighting."
    industrial_policy_tags:
      type: array
      items: { type: string }
      description: "§6.3: routes to the matching MP §107 Sector Compliance Pack."
    tax_exposure:
      type: object
      required: [present]
      properties:
        present: { type: boolean }
        refs: { type: array, items: { type: string } }
      description: "§6.3: feeds Cross-Border/Trade module inputs (Tax half)."
    trade_exposure:
      type: object
      required: [present]
      properties:
        present: { type: boolean }
        refs: { type: array, items: { type: string } }
      description: "§6.3: feeds Cross-Border/Trade module inputs (Trade half)."
    sector_policy_refs:
      type: array
      items: { type: string }
      description: "§6.3: routes to applicable §107/§108 sector pack (generalizes the 'Education Policy' dimension to any sector)."
    privacy_exposure:
      type: object
      required: [present]
      properties:
        present: { type: boolean }
      description: "§6.3: cross-checked against jurisdiction_context."
    ai_regulation_exposure:
      type: array
      items: { type: string, pattern: "^LAW-" }
      description: "§6.3: runs MP §105 Classification upstream of Method Selection."
    election_cycle_window:
      type: object
      properties:
        start: { type: [string, "null"], format: date }
        end: { type: [string, "null"], format: date }
      description: "§6.3: raises decision_criticality; mandates Scenario Planning."
    geopolitical_refs:
      type: array
      items: { type: string }
      description: "§6.3: feeds Cross-Border Data Transfer Engine + Compliance-aware AI Router."

# ---------------------------------------------------------------------------
# The actual adapter input contract: task_context + supplement together
# ---------------------------------------------------------------------------

method_resolution_request:
  type: object
  required: [task_context, selection_context_supplement]
  description: >
    What an implementation of EC §14's "Task Context ↓ Method Atlas" step
    must assemble before Method Selection can run.
  properties:
    task_context:
      $ref: "ai-lego://specs/execution/task.schema.yaml"
      description: "Real hard $ref — this file's declared Wave 5 sibling, same session."
    selection_context_supplement:
      $ref: "#/selection_context_supplement"

# ---------------------------------------------------------------------------
# The resolved output: the actual selection_context object handed to
# Atlas's Method Selection Engine, built by applying field_mapping to a
# method_resolution_request
# ---------------------------------------------------------------------------

resolved_selection_context:
  type: object
  description: >
    Mirrors Atlas L1071-1088's 17 original fields exactly, same order, each
    typed per field_mapping's classification above -- PLUS two 2026-08-29
    additions NOT part of Atlas's original 17: `policy_context` (hand-
    supplied, closes P1-GAP-LEGAL-7) and its derived companion
    `regulatory_exposure`. See compilation_decisions' P1-GAP-LEGAL-7 entry
    for the full disclosure of this departure from the original "exactly 17"
    design.
  required:
    - goal_type
    - problem_type
    - domain
    - jurisdiction_context
    - risk_tier
    - reversibility
    - required_rigor
    - regulatory_exposure
  properties:
    goal_type: { type: string, description: "From selection_context_supplement.goal_type (SUPPLEMENT_REQUIRED)." }
    problem_type: { $ref: "ai-lego://specs/cognitive/problem-type.schema.yaml#/problem_type", description: "From selection_context_supplement.problem_type (SUPPLEMENT_REQUIRED). 2026-08-29: upgraded to hard $ref (critic review MAJOR finding #6) — see selection_context_supplement.problem_type's description for the full migration note." }
    domain:
      type: array
      items: { type: string }
      description: "From task_context.domains, WIDENED to array — see compilation_decisions (domain cardinality)."
    jurisdiction_context:
      $ref: "ai-lego://specs/execution/task.schema.yaml#/properties/jurisdiction_context"
      description: "Direct copy from task_context.jurisdiction_context (DIRECT_MATCH)."
    stakeholders: { type: array, items: { type: string }, description: "From selection_context_supplement.stakeholders (SUPPLEMENT_REQUIRED)." }
    risk_tier:
      $ref: "ai-lego://specs/execution/risk-tier.schema.yaml#/risk_tier"
      description: "Direct copy from task_context.risk_tier (DIRECT_MATCH, shared canonical source)."
    decision_criticality: { type: string, description: "From selection_context_supplement.decision_criticality (SUPPLEMENT_REQUIRED)." }
    evidence_available: { type: string, description: "From selection_context_supplement.evidence_available (SUPPLEMENT_REQUIRED)." }
    data_available: { type: string, description: "From selection_context_supplement.data_available (SUPPLEMENT_REQUIRED)." }
    uncertainty: { type: string, description: "From selection_context_supplement.uncertainty (SUPPLEMENT_REQUIRED)." }
    reversibility:
      $ref: "ai-lego://specs/execution/task.schema.yaml#/properties/reversibility"
      description: "Direct copy from task_context.reversibility (DIRECT_MATCH, EC's concrete enum wins over Atlas's placeholder)."
    time_horizon: { type: string, description: "From selection_context_supplement.time_horizon (SUPPLEMENT_REQUIRED)." }
    budget: { type: string, description: "From selection_context_supplement.budget (SUPPLEMENT_REQUIRED)." }
    time_budget: { type: string, description: "From selection_context_supplement.time_budget (SUPPLEMENT_REQUIRED)." }
    required_rigor:
      type: string
      enum: [fast, professional, research_grade, board_grade]
      description: >
        Atlas's own native 4-value enum (L1086) — the translated-down form
        of selection_context_supplement.required_rigor (5-value rigor_mode),
        via cognitive/rigor-level.schema.yaml's required_rigor_mapping.
        Inherits that file's PROVISIONAL deep_intelligence->board_grade
        default.
    cognitive_preferences: { type: array, items: { type: string }, description: "From selection_context_supplement.cognitive_preferences (SUPPLEMENT_REQUIRED)." }
    accessibility_needs: { type: array, items: { type: string }, description: "From selection_context_supplement.accessibility_needs (SUPPLEMENT_REQUIRED)." }
    policy_context:
      $ref: "#/policy_context"
      description: "From selection_context_supplement.policy_context (optional, NEW_FIELD_NOT_IN_ATLAS_17). Absent when the task has no policy-analysis signal."
    regulatory_exposure:
      type: string
      enum: [none, low, moderate, high]
      description: >
        GLOBAL_JURISDICTION_PLAN.md §6.2: "DERIVED, never hand-set" -- never
        present in selection_context_supplement, computed from
        policy_context's populated fields (the plan does not specify the
        exact derivation algorithm beyond the enum values themselves and
        the §6.4 forcing rule's consumption of it; see
        open_questions.OQ-mres-6 for that honest gap -- CORRECTED 2026-08-30,
        real `/codex-review` HIGH finding: this description previously
        pointed here at OQ-mres-5, which is a genuinely different, narrower
        question about whether a future ENGINE correctly applies §6.4's
        forcing rule once given a value -- it does not cover the more
        upstream question this note is actually about, which is how that
        value gets computed in the first place. OQ-mres-6 is the new,
        correctly-scoped open question for that gap). MUST be explicit `none`
        when policy_context is absent entirely -- 2026-08-30 (real
        /codex-review end-to-end test, MEDIUM finding): this field was
        originally optional, which let a resolved_selection_context with a
        populated policy_context still omit regulatory_exposure entirely,
        silently defeating §6.4's forcing rule for any consumer that only
        checks for the field's presence rather than re-deriving it. Now in
        `resolved_selection_context.required` -- every resolved output must
        state its regulatory exposure, never leave it to an out-of-band
        convention. **This makes OQ-mres-6's gap more consequential, not
        less**: every producer must now supply a value with no canonical
        algorithm to compute it correctly, guaranteeing divergent
        implementations will disagree on borderline cases rather than one
        of them simply omitting the field.

# ---------------------------------------------------------------------------
# The output side of EC §14's flow: Candidate Methods, bridging to
# cognitive/method.schema.yaml, plus the failure signal
# ---------------------------------------------------------------------------

method_resolution_result:
  type: object
  required: [candidate_methods]
  description: "Per EC §14's flow: selection_context ↓ Candidate Methods ↓ Mandatory Method Gates ↓ Workflow Plan (L711-717). This file stops at Candidate Methods; gate/workflow shapes are gate.schema.yaml's and cognitive/recipe.schema.yaml's own concerns."
  properties:
    candidate_methods:
      type: array
      items:
        type: object
        required: [method_id]
        properties:
          method_id:
            $ref: "ai-lego://specs/cognitive/method.schema.yaml#/properties/id"
            description: >
              Real hard $ref to method.schema.yaml's own `id` pattern
              (bare `<family>.<name>`, ADR-005b) — method.schema.yaml is
              Wave 3 (already BUILT), a safe backward dependency.
          score: { type: [number, "null"], description: "NEW DESIGN. No mother document defines a scoring mechanism; optional, untyped beyond number." }
          rationale: { type: string, description: "NEW DESIGN. Free text." }
    blocked:
      type: [object, "null"]
      default: null
      description: >
        Set instead of a populated candidate_methods list when Method Atlas
        cannot be loaded. Soft reference (not a hard $ref — status-codes.schema.yaml
        entries are not individually anchored) to
        execution/status-codes.schema.yaml's `METHOD_RESOLUTION_BLOCKED`
        entry, per EC §14 L720-724 verbatim ("Atlas 無法載入：
        METHOD_RESOLUTION_BLOCKED").
      properties:
        status: { type: string, const: "METHOD_RESOLUTION_BLOCKED" }
        reason: { type: string }

open_questions:
  - id: "OQ-mres-1"
    question: >
      `decision_criticality` (selection_context_supplement) structurally
      resembles execution/risk-tier.schema.yaml's R0-R4 scale, but no mother
      document states they are the same axis, and mapping them would be a
      real semantic decision (does "criticality" always track "risk"? — not
      obviously, e.g. a high-criticality but fully reversible decision).
      Kept as an independent free-text field rather than unified with
      risk_tier. Left open for a future ADR if unification is ever desired.
    owner: "operator, via a future ADR"
    blocks: "nothing in this schema"
  - id: "OQ-mres-2"
    status: RESOLVED
    question: >
      `problem_type`'s enum is currently inlined verbatim from Atlas L1073
      rather than $ref'd to `cognitive/problem-type.schema.yaml`, which does
      not exist yet (MACHINE_READABLE_SPEC_PLAN.md §2.3 row 120 lists it
      READY, depending on THIS file). Once that file is built, this file's
      `problem_type` fields (in both `selection_context_supplement` and
      `resolved_selection_context`) should migrate from an inline enum to a
      hard $ref, mirroring the soft->hard upgrade pattern already applied
      elsewhere in this suite. Not done here because the target does not
      exist yet.
    resolution: >
      2026-08-29 (critic review MAJOR finding #6): `cognitive/problem-type.schema.yaml`
      was built in a later Wave 5B session; both `problem_type` fields in
      this file now use a real hard $ref to it (`#/problem_type`, a
      13-value superset of the original 7). See this file's own
      compilation_decisions for the original inline-now reasoning, still
      accurate as a historical record of why it was inlined at the time.
    owner: "N/A — resolved 2026-08-29, no further action needed"
    blocks: "nothing; the migration this question tracked is complete"
  - id: "OQ-mres-3"
    question: >
      This file's `required_rigor` reuse of `cognitive/rigor-level.schema.yaml`
      inherits that file's own still-open `MRSP-rigor-1` question (whether
      `deep_intelligence` should become a native 5th Atlas enum value rather
      than a `board_grade` + additive-dimensions default). Not re-litigated
      here — resolving it belongs to rigor-level.schema.yaml's own
      open_questions, but any change there will change what
      `resolved_selection_context.required_rigor` can express.
    owner: "see cognitive/rigor-level.schema.yaml open_questions.MRSP-rigor-1"
    blocks: "nothing in this schema directly; downstream of the cited open question"
  - id: "OQ-mres-4"
    question: >
      RESOLVED 2026-08-30 by docs/adr/ADR-013-batch-ratification-of-
      proposed-document-transcriptions.md Sub-decision 5: the
      `policy_context`/`regulatory_exposure` transcription from
      `docs/architecture/GLOBAL_JURISDICTION_PLAN.md` §6 is confirmed
      faithful (all 11 policy_context sub-fields, and regulatory_exposure's
      correct placement as a resolved-side-only sibling field, both
      re-verified against §6.2's worked example). Original question
      (preserved): "`policy_context`/`regulatory_exposure` are transcribed
      from `docs/architecture/GLOBAL_JURISDICTION_PLAN.md` §6, a `Status:
      PROPOSED` document, not a dedicated ACCEPTED ADR -- same provenance
      class as `specs/domain/repository-contract.schema.yaml`'s
      OQ-REPOCONTRACT-1..."
    owner: "closed"
    blocks: "nothing — resolved"
  - id: "OQ-mres-5"
    question: >
      §6.4's forcing rule (`regulatory_exposure IN {moderate, high}` forces
      the Policy method chain's Jurisdiction step into
      `method_resolution_result.candidate_methods` regardless of classified
      `problem_type`) is documented in this file's `policy_context`
      description and compilation_decisions, but not encoded as a
      schema-level constraint -- see compilation_decisions' scope_note for
      why (it is a cross-object selection-algorithm behavior, not a
      same-object shape constraint JSON Schema can express). Should a future
      Wave add a conformance TEST (not a schema constraint) that exercises
      an actual Method Selection Engine implementation against this rule?
    owner: "operator, or a future Phase 4/5 implementation session once a Method Selection Engine exists to test"
    blocks: "nothing in this file's own validity -- this is a test-coverage gap in a not-yet-built consumer, not a schema defect"
    partial_resolution: >
      2026-08-30 (real /codex-review end-to-end test, MEDIUM finding): the
      narrower half of this question -- "can a resolved output silently omit
      regulatory_exposure and thereby skip the forcing rule by omission,
      independent of whether the rule itself is schema-enforced" -- is now
      closed: `regulatory_exposure` moved into `resolved_selection_context`'s
      `required` list, so every resolved output must state an explicit value
      (including `none`). The broader question above (whether the ENGINE
      actually applies the forcing rule correctly given that value) remains
      open, unchanged. See the NEW, separate OQ-mres-6 for the even more
      upstream question this entry does not cover: how the value itself gets
      computed in the first place.
  - id: "OQ-mres-6"
    new_finding: true
    question: >
      Real `/codex-review` HIGH finding (2026-08-30, on the ADR-013 batch
      commit -- flagged via this task's explicit "does this change depend
      on something not visible in the diff" focus check, not a regression
      introduced by that diff itself). `regulatory_exposure` is `DERIVED,
      never hand-set` per GLOBAL_JURISDICTION_PLAN.md §6.2's own comment,
      and is now REQUIRED on every `resolved_selection_context` (see this
      field's own description and OQ-mres-5's `partial_resolution`). But
      neither GLOBAL_JURISDICTION_PLAN.md §6 (read in full again to confirm
      -- §6.1-6.4 contain no derivation table) nor this schema defines HOW
      to compute it from `policy_context`'s 11 populated sub-fields. §6.3's
      mapping table maps each dimension to its DOWNSTREAM EFFECT on method
      selection, not to a formula or decision table for
      `regulatory_exposure`'s own value. Concretely: two independent
      producers can both satisfy this schema while disagreeing on whether
      the same `policy_context` (e.g. `tax_exposure.present: true` alone,
      with everything else absent) should resolve to `low` or `moderate` --
      nothing here or in the source plan says which. Making the field
      REQUIRED (the 2026-08-30 fix above) closed the "silently omitted"
      failure mode but did not address this deeper one -- every producer
      must now supply a value, with no shared algorithm ensuring they agree
      on what that value should be, which can make §6.4's forcing rule
      fail open (a regulatory-sensitive request classified as `low` by one
      implementation and `moderate` by another) in exactly the compliance-
      sensitive scenario this whole mechanism exists to protect.
    owner: >
      operator, or a future Round 3 ADR -- deriving a concrete
      policy_context -> regulatory_exposure decision table is a genuine
      legal/policy judgment call (which combinations of tax/trade/AI-
      regulation/election-cycle signals count as "moderate" vs "high"
      exposure), not a Phase 3 schema-compilation pick Claude should
      invent unilaterally -- same class of judgment this project already
      reserves for the operator elsewhere (e.g. Zero Trust/Supply Chain
      vendor selection, docs/architecture/ZERO_TRUST_SUPPLY_CHAIN_
      SELECTION_PLAN.md).
    blocks: >
      Nothing in this schema's own structural validity today (the enum and
      required-ness are both correctly enforced). It DOES mean any current
      or future implementation's `regulatory_exposure` values are NOT
      guaranteed consistent across producers until a canonical derivation
      spec exists -- flagged here so this is a known, disclosed gap rather
      than an implicit assumption of correctness.

verification:
  method: >
    Read against Atlas §10 full Selector Inputs block (L1066-1104, including
    the mermaid flow, not just the selection_context YAML in isolation), EC
    §14 full text (L700-728), EC §92 (L2766-2783), execution/task.schema.yaml
    full text (built earlier in this same session), execution/risk-tier.schema.yaml
    full text, cognitive/rigor-level.schema.yaml full text (for
    required_rigor reuse and its PROVISIONAL default), cognitive/method.schema.yaml
    full text (for the id pattern $ref), execution/status-codes.schema.yaml
    full text (for the METHOD_RESOLUTION_BLOCKED entry), manifest.schema.yaml
    full text (for the widen-not-narrow precedent cited in domain
    cardinality), MACHINE_READABLE_SPEC_PLAN.md §2.2 row 95 and §2.3 row 120,
    and verified-findings.yaml CROSS-T-16 full entry (L593-611, both
    verdict_votes independently re-checked against a fresh field-by-field
    comparison rather than trusted at face value — see field_mapping and
    task_context_only_fields above, which together cover all 12
    task.schema.yaml fields x all 17 Atlas selection_context fields).
    2026-08-29 addition: read docs/architecture/GLOBAL_JURISDICTION_PLAN.md
    §6 (L297-345) directly at the cited lines, transcribing §6.2's worked
    policy_context YAML example field-for-field; cross-checked P1-GAP-LEGAL-7
    in GAP_REGISTER.yaml (L446-453) to confirm the gap this addition closes
    matches the plan document's own stated purpose.
  note: >
    No mother document was modified to produce this file. Grounded-vs-
    invented ratio: `problem_type`'s enum (Atlas's original 7 values,
    directly grounded in mother-document text; now surfaced via a hard $ref
    to `cognitive/problem-type.schema.yaml`'s 13-value superset as of
    2026-08-29 — the 6 added values are that file's own grounding, not
    invented here) and `required_rigor`'s axis (via rigor-level.schema.yaml
    reuse) are directly grounded in mother-document text; the
    DIRECT_MATCH/NEAR_MATCH classifications for
    jurisdiction_context/risk_tier/reversibility/domain are verified by
    direct field-name comparison against both source blocks. The remaining
    11 supplement fields (goal_type, stakeholders, decision_criticality,
    evidence_available, data_available, uncertainty, time_horizon, budget,
    time_budget, cognitive_preferences, accessibility_needs) have no shape
    signal beyond their bare Atlas placeholder names — their `string`/
    `array of string` types are Phase 3 invention, honestly typed at the
    loosest structurally-defensible level rather than guessed at a richer
    one, per this suite's established discipline against fabricating schema
    detail with no textual basis.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/representation.schema.yaml"
title: Cognitive Representation / View Contract
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of LEGO dimension H ("Representation"
  — Atlas §3 L147: "怎麼呈現給不同腦袋？ — Text / Table / Mind Map / Graph /
  Audio"). Atlas Appendix A (L4580) lists `representation.schema.yaml` as a
  promised spec but defines no schema fields for it anywhere in the document
  — unlike Lens, Representation has no single formal "Contract" YAML block;
  instead the concept is described consistently across five separate
  sections (§9's Representation Contract sketch, §11.55 Representation
  Switching, §15's View flowchart, F24's tool table, and §17's engineering
  path taxonomy) that all agree on the same underlying model: one Knowledge
  Object rendered through interchangeable, non-duplicating Views. This file
  reverse-engineers the View object shape from that convergent evidence —
  this is new design (Phase 3 compilation), not a duplicate-definition
  merge, per MACHINE_READABLE_SPEC_PLAN.md §2.3's method-execution-request.schema.yaml
  precedent ("無既有內容可沿用，需要新設計，非重複定義修正").

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §2 總體架構 diagram, R[Representation] node (L108, L118)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §3 八個正交 LEGO 維度, row H (L147)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §6 Soft Cognitive Preference, cognitive_preference.representation weights (L261-268 — related but DISTINCT concept, see compilation_decisions)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §9 LEGO Contract, Representation Contract sketch + View-state invariant (L1049-1062)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §11.55 多視圖切換／認知呈現切換 Representation Switching (L2486-2508)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §13 Recipe Library, '改 Representation' as a user-editable Recipe action (L3222)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §15 Representation：不同人的腦袋可以用不同視圖 (L3638-3712)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F24 方法工具庫 table (L968-981)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §17 確切工程路徑, /cognitive/representations/ 11-category taxonomy (L3916-3927)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §25 開發優先順序, Phase 0 item 5 'Representation Contract' (L4302)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §26 預期結果與驗收標準, 'View 切換不重算 Knowledge' row (L4410)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §29 方法搭配基本規則, rule 9 (L4546, 'Representation 可換，但 Knowledge 不複製')"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md Appendix A (L4580, representation.schema.yaml listed)"

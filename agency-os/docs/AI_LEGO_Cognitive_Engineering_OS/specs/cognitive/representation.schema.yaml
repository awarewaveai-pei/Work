  - {name: "Outline View", category: outline, evidence: [{line: 973, quote: "Text / Outline View", note: "Prose combines Text+Outline into one row; §17 engineering path splits them into two folders — this file follows the finer split. See compilation_decisions."}]}
  - {name: "Table View", category: table, evidence: [{line: 974, quote: "Table / Matrix View"}, {line: 3645, quote: "K --> TB[Table View]"}]}
  - {name: "Matrix View", category: matrix, evidence: [{line: 974, quote: "Table / Matrix View", note: "Same split-row treatment as Text/Outline."}]}
  - {name: "Mind Map View", category: mindmap, evidence: [{line: 975, quote: "Mind Map View"}, {line: 3646, quote: "K --> MM[Mind Map View]"}]}
  - {name: "Concept Graph View", category: conceptmap, evidence: [{line: 976, quote: "Concept Graph View"}, {line: 3647, quote: "K --> CG[Concept Graph View]"}]}
  - {name: "Timeline View", category: timeline, evidence: [{line: 977, quote: "Timeline View"}, {line: 3648, quote: "K --> TL[Timeline View]"}]}
  - {name: "Causal View", category: causal, evidence: [{line: 978, quote: "Causal View"}, {line: 3649, quote: "K --> CV[Causal View]"}, {line: 2497, quote: "Causal Diagram"}]}
  - {name: "Audio / Conversational View", category: audio, evidence: [{line: 979, quote: "Audio / Conversational View"}, {line: 3650, quote: "K --> AU[Audio View]"}, {line: 2499, quote: "Audio"}]}
  - {name: "Canvas", category: canvas, evidence: [{line: 2498, quote: "Canvas", note: "Named only in §11.55's Representation Switching list; no dedicated View row in F24 or §15's mermaid diagram."}]}

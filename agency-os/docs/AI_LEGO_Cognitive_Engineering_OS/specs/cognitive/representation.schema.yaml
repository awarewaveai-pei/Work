decided_by: >
  No ADR governs this file. docs/architecture/MACHINE_READABLE_SPEC_PLAN.md
  §2.3 row for representation.schema.yaml lists it READY with no ADR
  dependency and no assigned finding (both columns "—"), described only as
  "Atlas Appendix A 既有承諾". Verified by grep across docs/adr/ADR-001~009
  (2026-08-29): zero hits for "representation" in any ADR. Every field below
  is a direct Phase 3 compilation choice, recorded in `compilation_decisions`,
  following the same pattern lens.schema.yaml and status-codes.schema.yaml
  use for their own ADR-free sections.

# ---------------------------------------------------------------------------
# Schema body
# ---------------------------------------------------------------------------

definitions:

  representation_category:
    description: >
      Transcribed verbatim from Atlas §17's /cognitive/representations/
      engineering path (L3916-3927) — the only place Atlas enumerates a
      closed, machine-oriented set of Representation categories. Chosen as
      canonical over the prose View lists (§9, §11.55, §15, F24) because
      those four lists are mutually near-identical but not byte-identical
      (see `compilation_decisions` for the reconciliation), and this is the
      only one of the five sources structured as a flat enumerable list
      rather than embedded prose/mermaid nodes.
    type: string
    enum:
      - text
      - outline
      - table
      - matrix
      - mindmap
      - conceptmap
      - timeline
      - causal
      - graph
      - canvas
      - audio

  view_state:
    description: >
      Atlas §9 L1062 verbatim: "View 只保存 `layout / filters /
      visible_fields / presentation_preferences`，不得複製 Knowledge 本體。"
      These are the ONLY four fields Atlas names for what a View instance is
      permitted to persist — this file transcribes them as-is rather than
      inventing a richer state shape, per the task's explicit instruction not
      to add fields with no textual anchor.
    type: object
    properties:
      layout: { type: object, description: "Atlas L1062. No further internal structure specified anywhere in the corpus — left as an open object. See open_questions." }
      filters: { type: object, description: "Atlas L1062. No further internal structure specified anywhere in the corpus — left as an open object. See open_questions." }
      visible_fields:
        type: array
        items: { type: string }
        description: "Atlas L1062. Typed as a string array (field names) since 'visible_fields' most naturally reads as a list of which Knowledge Object fields this View renders."
      presentation_preferences: { type: object, description: "Atlas L1062. No further internal structure specified anywhere in the corpus — left as an open object. See open_questions." }

representation:
  description: >
    A single Representation (View) instance as a typed object — LEGO
    dimension H's controlled contract shape. Synthesized from the five
    convergent sections cited in source_of_truth_for; field provenance is
    noted per property below since (unlike lens.schema.yaml's single
    example) no one block gives the full shape at once.
  type: object
  required: [id, category, knowledge_ref, state]
  properties:
    id:
      type: string
      description: >
        No ID grammar is specified anywhere in Atlas for a Representation
        instance (unlike Method's ADR-005b-decided `<family>.<name>` or
        Lens's mirrored version — see lens.schema.yaml). Left as an open
        string rather than inventing a pattern with zero textual anchor. See
        `compilation_decisions`.
    category:
      $ref: "#/definitions/representation_category"
    knowledge_ref:
      type: string
      description: >
        Atlas §9 L1052 ('Knowledge Object' as the tree root every View hangs
        off of) and §15.1's identical mermaid structure (L3644, 'K[Knowledge
        Object]' as the single parent of every View node). Points at the
        underlying Knowledge Object this View renders — untyped reference
        (bare string ID) for the same Wave-ordering reason lens.schema.yaml's
        `requires`/`output` are bare strings: no dependency on the
        typed-objects/ subfolder being built in parallel this same wave.
    state:
      $ref: "#/definitions/view_state"
    provenance_consistent:
      type: boolean
      default: true
      description: >
        Atlas §11.55 L2506 ('Provenance 保持一致') and §26 acceptance row
        (L4410, view switching must not recompute Knowledge). Boolean flag
        recording that this View was produced by a pure re-render (no
        re-ingestion / re-computation of the underlying Knowledge Object) —
        the mechanical, checkable form of the invariant in rule 9 (L4546).

# ---------------------------------------------------------------------------
# Non-normative catalog: named Views actually used in Atlas prose, cross-
# mapped onto the canonical representation_category enum (for traceability
# only — the enum above, not this table, is what `category` validates
# against)
# ---------------------------------------------------------------------------

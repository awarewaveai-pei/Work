# ---------------------------------------------------------------------------
# Adjacent but explicitly out-of-scope: interaction modes named alongside
# View types in the F24 table, and the separate cognitive-preference concept
# ---------------------------------------------------------------------------
related_but_out_of_scope:
  - note: >
      F24's tool table (L968-981) lists "Guided Mode" and "Expert LEGO Mode"
      in the same table as the View rows (Text/Outline, Table/Matrix, Mind
      Map, Concept Graph, Timeline, Causal, Audio/Conversational). Both are
      INTERACTION modes (how the user is walked through method selection —
      §11.56/§11.57 describe them as question-flow / drag-and-drop
      paradigms, not renderings of a Knowledge Object) rather than
      Representation/View instances, and neither appears in §9's
      Representation Contract, §11.55's switching list, §15's mermaid
      diagram, or §17's /representations/ folder. Excluded from
      `representation_category` on that basis — a compilation judgment call,
      see `compilation_decisions`.
  - note: >
      Atlas §6 (L261-268) defines a DIFFERENT "representation" concept:
      `cognitive_preference.representation` — a per-user SOFT WEIGHT vector
      (visual/text/table/spatial/audio, each 0.0-1.0) describing how strongly
      a user prefers each modality. This is a preference-scoring input to the
      Method/View Selection Engine, not a View instance itself, and uses a
      different, coarser vocabulary (5 modality weights) than this file's
      11-category `representation_category` enum. It plausibly belongs to
      profile.schema.yaml (Atlas Appendix A's "rigor/mode profile" file,
      being built in parallel this wave) rather than here — flagged, not
      merged in, to avoid colliding with that sibling file's scope.

compilation_decisions:
  - question: >
      Four sources give near-identical but non-identical View lists: F24
      table (10 rows, includes Guided/Expert LEGO Mode), §11.55's switching
      list (8 items, includes Canvas, excludes Outline/Matrix as separate
      rows), §15.1's mermaid diagram (7 nodes, no Canvas, no Outline/Matrix
      split), and §17's engineering path (11 folders, includes Graph as
      distinct from Conceptmap, includes Outline and Matrix as separate
      folders). Which is canonical for the `representation_category` enum?
    decision: "§17's engineering-path taxonomy (11 categories)."
    reasoning: >
      It is the only one of the four structured as a flat, machine-oriented
      enumeration rather than prose/mermaid narrative, and it is a strict
      superset of the concrete View names used elsewhere once Text/Outline
      and Table/Matrix are split into their finer-grained folder form — no
      information from the other three sources is lost, only Guided
      Mode/Expert LEGO Mode (interaction modes, see
      related_but_out_of_scope) and the two soft-preference-only concepts
      are excluded, each with its own disclosed reasoning.
  - question: >
      Should `representation.id` follow a `<category>.<name>` grammar
      parallel to method.schema.yaml's ADR-005b pattern or lens.schema.yaml's
      mirrored pattern?
    decision: "No — left as an open, unpatterned string."
    reasoning: >
      Unlike Lens (which has one real dotted-ID instance, `stakeholder.
      regulator`, to anchor the pattern on), Atlas gives ZERO worked examples
      of an actual Representation/View instance ID anywhere in the corpus —
      every View reference is a bare category name (Text View, Table View,
      ...), never an instantiated object with an id field. Inventing an ID
      grammar here would have no textual anchor at all (weaker evidence than
      even the primitive/lens judgment calls above), so this file declines to
      assert one and flags it as open instead.
  - question: >
      Should Guided Mode / Expert LEGO Mode be included in
      `representation_category` since Atlas's own F24 table lists them
      alongside the View rows?
    decision: "Excluded."
    reasoning: >
      Every OTHER source that discusses Representation/View switching (§9,
      §11.55, §15, §17) omits both — they only ever co-occur with View rows
      in the single F24 summary table, whose own heading conflates three
      different concepts ("Representation / Cognitive Preference /
      Collaboration", L968) into one table. Treating F24's grouping as
      authoritative would mean this schema's category enum absorbs two
      interaction-flow concepts that four other independent sections keep
      separate — the convergent evidence outweighs the one table's grouping.

open_questions:
  - id: "MRSP-representation-1"
    question: >
      §17's /graph/ folder (L3925) is never matched to a named prose View —
      only /conceptmap/ maps cleanly to "Concept Graph View". Is /graph/ a
      distinct, not-yet-named View type (e.g. a generic node-edge view
      broader than the causal/concept-specific graphs), or a redundant
      folder that should be merged with /conceptmap/? Left open — no Atlas
      text disambiguates it either way.
    owner: "operator, or whichever future session builds /representations/graph/"
    blocks: "nothing in this schema; `graph` remains a valid enum value regardless of how this resolves"
  - id: "MRSP-representation-2"
    question: >
      `view_state.layout`, `.filters`, and `.presentation_preferences` are
      left as open (unconstrained) objects because Atlas names them (L1062)
      but never defines their internal shape anywhere in the corpus. Should a
      future revision define per-category sub-shapes (e.g. a mindmap
      layout's expected keys vs. a table layout's), or is a fully generic
      object the right long-term shape given the same object must serve 11
      different category kinds?
    owner: "operator"
    blocks: "nothing — the fields validate as generic objects today"
  - id: "MRSP-representation-3"
    question: >
      Should `cognitive_preference.representation`'s 5-modality weight vector
      (Atlas §6 L261-268, see related_but_out_of_scope) be reconciled with
      this file's 11-category enum — e.g. by defining a mapping from each
      `representation_category` to the modality weight(s) it satisfies — once
      profile.schema.yaml (the file most likely to own the preference vector)
      exists? Left unresolved here since profile.schema.yaml is out of this
      file's scope and is being built by a parallel agent this same wave.
    owner: "operator, or whoever builds profile.schema.yaml"
    blocks: "nothing in this schema"

verification:
  method: >
    Read against Atlas §2 (L92-129), §3 (L134-149), §6 (L257-292), §9
    (L985-1064), §11.55 (L2486-2509), §13 (L3200-3226), §15 (L3638-3712), F24
    table (L968-984), §17 (L3861-3927), §25 (L4292-4312), §26 (L4405-4427),
    §29 (L4536-4552), Appendix A (L4574-4604); Master Plan §8.2 (L673-689);
    MACHINE_READABLE_SPEC_PLAN.md §2.3 (L116); method-inventory.yaml
    (L1079-1118, all 10 F24-category entries, all has_contract: false); a
    full-document grep of "[Rr]epresentation" across all three mother
    documents to confirm no additional structural (non-prose) usage was
    missed; docs/adr/ADR-001~009 grepped for "representation" (zero hits).
  note: >
    No mother document or ADR was modified to produce this file. The
    `representation_category` enum is a verbatim transcription of Atlas
    §17's engineering path; the `view_state` field names are a verbatim
    transcription of Atlas L1062's own field list. Every synthesis choice
    beyond direct transcription (canonical-source selection among 4
    near-duplicate View lists, exclusion of Guided/Expert LEGO Mode,
    leaving `id` unpatterned, the cognitive_preference boundary) is recorded
    above in `compilation_decisions` / `related_but_out_of_scope` /
    `open_questions` rather than asserted silently.

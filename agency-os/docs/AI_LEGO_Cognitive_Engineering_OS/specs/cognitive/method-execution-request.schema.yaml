referenced_by:
  - "cognitive/typed-method-result.schema.yaml — CONFIRMED ALREADY BUILT (discovered during this file's own bug-hunt pass, not by an earlier Wave; built concurrently this same session). MACHINE_READABLE_SPEC_PLAN.md §2.3 row 122 lists 'execution/result.schema.yaml' as ITS plan-column dependency, not this file — but it is this request's paired OUTPUT type for the same cognitive.execute_method Capability Contract, MP §8.3, and jointly closes CROSS-R-3/CROSS-T-17/DOC-master_plan-6 alongside this file. Its actual on-disk `required: [execution_id, method_id, method_version, status, evaluated_at, provenance]` was read and cross-checked against this file's own required-field choices (see compilation_decisions) rather than assumed: `method_id` required on both sides (consistent); `execution_id`/`method_version` required on the RESULT (post-hoc, always knowable once execution happened) but optional/nullable on this REQUEST (pre-dispatch, may not yet be minted/pinned) — a deliberate temporal asymmetry, not an inconsistency; `provenance` required on the RESULT (a claim-about-outcome, per epistemic-label.schema.yaml's universal mandate) but optional on this REQUEST (a directive, the same category task.schema.yaml's own provenance field sits in) — see compilation_decisions for the full reasoning."
  - "domain/capability-contract.schema.yaml — CONFIRMED BUILT (2026-08-29, the 'next round' this file's own description anticipated after being named absent during this file's original bug-hunt pass; MACHINE_READABLE_SPEC_PLAN.md §2.5 row 152 lists THIS file as its own dependency). It is the generalized Capability Contract shape that cognitive.execute_method's own MP §8.3 declaration is one instance of — that file's own `worked_example` transcribes the identical MP §8.3 literal instance this file's top-level `description` also quotes, cross-checked for consistency rather than assumed: both files independently cite `input.type: [MethodExecutionRequest]` / `output.type: [TypedMethodResult]` verbatim from MP L706-712, and neither required a change to the other."

open_questions:
  - id: "OQ-mer-1"
    question: >
      When `method_version` is omitted, how does an executor resolve which
      concrete version of `method_id` actually runs ("latest ACTIVE",
      pinned by a Recipe's own `references.cognitive_method_atlas`, or
      something else)? No mother document defines a method version
      registry or resolution algorithm — `method.schema.yaml`'s
      `open_questions.OQ-method-1` already flags an adjacent gap
      (Workflow/Recipe id versioning) without resolving it either.
    owner: "operator, via a future ADR or a Method Registry design (not yet scoped)"
    blocks: "nothing in this schema — method_version is usable today when the caller supplies it; omission is a real but separately-tracked resolution gap"
  - id: "OQ-mer-2"
    question: >
      The cross-record `inputs` legality rule (`constraints` above) cannot
      be checked by this file alone — it requires looking up the target
      `method_id`'s own `method.schema.yaml` `inputs.required`/
      `inputs.optional` at validation time. Should a future
      `compiler/method-selector/` or `compiler/compatibility/` tool (both
      named as directories-only in MP §8.5, L774-783, with no file-level
      shape defined anywhere) be the place this check actually runs?
    owner: "operator / whichever session first builds MP §8.5's compiler/compatibility/ tooling"
    blocks: "nothing in this schema; the check remains a documented, deferred obligation (constraints above), not silently assumed automatic"
  - id: "OQ-mer-3"
    question: >
      `task_context` is currently always a full embedded object (see
      `compilation_decisions`), which repeats identical task data across
      every method invocation in a many-step workflow. Should a future
      revision allow a lighter `oneOf` alternative — a pinned
      `{task_id, task_context_sha256}` reference, mirroring
      `normative-context.schema.yaml`'s own `document_index_refs` pattern
      — for high-invocation-count workflows? Not adopted here without
      evidence any real workflow's volume makes the repetition cost a
      practical problem; the task instruction for this file also asked
      specifically for "a real hard $ref," which the full-embed form
      satisfies most directly.
    owner: "operator / future Phase 3 session, if a real high-fan-out workflow surfaces this as a practical cost"
    blocks: "nothing in this schema today"
  - id: "OQ-mer-4"
    question: >
      The general optional-vs-required question for `provenance` is now
      SETTLED by cross-checking `cognitive/typed-method-result.schema.yaml`
      (see `compilation_decisions` and `referenced_by`) — not left open. A
      narrower sub-question remains genuinely open: should `provenance`
      become CONDITIONALLY required on this request when the target
      `method_id`'s own `method.schema.yaml` `risk_tier` is R3/R4,
      mirroring `execution/risk-tier.schema.yaml`'s Human Approval
      requirement for those tiers? No mother document states such a rule,
      and neither `method.schema.yaml` nor `typed-method-result.schema.yaml`
      models a risk-tier-conditional provenance requirement either —
      inventing one here would be fabrication with no textual basis, the
      same class of invention this file otherwise avoids throughout.
    owner: "operator, via a future ADR or Round 2+ Method Registry design, if R3/R4-gated methods are later found to need it"
    blocks: "nothing in this schema"

verification:
  method: >
    Read against MP §8 full text (L640-789: §8.1 Method vocabulary through
    §8.5 Method-definition-ownership rule, not just §8.3/§8.4 in
    isolation), Atlas §16.3 full text (L3821-3857), `specs/cognitive/method.schema.yaml`
    full text (for `id`/`version`/`inputs` anchors), `specs/execution/task.schema.yaml`
    full text (this session's own sibling, for the `task_context` $ref
    target and its exact 12 field names), `specs/execution/manifest.schema.yaml`
    full text (for `method_execution_log[]`'s established
    execution_id/workflow_id/block_id/inputs.hashes vocabulary this file
    reuses rather than reinvents), `specs/execution/result.schema.yaml`
    full text (for its own explicit TypedMethodResult scope-split
    precedent and its `evidence_ref`/`artifact_ref` hash-plus-inline-copy
    pattern), `specs/artifact/cas-path.schema.yaml` full text (for the
    `sha256_hash` $ref target), `specs/governance/epistemic-label.schema.yaml`
    full text (for the `provenance_record` $ref target),
    `.ai/research/phase-0/verified-findings.yaml` CROSS-R-3 (L49-75, all 3
    verdict_votes), CROSS-T-17 (L612-628), and DOC-master_plan-6
    (L942-957) full entries, and `docs/architecture/MACHINE_READABLE_SPEC_PLAN.md`
    §2.3 row 121 full text. Grep confirmed across `docs/adr/ADR-001` through
    `ADR-010`: zero hits for "MethodExecutionRequest" or
    "cognitive.execute_method" as a ruling target (ADR-005's one hit on
    the underlying `execute_method()` call is evidence for the Method `id`
    grammar question only, not a ruling on this request type). A dedicated
    bug-hunt pass (`grep -rn "method-execution-request.schema.yaml"` across
    `agency-os/`) was run AFTER drafting this file's body and BEFORE
    finalizing it, per this project's R0 four-action verification
    discipline — it surfaced a real staleness bug in this file's own
    initial draft (this file's `description`/`referenced_by` originally
    assumed `cognitive/typed-method-result.schema.yaml` was "not yet
    built," matching the plan row's literal wording, but the file was
    found to already exist on disk, built concurrently this same
    session). That file was then read in full and its `required` list
    cross-checked field-by-field against this file's own choices (see
    `compilation_decisions` and `referenced_by`) before this file was
    finalized, rather than leaving the stale assumption uncorrected.
  note: >
    No mother document, ADR, or sibling `specs/` file was modified to
    produce this file. Grounded-vs-designed ratio, following
    `normative-context.schema.yaml`'s disclosure model: roughly 15%
    grounded, 85% new design. Grounded: the type's NAME
    (`MethodExecutionRequest`), its role as `cognitive.execute_method`'s
    input (MP L708), the Capability Contract's full literal YAML (MP
    L701-729, transcribed verbatim in this file's `description`), and the
    two worked calling-signature examples (MP L742/745) establishing that
    a method_id plus a typed input payload are the irreducible minimum any
    shape must carry. Everything else — every concrete field name
    (`execution_id`, `task_context`, `workflow_id`, `block_id`, `inputs`,
    `requested_at`, `provenance`), the content-addressed
    hash-plus-inline-value shape for `inputs` (assembled from three
    separate already-built sibling files' precedents, not from any single
    mother-document statement about THIS type), the full-task_context-embed
    decision, and every `constraints`/`open_questions` entry — is Phase 3
    invention, individually justified in `compilation_decisions` above
    rather than presented as if MP or Atlas already specified it. This
    file does not, and does not attempt to, define `TypedMethodResult` —
    that remains `cognitive/typed-method-result.schema.yaml`'s job (see
    `referenced_by`).

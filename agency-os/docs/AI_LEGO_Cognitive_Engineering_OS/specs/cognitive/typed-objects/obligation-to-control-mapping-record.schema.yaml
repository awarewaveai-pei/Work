$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/obligation-to-control-mapping-record.schema.yaml"
title: Obligation-to-Control Mapping Record
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of `ObligationToControlMapping` --
  the declared `outputs` of `jurisdiction.obligation_to_control_mapping`'s
  Method Contract (methods/contracts/jurisdiction.obligation_to_control_mapping.
  contract.yaml, `outputs: [ObligationToControlMapping]`). F23 global
  jurisdiction/compliance/localization family (Atlas L937: "obligation->
  control->owner->evidence->test").

  Real invariants (RUNTIME, not all declaratively expressible here, same
  disclosed-gap class as `cross-impact-analysis.schema.yaml`'s own matrix-
  completeness precedent): (a) referential integrity -- every
  `controls[].obligation_id` resolves to a declared `obligations[]` entry
  (no orphan control); (b) OBLIGATION COVERAGE, THE real invariant this
  method exists to enforce -- every declared `obligations[]` entry is
  referenced by at least one `controls[]` entry (an obligation with zero
  controls is exactly the "法務與工程無法對接" failure Atlas L937's own
  benefit column names); (c) every control's `owner`/`evidence`/`test` is
  non-empty. `ai_lego/modules/jurisdiction/obligation_to_control_mapping.py`
  enforces all three at both construction time and independent gates.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F23 全球管轄／合規／在地化 table, Obligation-to-Control Mapping row (L937)"
  - "methods/contracts/jurisdiction.obligation_to_control_mapping.contract.yaml (outputs, preconditions, quality)"

decided_by: >
  No ADR governs this file. Direct transcription of Atlas L937's own
  5-stage pipeline plus low-risk, disclosed compilation choices (the OCM-
  prefix, record-level-only provenance, free-text test field).

compilation_decisions:
  - question: "Should a control's `test` field be a structured test-case reference, or free text describing the test procedure?"
    decision: "Free text. Atlas L937 names 'test' as a pipeline stage but gives no structured test-registry shape -- inventing one here would be an ungrounded schema, same posture challenge.red_team's severity field already takes."
  - question: "Obligation coverage (every obligation referenced by >=1 control): JSON Schema keyword, or runtime invariant?"
    decision: "Runtime invariant -- JSON Schema 2020-12 cannot cross-check that controls[] covers every obligations[] entry declaratively, same gap class as cross-impact-analysis.schema.yaml's own matrix-completeness precedent."

type: object
additionalProperties: false
required: [id, version, obligations, controls, provenance]
properties:

  id:
    type: string
    pattern: "^OCM-"
    description: "NEW DESIGN. Same id-prefix convention as every sibling record schema."

  version:
    type: string

  generated_by_method:
    type: string
    default: "jurisdiction.obligation_to_control_mapping"

  obligations:
    type: array
    minItems: 1
    description: "The legal obligations under mapping. RUNTIME invariant: >=1 required (method contract precondition) -- a mapping over zero obligations has nothing to connect to engineering."
    items:
      type: object
      additionalProperties: false
      required: [obligation_id, description]
      properties:
        obligation_id: {type: string, minLength: 1}
        description: {type: string, minLength: 1}

  controls:
    type: array
    description: "RUNTIME invariant: referential integrity (every obligation_id resolves to a declared obligations[] entry) and OBLIGATION COVERAGE (every obligation referenced by >=1 control) -- see module description."
    items:
      type: object
      additionalProperties: false
      required: [control_id, obligation_id, owner, evidence, test]
      properties:
        control_id: {type: string, minLength: 1}
        obligation_id: {type: string, minLength: 1}
        owner: {type: string, minLength: 1}
        evidence: {type: string, minLength: 1}
        test: {type: string, minLength: 1}

  provenance:
    description: "Overall record provenance -- record-level only, same convention every sibling typed-object schema in this directory uses for a single coherent mapping."
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"

examples:
  - description: "2 obligations, 1 covered by 2 controls, 1 covered by 1 control -- full coverage, no orphan control"
    value:
      id: "OCM-2026-09-12-001"
      version: "1.0.0"
      generated_by_method: "jurisdiction.obligation_to_control_mapping"
      obligations:
        - {obligation_id: "OBL-1", description: "GDPR Art.17 -- honor data subject erasure requests within 1 month"}
        - {obligation_id: "OBL-2", description: "PCI-DSS 3.2.1 -- encrypt cardholder data at rest"}
      controls:
        - {control_id: "CTRL-1", obligation_id: "OBL-1", owner: "Data Protection Steward", evidence: "erasure-request audit log", test: "monthly sample of 10 closed erasure tickets, confirm all closed within 30 days"}
        - {control_id: "CTRL-2", obligation_id: "OBL-1", owner: "Platform Eng Lead", evidence: "deletion pipeline runbook", test: "quarterly game-day: submit a synthetic erasure request, confirm end-to-end deletion"}
        - {control_id: "CTRL-3", obligation_id: "OBL-2", owner: "Security Lead", evidence: "AES-256 at-rest encryption config export", test: "annual PCI-DSS QSA audit"}
      provenance: {epistemic_type: AI_INFERENCE, authorship_state: AI_GENERATED, locked: null}

open_questions:
  - "OQ-OCMAP-1: controls[] carries no confidence/effectiveness rating for how well a control actually mitigates its obligation, only that it exists -- should a future revision add one?（owner: operator）"

verification:
  method: >
    Read Atlas F23 table, Obligation-to-Control Mapping row (L937)
    directly. Grepped `agency-os/docs/AI_LEGO_Cognitive_Engineering_OS` and
    `Projects/internal/cognitive-engineering-os` case-insensitively for
    "obligation-to-control"/"obligation to control"/"OCM-" and every schema
    title before writing -- zero pre-existing implementation or schema
    title overlap found. Validated against jsonschema Draft202012Validator
    via tests/unit/test_obligation_to_control_mapping.py.
  note: >
    No mother document was modified. The 5-stage pipeline is transcribed
    directly from Atlas L937. The OCM- prefix and runtime-invariant
    placement of obligation coverage / referential integrity are this
    file's own compiled structure, disclosed above.

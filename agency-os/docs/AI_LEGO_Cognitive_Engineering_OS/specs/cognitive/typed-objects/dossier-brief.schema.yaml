$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/dossier-brief.schema.yaml"
title: Dossier Brief
version: "1.0.0"
status: DRAFT
description: >
  Synthesis artifact for the L1 partnership-risk / due-diligence line: an
  AI-assembled background dossier on one person, company, or event, built
  from a project's Source prompt manifest (P-a, source_manifest.py). Every
  claim, related entity, and summary sentence cites manifest ids; the
  citation_integrity gate (gates.evaluate_citation_integrity) enforces the
  citations are real and non-empty before this object is treated as valid
  output. `$defs` here is the single source of truth for the fields shared
  by all three synthesis kinds (dossier_brief, decision_evidence,
  literature_matrix) -- decision-evidence-brief.schema.yaml and
  literature-matrix.schema.yaml `$ref` each field by name rather than
  repeating its shape, so the three kinds cannot drift out of sync on what
  "synthesis_id" or "summary" means. `sections[].heading` is closed to the
  fixed per-kind heading list ported verbatim from
  NA/lib/dossier/report.ts:76-80 (REPORT_SECTIONS), selected by
  `subject.kind`.
source_of_truth_for:
  - "RESEARCH_LINES_MASTER_PLAN.md §12.8 P-d (synthesis common core) and P2 WC-P2-02"
decided_by: "P2 WC-P2-02: three synthesis typed objects + DRAFT capability contracts"

$defs:
  synthesis_id:
    type: string
    pattern: "^SYN-"
  project_id:
    type: string
    minLength: 1
  language:
    type: string
    minLength: 1
  summary:
    type: object
    additionalProperties: false
    required: [text, citations]
    properties:
      text: {type: string, minLength: 1}
      citations: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
  sections:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [heading, claims]
      properties:
        heading: {type: string, minLength: 1}
        claims:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [claim_id, text, citations]
            properties:
              claim_id: {type: string, minLength: 1}
              text: {type: string, minLength: 1}
              citations: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
  gaps:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [text, needed_evidence]
      properties:
        text: {type: string, minLength: 1}
        needed_evidence: {type: string, minLength: 1}
  conflicts:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [text, citations]
      properties:
        text: {type: string, minLength: 1}
        citations: {type: array, minItems: 2, uniqueItems: true, items: {type: string, minLength: 1}}
  uncited_sections:
    type: array
    items: {type: string, minLength: 1}
  manifest_ref:
    type: object
    additionalProperties: false
    required: [sha256, count, batches]
    properties:
      sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
      count: {type: integer, minimum: 0}
      batches: {type: integer, minimum: 0}
  model:
    type: string
    minLength: 1
  usage:
    type: object
    additionalProperties: false
    required: [input_tokens, output_tokens]
    properties:
      input_tokens: {type: integer, minimum: 0}
      output_tokens: {type: integer, minimum: 0}
  provenance:
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"

type: object
additionalProperties: false
required:
  - synthesis_id
  - project_id
  - kind
  - language
  - summary
  - sections
  - gaps
  - conflicts
  - uncited_sections
  - manifest_ref
  - provenance
  - model
  - usage
  - subject
  - related_entities
properties:
  synthesis_id: {$ref: "#/$defs/synthesis_id"}
  project_id: {$ref: "#/$defs/project_id"}
  kind: {const: dossier_brief}
  language: {$ref: "#/$defs/language"}
  summary: {$ref: "#/$defs/summary"}
  sections: {$ref: "#/$defs/sections"}
  gaps: {$ref: "#/$defs/gaps"}
  conflicts: {$ref: "#/$defs/conflicts"}
  uncited_sections: {$ref: "#/$defs/uncited_sections"}
  manifest_ref: {$ref: "#/$defs/manifest_ref"}
  provenance: {$ref: "#/$defs/provenance"}
  model: {$ref: "#/$defs/model"}
  usage: {$ref: "#/$defs/usage"}
  subject:
    type: object
    additionalProperties: false
    required: [name, kind, anchors]
    properties:
      name: {type: string, minLength: 1}
      kind: {type: string, enum: [person, company, event]}
      anchors: {type: array, items: {type: string, minLength: 1}}
  related_entities:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, relation, citations]
      properties:
        name: {type: string, minLength: 1}
        relation: {type: string, minLength: 1}
        citations: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
allOf:
  # sections[].heading is closed to the per-kind table, report.ts:76-80 REPORT_SECTIONS, ported verbatim.
  - if:
      properties: {subject: {properties: {kind: {const: person}}}}
    then:
      properties:
        sections:
          items:
            properties:
              heading: {enum: ["身分與現況", "經歷時間線", "主要作品／貢獻", "公開言論立場", "關聯人物與機構", "爭議與批評"]}
  - if:
      properties: {subject: {properties: {kind: {const: company}}}}
    then:
      properties:
        sections:
          items:
            properties:
              heading: {enum: ["公司概況", "沿革時間線", "經營團隊", "財務與募資", "產品與市場", "法律與監理事件"]}
  - if:
      properties: {subject: {properties: {kind: {const: event}}}}
    then:
      properties:
        sections:
          items:
            properties:
              heading: {enum: ["事件概述", "時間線", "起因與背景", "影響與損害", "究責與處置", "各方反應"]}

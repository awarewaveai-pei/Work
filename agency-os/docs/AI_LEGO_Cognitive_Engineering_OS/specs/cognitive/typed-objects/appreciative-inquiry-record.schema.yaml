$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/appreciative-inquiry-record.schema.yaml"
title: Appreciative Inquiry Record
version: "1.0.0"
status: ACTIVE

description: >
  `AppreciativeInquiryRecord` -- output of `learning.appreciative_inquiry` (欣賞式探詢). The 4-D appreciative inquiry cycle: peak experiences, a dream, commitments, first actions. Runtime invariants beyond this
  schema live in ai_lego/modules/learning/appreciative_inquiry.py.

source_of_truth_for:
  - "methods/contracts/learning.appreciative_inquiry.contract.yaml"

decided_by: "Operator directive 2026-09-17; no ADR."

type: object
additionalProperties: false
required: [id, version, affirmative_topic, discover, dream, design, destiny, provenance]
properties:
  id: { type: string, pattern: "^AI4D-" }
  version: { type: string }
  generated_by_method: { type: string, default: "learning.appreciative_inquiry" }
  affirmative_topic: { type: string, minLength: 1 }
  discover: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
  dream: { type: string, minLength: 1 }
  design: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
  destiny: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
  provenance:
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"


examples:
  - description: "What makes a workshop session work"
    value:
      id: "AI4D-2026-09-17-001"
      version: "1.0.0"
      generated_by_method: "learning.appreciative_inquiry"
      affirmative_topic: "團體最有生命力的時刻"
      discover: ["學員自己接話的那五分鐘", "沒有人看時鐘的那堂"]
      dream: "每堂都有一段不需要我帶的時間"
      design: ["前 20 分鐘不講話", "用一張圖開場"]
      destiny: ["下週三試前 20 分鐘沉默開場"]
      provenance: { epistemic_type: HUMAN_OPINION, authorship_state: HUMAN_ORIGINAL, locked: null }

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/secrets-threat-review-record.schema.yaml"
title: Secrets Threat Review Record
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of `SecretsThreatReviewRecord` --
  the declared `outputs` of `security.secrets_threat_review`'s Method
  Contract. SIXTH typed object in the `security` family (F20), and the
  SECOND F20 member (after `security.dpia_pia`) that is NOT one of
  Execution Contract §32's own four named Threat Review methods
  (STRIDE/LINDDUN/Attack Tree/PASTA) -- this method's own trigger is
  Execution Contract §33's own "Secrets Contract" scope (forbidden secret
  locations, preferred storage mechanisms, mandatory exposure-response
  flow), a real, dedicated, SIBLING section to §32, not part of it. See the
  method contract's own `description` for the full due-diligence trail
  (Atlas F20 table row L888, Atlas §13.11 L3472-3487, this repository's own
  `docs/architecture/SECURITY_THREAT_MODEL.md`, and EC §33 L1264-1300).

  **Confirmed distinct from `specs/security/key-vault-lifecycle.schema.yaml`**
  (read in full before this file was authored): that schema models the
  internal STATE of ONE Key Vault's cryptographic key records (`key_use`
  enum EXACTLY `[KEK, DEK, HMAC_SIGNING_KEY]` -- crypto keys only), with no
  `access`/`exposure` concept of its own. This record instead walks a
  BROADER secret inventory (`secret_type` enum below covers eight kinds,
  crypto keys being only one) through a staged REVIEW with pass/fail gates
  -- genuinely additive, not a duplicate. For the one secret type both
  files touch (`crypto_key`), this record does NOT re-declare
  `key-vault-lifecycle.schema.yaml`'s own fields (algorithm,
  rotation_policy, physical_copies, status, ...) -- it carries only a soft
  pointer (`storage.entries[].key_vault_ref`) to that file's own
  `key_record.key_id`, keeping the Key Vault as the SOLE owner of crypto
  -key lifecycle detail (see the method contract's own
  `compilation_decisions` for why this is a soft reference, not a hard
  `$ref`, despite a real working `ai_lego/security/key_vault
  /local_key_vault.py` builder existing).

  Atlas's own six-word F20 table row L888 formula (`inventory → storage →
  access → rotation → exposure → revocation`) is transcribed verbatim as
  `stages`, a fixed-length-six, POSITIONALLY ORDERED tuple -- the same
  "ordered pipeline" structural class `pasta-threat-model-record.schema
  .yaml` and `dpia-pia-impact-assessment-record.schema.yaml` already
  establish (Atlas's own "→" is a real dependency chain, not a set),
  enforced via `prefixItems` exactly as those sibling schemas do.

  Because `assets`/`trust_boundaries`/`entry_points`/`test_evidence` are an
  EC §32 artifact and this method is not an EC §32 method, this record
  carries NONE of them -- the SECOND F20 typed object (after DPIA/PIA) to
  omit that triplet.

  Two invariants beyond stage completeness-and-order, BOTH grounded in EC
  §33's own real, dedicated content (a different grounding class from
  `security.pasta`/`security.dpia_pia`'s own "real EXTERNAL practice, not
  Atlas" disclosures -- this is a real IN-REPOSITORY load-bearing contract
  section, not external literature, but the same "not a bare Atlas
  citation" honesty discipline):

  1. EXPOSURE-TRIGGERS-MANDATORY-RESPONSE-FLOW, ONE-DIRECTIONAL -- for
     every `secret_id` declared in `inventory`: if it appears in ANY
     `exposure.findings` entry, the matching `revocation.entries[]`
     entry's own `response_flow.triggered` MUST be `true` and
     `flow_stage_reached` MUST NOT be `NOT_TRIGGERED`. A secret with NO
     exposure finding carries NO requirement in either direction -- EC §33
     names this flow as firing "若 secret 可能曝光" (IF a secret may be
     exposed), a MINIMUM for confirmed-exposed secrets, not an exclusive
     trigger for revocation; a secret may be legitimately, proactively
     revoked for other real reasons (departure, scheduled decommission --
     see the method contract's own illustrative example, where both
     secrets are revoked with zero exposure findings). `response_flow
     .triggered` MUST always internally agree with `flow_stage_reached`
     (true if and only if not `NOT_TRIGGERED`), independent of exposure
     status. Directly encodes EC §33's own mandatory flow: "若 secret 可能
     曝光: STOP ↓ REVOKE/ROTATE ↓ INVESTIGATE ↓ RESUME" (L1290-1300) without
     over-constraining the unexposed case beyond what that section states.
  2. CRYPTO-KEY-DEFERS-TO-KEY-VAULT -- every `storage.entries[]` entry
     whose matching `inventory` secret has `secret_type: crypto_key` MUST
     have a non-null `key_vault_ref`; every other `secret_type` MUST have
     `key_vault_ref: null`. The concrete anti-duplication mechanism: a
     crypto-key secret's OWN rotation/destruction/physical-copy detail is
     never re-modeled here, only pointed at.

  Cross-stage secret-id traceability (every `storage`/`access`/`rotation`
  /`revocation` entry corresponds to EXACTLY ONE `inventory` secret, no
  dangling or duplicate coverage) is treated as part of stage completeness
  -and-order, the same class `security.dpia_pia`'s own risk-id traceability
  is treated as part of its own stage validity, NOT a third headline
  invariant.

  This is a STRUCTURAL record (`provenance_required` + gates), NOT
  `genuine_compute` -- both headline invariants are set-membership
  /conditional-pointer derivations, the same class STRIDE/LINDDUN/DPIA-PIA's
  own real invariants already establish, not a numeric/ordinal computation
  like `attack-tree-record.schema.yaml`'s own cost/skill/detectability
  aggregation.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md:888 (F20 tool table row: 'inventory→storage→access→rotation→exposure→revocation')"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md:3472-3487 (§13.11 Security Review Recipe, 'Secret / Identity Review' at L3481)"
  - "docs/architecture/SECURITY_THREAT_MODEL.md:38,52 (this repo's own real Phase 2 Security Threat Review, honestly disclosing 'Secret / Identity Review' as an undone Phase 3 backlog item)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Execution_Contract_v1.md:1264-1300 (§33 Secrets Contract: forbidden-locations list, preferred-mechanisms list, mandatory exposure-response flow)"
  - "specs/security/key-vault-lifecycle.schema.yaml (confirmed narrower sibling object this record cross-references via storage.entries[].key_vault_ref, does not duplicate)"
  - "methods/contracts/security.secrets_threat_review.contract.yaml"

decided_by: "No ADR governs this file. Same class of decision every sibling typed-object schema in this directory documents."

$defs:

  secret_type:
    description: >
      What kind of secret this is. Eight values -- `crypto_key` is the ONE
      value `key-vault-lifecycle.schema.yaml` also touches (via the soft
      `key_vault_ref` cross-reference below); the other seven are outside
      that file's own scope entirely (its own `key_use` enum covers only
      KEK/DEK/HMAC_SIGNING_KEY, all `crypto_key` in this record's own
      vocabulary).
    type: string
    enum: [api_key, db_credential, crypto_key, oauth_token, webhook_secret, tls_certificate, ssh_key, other]

  secret_entry:
    type: object
    required: [secret_id, secret_type, owner, system_or_component]
    additionalProperties: false
    properties:
      secret_id:
        type: string
        pattern: "^SECRET-"
      secret_type: {$ref: "#/$defs/secret_type"}
      owner:
        type: string
        minLength: 1
        pattern: "\\S"
        description: "The individual, role, or team accountable for this secret's lifecycle."
      system_or_component:
        type: string
        minLength: 1
        pattern: "\\S"
        description: "The specific system or component that USES this secret -- may be narrower than the record's own top-level system_or_component (the overall reviewed scope)."

  inventory_stage:
    type: object
    required: [stage_id, secrets]
    additionalProperties: false
    properties:
      stage_id: {const: inventory}
      secrets:
        type: array
        minItems: 1
        items: {$ref: "#/$defs/secret_entry"}

  storage_mechanism:
    description: >
      EC §33's own "優先" (preferred) list, verbatim, plus OTHER as an
      explicit, justification-gated escape hatch (see storage_entry's own
      exception_justification requirement).
    type: string
    enum: [SECRET_MANAGER, OS_KEYCHAIN, SHORT_LIVED_CREDENTIAL, WORKLOAD_IDENTITY, OTHER]

  storage_entry:
    type: object
    required: [secret_id, storage_mechanism, exception_justification, key_vault_ref]
    additionalProperties: false
    properties:
      secret_id: {type: string, pattern: "^SECRET-"}
      storage_mechanism: {$ref: "#/$defs/storage_mechanism"}
      exception_justification:
        type: ["string", "null"]
        default: null
        description: >
          REQUIRED (non-null, non-empty) when storage_mechanism == OTHER --
          a disclosed deviation from EC §33's own preferred-mechanisms list,
          not a silent gap. MUST be null for any of the four preferred
          mechanisms (checked at the runtime layer -- JSON Schema alone
          cannot express this conditional on additionalProperties:false
          siblings cleanly across the enum's five branches without a heavy
          if/then per value).
      key_vault_ref:
        type: ["string", "null"]
        default: null
        minLength: 1
        description: >
          Soft reference to `key-vault-lifecycle.schema.yaml`'s own
          `key_record.key_id`. REQUIRED (non-null) when the matching
          inventory secret's own secret_type is crypto_key; MUST be null
          for every other secret_type (checked at the runtime layer, which
          alone can cross-reference the sibling inventory stage). No
          pattern constraint beyond non-empty: key-vault-lifecycle.schema
          .yaml's own key_id field defines none to reuse (real observed
          examples from ai_lego/security/key_vault/local_key_vault.py are
          "kek:<tenant_id>" / "dek:<tenant_id>:<subject_id>", but that is an
          implementation convention of ONE builder, not a schema-level
          constraint this record should bake in).

  storage_stage:
    type: object
    required: [stage_id, entries]
    additionalProperties: false
    properties:
      stage_id: {const: storage}
      entries:
        type: array
        minItems: 1
        items: {$ref: "#/$defs/storage_entry"}

  access_entry:
    type: object
    required: [secret_id, authorized_identities, last_access_review_at]
    additionalProperties: false
    properties:
      secret_id: {type: string, pattern: "^SECRET-"}
      authorized_identities:
        type: array
        minItems: 1
        items: {type: string, minLength: 1, pattern: "\\S"}
        description: "Who or what (human role, service account, workload identity) may access this secret."
      last_access_review_at: {type: string, minLength: 1, pattern: "\\S"}

  access_stage:
    type: object
    required: [stage_id, entries]
    additionalProperties: false
    properties:
      stage_id: {const: access}
      entries:
        type: array
        minItems: 1
        items: {$ref: "#/$defs/access_entry"}

  rotation_entry:
    type: object
    required: [secret_id, rotation_interval, last_rotated_at, rotation_overdue]
    additionalProperties: false
    properties:
      secret_id: {type: string, pattern: "^SECRET-"}
      rotation_interval: {type: string, minLength: 1, pattern: "\\S"}
      last_rotated_at: {type: ["string", "null"]}
      rotation_overdue:
        type: boolean
        description: "A provided snapshot value (not computed from the current clock by this record) -- a STRUCTURAL record, not genuine_compute."

  rotation_stage:
    type: object
    required: [stage_id, entries]
    additionalProperties: false
    properties:
      stage_id: {const: rotation}
      entries:
        type: array
        minItems: 1
        items: {$ref: "#/$defs/rotation_entry"}

  exposure_location:
    description: "EC §33's own forbidden-locations list (L1268-1279), transcribed verbatim, SNAKE_CASE."
    type: string
    enum: [GIT, PROMPT, CHAT_TRANSCRIPT, CLI_ARGV, LOGS, CRASH_DUMP, ARTIFACT, TEST_FIXTURE, MARKDOWN, SCREENSHOT]

  exposure_finding:
    type: object
    required: [secret_id, location, detected_at, detected_by]
    additionalProperties: false
    properties:
      secret_id: {type: string, pattern: "^SECRET-"}
      location: {$ref: "#/$defs/exposure_location"}
      detected_at: {type: string, minLength: 1, pattern: "\\S"}
      detected_by: {type: string, minLength: 1, pattern: "\\S"}

  exposure_stage:
    type: object
    required: [stage_id, findings]
    additionalProperties: false
    properties:
      stage_id: {const: exposure}
      findings:
        type: array
        default: []
        description: >
          SPARSE list of ACTUAL findings only -- unlike storage/access
          /rotation/revocation, this stage does NOT require one entry per
          declared secret. Absence from this list means "not found in a
          forbidden location", not "not reviewed" (see method contract's
          own compilation_decisions for why an exhaustive
          ten-locations-times-N-secrets "confirmed clean" enumeration is
          deliberately not required).
        items: {$ref: "#/$defs/exposure_finding"}

  response_flow:
    description: >
      Models EC §33's own mandatory, exposure-conditional flow: "若 secret
      可能曝光: STOP → REVOKE/ROTATE → INVESTIGATE → RESUME" (L1290-1300).
      `flow_stage_reached` is the FURTHEST stage reached so far, in that
      literal order.
    type: object
    required: [triggered, flow_stage_reached]
    additionalProperties: false
    properties:
      triggered: {type: boolean}
      flow_stage_reached:
        type: string
        enum: [NOT_TRIGGERED, STOPPED, REVOKED_OR_ROTATED, INVESTIGATED, RESUMED]

  revocation_entry:
    type: object
    required: [secret_id, response_flow]
    additionalProperties: false
    properties:
      secret_id: {type: string, pattern: "^SECRET-"}
      response_flow: {$ref: "#/$defs/response_flow"}

  revocation_stage:
    type: object
    required: [stage_id, entries]
    additionalProperties: false
    properties:
      stage_id: {const: revocation}
      entries:
        type: array
        minItems: 1
        items: {$ref: "#/$defs/revocation_entry"}

type: object
required: [id, version, system_or_component, stages, provenance]
properties:
  id:
    type: string
    pattern: "^SECR-"
  version:
    type: string
  generated_by_method:
    type: string
    default: "security.secrets_threat_review"
  system_or_component:
    type: string
    minLength: 1
    pattern: "\\S"
    description: "The overall reviewed scope (e.g. a machine, a service, an org-wide secret store) -- may be broader than any single secret_entry's own narrower system_or_component."
  stages:
    type: array
    minItems: 6
    maxItems: 6
    description: >
      Atlas's own six-word F20 table row L888 chain, AS AN ORDERED TUPLE,
      mirroring pasta-threat-model-record.schema.yaml's and dpia-pia
      -impact-assessment-record.schema.yaml's own prefixItems discipline.
      stages[0] MUST be the inventory stage, stages[5] MUST be the
      revocation stage, and so on -- Atlas's '→' is a dependency chain, not
      a set.
    prefixItems:
      - $ref: "#/$defs/inventory_stage"
      - $ref: "#/$defs/storage_stage"
      - $ref: "#/$defs/access_stage"
      - $ref: "#/$defs/rotation_stage"
      - $ref: "#/$defs/exposure_stage"
      - $ref: "#/$defs/revocation_stage"
    items: false
  provenance:
    description: "epistemic_type is expected to be AI_INFERENCE or HUMAN_OPINION -- a Secrets Threat Review is a structured analytical judgment, not a calculated/simulated result."
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"

examples:
  - description: "An illustrative reconstruction of the real, closed 'former-employer desktop machine credential cleanup' (CLAUDE.md:17, closed 2026-08-15) -- one crypto_key secret (deferring to the Key Vault) and one ssh_key secret, both fully revoked, no exposure found"
    value:
      id: "SECR-2026-09-06-001"
      version: "1.0.0"
      generated_by_method: "security.secrets_threat_review"
      system_or_component: "former-employer-issued desktop workstation, post-departure credential cleanup"
      stages:
        - stage_id: inventory
          secrets:
            - {secret_id: "SECRET-001", secret_type: crypto_key, owner: "operator", system_or_component: "local SSH client key material used for former-employer VPS access"}
            - {secret_id: "SECRET-002", secret_type: ssh_key, owner: "operator", system_or_component: "former-employer git remote deploy key"}
        - stage_id: storage
          entries:
            - {secret_id: "SECRET-001", storage_mechanism: OS_KEYCHAIN, exception_justification: null, key_vault_ref: "kek:former-employer-desktop"}
            - {secret_id: "SECRET-002", storage_mechanism: OS_KEYCHAIN, exception_justification: null, key_vault_ref: null}
        - stage_id: access
          entries:
            - {secret_id: "SECRET-001", authorized_identities: ["operator (sole account on that desktop)"], last_access_review_at: "2026-08-15"}
            - {secret_id: "SECRET-002", authorized_identities: ["operator (sole account on that desktop)"], last_access_review_at: "2026-08-15"}
        - stage_id: rotation
          entries:
            - {secret_id: "SECRET-001", rotation_interval: "NOT_APPLICABLE_SUPERSEDED_BY_REVOCATION", last_rotated_at: null, rotation_overdue: false}
            - {secret_id: "SECRET-002", rotation_interval: "NOT_APPLICABLE_SUPERSEDED_BY_REVOCATION", last_rotated_at: null, rotation_overdue: false}
        - {stage_id: exposure, findings: []}
        - stage_id: revocation
          entries:
            - {secret_id: "SECRET-001", response_flow: {triggered: true, flow_stage_reached: RESUMED}}
            - {secret_id: "SECRET-002", response_flow: {triggered: true, flow_stage_reached: RESUMED}}
      provenance: {epistemic_type: HUMAN_OPINION, authorship_state: HUMAN_ORIGINAL, locked: null}

verification:
  method: >
    Read Atlas's own F20 table row (L888) and §13.11 (L3472-3487) directly.
    Read `docs/architecture/SECURITY_THREAT_MODEL.md` in full for its own
    honest Phase 3 backlog disclosure. Read Execution Contract §33 in full
    (L1264-1300). Read `specs/security/key-vault-lifecycle.schema.yaml` and
    `ai_lego/security/key_vault/local_key_vault.py` in full to confirm no
    duplication and to ground the soft-reference decision for
    `key_vault_ref`. Validated against jsonschema.Draft202012Validator,
    including the positional prefixItems ordering constraint. Cross-stage
    secret-id traceability, the exposure-response-flow rule, and the
    crypto-key-defers-to-vault rule are NOT expressible in JSON Schema
    alone (no cross-array reference mechanism) -- all three are enforced at
    the runtime layer only (see method contract and
    `ai_lego/modules/security/secrets_threat_review.py`).
  note: >
    Atlas's own six-word chain and its own literal order are directly
    transcribed. The exposure-response-flow and crypto-key-defers-to-vault
    invariants are disclosed as grounded in Execution Contract §33's own
    real, dedicated content and in the existing key-vault-lifecycle schema
    respectively, not an Atlas citation beyond the bare six-word chain. No
    mother document or sibling security.* file was modified.

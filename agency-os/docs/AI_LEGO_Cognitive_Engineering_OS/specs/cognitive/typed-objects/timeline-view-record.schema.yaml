  method: >
    Read Atlas F24 table, Timeline View row (L968) directly, plus §9
    Representation Contract (L1040-1053). Grepped
    `agency-os/docs/AI_LEGO_Cognitive_Engineering_OS` and
    `Projects/internal/cognitive-engineering-os` case-insensitively for
    "timeline view"/"timeline-view"/"TLVIEW-" and every schema title before
    writing -- zero pre-existing implementation or schema title overlap found
    (only the pre-existing generic specs/cognitive/representation.schema.yaml,
    a different, broader dimension-H contract this file does not redefine).
    Read `ai_lego/modules/jurisdiction/compliance_gap_analysis.py` in full
    for the exact "derived, never accepted from the caller" convention this
    method's ordered_event_refs field applies. Validated against jsonschema
    Draft202012Validator via tests/unit/test_timeline_view.py.
  note: >
    No mother document was modified. The pipeline is transcribed directly
    from Atlas L968. The TLVIEW- prefix, the numeric event_time framing, and
    runtime-invariant placement of chronological derivation are this file's
    own compiled structure, disclosed above.

    "cross-impact"/"cross impact"/"event pair matrix" and every schema
    title before writing -- zero pre-existing implementation or schema
    title overlap found. Validated against jsonschema Draft202012Validator
    via tests/unit/test_cross_impact_analysis.py.
  note: >
    No mother document was modified. The two-stage pipeline is transcribed
    directly from Atlas L685. The XIMPACT- prefix, signed-shift range, and

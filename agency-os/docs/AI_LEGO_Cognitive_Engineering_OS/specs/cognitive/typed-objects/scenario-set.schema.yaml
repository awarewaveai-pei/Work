$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/scenario-set.schema.yaml"
title: Scenario Set
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of `ScenarioSet` -- the declared
  `outputs` of `foresight.scenario_planning`'s Method Contract
  (methods/contracts/foresight.scenario_planning.contract.yaml, `outputs:
  [ScenarioSet]`). Atlas §11.27 (L1804-1836): multiple plausible futures,
  not one forecast, each scenario carrying the section's own nine required
  elements (L1822-1830), built over exactly two critical uncertainties per
  the section's own quadrantChart (L1809-1818).

  Per-scenario completeness (all nine elements non-empty) and the
  2-uncertainty/4-scenario count are RUNTIME invariants (not expressible
  declaratively across this many sibling fields) -- enforced at both
  construction time and an independent gate by
  `ai_lego/modules/foresight/scenario_planning.py`.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §11.27 情境規劃／情境分析（Scenario Planning）, nine-element list and quadrantChart (L1804-1836)"
  - "methods/contracts/foresight.scenario_planning.contract.yaml (outputs, preconditions, quality)"

decided_by: >
  No ADR governs this file. Direct transcription of Atlas §11.27's own
  nine-element list plus low-risk, disclosed compilation choices (the
  SCEN- prefix, list-vs-string typing per element, the exact-2/exact-4
  count rule).

compilation_decisions:
  - question: "Exactly 2 critical_uncertainties / exactly 4 scenarios, or a general 2**N rule for N uncertainties?"
    decision: "Exactly 2 / exactly 4, matching Atlas §11.27's own literal quadrantChart (L1809-1818) -- a general N-uncertainty formula is not written anywhere in Atlas and would present an invented generalization as a compiled fact."
  - question: "Which of the nine per-scenario elements are lists vs a single string?"
    decision: "drivers/assumptions/stakeholder_responses/competitor_responses/second_third_order_effects/signposts are lists (Atlas's own plural naming); narrative/strategy_performance/reversal_condition are single strings (Atlas's own singular naming)."

type: object
additionalProperties: false
required: [id, version, critical_uncertainties, scenarios, provenance]
properties:

  id:
    type: string
    pattern: "^SCEN-"
    description: "NEW DESIGN. Same id-prefix convention as every sibling record schema."

  version:
    type: string

  generated_by_method:
    type: string
    default: "foresight.scenario_planning"

  critical_uncertainties:
    type: array
    minItems: 2
    maxItems: 2
    description: "Atlas §11.27's own quadrantChart axes (L1809-1818) -- exactly two, e.g. 'Regulation Loose<->Strict', 'AI Cost High<->Low'. RUNTIME-enforced exact count (see compilation_decisions)."
    items: {type: string, minLength: 1, pattern: "\\S"}

  scenarios:
    type: array
    minItems: 4
    maxItems: 4
    description: "Exactly four plausible worlds -- one per quadrant of the two critical_uncertainties (RUNTIME-enforced, see compilation_decisions)."
    items:
      type: object
      additionalProperties: false
      required: [id, drivers, assumptions, narrative, stakeholder_responses, competitor_responses, second_third_order_effects, signposts, strategy_performance, reversal_condition]
      properties:
        id:
          type: string
          description: "Local id, unique within this scenario set (e.g. SCEN-001-S1)."
        drivers:
          type: array
          minItems: 1
          items: {type: string, minLength: 1, pattern: "\\S"}
          description: "Atlas §11.27 L1818: the forces driving this world."
        assumptions:
          type: array
          minItems: 1
          items: {type: string, minLength: 1, pattern: "\\S"}
          description: "Atlas §11.27 L1819: what this world assumes to be true."
        narrative:
          type: string
          minLength: 1
          description: "Atlas §11.27 L1820: the world's own story, in prose."
        stakeholder_responses:
          type: array
          minItems: 1
          items: {type: string, minLength: 1, pattern: "\\S"}
          description: "Atlas §11.27 L1821: how stakeholders react in this world."
        competitor_responses:
          type: array
          minItems: 1
          items: {type: string, minLength: 1, pattern: "\\S"}
          description: "Atlas §11.27 L1822: how competitors react in this world."
        second_third_order_effects:
          type: array
          minItems: 1
          items: {type: string, minLength: 1, pattern: "\\S"}
          description: "Atlas §11.27 L1823: downstream effects beyond the immediate/direct one."
        signposts:
          type: array
          minItems: 1
          items: {type: string, minLength: 1, pattern: "\\S"}
          description: "Atlas §11.27 L1824: early observable indicators this world is emerging."
        strategy_performance:
          type: string
          minLength: 1
          description: "Atlas §11.27 L1825: how the current strategy performs if this world happens."
        reversal_condition:
          type: string
          minLength: 1
          description: "Atlas §11.27 L1826: what would have to happen for this world to no longer hold."

  provenance:
    description: "Overall record provenance -- same full provenance_record pattern every sibling typed-object schema in this directory uses."
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"

examples:

      provenance: {epistemic_type: AI_INFERENCE, authorship_state: AI_GENERATED, locked: null}

open_questions:
  - "OQ-SCENARIOSET-1: exact-2/exact-4 count is this file's own disclosed compilation choice, not a cited general Atlas formula -- should a future revision support N>2 uncertainties?（owner: operator）"

verification:
  method: >
    Read Atlas §11.27 (L1804-1836) directly, including the exact nine-element
    list and the quadrantChart's two-axis structure. Grepped the full spec
    root case-insensitively for "scenario planning"/"scenario_planning" and
    every schema title before writing -- incidental table-row mentions only
    (see ai_lego/modules/foresight/scenario_planning.py's own module
    docstring for the full grep record); no prior definition of this
    method's own output shape found. Validated against jsonschema
    Draft202012Validator via tests/unit/test_scenario_planning.py.
  note: >
    No mother document was modified. The nine-element list and the
    two-uncertainty/four-scenario count are transcribed directly from Atlas
    §11.27. The SCEN- prefix and per-element list-vs-string typing are this
    file's own compiled structure, disclosed above.

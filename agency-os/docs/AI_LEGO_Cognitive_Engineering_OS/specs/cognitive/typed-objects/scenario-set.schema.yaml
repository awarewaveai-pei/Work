      version: "1.0.0"
      generated_by_method: "foresight.scenario_planning"
      critical_uncertainties: ["Regulation: Loose<->Strict", "AI Cost: High<->Low"]
      scenarios:
        - id: "SCEN-2026-09-12-001-S1"
          drivers: ["寬鬆監管持續", "AI 推論成本快速下降"]
          assumptions: ["主要司法管轄區不祭出新的 AI 限制"]
          narrative: "低成本、低監管的世界：AI 應用快速擴散，中小企業大量採用"
          stakeholder_responses: ["中小企業加速導入", "大型企業擔心差異化消失"]
          competitor_responses: ["新進者以低價策略搶市"]

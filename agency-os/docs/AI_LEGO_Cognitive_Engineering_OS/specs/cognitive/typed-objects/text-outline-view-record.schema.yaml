$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/text-outline-view-record.schema.yaml"
title: Text / Outline View Record
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of `TextOutlineViewRecord` -- the
  declared `outputs` of `representation.text_outline_view`'s Method Contract
  (methods/contracts/representation.text_outline_view.contract.yaml,
  `outputs: [TextOutlineViewRecord]`). F24 Representation family (Atlas
  L964: "summary->outline->details->evidence links").

  Real invariants (RUNTIME, not all declaratively expressible here, same
  disclosed-gap class as `cross-impact-analysis.schema.yaml`'s own
  precedent): (a) NO CONTENT DUPLICATION -- the shared View law (Atlas §9
  L1053, "不得複製 Knowledge 本體") is enforced structurally: this schema has
  no free-text "content"/"details" field anywhere, only `source_knowledge_
  object_id` and `evidence_links[]`/`details_ref` REFERENCES; (b) every
  reference-typed field is id/URI-shaped (no whitespace) -- a cheap
  structural proxy that it is a pointer, not pasted-in prose; (c) every
  `summary` (top-level and per outline node) is non-empty and does not
  exceed `SUMMARY_MAX_LENGTH` -- the structural proxy chosen for "this is a
  genuine summary, not a full-text copy" (see compilation_decisions for why
  a `details` blob field, and a summary-vs-details length comparison, were
  both rejected). `ai_lego/modules/representation/text_outline_view.py`
  enforces all of this at both construction time and two independent gates.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F24 table, Text / Outline View row (L964)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §9 Representation Contract (L1040-1053)"
  - "methods/contracts/representation.text_outline_view.contract.yaml (outputs, preconditions, quality)"

decided_by: >
  No ADR governs this file. Direct transcription of Atlas L964's own
  4-stage pipeline plus low-risk, disclosed compilation choices (the
  TXTVIEW- prefix, the reference-shape grammar, the summary length bound).

compilation_decisions:
  - question: "Store a `details` field (per Atlas's own 'details' pipeline stage) alongside `summary`, with the suggested heuristic 'summary must not equal or exceed the length of details'?"
    decision: "No -- store only a `details_ref` (a reference into the source Knowledge Object), never a `details` text blob. Storing real detail text in the View would itself BE the content duplication the shared Representation Contract (L1053) forbids -- the very defect the heuristic is meant to catch. The summary-length bound below is this schema's structural proxy instead."
  - question: "How to structurally prove a `summary` is a genuine summary, not a full-text duplicate, without a `details` field to compare against?"
    decision: "A flat maximum-length bound (SUMMARY_MAX_LENGTH = 240 characters) on every `summary` string, top-level and per outline node. Cheap and re-derivable by an independent gate from raw fields alone, with no dependency on a same-record 'details' blob."
  - question: "Reference-shape grammar for `evidence_links[]` / `details_ref` / `source_knowledge_object_id`?"
    decision: "`^[A-Za-z0-9][A-Za-z0-9_.:/-]*$`, no whitespace permitted anywhere in the string. Inline evidence/detail prose is overwhelmingly likely to contain a space; a bare id/URI is not. Cheap structural proxy, not a full URI-grammar validator."

type: object
additionalProperties: false
required: [id, version, source_knowledge_object_id, summary, outline, provenance]
properties:

  id:
    type: string
    pattern: "^TXTVIEW-"
    description: "NEW DESIGN. Same id-prefix convention as every sibling record schema."

  version:
    type: string

  generated_by_method:
    type: string
    default: "representation.text_outline_view"

  source_knowledge_object_id:
    type: string
    minLength: 1
    description: "REFERENCE ONLY into the underlying Knowledge Object this View renders -- never its content. RUNTIME invariant: must be reference-shaped (see compilation_decisions)."

  summary:
    type: string
    minLength: 1
    maxLength: 240
    description: "Top-level overview of the whole Knowledge Object. RUNTIME invariant: length-bounded, see compilation_decisions."

  outline:
    type: array
    minItems: 1
    description: "The nested outline hierarchy. RUNTIME invariant: every node's own `summary` is length-bounded and every reference field is reference-shaped, recursively."
    items:
      $ref: "#/$defs/outline_node"

  layout: { type: object, description: "Atlas §9 L1053 presentation-state field. No further internal structure specified anywhere in the corpus -- left as an open object." }
  filters: { type: object, description: "Atlas §9 L1053 presentation-state field. Left as an open object, same reasoning as `layout`." }
  visible_fields:
    type: array
    items: { type: string }
    description: "Atlas §9 L1053 presentation-state field -- which source fields this View renders."
  presentation_preferences: { type: object, description: "Atlas §9 L1053 presentation-state field. Left as an open object, same reasoning as `layout`." }

  provenance:
    description: "Overall record provenance -- record-level only, same convention every sibling typed-object schema in this directory uses."
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"

$defs:
  outline_node:
    type: object
    additionalProperties: false
    required: [id, summary]
    description: "One outline node. No `content`/`details`/`label`-text field anywhere -- only a summary and REFERENCES, per the shared View law."
    properties:
      id: { type: string, minLength: 1 }
      summary: { type: string, minLength: 1, maxLength: 240 }
      details_ref:
        type: string
        minLength: 1
        description: "REFERENCE ONLY into the source Knowledge Object's own detail content for this node -- never inline text. RUNTIME invariant: reference-shaped."
      evidence_links:
        type: array
        items: { type: string, minLength: 1 }
        description: "REFERENCE ONLY -- every entry is a pointer to evidence, never inline evidence text. RUNTIME invariant: reference-shaped."
      children:
        type: array
        items: { $ref: "#/$defs/outline_node" }
        description: "Nested sub-nodes, same shape, recursively -- the 'outline' stage of Atlas's own pipeline."

examples:
  - description: "A 2-node outline (one nested child) over a referenced Knowledge Object"
    value:
      id: "TXTVIEW-2026-09-12-001"
      version: "1.0.0"
      generated_by_method: "representation.text_outline_view"
      source_knowledge_object_id: "KO-2026-09-12-001"
      summary: "季度營運回顧的重點摘要"
      outline:
        - id: "N1"
          summary: "營收成長 12%"
          details_ref: "KO-2026-09-12-001/section/revenue"
          evidence_links: ["EVID-2026-09-001", "EVID-2026-09-002"]
          children:
            - id: "N1.1"
              summary: "主要來自海外市場"
              evidence_links: ["EVID-2026-09-003"]
      provenance: {epistemic_type: AI_INFERENCE, authorship_state: AI_GENERATED, locked: null}

open_questions:
  - "OQ-TXTOUTLINEVIEW-1: SUMMARY_MAX_LENGTH=240 is this file's own compiled bound, not cited from Atlas -- should a future revision make it configurable per deployment?（owner: operator）"

verification:
  method: >
    Read Atlas F24 table row (L964) and §9 Representation Contract
    (L1040-1053) directly. Grepped
    `agency-os/docs/AI_LEGO_Cognitive_Engineering_OS` and
    `Projects/internal/cognitive-engineering-os` case-insensitively for
    "text.?outline.?view", "TXTVIEW", "outline_node" before writing -- zero
    pre-existing implementation or schema title overlap found. Validated
    against jsonschema Draft202012Validator via
    tests/unit/test_text_outline_view.py.
  note: >
    No mother document was modified. The 4-stage pipeline is transcribed
    directly from Atlas L964. The TXTVIEW- prefix, the reference-shape
    grammar, the summary-length bound, and the rejection of a stored
    `details` blob are this file's own compiled structure, disclosed above.

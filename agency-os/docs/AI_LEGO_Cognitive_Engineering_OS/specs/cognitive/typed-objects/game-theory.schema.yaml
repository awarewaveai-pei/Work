    row. Cross-checked against methods/contracts/stakeholders.game_theory.contract.yaml's own
    outputs/preconditions/quality. Read mcda-analysis.schema.yaml (per-item list-of-objects shape,
    cross-array-referential-integrity-left-as-runtime-invariant precedent) and jtbd-statement.schema.yaml
    (record-level-only-provenance precedent) in full before writing this file. Grepped the whole
    `agency-os/docs/AI_LEGO_Cognitive_Engineering_OS` and `Projects/internal/cognitive-engineering-os` trees for
    "game_theory"/"GAMETH"/"GameTheory" before writing any of this method's own files -- zero pre-existing
    implementation. Validated against jsonschema Draft202012Validator via tests/unit/test_game_theory.py
    (required fields present, id pattern satisfied, additionalProperties:false at the top level and every nested
    item, the embedded example resolved through its real $ref to epistemic-label.schema.yaml, negative controls

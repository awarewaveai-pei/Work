$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/pareto-analysis.schema.yaml"
title: Pareto Analysis
version: "1.1.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of `ParetoAnalysis` -- the declared
  `outputs` of `root_cause.pareto`'s Method Contract
  (methods/contracts/root_cause.pareto.contract.yaml, `outputs:
  [ParetoAnalysis]`). Structurally different from every sibling typed-object
  schema in this directory: `ProblemStatement`/`CauseHypothesisSet`/
  `RootCauseFact`/`FiveWhysValidation` are narrative, evidence-cited records;
  this one is a CALCULATED_RESULT, the same class of artifact
  `ai_lego/compute/statistics/reliability.py`'s Cohen's Kappa output already
  is (Master Plan §39: an LLM must never "mentally calculate" a value and
  label it CALCULATED_RESULT).

  Field provenance -- Atlas §11.6 (L1300-1320):
    * The 5-step procedure (L1305-1311: define metric, categorize, sort
      descending, compute cumulative share, RCA the top few) is transcribed
      directly into `dataset[]` (categorized input) and `ranking[]`
      (sorted, cumulative-share output) -- two separate arrays, not one,
      because the input categorization and the computed ranking are
      different objects with different provenance (`dataset` is
      caller-supplied, `ranking` is this method's own compute output).
    * The explicit caution (L1320, "80/20 不是自然法則；真正比例由資料決定"
      -- 80/20 is not a law of nature, the real ratio is data-determined) is
      why `vital_few_threshold_percent`/`threshold_status` exist as a
      SEPARATE, explicit pair rather than a hard-coded 80% default anywhere
      in this schema -- the identical pattern
      `ai_lego/modules/research/qualitative_coding.py`'s own
      `saturation_assessment` record already established
      (`threshold_data_units: null`, `threshold_status:
      OPERATOR_SET_PENDING`) for the SAME class of problem (a method whose
      mother-document text explicitly warns against silently assuming a
      numeric threshold).

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §11.6 柏拉圖分析／80/20 分析, 5-step procedure and caution (L1300-1320)"
  - "methods/contracts/root_cause.pareto.contract.yaml (outputs, preconditions, quality -- the method contract this type's shape must satisfy)"
  - "ai_lego/modules/research/qualitative_coding.py saturation_assessment (threshold_status: OPERATOR_SET_PENDING precedent this file's threshold_status field reuses)"
  - "ai_lego/compute/statistics/reliability.py interrater_reliability_result (engine/computation_provenance_ref/provenance shape this file's own top-level fields mirror)"

decided_by: >
  No ADR governs this file. Same class of decision
  `five-whys-validation.schema.yaml`'s own `decided_by` field documents:
  direct transcription of a cited, dedicated Atlas protocol section plus
  low-risk, disclosed compilation choices.

compilation_decisions:
  - question: >
      Should this schema hard-code an 80% (or any) default
      `vital_few_threshold_percent`, the way a naive reading of "Pareto
      Analysis" (the 80/20 rule) might suggest?
    decision: "No default -- nullable, with an explicit threshold_status flag (OPERATOR_SET | OPERATOR_SET_PENDING)."
    reasoning: >
      Atlas L1320 explicitly warns against exactly this
      ("80/20 不是自然法則；真正比例由資料決定"). Hard-coding 80 as a
      schema default would silently contradict the mother document's own
      stated caution -- the same reasoning
      `ai_lego/modules/research/qualitative_coding.py`'s
      saturation_assessment already applied to its own threshold field
      (`threshold_status: OPERATOR_SET_PENDING`, `threshold_data_units:
      null`), reused here verbatim rather than re-invented.
  - question: >
      Should `dataset[]` (caller-supplied categorized records) and
      `ranking[]` (this method's own computed, sorted, cumulative-share
      output) be one array or two?
    decision: "Two separate arrays."
    reasoning: >
      They have different provenance and different producers: `dataset` is
      the caller's own categorized input (Atlas step 1-2), `ranking` is
      what THIS method computes from it (step 3-4). Collapsing them into
      one array would make it impossible to tell, from the record alone,
      which fields were supplied vs. computed -- the same
      input/output-provenance distinction `cause-hypothesis-set.schema.yaml`
      keeps between `hypotheses[]` (caller-constructed) and `promotion`
      (method-computed).

type: object
required: [id, version, cause_hypothesis_set_ref, metric_name, dataset, ranking, threshold_status, engine, computation_provenance_ref, provenance]
properties:

  id:
    type: string
    pattern: "^PA-"
    description: "NEW DESIGN. Same id-prefix convention rationale as problem-statement.schema.yaml's PROB- prefix."

  version:
    type: string

  cause_hypothesis_set_ref:
    type: string
    pattern: "^CHS-"
    description: "Which CauseHypothesisSet this analysis quantifies. Real $ref to the sibling type."
    $ref: "ai-lego://specs/cognitive/typed-objects/cause-hypothesis-set.schema.yaml#/properties/id"

  generated_by_method:
    type: string
    default: "root_cause.pareto"

  causes:
    type: array
    description: >
      What each measured hypothesis id says: one entry per distinct dataset[].hypothesis_id, copied by the builder from
      the referenced set, so the ranking names its causes -- the result page and its interpretation see only this record.
    items:
      type: object
      required: [hypothesis_id, statement]
      properties:
        hypothesis_id:
          type: string
        statement:
          type: string
        category:
          type: string

  metric_name:
    type: string
    description: "Atlas L1307 step 1: 'define metric' -- e.g. incident_count, cost_usd, downtime_minutes, severity_adjusted_impact. Free text, Atlas gives no closed enum."

  dataset:
    type: array
    minItems: 1
    description: "Atlas step 2 (L1308): categorized records, one per CauseHypothesisSet hypothesis this run measures. Caller-supplied, not computed."
    items:
      type: object
      required: [hypothesis_id, metric_value]
      properties:
        hypothesis_id:
          type: string
          description: "Must be a member of the referenced CauseHypothesisSet's hypotheses[].id (method contract precondition, checked by the runtime builder, not this schema)."
        metric_value:
          type: number
          minimum: 0
          description: "The raw count/amount/minutes/impact score for this category, in metric_name's own unit."

  ranking:
    type: array
    minItems: 1
    description: "Atlas steps 3-4 (L1309-1310): sorted descending by metric_value, with cumulative share -- this method's own COMPUTED output, not caller-supplied."
    items:
      type: object
      required: [hypothesis_id, metric_value, share_of_total_percent, cumulative_share_percent]
      properties:
        hypothesis_id:
          type: string
        metric_value:
          type: number
          minimum: 0
        share_of_total_percent:
          type: number
          minimum: 0
          maximum: 100
        cumulative_share_percent:
          type: number
          minimum: 0
          maximum: 100

  vital_few_threshold_percent:
    type: ["number", "null"]
    default: null
    minimum: 0
    maximum: 100
    description: "Atlas L1320 caution -- no default value. See compilation_decisions."

  threshold_status:
    type: string
    enum: [OPERATOR_SET, OPERATOR_SET_PENDING]
    description: "Same pattern ai_lego/modules/research/qualitative_coding.py's saturation_assessment already established for this exact class of un-defaultable threshold."

  vital_few_hypothesis_ids:
    type: array
    default: []
    items:
      type: string
    description: "The hypothesis ids whose cumulative_share_percent first crosses vital_few_threshold_percent -- only meaningfully non-empty when threshold_status is OPERATOR_SET."

  engine:
    const: "local_python_deterministic_compute"
    description: "Same literal value ai_lego/compute/statistics/reliability.py's interrater_reliability_result already uses -- genuine compute, never an LLM 'mental calculation'."

  computation_provenance_ref:
    type: string
    pattern: "^ai_lego\\.compute\\."
    description: "Dotted path to the real Python function that computed `ranking`, resolvable via importlib -- same convention modules/research/gates.py's evaluate_statistical_gate already checks."

  provenance:
    description: "epistemic_type is expected to be CALCULATED_RESULT for a genuine Pareto run -- the full 11-value enum remains legal at the schema layer (same design choice root-cause-fact.schema.yaml's own provenance field documents), enforced at the gate layer instead."
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"

examples:
  - description: "A Pareto ranking of two candidate causes, threshold explicitly set by the operator"
    value:
      id: "PA-2026-09-04-001"
      version: "1.0.0"
      cause_hypothesis_set_ref: "CHS-2026-09-04-001"
      generated_by_method: "root_cause.pareto"
      metric_name: "incident_count"
      dataset:
        - hypothesis_id: "CHS-2026-09-04-001-H1"
          metric_value: 42
        - hypothesis_id: "CHS-2026-09-04-001-H2"
          metric_value: 8
      ranking:
        - hypothesis_id: "CHS-2026-09-04-001-H1"
          metric_value: 42
          share_of_total_percent: 84.0
          cumulative_share_percent: 84.0
        - hypothesis_id: "CHS-2026-09-04-001-H2"
          metric_value: 8
          share_of_total_percent: 16.0
          cumulative_share_percent: 100.0
      vital_few_threshold_percent: 80
      threshold_status: OPERATOR_SET
      vital_few_hypothesis_ids: ["CHS-2026-09-04-001-H1"]
      engine: "local_python_deterministic_compute"
      computation_provenance_ref: "ai_lego.compute.pareto.ranking.pareto_ranking"
      provenance: { epistemic_type: CALCULATED_RESULT, authorship_state: AI_GENERATED, locked: null }

open_questions:
  - id: "OQ-PARETOANALYSIS-1"
    question: >
      `vital_few_hypothesis_ids` is left un-computed (empty) whenever
      `threshold_status` is `OPERATOR_SET_PENDING`, per this schema's own
      description. Should a future validator gate REFUSE a downstream
      promotion attempt that cites a PENDING-threshold ParetoAnalysis as
      validation evidence, the way root_cause.fishbone's forbidden_transition
      guard refuses an unvalidated CauseHypothesisSet?
    owner: "operator, or whoever next wires ParetoAnalysis into a real promotion attempt via record_validation_applied"
    blocks: "nothing in this file's own validity"

verification:
  method: >
    Read Atlas §11.6 (L1300-1320) directly at the cited lines. Cross-checked
    against methods/contracts/root_cause.pareto.contract.yaml's own
    outputs/preconditions/quality, ai_lego/compute/statistics/reliability.py's
    real engine/computation_provenance_ref/provenance shape, and
    ai_lego/modules/research/qualitative_coding.py's saturation_assessment
    threshold-honesty precedent. Validated against jsonschema
    Draft202012Validator.
  note: >
    `dataset`/`ranking`'s field names and the threshold-honesty design are
    transcribed/reused rather than invented from nothing. The overall
    object shape and the two-array split are Phase 3-class compilation
    decisions, explicitly flagged above. No mother document was modified to
    produce this file.

$schema: https://json-schema.org/draft/2020-12/schema
$id: ai-lego://specs/cognitive/typed-objects/method-route.schema.yaml
title: Method Route
version: 1.0.0
status: ACTIVE
type: object
additionalProperties: false
required: [text, candidates, suggested_workflow, needs_ai, gates]
properties:
  text: {type: string, minLength: 1}
  candidates:
    type: array
    maxItems: 3
    items:
      type: object
      additionalProperties: false
      required: [kind, id, why, citations, yields, est_cost]
      properties:
        kind: {type: string, enum: [method, recipe]}
        id: {type: string, minLength: 1}
        hits: {type: integer, minimum: 1}
        score: {type: number, minimum: 0, maximum: 1}
        why: {type: string, minLength: 1}
        citations: {type: array, minItems: 1, items: {type: string, pattern: '^catalog:.+'}}
        yields: {type: string, minLength: 1}
        est_cost: {type: string, minLength: 1}
  suggested_workflow: {type: array, items: {type: string, minLength: 1}}
  needs_ai: {type: boolean}
  gates:
    type: object
    additionalProperties: false
    required: [methods_resolvable, rationale_cited, max_three]
    properties:
      methods_resolvable: {$ref: '#/$defs/gate'}
      rationale_cited: {$ref: '#/$defs/gate'}
      max_three: {$ref: '#/$defs/gate'}
  model: {type: string, minLength: 1}
  usage:
    type: object
    additionalProperties: false
    required: [input_tokens, output_tokens]
    properties:
      input_tokens: {type: integer, minimum: 0}
      output_tokens: {type: integer, minimum: 0}
$defs:
  gate:
    type: object
    additionalProperties: false
    required: [gate_id, status, evidence]
    properties:
      gate_id: {type: string, minLength: 1}
      status: {type: string, enum: [PASS, FAIL]}
      evidence: {}

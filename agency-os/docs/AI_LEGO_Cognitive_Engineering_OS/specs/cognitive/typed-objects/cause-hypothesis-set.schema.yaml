$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/cause-hypothesis-set.schema.yaml"
title: Cause Hypothesis Set
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of `CauseHypothesisSet` — the middle
  node of the §14.1 type-compatibility chain
  (`ProblemStatement -> Fishbone -> CauseHypothesisSet -> Evidence Search ->
  Causal DAG -> Validation -> RootCauseFact`). It is the declared `outputs`
  of Fishbone's Method Contract (Atlas §9, L1009-1010:
  `outputs: [CauseHypothesisSet]`) and the declared `required` input this
  file's sibling `root-cause-fact.schema.yaml` consumes on its legal
  promotion path. Resolves part of DOC-method_atlas-7 (§14.1 chain has zero
  schemas for any of its ~13 nodes) for this specific node.

  Field provenance: Atlas §11.4 Fishbone's own usage steps (L1251-1257)
  describe exactly what a CauseHypothesisSet contains once produced:
  step 2-3 group candidate causes into categories then expand each into
  candidate causes (L1254-1255: "建原因大類...每大類展開 candidate causes"),
  and step 4 requires every candidate cause be labeled
  `Evidence-backed / Hypothesis / Unknown` (L1256). That three-way label is
  not a new invention of this schema — it maps directly onto three of the
  eleven values already defined by `governance/epistemic-label.schema.yaml`'s
  `epistemic_type` axis (`EVIDENCE` / `HYPOTHESIS` / `UNKNOWN`), so each
  hypothesis item's `provenance` re-uses that existing enum rather than
  defining a narrower, competing three-value label of its own.

  Categories: Fishbone's own example groups are People / Process / Technology
  / Data / Environment / Policy (the mermaid diagram at L1242-1248, a
  6M-style layout), but Atlas explicitly forbids treating this as a fixed
  taxonomy: L1254 "不要硬套製造業 6M，可依 domain 調整" (do not force-fit the
  manufacturing 6M, adjust per domain). This schema therefore keeps
  `category` as a free-form string (with the six Fishbone example values
  listed only as non-normative `suggested_categories`), rather than an enum —
  hard-coding an enum here would directly contradict the mother document's
  explicit instruction.

  Promotion boundary (the reason this file exists as a distinct type from
  RootCauseFact, not a status field on the same object): Atlas §11.4
  (L1267) states plainly "Fishbone 只能產生 CauseHypothesisSet，不能直接產生
  RootCauseFact" (Fishbone can only produce CauseHypothesisSet, it cannot
  directly produce RootCauseFact) and §9's `forbidden_transition` (L1019-1020)
  and §14.1's illegal-chain example (L3558-3564,
  `ProblemStatement -> Fishbone -> FinalCausalFact`) both encode the same
  rule mechanically: a CauseHypothesisSet must pass through an intermediate
  validation stage before it may become a RootCauseFact. §14.1's legal chain
  (L3548-3556) names that stage `Evidence Search -> Causal DAG -> Validation`;
  §22.3's gate table (L4200) names the same requirement
  "Evidence + Causal Validation"; and §9's own `recommended_next` list for
  Fishbone (L1022-1026: `root_cause.pareto`, `root_cause.five_whys`,
  `causal.dag`, `validation.experiment`) names the concrete methods that
  perform it. This schema's `promotion.validation_methods_applied` field
  records which of those methods were actually run against a given
  CauseHypothesisSet — see `root-cause-fact.schema.yaml`'s
  `legal_promotion_path` for the consuming side of this same rule.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §9 LEGO Contract outputs/forbidden_transition/recommended_next (L1009-1010, L1019-1026)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §11.4 Fishbone usage steps and limitation note (L1251-1267)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §14.1 legal/illegal chain examples (L3542-3564)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §22.3 Method-specific Gate, Fishbone row (L4200)"
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md §8.4 Typed LEGO, execute_method(root_cause.fishbone) (L742-743)"
decided_by: >
  No ADR governs this file (genuinely new type, zero prior mother-document
  schema per DOC-method_atlas-7). Built per
  docs/architecture/MACHINE_READABLE_SPEC_PLAN.md §2.3 row for
  `typed-objects/cause-hypothesis-set.schema.yaml` (status: READY, 需新設計,
  listed dependency: root-cause-fact — realized here as the bidirectional
  `promotion`/`legal_promotion_path` pair between the two files, both
  authored together in this session so the cross-reference is a real $ref
  in both directions, not a one-way forward guess).

compilation_decisions:
  - question: >
      Should `category` be an enum (locking in Fishbone's 6M example groups)
      or free-form?
    decision: "Free-form string; the 6M groups are recorded only as non-normative suggested_categories."
    reasoning: >
      Atlas L1254 explicitly instructs against force-fitting the manufacturing
      6M onto every domain. An enum here would silently re-introduce the
      exact rigidity the mother document warns against — this is the same
      class of self-inflicted duplication Phase 0/1 found elsewhere in the
      corpus, not something Phase 3 should reproduce.
  - question: >
      Should each hypothesis's Evidence-backed/Hypothesis/Unknown label be a
      new narrow 3-value enum local to this file, or reuse
      `governance/epistemic-label.schema.yaml`'s `epistemic_type`?
    decision: "Reuse epistemic_type via the same provenance_record $ref used by problem-statement.schema.yaml."
    reasoning: >
      `EVIDENCE` / `HYPOTHESIS` / `UNKNOWN` already exist verbatim in the
      11-value canonical enum (ADR-004b). Defining a second, overlapping
      3-value vocabulary for the identical concept would recreate the exact
      "same concept, multiple incompatible vocabularies" problem class Phase
      0/1 spent 71+98 findings documenting — the file's own governing
      precedent (`epistemic-label.schema.yaml`'s stated purpose) forbids it.
      A hypothesis item's provenance is therefore not restricted to those
      3 values in the schema (the full 11-value enum remains legal, e.g. a
      later `AI_INFERENCE`-labeled candidate cause is a legitimate state),
      but the description documents Fishbone's own step-4 convention as the
      expected common case.

type: object
required: [id, version, problem_statement_ref, hypotheses]
properties:

  id:
    type: string
    pattern: "^CHS-"
    description: "NEW DESIGN. Same id-prefix convention rationale as problem-statement.schema.yaml's PROB- prefix."

  version:
    type: string

  problem_statement_ref:
    type: string
    pattern: "^PROB-"
    description: >
      Required input per Atlas §9 (`inputs.required: [ProblemStatement]`,
      L1002-1003). Real $ref to the sibling type built in this same session.
    $ref: "ai-lego://specs/cognitive/typed-objects/problem-statement.schema.yaml#/properties/id"

  generated_by_method:
    type: string
    description: >
      Which method produced this set. Atlas names `root_cause.fishbone`
      (§9/§11.4) as the canonical producer; other root_cause-family methods
      MAY also legally produce this type (the chain is about type
      compatibility, not a single producing method).
    examples: ["root_cause.fishbone"]

  suggested_categories:
    type: array
    items: { type: string }
    default: ["People", "Process", "Technology", "Data", "Environment", "Policy"]
    description: >
      NON-NORMATIVE. Fishbone's own example grouping (Atlas L1242-1248),
      recorded for convenience only. See top-level description and
      compilation_decisions — MUST NOT be enforced as an enum on
      `hypotheses[].category`.

  hypotheses:
    type: array
    minItems: 1
    description: "One or more candidate causes, per Atlas §11.4 steps 2-4 (L1254-1256)."
    items:
      type: object
      required: [id, statement, provenance]
      properties:
        id:
          type: string
          description: "Local id, unique within this set (e.g. CHS-001-H1)."
        statement:
          type: string
          description: "The candidate cause itself."
        category:
          type: string
          description: >
            Free-form grouping label. See `suggested_categories` and
            compilation_decisions — Atlas L1254 forbids treating this as a
            fixed taxonomy.
        provenance:
          description: >
            Atlas §11.4 step 4 (L1256): every candidate cause MUST be labeled
            Evidence-backed / Hypothesis / Unknown. Modeled as a full
            provenance_record (not a narrow 3-value enum) — see
            compilation_decisions. Expected common values for this use case:
            EVIDENCE (Evidence-backed), HYPOTHESIS (Hypothesis), UNKNOWN
            (Unknown) — the full 11-value epistemic_type enum remains legal.
          $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"
        supporting_evidence_refs:
          type: array
          items: { type: string }
          description: >
            Soft reference only (free-text/id list) to
            `evidence/evidence.schema.yaml` (built Wave 4, 2026-08-29) — kept
            as a soft reference rather than upgraded to a hard $ref, since
            this file predates that Wave and the dependency direction was
            deliberately kept loose (same caution `manifest.schema.yaml`
            applied to `document-registry.schema.yaml`).

  promotion:
    type: object
    description: >
      Per-instance record of the legal path Atlas §14.1 (L3548-3556) and
      §22.3 (L4200) require between this type and RootCauseFact: Evidence
      Search -> Causal DAG -> Validation, performed by one or more of
      Fishbone's own `recommended_next` methods (Atlas L1022-1026). See the
      top-level `forbidden_transition` (schema-level static rule, below
      `properties`) for the rule this field's data satisfies.
    properties:
      validation_methods_applied:
        type: array
        items:
          type: string
          enum: ["root_cause.pareto", "root_cause.five_whys", "causal.dag", "validation.experiment"]
        description: >
          Which of Fishbone's `recommended_next` methods (Atlas §9, L1022-1026)
          were actually run against this set. Empty/absent means the set has
          not yet been through the validation stage and therefore CANNOT be
          legally promoted to RootCauseFact per the forbidden_transition rule
          below.
      ready_for_promotion:
        type: boolean
        description: >
          Convenience derived flag: true only if `validation_methods_applied`
          is non-empty. NEW DESIGN — not a mother-document field; recorded so
          a method-resolution engine can gate the promotion mechanically
          without re-deriving the emptiness check itself.

# ---------------------------------------------------------------------------
# Schema-level static rule (describes the TYPE, not per-instance data — same
# pattern as root-cause-fact.schema.yaml's top-level canonical_name /
# deprecated_aliases, sibling to `properties`, not nested inside it).
# ---------------------------------------------------------------------------
forbidden_transition:
  description: >
    Machine-checkable form of Atlas §9's `forbidden_transition` (L1019-1020)
    and §14.1's illegal-chain example (L3558-3564). A CauseHypothesisSet
    MUST NOT be treated as a RootCauseFact directly — it must pass through
    the `promotion` stage recorded above (per-instance data) before
    `root-cause-fact.schema.yaml` may legally reference it via
    `source_cause_hypothesis_set_ref`.
  from: "CauseHypothesisSet"
  to_deprecated_target_names:
    description: >
      The illegal target is named 3 different ways across the mother
      documents (`FinalCausalFact` L1020/L3563, and by extension the other
      aliases root-cause-fact.schema.yaml consolidates) — this field points
      at the now-canonical type regardless of which historical name a
      caller used.
    $ref: "ai-lego://specs/cognitive/typed-objects/root-cause-fact.schema.yaml#/properties/id"
  rule: "CauseHypothesisSet -> RootCauseFact (direct) is FORBIDDEN. See `properties.promotion` above for the legal path."

examples:
  - description: "A cause hypothesis set mid-validation, not yet promotable"
    value:
      id: "CHS-2026-08-29-001"
      version: "1.0.0"
      problem_statement_ref: "PROB-2026-08-29-001"
      generated_by_method: "root_cause.fishbone"
      hypotheses:
        - id: "CHS-2026-08-29-001-H1"
          statement: "電商系統與 ERP 之間庫存事件未即時同步"
          category: "Technology"
          provenance: { epistemic_type: HYPOTHESIS, authorship_state: AI_GENERATED, locked: null }
        - id: "CHS-2026-08-29-001-H2"
          statement: "客服人員手動確認流程造成延遲"
          category: "Process"
          provenance: { epistemic_type: EVIDENCE, authorship_state: HUMAN_EDITED, locked: null }
          supporting_evidence_refs: ["E-1"]
      promotion:
        validation_methods_applied: []
        ready_for_promotion: false

open_questions:
  - id: "OQ-CHS-1"
    question: >
      Should `ready_for_promotion` be computed by a shared validator function
      referenced from both this file and `root-cause-fact.schema.yaml`
      instead of being duplicated logic (currently: "non-empty array" is the
      only rule, stated in both files' descriptions)? Left open as a Wave 5
      `execution/method-resolution.schema.yaml` implementation detail, not a
      type-definition question this file needs to resolve.
    owner: "operator / Wave 5 execution/method-resolution.schema.yaml author"

verification:
  method: >
    Read against Atlas §9 (L985-1030), §11.4 (L1236-1268), §14.1 (L3542-3564),
    §22.3 (L4196-4210), MP §8.4 (L731-753), verified-findings.yaml
    DOC-method_atlas-3 and DOC-method_atlas-7 full entries.
  note: >
    `category` example values and the Evidence-backed/Hypothesis/Unknown
    labeling requirement are transcribed verbatim from Atlas L1242-1256.
    The overall object shape (id/version/hypotheses[]/promotion) is new
    Phase 3 design, explicitly flagged as such above. No mother document was
    modified to produce this file.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/critical-path-analysis-record.schema.yaml"
title: Critical Path Analysis Record
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of `CriticalPathAnalysisRecord` --
  the declared `outputs` of `delivery.critical_path_method`'s Method
  Contract (methods/contracts/delivery.critical_path_method.contract.yaml,
  `outputs: [CriticalPathAnalysisRecord]`). F22 PM/Delivery/Governance
  family (Atlas L919 table row; dedicated §12.41, L3103-3109).

  Real invariants (RUNTIME, not all declaratively expressible here -- same
  disclosed-gap class as `causal-dag-analysis.schema.yaml`'s own
  `acyclic_verified` precedent): (a) every per-task
  earliest_start/earliest_finish/latest_start/latest_finish/slack value is
  the genuine output of a forward/backward pass over `tasks[]`'s own
  duration/depends_on edges, never asserted; (b) `critical_path` is an
  ACTUAL longest chain -- every task on it has slack == 0, consecutive
  entries are linked by a real depends_on edge, and the sum of their
  durations equals `project_duration`. `ai_lego/modules/delivery/
  critical_path_method.py` enforces both at construction time (via
  `ai_lego.compute.critical_path.forward_backward_pass.compute_critical_path`,
  the sole Trusted Compute producer of these fields) and an independent
  gate that recomputes from raw task_id/duration/depends_on fields alone.
  Limitation carried verbatim from Atlas §12.41: resource constraints
  require a separate resource-leveling/capacity model, explicitly OUT OF
  SCOPE here.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F22 PM/Delivery/Governance table, Critical Path Method row (L919)"
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §12.41 (L3103-3109)"
  - "methods/contracts/delivery.critical_path_method.contract.yaml (outputs, preconditions, quality)"

decided_by: >
  No ADR governs this file. Direct transcription of Atlas L919/§12.41's
  own forward/backward-pass pipeline plus low-risk, disclosed compilation
  choices (the CPM- prefix, integer-only durations, deterministic
  tie-breaking).

compilation_decisions:
  - question: "duration: integer, or a real/fractional number?"
    decision: "Non-negative integer. Keeps forward/backward-pass arithmetic exact -- a fractional duration would introduce floating-point epsilon-tolerance concerns Atlas never addresses, out of scope like the method's own stated resource-leveling exclusion."
  - question: "Multiple tied longest chains can exist (diamond DAGs) -- which one does `critical_path` declare?"
    decision: "Deterministic tie-break: the sink task achieving the makespan with the lexicographically smallest task_id, then at each backward step the lexicographically smallest zero-slack predecessor whose earliest_finish meets the current task's earliest_start. Reproducible; Atlas gives no tie-break rule of its own."
  - question: "Can a caller supply earliest_start/earliest_finish/latest_start/latest_finish/slack/critical_path/project_duration directly?"
    decision: "No. additionalProperties:false on each tasks[] entry rejects any of these as builder INPUT (see method module `_raw_task_problem`) -- they exist only as this method's own computed OUTPUT, same 'only the algorithm may produce it' discipline `causal-dag-analysis.schema.yaml`'s `acyclic_verified: const:true` already establishes."

type: object
additionalProperties: false
required: [id, version, tasks, critical_path, project_duration, provenance]
properties:

  id:
    type: string
    pattern: "^CPM-"
    description: "NEW DESIGN. Same id-prefix convention as every sibling record schema."

  version:
    type: string

  generated_by_method:
    type: string
    default: "delivery.critical_path_method"

  tasks:
    type: array
    minItems: 1
    description: >
      Every declared task plus its computed forward/backward-pass
      results. RUNTIME invariant: every computed field here is the
      genuine output of compute_critical_path over this same array's own
      task_id/duration/depends_on edges -- see module description above.
    items:
      type: object
      additionalProperties: false
      required: [task_id, duration, depends_on, earliest_start, earliest_finish, latest_start, latest_finish, slack]
      properties:
        task_id: {type: string, minLength: 1}
        duration: {type: integer, minimum: 0}
        depends_on:
          type: array
          items: {type: string, minLength: 1}
        earliest_start: {type: integer, minimum: 0}
        earliest_finish: {type: integer, minimum: 0}
        latest_start: {type: integer, minimum: 0}
        latest_finish: {type: integer, minimum: 0}
        slack: {type: integer, minimum: 0}

  critical_path:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
    description: "RUNTIME invariant: an ACTUAL longest zero-slack chain through tasks[] -- see module description above."

  project_duration:
    type: integer
    minimum: 0
    description: "The project makespan -- max(earliest_finish) over tasks[], RUNTIME-computed."

  computation_provenance_ref:
    type: string
    default: "ai_lego.compute.critical_path.forward_backward_pass.compute_critical_path"

  provenance:
    description: "Overall record provenance -- record-level only, same convention every sibling typed-object schema in this directory uses."
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"

examples:
  - description: "4-task diamond DAG: A->B->D and A->C->D, B longer than C -- critical path is A,B,D; C carries slack 3"
    value:
      id: "CPM-2026-09-12-001"
      version: "1.0.0"
      generated_by_method: "delivery.critical_path_method"
      tasks:
        - {task_id: "A", duration: 2, depends_on: [], earliest_start: 0, earliest_finish: 2, latest_start: 0, latest_finish: 2, slack: 0}
        - {task_id: "B", duration: 5, depends_on: ["A"], earliest_start: 2, earliest_finish: 7, latest_start: 2, latest_finish: 7, slack: 0}
        - {task_id: "C", duration: 2, depends_on: ["A"], earliest_start: 2, earliest_finish: 4, latest_start: 5, latest_finish: 7, slack: 3}
        - {task_id: "D", duration: 3, depends_on: ["B", "C"], earliest_start: 7, earliest_finish: 10, latest_start: 7, latest_finish: 10, slack: 0}
      critical_path: ["A", "B", "D"]
      project_duration: 10
      computation_provenance_ref: "ai_lego.compute.critical_path.forward_backward_pass.compute_critical_path"
      provenance: {epistemic_type: CALCULATED_RESULT, authorship_state: AI_GENERATED, locked: null}

open_questions:
  - "OQ-CPM-1: resource leveling / capacity constraints are explicitly out of scope per Atlas §12.41's own stated limitation -- a future revision would need a separate resource model, not an extension of this schema.（owner: operator）"

verification:
  method: >
    Read Atlas F22 table Critical Path Method row (L919) and dedicated
    §12.41 (L3103-3109) directly. Grepped
    `agency-os/docs/AI_LEGO_Cognitive_Engineering_OS` and
    `Projects/internal/cognitive-engineering-os` case-insensitively for
    "critical.path"/"critical_path"/"cpm" before writing -- zero
    pre-existing `delivery.*` implementation or schema-title overlap
    (hits were Atlas/registry cross-references and unrelated "critical
    path" prose in `decomposition.wbs`/`devops_sre.capacity_model`).
    Validated against jsonschema Draft202012Validator via
    tests/unit/test_critical_path_method.py.
  note: >
    No mother document was modified. The forward/backward-pass pipeline
    is transcribed directly from Atlas L919/§12.41. Integer-only
    duration, the deterministic tie-break rule, and the
    computed-fields-are-output-only design are this file's own compiled
    structure, disclosed above.

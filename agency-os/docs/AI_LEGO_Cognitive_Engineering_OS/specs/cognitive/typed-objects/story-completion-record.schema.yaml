$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/story-completion-record.schema.yaml"
title: Story Completion Record
version: "1.0.0"
status: ACTIVE

description: >
  `StoryCompletionRecord` -- output of `art_therapy.story_completion` (故事延續). An unfinished stem, the client's continuation, the characters and the inner roles they carry; optional felt_dynamics. Runtime invariants beyond this
  schema live in ai_lego/modules/art_therapy/story_completion.py.

source_of_truth_for:
  - "methods/contracts/art_therapy.story_completion.contract.yaml"

decided_by: "Operator directive 2026-09-17; no ADR."

type: object
additionalProperties: false
required: [id, version, story_stem, continuation, characters, provenance]
properties:
  id: { type: string, pattern: "^STORYC-" }
  version: { type: string }
  generated_by_method: { type: string, default: "art_therapy.story_completion" }
  story_stem: { type: string, minLength: 1 }
  continuation: { type: string, minLength: 1 }
  characters:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, name, inner_role]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        inner_role: { type: string, minLength: 1 }
  felt_dynamics:
    type: array
    minItems: 1
    items: { type: string, minLength: 1 }
  provenance:
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"

examples:
  - description: "A stem about a locked door, continued"
    value:
      id: "STORYC-2026-09-17-001"
      version: "1.0.0"
      generated_by_method: "art_therapy.story_completion"
      story_stem: "她站在一扇上鎖的門前，手裡握著一把不知道能不能用的鑰匙……"
      continuation: "她試了，門開了一條縫，裡面是小時候的畫室。"
      characters:
        - { id: "C1", name: "她", inner_role: "現在的我" }
        - { id: "C2", name: "畫室", inner_role: "被遺忘的創造力" }
      felt_dynamics: ["猶豫", "鬆一口氣"]
      provenance: { epistemic_type: HUMAN_OPINION, authorship_state: HUMAN_ORIGINAL, locked: null }

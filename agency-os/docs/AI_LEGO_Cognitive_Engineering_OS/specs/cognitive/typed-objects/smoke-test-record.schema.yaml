$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/smoke-test-record.schema.yaml"
title: Smoke Test Experiment
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of `SmokeTestExperiment` -- the
  declared `outputs` of `experiment.smoke_test`'s Method Contract
  (methods/contracts/experiment.smoke_test.contract.yaml, `outputs:
  [SmokeTestExperiment]`). F15 experiment & validation family (Atlas L745).
  Real invariants (RUNTIME, not schema-expressible cross-field checks): (a)
  `threshold_declared_at` strictly earlier than `measured_at`
  (pre-registration); (b) `signup_or_preorder_threshold` a positive integer;
  (c) `decision` equals GO iff `measured_signups>=threshold` else NO_GO.
  `ai_lego/modules/experiment/smoke_test.py` enforces all three at
  construction and an independent gate.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F15 table, Smoke Test row (L745)"
  - "methods/contracts/experiment.smoke_test.contract.yaml (outputs, preconditions, quality)"

decided_by: >
  No ADR governs this file. Direct transcription of Atlas L745's own
  threshold/decision pipeline plus low-risk, disclosed compilation choices
  (the SMOKETEST- prefix, record-level-only provenance, the timestamp-pair
  pre-registration mechanism).

compilation_decisions:
  - question: "threshold_declared_at < measured_at: JSON Schema keyword, or runtime invariant?"
    decision: "Runtime invariant -- JSON Schema 2020-12 has no native cross-field timestamp-ordering keyword, same gap class cross-impact-analysis.schema.yaml's own matrix-completeness precedent discloses."
  - question: "decision == f(measured_signups, threshold): schema enum + runtime cross-check, or a free-text field?"
    decision: "Schema enum [GO, NO_GO] (closed vocabulary) PLUS a runtime cross-check against measured_signups/threshold -- a smoke test's entire point is a pre-registered decision instrument, not an unconstrained label."

type: object
additionalProperties: false
required: [id, version, offer_description, signup_or_preorder_threshold, threshold_declared_at, measured_signups, measured_at, decision, provenance]
properties:

  id:
    type: string
    pattern: "^SMOKETEST-"
    description: "NEW DESIGN. Same id-prefix convention as every sibling record schema."

  version:
    type: string

  generated_by_method:
    type: string
    default: "experiment.smoke_test"

  offer_description:
    type: string
    minLength: 1
    description: "The landing page / ad / offer being smoke-tested."

  signup_or_preorder_threshold:
    type: integer
    minimum: 1
    description: "RUNTIME invariant: must be a positive integer -- the pre-registered go/no-go bar."

  threshold_declared_at:
    type: string
    minLength: 1
    description: "ISO-8601 timestamp. RUNTIME invariant: strictly earlier than measured_at (pre-registration)."

  measured_signups:
    type: integer
    minimum: 0
    description: "The actual signup/preorder count observed."

  measured_at:
    type: string
    minLength: 1
    description: "ISO-8601 timestamp. RUNTIME invariant: strictly later than threshold_declared_at."

  decision:
    type: string
    enum: [GO, NO_GO]
    description: "RUNTIME invariant: must equal GO iff measured_signups >= signup_or_preorder_threshold, else NO_GO."

  provenance:
    description: "Overall record provenance -- record-level only, same convention every sibling typed-object schema in this directory uses for a single coherent record."
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"

examples:
  - description: "A pre-registered smoke test that clears its own threshold"
    value:
      id: "SMOKETEST-2026-09-12-001"
      version: "1.0.0"
      generated_by_method: "experiment.smoke_test"
      offer_description: "「AI 週報自動生成」預售頁，Facebook 廣告導流"
      signup_or_preorder_threshold: 100
      threshold_declared_at: "2026-09-01T00:00:00Z"
      measured_signups: 143
      measured_at: "2026-09-08T00:00:00Z"
      decision: "GO"
      provenance: {epistemic_type: SOURCE_FACT, authorship_state: HUMAN_ORIGINAL, locked: null}

open_questions:
  - "OQ-SMOKETESTRECORD-1: signup vs preorder are not separately typed fields (Atlas's own row names both) -- should a future revision split them?（owner: operator）"

verification:
  method: >
    Read Atlas F15 table, Smoke Test row (L745) directly. Grepped
    `agency-os/docs/AI_LEGO_Cognitive_Engineering_OS` and
    `Projects/internal/cognitive-engineering-os` case-insensitively for
    "smoke test"/"smoketest" and every schema title before writing -- only
    hits were the repo's own unrelated `scripts/smoke-test.ps1` governance
    skill and generic "smoke test" mentions inside event-tree/fault-tree/
    pdca-cycle typed-object descriptions (a testing-strategy noun, not this
    method); zero pre-existing implementation or schema title overlap.
    Validated against jsonschema Draft202012Validator via
    tests/unit/test_smoke_test.py.
  note: >
    No mother document was modified. The SMOKETEST- prefix, the
    timestamp-pair pre-registration mechanism, and the structurally-checked
    decision field are this file's own compiled structure, disclosed above.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/stakeholder-raci.schema.yaml"
title: RACI Matrix
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of `RaciMatrix` -- the declared `outputs` of `stakeholders.raci`'s
  Method Contract (methods/contracts/stakeholders.raci.contract.yaml, `outputs: [RaciMatrix]`). Atlas cites this
  method ONCE: F07 table row (L491: "RACI｜明確 R/A/C/I｜每 task 指定責任｜降低責任模糊").

  Field provenance:
    * `tasks[].task_name` -- L491's own "每 task" framing, REPORTED content.
    * `tasks[].assignments[].stakeholder_name` / `.role` -- L491's own "R/A/C/I" role set, a closed 4-value
      enum, per assignment.
    * The exactly-one-Accountable / at-least-one-Responsible rule (L491's own "降低責任模糊" benefit,
      mechanized) is a RUNTIME-ONLY invariant, NOT expressed in this schema -- see compilation_decisions.
    * `provenance` -- RECORD-LEVEL ONLY, same batch-wide placement `jtbd-statement.schema.yaml`/
      `persona-profile.schema.yaml` already establish for an adjacent family.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F07 tool table, RACI row (L491)"
  - "methods/contracts/stakeholders.raci.contract.yaml (outputs, preconditions, quality)"
  - "specs/cognitive/typed-objects/bcg-matrix-analysis.schema.yaml -- nested non-empty-list, runtime-only cross-item-invariant precedent (this file's primary structural template)"

decided_by: >
  No ADR governs this file. Same class every sibling typed-object schema in this directory documents: a direct
  transcription of Atlas L491's own bare table row plus low-risk, disclosed compilation choices (the nested
  tasks[].assignments[] shape, the SRACI- id prefix, record-level-only provenance).

compilation_decisions:
  - question: "Flat per-task {stakeholder_name, role} list, or a wider stakeholder x task grid object?"
    decision: "Nested tasks[].assignments[] array-of-arrays shape -- matches L491's own 'each task' framing directly; a grid is a rendering choice, not this record's own data shape."
  - question: "additionalProperties: false at the top level and on both the tasks[] and assignments[] item schemas?"
    decision: "Yes, all three -- baseline hygiene this directory converges on, set correctly from the start."
  - question: "Enforce the exactly-one-Accountable / at-least-one-Responsible rule via JSON Schema contains/minContains/maxContains, or leave it runtime-only?"
    decision: "Runtime-only (ai_lego/modules/stakeholders/raci.py builder + independent gate) -- same restraint bcg-matrix-analysis.schema.yaml's own OQ-BCGMATRIXANALYSIS-1 already applies to a cross-item computed invariant; this schema keeps `role` a closed enum but does not attempt the cross-assignment count rule."
  - question: "id prefix RACI- (bare) or SRACI-?"
    decision: "SRACI- -- disambiguates from method-inventory.yaml's own pending F22 pm-governance 'RACI (delivery)' entry (L1365-1369), a different, still-unbuilt future method. See method contract's own compilation_decisions."

type: object
required: [id, version, provenance, tasks]
additionalProperties: false
properties:

  id:
    type: string
    pattern: "^SRACI-"
    description: "NEW DESIGN. Deliberately NOT bare RACI- -- see compilation_decisions."

  version:
    type: string

  generated_by_method:
    type: string
    default: "stakeholders.raci"

  tasks:
    type: array
    minItems: 1
    description: >
      L491's own "每 task 指定責任" framing: one entry per task under RACI review. Non-empty -- a matrix naming
      zero tasks has not actually assigned any responsibility (this method's own defining purpose). Enforced by
      ai_lego/modules/stakeholders/raci.py at both the builder and an independent gate.
    items:
      type: object
      required: [task_name, assignments]
      additionalProperties: false
      properties:
        task_name:
          type: string
          minLength: 1
          pattern: "\\S"
          description: "REPORTED content -- names the specific task under responsibility review."
        assignments:
          type: array
          minItems: 1
          description: >
            One entry per stakeholder assigned a role on this task. Non-empty -- a task with zero assignments
            has not actually had responsibility assigned to anyone. The runtime-only exactly-1-Accountable /
            at-least-1-Responsible rule applies across this array (see compilation_decisions) -- not visible to
            this schema alone.
          items:
            type: object
            required: [stakeholder_name, role]
            additionalProperties: false
            properties:
              stakeholder_name:
                type: string
                minLength: 1
                pattern: "\\S"
                description: "REPORTED content -- names the specific stakeholder holding this role on this task."
              role:
                type: string
                enum: [R, A, C, I]
                description: >
                  L491's own closed "R/A/C/I" role set -- Responsible (does the work), Accountable (answerable
                  for the outcome, exactly 1 per task), Consulted (two-way input sought), Informed (kept
                  up-to-date, one-way). Never a computed value -- a disclosed assignment.

  provenance:
    description: "Overall record provenance -- same full provenance_record pattern every sibling typed-object schema in this directory uses. RECORD-LEVEL ONLY, see compilation_decisions."
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"

examples:
  - description: "A RACI matrix for a small product launch, 2 tasks, showing R/A/C/I and a task where one person is both Responsible and Accountable (legitimate RACI practice)"
    value:
      id: "SRACI-2026-09-11-001"
      version: "1.0.0"
      generated_by_method: "stakeholders.raci"
      tasks:
        - task_name: "撰寫發佈公告文案"
          assignments:
            - stakeholder_name: "行銷經理"
              role: A
            - stakeholder_name: "文案編輯"
              role: R
            - stakeholder_name: "產品負責人"
              role: C
            - stakeholder_name: "客服團隊"
              role: I
        - task_name: "核准最終定價"
          assignments:
            - stakeholder_name: "產品負責人"
              role: R
            - stakeholder_name: "產品負責人"
              role: A
            - stakeholder_name: "財務長"
              role: C
      provenance: { epistemic_type: DECISION, authorship_state: HUMAN_APPROVED, locked: null }

open_questions:
  - id: "OQ-STAKEHOLDERRACI-1"
    question: "The exactly-1-Accountable / at-least-1-Responsible rule is enforced only at the runtime builder+gate layer, not expressible in plain JSON Schema without contains/minContains/maxContains -- should a future revision add that JSON Schema-level constraint? Same open question bcg-matrix-analysis.schema.yaml's own OQ-BCGMATRIXANALYSIS-1 already discloses for a cross-item computed invariant."
    owner: "operator"
    blocks: "nothing in this file's own validity"
  - id: "OQ-STAKEHOLDERRACI-2"
    question: "No stakeholder-identity cross-reference exists (stakeholder_name is a plain string, not a resolvable reference into a future StakeholderMap/Power-Interest typed-object) -- should a future revision add one once a sibling F07 method builds such a record?"
    owner: "operator, or whoever next builds a consuming F07 method against this record"
    blocks: "nothing in this file's own validity"

verification:
  method: >
    Read Atlas F07 table row (L491) directly. Grepped the whole Atlas file case-insensitively for "raci" --
    confirmed L491 is the only real hit for this method. Cross-checked against
    methods/contracts/stakeholders.raci.contract.yaml's own outputs/preconditions/quality. Read
    bcg-matrix-analysis.schema.yaml (nested non-empty-list, runtime-only cross-item-invariant precedent) in full
    before writing this file. Grepped the whole `agency-os/docs/AI_LEGO_Cognitive_Engineering_OS` and
    `Projects/internal/cognitive-engineering-os` trees case-insensitively for "raci" before writing any of this
    method's own files -- confirmed zero pre-existing `stakeholders.raci`/`RaciMatrix` implementation (only
    method-inventory.yaml's own unrelated, unbuilt F22 backlog row). Validated against jsonschema
    Draft202012Validator via tests/unit/test_raci.py (required fields present, id pattern satisfied,
    additionalProperties:false present at all 3 object levels, role enum closed, embedded example resolved
    through its real $ref to epistemic-label.schema.yaml, negative controls for a smuggled top-level key, an
    empty tasks/assignments array, an invalid role value, and an empty task_name/stakeholder_name string).
  note: >
    No mother document was modified. `tasks[].task_name` and `tasks[].assignments[].role`'s closed R/A/C/I enum
    are transcribed directly from Atlas L491's own table row. The nested tasks[].assignments[] shape, the
    SRACI- id prefix, the record-level-only provenance placement, and the deliberate runtime-only (not
    JSON-Schema-level) enforcement of the exactly-1-Accountable / at-least-1-Responsible rule are this file's
    own compiled structure, disclosed above, not textually cited from Atlas.

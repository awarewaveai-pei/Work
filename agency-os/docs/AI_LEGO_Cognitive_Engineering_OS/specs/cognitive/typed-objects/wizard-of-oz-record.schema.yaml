$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/wizard-of-oz-record.schema.yaml"
title: Wizard of Oz Record
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of `WizardOfOzRecord` -- the
  declared `outputs` of `experiment.wizard_of_oz`'s Method Contract
  (methods/contracts/experiment.wizard_of_oz.contract.yaml, `outputs:
  [WizardOfOzRecord]`). F15 experiment & validation family (Atlas L743:
  "mock automation->human backend").

  Real invariants (RUNTIME, not all declaratively expressible here, same
  disclosed-gap class as `concierge-test-record.schema.yaml`'s own
  zero-automation precedent): (a) FRONT-END CONTRAST -- `front_end.
  presented_as_automated` must be literally `true`; (b) BACK-END CONTRAST
  -- `back_end.actually_human_operated` must be literally `true`
  (together, these are the defining contrast that distinguishes this
  method from `experiment.concierge_test`, which has no automated-looking
  front end at all); (c) SELF-DISCLOSURE -- `disclosure.faked_components`
  must name at least one faked component. `ai_lego/modules/experiment/
  wizard_of_oz.py` enforces all three at construction time and an
  independent gate.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F15 實驗與驗證 table, Wizard of Oz row (L743)"
  - "methods/contracts/experiment.wizard_of_oz.contract.yaml (outputs, preconditions, quality)"

decided_by: >
  No ADR governs this file. Direct transcription of Atlas L743's own
  two-stage pipeline plus low-risk, disclosed compilation choices (the
  WOZ- prefix, record-level-only provenance, disclosed_to enum).

compilation_decisions:
  - question: "front_end/back_end contrast: free-text description only, or an explicit boolean flag checked for literal true?"
    decision: "An explicit boolean flag (presented_as_automated / actually_human_operated) checked for literal `true`, not merely truthy or narrative. Atlas L743's own row IS the contrast (前台自動、後台人工) -- a hand-tamperable field the gate can re-derive, not an unchecked label, same discipline this corpus's OODA stage-order invariant establishes."
  - question: "disclosure.disclosed_to: an open string, or an enum of disclosure timings?"
    decision: "Enum {INTERNAL_TEAM_ONLY, WILL_DISCLOSE_TO_USER_AT_STUDY_END, NEVER_DISCLOSED_TO_USER} -- an open string would let an ambiguous half-answer (e.g. 'eventually') stand in for a real disclosure-timing commitment."

type: object
additionalProperties: false
required: [id, version, interaction_description, front_end, back_end, disclosure, provenance]
properties:

  id:
    type: string
    pattern: "^WOZ-"
    description: "NEW DESIGN. Same id-prefix convention as every sibling record schema."

  version:
    type: string

  generated_by_method:
    type: string
    default: "experiment.wizard_of_oz"

  interaction_description:
    type: string
    minLength: 1
    description: "The candidate interaction under test. Atlas L743's own pipeline is scoped to a single mocked interaction, not a whole product."

  front_end:
    type: object
    additionalProperties: false
    required: [presented_as_automated, description]
    description: "RUNTIME invariant: presented_as_automated must be literally true -- Atlas's own '前台自動' half."
    properties:
      presented_as_automated: {type: boolean}
      description: {type: string, minLength: 1}

  back_end:
    type: object
    additionalProperties: false
    required: [actually_human_operated, operator_role, description]
    description: "RUNTIME invariant: actually_human_operated must be literally true -- Atlas's own '後台人工' half."
    properties:
      actually_human_operated: {type: boolean}
      operator_role: {type: string, minLength: 1}
      description: {type: string, minLength: 1}

  disclosure:
    type: object
    additionalProperties: false
    required: [faked_components, real_components, disclosed_to]
    description: "RUNTIME invariant: faked_components must be non-empty -- the record must name what it fakes, not just imply it (see module description)."
    properties:
      faked_components:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      real_components:
        type: array
        items: {type: string, minLength: 1}
      disclosed_to:
        type: string
        enum: [INTERNAL_TEAM_ONLY, WILL_DISCLOSE_TO_USER_AT_STUDY_END, NEVER_DISCLOSED_TO_USER]

  provenance:
    description: "Overall record provenance -- record-level only, same convention every sibling typed-object schema in this directory uses."
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"

examples:
  - description: "An AI-scheduling assistant mocked front-end, a human ops analyst actually picking every slot behind the scenes"
    value:
      id: "WOZ-2026-09-12-001"
      version: "1.0.0"
      generated_by_method: "experiment.wizard_of_oz"
      interaction_description: "User asks a chat widget to 'find me a meeting slot next week' and receives a proposed time"
      front_end:
        presented_as_automated: true
        description: "Chat widget labeled 'AI Scheduling Assistant' with a typing indicator and instant-looking replies"
      back_end:
        actually_human_operated: true
        operator_role: "ops analyst manually reading the calendar and typing the reply"
        description: "A human reads the request, checks the real calendar, and types the proposed slot through an internal console"
      disclosure:
        faked_components: ["the 'AI' scheduling logic (no model runs; a human decides every slot)", "the typing-indicator latency (added to look automated)"]
        real_components: ["the underlying calendar data", "the actual proposed meeting slot"]
        disclosed_to: WILL_DISCLOSE_TO_USER_AT_STUDY_END
      provenance: {epistemic_type: EVIDENCE, authorship_state: HUMAN_ORIGINAL, locked: null}

open_questions:
  - "OQ-WIZARDOFOZ-1: real_components[] is optional-in-practice (may legally be empty) -- should a future revision require at least 1 to force the record to also name what is NOT faked?（owner: operator）"

verification:
  method: >
    Read Atlas F15 table, Wizard of Oz row (L743) directly. Grepped
    `agency-os/docs/AI_LEGO_Cognitive_Engineering_OS` and
    `Projects/internal/cognitive-engineering-os` case-insensitively for
    "wizard of oz"/"wizard_of_oz"/"mock automation" before writing -- zero
    pre-existing implementation or schema title overlap found. Validated
    against jsonschema Draft202012Validator via
    tests/unit/test_wizard_of_oz.py.
  note: >
    No mother document was modified. The two-stage pipeline is
    transcribed directly from Atlas L743. The WOZ- prefix, disclosed_to
    enum, and runtime-invariant placement of the front/back contrast and
    self-disclosure checks are this file's own compiled structure,
    disclosed above.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/objective-tree.schema.yaml"
title: Objective Tree
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of `ObjectiveTree` -- the declared `outputs` of
  `decomposition.objective_tree`'s Method Contract (methods/contracts/decomposition.objective_tree.
  contract.yaml, `outputs: [ObjectiveTree]`). Atlas cites this method ONCE: F02 tool table row
  (L367: "Objective Tree｜把 Problem Tree 轉目標｜負面狀態逐項轉正向｜直接連到方案設計｜Theory of
  Change") -- the thinnest possible citation class, no dedicated section.

  Field provenance:
    * `source_problem_items` -- a self-contained, structurally-compatible Problem-Tree-shaped input
      (id/statement/polarity), NOT an import of decomposition.problem_tree's own record type (see
      method contract's own compilation_decisions on the concurrent-build-order reason).
    * `objectives` -- Atlas's own "負面狀態逐項轉正向" (each negative state converted to positive,
      item by item), made real as a GENUINE_COMPUTE bijective coverage of source_problem_items
      (every source item referenced by EXACTLY one objective) plus an anti-passthrough guard.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F02 tool table, Objective Tree row (L367)"
  - "methods/contracts/decomposition.objective_tree.contract.yaml (outputs, preconditions, quality)"
  - "specs/cognitive/typed-objects/tows-matrix.schema.yaml -- referential-integrity precedent (this file's coverage invariant is a stricter, bijective version of the same discipline)"

decided_by: >
  No ADR governs this file. Same class every sibling typed-object schema in this directory
  documents: a direct transcription of Atlas L367's own bare method description plus low-risk,
  disclosed compilation choices, including the exact task-mandated shape.

compilation_decisions:
  - question: "additionalProperties: false at the top level, on source_problem_items[] items, and on objectives[] items?"
    decision: "Yes, all three -- baseline hygiene this directory converges on, set correctly from the start, and task-mandated for this method."
  - question: "Should polarity be an open string or a closed CAUSE/EFFECT enum?"
    decision: "Closed 2-value enum, task-mandated -- a self-contained Problem-Tree-shaped input has exactly these two node kinds (causes feed the problem, effects flow from it)."
  - question: "Should source_problem_items[].id / objectives[].id require a specific prefix, matching ObjectiveTree's own OBJTREE- prefix?"
    decision: "No -- these are caller-assigned identifiers scoped to this single record (referenced only by objectives[].source_item_ref within the SAME record), not globally-resolved cross-record ids like the top-level ObjectiveTree id itself; no citation or cross-record lookup need justifies a prefix rule here."
  - question: "Does objectives[].source_item_ref's bijective coverage belong in this schema as a JSON Schema constraint, or only in the runtime gate?"
    decision: "Runtime gate only -- plain JSON Schema (even with if/then) cannot express a set-equality constraint between two array fields' own values; same limitation every sibling GENUINE_COMPUTE schema in this directory already discloses (see open_questions)."

type: object
required: [id, version, source_problem_items, objectives]
additionalProperties: false
properties:

  id:
    type: string
    pattern: "^OBJTREE-"
    description: "NEW DESIGN. Same id-prefix convention rationale as bcg-matrix-analysis.schema.yaml's own BCG- prefix."

  version:
    type: string

  generated_by_method:
    type: string
    default: "decomposition.objective_tree"

  source_problem_items:
    type: array
    minItems: 1
    description: >
      A self-contained, structurally-compatible Problem-Tree-shaped input (NOT an import of
      decomposition.problem_tree's own record type -- see method contract's own
      compilation_decisions). Every entry here must be referenced by EXACTLY one objectives[] entry
      (enforced by ai_lego/modules/decomposition/objective_tree.py at both the builder and an
      independent gate).
    items:
      type: object
      required: [id, statement, polarity]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          pattern: "\\S"
          description: "Record-scoped identifier, referenced by objectives[].source_item_ref within this SAME record."
        statement:
          type: string
          minLength: 1
          pattern: "\\S"
          description: "The negative-state statement (a Problem Tree cause or effect) this method converts into a positive objective."
        polarity:
          type: string
          enum: [CAUSE, EFFECT]
          description: "Which side of the Problem Tree this item came from -- DISCLOSED, not computed."

  objectives:
    type: array
    minItems: 1
    description: >
      Atlas's own "負面狀態逐項轉正向" made real: one positive objective per source_problem_items
      entry. GENUINE_COMPUTE bijective coverage -- the set of objectives[].source_item_ref values
      must equal EXACTLY the set of source_problem_items[].id values (enforced by
      ai_lego/modules/decomposition/objective_tree.py at both the builder and an independent gate).
    items:
      type: object
      required: [id, source_item_ref, positive_statement]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          pattern: "\\S"
          description: "Record-scoped identifier for this objective."
        source_item_ref:
          type: string
          minLength: 1
          pattern: "\\S"
          description: "MUST resolve to a real source_problem_items[].id in this SAME record -- referential integrity re-derived by the gate from raw fields, never trusted from a stored flag."
        positive_statement:
          type: string
          minLength: 1
          pattern: "\\S"
          description: >
            REQUIRED, non-empty, and MUST NOT be character-for-character identical to its
            referenced source item's own `statement` -- Atlas's own point is transformation, not
            passthrough. See method contract's own compilation_decisions on the cheap-structural
            (not semantic) nature of this check.

examples:
  - description: "An Objective Tree converting 3 Problem Tree items (2 causes, 1 effect) into 3 positive objectives"
    value:
      id: "OBJTREE-2026-09-11-001"
      version: "1.0.0"
      generated_by_method: "decomposition.objective_tree"
      source_problem_items:
        - id: "PT-1"
          statement: "第一線客服人員流動率過高"
          polarity: CAUSE
        - id: "PT-2"
          statement: "客服系統回應速度緩慢"
          polarity: CAUSE
        - id: "PT-3"
          statement: "客戶滿意度持續下滑"
          polarity: EFFECT
      objectives:
        - id: "OBJ-1"
          source_item_ref: "PT-1"
          positive_statement: "提升第一線客服人員留任率"
        - id: "OBJ-2"
          source_item_ref: "PT-2"
          positive_statement: "縮短客服系統平均回應時間"
        - id: "OBJ-3"
          source_item_ref: "PT-3"
          positive_statement: "提升客戶滿意度至目標水準以上"

open_questions:
  - id: "OQ-OBJECTIVETREE-1"
    question: "No provenance field exists anywhere in this shape (top-level or per-item), diverging from every sibling typed-object's own convention -- task-mandated exact shape, disclosed in the method contract's own open_questions (owner: operator)."
  - id: "OQ-OBJECTIVETREE-2"
    question: "The bijective coverage invariant is a runtime-only constraint (plain JSON Schema has no cross-array set-equality check) -- should a future pass add something stronger once JSON Schema tooling supports it? Same open question bcg-matrix-analysis.schema.yaml's own OQ-BCGMATRIXANALYSIS-1 already discloses for a different computed-value shape. (owner: operator)"

verification:
  method: >
    Read Atlas F02 table row (L367) directly. Grepped the whole Atlas file case-insensitively for
    "objective tree" -- confirmed 2 real hits (F02's own row L367, and the Problem Tree row's L366
    最佳搭配 column naming it), no dedicated section. Cross-checked against
    methods/contracts/decomposition.objective_tree.contract.yaml's own outputs/preconditions/
    quality. Read bcg-matrix-analysis.schema.yaml (non-empty-list, per-item shape precedent) and
    tows-matrix.schema.yaml (referential-integrity precedent, generalized here to a stricter
    bijective version) in full as shape precedent before writing this file. Validated against
    jsonschema Draft202012Validator via a standalone script (required fields present, id pattern
    satisfied, polarity enum closed, additionalProperties:false present at all 3 levels from the
    start, negative controls for a smuggled top-level key, a smuggled source_problem_items[] key, a
    smuggled objectives[] key, an empty source_problem_items array, and an empty objectives array).
  note: >
    The exact field shape ({id, version, generated_by_method, source_problem_items, objectives}, no
    provenance anywhere) is this task's own explicit design spec, not independently invented by this
    file -- disclosed in compilation_decisions and open_questions. No mother document was modified
    to produce this file.

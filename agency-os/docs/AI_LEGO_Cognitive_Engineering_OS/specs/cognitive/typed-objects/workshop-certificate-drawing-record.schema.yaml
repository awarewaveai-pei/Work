$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/workshop-certificate-drawing-record.schema.yaml"
title: Workshop Certificate Drawing Record
version: "1.0.0"
status: ACTIVE

description: >
  `WorkshopCertificateDrawingRecord` -- output of `art_therapy.workshop_certificate_drawing` (工作坊證章畫). A ritual closing record: journey title, its milestones, a blessing, the sealing date and who drew it. Runtime invariants beyond this
  schema live in ai_lego/modules/art_therapy/workshop_certificate_drawing.py.

source_of_truth_for:
  - "methods/contracts/art_therapy.workshop_certificate_drawing.contract.yaml"

decided_by: "Operator directive 2026-09-17; no ADR."

type: object
additionalProperties: false
required: [id, version, journey_title, milestones, blessing_statement, sealed_on, created_by, provenance]
properties:
  id: { type: string, pattern: "^WCERT-" }
  version: { type: string }
  generated_by_method: { type: string, default: "art_therapy.workshop_certificate_drawing" }
  journey_title: { type: string, minLength: 1 }
  milestones:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
  blessing_statement: { type: string, minLength: 1 }
  sealed_on: { type: string, format: date, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
  created_by: { type: string, minLength: 1 }
  provenance:
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"

examples:
  - description: "Closing an eight-week group"
    value:
      id: "WCERT-2026-09-17-001"
      version: "1.0.0"
      generated_by_method: "art_therapy.workshop_certificate_drawing"
      journey_title: "八週創作療癒團體"
      milestones:
        - { id: "M1", label: "第一次願意分享作品" }
        - { id: "M2", label: "畫出自己的邊界" }
      blessing_statement: "願你記得，窗一直亮著。"
      sealed_on: "2026-09-17"
      created_by: "學員自繪"
      provenance: { epistemic_type: HUMAN_OPINION, authorship_state: HUMAN_ORIGINAL, locked: null }

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/turning-point-analysis-record.schema.yaml"
title: Turning Point Analysis Record
version: "1.0.0"
status: ACTIVE

description: >
  `TurningPointAnalysisRecord` -- output of `art_therapy.turning_point_analysis` (轉折點分析). Dated turning points with the emotion before/after and the belief shift, in chronological order. Runtime invariants beyond this
  schema live in ai_lego/modules/art_therapy/turning_point_analysis.py.

source_of_truth_for:
  - "methods/contracts/art_therapy.turning_point_analysis.contract.yaml"

decided_by: "Operator directive 2026-09-17; no ADR."

type: object
additionalProperties: false
required: [id, version, subject, events, provenance]
properties:
  id: { type: string, pattern: "^TURNPT-" }
  version: { type: string }
  generated_by_method: { type: string, default: "art_therapy.turning_point_analysis" }
  subject: { type: string, minLength: 1 }
  events:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, when, event, emotion_before, emotion_after, belief_shift]
      properties:
        id: { type: string, minLength: 1 }
        when: { type: string, format: date, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        event: { type: string, minLength: 1 }
        emotion_before: { type: string, minLength: 1 }
        emotion_after: { type: string, minLength: 1 }
        belief_shift: { type: string, minLength: 1 }
  provenance:
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"

examples:
  - description: "Two turning points across a decade"
    value:
      id: "TURNPT-2026-09-17-001"
      version: "1.0.0"
      generated_by_method: "art_therapy.turning_point_analysis"
      subject: "我與創作的關係"
      events:
        - { id: "E1", when: "2015-06-01", event: "第一次個展", emotion_before: "害怕被看見", emotion_after: "被接住", belief_shift: "我的作品可以被理解" }
        - { id: "E2", when: "2022-03-15", event: "決定念 EdD", emotion_before: "停滯", emotion_after: "期待又焦慮", belief_shift: "學習可以是我自己的節奏" }
      provenance: { epistemic_type: HUMAN_OPINION, authorship_state: HUMAN_ORIGINAL, locked: null }

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/outcome-roadmap-record.schema.yaml"
title: Outcome Roadmap Record
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of `OutcomeRoadmap` -- the declared
  `outputs` of `delivery.outcome_roadmap`'s Method Contract
  (methods/contracts/delivery.outcome_roadmap.contract.yaml,
  `outputs: [OutcomeRoadmap]`). F22 PM/Delivery/Governance Pack (Atlas L925:
  "themes->outcomes->bets->evidence->review").

  Real invariants (RUNTIME, not all declaratively expressible here, same
  disclosed-gap class as `cross-impact-analysis.schema.yaml`'s own matrix-
  completeness precedent): (a) referential integrity -- every
  `outcomes[].theme_id` resolves to a declared `themes[]` entry; (b) every
  `bets[].outcome_id` resolves to a declared `outcomes[]` entry; (c) no
  duplicate `theme_id`/`outcome_id`/`bet_id` within their own arrays.
  `ai_lego/modules/delivery/outcome_roadmap.py` enforces all of these at both
  construction time and an independent gate.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F22 table row, Outcome Roadmap (L925)"
  - "methods/contracts/delivery.outcome_roadmap.contract.yaml (outputs, preconditions, quality)"

decided_by: >
  No ADR governs this file. Direct transcription of Atlas L925's own 5-stage
  pipeline plus low-risk, disclosed compilation choices (the OROAD- prefix,
  record-level-only provenance, legally-empty bets[]/evidence[]).

compilation_decisions:
  - question: "Referential integrity (outcome->theme, bet->outcome): JSON Schema keyword, or runtime invariant?"
    decision: "Runtime invariant -- JSON Schema 2020-12 cannot cross-check that a nested array field resolves to an id declared in a sibling array declaratively, same gap class as cross-impact-analysis.schema.yaml's own matrix-completeness precedent."
  - question: "Should bets[] require minItems: 1?"
    decision: "No -- see the method contract's own compilation_decisions: an outcome-only roadmap with no committed bets yet is the MORE strategically flexible state L925's own benefit column names, not a malformed one."

type: object
additionalProperties: false
required: [id, version, themes, outcomes, bets, next_review, provenance]
properties:

  id:
    type: string
    pattern: "^OROAD-"
    description: "NEW DESIGN. Same id-prefix convention as every sibling record schema."

  version:
    type: string

  generated_by_method:
    type: string
    default: "delivery.outcome_roadmap"

  themes:
    type: array
    minItems: 1
    description: "Atlas L925's own first pipeline element. RUNTIME invariant: >=1 required, unique theme_id."
    items:
      type: object
      additionalProperties: false
      required: [theme_id, name]
      properties:
        theme_id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }

  outcomes:
    type: array
    minItems: 1
    description: "Atlas L925's own second pipeline element. RUNTIME invariant: >=1 required, unique outcome_id, every theme_id resolves to a declared themes[] entry -- THE structural mechanism enforcing 'outcomes not features' at the theme level."
    items:
      type: object
      additionalProperties: false
      required: [outcome_id, theme_id, description]
      properties:
        outcome_id: { type: string, minLength: 1 }
        theme_id: { type: string, minLength: 1, description: "Must resolve to a declared themes[].theme_id (runtime referential integrity)." }
        description: { type: string, minLength: 1 }

  bets:
    type: array
    description: "Atlas L925's own third pipeline element. RUNTIME invariant: legally empty (see compilation_decisions); every declared entry has a unique bet_id, and its own outcome_id resolves to a declared outcomes[] entry -- the structural mechanism preventing a feature-driven entry from sneaking in under this method's own label."
    items:
      type: object
      additionalProperties: false
      required: [bet_id, outcome_id, description, evidence]
      properties:
        bet_id: { type: string, minLength: 1 }
        outcome_id: { type: string, minLength: 1, description: "Must resolve to a declared outcomes[].outcome_id (runtime referential integrity)." }
        description: { type: string, minLength: 1 }
        evidence:
          type: array
          items: { type: string, minLength: 1 }
          description: "Atlas L925's own fourth pipeline element, modeled per-bet. Legally empty -- an early-stage bet may have no gathered evidence yet."

  next_review:
    type: string
    minLength: 1
    description: "Atlas L925's own fifth pipeline element ('review'). A date or a described trigger for the roadmap's next review."

  provenance:
    description: "Overall record provenance -- record-level only, same convention every sibling typed-object schema in this directory uses."
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"

examples:
  - description: "A 1-theme/2-outcome/2-bet roadmap"
    value:
      id: "OROAD-2026-09-12-001"
      version: "1.0.0"
      generated_by_method: "delivery.outcome_roadmap"
      themes:
        - {theme_id: "T1", name: "客戶自助架站體驗"}
      outcomes:
        - {outcome_id: "O1", theme_id: "T1", description: "新客戶 7 天內完成首次上線"}
        - {outcome_id: "O2", theme_id: "T1", description: "既有客戶自助排除 80% 常見問題"}
      bets:
        - {bet_id: "B1", outcome_id: "O1", description: "一鍵架站精靈", evidence: ["現行手動流程平均 14 天"]}
        - {bet_id: "B2", outcome_id: "O2", description: "自助修復中心", evidence: []}
      next_review: "2026-12-01 或 O1 達成率超過 50% 時"
      provenance: {epistemic_type: DECISION, authorship_state: HUMAN_APPROVED, locked: null}

open_questions:
  - "OQ-OUTCOMEROADMAPRECORD-1: next_review is a bare free-text string, not the closed {mode, trigger} shape delivery.decision_log's own revisit field uses -- see the method contract's own open_questions.（owner: operator）"

verification:
  method: >
    Read Atlas F22 table, Outcome Roadmap row (L925) directly. Grepped
    `agency-os/docs/AI_LEGO_Cognitive_Engineering_OS` and
    `Projects/internal/cognitive-engineering-os` case-insensitively for
    "outcome roadmap"/"outcome_roadmap" and every schema title before
    writing -- zero pre-existing implementation or schema title overlap
    found. Validated against jsonschema Draft202012Validator via
    tests/unit/test_outcome_roadmap.py.
  note: >
    No mother document was modified. The 5-stage pipeline is transcribed
    directly from Atlas L925. The OROAD- prefix, the two-level referential-
    integrity chain, and the legally-empty bets[]/evidence[] fields are this
    file's own compiled structure, disclosed above.

  method: >
    Read Atlas F23 table (L942) and §11.54 (L2440-2465) directly, plus §18.3
    (L4034-4053). Grepped `agency-os/docs/AI_LEGO_Cognitive_Engineering_OS`
    and `Projects/internal/cognitive-engineering-os` case-insensitively for
    "market_admission_control"/"MarketAdmissionRecord" and every schema
    title before writing -- zero pre-existing implementation or schema
    title overlap (pre-existing specs/jurisdiction/pack.schema.yaml is a
    different, Master-Plan-sourced registry object, disclosed in the
    contract's open_questions). Validated against jsonschema
    Draft202012Validator via tests/unit/test_market_admission_control.py.
  note: >
    No mother document was modified. The 7-stage enum and the fail-closed
    rule are transcribed directly from Atlas §11.54. The MADM- prefix and
    the derived-decision field placement are this file's own compiled
    structure, disclosed above.

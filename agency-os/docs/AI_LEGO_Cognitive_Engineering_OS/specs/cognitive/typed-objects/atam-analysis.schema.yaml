$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/atam-analysis.schema.yaml"
title: ATAM Analysis
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of `AtamAnalysis` -- the declared
  `outputs` of `architecture.atam`'s Method Contract
  (methods/contracts/architecture.atam.contract.yaml). Third
  `architecture`-family typed object, structurally closest to
  `red-team-challenge.schema.yaml` (a set of findings each carrying a
  closed-enum category), but for architecture quality-attribute tradeoffs
  rather than security-critique dimensions -- a case of reusing a SHAPE
  pattern (findings + closed category enum), not code, across two
  unrelated methods.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md §11.38 架構權衡分析法（ATAM）, 4 finding categories (L2100-2110)"
  - "methods/contracts/architecture.atam.contract.yaml"

decided_by: "No ADR governs this file. Same class of decision every sibling typed-object schema in this directory documents."

type: object
required: [id, version, architecture_description, findings, provenance]
properties:
  id:
    type: string
    pattern: "^ATAM-"
  version:
    type: string
  generated_by_method:
    type: string
    default: "architecture.atam"
  architecture_description:
    type: string
    minLength: 1
    description: "The architecture (or the specific decision point within it) this analysis examines."
  findings:
    type: array
    minItems: 1
    description: "Atlas L2100-2110's own 4 finding categories."
    items:
      type: object
      required: [id, category, description]
      properties:
        id: {type: string}
        category:
          enum: [sensitivity_point, tradeoff_point, risk, non_risk]
        description: {type: string, minLength: 1}
  provenance:
    description: "epistemic_type is expected to be AI_INFERENCE or HUMAN_OPINION -- an ATAM finding is structured architectural judgment, not a calculated/simulated result."
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"

examples:
  - description: "Encryption-vs-latency tradeoff and a cache-consistency risk -- Atlas's own two worked examples (L2113-2114)"
    value:
      id: "ATAM-2026-09-04-001"
      version: "1.0.0"
      generated_by_method: "architecture.atam"
      architecture_description: "API 層加密強度與快取策略決策"
      findings:
        - {id: "F1", category: tradeoff_point, description: "加密強度提升安全，但提高 latency"}
        - {id: "F2", category: risk, description: "Cache 提高 performance，但增加一致性複雜度"}
      provenance: {epistemic_type: AI_INFERENCE, authorship_state: AI_GENERATED, locked: null}

verification:
  method: "Read Atlas §11.38 directly. Validated against jsonschema Draft202012Validator."
  note: "The 4-value category enum is a direct, complete transcription of Atlas's own cited list. No mother document was modified."

        - branch_number: 3
          branch_theme: "首次價值時刻"
          ideas: ["快速達成第一個成果", "範本庫", "AI 自動建議", "示範資料集", "一鍵匯入", "即時預覽", "成功慶祝動畫", "分享首個成果"]
        - branch_number: 4
          branch_theme: "電子郵件序列"
          ideas: ["歡迎信", "使用秘訣信", "未完成提醒信", "案例分享信", "限時優惠信", "問卷回饋信", "里程碑祝賀信", "重新邀請信"]
        - branch_number: 5
          branch_theme: "客服與支援"
          ideas: ["即時聊天", "FAQ 搜尋", "影片客服", "社群論壇", "工單系統", "AI 客服機器人", "電話支援", "自助知識庫"]
        - branch_number: 6
          branch_theme: "遊戲化機制"
          ideas: ["每日簽到", "進度條", "等級系統", "排行榜", "解鎖獎勵", "連續使用獎勵", "任務清單", "虛擬貨幣"]

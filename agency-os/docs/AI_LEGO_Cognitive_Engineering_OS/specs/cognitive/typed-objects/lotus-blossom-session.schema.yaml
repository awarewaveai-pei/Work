      provenance: { epistemic_type: HYPOTHESIS, authorship_state: AI_SUGGESTED, locked: null }

open_questions:
  - id: "OQ-LOTUSBLOSSOMSESSION-1"
    question: "branches[].branch_number distinctness/completeness (1-8) and ideas[] exact-8-count are both runtime-only invariants (see compilation_decisions) -- should a future pass add JSON Schema if/then per-value-count constraints instead of relying solely on the runtime gate? Same open question ansoff-matrix.schema.yaml's own OQ-ANSOFFMATRIX-2 already discloses for an identical shape. (owner: operator)"
  - id: "OQ-LOTUSBLOSSOMSESSION-2"
    question: "A real Lotus Blossom technique can recurse a 3rd level (each of the 8 sub-themes becoming a new center) -- this schema deliberately stops at 2 levels, matching the method contract's own explicit scope note. (owner: operator, if a 3rd-level variant is ever requested)"

verification:
  method: >
    Read Atlas F03 table row (L384) directly. Grepped the whole Atlas file case-insensitively for "lotus" --
    confirmed exactly 1 real hit, no dedicated section. Cross-checked against methods/contracts/
    divergent.lotus_blossom.contract.yaml's own outputs/preconditions/quality. Read ansoff-matrix.schema.yaml
    and 5w1h-record.schema.yaml in full as shape precedent before writing this file. Validated against
    jsonschema Draft202012Validator via a standalone script (required fields present, id pattern satisfied,
    branch_number enum closed to 1-8, additionalProperties:false present at the top level and the
    branches[] item level, embedded example resolved through its real $ref to epistemic-label.schema.yaml,
    negative controls for a smuggled top-level key, a smuggled branches[] item key, a <8/>8-item branches
    array, and a <8/>8-item ideas array).
  note: >
    `branches`'s 8-count and `ideas`'s nested 8-count are direct (non-ambiguous) transcriptions of Atlas
    L384's own literal "中心→8 分支→各 8 idea". The record-level-only provenance choice, the numeric-slot
    (vs named) closed-set shape, and the deliberate 2-level (not 3-level) scope are compilation decisions,
    disclosed above. No mother document was modified to produce this file.

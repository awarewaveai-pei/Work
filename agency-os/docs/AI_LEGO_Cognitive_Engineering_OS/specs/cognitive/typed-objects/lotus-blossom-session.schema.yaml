$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/lotus-blossom-session.schema.yaml"
title: Lotus Blossom Session
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of `LotusBlossomSession` -- the declared `outputs` of
  `divergent.lotus_blossom`'s Method Contract (methods/contracts/divergent.lotus_blossom.contract.yaml,
  `outputs: [LotusBlossomSession]`). Atlas cites this method ONCE: F03 tool table row (L384: "Lotus Blossom
  ｜多層結構發散｜中心→8 分支→各 8 idea｜大量但有結構｜後續需 clustering") -- no dedicated section.

  TWO nested fixed-8 closed-set invariants (see method contract's own preconditions): `branches` is
  minItems/maxItems 8, each entry's `branch_number` a distinct value 1-8 (SHAPE-bounded here; genuine
  distinctness+completeness is a runtime-only invariant, same JSON-Schema-cannot-express-set-equality
  limitation ansoff-matrix.schema.yaml's own `quadrants` already discloses); each branch's own `ideas` is
  ALSO minItems/maxItems 8, every entry a non-empty string.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F03 tool table, Lotus Blossom row (L384)"
  - "methods/contracts/divergent.lotus_blossom.contract.yaml (outputs, preconditions, quality)"
  - "specs/cognitive/typed-objects/ansoff-matrix.schema.yaml -- closed-set-with-completeness precedent, generalized here from a named enum to a numeric branch_number slot"
  - "specs/cognitive/typed-objects/5w1h-record.schema.yaml -- record-level (not per-item) provenance precedent"

decided_by: >
  No ADR governs this file. Same class every sibling typed-object schema in this directory documents: a
  direct (non-ambiguous) transcription of Atlas L384's own literal "中心→8 分支→各 8 idea" count, plus
  low-risk disclosed compilation choices.

compilation_decisions:
  - question: "branch_number as a closed enum 1-8, or a plain positive integer with no upper bound?"
    decision: "enum: [1,2,3,4,5,6,7,8] -- Atlas's own literal count is fixed at 8, not open-ended; same closed-vocabulary-but-numeric-instead-of-named shape ansoff-matrix.schema.yaml's own `quadrant` enum establishes for a name-based version of the identical structural pattern."
  - question: "Per-branch provenance (ansoff quadrants[].provenance-style) or one record-level provenance field?"
    decision: "Record-level only, per task-mandated design and Atlas's own citation supporting no per-branch differentiated epistemic claim -- same shape 5w1h-record.schema.yaml's own single top-level `provenance` already establishes, not ansoff/bcg's per-item pattern."
  - question: "additionalProperties: false at the top level and the branches[] item schema?"
    decision: "Yes, both -- baseline hygiene this directory converges on, set correctly from the start (same discipline ansoff-matrix.schema.yaml's own identical decision already establishes)."
  - question: "Does JSON Schema itself express 'all 8 distinct branch_number values present, order-independent'?"
    decision: "No -- plain JSON Schema has no cross-item set-equality operator. minItems:8/maxItems:8 plus the per-item 1-8 enum bounds the SHAPE only; genuine distinctness-and-completeness (at BOTH nesting levels: branch_number set AND each branch's own ideas count) is a runtime-only invariant, enforced at construction AND independently re-derived by a gate in lotus_blossom.py -- same limitation-and-workaround class ansoff-matrix.schema.yaml's own identical compilation_decision already documents."

type: object
required: [id, version, center_theme, branches, provenance]
additionalProperties: false
properties:

  id:
    type: string
    pattern: "^LOTUS-"
    description: "NEW DESIGN. Same id-prefix convention rationale as ansoff-matrix.schema.yaml's ANSOFF- prefix."

  version:
    type: string

  generated_by_method:
    type: string
    default: "divergent.lotus_blossom"

  center_theme:
    type: string
    minLength: 1
    pattern: "\\S"
    description: "The single shared anchor theme every one of the 8 branches themes off -- REPORTED content, not computed."

  branches:
    type: array
    minItems: 8
    maxItems: 8
    description: >
      Atlas L384's own '中心→8 分支' first-level structure. SHAPE-bounded here to exactly 8 items; genuine
      completeness (branch_number covering 1-8, each exactly once, order-independent) is a runtime-only
      invariant this schema cannot express -- enforced by ai_lego/modules/divergent/lotus_blossom.py at both
      the builder and an independent gate.
    items:
      type: object
      required: [branch_number, branch_theme, ideas]
      additionalProperties: false
      properties:
        branch_number:
          type: integer
          enum: [1, 2, 3, 4, 5, 6, 7, 8]
          description: "One of the 8 fixed branch slots (Atlas's own '8 分支' count) -- a numeric slot, not a named vocabulary; genuine 1-8 completeness+distinctness is runtime-only, see top-level description."
        branch_theme:
          type: string
          minLength: 1
          pattern: "\\S"
          description: "What this branch concretely explores, radiating from center_theme -- REPORTED content, not computed."
        ideas:
          type: array
          minItems: 8
          maxItems: 8
          description: "Atlas L384's own '各 8 idea' second-level, per-branch fixed count -- independent of and nested inside the top-level 8-branch invariant."
          items:
            type: string
            minLength: 1
            pattern: "\\S"

  provenance:
    description: "Overall record provenance -- same record-level (not per-item) pattern 5w1h-record.schema.yaml's own top-level provenance already establishes."
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"

examples:
  - description: "A Lotus Blossom expansion for 'improve onboarding retention', all 8 branches, each with its own 8 ideas"
    value:
      id: "LOTUS-2026-09-11-001"
      version: "1.0.0"
      generated_by_method: "divergent.lotus_blossom"
      center_theme: "提升新用戶 onboarding 留存率"
      branches:
        - branch_number: 1
          branch_theme: "首次登入體驗"
          ideas: ["簡化註冊表單", "社交登入選項", "首屏價值主張", "進度指示器", "跳過選項", "預填測試資料", "行動裝置優化", "載入速度優化"]
        - branch_number: 2
          branch_theme: "教學導覽"

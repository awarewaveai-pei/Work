$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/citation-verification-record.schema.yaml"
title: Citation Verification Record
version: "1.0.0"
status: ACTIVE

description: >
  `CitationVerificationRecord` -- output of `research.citation_verification` (Master Plan §42 Research
  Integrity Engine, Citation Verification sub-capability, STRUCTURAL scope only). Checks whether each item in a
  `literature` set (the object `literature_search` emits) has well-formed citation metadata: DOI format,
  non-empty authors, a plausible publication year, a non-empty title. Does NOT check DOI resolution, retraction
  status, or claim contradiction -- see `scope: STRUCTURAL_ONLY` and the runtime module's own docstring.

source_of_truth_for:
  - "methods/contracts/research.citation_verification.contract.yaml"

decided_by: "Operator directive 2026-09-17 (MP §42 gap closure); no ADR."

type: object
additionalProperties: false
required: [id, version, literature_set_id, literature_items, checks, summary, scope, provenance]
properties:
  id: { type: string, pattern: "^CITVER-" }
  version: { type: string }
  generated_by_method: { type: string, default: "research.citation_verification" }
  literature_set_id: { type: string, minLength: 1 }
  literature_items:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [literature_id, title, doi, authors, publication_year, venue]
      properties:
        literature_id: { anyOf: [{ type: string, minLength: 1 }, { type: "null" }] }
        title: { anyOf: [{ type: string }, { type: "null" }] }
        doi: { anyOf: [{ type: string }, { type: "null" }] }
        authors: { anyOf: [{ type: array, items: { type: string } }, { type: "null" }] }
        publication_year: { anyOf: [{ type: integer }, { type: "null" }] }
        venue: { anyOf: [{ type: string }, { type: "null" }] }
  checks:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [literature_id, structurally_complete, doi_format_valid, issues]
      properties:
        literature_id: { anyOf: [{ type: string }, { type: "null" }] }
        structurally_complete: { type: boolean }
        doi_format_valid: { anyOf: [{ type: boolean }, { type: "null" }] }
        issues:
          type: array
          items:
            type: string
            enum: [MISSING_LITERATURE_ID, MISSING_TITLE, MISSING_DOI, DOI_FORMAT_INVALID, MISSING_AUTHORS, MISSING_OR_IMPLAUSIBLE_YEAR, MISSING_VENUE]
  summary:
    type: object
    additionalProperties: false
    required: [total, structurally_complete, with_issues]
    properties:
      total: { type: integer, minimum: 0 }
      structurally_complete: { type: integer, minimum: 0 }
      with_issues: { type: integer, minimum: 0 }
  scope: { type: string, enum: [STRUCTURAL_ONLY] }
  provenance: { $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record" }

verification:
  method: "Validated against specs/cognitive/method.schema.yaml via tests/run_golden_tests.py; typed-object schema exercised by tests/unit/test_citation_verification.py."
  note: "No mother document was modified. Field shape is this contract's own compilation decision."

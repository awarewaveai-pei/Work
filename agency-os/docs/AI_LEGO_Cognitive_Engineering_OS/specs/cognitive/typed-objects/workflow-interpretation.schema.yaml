$schema: https://json-schema.org/draft/2020-12/schema
$id: ai-lego://specs/cognitive/typed-objects/workflow-interpretation.schema.yaml
title: Workflow Interpretation
version: 1.0.0
status: ACTIVE
description: >
  Server-owned summary of method interpretations across a workflow. Station
  judgments are copied from the human record; the AI may only write the summary,
  recommendation, revision conditions, and station one-liners.
source_of_truth_for:
  - RESEARCH_LINES_MASTER_PLAN.md §3.4 C10 and WC-P3-03
type: object
additionalProperties: false
required: [workflow_id, run_or_chain_id, interpretation_id, stations, summary, final_recommendation, revision_conditions, solution, citations_all, usage_total, model, provenance, gates]
properties:
  workflow_id: {type: string, minLength: 1}
  run_or_chain_id: {type: string, minLength: 1}
  interpretation_id: {type: string, minLength: 1}
  stations:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [station_index, method_id, interpretation_id, one_liner, confidence, judgment]
      properties:
        station_index: {type: integer, minimum: 0}
        method_id: {type: string, pattern: '^[a-z_]+\.[a-z_]+$'}
        interpretation_id: {type: string, minLength: 1}
        one_liner: {type: string, minLength: 1}
        confidence: {type: string, enum: [high, mid, low]}
        judgment:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [stance, text]
              properties:
                stance: {type: string, enum: [agree, partial, disagree]}
                text: {type: string, minLength: 1}
  summary: {type: string, minLength: 1}
  final_recommendation:
    type: object
    additionalProperties: false
    required: [text, citations]
    properties:
      text: {type: string, minLength: 1}
      citations: {type: array, items: {type: string, minLength: 1}}
  revision_conditions:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [text, would_change]
      properties:
        text: {type: string, minLength: 1}
        would_change: {type: string, minLength: 1}
  solution: {type: 'null'}
  citations_all: {type: array, items: {type: string, minLength: 1}}
  usage_total:
    type: object
    additionalProperties: false
    required: [input_tokens, output_tokens]
    properties:
      input_tokens: {type: integer, minimum: 0}
      output_tokens: {type: integer, minimum: 0}
  model: {type: string, minLength: 1}
  provenance:
    type: object
    additionalProperties: false
    required: [epistemic_type, authorship_state, locked]
    properties:
      epistemic_type: {type: string, const: AI_INFERENCE}
      authorship_state: {type: string, const: AI_GENERATED}
      locked: {type: 'null'}
  gates:
    type: object
    additionalProperties: false
    required: [stations_complete, citation_integrity, no_preset_conclusion]
    properties:
      stations_complete: {$ref: '#/$defs/gate'}
      citation_integrity: {$ref: '#/$defs/gate'}
      no_preset_conclusion: {$ref: '#/$defs/gate'}
$defs:
  gate:
    type: object
    additionalProperties: false
    required: [gate_id, status, evidence]
    properties:
      gate_id: {type: string, minLength: 1}
      status: {type: string, enum: [PASS, FAIL]}
      evidence: {}

open_questions:
  - id: "OQ-PESTELANALYSIS-1"
    question: >
      The mermaid diagram (L1370-1381) names 3 further downstream nodes this
      schema does NOT model: aggregated "Implications", "Uncertainties", and
      "Scenarios" objects (distinct from the per-factor `implication`/`trend`/
      `confidence` fields this schema DOES carry). No mother document gives
      any of the 3 its own field shape or a real aggregation formula (contrast
      e.g. `rice-score-record.schema.yaml`'s own genuinely-computed score) --
      modeling them here would be inventing structure Atlas does not give.
      Should a future method (e.g. a dedicated Scenario Planning contract,
      OQ-PESTEL-1 in the method contract) own that downstream shape instead?
    owner: "operator, or whoever next builds strategy.scenario_planning"
    blocks: "nothing in this file's own validity -- factors[].trend/implication/confidence already carry the per-factor content Atlas's own 9-field block gives"
  - id: "OQ-PESTELANALYSIS-2"
    question: >
      Whether a factor's free-text `statement` genuinely belongs to the
      `dimension` it claims, and whether `trend`/`implication` are logically
      consistent with `statement`, are semantic judgments this schema cannot
      mechanically check (same class of disclosed gap
      `swot-analysis.schema.yaml`'s own OQ-SWOTANALYSIS-2 already documents
      for its own common-misuse-#2 concern).
    owner: "operator"
    blocks: "nothing in this file's own validity"

verification:
  method: >
    Read Atlas §11.9 (L1365-1404) directly at the cited lines, including the
    mermaid diagram and the '全球系統的必要欄位' yaml block. Cross-checked
    every field against `methods/contracts/strategy.pestel.contract.yaml`'s
    own `preconditions`/`quality` to confirm this type satisfies what the
    method contract already promises. Read swot-analysis.schema.yaml and
    synthetic-control-record.schema.yaml in full before writing this file.
    Validated against jsonschema Draft202012Validator directly via a
    standalone script (required fields present, id pattern satisfied,
    dimension/source_type enums closed, additionalProperties:false enforced
    at both the top level and the nested factors[] item level, the embedded
    example resolved through its real $ref to epistemic-label.schema.yaml,
    and a negative-control smuggled-key rejection check at both levels).
  note: >
    `factors[].statement/geography/source/source_type/effective_from/
    effective_to/trend/implication/confidence` transcribed verbatim from
    Atlas L1387-1395. `dimension`'s six values transcribed verbatim from
    Atlas L1368. The overall object shape (id/version/factors[]), the
    `dimension` field addition, the deliberate absence of a knowledge_set_ref
    field, and the ISO-date tightening of effective_from/effective_to are
    Phase 3-class compilation decisions, explicitly flagged above, same as
    this file's sibling schemas. No mother document was modified to produce
    this file.

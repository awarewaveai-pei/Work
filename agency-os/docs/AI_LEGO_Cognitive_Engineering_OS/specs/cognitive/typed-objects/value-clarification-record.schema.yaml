$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/value-clarification-record.schema.yaml"
title: Value Clarification Record
version: "1.0.0"
status: ACTIVE

description: >
  `ValueClarificationRecord` -- output of `art_therapy.value_clarification` (價值澄清). The few values that survived a transformation, why each matters, and the direction it implies. Runtime invariants beyond this
  schema live in ai_lego/modules/art_therapy/value_clarification.py.

source_of_truth_for:
  - "methods/contracts/art_therapy.value_clarification.contract.yaml"

decided_by: "Operator directive 2026-09-17; no ADR."

type: object
additionalProperties: false
required: [id, version, transformation_context, core_values, provenance]
properties:
  id: { type: string, pattern: "^VCLAR-" }
  version: { type: string }
  generated_by_method: { type: string, default: "art_therapy.value_clarification" }
  transformation_context: { type: string, minLength: 1 }
  core_values:
    type: array
    minItems: 1
    maxItems: 5
    items:
      type: object
      additionalProperties: false
      required: [id, value, why_it_matters, life_direction]
      properties:
        id: { type: string, minLength: 1 }
        value: { type: string, minLength: 1 }
        why_it_matters: { type: string, minLength: 1 }
        life_direction: { type: string, minLength: 1 }
  provenance:
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"

examples:
  - description: "Three core values after a career shift"
    value:
      id: "VCLAR-2026-09-17-001"
      version: "1.0.0"
      generated_by_method: "art_therapy.value_clarification"
      transformation_context: "離開全職工作後"
      core_values:
        - { id: "V1", value: "自主", why_it_matters: "決定自己的節奏", life_direction: "接案而非受雇" }
        - { id: "V2", value: "陪伴", why_it_matters: "看見別人被接住", life_direction: "持續帶團體" }
        - { id: "V3", value: "學習", why_it_matters: "一直有新東西可以懂", life_direction: "完成 EdD" }
      provenance: { epistemic_type: HUMAN_OPINION, authorship_state: HUMAN_ORIGINAL, locked: null }

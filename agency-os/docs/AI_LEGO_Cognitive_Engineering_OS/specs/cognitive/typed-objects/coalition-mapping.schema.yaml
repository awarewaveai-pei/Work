  method: >
    Read Atlas F07 table row (L496) directly. Grepped the whole Atlas file case-insensitively for "coalition"
    -- confirmed exactly 1 real citation for THIS method. Cross-checked against
    methods/contracts/stakeholders.coalition_mapping.contract.yaml's own outputs/preconditions/quality. Read
    jtbd-statement.schema.yaml (record-level-only-provenance precedent) and concept-map-record.schema.yaml
    (referential-integrity + minItems-floor convention, read in full as the closest structural template) before
    writing this file. Grepped the whole `agency-os/docs/AI_LEGO_Cognitive_Engineering_OS` and
    `Projects/internal/cognitive-engineering-os` trees case-insensitively for "coalition" before writing any of
    this method's own files -- zero pre-existing implementation. Validated against jsonschema
    Draft202012Validator via tests/unit/test_coalition_mapping.py (required fields present, id pattern
    satisfied, additionalProperties:false at the top level and both nested item shapes verified to actually
    reject an unknown key, member_ids uniqueItems/minItems verified, embedded example resolved through its
    real $ref to epistemic-label.schema.yaml).
  note: >
    No mother document was modified. `stakeholder_profiles`/`coalition_scenarios` field names and the
    interests/power/resources 3-field shape are transcribed directly from Atlas L496's own literal table row.
    The exact nested-object shapes, the id-prefix convention, the record-level-only provenance placement (an
    explicit F07-batch-wide decision, not this file's own independent call), and the referential-integrity /

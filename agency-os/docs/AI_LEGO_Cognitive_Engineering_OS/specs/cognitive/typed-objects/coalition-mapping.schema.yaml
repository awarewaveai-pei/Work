$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/coalition-mapping.schema.yaml"
title: Coalition Mapping Record
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of `CoalitionMappingRecord` -- the declared `outputs` of
  `stakeholders.coalition_mapping`'s Method Contract (methods/contracts/stakeholders.coalition_mapping.contract.yaml,
  `outputs: [CoalitionMappingRecord]`). Atlas cites this method ONCE: the F07 tool table row (L496: "Coalition
  Mapping｜找可能聯盟｜interests/power/resources→coalition scenarios｜政策與治理特別重要").

  Field provenance:
    * `stakeholder_profiles[]` -- the row's own literal "interests/power/resources" 3-field disclosure, one
      card per stakeholder. All 3 content fields (`interests`/`power`/`resources`) REQUIRED non-empty, same
      completeness-floor spirit the still-unbuilt `stakeholders.incentive_mapping`'s own Goals/Incentives/
      Constraints/Risks card would use, but with THIS row's own different 3 fields.
    * `coalition_scenarios[]` -- the row's own "→coalition scenarios" output. CALLER-SUPPLIED content, not
      generated by this method (see method contract's own `compilation_decisions`); only structural
      completeness and referential integrity are mechanically enforced. Every `member_ids` entry must have
      >=2 UNIQUE ids (a coalition is at least two parties) and every id must resolve to a real
      `stakeholder_profiles[].id` declared in the SAME record -- a dangling reference is refused, same
      referential-integrity class `concept-map-record.schema.yaml`'s own `edges[].from_node_id`/`to_node_id`
      already establishes for its own sibling graph shape.
    * `provenance` -- RECORD-LEVEL ONLY, a deliberate BATCH-WIDE decision for this whole F07 build (matching
      `jtbd-statement.schema.yaml`'s own record-level placement). A CoalitionMappingRecord's stakeholder pool
      and scenario set describe ONE coherent snapshot of one situation's stakeholder landscape, not a list of
      independently-sourced items each needing its own epistemic stamp.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Method_Atlas_Global_Architecture_v1.md F07 tool table, Coalition Mapping row (L496)"
  - "methods/contracts/stakeholders.coalition_mapping.contract.yaml (outputs, preconditions, quality)"
  - "specs/cognitive/typed-objects/jtbd-statement.schema.yaml -- record-level-only-provenance placement precedent (this F07 batch's fixed decision, disclosed above)"
  - "specs/cognitive/typed-objects/concept-map-record.schema.yaml -- referential-integrity + minItems-floor convention precedent reused here for stakeholder_profiles/coalition_scenarios"

decided_by: >
  No ADR governs this file. Same class every sibling typed-object schema in this directory documents: a direct
  transcription of Atlas L496's own literal table-row wording plus low-risk, disclosed compilation choices (the
  flat stakeholder-card/scenario-list shape, record-level-only provenance).

compilation_decisions:
  - question: "Flat stakeholder-card + scenario-list, or a richer structured shape (numeric power/interest scores, a computed coalition-viability score)?"
    decision: "Flat -- task-mandated exact shape; the row's own 'interests/power/resources→coalition scenarios' names exactly these 3 profile dimensions and 1 output artifact with no further internal structure cited. See method contract's own compilation_decisions."
  - question: "Should coalition_scenarios carry a GENUINE_COMPUTE field (e.g. a derived viability score), matching concept-map-record.schema.yaml's own orphan_node_ids?"
    decision: "No -- this method validates caller-supplied scenarios, it does not run a coalition-formation or viability-scoring algorithm (see method contract's own compilation_decisions). No computed field was added without a real algorithm to ground it."
  - question: "Per-field/per-profile/per-scenario provenance or record-level only?"
    decision: "Record-level only, one top-level `provenance` -- explicit F07-batch-wide decision (see method contract's own compilation_decisions), not this schema's own independent judgment call."
  - question: "Minimum items for stakeholder_profiles / coalition_scenarios / member_ids?"
    decision: "stakeholder_profiles: minItems 2 (structural floor -- see method contract). coalition_scenarios: minItems 1 (a zero-scenario record would not exercise this method's own defining purpose). member_ids: minItems 2 per scenario (a coalition is at least two parties)."
  - question: "additionalProperties: false at the top level and both nested item shapes?"
    decision: "Yes -- baseline hygiene this directory converges on, set correctly from the start."

type: object
required: [id, version, provenance, context, stakeholder_profiles, coalition_scenarios]
additionalProperties: false
properties:

  id:
    type: string
    pattern: "^COALMAP-"
    description: "NEW DESIGN. Same id-prefix convention as every sibling record schema."

  version:
    type: string

  generated_by_method:
    type: string
    default: "stakeholders.coalition_mapping"

  context:
    type: string
    minLength: 1
    pattern: "\\S"
    description: >
      The shared situation/policy/governance scenario this stakeholder landscape is about -- un-cited-by-Atlas
      anchor field, same necessary-anchor precedent `concept-map-record.schema.yaml`'s own `context` and
      `5w1h-record.schema.yaml`'s own `topic` already establish. Atlas's own benefit column ("政策與治理特別
      重要") is a usage note about WHERE this method matters most, grounding why an anchor is useful here.

  stakeholder_profiles:
    type: array
    minItems: 2
    description: "Atlas L496's own literal 'interests/power/resources' 3-field disclosure, one card per stakeholder. See compilation_decisions for the minItems:2 floor."
    items:
      type: object
      required: [id, name, interests, power, resources]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          pattern: "\\S"
          description: "Local id, unique within this record (e.g. COALMAP-001-S1). Uniqueness is a runtime-layer invariant, see top-level description."
        name:
          type: string
          minLength: 1
          pattern: "\\S"
          description: "The stakeholder's identifying name or role (e.g. a person, department, or organization)."
        interests:
          type: string
          minLength: 1
          pattern: "\\S"
          description: "REPORTED content -- what this stakeholder wants or cares about in this situation. Atlas L496's own first disclosed dimension."
        power:
          type: string
          minLength: 1
          pattern: "\\S"
          description: "REPORTED content -- this stakeholder's ability to influence the outcome. Atlas L496's own second disclosed dimension."
        resources:
          type: string
          minLength: 1
          pattern: "\\S"
          description: "REPORTED content -- what this stakeholder can bring to (or withhold from) a coalition. Atlas L496's own third disclosed dimension."

  coalition_scenarios:
    type: array
    minItems: 1
    description: "Atlas L496's own '→coalition scenarios' output. CALLER-SUPPLIED, not generated by this method -- see compilation_decisions."
    items:
      type: object
      required: [id, label, member_ids]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          pattern: "\\S"
          description: "Local id, unique within this record (e.g. COALMAP-001-C1)."
        label:
          type: string
          minLength: 1
          pattern: "\\S"
          description: "The scenario's identifying name or short description of the proposed coalition."
        member_ids:
          type: array
          minItems: 2
          uniqueItems: true
          items: {type: string, minLength: 1, pattern: "\\S"}
          description: "Every entry MUST resolve to a real stakeholder_profiles[].id in the SAME record (referential integrity, runtime-layer check) and MUST have >=2 unique entries (a coalition is at least two parties)."

  provenance:
    description: "Overall record provenance -- same full provenance_record pattern every sibling typed-object schema in this directory uses. RECORD-LEVEL ONLY, see compilation_decisions."
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"

examples:
  - description: "A coalition mapping for a municipal zoning policy fight, with 3 stakeholders and 2 overlapping candidate coalitions"
    value:
      id: "COALMAP-2026-09-11-001"
      version: "1.0.0"
      generated_by_method: "stakeholders.coalition_mapping"
      context: "市議會分區法規修訂案的利害關係人聯盟分析"
      stakeholder_profiles:
        - id: "S1"
          name: "在地商圈協會"
          interests: "維持街道停車位與人流，反對縮減臨停格位"
          power: "可動員會員向議員陳情，媒體關注度中等"
          resources: "會員基礎、地方媒體聯繫管道"
        - id: "S2"
          name: "自行車倡議團體"
          interests: "增加自行車道，支持縮減臨停格位"
          power: "動員能力較小，但有議員個人支持"
          resources: "志工人力、社群媒體聲量"
        - id: "S3"
          name: "都市計畫局"
          interests: "在不引發訴訟的前提下推動修法"
          power: "法規制定權，但需議會通過"
          resources: "技術報告、法規草案起草權"
      coalition_scenarios:
        - id: "C1"
          label: "商圈協會 + 都市計畫局：折衷分區方案"
          member_ids: ["S1", "S3"]
        - id: "C2"
          label: "自行車倡議團體 + 都市計畫局：全面自行車道方案"
          member_ids: ["S2", "S3"]
      provenance: {epistemic_type: AI_INFERENCE, authorship_state: AI_GENERATED, locked: null}

open_questions:
  - id: "OQ-COALITIONMAPPING-1"
    question: "Should a future revision add a GENUINE_COMPUTE viability/overlap score per scenario (e.g. combined power of members) if a real, citable scoring method is identified? Same open question the method contract's own OQ-COALMAP-3 already discloses."
    owner: "operator, or whoever next builds a coalition-viability compute layer against this record"
    blocks: "nothing in this file's own validity"
  - id: "OQ-COALITIONMAPPING-2"
    question: "No cross-reference from this record to a future stakeholders.zopa / stakeholders.interest_based_negotiation record exists (both still unbuilt at this batch's start) -- should a future revision add a soft reference field once a real downstream consumer needs one?"
    owner: "operator, or whoever next builds a consuming method against this record"
    blocks: "nothing in this file's own validity"


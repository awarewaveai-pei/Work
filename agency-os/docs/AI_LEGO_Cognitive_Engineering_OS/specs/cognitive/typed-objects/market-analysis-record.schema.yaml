$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/cognitive/typed-objects/market-analysis-record.schema.yaml"
title: Market Analysis Record
version: "1.0.0"
status: ACTIVE

description: >
  `MarketAnalysisRecord` -- output of `strategy.market_analysis` (市場分析). Market definition, TAM/SAM/SOM funnel and evidence-backed segments. Runtime invariants beyond this
  schema live in ai_lego/modules/strategy/market_analysis.py.

source_of_truth_for:
  - "methods/contracts/strategy.market_analysis.contract.yaml"

decided_by: "Operator directive 2026-09-17; no ADR."

type: object
additionalProperties: false
required: [id, version, market_definition, sizing, segments, provenance]
properties:
  id: { type: string, pattern: "^MKT-" }
  version: { type: string }
  generated_by_method: { type: string, default: "strategy.market_analysis" }
  market_definition: { type: string, minLength: 1 }
  sizing:
    type: object
    additionalProperties: false
    required: [tam, sam, som, unit]
    properties:
      tam: { type: number, minimum: 0 }
      sam: { type: number, minimum: 0 }
      som: { type: number, minimum: 0 }
      unit: { type: string, minLength: 1 }
  segments:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, name, size_estimate, growth_rate, evidence_ref]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        size_estimate: { type: number, minimum: 0 }
        growth_rate: { type: number, minimum: -1, maximum: 10 }
        evidence_ref: { type: string, minLength: 1 }
  provenance:
    $ref: "ai-lego://specs/governance/epistemic-label.schema.yaml#/provenance_record"


examples:
  - description: "Art-therapy workshops in Taiwan"
    value:
      id: "MKT-2026-09-17-001"
      version: "1.0.0"
      generated_by_method: "strategy.market_analysis"
      market_definition: "台灣成人藝術療癒工作坊（非臨床）"
      sizing: { tam: 120000, sam: 18000, som: 600, unit: "participants/year" }
      segments:
        - { id: "SG1", name: "助人工作者進修", size_estimate: 9000, growth_rate: 0.08, evidence_ref: "E-MKT-1" }
        - { id: "SG2", name: "企業員工關懷", size_estimate: 6000, growth_rate: 0.15, evidence_ref: "E-MKT-2" }
      provenance: { epistemic_type: HUMAN_OPINION, authorship_state: HUMAN_ORIGINAL, locked: null }

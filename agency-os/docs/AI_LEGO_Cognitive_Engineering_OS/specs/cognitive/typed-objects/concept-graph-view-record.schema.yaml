  method: >
    Read Atlas F24 table, Concept Graph View row (L967) directly, plus §9
    Representation Contract (L1040-1053). Grepped
    `agency-os/docs/AI_LEGO_Cognitive_Engineering_OS` and
    `Projects/internal/cognitive-engineering-os` case-insensitively for
    "concept graph"/"concept-graph"/"CGRAPH-" and every schema title before
    writing -- zero pre-existing implementation or schema title overlap found
    (only the pre-existing generic specs/cognitive/representation.schema.yaml,
    a different, broader dimension-H contract this file does not redefine).
    Validated against jsonschema Draft202012Validator via
    tests/unit/test_concept_graph_view.py.
  note: >
    No mother document was modified. The pipeline is transcribed directly
    from Atlas L967. The CGRAPH- prefix, the closed edge key set, and
    runtime-invariant placement of rendering fidelity are this file's own
    compiled structure, disclosed above.

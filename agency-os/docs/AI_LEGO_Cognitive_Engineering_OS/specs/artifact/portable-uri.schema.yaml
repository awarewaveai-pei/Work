$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/artifact/portable-uri.schema.yaml"
title: Portable Artifact URI
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of the `artifact://` logical URI
  scheme — Master Plan §59 "Portable Artifact URI" (L2588-2607, verified
  exact line range via full-section read): "不得讓 Domain 依賴 S3 路徑"
  (Domain must not depend on S3 paths), literal example
  `artifact://project/PRJ001/source/SRC0003` (L2595), and the 7 named
  possible physical backends behind a resolved URI (AWS, Azure, GCP, MinIO,
  NAS, Local Disk, Future Storage — L2600-2606). A second, tenant-scoped
  worked example is independently corroborated at
  `docs/architecture/MVP_VERTICAL_SLICE_PLAN.md` L56:
  `artifact://tenant/TEN-NORDBROOK/project/PRJ-BURNOUT-01/source/SRC-INT-P1`.

  **PATH RESOLVED 2026-08-30**: originally built at
  `specs/domain/artifact-uri.schema.yaml` per a mis-scoped task instruction.
  Relocated to `specs/artifact/portable-uri.schema.yaml` the same day, once
  the conflict this file's own first draft honestly disclosed was reviewed:
  two independent, already-established pieces of this corpus's convention
  both already pointed here — (1) `specs/artifact/cas-path.schema.yaml`'s
  own `description` (L22-28, ACTIVE, Wave 2) forward-referenced this exact
  path; (2) `docs/architecture/MACHINE_READABLE_SPEC_PLAN.md`'s own
  Directory Structure table (L37) assigns Portable Artifact URI to
  `specs/artifact/`. This is directory-convention alignment (fixing a
  task-assignment mistake against an already-decided layout), not a new
  architecture decision — `cas-path.schema.yaml`'s forward reference and the
  plan's directory table are the actual authority, both predating this
  file. `cas-path.schema.yaml` updated in the same commit to point at the
  real file instead of "not-yet-built."

  Also, like `domain/knowledge-canvas.schema.yaml` (built the same day),
  this file is NOT tracked anywhere in MACHINE_READABLE_SPEC_PLAN.md's §2
  Spec Inventory tables — grep-confirmed: §2.5's row for
  `artifact/cas-path.schema.yaml` (L143) does not itself carry a
  dependency/status row for Portable Artifact URI, it is named only in the
  directory-structure table (L37) and in `cas-path.schema.yaml`'s own
  description. This is a direct-task-instructed build, not a Wave-tracked
  deliverable with a pre-assigned Finding ID.

  **Third independent corroboration of the same path (bughunt finding,
  2026-08-30)**: `specs/evidence/evidence-graph.schema.yaml`'s own
  `source_node` field (L280-283, built independently, unrelated to this
  file's own task) separately noted both "no source.schema.yaml exists
  anywhere in this repo (grepped, zero hits)" AND
  "`specs/artifact/portable-uri.schema.yaml` is separately not-yet-built
  per `cas-path.schema.yaml`'s own description" — a third, independent file
  that already expected this exact path before this file's relocation.
  `evidence-graph.schema.yaml` updated in the same commit to reference the
  real file.

source_of_truth_for:
  - "AI_LEGO_Cognitive_Engineering_Os_Global_Master_Plan_v1.md §59 Portable Artifact URI (L2588-2607)"
  - "docs/architecture/MVP_VERTICAL_SLICE_PLAN.md L56 (tenant-scoped worked example, independently corroborating the URI grammar with a 3-segment-pair instance)"
  - "specs/artifact/cas-path.schema.yaml (resolution target for `resolved_cas_path`; also the source of the path-discrepancy finding disclosed above)"
  - "specs/domain/tenant.schema.yaml (cross-referenced, NOT hard-$ref'd, for the `tenant` segment_type — see compilation_decisions on the UUID-vs-slug identifier-space mismatch)"
  - "specs/execution/blast-radius-chain.schema.yaml (cross-referenced for its 7 canonical node names; NOT structurally mirrored 1:1 — see compilation_decisions)"
  - "docs/architecture/MACHINE_READABLE_SPEC_PLAN.md line 37 (directory table's `specs/artifact/` placement for this concept — the path discrepancy disclosed above)"

decided_by: >
  No ADR governs this file. Not tracked in MACHINE_READABLE_SPEC_PLAN.md §2
  under either candidate path (see description above). Built at the
  task-instructed path per direct instruction; the conflict with the
  established `specs/artifact/` convention two other files already point to
  is disclosed, not silently overridden or silently deferred to guesswork.
  Every field-shape choice below is a direct compilation decision against
  MP §59's thin, two-worked-example grounding — the same "no ADR, direct
  compilation over thin textual grounding" class `evidence/evidence.schema.yaml`
  documents for itself.

compilation_decisions:

  - question: >
      Should this file be relocated to `specs/artifact/portable-uri.schema.yaml`
      to match `cas-path.schema.yaml`'s own forward reference and
      MACHINE_READABLE_SPEC_PLAN.md's directory table, rather than stay at
      the originally task-instructed `specs/domain/artifact-uri.schema.yaml`?
    decision: >
      RESOLVED 2026-08-30, same day: relocated to
      `specs/artifact/portable-uri.schema.yaml`. Original disclosure
      (preserved for audit continuity): "Build at the task-instructed path.
      Do not silently relocate. Disclose the conflict prominently rather
      than resolve it unilaterally in either direction... left for the
      operator to resolve."
    reasoning: >
      On review, this is directory-convention alignment against an
      ALREADY-DECIDED layout (`cas-path.schema.yaml`'s pre-existing forward
      reference and `MACHINE_READABLE_SPEC_PLAN.md`'s own directory table,
      both predating this file), not a fresh architecture judgment call —
      the same class of "apply what's already decided" compilation work
      this corpus's ADR-derived policy/schema files already do throughout.
      The original instruction that placed this file at `specs/domain/` was
      simply a task-assignment mistake, not a competing authority worth
      preserving over two independent, pre-existing, converging citations.

  - question: >
      What identifier grammar does a path segment's TYPE take? The two real
      examples use `project`/`source` (MP §59) and `tenant`/`project`/
      `source` (MVP plan) — 3 distinct segment types total. Should
      `segment_type` be a closed enum (either the 3 evidenced values, or
      `execution/blast-radius-chain.schema.yaml`'s 7 lowercased node names,
      since this task instructs the URI's segments to "structurally mirror"
      that chain), or an open pattern?
    decision: >
      Open, pattern-constrained string (`^[a-z][a-z0-9_]*$`), NOT a closed
      enum of either candidate set.
    reasoning: >
      Neither closed-enum candidate survives contact with the real evidence.
      A 3-value enum (`tenant, project, source`) would be defensible on
      "only transcribe evidenced values" grounds, but the blast-radius chain
      cross-reference this task explicitly instructs ("the URI's path
      segments should structurally mirror" the chain) would then be
      unmodeled entirely. A 7-value enum copying
      `blast-radius-chain.schema.yaml`'s node names
      (`tenant/workspace/project/workflow/branch/execution/capability`)
      fails the opposite way: `source` — used in BOTH real corpus examples,
      the only segment type that appears in every single real instance —
      is NOT one of that chain's 7 node types at all (grep-confirmed against
      the chain's own `node_type` enum), so that enum would reject every
      real corpus example that exists. This is the identical situation
      `domain/tenant.schema.yaml`'s own `data_residency_region` field faced
      (no concrete closed list the mother documents actually commit to) and
      resolved the same way: a free-form pattern that accepts every real
      example and can be tightened to an enum later as a strictly additive
      change once an operator decision (or a genuine third worked example)
      settles the real value set. See `open_questions.OQ-au-2` for the
      still-open "does this mirror blast-radius-chain at all" question this
      decision leaves unresolved rather than forcing an answer to.

  - question: >
      What identifier grammar does a segment's ID (the value after the
      type, e.g. `PRJ001` or `TEN-NORDBROOK`) take? Should the `tenant`
      segment_type's segment_id be hard-`$ref`'d to
      `domain/tenant.schema.yaml#/properties/tenant_id` (type: uuid), since
      both name the same conceptual Tenant?
    decision: >
      NOT hard-$ref'd. `segment_id` is a generic pattern
      (`^[A-Za-z0-9_-]+$`) shared by every segment regardless of type,
      permissive enough to include hyphens.
    reasoning: >
      A real finding, not a stylistic choice: the one real worked example
      that includes a `tenant` segment uses the human-readable slug
      `TEN-NORDBROOK` (MVP plan L56) — NOT a UUID.
      `domain/tenant.schema.yaml#/properties/tenant_id` is strictly typed
      `format: uuid` (ADR-003 sub-decision (a)). Hard-$ref-ing it here would
      make this schema reject the one real corpus example that exists for
      this exact segment type. This exposes a genuine, disclosed gap (see
      `open_questions.OQ-au-3`): the LOGICAL artifact:// URI's tenant
      segment and the PHYSICAL Tenant record's primary key are evidently two
      different identifier spaces for the same conceptual Tenant, and no
      mother document or existing schema states how one resolves to the
      other. `segment_id`'s permissive pattern is deliberately chosen so
      this schema does not need to take a position on that unresolved
      resolution mechanism to remain valid against real evidence today.

  - question: >
      Does the logical URI itself REQUIRE a `tenant` segment, mirroring
      `cas-path.schema.yaml`'s physical-layer rule that every CAS path is
      tenant-scoped by default (ADR-003)?
    decision: "No. A tenant segment is OPTIONAL in this schema's grammar."
    reasoning: >
      MP §59's own literal worked example, `artifact://project/PRJ001/
      source/SRC0003`, has NO tenant segment at all — and that example
      predates ADR-003 (tenant isolation) entirely (MP §59 is a
      single-tenant-era design; ADR-003 is a Round-1 ADR compiled afterward
      specifically because MP's storage design, per `cas-path.schema.yaml`'s
      own description, "defined a single GLOBAL path grammar" with no
      tenant segment). Making `tenant` structurally REQUIRED here would
      reject MP's own real, literal, cited example — the same "don't let a
      later concern silently override an earlier real example" restraint
      `capability-contract.schema.yaml` applied when it refused to
      retroactively invalidate MP §8.3's `entitlement`-free worked instance.
      The MVP plan's later 3-segment example ADDS a tenant segment without
      MP §59 itself being edited to require one — a genuinely unresolved
      tension between the mother document's original design and ADR-003's
      tenant-isolation requirement, disclosed honestly (not papered over)
      in `open_questions.OQ-au-4` rather than resolved by fiat in either
      direction.

  - question: >
      What is the full URI grammar (segment count, ordering, separators)?
    decision: >
      `^artifact://[a-z][a-z0-9_]*/[A-Za-z0-9_-]+(?:/[a-z][a-z0-9_]*/[A-Za-z0-9_-]+)*$`
      — one or more repeating `<segment_type>/<segment_id>` pairs after the
      literal `artifact://` scheme prefix, minimum one pair.
    reasoning: >
      Directly fits both real corpus examples: MP §59's 2-pair
      `project/PRJ001/source/SRC0003` and the MVP plan's 3-pair
      `tenant/TEN-NORDBROOK/project/PRJ-BURNOUT-01/source/SRC-INT-P1`.
      Minimum-one-pair (not zero) because a bare `artifact://` with no
      segments identifies nothing. No upper bound on pair count is imposed —
      no evidence anywhere caps it, and blast-radius-chain-style deeper
      nesting (workspace/workflow/branch/execution/capability, per
      `open_questions.OQ-au-2`) would need more than 3 pairs if that
      cross-reference is ever adopted.

  - question: >
      Should this file structure the URI as a bare validated string, or a
      decomposed structured object (string form + parsed segments), the way
      `cas-path.schema.yaml`'s own `cas_path` definition does (`path` plus
      its own decomposition fields)?
    decision: >
      Decomposed structured object, `definitions.artifact_uri`, with a
      `uri` string field (the canonical serialized form, pattern-validated)
      plus a `segments` array (the parsed decomposition).
    reasoning: >
      Direct structural precedent from the closest sibling file in the same
      directory and subject area: `cas-path.schema.yaml`'s own
      `definitions.cas_path` object exists, per that file's own comment,
      "so validators and tooling do not have to re-parse `path`" — the
      identical rationale applies here. Nested under `definitions:` (not a
      bare top-level key) to mirror `cas-path.schema.yaml`'s exact
      structure, including that file's choice not to add a root-level
      `$ref` (it is always consumed via a `#/definitions/...` fragment, not
      validated at bare document root) — this file follows the same
      convention for consistency with its closest sibling rather than
      introducing a different root-shaping convention
      (`governance/epistemic-label.schema.yaml`'s root `$ref` pattern) for
      no functional reason.

  - question: >
      Task instruction: "$ref it (cas-path.schema.yaml) — a resolved
      artifact:// URI should ultimately map to a CAS path, model that
      relationship." Should the mapping be a REQUIRED field, given every
      artifact must eventually live somewhere physical?
    decision: >
      OPTIONAL field `resolved_cas_path`, hard `$ref` to
      `artifact/cas-path.schema.yaml#/definitions/cas_path`.
    reasoning: >
      Making it required would defeat MP §59's entire stated purpose for
      this URI scheme existing in the first place ("不得讓 Domain 依賴 S3
      路徑" — the whole point is that Domain-layer code holds a LOGICAL
      reference that may not yet be, or may never need to be, resolved to a
      physical location in the same record). An `artifact_uri` instance is
      a complete, valid, useful value on its own before resolution; forcing
      a `resolved_cas_path` onto every instance would conflate the logical
      and physical layers this file's own reason for existing keeps apart.
      Hard-$ref'd when present because `cas-path.schema.yaml` is ACTIVE and
      stable (Wave 2), the identical safe-backward-dependency reasoning
      applied throughout this suite for already-built target files.

  - question: >
      How should the "never leak the storage backend" requirement (MP §59's
      7 named backends: AWS/Azure/GCP/MinIO/NAS/Local Disk/Future Storage,
      L2600-2606) be enforced — prose warning, or structural constraint?
    decision: >
      Structural: the `uri` field's own pattern is anchored to the literal
      scheme prefix `artifact://` and `segment_type` is restricted to a
      lowercase-identifier grammar (`^[a-z][a-z0-9_]*$`) that cannot match a
      URL scheme, a Windows/UNC path, or a bucket-and-key style reference.
      No backend-specific string (`s3://`, `https://s3.amazonaws.com/...`,
      `azure://`, `gs://`, `\\server\share\...`, `C:\...`, `/var/...`) can
      ever satisfy this pattern. The 7 named backends are documented in
      `resolved_cas_path`'s own description as informational context only
      (what MAY exist behind a resolved URI) — never as legal `uri` values.
    reasoning: >
      Per this task's own cited precedent
      (`policies/privacy/pii-redaction.policy.yaml`'s `compilation_decisions`,
      quoted verbatim in `domain/knowledge-canvas.schema.yaml` built in the
      same task): a prose-only "must not leak the backend" constraint is
      exactly the unenforced-`constraints:`-block bug class this project has
      already found and fixed multiple times. The scheme-prefix anchor
      already gives this real teeth without inventing a denylist regex that
      would itself need indefinite maintenance as new backends are named —
      an allowlist-by-construction (only `artifact://...` shaped values
      validate at all) is structurally stronger than a denylist of 7 named
      strings that a resolved storage location's name will drift out of.

  - question: >
      Should a positional rule be enforced (e.g., IF a `tenant` segment is
      present, it MUST be `segments[0]`, mirroring
      `blast-radius-chain.schema.yaml`'s Tenant-is-root convention)?
    decision: >
      Not structurally enforced. Documented as a `constraints` prose
      expectation only.
    reasoning: >
      Both real examples that include a `tenant` segment place it first,
      and blast-radius-chain.schema.yaml's own `chain_instance` treats
      Tenant as the unconditional root of every chain — a real, if thin
      (n=1), consistency signal. But expressing "IF any segment has
      segment_type == tenant, it must be at index 0" is a conditional
      positional constraint over a variable-length array, meaningfully more
      complex to express correctly in JSON Schema than this SHOULD-level,
      non-safety-critical rule justifies (unlike the actor/action
      enforcement in `knowledge-canvas.schema.yaml`, which structurally
      prevents a real security-relevant misrepresentation). Documented as
      prose per `capability-contract.schema.yaml`'s own precedent for using
      a `constraints`-block SHOULD where the underlying rule is a genuine
      expectation but not one this task's evidence base treats as safety-
      critical enough to justify the structural complexity.


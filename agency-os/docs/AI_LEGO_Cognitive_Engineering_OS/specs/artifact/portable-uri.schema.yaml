open_questions:
  - id: "OQ-au-1"
    question: >
      RESOLVED 2026-08-30 (same day as first draft): relocated to
      `specs/artifact/portable-uri.schema.yaml`; `cas-path.schema.yaml` and
      `evidence-graph.schema.yaml` updated in the same commit to reference
      the real file instead of "not-yet-built." Original question
      (preserved): "Should this file be relocated to match
      `cas-path.schema.yaml`'s own live forward reference and
      MACHINE_READABLE_SPEC_PLAN.md's directory-structure table?"
    owner: "closed"
    blocks: "nothing — resolved"
  - id: "OQ-au-2"
    question: >
      Is `segment_type` meant to eventually mirror
      `execution/blast-radius-chain.schema.yaml`'s 7-node chain
      (tenant/workspace/project/workflow/branch/execution/capability), as
      this task's own instructions suggested framing it, or is it a
      genuinely separate vocabulary that merely OVERLAPS the chain at
      `tenant`/`project` while also including `source` (not a chain node at
      all)? No mother document states either answer; MP §59's own 2 real
      examples use only `project`/`source` (one chain-node overlap, one
      non-chain concept) and the MVP plan's example adds `tenant` (a second
      chain-node overlap) without using `workspace`/`workflow`/`branch`/
      `execution`/`capability` at all.
    owner: "operator, via a future ADR or a third real worked example that actually exercises one of the 5 currently-unevidenced segment types"
    blocks: "nothing in this schema — segment_type's open pattern admits both the chain's lowercased names and non-chain names like 'source' regardless of the answer"
  - id: "OQ-au-3"
    question: >
      How does a `tenant` segment's human-readable slug `segment_id` (e.g.
      `TEN-NORDBROOK`) resolve to the real, UUID-typed
      `domain/tenant.schema.yaml#/properties/tenant_id` value it evidently
      refers to? No mother document or existing schema in this corpus
      defines this lookup/resolution mechanism (a slug-to-UUID directory,
      or a convention that the UUID's own string form is sometimes rendered
      as a slug — neither is stated anywhere).
    owner: "operator / a future schema or service design for artifact:// URI resolution"
    blocks: "nothing in this schema's own validity — segment_id's permissive pattern accepts the real evidenced slug form regardless of how resolution eventually works"
  - id: "OQ-au-4"
    question: >
      MP §59's own literal worked example predates ADR-003 (tenant
      isolation) and has no tenant segment at all; the MVP plan's later
      example adds one without MP §59 itself being edited to require it.
      Should a future ADR make a `tenant` segment structurally MANDATORY in
      this URI grammar (to stay consistent with `cas-path.schema.yaml`'s
      own mandatory tenant-scoping of the PHYSICAL path this URI may
      resolve to), and if so, how does a legacy/global-pool artifact
      (`cas-path.schema.yaml`'s own `_global` sentinel, Option C) express
      itself in the LOGICAL URI layer — a literal `tenant/_global` segment,
      or an entirely absent tenant segment as this file currently allows?
    owner: "operator, via a future ADR reconciling MP §59 with ADR-003"
    blocks: "nothing in this schema today; a future mandatory-tenant-segment amendment would be a breaking change to any artifact:// URI minted without one under this file's current, permissive rule"

# ---------------------------------------------------------------------------
# Schema body
# ---------------------------------------------------------------------------

definitions:

  segment:
    type: object
    required: [segment_type, segment_id]
    description: >
      One `<segment_type>/<segment_id>` pair in the URI path. See
      compilation_decisions for why neither field is a closed enum.
    properties:
      segment_type:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
        description: >
          Open vocabulary. 3 values are evidenced by real corpus examples:
          `tenant`, `project`, `source`. `execution/blast-radius-chain.schema.yaml`'s
          7 lowercased node names (`tenant, workspace, project, workflow,
          branch, execution, capability`) are a candidate but UNCONFIRMED
          superset — see open_questions.OQ-au-2. Not a closed enum; see
          compilation_decisions.
        examples: [tenant, project, source]
      segment_id:
        type: string
        pattern: "^[A-Za-z0-9_-]+$"
        description: >
          Open, permissive identifier grammar (hyphens legal). Deliberately
          NOT hard-$ref'd to any single canonical identifier's format (e.g.
          `domain/tenant.schema.yaml#/properties/tenant_id`'s UUID format)
          because the one real `tenant`-segment example is a human-readable
          slug, not a UUID — see compilation_decisions and
          open_questions.OQ-au-3.
        examples: [PRJ001, SRC0003, TEN-NORDBROOK, PRJ-BURNOUT-01, SRC-INT-P1]

  artifact_uri:
    type: object
    required: [uri, segments]
    description: >
      Structured (parsed) form of a Portable Artifact URI. `uri` is the
      canonical serialized string form; `segments` is its decomposition,
      present so validators and tooling do not have to re-parse `uri` — see
      compilation_decisions (direct precedent:
      `artifact/cas-path.schema.yaml#/definitions/cas_path`).
    properties:
      uri:
        type: string
        pattern: "^artifact://[a-z][a-z0-9_]*/[A-Za-z0-9_-]+(?:/[a-z][a-z0-9_]*/[A-Za-z0-9_-]+)*$"
        description: >
          Canonical serialized form, e.g. `artifact://project/PRJ001/source/SRC0003`
          (MP §59 L2595) or `artifact://tenant/TEN-NORDBROOK/project/PRJ-BURNOUT-01/source/SRC-INT-P1`
          (MVP_VERTICAL_SLICE_PLAN.md L56). See compilation_decisions for the
          structural backend-leak-prevention reasoning behind this pattern.
        examples:
          - "artifact://project/PRJ001/source/SRC0003"
          - "artifact://tenant/TEN-NORDBROOK/project/PRJ-BURNOUT-01/source/SRC-INT-P1"
      segments:
        type: array
        minItems: 1
        items: { $ref: "#/definitions/segment" }
        description: "Parsed decomposition of `uri`, in path order (outermost/leftmost segment first)."
      resolved_cas_path:
        $ref: "ai-lego://specs/artifact/cas-path.schema.yaml#/definitions/cas_path"
        description: >
          OPTIONAL. Present only once/if this logical URI has actually been
          resolved to a physical Content-Addressed Storage location. See
          compilation_decisions for why this is optional, not required.

constraints:
  description: >
    Cross-field/cross-record rules this schema's `properties`/`pattern`
    blocks cannot (or, for the positional rule, were judged not to need to)
    express structurally, recorded as prose per this project's established
    convention (`execution/result.schema.yaml`'s `constraints` list is the
    precedent for this technique).
  rules:
    - "IF any segment in `segments` has `segment_type == tenant`, it SHOULD be `segments[0]` (the outermost/first segment), consistent with both real corpus examples and execution/blast-radius-chain.schema.yaml's Tenant-is-root convention. Not structurally enforced — see compilation_decisions."
    - "`segments` array items are NOT independently validated against `uri`'s own string content by this schema — a producer/consumer of an artifact_uri instance is responsible for keeping the two representations consistent with each other; this schema validates each independently, not their mutual agreement."

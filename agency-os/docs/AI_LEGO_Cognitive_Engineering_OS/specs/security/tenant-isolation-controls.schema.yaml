    Read docs/architecture/DATA_ARCHITECTURE_PLAN.md §6 (L132-147) and
    docs/adr/ADR-003-tenant-model-and-cas-isolation.md's Recommendation and
    Consequences sections directly at the cited lines. Read
    docs/architecture/SECURITY_THREAT_MODEL.md's I1/Ds1 rows (L109, L130)
    and Prioritized Threat List item 2 (L145) directly to confirm the exact
    threat description before asserting this file resolves it, rather than
    assuming from a summary. Verified the reconciliation claim (that
    DATA_ARCHITECTURE_PLAN's design genuinely addresses SECURITY_THREAT_
    MODEL's specific concern, not just a superficially similar one) by
    comparing the two documents' literal wording side by side. Read
    specs/domain/tenant.schema.yaml's own open_questions.MRSP-tenant-1 to
    confirm it names this exact file as its blocked destination.
  note: >
    No mother document was modified. This file is a direct transcription
    of an existing, evidenced, not-yet-ADR-ratified design document (see
    `decided_by`). The cross-document staleness reconciliation
    (SECURITY_THREAT_MODEL.md not knowing about DATA_ARCHITECTURE_PLAN.md's
    resolution) is disclosed rather than silently resolved by picking one
    side without comment.

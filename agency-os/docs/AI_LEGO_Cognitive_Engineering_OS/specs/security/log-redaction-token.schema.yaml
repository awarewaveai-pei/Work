$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/security/log-redaction-token.schema.yaml"
title: Log Redaction Token
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of the token structure that replaces
  a PII field's raw value before it is written into a structured log, per
  ADR-007 Sub-decision (a) Option A (Deterministic Keyed-HMAC Tokenization).
  Resolves ADR-007's regulatory-timing conflict (EC §102 Logging Contract's
  v1-effective `redacted`+`correlatable` dual requirement, L2980-2981, vs
  Master Plan §149 miscategorizing Pseudonymization/Tokenization as a
  "future capability"): the token defined here is computed as
  `token = HMAC-SHA256(key, raw_value)` using a tenant-scoped HMAC signing
  key, so the log stores only `token` — never `raw_value` — while identical
  raw values for the same subject still hash to identical tokens, satisfying
  `correlatable` and `redacted` simultaneously rather than trading one off
  against the other. This file is the single source of truth for the token
  object's field shape; ADR-007 names the four fields in prose, it does not
  itself define their types, enums, or the token value's own field — those
  live here, not in the ADR.

  This schema depends on `specs/security/key-vault-lifecycle.schema.yaml`'s
  `key_use == HMAC_SIGNING_KEY` key type (built by a parallel Phase 3 agent
  in this same session, per ADR-007 Sub-decision (a)'s explicit instruction
  to reuse ADR-002's existing Key Vault rather than stand up a second one).
  Consistent with `manifest.schema.yaml`'s established forward-reference
  convention, `hmac_key_ref` below is a soft (non-`$ref`) cross-reference by
  field-name convention, not a hard schema dependency — this file's own
  validity does not require that sibling file to exist or to have finished
  building first.

compilation_decisions:
  - question: >
      ADR-007 Consequences item 2 (line 154) names four fields in prose —
      `token_alg`（固定 HMAC-SHA256）/`hmac_key_ref`/`classification_tag`/
      `tenant_scope` — but specifies no JSON Schema type, enum, or format
      for any of them, and does not itself name a field for the token
      VALUE (the actual HMAC output that gets written into the log in
      place of the raw value).
    decision: >
      `token_alg` is a `const` (single legal value, not an open enum, since
      ADR-007 fixes it — "固定 HMAC-SHA256" is a fixed-value instruction,
      not a menu). `hmac_key_ref` is an opaque soft-reference `string`
      matching `key-vault-lifecycle.schema.yaml`'s `key_record.key_id`
      type (also plain `string`, not `uuid`). `classification_tag` is a
      closed `enum` reusing MP §61/EC §101's four-value Data Classification
      list verbatim (Public/Internal/Confidential/Restricted,
      Execution_Contract_v1.md:2960-2963), the same classification this
      whole ADR's PII-field-determination rule (Recommendation point 1)
      is anchored to — not a new fifth tier. `tenant_scope` is `string`
      with `format: uuid`, matching `tenant.schema.yaml`'s and
      `key-vault-lifecycle.schema.yaml`'s existing `tenant_id` type. A
      required `token` field (pattern `^[a-f0-9]{64}$`, lowercase hex,
      256-bit output) is added as the fifth required field, reusing this
      repo's already-established hex-digest convention
      (`manifest.schema.yaml`'s `documents[].sha256` field uses the
      identical pattern for the same 256-bit output length).
    reasoning: >
      Same technique already used by every sibling Phase 3 schema in this
      directory: `key-vault-lifecycle.schema.yaml`'s `sovereignty_mode`
      reuses MP §148's six-value list verbatim rather than inventing new
      vocabulary; `epistemic-label.schema.yaml` transcribes enum values
      verbatim from its governing ADR. Fixing `token_alg` as `const`
      rather than a single-value `enum` more precisely encodes "this is
      not a choice" than an enum with one legal member would. Adding the
      `token` value field is not new scope creep beyond ADR-007: a schema
      literally named "log redaction token" that defined only metadata
      fields and omitted the token's own value would be unable to
      represent what ADR-007's Recommendation literally says gets written
      into the log ("log 中只寫入 token，不寫明文") — the field is an
      obvious completeness requirement of the ADR's own literal formula,
      not an independent architecture decision.
  - question: >
      The task instructions (and ADR-007's own "唯一風險必須明說" callout,
      Consequences 負面／代價 paragraph, line 149) require this schema to
      make historical tokens distinguishable from current ones across an
      HMAC key rotation boundary, even though ADR-007 itself does not
      specify a field or mechanism for this at the schema level — it only
      states the tradeoff exists in prose ("輪替 HMAC 金鑰 = 犧牲跨輪替邊界
      的可關聯性，換取降低長期金鑰外洩風險").
    decision: >
      No separate `key_version`/`key_generation` counter field is added.
      `hmac_key_ref` itself is the key-generation identifier: per
      `key-vault-lifecycle.schema.yaml`'s `key_record` model (documented
      there as "One entry in the Vault, per issued key"), rotating a
      `key_use == HMAC_SIGNING_KEY` key retires the previous `key_record`
      to `status: ROTATED` (a distinct terminal value from `ACTIVE`,
      alongside `PENDING_DESTRUCTION`/`DESTROYED`) rather than mutating an
      existing key's material under a stable `key_id` — each rotation
      therefore mints a new `key_id`. Two `log_redaction_token` objects
      computed under different `hmac_key_ref` values are consequently
      always distinguishable as belonging to different key generations,
      and a consumer can resolve `hmac_key_ref` against the Vault's
      `key_record.status` to learn whether that generation is the current
      signing key (`ACTIVE`) or a retired one (`ROTATED`) — without this
      schema needing its own duplicate version counter. See the
      `constraints` list on the composite object below for the
      correlatability rule this enables.
    reasoning: >
      This is a Low-risk compilation decision, not a new architecture
      decision, per the task's explicit instruction to document it this
      way rather than silently omitting rotation-tracking: it reuses a
      field (`hmac_key_ref`) and a state machine
      (`key_record.status` incl. `ROTATED`) that already exist in the
      sibling schema for an unrelated reason (identifying which key
      produced a value), rather than inventing a second, redundant
      versioning mechanism. Adding a parallel `key_version` integer would
      duplicate information `hmac_key_ref` already carries and risk the
      two falling out of sync (e.g. if a future rotation reused a
      `key_id`, `key_version` and `hmac_key_ref` could disagree) — the
      single-field design has no such failure mode because there is only
      one source of truth. The residual dependency this decision creates
      — this schema's rotation-tracking claim is only as strong as
      `key-vault-lifecycle.schema.yaml`'s "new `key_id` per rotation,
      old record retained as `ROTATED`" assumption actually holding — is
      flagged explicitly in `open_questions` below rather than hidden,
      per this task's own instruction not to silently omit the
      rotation-tracking discussion.
  - question: >
      Whether one `log_redaction_token` object represents exactly one
      redacted field's value (as opposed to a whole log line's worth of
      redacted fields bundled together), and whether identifying *which*
      log field a given token replaces is in scope, is not addressed by
      ADR-007's four-field list.
    decision: >
      One `log_redaction_token` object = one redacted field value (matches
      EC §102's per-field structured logging model, not a per-line
      bundle). An OPTIONAL `field_name` string and an OPTIONAL
      `computed_at` timestamp are added, additive to the four ADR-named
      fields plus `token`.
    reasoning: >
      Matches `manifest.schema.yaml`'s established pattern for additive,
      non-ADR-literal fields that complete a schema's practical usability
      without expanding its governing decision (`app_version`,
      `loaded_sections` were added there the same way, each documented
      individually). `field_name` lets a consumer correlate a token object
      back to the structured-log key it replaced without requiring a
      redesign of the general log schema (EC §102's minimum key list,
      `timestamp/level/service/trace_id/task_id/execution_id/event/
      status`, is untouched by this file — see ADR-007 Consequences item 6).
      Both fields are OPTIONAL (not required) precisely because ADR-007
      does not mandate them; omitting them does not make a token object
      invalid.


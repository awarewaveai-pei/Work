# Root $ref (2026-08-29, critic review MAJOR finding #2, same class as
# Codex cross-cutting review CONFIRMED finding #1 — see risk-tier.schema.yaml's
# identical comment for the full reasoning): this file's title/description/
# etc. are annotation keywords, so without a root-level type constraint, a
# validator pointed at this file's ROOT (not `#/definitions/log_redaction_token`)
# would accept ANY value. This $ref makes the file's root itself validate as
# `log_redaction_token`, so both root-level and definitions-scoped validation
# now agree.
$ref: "#/definitions/log_redaction_token"

# ---------------------------------------------------------------------------
# Schema body
# ---------------------------------------------------------------------------

definitions:

  token_alg:
    description: >
      The tokenization algorithm. Fixed by ADR-007 Sub-decision (a) — not a
      configurable choice, per the FMEA finding (ADR-007) that an
      unkeyed/unsalted hash (e.g. bare `sha256(email)`) is unacceptable
      (dictionary-attack-reversible for low-entropy PII like email/phone).
    type: string
    const: "HMAC-SHA256"

  hmac_key_ref:
    description: >
      Soft reference (opaque identifier, no `$ref` — same forward-reference
      convention as `manifest.schema.yaml`'s `documents[].document_id` and
      `tenant.schema.yaml`'s `encryption_root_key_ref`) to the `key_id` of
      a `specs/security/key-vault-lifecycle.schema.yaml` `key_record` whose
      `key_use == HMAC_SIGNING_KEY`. This is also this schema's
      key-generation tracking mechanism — see `compilation_decisions`
      above and the composite object's `constraints` below.
    type: string
    minLength: 1

  classification_tag:
    description: >
      Which Data Classification tier (MP §61 / EC §101, verbatim, no fifth
      tier added) the original raw value belonged to. Determines whether a
      field was required to be tokenized in the first place, per ADR-007
      Recommendation point 1 ("任何 log 欄位若承載可識別自然人的資料，該欄位
      所屬物件必須先被標記 Confidential 或 Restricted"). In practice a
      `log_redaction_token` should only ever carry `Confidential` or
      `Restricted` — `Public`/`Internal` values are included in the enum
      for completeness with the source classification list, not because
      tokenizing a Public/Internal field is expected.
    type: string
    enum: [Public, Internal, Confidential, Restricted]

  tenant_scope:
    description: >
      Soft reference (opaque identifier, same convention as
      `hmac_key_ref` above) to `domain/tenant.schema.yaml`'s `tenant_id`.
      Per ADR-007 Recommendation point 2, tokenization is computed
      "per-tenant"（每個 tenant 用自己的 HMAC 簽章金鑰）— this field
      records which tenant's key produced this token, matching the
      `tenant_id` already required on the `key_record` this token's
      `hmac_key_ref` resolves to.
    type: string
    format: uuid

  log_redaction_token:
    description: >
      The complete token object that replaces a single PII field's raw
      value at the point it is written into a structured log entry, per
      EC §102. One object per redacted field, not one per log line — see
      `compilation_decisions` above.
    type: object
    required: [token_alg, hmac_key_ref, classification_tag, tenant_scope, token]
    properties:
      token_alg:
        $ref: "#/definitions/token_alg"
      hmac_key_ref:
        $ref: "#/definitions/hmac_key_ref"
      classification_tag:
        $ref: "#/definitions/classification_tag"
      tenant_scope:
        $ref: "#/definitions/tenant_scope"
      token:
        type: string
        pattern: "^[a-f0-9]{64}$"
        description: >
          The HMAC-SHA256 output — `HMAC-SHA256(key, raw_value)` — as a
          lowercase hex digest (256 bits = 64 hex characters), reusing this
          repo's established hex-digest encoding convention
          (`manifest.schema.yaml`'s `documents[].sha256` uses the identical
          pattern for the same output length). The raw value that produced
          this token MUST NOT appear anywhere else in the same log entry —
          per ADR-007 Recommendation point 2, "log 中只寫入 token，不寫明文".
      field_name:
        type: [string, "null"]
        default: null
        description: >
          OPTIONAL. Which structured log field (per EC §102's minimum key
          list) this token replaces, e.g. "customer.email". Additive field,
          not named by ADR-007 — see `compilation_decisions` above.
      computed_at:
        type: [string, "null"]
        format: date-time
        default: null
        description: "OPTIONAL. When this token was computed. Additive field."
    constraints:
      description: >
        Non-normative narrative constraints (same style as
        `governance/epistemic-label.schema.yaml`'s `locked.constraints` and
        `key-vault-lifecycle.schema.yaml`'s `vault_restore_event.constraints`),
        stated here because they express cross-field/cross-schema invariants
        plain JSON Schema types cannot express directly.
      value:
        - "Two log_redaction_token objects with identical tenant_scope, identical hmac_key_ref, and the same underlying raw_value MUST produce identical token values — this is the `correlatable` guarantee (EC §102 L2980) this schema exists to satisfy without storing raw_value anywhere."
        - "Two log_redaction_token objects with different hmac_key_ref values MUST NOT be assumed correlatable even for the same underlying raw_value and the same tenant_scope — a hmac_key_ref change most commonly means the tenant's HMAC signing key was rotated (per key-vault-lifecycle.schema.yaml's key_record.status transitioning ACTIVE -> ROTATED), and ADR-007 Consequences documents this as an accepted, intentional tradeoff (loss of cross-rotation-boundary correlatability in exchange for reduced long-term key-exposure risk), not a defect to work around."
        - "raw_value MUST NOT be persisted, logged, or embedded anywhere alongside a log_redaction_token — the entire point of this object is that the log carries token in place of raw_value, never both (EC L2999's 'no full sensitive-payload dumps' rule applies a fortiori to the raw value a token was computed from)."

examples:
  - description: "A Restricted email field, tokenized under the tenant's current (ACTIVE) HMAC signing key"
    value:
      token_alg: "HMAC-SHA256"
      hmac_key_ref: "hmac-key.tenant-3fa85f64.gen-2"
      classification_tag: Restricted
      tenant_scope: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      token: "b7e23ec29af22b0b4e41da31e868d57226121c84a5ffc5e5d3b6c4c8f5f5b7a1"
      field_name: "customer.email"
      computed_at: "2026-08-29T00:00:00Z"
  - description: >
      A historical token computed under a since-rotated key (hmac-key
      .tenant-3fa85f64.gen-1, now status: ROTATED in the Key Vault) — still
      valid and distinguishable by its hmac_key_ref, but not correlatable
      against gen-2 tokens for the same subject.
    value:
      token_alg: "HMAC-SHA256"
      hmac_key_ref: "hmac-key.tenant-3fa85f64.gen-1"
      classification_tag: Confidential
      tenant_scope: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      token: "1c4a5b6c8f5f5b7a1b7e23ec29af22b0b4e41da31e868d57226121c84a5ffc53"
      field_name: "customer.phone"
      computed_at: "2025-11-02T00:00:00Z"

open_questions:
  - id: "MRSP-log-redaction-1"
    question: >
      This schema's key-rotation-tracking compilation decision (see
      `compilation_decisions` above) assumes
      `key-vault-lifecycle.schema.yaml`'s rotation model mints a NEW
      `key_id` per rotation and retires the previous `key_record` to
      `status: ROTATED` rather than mutating an existing key's material
      under a stable `key_id`. That schema's `key_record` description
      ("One entry in the Vault, per issued key") and its inclusion of
      `ROTATED` as a distinct terminal `status` value alongside
      `DESTROYED` support this reading, but neither ADR-002 nor ADR-007
      states the "new key_id per rotation" rule as an explicit sentence —
      it is inferred, not transcribed verbatim. If a future clarification
      of `key-vault-lifecycle.schema.yaml` establishes that rotation
      instead reuses a stable `key_id` with in-place material rotation,
      this schema's claim that "different hmac_key_ref values mean
      different key generations" would need re-verification (though the
      correlatability guarantee itself — same tenant+key+raw_value implies
      same token — would still hold regardless of which rotation model is
      correct).
    owner: "operator, if/when key-vault-lifecycle.schema.yaml's rotation semantics are made explicit in a Round 2 ADR or clarification"
    blocks: "nothing in this schema's own validity; flagged for completeness per R4 (claim-before-verify)"
  - id: "MRSP-log-redaction-2"
    question: >
      `docs/architecture/MACHINE_READABLE_SPEC_PLAN.md` §2.5's inventory
      table (built before ADR-007 existed) does not list this file — only
      `personal-data-envelope.schema.yaml` and `key-vault-lifecycle
      .schema.yaml` appear there, both traced to ADR-002. This file is
      traced instead to ADR-007 Consequences item 2 (line 154), a later
      ADR in the same Phase 1 conflict family (P1-CONFLICT-3, adjacent to
      ADR-002's P1-CONFLICT-1). The inventory table itself is out of scope
      for this file to edit.
    owner: "operator, via a small doc-sync addition to MACHINE_READABLE_SPEC_PLAN.md §2.5's table"
    blocks: "nothing in this schema; flagged for completeness per R4 (claim-before-verify)"

verification:
  method: >
    Read against ADR-007 full text (Context, Recommendation, Consequences,
    Evidence sections), EC §101 (L2955-2971) and §102 (L2974-2999),
    `specs/governance/epistemic-label.schema.yaml` and
    `specs/execution/manifest.schema.yaml` (style references per task
    instruction), and `specs/security/key-vault-lifecycle.schema.yaml`
    (for the HMAC_SIGNING_KEY key_use and key_record.status.ROTATED this
    schema's rotation-tracking decision depends on). Grep-confirmed
    (2026-08-29) `docs/architecture/MACHINE_READABLE_SPEC_PLAN.md` does not
    yet list this file (see open_questions MRSP-log-redaction-2).
  note: >
    No mother document or ADR was modified to produce this file. The four
    field names (token_alg/hmac_key_ref/classification_tag/tenant_scope)
    and the HMAC-SHA256 mechanism are transcribed verbatim from ADR-007
    Consequences item 2 and Recommendation point 2; field types/enums/
    patterns, the `token` value field, the key-rotation tracking mechanism,
    and the two additive fields (field_name/computed_at) reflect Phase 3
    compilation decisions, recorded above in `compilation_decisions`, not
    a new ADR. `personal-data-envelope.schema.yaml` (also depended on by
    the same ADR-007/ADR-002 family) was not read or waited on to produce
    this file, per task boundary — it did not exist on disk at write time.

  - "docs/architecture/DEVOPS_SRE_PLAN.md:120-134 (§3.2-3.3 — WORM 35-day immutability window; backup-key KMS realm kept separate from the crypto-shredding DEK service)"
decided_by: >
  docs/adr/ADR-002-personal-data-erasure-vs-event-immutability.md
  (registered ACCEPTED in docs/adr/ADR_INDEX.md:8; see `open_questions`
  below re: a stale "Status: PROPOSED" header still present in the ADR-002

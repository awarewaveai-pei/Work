$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ai-lego://specs/security/key-vault-lifecycle.schema.yaml"
title: Key Vault Lifecycle
version: "1.0.0"
status: ACTIVE

description: >
  Canonical machine-readable definition of the independent Key Vault that
  holds every cryptographic key referenced by
  `personal-data-envelope.schema.yaml`'s `kek_ref`/`dek_key_id` fields:
  tenant-level Key-Encryption-Keys (KEK), per-subject Data Encryption Keys
  (DEK), and — per ADR-007 — tenant-level HMAC signing keys used for
  deterministic log tokenization. Resolves ADR-002's crypto-shredding
  Recommendation (Option A): GDPR/CCPA/LGPD "right to erasure" is fulfilled
  by destroying a subject's DEK record, which makes that subject's
  Confidential/Restricted event-log content permanently unreadable without
  altering the (append-only, immutable) Event Ledger itself. Also encodes
  ADR-002's Codex-oracle-driven revision requiring disaster-recovery
  restores to replay destruction history before serving any decrypt
  request, and the operational-incident-vs-architecture-reversal Rollback
  split from the same revision round. ADR-007 Sub-decision (a) reuses this
  same Vault for a new key-use type (`HMAC_SIGNING_KEY`) rather than
  standing up a second Key Vault — this schema is the single Vault both
  ADRs consume.

  This file is the single source of truth for Key Vault key-record shape,
  Key Destruction Record shape, and the restore-time replay gate; MP §148
  and EC §32 point at "an independent Key Vault" without specifying its
  internal record shapes — those shapes live here, not in the mother
  documents.

compilation_decisions:
  - question: >
      ADR-007's Recommendation point 2 and its Consequences/Migration
      sections name the new key-use type in prose as lowercase
      `hmac_signing_key`, "與既有 DEK/KEK 並列" (listed side by side with
      DEK/KEK) — but DEK and KEK are rendered as uppercase abbreviations
      throughout both ADRs' prose (e.g. ADR-002 Recommendation; ADR-007
      Context adjacency table row 2; ADR-007 Consequences).
    decision: >
      `key_use` enum uses SNAKE_CASE uppercase for all three values: KEK,
      DEK, HMAC_SIGNING_KEY.
    reasoning: >
      Same mechanical-casing-normalization technique already established by
      `governance/epistemic-label.schema.yaml` (space-form "LOCKED FACT" ->
      `LOCKED_FACT`, documented there as "zero semantic change"). Picking
      one casing convention for an enum that mixes an ADR's literal
      lowercase identifier with two pre-existing uppercase abbreviations is
      a naming-consistency pick, not a new architecture decision.
      ADR-007's exact lowercase prose string is preserved verbatim below in
      `migration_crosswalk` for traceability.
  - question: >
      ADR-002's Codex-oracle revision ("修正 2", Recommendation section)
      mandates that a Key Vault restored from backup must replay all Key
      Destruction Records dated after the backup snapshot, and re-destroy
      those DEKs, before the restored Vault may serve any decrypt request —
      but states this only as a prose obligation, with no machine-checkable
      predicate for "may this Vault serve decrypt requests now".
    decision: >
      Model Vault serviceability as an explicit gated boolean
      (`vault_restore_event.decrypt_serviceable`) that MUST default to
      `false` on any `RESTORED_FROM_BACKUP` transition, and MAY only
      transition to `true` once `replay_gate.status == COMPLETE` AND
      `replay_gate.re_destruction_confirmed == true`. See
      `vault_restore_event` and its `constraints` below.
    reasoning: >
      A requirement stated only in prose is not enforceable by tooling.
      Encoding it as a gated boolean with explicit preconditions is the
      minimal schema change that makes ADR-002's restore-time obligation
      machine-checkable, following this repo's established pattern of
      turning ADR prose obligations into structurally-enforced fields
      rather than leaving them as comments (see risk-tier.schema.yaml's
      `required_actions[]`, manifest.schema.yaml's `required_document_ids`).
  - question: >
      ADR-002's Codex-oracle revision also identifies (PLAUSIBLE finding)
      that destroying only the *live* copy of a subject's DEK record is
      insufficient: if the Key Vault's own disaster-recovery backup still
      holds the pre-destruction key material and that backup is later
      restored, the subject's data becomes decryptable again — a "false
      deletion resurrected" failure mode. ADR-002's own revised invariant
      (Recommendation, "不變量修正") states destruction "必須涵蓋該金鑰的
      所有物理副本（live + 備援/災復快照）" (must cover all physical
      copies of the key — live plus backup/DR snapshots) but does not
      define a field shape for tracking those copies.
    decision: >
      Every `key_record` carries a `physical_copies[]` array (one entry per
      known physical location holding a copy of the key material — live
      Vault plus every backup/DR snapshot). Every `key_destruction_record`
      carries a `destruction_scope[]` array that MUST contain one destroyed
      entry per `physical_copies[]` entry that existed on the key at
      destruction time — a destruction record with an incomplete
      `destruction_scope` (fewer entries than known physical copies) is not
      a valid, complete destruction under this schema.
    reasoning: >
      Directly encodes the corrected invariant from ADR-002's Codex-oracle
      revision as a structural completeness check rather than leaving
      "all copies" as an unenforced prose promise — same reasoning style as
      the restore-gate decision above.

source_of_truth_for:
  - "docs/adr/ADR-002-personal-data-erasure-vs-event-immutability.md:59-67 (Option A: per-subject DEK, tenant KEK, envelope encryption, EC §31 mapping)"
  - "docs/adr/ADR-002-personal-data-erasure-vs-event-immutability.md:65 (Verification = attempt decrypt on all known references, confirm all fail)"
  - "docs/adr/ADR-002-personal-data-erasure-vs-event-immutability.md:103-117 (Codex Oracle 對抗式覆審 — 修正 1 Rollback split, 修正 2 Key Destruction Record Replay on Restore)"
  - "docs/adr/ADR-002-personal-data-erasure-vs-event-immutability.md:121-131 (Consequences — Key Vault higher-redundancy requirement; backup-copy destruction-sync gap)"
  - "docs/adr/ADR-002-personal-data-erasure-vs-event-immutability.md:137-140 (Migration/Rollback — operational-incident vs architecture-reversal split, GDPR Art. 12(3) reference)"
  - "docs/adr/ADR-007-pii-redaction-vs-pseudonymization-timing.md Recommendation point 2 (hmac_signing_key, listed alongside DEK/KEK, explicitly not a second Key Vault)"
  - "docs/adr/ADR-007-pii-redaction-vs-pseudonymization-timing.md Consequences (HMAC key rotation breaks cross-rotation-boundary correlatability of historical log tokens — documented tradeoff, not hidden)"
  - "docs/adr/ADR-007-pii-redaction-vs-pseudonymization-timing.md:153 (規格缺口 1: key-vault-lifecycle.schema.yaml 新增 hmac_signing_key 金鑰用途類型與其獨立輪替政策欄位)"
  - "docs/architecture/MACHINE_READABLE_SPEC_PLAN.md:147 (security/key-vault-lifecycle.schema.yaml, Wave 2, READY)"

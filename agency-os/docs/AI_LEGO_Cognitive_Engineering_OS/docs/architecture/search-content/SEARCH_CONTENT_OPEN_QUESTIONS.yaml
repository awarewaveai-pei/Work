    blocks: "nothing (OQ-cc-1 itself says `blocks: nothing`)"
    restart_condition: "the platform ADR that resolves OQ-cc-1"
    referenced_by: ["ADR-021 §D4", "SEARCH_CONTENT_METHOD_AND_CAPABILITY_REGISTRY.md §2"]

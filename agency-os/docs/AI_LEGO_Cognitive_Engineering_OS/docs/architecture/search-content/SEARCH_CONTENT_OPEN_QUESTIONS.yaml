  - id: OQ-SC-19
    kind: DEFERRED
    title: "Promotion of SearchContent registry records into methods/registry/method-inventory.yaml"
    question: >
      SEARCH_CONTENT_REGISTRY_RECORDS.yaml is a PROPOSED staging record set inside the vertical
      folder. The MVP acceptance criterion #2 ("all Method/Capability refs resolve canonical
      registries") is satisfied only once each record is promoted into the ACTIVE global registry
      (method-inventory.yaml `phase_3_additions` style entries + contract-backlog.yaml tiers),
      which touches ACTIVE platform files and their golden-test invariants.
    owner: "search-content.vertical (writer) + platform registry owner (reviewer)"
    blocks: "SEARCH_CONTENT_MVP_VERTICAL_SLICE.md acceptance #2"
    interim_rule: "no SearchContent id may appear in a Workflow IR until promoted; the staging file is the only place new ids may be added meanwhile"
    restart_condition: "first Method/Capability contract file is written for a SearchContent id (promotion happens per-id together with its contract)"
    referenced_by: ["SEARCH_CONTENT_METHOD_AND_CAPABILITY_REGISTRY.md §8", "SEARCH_CONTENT_MVP_VERTICAL_SLICE.md §3"]

$id: "ai-lego://docs/architecture/search-content/SEARCH_CONTENT_OPEN_QUESTIONS.yaml"
title: SearchContent Open Questions / Deferred Items / Dependencies Register
version: "1.1.0"
status: ACTIVE   # the register itself is live; every item carries its own kind/status

description: >
  Single register for everything the SearchContent architecture pack deliberately
  does NOT decide yet. 2026-09-02 verification (agency-os/reports/audit/
  2026-09-02-search-content-pack-verification.md, finding M3) found the pack had
  zero OPEN_QUESTION / DEFERRED markers while carrying ~90 registry IDs without
  owners and 51 gates without thresholds: unmarked gaps are more dangerous than
  marked ones because a reader cannot tell "deliberately postponed" from
  "forgotten". Every OPEN_QUESTION / DEFERRED / DEPENDENCY marker in the 11 spec
  documents MUST cite an OQ-SC-* id from this file, and every item here MUST be
  referenced at least once (tests/architecture/search_content_pack_check.py,
  rule 5). Mirrors the platform convention of per-schema `open_questions`
  blocks (e.g. specs/domain/capability-contract.schema.yaml OQ-cc-1) but kept
  in one place for the vertical because its items cross document boundaries.

source_of_truth_for:
  - "SEARCH_CONTENT_PACK_COMMON.md §3 (marker rule) and §5 rule 5 (validator invariant)"
  - "every `OPEN_QUESTION` / `DEFERRED` / `DEPENDENCY` marker in docs/architecture/search-content/*.md"
decided_by: "docs/adr/ADR-021-search-content-boundary-and-ownership.md §D10 (mechanical acceptance gate); item content grounded per-entry in `evidence`"

kinds:
  OPEN_QUESTION: "a design question with no answer yet; an interim_rule MUST be given so implementers fail closed"
  DEFERRED: "the answer is known to be needed and its shape is known; deliberately postponed to a named restart_condition"
  DEPENDENCY: "blocked on a Core / platform contract or an operator decision outside this vertical's authority"

items:
  - id: OQ-SC-1
    kind: OPEN_QUESTION
    title: "`baseline_refs` has no Baseline object contract"
    question: >
      ContentPerformance.baseline_refs and ContentBrief.measurement_plan.baseline_refs are
      referenced by three documents but no document defines what a Baseline is, who produces
      it, or where it is stored.
    owner: "search-content.measurement"
    blocks: "machine contract for content_performance / content_brief.measurement_plan"
    interim_rule: "consumers MUST treat baseline_refs as unresolvable; no gate or method may depend on it"
    restart_condition: "a Baseline object is proposed in CONTENT_MEASUREMENT_SPEC.md with producer + storage role"
    referenced_by: ["SEARCH_CONTENT_DOMAIN_MODEL.md §2.14", "CONTENT_BRIEF_CONTRACT.md §2", "CONTENT_MEASUREMENT_SPEC.md §11"]
    evidence: ["EV-AUDIT-0902 B2 / M13"]

  - id: OQ-SC-2
    kind: DEFERRED
    title: "Attribution model calibration / evaluation dataset policy"
    question: >
      The attribution_model contract (CONTENT_MEASUREMENT_SPEC.md §8) fixes identity, type and
      window. For `type: DATA_DRIVEN` and `EXPERIMENTAL` models the calibration dataset,
      evaluation procedure and rollback version policy are not yet specified.
    owner: "search-content.measurement"
    blocks: "nothing in the MVP (MVP uses RULE_BASED models only)"
    restart_condition: "first data-driven or experimental attribution adapter is contracted"
    referenced_by: ["CONTENT_MEASUREMENT_SPEC.md §8"]
    evidence: ["EV-AUDIT-0902 M13", "EV-V3-MEASURE (§32.5 L3810-3828)"]

  - id: OQ-SC-3
    kind: DEFERRED
    title: "Engagement layer metric definitions"
    question: >
      master §32.1 Layer C (Engagement) and §43 list engagement metrics (avg engagement time,
      task completion) but no MetricDefinition instances exist for them in the pack.
    owner: "search-content.measurement"
    blocks: "nothing in the MVP (MVP scope = search performance fixture + AI visibility fixture)"
    restart_condition: "first analytics provider adapter (measurement.collect_analytics) is contracted"
    referenced_by: ["CONTENT_MEASUREMENT_SPEC.md §2", "CONTENT_MEASUREMENT_SPEC.md §6"]
    evidence: ["EV-AUDIT-0902 M13", "EV-V3-MEASURE (L3688, L4533-4536)"]

  - id: OQ-SC-4
    kind: DEFERRED
    title: "Retention periods per data class"
    question: >
      Raw provider payloads, normalized observations and aggregated metrics need retention
      periods (SEARCH_INTELLIGENCE_SPEC.md §11). Retention is a legal/product decision
      (jurisdiction-dependent) outside this vertical's authority to fix unilaterally.
    owner: "operator (legal/product); policy file policies/search-content/retention.policy.yaml"
    blocks: "SEARCH_CONTENT_MVP_VERTICAL_SLICE.md §11 production promotion gate (not the staging MVP)"
    interim_rule: "no deletion of raw payloads in the MVP; CAS hash + audit metadata retained per Core redaction mechanism"
    restart_condition: "before first production ingestion of third-party payloads"
    referenced_by: ["SEARCH_INTELLIGENCE_SPEC.md §11", "SEARCH_CONTENT_MVP_VERTICAL_SLICE.md §11"]
    evidence: ["EV-AUDIT-0902 task 11"]

  - id: OQ-SC-5
    kind: OPEN_QUESTION
    title: "Definition of `approved semantic equivalence` for publication verification"
    question: >
      PUBLISHING_ADAPTER_CONTRACT.md §10 allows verification by "content hash OR approved
      semantic equivalence"; the latter has no definition (which normalizations are allowed,
      who approves the equivalence class, how it is recorded).
    owner: "search-content.publishing"
    blocks: "nothing — interim rule is fail-closed"
    interim_rule: "verification MUST use exact SHA-256 content_hash match over the adapter's declared canonicalization; any mismatch = VERIFY_FAILED"
    restart_condition: "a provider whose rendering pipeline provably alters approved content (e.g. CMS auto-typography) is onboarded and needs a bounded equivalence policy"
    referenced_by: ["PUBLISHING_ADAPTER_CONTRACT.md §10"]
    evidence: ["EV-AUDIT-0902 task 11"]

  - id: OQ-SC-6
    kind: DEFERRED
    title: "Per-gate thresholds and automated validators"
    question: >
      Every gate record in SEARCH_CONTENT_GATE_RECORDS.yaml carries display_name / owner /
      severity / applies_to_artifact_types / remediation, but `automated_validator_ref` is null
      and numeric thresholds are not fixed. Thresholds without a validator implementation and a
      calibration fixture would be invented numbers (the pack's zero-invented-numbers rule).
    owner: "search-content.quality (per gate family sub-owner in each record)"
    blocks: "Stage 1 gate implementation; NOT the ADR or the MVP design"
    restart_condition: "per gate: when its validator is implemented and its 5 fixtures (Quality Gates §12) exist"
    referenced_by: ["SEARCH_CONTENT_QUALITY_GATES.md §3", "SEARCH_CONTENT_GATE_RECORDS.yaml"]
    evidence: ["EV-AUDIT-0902 M7"]

  - id: OQ-SC-7
    kind: OPEN_QUESTION
    title: "`content.refresh_analysis` vs master `content.refresh_prioritization`"
    question: >
      master §53 proposes content.refresh_prioritization; the Registry canonicalizes
      content.refresh_analysis. No other document references either, so it cannot be
      determined whether these are one renamed method or two pipeline stages.
    owner: "search-content.content-strategy"
    blocks: "nothing — neither is used by the MVP"
    interim_rule: "both IDs are registered (refresh_analysis PROPOSED, refresh_prioritization PROPOSED with distinct_from note); no contract may be written for either until resolved"
    restart_condition: "first real refresh use case that needs one of them"
    referenced_by: ["SEARCH_CONTENT_METHOD_AND_CAPABILITY_REGISTRY.md §3"]
    evidence: ["EV-AUDIT-0902 B6", "EV-V3-METHODS (L4946-4993)"]

  - id: OQ-SC-8
    kind: OPEN_QUESTION
    title: "`search.cluster_queries` (rejected capability) → `content.topic_clustering` pairing is an inference"
    question: >
      Registry §6 maps the rejected capability search.cluster_queries to Method
      content.topic_clustering by semantic proximity; if query clustering needs a different
      algorithm/input schema than content topic clustering, a separate Method
      (search.query_clustering, already registered) is the right target instead.
    owner: "search-content.search-intelligence"
    blocks: "nothing"
    interim_rule: "search.query_clustering is the registered Method for query-level clustering; content.topic_clustering for content/topic-level; implementers pick by input object type"
    restart_condition: "first implementation of either Method"
    referenced_by: ["SEARCH_CONTENT_METHOD_AND_CAPABILITY_REGISTRY.md §6"]
    evidence: ["EV-AUDIT-0902 task 7"]


      knowledge.retrieve_evidence / knowledge.resolve_entity / knowledge.retrieve_brand_fact are
      needed by the vertical but belong to the Core knowledge namespace; Core has not confirmed
      or contracted them.
    owner: "Core (knowledge engine); requested_by search-content"
    blocks: "SEARCH_CONTENT_MVP_VERTICAL_SLICE.md acceptance #2 for any recipe node that calls them"
    interim_rule: "MVP recipes MUST use Repository ports directly (SEARCH_EVIDENCE_RETRIEVAL_SPEC.md §1 path A) and MUST NOT reference these IDs until Core confirms"
    restart_condition: "Core owner confirms and contracts each capability"
    referenced_by: ["SEARCH_CONTENT_METHOD_AND_CAPABILITY_REGISTRY.md §5"]
    evidence: ["EV-AUDIT-0902 B6", "EV-V3-METHODS (§52 L4163-4165 knowledge.* proposals)"]


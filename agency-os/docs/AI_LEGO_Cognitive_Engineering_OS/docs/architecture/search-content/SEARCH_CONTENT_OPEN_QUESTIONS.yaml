    restart_condition: "per Method: literature or experiment Evidence refs attached to its registry record (→ LITERATURE_SUPPORTED / EMPIRICALLY_VALIDATED)"
    referenced_by: ["SEARCH_CONTENT_METHOD_AND_CAPABILITY_REGISTRY.md §3", "SEARCH_CONTENT_PACK_COMMON.md §4.3", "SEARCH_CONTENT_REGISTRY_RECORDS.yaml"]

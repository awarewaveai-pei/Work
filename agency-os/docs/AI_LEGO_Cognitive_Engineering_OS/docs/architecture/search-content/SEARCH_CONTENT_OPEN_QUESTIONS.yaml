    owner: "operator (ADR-006 proposal flow)"
    blocks: "formal scheduling only; SC-Phase 0 (this pack) and design work are not blocked"
    interim_rule: "SearchContent MVP is positioned as the first post-Phase-5 vertical slice (ADR-021 §D9); it MUST NOT start implementation before the Phase 5 exit gate"
    restart_condition: "Phase 5 exit gate passes"
    referenced_by: ["ADR-021 §D9", "SEARCH_CONTENT_MVP_VERTICAL_SLICE.md §3"]

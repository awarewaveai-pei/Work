  - id: OQ-SC-20
    kind: DEFERRED
    title: "Provider position/visibility semantics mapping per adapter"
    question: >
      CONTENT_MEASUREMENT_SPEC.md §6 requires each provider's `position` semantics to be declared
      in the adapter mapping and forbids merging positions across providers; the mapping records
      themselves are per-adapter deliverables.
    owner: "search-content.measurement (per adapter)"
    blocks: "nothing in the MVP (deterministic fixtures declare their own semantics)"
    restart_condition: "each real provider adapter contract"
    referenced_by: ["CONTENT_MEASUREMENT_SPEC.md §6", "SEARCH_INTELLIGENCE_SPEC.md §5"]
    evidence: ["EV-V3-MEASURE (§32.4 L3791-3809)"]

  - id: OQ-SC-21
    kind: DEFERRED
    title: "EV-* evidence citations are checked upper-bound-only, not content-anchored"
    question: >
      tests/architecture/search_content_pack_check.py rule6 confirms every EV-* citation's target
      file exists and that its cited end line does not exceed the file's actual length (plus a weak
      check that the start line is not blank). It cannot detect a citation whose line range still
      falls within the file's current bounds but has drifted to point at the wrong content (e.g.
      lines were inserted earlier in the file and the citation table was never updated). A real fix
      needs a content anchor per citation (a short verbatim excerpt from the cited range, checked
      against current file content) rather than a line-number range alone; adding 39+ accurate
      anchors was judged disproportionate to do in the same pass that just fixed the validator's
      more serious self-consistency bugs (2026-09-03 critic round).
    owner: "search-content.vertical (pack maintenance)"
    blocks: "nothing — the existing checks (file exists, end line in bounds, start line non-blank)
      still catch the most common drift shapes; this only leaves a narrower gap"
    interim_rule: "treat rule6 PASS as 'citations are not obviously broken', not as 'citations are
      verified accurate' -- a human spot-check remains the actual accuracy check for now"
    restart_condition: "next time an EV-* citation is discovered to have silently drifted despite
      rule6 passing, add a content-anchor field to that citation's row and extend rule6 to check it"
    referenced_by: ["SEARCH_CONTENT_PACK_COMMON.md §3", "tests/architecture/search_content_pack_check.py rule6_evidence_table"]
    evidence: ["critic review of search_content_pack_check.py, 2026-09-03, finding 5"]

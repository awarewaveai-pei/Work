name: oracle-web — deploy gate

# The same three steps sg-deploy.sh step 1.75 runs before building oracle-web (npm ci, tsc, vitest).
# check-ci-green.sh maps the app to this file; a deploy starts only from a commit this is green for.

on:
  push:
    branches:
      - main
    paths:
      - 'Projects/internal/ziwei-doushu/**'
      - '.github/workflows/oracle-web-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Projects/internal/ziwei-doushu/**'
      - '.github/workflows/oracle-web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Projects/internal/ziwei-doushu
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Projects/internal/ziwei-doushu/package-lock.json
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm test

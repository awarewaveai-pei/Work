name: Tenant staging SSOT

on:
  pull_request:
    branches:
      - main
    paths:
      - "agency-os/tenants/**"
      - "scripts/verify-tenant-staging-sites-index-ssot.ps1"
      - "scripts/lib/repo-roots.ps1"
      - "scripts/system-health-check.ps1"
  workflow_dispatch:

jobs:
  sites-index-vs-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Confirm PowerShell Core
        run: command -v pwsh && pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Verify staging URLs vs ENVIRONMENT_REGISTRY (SITES_INDEX + SITE_PROFILE)
        shell: pwsh
        run: ./scripts/verify-tenant-staging-sites-index-ssot.ps1 -WorkspaceRoot "${{ github.workspace }}/agency-os"

# Weekly security audit for lobster-factory/packages/workflows dependencies.
#
# Why this exists as a GitHub Actions scheduled job (not a local Windows scheduled task):
# new CVEs are disclosed against UNCHANGED dependencies over time, so a time-based scan is
# the correct model — push/PR CI cannot catch a vuln in code that didn't change. The previous
# delivery (machine-local `AgencyOS-WeeklyAutomation` scheduled task on one desktop) silently
# stopped producing reports for 19 days because the desktop was not running at the scheduled
# minute and nothing surfaced the gap. GHA removes the machine dependency: the cron + steps are
# git-tracked, run on GitHub infra, and surface findings natively (Actions tab + email + issue).
# Retirement context: agency-os/reports/weekly/README.md
name: Weekly workflows security audit

on:
  schedule:
    # Monday 01:30 UTC = 09:30 Asia/Taipei (TPE)
    - cron: "30 1 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-workflows-security-audit
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      # Report generation is deterministic and always exits 0 (writes the markdown report).
      # No `npm install` needed: the audit script imports only node builtins, and `npm audit`
      # reads package-lock.json (no node_modules required).
      # The LATEST report files are committed to git, so `checkout` puts last week's copies
      # on disk before anything runs. Delete them first: a file that is not there cannot be
      # mistaken for this run's output if generation later fails.
      - name: Remove stale report files from checkout
        run: rm -f agency-os/reports/security/workflows-npm-audit-LATEST.md agency-os/reports/security/workflows-npm-audit-LATEST.json

      - name: Generate workflows security report
        id: report
        run: npm run audit:workflows-security
        working-directory: lobster-factory

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: workflows-npm-audit
          path: |
            agency-os/reports/security/workflows-npm-audit-LATEST.md
            agency-os/reports/security/workflows-npm-audit-LATEST.json
          if-no-files-found: warn

      # Gate: read the verdict the audit script already computed. Policy lives in ONE place
      # (lobster-factory/scripts/audit-workflows-security.mjs + packages/workflows/
      # security-acknowledgements.json); this step only enforces it.
      #
      # It used to be a bare `npm audit --audit-level=high` over dev AND prod dependencies.
      # That conflated two different questions - "is anything vulnerable" and "does it reach
      # production" - and on 2026-08-25 it had been red for ten weeks on a finding with zero
      # production reach and no upstream remediation available. A gate that cannot go green
      # is a gate nobody reads; the same week, a different permanently-red workflow is exactly
      # how the fifth ClickHouse incident got its window.
      #
      #   verdict=shipped    a shipped dependency has a high/critical vuln. Unconditional
      #                      failure - no acknowledgement can excuse this one.
      #   verdict=toolchain  build/deploy-only finding that is unacknowledged, or whose dated
      #                      acceptance has expired, or the acknowledgement file is unreadable.
      #   verdict=pass       nothing outstanding.
      #
      # A missing or unreadable verdict file makes `node -e` throw, so the gate fails closed.
      - name: Severity gate (shipped = hard fail; toolchain = dated acknowledgements)
        id: gate
        continue-on-error: true
        run: |
          VERDICT=$(node -e "console.log(require('./agency-os/reports/security/workflows-npm-audit-LATEST.json').verdict)")
          echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"
          echo "Gate verdict: ${VERDICT}"
          [ "${VERDICT}" = "pass" ] || exit 1

      - name: Open or update tracking issue on high/critical findings
        if: steps.gate.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          GATE_VERDICT: ${{ steps.gate.outputs.verdict }}
        with:
          script: |
            const fs = require('fs');
            const label = 'weekly-security-audit';
            const reportPath = 'agency-os/reports/security/workflows-npm-audit-LATEST.md';
            let report = '_(report file not found)_';
            try { report = fs.readFileSync(reportPath, 'utf8'); } catch (e) {}
            // GitHub issue body cap is ~65k chars; trim defensively.
            if (report.length > 50000) report = report.slice(0, 50000) + '\n\n_…truncated…_';

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const title = `[weekly-security-audit] high/critical vuln in packages/workflows (${today})`;
            const body = [
              `Weekly dependency audit found **high or critical** vulnerabilities in \`lobster-factory/packages/workflows\`.`,
              ``,
              `- Run: ${runUrl}`,
              `- Gate verdict: \`${process.env.GATE_VERDICT || 'unknown'}\` (\`shipped\` = reaches production, unconditional; \`toolchain\` = build/deploy only, unacknowledged or expired acceptance)`,
              ``,
              `## Report`,
              ``,
              // Fenced as literal text: dependency names / advisory titles are
              // untrusted strings — prevents them rendering as markdown in the issue.
              '```text',
              report,
              '```',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });

            if (existing.data.length > 0) {
              const num = existing.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: num, body,
              });
              core.notice(`Updated existing issue #${num}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label, 'needs-human-review'],
              });
              core.notice(`Opened issue #${created.data.number}`);
            }

      - name: Notify Slack and Telegram — audit summary
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          VERDICT="${{ steps.gate.outputs.verdict }}"
          REPORT_OUTCOME="${{ steps.report.outcome }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # FAIL CLOSED. This step is `if: always()`, so it also runs when the scan itself
          # broke - and the LATEST report files are COMMITTED to git, so a checkout always has
          # a stale one on disk. Before this guard, a failed `Generate` step meant: gate
          # skipped -> VERDICT empty -> counts grepped from LAST WEEK'S committed report ->
          # every branch missed -> the final `else` fired and Slack/Telegram announced
          # "所有套件安全，本週沒有發現任何漏洞". A broken scanner sending an all-clear built
          # from stale data is the 2026-08-03 client_mail shape, and it is the exact failure
          # this repo's governance calls out: 偵測器啞了不可以長得像一切正常.
          #
          # Three independent things must hold before any count is trusted:
          #   1. the report step actually succeeded
          #   2. the gate produced a verdict
          #   3. the verdict JSON parses AND carries THIS run's id and attempt
          #
          # (3) is run-bound, not time-bound, and that distinction is the whole point. A
          # freshness window cannot separate "this run wrote it" from "someone committed a
          # freshly generated copy shortly before this run started" - which is exactly what
          # happened on 2026-08-25: the JSON was committed at 20:30 UTC and the workflow
          # dispatched at 20:37. A 30-minute window would have accepted the committed file.
          # The run id makes it an identity check instead of a probability.
          VERDICT_JSON="agency-os/reports/security/workflows-npm-audit-LATEST.json"
          SCAN_OK="no"
          SCAN_DETAIL="report_outcome=${REPORT_OUTCOME} verdict=${VERDICT:-<empty>}"
          if [ "${REPORT_OUTCOME}" = "success" ] && [ -n "${VERDICT}" ]; then
            # Prints ONE clean reason on failure rather than letting node dump a stack: the
            # detail is truncated into the alert, and an alert that says "unknown" without
            # saying why costs the reader the one thing they needed from it.
            if FRESH=$(GH_RUN_ID="${{ github.run_id }}" GH_RUN_ATTEMPT="${{ github.run_attempt }}" node -e "
              const fs=require('fs');
              const bail=(m)=>{ console.log('ERR '+m); process.exit(1); };
              const wantId=process.env.GH_RUN_ID, wantAttempt=process.env.GH_RUN_ATTEMPT;
              let j; try { j=JSON.parse(fs.readFileSync('${VERDICT_JSON}','utf8')); }
              catch(e){ bail('unreadable-or-invalid-json'); }
              if(!wantId) bail('no-run-id-in-env');
              if(String(j.runId)!==String(wantId)) bail('run-mismatch got='+j.runId+' want='+wantId);
              if(String(j.runAttempt)!==String(wantAttempt)) bail('attempt-mismatch got='+j.runAttempt+' want='+wantAttempt);
              const c=j.counts||{};
              console.log([j.verdict,c.total??0,c.critical??0,c.high??0,c.moderate??0,(j.accepted||[]).length].join('|'));
            " 2>&1); then
              SCAN_OK="yes"
              TOTAL=$(echo "$FRESH" | cut -d'|' -f2)
              CRITICAL=$(echo "$FRESH" | cut -d'|' -f3)
              HIGH=$(echo "$FRESH" | cut -d'|' -f4)
              MODERATE=$(echo "$FRESH" | cut -d'|' -f5)
              ACCEPTED=$(echo "$FRESH" | cut -d'|' -f6)
            else
              # Collapse to ONE short, quote-free line. The messages below are interpolated
              # into a JSON curl payload, so a raw multi-line node stack trace would break
              # that JSON and the alert would never send - silently killing the alarm in
              # precisely the scenario the alarm exists for.
              SAFE=$(printf '%s' "${FRESH}" | tr '\n\r"\' '    ' | cut -c1-160)
              SCAN_DETAIL="${SCAN_DETAIL} verdict_json_error=${SAFE}"
            fi
          fi

          TECH="verdict=${VERDICT:-unknown} total=${TOTAL:-?} critical=${CRITICAL:-?} high=${HIGH:-?} moderate=${MODERATE:-?}"

          # Alarm level follows EXPOSURE, not the raw count. Crying wolf every week about a
          # build-toolchain finding with no production reach is precisely how a channel stops
          # being read - and an unread alarm is the same as no alarm. But "no alarm" must
          # never be produced by a scan that did not happen, which is why SCAN_OK comes first.
          if [ "${SCAN_OK}" != "yes" ]; then
            SLACK_MSG=":rotating_light: *每週套件安全掃描 — 掃描沒有跑完，安全狀態未知*\n這不是「沒問題」，是「這週沒量到」。請開啟 Actions 看失敗原因後重跑\n（技術資訊：${SCAN_DETAIL}）\n<${RUN_URL}|查看執行紀錄>"
            TG_MSG="🚨 每週套件安全掃描 — 掃描沒有跑完，安全狀態未知\n這不是「沒問題」，是「這週沒量到」。請看 Actions 失敗原因後重跑\n（技術資訊：${SCAN_DETAIL}）\n${RUN_URL}"
          elif [ "${VERDICT}" = "shipped" ]; then
            SLACK_MSG=":rotating_light: *每週套件安全掃描 — 發現高危漏洞，需要立即處理*\n套件中有嚴重安全問題，請盡快查看並修復\n（技術資訊：${TECH}）\n已自動建立 GitHub Issue 追蹤\n<${RUN_URL}|查看報告>"
            TG_MSG="🚨 每週套件安全掃描 — 發現高危漏洞，需要立即處理\n套件中有嚴重安全問題，請盡快查看並修復\n（技術資訊：${TECH}）\n已自動建立 GitHub Issue 追蹤\n${RUN_URL}"
          elif [ "${VERDICT}" = "toolchain" ]; then
            SLACK_MSG=":warning: *每週套件安全掃描 — 建置工具鏈有未處理的漏洞*\n這個漏洞不會進到正式環境（production 曝險為 0），但它沒有登記風險接受、或接受期限已過，需要有人看一次\n（技術資訊：${TECH}）\n<${RUN_URL}|查看報告>"
            TG_MSG="⚠️ 每週套件安全掃描 — 建置工具鏈有未處理的漏洞\n不會進到正式環境（production 曝險為 0），但沒有登記風險接受或已過期，需要有人看一次\n（技術資訊：${TECH}）\n${RUN_URL}"
          elif [ "${MODERATE}" -gt 0 ]; then
            SLACK_MSG=":warning: *每週套件安全掃描 — 發現中度風險*\n有套件存在已知漏洞，建議近期修復，目前尚無緊急風險\n（技術資訊：${TECH}）\n<${RUN_URL}|查看報告>"
            TG_MSG="⚠️ 每週套件安全掃描 — 發現中度風險\n有套件存在已知漏洞，建議近期修復，目前尚無緊急風險\n（技術資訊：${TECH}）\n${RUN_URL}"
          elif [ "${ACCEPTED:-0}" -gt 0 ]; then
            # verdict=pass WITH acknowledged findings. Saying "沒有發現任何漏洞" here would be
            # false - the findings exist, they are just build-time-only and formally accepted
            # with an expiry date. A green alert that misstates what it measured is how a
            # channel loses its meaning.
            SLACK_MSG=":white_check_mark: *每週套件安全掃描 — 通過（無待辦）*\n正式環境曝險為 0。工具鏈另有 ${ACCEPTED} 項已登記、有到期日的風險接受，期限到了會自動再擋\n（技術資訊：${TECH}）\n<${RUN_URL}|查看報告>"
            TG_MSG="✅ 每週套件安全掃描 — 通過（無待辦）\n正式環境曝險為 0。工具鏈另有 ${ACCEPTED} 項已登記、有到期日的風險接受，期限到了會自動再擋\n（技術資訊：${TECH}）\n${RUN_URL}"
          else
            SLACK_MSG=":white_check_mark: *每週套件安全掃描 — 通過*\n所有套件安全，本週沒有發現任何漏洞\n（技術資訊：${TECH}）"
            TG_MSG="✅ 每週套件安全掃描 — 通過\n所有套件安全，本週沒有發現任何漏洞\n（技術資訊：${TECH}）"
          fi
          # Slack
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"${SLACK_MSG}\"}"
          # Telegram
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"${TG_MSG}\"}"

      - name: Fail job if the gate did not pass
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::error::Security gate verdict '${{ steps.gate.outputs.verdict }}' — see the opened issue and the report artifact."
          exit 1

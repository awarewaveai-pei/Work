name: Auto-Repair - Claude Code

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: auto-repair-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude-repair:
    if: >
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'auto-repair') &&
      (
        github.event_name == 'issues' ||
        contains(github.event.comment.body, '@claude')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Claude repair
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: "--model claude-haiku-4-5-20251001 --max-turns 10 --allowedTools Edit,Read,Grep,Glob,LS"

      - name: Validate Claude did not touch forbidden paths
        if: success() && steps.claude.outputs.branch_name != ''
        env:
          BRANCH_NAME: ${{ steps.claude.outputs.branch_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH" 2>/dev/null || true
          CHANGED=$(git diff --name-only "origin/$DEFAULT_BRANCH"..."$BRANCH_NAME" 2>/dev/null || git diff --name-only HEAD)
          FORBIDDEN=$(echo "$CHANGED" | grep -E '\.github/workflows/|nginx/|Dockerfile|docker-compose|/migrations/|\.env' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Auto-repair touched forbidden paths (AGENTS.md Auto-Repair 紅線):"
            echo "$FORBIDDEN"
            exit 1
          fi

      - name: Create repair PR
        if: success() && steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.claude.outputs.branch_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh pr view "$BRANCH_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "PR already exists for $BRANCH_NAME"
            exit 0
          fi

          BODY_FILE="$(mktemp)"
          {
            echo "Closes #${ISSUE_NUMBER}"
            echo
            echo "### 問題"
            echo "Auto-repair issue #${ISSUE_NUMBER} requested a bounded code-scoped fix: ${ISSUE_TITLE}"
            echo
            echo "### 原因"
            echo "The Repair Center automation accepted the issue as auto-repair eligible and Claude Code produced a dedicated branch."
            echo
            echo "### 修法"
            echo "This PR contains the Claude-generated branch changes. Review the Files changed tab for the exact patch."
            echo
            echo "### 風險"
            echo "Manual review and the Release Gate still apply. The workflow does not deploy production."
            echo
            echo "### 建議"
            echo "After merge, deploy manually with sg-deploy when the changed files affect production, then run the relevant smoke checks."
            echo
            echo "Workflow run: ${RUN_URL}"
          } > "$BODY_FILE"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "[auto-repair] ${ISSUE_TITLE}" \
            --body-file "$BODY_FILE"

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured; skipping Slack notification"
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            MSG="Claude auto-repair analysis completed"
          else
            MSG="Claude auto-repair analysis failed; manual review required"
          fi
          curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"${MSG}: ${ISSUE_TITLE} ${ISSUE_URL}\"}"

name: next-admin — TypeScript typecheck

# Runs tsc --noEmit on every push to main (and PR to main) that touches next-admin.
# Catches type errors at commit time — before sg-deploy.sh is run.
#
# Why not rely only on sg-deploy.sh tsc gate?
#   sg-deploy is operator-triggered; a type error can sit in main for days before
#   someone deploys. This CI surfaces it within ~90s of the push.
#
# Why not rely only on this CI?
#   CI is non-blocking (no branch protection enforced); sg-deploy.sh tsc gate is
#   the hard stop that prevents a broken build from reaching production.
#
# Together they form two independent layers of the same defence.

on:
  push:
    branches:
      - main
    paths:
      - 'lobster-factory/infra/hetzner-phase1-core/apps/next-admin/**'
      - '.github/workflows/next-admin-typecheck.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lobster-factory/infra/hetzner-phase1-core/apps/next-admin/**'
      - '.github/workflows/next-admin-typecheck.yml'
  workflow_dispatch:

concurrency:
  group: next-admin-typecheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lobster-factory/infra/hetzner-phase1-core/apps/next-admin

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: lobster-factory/infra/hetzner-phase1-core/apps/next-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck
